<script type="application/json" id="page-data">{"u":"advanced/metaoperators/reduction","n":545,"k":"topic","pv":"advanced/metaoperators","nx":"advanced/metaoperators/reduction/quiz","tr":["advanced","advanced/metaoperators"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Reduction metaoperators","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">You write a reduction meta-operator as a normal operator in square brackets.<\/span> <span class=\"sg\" data-s=\"1\">Examples are <code>[+]<\/code> and <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It takes a list of values.<\/span> <span class=\"sg\" data-s=\"3\">It puts the operator between every two values.<\/span> <span class=\"sg\" data-s=\"4\">So the whole list becomes one single value.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example, <code>[+]<\/code> adds up all the elements of a list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> is the same as writing all the operators yourself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Other infix operators can work like this too.<\/span> <span class=\"sg\" data-s=\"1\">With <code>[*]<\/code>, you get the product of the list.<\/span> <span class=\"sg\" data-s=\"2\">Use it with the range <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This is an easy way to find a factorial:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the range <code>1..$n<\/code> gives the numbers from 1 to 5.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>[*]<\/code> multiplies them: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This is <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It also works with strings.<\/span> <span class=\"sg\" data-s=\"1\">The <code>[~]<\/code> reduction joins a list of strings into one string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can even reduce comparison operators.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> tells you if each value is bigger than the value before it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Triangular reduction<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Put a backslash inside the brackets.<\/span> <span class=\"sg\" data-s=\"1\">Then you get a <em>triangular<\/em> reduction.<\/span> <span class=\"sg\" data-s=\"2\">It keeps the result of every step, not only the last result:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each element of the result is the sum of the first few numbers: <code>1<\/code>, then <code>1+2<\/code>, then <code>1+2+3<\/code>, and so on.<\/span> <span class=\"sg\" data-s=\"1\">The last element is the sum of the whole list.<\/span><\/p>"]]},"de":{"t":"Reduktions-Metaoperatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Einen Reduktions-Meta-Operator schreiben Sie als normalen Operator in eckigen Klammern.<\/span> <span class=\"sg\" data-s=\"1\">Beispiele sind <code>[+]<\/code> und <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er nimmt eine Liste von Werten.<\/span> <span class=\"sg\" data-s=\"3\">Er setzt den Operator zwischen je zwei Werte.<\/span> <span class=\"sg\" data-s=\"4\">So wird die ganze Liste zu einem einzigen Wert.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zum Beispiel addiert <code>[+]<\/code> alle Elemente einer Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> ist dasselbe, als ob Sie alle Operatoren selbst schreiben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Auch andere Infix-Operatoren können so arbeiten.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>[*]<\/code> bekommen Sie das Produkt der Liste.<\/span> <span class=\"sg\" data-s=\"2\">Verwenden Sie ihn mit dem Bereich <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Das ist ein einfacher Weg, eine Fakultät zu berechnen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier liefert der Bereich <code>1..$n<\/code> die Zahlen von 1 bis 5.<\/span> <span class=\"sg\" data-s=\"1\">Dann multipliziert <code>[*]<\/code> sie: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das ist <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das geht auch mit Zeichenketten.<\/span> <span class=\"sg\" data-s=\"1\">Die Reduktion <code>[~]<\/code> verbindet eine Liste von Zeichenketten zu einer Zeichenkette:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können sogar Vergleichsoperatoren reduzieren.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> sagt Ihnen, ob jeder Wert größer ist als der Wert davor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dreieckige Reduktion<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Setzen Sie einen Backslash in die Klammern.<\/span> <span class=\"sg\" data-s=\"1\">Dann bekommen Sie eine <em>dreieckige<\/em> Reduktion.<\/span> <span class=\"sg\" data-s=\"2\">Sie behält das Ergebnis von jedem Schritt, nicht nur das letzte Ergebnis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Element im Ergebnis ist die Summe der ersten paar Zahlen: <code>1<\/code>, dann <code>1+2<\/code>, dann <code>1+2+3<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"1\">Das letzte Element ist die Summe der ganzen Liste.<\/span><\/p>"]]},"nl":{"t":"Reductie-meta-operatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je schrijft een reductie-meta-operator als een gewone operator tussen vierkante haken.<\/span> <span class=\"sg\" data-s=\"1\">Voorbeelden zijn <code>[+]<\/code> en <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hij neemt een lijst waarden.<\/span> <span class=\"sg\" data-s=\"3\">Hij zet de operator tussen elk paar waarden.<\/span> <span class=\"sg\" data-s=\"4\">Zo wordt de hele lijst één enkele waarde.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bijvoorbeeld, <code>[+]<\/code> telt alle elementen van een lijst op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> is hetzelfde als alle operatoren zelf uitschrijven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Andere infix-operatoren kunnen ook zo werken.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>[*]<\/code> krijg je het product van de lijst.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik het met het bereik <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dat is een makkelijke manier om een faculteit te berekenen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier geeft het bereik <code>1..$n<\/code> de getallen van 1 tot en met 5.<\/span> <span class=\"sg\" data-s=\"1\">Dan vermenigvuldigt <code>[*]<\/code> ze: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat is <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het werkt ook met tekenreeksen.<\/span> <span class=\"sg\" data-s=\"1\">De <code>[~]<\/code>-reductie plakt een lijst tekenreeksen aan elkaar tot één tekenreeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt zelfs vergelijkingsoperatoren reduceren.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> zegt of elke waarde groter is dan de waarde ervoor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Driehoeksreductie<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zet een backslash binnen de haken.<\/span> <span class=\"sg\" data-s=\"1\">Dan krijg je een _driehoeks_reductie.<\/span> <span class=\"sg\" data-s=\"2\">Die bewaart het resultaat van elke stap, niet alleen het laatste resultaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk element van het resultaat is de som van de eerste paar getallen: <code>1<\/code>, dan <code>1+2<\/code>, dan <code>1+2+3<\/code>, enzovoort.<\/span> <span class=\"sg\" data-s=\"1\">Het laatste element is de som van de hele lijst.<\/span><\/p>"]]},"es":{"t":"Metaoperadores de reducción","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Escribes un meta-operador de reducción como un operador normal entre corchetes.<\/span> <span class=\"sg\" data-s=\"1\">Dos ejemplos son <code>[+]<\/code> y <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Toma una lista de valores.<\/span> <span class=\"sg\" data-s=\"3\">Pone el operador entre cada dos valores.<\/span> <span class=\"sg\" data-s=\"4\">Así, toda la lista se convierte en un solo valor.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo, <code>[+]<\/code> suma todos los elementos de una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> es lo mismo que escribir todos los operadores tú mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Otros operadores infijos también pueden funcionar así.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>[*]<\/code>, obtienes el producto de la lista.<\/span> <span class=\"sg\" data-s=\"2\">Úsalo con el rango <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Es una forma fácil de calcular un factorial:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, el rango <code>1..$n<\/code> da los números del 1 al 5.<\/span> <span class=\"sg\" data-s=\"1\">Después <code>[*]<\/code> los multiplica: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto es <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También funciona con cadenas.<\/span> <span class=\"sg\" data-s=\"1\">La reducción <code>[~]<\/code> une una lista de cadenas en una sola cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes reducir incluso los operadores de comparación.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> te dice si cada valor es mayor que el valor anterior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reducción triangular<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pon una barra invertida dentro de los corchetes.<\/span> <span class=\"sg\" data-s=\"1\">Entonces obtienes una reducción <em>triangular<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Guarda el resultado de cada paso, no solo el último resultado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada elemento del resultado es la suma de los primeros números: <code>1<\/code>, luego <code>1+2<\/code>, luego <code>1+2+3<\/code>, y así sucesivamente.<\/span> <span class=\"sg\" data-s=\"1\">El último elemento es la suma de toda la lista.<\/span><\/p>"]]},"it":{"t":"Meta-operatori di riduzione","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Scrivi un meta-operatore di riduzione come un operatore normale tra parentesi quadre.<\/span> <span class=\"sg\" data-s=\"1\">Due esempi sono <code>[+]<\/code> e <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Prende una lista di valori.<\/span> <span class=\"sg\" data-s=\"3\">Mette l'operatore tra ogni coppia di valori.<\/span> <span class=\"sg\" data-s=\"4\">Così tutta la lista diventa un solo valore.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio, <code>[+]<\/code> somma tutti gli elementi di una lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> è come scrivere tu tutti gli operatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anche altri operatori infissi possono funzionare così.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>[*]<\/code>, ottieni il prodotto della lista.<\/span> <span class=\"sg\" data-s=\"2\">Usalo con l'intervallo <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">È un modo facile per trovare un fattoriale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui l'intervallo <code>1..$n<\/code> dà i numeri da 1 a 5.<\/span> <span class=\"sg\" data-s=\"1\">Poi <code>[*]<\/code> li moltiplica: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo è <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funziona anche con le stringhe.<\/span> <span class=\"sg\" data-s=\"1\">La riduzione <code>[~]<\/code> unisce una lista di stringhe in una sola stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi ridurre anche gli operatori di confronto.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> ti dice se ogni valore è più grande del valore prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riduzione triangolare<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metti un backslash dentro le parentesi quadre.<\/span> <span class=\"sg\" data-s=\"1\">Allora ottieni una riduzione <em>triangolare<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tiene il risultato di ogni passo, non solo l'ultimo risultato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni elemento del risultato è la somma dei primi numeri: <code>1<\/code>, poi <code>1+2<\/code>, poi <code>1+2+3<\/code>, e così via.<\/span> <span class=\"sg\" data-s=\"1\">L'ultimo elemento è la somma di tutta la lista.<\/span><\/p>"]]},"lv":{"t":"Reducēšanas metaoperatori","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs rakstāt redukcijas metaoperatoru kā parastu operatoru kvadrātiekavās.<\/span> <span class=\"sg\" data-s=\"1\">Piemēri ir <code>[+]<\/code> un <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas paņem vērtību sarakstu.<\/span> <span class=\"sg\" data-s=\"3\">Tas ieliek operatoru starp katrām divām vērtībām.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc viss saraksts kļūst par vienu vērtību.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemēram, <code>[+]<\/code> saskaita visus saraksta elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> ir tas pats, kas pašiem uzrakstīt visus operatorus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Arī citi infiksa operatori var strādāt tāpat.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>[*]<\/code> jūs iegūstat saraksta reizinājumu.<\/span> <span class=\"sg\" data-s=\"2\">Lietojiet to ar diapazonu <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir vienkāršs veids, kā aprēķināt faktoriālu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit diapazons <code>1..$n<\/code> dod skaitļus no 1 līdz 5.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>[*]<\/code> tos sareizina: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas strādā arī ar virknēm.<\/span> <span class=\"sg\" data-s=\"1\">Redukcija <code>[~]<\/code> savieno virkņu sarakstu vienā virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat reducēt pat salīdzināšanas operatorus.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> pasaka, vai katra vērtība ir lielāka par vērtību pirms tās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Trīsstūra redukcija<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ielieciet iekavās atpakaļsvītru.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs iegūstat <em>trīsstūra<\/em> redukciju.<\/span> <span class=\"sg\" data-s=\"2\">Tā saglabā katra soļa rezultātu, ne tikai pēdējo rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs rezultāta elements ir dažu pirmo skaitļu summa: <code>1<\/code>, tad <code>1+2<\/code>, tad <code>1+2+3<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Pēdējais elements ir visa saraksta summa.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры свёртки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Метаоператор свёртки вы пишете как обычный оператор в квадратных скобках.<\/span> <span class=\"sg\" data-s=\"1\">Примеры — <code>[+]<\/code> и <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он берёт список значений.<\/span> <span class=\"sg\" data-s=\"3\">Он ставит оператор между каждыми двумя значениями.<\/span> <span class=\"sg\" data-s=\"4\">Так весь список становится одним значением.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, <code>[+]<\/code> складывает все элементы списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> — это то же самое, что написать все операторы самому:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Другие инфиксные операторы тоже могут так работать.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> вы получаете произведение списка.<\/span> <span class=\"sg\" data-s=\"2\">Используйте его с диапазоном <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это простой способ найти факториал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь диапазон <code>1..$n<\/code> даёт числа от 1 до 5.<\/span> <span class=\"sg\" data-s=\"1\">Потом <code>[*]<\/code> перемножает их: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это работает и со строками.<\/span> <span class=\"sg\" data-s=\"1\">Свёртка <code>[~]<\/code> соединяет список строк в одну строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно свернуть даже операторы сравнения.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> говорит, больше ли каждое значение, чем значение перед ним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Треугольная свёртка<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поставьте обратную косую черту внутри скобок.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы получите <em>треугольную<\/em> свёртку.<\/span> <span class=\"sg\" data-s=\"2\">Она сохраняет результат каждого шага, а не только последний результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый элемент результата — это сумма первых нескольких чисел: <code>1<\/code>, затем <code>1+2<\/code>, затем <code>1+2+3<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"1\">Последний элемент — это сумма всего списка.<\/span><\/p>"]]},"uk":{"t":"Метаоператори згортки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви пишете метаоператор згортки як звичайний оператор у квадратних дужках.<\/span> <span class=\"sg\" data-s=\"1\">Приклади — <code>[+]<\/code> і <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він бере список значень.<\/span> <span class=\"sg\" data-s=\"3\">Він ставить оператор між кожними двома значеннями.<\/span> <span class=\"sg\" data-s=\"4\">Тож увесь список стає одним значенням.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад, <code>[+]<\/code> додає всі елементи списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> — це те саме, що написати всі оператори самому:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Інші інфіксні оператори теж можуть так працювати.<\/span> <span class=\"sg\" data-s=\"1\">З <code>[*]<\/code> ви отримуєте добуток списку.<\/span> <span class=\"sg\" data-s=\"2\">Використайте його з діапазоном <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це простий спосіб знайти факторіал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут діапазон <code>1..$n<\/code> дає числа від 1 до 5.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>[*]<\/code> їх перемножує: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це працює і з рядками.<\/span> <span class=\"sg\" data-s=\"1\">Згортка <code>[~]<\/code> з'єднує список рядків в один рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна згортати навіть оператори порівняння.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> каже, чи кожне значення більше за значення перед ним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Трикутна згортка<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поставте всередині дужок зворотну косу риску.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви отримаєте <em>трикутну<\/em> згортку.<\/span> <span class=\"sg\" data-s=\"2\">Вона зберігає результат кожного кроку, а не лише останній результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен елемент результату — це сума кількох перших чисел: <code>1<\/code>, потім <code>1+2<\/code>, потім <code>1+2+3<\/code> і так далі.<\/span> <span class=\"sg\" data-s=\"1\">Останній елемент — це сума всього списку.<\/span><\/p>"]]},"bg":{"t":"Метаоператори за редукция","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Пишете метаоператора за редукция като обикновен оператор в квадратни скоби.<\/span> <span class=\"sg\" data-s=\"1\">Примери са <code>[+]<\/code> и <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той взима списък от стойности.<\/span> <span class=\"sg\" data-s=\"3\">Той поставя оператора между всеки две стойности.<\/span> <span class=\"sg\" data-s=\"4\">Така целият списък става една-единствена стойност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например <code>[+]<\/code> събира всички елементи на списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> е същото, като да напишете сами всички оператори:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И други инфиксни оператори могат да работят така.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> получавате произведението на списъка.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте го с диапазона <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това е лесен начин да намерите факториел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук диапазонът <code>1..$n<\/code> дава числата от 1 до 5.<\/span> <span class=\"sg\" data-s=\"1\">След това <code>[*]<\/code> ги умножава: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това работи и с низове.<\/span> <span class=\"sg\" data-s=\"1\">Редукцията <code>[~]<\/code> съединява списък от низове в един низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да редуцирате дори оператори за сравнение.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> ви казва дали всяка стойност е по-голяма от стойността преди нея:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Триъгълна редукция<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поставете обратна наклонена черта вътре в скобите.<\/span> <span class=\"sg\" data-s=\"1\">Тогава получавате <em>триъгълна<\/em> редукция.<\/span> <span class=\"sg\" data-s=\"2\">Тя пази резултата от всяка стъпка, а не само последния резултат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент от резултата е сумата на първите няколко числа: <code>1<\/code>, после <code>1+2<\/code>, после <code>1+2+3<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"1\">Последният елемент е сумата на целия списък.<\/span><\/p>"]]},"eo":{"t":"Reduktaj metaoperatoroj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi skribas reduktan meta-operatoron kiel normalan operatoron en kvadrataj krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemploj estas <code>[+]<\/code> kaj <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi prenas liston de valoroj.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi metas la operatoron inter ĉiun paron de valoroj.<\/span> <span class=\"sg\" data-s=\"4\">Do la tuta listo fariĝas unu sola valoro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemple, <code>[+]<\/code> sumigas ĉiujn elementojn de listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> estas same kiel skribi ĉiujn operatorojn mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ankaŭ aliaj infiksaj operatoroj povas funkcii tiel.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>[*]<\/code>, vi ricevas la produkton de la listo.<\/span> <span class=\"sg\" data-s=\"2\">Uzu ĝin kun la gamo <code>1..$n<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas facila maniero trovi faktorialon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la gamo <code>1..$n<\/code> donas la nombrojn de 1 ĝis 5.<\/span> <span class=\"sg\" data-s=\"1\">Poste <code>[*]<\/code> multobligas ilin: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĝi funkcias ankaŭ kun ĉenoj.<\/span> <span class=\"sg\" data-s=\"1\">La redukto <code>[~]<\/code> kunigas liston de ĉenoj en unu ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi eĉ povas redukti komparajn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> diras al vi, ĉu ĉiu valoro estas pli granda ol la valoro antaŭ ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Triangula redukto<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metu retrokliniĝon ene de la krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ricevas <em>triangulan<\/em> redukton.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi konservas la rezulton de ĉiu paŝo, ne nur la lastan rezulton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu elemento de la rezulto estas la sumo de la unuaj kelkaj nombroj: <code>1<\/code>, poste <code>1+2<\/code>, poste <code>1+2+3<\/code>, kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"1\">La lasta elemento estas la sumo de la tuta listo.<\/span><\/p>"]]},"la":{"t":"Reductionis meta-operatores","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Meta-operatorem reductionis scribis ut operatorem ordinarium in uncis quadratis.<\/span> <span class=\"sg\" data-s=\"1\">Exempla sunt <code>[+]<\/code> et <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Listam valorum accipit.<\/span> <span class=\"sg\" data-s=\"3\">Operatorem inter omnia paria valorum ponit.<\/span> <span class=\"sg\" data-s=\"4\">Ita tota lista unus valor fit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempli gratia, <code>[+]<\/code> omnia elementa listae addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>[+] @data<\/code> idem est ac omnes operatores manu scribere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Alii operatores infixi etiam sic operari possunt.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>[*]<\/code> productum listae accipis.<\/span> <span class=\"sg\" data-s=\"2\">Eum cum intervallo <code>1..$n<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"3\">Sic factorialem facile invenis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic intervallum <code>1..$n<\/code> numeros ab 1 ad 5 dat.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>[*]<\/code> eos multiplicat: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc est <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam cum filis operatur.<\/span> <span class=\"sg\" data-s=\"1\">Reductio <code>[~]<\/code> listam filorum in unum filum coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam operatores comparationis reducere potes.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> tibi dicit an quisque valor maior sit quam valor ante eum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reductio triangularis<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pone lineam obliquam inversam intra uncos.<\/span> <span class=\"sg\" data-s=\"1\">Tum reductionem <em>triangularem<\/em> accipis.<\/span> <span class=\"sg\" data-s=\"2\">Eventum cuiusque gradus servat, non tantum ultimum eventum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quodque elementum eventus est summa primorum numerorum: <code>1<\/code>, deinde <code>1+2<\/code>, deinde <code>1+2+3<\/code>, et ita porro.<\/span> <span class=\"sg\" data-s=\"1\">Ultimum elementum est summa totius listae.<\/span><\/p>"]]}}}</script>
