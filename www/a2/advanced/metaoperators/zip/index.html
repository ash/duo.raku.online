<script type="application/json" id="page-data">{"u":"advanced/metaoperators/zip","n":547,"k":"topic","pv":"advanced/metaoperators/reduction/quiz","nx":"advanced/metaoperators/more","tr":["advanced","advanced/metaoperators"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Zip metaoperators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The zip meta-operator <code>Z<\/code> takes two lists, or more.<\/span> <span class=\"sg\" data-s=\"1\">It puts their elements together by position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The result is a list of groups.<\/span> <span class=\"sg\" data-s=\"1\">The first group has the first element of each list.<\/span> <span class=\"sg\" data-s=\"2\">The second group has the second element of each list, and so on.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">There is a more clever way too.<\/span> <span class=\"sg\" data-s=\"1\">You can use <code>Z<\/code> with an operator.<\/span> <span class=\"sg\" data-s=\"2\">Then the operator works on each pair.<\/span> <span class=\"sg\" data-s=\"3\">For example, <code>Z+<\/code> adds the elements at the same positions:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the zip meta-operator works with the operator <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It calculates <code>1 + 10<\/code>, <code>2 + 20<\/code>, and <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In the same way, <code>Z*<\/code> multiplies the elements at the same positions:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And <code>Z~<\/code> joins the strings at the same positions:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"de":{"t":"Zip-Metaoperatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Zip-Meta-Operator <code>Z<\/code> nimmt zwei Listen oder mehr.<\/span> <span class=\"sg\" data-s=\"1\">Er bringt ihre Elemente nach der Position zusammen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis ist eine Liste von Gruppen.<\/span> <span class=\"sg\" data-s=\"1\">Die erste Gruppe hat das erste Element jeder Liste.<\/span> <span class=\"sg\" data-s=\"2\">Die zweite Gruppe hat das zweite Element jeder Liste, und so weiter.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch einen noch klügeren Weg.<\/span> <span class=\"sg\" data-s=\"1\">Sie können <code>Z<\/code> mit einem Operator verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Dann arbeitet der Operator mit jedem Paar.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel addiert <code>Z+<\/code> die Elemente an denselben Positionen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier arbeitet der Zip-Meta-Operator mit dem Operator <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er rechnet <code>1 + 10<\/code>, <code>2 + 20<\/code> und <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Genauso multipliziert <code>Z*<\/code> die Elemente an denselben Positionen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und <code>Z~<\/code> verbindet die Zeichenketten an denselben Positionen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"nl":{"t":"Zip-meta-operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De zip-meta-operator <code>Z<\/code> neemt twee lijsten, of meer.<\/span> <span class=\"sg\" data-s=\"1\">Hij zet hun elementen per positie bij elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het resultaat is een lijst van groepen.<\/span> <span class=\"sg\" data-s=\"1\">De eerste groep heeft het eerste element van elke lijst.<\/span> <span class=\"sg\" data-s=\"2\">De tweede groep heeft het tweede element van elke lijst, enzovoort.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Er is ook een slimmere manier.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt <code>Z<\/code> met een operator gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Dan werkt de operator op elk paar.<\/span> <span class=\"sg\" data-s=\"3\">Zo telt <code>Z+<\/code> bijvoorbeeld de elementen op dezelfde posities op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier werkt de zip-meta-operator met de operator <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij berekent <code>1 + 10<\/code>, <code>2 + 20<\/code> en <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Op dezelfde manier vermenigvuldigt <code>Z*<\/code> de elementen op dezelfde posities:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>Z~<\/code> plakt de tekenreeksen op dezelfde posities aan elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"es":{"t":"Metaoperadores zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El meta-operador zip <code>Z<\/code> toma dos listas, o más.<\/span> <span class=\"sg\" data-s=\"1\">Junta sus elementos por posición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El resultado es una lista de grupos.<\/span> <span class=\"sg\" data-s=\"1\">El primer grupo tiene el primer elemento de cada lista.<\/span> <span class=\"sg\" data-s=\"2\">El segundo grupo tiene el segundo elemento de cada lista, y así sucesivamente.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">También hay una forma más inteligente.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usar <code>Z<\/code> con un operador.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el operador trabaja con cada par.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, <code>Z+<\/code> suma los elementos de las mismas posiciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, el meta-operador zip trabaja con el operador <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Calcula <code>1 + 10<\/code>, <code>2 + 20<\/code> y <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De la misma forma, <code>Z*<\/code> multiplica los elementos de las mismas posiciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y <code>Z~<\/code> une las cadenas de las mismas posiciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"it":{"t":"Meta-operatori zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore zip <code>Z<\/code> prende due liste, o anche di più.<\/span> <span class=\"sg\" data-s=\"1\">Mette insieme i loro elementi per posizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il risultato è una lista di gruppi.<\/span> <span class=\"sg\" data-s=\"1\">Il primo gruppo ha il primo elemento di ogni lista.<\/span> <span class=\"sg\" data-s=\"2\">Il secondo gruppo ha il secondo elemento di ogni lista, e così via.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">C'è anche un modo più intelligente.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usare <code>Z<\/code> con un operatore.<\/span> <span class=\"sg\" data-s=\"2\">Allora l'operatore lavora su ogni coppia.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, <code>Z+<\/code> somma gli elementi nelle stesse posizioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui il meta-operatore zip lavora con l'operatore <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Calcola <code>1 + 10<\/code>, <code>2 + 20<\/code> e <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nello stesso modo, <code>Z*<\/code> moltiplica gli elementi nelle stesse posizioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E <code>Z~<\/code> unisce le stringhe nelle stesse posizioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"lv":{"t":"Zip metaoperatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip metaoperators <code>Z<\/code> paņem divus sarakstus vai vairāk.<\/span> <span class=\"sg\" data-s=\"1\">Tas saliek to elementus kopā pēc pozīcijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rezultāts ir grupu saraksts.<\/span> <span class=\"sg\" data-s=\"1\">Pirmajā grupā ir katra saraksta pirmais elements.<\/span> <span class=\"sg\" data-s=\"2\">Otrajā grupā ir katra saraksta otrais elements, un tā tālāk.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ir arī gudrāks veids.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat lietot <code>Z<\/code> kopā ar operatoru.<\/span> <span class=\"sg\" data-s=\"2\">Tad operators strādā ar katru pāri.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, <code>Z+<\/code> saskaita elementus tajās pašās pozīcijās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit zip metaoperators strādā ar operatoru <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas aprēķina <code>1 + 10<\/code>, <code>2 + 20<\/code> un <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat <code>Z*<\/code> sareizina elementus tajās pašās pozīcijās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Z~<\/code> savieno virknes tajās pašās pozīcijās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"ru":{"t":"Метаоператоры zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> берёт два списка или больше.<\/span> <span class=\"sg\" data-s=\"1\">Он соединяет их элементы по позициям:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат — список групп.<\/span> <span class=\"sg\" data-s=\"1\">В первой группе — первый элемент каждого списка.<\/span> <span class=\"sg\" data-s=\"2\">Во второй группе — второй элемент каждого списка, и так далее.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Есть и более умный способ.<\/span> <span class=\"sg\" data-s=\"1\">Можно использовать <code>Z<\/code> вместе с оператором.<\/span> <span class=\"sg\" data-s=\"2\">Тогда оператор работает с каждой парой.<\/span> <span class=\"sg\" data-s=\"3\">Например, <code>Z+<\/code> складывает элементы на одинаковых позициях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь метаоператор zip работает с оператором <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он вычисляет <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так же <code>Z*<\/code> перемножает элементы на одинаковых позициях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> соединяет строки на одинаковых позициях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"uk":{"t":"Метаоператори zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> бере два списки або більше.<\/span> <span class=\"sg\" data-s=\"1\">Він з'єднує їхні елементи за позиціями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат — це список груп.<\/span> <span class=\"sg\" data-s=\"1\">У першій групі — перший елемент кожного списку.<\/span> <span class=\"sg\" data-s=\"2\">У другій групі — другий елемент кожного списку і так далі.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Є й розумніший спосіб.<\/span> <span class=\"sg\" data-s=\"1\">Можна використати <code>Z<\/code> з оператором.<\/span> <span class=\"sg\" data-s=\"2\">Тоді оператор працює з кожною парою.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, <code>Z+<\/code> додає елементи на однакових позиціях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут метаоператор zip працює з оператором <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він обчислює <code>1 + 10<\/code>, <code>2 + 20<\/code> і <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так само <code>Z*<\/code> перемножує елементи на однакових позиціях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> з'єднує рядки на однакових позиціях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"bg":{"t":"Zip метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът zip <code>Z<\/code> взима два списъка или повече.<\/span> <span class=\"sg\" data-s=\"1\">Той събира заедно елементите им по позиция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Резултатът е списък от групи.<\/span> <span class=\"sg\" data-s=\"1\">Първата група има първия елемент от всеки списък.<\/span> <span class=\"sg\" data-s=\"2\">Втората група има втория елемент от всеки списък и така нататък.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Има и по-умен начин.<\/span> <span class=\"sg\" data-s=\"1\">Можете да използвате <code>Z<\/code> с оператор.<\/span> <span class=\"sg\" data-s=\"2\">Тогава операторът работи върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"3\">Например <code>Z+<\/code> събира елементите на едни и същи позиции:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук метаоператорът zip работи с оператора <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той пресмята <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По същия начин <code>Z*<\/code> умножава елементите на едни и същи позиции:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> съединява низовете на едни и същи позиции:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"eo":{"t":"Zip-metaoperatoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La zipa meta-operatoro <code>Z<\/code> prenas du listojn, aŭ pli.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kunmetas iliajn elementojn laŭ pozicio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La rezulto estas listo de grupoj.<\/span> <span class=\"sg\" data-s=\"1\">La unua grupo havas la unuan elementon de ĉiu listo.<\/span> <span class=\"sg\" data-s=\"2\">La dua grupo havas la duan elementon de ĉiu listo, kaj tiel plu.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ pli lerta maniero.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi <code>Z<\/code> kun operatoro.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la operatoro laboras kun ĉiu paro.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, <code>Z+<\/code> adicias la elementojn ĉe la samaj pozicioj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la zipa meta-operatoro laboras kun la operatoro <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kalkulas <code>1 + 10<\/code>, <code>2 + 20<\/code> kaj <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Same, <code>Z*<\/code> multobligas la elementojn ĉe la samaj pozicioj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>Z~<\/code> kunigas la ĉenojn ĉe la samaj pozicioj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"la":{"t":"Zip meta-operatores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Meta-operator zip <code>Z<\/code> duas listas accipit, vel plures.<\/span> <span class=\"sg\" data-s=\"1\">Elementa earum per positionem coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eventus est lista gregum.<\/span> <span class=\"sg\" data-s=\"1\">Primus grex primum elementum cuiusque listae habet.<\/span> <span class=\"sg\" data-s=\"2\">Secundus grex secundum elementum cuiusque listae habet, et ita porro.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Est etiam modus callidior.<\/span> <span class=\"sg\" data-s=\"1\"><code>Z<\/code> cum operatore adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Tum operator in quoque pari agit.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, <code>Z+<\/code> elementa in eisdem positionibus addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic meta-operator zip cum operatore <code>+<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Computat <code>1 + 10<\/code>, <code>2 + 20<\/code> et <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eodem modo <code>Z*<\/code> elementa in eisdem positionibus multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>Z~<\/code> fila in eisdem positionibus coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]}}}</script>
