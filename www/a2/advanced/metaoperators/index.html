<script type="application/json" id="page-data">{"u":"advanced/metaoperators","n":544,"k":"section","pv":"advanced/operators-overview/quiz","nx":"advanced/metaoperators/reduction","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Meta-operators","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A <em>meta-operator<\/em> is not an operator by itself.<\/span> <span class=\"sg\" data-s=\"1\">It takes a normal operator and makes a new operator from it.<\/span> <span class=\"sg\" data-s=\"2\">For example, take a list of values.<\/span> <span class=\"sg\" data-s=\"3\">A meta-operator can use one operator on all of them at once.<\/span> <span class=\"sg\" data-s=\"4\">Then you do not write the operator between every two values.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku has several meta-operators.<\/span> <span class=\"sg\" data-s=\"1\">This section shows the most useful groups.<\/span> <span class=\"sg\" data-s=\"2\">The first group is <em>reduction<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">It turns a list into one value.<\/span> <span class=\"sg\" data-s=\"4\">The second group is <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">It joins two lists, element by element.<\/span> <span class=\"sg\" data-s=\"6\">The last page shows the <em>cross<\/em>, <em>hyper<\/em>, and <em>negated<\/em> operators.<\/span><\/p>"]]},"de":{"t":"Meta-Operatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Meta-Operator<\/em> ist kein Operator für sich allein.<\/span> <span class=\"sg\" data-s=\"1\">Er nimmt einen normalen Operator und macht daraus einen neuen Operator.<\/span> <span class=\"sg\" data-s=\"2\">Nehmen Sie zum Beispiel eine Liste von Werten.<\/span> <span class=\"sg\" data-s=\"3\">Ein Meta-Operator kann einen Operator für alle Werte auf einmal benutzen.<\/span> <span class=\"sg\" data-s=\"4\">Dann schreiben Sie den Operator nicht zwischen je zwei Werte.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku hat mehrere Meta-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt zeigt die nützlichsten Gruppen.<\/span> <span class=\"sg\" data-s=\"2\">Die erste Gruppe ist die <em>Reduktion<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sie macht aus einer Liste einen einzigen Wert.<\/span> <span class=\"sg\" data-s=\"4\">Die zweite Gruppe ist <em>Zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Es verbindet zwei Listen, Element für Element.<\/span> <span class=\"sg\" data-s=\"6\">Die letzte Seite zeigt die <em>Kreuz-<\/em>, <em>Hyper-<\/em> und <em>negierten<\/em> Operatoren.<\/span><\/p>"]]},"nl":{"t":"Meta-operatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <em>meta-operator<\/em> is zelf geen operator.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt een gewone operator en maakt er een nieuwe operator van.<\/span> <span class=\"sg\" data-s=\"2\">Neem bijvoorbeeld een lijst waarden.<\/span> <span class=\"sg\" data-s=\"3\">Een meta-operator kan één operator op al die waarden tegelijk gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Dan zet je de operator niet steeds tussen twee waarden.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku heeft meerdere meta-operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte laat de nuttigste groepen zien.<\/span> <span class=\"sg\" data-s=\"2\">De eerste groep is <em>reductie<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Die maakt van een lijst één waarde.<\/span> <span class=\"sg\" data-s=\"4\">De tweede groep is <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Die voegt twee lijsten samen, element voor element.<\/span> <span class=\"sg\" data-s=\"6\">De laatste pagina laat de <em>cross<\/em>-, <em>hyper<\/em>- en <em>genegeerde<\/em> operatoren zien.<\/span><\/p>"]]},"es":{"t":"Metaoperadores","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operador<\/em> no es un operador por sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Toma un operador normal y crea un operador nuevo con él.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, piensa en una lista de valores.<\/span> <span class=\"sg\" data-s=\"3\">Un meta-operador puede usar un operador con todos ellos a la vez.<\/span> <span class=\"sg\" data-s=\"4\">Así no escribes el operador entre cada dos valores.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku tiene varios meta-operadores.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección muestra los grupos más útiles.<\/span> <span class=\"sg\" data-s=\"2\">El primer grupo es la <em>reducción<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Convierte una lista en un solo valor.<\/span> <span class=\"sg\" data-s=\"4\">El segundo grupo es <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Une dos listas, elemento por elemento.<\/span> <span class=\"sg\" data-s=\"6\">La última página muestra los operadores <em>cross<\/em>, <em>hyper<\/em> y <em>negado<\/em>.<\/span><\/p>"]]},"it":{"t":"Meta-operatori","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operatore<\/em> non è un operatore da solo.<\/span> <span class=\"sg\" data-s=\"1\">Prende un operatore normale e ne crea uno nuovo.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, prendi una lista di valori.<\/span> <span class=\"sg\" data-s=\"3\">Un meta-operatore può usare un operatore su tutti i valori insieme.<\/span> <span class=\"sg\" data-s=\"4\">Così non scrivi l'operatore tra ogni coppia di valori.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ha diversi meta-operatori.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra i gruppi più utili.<\/span> <span class=\"sg\" data-s=\"2\">Il primo gruppo è la <em>riduzione<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Trasforma una lista in un solo valore.<\/span> <span class=\"sg\" data-s=\"4\">Il secondo gruppo è lo <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Unisce due liste, elemento per elemento.<\/span> <span class=\"sg\" data-s=\"6\">L'ultima pagina mostra gli operatori <em>cross<\/em>, <em>hyper<\/em> e <em>negato<\/em>.<\/span><\/p>"]]},"lv":{"t":"Metaoperatori","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Metaoperators<\/em> pats par sevi nav operators.<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem parastu operatoru un izveido no tā jaunu operatoru.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, paņemiet vērtību sarakstu.<\/span> <span class=\"sg\" data-s=\"3\">Metaoperators var lietot vienu operatoru visām vērtībām uzreiz.<\/span> <span class=\"sg\" data-s=\"4\">Tad jums nav jāraksta operators starp katrām divām vērtībām.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ir vairāki metaoperatori.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa rāda visnoderīgākās grupas.<\/span> <span class=\"sg\" data-s=\"2\">Pirmā grupa ir <em>redukcija<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tā pārvērš sarakstu par vienu vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Otrā grupa ir <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Tā savieno divus sarakstus pa elementiem.<\/span> <span class=\"sg\" data-s=\"6\">Pēdējā lapa rāda <em>krustenisko<\/em>, <em>hiper<\/em> un <em>negācijas<\/em> operatorus.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> — это не отдельный оператор.<\/span> <span class=\"sg\" data-s=\"1\">Он берёт обычный оператор и делает из него новый оператор.<\/span> <span class=\"sg\" data-s=\"2\">Например, возьмём список значений.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператор может применить один оператор сразу ко всем значениям.<\/span> <span class=\"sg\" data-s=\"4\">Тогда вы не пишете оператор между каждыми двумя значениями.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько метаоператоров.<\/span> <span class=\"sg\" data-s=\"1\">Этот раздел показывает самые полезные группы.<\/span> <span class=\"sg\" data-s=\"2\">Первая группа — <em>свёртка<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Она превращает список в одно значение.<\/span> <span class=\"sg\" data-s=\"4\">Вторая группа — <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Он соединяет два списка, элемент за элементом.<\/span> <span class=\"sg\" data-s=\"6\">На последней странице вы увидите <em>перекрёстные<\/em>, <em>гипер-<\/em> и <em>отрицающие<\/em> операторы.<\/span><\/p>"]]},"uk":{"t":"Метаоператори","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> сам по собі не є оператором.<\/span> <span class=\"sg\" data-s=\"1\">Він бере звичайний оператор і робить із нього новий.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, візьміть список значень.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператор може використати один оператор для всіх значень одразу.<\/span> <span class=\"sg\" data-s=\"4\">Тоді ви не пишете оператор між кожними двома значеннями.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У Raku є кілька метаоператорів.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ показує найкорисніші групи.<\/span> <span class=\"sg\" data-s=\"2\">Перша група — це <em>згортка<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вона перетворює список на одне значення.<\/span> <span class=\"sg\" data-s=\"4\">Друга група — це <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Вона з'єднує два списки, елемент за елементом.<\/span> <span class=\"sg\" data-s=\"6\">Остання сторінка показує <em>перехресний<\/em>, <em>гіпер<\/em>- та <em>заперечний<\/em> оператори.<\/span><\/p>"]]},"bg":{"t":"Метаоператори","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператорът<\/em> не е оператор сам по себе си.<\/span> <span class=\"sg\" data-s=\"1\">Той взима обикновен оператор и прави от него нов оператор.<\/span> <span class=\"sg\" data-s=\"2\">Например, вземете списък от стойности.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператорът може да използва един оператор за всички тях наведнъж.<\/span> <span class=\"sg\" data-s=\"4\">Тогава не пишете оператора между всеки две стойности.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku има няколко метаоператора.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел показва най-полезните групи.<\/span> <span class=\"sg\" data-s=\"2\">Първата група е <em>редукция<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Тя превръща списък в една стойност.<\/span> <span class=\"sg\" data-s=\"4\">Втората група е <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Тя съединява два списъка, елемент по елемент.<\/span> <span class=\"sg\" data-s=\"6\">Последната страница показва операторите <em>cross<\/em>, <em>хипер<\/em> и <em>отрицание<\/em>.<\/span><\/p>"]]},"eo":{"t":"Metaoperatoroj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operatoro<\/em> ne estas operatoro per si mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas normalan operatoron kaj faras novan operatoron el ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, prenu liston de valoroj.<\/span> <span class=\"sg\" data-s=\"3\">Meta-operatoro povas uzi unu operatoron por ĉiuj el ili samtempe.<\/span> <span class=\"sg\" data-s=\"4\">Tiam vi ne skribas la operatoron inter ĉiu paro de valoroj.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku havas plurajn meta-operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio montras la plej utilajn grupojn.<\/span> <span class=\"sg\" data-s=\"2\">La unua grupo estas <em>redukto<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi faras el listo unu valoron.<\/span> <span class=\"sg\" data-s=\"4\">La dua grupo estas <em>zipado<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi kunigas du listojn, elemento post elemento.<\/span> <span class=\"sg\" data-s=\"6\">La lasta paĝo montras la <em>krucan<\/em>, <em>hiperan<\/em> kaj <em>neigan<\/em> operatorojn.<\/span><\/p>"]]},"la":{"t":"Meta-operatores","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operator<\/em> non est operator per se.<\/span> <span class=\"sg\" data-s=\"1\">Operatorem ordinarium sumit et novum operatorem ex eo facit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, sume listam valorum.<\/span> <span class=\"sg\" data-s=\"3\">Meta-operator unum operatorem in omnibus simul adhibere potest.<\/span> <span class=\"sg\" data-s=\"4\">Tum operatorem non scribis inter omnia paria valorum.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku plures meta-operatores habet.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio familias utilissimas ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Prima familia est <em>reductio<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Listam in unum valorem convertit.<\/span> <span class=\"sg\" data-s=\"4\">Secunda familia est <em>zip<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Duas listas coniungit, elementum per elementum.<\/span> <span class=\"sg\" data-s=\"6\">Ultima pagina operatores <em>cross<\/em>, <em>hyper<\/em> et <em>negatos<\/em> ostendit.<\/span><\/p>"]]}}}</script>
