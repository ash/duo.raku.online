<script type="application/json" id="page-data">{"u":"advanced/metaoperators/more","n":548,"k":"topic","pv":"advanced/metaoperators/zip","nx":"advanced/metaoperators/more/quiz","tr":["advanced","advanced/metaoperators"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Cross, hyper, and negated meta-operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has more meta-operators, not only reduction and zip.<\/span> <span class=\"sg\" data-s=\"1\">Here you learn three of them.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The cross meta-operator <code>X<\/code> takes two lists and makes pairs.<\/span> <span class=\"sg\" data-s=\"1\">Here, <strong>every<\/strong> element of one list goes with <strong>every<\/strong> element of the other.<\/span> <span class=\"sg\" data-s=\"2\">This is called the cartesian product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Like zip, <code>X<\/code> can also take an operator.<\/span> <span class=\"sg\" data-s=\"1\">Then the operator works on each pair.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> joins each pair into a string.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> multiplies the two numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip goes through two lists side by side.<\/span> <span class=\"sg\" data-s=\"1\">Cross puts them together in all possible ways.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">A hyper meta-operator uses an operator on <strong>each element<\/strong> of a list.<\/span> <span class=\"sg\" data-s=\"1\">The operator stands between the arrows <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">With ASCII characters only, you write <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">With two lists, it works element by element, like zip.<\/span> <span class=\"sg\" data-s=\"4\">Sometimes one side has only one value.<\/span> <span class=\"sg\" data-s=\"5\">Then it uses this value with every element of the list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The two arrows can point in different directions.<\/span> <span class=\"sg\" data-s=\"1\">The direction matters when the lists have different lengths.<\/span> <span class=\"sg\" data-s=\"2\">If an arrow points <strong>at<\/strong> a list, Raku can repeat this list.<\/span> <span class=\"sg\" data-s=\"3\">Then it is as long as the other list.<\/span> <span class=\"sg\" data-s=\"4\">Here are the four combinations in ASCII, with <code>&lt;&lt;<\/code> and <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku repeats no list. The lists must have the same length. If not, you get an error.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku repeats the <strong>right<\/strong> list. Then it is as long as the left one.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku repeats the <strong>left<\/strong> list. Then it is as long as the right one.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku repeats the <strong>shorter<\/strong> list. Then it is as long as the longer one.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">There is also a form with only one operand.<\/span> <span class=\"sg\" data-s=\"1\">It calls a method on every element.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> changes each string to capital letters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A hyper operation also tells Raku something more.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>may<\/em> do the work in parallel.<\/span> <span class=\"sg\" data-s=\"2\">Then several parts of the work run at the same time.<\/span> <span class=\"sg\" data-s=\"3\">Later, you will learn the similar <code>.hyper<\/code> method.<\/span> <span class=\"sg\" data-s=\"4\">It is in <a href=\"/paradigms/hyper-race/\">the section about concurrent programming<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negated — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Put <code>!<\/code> before a comparison operator.<\/span> <span class=\"sg\" data-s=\"1\">Then you get the opposite result.<\/span> <span class=\"sg\" data-s=\"2\">You already know <code>!=<\/code>, or “not equal”.<\/span> <span class=\"sg\" data-s=\"3\">It is just this meta-operator with <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Other operators give <code>True<\/code> or <code>False<\/code> too, like <code>eq<\/code> and <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">The meta-operator works with them in the same way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So <code>$a !op $b<\/code> is just a cleaner way to write <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku does this on purpose.<\/span> <span class=\"sg\" data-s=\"1\">Some languages are small and simple on purpose, like Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto tries to have one regular way to say each thing.<\/span> <span class=\"sg\" data-s=\"3\">Raku is different.<\/span> <span class=\"sg\" data-s=\"4\">It happily gives you several ways.<\/span> <span class=\"sg\" data-s=\"5\">So Raku has the negated <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">It also has a special <code>ne<\/code> operator.<\/span> <span class=\"sg\" data-s=\"7\">The two mean exactly the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"de":{"t":"Kreuz-, Hyper- und negierte Operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat noch mehr Meta-Operatoren, nicht nur Reduktion und Zip.<\/span> <span class=\"sg\" data-s=\"1\">Hier lernen Sie drei davon kennen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreuz — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Kreuz-Meta-Operator <code>X<\/code> nimmt zwei Listen und bildet Paare.<\/span> <span class=\"sg\" data-s=\"1\">Dabei kommt <strong>jedes<\/strong> Element der einen Liste mit <strong>jedem<\/strong> Element der anderen zusammen.<\/span> <span class=\"sg\" data-s=\"2\">Das nennt man das kartesische Produkt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wie Zip kann auch <code>X<\/code> einen Operator nehmen.<\/span> <span class=\"sg\" data-s=\"1\">Dann arbeitet der Operator mit jedem Paar.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> verbindet jedes Paar zu einer Zeichenkette.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> multipliziert die zwei Zahlen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip geht zwei Listen nebeneinander durch.<\/span> <span class=\"sg\" data-s=\"1\">Kreuz verbindet sie auf alle möglichen Arten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein Hyper-Meta-Operator benutzt einen Operator für <strong>jedes Element<\/strong> einer Liste.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator steht zwischen den Pfeilen <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mit reinen ASCII-Zeichen schreiben Sie <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mit zwei Listen arbeitet er Element für Element, wie Zip.<\/span> <span class=\"sg\" data-s=\"4\">Manchmal hat eine Seite nur einen Wert.<\/span> <span class=\"sg\" data-s=\"5\">Dann benutzt er diesen Wert mit jedem Element der Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die zwei Pfeile können in verschiedene Richtungen zeigen.<\/span> <span class=\"sg\" data-s=\"1\">Die Richtung ist wichtig, wenn die Listen verschieden lang sind.<\/span> <span class=\"sg\" data-s=\"2\">Wenn ein Pfeil <strong>auf<\/strong> eine Liste zeigt, kann Raku diese Liste wiederholen.<\/span> <span class=\"sg\" data-s=\"3\">Dann ist sie so lang wie die andere Liste.<\/span> <span class=\"sg\" data-s=\"4\">Hier sind die vier Kombinationen in ASCII, mit <code>&lt;&lt;<\/code> und <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku wiederholt keine Liste. Die Listen müssen gleich lang sein. Sonst bekommen Sie einen Fehler.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku wiederholt die <strong>rechte<\/strong> Liste. Dann ist sie so lang wie die linke.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku wiederholt die <strong>linke<\/strong> Liste. Dann ist sie so lang wie die rechte.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku wiederholt die <strong>kürzere<\/strong> Liste. Dann ist sie so lang wie die längere.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch eine Form mit nur einem Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Sie ruft für jedes Element eine Methode auf.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> schreibt jede Zeichenkette in Großbuchstaben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Hyper-Operation sagt Raku auch noch etwas.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>darf<\/em> die Arbeit parallel machen.<\/span> <span class=\"sg\" data-s=\"2\">Dann laufen mehrere Teile der Arbeit gleichzeitig.<\/span> <span class=\"sg\" data-s=\"3\">Später lernen Sie die ähnliche Methode <code>.hyper<\/code> kennen.<\/span> <span class=\"sg\" data-s=\"4\">Sie steht im <a href=\"https://course.raku.org/de/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">Abschnitt über nebenläufige Programmierung<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negiert — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Setzen Sie <code>!<\/code> vor einen Vergleichsoperator.<\/span> <span class=\"sg\" data-s=\"1\">Dann bekommen Sie das umgekehrte Ergebnis.<\/span> <span class=\"sg\" data-s=\"2\">Sie kennen schon <code>!=<\/code>, also „ungleich“.<\/span> <span class=\"sg\" data-s=\"3\">Das ist einfach dieser Meta-Operator mit <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Auch andere Operatoren geben <code>True<\/code> oder <code>False<\/code>, wie <code>eq<\/code> und <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Der Meta-Operator funktioniert mit ihnen genauso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — nicht gleich als Zeichenketten\nsay 5 !%% 2;     # True  — 5 ist nicht teilbar durch 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Also ist <code>$a !op $b<\/code> nur eine sauberere Art, <code>!($a op $b)<\/code> zu schreiben.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku macht das mit Absicht.<\/span> <span class=\"sg\" data-s=\"1\">Manche Sprachen sind mit Absicht klein und einfach, wie Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto will für jede Sache eine regelmäßige Form haben.<\/span> <span class=\"sg\" data-s=\"3\">Raku ist anders.<\/span> <span class=\"sg\" data-s=\"4\">Raku gibt Ihnen gern mehrere Wege.<\/span> <span class=\"sg\" data-s=\"5\">Also hat Raku das negierte <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Raku hat auch einen eigenen Operator <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Die beiden bedeuten genau dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — derselbe Test wie 'a' !eq 'b'<\/code><\/pre>"]]},"nl":{"t":"Cross, hyper en genegeerd","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft meer meta-operatoren, niet alleen reductie en zip.<\/span> <span class=\"sg\" data-s=\"1\">Hier leer je er drie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De cross-meta-operator <code>X<\/code> neemt twee lijsten en maakt paren.<\/span> <span class=\"sg\" data-s=\"1\">Daarbij komt <strong>elk<\/strong> element van de ene lijst bij <strong>elk<\/strong> element van de andere.<\/span> <span class=\"sg\" data-s=\"2\">Dit heet het cartesisch product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Net als zip kan <code>X<\/code> ook een operator nemen.<\/span> <span class=\"sg\" data-s=\"1\">Dan werkt de operator op elk paar.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> voegt elk paar samen tot een tekenreeks.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> vermenigvuldigt de twee getallen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip loopt tegelijk door twee lijsten.<\/span> <span class=\"sg\" data-s=\"1\">Cross zet ze op alle mogelijke manieren samen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een hyper-meta-operator gebruikt een operator op <strong>elk element<\/strong> van een lijst.<\/span> <span class=\"sg\" data-s=\"1\">De operator staat tussen de pijlen <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Met alleen ASCII-tekens schrijf je <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Met twee lijsten werkt hij element voor element, net als zip.<\/span> <span class=\"sg\" data-s=\"4\">Soms heeft één kant maar één waarde.<\/span> <span class=\"sg\" data-s=\"5\">Dan gebruikt hij die waarde bij elk element van de lijst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De twee pijlen kunnen verschillende kanten op wijzen.<\/span> <span class=\"sg\" data-s=\"1\">De richting is belangrijk als de lijsten niet even lang zijn.<\/span> <span class=\"sg\" data-s=\"2\">Als een pijl <strong>naar<\/strong> een lijst wijst, kan Raku die lijst herhalen.<\/span> <span class=\"sg\" data-s=\"3\">Dan is hij even lang als de andere lijst.<\/span> <span class=\"sg\" data-s=\"4\">Hier zijn de vier combinaties in ASCII, met <code>&lt;&lt;<\/code> en <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku herhaalt geen lijst. De lijsten moeten even lang zijn. Zo niet, dan krijg je een fout.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku herhaalt de <strong>rechter<\/strong> lijst. Dan is hij even lang als de linker.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku herhaalt de <strong>linker<\/strong> lijst. Dan is hij even lang als de rechter.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku herhaalt de <strong>kortere<\/strong> lijst. Dan is hij even lang als de langere.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 herhaalt tot 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er is ook een vorm met maar één operand.<\/span> <span class=\"sg\" data-s=\"1\">Die roept een methode aan op elk element.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> zet elke tekenreeks in hoofdletters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een hyper-operatie vertelt Raku ook nog iets anders.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>mag<\/em> het werk parallel doen.<\/span> <span class=\"sg\" data-s=\"2\">Dan lopen verschillende delen van het werk tegelijk.<\/span> <span class=\"sg\" data-s=\"3\">Later leer je de vergelijkbare methode <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Die staat in <a href=\"https://course.raku.org/nl/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">het gedeelte over gelijktijdig programmeren<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Genegeerd — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Zet <code>!<\/code> voor een vergelijkingsoperator.<\/span> <span class=\"sg\" data-s=\"1\">Dan krijg je het omgekeerde resultaat.<\/span> <span class=\"sg\" data-s=\"2\">Je kent <code>!=<\/code> al, oftewel \"niet gelijk\".<\/span> <span class=\"sg\" data-s=\"3\">Dat is gewoon deze meta-operator met <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Andere operatoren geven ook <code>True<\/code> of <code>False<\/code>, zoals <code>eq<\/code> en <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">De meta-operator werkt er op dezelfde manier mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — niet gelijk als tekenreeksen\nsay 5 !%% 2;     # True  — 5 is niet deelbaar door 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$a !op $b<\/code> is dus gewoon een nettere manier om <code>!($a op $b)<\/code> te schrijven.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku doet dit expres.<\/span> <span class=\"sg\" data-s=\"1\">Sommige talen zijn expres klein en eenvoudig, zoals Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto probeert voor elk ding één regelmatige manier te hebben.<\/span> <span class=\"sg\" data-s=\"3\">Raku is anders.<\/span> <span class=\"sg\" data-s=\"4\">Het geeft je graag meerdere manieren.<\/span> <span class=\"sg\" data-s=\"5\">Daarom heeft Raku het genegeerde <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Het heeft ook een speciale operator <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">De twee betekenen precies hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — dezelfde test als 'a' !eq 'b'<\/code><\/pre>"]]},"es":{"t":"Cross, hyper y negados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene más meta-operadores, no solo la reducción y el zip.<\/span> <span class=\"sg\" data-s=\"1\">Aquí aprendes tres de ellos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El meta-operador cross <code>X<\/code> toma dos listas y forma pares.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, <strong>cada<\/strong> elemento de una lista va con <strong>cada<\/strong> elemento de la otra.<\/span> <span class=\"sg\" data-s=\"2\">Esto se llama producto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Como zip, <code>X<\/code> también puede tomar un operador.<\/span> <span class=\"sg\" data-s=\"1\">Entonces el operador trabaja con cada par.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> une cada par en una cadena.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> multiplica los dos números:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip pasa por dos listas, una al lado de la otra.<\/span> <span class=\"sg\" data-s=\"1\">Cross las junta de todas las formas posibles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un meta-operador hyper usa un operador con <strong>cada elemento<\/strong> de una lista.<\/span> <span class=\"sg\" data-s=\"1\">El operador va entre las flechas <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con solo caracteres ASCII, escribes <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Con dos listas, trabaja elemento por elemento, como zip.<\/span> <span class=\"sg\" data-s=\"4\">A veces un lado tiene solo un valor.<\/span> <span class=\"sg\" data-s=\"5\">Entonces usa este valor con cada elemento de la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Las dos flechas pueden apuntar en direcciones diferentes.<\/span> <span class=\"sg\" data-s=\"1\">La dirección importa cuando las listas tienen longitudes diferentes.<\/span> <span class=\"sg\" data-s=\"2\">Si una flecha apunta <strong>hacia<\/strong> una lista, Raku puede repetir esta lista.<\/span> <span class=\"sg\" data-s=\"3\">Entonces es tan larga como la otra lista.<\/span> <span class=\"sg\" data-s=\"4\">Estas son las cuatro combinaciones en ASCII, con <code>&lt;&lt;<\/code> y <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku no repite ninguna lista. Las listas deben tener la misma longitud. Si no, obtienes un error.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku repite la lista <strong>derecha<\/strong>. Así es tan larga como la izquierda.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku repite la lista <strong>izquierda<\/strong>. Así es tan larga como la derecha.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku repite la lista <strong>más corta<\/strong>. Así es tan larga como la más larga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También hay una forma con un solo operando.<\/span> <span class=\"sg\" data-s=\"1\">Llama a un método en cada elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> cambia cada cadena a letras mayúsculas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Una operación hyper también le dice algo más a Raku.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>puede<\/em> hacer el trabajo en paralelo.<\/span> <span class=\"sg\" data-s=\"2\">Entonces varias partes del trabajo se ejecutan al mismo tiempo.<\/span> <span class=\"sg\" data-s=\"3\">Más adelante, aprenderás el método parecido <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Está en <a href=\"https://course.raku.org/es/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">la sección sobre programación concurrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negado — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pon <code>!<\/code> antes de un operador de comparación.<\/span> <span class=\"sg\" data-s=\"1\">Entonces obtienes el resultado contrario.<\/span> <span class=\"sg\" data-s=\"2\">Ya conoces <code>!=<\/code>, o “no igual”.<\/span> <span class=\"sg\" data-s=\"3\">Es solo este meta-operador con <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Otros operadores también dan <code>True<\/code> o <code>False<\/code>, como <code>eq<\/code> y <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">El meta-operador funciona con ellos de la misma forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así, <code>$a !op $b<\/code> es solo una forma más limpia de escribir <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku hace esto a propósito.<\/span> <span class=\"sg\" data-s=\"1\">Algunos lenguajes son pequeños y simples a propósito, como el esperanto.<\/span> <span class=\"sg\" data-s=\"2\">El esperanto intenta tener una forma regular de decir cada cosa.<\/span> <span class=\"sg\" data-s=\"3\">Raku es diferente.<\/span> <span class=\"sg\" data-s=\"4\">Con gusto te da varias formas.<\/span> <span class=\"sg\" data-s=\"5\">Por eso Raku tiene el negado <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">También tiene un operador especial <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Los dos significan exactamente lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"it":{"t":"Cross, hyper e negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha altri meta-operatori, non solo la riduzione e lo zip.<\/span> <span class=\"sg\" data-s=\"1\">Qui ne impari tre.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore cross <code>X<\/code> prende due liste e crea delle coppie.<\/span> <span class=\"sg\" data-s=\"1\">Qui <strong>ogni<\/strong> elemento di una lista va con <strong>ogni<\/strong> elemento dell'altra.<\/span> <span class=\"sg\" data-s=\"2\">Questo si chiama prodotto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Come lo zip, anche <code>X<\/code> può prendere un operatore.<\/span> <span class=\"sg\" data-s=\"1\">Allora l'operatore lavora su ogni coppia.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> unisce ogni coppia in una stringa.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> moltiplica i due numeri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo zip scorre due liste fianco a fianco.<\/span> <span class=\"sg\" data-s=\"1\">Il cross le unisce in tutti i modi possibili.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un meta-operatore hyper usa un operatore su <strong>ogni elemento<\/strong> di una lista.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore sta tra le frecce <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con soli caratteri ASCII, scrivi <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Con due liste, lavora elemento per elemento, come lo zip.<\/span> <span class=\"sg\" data-s=\"4\">A volte un lato ha un solo valore.<\/span> <span class=\"sg\" data-s=\"5\">Allora usa questo valore con ogni elemento della lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Le due frecce possono puntare in direzioni diverse.<\/span> <span class=\"sg\" data-s=\"1\">La direzione conta quando le liste hanno lunghezze diverse.<\/span> <span class=\"sg\" data-s=\"2\">Se una freccia punta <strong>verso<\/strong> una lista, Raku può ripetere questa lista.<\/span> <span class=\"sg\" data-s=\"3\">Allora la lista è lunga come l'altra.<\/span> <span class=\"sg\" data-s=\"4\">Ecco le quattro combinazioni in ASCII, con <code>&lt;&lt;<\/code> e <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku non ripete nessuna lista. Le liste devono avere la stessa lunghezza. Altrimenti c'è un errore.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku ripete la lista <strong>destra<\/strong>. Così diventa lunga come la sinistra.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku ripete la lista <strong>sinistra<\/strong>. Così diventa lunga come la destra.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku ripete la lista <strong>più corta<\/strong>. Così diventa lunga come la più lunga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 si ripete come 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è anche una forma con un solo operando.<\/span> <span class=\"sg\" data-s=\"1\">Chiama un metodo su ogni elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> cambia ogni stringa in lettere maiuscole:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un'operazione hyper dice anche un'altra cosa a Raku.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>può<\/em> fare il lavoro in parallelo.<\/span> <span class=\"sg\" data-s=\"2\">Allora diverse parti del lavoro avvengono nello stesso momento.<\/span> <span class=\"sg\" data-s=\"3\">Più avanti imparerai il metodo simile <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">È nella <a href=\"https://course.raku.org/it/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sezione sulla programmazione concorrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negato — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Metti <code>!<\/code> prima di un operatore di confronto.<\/span> <span class=\"sg\" data-s=\"1\">Allora ottieni il risultato opposto.<\/span> <span class=\"sg\" data-s=\"2\">Conosci già <code>!=<\/code>, cioè “diverso da”.<\/span> <span class=\"sg\" data-s=\"3\">È solo questo meta-operatore con <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Anche altri operatori danno <code>True<\/code> o <code>False<\/code>, come <code>eq<\/code> e <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Il meta-operatore funziona con loro nello stesso modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non uguale come stringhe\nsay 5 !%% 2;     # True  — 5 non è divisibile per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>$a !op $b<\/code> è solo un modo più pulito di scrivere <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku lo fa apposta.<\/span> <span class=\"sg\" data-s=\"1\">Alcune lingue sono piccole e semplici apposta, come l'Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">L'Esperanto cerca di avere un solo modo regolare per dire ogni cosa.<\/span> <span class=\"sg\" data-s=\"3\">Raku è diverso.<\/span> <span class=\"sg\" data-s=\"4\">Ti dà volentieri diversi modi.<\/span> <span class=\"sg\" data-s=\"5\">Così Raku ha il negato <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ha anche un operatore speciale <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">I due significano esattamente la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — lo stesso test di 'a' !eq 'b'<\/code><\/pre>"]]},"lv":{"t":"Krustojuma, hiper un noliedzošie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ir vēl citi metaoperatori, ne tikai redukcija un zip.<\/span> <span class=\"sg\" data-s=\"1\">Šeit jūs iepazīstat trīs no tiem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Krusteniskais — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Krusteniskais metaoperators <code>X<\/code> paņem divus sarakstus un veido pārus.<\/span> <span class=\"sg\" data-s=\"1\">Šeit <strong>katrs<\/strong> viena saraksta elements iet pārī ar <strong>katru<\/strong> otra saraksta elementu.<\/span> <span class=\"sg\" data-s=\"2\">To sauc par Dekarta reizinājumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā zip, arī <code>X<\/code> var paņemt operatoru.<\/span> <span class=\"sg\" data-s=\"1\">Tad operators strādā ar katru pāri.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> savieno katru pāri virknē.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> sareizina abus skaitļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip iet cauri diviem sarakstiem vienlaikus.<\/span> <span class=\"sg\" data-s=\"1\">Krusteniskais operators saliek tos kopā visos iespējamos veidos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hiper — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hiper metaoperators lieto operatoru <strong>katram elementam<\/strong> sarakstā.<\/span> <span class=\"sg\" data-s=\"1\">Operators stāv starp bultiņām <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tikai ar ASCII rakstzīmēm jūs rakstāt <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ar diviem sarakstiem tas strādā pa elementiem, tāpat kā zip.<\/span> <span class=\"sg\" data-s=\"4\">Dažreiz vienā pusē ir tikai viena vērtība.<\/span> <span class=\"sg\" data-s=\"5\">Tad tas lieto šo vērtību ar katru saraksta elementu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Abas bultiņas var rādīt dažādos virzienos.<\/span> <span class=\"sg\" data-s=\"1\">Virziens ir svarīgs, ja sarakstiem ir dažāds garums.<\/span> <span class=\"sg\" data-s=\"2\">Ja bultiņa rāda <strong>uz<\/strong> sarakstu, Raku var atkārtot šo sarakstu.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas ir tikpat garš kā otrs saraksts.<\/span> <span class=\"sg\" data-s=\"4\">Šeit ir četras kombinācijas ASCII formā, ar <code>&lt;&lt;<\/code> un <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku neatkārto nevienu sarakstu. Sarakstiem jābūt vienāda garuma. Ja tā nav, jūs saņemat kļūdu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku atkārto <strong>labo<\/strong> sarakstu. Tad tas ir tikpat garš kā kreisais.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku atkārto <strong>kreiso<\/strong> sarakstu. Tad tas ir tikpat garš kā labais.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku atkārto <strong>īsāko<\/strong> sarakstu. Tad tas ir tikpat garš kā garākais.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir arī forma ar tikai vienu operandu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izsauc metodi katram elementam.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> pārveido katru virkni lielajos burtos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hiper operācija pasaka Raku vēl kaut ko.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>var<\/em> veikt darbu paralēli.<\/span> <span class=\"sg\" data-s=\"2\">Tad vairākas darba daļas notiek vienlaikus.<\/span> <span class=\"sg\" data-s=\"3\">Vēlāk jūs iepazīsiet līdzīgo metodi <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tā ir <a href=\"https://course.raku.org/lv/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sadaļā par konkurento programmēšanu<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negācijas — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ielieciet <code>!<\/code> pirms salīdzināšanas operatora.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs saņemat pretēju rezultātu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs jau zināt <code>!=<\/code> jeb “nav vienāds”.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir vienkārši šis metaoperators ar <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Arī citi operatori dod <code>True<\/code> vai <code>False<\/code>, piemēram, <code>eq<\/code> un <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Metaoperators ar tiem strādā tāpat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>$a !op $b<\/code> ir vienkārši tīrāks veids, kā rakstīt <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku to dara apzināti.<\/span> <span class=\"sg\" data-s=\"1\">Dažas valodas ir apzināti mazas un vienkāršas, piemēram, esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto cenšas katru lietu teikt vienā regulārā veidā.<\/span> <span class=\"sg\" data-s=\"3\">Ar Raku ir citādi.<\/span> <span class=\"sg\" data-s=\"4\">Raku labprāt dod jums vairākus veidus.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc Raku ir negācijas <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Raku ir arī īpašs operators <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Abi nozīmē tieši to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"ru":{"t":"Перекрёстные, гипер- и отрицающие","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть и другие метаоператоры, не только свёртка и zip.<\/span> <span class=\"sg\" data-s=\"1\">Здесь вы узнаете три из них.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перекрёстный — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перекрёстный метаоператор <code>X<\/code> берёт два списка и делает пары.<\/span> <span class=\"sg\" data-s=\"1\">Здесь <strong>каждый<\/strong> элемент одного списка идёт в пару с <strong>каждым<\/strong> элементом другого.<\/span> <span class=\"sg\" data-s=\"2\">Это называют декартовым произведением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Как и zip, <code>X<\/code> тоже может взять оператор.<\/span> <span class=\"sg\" data-s=\"1\">Тогда оператор работает с каждой парой.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> соединяет каждую пару в строку.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> перемножает два числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip проходит по двум спискам одновременно.<\/span> <span class=\"sg\" data-s=\"1\">Перекрёстный оператор соединяет их всеми возможными способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гипероператор — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Гипероператор применяет оператор к <strong>каждому элементу<\/strong> списка.<\/span> <span class=\"sg\" data-s=\"1\">Оператор стоит между стрелками <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Если нужны только символы ASCII, пишите <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">С двумя списками он работает элемент за элементом, как zip.<\/span> <span class=\"sg\" data-s=\"4\">Иногда с одной стороны стоит только одно значение.<\/span> <span class=\"sg\" data-s=\"5\">Тогда он применяет это значение к каждому элементу списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Две стрелки могут смотреть в разные стороны.<\/span> <span class=\"sg\" data-s=\"1\">Направление важно для списков разной длины.<\/span> <span class=\"sg\" data-s=\"2\">Если стрелка смотрит <strong>на<\/strong> список, Raku может повторить этот список.<\/span> <span class=\"sg\" data-s=\"3\">Тогда он такой же длины, как другой список.<\/span> <span class=\"sg\" data-s=\"4\">Вот четыре сочетания в ASCII, с <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku не повторяет ни один список. Списки должны быть одной длины. Иначе вы получите ошибку.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku повторяет <strong>правый<\/strong> список. Тогда он такой же длины, как левый.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku повторяет <strong>левый<\/strong> список. Тогда он такой же длины, как правый.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku повторяет <strong>более короткий<\/strong> список. Тогда он такой же длины, как более длинный.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторяется как 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Есть также форма только с одним операндом.<\/span> <span class=\"sg\" data-s=\"1\">Она вызывает метод у каждого элемента.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> делает все буквы каждой строки заглавными:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Гипероперация также сообщает Raku ещё кое-что.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>может<\/em> выполнять работу параллельно.<\/span> <span class=\"sg\" data-s=\"2\">Тогда несколько частей работы идут одновременно.<\/span> <span class=\"sg\" data-s=\"3\">Позже вы узнаете похожий метод <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Он есть в <a href=\"https://course.raku.org/ru/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">разделе о конкурентном программировании<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицающий — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Поставьте <code>!<\/code> перед оператором сравнения.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы получите обратный результат.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже знаете <code>!=<\/code>, или «не равно».<\/span> <span class=\"sg\" data-s=\"3\">Это просто тот же метаоператор с <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Другие операторы тоже дают <code>True<\/code> или <code>False<\/code>, например <code>eq<\/code> и <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">С ними метаоператор работает так же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не равны как строки\nsay 5 !%% 2;     # True  — 5 не делится на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так что <code>$a !op $b<\/code> — это просто более аккуратный способ записать <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku делает это специально.<\/span> <span class=\"sg\" data-s=\"1\">Некоторые языки специально маленькие и простые, например эсперанто.<\/span> <span class=\"sg\" data-s=\"2\">Эсперанто хочет иметь один правильный способ для каждой мысли.<\/span> <span class=\"sg\" data-s=\"3\">Raku другой.<\/span> <span class=\"sg\" data-s=\"4\">Он с радостью даёт вам несколько способов.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому в Raku есть отрицающий <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">В нём также есть особый оператор <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Они означают ровно одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та же проверка, что и 'a' !eq 'b'<\/code><\/pre>"]]},"uk":{"t":"Перехресний, гіпер- та заперечний метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku є й інші метаоператори, не лише згортка та zip.<\/span> <span class=\"sg\" data-s=\"1\">Тут ви дізнаєтеся про три з них.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перехресний — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перехресний метаоператор <code>X<\/code> бере два списки й робить пари.<\/span> <span class=\"sg\" data-s=\"1\">Тут <strong>кожен<\/strong> елемент одного списку йде в пару з <strong>кожним<\/strong> елементом іншого.<\/span> <span class=\"sg\" data-s=\"2\">Це називають декартовим добутком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Як і zip, <code>X<\/code> теж може брати оператор.<\/span> <span class=\"sg\" data-s=\"1\">Тоді оператор працює з кожною парою.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> з'єднує кожну пару в рядок.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> перемножує два числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip іде по двох списках поруч.<\/span> <span class=\"sg\" data-s=\"1\">Перехресний оператор з'єднує їх усіма можливими способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гіпер — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Гіпероператор використовує оператор для <strong>кожного елемента<\/strong> списку.<\/span> <span class=\"sg\" data-s=\"1\">Оператор стоїть між стрілками <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Лише з символами ASCII ви пишете <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">З двома списками він працює елемент за елементом, як zip.<\/span> <span class=\"sg\" data-s=\"4\">Іноді з одного боку є лише одне значення.<\/span> <span class=\"sg\" data-s=\"5\">Тоді він використовує це значення з кожним елементом списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Дві стрілки можуть дивитися в різні боки.<\/span> <span class=\"sg\" data-s=\"1\">Напрямок важливий, коли списки мають різну довжину.<\/span> <span class=\"sg\" data-s=\"2\">Якщо стрілка дивиться <strong>на<\/strong> список, Raku може повторити цей список.<\/span> <span class=\"sg\" data-s=\"3\">Тоді він стає такої ж довжини, як інший список.<\/span> <span class=\"sg\" data-s=\"4\">Ось чотири варіанти в ASCII, з <code>&lt;&lt;<\/code> і <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku не повторює жодного списку. Списки мають бути однакової довжини. Якщо ні, буде помилка.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku повторює <strong>правий<\/strong> список. Тоді він стає такої ж довжини, як лівий.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku повторює <strong>лівий<\/strong> список. Тоді він стає такої ж довжини, як правий.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku повторює <strong>коротший<\/strong> список. Тоді він стає такої ж довжини, як довший.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторюється як 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Є також форма лише з одним операндом.<\/span> <span class=\"sg\" data-s=\"1\">Вона викликає метод для кожного елемента.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> пише кожен рядок великими літерами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Гіпероперація також каже Raku ще одну річ.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>може<\/em> виконати роботу паралельно.<\/span> <span class=\"sg\" data-s=\"2\">Тоді кілька частин роботи йдуть одночасно.<\/span> <span class=\"sg\" data-s=\"3\">Пізніше ви вивчите схожий метод <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він є в <a href=\"https://course.raku.org/uk/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">розділі про конкурентне програмування<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заперечний — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Поставте <code>!<\/code> перед оператором порівняння.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви отримаєте протилежний результат.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже знаєте <code>!=<\/code>, тобто «не дорівнює».<\/span> <span class=\"sg\" data-s=\"3\">Це просто цей метаоператор разом із <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Інші оператори теж дають <code>True<\/code> або <code>False<\/code>, як-от <code>eq<\/code> і <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Метаоператор працює з ними так само:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не рівні як рядки\nsay 5 !%% 2;     # True  — 5 не ділиться на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тож <code>$a !op $b<\/code> — це просто чистіший спосіб написати <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku робить це навмисно.<\/span> <span class=\"sg\" data-s=\"1\">Деякі мови навмисно малі й прості, як есперанто.<\/span> <span class=\"sg\" data-s=\"2\">Есперанто намагається мати один правильний спосіб для кожної речі.<\/span> <span class=\"sg\" data-s=\"3\">Raku інший.<\/span> <span class=\"sg\" data-s=\"4\">Він охоче дає вам кілька способів.<\/span> <span class=\"sg\" data-s=\"5\">Тому в Raku є заперечний <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Також у ньому є спеціальний оператор <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Обидва означають точно те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та сама перевірка, що й 'a' !eq 'b'<\/code><\/pre>"]]},"bg":{"t":"Кръстосани, хипер и отрицателни","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има още метаоператори, не само редукция и zip.<\/span> <span class=\"sg\" data-s=\"1\">Тук научавате три от тях.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът cross <code>X<\/code> взима два списъка и прави двойки.<\/span> <span class=\"sg\" data-s=\"1\">Тук <strong>всеки<\/strong> елемент от единия списък прави двойка с <strong>всеки<\/strong> елемент от другия.<\/span> <span class=\"sg\" data-s=\"2\">Това се нарича декартово произведение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Както zip, <code>X<\/code> също може да взима оператор.<\/span> <span class=\"sg\" data-s=\"1\">Тогава операторът работи върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> съединява всяка двойка в низ.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> умножава двете числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip минава през два списъка едновременно.<\/span> <span class=\"sg\" data-s=\"1\">Cross ги съчетава по всички възможни начини.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Хипер — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Хипер метаоператорът използва оператор за <strong>всеки елемент<\/strong> от списък.<\/span> <span class=\"sg\" data-s=\"1\">Операторът стои между стрелките <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Само с ASCII знаци пишете <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">С два списъка той работи елемент по елемент, както zip.<\/span> <span class=\"sg\" data-s=\"4\">Понякога едната страна има само една стойност.<\/span> <span class=\"sg\" data-s=\"5\">Тогава той използва тази стойност с всеки елемент от списъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Двете стрелки могат да сочат в различни посоки.<\/span> <span class=\"sg\" data-s=\"1\">Посоката е важна, когато списъците имат различна дължина.<\/span> <span class=\"sg\" data-s=\"2\">Ако стрелката сочи <strong>към<\/strong> списък, Raku може да повтори този списък.<\/span> <span class=\"sg\" data-s=\"3\">Тогава той става дълъг колкото другия списък.<\/span> <span class=\"sg\" data-s=\"4\">Ето четирите комбинации в ASCII, с <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku не повтаря нито един списък. Списъците трябва да са с еднаква дължина. Ако не са, получавате грешка.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku повтаря <strong>десния<\/strong> списък. Тогава той е дълъг колкото левия.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku повтаря <strong>левия<\/strong> списък. Тогава той е дълъг колкото десния.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku повтаря <strong>по-късия<\/strong> списък. Тогава той е дълъг колкото по-дългия.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има и форма само с един операнд.<\/span> <span class=\"sg\" data-s=\"1\">Тя извиква метод за всеки елемент.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> превръща всеки низ в главни букви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Хипер операцията казва на Raku и още нещо.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>може<\/em> да свърши работата паралелно.<\/span> <span class=\"sg\" data-s=\"2\">Тогава няколко части от работата вървят едновременно.<\/span> <span class=\"sg\" data-s=\"3\">По-късно ще научите подобния метод <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той е в <a href=\"https://course.raku.org/bg/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">раздела за конкурентно програмиране<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицание — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Поставете <code>!<\/code> пред оператор за сравнение.<\/span> <span class=\"sg\" data-s=\"1\">Тогава получавате обратния резултат.<\/span> <span class=\"sg\" data-s=\"2\">Вече познавате <code>!=<\/code>, или „не е равно“.<\/span> <span class=\"sg\" data-s=\"3\">Това е просто този метаоператор с <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">И други оператори дават <code>True<\/code> или <code>False<\/code>, като <code>eq<\/code> и <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Метаоператорът работи с тях по същия начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не са равни като низове\nsay 5 !%% 2;     # True  — 5 не се дели на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Така <code>$a !op $b<\/code> е просто по-чист начин да запишете <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku прави това нарочно.<\/span> <span class=\"sg\" data-s=\"1\">Някои езици са малки и прости нарочно, като есперанто.<\/span> <span class=\"sg\" data-s=\"2\">Есперанто иска за всяко нещо да има един правилен начин.<\/span> <span class=\"sg\" data-s=\"3\">Raku е различен.<\/span> <span class=\"sg\" data-s=\"4\">Той с радост ви дава няколко начина.<\/span> <span class=\"sg\" data-s=\"5\">Затова Raku има отрицателния <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Той има и специален оператор <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Двата значат точно едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — същата проверка като 'a' !eq 'b'<\/code><\/pre>"]]},"eo":{"t":"Kruca, hiper kaj neita","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku havas pli da meta-operatoroj, ne nur redukton kaj zipadon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie vi lernas tri el ili.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kruca — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La kruca meta-operatoro <code>X<\/code> prenas du listojn kaj faras parojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, <strong>ĉiu<\/strong> elemento de unu listo iras kun <strong>ĉiu<\/strong> elemento de la alia.<\/span> <span class=\"sg\" data-s=\"2\">Oni nomas tion la kartezia produkto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiel zipado, <code>X<\/code> ankaŭ povas preni operatoron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la operatoro laboras kun ĉiu paro.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> kunigas ĉiun paron en ĉenon.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> multobligas la du nombrojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zipado iras tra du listoj flanko ĉe flanko.<\/span> <span class=\"sg\" data-s=\"1\">Krucado kunmetas ilin en ĉiuj eblaj manieroj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hipera — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hipera meta-operatoro uzas operatoron por <strong>ĉiu elemento<\/strong> de listo.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro staras inter la sagoj <code>»…«<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kun nur askiaj signoj, vi skribas <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kun du listoj, ĝi laboras elemento post elemento, kiel zipado.<\/span> <span class=\"sg\" data-s=\"4\">Foje unu flanko havas nur unu valoron.<\/span> <span class=\"sg\" data-s=\"5\">Tiam ĝi uzas ĉi tiun valoron kun ĉiu elemento de la listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La du sagoj povas montri al malsamaj direktoj.<\/span> <span class=\"sg\" data-s=\"1\">La direkto gravas, kiam la listoj havas malsamajn longojn.<\/span> <span class=\"sg\" data-s=\"2\">Se sago montras <strong>al<\/strong> listo, Raku povas ripeti ĉi tiun liston.<\/span> <span class=\"sg\" data-s=\"3\">Tiam ĝi estas same longa kiel la alia listo.<\/span> <span class=\"sg\" data-s=\"4\">Jen la kvar kombinoj en askia skribo, kun <code>&lt;&lt;<\/code> kaj <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku ripetas neniun liston. La listoj devas havi la saman longon. Se ne, vi ricevas eraron.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku ripetas la <strong>dekstran<\/strong> liston. Tiam ĝi estas same longa kiel la maldekstra.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku ripetas la <strong>maldekstran<\/strong> liston. Tiam ĝi estas same longa kiel la dekstra.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku ripetas la <strong>pli mallongan<\/strong> liston. Tiam ĝi estas same longa kiel la pli longa.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ formo kun nur unu operando.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi vokas metodon sur ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> ŝanĝas ĉiun ĉenon al grandaj literoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hipera operacio ankaŭ diras ion pli al Raku.<\/span> <span class=\"sg\" data-s=\"1\">Raku <em>povas<\/em> fari la laboron paralele.<\/span> <span class=\"sg\" data-s=\"2\">Tiam pluraj partoj de la laboro ruliĝas samtempe.<\/span> <span class=\"sg\" data-s=\"3\">Poste vi lernos la similan metodon <code>.hyper<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas en <a href=\"https://course.raku.org/eo/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">la sekcio pri samtempa programado<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neiga — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Metu <code>!<\/code> antaŭ komparan operatoron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ricevas la malan rezulton.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam konas <code>!=<\/code>, aŭ «ne egala».<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas simple ĉi tiu meta-operatoro kun <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ aliaj operatoroj donas <code>True<\/code> aŭ <code>False<\/code>, kiel <code>eq<\/code> kaj <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La meta-operatoro laboras kun ili same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — ne-egalaj kiel ĉenoj\nsay 5 !%% 2;     # True  — 5 ne estas dividebla per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Do <code>$a !op $b<\/code> estas nur pli pura maniero skribi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku faras tion intence.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj lingvoj estas intence malgrandaj kaj simplaj, kiel Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto celas havi unu regulan manieron diri ĉiun aferon.<\/span> <span class=\"sg\" data-s=\"3\">Raku estas malsama.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi volonte donas al vi plurajn manierojn.<\/span> <span class=\"sg\" data-s=\"5\">Do Raku havas la neigan <code>!eq<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ankaŭ havas specialan operatoron <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">La du signifas ĝuste la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — la sama testo kiel 'a' !eq 'b'<\/code><\/pre>"]]},"la":{"t":"Crux, hyper, et negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku plures meta-operatores habet, non tantum reductionem et zip.<\/span> <span class=\"sg\" data-s=\"1\">Hic tres ex eis discis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Meta-operator cross <code>X<\/code> duas listas sumit et paria facit.<\/span> <span class=\"sg\" data-s=\"1\">Hic <strong>omne<\/strong> elementum unius listae par facit cum <strong>omni<\/strong> elemento alterius.<\/span> <span class=\"sg\" data-s=\"2\">Nomen huius est productum Cartesianum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sicut zip, <code>X<\/code> etiam operatorem accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum operator in quoque pari agit.<\/span> <span class=\"sg\" data-s=\"2\"><code>X~<\/code> quodque par in filum coniungit.<\/span> <span class=\"sg\" data-s=\"3\"><code>X*<\/code> duos numeros multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip duas listas simul percurrit.<\/span> <span class=\"sg\" data-s=\"1\">Cross eas omnibus modis possibilibus coniungit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Meta-operator hyper operatorem in <strong>quoque elemento<\/strong> listae adhibet.<\/span> <span class=\"sg\" data-s=\"1\">Operator inter sagittas <code>»…«<\/code> stat.<\/span> <span class=\"sg\" data-s=\"2\">Cum solis characteribus ASCII, <code>&gt;&gt;…&lt;&lt;<\/code> scribis.<\/span> <span class=\"sg\" data-s=\"3\">Cum duabus listis elementum per elementum operatur, sicut zip.<\/span> <span class=\"sg\" data-s=\"4\">Interdum una pars tantum unum valorem habet.<\/span> <span class=\"sg\" data-s=\"5\">Tum hunc valorem cum omni elemento listae adhibet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Duae sagittae in diversas partes spectare possunt.<\/span> <span class=\"sg\" data-s=\"1\">Directio magni momenti est cum listae diversas longitudines habent.<\/span> <span class=\"sg\" data-s=\"2\">Si sagitta <strong>ad<\/strong> listam spectat, Raku hanc listam repetere potest.<\/span> <span class=\"sg\" data-s=\"3\">Tum tam longa est quam altera lista.<\/span> <span class=\"sg\" data-s=\"4\">Hic sunt quattuor combinationes in ASCII, cum <code>&lt;&lt;<\/code> et <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — Raku nullam listam repetit. Listae eandem longitudinem habere debent. Si non, errorem accipis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — Raku listam <strong>dextram<\/strong> repetit. Tum tam longa est quam sinistra.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — Raku listam <strong>sinistram<\/strong> repetit. Tum tam longa est quam dextra.<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — Raku listam <strong>breviorem<\/strong> repetit. Tum tam longa est quam longior.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repetitur ad 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Est etiam forma cum uno tantum operando.<\/span> <span class=\"sg\" data-s=\"1\">Methodum in omni elemento vocat.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> quodque filum in litteras maiusculas mutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Operatio hyper Raku etiam aliquid plus dicit.<\/span> <span class=\"sg\" data-s=\"1\">Raku opus paralleliter facere <em>potest<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tum plures partes operis simul currunt.<\/span> <span class=\"sg\" data-s=\"3\">Postea methodum similem <code>.hyper<\/code> disces.<\/span> <span class=\"sg\" data-s=\"4\">Eam in <a href=\"https://course.raku.org/la/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sectione de programmatione concurrenti<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negatus — <code>!<\/code><\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pone <code>!<\/code> ante operatorem comparationis.<\/span> <span class=\"sg\" data-s=\"1\">Tum eventum contrarium accipis.<\/span> <span class=\"sg\" data-s=\"2\">Iam <code>!=<\/code> cognoscis, id est “non aequalis”.<\/span> <span class=\"sg\" data-s=\"3\">Est tantum hic meta-operator cum <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Alii operatores etiam <code>True<\/code> vel <code>False<\/code> dant, ut <code>eq<\/code> et <code>%%<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Meta-operator cum eis eodem modo operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non aequales ut fila\nsay 5 !%% 2;     # True  — 5 non est divisibilis per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ergo <code>$a !op $b<\/code> est tantum modus mundior scribendi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku hoc de industria facit.<\/span> <span class=\"sg\" data-s=\"1\">Quaedam linguae de industria parvae et simplices sunt, ut Esperanto.<\/span> <span class=\"sg\" data-s=\"2\">Esperanto pro quaque re unum modum regularem habere vult.<\/span> <span class=\"sg\" data-s=\"3\">Raku non talis est.<\/span> <span class=\"sg\" data-s=\"4\">Libenter tibi plures modos dat.<\/span> <span class=\"sg\" data-s=\"5\">Ergo Raku negatum <code>!eq<\/code> habet.<\/span> <span class=\"sg\" data-s=\"6\">Etiam operatorem specialem <code>ne<\/code> habet.<\/span> <span class=\"sg\" data-s=\"7\">Ambo exacte idem significant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — idem experimentum ac 'a' !eq 'b'<\/code><\/pre>"]]}}}</script>
