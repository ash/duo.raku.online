<script type="application/json" id="page-data">{"u":"advanced/native-types","n":442,"k":"section","pv":"advanced/integers/exercises/prime-check/solution","nx":"advanced/native-types/machine-types","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Native types","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">So far, you have used the types <code>Int<\/code>, <code>Num<\/code>, and <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They are full Raku objects.<\/span> <span class=\"sg\" data-s=\"2\">They are flexible.<\/span> <span class=\"sg\" data-s=\"3\">You can ask them about themselves, for example about their type.<\/span> <span class=\"sg\" data-s=\"4\">And they can be as big as you need.<\/span> <span class=\"sg\" data-s=\"5\">Raku also has a second group of types, the <em>native<\/em> types.<\/span> <span class=\"sg\" data-s=\"6\">They match the way the computer itself keeps values.<\/span> <span class=\"sg\" data-s=\"7\">They are <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, and some integers with a fixed size.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Native types have names in lower case.<\/span> <span class=\"sg\" data-s=\"1\">They are less flexible, but they are faster.<\/span> <span class=\"sg\" data-s=\"2\">Their size is fixed.<\/span> <span class=\"sg\" data-s=\"3\">They also work a little differently from the full types.<\/span> <span class=\"sg\" data-s=\"4\">This section shows what native types are.<\/span> <span class=\"sg\" data-s=\"5\">It also shows how a fixed size leads to overflow.<\/span><\/p>"]]},"de":{"t":"Native Typen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Bisher hast du die Typen <code>Int<\/code>, <code>Num<\/code> und <code>Str<\/code> benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind vollwertige Raku-Objekte.<\/span> <span class=\"sg\" data-s=\"2\">Sie sind flexibel.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst sie nach sich selbst fragen, zum Beispiel nach ihrem Typ.<\/span> <span class=\"sg\" data-s=\"4\">Und sie können so groß sein, wie du sie brauchst.<\/span> <span class=\"sg\" data-s=\"5\">Raku hat auch eine zweite Gruppe von Typen, die <em>nativen<\/em> Typen.<\/span> <span class=\"sg\" data-s=\"6\">Sie passen zu der Art, wie der Computer selbst Werte speichert.<\/span> <span class=\"sg\" data-s=\"7\">Das sind <code>int<\/code>, <code>num<\/code>, <code>str<\/code> und einige Ganzzahlen mit fester Größe.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Native Typen haben Namen in Kleinbuchstaben.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind weniger flexibel, aber sie sind schneller.<\/span> <span class=\"sg\" data-s=\"2\">Ihre Größe ist fest.<\/span> <span class=\"sg\" data-s=\"3\">Sie arbeiten auch ein wenig anders als die vollwertigen Typen.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Abschnitt zeigt, was native Typen sind.<\/span> <span class=\"sg\" data-s=\"5\">Er zeigt auch, wie eine feste Größe zu einem Überlauf führt.<\/span><\/p>"]]},"nl":{"t":"Native typen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe heb je de typen <code>Int<\/code>, <code>Num<\/code> en <code>Str<\/code> gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Het zijn volwaardige Raku-objecten.<\/span> <span class=\"sg\" data-s=\"2\">Ze zijn flexibel.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze dingen over zichzelf vragen, bijvoorbeeld hun type.<\/span> <span class=\"sg\" data-s=\"4\">En ze kunnen zo groot zijn als je nodig hebt.<\/span> <span class=\"sg\" data-s=\"5\">Raku heeft ook een tweede groep typen, de <em>native<\/em> typen.<\/span> <span class=\"sg\" data-s=\"6\">Ze werken zoals de computer zelf waarden bewaart.<\/span> <span class=\"sg\" data-s=\"7\">Het zijn <code>int<\/code>, <code>num<\/code>, <code>str<\/code> en een paar gehele getallen met een vaste grootte.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Native typen hebben namen in kleine letters.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn minder flexibel, maar ze zijn sneller.<\/span> <span class=\"sg\" data-s=\"2\">Hun grootte ligt vast.<\/span> <span class=\"sg\" data-s=\"3\">Ze werken ook een beetje anders dan de volwaardige typen.<\/span> <span class=\"sg\" data-s=\"4\">Dit deel laat zien wat native typen zijn.<\/span> <span class=\"sg\" data-s=\"5\">Het laat ook zien hoe een vaste grootte tot overflow leidt.<\/span><\/p>"]]},"es":{"t":"Tipos nativos","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, has usado los tipos <code>Int<\/code>, <code>Num<\/code> y <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Son objetos completos de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Son flexibles.<\/span> <span class=\"sg\" data-s=\"3\">Puedes preguntarles sobre sí mismos, por ejemplo sobre su tipo.<\/span> <span class=\"sg\" data-s=\"4\">Y pueden ser tan grandes como necesites.<\/span> <span class=\"sg\" data-s=\"5\">Raku también tiene un segundo grupo de tipos, los tipos <em>nativos<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Siguen la forma en que el propio ordenador guarda los valores.<\/span> <span class=\"sg\" data-s=\"7\">Son <code>int<\/code>, <code>num<\/code>, <code>str<\/code> y algunos enteros con un tamaño fijo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Los tipos nativos tienen nombres en minúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Son menos flexibles, pero son más rápidos.<\/span> <span class=\"sg\" data-s=\"2\">Su tamaño es fijo.<\/span> <span class=\"sg\" data-s=\"3\">También funcionan un poco diferente de los tipos completos.<\/span> <span class=\"sg\" data-s=\"4\">Esta sección muestra qué son los tipos nativos.<\/span> <span class=\"sg\" data-s=\"5\">También muestra cómo un tamaño fijo lleva al desbordamiento.<\/span><\/p>"]]},"it":{"t":"Tipi nativi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Finora hai usato i tipi <code>Int<\/code>, <code>Num<\/code> e <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sono oggetti Raku completi.<\/span> <span class=\"sg\" data-s=\"2\">Sono flessibili.<\/span> <span class=\"sg\" data-s=\"3\">Puoi chiedere loro come sono fatti, per esempio di che tipo sono.<\/span> <span class=\"sg\" data-s=\"4\">E possono essere grandi quanto ti serve.<\/span> <span class=\"sg\" data-s=\"5\">Raku ha anche un secondo gruppo di tipi, i tipi <em>nativi<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Corrispondono al modo in cui il computer stesso conserva i valori.<\/span> <span class=\"sg\" data-s=\"7\">Sono <code>int<\/code>, <code>num<\/code>, <code>str<\/code> e alcuni interi di dimensione fissa.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">I tipi nativi hanno nomi in minuscolo.<\/span> <span class=\"sg\" data-s=\"1\">Sono meno flessibili, ma sono più veloci.<\/span> <span class=\"sg\" data-s=\"2\">La loro dimensione è fissa.<\/span> <span class=\"sg\" data-s=\"3\">Funzionano anche in modo un po' diverso dai tipi completi.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione mostra cosa sono i tipi nativi.<\/span> <span class=\"sg\" data-s=\"5\">Mostra anche come una dimensione fissa porta all'overflow.<\/span><\/p>"]]},"lv":{"t":"Natīvie tipi 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Līdz šim jūs esat lietojuši tipus <code>Int<\/code>, <code>Num<\/code> un <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir pilnvērtīgi Raku objekti.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir elastīgi.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat tiem jautāt par tiem pašiem, piemēram, par to tipu.<\/span> <span class=\"sg\" data-s=\"4\">Un tie var būt tik lieli, cik jums vajag.<\/span> <span class=\"sg\" data-s=\"5\">Raku valodā ir arī otra tipu grupa, <em>natīvie<\/em> tipi.<\/span> <span class=\"sg\" data-s=\"6\">Tie atbilst tam, kā pats dators glabā vērtības.<\/span> <span class=\"sg\" data-s=\"7\">Tie ir <code>int<\/code>, <code>num<\/code>, <code>str<\/code> un daži veselie skaitļi ar fiksētu izmēru.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Natīvo tipu nosaukumi ir ar mazajiem burtiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir mazāk elastīgi, bet ātrāki.<\/span> <span class=\"sg\" data-s=\"2\">To izmērs ir fiksēts.<\/span> <span class=\"sg\" data-s=\"3\">Tie arī strādā nedaudz citādi nekā pilnie tipi.<\/span> <span class=\"sg\" data-s=\"4\">Šī sadaļa parāda, kas ir natīvie tipi.<\/span> <span class=\"sg\" data-s=\"5\">Tā arī parāda, kā fiksēts izmērs noved pie pārplūšanas.<\/span><\/p>"]]},"ru":{"t":"Нативные типы","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">До сих пор вы использовали типы <code>Int<\/code>, <code>Num<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это полноценные объекты Raku.<\/span> <span class=\"sg\" data-s=\"2\">Они гибкие.<\/span> <span class=\"sg\" data-s=\"3\">Их можно спросить о них самих, например об их типе.<\/span> <span class=\"sg\" data-s=\"4\">И они могут быть такими большими, как вам нужно.<\/span> <span class=\"sg\" data-s=\"5\">В Raku есть и вторая группа типов — <em>нативные<\/em> типы.<\/span> <span class=\"sg\" data-s=\"6\">Они хранят значения так же, как их хранит сам компьютер.<\/span> <span class=\"sg\" data-s=\"7\">Это <code>int<\/code>, <code>num<\/code>, <code>str<\/code> и несколько целых чисел с фиксированным размером.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Имена нативных типов пишутся строчными буквами.<\/span> <span class=\"sg\" data-s=\"1\">Они менее гибкие, но более быстрые.<\/span> <span class=\"sg\" data-s=\"2\">Их размер фиксирован.<\/span> <span class=\"sg\" data-s=\"3\">Ещё они работают немного иначе, чем полные типы.<\/span> <span class=\"sg\" data-s=\"4\">Этот раздел показывает, что такое нативные типы.<\/span> <span class=\"sg\" data-s=\"5\">Ещё он показывает, как фиксированный размер ведёт к переполнению.<\/span><\/p>"]]},"uk":{"t":"Машинні типи","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Досі ви користувалися типами <code>Int<\/code>, <code>Num<\/code> та <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це повноцінні об'єкти Raku.<\/span> <span class=\"sg\" data-s=\"2\">Вони гнучкі.<\/span> <span class=\"sg\" data-s=\"3\">Їх можна запитати про них самих, наприклад, про їхній тип.<\/span> <span class=\"sg\" data-s=\"4\">І вони можуть бути такими великими, як вам треба.<\/span> <span class=\"sg\" data-s=\"5\">Raku має також другу групу типів, <em>машинні<\/em> типи.<\/span> <span class=\"sg\" data-s=\"6\">Вони відповідають тому, як сам комп'ютер зберігає значення.<\/span> <span class=\"sg\" data-s=\"7\">Це <code>int<\/code>, <code>num<\/code>, <code>str<\/code> і кілька цілих чисел фіксованого розміру.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Машинні типи мають назви з малих літер.<\/span> <span class=\"sg\" data-s=\"1\">Вони менш гнучкі, але швидші.<\/span> <span class=\"sg\" data-s=\"2\">Їхній розмір фіксований.<\/span> <span class=\"sg\" data-s=\"3\">Вони також працюють трохи інакше, ніж повні типи.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ показує, що таке машинні типи.<\/span> <span class=\"sg\" data-s=\"5\">Він також показує, як фіксований розмір веде до переповнення.<\/span><\/p>"]]},"bg":{"t":"Нативни типове 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Досега сте използвали типовете <code>Int<\/code>, <code>Num<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те са пълноценни Raku обекти.<\/span> <span class=\"sg\" data-s=\"2\">Те са гъвкави.<\/span> <span class=\"sg\" data-s=\"3\">Можете да ги питате за самите тях, например за техния тип.<\/span> <span class=\"sg\" data-s=\"4\">И могат да са толкова големи, колкото ви трябва.<\/span> <span class=\"sg\" data-s=\"5\">Raku има и втора група типове, <em>нативните<\/em> типове.<\/span> <span class=\"sg\" data-s=\"6\">Те следват начина, по който самият компютър пази стойностите.<\/span> <span class=\"sg\" data-s=\"7\">Това са <code>int<\/code>, <code>num<\/code>, <code>str<\/code> и някои цели числа с фиксиран размер.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Нативните типове имат имена с малки букви.<\/span> <span class=\"sg\" data-s=\"1\">Те са по-малко гъвкави, но са по-бързи.<\/span> <span class=\"sg\" data-s=\"2\">Размерът им е фиксиран.<\/span> <span class=\"sg\" data-s=\"3\">Те работят и малко по-различно от пълните типове.<\/span> <span class=\"sg\" data-s=\"4\">Тази секция показва какво са нативните типове.<\/span> <span class=\"sg\" data-s=\"5\">Тя показва и как фиксираният размер води до препълване.<\/span><\/p>"]]},"eo":{"t":"Denaskaj tipoj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun vi uzis la tipojn <code>Int<\/code>, <code>Num<\/code> kaj <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas plenaj Raku-objektoj.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas flekseblaj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas demandi ilin pri ili mem, ekzemple pri ilia tipo.<\/span> <span class=\"sg\" data-s=\"4\">Kaj ili povas esti tiom grandaj, kiom vi bezonas.<\/span> <span class=\"sg\" data-s=\"5\">Raku ankaŭ havas duan grupon de tipoj, la <em>indiĝenajn<\/em> tipojn.<\/span> <span class=\"sg\" data-s=\"6\">Ili kongruas kun la maniero, kiel la komputilo mem tenas valorojn.<\/span> <span class=\"sg\" data-s=\"7\">Ili estas <code>int<\/code>, <code>num<\/code>, <code>str<\/code> kaj kelkaj entjeroj kun fiksa grandeco.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Indiĝenaj tipoj havas nomojn per minusklaj literoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas malpli flekseblaj, sed ili estas pli rapidaj.<\/span> <span class=\"sg\" data-s=\"2\">Ilia grandeco estas fiksa.<\/span> <span class=\"sg\" data-s=\"3\">Ili ankaŭ funkcias iom alie ol la plenaj tipoj.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio montras, kio estas indiĝenaj tipoj.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ankaŭ montras, kiel fiksa grandeco kondukas al superfluo.<\/span><\/p>"]]},"la":{"t":"Typi nativi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Adhuc typos <code>Int<\/code>, <code>Num<\/code>, et <code>Str<\/code> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Plena obiecta Raku sunt.<\/span> <span class=\"sg\" data-s=\"2\">Flexibilia sunt.<\/span> <span class=\"sg\" data-s=\"3\">Ea de se ipsis interrogare potes, exempli gratia de typo eorum.<\/span> <span class=\"sg\" data-s=\"4\">Et tam magna esse possunt quam opus est.<\/span> <span class=\"sg\" data-s=\"5\">Raku etiam alterum gregem typorum habet, typos <em>nativos<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Congruunt cum modo quo machina ipsa valores servat.<\/span> <span class=\"sg\" data-s=\"7\">Sunt <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, et aliqui numeri integri magnitudinis fixae.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Typi nativi nomina litteris minusculis habent.<\/span> <span class=\"sg\" data-s=\"1\">Minus flexibiles sunt, sed celeriores sunt.<\/span> <span class=\"sg\" data-s=\"2\">Magnitudo eorum fixa est.<\/span> <span class=\"sg\" data-s=\"3\">Etiam paulo aliter operantur quam typi pleni.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio typos nativos explicat.<\/span> <span class=\"sg\" data-s=\"5\">Etiam ostendit quomodo magnitudo fixa ad superfluxum ducat.<\/span><\/p>"]]}}}</script>
