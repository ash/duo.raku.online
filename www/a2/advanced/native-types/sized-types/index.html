<script type="application/json" id="page-data">{"u":"advanced/native-types/sized-types","n":445,"k":"topic","pv":"advanced/native-types/machine-types/quiz","nx":"advanced/native-types/sized-types/quiz","tr":["advanced","advanced/native-types"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sized types and overflow","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku has the plain <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It also has integers with a fixed number of bits.<\/span> <span class=\"sg\" data-s=\"2\">They are <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, and <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Each of them has an unsigned partner: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, and <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Unsigned values are never negative.<\/span> <span class=\"sg\" data-s=\"5\">The number in the name tells how many bits the value takes.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">A fixed size means a fixed range of values.<\/span> <span class=\"sg\" data-s=\"1\">An <code>int8<\/code> holds values from <code>-128<\/code> to <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A <code>uint8<\/code> holds values from <code>0<\/code> to <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The storage cannot grow.<\/span> <span class=\"sg\" data-s=\"4\">So when a value goes past the top, it wraps around.<\/span> <span class=\"sg\" data-s=\"5\">It comes back at the bottom.<\/span> <span class=\"sg\" data-s=\"6\">This is <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Add one to the largest <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You do not get <code>128<\/code>, because <code>128<\/code> does not fit.<\/span> <span class=\"sg\" data-s=\"2\">The value wraps around to the smallest value, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unsigned types wrap around too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">A normal <code>Int<\/code> is the opposite.<\/span> <span class=\"sg\" data-s=\"1\">It simply grows as big as needed.<\/span> <span class=\"sg\" data-s=\"2\">It never overflows.<\/span> <span class=\"sg\" data-s=\"3\">Sized native types are a deal.<\/span> <span class=\"sg\" data-s=\"4\">You accept a fixed range.<\/span> <span class=\"sg\" data-s=\"5\">In return, the storage is small, fast, and has no surprises.<\/span> <span class=\"sg\" data-s=\"6\">This deal is the whole point of sized native types.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Do you know the range of your data?<\/span> <span class=\"sg\" data-s=\"1\">Do you want fast and small storage?<\/span> <span class=\"sg\" data-s=\"2\">Then use a sized native type.<\/span> <span class=\"sg\" data-s=\"3\">For example, keep bytes of binary data in a <code>uint8<\/code> array.<\/span> <span class=\"sg\" data-s=\"4\">In normal arithmetic, numbers can grow without a limit.<\/span> <span class=\"sg\" data-s=\"5\">There, use <code>Int<\/code>.<\/span><\/p>"]]},"de":{"t":"Typen mit fester Größe und Überlauf","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku hat den einfachen <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es hat auch Ganzzahlen mit einer festen Anzahl von Bits.<\/span> <span class=\"sg\" data-s=\"2\">Das sind <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> und <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jede davon hat einen vorzeichenlosen Partner: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> und <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vorzeichenlose Werte sind nie negativ.<\/span> <span class=\"sg\" data-s=\"5\">Die Zahl im Namen sagt, wie viele Bits der Wert braucht.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Eine feste Größe bedeutet einen festen Bereich von Werten.<\/span> <span class=\"sg\" data-s=\"1\">In einen <code>int8<\/code> passen Werte von <code>-128<\/code> bis <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In einen <code>uint8<\/code> passen Werte von <code>0<\/code> bis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Der Speicher kann nicht wachsen.<\/span> <span class=\"sg\" data-s=\"4\">Wenn ein Wert also über das obere Ende geht, läuft er um.<\/span> <span class=\"sg\" data-s=\"5\">Er kommt am unteren Ende wieder an.<\/span> <span class=\"sg\" data-s=\"6\">Das ist ein <em>Überlauf<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Addiere eins zum größten <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Du bekommst nicht <code>128<\/code>, weil <code>128<\/code> nicht hineinpasst.<\/span> <span class=\"sg\" data-s=\"2\">Der Wert springt zum kleinsten Wert, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vorzeichenlose Typen laufen auch um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ein normaler <code>Int<\/code> ist das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Er wird einfach so groß wie nötig.<\/span> <span class=\"sg\" data-s=\"2\">Er läuft nie über.<\/span> <span class=\"sg\" data-s=\"3\">Native Typen mit fester Größe sind ein Tausch.<\/span> <span class=\"sg\" data-s=\"4\">Du akzeptierst einen festen Bereich.<\/span> <span class=\"sg\" data-s=\"5\">Dafür ist der Speicher klein, schnell und ohne Überraschungen.<\/span> <span class=\"sg\" data-s=\"6\">Dieser Tausch ist der ganze Sinn von nativen Typen mit fester Größe.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kennst du den Bereich deiner Daten?<\/span> <span class=\"sg\" data-s=\"1\">Willst du schnellen und kleinen Speicher?<\/span> <span class=\"sg\" data-s=\"2\">Dann benutze einen nativen Typ mit fester Größe.<\/span> <span class=\"sg\" data-s=\"3\">Speichere zum Beispiel Bytes von Binärdaten in einem <code>uint8<\/code>-Array.<\/span> <span class=\"sg\" data-s=\"4\">Beim normalen Rechnen können Zahlen ohne Grenze wachsen.<\/span> <span class=\"sg\" data-s=\"5\">Benutze dort <code>Int<\/code>.<\/span><\/p>"]]},"nl":{"t":"Typen met vaste grootte en overflow","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku heeft het gewone <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft ook gehele getallen met een vast aantal bits.<\/span> <span class=\"sg\" data-s=\"2\">Dat zijn <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> en <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Elk ervan heeft een unsigned partner: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> en <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Unsigned waarden zijn nooit negatief.<\/span> <span class=\"sg\" data-s=\"5\">Het getal in de naam zegt hoeveel bits de waarde inneemt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een vaste grootte betekent een vast bereik van waarden.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>int8<\/code> bevat waarden van <code>-128<\/code> tot <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>uint8<\/code> bevat waarden van <code>0<\/code> tot <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De opslag kan niet groeien.<\/span> <span class=\"sg\" data-s=\"4\">Als een waarde dus voorbij de bovenkant gaat, wrapt hij.<\/span> <span class=\"sg\" data-s=\"5\">Hij komt terug aan de onderkant.<\/span> <span class=\"sg\" data-s=\"6\">Dit is <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tel één op bij de grootste <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je krijgt dan geen <code>128<\/code>, want <code>128<\/code> past niet.<\/span> <span class=\"sg\" data-s=\"2\">De waarde wrapt naar de kleinste waarde, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unsigned typen wrappen ook:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een normaal <code>Int<\/code> is het tegenovergestelde.<\/span> <span class=\"sg\" data-s=\"1\">Het groeit gewoon zo groot als nodig.<\/span> <span class=\"sg\" data-s=\"2\">Het loopt nooit over.<\/span> <span class=\"sg\" data-s=\"3\">Native typen met vaste grootte zijn een ruil.<\/span> <span class=\"sg\" data-s=\"4\">Je accepteert een vast bereik.<\/span> <span class=\"sg\" data-s=\"5\">In ruil is de opslag klein en snel, zonder verrassingen.<\/span> <span class=\"sg\" data-s=\"6\">Deze ruil is precies het doel van native typen met vaste grootte.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ken je het bereik van je gegevens?<\/span> <span class=\"sg\" data-s=\"1\">Wil je snelle en kleine opslag?<\/span> <span class=\"sg\" data-s=\"2\">Gebruik dan een native type met vaste grootte.<\/span> <span class=\"sg\" data-s=\"3\">Bewaar bijvoorbeeld bytes van binaire gegevens in een <code>uint8<\/code>-array.<\/span> <span class=\"sg\" data-s=\"4\">Bij normaal rekenwerk kunnen getallen zonder grens groeien.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik daar <code>Int<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos con tamaño y desbordamiento","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku tiene el <code>int<\/code> simple.<\/span> <span class=\"sg\" data-s=\"1\">También tiene enteros con un número fijo de bits.<\/span> <span class=\"sg\" data-s=\"2\">Son <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> e <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Cada uno tiene una pareja sin signo: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> y <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Los valores sin signo nunca son negativos.<\/span> <span class=\"sg\" data-s=\"5\">El número del nombre dice cuántos bits ocupa el valor.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un tamaño fijo significa un rango fijo de valores.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> guarda valores de <code>-128<\/code> a <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>uint8<\/code> guarda valores de <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El almacenamiento no puede crecer.<\/span> <span class=\"sg\" data-s=\"4\">Por eso, cuando un valor pasa del tope, da la vuelta.<\/span> <span class=\"sg\" data-s=\"5\">Vuelve a empezar por abajo.<\/span> <span class=\"sg\" data-s=\"6\">Esto es el <em>desbordamiento<\/em> (overflow):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Suma uno al <code>int8<\/code> más grande.<\/span> <span class=\"sg\" data-s=\"1\">No obtienes <code>128<\/code>, porque <code>128<\/code> no cabe.<\/span> <span class=\"sg\" data-s=\"2\">El valor da la vuelta hasta el valor más pequeño, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Los tipos sin signo también dan la vuelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un <code>Int<\/code> normal es lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Simplemente crece tanto como hace falta.<\/span> <span class=\"sg\" data-s=\"2\">Nunca se desborda.<\/span> <span class=\"sg\" data-s=\"3\">Los tipos nativos con tamaño son un trato.<\/span> <span class=\"sg\" data-s=\"4\">Aceptas un rango fijo.<\/span> <span class=\"sg\" data-s=\"5\">A cambio, el almacenamiento es pequeño, rápido y sin sorpresas.<\/span> <span class=\"sg\" data-s=\"6\">Este trato es la idea principal de los tipos nativos con tamaño.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">¿Conoces el rango de tus datos?<\/span> <span class=\"sg\" data-s=\"1\">¿Quieres un almacenamiento rápido y pequeño?<\/span> <span class=\"sg\" data-s=\"2\">Entonces usa un tipo nativo con tamaño.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, guarda bytes de datos binarios en un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">En la aritmética normal, los números pueden crecer sin límite.<\/span> <span class=\"sg\" data-s=\"5\">Ahí, usa <code>Int<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi dimensionati e overflow","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku ha il semplice <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ha anche interi con un numero fisso di bit.<\/span> <span class=\"sg\" data-s=\"2\">Sono <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> e <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ognuno ha un compagno senza segno: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> e <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">I valori senza segno non sono mai negativi.<\/span> <span class=\"sg\" data-s=\"5\">Il numero nel nome dice quanti bit occupa il valore.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Una dimensione fissa vuol dire un intervallo fisso di valori.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> contiene valori da <code>-128<\/code> a <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>uint8<\/code> contiene valori da <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lo spazio non può crescere.<\/span> <span class=\"sg\" data-s=\"4\">Così, quando un valore supera il massimo, si riavvolge.<\/span> <span class=\"sg\" data-s=\"5\">Riparte dal minimo.<\/span> <span class=\"sg\" data-s=\"6\">Questo è l'<em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aggiungi uno al valore più grande di <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non ottieni <code>128<\/code>, perché <code>128<\/code> non ci sta.<\/span> <span class=\"sg\" data-s=\"2\">Il valore si riavvolge al valore più piccolo, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Anche i tipi senza segno si riavvolgono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un normale <code>Int<\/code> è l'opposto.<\/span> <span class=\"sg\" data-s=\"1\">Cresce semplicemente quanto serve.<\/span> <span class=\"sg\" data-s=\"2\">Non va mai in overflow.<\/span> <span class=\"sg\" data-s=\"3\">I tipi nativi di dimensione fissa sono uno scambio.<\/span> <span class=\"sg\" data-s=\"4\">Accetti un intervallo fisso.<\/span> <span class=\"sg\" data-s=\"5\">In cambio, lo spazio è piccolo, veloce e senza sorprese.<\/span> <span class=\"sg\" data-s=\"6\">Questo scambio è proprio il senso dei tipi nativi di dimensione fissa.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Conosci l'intervallo dei tuoi dati?<\/span> <span class=\"sg\" data-s=\"1\">Vuoi uno spazio veloce e piccolo?<\/span> <span class=\"sg\" data-s=\"2\">Allora usa un tipo nativo di dimensione fissa.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, metti i byte di dati binari in un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Nei calcoli normali, i numeri possono crescere senza limiti.<\/span> <span class=\"sg\" data-s=\"5\">Lì usa <code>Int<\/code>.<\/span><\/p>"]]},"lv":{"t":"Izmēra tipi un pārpilde","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir parastais <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir arī veselie skaitļi ar fiksētu bitu skaitu.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> un <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Katram no tiem ir neparakstīts partneris: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> un <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Neparakstītās vērtības nekad nav negatīvas.<\/span> <span class=\"sg\" data-s=\"5\">Skaitlis nosaukumā parāda, cik bitu aizņem vērtība.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Fiksēts izmērs nozīmē fiksētu vērtību diapazonu.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> glabā vērtības no <code>-128<\/code> līdz <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> glabā vērtības no <code>0<\/code> līdz <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Krātuve nevar augt.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc, kad vērtība pārsniedz augšējo robežu, tā apgriežas.<\/span> <span class=\"sg\" data-s=\"5\">Tā atgriežas pie apakšējās robežas.<\/span> <span class=\"sg\" data-s=\"6\">Tā ir <em>pārplūšana<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pieskaitiet vienu lielākajam <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs nesaņemat <code>128<\/code>, jo <code>128<\/code> neietilpst.<\/span> <span class=\"sg\" data-s=\"2\">Vērtība apgriežas uz mazāko vērtību, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Neparakstītie tipi arī apgriežas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ar parastu <code>Int<\/code> ir otrādi.<\/span> <span class=\"sg\" data-s=\"1\">Tas vienkārši kļūst tik liels, cik vajag.<\/span> <span class=\"sg\" data-s=\"2\">Tas nekad nepārplūst.<\/span> <span class=\"sg\" data-s=\"3\">Natīvie tipi ar fiksētu izmēru ir kompromiss.<\/span> <span class=\"sg\" data-s=\"4\">Jūs pieņemat fiksētu diapazonu.<\/span> <span class=\"sg\" data-s=\"5\">Pretī krātuve ir maza, ātra un bez pārsteigumiem.<\/span> <span class=\"sg\" data-s=\"6\">Šis kompromiss ir visa natīvo tipu ar fiksētu izmēru jēga.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Vai jūs zināt savu datu diapazonu?<\/span> <span class=\"sg\" data-s=\"1\">Vai jūs gribat ātru un mazu krātuvi?<\/span> <span class=\"sg\" data-s=\"2\">Tad izmantojiet natīvo tipu ar fiksētu izmēru.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, glabājiet bināro datu baitus <code>uint8<\/code> masīvā.<\/span> <span class=\"sg\" data-s=\"4\">Parastā aritmētikā skaitļi var augt bez robežas.<\/span> <span class=\"sg\" data-s=\"5\">Tur izmantojiet <code>Int<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы с фиксированным размером и переполнение","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В Raku есть простой <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё в нём есть целые числа с фиксированным количеством битов.<\/span> <span class=\"sg\" data-s=\"2\">Это <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> и <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У каждого из них есть беззнаковая пара: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> и <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Беззнаковые значения никогда не бывают отрицательными.<\/span> <span class=\"sg\" data-s=\"5\">Число в имени говорит, сколько битов занимает значение.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фиксированный размер значит фиксированный диапазон значений.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> хранит значения от <code>-128<\/code> до <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> хранит значения от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Место для хранения не может расти.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому когда значение выходит за верхнюю границу, оно идёт по кругу.<\/span> <span class=\"sg\" data-s=\"5\">Оно возвращается снизу.<\/span> <span class=\"sg\" data-s=\"6\">Это <em>переполнение<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прибавьте единицу к самому большому <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы не получите <code>128<\/code>, потому что <code>128<\/code> не помещается.<\/span> <span class=\"sg\" data-s=\"2\">Значение по кругу переходит к самому маленькому значению, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнаковые типы тоже идут по кругу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обычный <code>Int<\/code> — полная противоположность.<\/span> <span class=\"sg\" data-s=\"1\">Он просто растёт, сколько нужно.<\/span> <span class=\"sg\" data-s=\"2\">Он никогда не переполняется.<\/span> <span class=\"sg\" data-s=\"3\">Нативные типы фиксированного размера — это сделка.<\/span> <span class=\"sg\" data-s=\"4\">Вы соглашаетесь на фиксированный диапазон.<\/span> <span class=\"sg\" data-s=\"5\">Взамен хранение получается маленьким, быстрым и без сюрпризов.<\/span> <span class=\"sg\" data-s=\"6\">В этой сделке и есть весь смысл нативных типов фиксированного размера.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Вы знаете диапазон своих данных?<\/span> <span class=\"sg\" data-s=\"1\">Вам нужно быстрое и маленькое хранение?<\/span> <span class=\"sg\" data-s=\"2\">Тогда используйте нативный тип фиксированного размера.<\/span> <span class=\"sg\" data-s=\"3\">Например, храните байты двоичных данных в массиве <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В обычной арифметике числа могут расти без предела.<\/span> <span class=\"sg\" data-s=\"5\">Там используйте <code>Int<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи фіксованого розміру та переповнення","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku має простий <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він також має цілі числа з фіксованою кількістю бітів.<\/span> <span class=\"sg\" data-s=\"2\">Це <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> та <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Кожен із них має беззнакового партнера: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> та <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Беззнакові значення ніколи не бувають від'ємними.<\/span> <span class=\"sg\" data-s=\"5\">Число в назві каже, скільки бітів займає значення.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фіксований розмір означає фіксований діапазон значень.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> містить значення від <code>-128<\/code> до <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> містить значення від <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Сховище не може зрости.<\/span> <span class=\"sg\" data-s=\"4\">Тому коли значення виходить за верхню межу, воно загортається.<\/span> <span class=\"sg\" data-s=\"5\">Воно повертається знизу.<\/span> <span class=\"sg\" data-s=\"6\">Це <em>переповнення<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Додайте одиницю до найбільшого <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви не отримаєте <code>128<\/code>, бо <code>128<\/code> не вміщується.<\/span> <span class=\"sg\" data-s=\"2\">Значення загортається до найменшого значення, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнакові типи теж загортаються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Зі звичайним <code>Int<\/code> усе навпаки.<\/span> <span class=\"sg\" data-s=\"1\">Він просто росте, скільки треба.<\/span> <span class=\"sg\" data-s=\"2\">Він ніколи не переповнюється.<\/span> <span class=\"sg\" data-s=\"3\">Машинні типи фіксованого розміру — це обмін.<\/span> <span class=\"sg\" data-s=\"4\">Ви погоджуєтеся на фіксований діапазон.<\/span> <span class=\"sg\" data-s=\"5\">Натомість сховище маленьке, швидке і без сюрпризів.<\/span> <span class=\"sg\" data-s=\"6\">У цьому обміні весь сенс машинних типів фіксованого розміру.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ви знаєте діапазон своїх даних?<\/span> <span class=\"sg\" data-s=\"1\">Вам потрібне швидке й маленьке сховище?<\/span> <span class=\"sg\" data-s=\"2\">Тоді використовуйте машинний тип фіксованого розміру.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, зберігайте байти двійкових даних у масиві <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">У звичайній арифметиці числа можуть рости без меж.<\/span> <span class=\"sg\" data-s=\"5\">Там використовуйте <code>Int<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове с размер и препълване","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku има обикновения <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Има и цели числа с фиксиран брой битове.<\/span> <span class=\"sg\" data-s=\"2\">Това са <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> и <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Всеки от тях има беззнаков партньор: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> и <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Беззнаковите стойности никога не са отрицателни.<\/span> <span class=\"sg\" data-s=\"5\">Числото в името показва колко бита заема стойността.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Фиксираният размер означава фиксиран диапазон от стойности.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> пази стойности от <code>-128<\/code> до <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> пази стойности от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Хранилището не може да расте.<\/span> <span class=\"sg\" data-s=\"4\">Затова, когато една стойност мине горната граница, тя се обръща.<\/span> <span class=\"sg\" data-s=\"5\">Тя се връща отдолу.<\/span> <span class=\"sg\" data-s=\"6\">Това е <em>препълване<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Добавете единица към най-голямата стойност на <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Не получавате <code>128<\/code>, защото <code>128<\/code> не се побира.<\/span> <span class=\"sg\" data-s=\"2\">Стойността се обръща до най-малката стойност, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнаковите типове също се обръщат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обикновеният <code>Int<\/code> е обратното.<\/span> <span class=\"sg\" data-s=\"1\">Той просто расте колкото е нужно.<\/span> <span class=\"sg\" data-s=\"2\">Никога не препълва.<\/span> <span class=\"sg\" data-s=\"3\">Нативните типове с размер са сделка.<\/span> <span class=\"sg\" data-s=\"4\">Приемате фиксиран диапазон.<\/span> <span class=\"sg\" data-s=\"5\">В замяна хранилището е малко, бързо и без изненади.<\/span> <span class=\"sg\" data-s=\"6\">Тази сделка е целият смисъл на нативните типове с размер.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Знаете ли диапазона на данните си?<\/span> <span class=\"sg\" data-s=\"1\">Искате ли бързо и малко хранилище?<\/span> <span class=\"sg\" data-s=\"2\">Тогава използвайте нативен тип с размер.<\/span> <span class=\"sg\" data-s=\"3\">Например пазете байтове от двоични данни в <code>uint8<\/code> масив.<\/span> <span class=\"sg\" data-s=\"4\">В обикновената аритметика числата могат да растат без граница.<\/span> <span class=\"sg\" data-s=\"5\">Там използвайте <code>Int<\/code>.<\/span><\/p>"]]},"eo":{"t":"Grandecaj tipoj kaj superfluo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku havas la simplan <code>int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ havas entjerojn kun fiksa nombro da bitoj.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code> kaj <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu el ili havas sensignan partneron: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code> kaj <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sensignaj valoroj neniam estas negativaj.<\/span> <span class=\"sg\" data-s=\"5\">La nombro en la nomo diras, kiom da bitoj la valoro prenas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Fiksa grandeco signifas fiksan intervalon de valoroj.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> tenas valorojn de <code>-128<\/code> ĝis <code>127<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> tenas valorojn de <code>0<\/code> ĝis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La stokado ne povas kreski.<\/span> <span class=\"sg\" data-s=\"4\">Do kiam valoro iras preter la supro, ĝi ĉirkaŭvolviĝas.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi revenas ĉe la malsupro.<\/span> <span class=\"sg\" data-s=\"6\">Tio estas <em>superfluo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aldonu unu al la plej granda <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne ricevas <code>128<\/code>, ĉar <code>128<\/code> ne konvenas.<\/span> <span class=\"sg\" data-s=\"2\">La valoro ĉirkaŭvolviĝas al la plej malgranda valoro, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ankaŭ sensignaj tipoj ĉirkaŭvolviĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normala <code>Int<\/code> estas la malo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi simple kreskas tiom, kiom necesas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi neniam superfluas.<\/span> <span class=\"sg\" data-s=\"3\">Fiksgrandaj indiĝenaj tipoj estas interŝanĝo.<\/span> <span class=\"sg\" data-s=\"4\">Vi akceptas fiksan intervalon.<\/span> <span class=\"sg\" data-s=\"5\">Kompense, la stokado estas malgranda, rapida kaj sen surprizoj.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu interŝanĝo estas la tuta celo de fiksgrandaj indiĝenaj tipoj.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi konas la intervalon de viaj datumoj?<\/span> <span class=\"sg\" data-s=\"1\">Ĉu vi volas rapidan kaj malgrandan stokadon?<\/span> <span class=\"sg\" data-s=\"2\">Tiam uzu fiksgrandan indiĝenan tipon.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, tenu bajtojn de binaraj datumoj en <code>uint8<\/code>-tabelo.<\/span> <span class=\"sg\" data-s=\"4\">En normala aritmetiko, nombroj povas kreski sen limo.<\/span> <span class=\"sg\" data-s=\"5\">Tie uzu <code>Int<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi cum magnitudine et superfluentia","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku simplicem <code>int<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam numeros integros cum numero fixo bitorum habet.<\/span> <span class=\"sg\" data-s=\"2\">Sunt <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, et <code>int64<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Quisque eorum socium non signatum habet: <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, et <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Valores non signati numquam negativi sunt.<\/span> <span class=\"sg\" data-s=\"5\">Numerus in nomine est numerus bitorum quos valor occupat.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Magnitudo fixa ambitum fixum valorum significat.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> valores a <code>-128<\/code> ad <code>127<\/code> continet.<\/span> <span class=\"sg\" data-s=\"2\"><code>uint8<\/code> valores ab <code>0<\/code> ad <code>255<\/code> continet.<\/span> <span class=\"sg\" data-s=\"3\">Locus valoris crescere non potest.<\/span> <span class=\"sg\" data-s=\"4\">Itaque cum valor summum transit, circumvolvitur.<\/span> <span class=\"sg\" data-s=\"5\">In imo redit.<\/span> <span class=\"sg\" data-s=\"6\">Hic est <em>superfluxus<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Adde unum ad maximum <code>int8<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non accipis <code>128<\/code>, quia <code>128<\/code> locum non habet.<\/span> <span class=\"sg\" data-s=\"2\">Valor ad minimum valorem, <code>-128<\/code>, circumvolvitur.<\/span> <span class=\"sg\" data-s=\"3\">Typi non signati quoque circumvolvuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalis <code>Int<\/code> contrarium est.<\/span> <span class=\"sg\" data-s=\"1\">Simpliciter tam magnus crescit quam opus est.<\/span> <span class=\"sg\" data-s=\"2\">Numquam superfluit.<\/span> <span class=\"sg\" data-s=\"3\">Typi nativi dimensi pactum sunt.<\/span> <span class=\"sg\" data-s=\"4\">Ambitum fixum accipis.<\/span> <span class=\"sg\" data-s=\"5\">Pro hoc repositorium parvum et celere est, et nihil inexspectatum facit.<\/span> <span class=\"sg\" data-s=\"6\">Hoc pactum est totum propositum typorum nativorum dimensorum.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Scisne ambitum datorum tuorum?<\/span> <span class=\"sg\" data-s=\"1\">Visne repositorium celere et parvum?<\/span> <span class=\"sg\" data-s=\"2\">Tum typum nativum dimensum adhibe.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, bytes datorum binariorum in indice <code>uint8<\/code> serva.<\/span> <span class=\"sg\" data-s=\"4\">In arithmetica normali numeri sine limite crescere possunt.<\/span> <span class=\"sg\" data-s=\"5\">Ibi <code>Int<\/code> adhibe.<\/span><\/p>"]]}}}</script>
