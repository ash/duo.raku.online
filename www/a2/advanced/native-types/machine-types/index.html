 <code>Int<\/code> of <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een native waarde past direct bij een machineregister of machinewoord.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn kleine plekken voor gegevens in de computer.<\/span> <span class=\"sg\" data-s=\"2\">Een normale Raku-waarde heeft een wrapper-object om zich heen.<\/span> <span class=\"sg\" data-s=\"3\">Een native waarde heeft geen wrapper.<\/span> <span class=\"sg\" data-s=\"4\">Daarom zijn native typen sneller en gebruiken ze minder geheugen.<\/span> <span class=\"sg\" data-s=\"5\">Dat is belangrijk bij grote arrays.<\/span> <span class=\"sg\" data-s=\"6\">Het is ook belangrijk bij korte lussen die veel rekenen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Eén ding moet je meteen weten.<\/span> <span class=\"sg\" data-s=\"1\">Een native variabele is nooit ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"2\">Een gewone <code>Int<\/code>-variabele begint als ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> toont hem als <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Maar een native <code>int<\/code> begint op <strong>nul<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde geldt voor native arrays.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf voor zo'n array het native type voor de <code>@<\/code>-variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Zo'n array bewaart zijn elementen als eenvoudige machine-integers.<\/span> <span class=\"sg\" data-s=\"1\">Het zijn geen volwaardige <code>Int<\/code>-objecten.<\/span> <span class=\"sg\" data-s=\"2\">Daarom gebruikt de array minder geheugen.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt vragen wat het type van een native waarde is.<\/span> <span class=\"sg\" data-s=\"4\">Dan zet Raku de waarde automatisch in het bijbehorende volwaardige type.<\/span> <span class=\"sg\" data-s=\"5\">We zeggen dat de waarde <em>geboxt<\/em> wordt.<\/span> <span class=\"sg\" data-s=\"6\">Daarom toont <code>(my int $b).WHAT<\/code> <code>(Int)<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos a nivel de máquina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los tipos nativos tienen nombres en minúsculas: <code>int<\/code>, <code>num<\/code> y <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Declaras una variable con ellos igual que con <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un valor nativo corresponde directamente a un registro o una palabra de la máquina.<\/span> <span class=\"sg\" data-s=\"1\">Son pequeños lugares para datos dentro del ordenador.<\/span> <span class=\"sg\" data-s=\"2\">Un valor normal de Raku tiene un objeto envolvente a su alrededor.<\/span> <span class=\"sg\" data-s=\"3\">Un valor nativo no tiene envoltorio.<\/span> <span class=\"sg\" data-s=\"4\">Por eso los tipos nativos son más rápidos y ocupan menos memoria.<\/span> <span class=\"sg\" data-s=\"5\">Esto es importante en arrays grandes.<\/span> <span class=\"sg\" data-s=\"6\">También es importante en bucles cortos que calculan mucho.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hay algo que debes saber desde el principio.<\/span> <span class=\"sg\" data-s=\"1\">Una variable nativa nunca es indefinida.<\/span> <span class=\"sg\" data-s=\"2\">Una variable <code>Int<\/code> normal empieza como indefinida.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> la muestra como <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Pero un <code>int<\/code> nativo empieza en <strong>cero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo mismo pasa con los arrays nativos.<\/span> <span class=\"sg\" data-s=\"1\">Para declarar uno, escribe el tipo nativo antes de la variable <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un array así guarda sus elementos como enteros simples de la máquina.<\/span> <span class=\"sg\" data-s=\"1\">No son objetos <code>Int<\/code> completos.<\/span> <span class=\"sg\" data-s=\"2\">Por eso el array usa menos memoria.<\/span> <span class=\"sg\" data-s=\"3\">Puedes preguntar a un valor nativo por su tipo.<\/span> <span class=\"sg\" data-s=\"4\">Entonces Raku lo pone automáticamente en el tipo completo correspondiente.<\/span> <span class=\"sg\" data-s=\"5\">Decimos que el valor está <em>encapsulado<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Por eso <code>(my int $b).WHAT<\/code> muestra <code>(Int)<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi a livello macchina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I tipi nativi hanno nomi in minuscolo: <code>int<\/code>, <code>num<\/code> e <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dichiari una variabile con questi tipi proprio come con <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un valore nativo corrisponde direttamente a un registro o a una parola della macchina.<\/span> <span class=\"sg\" data-s=\"1\">Sono piccoli posti per i dati dentro il computer.<\/span> <span class=\"sg\" data-s=\"2\">Un normale valore Raku ha intorno un oggetto wrapper.<\/span> <span class=\"sg\" data-s=\"3\">Un valore nativo non ha wrapper.<\/span> <span class=\"sg\" data-s=\"4\">Così i tipi nativi sono più veloci e occupano meno memoria.<\/span> <span class=\"sg\" data-s=\"5\">Questo è importante negli array grandi.<\/span> <span class=\"sg\" data-s=\"6\">È importante anche nei cicli brevi che fanno molti calcoli.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">C'è una cosa da sapere subito.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile nativa non è mai indefinita.<\/span> <span class=\"sg\" data-s=\"2\">Una normale variabile <code>Int<\/code> all'inizio è indefinita.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> la mostra come <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ma un <code>int<\/code> nativo inizia da <strong>zero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale per gli array nativi.<\/span> <span class=\"sg\" data-s=\"1\">Per dichiararne uno, scrivi il tipo nativo prima della variabile <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un array così conserva i suoi elementi come semplici interi macchina.<\/span> <span class=\"sg\" data-s=\"1\">Non sono oggetti <code>Int<\/code> completi.<\/span> <span class=\"sg\" data-s=\"2\">Così l'array usa meno memoria.<\/span> <span class=\"sg\" data-s=\"3\">Puoi chiedere a un valore nativo il suo tipo.<\/span> <span class=\"sg\" data-s=\"4\">Allora Raku lo mette automaticamente nel tipo completo corrispondente.<\/span> <span class=\"sg\" data-s=\"5\">Diciamo che il valore è <em>boxed<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Per questo <code>(my int $b).WHAT<\/code> mostra <code>(Int)<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mašīnas līmeņa tipi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Natīvo tipu nosaukumi ir ar mazajiem burtiem: <code>int<\/code>, <code>num<\/code> un <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs deklarējat mainīgo ar tiem tāpat kā ar <code>Int<\/code> vai <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Natīvā vērtība tieši atbilst mašīnas reģistram vai vārdam.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir mazas vietas datiem datora iekšienē.<\/span> <span class=\"sg\" data-s=\"2\">Parastai Raku vērtībai apkārt ir iesaiņojuma objekts.<\/span> <span class=\"sg\" data-s=\"3\">Natīvajai vērtībai iesaiņojuma nav.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc natīvie tipi ir ātrāki un aizņem mazāk atmiņas.<\/span> <span class=\"sg\" data-s=\"5\">Tas ir svarīgi lielos masīvos.<\/span> <span class=\"sg\" data-s=\"6\">Tas ir svarīgi arī īsās cilpās, kas daudz rēķina.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vienu lietu vajag zināt uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Natīvais mainīgais nekad nav nedefinēts.<\/span> <span class=\"sg\" data-s=\"2\">Parasts <code>Int<\/code> mainīgais sākumā ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> to parāda kā <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Bet natīvais <code>int<\/code> sākas ar <strong>nulli<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats attiecas uz natīvajiem masīviem.<\/span> <span class=\"sg\" data-s=\"1\">Lai tādu deklarētu, uzrakstiet natīvo tipu pirms <code>@<\/code> mainīgā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šāds masīvs glabā savus elementus kā vienkāršus mašīnas veselos skaitļus.<\/span> <span class=\"sg\" data-s=\"1\">Tie nav pilnvērtīgi <code>Int<\/code> objekti.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc masīvs aizņem mazāk atmiņas.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat jautāt natīvajai vērtībai par tās tipu.<\/span> <span class=\"sg\" data-s=\"4\">Tad Raku automātiski ieliek to atbilstošajā pilnajā tipā.<\/span> <span class=\"sg\" data-s=\"5\">Mēs sakām, ka vērtība ir <em>iesaiņota<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc <code>(my int $b).WHAT<\/code> parāda <code>(Int)<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы машинного уровня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имена нативных типов пишутся строчными буквами: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Переменную с ними объявляют так же, как с <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Нативное значение прямо соответствует машинному регистру или слову.<\/span> <span class=\"sg\" data-s=\"1\">Это маленькие места для данных внутри компьютера.<\/span> <span class=\"sg\" data-s=\"2\">У обычного значения Raku есть объект-обёртка вокруг него.<\/span> <span class=\"sg\" data-s=\"3\">У нативного значения обёртки нет.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому нативные типы быстрее и занимают меньше памяти.<\/span> <span class=\"sg\" data-s=\"5\">Это важно в больших массивах.<\/span> <span class=\"sg\" data-s=\"6\">Это важно и в коротких циклах, которые много считают.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Одну вещь нужно знать сразу.<\/span> <span class=\"sg\" data-s=\"1\">Нативная переменная никогда не бывает неопределённой.<\/span> <span class=\"sg\" data-s=\"2\">Обычная переменная <code>Int<\/code> сначала не определена.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> показывает её как <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Но нативный <code>int<\/code> начинается с <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То же верно для нативных массивов.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы объявить такой массив, напишите нативный тип перед переменной с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Такой массив хранит свои элементы как простые машинные целые числа.<\/span> <span class=\"sg\" data-s=\"1\">Это не полноценные объекты <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому массив занимает меньше памяти.<\/span> <span class=\"sg\" data-s=\"3\">Нативное значение можно спросить о его типе.<\/span> <span class=\"sg\" data-s=\"4\">Тогда Raku автоматически кладёт его в соответствующий полный тип.<\/span> <span class=\"sg\" data-s=\"5\">Мы говорим, что значение <em>упаковано<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Вот почему <code>(my int $b).WHAT<\/code> показывает <code>(Int)<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи машинного рівня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Машинні типи мають назви з малих літер: <code>int<\/code>, <code>num<\/code> та <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви оголошуєте з ними змінну так само, як з <code>Int<\/code> чи <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Машинне значення прямо відповідає регістру або слову машини.<\/span> <span class=\"sg\" data-s=\"1\">Це маленькі місця для даних усередині комп'ютера.<\/span> <span class=\"sg\" data-s=\"2\">Звичайне значення Raku має навколо себе об'єкт-обгортку.<\/span> <span class=\"sg\" data-s=\"3\">Машинне значення не має обгортки.<\/span> <span class=\"sg\" data-s=\"4\">Тому машинні типи швидші й займають менше пам'яті.<\/span> <span class=\"sg\" data-s=\"5\">Це важливо у великих масивах.<\/span> <span class=\"sg\" data-s=\"6\">Це також важливо в коротких циклах, які багато обчислюють.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Одну річ варто знати одразу.<\/span> <span class=\"sg\" data-s=\"1\">Машинна змінна ніколи не буває невизначеною.<\/span> <span class=\"sg\" data-s=\"2\">Звичайна змінна <code>Int<\/code> спершу невизначена.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> показує її як <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">А машинний <code>int<\/code> починає з <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Те саме стосується машинних масивів.<\/span> <span class=\"sg\" data-s=\"1\">Щоб оголосити такий масив, напишіть машинний тип перед змінною з <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Такий масив зберігає свої елементи як прості машинні цілі числа.<\/span> <span class=\"sg\" data-s=\"1\">Це не повні об'єкти <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тому масив займає менше пам'яті.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете запитати машинне значення про його тип.<\/span> <span class=\"sg\" data-s=\"4\">Тоді Raku автоматично кладе його у відповідний повний тип.<\/span> <span class=\"sg\" data-s=\"5\">Ми кажемо, що значення <em>упаковане<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ось чому <code>(my int $b).WHAT<\/code> показує <code>(Int)<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове на машинно ниво","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Нативните типове имат имена с малки букви: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С тях декларирате променлива точно както с <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Нативната стойност съответства директно на машинен регистър или дума.<\/span> <span class=\"sg\" data-s=\"1\">Това са малки места за данни в компютъра.<\/span> <span class=\"sg\" data-s=\"2\">Обикновената Raku стойност има обвиващ обект около себе си.<\/span> <span class=\"sg\" data-s=\"3\">Нативната стойност няма обвивка.<\/span> <span class=\"sg\" data-s=\"4\">Затова нативните типове са по-бързи и заемат по-малко памет.<\/span> <span class=\"sg\" data-s=\"5\">Това е важно при големи масиви.<\/span> <span class=\"sg\" data-s=\"6\">Важно е и при кратки цикли, които смятат много.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Едно нещо трябва да знаете веднага.<\/span> <span class=\"sg\" data-s=\"1\">Нативната променлива никога не е недефинирана.<\/span> <span class=\"sg\" data-s=\"2\">Обикновената <code>Int<\/code> променлива започва като недефинирана.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> я показва като <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Но нативният <code>int<\/code> започва от <strong>нула<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същото важи и за нативните масиви.<\/span> <span class=\"sg\" data-s=\"1\">За да декларирате такъв масив, напишете нативния тип преди променливата с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Такъв масив пази елементите си като прости машинни цели числа.<\/span> <span class=\"sg\" data-s=\"1\">Те не са пълни <code>Int<\/code> обекти.<\/span> <span class=\"sg\" data-s=\"2\">Затова масивът заема по-малко памет.<\/span> <span class=\"sg\" data-s=\"3\">Можете да попитате нативна стойност за нейния тип.<\/span> <span class=\"sg\" data-s=\"4\">Тогава Raku автоматично я слага в съответния пълен тип.<\/span> <span class=\"sg\" data-s=\"5\">Казваме, че стойността е <em>обвита<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ето защо <code>(my int $b).WHAT<\/code> показва <code>(Int)<\/code>.<\/span><\/p>"]]},"eo":{"t":"Maŝin-nivelaj tipoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La indiĝenaj tipoj havas nomojn per minusklaj literoj: <code>int<\/code>, <code>num<\/code> kaj <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi deklaras variablon per ili same kiel per <code>Int<\/code> aŭ <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Indiĝena valoro rekte kongruas kun maŝina registro aŭ vorto.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estas malgrandaj lokoj por datumoj en la komputilo.<\/span> <span class=\"sg\" data-s=\"2\">Normala Raku-valoro havas envolvan objekton ĉirkaŭ si.<\/span> <span class=\"sg\" data-s=\"3\">Indiĝena valoro ne havas envolvaĵon.<\/span> <span class=\"sg\" data-s=\"4\">Do indiĝenaj tipoj estas pli rapidaj kaj prenas malpli da memoro.<\/span> <span class=\"sg\" data-s=\"5\">Tio gravas en grandaj tabeloj.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ankaŭ gravas en mallongaj bukloj, kiuj multe kalkulas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Unu aferon vi devas scii tuj.<\/span> <span class=\"sg\" data-s=\"1\">Indiĝena variablo neniam estas nedefinita.<\/span> <span class=\"sg\" data-s=\"2\">Ordinara <code>Int<\/code>-variablo komenciĝas kiel nedefinita.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> montras ĝin kiel <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sed indiĝena <code>int<\/code> komenciĝas je <strong>nulo<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La samo validas por indiĝenaj tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Por deklari tian tabelon, skribu la indiĝenan tipon antaŭ la <code>@<\/code>-variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tia tabelo tenas siajn elementojn kiel simplajn maŝinajn entjerojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili ne estas plenaj <code>Int<\/code>-objektoj.<\/span> <span class=\"sg\" data-s=\"2\">Do la tabelo uzas malpli da memoro.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas demandi indiĝenan valoron pri ĝia tipo.<\/span> <span class=\"sg\" data-s=\"4\">Tiam Raku aŭtomate metas ĝin en la respondan plenan tipon.<\/span> <span class=\"sg\" data-s=\"5\">Ni diras, ke la valoro estas <em>enkastita<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Tial <code>(my int $b).WHAT<\/code> montras <code>(Int)<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi machinae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Typi nativi nomina litteris minusculis habent: <code>int<\/code>, <code>num<\/code>, et <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Variabilem cum eis declaras sicut cum <code>Int<\/code> vel <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Valor nativus directe registro vel verbo machinae respondet.<\/span> <span class=\"sg\" data-s=\"1\">Haec sunt parva loca pro datis intra computatrum.<\/span> <span class=\"sg\" data-s=\"2\">Valor normalis Raku obiectum involucrum circa se habet.<\/span> <span class=\"sg\" data-s=\"3\">Valor nativus nullum involucrum habet.<\/span> <span class=\"sg\" data-s=\"4\">Itaque typi nativi celeriores sunt et minus memoriae occupant.<\/span> <span class=\"sg\" data-s=\"5\">Hoc in magnis indicibus magni momenti est.<\/span> <span class=\"sg\" data-s=\"6\">Etiam in brevibus cyclis qui multum computant magni momenti est.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Unam rem statim scire debes.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis nativa numquam indefinita est.<\/span> <span class=\"sg\" data-s=\"2\">Variabilis ordinaria <code>Int<\/code> indefinita incipit.<\/span> <span class=\"sg\" data-s=\"3\"><code>say<\/code> eam ut <code>(Int)<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"4\">Sed nativus <code>int<\/code> a <strong>nulla<\/strong> incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem verum est de indicibus nativis.<\/span> <span class=\"sg\" data-s=\"1\">Ut unum declares, typum nativum ante variabilem <code>@<\/code> scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Talis index elementa sua ut simplices integros machinae servat.<\/span> <span class=\"sg\" data-s=\"1\">Non sunt plena obiecta <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque index minus memoriae adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Valorem nativum de typo eius interrogare potes.<\/span> <span class=\"sg\" data-s=\"4\">Tum Raku eum automatice in typum plenum respondentem ponit.<\/span> <span class=\"sg\" data-s=\"5\">Hoc <em>involvere<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"6\">Ideo <code>(my int $b).WHAT<\/code> ostendit <code>(Int)<\/code>.<\/span><\/p>"]]}}}</script>
