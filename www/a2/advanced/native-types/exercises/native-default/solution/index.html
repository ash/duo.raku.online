ninitialized value … in string context”<\/em>. Only the native types <code>num<\/code> and <code>str<\/code> give the start values. These are <code>0<\/code> and the empty string.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Der native Standardwert","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Eine native <code>num<\/code> kann nicht undefiniert sein. Deshalb beginnt sie bei <code>0<\/code>, wie ein nativer <code>int<\/code>. Sie beginnt nicht als <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein nativer <code>str<\/code> beginnt als leerer String. Deshalb steht nichts zwischen den Klammern. Ein nativer Typ enthält nie einen undefinierten Wert.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hier sind die Typen sehr wichtig. Versuche, sie zu entfernen. Schreib stattdessen <code>my $n; my $s;<\/code>. Jetzt sind die Variablen normale Container. Am Anfang sind sie <em>undefiniert<\/em>: Sie enthalten <code>Any<\/code>. Dann gibt <code>say $n<\/code> den Wert <code>(Any)<\/code> aus. Der String interpoliert <code>$s<\/code>, aber <code>$s<\/code> ist undefiniert. Deshalb zeigt Raku eine Warnung: <em>„Use of uninitialized value … in string context“<\/em>. Nur die nativen Typen ginwaarden. Dat zijn <code>0<\/code> en de lege string.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: El valor predeterminado nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>num<\/code> nativo no puede ser indefinido. Por eso empieza en <code>0<\/code>, como un <code>int<\/code> nativo. No empieza como <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>str<\/code> nativo empieza como una cadena vacía. Por eso no hay nada entre los corchetes. Un tipo nativo nunca guarda un valor indefinido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aquí, los tipos son muy importantes. Intenta quitarlos. Escribe <code>my $n; my $s;<\/code> en su lugar. Ahora las variables son contenedores normales. Al principio, son <em>indefinidas<\/em>: guardan <code>Any<\/code>. Entonces <code>say $n<\/code> imprime <code>(Any)<\/code>. La cadena interpola <code>$s<\/code>, pero <code>$s<\/code> es indefinido. Por eso Raku muestra una advertencia: <em>\"Use of uninitialized value … in string context\"<\/em>. Solo los tipos nativos <code>num<\/code> y <code>str<\/code> dan los valores iniciales. Son <code>0<\/code> y la cadena vacía.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Il valore predefinito nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>num<\/code> nativo non può essere indefinito. Quindi inizia da <code>0<\/code>, come un <code>int<\/code> nativo. Non inizia come <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Una <code>str<\/code> nativa inizia come stringa vuota. Così tra le parentesi non c'è niente. Un tipo nativo non contiene mai un valore indefinito.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui i tipi sono molto importanti. Prova a toglierli. Scrivi invece <code>my $n; my $s;<\/code>. Ora le variabili sono normali contenitori. All'inizio sono <em>indefinite<\/em>: contengono <code>Any<\/code>. Allora <code>say $n<\/code> stampa <code>(Any)<\/code>. La stringa interpola <code>$s<\/code>, ma <code>$s<\/code> è indefinita. Così Raku mostra un avviso: <em>\"Use of uninitialized value … in string context\"<\/em>. Solo i tipi nativi <code>num<\/code> e <code>str<\/code> danno i valori iniziali. Sono <code>0<\/code> e la stringa vuota.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Natīvā noklusējuma vērtība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>num<\/code> nevar būt nedefinēts. Tāpēc tas sākas ar <code>0<\/code>, tāpat kā natīvais <code>int<\/code>. Tas nesākas kā <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>str<\/code> sākas kā tukša virkne. Tāpēc starp iekavām nav nekā. Natīvais tips nekad nesatur nedefinētu vērtību.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šeit tipi ir ļoti svarīgi. Pamēģiniet tos noņemt. Tā vietā uzrakstiet <code>my $n; my $s;<\/code>. Tagad mainīgie ir parasti konteineri. Sākumā tie ir <em>nedefinēti<\/em>: tie satur <code>Any<\/code>. Tad <code>say $n<\/code> izdrukā <code>(Any)<\/code>. Virkne interpolē <code>$s<\/code>, bet <code>$s<\/code> ir nedefinēts. Tāpēc Raku parāda brīdinājumu: <em>\"Use of uninitialized value … in string context\"<\/em>. Tikai natīvie tipi <code>num<\/code> un <code>str<\/code> dod sākuma vērtības. Tās ir <code>0<\/code> un tukšā virkne.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Значение по умолчанию нативного типа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>num<\/code> не може бути невизначеним. Тому він починає з <code>0<\/code>, як машинний <code>int<\/code>. Він не починає з <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>str<\/code> починає з порожнього рядка. Тому між дужками нічого немає. Машинний тип ніколи не містить невизначеного значення.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тут типи дуже важливі. Спробуйте їх прибрати. Напишіть натомість <code>my $n; my $s;<\/code>. Тепер змінні — звичайні контейнери. На початку вони <em>невизначені<\/em>: вони містять <code>Any<\/code>. Тоді <code>say $n<\/code> виводить <code>(Any)<\/code>. Рядок інтерполює <code>$s<\/code>, але <code>$s<\/code> невизначена. Тому Raku показує попередження: <em>«Use of uninitialized value … in string context»<\/em>. Тільки машинні типи <code>num<\/code> і <code>str<\/code> дають початкові значення. Це <code>0<\/code> і порожній рядок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Нативна стойност по подразбиране","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативният <code>num<\/code> не може да бъде недефиниран. Затова той започва от <code>0<\/code>, както нативният <code>int<\/code>. Той не започва като <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативният <code>str<\/code> започва като празен низ. Затова между скобите няма нищо. Нативният тип никога не пази недефинирана стойност.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тук типовете са много важни. Опитайте да ги премахнете. Вместо това напишете <code>my $n; my $s;<\/code>. Сега променливите са обикновени контейнери. В началото те са <em>недефинирани<\/em>: пазят <code>Any<\/code>. Тогава <code>say $n<\/code> отпечатва <code>(Any)<\/code>. Низът интерполира <code>$s<\/code>, но <code>$s<\/code> е недефинирана. Затова Raku показва предупреждение: <em>\"Use of uninitialized value … in string context\"<\/em>. Само нативните типове <code>num<\/code> и <code>str<\/code> дават началните стойности. Това са <code>0<\/code> и празният низ.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: La denaska defaŭlto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>num<\/code> ne povas esti nedefinita. Do ĝi komenciĝas je <code>0<\/code>, kiel indiĝena <code>int<\/code>. Ĝi ne komenciĝas kiel <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>str<\/code> komenciĝas kiel malplena ĉeno. Do estas nenio inter la krampoj. Indiĝena tipo neniam tenas nedefinitan valoron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tie, la tipoj estas tre gravaj. Provu forigi ilin. Skribu anstataŭe <code>my $n; my $s;<\/code>. Nun la variabloj estas normalaj ujoj. Komence ili estas <em>nedefinitaj<\/em>: ili tenas <code>Any<\/code>. Tiam <code>say $n<\/code> presas <code>(Any)<\/code>. La ĉeno interpolas <code>$s<\/code>, sed <code>$s<\/code> estas nedefinita. Do Raku montras averton: <em>“Use of uninitialized value … in string context”<\/em>. Nur la indiĝenaj tipoj <code>num<\/code> kaj <code>str<\/code> donas la komencajn valorojn. Tiuj estas <code>0<\/code> kaj la malplena ĉeno.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Praedefinitum nativum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>num<\/code> indefinitus esse non potest. Itaque a <code>0<\/code> incipit, sicut nativus <code>int<\/code>. Non ut <code>(Num)<\/code> incipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>str<\/code> ut chorda vacua incipit. Itaque nihil inter parentheses est. Typus nativus numquam valorem indefinitum continet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic typi valde necessarii sunt. Conare eos removere. Scribe eorum loco <code>my $n; my $s;<\/code>. Nunc variabiles sunt receptacula ordinaria. Initio sunt <em>indefinitae<\/em>: <code>Any<\/code> continent. Tum <code>say $n<\/code> imprimit <code>(Any)<\/code>. Chorda <code>$s<\/code> interpolat, sed <code>$s<\/code> indefinita est. Itaque Raku monitum ostendit: <em>\"Use of uninitialized value … in string context\"<\/em>. Soli typi nativi <code>num<\/code> et <code>str<\/code> valores initiales dant. Hi sunt <code>0<\/code> et chorda vacua.<\/span><\/li><\/ol>"]]}}}</script>
