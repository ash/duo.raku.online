ata-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Uzrakstiet natīvo tipu ar fiksētu izmēru <code>uint8<\/code> pirms <code>@<\/code> masīva. Tad Raku glabā katru elementu vienā baitā. Šis baits ir neparakstīts: tam nav mīnusa zīmes. Šāds masīvs aizņem maz atmiņas. Tas ir labi binārajiem datiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Katram <em>elementam<\/em> ir robeža, <code>0..255<\/code>. Aiz šīs robežas vērtības apgriežas. Bet elementu summai šīs robežas nav. <code>.sum<\/code> ieliek kopsummu parastā <code>Int<\/code>. Tāpēc <code>100 + 200 + 255<\/code> dod pilnu <code>555<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Нативный массив","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 @bytes = 100, 200, 255;\nsay @bytes.sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Напишите нативный тип фиксированного размера <code>uint8<\/code> перед массивом с <code>@<\/code>. Тогда Raku хранит каждый элемент в о
