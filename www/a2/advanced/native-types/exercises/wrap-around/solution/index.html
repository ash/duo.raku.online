ode>.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Überlauf","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein <code>uint8<\/code> geht von <code>0<\/code> bis <code>255<\/code>. Das sind 256 verschiedene Werte. Tatsächlich ist jede Rechnung damit modulo 256. Das Ergebnis ist der Rest nach der Division durch 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Normalerweise ist <code>250 + 10<\/code> gleich <code>260<\/code>. Aber <code>260<\/code> passt nicht hinein. Deshalb läuft der Wert um. Er beginnt wieder unten und landet bei <code>260 - 256 = 4<\/code>. Ein Überlauf ist nicht nur ein Schritt über das obere Ende. Jedes Ergebnis außerhalb des Bereichs kommt in den Bereich zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Auch in die andere Richtung gibt es einen Überlauf. In einem vorzeichenlosen Typ kann ein Dekrement von <code>0<\/code> nicht <code>-1<\/code> ergeben. Deshalb springt der Wert auf den größten Wert, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Rondom wikkelen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een <code>uint8<\/code> gaat van <code>0<\/code> tot <code>255<\/code>. Dat zijn 256 verschillende waarden. Eigenlijk is elke berekening ermee modulo 256. Het resultaat is de rest na deling door 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Normaal is <code>250 + 10<\/code> gelijk aan <code>260<\/code>. Maar <code>260<\/code> past niet. Daarom wrapt de waarde. Hij begint weer onderaan en komt uit op <code>260 - 256 = 4<\/code>. Overflow is niet alleen één stap over de bovenkant. Elk resultaat buiten het bereik komt terug in het bereik.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De andere richting geeft ook overflow. In een unsigned type kan het verlagen van <code>0<\/code> geen <code>-1<\/code> geven. Daarom wrapt de waarde naar de grootste waarde, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Desbordamiento cíclico","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>uint8<\/code> va de <code>0<\/code> a <code>255<\/code>. Son 256 valores distintos. En realidad, toda la aritmética con él es módulo 256. El resultado es el resto de la división entre 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Normalmente, <code>250 + 10<\/code> es <code>260<\/code>. Pero <code>260<\/code> no cabe. Por eso el valor da la vuelta. Empieza otra vez desde abajo y llega a <code>260 - 256 = 4<\/code>. El desbordamiento no es solo un paso por encima del tope. Cualquier resultado fuera del rango vuelve al rango.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">En la otra dirección también hay desbordamiento. En un tipo sin signo, decrementar <code>0<\/code> no puede dar <code>-1<\/code>. Por eso el valor da la vuelta hasta el valor más grande, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Wrap around","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>uint8<\/code> va da <code>0<\/code> a <code>255<\/code>. Sono 256 valori diversi. In pratica, tutti i calcoli su di esso sono modulo 256. Il risultato è il resto della divisione per 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Di solito, <code>250 + 10<\/code> fa <code>260<\/code>. Ma <code>260<\/code> non ci sta. Così il valore si riavvolge. Riparte dal fondo e arriva a <code>260 - 256 = 4<\/code>. L'overflow non è solo un passo oltre il massimo. Ogni risultato fuori dall'intervallo torna nell'intervallo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Anche nell'altra direzione c'è overflow. In un tipo senza segno, decrementare <code>0<\/code> non può dare <code>-1<\/code>. Così il valore si riavvolge al valore più grande, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apgriešanās","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> vērtības ir no <code>0<\/code> līdz <code>255<\/code>. Tās ir 256 dažādas vērtības. Patiesībā visa aritmētika ar to notiek pēc moduļa 256. Rezultāts ir atlikums pēc dalīšanas ar 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Parasti <code>250 + 10<\/code> ir <code>260<\/code>. Bet <code>260<\/code> neietilpst. Tāpēc vērtība apgriežas. Tā sāk atkal no apakšas un nonāk pie <code>260 - 256 = 4<\/code>. Pārplūšana nav tikai viens solis pāri augšai. Jebkurš rezultāts ārpus diapazona atgriežas diapazonā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Arī otrā virzienā notiek pārplūšana. Neparakstītā tipā <code>0<\/code> samazināšana nevar dot <code>-1<\/code>. Tāpēc vērtība apgriežas uz lielāko vērtību, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Циклическое переполнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> идёт от <code>0<\/code> до <code>255<\/code>. Это 256 разных значений. На деле вся арифметика с ним идёт по модулю 256. Результат — это остаток от деления на 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обычно <code>250 + 10<\/code> — это <code>260<\/code>. Но <code>260<\/code> не помещается. Поэтому значение идёт по кругу. Оно начинает снова снизу и попадает в <code>260 - 256 = 4<\/code>. Переполнение — это не только один шаг за верхнюю границу. Любой результат вне диапазона возвращается в диапазон.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В другую сторону тоже бывает переполнение. В беззнаковом типе декремент <code>0<\/code> не может дать <code>-1<\/code>. Поэтому значение по кругу переходит к самому большому значению, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Загортання","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> має значення від <code>0<\/code> до <code>255<\/code>. Це 256 різних значень. Насправді вся арифметика з ним іде за модулем 256. Результат — це остача від ділення на 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зазвичай <code>250 + 10<\/code> — це <code>260<\/code>. Але <code>260<\/code> не вміщується. Тому значення загортається. Воно знову починає знизу і потрапляє на <code>260 - 256 = 4<\/code>. Переповнення — це не лише один крок за верхню межу. Будь-який результат поза діапазоном повертається в діапазон.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В інший бік теж буває переповнення. У беззнаковому типі зменшення <code>0<\/code> не може дати <code>-1<\/code>. Тому значення загортається до найбільшого значення, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Обвиване","b":[["p",1,"<p><span clas Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> iras de <code>0<\/code> ĝis <code>255<\/code>. Tio estas 256 malsamaj valoroj. Fakte, ĉiu aritmetiko kun ĝi estas laŭ modulo 256. La rezulto estas la resto post divido per 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Normale, <code>250 + 10<\/code> estas <code>260<\/code>. Sed <code>260<\/code> ne konvenas. Do la valoro ĉirkaŭvolviĝas. Ĝi rekomencas de la malsupro kaj alvenas al <code>260 - 256 = 4<\/code>. Superfluo ne estas nur unu paŝo super la supro. Ĉiu rezulto ekster la intervalo revenas en la intervalon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ankaŭ la alia direkto superfluas. En sensigna tipo, malpliigo de <code>0<\/code> ne povas doni <code>-1<\/code>. Do la valoro ĉirkaŭvolviĝas al la plej granda valoro, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Circumvolvere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> ab <code>0<\/code> ad <code>255<\/code> pertinet. Sunt 256 valores diversi. Re vera omnis arithmetica in eo est modulo 256. Eventus est residuum post divisionem per 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Normaliter <code>250 + 10<\/code> est <code>260<\/code>. Sed <code>260<\/code> locum non habet. Itaque valor circumvolvitur. Iterum ab imo incipit et ad <code>260 - 256 = 4<\/code> pervenit. Superfluxus non solum unus gradus ultra summum est. Quilibet eventus extra ambitum in ambitum redit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Etiam in altera parte superfluxus est. In typo non signato decrementum <code>0<\/code> non potest <code>-1<\/code> dare. Itaque valor ad maximum valorem, <code>255<\/code>, circumvolvitur.<\/span><\/li><\/ol>"]]}}}</script>
