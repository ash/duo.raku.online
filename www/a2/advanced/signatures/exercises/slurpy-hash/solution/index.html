.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Спочатку сталий позиційний параметр <code>$name<\/code> отримує своє значення. Потім всеїдний <code>*%opts<\/code> збирає всі інші іменовані аргументи. Він кладе їх у хеш.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> сортує пари за ключем. Тож вивід завжди однаковий: <code>colour<\/code> іде перед <code>size<\/code>. <code>.map<\/code> робить з кожної пари рядок <code>key=value<\/code>. Для цього він використовує <code>.key<\/code> і <code>.value<\/code>. Потім <code>.join(', ')<\/code> з'єднує рядки разом.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Останній рядок має всередині значення <code>$name<\/code> і <code>$details<\/code>. Ми побудували <code>$details<\/code> раніше. Результат — <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Slurpy именувани аргументи","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Първо фиксираният позиционен параметър <code>$name<\/code> получава стойността си. След това slurpy <code>*%opts<\/code> събира всички други именувани аргументи. Той ги слага в хеш.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> подрежда двойките по ключ. Затова изходът винаги е един и същ: <code>colour<\/code> идва преди <code>size<\/code>. <code>.map<\/code> прави низ <code>key=value<\/code> от всяка двойка. За това той използва <code>.key<\/code> и <code>.value<\/code>. След това <code>.join(', ')<\/code> съединява низовете.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последният низ съдържа стойностите на <code>$name<\/code> и <code>$details<\/code>. Ние създадохме <code>$details<\/code> по-рано. Резултатът е <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Englutaj nomitaj argumentoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unue la fiksita pozicia parametro <code>$name<\/code> ricevas sian valoron. Poste la engluta <code>*%opts<\/code> kolektas ĉiujn aliajn nomitajn argumentojn. Ĝi metas ilin en hakon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> ordigas la parojn laŭ ŝlosilo. Do la eligo estas ĉiam la sama: <code>colour<\/code> venas antaŭ <code>size<\/code>. <code>.map<\/code> faras ĉenon <code>key=value<\/code> el ĉiu paro. Por tio ĝi uzas <code>.key<\/code> kaj <code>.value<\/code>. Poste <code>.join(', ')<\/code> kunigas la ĉenojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La lasta ĉeno havas en si la valorojn de <code>$name<\/code> kaj <code>$details<\/code>. Ni konstruis <code>$details<\/code> antaŭe. La rezulto estas <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Absorptiva nominata argumenta","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Primum parametrus positionalis fixus <code>$name<\/code> valorem suum accipit. Deinde sorbens <code>*%opts<\/code> omnia cetera argumenta nominata colligit. Ea in mappam ponit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> paria per claves ordinat. Itaque exitus semper idem est: <code>colour<\/code> ante <code>size<\/code> venit. <code>.map<\/code> ex quoque pari chordam <code>clavis=valor<\/code> facit. Ad hoc <code>.key<\/code> et <code>.value<\/code> adhibet. Deinde <code>.join(', ')<\/code> chordas coniungit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Chorda ultima valores <code>$name<\/code> et <code>$details<\/code> in se habet. <code>$details<\/code> antea construximus. Resultatum est <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
