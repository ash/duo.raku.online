ead.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A parameter with a <code>*<\/code> is <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It takes all the arguments that are left.<\/span> <span class=\"sg\" data-s=\"2\">You write a slurpy array with <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It collects any number of positional arguments into an array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can use normal parameters together with a slurpy one.<\/span> <span class=\"sg\" data-s=\"1\">First, the fixed parameters get their values.<\/span> <span class=\"sg\" data-s=\"2\">Everything else goes into the slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A slurpy hash works in the same way.<\/span> <span class=\"sg\" data-s=\"1\">You write it with <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It collects all extra named arguments into a hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The two named arguments become keys of <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So the program prints:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"de":{"t":"Signaturen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Im Abschnitt „Grundlagen“ immt alle Argumente, die übrig sind.<\/span> <span class=\"sg\" data-s=\"2\">Ein Slurpy-Array schreiben Sie mit <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Es sammelt beliebig viele positionale Argumente in einem Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können normale Parameter zusammen mit einem Slurpy-Parameter nutzen.<\/span> <span class=\"sg\" data-s=\"1\">Zuerst bekommen die festen Parameter ihre Werte.<\/span> <span class=\"sg\" data-s=\"2\">Alles andere kommt in das Slurpy-Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Slurpy-Hash funktioniert genauso.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben ihn mit <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er sammelt alle zusätzlichen benannten Argumente in einem Hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die zwei benannten Argumente werden Schlüssel von <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"nl":{"t":"Signaturen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">subroutines geschreven<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ze hadden positionele en benoemde parameters.<\/span> <span class=\"sg\" data-s=\"2\">De parameters hadden standaardwaarden.<\/span> <span class=\"sg\" data-s=\"3\">De lijst van parameters is de <em>signatuur<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Dit onderdeel laat nog twee dingen zien die een signatuur kan doen.<\/span> <span class=\"sg\" data-s=\"5\">Ze kan een parameter optioneel maken.<\/span> <span class=\"sg\" data-s=\"6\">En ze kan elk aantal extra argumenten verzamelen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optionele parameters<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een parameter met een vraagteken erachter is <em>optioneel<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De aanroeper kan hem weglaten.<\/span> <span class=\"sg\" data-s=\"2\">Dan is de parameter ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dus een andere waarde geven.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik daarvoor de defined-or-operator <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier roepen we <code>greet<\/code> aan met één argument.<\/span> <span class=\"sg\" data-s=\"1\">Dan is <code>$greeting<\/code> ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"2\">Daarom geeft <code>//<\/code> dan <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een parameter met een <code>*<\/code> is <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt alle argumenten die over zijn.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft een slurpy array met <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die verzamelt elk aantal positionele argumenten in een array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt gewone parameters samen met een slurpy parameter gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Eerst krijgen de vaste parameters hun waarden.<\/span> <span class=\"sg\" data-s=\"2\">De rest gaat naar de slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een slurpy hash werkt op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft hem met <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hij verzamelt alle extra benoemde argumenten in een hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De twee benoemde argumenten worden sleutels van <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarom drukt het programma af:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"es":{"t":"Firmas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">En la parte de Fundamentos, <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">escribiste subrutinas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tenían parámetros posicionales y nombrados.<\/span> <span class=\"sg\" data-s=\"2\">Los parámetros tenían valores predeterminados.<\/span> <span class=\"sg\" data-s=\"3\">La lista de parámetros es la <em>firma<\/em> (signature).<\/span> <span class=\"sg\" data-s=\"4\">Esta sección muestra dos cosas más que puede hacer una firma.<\/span> <span class=\"sg\" data-s=\"5\">Puede hacer opcional un parámetro.<\/span> <span class=\"sg\" data-s=\"6\">Y puede recoger cualquier número de argumentos extra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros opcionales<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un parámetro con un signo de interrogación detrás es <em>opcional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Quien llama a la función puede dejarlo fuera.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el parámetro está indefinido.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes dar otro valor para usar en su lugar.<\/span> <span class=\"sg\" data-s=\"4\">Usa para esto el operador defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, llamamos a <code>greet<\/code> con un argumento.<\/span> <span class=\"sg\" data-s=\"1\">Entonces <code>$greeting<\/code> está indefinido.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>//<\/code> da <code>'Hello'<\/code> en su lugar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros slurpy<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un parámetro con un <code>*<\/code> es <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Toma todos los argumentos que quedan.<\/span> <span class=\"sg\" data-s=\"2\">Escribes un array slurpy con <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Recoge cualquier número de argumentos posicionales en un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes usar parámetros normales junto con uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">Primero, los parámetros fijos reciben sus valores.<\/span> <span class=\"sg\" data-s=\"2\">Todo lo demás va al array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un hash slurpy funciona de la misma manera.<\/span> <span class=\"sg\" data-s=\"1\">Lo escribes con <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Recoge todos los argumentos nombrados extra en un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los dos argumentos nombrados se convierten en claves de <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"it":{"t":"Firme","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials, hai <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">scritto delle subroutine<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Avevano parametri posizionali e nominati.<\/span> <span class=\"sg\" data-s=\"2\">I parametri avevano valori predefiniti.<\/span> <span class=\"sg\" data-s=\"3\">La lista dei parametri è la <em>signature<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione mostra altre due cose che una signature può fare.<\/span> <span class=\"sg\" data-s=\"5\">Può rendere opzionale un parametro.<\/span> <span class=\"sg\" data-s=\"6\">E può raccogliere un numero qualsiasi di argomenti in più.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri opzionali<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un parametro con un punto interrogativo dopo è <em>opzionale<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il chiamante può non passarlo.<\/span> <span class=\"sg\" data-s=\"2\">Allora il parametro è indefinito.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi dare un valore da usare al suo posto.<\/span> <span class=\"sg\" data-s=\"4\">Usa per questo l'operatore defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui chiamiamo <code>greet<\/code> con un solo argomento.<\/span> <span class=\"sg\" data-s=\"1\">Allora <code>$greeting<\/code> è indefinito.<\/span> <span class=\"sg\" data-s=\"2\">Così <code>//<\/code> dà invece <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri slurpy<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un parametro con un <code>*<\/code> è <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Prende tutti gli argomenti che restano.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi un array slurpy con <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raccoglie un numero qualsiasi di argomenti posizionali in un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi usare parametri normali insieme a uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">Prima i parametri fissi ricevono i loro valori.<\/span> <span class=\"sg\" data-s=\"2\">Tutto il resto va nell'array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un hash slurpy funziona allo stesso modo.<\/span> <span class=\"sg\" data-s=\"1\">Lo scrivi con <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raccoglie tutti gli argomenti nominati in più in un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I due argomenti nominati diventano chiavi di <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Così il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"lv":{"t":"Paraksti","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">rakstījāt apakšprogrammas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tām bija pozicionālie un nosauktie parametri.<\/span> <span class=\"sg\" data-s=\"2\">Parametriem bija noklusējuma vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Parametru saraksts ir <em>signatūra<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Šī sadaļa parāda vēl divas lietas, ko signatūra var darīt.<\/span> <span class=\"sg\" data-s=\"5\">Tā var padarīt parametru neobligātu.<\/span> <span class=\"sg\" data-s=\"6\">Un tā var savākt jebkuru skaitu papildu argumentu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neobligatie parametri<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parametrs ar jautājuma zīmi aiz tā ir <em>neobligāts<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Izsaucējs var to izlaist.<\/span> <span class=\"sg\" data-s=\"2\">Tad parametrs ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat dot vērtību, ko izmantot tā vietā.<\/span> <span class=\"sg\" data-s=\"4\">Šim nolūkam izmantojiet definēts-vai operatoru <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit mēs izsaucam <code>greet<\/code> ar vienu argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>$greeting<\/code> ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>//<\/code> tā vietā dod <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzsucosie parametri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametrs ar <code>*<\/code> ir <em>uzsūcošs<\/em> (slurpy).<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem visus argumentus, kas ir palikuši.<\/span> <span class=\"sg\" data-s=\"2\">Uzsūcošu masīvu raksta ar <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas savāc jebkuru skaitu pozicionālo argumentu masīvā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat lietot parastus parametrus kopā ar uzsūcošu.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms fiksētie parametri saņem savas vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Viss pārējais nonāk uzsūcošajā masīvā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzsūcošs hešs darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"1\">To raksta ar <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas savāc visus papildu nosauktos argumentus hešā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abi nosauktie argumenti kļūst par <code>%options<\/code> atslēgām.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"ru":{"t":"Сигнатуры","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В разделе \"Основы\" вы <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">писали подпрограммы<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">У них были позиционные и именованные параметры.<\/span> <span class=\"sg\" data-s=\"2\">У параметров были значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"3\">Список параметров — это <em>сигнатура<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Этот раздел показывает ещё две вещи, которые умеет сигнатура.<\/span> <span class=\"sg\" data-s=\"5\">Она может сделать параметр необязательным.<\/span> <span class=\"sg\" data-s=\"6\">И она может собрать любое количество дополнительных аргументов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необязательные параметры<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Параметр со знаком вопроса после него — <em>необязательный<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">При вызове его можно пропустить.<\/span> <span class=\"sg\" data-s=\"2\">Тогда параметр не определён.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно дать другое значение взамен.<\/span> <span class=\"sg\" data-s=\"4\">Для этого используйте оператор defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь мы вызываем <code>greet<\/code> с одним аргументом.<\/span> <span class=\"sg\" data-s=\"1\">Тогда <code>$greeting<\/code> не определён.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>//<\/code> даёт вместо него <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Поглощающие параметры<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Параметр с символом <code>*<\/code> — <em>поглощающий<\/em> (slurpy).<\/span> <span class=\"sg\" data-s=\"1\">Он берёт все аргументы, которые остались.<\/span> <span class=\"sg\" data-s=\"2\">Поглощающий массив вы пишете как <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он собирает любое количество позиционных аргументов в массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можно использовать обычные параметры вместе с поглощающим.<\/span> <span class=\"sg\" data-s=\"1\">Сначала свои значения получают фиксированные параметры.<\/span> <span class=\"sg\" data-s=\"2\">Всё остальное попадает в поглощающий массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поглощающий хеш работает так же.<\/span> <span class=\"sg\" data-s=\"1\">Вы пишете его как <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он собирает все дополнительные именованные аргументы в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Два именованных аргумента становятся ключами <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому программа выводит:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"uk":{"t":"Сигнатури","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">писали підпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Вони мали позиційні та іменовані параметри.<\/span> <span class=\"sg\" data-s=\"2\">Параметри мали типові значення.<\/span> <span class=\"sg\" data-s=\"3\">Список параметрів — це <em>сигнатура<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ показує ще дві речі, які вміє сигнатура.<\/span> <span class=\"sg\" data-s=\"5\">Вона може зробити параметр необов'язковим.<\/span> <span class=\"sg\" data-s=\"6\">А ще вона може збирати будь-яку кількість зайвих аргументів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необов'язкові параметри<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Параметр зі знаком питання після нього — <em>необов'язковий<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Той, хто викликає, може його пропустити.<\/span> <span class=\"sg\" data-s=\"2\">Тоді параметр невизначений.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете дати значення на заміну.<\/span> <span class=\"sg\" data-s=\"4\">Використайте для цього оператор «визначене або» <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут ми викликаємо <code>greet<\/code> з одним аргументом.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>$greeting<\/code> невизначений.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>//<\/code> дає замість нього <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Всеїдні параметри<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Параметр із <code>*<\/code> — <em>всеїдний<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Він бере всі аргументи, що лишилися.<\/span> <span class=\"sg\" data-s=\"2\">Ви записуєте всеїдний масив як <code>*@<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він збирає будь-яку кількість позиційних аргументів у масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можна використовувати звичайні параметри разом із всеїдним.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку сталі параметри отримують свої значення.<\/span> <span class=\"sg\" data-s=\"2\">Усе інше йде у всеїдний масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеїдний хеш працює так само.<\/span> <span class=\"sg\" data-s=\"1\">Ви записуєте його як <code>*%<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він збирає всі зайві іменовані аргументи в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Два іменовані аргументи стають ключами <code>%options<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"bg":{"t":"Сигнатури","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ вие <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">написахте подпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Те имаха позиционни и именувани параметри.<\/span> <span class=\"sg\" data-s=\"2\">Параметрите имаха стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">Списъкът от параметри е <em>сигнатурата<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Този раздел показва още две неща, които сигнатурата може да прави.<\/span> <span class=\"sg\" data-s=\"5\">Тя може да направи параметър незадължителен.<\/span> <span class=\"sg\" data-s=\"6\">И може да събира всякакъв брой допълнителни аргументи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Незадължителни параметри<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Параметър с въпросителен знак след него е <em>незадължителен<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Извикващият код може да го пропусне.<\/span> <span class=\"sg\" data-s=\"2\">Тогава параметърът е недефиниран.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да дадете друга стойност вместо него.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте за това оператора defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук извикваме <code>greet<\/code> с един аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Тогава <code>$greeting<\/code> е недефинирана.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>//<\/code> дава <code>'Hello'<\/code> вместо нея.<\/span><\/p>"],["h",1,"<h3><span class=\" tials/functions/\" target=\"_blank\" rel=\"noopener\">skribis subrutinojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili havis poziciajn kaj nomitajn parametrojn.<\/span> <span class=\"sg\" data-s=\"2\">La parametroj havis defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"3\">La listo de parametroj estas la <em>subskribo<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio montras du pliajn aferojn, kiujn subskribo povas fari.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi povas fari parametron nedeviga.<\/span> <span class=\"sg\" data-s=\"6\">Kaj ĝi povas kolekti ajnan nombron da kromaj argumentoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nedevigaj parametroj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parametro kun demandosigno post ĝi estas <em>nedeviga<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La vokanto povas ellasi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la parametro estas nedifinita.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas doni alian valoron por uzi anstataŭe.<\/span> <span class=\"sg\" data-s=\"4\">Uzu por tio la difinita-aŭ operatoron <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie ni vokas <code>greet<\/code> kun unu argumento.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>$greeting<\/code> estas nedifinita.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>//<\/code> donas <code>'Hello'<\/code> anstataŭe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Englutaj parametroj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametro kun <code>*<\/code> estas <em>engluta<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas ĉiujn argumentojn, kiuj restas.<\/span> <span class=\"sg\" data-s=\"2\">
