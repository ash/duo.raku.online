<script type="application/json" id="page-data">{"u":"advanced/sequences/lazy","n":504,"k":"topic","pv":"advanced/sequences/patterns/quiz","nx":"advanced/sequences/exercises","tr":["advanced","advanced/sequences"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Lazy and infinite sequences","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A sequence does not need to compute all its values at once.<\/span> <span class=\"sg\" data-s=\"1\">Sequences in Raku are <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku makes each value only when you really need it.<\/span> <span class=\"sg\" data-s=\"3\">So you can describe a sequence with no end at all.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">For an infinite sequence, use <code>Inf<\/code> as the endpoint.<\/span> <span class=\"sg\" data-s=\"1\">Raku does the <code>=<\/code> before the <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">We say that <code>...<\/code> binds more loosely than <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So put the sequence in parentheses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Look at <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> without parentheses.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Here, the variable gets only <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">After that, Raku builds the sequence on its own.<\/span> <span class=\"sg\" data-s=\"4\">Nobody uses this endless sequence.<\/span> <span class=\"sg\" data-s=\"5\">But Raku tries to compute it.<\/span> <span class=\"sg\" data-s=\"6\">So the program hangs and never finishes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So far, Raku computes nothing.<\/span> <span class=\"sg\" data-s=\"1\">The sequence gives you values only when you ask for them.<\/span> <span class=\"sg\" data-s=\"2\">The <code>head<\/code> method takes the first few values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The sequence is infinite.<\/span> <span class=\"sg\" data-s=\"1\">But Raku makes only the first five numbers.<\/span> <span class=\"sg\" data-s=\"2\">Without laziness, the program tries to build the whole endless sequence.<\/span> <span class=\"sg\" data-s=\"3\">Such a program never finishes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A finite sequence has an end.<\/span> <span class=\"sg\" data-s=\"1\">For such a sequence, the <code>tail<\/code> method takes values from the end:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Laziness lets you do two things separately.<\/span> <span class=\"sg\" data-s=\"1\">First, you give the <em>description<\/em> of a sequence.<\/span> <span class=\"sg\" data-s=\"2\">Later, you decide how much of it to use.<\/span><\/p>"]]},"de":{"t":"Lazy und unendliche Sequenzen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Sequenz muss nicht alle ihre Werte auf einmal berechnen.<\/span> <span class=\"sg\" data-s=\"1\">Sequenzen in Raku sind <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku macht jeden Wert erst, wenn du ihn wirklich brauchst.<\/span> <span class=\"sg\" data-s=\"3\">Also kannst du eine Sequenz ganz ohne Ende beschreiben.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Für eine unendliche Sequenz benutze <code>Inf<\/code> als Endpunkt.<\/span> <span class=\"sg\" data-s=\"1\">Raku macht das <code>=<\/code> vor dem <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wir sagen: <code>...<\/code> bindet schwächer als <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Also setze die Sequenz in Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Sieh dir <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> ohne Klammern an.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Hier bekommt die Variable nur <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Danach baut Raku die Sequenz für sich allein.<\/span> <span class=\"sg\" data-s=\"4\">Niemand benutzt diese endlose Sequenz.<\/span> <span class=\"sg\" data-s=\"5\">Aber Raku versucht, sie zu berechnen.<\/span> <span class=\"sg\" data-s=\"6\">Also hängt das Programm und wird nie fertig.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bis jetzt berechnet Raku nichts.<\/span> <span class=\"sg\" data-s=\"1\">Die Sequenz gibt dir Werte nur, wenn du nach ihnen fragst.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>head<\/code> nimmt die ersten paar Werte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Sequenz ist unendlich.<\/span> <span class=\"sg\" data-s=\"1\">Aber Raku macht nur die ersten fünf Zahlen.<\/span> <span class=\"sg\" data-s=\"2\">Ohne Laziness versucht das Programm, die ganze endlose Sequenz zu bauen.<\/span> <span class=\"sg\" data-s=\"3\">So ein Programm wird nie fertig.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine endliche Sequenz hat ein Ende.<\/span> <span class=\"sg\" data-s=\"1\">Bei so einer Sequenz nimmt die Methode <code>tail<\/code> Werte vom Ende:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit Laziness kannst du zwei Dinge getrennt machen.<\/span> <span class=\"sg\" data-s=\"1\">Zuerst gibst du die <em>Beschreibung<\/em> einer Sequenz.<\/span> <span class=\"sg\" data-s=\"2\">Später entscheidest du, wie viel davon du benutzt.<\/span><\/p>"]]},"nl":{"t":"Luie en oneindige reeksen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een reeks hoeft niet al zijn waarden tegelijk te berekenen.<\/span> <span class=\"sg\" data-s=\"1\">Reeksen in Raku zijn <em>lui<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">Raku maakt elke waarde pas als je die echt nodig hebt.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je een reeks helemaal zonder einde beschrijven.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Gebruik voor een oneindige reeks <code>Inf<\/code> als eindpunt.<\/span> <span class=\"sg\" data-s=\"1\">Raku doet de <code>=<\/code> eerder dan de <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">We zeggen dat <code>...<\/code> minder sterk bindt dan <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Zet de reeks dus tussen haakjes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kijk naar <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> zonder haakjes.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Hier krijgt de variabele alleen <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Daarna bouwt Raku de reeks apart op.<\/span> <span class=\"sg\" data-s=\"4\">Niemand gebruikt deze eindeloze reeks.<\/span> <span class=\"sg\" data-s=\"5\">Maar Raku probeert hem te berekenen.<\/span> <span class=\"sg\" data-s=\"6\">Dus loopt het programma vast en stopt het nooit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe berekent Raku niets.<\/span> <span class=\"sg\" data-s=\"1\">De reeks geeft je alleen waarden als je erom vraagt.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>head<\/code> neemt de eerste paar waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De reeks is oneindig.<\/span> <span class=\"sg\" data-s=\"1\">Maar Raku maakt alleen de eerste vijf getallen.<\/span> <span class=\"sg\" data-s=\"2\">Zonder luiheid probeert het programma de hele eindeloze reeks te bouwen.<\/span> <span class=\"sg\" data-s=\"3\">Zo'n programma is nooit klaar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een eindige reeks heeft een einde.<\/span> <span class=\"sg\" data-s=\"1\">Bij zo'n reeks neemt de methode <code>tail<\/code> waarden van het einde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Door luiheid kun je twee dingen apart doen.<\/span> <span class=\"sg\" data-s=\"1\">Eerst geef je de <em>beschrijving<\/em> van een reeks.<\/span> <span class=\"sg\" data-s=\"2\">Later beslis je hoeveel je ervan gebruikt.<\/span><\/p>"]]},"es":{"t":"Secuencias perezosas e infinitas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una secuencia no necesita calcular todos sus valores a la vez.<\/span> <span class=\"sg\" data-s=\"1\">Las secuencias en Raku son <em>perezosas<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">Raku crea cada valor solo cuando de verdad lo necesitas.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes describir una secuencia sin ningún final.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Para una secuencia infinita, usa <code>Inf<\/code> como punto final.<\/span> <span class=\"sg\" data-s=\"1\">Raku hace el <code>=<\/code> antes que el <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Decimos que <code>...<\/code> tiene menor precedencia que <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Por eso pon la secuencia entre paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Mira <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> sin paréntesis.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Aquí, la variable recibe solo <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Después, Raku construye la secuencia por su cuenta.<\/span> <span class=\"sg\" data-s=\"4\">Nadie usa esta secuencia sin fin.<\/span> <span class=\"sg\" data-s=\"5\">Pero Raku intenta calcularla.<\/span> <span class=\"sg\" data-s=\"6\">Así que el programa se cuelga y nunca termina.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, Raku no calcula nada.<\/span> <span class=\"sg\" data-s=\"1\">La secuencia te da valores solo cuando los pides.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>head<\/code> toma los primeros valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La secuencia es infinita.<\/span> <span class=\"sg\" data-s=\"1\">Pero Raku crea solo los primeros cinco números.<\/span> <span class=\"sg\" data-s=\"2\">Sin la evaluación perezosa, el programa intenta construir toda la secuencia sin fin.<\/span> <span class=\"sg\" data-s=\"3\">Un programa así nunca termina.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una secuencia finita tiene un final.<\/span> <span class=\"sg\" data-s=\"1\">En una secuencia así, el método <code>tail<\/code> toma valores del final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La evaluación perezosa te deja hacer dos cosas por separado.<\/span> <span class=\"sg\" data-s=\"1\">Primero, das la <em>descripción<\/em> de una secuencia.<\/span> <span class=\"sg\" data-s=\"2\">Después, decides cuánto de ella usar.<\/span><\/p>"]]},"it":{"t":"Sequenze lazy e infinite","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una sequenza non deve calcolare tutti i suoi valori insieme.<\/span> <span class=\"sg\" data-s=\"1\">Le sequenze in Raku sono <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku crea ogni valore solo quando ti serve davvero.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi descrivere una sequenza senza nessuna fine.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per una sequenza infinita, usa <code>Inf<\/code> come punto finale.<\/span> <span class=\"sg\" data-s=\"1\">Raku esegue <code>=<\/code> prima di <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Diciamo che <code>...<\/code> ha una precedenza più bassa di <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Quindi metti la sequenza tra parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Guarda <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> senza parentesi.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Qui la variabile riceve solo <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, Raku costruisce la sequenza a parte.<\/span> <span class=\"sg\" data-s=\"4\">Nessuno usa questa sequenza senza fine.<\/span> <span class=\"sg\" data-s=\"5\">Ma Raku prova a calcolarla.<\/span> <span class=\"sg\" data-s=\"6\">Così il programma si blocca e non finisce mai.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per ora Raku non calcola niente.<\/span> <span class=\"sg\" data-s=\"1\">La sequenza ti dà i valori solo quando li chiedi.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>head<\/code> prende i primi valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La sequenza è infinita.<\/span> <span class=\"sg\" data-s=\"1\">Ma Raku crea solo i primi cinque numeri.<\/span> <span class=\"sg\" data-s=\"2\">Senza la valutazione lazy, il programma prova a costruire tutta la sequenza senza fine.<\/span> <span class=\"sg\" data-s=\"3\">Un programma così non finisce mai.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una sequenza finita ha una fine.<\/span> <span class=\"sg\" data-s=\"1\">Per una sequenza così, il metodo <code>tail<\/code> prende i valori dalla fine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La valutazione lazy ti permette di fare due cose separate.<\/span> <span class=\"sg\" data-s=\"1\">Prima dai la <em>descrizione<\/em> di una sequenza.<\/span> <span class=\"sg\" data-s=\"2\">Dopo decidi quanto ne vuoi usare.<\/span><\/p>"]]},"lv":{"t":"Slinkas un bezgalīgas secības","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Virknei nav jāaprēķina visas savas vērtības uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Raku virknes ir <em>slinkas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku rada katru vērtību tikai tad, kad jums to tiešām vajag.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat aprakstīt virkni pavisam bez beigām.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bezgalīgai virknei izmantojiet <code>Inf<\/code> kā beigu punktu.<\/span> <span class=\"sg\" data-s=\"1\">Raku izpilda <code>=<\/code> pirms <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mēs sakām, ka <code>...<\/code> saistās vaļīgāk nekā <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc ielieciet virkni iekavās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Paskatieties uz <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> bez iekavām.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Šeit mainīgais saņem tikai <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam Raku būvē virkni atsevišķi.<\/span> <span class=\"sg\" data-s=\"4\">Neviens šo bezgalīgo virkni neizmanto.<\/span> <span class=\"sg\" data-s=\"5\">Bet Raku mēģina to aprēķināt.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc programma uzkaras un nekad nebeidzas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pagaidām Raku neko neaprēķina.<\/span> <span class=\"sg\" data-s=\"1\">Virkne dod jums vērtības tikai tad, kad jūs tās prasāt.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>head<\/code> paņem pirmās dažas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Virkne ir bezgalīga.<\/span> <span class=\"sg\" data-s=\"1\">Bet Raku rada tikai pirmos piecus skaitļus.<\/span> <span class=\"sg\" data-s=\"2\">Bez slinkuma programma mēģina uzbūvēt visu bezgalīgo virkni.<\/span> <span class=\"sg\" data-s=\"3\">Šāda programma nekad nebeidz darbu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Galīgai virknei ir beigas.<\/span> <span class=\"sg\" data-s=\"1\">Šādai virknei metode <code>tail<\/code> paņem vērtības no beigām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Slinkums ļauj jums darīt divas lietas atsevišķi.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms jūs dodat virknes <em>aprakstu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vēlāk jūs izlemjat, cik daudz no tās izmantot.<\/span><\/p>"]]},"ru":{"t":"Ленивые и бесконечные последовательности","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Последовательности не нужно вычислять все свои значения сразу.<\/span> <span class=\"sg\" data-s=\"1\">Последовательности в Raku <em>ленивые<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku создаёт каждое значение, только когда оно вам действительно нужно.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно описать последовательность вообще без конца.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для бесконечной последовательности используйте <code>Inf<\/code> как конечную точку.<\/span> <span class=\"sg\" data-s=\"1\">Raku выполняет <code>=<\/code> раньше, чем <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Мы говорим, что <code>...<\/code> связывает слабее, чем <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому напишите последовательность в скобках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> без скобок.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Здесь переменная получает только <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">После этого Raku строит последовательность отдельно.<\/span> <span class=\"sg\" data-s=\"4\">Никто не использует эту бесконечную последовательность.<\/span> <span class=\"sg\" data-s=\"5\">Но Raku пытается её вычислить.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому программа зависает и никогда не заканчивается.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пока что Raku ничего не вычисляет.<\/span> <span class=\"sg\" data-s=\"1\">Последовательность даёт вам значения, только когда вы их просите.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> берёт первые несколько значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Последовательность бесконечная.<\/span> <span class=\"sg\" data-s=\"1\">Но Raku создаёт только первые пять чисел.<\/span> <span class=\"sg\" data-s=\"2\">Без ленивости программа пытается построить всю бесконечную последовательность.<\/span> <span class=\"sg\" data-s=\"3\">Такая программа никогда не заканчивается.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У конечной последовательности есть конец.<\/span> <span class=\"sg\" data-s=\"1\">Для такой последовательности метод <code>tail<\/code> берёт значения с конца:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ленивость позволяет делать две вещи отдельно.<\/span> <span class=\"sg\" data-s=\"1\">Сначала вы даёте <em>описание<\/em> последовательности.<\/span> <span class=\"sg\" data-s=\"2\">Позже вы решаете, сколько из неё взять.<\/span><\/p>"]]},"uk":{"t":"Ліниві та нескінченні послідовності","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Послідовності не треба обчислювати всі свої значення одразу.<\/span> <span class=\"sg\" data-s=\"1\">Послідовності в Raku — <em>ліниві<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku створює кожне значення лише тоді, коли воно вам справді потрібне.<\/span> <span class=\"sg\" data-s=\"3\">Тож можна описати послідовність зовсім без кінця.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для нескінченної послідовності використайте <code>Inf<\/code> як кінцеву точку.<\/span> <span class=\"sg\" data-s=\"1\">Raku виконує <code>=<\/code> раніше за <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ми кажемо, що <code>...<\/code> зв'язується слабше за <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тому візьміть послідовність у дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Подивіться на <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> без дужок.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Тут змінна отримує лише <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Після цього Raku будує послідовність окремо.<\/span> <span class=\"sg\" data-s=\"4\">Ніхто не використовує цю нескінченну послідовність.<\/span> <span class=\"sg\" data-s=\"5\">Але Raku пробує її обчислити.<\/span> <span class=\"sg\" data-s=\"6\">Тож програма зависає й ніколи не закінчується.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поки що Raku нічого не обчислює.<\/span> <span class=\"sg\" data-s=\"1\">Послідовність дає вам значення лише тоді, коли ви їх просите.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> бере кілька перших значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Послідовність нескінченна.<\/span> <span class=\"sg\" data-s=\"1\">Але Raku створює лише перші п'ять чисел.<\/span> <span class=\"sg\" data-s=\"2\">Без лінивості програма пробує побудувати всю нескінченну послідовність.<\/span> <span class=\"sg\" data-s=\"3\">Така програма ніколи не закінчується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скінченна послідовність має кінець.<\/span> <span class=\"sg\" data-s=\"1\">Для такої послідовності метод <code>tail<\/code> бере значення з кінця:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Лінивість дозволяє робити дві речі окремо.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку ви даєте <em>опис<\/em> послідовності.<\/span> <span class=\"sg\" data-s=\"2\">Пізніше ви вирішуєте, скільки з неї використати.<\/span><\/p>"]]},"bg":{"t":"Мързеливи и безкрайни последователности","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Последователността не трябва да изчислява всичките си стойности наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Последователностите в Raku са <em>мързеливи<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku прави всяка стойност само когато наистина ви трябва.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да опишете последователност без никакъв край.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За безкрайна последователност използвайте <code>Inf<\/code> като крайна точка.<\/span> <span class=\"sg\" data-s=\"1\">Raku изпълнява <code>=<\/code> преди <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Казваме, че <code>...<\/code> свързва по-слабо от <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Затова сложете последователността в скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Вижте <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> без скоби.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Тук променливата получава само <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">След това Raku създава последователността отделно.<\/span> <span class=\"sg\" data-s=\"4\">Никой не използва тази безкрайна последователност.<\/span> <span class=\"sg\" data-s=\"5\">Но Raku се опитва да я изчисли.<\/span> <span class=\"sg\" data-s=\"6\">Затова програмата блокира и никога не свършва.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Засега Raku не изчислява нищо.<\/span> <span class=\"sg\" data-s=\"1\">Последователността ви дава стойности само когато ги поискате.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>head<\/code> взема първите няколко стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Последователността е безкрайна.<\/span> <span class=\"sg\" data-s=\"1\">Но Raku прави само първите пет числа.<\/span> <span class=\"sg\" data-s=\"2\">Без мързеливост програмата се опитва да създаде цялата безкрайна последователност.<\/span> <span class=\"sg\" data-s=\"3\">Такава програма никога не свършва.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Крайната последователност има край.<\/span> <span class=\"sg\" data-s=\"1\">За такава последователност методът <code>tail<\/code> взема стойности от края:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Мързеливостта ви позволява да правите две неща отделно.<\/span> <span class=\"sg\" data-s=\"1\">Първо давате <em>описанието<\/em> на последователността.<\/span> <span class=\"sg\" data-s=\"2\">По-късно решавате колко от нея да използвате.<\/span><\/p>"]]},"eo":{"t":"Maldiligentaj kaj senlimaj sekvencoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sekvenco ne devas kalkuli ĉiujn siajn valorojn samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Sekvencoj en Raku estas <em>maldiligentaj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku faras ĉiun valoron nur kiam vi vere bezonas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas priskribi sekvencon tute sen fino.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por senlima sekvenco, uzu <code>Inf<\/code> kiel la finan punkton.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras la <code>=<\/code> antaŭ la <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ni diras, ke <code>...<\/code> ligas pli malforte ol <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do metu la sekvencon en krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Rigardu <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> sen krampoj.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie, la variablo ricevas nur <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, Raku konstruas la sekvencon aparte.<\/span> <span class=\"sg\" data-s=\"4\">Neniu uzas ĉi tiun senfinan sekvencon.<\/span> <span class=\"sg\" data-s=\"5\">Sed Raku provas kalkuli ĝin.<\/span> <span class=\"sg\" data-s=\"6\">Do la programo pendas kaj neniam finiĝas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, Raku kalkulas nenion.<\/span> <span class=\"sg\" data-s=\"1\">La sekvenco donas al vi valorojn nur kiam vi petas ilin.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>head<\/code> prenas la unuajn kelkajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La sekvenco estas senlima.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku faras nur la unuajn kvin nombrojn.<\/span> <span class=\"sg\" data-s=\"2\">Sen maldiligento, la programo provas konstrui la tutan senfinan sekvencon.<\/span> <span class=\"sg\" data-s=\"3\">Tia programo neniam finiĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Finia sekvenco havas finon.<\/span> <span class=\"sg\" data-s=\"1\">Por tia sekvenco, la metodo <code>tail<\/code> prenas valorojn de la fino:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Maldiligento lasas vin fari du aferojn aparte.<\/span> <span class=\"sg\" data-s=\"1\">Unue, vi donas la <em>priskribon<\/em> de sekvenco.<\/span> <span class=\"sg\" data-s=\"2\">Poste, vi decidas, kiom da ĝi uzi.<\/span><\/p>"]]},"la":{"t":"Pigrae et infinitae series","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Series non debet omnes valores suos simul computare.<\/span> <span class=\"sg\" data-s=\"1\">Series in Raku <em>pigrae<\/em> sunt.<\/span> <span class=\"sg\" data-s=\"2\">Raku quemque valorem solum facit cum eo re vera eges.<\/span> <span class=\"sg\" data-s=\"3\">Itaque seriem sine ullo fine describere potes.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pro serie infinita, <code>Inf<\/code> ut finem adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Raku <code>=<\/code> ante <code>...<\/code> facit.<\/span> <span class=\"sg\" data-s=\"2\">Dicimus: <code>...<\/code> laxius ligat quam <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Itaque seriem in parenthesibus pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Specta <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> sine parenthesibus.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Hic variabilis solum <code>1<\/code> accipit.<\/span> <span class=\"sg\" data-s=\"3\">Postea Raku seriem per se construit.<\/span> <span class=\"sg\" data-s=\"4\">Nemo hanc seriem sine fine adhibet.<\/span> <span class=\"sg\" data-s=\"5\">Sed Raku eam computare conatur.<\/span> <span class=\"sg\" data-s=\"6\">Itaque programma haeret et numquam finit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adhuc Raku nihil computat.<\/span> <span class=\"sg\" data-s=\"1\">Series tibi valores solum dat cum eos petis.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>head<\/code> primos paucos valores sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Series infinita est.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku solum primos quinque numeros facit.<\/span> <span class=\"sg\" data-s=\"2\">Sine pigritia programma totam seriem sine fine construere conatur.<\/span> <span class=\"sg\" data-s=\"3\">Tale programma numquam finit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Series finita finem habet.<\/span> <span class=\"sg\" data-s=\"1\">Pro tali serie methodus <code>tail<\/code> valores a fine sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pigritia tibi permittit duas res separatim facere.<\/span> <span class=\"sg\" data-s=\"1\">Primo <em>descriptionem<\/em> seriei das.<\/span> <span class=\"sg\" data-s=\"2\">Postea decernis quantum eius adhibeas.<\/span><\/p>"]]}}}</script>
