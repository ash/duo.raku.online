<script type="application/json" id="page-data">{"u":"advanced/sequences","n":501,"k":"section","pv":"advanced/sets-bags-mixes/exercises/bag-count/solution","nx":"advanced/sequences/patterns","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sequences","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">A <em>sequence<\/em> is a series of values in a fixed order.<\/span> <span class=\"sg\" data-s=\"1\">Raku makes them one after another.<\/span> <span class=\"sg\" data-s=\"2\">Raku builds sequences with the <code>...<\/code> operator.<\/span> <span class=\"sg\" data-s=\"3\">You give it some values.<\/span> <span class=\"sg\" data-s=\"4\">The operator finds the pattern in them.<\/span> <span class=\"sg\" data-s=\"5\">Then it makes the rest of the values, up to an endpoint.<\/span> <span class=\"sg\" data-s=\"6\">The endpoint is the value where the sequence ends.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the simplest case, the sequence counts from one value to another:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can give two values at the start.<\/span> <span class=\"sg\" data-s=\"1\">Then Raku finds the step between them.<\/span> <span class=\"sg\" data-s=\"2\">It goes on with the same step.<\/span> <span class=\"sg\" data-s=\"3\">This way, you make an arithmetic sequence:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the values <code>1, 3<\/code> at the start give a step of two.<\/span> <span class=\"sg\" data-s=\"1\">So Raku counts up by two.<\/span> <span class=\"sg\" data-s=\"2\">It stops when it reaches <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>...<\/code> operator gives a value of the type <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The next topics show other patterns that the <code>...<\/code> operator knows.<\/span> <span class=\"sg\" data-s=\"1\">They also show that a sequence can be lazy.<\/span> <span class=\"sg\" data-s=\"2\">It can even be infinite and have no end.<\/span><\/p>"]]},"de":{"t":"Sequenzen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Sequenz<\/em> ist eine Reihe von Werten in einer festen Reihenfolge.<\/span> <span class=\"sg\" data-s=\"1\">Raku macht sie nacheinander.<\/span> <span class=\"sg\" data-s=\"2\">Raku baut Sequenzen mit dem Operator <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Du gibst ihm ein paar Werte.<\/span> <span class=\"sg\" data-s=\"4\">Der Operator findet das Muster darin.<\/span> <span class=\"sg\" data-s=\"5\">Dann macht er den Rest der Werte, bis zu einem Endpunkt.<\/span> <span class=\"sg\" data-s=\"6\">Der Endpunkt ist der Wert, bei dem die Sequenz endet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Im einfachsten Fall zählt die Sequenz von einem Wert zu einem anderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kannst am Anfang zwei Werte angeben.<\/span> <span class=\"sg\" data-s=\"1\">Dann findet Raku den Schritt zwischen ihnen.<\/span> <span class=\"sg\" data-s=\"2\">Raku macht mit dem gleichen Schritt weiter.<\/span> <span class=\"sg\" data-s=\"3\">So machst du eine arithmetische Sequenz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier geben die Werte <code>1, 3<\/code> am Anfang einen Schritt von zwei.<\/span> <span class=\"sg\" data-s=\"1\">Also zählt Raku in Schritten von zwei nach oben.<\/span> <span class=\"sg\" data-s=\"2\">Raku stoppt, wenn <code>11<\/code> erreicht ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Operator <code>...<\/code> gibt einen Wert vom Typ <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen andere Muster, die der Operator <code>...<\/code> kennt.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, dass eine Sequenz lazy sein kann.<\/span> <span class=\"sg\" data-s=\"2\">Sie kann sogar unendlich sein und kein Ende haben.<\/span><\/p>"]]},"nl":{"t":"Reeksen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Een <em>reeks<\/em> (sequence) is een serie waarden in een vaste volgorde.<\/span> <span class=\"sg\" data-s=\"1\">Raku maakt ze een voor een.<\/span> <span class=\"sg\" data-s=\"2\">Raku bouwt reeksen met de <code>...<\/code>-operator.<\/span> <span class=\"sg\" data-s=\"3\">Je geeft hem een paar waarden.<\/span> <span class=\"sg\" data-s=\"4\">De operator vindt het patroon erin.<\/span> <span class=\"sg\" data-s=\"5\">Dan maakt hij de rest van de waarden, tot aan een eindpunt.<\/span> <span class=\"sg\" data-s=\"6\">Het eindpunt is de waarde waar de reeks stopt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In het eenvoudigste geval telt de reeks van de ene waarde tot de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt aan het begin twee waarden geven.<\/span> <span class=\"sg\" data-s=\"1\">Dan vindt Raku de stap ertussen.<\/span> <span class=\"sg\" data-s=\"2\">Raku gaat door met dezelfde stap.<\/span> <span class=\"sg\" data-s=\"3\">Zo maak je een rekenkundige reeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier geven de waarden <code>1, 3<\/code> aan het begin een stap van twee.<\/span> <span class=\"sg\" data-s=\"1\">Raku telt dus steeds twee op.<\/span> <span class=\"sg\" data-s=\"2\">Het stopt als het bij <code>11<\/code> komt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <code>...<\/code>-operator geeft een waarde van het type <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen tonen andere patronen die de <code>...<\/code>-operator kent.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien dat een reeks lui (lazy) kan zijn.<\/span> <span class=\"sg\" data-s=\"2\">Die kan zelfs oneindig zijn en geen einde hebben.<\/span><\/p>"]]},"es":{"t":"Secuencias","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Una <em>secuencia<\/em> es una serie de valores en un orden fijo.<\/span> <span class=\"sg\" data-s=\"1\">Raku los crea uno tras otro.<\/span> <span class=\"sg\" data-s=\"2\">Raku construye secuencias con el operador <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tú le das algunos valores.<\/span> <span class=\"sg\" data-s=\"4\">El operador encuentra el patrón en ellos.<\/span> <span class=\"sg\" data-s=\"5\">Luego crea el resto de los valores, hasta un punto final.<\/span> <span class=\"sg\" data-s=\"6\">El punto final es el valor donde termina la secuencia.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En el caso más simple, la secuencia cuenta de un valor a otro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes dar dos valores al principio.<\/span> <span class=\"sg\" data-s=\"1\">Entonces Raku encuentra el paso entre ellos.<\/span> <span class=\"sg\" data-s=\"2\">Sigue con el mismo paso.<\/span> <span class=\"sg\" data-s=\"3\">Así creas una secuencia aritmética:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, los valores <code>1, 3<\/code> del principio dan un paso de dos.<\/span> <span class=\"sg\" data-s=\"1\">Así que Raku cuenta de dos en dos.<\/span> <span class=\"sg\" data-s=\"2\">Se detiene cuando llega a <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El operador <code>...<\/code> da un valor del tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran otros patrones que conoce el operador <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También muestran que una secuencia puede ser perezosa.<\/span> <span class=\"sg\" data-s=\"2\">Incluso puede ser infinita y no tener fin.<\/span><\/p>"]]},"it":{"t":"Sequenze","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Una <em>sequenza<\/em> è una serie di valori in un ordine fisso.<\/span> <span class=\"sg\" data-s=\"1\">Raku li crea uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"2\">Raku costruisce le sequenze con l'operatore <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tu gli dai alcuni valori.<\/span> <span class=\"sg\" data-s=\"4\">L'operatore trova il modello in questi valori.<\/span> <span class=\"sg\" data-s=\"5\">Poi crea il resto dei valori, fino a un punto finale.<\/span> <span class=\"sg\" data-s=\"6\">Il punto finale è il valore dove finisce la sequenza.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nel caso più semplice, la sequenza conta da un valore a un altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi dare due valori all'inizio.<\/span> <span class=\"sg\" data-s=\"1\">Allora Raku trova il passo tra di loro.<\/span> <span class=\"sg\" data-s=\"2\">Va avanti con lo stesso passo.<\/span> <span class=\"sg\" data-s=\"3\">Così crei una sequenza aritmetica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui i valori iniziali <code>1, 3<\/code> danno un passo di due.<\/span> <span class=\"sg\" data-s=\"1\">Quindi Raku conta di due in due.<\/span> <span class=\"sg\" data-s=\"2\">Si ferma quando arriva a <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>...<\/code> dà un valore di tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano altri modelli che l'operatore <code>...<\/code> conosce.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche che una sequenza può essere lazy.<\/span> <span class=\"sg\" data-s=\"2\">Può essere perfino infinita, senza una fine.<\/span><\/p>"]]},"lv":{"t":"Secības","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Virkne<\/em> ir vērtību rinda noteiktā secībā.<\/span> <span class=\"sg\" data-s=\"1\">Raku tās rada vienu pēc otras.<\/span> <span class=\"sg\" data-s=\"2\">Raku būvē virknes ar operatoru <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs tam dodat dažas vērtības.<\/span> <span class=\"sg\" data-s=\"4\">Operators tajās atrod likumsakarību.<\/span> <span class=\"sg\" data-s=\"5\">Pēc tam tas rada pārējās vērtības līdz beigu punktam.<\/span> <span class=\"sg\" data-s=\"6\">Beigu punkts ir vērtība, kur virkne beidzas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākajā gadījumā virkne skaita no vienas vērtības līdz citai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sākumā jūs varat dot divas vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Tad Raku atrod soli starp tām.<\/span> <span class=\"sg\" data-s=\"2\">Tas turpina ar to pašu soli.<\/span> <span class=\"sg\" data-s=\"3\">Tā jūs izveidojat aritmētisku virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit vērtības <code>1, 3<\/code> sākumā dod soli divi.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku skaita uz augšu pa diviem.<\/span> <span class=\"sg\" data-s=\"2\">Tas apstājas, kad sasniedz <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operators <code>...<\/code> dod <code>Seq<\/code> tipa vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda citas likumsakarības, ko zina operators <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī parāda, ka virkne var būt slinka.<\/span> <span class=\"sg\" data-s=\"2\">Tā var būt pat bezgalīga un bez beigām.<\/span><\/p>"]]},"ru":{"t":"Последовательности","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Последовательность<\/em> — это ряд значений в определённом порядке.<\/span> <span class=\"sg\" data-s=\"1\">Raku создаёт значения одно за другим.<\/span> <span class=\"sg\" data-s=\"2\">Raku строит последовательности с помощью оператора <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вы даёте ему несколько значений.<\/span> <span class=\"sg\" data-s=\"4\">Оператор находит в них закономерность.<\/span> <span class=\"sg\" data-s=\"5\">Потом он создаёт остальные значения, до конечной точки.<\/span> <span class=\"sg\" data-s=\"6\">Конечная точка — это значение, на котором последовательность заканчивается.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В самом простом случае последовательность считает от одного значения до другого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В начале можно дать два значения.<\/span> <span class=\"sg\" data-s=\"1\">Тогда Raku находит шаг между ними.<\/span> <span class=\"sg\" data-s=\"2\">Он продолжает с тем же шагом.<\/span> <span class=\"sg\" data-s=\"3\">Так вы создаёте арифметическую последовательность:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь значения <code>1, 3<\/code> в начале дают шаг два.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku считает с шагом два.<\/span> <span class=\"sg\" data-s=\"2\">Он останавливается, когда доходит до <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>...<\/code> даёт значение типа <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают другие закономерности, которые знает оператор <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, что последовательность может быть ленивой.<\/span> <span class=\"sg\" data-s=\"2\">Она может даже быть бесконечной и не иметь конца.<\/span><\/p>"]]},"uk":{"t":"Послідовності","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Послідовність<\/em> — це ряд значень у сталому порядку.<\/span> <span class=\"sg\" data-s=\"1\">Raku створює їх одне за одним.<\/span> <span class=\"sg\" data-s=\"2\">Raku будує послідовності оператором <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви даєте йому кілька значень.<\/span> <span class=\"sg\" data-s=\"4\">Оператор знаходить у них закономірність.<\/span> <span class=\"sg\" data-s=\"5\">Потім він створює решту значень, аж до кінцевої точки.<\/span> <span class=\"sg\" data-s=\"6\">Кінцева точка — це значення, на якому послідовність закінчується.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У найпростішому випадку послідовність рахує від одного значення до іншого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">На початку можна дати два значення.<\/span> <span class=\"sg\" data-s=\"1\">Тоді Raku знаходить крок між ними.<\/span> <span class=\"sg\" data-s=\"2\">Він продовжує з тим самим кроком.<\/span> <span class=\"sg\" data-s=\"3\">Так ви створюєте арифметичну послідовність:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут значення <code>1, 3<\/code> на початку дають крок два.<\/span> <span class=\"sg\" data-s=\"1\">Тож Raku рахує вгору з кроком два.<\/span> <span class=\"sg\" data-s=\"2\">Він зупиняється, коли доходить до <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>...<\/code> дає значення типу <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують інші закономірності, які знає оператор <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують, що послідовність може бути лінивою.<\/span> <span class=\"sg\" data-s=\"2\">Вона може навіть бути нескінченною й не мати кінця.<\/span><\/p>"]]},"bg":{"t":"Последователности","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Последователността<\/em> е поредица от стойности в определен ред.<\/span> <span class=\"sg\" data-s=\"1\">Raku ги прави една след друга.<\/span> <span class=\"sg\" data-s=\"2\">Raku създава последователности с оператора <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вие му давате някакви стойности.<\/span> <span class=\"sg\" data-s=\"4\">Операторът намира шаблона в тях.<\/span> <span class=\"sg\" data-s=\"5\">После прави останалите стойности, до крайна точка.<\/span> <span class=\"sg\" data-s=\"6\">Крайната точка е стойността, където последователността свършва.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В най-простия случай последователността брои от една стойност до друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да дадете две стойности в началото.<\/span> <span class=\"sg\" data-s=\"1\">Тогава Raku намира стъпката между тях.<\/span> <span class=\"sg\" data-s=\"2\">Той продължава със същата стъпка.<\/span> <span class=\"sg\" data-s=\"3\">Така правите аритметична последователност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук стойностите <code>1, 3<\/code> в началото дават стъпка две.<\/span> <span class=\"sg\" data-s=\"1\">Затова Raku брои нагоре по две.<\/span> <span class=\"sg\" data-s=\"2\">Той спира, когато стигне <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>...<\/code> дава стойност от типа <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват други шаблони, които операторът <code>...<\/code> познава.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и че една последователност може да бъде мързелива.<\/span> <span class=\"sg\" data-s=\"2\">Тя може дори да е безкрайна и да няма край.<\/span><\/p>"]]},"eo":{"t":"Sekvencoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Sekvenco<\/em> estas serio de valoroj en fiksita ordo.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras ilin unu post la alia.<\/span> <span class=\"sg\" data-s=\"2\">Raku konstruas sekvencojn per la operatoro <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi donas al ĝi kelkajn valorojn.<\/span> <span class=\"sg\" data-s=\"4\">La operatoro trovas la ŝablonon en ili.<\/span> <span class=\"sg\" data-s=\"5\">Poste ĝi faras la ceterajn valorojn, ĝis fina punkto.<\/span> <span class=\"sg\" data-s=\"6\">La fina punkto estas la valoro, kie la sekvenco finiĝas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la plej simpla kazo, la sekvenco nombras de unu valoro al alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas doni du valorojn ĉe la komenco.<\/span> <span class=\"sg\" data-s=\"1\">Tiam Raku trovas la paŝon inter ili.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi daŭrigas per la sama paŝo.<\/span> <span class=\"sg\" data-s=\"3\">Tiel vi faras aritmetikan sekvencon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la valoroj <code>1, 3<\/code> ĉe la komenco donas paŝon de du.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku nombras supren po du.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi haltas, kiam ĝi atingas <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La operatoro <code>...<\/code> donas valoron de la tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras aliajn ŝablonojn, kiujn la operatoro <code>...<\/code> konas.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, ke sekvenco povas esti maldiligenta.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas eĉ esti senlima kaj havi neniun finon.<\/span><\/p>"]]},"la":{"t":"Series","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Series<\/em> est catena valorum fixo ordine.<\/span> <span class=\"sg\" data-s=\"1\">Raku eos unum post alterum facit.<\/span> <span class=\"sg\" data-s=\"2\">Raku series operatore <code>...<\/code> construit.<\/span> <span class=\"sg\" data-s=\"3\">Ei aliquot valores das.<\/span> <span class=\"sg\" data-s=\"4\">Operator exemplar in eis invenit.<\/span> <span class=\"sg\" data-s=\"5\">Deinde ceteros valores facit, usque ad finem.<\/span> <span class=\"sg\" data-s=\"6\">Finis est valor ubi series desinit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In casu simplicissimo series ab uno valore ad alterum numerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Initio duos valores dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum Raku gradum inter eos invenit.<\/span> <span class=\"sg\" data-s=\"2\">Eodem gradu pergit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc modo seriem arithmeticam facis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic primi valores <code>1, 3<\/code> gradum duorum dant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku semper duo addit.<\/span> <span class=\"sg\" data-s=\"2\">Consistit cum <code>11<\/code> attingit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operator <code>...<\/code> valorem typi <code>Seq<\/code> dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Proxima themata alia exemplaria ostendunt quae operator <code>...<\/code> novit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendunt: series pigra esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Potest etiam infinita esse et finem non habere.<\/span><\/p>"]]}}}</script>
