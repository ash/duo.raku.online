<script type="application/json" id="page-data">{"u":"advanced/phasers","n":579,"k":"section","pv":"advanced/traits-pragmas/exercises/no-strict/solution","nx":"advanced/phasers/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Phasers","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A <em>phaser<\/em> is a special block.<\/span> <span class=\"sg\" data-s=\"1\">It runs by itself at a certain moment in the life of a program.<\/span> <span class=\"sg\" data-s=\"2\">It does not run at its place in the code.<\/span> <span class=\"sg\" data-s=\"3\">You do not call a phaser.<\/span> <span class=\"sg\" data-s=\"4\">You only say <em>when<\/em> its code must run.<\/span> <span class=\"sg\" data-s=\"5\">The name of the block tells this.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most common phasers are about the stages of the whole program:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs as early as possible. At this time, Raku still compiles the program.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> runs once when the program starts. It runs before the main code.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> runs once at the very end. It runs after the main code is finished.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This program has these phasers between normal statements.<\/span> <span class=\"sg\" data-s=\"1\">Look at the output.<\/span> <span class=\"sg\" data-s=\"2\">It does not follow the order of the lines in the file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs first, during compilation.<\/span> <span class=\"sg\" data-s=\"1\">Then the program runs.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> runs before the main body.<\/span> <span class=\"sg\" data-s=\"3\">Next, the main body prints its line.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> runs last.<\/span> <span class=\"sg\" data-s=\"5\">Its place in the file does not matter.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">People often use <code>END<\/code> to print a summary.<\/span> <span class=\"sg\" data-s=\"1\">They also use it to clean something up.<\/span> <span class=\"sg\" data-s=\"2\">This happens just before the program stops.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> is useful for work that must happen before everything else.<\/span><\/p>"]]},"de":{"t":"Phasers","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Phaser<\/em> ist ein spezieller Block.<\/span> <span class=\"sg\" data-s=\"1\">Er läuft von selbst zu einem bestimmten Zeitpunkt im Leben eines Programms.<\/span> <span class=\"sg\" data-s=\"2\">Er läuft nicht an seiner Stelle im Code.<\/span> <span class=\"sg\" data-s=\"3\">Du rufst einen Phaser nicht auf.<\/span> <span class=\"sg\" data-s=\"4\">Du sagst nur, <em>wann<\/em> sein Code laufen muss.<\/span> <span class=\"sg\" data-s=\"5\">Das sagt der Name des Blocks.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die häufigsten Phaser gehören zu den Phasen des ganzen Programms:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> läuft so früh wie möglich. Zu dieser Zeit kompiliert Raku das Programm noch.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> läuft einmal, wenn das Programm startet. Er läuft vor dem Hauptcode.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> läuft einmal ganz am Ende. Er läuft, wenn der Hauptcode fertig ist.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm hat diese Phaser zwischen normalen Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Schau dir die Ausgabe an.<\/span> <span class=\"sg\" data-s=\"2\">Sie folgt nicht der Reihenfolge der Zeilen in der Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> läuft zuerst, während der Kompilierung.<\/span> <span class=\"sg\" data-s=\"1\">Dann läuft das Programm.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> läuft vor dem Hauptteil.<\/span> <span class=\"sg\" data-s=\"3\">Danach gibt der Hauptteil seine Zeile aus.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> läuft zuletzt.<\/span> <span class=\"sg\" data-s=\"5\">Seine Stelle in der Datei ist egal.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Man nutzt <code>END<\/code> oft, um eine Zusammenfassung auszugeben.<\/span> <span class=\"sg\" data-s=\"1\">Man nutzt es auch, um etwas aufzuräumen.<\/span> <span class=\"sg\" data-s=\"2\">Das passiert kurz vor dem Ende des Programms.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> ist nützlich für Arbeit, die vor allem anderen passieren muss.<\/span><\/p>"]]},"nl":{"t":"Phasers","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>phaser<\/em> is een speciaal blok.<\/span> <span class=\"sg\" data-s=\"1\">Het draait vanzelf op een bepaald moment in het leven van een programma.<\/span> <span class=\"sg\" data-s=\"2\">Het draait niet op zijn plek in de code.<\/span> <span class=\"sg\" data-s=\"3\">Je roept een phaser niet aan.<\/span> <span class=\"sg\" data-s=\"4\">Je zegt alleen <em>wanneer<\/em> de code moet draaien.<\/span> <span class=\"sg\" data-s=\"5\">De naam van het blok zegt dat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De meest gebruikte phasers gaan over de fasen van het hele programma:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> draait zo vroeg mogelijk. Op dat moment compileert Raku het programma nog.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> draait één keer als het programma start. Hij draait vóór de hoofdcode.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> draait één keer helemaal aan het einde. Hij draait als de hoofdcode klaar is.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit programma heeft deze phasers tussen gewone instructies.<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar de uitvoer.<\/span> <span class=\"sg\" data-s=\"2\">Die volgt niet de volgorde van de regels in het bestand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> draait als eerste, tijdens de compilatie.<\/span> <span class=\"sg\" data-s=\"1\">Daarna draait het programma.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> draait vóór de hoofdcode.<\/span> <span class=\"sg\" data-s=\"3\">Dan drukt de hoofdcode zijn regel af.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> draait als laatste.<\/span> <span class=\"sg\" data-s=\"5\">Zijn plek in het bestand maakt niet uit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mensen gebruiken <code>END<\/code> vaak om een samenvatting af te drukken.<\/span> <span class=\"sg\" data-s=\"1\">Ze gebruiken het ook om iets op te ruimen.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebeurt vlak voordat het programma stopt.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> is handig voor werk dat vóór al het andere moet gebeuren.<\/span><\/p>"]]},"es":{"t":"Phasers","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> es un bloque especial.<\/span> <span class=\"sg\" data-s=\"1\">Se ejecuta por sí solo en un momento concreto de la vida de un programa.<\/span> <span class=\"sg\" data-s=\"2\">No se ejecuta en su lugar en el código.<\/span> <span class=\"sg\" data-s=\"3\">No llamas a un phaser.<\/span> <span class=\"sg\" data-s=\"4\">Solo dices <em>cuándo<\/em> debe ejecutarse su código.<\/span> <span class=\"sg\" data-s=\"5\">El nombre del bloque indica esto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los phasers más comunes son para las etapas de todo el programa:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta lo antes posible. En ese momento, Raku todavía compila el programa.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> se ejecuta una vez cuando el programa empieza. Se ejecuta antes del código principal.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> se ejecuta una vez al final de todo. Se ejecuta cuando el código principal ya ha terminado.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este programa tiene estos phasers entre instrucciones normales.<\/span> <span class=\"sg\" data-s=\"1\">Mira la salida.<\/span> <span class=\"sg\" data-s=\"2\">No sigue el orden de las líneas del archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta primero, durante la compilación.<\/span> <span class=\"sg\" data-s=\"1\">Después, el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> se ejecuta antes del cuerpo principal.<\/span> <span class=\"sg\" data-s=\"3\">Luego, el cuerpo principal imprime su línea.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> se ejecuta al final.<\/span> <span class=\"sg\" data-s=\"5\">Su lugar en el archivo no importa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La gente usa a menudo <code>END<\/code> para imprimir un resumen.<\/span> <span class=\"sg\" data-s=\"1\">También lo usa para limpiar algo.<\/span> <span class=\"sg\" data-s=\"2\">Esto pasa justo antes del final del programa.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> es útil para el trabajo que debe ocurrir antes que todo lo demás.<\/span><\/p>"]]},"it":{"t":"Phaser","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> è un blocco speciale.<\/span> <span class=\"sg\" data-s=\"1\">Parte da solo in un certo momento della vita di un programma.<\/span> <span class=\"sg\" data-s=\"2\">Non parte nel punto dove sta nel codice.<\/span> <span class=\"sg\" data-s=\"3\">Non chiami un phaser.<\/span> <span class=\"sg\" data-s=\"4\">Dici solo <em>quando<\/em> il suo codice deve partire.<\/span> <span class=\"sg\" data-s=\"5\">Lo dice il nome del blocco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I phaser più comuni riguardano le fasi di tutto il programma:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> parte il prima possibile. In quel momento Raku compila ancora il programma.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> parte una volta, all'inizio del programma. Parte prima del codice principale.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> parte una volta, proprio alla fine. Parte quando il codice principale è finito.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo programma ha questi phaser tra istruzioni normali.<\/span> <span class=\"sg\" data-s=\"1\">Guarda l'output.<\/span> <span class=\"sg\" data-s=\"2\">Non segue l'ordine delle righe nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> parte per primo, durante la compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Poi parte il programma.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> parte prima del corpo principale.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, il corpo principale stampa la sua riga.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> parte per ultimo.<\/span> <span class=\"sg\" data-s=\"5\">Il suo posto nel file non conta.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Spesso le persone usano <code>END<\/code> per stampare un riepilogo.<\/span> <span class=\"sg\" data-s=\"1\">Lo usano anche per ripulire qualcosa.<\/span> <span class=\"sg\" data-s=\"2\">Questo succede subito prima della fine del programma.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> è utile per il lavoro da fare prima di tutto il resto.<\/span><\/p>"]]},"lv":{"t":"Fāzeri","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Fāzeris<\/em> (phaser) ir īpašs bloks.<\/span> <span class=\"sg\" data-s=\"1\">Tas izpildās pats no sevis noteiktā programmas dzīves brīdī.<\/span> <span class=\"sg\" data-s=\"2\">Tas neizpildās savā vietā kodā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs neizsaucat fāzeri.<\/span> <span class=\"sg\" data-s=\"4\">Jūs tikai pasakāt, <em>kad<\/em> tā kodam jāizpildās.<\/span> <span class=\"sg\" data-s=\"5\">To pasaka bloka nosaukums.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Biežākie fāzeri ir saistīti ar visas programmas posmiem:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pēc iespējas agrāk. Šajā laikā Raku vēl kompilē programmu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> izpildās vienu reizi, kad programma sākas. Tas izpildās pirms galvenā koda.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> izpildās vienu reizi pašās beigās. Tas izpildās, kad galvenais kods ir pabeigts.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā programmā šie fāzeri ir starp parastiem izteikumiem.<\/span> <span class=\"sg\" data-s=\"1\">Paskatieties uz izvadi.<\/span> <span class=\"sg\" data-s=\"2\">Tā neseko rindu secībai failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pirmais, kompilācijas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Tad programma sāk darboties.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> izpildās pirms galvenās daļas.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam galvenā daļa izdrukā savu rindu.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> izpildās pēdējais.<\/span> <span class=\"sg\" data-s=\"5\">Tā vieta failā nav svarīga.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cilvēki bieži lieto <code>END<\/code>, lai izdrukātu kopsavilkumu.<\/span> <span class=\"sg\" data-s=\"1\">Viņi to lieto arī, lai kaut ko iztīrītu.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek tieši pirms programma apstājas.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> ir noderīgs darbam, kam jānotiek pirms visa pārējā.<\/span><\/p>"]]},"ru":{"t":"Фазеры","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Фейзер<\/em> (phaser) — это особый блок.<\/span> <span class=\"sg\" data-s=\"1\">Он запускается сам в определённый момент жизни программы.<\/span> <span class=\"sg\" data-s=\"2\">Он не выполняется на своём месте в коде.<\/span> <span class=\"sg\" data-s=\"3\">Вы не вызываете фейзер.<\/span> <span class=\"sg\" data-s=\"4\">Вы только говорите, <em>когда<\/em> должен работать его код.<\/span> <span class=\"sg\" data-s=\"5\">Это говорит имя блока.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Самые частые фейзеры связаны с этапами всей программы:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется как можно раньше. В это время Raku ещё компилирует программу.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> выполняется один раз при запуске программы. Он выполняется перед основным кодом.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> выполняется один раз в самом конце. Он выполняется после конца основного кода.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этой программе эти фейзеры стоят между обычными инструкциями.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на вывод.<\/span> <span class=\"sg\" data-s=\"2\">Он не идёт по порядку строк в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется первым, во время компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Потом программа запускается.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> выполняется перед основным телом.<\/span> <span class=\"sg\" data-s=\"3\">Затем основное тело выводит свою строку.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> выполняется последним.<\/span> <span class=\"sg\" data-s=\"5\">Его место в файле не важно.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Люди часто выводят итог в <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё в нём что-то очищают.<\/span> <span class=\"sg\" data-s=\"2\">Это происходит прямо перед концом программы.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> удобен для работы, которая должна быть раньше всего остального.<\/span><\/p>"]]},"uk":{"t":"Фазери","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Фазер<\/em> — це особливий блок.<\/span> <span class=\"sg\" data-s=\"1\">Він запускається сам у певний момент життя програми.<\/span> <span class=\"sg\" data-s=\"2\">Він не виконується там, де стоїть у коді.<\/span> <span class=\"sg\" data-s=\"3\">Ви не викликаєте фазер.<\/span> <span class=\"sg\" data-s=\"4\">Ви лише кажете, <em>коли<\/em> його код має виконатися.<\/span> <span class=\"sg\" data-s=\"5\">Це показує ім'я блоку.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найчастіші фазери стосуються етапів усієї програми:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується якомога раніше. У цей час Raku ще компілює програму.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> виконується один раз на старті програми. Він іде перед основним кодом.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> виконується один раз у самому кінці. Він іде після кінця основного коду.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цій програмі ці фазери стоять між звичайними операторами.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на вивід.<\/span> <span class=\"sg\" data-s=\"2\">Він не йде за порядком рядків у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується першим, під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Потім програма запускається.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> виконується перед основним тілом.<\/span> <span class=\"sg\" data-s=\"3\">Далі основне тіло друкує свій рядок.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> виконується останнім.<\/span> <span class=\"sg\" data-s=\"5\">Його місце у файлі не має значення.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Люди часто використовують <code>END<\/code>, щоб вивести підсумок.<\/span> <span class=\"sg\" data-s=\"1\">Ще його використовують, щоб щось прибрати.<\/span> <span class=\"sg\" data-s=\"2\">Це відбувається перед самим кінцем програми.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> корисний для роботи, яка має відбутися раніше за все інше.<\/span><\/p>"]]},"bg":{"t":"Фейзъри","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> е специален блок.<\/span> <span class=\"sg\" data-s=\"1\">Той се изпълнява сам в определен момент от живота на програмата.<\/span> <span class=\"sg\" data-s=\"2\">Той не се изпълнява на мястото си в кода.<\/span> <span class=\"sg\" data-s=\"3\">Вие не извиквате phaser.<\/span> <span class=\"sg\" data-s=\"4\">Вие само казвате <em>кога<\/em> трябва да се изпълни кодът му.<\/span> <span class=\"sg\" data-s=\"5\">Името на блока казва това.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-честите phasers са свързани с етапите на цялата програма:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява възможно най-рано. По това време Raku още компилира програмата.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> се изпълнява веднъж, когато програмата започва. Той се изпълнява преди основния код.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> се изпълнява веднъж в самия край. Той се изпълнява след края на основния код.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази програма има тези phasers между обикновени инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Вижте изхода.<\/span> <span class=\"sg\" data-s=\"2\">Той не следва реда на редовете във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява първи, по време на компилацията.<\/span> <span class=\"sg\" data-s=\"1\">След това програмата започва работа.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> се изпълнява преди основното тяло.<\/span> <span class=\"sg\" data-s=\"3\">После основното тяло отпечатва своя ред.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> се изпълнява последен.<\/span> <span class=\"sg\" data-s=\"5\">Мястото му във файла няма значение.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Хората често използват <code>END<\/code>, за да отпечатат обобщение.<\/span> <span class=\"sg\" data-s=\"1\">Те го използват и за почистване.<\/span> <span class=\"sg\" data-s=\"2\">Това става точно преди програмата да спре.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> е полезен за работа, която трябва да стане преди всичко друго.<\/span><\/p>"]]},"eo":{"t":"Faziloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> estas speciala bloko.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ruliĝas per si mem en certa momento de la vivo de programo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne ruliĝas ĉe sia loko en la kodo.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne vokas phaser-on.<\/span> <span class=\"sg\" data-s=\"4\">Vi nur diras, <em>kiam<\/em> ĝia kodo devas ruliĝi.<\/span> <span class=\"sg\" data-s=\"5\">La nomo de la bloko diras tion.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plej oftaj phaser-oj temas pri la stadioj de la tuta programo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas kiel eble plej frue. En tiu tempo, Raku ankoraŭ kompilas la programon.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> ruliĝas unufoje, kiam la programo komenciĝas. Ĝi ruliĝas antaŭ la ĉefa kodo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> ruliĝas unufoje ĉe la plej fino. Ĝi ruliĝas post la fino de la ĉefa kodo.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo havas ĉi tiujn phaser-ojn inter normalaj deklaroj.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu la eligon.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne sekvas la ordon de la linioj en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas unue, dum la kompilado.<\/span> <span class=\"sg\" data-s=\"1\">Poste la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> ruliĝas antaŭ la ĉefa korpo.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, la ĉefa korpo presas sian linion.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> ruliĝas laste.<\/span> <span class=\"sg\" data-s=\"5\">Ĝia loko en la dosiero ne gravas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Oni ofte uzas <code>END<\/code> por presi resumon.<\/span> <span class=\"sg\" data-s=\"1\">Oni ankaŭ uzas ĝin por purigi ion.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas tuj antaŭ la fino de la programo.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> estas utila por laboro, kiu devas okazi antaŭ ĉio alia.<\/span><\/p>"]]},"la":{"t":"Phaseres","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> est copia specialis.<\/span> <span class=\"sg\" data-s=\"1\">Per se currit certo momento in vita programmatis.<\/span> <span class=\"sg\" data-s=\"2\">Non currit in loco suo in codice.<\/span> <span class=\"sg\" data-s=\"3\">Phaserem non vocas.<\/span> <span class=\"sg\" data-s=\"4\">Tantum dicis <em>quando<\/em> codex eius currere debet.<\/span> <span class=\"sg\" data-s=\"5\">Nomen copiae hoc dicit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Phaseres frequentissimi ad stadia totius programmatis pertinent:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> quam primum currit. Tunc Raku programma adhuc compilat.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> semel currit cum programma incipit. Ante codicem principalem currit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> semel currit in ipso fine. Currit postquam codex principalis finitus est.<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma hos phaseres inter sententias ordinarias habet.<\/span> <span class=\"sg\" data-s=\"1\">Specta output.<\/span> <span class=\"sg\" data-s=\"2\">Ordinem linearum in archivo non sequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> primus currit, dum compilatio fit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde programma currit.<\/span> <span class=\"sg\" data-s=\"2\"><code>INIT<\/code> ante corpus principale currit.<\/span> <span class=\"sg\" data-s=\"3\">Tum corpus principale lineam suam imprimit.<\/span> <span class=\"sg\" data-s=\"4\"><code>END<\/code> ultimus currit.<\/span> <span class=\"sg\" data-s=\"5\">Locus eius in archivo nihil mutat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Homines saepe summarium cum <code>END<\/code> imprimunt.<\/span> <span class=\"sg\" data-s=\"1\">Etiam aliquid cum eo purgant.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit paulo antequam programma desinit.<\/span> <span class=\"sg\" data-s=\"3\"><code>BEGIN<\/code> utilis est pro opere quod ante omnia alia fieri debet.<\/span><\/p>"]]}}}</script>
