<script type="application/json" id="page-data">{"u":"advanced/module-introspection","n":716,"k":"section","pv":"advanced/modules-basics/exercises/require-at-runtime/solution","nx":"advanced/module-introspection/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Module introspection","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">The name of a module also creates a <em>package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">A package is a namespace.<\/span> <span class=\"sg\" data-s=\"2\">It keeps the names from the module.<\/span> <span class=\"sg\" data-s=\"3\">Earlier, in <a href=\"/advanced/containers/\">the section about containers<\/a>, you saw <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">It returns the <code>Stash<\/code> of a package.<\/span> <span class=\"sg\" data-s=\"5\">The <code>Stash<\/code> is the table of symbols, or names, in the package.<\/span> <span class=\"sg\" data-s=\"6\">Module introspection uses this.<\/span> <span class=\"sg\" data-s=\"7\">With it, a program looks inside a module.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The examples below use the <code>Greeting<\/code> module from the earlier topics.<\/span> <span class=\"sg\" data-s=\"1\">It has a subroutine that it exports.<\/span> <span class=\"sg\" data-s=\"2\">It also has a shared <code>our<\/code> variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To get the package of a module, write <code>::<\/code> after its name.<\/span> <span class=\"sg\" data-s=\"1\">Then add <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It lists the names in the package:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">The <code>Greeting<\/code> module from the earlier topics has an <code>our<\/code> variable, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So its package has this name.<\/span> <span class=\"sg\" data-s=\"2\">The name includes the sigil.<\/span> <span class=\"sg\" data-s=\"3\">Next to it, you see <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">This may be a surprise.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> is a package too.<\/span> <span class=\"sg\" data-s=\"6\">Raku makes it automatically.<\/span> <span class=\"sg\" data-s=\"7\">The module marks some things with <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> keeps all of them, for example, the subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">So an exported name is <em>not<\/em> directly in the package.<\/span> <span class=\"sg\" data-s=\"10\">It is in <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">This is a smaller package inside the package of the module.<\/span> <span class=\"sg\" data-s=\"12\">The keys do not come in a fixed order.<\/span> <span class=\"sg\" data-s=\"13\">So the example sorts them.<\/span> <span class=\"sg\" data-s=\"14\">Then the result is always the same.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can also find a name in the package.<\/span> <span class=\"sg\" data-s=\"1\">Use the name as a key.<\/span> <span class=\"sg\" data-s=\"2\">You get the same value as with the full name <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listing the exports of a module<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The exported names are really in the <code>EXPORT<\/code> package from above.<\/span> <span class=\"sg\" data-s=\"1\">So you can list them.<\/span> <span class=\"sg\" data-s=\"2\">Just look one level deeper.<\/span> <span class=\"sg\" data-s=\"3\">Exports without a tag go into the group <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">You can read about tags in <a href=\"/advanced/modules-basics/export-tags/\">Export tags<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">The <code>.keys<\/code> of <code>DEFAULT<\/code> are the exported routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Each key is an exported name with its sigil.<\/span> <span class=\"sg\" data-s=\"1\">Here, there is only one key: the subroutine <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>&amp;<\/code> sigil shows that it is a routine.<\/span> <span class=\"sg\" data-s=\"3\">So you can find out what a module gives to its users.<\/span> <span class=\"sg\" data-s=\"4\">You do not need to read its source code.<\/span> <span class=\"sg\" data-s=\"5\">Just ask its package <code>EXPORT::DEFAULT<\/code> what it has.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Looking inside a package like this is useful.<\/span> <span class=\"sg\" data-s=\"1\">You can find out what a module has.<\/span> <span class=\"sg\" data-s=\"2\">You can also get to its names while the program runs.<\/span> <span class=\"sg\" data-s=\"3\">Then you do not have to write each name in the code.<\/span><\/p>"]]},"de":{"t":"Modul-Introspektion","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Der Name eines Moduls erzeugt auch ein <em>Package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ein Package ist ein Namensraum.<\/span> <span class=\"sg\" data-s=\"2\">Er enthält die Namen aus dem Modul.<\/span> <span class=\"sg\" data-s=\"3\">Vorher, im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a>, hast du <code>WHO<\/code> gesehen.<\/span> <span class=\"sg\" data-s=\"4\">Es gibt den <code>Stash<\/code> eines Packages zurück.<\/span> <span class=\"sg\" data-s=\"5\">Der <code>Stash<\/code> ist die Tabelle der Symbole, also der Namen, im Package.<\/span> <span class=\"sg\" data-s=\"6\">Modul-Introspection nutzt das.<\/span> <span class=\"sg\" data-s=\"7\">Damit schaut ein Programm in ein Modul hinein.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Beispiele unten benutzen das <code>Greeting<\/code>-Modul aus den früheren Themen.<\/span> <span class=\"sg\" data-s=\"1\">Es hat eine Subroutine, die es exportiert.<\/span> <span class=\"sg\" data-s=\"2\">Es hat auch eine gemeinsame <code>our<\/code>-Variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um das Package eines Moduls zu bekommen, schreibe <code>::<\/code> nach seinem Namen.<\/span> <span class=\"sg\" data-s=\"1\">Dann füge <code>.keys<\/code> hinzu.<\/span> <span class=\"sg\" data-s=\"2\">Das listet die Namen im Package auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Das <code>Greeting<\/code>-Modul aus den früheren Themen hat eine <code>our<\/code>-Variable, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also hat sein Package diesen Namen.<\/span> <span class=\"sg\" data-s=\"2\">Der Name enthält das Sigil.<\/span> <span class=\"sg\" data-s=\"3\">Daneben siehst du <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Das ist vielleicht eine Überraschung.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> ist auch ein Package.<\/span> <span class=\"sg\" data-s=\"6\">Raku erzeugt es automatisch.<\/span> <span class=\"sg\" data-s=\"7\">Das Modul markiert manche Dinge mit <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> enthält sie alle, zum Beispiel die Subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Also ist ein exportierter Name <em>nicht<\/em> direkt im Package.<\/span> <span class=\"sg\" data-s=\"10\">Er ist in <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Das ist ein kleineres Package im Package des Moduls.<\/span> <span class=\"sg\" data-s=\"12\">Die Schlüssel kommen nicht in einer festen Reihenfolge.<\/span> <span class=\"sg\" data-s=\"13\">Darum sortiert das Beispiel sie.<\/span> <span class=\"sg\" data-s=\"14\">Dann ist das Ergebnis immer gleich.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch einen Namen im Package finden.<\/span> <span class=\"sg\" data-s=\"1\">Benutze den Namen als Schlüssel.<\/span> <span class=\"sg\" data-s=\"2\">Du bekommst denselben Wert wie mit dem vollen Namen <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die Exporte eines Moduls auflisten<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Die exportierten Namen sind wirklich im <code>EXPORT<\/code>-Package von oben.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du sie auflisten.<\/span> <span class=\"sg\" data-s=\"2\">Schau einfach eine Ebene tiefer.<\/span> <span class=\"sg\" data-s=\"3\">Exporte ohne Tag kommen in die Gruppe <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Über Tags kannst du in <a href=\"https://course.raku.org/de/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Export-Tags<\/a> lesen.<\/span> <span class=\"sg\" data-s=\"5\">Die <code>.keys<\/code> von <code>DEFAULT<\/code> sind die exportierten Routinen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Jeder Schlüssel ist ein exportierter Name mit seinem Sigil.<\/span> <span class=\"sg\" data-s=\"1\">Hier gibt es nur einen Schlüssel: die Subroutine <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das Sigil <code>&amp;<\/code> zeigt, dass sie eine Routine ist.<\/span> <span class=\"sg\" data-s=\"3\">So findest du heraus, was ein Modul seinen Nutzern gibt.<\/span> <span class=\"sg\" data-s=\"4\">Du musst seinen Quellcode nicht lesen.<\/span> <span class=\"sg\" data-s=\"5\">Frag einfach sein Package <code>EXPORT::DEFAULT<\/code>, was es hat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So in ein Package zu schauen ist nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst herausfinden, was ein Modul hat.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst auch an seine Namen kommen, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"3\">Dann musst du nicht jeden Namen in den Code schreiben.<\/span><\/p>"]]},"nl":{"t":"Module-introspectie","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">De naam van een module maakt ook een <em>pakket<\/em> aan.<\/span> <span class=\"sg\" data-s=\"1\">Een pakket is een naamruimte.<\/span> <span class=\"sg\" data-s=\"2\">Het bewaart de namen uit de module.<\/span> <span class=\"sg\" data-s=\"3\">Eerder, in <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">de sectie over containers<\/a>, zag je <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Het geeft de <code>Stash<\/code> van een pakket terug.<\/span> <span class=\"sg\" data-s=\"5\">De <code>Stash<\/code> is de tabel met symbolen, of namen, in het pakket.<\/span> <span class=\"sg\" data-s=\"6\">Module-introspectie gebruikt dit.<\/span> <span class=\"sg\" data-s=\"7\">Daarmee kijkt een programma in een module.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De voorbeelden hieronder gebruiken de module <code>Greeting<\/code> uit de eerdere onderwerpen.<\/span> <span class=\"sg\" data-s=\"1\">Hij heeft een subroutine die hij exporteert.<\/span> <span class=\"sg\" data-s=\"2\">Hij heeft ook een gedeelde <code>our<\/code>-variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om het pakket van een module te krijgen, schrijf je <code>::<\/code> na de naam.<\/span> <span class=\"sg\" data-s=\"1\">Voeg dan <code>.keys<\/code> toe.<\/span> <span class=\"sg\" data-s=\"2\">Dat geeft de namen in het pakket:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">De module <code>Greeting<\/code> uit de eerdere onderwerpen heeft een <code>our<\/code>-variabele, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zijn pakket bevat dus deze naam.<\/span> <span class=\"sg\" data-s=\"2\">De naam heeft de sigil erbij.<\/span> <span class=\"sg\" data-s=\"3\">Ernaast zie je <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Dat is misschien een verrassing.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> is ook een pakket.<\/span> <span class=\"sg\" data-s=\"6\">Raku maakt het automatisch.<\/span> <span class=\"sg\" data-s=\"7\">De module markeert sommige dingen met <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> bewaart ze allemaal, bijvoorbeeld de subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Een geëxporteerde naam staat dus <em>niet<\/em> direct in het pakket.<\/span> <span class=\"sg\" data-s=\"10\">Hij staat in <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Dat is een kleiner pakket binnen het pakket van de module.<\/span> <span class=\"sg\" data-s=\"12\">De sleutels komen niet in een vaste volgorde.<\/span> <span class=\"sg\" data-s=\"13\">Daarom sorteert het voorbeeld ze.<\/span> <span class=\"sg\" data-s=\"14\">Dan is het resultaat altijd hetzelfde.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een naam in het pakket zoeken.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de naam als sleutel.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt dezelfde waarde als met de volledige naam <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De exports van een module weergeven<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De geëxporteerde namen staan echt in het <code>EXPORT<\/code>-pakket van hierboven.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze dus weergeven.<\/span> <span class=\"sg\" data-s=\"2\">Kijk gewoon één niveau dieper.<\/span> <span class=\"sg\" data-s=\"3\">Exports zonder tag gaan naar de groep <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Over tags lees je meer in <a href=\"https://course.raku.org/nl/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Exporttags<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">De <code>.keys<\/code> van <code>DEFAULT<\/code> zijn de geëxporteerde routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Elke sleutel is een geëxporteerde naam met zijn sigil.<\/span> <span class=\"sg\" data-s=\"1\">Hier is er maar één sleutel: de subroutine <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De sigil <code>&amp;<\/code> laat zien dat het een routine is.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je zien wat een module aan zijn gebruikers geeft.<\/span> <span class=\"sg\" data-s=\"4\">Je hoeft de broncode niet te lezen.<\/span> <span class=\"sg\" data-s=\"5\">Vraag gewoon aan het pakket <code>EXPORT::DEFAULT<\/code> wat erin zit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Zo in een pakket kijken is handig.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt zien wat een module heeft.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ook bij de namen komen terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"3\">Dan hoef je niet elke naam in de code te schrijven.<\/span><\/p>"]]},"es":{"t":"Introspección de módulos","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">El nombre de un módulo también crea un <em>paquete<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un paquete es un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"2\">Guarda los nombres del módulo.<\/span> <span class=\"sg\" data-s=\"3\">Antes, en <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sección sobre contenedores<\/a>, viste <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Devuelve el <code>Stash<\/code> de un paquete.<\/span> <span class=\"sg\" data-s=\"5\">El <code>Stash<\/code> es la tabla de símbolos, o nombres, del paquete.<\/span> <span class=\"sg\" data-s=\"6\">La introspección de módulos usa esto.<\/span> <span class=\"sg\" data-s=\"7\">Con ella, un programa mira dentro de un módulo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los ejemplos de abajo usan el módulo <code>Greeting<\/code> de los temas anteriores.<\/span> <span class=\"sg\" data-s=\"1\">Tiene una subrutina que exporta.<\/span> <span class=\"sg\" data-s=\"2\">También tiene una variable compartida <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para obtener el paquete de un módulo, escribe <code>::<\/code> después de su nombre.<\/span> <span class=\"sg\" data-s=\"1\">Luego añade <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lista los nombres del paquete:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">El módulo <code>Greeting<\/code> de los temas anteriores tiene una variable <code>our<\/code>, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que su paquete tiene este nombre.<\/span> <span class=\"sg\" data-s=\"2\">El nombre incluye el sigilo.<\/span> <span class=\"sg\" data-s=\"3\">A su lado, ves <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Esto puede ser una sorpresa.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> también es un paquete.<\/span> <span class=\"sg\" data-s=\"6\">Raku lo crea automáticamente.<\/span> <span class=\"sg\" data-s=\"7\">El módulo marca algunas cosas con <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> las guarda todas, por ejemplo, la subrutina <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Así que un nombre exportado <em>no<\/em> está directamente en el paquete.<\/span> <span class=\"sg\" data-s=\"10\">Está en <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Este es un paquete más pequeño dentro del paquete del módulo.<\/span> <span class=\"sg\" data-s=\"12\">Las claves no salen en un orden fijo.<\/span> <span class=\"sg\" data-s=\"13\">Así que el ejemplo las ordena.<\/span> <span class=\"sg\" data-s=\"14\">Entonces el resultado siempre es el mismo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También puedes encontrar un nombre en el paquete.<\/span> <span class=\"sg\" data-s=\"1\">Usa el nombre como clave.<\/span> <span class=\"sg\" data-s=\"2\">Obtienes el mismo valor que con el nombre completo <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listar las exportaciones de un módulo<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Los nombres exportados están en realidad en el paquete <code>EXPORT<\/code> de arriba.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes listarlos.<\/span> <span class=\"sg\" data-s=\"2\">Solo tienes que mirar un nivel más adentro.<\/span> <span class=\"sg\" data-s=\"3\">Las exportaciones sin etiqueta van al grupo <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Puedes leer sobre las etiquetas en <a href=\"https://course.raku.org/es/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Etiquetas de exportación<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Las <code>.keys<\/code> de <code>DEFAULT<\/code> son las rutinas exportadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Cada clave es un nombre exportado con su sigilo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí solo hay una clave: la subrutina <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El sigilo <code>&amp;<\/code> muestra que es una rutina.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes saber qué da un módulo a sus usuarios.<\/span> <span class=\"sg\" data-s=\"4\">No necesitas leer su código fuente.<\/span> <span class=\"sg\" data-s=\"5\">Solo pregunta a su paquete <code>EXPORT::DEFAULT<\/code> qué tiene.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mirar dentro de un paquete así es útil.<\/span> <span class=\"sg\" data-s=\"1\">Puedes saber qué tiene un módulo.<\/span> <span class=\"sg\" data-s=\"2\">También puedes llegar a sus nombres mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">Así no tienes que escribir cada nombre en el código.<\/span><\/p>"]]},"it":{"t":"Introspezione dei moduli","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Il nome di un modulo crea anche un <em>package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un package è uno spazio dei nomi.<\/span> <span class=\"sg\" data-s=\"2\">Tiene i nomi del modulo.<\/span> <span class=\"sg\" data-s=\"3\">Prima, nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui container<\/a>, hai visto <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Restituisce lo <code>Stash<\/code> di un package.<\/span> <span class=\"sg\" data-s=\"5\">Lo <code>Stash<\/code> è la tabella dei simboli, cioè dei nomi, nel package.<\/span> <span class=\"sg\" data-s=\"6\">L'introspezione dei moduli usa proprio questo.<\/span> <span class=\"sg\" data-s=\"7\">Con l'introspezione, un programma guarda dentro un modulo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gli esempi qui sotto usano il modulo <code>Greeting<\/code> dei capitoli precedenti.<\/span> <span class=\"sg\" data-s=\"1\">Ha una subroutine che esporta.<\/span> <span class=\"sg\" data-s=\"2\">Ha anche una variabile <code>our<\/code> condivisa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per avere il package di un modulo, scrivi <code>::<\/code> dopo il suo nome.<\/span> <span class=\"sg\" data-s=\"1\">Poi aggiungi <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo elenca i nomi del package:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Il modulo <code>Greeting<\/code> dei capitoli precedenti ha una variabile <code>our<\/code>, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il suo package ha questo nome.<\/span> <span class=\"sg\" data-s=\"2\">Il nome include il sigillo.<\/span> <span class=\"sg\" data-s=\"3\">Accanto, vedi <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Questo forse ti sorprende.<\/span> <span class=\"sg\" data-s=\"5\">Anche <code>EXPORT<\/code> è un package.<\/span> <span class=\"sg\" data-s=\"6\">Raku lo crea automaticamente.<\/span> <span class=\"sg\" data-s=\"7\">Il modulo contrassegna alcune cose con <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> le tiene tutte, per esempio la subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Quindi un nome esportato <em>non<\/em> è direttamente nel package.<\/span> <span class=\"sg\" data-s=\"10\">È in <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Questo è un package più piccolo dentro il package del modulo.<\/span> <span class=\"sg\" data-s=\"12\">Le chiavi non arrivano in un ordine fisso.<\/span> <span class=\"sg\" data-s=\"13\">Quindi l'esempio le ordina.<\/span> <span class=\"sg\" data-s=\"14\">Così il risultato è sempre lo stesso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche trovare un nome nel package.<\/span> <span class=\"sg\" data-s=\"1\">Usa il nome come chiave.<\/span> <span class=\"sg\" data-s=\"2\">Ottieni lo stesso valore del nome completo <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elencare le esportazioni di un modulo<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">I nomi esportati sono davvero nel package <code>EXPORT<\/code> di prima.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi elencarli.<\/span> <span class=\"sg\" data-s=\"2\">Basta guardare un livello più sotto.<\/span> <span class=\"sg\" data-s=\"3\">Le esportazioni senza tag vanno nel gruppo <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Trovi di più sui tag in <a href=\"https://course.raku.org/it/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Tag di esportazione<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Le <code>.keys<\/code> di <code>DEFAULT<\/code> sono le routine esportate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ogni chiave è un nome esportato con il suo sigillo.<\/span> <span class=\"sg\" data-s=\"1\">Qui c'è una sola chiave: la subroutine <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il sigillo <code>&amp;<\/code> mostra che è una routine.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi scoprire cosa dà un modulo ai suoi utenti.<\/span> <span class=\"sg\" data-s=\"4\">Non devi leggere il suo codice sorgente.<\/span> <span class=\"sg\" data-s=\"5\">Basta chiedere al suo package <code>EXPORT::DEFAULT<\/code> cosa contiene.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Guardare dentro un package così è utile.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scoprire cosa ha un modulo.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche arrivare ai suoi nomi mentre il programma è in esecuzione.<\/span> <span class=\"sg\" data-s=\"3\">Allora non devi scrivere ogni nome nel codice.<\/span><\/p>"]]},"lv":{"t":"Moduļu introspekcija","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Moduļa nosaukums izveido arī <em>pakotni<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pakotne ir nosaukumtelpa.<\/span> <span class=\"sg\" data-s=\"2\">Tā glabā moduļa nosaukumus.<\/span> <span class=\"sg\" data-s=\"3\">Iepriekš, <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>, jūs redzējāt <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas atgriež pakotnes <code>Stash<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>Stash<\/code> ir pakotnes simbolu jeb nosaukumu tabula.<\/span> <span class=\"sg\" data-s=\"6\">Moduļu introspekcija to izmanto.<\/span> <span class=\"sg\" data-s=\"7\">Ar to programma ieskatās modulī.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tālākie piemēri izmanto moduli <code>Greeting<\/code> no iepriekšējām tēmām.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir apakšprogramma, ko tas eksportē.<\/span> <span class=\"sg\" data-s=\"2\">Tam ir arī koplietots <code>our<\/code> mainīgais:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu moduļa pakotni, rakstiet <code>::<\/code> aiz tā nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Tad pievienojiet <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas uzskaita pakotnes nosaukumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Modulim <code>Greeting<\/code> no iepriekšējām tēmām ir <code>our<\/code> mainīgais <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tā pakotnē ir šis nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Nosaukumā ir arī sigils.<\/span> <span class=\"sg\" data-s=\"3\">Blakus tam jūs redzat <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas var jūs pārsteigt.<\/span> <span class=\"sg\" data-s=\"5\">Arī <code>EXPORT<\/code> ir pakotne.<\/span> <span class=\"sg\" data-s=\"6\">Raku to izveido automātiski.<\/span> <span class=\"sg\" data-s=\"7\">Modulis dažas lietas atzīmē ar <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> glabā tās visas, piemēram, apakšprogrammu <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Tāpēc eksportēts nosaukums <em>nav<\/em> tieši pakotnē.<\/span> <span class=\"sg\" data-s=\"10\">Tas ir pakotnē <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Tā ir mazāka pakotne moduļa pakotnes iekšienē.<\/span> <span class=\"sg\" data-s=\"12\">Atslēgas nenāk noteiktā secībā.<\/span> <span class=\"sg\" data-s=\"13\">Tāpēc piemērs tās sakārto.<\/span> <span class=\"sg\" data-s=\"14\">Tad rezultāts vienmēr ir vienāds.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī atrast nosaukumu pakotnē.<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet nosaukumu kā atslēgu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs iegūstat to pašu vērtību kā ar pilno nosaukumu <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļa eksportu uzskaitīšana<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eksportētie nosaukumi patiesībā ir jau redzētajā pakotnē <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat tos uzskaitīt.<\/span> <span class=\"sg\" data-s=\"2\">Vienkārši ieskatieties vienu līmeni dziļāk.<\/span> <span class=\"sg\" data-s=\"3\">Eksporti bez birkas nonāk grupā <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Par birkām varat lasīt sadaļā <a href=\"https://course.raku.org/lv/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksporta birkas<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Grupas <code>DEFAULT<\/code> atslēgas <code>.keys<\/code> ir eksportētās rutīnas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Katra atslēga ir eksportēts nosaukums ar tā sigilu.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir tikai viena atslēga: apakšprogramma <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sigils <code>&amp;<\/code> parāda, ka tā ir rutīna.<\/span> <span class=\"sg\" data-s=\"3\">Tā jūs varat uzzināt, ko modulis dod saviem lietotājiem.<\/span> <span class=\"sg\" data-s=\"4\">Jums nav jālasa tā pirmkods.<\/span> <span class=\"sg\" data-s=\"5\">Vienkārši pajautājiet tā pakotnei <code>EXPORT::DEFAULT<\/code>, kas tajā ir.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ir noderīgi šādi ieskatīties pakotnē.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat uzzināt, kas modulim ir.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat arī piekļūt tā nosaukumiem, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"3\">Tad jums nav jāraksta katrs nosaukums kodā.<\/span><\/p>"]]},"ru":{"t":"Интроспекция модулей","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Имя модуля также создаёт <em>пакет<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакет — это пространство имён.<\/span> <span class=\"sg\" data-s=\"2\">В нём хранятся имена из модуля.<\/span> <span class=\"sg\" data-s=\"3\">Раньше, в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>, вы видели <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Он возвращает <code>Stash<\/code> пакета.<\/span> <span class=\"sg\" data-s=\"5\"><code>Stash<\/code> — это таблица символов, то есть имён, в пакете.<\/span> <span class=\"sg\" data-s=\"6\">Интроспекция модулей использует это.<\/span> <span class=\"sg\" data-s=\"7\">С её помощью программа смотрит внутрь модуля.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Примеры ниже используют модуль <code>Greeting<\/code> из прошлых тем.<\/span> <span class=\"sg\" data-s=\"1\">В нём есть подпрограмма, которую он экспортирует.<\/span> <span class=\"sg\" data-s=\"2\">Ещё в нём есть общая переменная <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить пакет модуля, напишите <code>::<\/code> после его имени.<\/span> <span class=\"sg\" data-s=\"1\">Потом добавьте <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он показывает имена в пакете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">У модуля <code>Greeting<\/code> из прошлых тем есть переменная <code>our<\/code> — <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в его пакете есть это имя.<\/span> <span class=\"sg\" data-s=\"2\">У имени есть сигил.<\/span> <span class=\"sg\" data-s=\"3\">Рядом с ним вы видите <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Это может удивить.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> — тоже пакет.<\/span> <span class=\"sg\" data-s=\"6\">Raku создаёт его автоматически.<\/span> <span class=\"sg\" data-s=\"7\">Модуль помечает некоторые вещи как <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> хранит их все, например подпрограмму <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Поэтому экспортированное имя лежит <em>не<\/em> прямо в пакете.<\/span> <span class=\"sg\" data-s=\"10\">Оно лежит в <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Это пакет поменьше внутри пакета модуля.<\/span> <span class=\"sg\" data-s=\"12\">Порядок ключей может быть разным.<\/span> <span class=\"sg\" data-s=\"13\">Поэтому пример их сортирует.<\/span> <span class=\"sg\" data-s=\"14\">Тогда результат всегда одинаковый.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ещё вы можете найти имя в пакете.<\/span> <span class=\"sg\" data-s=\"1\">Используйте имя как ключ.<\/span> <span class=\"sg\" data-s=\"2\">Вы получите то же значение, что и с полным именем <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Список экспортов модуля<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">На самом деле экспортированные имена лежат в пакете <code>EXPORT<\/code> из примера выше.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому их можно перечислить.<\/span> <span class=\"sg\" data-s=\"2\">Просто посмотрите на один уровень глубже.<\/span> <span class=\"sg\" data-s=\"3\">Экспорты без тега попадают в группу <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">О тегах можно прочитать в разделе <a href=\"https://course.raku.org/ru/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Теги экспорта<\/a>.<\/span> <span class=\"sg\" data-s=\"5\"><code>.keys<\/code> группы <code>DEFAULT<\/code> — это экспортированные подпрограммы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Каждый ключ — это экспортированное имя с сигилом.<\/span> <span class=\"sg\" data-s=\"1\">Здесь только один ключ: подпрограмма <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сигил <code>&amp;<\/code> показывает, что это подпрограмма.<\/span> <span class=\"sg\" data-s=\"3\">Так вы можете узнать, что модуль даёт своим пользователям.<\/span> <span class=\"sg\" data-s=\"4\">Вам не нужно читать его исходный код.<\/span> <span class=\"sg\" data-s=\"5\">Просто спросите его пакет <code>EXPORT::DEFAULT<\/code>, что в нём есть.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так смотреть внутрь пакета полезно.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете узнать, что есть в модуле.<\/span> <span class=\"sg\" data-s=\"2\">Ещё можно добраться до его имён, пока программа работает.<\/span> <span class=\"sg\" data-s=\"3\">Тогда не нужно писать каждое имя в коде.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція модулів","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ім'я модуля також створює <em>пакунок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакунок — це простір імен.<\/span> <span class=\"sg\" data-s=\"2\">Він зберігає імена з модуля.<\/span> <span class=\"sg\" data-s=\"3\">Раніше, у <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>, ви бачили <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він повертає <code>Stash<\/code> пакунка.<\/span> <span class=\"sg\" data-s=\"5\"><code>Stash<\/code> — це таблиця символів, тобто імен, у пакунку.<\/span> <span class=\"sg\" data-s=\"6\">Інтроспекція модулів використовує це.<\/span> <span class=\"sg\" data-s=\"7\">З нею програма заглядає всередину модуля.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Приклади нижче використовують модуль <code>Greeting<\/code> із попередніх тем.<\/span> <span class=\"sg\" data-s=\"1\">У ньому є підпрограма, яку він експортує.<\/span> <span class=\"sg\" data-s=\"2\">Також у ньому є спільна змінна <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати пакунок модуля, напишіть <code>::<\/code> після його імені.<\/span> <span class=\"sg\" data-s=\"1\">Потім додайте <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він перелічує імена в пакунку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Greeting<\/code> із попередніх тем має змінну <code>our<\/code> під назвою <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож це ім'я є в його пакунку.<\/span> <span class=\"sg\" data-s=\"2\">Сигіл теж входить в ім'я.<\/span> <span class=\"sg\" data-s=\"3\">Поруч із ним ви бачите <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це може вас здивувати.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> — це теж пакунок.<\/span> <span class=\"sg\" data-s=\"6\">Raku створює його автоматично.<\/span> <span class=\"sg\" data-s=\"7\">Модуль позначає деякі речі через <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> зберігає їх усі, наприклад, підпрограму <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Тож експортоване ім'я <em>не<\/em> лежить прямо в пакунку.<\/span> <span class=\"sg\" data-s=\"10\">Воно лежить в <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Це менший пакунок усередині пакунка модуля.<\/span> <span class=\"sg\" data-s=\"12\">Порядок ключів не завжди однаковий.<\/span> <span class=\"sg\" data-s=\"13\">Тому приклад сортує їх.<\/span> <span class=\"sg\" data-s=\"14\">Тоді результат завжди однаковий.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви також можете знайти ім'я в пакунку.<\/span> <span class=\"sg\" data-s=\"1\">Використайте ім'я як ключ.<\/span> <span class=\"sg\" data-s=\"2\">Ви отримаєте те саме значення, що й через повне ім'я <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Список експортів модуля<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Насправді експортовані імена лежать у пакунку <code>EXPORT<\/code>, який ви бачили вище.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете їх перелічити.<\/span> <span class=\"sg\" data-s=\"2\">Просто загляньте на рівень глибше.<\/span> <span class=\"sg\" data-s=\"3\">Експорти без мітки потрапляють до групи <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Про мітки можна прочитати в темі <a href=\"https://course.raku.org/uk/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Мітки експорту<\/a>.<\/span> <span class=\"sg\" data-s=\"5\"><code>.keys<\/code> групи <code>DEFAULT<\/code> — це експортовані підпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Кожен ключ — це експортоване ім'я з його сигілом.<\/span> <span class=\"sg\" data-s=\"1\">Тут є лише один ключ: підпрограма <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сигіл <code>&amp;<\/code> показує, що це підпрограма.<\/span> <span class=\"sg\" data-s=\"3\">Так ви можете дізнатися, що модуль дає своїм користувачам.<\/span> <span class=\"sg\" data-s=\"4\">Вам не треба читати його вихідний код.<\/span> <span class=\"sg\" data-s=\"5\">Просто спитайте його пакунок <code>EXPORT::DEFAULT<\/code>, що він містить.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так заглядати всередину пакунка корисно.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете дізнатися, що є в модулі.<\/span> <span class=\"sg\" data-s=\"2\">Також ви можете дістатися до його імен під час роботи програми.<\/span> <span class=\"sg\" data-s=\"3\">Тоді вам не треба писати кожне ім'я в коді.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на модули","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Името на модула създава и <em>пакет<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакетът е пространство от имена.<\/span> <span class=\"sg\" data-s=\"2\">Той пази имената от модула.<\/span> <span class=\"sg\" data-s=\"3\">По-рано, в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>, видяхте <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той връща <code>Stash<\/code> на пакета.<\/span> <span class=\"sg\" data-s=\"5\"><code>Stash<\/code> е таблицата със символи, или имена, в пакета.<\/span> <span class=\"sg\" data-s=\"6\">Интроспекцията на модули използва това.<\/span> <span class=\"sg\" data-s=\"7\">С нея програмата гледа вътре в модула.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Примерите по-долу използват модула <code>Greeting<\/code> от предишните теми.<\/span> <span class=\"sg\" data-s=\"1\">Той има подпрограма, която експортира.<\/span> <span class=\"sg\" data-s=\"2\">Има и споделена <code>our<\/code> променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да получите пакета на модул, напишете <code>::<\/code> след името му.<\/span> <span class=\"sg\" data-s=\"1\">След това добавете <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той изброява имената в пакета:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Модулът <code>Greeting<\/code> от предишните теми има <code>our<\/code> променлива, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Така пакетът му има това име.<\/span> <span class=\"sg\" data-s=\"2\">Името включва сигила.<\/span> <span class=\"sg\" data-s=\"3\">До него виждате <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Това може да ви изненада.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> също е пакет.<\/span> <span class=\"sg\" data-s=\"6\">Raku го създава автоматично.<\/span> <span class=\"sg\" data-s=\"7\">Модулът маркира някои неща с <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> пази всички тях, например подпрограмата <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Затова експортираното име <em>не<\/em> е директно в пакета.<\/span> <span class=\"sg\" data-s=\"10\">То е в <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Това е по-малък пакет вътре в пакета на модула.<\/span> <span class=\"sg\" data-s=\"12\">Ключовете не идват в определен ред.<\/span> <span class=\"sg\" data-s=\"13\">Затова примерът ги сортира.<\/span> <span class=\"sg\" data-s=\"14\">Тогава резултатът е винаги същият.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете също да намерите име в пакета.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте името като ключ.<\/span> <span class=\"sg\" data-s=\"2\">Получавате същата стойност като с пълното име <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Списък на експортите на модул<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Експортираните имена всъщност са в пакета <code>EXPORT<\/code> от по-горе.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да ги изброите.<\/span> <span class=\"sg\" data-s=\"2\">Просто погледнете едно ниво по-навътре.<\/span> <span class=\"sg\" data-s=\"3\">Експортите без таг отиват в групата <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">За таговете можете да прочетете в <a href=\"https://course.raku.org/bg/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Тагове за експортиране<\/a>.<\/span> <span class=\"sg\" data-s=\"5\"><code>.keys<\/code> на <code>DEFAULT<\/code> показва експортираните рутини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Всеки ключ е експортирано име със сигила му.<\/span> <span class=\"sg\" data-s=\"1\">Тук има само един ключ: подпрограмата <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сигилът <code>&amp;<\/code> показва, че това е рутина.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да разберете какво дава модулът на своите потребители.<\/span> <span class=\"sg\" data-s=\"4\">Не е нужно да четете изходния му код.<\/span> <span class=\"sg\" data-s=\"5\">Просто попитайте пакета му <code>EXPORT::DEFAULT<\/code> какво има в него.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Полезно е да гледате вътре в пакета по този начин.<\/span> <span class=\"sg\" data-s=\"1\">Можете да разберете какво има модулът.<\/span> <span class=\"sg\" data-s=\"2\">Можете и да стигнете до имената му, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"3\">Тогава не е нужно да пишете всяко име в кода.<\/span><\/p>"]]},"eo":{"t":"Modula introspekto","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">La nomo de modulo ankaŭ kreas <em>pakaĵon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pakaĵo estas nomspaco.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi tenas la nomojn el la modulo.<\/span> <span class=\"sg\" data-s=\"3\">Pli frue, en <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sekcio pri ujoj<\/a>, vi vidis <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi redonas la <code>Stash<\/code> de pakaĵo.<\/span> <span class=\"sg\" data-s=\"5\">La <code>Stash<\/code> estas la tabelo de simboloj, aŭ nomoj, en la pakaĵo.<\/span> <span class=\"sg\" data-s=\"6\">Modula introspektado uzas tion.<\/span> <span class=\"sg\" data-s=\"7\">Per ĝi, programo rigardas en modulon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La ekzemploj sube uzas la modulon <code>Greeting<\/code> el la antaŭaj temoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas subrutinon, kiun ĝi eksportas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ havas dividatan <code>our<\/code>-variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la pakaĵon de modulo, skribu <code>::<\/code> post ĝia nomo.<\/span> <span class=\"sg\" data-s=\"1\">Poste aldonu <code>.keys<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi listigas la nomojn en la pakaĵo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">La modulo <code>Greeting<\/code> el la antaŭaj temoj havas <code>our<\/code>-variablon, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝia pakaĵo havas ĉi tiun nomon.<\/span> <span class=\"sg\" data-s=\"2\">La nomo enhavas ankaŭ la sigelon.<\/span> <span class=\"sg\" data-s=\"3\">Apud ĝi, vi vidas <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tio eble surprizas vin.<\/span> <span class=\"sg\" data-s=\"5\">Ankaŭ <code>EXPORT<\/code> estas pakaĵo.<\/span> <span class=\"sg\" data-s=\"6\">Raku kreas ĝin aŭtomate.<\/span> <span class=\"sg\" data-s=\"7\">La modulo markas kelkajn aferojn per <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> tenas ĉiujn el ili, ekzemple la subrutinon <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Do eksportita nomo <em>ne<\/em> estas rekte en la pakaĵo.<\/span> <span class=\"sg\" data-s=\"10\">Ĝi estas en <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"11\">Tio estas pli malgranda pakaĵo ene de la pakaĵo de la modulo.<\/span> <span class=\"sg\" data-s=\"12\">La ŝlosiloj ne venas en fiksita ordo.<\/span> <span class=\"sg\" data-s=\"13\">Do la ekzemplo ordigas ilin.<\/span> <span class=\"sg\" data-s=\"14\">Tiam la rezulto estas ĉiam la sama.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas trovi nomon en la pakaĵo.<\/span> <span class=\"sg\" data-s=\"1\">Uzu la nomon kiel ŝlosilon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ricevas la saman valoron kiel per la plena nomo <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listigo de la eksportaĵoj de modulo<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La eksportitaj nomoj vere estas en la pakaĵo <code>EXPORT<\/code>, kiun vi vidis supre.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas listigi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Simple rigardu unu nivelon pli profunde.<\/span> <span class=\"sg\" data-s=\"3\">Eksportaĵoj sen etikedo iras en la grupon <code>DEFAULT<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas legi pri etikedoj en <a href=\"https://course.raku.org/eo/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksportaj etikedoj<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">La <code>.keys<\/code> de <code>DEFAULT<\/code> estas la eksportitaj rutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ŝlosilo estas eksportita nomo kun sia sigelo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie estas nur unu ŝlosilo: la subrutino <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sigelo <code>&amp;<\/code> montras, ke ĝi estas rutino.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas ekscii, kion modulo donas al siaj uzantoj.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne bezonas legi ĝian fontkodon.<\/span> <span class=\"sg\" data-s=\"5\">Simple demandu al ĝia pakaĵo <code>EXPORT::DEFAULT<\/code>, kion ĝi havas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rigardi en pakaĵon tiel estas utile.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas ekscii, kion modulo havas.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas atingi ĝiajn nomojn, dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi ne devas skribi ĉiun nomon en la kodo.<\/span><\/p>"]]},"la":{"t":"Introspectio modulorum","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Nomen moduli etiam <em>fasciculum<\/em> creat.<\/span> <span class=\"sg\" data-s=\"1\">Fasciculus est spatium nominum.<\/span> <span class=\"sg\" data-s=\"2\">Nomina ex modulo servat.<\/span> <span class=\"sg\" data-s=\"3\">Antea, in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de continentibus<\/a>, <code>WHO<\/code> vidisti.<\/span> <span class=\"sg\" data-s=\"4\">Id <code>Stash<\/code> fasciculi reddit.<\/span> <span class=\"sg\" data-s=\"5\"><code>Stash<\/code> est tabula symbolorum, id est nominum, in fasciculo.<\/span> <span class=\"sg\" data-s=\"6\">Introspectio moduli hoc adhibet.<\/span> <span class=\"sg\" data-s=\"7\">Cum ea programma modulum intus inspicit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Exempla infra modulum <code>Greeting<\/code> ex prioribus argumentis adhibent.<\/span> <span class=\"sg\" data-s=\"1\">Subroutinam habet quam exportat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam variabilem communem <code>our<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut fasciculum moduli accipias, <code>::<\/code> post nomen eius scribe.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>.keys<\/code> adde.<\/span> <span class=\"sg\" data-s=\"2\">Id nomina in fasciculo enumerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",15,"<p><span class=\"sg\" data-s=\"0\">Modulus <code>Greeting<\/code> ex prioribus argumentis variabilem <code>our<\/code> habet, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque fasciculus eius hoc nomen habet.<\/span> <span class=\"sg\" data-s=\"2\">Nomen etiam sigillum habet.<\/span> <span class=\"sg\" data-s=\"3\">Iuxta id <code>EXPORT<\/code> vides.<\/span> <span class=\"sg\" data-s=\"4\">Hoc fortasse mirum est.<\/span> <span class=\"sg\" data-s=\"5\"><code>EXPORT<\/code> quoque fasciculus est.<\/span> <span class=\"sg\" data-s=\"6\">Raku eum automatice facit.<\/span> <span class=\"sg\" data-s=\"7\">Modulus quasdam res <code>is export<\/code> notat.<\/span> <span class=\"sg\" data-s=\"8\"><code>EXPORT<\/code> omnes eas servat, exempli gratia subroutinam <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Itaque nomen exportatum <em>non<\/em> directe in fasciculo est.<\/span> <span class=\"sg\" data-s=\"10\">In <code>EXPORT<\/code> est.<\/span> <span class=\"sg\" data-s=\"11\">Hic est minor fasciculus intra fasciculum moduli.<\/span> <span class=\"sg\" data-s=\"12\">Claves non in ordine fixo veniunt.<\/span> <span class=\"sg\" data-s=\"13\">Itaque exemplum eas ordinat.<\/span> <span class=\"sg\" data-s=\"14\">Tum resultatum semper idem est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam nomen in fasciculo invenire potes.<\/span> <span class=\"sg\" data-s=\"1\">Nomine ut clave utere.<\/span> <span class=\"sg\" data-s=\"2\">Eundem valorem accipis ac cum nomine pleno <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exportata moduli enumerare<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Nomina exportata re vera in fasciculo <code>EXPORT<\/code> sunt, quem supra vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Itaque ea enumerare potes.<\/span> <span class=\"sg\" data-s=\"2\">Inspice tantum unum gradum profundius.<\/span> <span class=\"sg\" data-s=\"3\">Exportata sine indice in gregem <code>DEFAULT<\/code> eunt.<\/span> <span class=\"sg\" data-s=\"4\">De indicibus legere potes in <a href=\"https://course.raku.org/la/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Indices exportationis<\/a>.<\/span> <span class=\"sg\" data-s=\"5\"><code>.keys<\/code> gregis <code>DEFAULT<\/code> sunt subroutinae exportatae:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Quaeque clavis est nomen exportatum cum sigillo suo.<\/span> <span class=\"sg\" data-s=\"1\">Hic una tantum clavis est: subroutina <code>&amp;hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sigillum <code>&amp;<\/code> ostendit: haec est routina.<\/span> <span class=\"sg\" data-s=\"3\">Ita cognoscere potes quid modulus utentibus suis det.<\/span> <span class=\"sg\" data-s=\"4\">Codicem fontis eius legere non debes.<\/span> <span class=\"sg\" data-s=\"5\">Tantum fasciculum eius <code>EXPORT::DEFAULT<\/code> interroga quid habeat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fasciculum sic intus inspicere utile est.<\/span> <span class=\"sg\" data-s=\"1\">Cognoscere potes quid modulus habeat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam ad nomina eius pervenire potes, dum programma currit.<\/span> <span class=\"sg\" data-s=\"3\">Tum non debes unumquodque nomen in codice scribere.<\/span><\/p>"]]}}}</script>
