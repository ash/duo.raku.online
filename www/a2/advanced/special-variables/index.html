<script type="application/json" id="page-data">{"u":"advanced/special-variables","n":405,"k":"section","pv":"advanced/subscript-adverbs/exercises/key-and-value/solution","nx":"advanced/special-variables/twigils","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Special and dynamic variables","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">A Raku variable name can have a second sign after the sigil.<\/span> <span class=\"sg\" data-s=\"1\">This sign is a <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The twigil tells you where the variable lives.<\/span> <span class=\"sg\" data-s=\"3\">It also tells you how Raku finds it.<\/span> <span class=\"sg\" data-s=\"4\">For example, the variable can be dynamic.<\/span> <span class=\"sg\" data-s=\"5\">Or the compiler can give it to you.<\/span> <span class=\"sg\" data-s=\"6\">Or it can belong to an object.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">This section explains twigils.<\/span> <span class=\"sg\" data-s=\"1\">Then it looks closely at the most useful kind: <em>dynamic<\/em> variables.<\/span> <span class=\"sg\" data-s=\"2\">Raku finds a normal variable by its lexical scope.<\/span> <span class=\"sg\" data-s=\"3\">This is the block where you declare it.<\/span> <span class=\"sg\" data-s=\"4\">Raku finds a dynamic variable in another way.<\/span> <span class=\"sg\" data-s=\"5\">It looks through the call stack.<\/span> <span class=\"sg\" data-s=\"6\">The call stack shows which code called the current code.<\/span> <span class=\"sg\" data-s=\"7\">Last, the section shows the special variables that Raku gives you.<\/span><\/p>"]]},"de":{"t":"Spezielle und dynamische Variablen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ein Variablenname in Raku kann nach dem Sigil ein zweites Zeichen haben.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Zeichen ist ein <em>Twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Das Twigil sagt dir, wo die Variable lebt.<\/span> <span class=\"sg\" data-s=\"3\">Es sagt dir auch, wie Raku sie findet.<\/span> <span class=\"sg\" data-s=\"4\">Zum Beispiel kann die Variable dynamisch sein.<\/span> <span class=\"sg\" data-s=\"5\">Oder der Compiler kann sie dir geben.<\/span> <span class=\"sg\" data-s=\"6\">Oder sie kann zu einem Objekt gehören.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt erklärt Twigils.<\/span> <span class=\"sg\" data-s=\"1\">Dann schaut er sich die nützlichste Art genau an: <em>dynamische<\/em> Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Raku findet eine normale Variable über ihren lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"3\">Das ist der Block, in dem du sie deklarierst.<\/span> <span class=\"sg\" data-s=\"4\">Eine dynamische Variable findet Raku auf eine andere Weise.<\/span> <span class=\"sg\" data-s=\"5\">Raku sucht dabei im Aufrufstapel.<\/span> <span class=\"sg\" data-s=\"6\">Der Aufrufstapel zeigt, welcher Code den aktuellen Code aufgerufen hat.<\/span> <span class=\"sg\" data-s=\"7\">Zuletzt zeigt der Abschnitt die speziellen Variablen, die Raku dir gibt.<\/span><\/p>"]]},"nl":{"t":"Speciale en dynamische variabelen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Een variabelenaam in Raku kan na de sigil een tweede teken hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dit teken is een <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De twigil vertelt je waar de variabele leeft.<\/span> <span class=\"sg\" data-s=\"3\">Hij vertelt je ook hoe Raku hem vindt.<\/span> <span class=\"sg\" data-s=\"4\">De variabele kan bijvoorbeeld dynamisch zijn.<\/span> <span class=\"sg\" data-s=\"5\">Of de compiler kan hem aan je geven.<\/span> <span class=\"sg\" data-s=\"6\">Of hij kan bij een object horen.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel legt twigils uit.<\/span> <span class=\"sg\" data-s=\"1\">Daarna kijkt het goed naar het nuttigste soort: <em>dynamische<\/em> variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Raku vindt een gewone variabele via zijn lexicale scope.<\/span> <span class=\"sg\" data-s=\"3\">Dat is het blok waarin je hem declareert.<\/span> <span class=\"sg\" data-s=\"4\">Raku vindt een dynamische variabele op een andere manier.<\/span> <span class=\"sg\" data-s=\"5\">Raku zoekt in de call stack.<\/span> <span class=\"sg\" data-s=\"6\">De call stack toont welke code de huidige code aanroept.<\/span> <span class=\"sg\" data-s=\"7\">Tot slot toont het onderdeel de speciale variabelen die Raku je geeft.<\/span><\/p>"]]},"es":{"t":"Variables especiales y dinámicas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">El nombre de una variable de Raku puede tener un segundo signo después del sigilo.<\/span> <span class=\"sg\" data-s=\"1\">Este signo es un <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">El twigil te dice dónde vive la variable.<\/span> <span class=\"sg\" data-s=\"3\">También te dice cómo la encuentra Raku.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, la variable puede ser dinámica.<\/span> <span class=\"sg\" data-s=\"5\">O el compilador te la puede dar.<\/span> <span class=\"sg\" data-s=\"6\">O puede pertenecer a un objeto.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Esta sección explica los twigils.<\/span> <span class=\"sg\" data-s=\"1\">Luego mira de cerca el tipo más útil: las variables <em>dinámicas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku encuentra una variable normal por su ámbito léxico.<\/span> <span class=\"sg\" data-s=\"3\">Este es el bloque donde la declaras.<\/span> <span class=\"sg\" data-s=\"4\">Raku encuentra una variable dinámica de otra forma.<\/span> <span class=\"sg\" data-s=\"5\">Busca en la pila de llamadas.<\/span> <span class=\"sg\" data-s=\"6\">La pila de llamadas muestra qué código llamó al código actual.<\/span> <span class=\"sg\" data-s=\"7\">Por último, la sección muestra las variables especiales que Raku te da.<\/span><\/p>"]]},"it":{"t":"Variabili speciali e dinamiche","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Il nome di una variabile Raku può avere un secondo segno dopo il sigillo.<\/span> <span class=\"sg\" data-s=\"1\">Questo segno è un <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Il twigil ti dice dove vive la variabile.<\/span> <span class=\"sg\" data-s=\"3\">Ti dice anche come Raku la trova.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, la variabile può essere dinamica.<\/span> <span class=\"sg\" data-s=\"5\">Oppure il compilatore può dartela.<\/span> <span class=\"sg\" data-s=\"6\">Oppure può appartenere a un oggetto.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Questa sezione spiega i twigil.<\/span> <span class=\"sg\" data-s=\"1\">Poi guarda da vicino il tipo più utile: le variabili <em>dinamiche<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku trova una variabile normale con il suo scope lessicale.<\/span> <span class=\"sg\" data-s=\"3\">È il blocco dove la dichiari.<\/span> <span class=\"sg\" data-s=\"4\">Raku trova una variabile dinamica in un altro modo.<\/span> <span class=\"sg\" data-s=\"5\">Cerca nello stack delle chiamate.<\/span> <span class=\"sg\" data-s=\"6\">Lo stack delle chiamate mostra quale codice ha chiamato il codice attuale.<\/span> <span class=\"sg\" data-s=\"7\">Alla fine, la sezione mostra le variabili speciali che Raku ti dà.<\/span><\/p>"]]},"lv":{"t":"Speciālie un dinamiskie mainīgie 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku mainīgā nosaukumā aiz sigila var būt otra zīme.<\/span> <span class=\"sg\" data-s=\"1\">Šī zīme ir <em>tvigils<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tvigils pasaka, kur mainīgais dzīvo.<\/span> <span class=\"sg\" data-s=\"3\">Tas pasaka arī, kā Raku to atrod.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, mainīgais var būt dinamisks.<\/span> <span class=\"sg\" data-s=\"5\">Vai arī kompilators var to jums dot.<\/span> <span class=\"sg\" data-s=\"6\">Vai arī tas var piederēt objektam.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa izskaidro tvigilus.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tā tuvāk aplūko noderīgāko veidu: <em>dinamiskos<\/em> mainīgos.<\/span> <span class=\"sg\" data-s=\"2\">Parastu mainīgo Raku atrod pēc tā leksiskā redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir bloks, kurā jūs to deklarējat.<\/span> <span class=\"sg\" data-s=\"4\">Dinamisku mainīgo Raku atrod citādi.<\/span> <span class=\"sg\" data-s=\"5\">Tas meklē caur izsaukumu steku.<\/span> <span class=\"sg\" data-s=\"6\">Izsaukumu steks parāda, kurš kods izsauca pašreizējo kodu.<\/span> <span class=\"sg\" data-s=\"7\">Beigās sadaļa parāda speciālos mainīgos, ko Raku jums dod.<\/span><\/p>"]]},"ru":{"t":"Специальные и динамические переменные","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У имени переменной в Raku может быть второй знак после сигила.<\/span> <span class=\"sg\" data-s=\"1\">Этот знак — <em>твигил<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Твигил говорит, где живёт переменная.<\/span> <span class=\"sg\" data-s=\"3\">Ещё он говорит, как Raku её находит.<\/span> <span class=\"sg\" data-s=\"4\">Например, переменная может быть динамической.<\/span> <span class=\"sg\" data-s=\"5\">Или её может дать вам компилятор.<\/span> <span class=\"sg\" data-s=\"6\">Или она может принадлежать объекту.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Этот раздел объясняет твигилы.<\/span> <span class=\"sg\" data-s=\"1\">Потом он подробно смотрит на самый полезный их вид: <em>динамические<\/em> переменные.<\/span> <span class=\"sg\" data-s=\"2\">Обычную переменную Raku находит по её лексической области видимости.<\/span> <span class=\"sg\" data-s=\"3\">Это блок, где вы её объявили.<\/span> <span class=\"sg\" data-s=\"4\">Динамическую переменную Raku находит по-другому.<\/span> <span class=\"sg\" data-s=\"5\">Он ищет её по стеку вызовов.<\/span> <span class=\"sg\" data-s=\"6\">Стек вызовов показывает, какой код вызвал текущий код.<\/span> <span class=\"sg\" data-s=\"7\">В конце раздел показывает специальные переменные, которые Raku даёт вам.<\/span><\/p>"]]},"uk":{"t":"Спеціальні та динамічні змінні","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ім'я змінної в Raku може мати другий знак після сигіла.<\/span> <span class=\"sg\" data-s=\"1\">Цей знак — <em>твіґіл<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Твіґіл каже, де живе змінна.<\/span> <span class=\"sg\" data-s=\"3\">Він також каже, як Raku її знаходить.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, змінна може бути динамічною.<\/span> <span class=\"sg\" data-s=\"5\">Або її може дати вам компілятор.<\/span> <span class=\"sg\" data-s=\"6\">Або вона може належати об'єкту.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Цей розділ пояснює твіґіли.<\/span> <span class=\"sg\" data-s=\"1\">Потім він уважно розглядає найкорисніший їхній вид: <em>динамічні<\/em> змінні.<\/span> <span class=\"sg\" data-s=\"2\">Звичайну змінну Raku знаходить за її лексичною областю видимості.<\/span> <span class=\"sg\" data-s=\"3\">Це блок, де ви її оголошуєте.<\/span> <span class=\"sg\" data-s=\"4\">Динамічну змінну Raku знаходить інакше.<\/span> <span class=\"sg\" data-s=\"5\">Він шукає через стек викликів.<\/span> <span class=\"sg\" data-s=\"6\">Стек викликів показує, який код викликав поточний код.<\/span> <span class=\"sg\" data-s=\"7\">Наостанок розділ показує спеціальні змінні, які Raku дає вам.<\/span><\/p>"]]},"bg":{"t":"Специални и динамични променливи 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Името на променлива в Raku може да има втори знак след сигила.<\/span> <span class=\"sg\" data-s=\"1\">Този знак е <em>туигил<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Туигилът ви казва къде живее променливата.<\/span> <span class=\"sg\" data-s=\"3\">Той ви казва и как Raku я намира.<\/span> <span class=\"sg\" data-s=\"4\">Например, променливата може да е динамична.<\/span> <span class=\"sg\" data-s=\"5\">Или компилаторът може да ви я даде.<\/span> <span class=\"sg\" data-s=\"6\">Или тя може да принадлежи на обект.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Този раздел обяснява туигилите.<\/span> <span class=\"sg\" data-s=\"1\">След това разглежда отблизо най-полезния вид: <em>динамичните<\/em> променливи.<\/span> <span class=\"sg\" data-s=\"2\">Raku намира обикновена променлива по нейния лексикален обхват.<\/span> <span class=\"sg\" data-s=\"3\">Това е блокът, в който я декларирате.<\/span> <span class=\"sg\" data-s=\"4\">Raku намира динамична променлива по друг начин.<\/span> <span class=\"sg\" data-s=\"5\">Raku търси през стека на извикванията.<\/span> <span class=\"sg\" data-s=\"6\">Стекът на извикванията показва кой код е извикал текущия код.<\/span> <span class=\"sg\" data-s=\"7\">Накрая разделът показва специалните променливи, които Raku ви дава.<\/span><\/p>"]]},"eo":{"t":"Specialaj kaj dinamikaj variabloj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Nomo de Raku-variablo povas havi duan signon post la sigelo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu signo estas <em>tvigilo<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La tvigilo diras al vi, kie la variablo loĝas.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ diras, kiel Raku trovas ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, la variablo povas esti dinamika.<\/span> <span class=\"sg\" data-s=\"5\">Aŭ la kompililo povas doni ĝin al vi.<\/span> <span class=\"sg\" data-s=\"6\">Aŭ ĝi povas aparteni al objekto.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio klarigas tvigilojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi detale rigardas la plej utilan specon: <em>dinamikajn<\/em> variablojn.<\/span> <span class=\"sg\" data-s=\"2\">Raku trovas normalan variablon per ĝia leksika amplekso.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas la bloko, kie vi deklaras ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Raku trovas dinamikan variablon alimaniere.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi serĉas tra la voka stako.<\/span> <span class=\"sg\" data-s=\"6\">La voka stako montras, kiu kodo vokis la nunan kodon.<\/span> <span class=\"sg\" data-s=\"7\">Fine, la sekcio montras la specialajn variablojn, kiujn Raku donas al vi.<\/span><\/p>"]]},"la":{"t":"Speciales et dynamicae variabiles","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Nomen variabilis in Raku alterum signum post sigillum habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc signum est <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Twigil locum variabilis tibi ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Etiam modum ostendit quo Raku eam invenit.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, variabilis dynamica esse potest.<\/span> <span class=\"sg\" data-s=\"5\">Vel compilator eam tibi dare potest.<\/span> <span class=\"sg\" data-s=\"6\">Vel ad obiectum pertinere potest.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Haec sectio twigilia explicat.<\/span> <span class=\"sg\" data-s=\"1\">Deinde genus utilissimum propius inspicit: variabiles <em>dynamicas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku variabilem vulgarem per circumscriptionem lexicam eius invenit.<\/span> <span class=\"sg\" data-s=\"3\">Haec est clausula ubi eam declaras.<\/span> <span class=\"sg\" data-s=\"4\">Raku variabilem dynamicam alio modo invenit.<\/span> <span class=\"sg\" data-s=\"5\">Per acervum vocationum quaerit.<\/span> <span class=\"sg\" data-s=\"6\">Acervus vocationum ostendit codicem qui codicem praesentem vocavit.<\/span> <span class=\"sg\" data-s=\"7\">Postremo sectio variabiles speciales ostendit quas Raku tibi dat.<\/span><\/p>"]]}}}</script>
