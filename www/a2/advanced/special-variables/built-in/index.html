<script type="application/json" id="page-data">{"u":"advanced/special-variables/built-in","n":410,"k":"topic","pv":"advanced/special-variables/dynamic-variables/quiz","nx":"advanced/special-variables/built-in/quiz","tr":["advanced","advanced/special-variables"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in special variables","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku has a set of variables ready for you.<\/span> <span class=\"sg\" data-s=\"1\">Most of them are <em>dynamic<\/em>, with the twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You already know <a href=\"/advanced/special-variables/dynamic-variables/\">dynamic variables<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">So you can read these variables anywhere.<\/span> <span class=\"sg\" data-s=\"4\">You can even give them a new value for one scope.<\/span> <span class=\"sg\" data-s=\"5\">Here are the variables that you need most often.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standard streams<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Input and output go through three dynamic variables.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> is standard output.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> is standard error, an output for error messages.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> is standard input.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> and <code>print<\/code> write to <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Do you want to send text to standard error?<\/span> <span class=\"sg\" data-s=\"6\">Then call the method on <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">These variables are dynamic.<\/span> <span class=\"sg\" data-s=\"1\" able for a scope.<\/span> <span class=\"sg\" data-s=\"4\">It works just like your own <code>$*<\/code> variable.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">These are all dynamic variables.<\/span> <span class=\"sg\" data-s=\"1\">But Raku also has built-in variables with the twigil <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">These are <code>$?FILE<\/code> and <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The compiler sets their values before the program runs.<\/span> <span class=\"sg\" data-s=\"4\">You already saw them on the page about <a href=\"/advanced/special-variables/twigils/\">twigils<\/a>.<\/span><\/p>"]]},"de":{"t":"Eingebaute spezielle Variablen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine Reihe von Variablen für dich bereit.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten davon sind <em>dynamisch<\/em>, mit dem Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Du kennst <a href=\"https://course.raku.org/de/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische Variablen<\/a> schon.<\/span> <span class=\"sg\" data-s=\"3\">Also kannst du diese Variablen überall lesen.<\/span> <span class=\"sg\" data-s=\"4\">Du kannst ihnen sogar einen neuen Wert für einen Geltungsbereich geben.<\/span> <span class=\"sg\" data-s=\"5\">Hier sind die Variablen, die du am häufigsten brauchst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standardströme<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Eingabe und Ausgabe gehen durch drei dynamische Variablen.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> ist die Standardausgabe.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> ist die Standardfehlerausgabe, eine Ausgabe für Fehlermeldungen.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> ist die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> und <code>print<\/code> schreiben nach <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Willst du Text an die Standardfehlerausgabe senden?<\/span> <span class=\"sg\" data-s=\"6\">Dann rufe die Methode auf <code>$*ERR<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diese Variablen sind dynamisch.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du <code>$*OUT<\/code> in einem Block an einen neuen Ort schicken.<\/span> <span class=\"sg\" data-s=\"2\">Dann gibt der Code, den du im Block aufrufst, dort aus.<\/span> <span class=\"sg\" data-s=\"3\">Du änderst diesen Code überhaupt nicht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das Programm und sein Prozess<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Manche Variablen sagen dir etwas über das Programm, das gerade läuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ihre Werte sind bei jedem Start des Programms anders.<\/span> <span class=\"sg\" data-s=\"1\">Also zeigen wir die Ausgabe hier nicht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommandozeile und Umgebung<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku legt die Argumente und die Umgebung in zwei Container.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind für dich bereit:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — die Liste der Kommandozeilenargumente; eine <code>MAIN<\/code>-Subroutine bekommt dieselben Argumente<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — die Umgebungsvariablen, in einem Hash<\/span><\/li><\/ul>"],["code",0,"<pre <h3><span class=\"sg\" data-s=\"0\">Commandoregel en omgeving<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku zet de argumenten en de omgevingsvariabelen in twee containers.<\/span> <span class=\"sg\" data-s=\"1\">Ze staan voor je klaar:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — de lijst met commandoregelargumenten; een <code>MAIN<\/code>-subroutine krijgt dezelfde argumenten<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — de omgevingsvariabelen, in een hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Deze ingebouwde variabelen besparen je werk.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft deze informatie niet zelf op te halen.<\/span> <span class=\"sg\" data-s=\"2\">Ze zijn dynamisch, dus Raku zoekt ze op via de call stack.<\/span> <span class=\"sg\" data-s=\"3\">Dus kun je elke ingebouwde <code>$*<\/code>-variabele overschrijven voor een scope.<\/span> <span class=\"sg\" data-s=\"4\">Het werkt net als je eigen <code>$*<\/code>-variabele.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit zijn allemaal dynamische variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Maar Raku heeft ook ingebouwde variabelen met de twigil <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat zijn <code>$?FILE<\/code> en <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De compiler geeft ze hun waarde voordat het programma draait.<\/span> <span class=\"sg\" data-s=\"4\">Je zag ze al op de pagina over <a href=\"https://course.raku.org/nl/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"es":{"t":"Variables especiales integradas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku tiene un conjunto de variables listas para ti.<\/span> <span class=\"sg\" data-s=\"1\">La mayoría son <em>dinámicas<\/em>, con el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ya conoces las <a href=\"https://course.raku.org/es/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variables dinámicas<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes leer estas variables en cualquier lugar.<\/span> <span class=\"sg\" data-s=\"4\">Incluso puedes darles un valor nuevo para un ámbito.<\/span> <span class=\"sg\" data-s=\"5\">Estas son las variables que necesitas más a menudo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Flujos estándar<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La entrada y la salida pasan por tres variables dinámicas.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> es la salida estándar.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> es el error estándar, una salida para los mensajes de error.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> es la entrada estándar.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> y <code>print<\/code> escriben en <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">¿Quieres enviar texto al error estándar?<\/span> <span class=\"sg\" data-s=\"6\">Entonces llama al método sobre <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estas variables son dinámicas.<\/span> <span class=\"sg\" data-s=\"1\">Así que, dentro de un bloque, puedes enviar <code>$*OUT<\/code> a otro lugar.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el código que llamas en el bloque imprime allí.<\/span> <span class=\"sg\" data-s=\"3\">No cambias nada de ese código.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El programa y su proceso<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunas variables te hablan del programa que se ejecuta ahora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sus valores son diferentes cada vez que ejecutas el programa.<\/span> <span class=\"sg\" data-s=\"1\">Por eso aquí no mostramos la salida.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Línea de comandos y entorno<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku pone los argumentos y el entorno en dos contenedores.<\/span> <span class=\"sg\" data-s=\"1\">Están listos para ti:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista de argumentos de línea de comandos; una subrutina <code>MAIN<\/code> recibe los mismos argumentos<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — las variables de entorno, en un hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Estas variables integradas te ahorran trabajo.<\/span> <span class=\"sg\" data-s=\"1\">No tienes que obtener esta información tú mismo.<\/span> <span class=\"sg\" data-s=\"2\">Son dinámicas, así que Raku las busca a través de la pila de llamadas.<\/span> <span class=\"sg\" data-s=\"3\">Por eso puedes anular cualquier variable integrada <code>$*<\/code> para un ámbito.<\/span> <span class=\"sg\" data-s=\"4\">Funciona igual que tu propia variable <code>$*<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Todas estas son variables dinámicas.<\/span> <span class=\"sg\" data-s=\"1\">Pero Raku también tiene variables integradas con el twigil <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Son <code>$?FILE<\/code> y <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El compilador les da sus valores antes de ejecutar el programa.<\/span> <span class=\"sg\" data-s=\"4\">Ya las viste en la página sobre <a href=\"https://course.raku.org/es/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"it":{"t":"Variabili speciali integrate","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku ha un insieme di variabili pronte per te.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte di loro sono <em>dinamiche<\/em>, con il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Conosci già le <a href=\"https://course.raku.org/it/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabili dinamiche<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Quindi puoi leggere queste variabili ovunque.<\/span> <span class=\"sg\" data-s=\"4\">Puoi anche dare loro un nuovo valore per uno scope.<\/span> <span class=\"sg\" data-s=\"5\">Ecco le variabili che ti servono più spesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stream standard<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">L'input e l'output passano per tre variabili dinamiche.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> è lo standard output.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> è lo standard error, un output per i messaggi di errore.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> è lo standard input.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> e <code>print<\/code> scrivono su <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vuoi mandare del testo allo standard error?<\/span> <span class=\"sg\" data-s=\"6\">Allora chiama il metodo su <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Queste variabili sono dinamiche.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, dentro un blocco, puoi mandare <code>$*OUT<\/code> in un posto nuovo.<\/span> <span class=\"sg\" data-s=\"2\">Allora il codice che chiami nel blocco stampa lì.<\/span> <span class=\"sg\" data-s=\"3\">Non cambi per niente quel codice.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma e il suo processo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcune variabili ti dicono qualcosa sul programma che sta girando adesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I loro valori sono diversi ogni volta che esegui il programma.<\/span> <span class=\"sg\" data-s=\"1\">Quindi qui non mostriamo l'output.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riga di comando e ambiente<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku mette gli argomenti e l'ambiente in due contenitori.<\/span> <span class=\"sg\" data-s=\"1\">Sono pronti per te:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista degli argomenti da riga di comando; una subroutine <code>MAIN<\/code> riceve gli stessi argomenti<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — le variabili d'ambiente, in un hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Queste variabili predefinite ti risparmiano lavoro.<\/span> <span class=\"sg\" data-s=\"1\">Non devi prendere tu queste informazioni.<\/span> <span class=\"sg\" data-s=\"2\">Sono dinamiche, quindi Raku le cerca nello stack delle chiamate.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi sovrascrivere qualsiasi variabile predefinita <code>$*<\/code> per uno scope.<\/span> <span class=\"sg\" data-s=\"4\">Funziona proprio come una tua variabile <code>$*<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Queste sono tutte variabili dinamiche.<\/span> <span class=\"sg\" data-s=\"1\">Ma Raku ha anche variabili predefinite con il twigil <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sono <code>$?FILE<\/code> e <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il compilatore imposta i loro valori prima che il programma parta.<\/span> <span class=\"sg\" data-s=\"4\">Le hai già viste nella pagina sui <a href=\"https://course.raku.org/it/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigil<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētie speciālie mainīgie","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku jums dod gatavu mainīgo kopu.<\/span> <span class=\"sg\" data-s=\"1\">Vairums no tiem ir <em>dinamiski<\/em>, ar tvigilu <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs jau zināt <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskos mainīgos<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat lasīt šos mainīgos jebkur.<\/span> <span class=\"sg\" data-s=\"4\">Jūs pat varat tiem dot jaunu vērtību vienam redzamības apgabalam.<\/span> <span class=\"sg\" data-s=\"5\">Lūk, mainīgie, kas jums vajadzīgi visbiežāk.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standarta plūsmas<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ievade un izvade iet caur trim dinamiskiem mainīgajiem.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> ir standarta izvade.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> ir standarta kļūdas, izvade kļūdu ziņojumiem.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> ir standarta ievade.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> un <code>print<\/code> raksta uz <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vai jūs gribat sūtīt tekstu uz standarta kļūdām?<\/span> <span class=\"sg\" data-s=\"6\">Tad izsauciet metodi uz <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šie mainīgie ir dinamiski.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc blokā jūs varat novirzīt <code>$*OUT<\/code> uz jaunu vietu.<\/span> <span class=\"sg\" data-s=\"2\">Tad kods, ko jūs izsaucat blokā, drukā tur.<\/span> <span class=\"sg\" data-s=\"3\">Jūs šo kodu nemaz nemaināt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma un tās process<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži mainīgie jums stāsta par programmu, kas darbojas tagad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To vērtības ir citas katru reizi, kad jūs palaižat programmu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc mēs šeit nerādām izvadi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandrinda un vide<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ieliek argumentus un vidi divos konteineros.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir jums gatavi:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — komandrindas argumentu saraksts; apakšprogramma <code>MAIN<\/code> saņem tos pašus argumentus<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — vides mainīgie jauktenī<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šie iebūvētie mainīgie jums ietaupa darbu.<\/span> <span class=\"sg\" data-s=\"1\">Jums nav pašiem jāiegūst šī informācija.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir dinamiski, tāpēc Raku tos meklē caur izsaukumu steku.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat pārmākt jebkuru <code>$*<\/code> iebūvēto mainīgo kādam redzamības apgabalam.<\/span> <span class=\"sg\" data-s=\"4\">Tas darbojas tieši tāpat kā jūsu pašu <code>$*<\/code> mainīgais.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Visi šie ir dinamiski mainīgie.<\/span> <span class=\"sg\" data-s=\"1\">Bet Raku ir arī iebūvēti mainīgie ar tvigilu <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir <code>$?FILE<\/code> un <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kompilators iestata to vērtības pirms programmas palaišanas.<\/span> <span class=\"sg\" data-s=\"4\">Jūs tos jau redzējāt lappusē par <a href=\"https://course.raku.org/lv/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigiliem<\/a>.<\/span><\/p>"]]},"ru":{"t":"Встроенные специальные переменные","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В Raku есть набор готовых переменных для вас.<\/span> <span class=\"sg\" data-s=\"1\">Большинство из них <em>динамические<\/em>, с твигилом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже знаете <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамические переменные<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому эти переменные можно читать где угодно.<\/span> <span class=\"sg\" data-s=\"4\">Можно даже дать им новое значение для одной области видимости.<\/span> <span class=\"sg\" data-s=\"5\">Вот переменные, которые вам нужны чаще всего.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартные потоки<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ввод и вывод идут через три динамические переменные.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> — это стандартный вывод.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> — это стандартный поток ошибок, вывод для сообщений об ошибках.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> — это стандартный ввод.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> и <code>print<\/code> пишут в <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вы хотите отправить текст в стандартный поток ошибок?<\/span> <span class=\"sg\" data-s=\"6\">Тогда вызовите метод у <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Эти переменные динамические.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому внутри блока можно направить <code>$*OUT<\/code> в новое место.<\/span> <span class=\"sg\" data-s=\"2\">Тогда код, который вы вызываете в блоке, печатает туда.<\/span> <span class=\"sg\" data-s=\"3\">Вы совсем не меняете этот код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Программа и её процесс<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Некоторые переменные рассказывают о программе, которая сейчас работает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Их значения разные при каждом запуске программы.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому мы не показываем здесь вывод.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командная строка и окружение<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku кладёт аргументы и окружение в два контейнера.<\/span> <span class=\"sg\" data-s=\"1\">Они готовы для вас:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументов командной строки; подпрограмма <code>MAIN<\/code> получает те же аргументы<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — переменные окружения в хэше<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Эти встроенные переменные экономят вам работу.<\/span> <span class=\"sg\" data-s=\"1\">Вам не нужно самим собирать эту информацию.<\/span> <span class=\"sg\" data-s=\"2\">Они динамические, поэтому Raku ищет их по стеку вызовов.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому любую встроенную переменную с <code>$*<\/code> можно перекрыть для области видимости.<\/span> <span class=\"sg\" data-s=\"4\">Это работает так же, как с вашей собственной переменной с <code>$*<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всё это динамические переменные.<\/span> <span class=\"sg\" data-s=\"1\">Но в Raku есть и встроенные переменные с твигилом <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это <code>$?FILE<\/code> и <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилятор задаёт их значения до запуска программы.<\/span> <span class=\"sg\" data-s=\"4\">Вы уже видели их на странице о <a href=\"https://course.raku.org/ru/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твигилах<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані спеціальні змінні","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">У Raku є набір готових для вас змінних.<\/span> <span class=\"sg\" data-s=\"1\">Більшість із них <em>динамічні<\/em>, з твіґілом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже знаєте <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічні змінні<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Тож ці змінні можна читати будь-де.<\/span> <span class=\"sg\" data-s=\"4\">Можна навіть дати їм нове значення для однієї області видимості.<\/span> <span class=\"sg\" data-s=\"5\">Ось змінні, які вам потрібні найчастіше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартні потоки<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Введення й виведення йдуть через три динамічні змінні.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> — це стандартний вивід.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> — це стандартний потік помилок, окремий вивід для повідомлень про помилки.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> — це стандартне введення.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> і <code>print<\/code> пишуть у <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Хочете надіслати текст у стандартний потік помилок?<\/span> <span class=\"sg\" data-s=\"6\">Тоді викличте метод на <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # іде в стандартний вивід\n$*ERR.say('a diagnostic');  # іде в стандартний потік помилок<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ці змінні динамічні.<\/span> <span class=\"sg\" data-s=\"1\">Тож усередині блоку можна направити <code>$*OUT<\/code> в інше місце.<\/span> <span class=\"sg\" data-s=\"2\">Тоді код, який ви викликаєте в блоці, виводить туди.<\/span> <span class=\"sg\" data-s=\"3\">Ви зовсім не змінюєте цей код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програма та її процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Деякі змінні розповідають про програму, яка зараз працює:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # шлях до скрипта, який виконується\nsay $*PID;          # ідентифікатор процесу цієї програми\nsay $*CWD;          # поточний робочий каталог<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Їхні значення різні щоразу, коли ви запускаєте програму.<\/span> <span class=\"sg\" data-s=\"1\">Тому ми не показуємо тут вивід.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командний рядок і середовище<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku кладе аргументи та середовище у два контейнери.<\/span> <span class=\"sg\" data-s=\"1\">Вони вже готові для вас:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументів командного рядка; підпрограма <code>MAIN<\/code> отримує ті самі аргументи<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — змінні середовища в хеші<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # скільки аргументів було передано\nsay %*ENV&lt;HOME&gt;;  # значення змінної середовища HOME<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ці вбудовані змінні економлять вам роботу.<\/span> <span class=\"sg\" data-s=\"1\">Вам не треба самим збирати ці відомості.<\/span> <span class=\"sg\" data-s=\"2\">Вони динамічні, тому Raku шукає їх через стек викликів.<\/span> <span class=\"sg\" data-s=\"3\">Тож будь-яку вбудовану змінну з <code>$*<\/code> можна перекрити для області видимості.<\/span> <span class=\"sg\" data-s=\"4\">Це працює так само, як із вашою власною змінною з <code>$*<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Усе це динамічні змінні.<\/span> <span class=\"sg\" data-s=\"1\">Але Raku також має вбудовані змінні з твіґілом <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це <code>$?FILE<\/code> та <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компілятор задає їхні значення ще до запуску програми.<\/span> <span class=\"sg\" data-s=\"4\">Ви вже бачили їх на сторінці про <a href=\"https://course.raku.org/uk/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твіґіли<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени специални променливи","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku има набор от готови променливи за вас.<\/span> <span class=\"sg\" data-s=\"1\">Повечето от тях са <em>динамични<\/em>, с туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вие вече познавате <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да четете тези променливи навсякъде.<\/span> <span class=\"sg\" data-s=\"4\">Можете дори да им дадете нова стойност за един обхват.<\/span> <span class=\"sg\" data-s=\"5\">Ето променливите, които ви трябват най-често.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартни потоци<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Входът и изходът минават през три динамични променливи.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> е стандартният изход.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> е стандартната грешка, изход за съобщения за грешки.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> е стандартният вход.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> и <code>print<\/code> пишат в <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Искате ли да изпратите текст към стандартната грешка?<\/span> <span class=\"sg\" data-s=\"6\">Тогава извикайте метода върху <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тези променливи са динамични.<\/span> <span class=\"sg\" data-s=\"1\">Затова в един блок можете да насочите <code>$*OUT<\/code> към ново място.<\/span> <span class=\"sg\" data-s=\"2\">Тогава кодът, който извиквате в блока, печата там.<\/span> <span class=\"sg\" data-s=\"3\">Вие изобщо не променяте този код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програмата и нейният процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои променливи ви казват нещо за програмата, която работи сега:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойностите им са различни всеки път, когато пускате програмата.<\/span> <span class=\"sg\" data-s=\"1\">Затова тук не показваме изхода.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Команден ред и среда<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku поставя аргументите и средата в два контейнера.<\/span> <span class=\"sg\" data-s=\"1\">Те са готови за вас:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — списъкът с аргументи от командния ред; подпрограмата <code>MAIN<\/code> получава същите аргументи<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — променливите на средата, в хеш<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тези вградени променливи ви спестяват работа.<\/span> <span class=\"sg\" data-s=\"1\">Не трябва сами да взимате тази информация.<\/span> <span class=\"sg\" data-s=\"2\">Те са динамични, затова Raku ги търси през стека на извикванията.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да замените всяка вградена <code>$*<\/code> променлива за даден обхват.<\/span> <span class=\"sg\" data-s=\"4\">Това работи точно като ваша собствена <code>$*<\/code> променлива.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всички тези променливи са динамични.<\/span> <span class=\"sg\" data-s=\"1\">Но Raku има и вградени променливи с туигила <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това са <code>$?FILE<\/code> и <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилаторът задава стойностите им, преди програмата да започне.<\/span> <span class=\"sg\" data-s=\"4\">Вече ги видяхте на страницата за <a href=\"https://course.raku.org/bg/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">туигилите<\/a>.<\/span><\/p>"]]},"eo":{"t":"Enkonstruitaj specialaj variabloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku havas aron de variabloj pretaj por vi.<\/span> <span class=\"sg\" data-s=\"1\">La plej multaj el ili estas <em>dinamikaj<\/em>, kun la tvigilo <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam konas <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikajn variablojn<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas legi ĉi tiujn variablojn ĉie.<\/span> <span class=\"sg\" data-s=\"4\">Vi eĉ povas doni al ili novan valoron por unu amplekso.<\/span> <span class=\"sg\" data-s=\"5\">Jen la variabloj, kiujn vi plej ofte bezonas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Normaj fluoj<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Enigo kaj eligo iras tra tri dinamikaj variabloj.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> estas la norma eligo.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> estas la norma eraro, eligo por eraraj mesaĝoj.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> estas la norma enigo.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> kaj <code>print<\/code> skribas al <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĉu vi volas sendi tekston al la norma eraro?<\/span> <span class=\"sg\" data-s=\"6\">Tiam voku la metodon sur <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj variabloj estas dinamikaj.<\/span> <span class=\"sg\" data-s=\"1\">Do, ene de bloko, vi povas sendi <code>$*OUT<\/code> al nova loko.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la kodo, kiun vi vokas en la bloko, presas tien.<\/span> <span class=\"sg\" data-s=\"3\">Vi tute ne ŝanĝas tiun kodon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La programo kaj ĝia procezo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj variabloj diras al vi pri la programo, kiu nun ruliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iliaj valoroj estas malsamaj ĉiufoje, kiam vi rulas la programon.<\/span> <span class=\"sg\" data-s=\"1\">Do ni ne montras la eligon ĉi tie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandlinio kaj medio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku metas la argumentojn kaj la medion en du ujojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas pretaj por vi:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la listo de komandliniaj argumentoj; subrutino <code>MAIN<\/code> ricevas la samajn argumentojn<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — la mediaj variabloj, en hako<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj enkonstruitaj variabloj ŝparas al vi laboron.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne devas mem kolekti ĉi tiujn informojn.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas dinamikaj, do Raku serĉas ilin tra la voka stako.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas anstataŭigi ĉiun enkonstruitan <code>$*<\/code>-variablon por amplekso.<\/span> <span class=\"sg\" data-s=\"4\">Tio funkcias same kiel via propra <code>$*<\/code>-variablo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj ĉiuj estas dinamikaj variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku ankaŭ havas enkonstruitajn variablojn kun la tvigilo <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas <code>$?FILE<\/code> kaj <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La kompililo agordas iliajn valorojn, antaŭ ol la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"4\">Vi jam vidis ilin sur la paĝo pri <a href=\"https://course.raku.org/eo/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigiloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Incorporatae speciales variabiles","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku seriem variabilium pro te paratam habet.<\/span> <span class=\"sg\" data-s=\"1\">Pleraeque earum <em>dynamicae<\/em> sunt, cum twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Iam <a href=\"https://course.raku.org/la/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabiles dynamicas<\/a> nosti.<\/span> <span class=\"sg\" data-s=\"3\">Itaque has variabiles ubique legere potes.<\/span> <span class=\"sg\" data-s=\"4\">Etiam novum valorem eis pro una circumscriptione dare potes.<\/span> <span class=\"sg\" data-s=\"5\">Ecce variabiles quas saepissime requiris.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fluenta vulgaria<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Introitus et exitus per tres variabiles dynamicas eunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> est exitus vulgaris.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*ERR<\/code> est error vulgaris, exitus pro nuntiis errorum.<\/span> <span class=\"sg\" data-s=\"3\"><code>$*IN<\/code> est introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"4\"><code>say<\/code> et <code>print<\/code> in <code>$*OUT<\/code> scribunt.<\/span> <span class=\"sg\" data-s=\"5\">Visne textum ad errorem vulgarem mittere?<\/span> <span class=\"sg\" data-s=\"6\">Tum methodum in <code>$*ERR<\/code> voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # ad exitum vulgarem it\n$*ERR.say('a diagnostic');  # ad errorem vulgarem it<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hae variabiles dynamicae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Itaque intra clausulam <code>$*OUT<\/code> ad novum locum mittere potes.<\/span> <span class=\"sg\" data-s=\"2\">Tum codex quem in clausula vocas illuc imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Illum codicem omnino non mutas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma et processus eius<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaedam variabiles tibi de programmate narrant quod nunc currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # semita scripti quod curritur\nsay $*PID;          # identificator processus huius programmatis\nsay $*CWD;          # directoria laboris currens<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valores earum alii sunt quotiens programma incipis.<\/span> <span class=\"sg\" data-s=\"1\">Itaque exitum hic non ostendimus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Linea imperandi et ambitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku argumenta et ambitum in duo receptacula ponit.<\/span> <span class=\"sg\" data-s=\"1\">Parata tibi sunt:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — series argumentorum lineae imperandi; subprogramma <code>MAIN<\/code> eadem argumenta accipit<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — variabiles ambitus, in mappa<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # quot argumenta tradita sint\nsay %*ENV&lt;HOME&gt;;  # valor variabilis ambitus HOME<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hae variabiles inbuiltae laborem tuum minuunt.<\/span> <span class=\"sg\" data-s=\"1\">Hanc informationem ipse colligere non debes.<\/span> <span class=\"sg\" data-s=\"2\">Dynamicae sunt, itaque Raku eas per acervum vocationum quaerit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque quamlibet variabilem inbuiltam <code>$*<\/code> pro circumscriptione superare potes.<\/span> <span class=\"sg\" data-s=\"4\">Operatur sicut tua propria variabilis <code>$*<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hae omnes variabiles dynamicae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku etiam variabiles inbuiltas cum twigil <code>?<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Hae sunt <code>$?FILE<\/code> et <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Compilator valores earum ponit antequam programma currit.<\/span> <span class=\"sg\" data-s=\"4\">Eas iam vidisti in pagina de <a href=\"https://course.raku.org/la/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigiliis<\/a>.<\/span><\/p>"]]}}}</script>
