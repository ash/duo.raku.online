pan> <span class=\"sg\" data-s=\"5\">Šie ir biežākie tvigili:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamisks<\/strong> mainīgais, piemēram, <code>$*OUT<\/code>; Raku to atrod caur izsaukumu steku<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompilēšanas laika<\/strong> vērtība; to iestata kompilators, piemēram, <code>$?FILE<\/code> un <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — objekta <strong>privāts<\/strong> atribūts, piemēram, <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atribūts, ko jūs izmantojat caur tā piekļuves metodi, piemēram, <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt dažus no tiem, bet bez nosaukuma \"tvigils\".<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> un <code>$*IN<\/code> ir dinamiski.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>$!<\/code> un <code>$.<\/code> jūs redzējāt <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">daļā par objektiem<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kompilators dod <code>?<\/code> mainīgajiem to vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Tas to dara, kad kompilē jūsu programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Katrs tvigils parāda citu mainīgā veidu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to redzat uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Kad jūs lasāt <code>$*foo<\/code>, jūs zināt, ka tas ir dinamisks.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>$?foo<\/code> ir kompilēšanas laika konstante.<\/span> <span class=\"sg\" data-s=\"4\">Nākamais temats tuvāk aplūko <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskos mainīgos<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Tie darbojas ļoti citādi nekā leksiskie mainīgie, ko jūs zināt.<\/span><\/p>"]]},"ru":{"t":"Твигилы","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Твигил<\/em> — это символ.<\/span> <span class=\"sg\" data-s=\"1\">Он стоит между сигилом и именем переменной.<\/span> <span class=\"sg\" data-s=\"2\">Он не меняет имя.<\/span> <span class=\"sg\" data-s=\"3\">Он меняет то, как работает переменная.<\/span> <span class=\"sg\" data-s=\"4\">Ещё он меняет то, как Raku её находит.<\/span> <span class=\"sg\" data-s=\"5\">Вот частые твигилы:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамическая<\/strong> переменная, например <code>$*OUT<\/code>; Raku находит её по стеку вызовов<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — значение <strong>времени компиляции<\/strong>; его задаёт компилятор, например <code>$?FILE<\/code> и <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватный<\/strong> атрибут объекта, например <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, который вы используете через его метод-аксессор, например <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете некоторые из них, но без названия «твигил».<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> и <code>$*IN<\/code> — динамические.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$!<\/code> и <code>$.<\/code> вы видели в <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">части об объектах<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Компилятор даёт значения переменным с <code>?<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он делает это, когда компилирует вашу программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Каждый твигил показывает свой вид переменной.<\/span> <span class=\"sg\" data-s=\"1\">Вы видите это сразу.<\/span> <span class=\"sg\" data-s=\"2\">Когда вы читаете <code>$*foo<\/code>, вы знаете, что она динамическая.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$?foo<\/code> — это константа времени компиляции.<\/span> <span class=\"sg\" data-s=\"4\">Следующая тема подробно смотрит на <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамические переменные<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Они работают совсем не так, как лексические переменные, которые вы знаете.<\/span><\/p>"]]},"uk":{"t":"Твіґіли","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Твіґіл<\/em> — це символ.<\/span> <span class=\"sg\" data-s=\"1\">Він стоїть між сигілом та іменем змінної.<\/span> <span class=\"sg\" data-s=\"2\">Він не змінює імені.<\/span> <span class=\"sg\" data-s=\"3\">Він змінює те, як працює змінна.<\/span> <span class=\"sg\" data-s=\"4\">Також він змінює те, як Raku її знаходить.<\/span> <span class=\"sg\" data-s=\"5\">Ось найчастіші твіґіли:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамічна<\/strong> змінна, наприклад <code>$*OUT<\/code>; Raku знаходить її через стек викликів<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>компіляційне<\/strong> значення; його задає компілятор, наприклад <code>$?FILE<\/code> і <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватний<\/strong> атрибут об'єкта, наприклад <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, який ви використовуєте через його метод доступу, наприклад <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте деякі з них, але без назви «твіґіл».<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> і <code>$*IN<\/code> — динамічні.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$!<\/code> і <code>$.<\/code> ви бачили в <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">частині про об'єкти<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Компілятор дає змінним з <code>?<\/code> їхні значення.<\/span> <span class=\"sg\" data-s=\"1\">Він робить це, коли компілює вашу програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # номер рядка цього оператора\nsay $?FILE; # шлях до цього файлу з вихідним кодом<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Кожен твіґіл показує інший вид змінної.<\/span> <span class=\"sg\" data-s=\"1\">Ви бачите це одразу.<\/span> <span class=\"sg\" data-s=\"2\">Коли ви читаєте <code>$*foo<\/code>, ви знаєте, що вона динамічна.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$?foo<\/code> — це компіляційна стала.<\/span> <span class=\"sg\" data-s=\"4\">Наступна тема уважно розглядає <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічні змінні<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Вони працюють зовсім не так, як лексичні змінні, які ви знаєте.<\/span><\/p>"]]},"bg":{"t":"Twigils","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Туигилът<\/em> е символ.<\/span> <span class=\"sg\" data-s=\"1\">Той стои между сигила и името на променливата.<\/span> <span class=\"sg\" data-s=\"2\">Той не променя името.<\/span> <span class=\"sg\" data-s=\"3\">Той променя как работи променливата.<\/span> <span class=\"sg\" data-s=\"4\">Той променя и как Raku я намира.<\/span> <span class=\"sg\" data-s=\"5\">Ето честите туигили:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамична<\/strong> променлива, например <code>$*OUT<\/code>; Raku я намира през стека на извикванията<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — стойност по <strong>време на компилация<\/strong>; компилаторът я задава, например <code>$?FILE<\/code> и <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>частен<\/strong> атрибут на обект, например <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, който използвате чрез неговия метод за достъп, например <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече познавате някои от тях, но без името „туигил“.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> и <code>$*IN<\/code> са динамични.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$!<\/code> и <code>$.<\/code> видяхте в <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">частта за обектите<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Компилаторът дава стойности на <code>?<\/code> променливите.<\/span> <span class=\"sg\" data-s=\"1\">Той прави това, когато компилира програмата ви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Всеки туигил показва различен вид променлива.<\/span> <span class=\"sg\" data-s=\"1\">Виждате това веднага.<\/span> <span class=\"sg\" data-s=\"2\">Когато четете <code>$*foo<\/code>, знаете, че тя е динамична.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$?foo<\/code> е константа по време на компилация.<\/span> <span class=\"sg\" data-s=\"4\">Следващата тема разглежда отблизо <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Те работят много различно от лексикалните променливи, които познавате.<\/span><\/p>"]]},"eo":{"t":"Duoblaj sigeloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Tvigilo<\/em> estas signo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi staras inter la sigelo kaj la nomo de variablo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne ŝanĝas la nomon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ŝanĝas, kiel la variablo funkcias.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ ŝanĝas, kiel Raku trovas ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Jen la oftaj tvigiloj:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamika<\/strong> variablo, ekzemple, <code>$*OUT<\/code>; Raku trovas ĝin tra la voka stako<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompiltempa<\/strong> valoro; la kompililo agordas ĝin, ekzemple, <code>$?FILE<\/code> kaj <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>privata<\/strong> atributo de objekto, ekzemple, <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atributo, kiun vi uzas per ĝia aliriga metodo, ekzemple, <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas kelkajn el ili, sed sen la nomo «tvigilo».<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> kaj <code>$*IN<\/code> estas dinamikaj.<\/span> <span class=\"sg\" data-s=\"2\">Kaj vi vidis <code>$!<\/code> kaj <code>$.<\/code> en <a href=\"https://course.raku.org/eo/oop/\" target=\"_blank\" rel=\"noopener\">la parto pri objektoj<\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La kompililo donas al la <code>?<\/code>-variabloj iliajn valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi faras tion, kiam ĝi kompilas vian programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉiu tvigilo montras alian specon de variablo.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidas ĝin tuj.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi legas <code>$*foo<\/code>, vi scias, ke ĝi estas dinamika.<\/span> <span class=\"sg\" data-s=\"3\">Kaj <code>$?foo<\/code> estas kompiltempa konstanto.<\/span> <span class=\"sg\" data-s=\"4\">La sekva temo detale rigardas <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikajn variablojn<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Ili funkcias tre alie ol la leksikaj variabloj, kiujn vi konas.<\/span><\/p>"]]},"la":{"t":"Twigili","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Twigil<\/em> est character.<\/span> <span class=\"sg\" data-s=\"1\">Inter sigillum et nomen variabilis stat.<\/span> <span class=\"sg\" data-s=\"2\">Nomen non mutat.<\/span> <span class=\"sg\" data-s=\"3\">Modum mutat quo variabilis operatur.<\/span> <span class=\"sg\" data-s=\"4\">Etiam modum mutat quo Raku eam invenit.<\/span> <span class=\"sg\" data-s=\"5\">Haec sunt twigilia vulgaria:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — variabilis <strong>dynamica<\/strong>, exempli gratia <code>$*OUT<\/code>; Raku eam per acervum vocationum invenit<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — valor <strong>temporis compilationis<\/strong>; compilator eum ponit, exempli gratia <code>$?FILE<\/code> et <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — attributum <strong>privatum<\/strong> obiecti, exempli gratia <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — attributum quod per methodum accessus adhibes, exempli gratia <code>$.name<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quaedam ex eis iam nosti, sed sine nomine \"twigil\".<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> et <code>$*IN<\/code> dynamica sunt.<\/span> <span class=\"sg\" data-s=\"2\">Et <code>$!<\/code> et <code>$.<\/code> in <a href=\"https://course.raku.org/la/oop/\" target=\"_blank\" rel=\"noopener\">parte de obiectis<\/a> vidisti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Compilator variabilibus <code>?<\/code> valores earum dat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc facit cum programma tuum compilat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # numerus lineae huius enuntiati\nsay $?FILE; # semita huius archivi fontis<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unumquodque twigil aliud genus variabilis ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Id statim vides.<\/span> <span class=\"sg\" data-s=\"2\">Cum <code>$*foo<\/code> legis, scis: dynamica est.<\/span> <span class=\"sg\" data-s=\"3\">Et <code>$?foo<\/code> est constans temporis compilationis.<\/span> <span class=\"sg\" data-s=\"4\">Argumentum sequens <a href=\"https://course.raku.org/la/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabiles dynamicas<\/a> propius inspicit.<\/span> <span class=\"sg\" data-s=\"5\">Multum aliter operantur quam variabiles lexicae quas nosti.<\/span><\/p>"]]}}}</script>
