<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/a-dynamic-variable","n":413,"k":"exercise","pv":"advanced/special-variables/exercises","nx":"advanced/special-variables/exercises/a-dynamic-variable/solution","tr":["advanced","advanced/special-variables"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exercise ’A dynamic variable‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A dynamic variable has the twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku looks for it through the call stack, not by lexical scope.<\/span> <span class=\"sg\" data-s=\"2\">So a subroutine can see different values.<\/span> <span class=\"sg\" data-s=\"3\">The value depends on who calls the subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Then a block can make the code it calls run as someone else.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declare a dynamic variable <code>$*user<\/code> with the value <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Write a subroutine <code>whoami<\/code>. It prints <code>running as <\/code> and then the current <code>$*user<\/code>, for example, <code>running as guest<\/code>. It has no parameters. It must read <code>$*user<\/code> directly.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Call <code>whoami<\/code> once at the top level. It shows <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Then make a block. In it, declare <code>$*user<\/code> again as <code>'admin'<\/code>. Call the <em>same<\/em> <code>whoami<\/code> there. Now it shows <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Eine dynamische Variable","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine dynamische Variable hat das Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku sucht sie durch den Aufrufstapel, nicht über den lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"2\">Also kann eine Subroutine verschiedene Werte sehen.<\/span> <span class=\"sg\" data-s=\"3\">Der Wert hängt davon ab, wer die Subroutine aufruft.<\/span> <span class=\"sg\" data-s=\"4\">Damit kann ein Block den Code, den er aufruft, als jemand anderes laufen lassen.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklariere eine dynamische Variable <code>$*user<\/code> mit dem Wert <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schreibe eine Subroutine <code>whoami<\/code>. Sie gibt <code>running as <\/code> und dann den aktuellen <code>$*user<\/code> aus, zum Beispiel <code>running as guest<\/code>. Sie hat keine Parameter. Sie muss <code>$*user<\/code> direkt lesen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Rufe <code>whoami<\/code> einmal auf der obersten Ebene auf. Sie zeigt <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mach dann einen Block. Deklariere darin <code>$*user<\/code> noch einmal als <code>'admin'<\/code>. Rufe dort <em>dieselbe<\/em> <code>whoami<\/code> auf. Jetzt zeigt sie <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Een dynamische variabele","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een dynamische variabele heeft de twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku zoekt hem via de call stack, niet via de lexicale scope.<\/span> <span class=\"sg\" data-s=\"2\">Dus kan een subroutine verschillende waarden zien.<\/span> <span class=\"sg\" data-s=\"3\">De waarde hangt af van wie de subroutine aanroept.<\/span> <span class=\"sg\" data-s=\"4\">Zo kan een blok de code die het aanroept als iemand anders laten draaien.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declareer een dynamische variabele <code>$*user<\/code> met de waarde <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schrijf een subroutine <code>whoami<\/code>. Die print <code>running as <\/code> en daarna de huidige <code>$*user<\/code>, bijvoorbeeld <code>running as guest<\/code>. Hij heeft geen parameters. Hij moet <code>$*user<\/code> direct lezen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Roep <code>whoami<\/code> één keer aan op het bovenste niveau. Hij toont <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Maak daarna een blok. Declareer daarin <code>$*user<\/code> opnieuw als <code>'admin'<\/code>. Roep daar <em>dezelfde<\/em> <code>whoami<\/code> aan. Nu toont hij <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Una variable dinámica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Una variable dinámica tiene el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku la busca a través de la pila de llamadas, no por ámbito léxico.<\/span> <span class=\"sg\" data-s=\"2\">Así que una subrutina puede ver valores diferentes.<\/span> <span class=\"sg\" data-s=\"3\">El valor depende de quién llama a la subrutina.<\/span> <span class=\"sg\" data-s=\"4\">Así, un bloque puede ejecutar el código que llama como otra persona.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declara una variable dinámica <code>$*user<\/code> con el valor <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Escribe una subrutina <code>whoami<\/code>. La subrutina imprime <code>running as <\/code> y luego el valor actual de <code>$*user<\/code>, por ejemplo, <code>running as guest<\/code>. No tiene parámetros. Debe leer <code>$*user<\/code> directamente.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Llama a <code>whoami<\/code> una vez en el nivel superior. Muestra <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Luego crea un bloque. Dentro, declara <code>$*user<\/code> otra vez como <code>'admin'<\/code>. Llama allí a la <em>misma<\/em> <code>whoami<\/code>. Ahora muestra <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Una variabile dinamica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Una variabile dinamica ha il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku la cerca nello stack delle chiamate, non con lo scope lessicale.<\/span> <span class=\"sg\" data-s=\"2\">Quindi una subroutine può vedere valori diversi.<\/span> <span class=\"sg\" data-s=\"3\">Il valore dipende da chi chiama la subroutine.<\/span> <span class=\"sg\" data-s=\"4\">Così un blocco può far girare il codice che chiama come qualcun altro.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Dichiara una variabile dinamica <code>$*user<\/code> con il valore <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Scrivi una subroutine <code>whoami<\/code>. Stampa <code>running as <\/code> e poi il valore attuale di <code>$*user<\/code>, per esempio <code>running as guest<\/code>. Non ha parametri. Deve leggere <code>$*user<\/code> direttamente.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Chiama <code>whoami<\/code> una volta al livello superiore. Mostra <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poi crea un blocco. Dentro, dichiara di nuovo <code>$*user<\/code> come <code>'admin'<\/code>. Chiama lì la <em>stessa<\/em> <code>whoami<\/code>. Ora mostra <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Dinamisks mainīgais","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dinamiskam mainīgajam ir tvigils <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku to meklē caur izsaukumu steku, nevis pēc leksiskā redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc apakšprogramma var redzēt dažādas vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Vērtība ir atkarīga no tā, kas izsauc apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"4\">Tad bloks var likt kodam, ko tas izsauc, darboties kā kādam citam.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklarējiet dinamisku mainīgo <code>$*user<\/code> ar vērtību <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Uzrakstiet apakšprogrammu <code>whoami<\/code>. Tā izdrukā <code>running as <\/code> un pēc tam pašreizējo <code>$*user<\/code>, piemēram, <code>running as guest<\/code>. Tai nav parametru. Tai <code>$*user<\/code> jānolasa tieši.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Izsauciet <code>whoami<\/code> vienreiz augšējā līmenī. Tā parāda <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Pēc tam izveidojiet bloku. Tajā vēlreiz deklarējiet <code>$*user<\/code> kā <code>'admin'<\/code>. Tur izsauciet <em>to pašu<\/em> <code>whoami<\/code>. Tagad tā parāda <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Динамическая переменная","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У динамической переменной есть твигил <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ищет её по стеку вызовов, а не по лексической области видимости.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому подпрограмма может видеть разные значения.<\/span> <span class=\"sg\" data-s=\"3\">Значение зависит от того, кто вызывает подпрограмму.<\/span> <span class=\"sg\" data-s=\"4\">Тогда блок может запустить код, который он вызывает, от имени кого-то другого.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Объявите динамическую переменную <code>$*user<\/code> со значением <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишите подпрограмму <code>whoami<\/code>. Она выводит <code>running as <\/code> и потом текущее значение <code>$*user<\/code>, например <code>running as guest<\/code>. У неё нет параметров. Она должна читать <code>$*user<\/code> напрямую.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Вызовите <code>whoami<\/code> один раз на верхнем уровне. Она показывает <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Потом создайте блок. В нём снова объявите <code>$*user<\/code> как <code>'admin'<\/code>. Вызовите там <em>ту же самую<\/em> <code>whoami<\/code>. Теперь она показывает <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Динамічна змінна»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Динамічна змінна має твіґіл <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku шукає її через стек викликів, а не за лексичною областю видимості.<\/span> <span class=\"sg\" data-s=\"2\">Тож підпрограма може бачити різні значення.<\/span> <span class=\"sg\" data-s=\"3\">Значення залежить від того, хто викликає підпрограму.<\/span> <span class=\"sg\" data-s=\"4\">Тоді блок може запускати код, який він викликає, від імені когось іншого.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Оголосіть динамічну змінну <code>$*user<\/code> зі значенням <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишіть підпрограму <code>whoami<\/code>. Вона виводить <code>running as <\/code>, а потім поточне значення <code>$*user<\/code>, наприклад <code>running as guest<\/code>. Вона не має параметрів. Вона має читати <code>$*user<\/code> напряму.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Викличте <code>whoami<\/code> один раз на верхньому рівні. Вона показує <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Потім створіть блок. У ньому знову оголосіть <code>$*user<\/code> як <code>'admin'<\/code>. Викличте там <em>ту саму<\/em> <code>whoami<\/code>. Тепер вона показує <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Динамична променлива","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Динамичната променлива има туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku я търси през стека на извикванията, а не по лексикален обхват.<\/span> <span class=\"sg\" data-s=\"2\">Така една подпрограма може да вижда различни стойности.<\/span> <span class=\"sg\" data-s=\"3\">Стойността зависи от това кой извиква подпрограмата.<\/span> <span class=\"sg\" data-s=\"4\">Тогава един блок може да накара кода, който извиква, да работи като някой друг.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Декларирайте динамична променлива <code>$*user<\/code> със стойност <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишете подпрограма <code>whoami<\/code>. Тя отпечатва <code>running as <\/code> и след това текущата <code>$*user<\/code>, например <code>running as guest<\/code>. Тя няма параметри. Тя трябва да чете <code>$*user<\/code> директно.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Извикайте <code>whoami<\/code> веднъж на най-горното ниво. Тя показва <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">След това направете блок. В него декларирайте <code>$*user<\/code> отново като <code>'admin'<\/code>. Извикайте <em>същата<\/em> <code>whoami<\/code> там. Сега тя показва <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Dinamika variablo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dinamika variablo havas la tvigilon <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku serĉas ĝin tra la voka stako, ne per leksika amplekso.<\/span> <span class=\"sg\" data-s=\"2\">Do subrutino povas vidi malsamajn valorojn.<\/span> <span class=\"sg\" data-s=\"3\">La valoro dependas de tio, kiu vokas la subrutinon.<\/span> <span class=\"sg\" data-s=\"4\">Tiel bloko povas igi la kodon, kiun ĝi vokas, ruliĝi kiel iu alia.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklaru dinamikan variablon <code>$*user<\/code> kun la valoro <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Skribu subrutinon <code>whoami<\/code>. Ĝi presas <code>running as <\/code> kaj poste la nunan <code>$*user<\/code>, ekzemple, <code>running as guest<\/code>. Ĝi ne havas parametrojn. Ĝi devas legi <code>$*user<\/code> rekte.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Voku <code>whoami<\/code> unufoje ĉe la supra nivelo. Ĝi montras <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poste faru blokon. En ĝi, denove deklaru <code>$*user<\/code> kiel <code>'admin'<\/code>. Voku la <em>saman<\/em> <code>whoami<\/code> tie. Nun ĝi montras <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Dynamica variabilis","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Variabilis dynamica twigil <code>*<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Raku eam per acervum vocationum quaerit, non per circumscriptionem lexicam.<\/span> <span class=\"sg\" data-s=\"2\">Itaque subprogramma diversos valores videre potest.<\/span> <span class=\"sg\" data-s=\"3\">Valor ab eo pendet qui subprogramma vocat.<\/span> <span class=\"sg\" data-s=\"4\">Sic clausula codicem quem vocat sub alia persona exsequi potest.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declara variabilem dynamicam <code>$*user<\/code> cum valore <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Scribe subprogramma <code>whoami<\/code>. Imprimit <code>running as <\/code> et deinde <code>$*user<\/code> praesentem, exempli gratia <code>running as guest<\/code>. Nullos parametros habet. <code>$*user<\/code> directe legere debet.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Voca <code>whoami<\/code> semel in gradu summo. <code>guest<\/code> ostendit.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Deinde fac clausulam. In ea <code>$*user<\/code> iterum ut <code>'admin'<\/code> declara. Ibi voca <em>idem<\/em> <code>whoami<\/code>. Nunc <code>admin<\/code> ostendit.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
