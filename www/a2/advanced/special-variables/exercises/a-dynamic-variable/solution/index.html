<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/a-dynamic-variable/solution","n":414,"k":"solution","pv":"advanced/special-variables/exercises/a-dynamic-variable","nx":"advanced/special-variables/exercises/override-dynamic","tr":["advanced","advanced/special-variables"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A dynamic variable‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The twigil <code>*<\/code> makes <code>$*user<\/code> dynamic. <code>whoami<\/code> never gets it as a parameter. It finds the value through the call stack. So the first call shows the default value, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The inner block declares <code>$*user<\/code> again as <code>admin<\/code>. This lasts while the block runs. The <em>same<\/em> <code>whoami<\/code> now sees <code>admin<\/code>. Dynamic lookup checks who is on the call stack now. You override a dynamic variable in a scope. Then all code that you call from there gets more rights. And you do not change <code>whoami<\/code> at all.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Eine dynamische Variable","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Twigil <code>*<\/code> macht <code>$*user<\/code> dynamisch. <code>whoami<\/code> bekommt die Variable nie als Parameter. Sie findet den Wert durch den Aufrufstapel. Also zeigt der erste Aufruf den Standardwert, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der innere Block deklariert <code>$*user<\/code> noch einmal als <code>admin<\/code>. Das gilt, solange der Block läuft. <em>Dieselbe<\/em> <code>whoami<\/code> sieht jetzt <code>admin<\/code>. Die dynamische Suche prüft, wer jetzt auf dem Aufrufstapel ist. Du überschreibst eine dynamische Variable in einem Geltungsbereich. Dann bekommt der ganze Code, den du von dort aufrufst, mehr Rechte. Und du änderst <code>whoami<\/code> überhaupt nicht.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een dynamische variabele","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code", ub.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> hace dinámica a <code>$*user<\/code>. <code>whoami<\/code> nunca la recibe como parámetro. Encuentra el valor a través de la pila de llamadas. Así que la primera llamada muestra el valor predeterminado, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque interno declara <code>$*user<\/code> otra vez como <code>admin<\/code>. Esto dura mientras se ejecuta el bloque. La <em>misma<\/em> <code>whoami<\/code> ahora ve <code>admin<\/code>. La búsqueda dinámica mira quién está ahora en la pila de llamadas. Anulas una variable dinámica en un ámbito. Entonces todo el código que llamas desde allí recibe más derechos. Y no cambias <code>whoami<\/code> para nada.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Una variabile dinamica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> rende <code>$*user<\/code> dinamica. <code>whoami<\/code> non la riceve mai come parametro. Trova il valore nello stack delle chiamate. Quindi la prima chiamata mostra il valore predefinito, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco interno dichiara di nuovo <code>$*user<\/code> come <code>admin<\/code>. Questo dura finché il blocco gira. La <em>stessa<\/em> <code>whoami<\/code> ora vede <code>admin<\/code>. La ricerca dinamica controlla chi c'è adesso nello stack delle chiamate. Sovrascrivi una variabile dinamica in uno scope. Allora tutto il codice che chiami da lì riceve più diritti. E non cambi per niente <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Dinamisks mainīgais","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tvigils <code>*<\/code> padara <code>$*user<\/code> dinamisku. <code>whoami<\/code> nekad nesaņem to kā parametru. Tā atrod vērtību caur izsaukumu steku. Tāpēc pirmais izsaukums parāda noklusējuma vērtību, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Iekšējais bloks vēlreiz deklarē <code>$*user<\/code> kā <code>admin<\/code>. Tas ilgst, kamēr bloks darbojas. <em>Tā pati<\/em> <code>whoami<\/code> tagad redz <code>admin<\/code>. Dinamiskā meklēšana pārbauda, kas tagad ir izsaukumu stekā. Jūs pārmācat dinamisku mainīgo kādā redzamības apgabalā. Tad viss kods, ko jūs no turienes izsaucat, saņem vairāk tiesību. Un jūs nemaz nemaināt <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Динамическая переменная","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Твигил <code>*<\/code> делает переменную <code>$*user<\/code> динамической. <code>whoami<\/code> никогда не получает её как параметр. Она находит значение по стеку вызовов. Поэтому первый вызов показывает значение по умолчанию, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внутренний блок снова объявляет <code>$*user<\/code> как <code>admin<\/code>. Это действует, пока работает блок. <em>Та же самая<\/em> <code>whoami<\/code> теп p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Туигилът <code>*<\/code> прави <code>$*user<\/code> динамична. <code>whoami<\/code> никога не я получава като параметър. Тя намира стойността през стека на извикванията. Така първото извикване показва стойността по подразбиране, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вътрешният блок декларира <code>$*user<\/code> отново като <code>admin<\/code>. Това трае, докато блокът работи. <em>Същата<\/em> <code>whoami<\/code> сега вижда <code>admin<\/code>. Динамичното търсене проверява кой е на стека на извикванията сега. Вие заменяте динамична променлива в даден обхват. Тогава целият код, който извиквате оттам, получава повече права. И вие изобщо не променяте <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Dinamika variablo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tvigilo <code>*<\/code> igas <code>$*user<\/code> dinamika. <code>whoami<\/code> neniam ricevas ĝin kiel parametron. Ĝi trovas la valoron tra la voka stako. Do la unua voko montras la defaŭltan valoron, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La interna bloko denove deklaras <code>$*user<\/code> kiel <code>admin<\/code>. Tio daŭras, dum la bloko ruliĝas. La <em>sama<\/em> <code>whoami<\/code> nun vidas <code>admin<\/code>. Dinamika serĉado kontrolas, kiu nun estas sur la voka stako. Vi anstataŭigas dinamikan variablon en amplekso. Tiam ĉiu kodo, kiun vi vokas de tie, ricevas pli da rajtoj. Kaj vi tute ne ŝanĝas <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Dynamica variabilis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Twigil <code>*<\/code> <code>$*user<\/code> dynamicam facit. <code>whoami<\/code> eam numquam ut parametrum accipit. Valorem per acervum vocationum invenit. Itaque prima vocatio valorem praedefinitum ostendit, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Clausula interior <code>$*user<\/code> iterum ut <code>admin<\/code> declarat. Hoc manet dum clausula currit. <em>Idem<\/em> <code>whoami<\/code> nunc <code>admin<\/code> videt. Quaesitio dynamica inspicit codicem qui nunc in acervo vocationum est. Variabilem dynamicam in circumscriptione superas. Tum omnis codex quem inde vocas plura iura accipit. Et <code>whoami<\/code> omnino non mutas.<\/span><\/li><\/ol>"]]}}}</script>
