<script type="application/json" id="page-data">{"u":"advanced/special-variables/dynamic-variables","n":408,"k":"topic","pv":"advanced/special-variables/twigils/quiz","nx":"advanced/special-variables/dynamic-variables/quiz","tr":["advanced","advanced/special-variables"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Dynamic variables","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">A <em>dynamic<\/em> variable has the twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A normal, lexical variable is visible only in its own block.<\/span> <span class=\"sg\" data-s=\"2\">You declare it in this block.<\/span> <span class=\"sg\" data-s=\"3\">A dynamic variable is different.<\/span> <span class=\"sg\" data-s=\"4\">Raku looks for it <strong>through the call stack<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">It looks at the code that called the current code.<\/span> <span class=\"sg\" data-s=\"6\">Then it goes one step further back, and so on.<\/span> <span class=\"sg\" data-s=\"7\">It does not matter where the current code is written.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The subroutine <code>greet<\/code> does not declare <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It does not get it as an argument.<\/span> <span class=\"sg\" data-s=\"2\">But it can still see it.<\/span> <span class=\"sg\" data-s=\"3\">The variable is dynamic.<\/span> <span class=\"sg\" data-s=\"4\">And the variable is visible where the program calls <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This example also works with a simple global scalar variable <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The next example shows what is special about dynamic variables.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku looks for the variable through the call stack.<\/span> <span class=\"sg\" data-s=\"1\">So a closer declaration <strong>overrides<\/strong> a farther one.<\/span> <span class=\"sg\" data-s=\"2\">This means that Raku uses the closer one.<\/span> <span class=\"sg\" data-s=\"3\">This lasts while its block runs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">The same <code>show<\/code> prints <code>outer<\/code> the first time.<\/span> <span class=\"sg\" data-s=\"1\">The second time, it prints <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This time, the program calls <code>show<\/code> from inside the block.<\/span> <span class=\"sg\" data-s=\"3\">This block declares <code>$*level<\/code> again.<\/span> <span class=\"sg\" data-s=\"4\">This is <em>dynamic scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku’s built-in <code>$*OUT<\/code>, <code>$*IN<\/code>, and <code>$*ERR<\/code> work in this way.<\/span> <span class=\"sg\" data-s=\"6\">For example, you can declare <code>$*OUT<\/code> again in a block.<\/span> <span class=\"sg\" data-s=\"7\">Then the output goes to a new place for a while.<\/span> <span class=\"sg\" data-s=\"8\">Every routine that you call in the block sees the new value.<\/span> <span class=\"sg\" data-s=\"9\">Dynamic variables are great for information that the called code needs.<\/span> <span class=\"sg\" data-s=\"10\">You do not have to pass this information as an argument.<\/span><\/p>"]]},"de":{"t":"Dynamische Variablen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Eine <em>dynamische<\/em> Variable hat das Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eine normale, lexikalische Variable ist nur in ihrem eigenen Block sichtbar.<\/span> <span class=\"sg\" data-s=\"2\">Du deklarierst sie in diesem Block.<\/span> <span class=\"sg\" data-s=\"3\">Eine dynamische Variable ist anders.<\/span> <span class=\"sg\" data-s=\"4\">Raku sucht sie <strong>durch den Aufrufstapel<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Raku schaut auf den Code, der den aktuellen Code aufgerufen hat.<\/span> <span class=\"sg\" data-s=\"6\">Dann geht Raku einen Schritt weiter zurück, und so weiter.<\/span> <span class=\"sg\" data-s=\"7\">Es ist egal, wo der aktuelle Code geschrieben ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>greet<\/code> deklariert <code>$*greeting<\/code> nicht.<\/span> <span class=\"sg\" data-s=\"1\">Sie bekommt die Variable auch nicht als Argument.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie kann sie trotzdem sehen.<\/span> <span class=\"sg\" data-s=\"3\">Die Variable ist dynamisch.<\/span> <span class=\"sg\" data-s=\"4\">Und die Variable ist dort sichtbar, wo das Programm <code>greet<\/code> aufruft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Beispiel funktioniert auch mit einer einfachen globalen Skalarvariable <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das nächste Beispiel zeigt, was an dynamischen Variablen besonders ist.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku sucht die Variable durch den Aufrufstapel.<\/span> <span class=\"sg\" data-s=\"1\">Also <strong>überschreibt<\/strong> eine nähere Deklaration eine weiter entfernte.<\/span> <span class=\"sg\" data-s=\"2\">Das heißt: Raku verwendet die nähere.<\/span> <span class=\"sg\" data-s=\"3\">Das gilt, solange ihr Block läuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Dieselbe <code>show<\/code>-Funktion gibt beim ersten Mal <code>outer<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Beim zweiten Mal gibt sie <code>inner<\/code> aus.<\/span> <span class=\"sg\" data-s=\"2\">Diesmal ruft das Programm <code>show<\/code> aus dem Block heraus auf.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Block deklariert <code>$*level<\/code> noch einmal.<\/span> <span class=\"sg\" data-s=\"4\">Das ist <em>dynamisches Scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Rakus eingebaute Variablen <code>$*OUT<\/code>, <code>$*IN<\/code> und <code>$*ERR<\/code> funktionieren auf diese Weise.<\/span> <span class=\"sg\" data-s=\"6\">Zum Beispiel kannst du <code>$*OUT<\/code> in einem Block noch einmal deklarieren.<\/span> <span class=\"sg\" data-s=\"7\">Dann geht die Ausgabe für eine Weile an einen neuen Ort.<\/span> <span class=\"sg\" data-s=\"8\">Jede Routine, die du im Block aufrufst, sieht den neuen Wert.<\/span> <span class=\"sg\" data-s=\"9\">Dynamische Variablen sind sehr praktisch für Informationen, die der aufgerufene Code braucht.<\/span> <span class=\"sg\" data-s=\"10\">Du musst diese Informationen nicht als Argument übergeben.<\/span><\/p>"]]},"nl":{"t":"Dynamische variabelen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Een <em>dynamische<\/em> variabele heeft de twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Een gewone, lexicale variabele is alleen zichtbaar in zijn eigen blok.<\/span> <span class=\"sg\" data-s=\"2\">Je declareert hem in dat blok.<\/span> <span class=\"sg\" data-s=\"3\">Een dynamische variabele is anders.<\/span> <span class=\"sg\" data-s=\"4\">Raku zoekt hem <strong>via de call stack<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Het kijkt naar de code die de huidige code aanroept.<\/span> <span class=\"sg\" data-s=\"6\">Dan gaat het nog een stap terug, enzovoort.<\/span> <span class=\"sg\" data-s=\"7\">Het maakt niet uit waar de huidige code staat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>greet<\/code> declareert <code>$*greeting<\/code> niet.<\/span> <span class=\"sg\" data-s=\"1\">Hij krijgt hem ook niet als argument.<\/span> <span class=\"sg\" data-s=\"2\">Maar hij kan hem toch zien.<\/span> <span class=\"sg\" data-s=\"3\">De variabele is dynamisch.<\/span> <span class=\"sg\" data-s=\"4\">En de variabele is zichtbaar op de plek waar het programma <code>greet<\/code> aanroept.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit voorbeeld werkt ook met een eenvoudige globale scalar variabele <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het volgende voorbeeld laat zien wat er speciaal is aan dynamische variabelen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku zoekt de variabele via de call stack.<\/span> <span class=\"sg\" data-s=\"1\">Dus <strong>overschrijft<\/strong> een declaratie dichterbij een declaratie verder weg.<\/span> <span class=\"sg\" data-s=\"2\">Dat betekent dat Raku de declaratie dichterbij gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">Dat geldt zolang haar blok loopt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Dezelfde <code>show<\/code> print de eerste keer <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De tweede keer print hij <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deze keer roept het programma <code>show<\/code> aan vanuit het blok.<\/span> <span class=\"sg\" data-s=\"3\">Dit blok declareert <code>$*level<\/code> opnieuw.<\/span> <span class=\"sg\" data-s=\"4\">Dit is <em>dynamische scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">De ingebouwde <code>$*OUT<\/code>, <code>$*IN<\/code> en <code>$*ERR<\/code> van Raku werken op deze manier.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt bijvoorbeeld <code>$*OUT<\/code> opnieuw declareren in een blok.<\/span> <span class=\"sg\" data-s=\"7\">Dan gaat de uitvoer een tijdje naar een nieuwe plek.<\/span> <span class=\"sg\" data-s=\"8\">Elke routine die je in het blok aanroept, ziet de nieuwe waarde.<\/span> <span class=\"sg\" data-s=\"9\">Dynamische variabelen zijn ideaal voor informatie die de aangeroepen code nodig heeft.<\/span> <span class=\"sg\" data-s=\"10\">Je hoeft deze informatie niet als argument mee te geven.<\/span><\/p>"]]},"es":{"t":"Variables dinámicas","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Una variable <em>dinámica<\/em> tiene el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una variable normal, léxica, solo se ve en su propio bloque.<\/span> <span class=\"sg\" data-s=\"2\">La declaras en este bloque.<\/span> <span class=\"sg\" data-s=\"3\">Una variable dinámica es diferente.<\/span> <span class=\"sg\" data-s=\"4\">Raku la busca <strong>a través de la pila de llamadas<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Mira el código que llamó al código actual.<\/span> <span class=\"sg\" data-s=\"6\">Luego va un paso más atrás, y así sigue.<\/span> <span class=\"sg\" data-s=\"7\">No importa dónde está escrito el código actual.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>greet<\/code> no declara <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tampoco la recibe como argumento.<\/span> <span class=\"sg\" data-s=\"2\">Pero aun así puede verla.<\/span> <span class=\"sg\" data-s=\"3\">La variable es dinámica.<\/span> <span class=\"sg\" data-s=\"4\">Y la variable se ve en el lugar donde el programa llama a <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este ejemplo también funciona con una simple variable escalar global <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El siguiente ejemplo muestra qué tienen de especial las variables dinámicas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku busca la variable a través de la pila de llamadas.<\/span> <span class=\"sg\" data-s=\"1\">Así que una declaración más cercana <strong>anula<\/strong> a una más lejana.<\/span> <span class=\"sg\" data-s=\"2\">Esto significa que Raku usa la más cercana.<\/span> <span class=\"sg\" data-s=\"3\">Esto dura mientras se ejecuta su bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">La misma <code>show<\/code> imprime <code>outer<\/code> la primera vez.<\/span> <span class=\"sg\" data-s=\"1\">La segunda vez, imprime <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esta vez, el programa llama a <code>show<\/code> desde dentro del bloque.<\/span> <span class=\"sg\" data-s=\"3\">Este bloque declara <code>$*level<\/code> otra vez.<\/span> <span class=\"sg\" data-s=\"4\">Esto es el <em>ámbito dinámico<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Las variables integradas de Raku <code>$*OUT<\/code>, <code>$*IN<\/code> y <code>$*ERR<\/code> funcionan así.<\/span> <span class=\"sg\" data-s=\"6\">Por ejemplo, puedes declarar <code>$*OUT<\/code> otra vez en un bloque.<\/span> <span class=\"sg\" data-s=\"7\">Entonces la salida va a otro lugar por un tiempo.<\/span> <span class=\"sg\" data-s=\"8\">Cada rutina que llamas en el bloque ve el nuevo valor.<\/span> <span class=\"sg\" data-s=\"9\">Las variables dinámicas son muy buenas para información que necesita el código llamado.<\/span> <span class=\"sg\" data-s=\"10\">No tienes que pasar esta información como argumento.<\/span><\/p>"]]},"it":{"t":"Variabili dinamiche","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Una variabile <em>dinamica<\/em> ha il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile normale, lessicale, è visibile solo nel suo blocco.<\/span> <span class=\"sg\" data-s=\"2\">La dichiari in questo blocco.<\/span> <span class=\"sg\" data-s=\"3\">Una variabile dinamica è diversa.<\/span> <span class=\"sg\" data-s=\"4\">Raku la cerca <strong>nello stack delle chiamate<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Guarda il codice che ha chiamato il codice attuale.<\/span> <span class=\"sg\" data-s=\"6\">Poi va ancora un passo indietro, e così via.<\/span> <span class=\"sg\" data-s=\"7\">Non importa dove è scritto il codice attuale.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>greet<\/code> non dichiara <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non la riceve come argomento.<\/span> <span class=\"sg\" data-s=\"2\">Ma la può vedere lo stesso.<\/span> <span class=\"sg\" data-s=\"3\">La variabile è dinamica.<\/span> <span class=\"sg\" data-s=\"4\">E la variabile è visibile dove il programma chiama <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo esempio funziona anche con una semplice variabile scalare globale <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il prossimo esempio mostra cosa hanno di speciale le variabili dinamiche.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku cerca la variabile nello stack delle chiamate.<\/span> <span class=\"sg\" data-s=\"1\">Quindi una dichiarazione più vicina <strong>sovrascrive<\/strong> una più lontana.<\/span> <span class=\"sg\" data-s=\"2\">Questo vuol dire che Raku usa quella più vicina.<\/span> <span class=\"sg\" data-s=\"3\">Questo dura finché il suo blocco gira:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">La stessa <code>show<\/code> stampa <code>outer<\/code> la prima volta.<\/span> <span class=\"sg\" data-s=\"1\">La seconda volta, stampa <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questa volta, il programma chiama <code>show<\/code> dall'interno del blocco.<\/span> <span class=\"sg\" data-s=\"3\">Questo blocco dichiara di nuovo <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Questo è lo <em>scope dinamico<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Le variabili predefinite di Raku <code>$*OUT<\/code>, <code>$*IN<\/code> e <code>$*ERR<\/code> funzionano così.<\/span> <span class=\"sg\" data-s=\"6\">Per esempio, puoi dichiarare di nuovo <code>$*OUT<\/code> in un blocco.<\/span> <span class=\"sg\" data-s=\"7\">Allora l'output va in un posto nuovo per un po'.<\/span> <span class=\"sg\" data-s=\"8\">Ogni routine che chiami nel blocco vede il nuovo valore.<\/span> <span class=\"sg\" data-s=\"9\">Le variabili dinamiche sono ottime per le informazioni che servono al codice chiamato.<\/span> <span class=\"sg\" data-s=\"10\">Non devi passare queste informazioni come argomento.<\/span><\/p>"]]},"lv":{"t":"Dinamiskie mainīgie","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamiskam<\/em> mainīgajam ir tvigils <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Parasts, leksisks mainīgais ir redzams tikai savā blokā.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to deklarējat šajā blokā.<\/span> <span class=\"sg\" data-s=\"3\">Dinamisks mainīgais ir citāds.<\/span> <span class=\"sg\" data-s=\"4\">Raku to meklē <strong>caur izsaukumu steku<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Tas skatās kodu, kas izsauca pašreizējo kodu.<\/span> <span class=\"sg\" data-s=\"6\">Tad tas iet vēl vienu soli atpakaļ, un tā tālāk.<\/span> <span class=\"sg\" data-s=\"7\">Nav svarīgi, kur pašreizējais kods ir uzrakstīts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma <code>greet<\/code> nedeklarē <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā nesaņem to kā argumentu.<\/span> <span class=\"sg\" data-s=\"2\">Bet tā tomēr to redz.<\/span> <span class=\"sg\" data-s=\"3\">Mainīgais ir dinamisks.<\/span> <span class=\"sg\" data-s=\"4\">Un mainīgais ir redzams tur, kur programma izsauc <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis piemērs strādā arī ar vienkāršu globālu skalāro mainīgo <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais piemērs parāda, kas ir īpašs dinamiskajos mainīgajos.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku meklē mainīgo caur izsaukumu steku.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tuvāka deklarācija <strong>pārmāc<\/strong> tālāku.<\/span> <span class=\"sg\" data-s=\"2\">Tas nozīmē, ka Raku izmanto tuvāko.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir, kamēr darbojas tās bloks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Tā pati <code>show<\/code> pirmajā reizē izdrukā <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Otrajā reizē tā izdrukā <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šoreiz programma izsauc <code>show<\/code> no bloka iekšienes.<\/span> <span class=\"sg\" data-s=\"3\">Šis bloks vēlreiz deklarē <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas ir <em>dinamiskais redzamības apgabals<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku iebūvētie <code>$*OUT<\/code>, <code>$*IN<\/code> un <code>$*ERR<\/code> darbojas tieši tā.<\/span> <span class=\"sg\" data-s=\"6\">Piemēram, jūs varat vēlreiz deklarēt <code>$*OUT<\/code> blokā.<\/span> <span class=\"sg\" data-s=\"7\">Tad izvade uz laiku iet uz jaunu vietu.<\/span> <span class=\"sg\" data-s=\"8\">Katra rutīna, ko jūs izsaucat blokā, redz jauno vērtību.<\/span> <span class=\"sg\" data-s=\"9\">Dinamiskie mainīgie ir lieliski informācijai, kas vajadzīga izsauktajam kodam.<\/span> <span class=\"sg\" data-s=\"10\">Jums šī informācija nav jāpadod kā arguments.<\/span><\/p>"]]},"ru":{"t":"Динамические переменные","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">У <em>динамической<\/em> переменной есть твигил <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обычная, лексическая переменная видна только в своём блоке.<\/span> <span class=\"sg\" data-s=\"2\">Вы объявляете её в этом блоке.<\/span> <span class=\"sg\" data-s=\"3\">Динамическая переменная другая.<\/span> <span class=\"sg\" data-s=\"4\">Raku ищет её <strong>по стеку вызовов<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Он смотрит на код, который вызвал текущий код.<\/span> <span class=\"sg\" data-s=\"6\">Потом он идёт ещё на шаг назад, и так далее.<\/span> <span class=\"sg\" data-s=\"7\">Неважно, где написан текущий код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>greet<\/code> не объявляет <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она не получает её как аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Но она всё равно её видит.<\/span> <span class=\"sg\" data-s=\"3\">Переменная динамическая.<\/span> <span class=\"sg\" data-s=\"4\">А там, где программа вызывает <code>greet<\/code>, эта переменная видна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот пример работает и с простой глобальной скалярной переменной <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Следующий пример показывает, что особенного в динамических переменных.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ищет переменную по стеку вызовов.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому более близкое объявление <strong>перекрывает<\/strong> более далёкое.<\/span> <span class=\"sg\" data-s=\"2\">Это значит, что Raku использует более близкое.<\/span> <span class=\"sg\" data-s=\"3\">Это действует, пока работает его блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Та же <code>show<\/code> в первый раз печатает <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Во второй раз она печатает <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В этот раз программа вызывает <code>show<\/code> изнутри блока.<\/span> <span class=\"sg\" data-s=\"3\">Этот блок снова объявляет <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Это <em>динамическая область видимости<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Встроенные переменные Raku <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> работают так же.<\/span> <span class=\"sg\" data-s=\"6\">Например, можно снова объявить <code>$*OUT<\/code> в блоке.<\/span> <span class=\"sg\" data-s=\"7\">Тогда вывод на время идёт в новое место.<\/span> <span class=\"sg\" data-s=\"8\">Каждая подпрограмма, которую вы вызываете в блоке, видит новое значение.<\/span> <span class=\"sg\" data-s=\"9\">Динамические переменные отлично подходят для информации, которая нужна вызванному коду.<\/span> <span class=\"sg\" data-s=\"10\">Вам не нужно передавать эту информацию как аргумент.<\/span><\/p>"]]},"uk":{"t":"Динамічні змінні","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Динамічна<\/em> змінна має твіґіл <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звичайна, лексична змінна видима лише у своєму блоці.<\/span> <span class=\"sg\" data-s=\"2\">Ви оголошуєте її в цьому блоці.<\/span> <span class=\"sg\" data-s=\"3\">Динамічна змінна інша.<\/span> <span class=\"sg\" data-s=\"4\">Raku шукає її <strong>через стек викликів<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Він дивиться на код, який викликав поточний код.<\/span> <span class=\"sg\" data-s=\"6\">Потім він іде ще на крок назад, і так далі.<\/span> <span class=\"sg\" data-s=\"7\">Неважливо, де написано поточний код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>greet<\/code> не оголошує <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона не отримує її як аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Але вона все одно її бачить.<\/span> <span class=\"sg\" data-s=\"3\">Змінна динамічна.<\/span> <span class=\"sg\" data-s=\"4\">І змінна видима там, де програма викликає <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей приклад працює і з простою глобальною скалярною змінною <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наступний приклад показує, що особливого в динамічних змінних.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku шукає змінну через стек викликів.<\/span> <span class=\"sg\" data-s=\"1\">Тож ближче оголошення <strong>перекриває<\/strong> дальше.<\/span> <span class=\"sg\" data-s=\"2\">Це означає, що Raku використовує ближче.<\/span> <span class=\"sg\" data-s=\"3\">Так триває, поки виконується його блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Той самий <code>show<\/code> першого разу виводить <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Другого разу він виводить <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Цього разу програма викликає <code>show<\/code> зсередини блоку.<\/span> <span class=\"sg\" data-s=\"3\">Цей блок знову оголошує <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це <em>динамічна область видимості<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Вбудовані <code>$*OUT<\/code>, <code>$*IN<\/code> та <code>$*ERR<\/code> у Raku працюють саме так.<\/span> <span class=\"sg\" data-s=\"6\">Наприклад, ви можете знову оголосити <code>$*OUT<\/code> у блоці.<\/span> <span class=\"sg\" data-s=\"7\">Тоді вивід на якийсь час іде в нове місце.<\/span> <span class=\"sg\" data-s=\"8\">Кожна підпрограма, яку ви викликаєте в блоці, бачить нове значення.<\/span> <span class=\"sg\" data-s=\"9\">Динамічні змінні чудово підходять для відомостей, потрібних викликаному коду.<\/span> <span class=\"sg\" data-s=\"10\">Вам не треба передавати ці відомості як аргумент.<\/span><\/p>"]]},"bg":{"t":"Динамични променливи","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Динамичната<\/em> променлива има туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обикновената, лексикална променлива се вижда само в своя блок.<\/span> <span class=\"sg\" data-s=\"2\">Вие я декларирате в този блок.<\/span> <span class=\"sg\" data-s=\"3\">Динамичната променлива е различна.<\/span> <span class=\"sg\" data-s=\"4\">Raku я търси <strong>през стека на извикванията<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Той гледа кода, който е извикал текущия код.<\/span> <span class=\"sg\" data-s=\"6\">След това отива още една стъпка назад и така нататък.<\/span> <span class=\"sg\" data-s=\"7\">Няма значение къде е написан текущият код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>greet<\/code> не декларира <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя не я получава като аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Но все пак може да я види.<\/span> <span class=\"sg\" data-s=\"3\">Променливата е динамична.<\/span> <span class=\"sg\" data-s=\"4\">И променливата се вижда там, където програмата извиква <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този пример работи и с обикновена глобална скаларна променлива <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Следващият пример показва какво е особеното в динамичните променливи.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku търси променливата през стека на извикванията.<\/span> <span class=\"sg\" data-s=\"1\">Затова по-близка декларация <strong>заменя<\/strong> по-далечна.<\/span> <span class=\"sg\" data-s=\"2\">Това означава, че Raku използва по-близката.<\/span> <span class=\"sg\" data-s=\"3\">Това трае, докато работи нейният блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Същата <code>show<\/code> отпечатва <code>outer<\/code> първия път.<\/span> <span class=\"sg\" data-s=\"1\">Втория път тя отпечатва <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Този път програмата извиква <code>show<\/code> отвътре на блока.<\/span> <span class=\"sg\" data-s=\"3\">Този блок декларира <code>$*level<\/code> отново.<\/span> <span class=\"sg\" data-s=\"4\">Това е <em>динамично обхващане<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Вградените в Raku <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> работят по този начин.<\/span> <span class=\"sg\" data-s=\"6\">Например, можете отново да декларирате <code>$*OUT<\/code> в блок.<\/span> <span class=\"sg\" data-s=\"7\">Тогава изходът отива на ново място за известно време.<\/span> <span class=\"sg\" data-s=\"8\">Всяка подпрограма, която извиквате в блока, вижда новата стойност.<\/span> <span class=\"sg\" data-s=\"9\">Динамичните променливи са чудесни за информация, която е нужна на извикания код.<\/span> <span class=\"sg\" data-s=\"10\">Не трябва да предавате тази информация като аргумент.<\/span><\/p>"]]},"eo":{"t":"Dinamikaj variabloj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamika<\/em> variablo havas la tvigilon <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Normala, leksika variablo estas videbla nur en sia propra bloko.<\/span> <span class=\"sg\" data-s=\"2\">Vi deklaras ĝin en ĉi tiu bloko.<\/span> <span class=\"sg\" data-s=\"3\">Dinamika variablo estas alia.<\/span> <span class=\"sg\" data-s=\"4\">Raku serĉas ĝin <strong>tra la voka stako<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi rigardas la kodon, kiu vokis la nunan kodon.<\/span> <span class=\"sg\" data-s=\"6\">Poste ĝi iras unu paŝon plu malantaŭen, kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"7\">Ne gravas, kie la nuna kodo estas skribita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La subrutino <code>greet<\/code> ne deklaras <code>$*greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne ricevas ĝin kiel argumenton.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi tamen povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"3\">La variablo estas dinamika.<\/span> <span class=\"sg\" data-s=\"4\">Kaj la variablo estas videbla tie, kie la programo vokas <code>greet<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzemplo funkcias ankaŭ kun simpla tutmonda skalara variablo <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La sekva ekzemplo montras, kio estas speciala ĉe dinamikaj variabloj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku serĉas la variablon tra la voka stako.<\/span> <span class=\"sg\" data-s=\"1\">Do pli proksima deklaro <strong>anstataŭigas<\/strong> pli malproksiman.<\/span> <span class=\"sg\" data-s=\"2\">Tio signifas, ke Raku uzas la pli proksiman.<\/span> <span class=\"sg\" data-s=\"3\">Tio daŭras, dum ĝia bloko ruliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">La sama <code>show<\/code> presas <code>outer<\/code> la unuan fojon.<\/span> <span class=\"sg\" data-s=\"1\">La duan fojon, ĝi presas <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi-foje la programo vokas <code>show<\/code> el ene de la bloko.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu bloko denove deklaras <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tio estas <em>dinamika ampleksado<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">La enkonstruitaj <code>$*OUT<\/code>, <code>$*IN<\/code> kaj <code>$*ERR<\/code> de Raku funkcias tiel.<\/span> <span class=\"sg\" data-s=\"6\">Ekzemple, vi povas denove deklari <code>$*OUT<\/code> en bloko.<\/span> <span class=\"sg\" data-s=\"7\">Tiam la eligo iras al nova loko por iom da tempo.<\/span> <span class=\"sg\" data-s=\"8\">Ĉiu rutino, kiun vi vokas en la bloko, vidas la novan valoron.<\/span> <span class=\"sg\" data-s=\"9\">Dinamikaj variabloj estas bonegaj por informoj, kiujn la vokita kodo bezonas.<\/span> <span class=\"sg\" data-s=\"10\">Vi ne devas transdoni ĉi tiujn informojn kiel argumenton.<\/span><\/p>"]]},"la":{"t":"Dynamicae variabiles","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Variabilis <em>dynamica<\/em> twigil <code>*<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis vulgaris, lexica, solum in sua clausula visibilis est.<\/span> <span class=\"sg\" data-s=\"2\">Eam in hac clausula declaras.<\/span> <span class=\"sg\" data-s=\"3\">Variabilis dynamica aliter se habet.<\/span> <span class=\"sg\" data-s=\"4\">Raku eam <strong>per acervum vocationum<\/strong> quaerit.<\/span> <span class=\"sg\" data-s=\"5\">Codicem inspicit qui codicem praesentem vocavit.<\/span> <span class=\"sg\" data-s=\"6\">Deinde unum gradum retro it, et sic porro.<\/span> <span class=\"sg\" data-s=\"7\">Locus codicis praesentis nihil refert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>greet<\/code> variabilem <code>$*greeting<\/code> non declarat.<\/span> <span class=\"sg\" data-s=\"1\">Eam ut argumentum non accipit.<\/span> <span class=\"sg\" data-s=\"2\">Sed tamen eam videre potest.<\/span> <span class=\"sg\" data-s=\"3\">Variabilis dynamica est.<\/span> <span class=\"sg\" data-s=\"4\">Et variabilis visibilis est ubi programma <code>greet<\/code> vocat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc exemplum etiam cum simplici variabili globali scalari <code>$greeting<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Exemplum sequens ostendit rem specialem in variabilibus dynamicis.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku variabilem per acervum vocationum quaerit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque declaratio propior remotiorem <strong>superat<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc significat: Raku propiorem adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Hoc manet dum clausula eius currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Idem <code>show<\/code> prima vice <code>outer<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vice <code>inner<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Hac vice programma <code>show<\/code> ex clausula vocat.<\/span> <span class=\"sg\" data-s=\"3\">Haec clausula <code>$*level<\/code> iterum declarat.<\/span> <span class=\"sg\" data-s=\"4\">Haec est <em>circumscriptio dynamica<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Variabiles inbuiltae Raku <code>$*OUT<\/code>, <code>$*IN<\/code> et <code>$*ERR<\/code> hoc modo operantur.<\/span> <span class=\"sg\" data-s=\"6\">Exempli gratia, <code>$*OUT<\/code> in clausula iterum declarare potes.<\/span> <span class=\"sg\" data-s=\"7\">Tum exitus ad tempus ad novum locum it.<\/span> <span class=\"sg\" data-s=\"8\">Omnis procedura quam in clausula vocas novum valorem videt.<\/span> <span class=\"sg\" data-s=\"9\">Variabiles dynamicae optimae sunt pro informatione quam codex vocatus requirit.<\/span> <span class=\"sg\" data-s=\"10\">Hanc informationem ut argumentum tradere non debes.<\/span><\/p>"]]}}}</script>
