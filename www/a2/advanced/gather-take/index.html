<script type="application/json" id="page-data">{"u":"advanced/gather-take","n":607,"k":"section","pv":"advanced/given-when/exercises/match-by-type/solution","nx":"advanced/gather-take/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"<code>gather<\/code> and <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> and <code>take<\/code> work as a pair.<\/span> <span class=\"sg\" data-s=\"1\">With them, you can build a list in many ways.<\/span> <span class=\"sg\" data-s=\"2\">You put some code in a <code>gather<\/code> block.<\/span> <span class=\"sg\" data-s=\"3\">Each time this code calls <code>take<\/code>, a value goes into a list.<\/span> <span class=\"sg\" data-s=\"4\">The <code>gather<\/code> block gives you this list.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The three <code>take<\/code> calls give three values.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> collects them into a list.<\/span> <span class=\"sg\" data-s=\"2\">The list goes into <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The pair is most useful when the <code>take<\/code> calls are inside normal code.<\/span> <span class=\"sg\" data-s=\"1\">For example, they can be in a loop with a condition.<\/span> <span class=\"sg\" data-s=\"2\">Then the list has only the values that you take:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the loop goes over the numbers from 1 to 10.<\/span> <span class=\"sg\" data-s=\"1\">But the code takes only the even numbers.<\/span> <span class=\"sg\" data-s=\"2\">So in the end, <code>@evens<\/code> has <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The operator <code>%%<\/code> checks if a number divides with nothing left over.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This split of the work makes <code>gather<\/code>/<code>take<\/code> so useful.<\/span> <span class=\"sg\" data-s=\"1\">The code around <code>take<\/code> decides <em>when<\/em> to make a value.<\/span> <span class=\"sg\" data-s=\"2\">And <code>gather<\/code> quietly collects every value that you take.<\/span><\/p>"]]},"de":{"t":"<code>gather<\/code> und <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> und <code>take<\/code> arbeiten als Paar.<\/span> <span class=\"sg\" data-s=\"1\">Mit ihnen kannst du eine Liste auf viele Arten bauen.<\/span> <span class=\"sg\" data-s=\"2\">Du setzt etwas Code in einen <code>gather<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"3\">Jedes Mal, wenn dieser Code <code>take<\/code> aufruft, kommt ein Wert in eine Liste.<\/span> <span class=\"sg\" data-s=\"4\">Der <code>gather<\/code>-Block gibt dir diese Liste.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die drei <code>take<\/code>-Aufrufe geben drei Werte.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> sammelt sie in einer Liste.<\/span> <span class=\"sg\" data-s=\"2\">Die Liste kommt in <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Paar ist am nützlichsten, wenn die <code>take<\/code>-Aufrufe in normalem Code stehen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können zum Beispiel in einer Schleife mit einer Bedingung stehen.<\/span> <span class=\"sg\" data-s=\"2\">Dann hat die Liste nur die Werte, die du nimmst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier geht die Schleife über die Zahlen von 1 bis 10.<\/span> <span class=\"sg\" data-s=\"1\">Aber der Code nimmt nur die geraden Zahlen.<\/span> <span class=\"sg\" data-s=\"2\">Am Ende hat <code>@evens<\/code> also <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Der Operator <code>%%<\/code> prüft, ob eine Zahl ohne Rest teilbar ist.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Teilung der Arbeit macht <code>gather<\/code>/<code>take<\/code> so nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Der Code um <code>take<\/code> herum entscheidet, <em>wann<\/em> ein Wert entsteht.<\/span> <span class=\"sg\" data-s=\"2\">Und <code>gather<\/code> sammelt still jeden Wert, den du nimmst.<\/span><\/p>"]]},"nl":{"t":"<code>gather<\/code> en <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> en <code>take<\/code> werken als een paar.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kun je op veel manieren een lijst bouwen.<\/span> <span class=\"sg\" data-s=\"2\">Je zet wat code in een <code>gather<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"3\">Elke keer als deze code <code>take<\/code> aanroept, gaat er een waarde in een lijst.<\/span> <span class=\"sg\" data-s=\"4\">Het <code>gather<\/code>-blok geeft je deze lijst.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De drie <code>take<\/code>-aanroepen geven drie waarden.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> verzamelt ze in een lijst.<\/span> <span class=\"sg\" data-s=\"2\">De lijst gaat naar <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het paar is het handigst als de <code>take<\/code>-aanroepen in gewone code staan.<\/span> <span class=\"sg\" data-s=\"1\">Ze kunnen bijvoorbeeld in een lus met een voorwaarde staan.<\/span> <span class=\"sg\" data-s=\"2\">Dan heeft de lijst alleen de waarden die je neemt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier gaat de lus over de getallen van 1 tot 10.<\/span> <span class=\"sg\" data-s=\"1\">Maar de code neemt alleen de even getallen.<\/span> <span class=\"sg\" data-s=\"2\">Aan het einde heeft <code>@evens<\/code> dus <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De operator <code>%%<\/code> kijkt of een getal deelbaar is zonder rest.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze verdeling van het werk maakt <code>gather<\/code>/<code>take<\/code> zo handig.<\/span> <span class=\"sg\" data-s=\"1\">De code rond <code>take<\/code> bepaalt <em>wanneer<\/em> er een waarde komt.<\/span> <span class=\"sg\" data-s=\"2\">En <code>gather<\/code> verzamelt stilletjes elke waarde die je neemt.<\/span><\/p>"]]},"es":{"t":"<code>gather<\/code> y <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> y <code>take<\/code> trabajan en pareja.<\/span> <span class=\"sg\" data-s=\"1\">Con ellos puedes construir una lista de muchas formas.<\/span> <span class=\"sg\" data-s=\"2\">Pones algo de código en un bloque <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Cada vez que este código llama a <code>take<\/code>, un valor entra en una lista.<\/span> <span class=\"sg\" data-s=\"4\">El bloque <code>gather<\/code> te da esta lista.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Las tres llamadas a <code>take<\/code> dan tres valores.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> los recoge en una lista.<\/span> <span class=\"sg\" data-s=\"2\">La lista va a <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El par es más útil cuando las llamadas a <code>take<\/code> están dentro de código normal.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, pueden estar en un bucle con una condición.<\/span> <span class=\"sg\" data-s=\"2\">Entonces la lista tiene solo los valores que tomas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, el bucle recorre los números del 1 al 10.<\/span> <span class=\"sg\" data-s=\"1\">Pero el código toma solo los números pares.<\/span> <span class=\"sg\" data-s=\"2\">Así que al final, <code>@evens<\/code> tiene <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El operador <code>%%<\/code> comprueba si un número se divide sin resto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este reparto del trabajo hace que <code>gather<\/code>/<code>take<\/code> sea tan útil.<\/span> <span class=\"sg\" data-s=\"1\">El código alrededor de <code>take<\/code> decide <em>cuándo<\/em> crear un valor.<\/span> <span class=\"sg\" data-s=\"2\">Y <code>gather<\/code> recoge en silencio cada valor que tomas.<\/span><\/p>"]]},"it":{"t":"<code>gather<\/code> e <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> e <code>take<\/code> lavorano in coppia.<\/span> <span class=\"sg\" data-s=\"1\">Con loro puoi costruire una lista in molti modi.<\/span> <span class=\"sg\" data-s=\"2\">Metti del codice in un blocco <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ogni volta che questo codice chiama <code>take<\/code>, un valore entra in una lista.<\/span> <span class=\"sg\" data-s=\"4\">Il blocco <code>gather<\/code> ti dà questa lista.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le tre chiamate a <code>take<\/code> danno tre valori.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> li raccoglie in una lista.<\/span> <span class=\"sg\" data-s=\"2\">La lista va in <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La coppia è più utile quando le chiamate a <code>take<\/code> stanno dentro codice normale.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, possono stare in un ciclo con una condizione.<\/span> <span class=\"sg\" data-s=\"2\">Allora la lista ha solo i valori che prendi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui il ciclo passa sui numeri da 1 a 10.<\/span> <span class=\"sg\" data-s=\"1\">Ma il codice prende solo i numeri pari.<\/span> <span class=\"sg\" data-s=\"2\">Così alla fine <code>@evens<\/code> contiene <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'operatore <code>%%<\/code> controlla se un numero si divide senza resto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa divisione del lavoro rende <code>gather<\/code>/<code>take<\/code> così utile.<\/span> <span class=\"sg\" data-s=\"1\">Il codice intorno a <code>take<\/code> decide <em>quando<\/em> creare un valore.<\/span> <span class=\"sg\" data-s=\"2\">E <code>gather<\/code> raccoglie in silenzio ogni valore che prendi.<\/span><\/p>"]]},"lv":{"t":"<code>gather<\/code> un <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> un <code>take<\/code> strādā kā pāris.<\/span> <span class=\"sg\" data-s=\"1\">Ar tiem jūs varat uzbūvēt sarakstu daudzos veidos.<\/span> <span class=\"sg\" data-s=\"2\">Jūs ieliekat kādu kodu blokā <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Katru reizi, kad šis kods izsauc <code>take<\/code>, vērtība nonāk sarakstā.<\/span> <span class=\"sg\" data-s=\"4\">Bloks <code>gather<\/code> jums atdod šo sarakstu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Trīs <code>take<\/code> izsaukumi dod trīs vērtības.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> tās savāc sarakstā.<\/span> <span class=\"sg\" data-s=\"2\">Saraksts nonāk mainīgajā <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pāris ir visnoderīgākais, kad <code>take<\/code> izsaukumi ir parastā kodā.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tie var būt ciklā ar nosacījumu.<\/span> <span class=\"sg\" data-s=\"2\">Tad sarakstā ir tikai tās vērtības, ko jūs paņemat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit cikls iet pāri skaitļiem no 1 līdz 10.<\/span> <span class=\"sg\" data-s=\"1\">Bet kods paņem tikai pāra skaitļus.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc beigās mainīgajā <code>@evens<\/code> ir <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Operators <code>%%<\/code> pārbauda, vai skaitlis dalās bez atlikuma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī darba sadale padara <code>gather<\/code>/<code>take<\/code> tik noderīgu.<\/span> <span class=\"sg\" data-s=\"1\">Kods ap <code>take<\/code> izlemj, <em>kad<\/em> radīt vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>gather<\/code> klusi savāc katru vērtību, ko jūs paņemat.<\/span><\/p>"]]},"ru":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> и <code>take<\/code> работают в паре.<\/span> <span class=\"sg\" data-s=\"1\">С ними можно строить список разными способами.<\/span> <span class=\"sg\" data-s=\"2\">Вы помещаете код в блок <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Каждый раз, когда этот код вызывает <code>take<\/code>, значение попадает в список.<\/span> <span class=\"sg\" data-s=\"4\">Блок <code>gather<\/code> отдаёт вам этот список.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Три вызова <code>take<\/code> дают три значения.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> собирает их в список.<\/span> <span class=\"sg\" data-s=\"2\">Список попадает в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара особенно полезна, когда вызовы <code>take<\/code> стоят внутри обычного кода.<\/span> <span class=\"sg\" data-s=\"1\">Например, они могут быть в цикле с условием.<\/span> <span class=\"sg\" data-s=\"2\">Тогда в списке есть только те значения, которые вы берёте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь цикл идёт по числам от 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Но код берёт только чётные числа.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому в конце в <code>@evens<\/code> лежат <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оператор <code>%%<\/code> проверяет, делится ли число без остатка.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Такое разделение работы делает <code>gather<\/code>/<code>take<\/code> таким полезным.<\/span> <span class=\"sg\" data-s=\"1\">Код вокруг <code>take<\/code> решает, <em>когда<\/em> создать значение.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо собирает каждое значение, которое вы берёте.<\/span><\/p>"]]},"uk":{"t":"<code>gather<\/code> та <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> і <code>take<\/code> працюють у парі.<\/span> <span class=\"sg\" data-s=\"1\">З ними можна будувати список багатьма способами.<\/span> <span class=\"sg\" data-s=\"2\">Ви кладете якийсь код у блок <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Щоразу, коли цей код викликає <code>take<\/code>, значення йде в список.<\/span> <span class=\"sg\" data-s=\"4\">Блок <code>gather<\/code> дає вам цей список.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Три виклики <code>take<\/code> дають три значення.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> збирає їх у список.<\/span> <span class=\"sg\" data-s=\"2\">Список потрапляє в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ця пара найкорисніша, коли виклики <code>take<\/code> стоять у звичайному коді.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, вони можуть бути в циклі з умовою.<\/span> <span class=\"sg\" data-s=\"2\">Тоді список має лише ті значення, які ви берете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут цикл проходить по числах від 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Але код бере лише парні числа.<\/span> <span class=\"sg\" data-s=\"2\">Тож у кінці <code>@evens<\/code> має <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оператор <code>%%<\/code> перевіряє, чи ділиться число без остачі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Такий поділ роботи робить <code>gather<\/code>/<code>take<\/code> таким корисним.<\/span> <span class=\"sg\" data-s=\"1\">Код навколо <code>take<\/code> вирішує, <em>коли<\/em> створити значення.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо збирає кожне значення, яке ви берете.<\/span><\/p>"]]},"bg":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> и <code>take<\/code> работят като двойка.<\/span> <span class=\"sg\" data-s=\"1\">С тях можете да изградите списък по много начини.<\/span> <span class=\"sg\" data-s=\"2\">Слагате някакъв код в блок <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Всеки път, когато този код извика <code>take<\/code>, една стойност влиза в списък.<\/span> <span class=\"sg\" data-s=\"4\">Блокът <code>gather<\/code> ви дава този списък.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Трите извиквания на <code>take<\/code> дават три стойности.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> ги събира в списък.<\/span> <span class=\"sg\" data-s=\"2\">Списъкът отива в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двойката е най-полезна, когато извикванията на <code>take<\/code> са в обикновен код.<\/span> <span class=\"sg\" data-s=\"1\">Например те могат да са в цикъл с условие.<\/span> <span class=\"sg\" data-s=\"2\">Тогава списъкът има само стойностите, които вземете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук цикълът минава през числата от 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Но кодът взема само четните числа.<\/span> <span class=\"sg\" data-s=\"2\">Така накрая <code>@evens<\/code> съдържа <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Операторът <code>%%<\/code> проверява дали числото се дели без остатък.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това разделяне на работата прави <code>gather<\/code>/<code>take<\/code> толкова полезни.<\/span> <span class=\"sg\" data-s=\"1\">Кодът около <code>take<\/code> решава <em>кога<\/em> да създаде стойност.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо събира всяка стойност, която вземете.<\/span><\/p>"]]},"eo":{"t":"<code>gather<\/code> kaj <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> kaj <code>take<\/code> laboras kiel paro.<\/span> <span class=\"sg\" data-s=\"1\">Per ili vi povas konstrui liston en multaj manieroj.<\/span> <span class=\"sg\" data-s=\"2\">Vi metas iom da kodo en blokon <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiufoje, kiam ĉi tiu kodo vokas <code>take<\/code>, valoro iras en liston.<\/span> <span class=\"sg\" data-s=\"4\">La bloko <code>gather<\/code> donas al vi ĉi tiun liston.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La tri vokoj de <code>take<\/code> donas tri valorojn.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> kolektas ilin en liston.<\/span> <span class=\"sg\" data-s=\"2\">La listo iras en <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La paro estas plej utila, kiam la vokoj de <code>take<\/code> estas en normala kodo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ili povas esti en buklo kun kondiĉo.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la listo havas nur la valorojn, kiujn vi prenas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la buklo iras tra la nombroj de 1 ĝis 10.<\/span> <span class=\"sg\" data-s=\"1\">Sed la kodo prenas nur la parajn nombrojn.<\/span> <span class=\"sg\" data-s=\"2\">Do fine <code>@evens<\/code> havas <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La operatoro <code>%%<\/code> kontrolas, ĉu nombro dividiĝas sen resto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu divido de la laboro faras <code>gather<\/code>/<code>take<\/code> tiel utila.<\/span> <span class=\"sg\" data-s=\"1\">La kodo ĉirkaŭ <code>take<\/code> decidas, <em>kiam<\/em> fari valoron.<\/span> <span class=\"sg\" data-s=\"2\">Kaj <code>gather<\/code> kviete kolektas ĉiun valoron, kiun vi prenas.<\/span><\/p>"]]},"la":{"t":"<code>gather<\/code> et <code>take<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>gather<\/code> et <code>take<\/code> ut par operantur.<\/span> <span class=\"sg\" data-s=\"1\">Cum eis indicem multis modis construere potes.<\/span> <span class=\"sg\" data-s=\"2\">Codicem in copiam <code>gather<\/code> ponis.<\/span> <span class=\"sg\" data-s=\"3\">Quotiens hic codex <code>take<\/code> vocat, valor in indicem it.<\/span> <span class=\"sg\" data-s=\"4\">Copia <code>gather<\/code> tibi hunc indicem dat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tres vocationes <code>take<\/code> tres valores dant.<\/span> <span class=\"sg\" data-s=\"1\"><code>gather<\/code> eos in indicem colligit.<\/span> <span class=\"sg\" data-s=\"2\">Index in <code>@result<\/code> it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Par utilissimum est cum vocationes <code>take<\/code> in codice ordinario sunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, in ansa cum condicione esse possunt.<\/span> <span class=\"sg\" data-s=\"2\">Tum index solum valores habet quos capis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic ansa per numeros ab 1 ad 10 it.<\/span> <span class=\"sg\" data-s=\"1\">Sed codex solum numeros pares capit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque in fine <code>@evens<\/code> habet <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Operator <code>%%<\/code> probat num numerus sine reliquo dividatur.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec divisio operis <code>gather<\/code>/<code>take<\/code> tam utile facit.<\/span> <span class=\"sg\" data-s=\"1\">Codex circa <code>take<\/code> decernit <em>quando<\/em> valorem faciat.<\/span> <span class=\"sg\" data-s=\"2\">Et <code>gather<\/code> quiete omnem valorem colligit quem capis.<\/span><\/p>"]]}}}</script>
