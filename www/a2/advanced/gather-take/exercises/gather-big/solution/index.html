m += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл получает диапазон из ста чисел. Ему нужно гораздо меньше. Но это нормально. Цикл останавливается сам. Когда <code>$sum<\/code> становится больше <code>10<\/code>, <code>last<\/code> выходит из цикла. Программа никогда не смотрит на остальные числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок в блоке важен. Сначала мы прибавляем число к <code>$sum<\/code>. Потом мы проверяем предел. После этого мы берём число. Одно число делает сумму больше <code>10<\/code>. Здесь это число <code>5<\/code>. Код его не берёт. После <code>4<\/code> сумма равна ровно <code>10<\/code>. Поэтому список — это <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">С <code>for<\/code> пара <code>gather<\/code>/<code>take<\/code> может остановиться раньше. <code>grep<\/code> так не умеет. <code>grep<\/code> всегда смотрит весь список. Здесь мы сами решаем, когда остановиться.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Збирайте, поки не заповниться","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл отримує діапазон зі ста чисел. Йому треба набагато менше. Але це нормально. Цикл зупиняється сам. Коли <code>$sum<\/code> стає більшою за <code>10<\/code>, <code>last<\/code> виходить з циклу. Програма ніколи не дивиться на інші числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок у блоці важливий. Спочатку ми додаємо число до <code>$sum<\/code>. Потім ми перевіряємо межу. Після цього ми беремо число. Одне число робить суму більшою за <code>10<\/code>. Тут це число — <code>5<\/code>. Код його не бере. Після <code>4<\/code> сума дорівнює рівно <code>10<\/code>. Тож список — це <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">З <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> може зупинитися раніше. <code>grep<\/code> так не може. <code>grep<\/code> завжди дивиться на весь список. Тут ми самі вибираємо, коли зупинитися.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Gather до запълване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикълът получава диапазон от сто числа. Нужни са му много по-малко. Но това е наред. Цикълът спира сам. Когато <code>$sum<\/code> стане по-голяма от <code>10<\/code>, <code>last<\/code> излиза от цикъла. Програмата никога не гледа другите числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът в блока е важен. Първо добавяме числото към <code>$sum<\/code>. След това проверяваме лимита. После вземаме числото. Едно число прави сумата по-голяма от <code>10<\/code>. Тук това число е <code>5<\/code>. Кодът не го взема. След <code>4<\/code> сумата е точно <code>10<\/code>. Затова списъкът е <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">С <code>for<\/code> двойката <code>gather<\/code>/<code>take<\/code> може да спре рано. <code>grep<\/code> не може да направи това. <code>grep<\/code> винаги гледа целия списък. Тук ние избираме кога да спрем.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Kolekti ĝis plena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La buklo ricevas intervalon de cent nombroj. Ĝi bezonas multe malpli. Sed tio estas en ordo. La buklo haltas per si mem. Kiam <code>$sum<\/code> fariĝas pli granda ol <code>10<\/code>, <code>last<\/code> forlasas la buklon. La programo neniam rigardas la aliajn nombrojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo en la bloko estas grava. Unue ni aldonas la nombron al <code>$sum<\/code>. Poste ni kontrolas la limon. Post tio, ni prenas la nombron. Unu nombro faras la sumon pli granda ol <code>10<\/code>. Ĉi tie, tiu nombro estas <code>5<\/code>. La kodo ne prenas ĝin. Post <code>4<\/code>, la sumo estas ĝuste <code>10<\/code>. Do la listo estas <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kun <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> povas halti frue. <code>grep<\/code> ne povas fari tion. <code>grep<\/code> ĉiam rigardas la tutan liston. Ĉi tie ni elektas, kiam halti.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Colligere usque ad plenum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansa seriem centum numerorum accipit. Multo pauciores requirit. Sed hoc bene est. Ansa per se desinit. Cum <code>$sum<\/code> maior quam <code>10<\/code> fit, <code>last<\/code> ansam relinquit. Programma ceteros numeros numquam spectat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo in copia magni momenti est. Primum numerum ad <code>$sum<\/code> addimus. Deinde limitem probamus. Postea numerum capimus. Unus numerus summam maiorem quam <code>10<\/code> facit. Hic ille numerus est <code>5<\/code>. Codex eum non capit. Post <code>4<\/code> summa est exacte <code>10<\/code>. Itaque index est <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cum <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> mature desinere potest. <code>grep<\/code> hoc facere non potest. <code>grep<\/code> semper totum indicem spectat. Hic nos tempus finis eligimus.<\/span><\/li><\/ol>"]]}}}</script>
