n order. So <code>@result<\/code> has one <code>1<\/code>, two <code>2<\/code>s, three <code>3<\/code>s and four <code>4<\/code>s.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Jede Zahl wiederholen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Du brauchst nicht genau ein <code>take<\/code> in jeder Runde. Schau dir hier das innere <code>take $n for 1..$n<\/code> an. Es ruft <code>take<\/code> in jeder Runde verschieden oft auf. Diese Freiheit macht <code>gather<\/code>/<code>take<\/code> stärker als ein einfaches <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die äußere Schleife hat eine Variable mit Namen, <code>-&gt; $n<\/code>. Das ist Absicht. Stell dir vor, wir nehmen <code>$_<\/code> in der inneren Schleife. Dann legt das innere <code>for<\/code> seinen eigenen Zähler in <code>$_<\/code>. Also nehmen wir den Zähler, nicht die aktuelle Zahl.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> sammelt einfach jeden Wert, den der Code nimmt, der Reihe nach. Also hat <code>@result<\/code> eine <code>1<\/code>, zwei <code>2<\/code>en, drei <code>3<\/code>en und vier <code>4<\/code>en.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Elk getal herhalen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Je hebt niet precies één <code>take<\/code> per ronde nodig. Kijk hier naar de binnenste <code>take $n for 1..$n<\/code>. Die voert <code>take<\/code> in elke ronde een ander aantal keren uit. Deze vrijheid maakt <code>gather<\/code>/<code>take<\/code> sterker dan een simpele <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De buitenste lus heeft een variabele met een naam, <code>-&gt; $n<\/code>. Dat is met opzet. Stel dat we <code>$_<\/code> gebruiken in de binnenste lus. Dan zet de binnenste <code>for<\/code> zijn eigen teller in <code>$_<\/code>. Zo nemen we de teller, niet het huidige getal.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> verzamelt gewoon elke waarde die de code neemt, op volgorde. Zo heeft <code>@result<\/code> één <code>1<\/code>, twee <code>2<\/code>'s, drie <code>3<\/code>'s en vier <code>4<\/code>'s.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Repetir cada número","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h" $n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Non serve esattamente un <code>take<\/code> a ogni giro. Guarda qui il <code>take $n for 1..$n<\/code> interno. Esegue <code>take<\/code> un numero diverso di volte a ogni giro. Questa libertà rende <code>gather<\/code>/<code>take<\/code> più forte di un semplice <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il ciclo esterno ha una variabile con un nome, <code>-&gt; $n<\/code>. Questo è voluto. Immaginiamo di usare <code>$_<\/code> nel ciclo interno. Allora il <code>for<\/code> interno mette il suo contatore in <code>$_<\/code>. Così prendiamo il contatore, non il numero corrente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> raccoglie semplicemente, in ordine, ogni valore che il codice prende. Così <code>@result<\/code> ha un <code>1<\/code>, due <code>2<\/code>, tre <code>3<\/code> e quattro <code>4<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Atkārtot katru skaitli","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exer ode",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не нужно ставить ровно один <code>take<\/code> на каждом шаге. Посмотрите здесь на внутренний <code>take $n for 1..$n<\/code>. Он выполняет <code>take<\/code> разное число раз на каждом шаге. Эта свобода делает <code>gather<\/code>/<code>take<\/code> сильнее простого <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У внешнего цикла есть переменная с именем, <code>-&gt; $n<\/code>. Это сделано специально. Представьте, что мы используем <code>$_<\/code> во внутреннем цикле. Тогда внутренний <code>for<\/code> кладёт в <code>$_<\/code> свой счётчик. И мы берём счётчик, а не текущее число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто собирает по порядку каждое значение, которое берёт код. Поэтому в <code>@result<\/code> есть одно число <code>1<\/code>, два числа <code>2<\/code>, три числа <code>3<\/code> и четыре числа <code>4<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Повторіть кожне число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вам не потрібен рівно один <code>take<\/code> на кожному проході. Подивіться тут на внутрішній <code>take $n for 1..$n<\/code>. Він виконує <code>take<\/code> різну кількість разів на кожному проході. Ця свобода робить <code>gather<\/code>/<code>take<\/code> сильнішим за простий <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зовнішній цикл має змінну з іменем, <code>-&gt; $n<\/code>. Ми зробили це навмисно. Уявіть, що ми використовуємо <code>$_<\/code> у внутрішньому циклі. Тоді внутрішній <code>for<\/code> кладе свій лічильник у <code>$_<\/code>. Тож ми беремо лічильник, а не поточне число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто збирає по порядку кожне значення, яке бере код. Тож <code>@result<\/code> має одну <code>1<\/code>, дві <code>2<\/code>, три <code>3<\/code> і чотири <code>4<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Повторете всяко число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не ви трябва точно едно <code>take<\/code> при всяка обиколка. Вижте вътрешното <code>take $n for 1..$n<\/code> тук. То изпълнява <code>take<\/code> различен брой пъти при всяка обиколка. Тази свобода прави <code>gather<\/code>/<code>take<\/code> по-силни от обикновен <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Външният цикъл има променлива с име, <code>-&gt; $n<\/code>. Това е нарочно. Представете си, че използваме <code>$_<\/code> във вътрешния цикъл. Тогава вътрешният <code>for<\/code> слага своя брояч в <code>$_<\/code>. Така ние вземаме брояча, а не текущото число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто събира всяка стойност, която кодът взема, по ред. Така <code>@result<\/code> има една <code>1<\/code>, две <code>2<\/code>, три <code>3<\/code> и четири <code>4<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ripeti ĉiun nombron","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi ne bezonas ĝuste unu <code>take<\/code> en ĉiu rondo. Rigardu la internan <code>take $n for 1..$n<\/code> ĉi tie. Ĝi rulas <code>take<\/code> malsaman nombron da fojoj en ĉiu rondo. Ĉi tiu libereco faras <code>gather<\/code>/<code>take<\/code> pli forta ol simpla <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ekstera buklo havas variablon kun nomo, <code>-&gt; $n<\/code>. Tio estas intenca. Imagu, ke ni uzas <code>$_<\/code> en la interna buklo. Tiam la interna <code>for<\/code> metas sian propran nombrilon en <code>$_<\/code>. Do ni prenas la nombrilon, ne la aktualan nombron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simple kolektas ĉiun valoron, kiun la kodo prenas, laŭ ordo. Do <code>@result<\/code> havas unu <code>1<\/code>, du <code>2<\/code>-ojn, tri <code>3<\/code>-ojn kaj kvar <code>4<\/code>-ojn.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Quemque numerum repetere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Non debes exacte unum <code>take<\/code> in quoque gyro habere. Specta hic interius <code>take $n for 1..$n<\/code>. In quoque gyro <code>take<\/code> alio numero vicium currit. Haec libertas <code>gather<\/code>/<code>take<\/code> fortius facit quam simplicem <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansa exterior variabilem cum nomine habet, <code>-&gt; $n<\/code>. Hoc consulto facimus. Finge: <code>$_<\/code> in ansa interiore adhibemus. Tum interior <code>for<\/code> suum numeratorem in <code>$_<\/code> ponit. Itaque numeratorem capimus, non numerum currentem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simpliciter omnem valorem ordine colligit quem codex capit. Itaque <code>@result<\/code> habet unum <code>1<\/code>, duos <code>2<\/code>, tres <code>3<\/code> et quattuor <code>4<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
