ode>.<\/span> <span class=\"sg\" data-s=\"2\">Dan test je hem met <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Daarna publiceer je hem met <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vanaf dan is hij gewoon nog een naam.<\/span> <span class=\"sg\" data-s=\"5\">Iedereen kan hem installeren met <code>zef install<\/code>.<\/span><\/p>"]]},"es":{"t":"zef y el ecosistema","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> instala módulos de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ya lo has usado para instalar módulos por su nombre.<\/span> <span class=\"sg\" data-s=\"2\">También funciona con una distribución en un directorio local.<\/span> <span class=\"sg\" data-s=\"3\">Entra en el directorio de una distribución.<\/span> <span class=\"sg\" data-s=\"4\">Desde allí, puedes probarla e instalarla directamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> ejecuta los archivos de <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instala la distribución en tu Raku.<\/span> <span class=\"sg\" data-s=\"2\">Entonces otros programas pueden cargarla con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">También puedes instalar por nombre, por ejemplo, <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Esto hace lo mismo.<\/span> <span class=\"sg\" data-s=\"5\">Pero primero descarga la distribución del ecosistema.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A lo mejor quieres <strong>publicar<\/strong> tu propia distribución.<\/span> <span class=\"sg\" data-s=\"1\">Entonces otras personas pueden instalarla por nombre.<\/span> <span class=\"sg\" data-s=\"2\">Para esto, la subes al ecosistema.<\/span> <span class=\"sg\" data-s=\"3\">Normalmente la gente usa <code>fez<\/code> para esto:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto empaqueta la distribución actual y la envía al ecosistema de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Después, <code>zef install Maths::Simple<\/code> funciona para todos.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos comandos necesitan <code>zef<\/code>/<code>fez<\/code> instalado y acceso a la red. Para subir, también necesitas una cuenta en el ecosistema.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Así que un módulo compartido pasa por tres pasos.<\/span> <span class=\"sg\" data-s=\"1\">Primero, le das la estructura estándar y un <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Después, lo pruebas con <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Luego lo publicas con <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">A partir de ahí, es solo un nombre más.<\/span> <span class=\"sg\" data-s=\"5\">Cualquiera puede instalarlo con <code>zef install<\/code>.<\/span><\/p>"]]},"it":{"t":"zef e l'ecosistema","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> installa i moduli Raku.<\/span> <span class=\"sg\" data-s=\"1\">Lo hai già usato per installare moduli con il loro nome.<\/span> <span class=\"sg\" data-s=\"2\">Funziona anche con una distribuzione in una directory locale.<\/span> <span class=\"sg\" data-s=\"3\">Entra nella directory di una distribuzione.<\/span> <span class=\"sg\" data-s=\"4\">Da lì puoi testarla e installarla direttamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> esegue i file sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> installa la distribuzione nel tuo Raku.<\/span> <span class=\"sg\" data-s=\"2\">Così altri programmi possono usarla con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi anche installare per n torijā.<\/span> <span class=\"sg\" data-s=\"3\">Ieejiet distribūcijas direktorijā.<\/span> <span class=\"sg\" data-s=\"4\">No turienes jūs varat to tieši testēt un instalēt:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> izpilda failus zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instalē distribūciju jūsu Raku vidē.<\/span> <span class=\"sg\" data-s=\"2\">Tad citas programmas var to ielādēt ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat instalēt arī pēc nosaukuma, piemēram, <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas dara to pašu.<\/span> <span class=\"sg\" data-s=\"5\">Bet vispirms tas lejupielādē distribūciju no ekosistēmas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūs gribat <strong>publicēt<\/strong> savu distribūciju.<\/span> <span class=\"sg\" data-s=\"1\">Tad citi cilvēki var to instalēt pēc nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izdarītu, jūs to augšupielādējat ekosistēmā.<\/span> <span class=\"sg\" data-s=\"3\">Cilvēki tam parasti izmanto <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas iepako pašreizējo distribūciju un nosūta to uz Raku ekosistēmu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam <code>zef install Maths::Simple<\/code> darbojas ikvienam.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Šīm komandām vajadzīgs instalēts <code>zef<\/code>/<code>fez<\/code> un tīkls. Augšupielādei vajadzīgs arī ekosistēmas konts.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tātad kopīgots modulis iziet trīs soļus.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms jūs dodat tam standarta izkārtojumu un <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tālāk jūs to testējat ar <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs to publicējat ar <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Pēc tam tas ir tikai vēl viens nosaukums.<\/span> <span class=\"sg\" data-s=\"5\">Ikviens var to instalēt ar <code>zef install<\/code>.<\/span><\/p>"]]},"ru":{"t":"zef и экосистема","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> устанавливает модули Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже устанавливали с ним модули по их именам.<\/span> <span class=\"sg\" data-s=\"2\">Он также работает с дистрибутивом в локальной директории.<\/span> <span class=\"sg\" data-s=\"3\">Перейдите в директорию дистрибутива.<\/span> <span class=\"sg\" data-s=\"4\">Оттуда вы можете сразу протестировать и установить его:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> запускает файлы из <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> устанавливает дистрибутив в ваш Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тогда другие программы могут загрузить его через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вы также можете установить модуль по имени, например <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Эта команда делает то же самое.<\/span> <span class=\"sg\" data-s=\"5\">Но сначала она скачивает дистрибутив из экосистемы.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Может быть, вы хотите <strong>опубликовать<\/strong> свой дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Тогда другие люди смогут установить его по имени.<\/span> <span class=\"sg\" data-s=\"2\">Для этого вы загружаете его в экосистему.<\/span> <span class=\"sg\" data-s=\"3\">Обычно для этого используют <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта команда упаковывает текущий дистрибутив и отправляет его в экосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">После этого <code>zef install Maths::Simple<\/code> работает у всех.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Этим командам нужны установленный <code>zef<\/code>/<code>fez<\/code> и сеть. Для загрузки нужна ещё учётная запись в экосистеме.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Итак, общий модуль проходит три шага.<\/span> <span class=\"sg\" data-s=\"1\">Сначала вы даёте ему стандартную структуру и <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потом вы тестируете его с помощью <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Затем вы публикуете его с помощью <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">После этого это просто ещё одно имя.<\/span> <span class=\"sg\" data-s=\"5\">Любой может установить его с помощью <code>zef install<\/code>.<\/span><\/p>"]]},"uk":{"t":"zef та екосистема","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> встановлює модулі Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже використовували його, щоб встановлювати модулі за іменем.<\/span> <span class=\"sg\" data-s=\"2\">Він також працює з дистрибутивом у локальному каталозі.<\/span> <span class=\"sg\" data-s=\"3\">Зайдіть у каталог дистрибутива.<\/span> <span class=\"sg\" data-s=\"4\">Звідти ви можете одразу протестувати й встановити його:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> запускає файли під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> встановлює дистрибутив у ваш Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тоді інші програми можуть завантажити його через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви також можете встановити модуль за іменем, наприклад <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це робить те саме.<\/span> <span class=\"sg\" data-s=\"5\">Але спершу команда завантажує дистрибутив з екосистеми.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви захочете <strong>опублікувати<\/strong> власний дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Тоді інші люди зможуть встановити його за іменем.<\/span> <span class=\"sg\" data-s=\"2\">Для цього ви завантажуєте його в екосистему.<\/span> <span class=\"sg\" data-s=\"3\">Зазвичай люди використовують для цього <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це пакує поточний дистрибутив і надсилає його в екосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">Після цього <code>zef install Maths::Simple<\/code> працює для будь-кого.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цим командам потрібні встановлені <code>zef<\/code>/<code>fez<\/code> і мережа. Щоб завантажувати, вам ще потрібен обліковий запис в екосистемі.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Отже, спільний модуль проходить три кроки.<\/span> <span class=\"sg\" data-s=\"1\">Спершу ви даєте йому стандартну структуру і <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Далі ви тестуєте його через <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Потім ви публікуєте його через <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Після цього це просто ще одне ім'я.<\/span> <span class=\"sg\" data-s=\"5\">Будь-хто може встановити його через <code>zef install<\/code>.<\/span><\/p>"]]},"bg":{"t":"zef и екосистемата","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> инсталира модули на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте инсталирали с него модули по име.<\/span> <span class=\"sg\" data-s=\"2\">Той работи и с дистрибуция в локална директория.<\/span> <span class=\"sg\" data-s=\"3\">Влезте в директорията на дистрибуцията.<\/span> <span class=\"sg\" data-s=\"4\">Оттам можете директно да я тествате и инсталирате:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> изпълнява файловете под <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> инсталира дистрибуцията във вашия Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тогава други програми могат да я заредят с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да инсталирате и по име, например <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Това прави същото.<\/span> <span class=\"sg\" data-s=\"5\">Но първо изтегля дистрибуцията от екосистемата.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Може да искате да <strong>публикувате<\/strong> своя дистрибуция.<\/span> <span class=\"sg\" data-s=\"1\">Тогава други хора могат да я инсталират по име.<\/span> <span class=\"sg\" data-s=\"2\">За това я качвате в екосистемата.<\/span> <span class=\"sg\" data-s=\"3\">Обикновено хората използват за това <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това прави пакет от текущата дистрибуция и го изпраща в екосистемата на Raku.<\/span> <span class=\"sg\" data-s=\"1\">След това <code>zef install Maths::Simple<\/code> работи за всеки.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези команди имат нужда от инсталирани <code>zef<\/code>/<code>fez<\/code> и от мрежа. За да качвате, ви трябва и акаунт в екосистемата.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Така споделеният модул минава през три стъпки.<\/span> <span class=\"sg\" data-s=\"1\">Първо му давате стандартното оформление и <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">После го тествате със <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">След това го публикувате с <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Оттам нататък той е просто още едно име.<\/span> <span class=\"sg\" data-s=\"5\">Всеки може да го инсталира със <code>zef install<\/code>.<\/span><\/p>"]]},"eo":{"t":"zef kaj la ekosistemo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> instalas Raku-modulojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam uzis ĝin por instali modulojn laŭ iliaj nomoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ funkcias kun distribuo en loka dosierujo.<\/span> <span class=\"sg\" data-s=\"3\">Iru en la dosierujon de distribuo.<\/span> <span class=\"sg\" data-s=\"4\">De tie vi povas rekte testi kaj instali ĝin:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> rulas la dosierojn sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instalas la distribuon en vian Raku.<\/span> <span class=\"sg\" data-s=\"2\">Tiam aliaj programoj povas <code>use<\/code> ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas instali laŭ nomo, ekzemple <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tio faras la samon.<\/span> <span class=\"sg\" data-s=\"5\">Sed unue ĝi elŝutas la distribuon el la ekosistemo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eble vi volas <strong>publikigi<\/strong> vian propran distribuon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam aliaj homoj povas instali ĝin laŭ nomo.<\/span> <span class=\"sg\" data-s=\"2\">Por tio vi alŝutas ĝin al la ekosistemo.<\/span> <span class=\"sg\" data-s=\"3\">Homoj kutime uzas <code>fez<\/code> por tio:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio pakas la nunan distribuon kaj sendas ĝin al la Raku-ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, <code>zef install Maths::Simple<\/code> funkcias por ĉiu.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉi tiuj komandoj bezonas instalitan <code>zef<\/code>/<code>fez<\/code> kaj la reton. Por alŝuti, vi ankaŭ bezonas ekosisteman konton.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Do kunhavigita modulo iras tra tri paŝoj.<\/span> <span class=\"sg\" data-s=\"1\">Unue, vi donas al ĝi la norman aranĝon kaj <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste, vi testas ĝin per <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi publikigas ĝin per <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Post tio, ĝi estas nur unu plia nomo.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu povas instali ĝin per <code>zef install<\/code>.<\/span><\/p>"]]},"la":{"t":"zef et oecosystema","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> modulos Raku installat.<\/span> <span class=\"sg\" data-s=\"1\">Iam eo modulos nominibus suis installavisti.<\/span> <span class=\"sg\" data-s=\"2\">Etiam cum distributione in directorio locali operatur.<\/span> <span class=\"sg\" data-s=\"3\">Intra in directorium distributionis.<\/span> <span class=\"sg\" data-s=\"4\">Inde eam directe probare et installare potes:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> archiva sub <code>t/<\/code> exsequitur.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> distributionem in Raku tuum installat.<\/span> <span class=\"sg\" data-s=\"2\">Tum alia programmata eam per <code>use<\/code> adhibere possunt.<\/span> <span class=\"sg\" data-s=\"3\">Etiam nomine installare potes, exempli gratia <code>zef install Cro<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Hoc idem facit.<\/span> <span class=\"sg\" data-s=\"5\">Sed prius distributionem ex systemate deponit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fortasse distributionem tuam <strong>publicare<\/strong> vis.<\/span> <span class=\"sg\" data-s=\"1\">Tum alii eam nomine installare possunt.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc eam in systema imponis.<\/span> <span class=\"sg\" data-s=\"3\">Homines plerumque <code>fez<\/code> ad hoc adhibent:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc distributionem praesentem componit et in systema Raku mittit.<\/span> <span class=\"sg\" data-s=\"1\">Postea <code>zef install Maths::Simple<\/code> pro omnibus operatur.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Haec mandata <code>zef<\/code>/<code>fez<\/code> installata et retia requirunt. Ad imponendum etiam rationem in systemate requiris.<\/span><\/blockquote>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Itaque modulus communicatus tres gradus habet.<\/span> <span class=\"sg\" data-s=\"1\">Primum ei dispositionem normalem et <code>META6.json<\/code> das.<\/span> <span class=\"sg\" data-s=\"2\">Deinde eum per <code>zef test<\/code> probas.<\/span> <span class=\"sg\" data-s=\"3\">Tum eum per <code>fez upload<\/code> publicas.<\/span> <span class=\"sg\" data-s=\"4\">Postea solum unum aliud nomen est.<\/span> <span class=\"sg\" data-s=\"5\">Quisque eum per <code>zef install<\/code> installare potest.<\/span><\/p>"]]}}}</script>
