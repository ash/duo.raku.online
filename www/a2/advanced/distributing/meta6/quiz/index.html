ode> noemt de andere distributies die de distributie nodig heeft.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Distribuciones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un archivo tiene el nombre y la versión de una distribución de Raku.<\/span> <span class=\"sg\" data-s=\"1\">También dice qué ofrece la distribución.<\/span> <span class=\"sg\" data-s=\"2\">¿Cuál es ese archivo?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El archivo <code>META6.json<\/code> describe una distribución.<\/span> <span class=\"sg\" data-s=\"1\">Es un archivo JSON en el directorio principal.<\/span> <span class=\"sg\" data-s=\"2\">Su clave <code>provides<\/code> conecta cada nombre de módulo con su archivo fuente.<\/span> <span class=\"sg\" data-s=\"3\">La clave <code>depends<\/code> lista las otras distribuciones que la distribución necesita.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Distribuzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un file contiene il nome e la versione di una distribuzione Raku.<\/span> <span class=\"sg\" data-s=\"1\">Dice anche cosa fornisce la distribuzione.<\/span> <span class=\"sg\" data-s=\"2\">Qual è questo file?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il file <code>META6.json<\/code> descrive una distribuzione.<\/span> <span class=\"sg\" data-s=\"1\">È un file JSON nella directory principale.<\/span> <span class=\"sg\" data-s=\"2\">La sua chiave <code>provides<\/code> collega ogni nome di modulo al suo file sorgente.<\/span> <span class=\"sg\" data-s=\"3\">La chiave <code>depends<\/code> elenca le altre distribuzioni che servono alla distribuzione.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Distribūcijas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vienā failā ir Raku distribūcijas nosaukums un versija.<\/span> <span class=\"sg\" data-s=\"1\">Tas arī pasaka, ko distribūcija nodrošina.<\/span> <span class=\"sg\" data-s=\"2\">Kurš fails tas ir?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fails <code>META6.json<\/code> apraksta distribūciju.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir JSON fails augšējā direktorijā.<\/span> <span class=\"sg\" data-s=\"2\">Tā atslēga <code>provides<\/code> saista katru moduļa nosaukumu ar tā pirmkoda failu.<\/span> <span class=\"sg\" data-s=\"3\">Atslēga <code>depends<\/code> uzskaita citas distribūcijas, kas distribūcijai vajadzīgas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Дистрибутивы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В одном файле есть имя и версия дистрибутива Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он говорит, что дистрибутив предоставляет.<\/span> <span class=\"sg\" data-s=\"2\">Какой это файл?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файл <code>META6.json<\/code> описывает дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Это JSON-файл в корневой директории.<\/span> <span class=\"sg\" data-s=\"2\">Его ключ <code>provides<\/code> связывает имя каждого модуля с его исходным файлом.<\/span> <span class=\"sg\" data-s=\"3\">Ключ <code>depends<\/code> перечисляет другие дистрибутивы, которые нужны дистрибутиву.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Дистрибутиви","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Один файл зберігає назву й версію дистрибутива Raku.<\/span> <span class=\"sg\" data-s=\"1\">Також він каже, що дистрибутив надає.<\/span> <span class=\"sg\" data-s=\"2\">Що це за файл?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файл <code>META6.json<\/code> описує дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Це файл JSON у верхньому каталозі.<\/span> <span class=\"sg\" data-s=\"2\">Його ключ <code>provides<\/code> пов'язує ім'я кожного модуля з його файлом вихідного коду.<\/span> <span class=\"sg\" data-s=\"3\">Ключ <code>depends<\/code> перелічує інші дистрибутиви, які потрібні дистрибутиву.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Дистрибуции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В един файл са името и версията на дистрибуция на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Той казва също какво предоставя дистрибуцията.<\/span> <span class=\"sg\" data-s=\"2\">Кой е този файл?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файлът <code>META6.json<\/code> описва дистрибуцията.<\/span> <span class=\"sg\" data-s=\"1\">Това е JSON файл в главната директория.<\/span> <span class=\"sg\" data-s=\"2\">Ключът му <code>provides<\/code> свързва всяко име на модул с неговия изходен файл.<\/span> <span class=\"sg\" data-s=\"3\">Ключът <code>depends<\/code> изброява другите дистрибуции, от които дистрибуцията има нужда.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Distribuoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu dosiero havas la nomon kaj la version de Raku-distribuo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ diras, kion la distribuo provizas.<\/span> <span class=\"sg\" data-s=\"2\">Kiu dosiero ĝi estas?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La dosiero <code>META6.json<\/code> priskribas distribuon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas JSON-dosiero en la supra dosierujo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia ŝlosilo <code>provides<\/code> ligas ĉiun modulan nomon al ĝia fontdosiero.<\/span> <span class=\"sg\" data-s=\"3\">La ŝlosilo <code>depends<\/code> listigas la aliajn distribuojn, kiujn la distribuo bezonas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Distributiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Archivum nomen et versionem distributionis Raku habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam dicit quid distributio praebeat.<\/span> <span class=\"sg\" data-s=\"2\">Quod archivum est?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\"><code>README.md<\/code><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\"><code>META6.json<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>Makefile<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>distribution.cfg<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Archivum <code>META6.json<\/code> distributionem describit.<\/span> <span class=\"sg\" data-s=\"1\">Est archivum JSON in summo directorio.<\/span> <span class=\"sg\" data-s=\"2\">Clavis eius <code>provides<\/code> quodque nomen moduli cum archivo fontis eius coniungit.<\/span> <span class=\"sg\" data-s=\"3\">Clavis <code>depends<\/code> alias distributiones enumerat quas distributio requirit.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
