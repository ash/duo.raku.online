<script type="application/json" id="page-data">{"u":"advanced/distributing/meta6","n":736,"k":"topic","pv":"advanced/distributing","nx":"advanced/distributing/meta6/quiz","tr":["advanced","advanced/distributing"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The META6 file","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">One file describes a distribution.<\/span> <span class=\"sg\" data-s=\"1\">Its name is <code>META6.json<\/code>, and it is in the top directory.<\/span> <span class=\"sg\" data-s=\"2\">It is a simple JSON file.<\/span> <span class=\"sg\" data-s=\"3\">It tells the tools the name and the version of the distribution.<\/span> <span class=\"sg\" data-s=\"4\">It also tells what the distribution provides and what it depends on:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The two most important keys are <code>provides<\/code> and <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> links each module name to its file.<\/span> <span class=\"sg\" data-s=\"2\">The code of the module is in this file.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> lists the other distributions that this one needs.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The file is in the top directory.<\/span> <span class=\"sg\" data-s=\"1\">Here is the standard layout:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">The code of the module is under <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The directory path matches the parts of the name.<\/span> <span class=\"sg\" data-s=\"2\">In the name, <code>::<\/code> separates the parts.<\/span> <span class=\"sg\" data-s=\"3\">For example, the module <code>Maths::Simple<\/code> is in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">The tests are under <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">You need this structure and a correct <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Then the tools can build, test and install the distribution.<\/span><\/p>"]]},"de":{"t":"Die META6-Datei","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Datei beschreibt eine Distribution.<\/span> <span class=\"sg\" data-s=\"1\">Sie heißt <code>META6.json<\/code> und ist im obersten Verzeichnis.<\/span> <span class=\"sg\" data-s=\"2\">Sie ist eine einfache JSON-Datei.<\/span> <span class=\"sg\" data-s=\"3\">Sie sagt den Werkzeugen den Namen und die Version der Distribution.<\/span> <span class=\"sg\" data-s=\"4\">Sie sagt auch, was die Distribution liefert und wovon sie abhängt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die zwei wichtigsten Schlüssel sind <code>provides<\/code> und <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> verbindet jeden Modulnamen mit seiner Datei.<\/span> <span class=\"sg\" data-s=\"2\">In dieser Datei ist der Code des Moduls.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> listet die anderen Distributionen auf, die diese braucht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Datei ist im obersten Verzeichnis.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist das Standard-Layout:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Der Code des Moduls ist unter <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Verzeichnispfad passt zu den Teilen des Namens.<\/span> <span class=\"sg\" data-s=\"2\">Im Namen trennt <code>::<\/code> die Teile.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel ist das Modul <code>Maths::Simple<\/code> in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Die Tests sind unter <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Du brauchst diese Struktur und eine korrekte <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Dann können die Werkzeuge die Distribution bauen, testen und installieren.<\/span><\/p>"]]},"nl":{"t":"Het META6-bestand","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eén bestand beschrijft een distributie.<\/span> <span class=\"sg\" data-s=\"1\">Het heet <code>META6.json<\/code> en het staat in de hoofdmap.<\/span> <span class=\"sg\" data-s=\"2\">Het is een eenvoudig JSON-bestand.<\/span> <span class=\"sg\" data-s=\"3\">Het vertelt de gereedschappen de naam en de versie van de distributie.<\/span> <span class=\"sg\" data-s=\"4\">Het vertelt ook wat de distributie levert en waar ze van afhangt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De twee belangrijkste sleutels zijn <code>provides<\/code> en <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> koppelt elke modulenaam aan zijn bestand.<\/span> <span class=\"sg\" data-s=\"2\">De code van de module staat in dit bestand.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> noemt de andere distributies die deze distributie nodig heeft.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het bestand staat in de hoofdmap.<\/span> <span class=\"sg\" data-s=\"1\">Hier is de standaardindeling:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">De code van de module staat onder <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het pad van de map komt overeen met de delen van de naam.<\/span> <span class=\"sg\" data-s=\"2\">In de naam scheidt <code>::<\/code> de delen.<\/span> <span class=\"sg\" data-s=\"3\">De module <code>Maths::Simple<\/code> staat bijvoorbeeld in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">De tests staan onder <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Je hebt deze structuur en een correct <code>META6.json<\/code> nodig.<\/span> <span class=\"sg\" data-s=\"6\">Dan kunnen de gereedschappen de distributie bouwen, testen en installeren.<\/span><\/p>"]]},"es":{"t":"El archivo META6","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un archivo describe una distribución.<\/span> <span class=\"sg\" data-s=\"1\">Se llama <code>META6.json<\/code> y está en el directorio principal.<\/span> <span class=\"sg\" data-s=\"2\">Es un archivo JSON sencillo.<\/span> <span class=\"sg\" data-s=\"3\">Dice a las herramientas el nombre y la versión de la distribución.<\/span> <span class=\"sg\" data-s=\"4\">También dice qué ofrece la distribución y de qué depende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Las dos claves más importantes son <code>provides<\/code> y <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> conecta cada nombre de módulo con su archivo.<\/span> <span class=\"sg\" data-s=\"2\">El código del módulo está en este archivo.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> lista las otras distribuciones que esta necesita.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El archivo está en el directorio principal.<\/span> <span class=\"sg\" data-s=\"1\">Esta es la estructura estándar:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">El código del módulo está en <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ruta de directorios coincide con las partes del nombre.<\/span> <span class=\"sg\" data-s=\"2\">En el nombre, <code>::<\/code> separa las partes.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, el módulo <code>Maths::Simple<\/code> está en <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Las pruebas están en <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Necesitas esta estructura y un <code>META6.json<\/code> correcto.<\/span> <span class=\"sg\" data-s=\"6\">Entonces las herramientas pueden construir, probar e instalar la distribución.<\/span><\/p>"]]},"it":{"t":"Il file META6","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un solo file descrive una distribuzione.<\/span> <span class=\"sg\" data-s=\"1\">Il suo nome è <code>META6.json<\/code>, e sta nella directory principale.<\/span> <span class=\"sg\" data-s=\"2\">È un semplice file JSON.<\/span> <span class=\"sg\" data-s=\"3\">Dice agli strumenti il nome e la versione della distribuzione.<\/span> <span class=\"sg\" data-s=\"4\">Dice anche cosa fornisce la distribuzione e da cosa dipende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Le due chiavi più importanti sono <code>provides<\/code> e <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> collega ogni nome di modulo al suo file.<\/span> <span class=\"sg\" data-s=\"2\">Il codice del modulo è in questo file.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> elenca le altre distribuzioni che servono a questa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il file sta nella directory principale.<\/span> <span class=\"sg\" data-s=\"1\">Ecco la struttura standard:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il codice del modulo è sotto <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il percorso delle directory corrisponde alle parti del nome.<\/span> <span class=\"sg\" data-s=\"2\">Nel nome, <code>::<\/code> separa le parti.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, il modulo <code>Maths::Simple<\/code> è in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">I test sono sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ti servono questa struttura e un <code>META6.json<\/code> corretto.<\/span> <span class=\"sg\" data-s=\"6\">Allora gli strumenti possono compilare, testare e installare la distribuzione.<\/span><\/p>"]]},"lv":{"t":"META6 fails","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Distribūciju apraksta viens fails.<\/span> <span class=\"sg\" data-s=\"1\">Tā nosaukums ir <code>META6.json<\/code>, un tas atrodas augšējā direktorijā.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir vienkāršs JSON fails.<\/span> <span class=\"sg\" data-s=\"3\">Tas pasaka rīkiem distribūcijas nosaukumu un versiju.<\/span> <span class=\"sg\" data-s=\"4\">Tas arī pasaka, ko distribūcija nodrošina un no kā tā ir atkarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Divas svarīgākās atslēgas ir <code>provides<\/code> un <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> saista katru moduļa nosaukumu ar tā failu.<\/span> <span class=\"sg\" data-s=\"2\">Šajā failā ir moduļa kods.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> uzskaita citas distribūcijas, kas šai distribūcijai vajadzīgas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fails atrodas augšējā direktorijā.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir standarta izkārtojums:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Moduļa kods atrodas zem <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Direktoriju ceļš atbilst nosaukuma daļām.<\/span> <span class=\"sg\" data-s=\"2\">Nosaukumā <code>::<\/code> atdala daļas.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, modulis <code>Maths::Simple<\/code> atrodas failā <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Testi atrodas zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Jums vajag šo struktūru un pareizu <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tad rīki var distribūciju būvēt, testēt un instalēt.<\/span><\/p>"]]},"ru":{"t":"Файл META6","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Один файл описывает дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Он называется <code>META6.json<\/code> и лежит в корневой директории.<\/span> <span class=\"sg\" data-s=\"2\">Это простой JSON-файл.<\/span> <span class=\"sg\" data-s=\"3\">Он сообщает инструментам имя и версию дистрибутива.<\/span> <span class=\"sg\" data-s=\"4\">Ещё он говорит, что дистрибутив предоставляет и от чего он зависит:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Два самых важных ключа — <code>provides<\/code> и <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> связывает имя каждого модуля с его файлом.<\/span> <span class=\"sg\" data-s=\"2\">Код модуля лежит в этом файле.<\/span> <span class=\"sg\" data-s=\"3\"><code>depends<\/code> перечисляет другие дистрибутивы, которые нужны этому.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Файл лежит в корневой директории.<\/span> <span class=\"sg\" data-s=\"1\">Вот стандартная структура:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Код модуля лежит в <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Путь из каталогов совпадает с частями имени.<\/span> <span class=\"sg\" data-s=\"2\">В имени <code>::<\/code> разделяет части.<\/span> <span class=\"sg\" data-s=\"3\">Например, модуль <code>Maths::Simple<\/code> лежит в <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тесты лежат в <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вам нужны эта структура и правильный <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тогда инструменты могут собрать, протестировать и установить дистрибутив.<\/span><\/p>"]]},"uk":{"t":"Файл META6","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Один файл описує дистрибутив.<\/span> <span class=\"sg\" data-s=\"1\">Його назва — <code>META6.json<\/code>, і він лежить у верхньому каталозі.<\/span> <span class=\"sg\" data-s=\"2\">Це простий файл JSON.<\/span> <span class=\"sg\" data-s=\"3\">Він каже інструментам назву й версію дистрибутива.<\/span> <span class=\"sg\" data-s=\"4\">Також він каже, що дистрибутив надає і від чого він залежить:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Два найважливіші ключі — це <code>provides<\/code> і <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> пов'язує ім'я кожного модуля з його файлом.<\/span> <span class=\"sg\" data-s=\"2\">Код модуля лежить у цьому файлі.<\/span> <span class=\"s
