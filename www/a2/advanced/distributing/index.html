<script type="application/json" id="page-data">{"u":"advanced/distributing","n":735,"k":"section","pv":"advanced/packages/exercises/nested-name/solution","nx":"advanced/distributing/meta6","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Distributing modules","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Your module may be useful on other computers too.<\/span> <span class=\"sg\" data-s=\"1\">Then you can make it into a <em>distribution<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You can share it in the Raku module ecosystem.<\/span> <span class=\"sg\" data-s=\"3\">The ecosystem is the collection of shared Raku modules.<\/span> <span class=\"sg\" data-s=\"4\">Then anyone can install your module with <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">This section shows two things that you need for this.<\/span> <span class=\"sg\" data-s=\"1\">The first is the file <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It describes a distribution.<\/span> <span class=\"sg\" data-s=\"3\">The second is the tools <code>zef<\/code> and <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">They install and publish distributions.<\/span> <span class=\"sg\" data-s=\"5\">These steps are about the ecosystem and the network.<\/span> <span class=\"sg\" data-s=\"6\">They are not about the language.<\/span> <span class=\"sg\" data-s=\"7\">So the examples here show files and commands.<\/span> <span class=\"sg\" data-s=\"8\">They do not show the output of programs.<\/span><\/p>"]]},"de":{"t":"Module verteilen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Dein Modul ist vielleicht auch auf anderen Computern nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du eine <em>Distribution<\/em> daraus machen.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst sie im Raku-Modul-Ökosystem teilen.<\/span> <span class=\"sg\" data-s=\"3\">Das Ökosystem ist die Sammlung der geteilten Raku-Module.<\/span> <span class=\"sg\" data-s=\"4\">Dann kann jeder dein Modul mit <code>zef<\/code> installieren.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt zwei Dinge, die du dafür brauchst.<\/span> <span class=\"sg\" data-s=\"1\">Das Erste ist die Datei <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie beschreibt eine Distribution.<\/span> <span class=\"sg\" data-s=\"3\">Das Zweite sind die Werkzeuge <code>zef<\/code> und <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sie installieren und veröffentlichen Distributionen.<\/span> <span class=\"sg\" data-s=\"5\">Bei diesen Schritten geht es um das Ökosystem und das Netzwerk.<\/span> <span class=\"sg\" data-s=\"6\">Es geht nicht um die Sprache.<\/span> <span class=\"sg\" data-s=\"7\">Deshalb zeigen die Beispiele hier Dateien und Befehle.<\/span> <span class=\"sg\" data-s=\"8\">Sie zeigen keine Ausgabe von Programmen.<\/span><\/p>"]]},"nl":{"t":"Modules distribueren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je module is misschien ook nuttig op andere computers.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je er een <em>distributie<\/em> van maken.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt die delen in het ecosysteem van Raku-modules.<\/span> <span class=\"sg\" data-s=\"3\">Het ecosysteem is de verzameling van gedeelde Raku-modules.<\/span> <span class=\"sg\" data-s=\"4\">Dan kan iedereen je module installeren met <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel laat twee dingen zien die je hiervoor nodig hebt.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is het bestand <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het beschrijft een distributie.<\/span> <span class=\"sg\" data-s=\"3\">Het tweede zijn de gereedschappen <code>zef<\/code> en <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ze installeren en publiceren distributies.<\/span> <span class=\"sg\" data-s=\"5\">Deze stappen gaan over het ecosysteem en het netwerk.<\/span> <span class=\"sg\" data-s=\"6\">Ze gaan niet over de taal.<\/span> <span class=\"sg\" data-s=\"7\">Dus tonen de voorbeelden hier bestanden en commando's.<\/span> <span class=\"sg\" data-s=\"8\">Ze tonen niet de uitvoer van programma's.<\/span><\/p>"]]},"es":{"t":"Distribución de módulos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tu módulo puede ser útil también en otros ordenadores.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes convertirlo en una <em>distribución<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes compartirla en el ecosistema de módulos de Raku.<\/span> <span class=\"sg\" data-s=\"3\">El ecosistema es la colección de módulos de Raku compartidos.<\/span> <span class=\"sg\" data-s=\"4\">Así cualquiera puede instalar tu módulo con <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra dos cosas que necesitas para esto.<\/span> <span class=\"sg\" data-s=\"1\">La primera es el archivo <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Describe una distribución.<\/span> <span class=\"sg\" data-s=\"3\">La segunda son las herramientas <code>zef<\/code> y <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Instalan y publican distribuciones.<\/span> <span class=\"sg\" data-s=\"5\">Estos pasos tratan del ecosistema y de la red.<\/span> <span class=\"sg\" data-s=\"6\">No tratan del lenguaje.<\/span> <span class=\"sg\" data-s=\"7\">Por eso los ejemplos de aquí muestran archivos y comandos.<\/span> <span class=\"sg\" data-s=\"8\">No muestran la salida de programas.<\/span><\/p>"]]},"it":{"t":"Distribuzione di moduli","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il tuo modulo può essere utile anche su altri computer.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi trasformarlo in una <em>distribuzione<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi condividerla nell'ecosistema dei moduli Raku.<\/span> <span class=\"sg\" data-s=\"3\">L'ecosistema è la raccolta dei moduli Raku condivisi.<\/span> <span class=\"sg\" data-s=\"4\">Così chiunque può installare il tuo modulo con <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra due cose che ti servono per questo.<\/span> <span class=\"sg\" data-s=\"1\">La prima è il file <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Descrive una distribuzione.<\/span> <span class=\"sg\" data-s=\"3\">La seconda cosa sono gli strumenti <code>zef<\/code> e <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Installano e pubblicano le distribuzioni.<\/span> <span class=\"sg\" data-s=\"5\">Questi passaggi riguardano l'ecosistema e la rete.<\/span> <span class=\"sg\" data-s=\"6\">Non riguardano il linguaggio.<\/span> <span class=\"sg\" data-s=\"7\">Quindi gli esempi qui mostrano file e comandi.<\/span> <span class=\"sg\" data-s=\"8\">Non mostrano l'output dei programmi.<\/span><\/p>"]]},"lv":{"t":"Moduļu izplatīšana 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūsu modulis var noderēt arī citos datoros.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat no tā izveidot <em>distribūciju<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat to kopīgot Raku moduļu ekosistēmā.<\/span> <span class=\"sg\" data-s=\"3\">Ekosistēma ir kopīgoto Raku moduļu kolekcija.<\/span> <span class=\"sg\" data-s=\"4\">Tad ikviens var instalēt jūsu moduli ar <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda divas lietas, kas jums tam vajadzīgas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā lieta ir fails <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas apraksta distribūciju.<\/span> <span class=\"sg\" data-s=\"3\">Otrā lieta ir rīki <code>zef<\/code> un <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tie instalē un publicē distribūcijas.<\/span> <span class=\"sg\" data-s=\"5\">Šie soļi ir saistīti ar ekosistēmu un tīklu.<\/span> <span class=\"sg\" data-s=\"6\">Tie nav saistīti ar valodu.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc piemēri šeit rāda failus un komandas.<\/span> <span class=\"sg\" data-s=\"8\">Tie nerāda programmu izvadi.<\/span><\/p>"]]},"ru":{"t":"Распространение модулей","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ваш модуль может быть полезен и на других компьютерах.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы можете сделать из него <em>дистрибутив<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете поделиться им в экосистеме модулей Raku.<\/span> <span class=\"sg\" data-s=\"3\">Экосистема — это общая коллекция модулей Raku.<\/span> <span class=\"sg\" data-s=\"4\">Тогда любой может установить ваш модуль с помощью <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Этот раздел показывает две вещи, которые для этого нужны.<\/span> <span class=\"sg\" data-s=\"1\">Первая — это файл <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он описывает дистрибутив.<\/span> <span class=\"sg\" data-s=\"3\">Вторая — это инструменты <code>zef<\/code> и <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Они устанавливают и публикуют дистрибутивы.<\/span> <span class=\"sg\" data-s=\"5\">Эти шаги связаны с экосистемой и сетью.<\/span> <span class=\"sg\" data-s=\"6\">Они не связаны с самим языком.<\/span> <span class=\"sg\" data-s=\"7\">Поэтому примеры здесь показывают файлы и команды.<\/span> <span class=\"sg\" data-s=\"8\">Они не показывают вывод программ.<\/span><\/p>"]]},"uk":{"t":"Розповсюдження модулів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ваш модуль може бути корисним і на інших комп'ютерах.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви можете зробити з нього <em>дистрибутив<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете поділитися ним в екосистемі модулів Raku.<\/span> <span class=\"sg\" data-s=\"3\">Екосистема — це збірка спільних модулів Raku.<\/span> <span class=\"sg\" data-s=\"4\">Тоді будь-хто може встановити ваш модуль через <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує дві речі, які для цього потрібні.<\/span> <span class=\"sg\" data-s=\"1\">Перша — це файл <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він описує дистрибутив.<\/span> <span class=\"sg\" data-s=\"3\">Друга — це інструменти <code>zef<\/code> і <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вони встановлюють і публікують дистрибутиви.<\/span> <span class=\"sg\" data-s=\"5\">Ці кроки стосуються екосистеми й мережі.<\/span> <span class=\"sg\" data-s=\"6\">Вони не стосуються самої мови.<\/span> <span class=\"sg\" data-s=\"7\">Тому приклади тут показують файли й команди.<\/span> <span class=\"sg\" data-s=\"8\">Вони не показують вивід програм.<\/span><\/p>"]]},"bg":{"t":"Разпространение на модули 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вашият модул може да е полезен и на други компютри.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да го превърнете в <em>дистрибуция<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да я споделите в екосистемата за модули на Raku.<\/span> <span class=\"sg\" data-s=\"3\">Екосистемата е колекцията от споделени модули на Raku.<\/span> <span class=\"sg\" data-s=\"4\">Тогава всеки може да инсталира вашия модул със <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Този раздел показва две неща, които ви трябват за това.<\/span> <span class=\"sg\" data-s=\"1\">Първото е файлът <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той описва дистрибуция.<\/span> <span class=\"sg\" data-s=\"3\">Второто са инструментите <code>zef<\/code> и <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Те инсталират и публикуват дистрибуции.<\/span> <span class=\"sg\" data-s=\"5\">Тези стъпки са свързани с екосистемата и мрежата.<\/span> <span class=\"sg\" data-s=\"6\">Те не са свързани с езика.<\/span> <span class=\"sg\" data-s=\"7\">Затова примерите тук показват файлове и команди.<\/span> <span class=\"sg\" data-s=\"8\">Те не показват изход от програми.<\/span><\/p>"]]},"eo":{"t":"Distribui modulojn","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Via modulo eble estas utila ankaŭ en aliaj komputiloj.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas fari el ĝi <em>distribuon<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas kunhavigi ĝin en la modula ekosistemo de Raku.<\/span> <span class=\"sg\" data-s=\"3\">La ekosistemo estas la kolekto de kunhavigitaj Raku-moduloj.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĉiu povas instali vian modulon per <code>zef<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras du aferojn, kiujn vi bezonas por tio.<\/span> <span class=\"sg\" data-s=\"1\">La unua afero estas la dosiero <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi priskribas distribuon.<\/span> <span class=\"sg\" data-s=\"3\">La dua afero estas la iloj <code>zef<\/code> kaj <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ili instalas kaj publikigas distribuojn.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiuj paŝoj temas pri la ekosistemo kaj la reto.<\/span> <span class=\"sg\" data-s=\"6\">Ili ne temas pri la lingvo.<\/span> <span class=\"sg\" data-s=\"7\">Do la ekzemploj ĉi tie montras dosierojn kaj komandojn.<\/span> <span class=\"sg\" data-s=\"8\">Ili ne montras la eligon de programoj.<\/span><\/p>"]]},"la":{"t":"Modulos distribuere","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Modulus tuus fortasse etiam in aliis computatris utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Tum eum in <em>distributionem<\/em> vertere potes.<\/span> <span class=\"sg\" data-s=\"2\">Eam in systemate modulorum Raku communicare potes.<\/span> <span class=\"sg\" data-s=\"3\">Systema est collectio modulorum Raku communium.<\/span> <span class=\"sg\" data-s=\"4\">Tum quisque modulum tuum per <code>zef<\/code> installare potest.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Haec sectio duas res ostendit quas ad hoc requiris.<\/span> <span class=\"sg\" data-s=\"1\">Prima est archivum <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Id distributionem describit.<\/span> <span class=\"sg\" data-s=\"3\">Secunda sunt instrumenta <code>zef<\/code> et <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ea distributiones installant et publicant.<\/span> <span class=\"sg\" data-s=\"5\">Hi gradus ad systema et ad retia pertinent.<\/span> <span class=\"sg\" data-s=\"6\">Ad linguam ipsam non pertinent.<\/span> <span class=\"sg\" data-s=\"7\">Itaque exempla hic archiva et mandata ostendunt.<\/span> <span class=\"sg\" data-s=\"8\">Exitum programmatum non ostendunt.<\/span><\/p>"]]}}}</script>
