<script type="application/json" id="page-data">{"u":"advanced/distributing/fez","n":739,"k":"topic","pv":"advanced/distributing/zef-ecosystem","nx":"advanced/distributing/exercises","tr":["advanced","advanced/distributing"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Publishing with fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">The last topic showed <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">With <code>fez<\/code>, you upload a distribution to the Raku ecosystem.<\/span> <span class=\"sg\" data-s=\"2\">You do not have to use <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">There are other ways to publish.<\/span> <span class=\"sg\" data-s=\"4\">But most people use <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">And it does more than upload.<\/span> <span class=\"sg\" data-s=\"6\">It can also create a new distribution for you.<\/span> <span class=\"sg\" data-s=\"7\">It can take care of your author account too.<\/span> <span class=\"sg\" data-s=\"8\">Install <code>fez<\/code> with <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creating a new distribution<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can make the <code>META6.json<\/code> and the directories <code>lib/<\/code> and <code>t/<\/code> yourself.<\/span> <span class=\"sg\" data-s=\"1\">But <code>fez<\/code> can make them for you:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> creates the start of a new distribution.<\/span> <span class=\"sg\" data-s=\"1\">This is a project directory.<\/span> <span class=\"sg\" data-s=\"2\">It already has a <code>META6.json<\/code> and the standard layout.<\/span> <span class=\"sg\" data-s=\"3\">So you can start writing at once.<\/span> <span class=\"sg\" data-s=\"4\">The code goes under <code>lib/<\/cod en.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>fez<\/code> kann sie auch für dich machen:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> erstellt den Anfang einer neuen Distribution.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein Projektverzeichnis.<\/span> <span class=\"sg\" data-s=\"2\">Es hat schon eine <code>META6.json<\/code> und das Standard-Layout.<\/span> <span class=\"sg\" data-s=\"3\">So kannst du sofort mit dem Schreiben anfangen.<\/span> <span class=\"sg\" data-s=\"4\">Der Code kommt unter <code>lib/<\/code>, und die Tests kommen unter <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Du musst die <code>META6.json<\/code> nicht selbst vorbereiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrieren und Anmelden<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Zum Veröffentlichen brauchst du ein Konto im Ökosystem.<\/span> <span class=\"sg\" data-s=\"1\">Du erstellst das Konto nur einmal, mit <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es fragt nach einem Benutzernamen, einer E-Mail und einem Passwort.<\/span> <span class=\"sg\" data-s=\"3\">Dann meldest du dich mit <code>fez login<\/code> an.<\/span> <span class=\"sg\" data-s=\"4\">Es speichert deinen Schlüssel.<\/span> <span class=\"sg\" data-s=\"5\">Mit diesem Schlüssel wissen die nächsten Befehle, wer du bist:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dein Benutzername ist wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>META6.json<\/code> einer Distribution muss ein Feld <code>auth<\/code> haben.<\/span> <span class=\"sg\" data-s=\"2\">Sein Wert ist <code>zef:&lt;benutzername&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So weiß das Ökosystem, dass der Upload wirklich von dir ist.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hochladen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast ein Konto, und die Distribution ist fertig.<\/span> <span class=\"sg\" data-s=\"1\">Jetzt packt <code>fez upload<\/code> das aktuelle Verzeichnis und schickt es ab:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Danach kann jeder sie über ihren Namen mit <code>zef install My::Greeting<\/code> installieren.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst jede Version nur einmal hochladen.<\/span> <span class=\"sg\" data-s=\"2\">Mach deshalb vor einem Update die <code>version<\/code> in <code>META6.json<\/code> höher.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr nützliche Befehle<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du brauchst auch diese <code>fez<\/code>-Befehle:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — suche vor dem Hochladen nach möglichen Problemen in einer Distribution;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — zeige die Distributionen, die du schon veröffentlicht hast;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — mache <code>META6.json<\/code> neu aus den Dateien, die jetzt auf der Festplatte sind.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">All diese Befehle brauchen ein installiertes <code>fez<\/code> und das Netzwerk. Alles nach <code>init<\/code> braucht auch ein Ökosystem-Konto.<\/span><\/blockquote>"]]},"nl":{"t":"Publiceren met fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Het vorige onderwerp liet <code>fez<\/code> zien.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>fez<\/code> upload je een distributie naar het Raku-ecosysteem.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft <code>fez<\/code> niet te gebruiken.<\/span> <span class=\"sg\" data-s=\"3\">Er zijn ook andere manieren om te publiceren.<\/span> <span class=  bewaart je sleutel.<\/span> <span class=\"sg\" data-s=\"5\">Met deze sleutel weten de volgende commando's wie je bent:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je gebruikersnaam is belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Het <code>META6.json<\/code> van een distributie moet een veld <code>auth<\/code> hebben.<\/span> <span class=\"sg\" data-s=\"2\">De waarde is <code>zef:&lt;gebruikersnaam&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Zo weet het ecosysteem dat de upload echt van jou is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uploaden<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt een account, en de distributie is klaar.<\/span> <span class=\"sg\" data-s=\"1\">Nu pakt <code>fez upload<\/code> de huidige map in en verstuurt die:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Daarna kan iedereen ze op naam installeren met <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt elke versie maar één keer uploaden.<\/span> <span class=\"sg\" data-s=\"2\">Maak dus vóór een update de <code>version<\/code> in <code>META6.json<\/code> hoger.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer nuttige commando's<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je gebruikt ook deze <code>fez<\/code>-commando's:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — zoek naar mogelijke problemen in een distributie, vóór de upload;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — toon de distributies die je al hebt gepubliceerd;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — maak <code>META6.json<\/code> opnieuw uit de bestanden die nu op de schijf staan.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Al deze commando's hebben een geïnstalleerde <code>fez<\/code> en het netwerk nodig. Alles na <code>init<\/code> heeft ook een ecosysteemaccount nodig.<\/span><\/blockquote>"]]},"es":{"t":"Publicar con fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">El tema anterior mostró <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>fez<\/code>, subes una distribución al ecosistema de Raku.<\/span> <span class=\"sg\" data-s=\"2\">No tienes que usar <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hay otras formas de publicar.<\/span> <span class=\"sg\" data-s=\"4\">Pero la mayoría de la gente usa <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Y hace más que subir.<\/span> <span class=\"sg\" data-s=\"6\">También puede crear una nueva distribución para ti.<\/span> <span class=\"sg\" data-s=\"7\">Puede ocuparse además de tu cuenta de autor.<\/span> <span class=\"sg\" data-s=\"8\">Instala <code>fez<\/code> con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Crear una nueva distribución<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes hacer tú mismo el <code>META6.json<\/code> y los directorios <code>lib/<\/code> y <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>fez<\/code> puede hacerlos por ti:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> crea el comienzo de una nueva distribución.<\/span> <span class=\"sg\" data-s=\"1\">Es un directorio de proyecto.<\/span> <span class=\"sg\" data-s=\"2\">Ya tiene un <code>META6.json<\/code> y la estructura estándar.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes empezar a escribir enseguida.<\/span> <span class=\"sg\" data-s=\"4\">El código va en <code>lib/<\/code> y las pruebas van en <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">No necesitas preparar tú mismo el <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registro e inicio de sesión<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Para publicar, necesitas una cuenta en el ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Creas la cuenta solo una vez, con <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Te pide un nombre de usuario, un correo electrónico y una contraseña.<\/span> <span class=\"sg\" data-s=\"3\">Después inicias sesión con <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Este comando guarda tu clave.<\/span> <span class=\"sg\" data-s=\"5\">Con esta clave, los siguientes comandos saben quién eres:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tu nombre de usuario es importante.<\/span> <span class=\"sg\" data-s=\"1\">El <code>META6.json<\/code> de una distribución debe tener un campo <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Su valor es <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Así el ecosistema sabe que la subida es de verdad tuya.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subida<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tienes una cuenta y la distribución está lista.<\/span> <span class=\"sg\" data-s=\"1\">Ahora <code>fez upload<\/code> empaqueta el directorio actual y lo envía:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Después, cualquiera puede instalarla por su nombre con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes subir cada versión solo una vez.<\/span> <span class=\"sg\" data-s=\"2\">Así que, antes de una actualización, aumenta la <code>version<\/code> en <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más comandos útiles<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También vas a usar estos comandos de <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — buscar posibles problemas en una distribución antes de subirla;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostrar las distribuciones que ya has publicado;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — hacer de nuevo <code>META6.json<\/code> a partir de los archivos que están ahora en el disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Todos estos comandos necesitan <code>fez<\/code> instalado y acceso a la red. Todo lo que viene después de <code>init<\/code> también necesita una cuenta en el ecosistema.<\/span><\/blockquote>"]]},"it":{"t":"Pubblicare con fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">L'argomento precedente ha mostrato <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con <code>fez<\/code> carichi una distribuzione nell'ecosistema Raku.<\/span> <span class=\"sg\" data-s=\"2\">Non devi per forza usare <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ci sono altri modi per pubblicare.<\/span> <span class=\"sg\" data-s=\"4\">Ma quasi tutti usano <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">E <code>fez<\/code> fa più che caricare.<\/span> <span class=\"sg\" data-s=\"6\">Può anche creare per te una nuova distribuzione.<\/span> <span class=\"sg\" data-s=\"7\">Può gestire anche il tuo account di autore.<\/span> <span class=\"sg\" data-s=\"8\">Installa <code>fez<\/code> con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare una nuova distribuzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi creare da solo il <code>META6.json<\/code> e le directory <code>lib/<\/code> e <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>fez<\/code> può crearli per te:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> crea la base di una nuova distribuzione.<\/span> <span class=\"sg\" data-s=\"1\">È una directory di progetto.<\/span> <span class=\"sg\" data-s=\"2\">Ha già un <code>META6.json<\/code> e la struttura standard.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi iniziare subito a scrivere.<\/span> <span class=\"sg\" data-s=\"4\">Il codice va sotto <code>lib/<\/code>, e i test vanno sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Non devi preparare tu il <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrazione e accesso<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Per pubblicare, ti serve un account nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Crei l'account una sola volta, con <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ti chiede un nome utente, un'email e una password.<\/span> <span class=\"sg\" data-s=\"3\">Poi accedi con <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Questo comando salva la tua chiave.<\/span> <span class=\"sg\" data-s=\"5\">Con questa chiave, i comandi successivi sanno chi sei:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il tuo nome utente è importante.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>META6.json<\/code> di una distribuzione deve avere un campo <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il suo valore è <code>zef:&lt;nomeutente&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Così l'ecosistema sa che il caricamento è davvero tuo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caricamento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai un account, e la distribuzione è pronta.<\/span> <span class=\"sg\" data-s=\"1\">Ora <code>fez upload<\/code> fa un pacchetto con la directory corrente e lo invia:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dopo, chiunque può installarla per nome con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi caricare ogni versione solo una volta.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, prima di un aggiornamento, alza la <code>version<\/code> nel <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri comandi utili<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Userai anche questi comandi <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — cerca possibili problemi in una distribuzione prima del caricamento;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostra le distribuzioni che hai già pubblicato;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — crea di nuovo il <code>META6.json<\/code> dai file che sono ora sul disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Tutti questi comandi hanno bisogno di <code>fez<\/code> installato e della rete. I comandi dopo <code>init<\/code> hanno bisogno anche di un account nell'ecosistema.<\/span><\/blockquote>"]]},"lv":{"t":"Publicēšana ar fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējais temats parādīja <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>fez<\/code> jūs augšupielādējat distribūciju Raku ekosistēmā.<\/span> <span class=\"sg\" data-s=\"2\">Jums nav obligāti jāizmanto <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ir arī citi veidi, kā publicēt.<\/span> <span class=\"sg\" data-s=\"4\">Bet vairums cilvēku izmanto <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Un tas dara vairāk nekā tikai augšupielādē.<\/span> <span class=\"sg\" data-s=\"6\">Tas var arī izveidot jums jaunu distribūciju.<\/span> <span class=\"sg\" data-s=\"7\">Tas var rūpēties arī par jūsu autora kontu.<\/span> <span class=\"sg\" data-s=\"8\">Instalējiet <code>fez<\/code> ar <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Jaunas distribūcijas izveide<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat pats izveidot <code>META6.json<\/code> un direktorijas <code>lib/<\/code> un <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>fez<\/code> var tos izveidot jūsu vietā:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> izveido jaunas distribūcijas sākumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir projekta direktorija.<\/span> <span class=\"sg\" data-s=\"2\">Tajā jau ir <code>META6.json<\/code> un standarta izkārtojums.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat uzreiz sākt rakstīt.<\/span> <span class=\"sg\" data-s=\"4\">Kods nonāk zem <code>lib/<\/code>, un testi nonāk zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Jums nav pašam jāgatavo <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reģistrēšanās un pieteikšanās<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Publicēšanai jums vajag kontu ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\">Kontu jūs izveidojat tikai vienreiz, ar <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas prasa lietotājvārdu, e-pastu un paroli.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs piesakāties ar <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas saglabā jūsu atslēgu.<\/span> <span class=\"sg\" data-s=\"5\">Ar šo atslēgu nākamās komandas zina, kas jūs esat:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūsu lietotājvārds ir svarīgs.<\/span> <span class=\"sg\" data-s=\"1\">Distribūcijas failā <code>META6.json<\/code> jābūt laukam <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā vērtība ir <code>zef:&lt;lietotājvārds&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šādi ekosistēma zina, ka augšupielāde tiešām ir jūsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Augšupielāde<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jums ir konts, un distribūcija ir gatava.<\/span> <span class=\"sg\" data-s=\"1\">Tagad <code>fez upload<\/code> iepako pašreizējo direktoriju un nosūta to:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc tam ikviens var to instalēt pēc nosaukuma ar <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katru versiju jūs varat augšupielādēt tikai vienreiz.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc pirms atjauninājuma palieliniet <code>version<\/code> failā <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vēl noderīgas komandas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs izmantosiet arī šīs <code>fez<\/code> komandas:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — pirms augšupielādes meklēt iespējamās problēmas distribūcijā;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — parādīt distribūcijas, kuras jūs jau esat publicējuši;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — no jauna izveidot <code>META6.json<\/code> no failiem, kas tagad ir diskā.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Visām šīm komandām vajadzīgs instalēts <code>fez<\/code> un tīkls. Visam pēc <code>init<\/code> vajadzīgs arī ekosistēmas konts.<\/span><\/blockquote>"]]},"ru":{"t":"Публикация с помощью fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">В прошлой теме вы видели <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С помощью <code>fez<\/code> вы загружаете дистрибутив в экосистему Raku.<\/span> <span class=\"sg\" data-s=\"2\">Вы не обязаны использовать <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Есть и другие способы публикации.<\/span> <span class=\"sg\" data-s=\"4\">Но большинство людей использует <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">И он умеет не только загружать.<\/span> <span class=\"sg\" data-s=\"6\">Он также может создать для вас новый дистрибутив.<\/span> <span class=\"sg\" data-s=\"7\">Ещё он помогает с вашей учётной записью автора.<\/span> <span class=\"sg\" data-s=\"8\">Установите <code>fez<\/code> с помощью <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Создание нового дистрибутива<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете сами сделать <code>META6.json<\/code> и каталоги <code>lib/<\/code> и <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>fez<\/code> может сделать их за вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> создаёт основу нового дистрибутива.<\/span> <span class=\"sg\" data-s=\"1\">Это директория проекта.<\/span> <span class=\"sg\" data-s=\"2\">В ней уже есть <code>META6.json<\/code> и стандартная структура.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому вы можете сразу начать писать.<\/span> <span class=\"sg\" data-s=\"4\">Код лежит в <code>lib/<\/code>, а тесты лежат в <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вам не нужно самим готовить <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и вход<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Чтобы публиковать, нужна учётная запись в экосистеме.<\/span> <span class=\"sg\" data-s=\"1\">Вы создаёте её только один раз, командой <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Она спрашивает имя пользователя, email и пароль.<\/span> <span class=\"sg\" data-s=\"3\">Потом вы входите командой <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Она сохраняет ваш ключ.<\/span> <span class=\"sg\" data-s=\"5\">С этим ключом следующие команды знают, кто вы:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ваше имя пользователя важно.<\/span> <span class=\"sg\" data-s=\"1\">В <code>META6.json<\/code> дистрибутива должно быть поле <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Его значение — <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Так экосистема знает, что загрузка точно ваша.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Загрузка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У вас есть учётная запись, и дистрибутив готов.<\/span> <span class=\"sg\" data-s=\"1\">Теперь <code>fez upload<\/code> упаковывает текущую директорию и отправляет её:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">После этого любой может установить его по имени командой <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете загрузить каждую версию только один раз.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому перед обновлением увеличьте <code>version<\/code> в <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ещё полезные команды<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы также будете использовать эти команды <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — искать возможные проблемы в дистрибутиве до загрузки;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показать дистрибутивы, которые вы уже опубликовали;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — снова сделать <code>META6.json<\/code> по файлам, которые сейчас лежат на диске.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Всем этим командам нужны установленный <code>fez<\/code> и сеть. Всем командам после <code>init<\/code> нужна ещё учётная запись в экосистеме.<\/span><\/blockquote>"]]},"uk":{"t":"Публікація за допомогою fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Попередня тема показала <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За допомогою <code>fez<\/code> ви завантажуєте дистрибутив в екосистему Raku.<\/span> <span class=\"sg\" data-s=\"2\">Вам не обов'язково використовувати <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Є й інші способи публікувати.<\/span> <span class=\"sg\" data-s=\"4\">Але більшість людей використовує <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">І він уміє більше, ніж просто завантажувати.<\/span> <span class=\"sg\" data-s=\"6\">Він також може створити для вас новий дистрибутив.<\/span> <span class=\"sg\" data-s=\"7\">Ще він може дбати про ваш обліковий запис автора.<\/span> <span class=\"sg\" data-s=\"8\">Встановіть <code>fez<\/code> через <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Створення нового дистрибутива<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете самі зробити <code>META6.json<\/code> і каталоги <code>lib/<\/code> та <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>fez<\/code> може зробити їх за вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> створює основу нового дистрибутива.<\/span> <span class=\"sg\" data-s=\"1\">Це каталог проєкту.<\/span> <span class=\"sg\" data-s=\"2\">У ньому вже є <code>META6.json<\/code> і стандартна структура.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете одразу почати писати.<\/span> <span class=\"sg\" data-s=\"4\">Код іде під <code>lib/<\/code>, а тести йдуть під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вам не треба самим готувати <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Реєстрація та вхід<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Щоб публікувати, вам потрібен обліковий запис в екосистемі.<\/span> <span class=\"sg\" data-s=\"1\">Ви створюєте його лише один раз, через <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він питає ім'я користувача, електронну пошту й пароль.<\/span> <span class=\"sg\" data-s=\"3\">Потім ви входите через <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він зберігає ваш ключ.<\/span> <span class=\"sg\" data-s=\"5\">З цим ключем наступні команди знають, хто ви:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ваше ім'я користувача важливе.<\/span> <span class=\"sg\" data-s=\"1\">У <code>META6.json<\/code> дистрибутива має бути поле <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Його значення — <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Так екосистема знає, що завантаження справді ваше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завантаження<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У вас є обліковий запис, і дистрибутив готовий.<\/span> <span class=\"sg\" data-s=\"1\">Тепер <code>fez upload<\/code> пакує поточний каталог і надсилає його:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Після цього будь-хто може встановити його за іменем через <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете завантажити кожну версію лише один раз.<\/span> <span class=\"sg\" data-s=\"2\">Тож перед оновленням збільште <code>version<\/code> у <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ще кілька корисних команд<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також будете використовувати ці команди <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — шукати можливі проблеми в дистрибутиві перед завантаженням;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показати дистрибутиви, які ви вже опублікували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — знову зробити <code>META6.json<\/code> з файлів, які зараз лежать на диску.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Усім цим командам потрібні встановлений <code>fez<\/code> і мережа. Для всіх команд після <code>init<\/code> ще потрібен обліковий запис в екосистемі.<\/span><\/blockquote>"]]},"bg":{"t":"Публикуване с fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Предишната тема показа <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С <code>fez<\/code> качвате дистрибуция в екосистемата на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да използвате <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Има и други начини за публикуване.<\/span> <span class=\"sg\" data-s=\"4\">Но повечето хора използват <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">И той прави повече от качване.<\/span> <span class=\"sg\" data-s=\"6\">Може също да създаде нова дистрибуция за вас.<\/span> <span class=\"sg\" data-s=\"7\">Може да се грижи и за вашия авторски акаунт.<\/span> <span class=\"sg\" data-s=\"8\">Инсталирайте <code>fez<\/code> със <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Създаване на нова дистрибуция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете сами да направите <code>META6.json<\/code> и директориите <code>lib/<\/code> и <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>fez<\/code> може да ги направи вместо вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> създава началото на нова дистрибуция.<\/span> <span class=\"sg\" data-s=\"1\">Това е директория на проект.<\/span> <span class=\"sg\" data-s=\"2\">В нея вече има <code>META6.json<\/code> и стандартното оформление.<\/span> <span class=\"sg\" data-s=\"3\">Така можете веднага да започнете да пишете.<\/span> <span class=\"sg\" data-s=\"4\">Кодът отива под <code>lib/<\/code>, а тестовете отиват под <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Не е нужно сами да подготвяте <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и влизане<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">За да публикувате, ви трябва акаунт в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">Създавате акаунта само веднъж, с <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Командата пита за потребителско име, имейл и парола.<\/span> <span class=\"sg\" data-s=\"3\">След това влизате с <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тя запазва вашия ключ.<\/span> <span class=\"sg\" data-s=\"5\">С този ключ следващите команди знаят кой сте:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Потребителското ви име е важно.<\/span> <span class=\"sg\" data-s=\"1\"><code>META6.json<\/code> на дистрибуцията трябва да има поле <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Стойността му е <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Така екосистемата знае, че качването наистина е ваше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Качване<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Имате акаунт, а дистрибуцията е готова.<\/span> <span class=\"sg\" data-s=\"1\">Сега <code>fez upload<\/code> прави пакет от текущата директория и го изпраща:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">След това всеки може да я инсталира по име със <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да качите всяка версия само веднъж.<\/span> <span class=\"sg\" data-s=\"2\">Затова преди всяко обновяване увеличете <code>version<\/code> в <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Още полезни команди<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще използвате и тези команди на <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — търси възможни проблеми в дистрибуцията преди качването;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показва дистрибуциите, които вече сте публикували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — прави отново <code>META6.json<\/code> от файловете, които са на диска сега.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Всички тези команди имат нужда от инсталиран <code>fez<\/code> и от мрежа. Всичко след <code>init<\/code> има нужда и от акаунт в екосистемата.<\/span><\/blockquote>"]]},"eo":{"t":"Publikigi per fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">La antaŭa temo montris <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>fez<\/code> vi alŝutas distribuon al la Raku-ekosistemo.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne devas uzi <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Estas aliaj manieroj publikigi.<\/span> <span class=\"sg\" data-s=\"4\">Sed la plej multaj homoj uzas <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Kaj ĝi faras pli ol alŝuti.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ankaŭ povas krei novan distribuon por vi.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi povas ankaŭ zorgi pri via aŭtora konto.<\/span> <span class=\"sg\" data-s=\"8\">Instalu <code>fez<\/code> per <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Krei novan distribuon<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas mem fari la <code>META6.json<\/code> kaj la dosierujojn <code>lib/<\/code> kaj <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>fez<\/code> povas fari ilin por vi:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> kreas la komencon de nova distribuo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas projekta dosierujo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi jam havas <code>META6.json<\/code> kaj la norman aranĝon.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas tuj komenci skribi.<\/span> <span class=\"sg\" data-s=\"4\">La kodo iras sub <code>lib/<\/code>, kaj la testoj iras sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vi ne bezonas mem prepari la <code>META6.json<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registriĝi kaj ensaluti<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Por publikigi, vi bezonas konton en la ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">Vi kreas la konton nur unufoje, per <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi petas uzantnomon, retpoŝton kaj pasvorton.<\/span> <span class=\"sg\" data-s=\"3\">Poste vi ensalutas per <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi konservas vian ŝlosilon.<\/span> <span class=\"sg\" data-s=\"5\">Per ĉi tiu ŝlosilo, la sekvaj komandoj scias, kiu vi estas:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Via uzantnomo estas grava.<\/span> <span class=\"sg\" data-s=\"1\">La <code>META6.json<\/code> de distribuo devas havi kampon <code>auth<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia valoro estas <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiel la ekosistemo scias, ke la alŝuto vere estas via.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alŝuti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi havas konton, kaj la distribuo estas preta.<\/span> <span class=\"sg\" data-s=\"1\">Nun <code>fez upload<\/code> pakas la nunan dosierujon kaj sendas ĝin:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Post tio, ĉiu povas instali ĝin laŭ ĝia nomo per <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas alŝuti ĉiun version nur unufoje.<\/span> <span class=\"sg\" data-s=\"2\">Do antaŭ ĝisdatigo, faru la <code>version<\/code> en <code>META6.json<\/code> pli alta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pliaj utilaj komandoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi uzos ankaŭ ĉi tiujn komandojn de <code>fez<\/code>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — serĉi eblajn problemojn en distribuo antaŭ la alŝuto;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — montri la distribuojn, kiujn vi jam publikigis;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — fari <code>META6.json<\/code> denove el la dosieroj, kiuj nun estas sur la disko.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉiuj ĉi tiuj komandoj bezonas instalitan <code>fez<\/code> kaj la reton. Ĉio post <code>init<\/code> ankaŭ bezonas ekosisteman konton.<\/span><\/blockquote>"]]},"la":{"t":"Publicare cum fez","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Thema praecedens <code>fez<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>fez<\/code> distributionem in systema Raku imponis.<\/span> <span class=\"sg\" data-s=\"2\">Non necesse est <code>fez<\/code> uti.<\/span> <span class=\"sg\" data-s=\"3\">Alii modi publicandi sunt.<\/span> <span class=\"sg\" data-s=\"4\">Sed plurimi homines <code>fez<\/code> utuntur.<\/span> <span class=\"sg\" data-s=\"5\">Et plus quam imponere facit.<\/span> <span class=\"sg\" data-s=\"6\">Etiam novam distributionem pro te creare potest.<\/span> <span class=\"sg\" data-s=\"7\">Rationem auctoris tui quoque curare potest.<\/span> <span class=\"sg\" data-s=\"8\">Installa <code>fez<\/code> per <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Novam distributionem creare<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code> et directoria <code>lib/<\/code> et <code>t/<\/code> ipse facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>fez<\/code> ea pro te facere potest:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> initium novae distributionis creat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est directorium proiecti.<\/span> <span class=\"sg\" data-s=\"2\">Iam <code>META6.json<\/code> et dispositionem normalem habet.<\/span> <span class=\"sg\" data-s=\"3\">Itaque statim scribere incipere potes.<\/span> <span class=\"sg\" data-s=\"4\">Codicem sub <code>lib/<\/code> scribis, et probationes sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Non necesse est tibi <code>META6.json<\/code> parare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Inscriptio et aditus<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ad publicandum rationem in systemate requiris.<\/span> <span class=\"sg\" data-s=\"1\">Rationem semel tantum creas, per <code>fez register<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nomen usoris, inscriptionem electronicam et tesseram rogat.<\/span> <span class=\"sg\" data-s=\"3\">Deinde per <code>fez login<\/code> intras.<\/span> <span class=\"sg\" data-s=\"4\">Clavem tuam servat.<\/span> <span class=\"sg\" data-s=\"5\">Hac clave mandata sequentia sciunt quis sis:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomen usoris tui magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\"><code>META6.json<\/code> distributionis campum <code>auth<\/code> habere debet.<\/span> <span class=\"sg\" data-s=\"2\">Valor eius est <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sic systema scit: impositio vere tua est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Impositio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rationem habes, et distributio parata est.<\/span> <span class=\"sg\" data-s=\"1\">Nunc <code>fez upload<\/code> directorium praesens componit et mittit:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Postea quisque eam nomine eius per <code>zef install My::Greeting<\/code> installare potest.<\/span> <span class=\"sg\" data-s=\"1\">Quamque versionem semel tantum imponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ante renovationem <code>version<\/code> in <code>META6.json<\/code> auge.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plura mandata utilia<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec quoque mandata <code>fez<\/code> adhibebis:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — quaere problemata possibilia in distributione ante impositionem;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — ostende distributiones quas iam publicavisti;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — fac <code>META6.json<\/code> iterum ex archivis quae nunc in disco sunt.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Omnia haec mandata <code>fez<\/code> installatum et retia requirunt. Omnia post <code>init<\/code> etiam rationem in systemate requirunt.<\/span><\/blockquote>"]]}}}</script>
