ructure: [\"Raku\", [1, 2, 3], :key(\"value\")]<\/code><\/pre>"]]},"eo":{"t":"Solvo: Dumpi la datumstrukturon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'Raku', [1, 2, 3], (key =&gt; 'value');\n\ndd @data;\nsay \"Structure: { @data.raku }\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/dd/dump-the-structure.raku\" target=\"_blank\" rel=\"noopener\">dump-the-structure.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[\"Raku\", [1, 2, 3], :key(\"value\")]\nStructure: [\"Raku\", [1, 2, 3], :key(\"value\")]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd @data<\/code> presas tion, kio estas en la tabelo. Ĝi presas ĝin en formo kiel kodo. Ĉi tiu eligo iras al la norma erara fluo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La metodo <code>.raku<\/code> redonas la saman formon kiel ĉenon. La programo metas ĉi tiun ĉenon en normalan mesaĝon. Por tio, ĝi rulas kodon ene de la ĉeno. Poste <code>say<\/code> presas la mesaĝon al la norma eligo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tie, la du linioj aspektas same. Sed ili iras al malsamaj eligaj fluoj. La unua linio venas de <code>dd<\/code> kaj iras al la norma erara fluo. La dua linio venas de <code>say<\/code> kaj iras al la norma eligo. Komparu ĉi tiujn du lanĉojn:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku &gt; /dev/null\n[\"Raku\", [1, 2, 3], :key(\"value\")]\n\n$ raku t.raku 2&amp;&gt; /dev/null\nStructure: [\"Raku\", [1, 2, 3], :key(\"value\")]<\/code><\/pre>"]]},"la":{"t":"Solutio: Structuram datae dump","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo opus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'Raku', [1, 2, 3], (key =&gt; 'value');\n\ndd @data;\nsay \"Structure: { @data.raku }\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/dd/dump-the-structure.raku\" target=\"_blank\" rel=\"noopener\">dump-the-structure.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[\"Raku\", [1, 2, 3], :key(\"value\")]\nStructure: [\"Raku\", [1, 2, 3], :key(\"value\")]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd @data<\/code> contenta ordinis imprimit. Ea in forma codici simili imprimit. Hoc output ad flumen erroris normalis venit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Methodus <code>.raku<\/code> eandem formam ut seriem reddit. Programma hanc seriem in nuntium normalem ponit. Ad hoc codicem intra seriem exsequitur. Deinde <code>say<\/code> nuntium ad flumen output normalis imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic duae lineae idem apparent. Sed in diversa flumina output eunt. Prima linea a <code>dd<\/code> venit et ad errorem normalem it. Secunda linea a <code>say<\/code> venit et ad flumen output normalis it. Compara hos duos cursus:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku &gt; /dev/null\n[\"Raku\", [1, 2, 3], :key(\"value\")]\n\n$ raku t.raku 2&amp;&gt; /dev/null\nStructure: [\"Raku\", [1, 2, 3], :key(\"value\")]<\/code><\/pre>"]]}}}</script>
