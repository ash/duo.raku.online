<script type="application/json" id="page-data">{"u":"advanced/dd","n":343,"k":"section","pv":"advanced/representations/choosing","nx":"advanced/dd/variables","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Debugging Raku programs","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">You can debug a program in different ways.<\/span> <span class=\"sg\" data-s=\"1\">To debug means to find and fix errors.<\/span> <span class=\"sg\" data-s=\"2\">The simplest way is to print values with <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">There are also more complex tools.<\/span> <span class=\"sg\" data-s=\"4\">They follow the program step by step.<\/span> <span class=\"sg\" data-s=\"5\">In this section, we look at the useful routine <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">It is built into the Rakudo compiler.<\/span> <span class=\"sg\" data-s=\"7\">But it is not part of the Raku language standard.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">The name <code>dd<\/code> means <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">A data dumper prints data for the programmer.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> and <code>put<\/code> are for the normal output of a program.<\/span> <span class=\"sg\" data-s=\"3\">But <code>dd<\/code> is different.<\/span> <span class=\"sg\" data-s=\"4\">It shows a value in a form for programmers.<\/span> <span class=\"sg\" data-s=\"5\">This form looks like code.<\/span> <span class=\"sg\" data-s=\"6\">It is the same form that the <a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> method gives.<\/span> <span class=\"sg\" data-s=\"7\">You saw this method in the last section.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> prints to the standard error stream.<\/span> <span class=\"sg\" data-s=\"9\">So it does not mix with the output for the user.<\/span><\/p>"]]},"de":{"t":"Debugging mit <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Du kannst ein Programm auf verschiedene Arten debuggen.<\/span> <span class=\"sg\" data-s=\"1\">Debuggen heißt: Fehler finden und beheben.<\/span> <span class=\"sg\" data-s=\"2\">Am einfachsten gibst du Werte mit <code>say<\/code> aus.<\/span> <span class=\"sg\" data-s=\"3\">Es gibt auch komplexere Werkzeuge.<\/span> <span class=\"sg\" data-s=\"4\">Sie folgen dem Programm Schritt für Schritt.<\/span> <span class=\"sg\" data-s=\"5\">In diesem Abschnitt schauen wir uns die nützliche Routine <code>dd<\/code> an.<\/span> <span class=\"sg\" data-s=\"6\">Sie ist in den Rakudo-Compiler eingebaut.<\/span> <span class=\"sg\" data-s=\"7\">Aber sie gehört nicht zum Raku-Sprachstandard.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Der Name <code>dd<\/code> bedeutet <em>Data Dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ein Data Dumper gibt Daten für den Programmierer aus.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> und <code>put<\/code> sind für die normale Ausgabe eines Programms.<\/span> <span class=\"sg\" data-s=\"3\">Aber <code>dd<\/code> ist anders.<\/span> <span class=\"sg\" data-s=\"4\"><code>dd<\/code> zeigt einen Wert in einer Form für Programmierer.<\/span> <span class=\"sg\" data-s=\"5\">Diese Form sieht wie Code aus.<\/span> <span class=\"sg\" data-s=\"6\">Es ist dieselbe Form wie bei der <a href=\"https://course.raku.org/de/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code>-Methode<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Du hast diese Methode im letzten Abschnitt gesehen.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> schreibt seine Ausgabe auf den Standardfehlerstream.<\/span> <span class=\"sg\" data-s=\"9\">Deshalb mischt sie sich nicht mit der Ausgabe für den Benutzer.<\/span><\/p>"]]},"nl":{"t":"Debuggen met <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Je kunt een programma op verschillende manieren debuggen.<\/span> <span class=\"sg\" data-s=\"1\">Debuggen betekent fouten zoeken en oplossen.<\/span> <span class=\"sg\" data-s=\"2\">De eenvoudigste manier is waarden tonen met <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er zijn ook ingewikkeldere hulpmiddelen.<\/span> <span class=\"sg\" data-s=\"4\">Die volgen het programma stap voor stap.<\/span> <span class=\"sg\" data-s=\"5\">In dit onderdeel bekijken we de handige routine <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Deze is ingebouwd in de Rakudo-compiler.<\/span> <span class=\"sg\" data-s=\"7\">Maar hij hoort niet bij de Raku-taalstandaard.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">De naam <code>dd<\/code> betekent <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Een data dumper toont gegevens voor de programmeur.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> en <code>put<\/code> zijn voor de normale uitvoer van een programma.<\/span> <span class=\"sg\" data-s=\"3\">Maar <code>dd<\/code> is anders.<\/span> <span class=\"sg\" data-s=\"4\">Het toont een waarde in een vorm voor programmeurs.<\/span> <span class=\"sg\" data-s=\"5\">Deze vorm lijkt op code.<\/span> <span class=\"sg\" data-s=\"6\">Het is dezelfde vorm die de <a href=\"https://course.raku.org/nl/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>-methode geeft.<\/span> <span class=\"sg\" data-s=\"7\">Je zag deze methode in het vorige onderdeel.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> schrijft naar de standaardfoutstroom.<\/span> <span class=\"sg\" data-s=\"9\">Daarom mengt het niet met de uitvoer voor de gebruiker.<\/span><\/p>"]]},"es":{"t":"Depuración con <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Puedes depurar un programa de diferentes formas.<\/span> <span class=\"sg\" data-s=\"1\">Depurar significa buscar y corregir errores.<\/span> <span class=\"sg\" data-s=\"2\">La forma más simple es imprimir valores con <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">También hay herramientas más complejas.<\/span> <span class=\"sg\" data-s=\"4\">Siguen el programa paso a paso.<\/span> <span class=\"sg\" data-s=\"5\">En esta sección, vemos la útil rutina <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Viene dentro del compilador Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Pero no forma parte del estándar del lenguaje Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">El nombre <code>dd<\/code> significa <em>data dumper<\/em> (volcador de datos).<\/span> <span class=\"sg\" data-s=\"1\">Un volcador de datos imprime datos para el programador.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> y <code>put<\/code> son para la salida normal de un programa.<\/span> <span class=\"sg\" data-s=\"3\">Pero <code>dd<\/code> es diferente.<\/span> <span class=\"sg\" data-s=\"4\">Muestra un valor en una forma para programadores.<\/span> <span class=\"sg\" data-s=\"5\">Esta forma parece código.<\/span> <span class=\"sg\" data-s=\"6\">Es la misma forma que da el método <a href=\"https://course.raku.org/es/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Viste este método en la sección anterior.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> imprime en el flujo de error estándar.<\/span> <span class=\"sg\" data-s=\"9\">Así no se mezcla con la salida para el usuario.<\/span><\/p>"]]},"it":{"t":"Debugging con <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Puoi fare il debug di un programma in modi diversi.<\/span> <span class=\"sg\" data-s=\"1\">Fare il debug vuol dire trovare e correggere gli errori.<\/span> <span class=\"sg\" data-s=\"2\">Il modo più semplice è stampare i valori con <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ci sono anche strumenti più complessi.<\/span> <span class=\"sg\" data-s=\"4\">Seguono il programma passo dopo passo.<\/span> <span class=\"sg\" data-s=\"5\">In questa sezione, guardiamo l'utile routine <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">È integrata nel compilatore Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Ma non fa parte dello standard del linguaggio Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Il nome <code>dd<\/code> vuol dire <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un data dumper stampa i dati per il programmatore.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> e <code>put<\/code> servono per l'output normale di un programma.<\/span> <span class=\"sg\" data-s=\"3\">Ma <code>dd<\/code> è diverso.<\/span> <span class=\"sg\" data-s=\"4\">Mostra un valore in una forma per i programmatori.<\/span> <span class=\"sg\" data-s=\"5\">Questa forma sembra codice.<\/span> <span class=\"sg\" data-s=\"6\">È la stessa forma che dà il metodo <a href=\"https://course.raku.org/it/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Hai visto questo metodo nella sezione precedente.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> stampa sul flusso di errore standard.<\/span> <span class=\"sg\" data-s=\"9\">Così il suo output non si mescola con l'output per l'utente.<\/span><\/p>"]]},"lv":{"t":"Atkļūdošana ar <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Programmu var atkļūdot dažādi.<\/span> <span class=\"sg\" data-s=\"1\">Atkļūdot nozīmē atrast un labot kļūdas.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršākais veids ir izdrukāt vērtības ar <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ir arī sarežģītāki rīki.<\/span> <span class=\"sg\" data-s=\"4\">Tie seko programmai soli pa solim.<\/span> <span class=\"sg\" data-s=\"5\">Šajā sadaļā mēs aplūkojam noderīgo rutīnu <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tā ir iebūvēta Rakudo kompilatorā.<\/span> <span class=\"sg\" data-s=\"7\">Bet tā nav Raku valodas standarta daļa.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Nosaukums <code>dd<\/code> nozīmē <em>data dumper<\/em> (datu izmetējs).<\/span> <span class=\"sg\" data-s=\"1\">Datu izmetējs izdrukā datus programmētājam.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> un <code>put<\/code> ir programmas parastajai izvadei.<\/span> <span class=\"sg\" data-s=\"3\">Bet <code>dd<\/code> ir citāda.<\/span> <span class=\"sg\" data-s=\"4\">Tā parāda vērtību programmētājiem ērtā formā.<\/span> <span class=\"sg\" data-s=\"5\">Šī forma izskatās kā kods.<\/span> <span class=\"sg\" data-s=\"6\">Tā ir tā pati forma, ko dod metode <a href=\"https://course.raku.org/lv/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Jūs redzējāt šo metodi iepriekšējā sadaļā.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> drukā standarta kļūdu plūsmā.<\/span> <span class=\"sg\" data-s=\"9\">Tāpēc tās izvade nesajaucas ar izvadi lietotājam.<\/span><\/p>"]]},"ru":{"t":"Отладка с помощью <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Отлаживать программу можно по-разному.<\/span> <span class=\"sg\" data-s=\"1\">Отлаживать — значит искать и исправлять ошибки.<\/span> <span class=\"sg\" data-s=\"2\">Самый простой способ — печатать значения через <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Есть и более сложные инструменты.<\/span> <span class=\"sg\" data-s=\"4\">Они следят за программой шаг за шагом.<\/span> <span class=\"sg\" data-s=\"5\">В этом разделе мы посмотрим на полезную процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Она встроена в компилятор Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Но она не входит в стандарт языка Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Название <code>dd<\/code> означает <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Дампер данных печатает данные для программиста.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>put<\/code> нужны для обычного вывода программы.<\/span> <span class=\"sg\" data-s=\"3\">Но <code>dd<\/code> работает иначе.<\/span> <span class=\"sg\" data-s=\"4\">Она показывает значение в форме для программистов.<\/span> <span class=\"sg\" data-s=\"5\">Эта форма похожа на код.<\/span> <span class=\"sg\" data-s=\"6\">Это та же форма, которую даёт метод <a href=\"https://course.raku.org/ru/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Вы видели этот метод в прошлом разделе.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> печатает в поток стандартной ошибки.<\/span> <span class=\"sg\" data-s=\"9\">Поэтому её вывод не смешивается с выводом для пользователя.<\/span><\/p>"]]},"uk":{"t":"Налагодження з <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ви можете налагоджувати програму різними способами.<\/span> <span class=\"sg\" data-s=\"1\">Налагоджувати — це шукати й виправляти помилки.<\/span> <span class=\"sg\" data-s=\"2\">Найпростіший спосіб — друкувати значення через <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Є також складніші інструменти.<\/span> <span class=\"sg\" data-s=\"4\">Вони стежать за програмою крок за кроком.<\/span> <span class=\"sg\" data-s=\"5\">У цьому розділі ми розглядаємо корисну процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Вона вбудована в компілятор Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Але вона не є частиною стандарту мови Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Назва <code>dd<\/code> означає <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Дампер даних друкує дані для програміста.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> і <code>put<\/code> — для звичайного виводу програми.<\/span> <span class=\"sg\" data-s=\"3\">Але <code>dd<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"4\">Вона показує значення у формі для програмістів.<\/span> <span class=\"sg\" data-s=\"5\">Ця форма схожа на код.<\/span> <span class=\"sg\" data-s=\"6\">Це та сама форма, яку дає метод <a href=\"https://course.raku.org/uk/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Ви бачили цей метод у минулому розділі.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> друкує у стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"9\">Тому її вивід не змішується з виводом для користувача.<\/span><\/p>"]]},"bg":{"t":"Отстраняване на грешки с <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Можете да дебъгвате програма по различни начини.<\/span> <span class=\"sg\" data-s=\"1\">Да дебъгвате означава да намирате и поправяте грешки.<\/span> <span class=\"sg\" data-s=\"2\">Най-простият начин е да отпечатвате стойности със <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Има и по-сложни инструменти.<\/span> <span class=\"sg\" data-s=\"4\">Те следят програмата стъпка по стъпка.<\/span> <span class=\"sg\" data-s=\"5\">В тази секция разглеждаме полезната процедура <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тя е вградена в компилатора Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Но не е част от стандарта на езика Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Името <code>dd<\/code> означава <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Такъв инструмент отпечатва данни за програмиста.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>put<\/code> са за нормалния изход на програмата.<\/span> <span class=\"sg\" data-s=\"3\">Но <code>dd<\/code> работи различно.<\/span> <span class=\"sg\" data-s=\"4\">Тя показва стойността във форма за програмисти.<\/span> <span class=\"sg\" data-s=\"5\">Тази форма прилича на код.<\/span> <span class=\"sg\" data-s=\"6\">Методът <a href=\"https://course.raku.org/bg/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> дава същата форма.<\/span> <span class=\"sg\" data-s=\"7\">Видяхте този метод в миналата секция.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> отпечатва в стандартния поток за грешки.<\/span> <span class=\"sg\" data-s=\"9\">Затова нейният изход не се смесва с изхода за потребителя.<\/span><\/p>"]]},"eo":{"t":"Senararigado kun <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Vi povas sencimigi programon en diversaj manieroj.<\/span> <span class=\"sg\" data-s=\"1\">Sencimigi signifas trovi kaj ripari erarojn.<\/span> <span class=\"sg\" data-s=\"2\">La plej simpla maniero estas presi valorojn per <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ekzistas ankaŭ pli kompleksaj iloj.<\/span> <span class=\"sg\" data-s=\"4\">Ili sekvas la programon paŝon post paŝo.<\/span> <span class=\"sg\" data-s=\"5\">En ĉi tiu sekcio, ni rigardas la utilan rutinon <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi estas enkonstruita en la Rakudo-kompililo.<\/span> <span class=\"sg\" data-s=\"7\">Sed ĝi ne estas parto de la normo de la lingvo Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">La nomo <code>dd<\/code> signifas <em>data dumper<\/em> (datumelmontrilo).<\/span> <span class=\"sg\" data-s=\"1\">Datumelmontrilo presas datumojn por la programisto.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> kaj <code>put<\/code> estas por la normala eligo de programo.<\/span> <span class=\"sg\" data-s=\"3\">Sed <code>dd<\/code> estas alia.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi montras valoron en formo por programistoj.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu formo aspektas kiel kodo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi estas la sama formo, kiun donas la metodo <a href=\"https://course.raku.org/eo/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Vi vidis ĉi tiun metodon en la antaŭa sekcio.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> presas al la norma erara fluo.<\/span> <span class=\"sg\" data-s=\"9\">Do ĝi ne miksiĝas kun la eligo por la uzanto.<\/span><\/p>"]]},"la":{"t":"Debugging cum <code>dd<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Programma diversis modis corrigere potes.<\/span> <span class=\"sg\" data-s=\"1\">Corrigere significat errores invenire et removere.<\/span> <span class=\"sg\" data-s=\"2\">Modus simplicissimus est valores cum <code>say<\/code> imprimere.<\/span> <span class=\"sg\" data-s=\"3\">Sunt etiam instrumenta magis complexa.<\/span> <span class=\"sg\" data-s=\"4\">Haec programma gradatim sequuntur.<\/span> <span class=\"sg\" data-s=\"5\">In hac sectione utilem subroutinam <code>dd<\/code> inspicimus.<\/span> <span class=\"sg\" data-s=\"6\">Pars compilatoris Rakudo est.<\/span> <span class=\"sg\" data-s=\"7\">Sed pars normae linguae Raku non est.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Nomen <code>dd<\/code> significat <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Data dumper data pro programmatore imprimit.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> et <code>put<\/code> sunt pro output normali programmatis.<\/span> <span class=\"sg\" data-s=\"3\">Sed <code>dd<\/code> aliud est.<\/span> <span class=\"sg\" data-s=\"4\">Valorem in forma pro programmatoribus ostendit.<\/span> <span class=\"sg\" data-s=\"5\">Haec forma similis codici est.<\/span> <span class=\"sg\" data-s=\"6\">Eadem forma est quam methodus <a href=\"https://course.raku.org/la/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> dat.<\/span> <span class=\"sg\" data-s=\"7\">Hanc methodum in sectione priore vidisti.<\/span> <span class=\"sg\" data-s=\"8\"><code>dd<\/code> in flumen erroris normalis imprimit.<\/span> <span class=\"sg\" data-s=\"9\">Itaque se cum output pro usore non miscet.<\/span><\/p>"]]}}}</script>
