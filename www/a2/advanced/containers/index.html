<script type="application/json" id="page-data">{"u":"advanced/containers","n":354,"k":"section","pv":"advanced/dd/exercises/dump-a-hash/solution","nx":"advanced/scalar-containers","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Understanding Raku containers","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, containers keep data.<\/span> <span class=\"sg\" data-s=\"1\">But a container is more than a simple variable.<\/span> <span class=\"sg\" data-s=\"2\">Its role is bigger and deeper.<\/span> <span class=\"sg\" data-s=\"3\">This section shows the different types of containers in Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">It is important to understand containers.<\/span> <span class=\"sg\" data-s=\"1\">Without this, some programs can surprise you.<\/span> <span class=\"sg\" data-s=\"2\">Sometimes you expect an array.<\/span> <span class=\"sg\" data-s=\"3\">But the program seems to use a scalar.<\/span> <span class=\"sg\" data-s=\"4\">Or it is the other way around.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Different containers can keep different kinds of data.<\/span> <span class=\"sg\" data-s=\"1\">The data can have a different size.<\/span> <span class=\"sg\" data-s=\"2\">The number of items can be different too.<\/span> <span class=\"sg\" data-s=\"3\">So each type of container has its own methods.<\/span> <span class=\"sg\" data-s=\"4\">They work with the data in the container.<\/span><\/p>"]]},"de":{"t":"Verständnis von Raku-Containern","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku speichern Container Daten.<\/span> <span class=\"sg\" data-s=\"1\">Aber ein Container ist mehr als eine einfache Variable.<\/span> <span class=\"sg\" data-s=\"2\">Seine Rolle ist größer und tiefer.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt die verschiedenen Containertypen in Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Es ist wichtig, Container zu verstehen.<\/span> <span class=\"sg\" data-s=\"1\">Ohne dieses Wissen können dich manche Programme überraschen.<\/span> <span class=\"sg\" data-s=\"2\">Manchmal erwartest du ein Array.<\/span> <span class=\"sg\" data-s=\"3\">Aber das Programm scheint einen Skalar zu verwenden.<\/span> <span class=\"sg\" data-s=\"4\">Oder es ist umgekehrt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Verschiedene Container können verschiedene Arten von Daten speichern.<\/span> <span class=\"sg\" data-s=\"1\">Die Daten können verschieden groß sein.<\/span> <span class=\"sg\" data-s=\"2\">Auch die Anzahl der Elemente kann verschieden sein.<\/span> <span class=\"sg\" data-s=\"3\">Deshalb hat jeder Containertyp eigene Methoden.<\/span> <span class=\"sg\" data-s=\"4\">Sie arbeiten mit den Daten im Container.<\/span><\/p>"]]},"nl":{"t":"Raku-containers begrijpen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku bewaren containers gegevens.<\/span> <span class=\"sg\" data-s=\"1\">Maar een container is meer dan een gewone variabele.<\/span> <span class=\"sg\" data-s=\"2\">Zijn rol is groter en dieper.<\/span> <span class=\"sg\" data-s=\"3\">Dit gedeelte toont de verschillende typen containers in Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het is belangrijk om containers te begrijpen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dat kunnen sommige programma's je verrassen.<\/span> <span class=\"sg\" data-s=\"2\">Soms verwacht je een array.<\/span> <span class=\"sg\" data-s=\"3\">Maar het programma lijkt een scalar te gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Of het is andersom.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Verschillende containers kunnen verschillende soorten gegevens bewaren.<\/span> <span class=\"sg\" data-s=\"1\">De gegevens kunnen een andere grootte hebben.<\/span> <span class=\"sg\" data-s=\"2\">Ook het aantal items kan anders zijn.<\/span> <span class=\"sg\" data-s=\"3\">Daarom heeft elk type container zijn eigen methoden.<\/span> <span class=\"sg\" data-s=\"4\">Die werken met de gegevens in de container.<\/span><\/p>"]]},"es":{"t":"Comprender los contenedores de Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, los contenedores guardan datos.<\/span> <span class=\"sg\" data-s=\"1\">Pero un contenedor es más que una simple variable.<\/span> <span class=\"sg\" data-s=\"2\">Su papel es más grande y profundo.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra los diferentes tipos de contenedores en Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Es importante entender los contenedores.<\/span> <span class=\"sg\" data-s=\"1\">Sin esto, algunos programas pueden sorprenderte.<\/span> <span class=\"sg\" data-s=\"2\">A veces esperas un arreglo.<\/span> <span class=\"sg\" data-s=\"3\">Pero el programa parece usar un escalar.<\/span> <span class=\"sg\" data-s=\"4\">O pasa al revés.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Diferentes contenedores pueden guardar diferentes tipos de datos.<\/span> <span class=\"sg\" data-s=\"1\">Los datos pueden tener un tamaño diferente.<\/span> <span class=\"sg\" data-s=\"2\">El número de elementos también puede ser diferente.<\/span> <span class=\"sg\" data-s=\"3\">Por eso cada tipo de contenedor tiene sus propios métodos.<\/span> <span class=\"sg\" data-s=\"4\">Estos métodos trabajan con los datos del contenedor.<\/span><\/p>"]]},"it":{"t":"Comprendere i contenitori di Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, i contenitori conservano i dati.<\/span> <span class=\"sg\" data-s=\"1\">Ma un contenitore è più di una semplice variabile.<\/span> <span class=\"sg\" data-s=\"2\">Il suo ruolo è più grande e più profondo.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra i diversi tipi di contenitori in Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">È importante capire i contenitori.<\/span> <span class=\"sg\" data-s=\"1\">Senza questo, alcuni programmi possono sorprenderti.<\/span> <span class=\"sg\" data-s=\"2\">A volte ti aspetti un array.<\/span> <span class=\"sg\" data-s=\"3\">Ma il programma sembra usare uno scalare.<\/span> <span class=\"sg\" data-s=\"4\">Oppure succede il contrario.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Contenitori diversi possono conservare tipi diversi di dati.<\/span> <span class=\"sg\" data-s=\"1\">I dati possono avere dimensioni diverse.<\/span> <span class=\"sg\" data-s=\"2\">Anche il numero di elementi può essere diverso.<\/span> <span class=\"sg\" data-s=\"3\">Così ogni tipo di contenitore ha i suoi metodi.<\/span> <span class=\"sg\" data-s=\"4\">Questi metodi lavorano con i dati nel contenitore.<\/span><\/p>"]]},"lv":{"t":"Raku konteineru izpratne","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku valodā konteineri glabā datus.<\/span> <span class=\"sg\" data-s=\"1\">Bet konteineris ir vairāk nekā vienkāršs mainīgais.<\/span> <span class=\"sg\" data-s=\"2\">Tā loma ir lielāka un dziļāka.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda dažādos konteineru veidus Raku valodā.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ir svarīgi saprast konteinerus.<\/span> <span class=\"sg\" data-s=\"1\">Bez tā dažas programmas var jūs pārsteigt.<\/span> <span class=\"sg\" data-s=\"2\">Dažreiz jūs gaidāt masīvu.<\/span> <span class=\"sg\" data-s=\"3\">Bet programma it kā izmanto skalāru.<\/span> <span class=\"sg\" data-s=\"4\">Vai arī ir otrādi.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažādi konteineri var glabāt dažādus datu veidus.<\/span> <span class=\"sg\" data-s=\"1\">Datiem var būt dažāds izmērs.<\/span> <span class=\"sg\" data-s=\"2\">Arī elementu skaits var būt dažāds.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc katram konteinera veidam ir savas metodes.<\/span> <span class=\"sg\" data-s=\"4\">Tās strādā ar datiem konteinerā.<\/span><\/p>"]]},"ru":{"t":"Понимание контейнеров Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku контейнеры хранят данные.<\/span> <span class=\"sg\" data-s=\"1\">Но контейнер — это больше, чем простая переменная.<\/span> <span class=\"sg\" data-s=\"2\">Его роль больше и глубже.<\/span> <span class=\"sg\" data-s=\"3\">Этот раздел показывает разные типы контейнеров в Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Важно понимать контейнеры.<\/span> <span class=\"sg\" data-s=\"1\">Без этого некоторые программы могут вас удивить.<\/span> <span class=\"sg\" data-s=\"2\">Иногда вы ждёте массив.<\/span> <span class=\"sg\" data-s=\"3\">Но программа как будто использует скаляр.<\/span> <span class=\"sg\" data-s=\"4\">Или бывает наоборот.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Разные контейнеры могут хранить разные виды данных.<\/span> <span class=\"sg\" data-s=\"1\">Данные могут быть разного размера.<\/span> <span class=\"sg\" data-s=\"2\">Число элементов тоже может быть разным.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому у каждого типа контейнера свои методы.<\/span> <span class=\"sg\" data-s=\"4\">Они работают с данными в контейнере.<\/span><\/p>"]]},"uk":{"t":"Розуміння контейнерів Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku контейнери зберігають дані.<\/span> <span class=\"sg\" data-s=\"1\">Але контейнер — це більше, ніж проста змінна.<\/span> <span class=\"sg\" data-s=\"2\">Його роль більша й глибша.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує різні типи контейнерів у Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Важливо розуміти контейнери.<\/span> <span class=\"sg\" data-s=\"1\">Без цього деякі програми можуть вас здивувати.<\/span> <span class=\"sg\" data-s=\"2\">Іноді ви чекаєте масив.<\/span> <span class=\"sg\" data-s=\"3\">Але програма ніби використовує скаляр.<\/span> <span class=\"sg\" data-s=\"4\">Або буває навпаки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Різні контейнери можуть зберігати різні види даних.<\/span> <span class=\"sg\" data-s=\"1\">Дані можуть мати різний розмір.<\/span> <span class=\"sg\" data-s=\"2\">Кількість елементів теж може бути різною.<\/span> <span class=\"sg\" data-s=\"3\">Тому кожен тип контейнера має свої методи.<\/span> <span class=\"sg\" data-s=\"4\">Вони працюють з даними в контейнері.<\/span><\/p>"]]},"bg":{"t":"Разбиране на Raku контейнери","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku контейнерите пазят данни.<\/span> <span class=\"sg\" data-s=\"1\">Но контейнерът е нещо повече от проста променлива.<\/span> <span class=\"sg\" data-s=\"2\">Ролята му е по-голяма и по-дълбока.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел показва различните типове контейнери в Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Важно е да разбирате контейнерите.<\/span> <span class=\"sg\" data-s=\"1\">Без това някои програми могат да ви изненадат.<\/span> <span class=\"sg\" data-s=\"2\">Понякога очаквате масив.<\/span> <span class=\"sg\" data-s=\"3\">Но програмата сякаш използва скалар.<\/span> <span class=\"sg\" data-s=\"4\">Или е обратното.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Различните контейнери могат да пазят различни видове данни.<\/span> <span class=\"sg\" data-s=\"1\">Данните могат да имат различен размер.<\/span> <span class=\"sg\" data-s=\"2\">Броят на елементите също може да е различен.<\/span> <span class=\"sg\" data-s=\"3\">Затова всеки тип контейнер има свои методи.<\/span> <span class=\"sg\" data-s=\"4\">Те работят с данните в контейнера.<\/span><\/p>"]]},"eo":{"t":"Kompreno de Raku-ujoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, ujoj tenas datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed ujo estas pli ol simpla variablo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia rolo estas pli granda kaj pli profunda.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras la diversajn tipojn de ujoj en Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Gravas kompreni ujojn.<\/span> <span class=\"sg\" data-s=\"1\">Sen tio, iuj programoj povas surprizi vin.<\/span> <span class=\"sg\" data-s=\"2\">Foje vi atendas tabelon.<\/span> <span class=\"sg\" data-s=\"3\">Sed la programo ŝajne uzas skalaron.<\/span> <span class=\"sg\" data-s=\"4\">Aŭ estas inverse.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Diversaj ujoj povas teni diversajn specojn de datumoj.<\/span> <span class=\"sg\" data-s=\"1\">La datumoj povas havi diversan grandecon.<\/span> <span class=\"sg\" data-s=\"2\">Ankaŭ la nombro de eroj povas esti malsama.<\/span> <span class=\"sg\" data-s=\"3\">Do ĉiu tipo de ujo havas siajn proprajn metodojn.<\/span> <span class=\"sg\" data-s=\"4\">Ili laboras kun la datumoj en la ujo.<\/span><\/p>"]]},"la":{"t":"Intellectus receptaculorum Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku continentes data servant.<\/span> <span class=\"sg\" data-s=\"1\">Sed continens plus est quam simplex variabilis.<\/span> <span class=\"sg\" data-s=\"2\">Munus eius maius et profundius est.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio diversos typos continentium in Raku ostendit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Magni momenti est continentes intellegere.<\/span> <span class=\"sg\" data-s=\"1\">Sine hoc, quaedam programmata tibi mira videri possunt.<\/span> <span class=\"sg\" data-s=\"2\">Interdum ordinem exspectas.<\/span> <span class=\"sg\" data-s=\"3\">Sed programma scalarem adhibere videtur.<\/span> <span class=\"sg\" data-s=\"4\">Vel res contraria est.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Diversi continentes diversa genera datorum servare possunt.<\/span> <span class=\"sg\" data-s=\"1\">Data diversam magnitudinem habere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Numerus elementorum quoque diversus esse potest.<\/span> <span class=\"sg\" data-s=\"3\">Itaque quisque typus continentis proprias methodos habet.<\/span> <span class=\"sg\" data-s=\"4\">Hae methodi data in continenti tractant.<\/span><\/p>"]]}}}</script>
