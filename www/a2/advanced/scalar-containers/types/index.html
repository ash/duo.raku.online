<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/types","n":356,"k":"topic","pv":"advanced/scalar-containers","nx":"advanced/scalar-containers/type-constraints","tr":["advanced","advanced/scalar-containers"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Data types and scalar containers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Let's look at a program.<\/span> <span class=\"sg\" data-s=\"1\">It uses the same variable for different kinds of data.<\/span> <span class=\"sg\" data-s=\"2\">We use <code>dd<\/code> to see the data at each step.<\/span> <span class=\"sg\" data-s=\"3\">This example only shows how things work.<\/span> <span class=\"sg\" data-s=\"4\">It is not a good way to write programs.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each <code>dd<\/code> call shows the current value of <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">At first, the variable is empty.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> shows its value as <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This is the undefined base value.<\/span> <span class=\"sg\" data-s=\"3\">Every untyped container starts with it.<\/span> <span class=\"sg\" data-s=\"4\">After the assignments, <code>dd<\/code> shows the integer.<\/span> <span class=\"sg\" data-s=\"5\">Then it shows the string.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Note that <code>dd<\/code> does not print a type before the name here.<\/span> <span class=\"sg\" data-s=\"1\">An untyped container has no fixed type.<\/span> <span class=\"sg\" data-s=\"2\">So <code>dd<\/code> shows only the value.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"/advanced/scalar-containers/type-constraints/\">A container with a declared type<\/a> works differently.<\/span> <span class=\"sg\" data-s=\"4\">You will see this in the next topic.<\/span><\/p>"]]},"de":{"t":"Datentypen und skalare Container","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sehen wir uns ein Programm an.<\/span> <span class=\"sg\" data-s=\"1\">Es verwendet dieselbe Variable für verschiedene Arten von Daten.<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>dd<\/code> sehen wir die Daten bei jedem Schritt.<\/span> <span class=\"sg\" data-s=\"3\">Dieses Beispiel zeigt nur, wie die Dinge funktionieren.<\/span> <span class=\"sg\" data-s=\"4\">Es ist kein guter Weg, Programme zu schreiben.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder <code>dd<\/code>-Aufruf zeigt den aktuellen Wert von <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Zuerst ist die Variable leer.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> zeigt ihren Wert als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das ist der undefinierte Basiswert.<\/span> <span class=\"sg\" data-s=\"3\">Jeder untypisierte Container beginnt damit.<\/span> <span class=\"sg\" data-s=\"4\">Nach den Zuweisungen zeigt <code>dd<\/code> die Ganzzahl.<\/span> <span class=\"sg\" data-s=\"5\">Dann zeigt es den String.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beachte: <code>dd<\/code> gibt hier keinen Typ vor dem Namen aus.<\/span> <span class=\"sg\" data-s=\"1\">Ein untypisierter Container hat keinen festen Typ.<\/span> <span class=\"sg\" data-s=\"2\">Also zeigt <code>dd<\/code> nur den Wert.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/de/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Ein Container mit deklariertem Typ<\/a> funktioniert anders.<\/span> <span class=\"sg\" data-s=\"4\">Das siehst du im nächsten Thema.<\/span><\/p>"]]},"nl":{"t":"Gegevenstypen en scalaire containers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Laten we naar een programma kijken.<\/span> <span class=\"sg\" data-s=\"1\">Het gebruikt dezelfde variabele voor verschillende soorten gegevens.<\/span> <span class=\"sg\" data-s=\"2\">We gebruiken <code>dd<\/code> om de gegevens bij elke stap te zien.<\/span> <span class=\"sg\" data-s=\"3\">Dit voorbeeld laat alleen zien hoe het werkt.<\/span> <span class=\"sg\" data-s=\"4\">Het is geen goede manier om programma's te schrijven.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke <code>dd<\/code>-aanroep toont de huidige waarde van <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In het begin is de variabele leeg.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> toont de waarde als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat is de ongedefinieerde basiswaarde.<\/span> <span class=\"sg\" data-s=\"3\">Elke container zonder type begint daarmee.<\/span> <span class=\"sg\" data-s=\"4\">Na de toewijzingen toont <code>dd<\/code> het gehele getal.<\/span> <span class=\"sg\" data-s=\"5\">Daarna toont het de string.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Let op: <code>dd<\/code> drukt hier geen type af voor de naam.<\/span> <span class=\"sg\" data-s=\"1\">Een container zonder type heeft geen vast type.<\/span> <span class=\"sg\" data-s=\"2\">Daarom toont <code>dd<\/code> alleen de waarde.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/nl/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Een container met een gedeclareerd type<\/a> werkt anders.<\/span> <span class=\"sg\" data-s=\"4\">Dat zie je in het volgende onderwerp.<\/span><\/p>"]]},"es":{"t":"Tipos de datos y contenedores escalares","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Veamos un programa.<\/span> <span class=\"sg\" data-s=\"1\">Usa la misma variable para diferentes tipos de datos.<\/span> <span class=\"sg\" data-s=\"2\">Usamos <code>dd<\/code> para ver los datos en cada paso.<\/span> <span class=\"sg\" data-s=\"3\">Este ejemplo solo muestra cómo funcionan las cosas.<\/span> <span class=\"sg\" data-s=\"4\">No es una buena forma de escribir programas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>dd<\/code> muestra el valor actual de <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Al principio, la variable está vacía.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> muestra su valor como <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es el valor base indefinido.<\/span> <span class=\"sg\" data-s=\"3\">Todo contenedor sin tipo empieza con él.<\/span> <span class=\"sg\" data-s=\"4\">Después de las asignaciones, <code>dd<\/code> muestra el entero.<\/span> <span class=\"sg\" data-s=\"5\">Luego muestra la cadena.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Observa que aquí <code>dd<\/code> no imprime un tipo antes del nombre.<\/span> <span class=\"sg\" data-s=\"1\">Un contenedor sin tipo no tiene un tipo fijo.<\/span> <span class=\"sg\" data-s=\"2\">Por eso <code>dd<\/code> muestra solo el valor.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/es/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Un contenedor con un tipo declarado<\/a> funciona de otra manera.<\/span> <span class=\"sg\" data-s=\"4\">Verás esto en el siguiente tema.<\/span><\/p>"]]},"it":{"t":"Tipi di dati e contenitori scalari","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Guardiamo un programma.<\/span> <span class=\"sg\" data-s=\"1\">Usa la stessa variabile per tipi diversi di dati.<\/span> <span class=\"sg\" data-s=\"2\">Usiamo <code>dd<\/code> per vedere i dati a ogni passo.<\/span> <span class=\"sg\" data-s=\"3\">Questo esempio mostra solo come funzionano le cose.<\/span> <span class=\"sg\" data-s=\"4\">Non è un buon modo di scrivere programmi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>dd<\/code> mostra il valore attuale di <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">All'inizio la variabile è vuota.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> mostra il suo valore come <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">È il valore base indefinito.<\/span> <span class=\"sg\" data-s=\"3\">Ogni contenitore senza tipo inizia con questo valore.<\/span> <span class=\"sg\" data-s=\"4\">Dopo le assegnazioni, <code>dd<\/code> mostra l'intero.<\/span> <span class=\"sg\" data-s=\"5\">Poi mostra la stringa.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Notate che qui <code>dd<\/code> non stampa un tipo prima del nome.<\/span> <span class=\"sg\" data-s=\"1\">Un contenitore senza tipo non ha un tipo fisso.<\/span> <span class=\"sg\" data-s=\"2\">Così <code>dd<\/code> mostra solo il valore.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/it/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Un contenitore con un tipo dichiarato<\/a> funziona in modo diverso.<\/span> <span class=\"sg\" data-s=\"4\">Lo vedrete nel prossimo argomento.<\/span><\/p>"]]},"lv":{"t":"Datu tipi un skalārie konteineri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Aplūkosim programmu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izmanto vienu un to pašu mainīgo dažādiem datu veidiem.<\/span> <span class=\"sg\" data-s=\"2\">Mēs izmantojam <code>dd<\/code>, lai redzētu datus katrā solī.<\/span> <span class=\"sg\" data-s=\"3\">Šis piemērs tikai parāda, kā lietas darbojas.<\/span> <span class=\"sg\" data-s=\"4\">Tas nav labs veids, kā rakstīt programmas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>dd<\/code> izsaukums parāda <code>$value<\/code> pašreizējo vērtību:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Sākumā mainīgais ir tukšs.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> parāda tā vērtību kā <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir nedefinētā bāzes vērtība.<\/span> <span class=\"sg\" data-s=\"3\">Katrs konteineris bez tipa sākas ar to.<\/span> <span class=\"sg\" data-s=\"4\">Pēc piešķiršanām <code>dd<\/code> parāda veselo skaitli.<\/span> <span class=\"sg\" data-s=\"5\">Tad tā parāda virkni.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka <code>dd<\/code> šeit neizdrukā tipu pirms nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Konteineram bez tipa nav noteikta tipa.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>dd<\/code> parāda tikai vērtību.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/lv/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Konteineris ar deklarētu tipu<\/a> darbojas citādi.<\/span> <span class=\"sg\" data-s=\"4\">Jūs to redzēsiet nākamajā tēmā.<\/span><\/p>"]]},"ru":{"t":"Типы данных и скалярные контейнеры","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Давайте посмотрим на программу.<\/span> <span class=\"sg\" data-s=\"1\">Она использует одну и ту же переменную для разных видов данных.<\/span> <span class=\"sg\" data-s=\"2\">Мы используем <code>dd<\/code>, чтобы видеть данные на каждом шаге.<\/span> <span class=\"sg\" data-s=\"3\">Этот пример только показывает, как всё работает.<\/span> <span class=\"sg\" data-s=\"4\">Это не лучший способ писать программы.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>dd<\/code> показывает текущее значение <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Сначала переменная пустая.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> показывает её значение как <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это неопределённое базовое значение.<\/span> <span class=\"sg\" data-s=\"3\">С него начинает каждый контейнер без типа.<\/span> <span class=\"sg\" data-s=\"4\">После присваиваний <code>dd<\/code> показывает целое число.<\/span> <span class=\"sg\" data-s=\"5\">Потом она показывает строку.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: здесь <code>dd<\/code> не печатает тип перед именем.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер без типа не привязан к типу.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>dd<\/code> показывает только значение.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/ru/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Контейнер с объявленным типом<\/a> работает иначе.<\/span> <span class=\"sg\" data-s=\"4\">Вы увидите это в следующей теме.<\/span><\/p>"]]},"uk":{"t":"Типи даних і скалярні контейнери","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Погляньмо на програму.<\/span> <span class=\"sg\" data-s=\"1\">Вона використовує ту саму змінну для різних видів даних.<\/span> <span class=\"sg\" data-s=\"2\">Ми використовуємо <code>dd<\/code>, щоб бачити дані на кожному кроці.<\/span> <span class=\"sg\" data-s=\"3\">Цей приклад лише показує, як усе працює.<\/span> <span class=\"sg\" data-s=\"4\">Це не добрий спосіб писати програми.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>dd<\/code> показує поточне значення <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Спочатку змінна порожня.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> показує її значення як <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це невизначене базове значення.<\/span> <span class=\"sg\" data-s=\"3\">З нього починає кожен нетипізований контейнер.<\/span> <span class=\"sg\" data-s=\"4\">Після присвоєнь <code>dd<\/code> показує ціле число.<\/span> <span class=\"sg\" data-s=\"5\">Потім <code>dd<\/code> показує рядок.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що тут <code>dd<\/code> не виводить типу перед іменем.<\/span> <span class=\"sg\" data-s=\"1\">Нетипізований контейнер не має сталого типу.<\/span> <span class=\"sg\" data-s=\"2\">Тому <code>dd<\/code> показує лише значення.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/uk/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Контейнер з оголошеним типом<\/a> працює інакше.<\/span> <span class=\"sg\" data-s=\"4\">Ви побачите це в наступній темі.<\/span><\/p>"]]},"bg":{"t":"Типове данни и скаларни контейнери","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Нека разгледаме една програма.<\/span> <span class=\"sg\" data-s=\"1\">Тя използва една и съща променлива за различни видове данни.<\/span> <span class=\"sg\" data-s=\"2\">Използваме <code>dd<\/code>, за да видим данните на всяка стъпка.<\/span> <span class=\"sg\" data-s=\"3\">Този пример само показва как работят нещата.<\/span> <span class=\"sg\" data-s=\"4\">Това не е добър начин да пишете програми.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>dd<\/code> показва текущата стойност на <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">В началото променливата е празна.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> показва нейната стойност като <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е неопределената базова стойност.<\/span> <span class=\"sg\" data-s=\"3\">Всеки нетипизиран контейнер започва с нея.<\/span> <span class=\"sg\" data-s=\"4\">След присвояванията <code>dd<\/code> показва цялото число.<\/span> <span class=\"sg\" data-s=\"5\">След това показва низа.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Забележете, че тук <code>dd<\/code> не отпечатва тип преди името.<\/span> <span class=\"sg\" data-s=\"1\">Нетипизираният контейнер няма фиксиран тип.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>dd<\/code> показва само стойността.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/bg/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Контейнер с деклариран тип<\/a> работи различно.<\/span> <span class=\"sg\" data-s=\"4\">Ще видите това в следващата тема.<\/span><\/p>"]]},"eo":{"t":"Datentipoj kaj skalaraj ujoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ni rigardu programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi uzas la saman variablon por diversaj specoj de datumoj.<\/span> <span class=\"sg\" data-s=\"2\">Ni uzas <code>dd<\/code> por vidi la datumojn en ĉiu paŝo.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu ekzemplo nur montras, kiel la aferoj funkcias.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ne estas bona maniero skribi programojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>dd<\/code> montras la nunan valoron de <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Komence, la variablo estas malplena.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> montras ĝian valoron kiel <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas la nedifinita baza valoro.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu netipigita ujo komenciĝas kun ĝi.<\/span> <span class=\"sg\" data-s=\"4\">Post la asignoj, <code>dd<\/code> montras la entjeron.<\/span> <span class=\"sg\" data-s=\"5\">Poste ĝi montras la ĉenon.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>dd<\/code> ne presas tipon antaŭ la nomo ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Netipigita ujo ne havas fiksan tipon.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>dd<\/code> montras nur la valoron.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/eo/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Ujo kun deklarita tipo<\/a> funkcias alie.<\/span> <span class=\"sg\" data-s=\"4\">Vi vidos tion en la sekva temo.<\/span><\/p>"]]},"la":{"t":"Data genera et scalaria receptacula","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nunc programma spectamus.<\/span> <span class=\"sg\" data-s=\"1\">Eandem variabilem pro diversis generibus datorum adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Per <code>dd<\/code> data in quoque gradu videmus.<\/span> <span class=\"sg\" data-s=\"3\">Hoc exemplum solum rem ostendit.<\/span> <span class=\"sg\" data-s=\"4\">Sic programmata scribere bonum non est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio <code>dd<\/code> valorem praesentem <code>$value<\/code> ostendit:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Initio variabilis vacua est.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> valorem eius ut <code>Any<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Hic est valor indefinitus basalis.<\/span> <span class=\"sg\" data-s=\"3\">Quisque continens sine typo cum eo incipit.<\/span> <span class=\"sg\" data-s=\"4\">Post assignationes <code>dd<\/code> numerum integrum ostendit.<\/span> <span class=\"sg\" data-s=\"5\">Deinde seriem ostendit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nota: <code>dd<\/code> hic typum ante nomen non imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Continens sine typo typum fixum non habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>dd<\/code> solum valorem ostendit.<\/span> <span class=\"sg\" data-s=\"3\"><a href=\"https://course.raku.org/la/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">Continens cum typo declarato<\/a> aliter operatur.<\/span> <span class=\"sg\" data-s=\"4\">Hoc in themate sequenti videbis.<\/span><\/p>"]]}}}</script>
