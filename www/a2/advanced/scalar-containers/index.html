<script type="application/json" id="page-data">{"u":"advanced/scalar-containers","n":355,"k":"section","pv":"advanced/containers","nx":"advanced/scalar-containers/types","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Scalar containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Scalar containers keep single, or scalar, values.<\/span> <span class=\"sg\" data-s=\"1\">The name tells you this.<\/span> <span class=\"sg\" data-s=\"2\">Such containers have the <code>$<\/code> sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a very simple use of a scalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>$lang<\/code> variable is a scalar container.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">By default, a scalar container does not limit the data type.<\/span> <span class=\"sg\" data-s=\"1\">So you can keep a value of any type in it.<\/span> <span class=\"sg\" data-s=\"2\">Here is the simplest example.<\/span> <span class=\"sg\" data-s=\"3\">First, a variable keeps an integer.<\/span> <span class=\"sg\" data-s=\"4\">Then the same variable keeps a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The author does not recommend writing code like this.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inside Raku, this means one thing.<\/span> <span class=\"sg\" data-s=\"1\">By default, a new container can keep values of the <code>Any<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> is the base type for most other types.<\/span> <span class=\"sg\" data-s=\"3\">For example, <code>Int<\/code> and <code>Str<\/code> come from <code>Any<\/code>.<\/span><\/p>"]]},"de":{"t":"Skalare Container","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Skalar-Container speichern einzelne, also skalare, Werte.<\/span> <span class=\"sg\" data-s=\"1\">Das sagt schon der Name.<\/span> <span class=\"sg\" data-s=\"2\">Solche Container haben das Sigil <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine sehr einfache Verwendung eines Skalars:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$lang<\/code> ist ein Skalar-Container.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig begrenzt ein Skalar-Container den Datentyp nicht.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du darin einen Wert von jedem Typ speichern.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist das einfachste Beispiel.<\/span> <span class=\"sg\" data-s=\"3\">Zuerst speichert eine Variable eine Ganzzahl.<\/span> <span class=\"sg\" data-s=\"4\">Dann speichert dieselbe Variable einen String:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Autor empfiehlt nicht, so Code zu schreiben.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Im Inneren von Raku heißt das Folgendes.<\/span> <span class=\"sg\" data-s=\"1\">Standardmäßig kann ein neuer Container Werte vom Typ <code>Any<\/code> speichern.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> ist der Basistyp für die meisten anderen Typen.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel kommen <code>Int<\/code> und <code>Str<\/code> von <code>Any<\/code>.<\/span><\/p>"]]},"nl":{"t":"Scalaire containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Scalaire containers bewaren enkele, of scalaire, waarden.<\/span> <span class=\"sg\" data-s=\"1\">Dat zegt de naam al.<\/span> <span class=\"sg\" data-s=\"2\">Zulke containers hebben het <code>$<\/code>-sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is p><span class=\"sg\" data-s=\"0\">Por defecto, un contenedor escalar no limita el tipo de datos.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes guardar en él un valor de cualquier tipo.<\/span> <span class=\"sg\" data-s=\"2\">Aquí tienes el ejemplo más simple.<\/span> <span class=\"sg\" data-s=\"3\">Primero, una variable guarda un entero.<\/span> <span class=\"sg\" data-s=\"4\">Luego la misma variable guarda una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El autor no recomienda escribir código así.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro de Raku, esto significa una cosa.<\/span> <span class=\"sg\" data-s=\"1\">Por defecto, un contenedor nuevo puede guardar valores del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> es el tipo base de la mayoría de los otros tipos.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, <code>Int<\/code> y <code>Str<\/code> vienen de <code>Any<\/code>.<\/span><\/p>"]]},"it":{"t":"Contenitori scalari","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I contenitori scalari conservano valori singoli, o scalari.<\/span> <span class=\"sg\" data-s=\"1\">Lo dice il nome.<\/span> <span class=\"sg\" data-s=\"2\">Questi contenitori hanno il sigillo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un uso molto semplice di uno scalare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$lang<\/code> è un contenitore scalare.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Di default, un contenitore scalare non limita il tipo dei dati.<\/span> <span class=\"sg\" data-s=\"1\">Così potete metterci un valore di qualsiasi tipo.<\/span> <span class=\"sg\" data-s=\"2\">Ecco l'esempio più semplice.<\/span> <span class=\"sg\" data-s=\"3\">Prima una variabile contiene un intero.<\/span> <span class=\"sg\" data-s=\"4\">Poi la stessa variabile contiene una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'autore non consiglia di scrivere codice così.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro Raku, questo vuol dire una cosa.<\/span> <span class=\"sg\" data-s=\"1\">Di default, un nuovo contenitore può contenere valori del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> è il tipo base per quasi tutti gli altri tipi.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, <code>Int<\/code> e <code>Str<\/code> vengono da <code>Any<\/code>.<\/span><\/p>"]]},"lv":{"t":"Skalārie konteineri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Skalārie konteineri glabā atsevišķas jeb skalāras vērtības.<\/span> <span class=\"sg\" data-s=\"1\">To pasaka nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Šādiem konteineriem ir sigils <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir ļoti vienkāršs skalāra lietojums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$lang<\/code> ir skalārs konteineris.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma skalārais konteineris neierobežo datu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat glabāt tajā jebkura tipa vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir vienkāršākais piemērs.<\/span> <span class=\"sg\" data-s=\"3\">Vispirms mainīgais glabā veselu skaitli.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas pats mainīgais glabā virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Autors neiesaka rakstīt kodu šādi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku iekšienē tas nozīmē vienu lietu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma jauns konteineris var glabāt <code>Any<\/code> tipa vērtības.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> ir bāzes tips lielākajai daļai citu tipu.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, <code>Int<\/code> un <code>Str<\/code> nāk no <code>Any<\/code>.<\/span><\/p>"]]},"ru":{"t":"Скалярные контейнеры","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Скалярные контейнеры хранят одиночные, или скалярные, значения.<\/span> <span class=\"sg\" data-s=\"1\">Об этом говорит название.<\/span> <span class=\"sg\" data-s=\"2\">У таких контейнеров сигил <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот очень простой пример со скаляром:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$lang<\/code> — это скалярный контейнер.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По умолчанию скалярный контейнер не ограничивает тип данных.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в нём можно хранить значение любого типа.<\/span> <span class=\"sg\" data-s=\"2\">Вот самый простой пример.<\/span> <span class=\"sg\" data-s=\"3\">Сначала переменная хранит целое число.<\/span> <span class=\"sg\" data-s=\"4\">Потом та же переменная хранит строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Автор не советует писать такой код.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри Raku это значит вот что.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию новый контейнер может хранить значения типа <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> — это базовый тип для большинства других типов.<\/span> <span class=\"sg\" data-s=\"3\">Например, <code>Int<\/code> и <code>Str<\/code> происходят от <code>Any<\/code>.<\/span><\/p>"]]},"uk":{"t":"Скалярні контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Скалярні контейнери зберігають поодинокі, або скалярні, значення.<\/span> <span class=\"sg\" data-s=\"1\">Про це каже їхня назва.<\/span> <span class=\"sg\" data-s=\"2\">Такі контейнери мають сигіл <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось дуже просте використання скаляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$lang<\/code> є скалярним контейнером.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням скалярний контейнер не обмежує тип даних.<\/span> <span class=\"sg\" data-s=\"1\">Тому в ньому можна зберігати значення будь-якого типу.<\/span> <span class=\"sg\" data-s=\"2\">Ось найпростіший приклад.<\/span> <span class=\"sg\" data-s=\"3\">Спочатку змінна зберігає ціле число.<\/span> <span class=\"sg\" data-s=\"4\">Потім та сама змінна зберігає рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Автор не радить писати такий код.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Усередині Raku це означає одне.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням новий контейнер може зберігати значення типу <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> — базовий тип для більшості інших типів.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, <code>Int<\/code> і <code>Str<\/code> походять від <code>Any<\/code>.<\/span><\/p>"]]},"bg":{"t":"Скаларни контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Скаларните контейнери пазят единични, или скаларни, стойности.<\/span> <span class=\"sg\" data-s=\"1\">Името ви казва това.<\/span> <span class=\"sg\" data-s=\"2\">Такива контейнери имат сигила <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един много прост начин да използвате скалар:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$lang<\/code> е скаларен контейнер.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По подразбиране скаларният контейнер не ограничава типа на данните.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да пазите в него стойност от всякакъв тип.<\/span> <span class=\"sg\" data-s=\"2\">Ето най-простият пример.<\/span> <span class=\"sg\" data-s=\"3\">Първо променливата пази цяло число.<\/span> <span class=\"sg\" data-s=\"4\">След това същата променлива пази низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Авторът не препоръчва да пишете код по този начин.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вътре в Raku това означава едно нещо.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране новият контейнер може да пази стойности от тип <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> е базовият тип за повечето други типове.<\/span> <span class=\"sg\" data-s=\"3\">Например <code>Int<\/code> и <code>Str<\/code> идват от <code>Any<\/code>.<\/span><\/p>"]]},"eo":{"t":"Skalaraj ujoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Skalaraj ujoj tenas unuopajn, aŭ skalarajn, valorojn.<\/span> <span class=\"sg\" data-s=\"1\">La nomo diras tion al vi.<\/span> <span class=\"sg\" data-s=\"2\">Tiaj ujoj havas la sigelon <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen tre simpla uzo de skalaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$lang<\/code> estas skalara ujo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, skalara ujo ne limigas la datumtipon.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas teni valoron de ajna tipo en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Jen la plej simpla ekzemplo.<\/span> <span class=\"sg\" data-s=\"3\">Unue, variablo tenas entjeron.<\/span> <span class=\"sg\" data-s=\"4\">Poste la sama variablo tenas ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La aŭtoro ne rekomendas skribi kodon tiel.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ene de Raku, tio signifas unu aferon.<\/span> <span class=\"sg\" data-s=\"1\">Defaŭlte, nova ujo povas teni valorojn de la tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> estas la baza tipo por plej multaj aliaj tipoj.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, <code>Int<\/code> kaj <code>Str<\/code> venas de <code>Any<\/code>.<\/span><\/p>"]]},"la":{"t":"Scalaria receptacula","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Continentes scalares valores singulos, vel scalares, servant.<\/span> <span class=\"sg\" data-s=\"1\">Nomen hoc tibi dicit.<\/span> <span class=\"sg\" data-s=\"2\">Tales continentes sigillum <code>$<\/code> habent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est usus scalaris valde simplex:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$lang<\/code> est continens scalaris.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per defectum continens scalaris typum datorum non limitat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque valorem cuiuslibet typi in eo servare potes.<\/span> <span class=\"sg\" data-s=\"2\">Hic est exemplum simplicissimum.<\/span> <span class=\"sg\" data-s=\"3\">Primum variabilis numerum integrum servat.<\/span> <span class=\"sg\" data-s=\"4\">Deinde eadem variabilis seriem servat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auctor non commendat codicem sic scribere.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Intra Raku hoc unam rem significat.<\/span> <span class=\"sg\" data-s=\"1\">Per defectum novus continens valores typi <code>Any<\/code> servare potest.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> est typus basalis pro plerisque aliis typis.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, <code>Int<\/code> et <code>Str<\/code> ex <code>Any<\/code> veniunt.<\/span><\/p>"]]}}}</script>
