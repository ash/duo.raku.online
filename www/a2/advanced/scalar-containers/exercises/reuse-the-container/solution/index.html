calar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> показывает два контейнера по-разному. Для контейнера без типа она печатает только <code>$untyped<\/code>. Для контейнера с типом она добавляет впереди объявленный тип: <code>Int $typed<\/code>. Именно это и меняет объявленный тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пустые значения тоже разные. Контейнер без типа начинает с <code>Any<\/code>. Это базовое неопределённое значение. Контейнер с типом начинает с неопределённого значения <em>своего<\/em> типа. Здесь это <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Потом обе переменные получают <code>42<\/code>. Теперь значения выглядят одинаково. Но у <code>$typed<\/code> всё ещё есть тип. Она не принимает значение, если это не целое число. <code>$untyped<\/code> принимает любое значение.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Типізований чи нетипізований","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> показує ці два контейнери по-різному. Для нетипізованого він виводить лише <code>$untyped<\/code>. Для типізованого він додає попереду оголошений тип: <code>Int $typed<\/code>. Саме це й змінює оголошений тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порожні значення теж різні. Нетипізований контейнер починає з <code>Any<\/code>. Це базове невизначене значення. Типізований контейнер починає з невизначеного значення <em>свого<\/em> типу. Тут це <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Потім обидві змінні отримують <code>42<\/code>. Тепер значення виглядають однаково. Але <code>$typed<\/code> досі має свій тип. Він не приймає значення, яке не є цілим числом. <code>$untyped<\/code> приймає будь-яке значення.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Типизиран или нетипизиран","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> показва двата контейнера по различен начин. За нетипизирания тя отпечатва само <code>$untyped<\/code>. За типизирания тя добавя декларирания тип отпред: <code>Int $typed<\/code>. Точно това променя декларираният тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Празните стойности също са различни. Нетипизираният контейнер започва с <code>Any<\/code>. Това е основната неопределена стойност. Типизираният контейнер започва с неопределената стойност на <em>своя<\/em> тип. Тук това е <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След това двете променливи получават <code>42<\/code>. Сега стойностите изглеждат еднакво. Но <code>$typed<\/code> все още има своя тип. Тя не приема стойност, която не е цяло число. <code>$untyped<\/code> приема всяка стойност.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Tipita aŭ netipita","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> montras la du ujojn en malsamaj manieroj. Por la netipita, ĝi presas nur <code>$untyped<\/code>. Por la tipita, ĝi aldonas la deklaritan tipon antaŭe: <code>Int $typed<\/code>. Ĝuste tion ŝanĝas deklarita tipo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ankaŭ la malplenaj valoroj estas malsamaj. Netipita ujo komenciĝas kun <code>Any<\/code>. Tio estas la baza nedifinita valoro. Tipita ujo komenciĝas kun la nedifinita valoro de <em>sia<\/em> tipo. Ĉi tie, tio estas <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poste ambaŭ variabloj ricevas <code>42<\/code>. Nun la valoroj aspektas same. Sed <code>$typed<\/code> ankoraŭ havas sian tipon. Ĝi ne akceptas valoron, kiu ne estas entjero. <code>$untyped<\/code> akceptas ajnan valoron.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Typificatum vel non typificatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo opus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> duos continentes diversis modis ostendit. Pro continenti sine typo solum <code>$untyped<\/code> imprimit. Pro continenti cum typo typum declaratum ante addit: <code>Int $typed<\/code>. Hoc est exacte quod typus declaratus mutat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Valores vacui quoque differunt. Continens sine typo cum <code>Any<\/code> incipit. Hic est valor indefinitus basalis. Continens cum typo cum valore indefinito <em>sui<\/em> typi incipit. Hoc loco est <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Deinde ambae variabiles <code>42<\/code> accipiunt. Nunc valores idem apparent. Sed <code>$typed<\/code> adhuc typum suum habet. Valorem qui numerus integer non est non accipit. <code>$untyped<\/code> quemlibet valorem accipit.<\/span><\/li><\/ol>"]]}}}</script>
