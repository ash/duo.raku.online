 решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ограничението на типа <code>Int<\/code> в <code>my Int $cars<\/code> е правило за контейнера. Контейнерът не приема стойности, които не са цели числа. Не можете да присвоите <code>250.7<\/code> директно. Тази стойност е <code>Rat<\/code>. Raku дава грешка по време на компилация, преди програмата да започне.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Програмата извиква <code>.Int<\/code> върху рационалната стойност <code>250.7<\/code>. Това я превръща в цялото число <code>250<\/code>. Методът просто маха частта след десетичната точка. Новата стойност е подходяща за контейнера. Забележете, че това не е същото като закръгляне.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Псевдо-методът <code>.WHAT<\/code> показва типа на записаната стойност. Той е <code>Int<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Nur entjeroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tipa limigo <code>Int<\/code> en <code>my Int $cars<\/code> estas regulo por la ujo. La ujo ne akceptas valorojn, kiuj ne estas entjeroj. Vi ne povas atribui <code>250.7<\/code> rekte. Ĉi tiu valoro estas <code>Rat<\/code>. Raku donas eraron dum kompiltempo, antaŭ ol la programo ruliĝas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La programo vokas <code>.Int<\/code> sur la racionala valoro <code>250.7<\/code>. Tio konvertas ĝin al la entjero <code>250<\/code>. La metodo simple forĵetas la parton post la decimala punkto. La nova valoro konvenas al la ujo. Notu, ke tio ne estas la sama kiel rondigo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La pseŭdometodo <code>.WHAT<\/code> montras la tipon de la konservita valoro. Ĝi estas <code>Int<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Solum integri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo opus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $cars;\n\n$cars = 250.7.Int;\nsay $cars;\nsay $cars.WHAT;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/integers-only.raku\" target=\"_blank\" rel=\"noopener\">integers-only.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>250\n(Int)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Restrictio typi <code>Int<\/code> in <code>my Int $cars<\/code> est regula pro continenti. Continens valores non accipit qui numeri integri non sunt. <code>250.7<\/code> directe assignare non potes. Hic valor est <code>Rat<\/code>. Raku errorem tempore compilationis dat, antequam programma currit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Programma <code>.Int<\/code> in valore rationali <code>250.7<\/code> vocat. Hoc eum in numerum integrum <code>250<\/code> convertit. Methodus solum partem post punctum decimale abicit. Novus valor continenti convenit. Nota: hoc non idem est ac rotundatio.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pseudo-methodus <code>.WHAT<\/code> typum valoris servati ostendit. Typus est <code>Int<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
