<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/proxying","n":360,"k":"topic","pv":"advanced/scalar-containers/default","nx":"advanced/scalar-containers/exercises","tr":["advanced","advanced/scalar-containers"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Proxying method calls","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A scalar container is really an object of the <code>Scalar<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">Usually, you do not see this container at all.<\/span> <span class=\"sg\" data-s=\"2\">You do not need to think about it.<\/span> <span class=\"sg\" data-s=\"3\">You can imagine that you work directly with the values in it.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Why does this work?<\/span> <span class=\"sg\" data-s=\"1\">A scalar container passes method calls on to the value in it.<\/span> <span class=\"sg\" data-s=\"2\">For example, take the assignment <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">After it, you can call the <code>.chars<\/code> method on the variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The program prints <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is the number of characters in the string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Now call <code>.chars<\/code> on the string value itself, not on the variable.<\/span> <span class=\"sg\" data-s=\"3\">The result is exactly the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So the container quietly passes the <code>.chars<\/code> call on to its string.<\/span> <span class=\"sg\" data-s=\"1\">Then it gives the result back to you.<\/span><\/p>"]]},"de":{"t":"Proxierung von Methodenaufrufen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Skalar-Container ist eigentlich ein Objekt vom Typ <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Meistens siehst du diesen Container gar nicht.<\/span> <span class=\"sg\" data-s=\"2\">Du musst nicht an ihn denken.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst dir vorstellen, dass du direkt mit den Werten darin arbeitest.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Warum funktioniert das?<\/span> <span class=\"sg\" data-s=\"1\">Ein Skalar-Container gibt Methodenaufrufe an den Wert darin weiter.<\/span> <span class=\"sg\" data-s=\"2\">Nimm zum Beispiel die Zuweisung <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Danach kannst du die Methode <code>.chars<\/code> für die Variable aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt <code>4<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Das ist die Anzahl der Zeichen im String <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Rufe jetzt <code>.chars<\/code> für den Stringwert selbst auf, nicht für die Variable.<\/span> <span class=\"sg\" data-s=\"3\">Das Ergebnis ist genau gleich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Container gibt den <code>.chars<\/code>-Aufruf also still an seinen String weiter.<\/span> <span class=\"sg\" data-s=\"1\">Dann gibt er dir das Ergebnis zurück.<\/span><\/p>"]]},"nl":{"t":"Proxying van methode-aanroepen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een scalaire container is eigenlijk een object van het type <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Meestal zie je deze container helemaal niet.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft er niet aan te denken.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt je voorstellen dat je direct met de waarden erin werkt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Waarom werkt dit?<\/span> <span class=\"sg\" data-s=\"1\">Een scalaire container stuurt methodeaanroepen door naar de waarde erin.<\/span> <span class=\"sg\" data-s=\"2\">Neem bijvoorbeeld de toewijzing <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Daarna kun je de <code>.chars<\/code>-methode aanroepen op de variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt <code>4<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het aantal tekens in de string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Roep nu <code>.chars<\/code> aan op de stringwaarde zelf, niet op de variabele.<\/span> <span class=\"sg\" data-s=\"3\">Het resultaat is precies hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De container stuurt de <code>.chars<\/code>-aanroep dus stil door naar zijn string.<\/span> <span class=\"sg\" data-s=\"1\">Daarna geeft hij het resultaat aan je terug.<\/span><\/p>"]]},"es":{"t":"Proxificación de llamadas a métodos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un contenedor escalar es en realidad un objeto del tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente, no ves este contenedor para nada.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas pensar en él.<\/span> <span class=\"sg\" data-s=\"3\">Puedes imaginar que trabajas directamente con los valores que hay dentro.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">¿Por qué funciona esto?<\/span> <span class=\"sg\" data-s=\"1\">Un contenedor escalar pasa las llamadas a métodos al valor que tiene dentro.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, toma la asignación <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Después de ella, puedes llamar al método <code>.chars<\/code> sobre la variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El programa imprime <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es el número de caracteres de la cadena <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ahora llama a <code>.chars<\/code> sobre el valor de la cadena, no sobre la variable.<\/span> <span class=\"sg\" data-s=\"3\">El resultado es exactamente el mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así, el contenedor pasa en silencio la llamada a <code>.chars<\/code> a su cadena.<\/span> <span class=\"sg\" data-s=\"1\">Luego te devuelve el resultado.<\/span><\/p>"]]},"it":{"t":"Proxying delle chiamate di metodo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un contenitore scalare è in realtà un oggetto del tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Di solito non vedete per niente questo contenitore.<\/span> <span class=\"sg\" data-s=\"2\">Non avete bisogno di pensarci.<\/span> <span class=\"sg\" data-s=\"3\">Potete immaginare di lavorare direttamente con i valori al suo interno.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Perché funziona?<\/span> <span class=\"sg\" data-s=\"1\">Un contenitore scalare passa le chiamate ai metodi al valore che contiene.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, prendete l'assegnazione <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dopo questa, potete chiamare il metodo <code>.chars<\/code> sulla variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È il numero di caratteri nella stringa <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ora chiamate <code>.chars<\/code> sul valore stringa stesso, non sulla variabile.<\/span> <span class=\"sg\" data-s=\"3\">Il risultato è proprio lo stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Così il contenitore passa in silenzio la chiamata <code>.chars<\/code> alla sua stringa.<\/span> <span class=\"sg\" data-s=\"1\">Poi vi restituisce il risultato.<\/span><\/p>"]]},"lv":{"t":"Metožu izsaukumu pāradresēšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Skalārs konteineris patiesībā ir <code>Scalar<\/code> tipa objekts.<\/span> <span class=\"sg\" data-s=\"1\">Parasti jūs šo konteineru nemaz neredzat.<\/span> <span class=\"sg\" data-s=\"2\">Jums par to nav jādomā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat iedomāties, ka strādājat tieši ar vērtībām tajā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kāpēc tas darbojas?<\/span> <span class=\"sg\" data-s=\"1\">Skalārs konteineris nodod metožu izsaukumus tālāk vērtībai, kas ir tajā.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, ņemiet piešķiršanu <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tās jūs varat izsaukt metodi <code>.chars<\/code> mainīgajam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir rakstzīmju skaits virknē <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tagad izsauciet <code>.chars<\/code> pašai virknes vērtībai, nevis mainīgajam.<\/span> <span class=\"sg\" data-s=\"3\">Rezultāts ir tieši tāds pats:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad konteineris klusi nodod <code>.chars<\/code> izsaukumu tālāk savai virknei.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas atdod jums rezultātu.<\/span><\/p>"]]},"ru":{"t":"Проксирование вызова методов","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Скалярный контейнер — это на самом деле объект типа <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обычно вы этот контейнер совсем не видите.<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужно о нём думать.<\/span> <span class=\"sg\" data-s=\"3\">Можно представить, что вы работаете прямо со значениями в нём.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Почему это работает?<\/span> <span class=\"sg\" data-s=\"1\">Скалярный контейнер передаёт вызовы методов значению внутри себя.<\/span> <span class=\"sg\" data-s=\"2\">Например, возьмём присваивание <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">После него можно вызвать метод <code>.chars<\/code> для переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Программа печатает <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это число символов в строке <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Теперь вызовите <code>.chars<\/code> для самого строкового значения, а не для переменной.<\/span> <span class=\"sg\" data-s=\"3\">Результат точно такой же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значит, контейнер тихо передаёт вызов <code>.chars<\/code> своей строке.<\/span> <span class=\"sg\" data-s=\"1\">Потом он отдаёт вам результат.<\/span><\/p>"]]},"uk":{"t":"Проксіювання викликів методів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Скалярний контейнер — це насправді об'єкт типу <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай ви взагалі не бачите цього контейнера.<\/span> <span class=\"sg\" data-s=\"2\">Вам не треба про нього думати.<\/span> <span class=\"sg\" data-s=\"3\">Можна уявляти, що ви працюєте прямо зі значеннями в ньому.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Чому це працює?<\/span> <span class=\"sg\" data-s=\"1\">Скалярний контейнер передає виклики методів далі, значенню в ньому.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, візьміть присвоєння <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Після нього можна викликати метод <code>.chars<\/code> для змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програма виводить <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це кількість символів у рядку <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тепер викличте <code>.chars<\/code> для самого рядкового значення, а не для змінної.<\/span> <span class=\"sg\" data-s=\"3\">Результат точно такий самий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, контейнер тихо передає виклик <code>.chars<\/code> своєму рядку.<\/span> <span class=\"sg\" data-s=\"1\">Потім він повертає вам результат.<\/span><\/p>"]]},"bg":{"t":"Проксиране на методни повиквания","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Скаларният контейнер всъщност е обект от тип <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено изобщо не виждате този контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да мислите за него.<\/span> <span class=\"sg\" data-s=\"3\">Можете да си представяте, че работите направо със стойностите в него.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Защо това работи?<\/span> <span class=\"sg\" data-s=\"1\">Скаларният контейнер предава извикванията на методи към стойността в него.<\/span> <span class=\"sg\" data-s=\"2\">Например, вземете присвояването <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">След него можете да извикате метода <code>.chars<\/code> върху променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е броят на символите в низа <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сега извикайте <code>.chars<\/code> върху самата стойност на низа, а не върху променливата.<\/span> <span class=\"sg\" data-s=\"3\">Резултатът е абсолютно същият:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така контейнерът тихо предава извикването на <code>.chars<\/code> към своя низ.<\/span> <span class=\"sg\" data-s=\"1\">След това ви връща резултата.<\/span><\/p>"]]},"eo":{"t":"Prokuranto de metodvokoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Skalara ujo vere estas objekto de la tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kutime, vi tute ne vidas ĉi tiun ujon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas pensi pri ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas imagi, ke vi laboras rekte kun la valoroj en ĝi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kial tio funkcias?<\/span> <span class=\"sg\" data-s=\"1\">Skalara ujo transdonas metodvokojn al la valoro en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, prenu la asignon <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Post ĝi, vi povas voki la metodon <code>.chars<\/code> sur la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La programo presas <code>4<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas la nombro de signoj en la ĉeno <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nun voku <code>.chars<\/code> sur la ĉena valoro mem, ne sur la variablo.<\/span> <span class=\"sg\" data-s=\"3\">La rezulto estas ekzakte la sama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do la ujo silente transdonas la vokon <code>.chars<\/code> al sia ĉeno.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi redonas la rezulton al vi.<\/span><\/p>"]]},"la":{"t":"Procuratio vocationum methodorum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Continens scalaris revera obiectum typi <code>Scalar<\/code> est.<\/span> <span class=\"sg\" data-s=\"1\">Plerumque hunc continentem omnino non vides.<\/span> <span class=\"sg\" data-s=\"2\">De eo cogitare non debes.<\/span> <span class=\"sg\" data-s=\"3\">Putare potes: directe cum valoribus in eo laboras.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cur hoc operatur?<\/span> <span class=\"sg\" data-s=\"1\">Continens scalaris vocationes methodorum ad valorem in eo mittit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, sume assignationem <code>my $lang = 'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Post eam methodum <code>.chars<\/code> in variabili vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma <code>4<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Hic est numerus characterum in serie <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nunc <code>.chars<\/code> in ipso valore seriei voca, non in variabili.<\/span> <span class=\"sg\" data-s=\"3\">Resultatum prorsus idem est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque continens tacite vocationem <code>.chars<\/code> ad seriem suam mittit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde resultatum tibi reddit.<\/span><\/p>"]]}}}</script>
