<script type="application/json" id="page-data">{"u":"advanced/packages/namespaces","n":727,"k":"topic","pv":"advanced/packages/packages-modules/quiz","nx":"advanced/packages/exercises","tr":["advanced","advanced/packages"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Namespaces and our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The word <code>our<\/code> makes something visible in its namespace.<\/span> <span class=\"sg\" data-s=\"1\">A variable with <code>my<\/code> is lexical.<\/span> <span class=\"sg\" data-s=\"2\">It is private to its block.<\/span> <span class=\"sg\" data-s=\"3\">A variable with <code>our<\/code> is also a package variable.<\/span> <span class=\"sg\" data-s=\"4\">You can get to it from outside through the <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> works.<\/span> <span class=\"sg\" data-s=\"1\">The variable <code>count<\/code> has <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But <code>$Counter::secret<\/code> fails.<\/span> <span class=\"sg\" data-s=\"3\">The variable <code>secret<\/code> is lexical.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Namespaces can <strong>nest<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">This means that one namespace is inside another.<\/span> <span class=\"sg\" data-s=\"2\">A package inside a package makes a longer <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">The full name <code>$Outer::Inner::val<\/code> is like a path.<\/span> <span class=\"sg\" data-s=\"1\">It goes from the outer namespace into the inner one.<\/span> <span class=\"sg\" data-s=\"2\">Then it goes to the variable.<\/span> <span class=\"sg\" data-s=\"3\">The standard library uses exactly this structure.<\/span> <span class=\"sg\" data-s=\"4\">Names like <code>IO::Socket::INET<\/code> are nested namespaces.<\/span> <span class=\"sg\" data-s=\"5\">Your own modules can work like this too.<\/span> <span class=\"sg\" data-s=\"6\">They keep all their parts under one top-level name.<\/span><\/p>"]]},"de":{"t":"Namensräume und our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Das Wort <code>our<\/code> macht etwas in seinem Namensraum sichtbar.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable mit <code>my<\/code> ist lexikalisch.<\/span> <span class=\"sg\" data-s=\"2\">Sie ist privat in ihrem Block.<\/span> <span class=\"sg\" data-s=\"3\">Eine Variable mit <code>our<\/code> ist auch eine Package-Variable.<\/span> <span class=\"sg\" data-s=\"4\">Du kommst von außen über den <code>::<\/code>-Pfad an sie heran:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funktioniert.<\/span> <span class=\"sg\" data-s=\"1\">Die Variable <code>count<\/code> hat <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber <code>$Counter::secret<\/code> funktioniert nicht.<\/span> <span class=\"sg\" data-s=\"3\">Die Variable <code>secret<\/code> ist lexikalisch.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Namensräume kann man <strong>verschachteln<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Das heißt, ein Namensraum ist in einem anderen.<\/span> <span class=\"sg\" data-s=\"2\">Ein Package in einem Package ergibt einen längeren <code>::<\/code>-Pfad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Der volle Name <code>$Outer::Inner::val<\/code> ist wie ein Pfad.<\/span> <span class=\"sg\" data-s=\"1\">Er geht vom äußeren Namensraum in den inneren.<\/span> <span class=\"sg\" data-s=\"2\">Dann geht er zur Variable.<\/span> <span class=\"sg\" data-s=\"3\">Die Standardbibliothek benutzt genau diesen Aufbau.<\/span> <span class=\"sg\" data-s=\"4\">Namen wie <code>IO::Socket::INET<\/code> sind verschachtelte Namensräume.<\/span> <span class=\"sg\" data-s=\"5\">Deine eigenen Module können auch so arbeiten.<\/span> <span class=\"sg\" data-s=\"6\">Sie halten alle ihre Teile unter einem gemeinsamen Hauptnamen.<\/span><\/p>"]]},"nl":{"t":"Naamruimten en our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Het woord <code>our<\/code> maakt iets zichtbaar in zijn naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele met <code>my<\/code> is lexicaal.<\/span> <span class=\"sg\" data-s=\"2\">Hij is privé voor zijn blok.<\/span> <span class=\"sg\" data-s=\"3\">Een variabele met <code>our<\/code> is ook een pakketvariabele.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt er van buitenaf bij via het <code>::<\/code>-pad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> werkt.<\/span> <span class=\"sg\" data-s=\"1\">De variabele <code>count<\/code> heeft <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar <code>$Counter::secret<\/code> mislukt.<\/span> <span class=\"sg\" data-s=\"3\">De variabele <code>secret<\/code> is lexicaal.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Naamruimten kunnen <strong>genest<\/strong> worden.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat de ene naamruimte in de andere zit.<\/span> <span class=\"sg\" data-s=\"2\">Een pakket in een pakket maakt een langer <code>::<\/code>-pad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">De volledige naam <code>$Outer::Inner::val<\/code> is als een pad.<\/span> <span class=\"sg\" data-s=\"1\">Hij gaat van de buitenste naamruimte naar de binnenste.<\/span> <span class=\"sg\" data-s=\"2\">Dan gaat hij naar de variabele.<\/span> <span class=\"sg\" data-s=\"3\">De standaardbibliotheek gebruikt precies deze opbouw.<\/span> <span class=\"sg\" data-s=\"4\">Namen zoals <code>IO::Socket::INET<\/code> zijn geneste naamruimten.<\/span> <span class=\"sg\" data-s=\"5\">Je eigen modules kunnen ook zo werken.<\/span> <span class=\"sg\" data-s=\"6\">Ze houden al hun onderdelen onder één naam op het hoogste niveau.<\/span><\/p>"]]},"es":{"t":"Espacios de nombres y our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La palabra <code>our<\/code> hace visible algo en su espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Una variable con <code>my<\/code> es léxica.<\/span> <span class=\"sg\" data-s=\"2\">Es privada para su bloque.<\/span> <span class=\"sg\" data-s=\"3\">Una variable con <code>our<\/code> también es una variable de paquete.<\/span> <span class=\"sg\" data-s=\"4\">Puedes llegar a ella desde fuera por la ruta <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funciona.<\/span> <span class=\"sg\" data-s=\"1\">La variable <code>count<\/code> tiene <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero <code>$Counter::secret<\/code> falla.<\/span> <span class=\"sg\" data-s=\"3\">La variable <code>secret<\/code> es léxica.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los espacios de nombres pueden <strong>anidarse<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que un espacio de nombres está dentro de otro.<\/span> <span class=\"sg\" data-s=\"2\">Un paquete dentro de un paquete crea una ruta <code>::<\/code> más larga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">El nombre completo <code>$Outer::Inner::val<\/code> es como un camino.<\/span> <span class=\"sg\" data-s=\"1\">Va del espacio de nombres externo al interno.<\/span> <span class=\"sg\" data-s=\"2\">Luego llega a la variable.<\/span> <span class=\"sg\" data-s=\"3\">La biblioteca estándar usa justo esta estructura.<\/span> <span class=\"sg\" data-s=\"4\">Nombres como <code>IO::Socket::INET<\/code> son espacios de nombres anidados.<\/span> <span class=\"sg\" data-s=\"5\">Tus propios módulos también pueden funcionar así.<\/span> <span class=\"sg\" data-s=\"6\">Guardan todas sus partes bajo un nombre de nivel superior.<\/span><\/p>"]]},"it":{"t":"Namespace e our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La parola <code>our<\/code> rende qualcosa visibile nel suo namespace.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile con <code>my<\/code> è lessicale.<\/span> <span class=\"sg\" data-s=\"2\">È privata al suo blocco.<\/span> <span class=\"sg\" data-s=\"3\">Una variabile con <code>our<\/code> è anche una variabile di package.<\/span> <span class=\"sg\" data-s=\"4\">Puoi arrivarci dall'esterno attraverso il percorso <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funziona.<\/span> <span class=\"sg\" data-s=\"1\">La variabile <code>count<\/code> ha <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma <code>$Counter::secret<\/code> non funziona.<\/span> <span class=\"sg\" data-s=\"3\">La variabile <code>secret<\/code> è lessicale.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I namespace possono essere <strong>annidati<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Questo vuol dire che un namespace è dentro un altro.<\/span> <span class=\"sg\" data-s=\"2\">Un package dentro un package crea un percorso <code>::<\/code> più lungo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il nome completo <code>$Outer::Inner::val<\/code> è come un percorso.<\/span> <span class=\"sg\" data-s=\"1\">Va dal namespace esterno a quello interno.<\/span> <span class=\"sg\" data-s=\"2\">Poi va alla variabile.<\/span> <span class=\"sg\" data-s=\"3\">La libreria standard usa proprio questa struttura.<\/span> <span class=\"sg\" data-s=\"4\">Nomi come <code>IO::Socket::INET<\/code> sono namespace annidati.<\/span> <span class=\"sg\" data-s=\"5\">Anche i tuoi moduli possono funzionare così.<\/span> <span class=\"sg\" data-s=\"6\">Tengono tutte le loro parti sotto un unico nome di primo livello.<\/span><\/p>"]]},"lv":{"t":"Vārdtelpas un our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vārds <code>our<\/code> padara kaut ko redzamu tā vārdtelpā.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais ar <code>my<\/code> ir leksisks.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir privāts savam blokam.<\/span> <span class=\"sg\" data-s=\"3\">Mainīgais ar <code>our<\/code> ir arī pakotnes mainīgais.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat tam piekļūt no ārpuses caur <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> darbojas.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgajam <code>count<\/code> ir <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet <code>$Counter::secret<\/code> nedarbojas.<\/span> <span class=\"sg\" data-s=\"3\">Mainīgais <code>secret<\/code> ir leksisks.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vārdtelpas var būt <strong>ligzdotas<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka viena vārdtelpa ir otras iekšienē.<\/span> <span class=\"sg\" data-s=\"2\">Pakotne pakotnes iekšienē veido garāku <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Pilnais nosaukums <code>$Outer::Inner::val<\/code> ir kā ceļš.<\/span> <span class=\"sg\" data-s=\"1\">Tas ved no ārējās vārdtelpas uz iekšējo.<\/span> <span class=\"sg\" data-s=\"2\">Tad tas ved līdz mainīgajam.<\/span> <span class=\"sg\" data-s=\"3\">Standarta bibliotēka izmanto tieši šādu uzbūvi.<\/span> <span class=\"sg\" data-s=\"4\">Tādi nosaukumi kā <code>IO::Socket::INET<\/code> ir ligzdotas vārdtelpas.<\/span> <span class=\"sg\" data-s=\"5\">Arī jūsu pašu moduļi var darboties šādi.<\/span> <span class=\"sg\" data-s=\"6\">Tie tur visas savas daļas zem viena augstākā līmeņa nosaukuma.<\/span><\/p>"]]},"ru":{"t":"Пространства имён и our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Слово <code>our<\/code> делает что-то видимым в его пространстве имён.<\/span> <span class=\"sg\" data-s=\"1\">Переменная с <code>my<\/code> — лексическая.<\/span> <span class=\"sg\" data-s=\"2\">Она приватная для своего блока.<\/span> <span class=\"sg\" data-s=\"3\">Переменная с <code>our<\/code> — это ещё и переменная пакета.<\/span> <span class=\"sg\" data-s=\"4\">До неё можно добраться снаружи через путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работает.<\/span> <span class=\"sg\" data-s=\"1\">У переменной <code>count<\/code> есть <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$Counter::secret<\/code> не работает.<\/span> <span class=\"sg\" data-s=\"3\">Переменная <code>secret<\/code> — лексическая.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пространства имён могут быть <strong>вложенными<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что одно пространство имён лежит внутри другого.<\/span> <span class=\"sg\" data-s=\"2\">Пакет внутри пакета даёт более длинный путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Полное имя <code>$Outer::Inner::val<\/code> похоже на путь.<\/span> <span class=\"sg\" data-s=\"1\">Этот путь идёт от внешнего пространства имён во внутреннее.<\/span> <span class=\"sg\" data-s=\"2\">Потом он идёт к переменной.<\/span> <span class=\"sg\" data-s=\"3\">Стандартная библиотека использует именно эту схему.<\/span> <span class=\"sg\" data-s=\"4\">Имена вроде <code>IO::Socket::INET<\/code> — это вложенные пространства имён.<\/span> <span class=\"sg\" data-s=\"5\">Ваши модули тоже могут так работать.<\/span> <span class=\"sg\" data-s=\"6\">Они держат все свои части под одним именем верхнего уровня.<\/span><\/p>"]]},"uk":{"t":"Простори імен та our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Слово <code>our<\/code> робить щось видимим у його просторі імен.<\/span> <span class=\"sg\" data-s=\"1\">Змінна з <code>my<\/code> є лексичною.<\/span> <span class=\"sg\" data-s=\"2\">Вона приватна для свого блоку.<\/span> <span class=\"sg\" data-s=\"3\">Змінна з <code>our<\/code> — це ще й змінна пакунка.<\/span> <span class=\"sg\" data-s=\"4\">До неї можна дістатися ззовні через шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # змінна пакунка\n    my  $secret = 42; # лексична, ззовні не видима\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> працює.<\/span> <span class=\"sg\" data-s=\"1\">Змінна <code>count<\/code> має <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але <code>$Counter::secret<\/code> не працює.<\/span> <span class=\"sg\" data-s=\"3\">Змінна <code>secret<\/code> — лексична.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Простори імен можуть <strong>вкладатися<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що один простір імен лежить усередині іншого.<\/span> <span class=\"sg\" data-s=\"2\">Пакунок у пакунку дає довший шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Повне ім'я <code>$Outer::Inner::val<\/code> схоже на шлях.<\/span> <span class=\"sg\" data-s=\"1\">Воно веде із зовнішнього простору імен у внутрішній.<\/span> <span class=\"sg\" data-s=\"2\">Потім воно веде до змінної.<\/span> <span class=\"sg\" data-s=\"3\">Стандартна бібліотека має саме таку будову.<\/span> <span class=\"sg\" data-s=\"4\">Імена на кшталт <code>IO::Socket::INET<\/code> — це вкладені простори імен.<\/span> <span class=\"sg\" data-s=\"5\">Ваші власні модулі теж можуть так працювати.<\/span> <span class=\"sg\" data-s=\"6\">Вони тримають усі свої частини під одним іменем верхнього рівня.<\/span><\/p>"]]},"bg":{"t":"Пространства от имена и our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Думата <code>our<\/code> прави нещо видимо в неговото пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Променлива с <code>my<\/code> е лексикална.<\/span> <span class=\"sg\" data-s=\"2\">Тя е частна за своя блок.<\/span> <span class=\"sg\" data-s=\"3\">Променлива с <code>our<\/code> е също и пакетна променлива.<\/span> <span class=\"sg\" data-s=\"4\">Можете да стигнете до нея отвън чрез пътя с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работи.<\/span> <span class=\"sg\" data-s=\"1\">Променливата <code>count<\/code> има <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но <code>$Counter::secret<\/code> не работи.<\/span> <span class=\"sg\" data-s=\"3\">Променливата <code>secret<\/code> е лексикална.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пространствата от имена могат да бъдат <strong>вложени<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Това значи, че едно пространство от имена е вътре в друго.<\/span> <span class=\"sg\" data-s=\"2\">Пакет вътре в пакет прави по-дълъг път с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Пълното име <code>$Outer::Inner::val<\/code> е като път.<\/span> <span class=\"sg\" data-s=\"1\">То води от външното пространство от имена към вътрешното.<\/span> <span class=\"sg\" data-s=\"2\">След това води до променливата.<\/span> <span class=\"sg\" data-s=\"3\">Стандартната библиотека използва точно тази структура.<\/span> <span class=\"sg\" data-s=\"4\">Имена като <code>IO::Socket::INET<\/code> са вложени пространства от имена.<\/span> <span class=\"sg\" data-s=\"5\">Вашите модули също могат да работят така.<\/span> <span class=\"sg\" data-s=\"6\">Те държат всичките си части под едно име от най-високо ниво.<\/span><\/p>"]]},"eo":{"t":"Nomspacoj kaj our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La vorto <code>our<\/code> faras ion videbla en ĝia nomspaco.<\/span> <span class=\"sg\" data-s=\"1\">Variablo kun <code>my<\/code> estas leksika.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas privata en sia bloko.<\/span> <span class=\"sg\" data-s=\"3\">Variablo kun <code>our<\/code> estas ankaŭ paka variablo.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas atingi ĝin de ekstere per la vojo <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # paka variablo\n    my  $secret = 42; # leksika, ne videbla ekstere\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funkcias.<\/span> <span class=\"sg\" data-s=\"1\">La variablo <code>count<\/code> havas <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>$Counter::secret<\/code> ne funkcias.<\/span> <span class=\"sg\" data-s=\"3\">La variablo <code>secret<\/code> estas leksika.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomspacoj povas <strong>nestiĝi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke unu nomspaco estas en alia.<\/span> <span class=\"sg\" data-s=\"2\">Pako en pako faras pli longan vojon <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La plena nomo <code>$Outer::Inner::val<\/code> estas kiel vojo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi iras de la ekstera nomspaco en la internan.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi iras al la variablo.<\/span> <span class=\"sg\" data-s=\"3\">La norma biblioteko uzas ĝuste ĉi tiun strukturon.<\/span> <span class=\"sg\" data-s=\"4\">Nomoj kiel <code>IO::Socket::INET<\/code> estas nestitaj nomspacoj.<\/span> <span class=\"sg\" data-s=\"5\">Ankaŭ viaj propraj moduloj povas funkcii tiel.<\/span> <span class=\"sg\" data-s=\"6\">Ili tenas ĉiujn siajn partojn sub unu supra nomo.<\/span><\/p>"]]},"la":{"t":"Spatia nominum et our","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Verbum <code>our<\/code> aliquid in spatio nominum suo visibile facit.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis cum <code>my<\/code> lexicalis est.<\/span> <span class=\"sg\" data-s=\"2\">Privata suo blocco est.<\/span> <span class=\"sg\" data-s=\"3\">Variabilis cum <code>our<\/code> etiam variabilis fasciculi est.<\/span> <span class=\"sg\" data-s=\"4\">Ad eam ab extra per viam <code>::<\/code> pervenire potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis <code>count<\/code> <code>our<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>$Counter::secret<\/code> non operatur.<\/span> <span class=\"sg\" data-s=\"3\">Variabilis <code>secret<\/code> lexicalis est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Spatia nominum <strong>nidificari<\/strong> possunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: unum spatium nominum intra alterum est.<\/span> <span class=\"sg\" data-s=\"2\">Fasciculus intra fasciculum longiorem viam <code>::<\/code> facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Nomen plenum <code>$Outer::Inner::val<\/code> est sicut via.<\/span> <span class=\"sg\" data-s=\"1\">Ab exteriore spatio nominum in interius it.<\/span> <span class=\"sg\" data-s=\"2\">Deinde ad variabilem it.<\/span> <span class=\"sg\" data-s=\"3\">Bibliotheca ordinaria exacte hanc structuram adhibet.<\/span> <span class=\"sg\" data-s=\"4\">Nomina ut <code>IO::Socket::INET<\/code> sunt spatia nominum nidificata.<\/span> <span class=\"sg\" data-s=\"5\">Moduli tui quoque sic operari possunt.<\/span> <span class=\"sg\" data-s=\"6\">Omnes partes suas sub uno nomine summo servant.<\/span><\/p>"]]}}}</script>
