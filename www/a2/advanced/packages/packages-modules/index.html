<script type="application/json" id="page-data">{"u":"advanced/packages/packages-modules","n":725,"k":"topic","pv":"advanced/packages","nx":"advanced/packages/packages-modules/quiz","tr":["advanced","advanced/packages"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Packages and modules","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The keyword <code>package<\/code> creates a namespace.<\/span> <span class=\"sg\" data-s=\"1\">Inside it, you can create things with <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">They become part of the namespace.<\/span> <span class=\"sg\" data-s=\"3\">You can get to them from outside.<\/span> <span class=\"sg\" data-s=\"4\">Use the name of the package and the separator <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You get the variable as <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">First comes the sigil, then the package name, then the variable name.<\/span> <span class=\"sg\" data-s=\"2\">You call a subroutine as <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Both <code>package<\/code> and <code>module<\/code> create a namespace.<\/span> <span class=\"sg\" data-s=\"1\">But they also do different things.<\/span> <span class=\"sg\" data-s=\"2\">A <code>module<\/code> is the usual choice for code that you use again.<\/span> <span class=\"sg\" data-s=\"3\">A simple <code>package<\/code> is only the namespace, with nothing more.<\/span> <span class=\"sg\" data-s=\"4\">A <code>class<\/code> also creates a namespace.<\/span> <span class=\"sg\" data-s=\"5\">You will learn about classes in <a href=\"/oop/\">the next part<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">A class also adds the tools for objects.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">So <code>module<\/code> gives you a namespace.<\/span> <span class=\"sg\" data-s=\"1\">A <code>package<\/code> alone gives you the same kind of namespace.<\/span> <span class=\"sg\" data-s=\"2\">Choose between them by what you want to do.<\/span> <span class=\"sg\" data-s=\"3\">Use <code>module<\/code> for libraries.<\/span> <span class=\"sg\" data-s=\"4\">Use <code>package<\/code> for just a namespace.<\/span> <span class=\"sg\" data-s=\"5\">Later, with objects, use <code>class<\/code> for types.<\/span><\/p>"]]},"de":{"t":"Pakete und Module","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Das Schlüsselwort <code>package<\/code> erzeugt einen Namensraum.<\/span> <span class=\"sg\" data-s=\"1\">Darin kannst du Dinge mit <code>our<\/code> erzeugen.<\/span> <span class=\"sg\" data-s=\"2\">Sie werden Teil des Namensraums.<\/span> <span class=\"sg\" data-s=\"3\">Du kommst von außen an sie heran.<\/span> <span class=\"sg\" data-s=\"4\">Benutze dafür den Namen des Packages und den Trenner <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du bekommst die Variable als <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zuerst kommt das Sigil, dann der Package-Name, dann der Variablenname.<\/span> <span class=\"sg\" data-s=\"2\">Eine Subroutine rufst du als <code>Maths::double(...)<\/code> auf.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>package<\/code> und <code>module<\/code> erzeugen beide einen Namensraum.<\/span> <span class=\"sg\" data-s=\"1\">Aber sie machen auch verschiedene Dinge.<\/span> <span class=\"sg\" data-s=\"2\">Ein <code>module<\/code> ist die normale Wahl für Code, den du wieder benutzt.<\/span> <span class=\"sg\" data-s=\"3\">Ein einfaches <code>package<\/code> ist nur der Namensraum, ohne mehr.<\/span> <span class=\"sg\" data-s=\"4\">Eine <code>class<\/code> erzeugt auch einen Namensraum.<\/span> <span class=\"sg\" data-s=\"5\">Klassen lernst du im <a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">nächsten Teil<\/a> kennen.<\/span> <span class=\"sg\" data-s=\"6\">Eine Klasse fügt auch die Werkzeuge für Objekte hinzu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>module<\/code> gibt dir also einen Namensraum.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>package<\/code> allein gibt dir die gleiche Art von Namensraum.<\/span> <span class=\"sg\" data-s=\"2\">Wähle zwischen ihnen danach, was du machen willst.<\/span> <span class=\"sg\" data-s=\"3\">Benutze <code>module<\/code> für Bibliotheken.<\/span> <span class=\"sg\" data-s=\"4\">Benutze <code>package<\/code> für einen einfachen Namensraum.<\/span> <span class=\"sg\" data-s=\"5\">Später, mit Objekten, benutze <code>class<\/code> für Typen.<\/span><\/p>"]]},"nl":{"t":"Pakketten en modules","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Het sleutelwoord <code>package<\/code> maakt een naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Daarin kun je dingen maken met <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ze worden deel van de naamruimte.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt er van buitenaf bij.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik de naam van het pakket en het scheidingsteken <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je krijgt de variabele als <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eerst komt de sigil, dan de pakketnaam, dan de naam van de variabele.<\/span> <span class=\"sg\" data-s=\"2\">Je roept een subroutine aan als <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Zowel <code>package<\/code> als <code>module<\/code> maken een naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Maar ze doen ook verschillende dingen.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>module<\/code> is de gewone keuze voor code die je opnieuw gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">Een gewoon <code>package<\/code> is alleen de naamruimte, zonder meer.<\/span> <span class=\"sg\" data-s=\"4\">Een <code>class<\/code> maakt ook een naamruimte.<\/span> <span class=\"sg\" data-s=\"5\">Over klassen leer je meer in <a href=\"https://course.raku.org/nl/oop/\" target=\"_blank\" rel=\"noopener\">het volgende deel<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Een klasse voegt ook de hulpmiddelen voor objecten toe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <code>module<\/code> geeft je dus een naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>package<\/code> alleen geeft je dezelfde soort naamruimte.<\/span> <span class=\"sg\" data-s=\"2\">Wat je kiest, hangt af van je doel.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik <code>module<\/code> voor bibliotheken.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik <code>package<\/code> voor alleen een naamruimte.<\/span> <span class=\"sg\" data-s=\"5\">Later, met objecten, gebruik je <code>class<\/code> voor typen.<\/span><\/p>"]]},"es":{"t":"Paquetes y módulos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La palabra clave <code>package<\/code> crea un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Dentro de él, puedes crear cosas con <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pasan a ser parte del espacio de nombres.<\/span> <span class=\"sg\" data-s=\"3\">Puedes llegar a ellas desde fuera.<\/span> <span class=\"sg\" data-s=\"4\">Usa el nombre del paquete y el separador <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Obtienes la variable como <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Primero va el sigilo, luego el nombre del paquete y luego el nombre de la variable.<\/span> <span class=\"sg\" data-s=\"2\">Llamas a una subrutina como <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tanto <code>package<\/code> como <code>module<\/code> crean un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Pero también hacen cosas diferentes.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>module<\/code> es la opción habitual para código que usas otra vez.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>package<\/code> simple es solo el espacio de nombres, sin nada más.<\/span> <span class=\"sg\" data-s=\"4\">Una <code>class<\/code> también crea un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"5\">Aprenderás sobre las clases en <a href=\"https://course.raku.org/es/oop/\" target=\"_blank\" rel=\"noopener\">la siguiente parte<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Una clase también añade las herramientas para los objetos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Así que <code>module<\/code> te da un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>package<\/code> por sí solo te da el mismo tipo de espacio de nombres.<\/span> <span class=\"sg\" data-s=\"2\">Elige entre ellos según lo que quieres hacer.<\/span> <span class=\"sg\" data-s=\"3\">Usa <code>module<\/code> para bibliotecas.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>package<\/code> solo para un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"5\">Más adelante, con objetos, usa <code>class<\/code> para tipos.<\/span><\/p>"]]},"it":{"t":"Pacchetti e moduli","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La parola chiave <code>package<\/code> crea un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Dentro, puoi creare cose con <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Diventano parte del namespace.<\/span> <span class=\"sg\" data-s=\"3\">Puoi arrivarci dall'esterno.<\/span> <span class=\"sg\" data-s=\"4\">Usa il nome del package e il separatore <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ottieni la variabile come <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prima viene il sigillo, poi il nome del package, poi il nome della variabile.<\/span> <span class=\"sg\" data-s=\"2\">Chiami una subroutine come <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Sia <code>package<\/code> sia <code>module<\/code> creano un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Ma fanno anche cose diverse.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>module<\/code> è la scelta normale per il codice che usi di nuovo.<\/span> <span class=\"sg\" data-s=\"3\">Un semplice <code>package<\/code> è solo il namespace, senza niente in più.<\/span> <span class=\"sg\" data-s=\"4\">Anche una <code>class<\/code> crea un namespace.<\/span> <span class=\"sg\" data-s=\"5\">Parliamo delle classi nella <a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">prossima parte<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Una classe aggiunge anche gli strumenti per gli oggetti.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>module<\/code> ti dà un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>package<\/code> da solo ti dà lo stesso tipo di namespace.<\/span> <span class=\"sg\" data-s=\"2\">Scegli tra i due in base a quello che vuoi fare.<\/span> <span class=\"sg\" data-s=\"3\">Usa <code>module<\/code> per le librerie.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>package<\/code> per avere solo un namespace.<\/span> <span class=\"sg\" data-s=\"5\">Più avanti, con gli oggetti, usa <code>class<\/code> per i tipi.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un moduļi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Atslēgvārds <code>package<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Tajā jūs varat izveidot lietas ar <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tās kļūst par vārdtelpas daļu.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat tām piekļūt no ārpuses.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet pakotnes nosaukumu un atdalītāju <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mainīgo jūs iegūstat kā <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms ir sigils, tad pakotnes nosaukums, tad mainīgā nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogrammu jūs izsaucat kā <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Gan <code>package<\/code>, gan <code>module<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Bet tie dara arī dažādas lietas.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> ir parastā izvēle kodam, ko izmantojat atkārtoti.<\/span> <span class=\"sg\" data-s=\"3\">Vienkāršs <code>package<\/code> ir tikai vārdtelpa, bez nekā vairāk.<\/span> <span class=\"sg\" data-s=\"4\">Arī <code>class<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"5\">Par klasēm jūs uzzināsiet <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">nākamajā daļā<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Klase pievieno arī rīkus objektiem.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>module<\/code> jums dod vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Arī <code>package<\/code> viens pats dod tādu pašu vārdtelpu.<\/span> <span class=\"sg\" data-s=\"2\">Izvēlieties starp tiem pēc tā, ko vēlaties darīt.<\/span> <span class=\"sg\" data-s=\"3\">Izmantojiet <code>module<\/code> bibliotēkām.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet <code>package<\/code> tikai vārdtelpai.<\/span> <span class=\"sg\" data-s=\"5\">Vēlāk, ar objektiem, izmantojiet <code>class<\/code> tipiem.<\/span><\/p>"]]},"ru":{"t":"Пакеты и модули","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ключевое слово <code>package<\/code> создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"1\">Внутри него можно создавать вещи с <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Они становятся частью пространства имён.<\/span> <span class=\"sg\" data-s=\"3\">До них можно добраться снаружи.<\/span> <span class=\"sg\" data-s=\"4\">Используйте имя пакета и разделитель <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Переменную вы получаете как <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сначала идёт сигил, потом имя пакета, потом имя переменной.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмму вы вызываете как <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> создают пространство имён.<\/span> <span class=\"sg\" data-s=\"1\">Но ещё они делают разные вещи.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> — обычный выбор для кода, который вы используете снова.<\/span> <span class=\"sg\" data-s=\"3\">Простой <code>package<\/code> — это только пространство имён, и больше ничего.<\/span> <span class=\"sg\" data-s=\"4\"><code>class<\/code> тоже создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"5\">О классах вы узнаете в <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">следующей части<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Ещё класс добавляет инструменты для объектов.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>module<\/code> даёт вам пространство имён.<\/span> <span class=\"sg\" data-s=\"1\"><code>package<\/code> сам по себе даёт такое же пространство имён.<\/span> <span class=\"sg\" data-s=\"2\">Выбирайте между ними по тому, что вы хотите сделать.<\/span> <span class=\"sg\" data-s=\"3\">Используйте <code>module<\/code> для библиотек.<\/span> <span class=\"sg\" data-s=\"4\">Используйте <code>package<\/code> для простого пространства имён.<\/span> <span class=\"sg\" data-s=\"5\">Позже, с объектами, используйте <code>class<\/code> для типов.<\/span><\/p>"]]},"uk":{"t":"Пакунки та модулі","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ключове слово <code>package<\/code> створює простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Усередині нього ви можете створювати речі через <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вони стають частиною простору імен.<\/span> <span class=\"sg\" data-s=\"3\">До них можна дістатися ззовні.<\/span> <span class=\"sg\" data-s=\"4\">Використайте ім'я пакунка й роздільник <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Змінну ви отримуєте як <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Спершу йде сигіл, потім ім'я пакунка, потім ім'я змінної.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограму ви викликаєте як <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">І <code>package<\/code>, і <code>module<\/code> створюють простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Але вони також роблять різні речі.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> — звичайний вибір для коду, який ви використовуєте знову.<\/span> <span class=\"sg\" data-s=\"3\">Простий <code>package<\/code> — це лише простір імен, і нічого більше.<\/span> <span class=\"sg\" data-s=\"4\"><code>class<\/code> теж створює простір імен.<\/span> <span class=\"sg\" data-s=\"5\">Про класи ви дізнаєтеся в <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">наступній частині<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Клас ще й додає інструменти для об'єктів.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>module<\/code> дає вам простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Сам <code>package<\/code> дає такий самий простір імен.<\/span> <span class=\"sg\" data-s=\"2\">Вибирайте між ними за тим, що ви хочете зробити.<\/span> <span class=\"sg\" data-s=\"3\">Використовуйте <code>module<\/code> для бібліотек.<\/span> <span class=\"sg\" data-s=\"4\">Використовуйте <code>package<\/code>, коли потрібен лише простір імен.<\/span> <span class=\"sg\" data-s=\"5\">Пізніше, з об'єктами, використовуйте <code>class<\/code> для типів.<\/span><\/p>"]]},"bg":{"t":"Пакети и модули","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ключовата дума <code>package<\/code> създава пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в него можете да създавате неща с <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Те стават част от пространството от имена.<\/span> <span class=\"sg\" data-s=\"3\">Можете да стигнете до тях отвън.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте името на пакета и разделителя <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стигате до променливата като <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Първо идва сигилът, после името на пакета, после името на променливата.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате подпрограма като <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> създават пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Но те правят и различни неща.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> е обичайният избор за код, който използвате отново.<\/span> <span class=\"sg\" data-s=\"3\">Обикновеният <code>package<\/code> е само пространство от имена, без нищо повече.<\/span> <span class=\"sg\" data-s=\"4\"><code>class<\/code> също създава пространство от имена.<\/span> <span class=\"sg\" data-s=\"5\">За класовете ще научите в <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">следващата част<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Класът добавя и инструментите за обекти.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Значи <code>module<\/code> ви дава пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\"><code>package<\/code> сам по себе си ви дава същия вид пространство от имена.<\/span> <span class=\"sg\" data-s=\"2\">Избирайте между тях според това, което искате да направите.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте <code>module<\/code> за библиотеки.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте <code>package<\/code> само за пространство от имена.<\/span> <span class=\"sg\" data-s=\"5\">По-късно, с обектите, използвайте <code>class<\/code> за типове.<\/span><\/p>"]]},"eo":{"t":"Pakoj kaj moduloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La ŝlosilvorto <code>package<\/code> kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"1\">En ĝi, vi povas krei aferojn per <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ili fariĝas parto de la nomspaco.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas atingi ilin de ekstere.<\/span> <span class=\"sg\" data-s=\"4\">Uzu la nomon de la pako kaj la apartigilon <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi atingas la variablon kiel <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unue venas la sigelo, poste la nomo de la pako, poste la nomo de la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas subrutinon kiel <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>package<\/code> kaj <code>module<\/code> kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ili ankaŭ faras malsamajn aferojn.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> estas la kutima elekto por kodo, kiun vi uzas denove.<\/span> <span class=\"sg\" data-s=\"3\">Simpla <code>package<\/code> estas nur la nomspaco, kun nenio plia.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ <code>class<\/code> kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"5\">Vi lernas pri klasoj en <a href=\"https://course.raku.org/eo/oop/\" target=\"_blank\" rel=\"noopener\">la sekva parto<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Klaso ankaŭ aldonas la ilojn por objektoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Do <code>module<\/code> donas al vi nomspacon.<\/span> <span class=\"sg\" data-s=\"1\"><code>package<\/code> sola donas al vi la saman specon de nomspaco.<\/span> <span class=\"sg\" data-s=\"2\">Elektu inter ili laŭ tio, kion vi volas fari.<\/span> <span class=\"sg\" data-s=\"3\">Uzu <code>module<\/code> por bibliotekoj.<\/span> <span class=\"sg\" data-s=\"4\">Uzu <code>package<\/code> por nur nomspaco.<\/span> <span class=\"sg\" data-s=\"5\">Poste, kun objektoj, uzu <code>class<\/code> por tipoj.<\/span><\/p>"]]},"la":{"t":"Fasciculi et moduli","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Verbum clave <code>package<\/code> spatium nominum creat.<\/span> <span class=\"sg\" data-s=\"1\">Intra id res cum <code>our<\/code> creare potes.<\/span> <span class=\"sg\" data-s=\"2\">Partes spatii nominum fiunt.<\/span> <span class=\"sg\" data-s=\"3\">Ab extra ad eas pervenire potes.<\/span> <span class=\"sg\" data-s=\"4\">Nomine fasciculi et separatore <code>::<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Variabilem ut <code>$Maths::pi<\/code> accipis.<\/span> <span class=\"sg\" data-s=\"1\">Primum venit sigillum, deinde nomen fasciculi, deinde nomen variabilis.<\/span> <span class=\"sg\" data-s=\"2\">Subroutinam ut <code>Maths::double(...)<\/code> vocas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Et <code>package<\/code> et <code>module<\/code> spatium nominum creant.<\/span> <span class=\"sg\" data-s=\"1\">Sed etiam diversa faciunt.<\/span> <span class=\"sg\" data-s=\"2\"><code>module<\/code> est electio usitata pro codice quem iterum adhibes.<\/span> <span class=\"sg\" data-s=\"3\">Simplex <code>package<\/code> est solum spatium nominum, nihil amplius.<\/span> <span class=\"sg\" data-s=\"4\"><code>class<\/code> quoque spatium nominum creat.<\/span> <span class=\"sg\" data-s=\"5\">De classibus in <a href=\"https://course.raku.org/la/oop/\" target=\"_blank\" rel=\"noopener\">parte sequente<\/a> disces.<\/span> <span class=\"sg\" data-s=\"6\">Classis etiam instrumenta pro obiectis addit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>module<\/code> tibi spatium nominum dat.<\/span> <span class=\"sg\" data-s=\"1\"><code>package<\/code> per se tibi idem genus spatii nominum dat.<\/span> <span class=\"sg\" data-s=\"2\">Inter ea elige secundum id quod facere vis.<\/span> <span class=\"sg\" data-s=\"3\">Pro bibliothecis <code>module<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"4\">Pro solo spatio nominum <code>package<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"5\">Postea, cum obiectis, <code>class<\/code> pro typis adhibe.<\/span><\/p>"]]}}}</script>
