>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І змінна, і підпрограма мають <code>our<\/code>. Тож обидві є частиною простору імен <code>Temperature<\/code>. Код ззовні пакунка може дістатися до них.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Змінну ви отримуєте через <code>$Temperature::freezing<\/code>. Спершу йде сигіл, потім ім'я пакунка, потім ім'я змінної. Підпрограму ви викликаєте як <code>Temperature::fahrenheit(100)<\/code>. Для <code>100<\/code> вона обчислює <code>100 * 9/5 + 32<\/code>. Результат — <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Простий <code>package<\/code> дає лише простір імен. Для бібліотеки ми взяли б натомість <code>module<\/code>. Бібліотеку можна використовувати знову і знову. Пізніше, з об'єктами, ми взяли б <code>class<\/code>. Але простір імен працює однаково в усіх цих випадках.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Пакет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И променливата, и подпрограмата имат <code>our<\/code>. Затова и двете са част от пространството от имена <code>Temperature<\/code>. Код извън пакета може да стигне до тях.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Стигате до променливата с <code>$Temperature::freezing<\/code>. Първо идва сигилът, после името на пакета, после името на променливата. Извиквате подпрограмата като <code>Temperature::fahrenheit(100)<\/code>. За <code>100<\/code> тя изчислява <code>100 * 9/5 + 32<\/code>. Резултатът е <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обикновеният <code>package<\/code> дава само пространството от имена. За библиотека бихме използвали <code>module<\/code> вместо това. Библиотеката можете да използвате отново и отново. По-късно, с обектите, бихме използвали <code>class<\/code>. Но пространството от имена работи по същия начин във всички тези случаи.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Pako","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kaj la variablo kaj la subrutino havas <code>our<\/code>. Do ambaŭ estas parto de la nomspaco <code>Temperature<\/code>. Kodo ekster la pako povas atingi ilin.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi atingas la variablon per <code>$Temperature::freezing<\/code>. Unue venas la sigelo, poste la nomo de la pako, poste la nomo de la variablo. Vi vokas la subrutinon kiel <code>Temperature::fahrenheit(100)<\/code>. Por <code>100<\/code>, ĝi kalkulas <code>100 * 9/5 + 32<\/code>. La rezulto estas <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simpla <code>package<\/code> donas nur la nomspacon. Por biblioteko, ni uzus <code>module<\/code> anstataŭe. Oni povas uzi bibliotekon denove kaj denove. Poste, kun objektoj, ni uzus <code>class<\/code>. Sed la nomspaco funkcias same en ĉiuj ĉi tiuj kazoj.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Fasciculus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo opus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Variabilis et subroutina ambae <code>our<\/code> habent. Itaque ambae partes spatii nominum <code>Temperature<\/code> sunt. Codex extra fasciculum ad eas pervenire potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Variabilem per <code>$Temperature::freezing<\/code> accipis. Primum venit sigillum, deinde nomen fasciculi, deinde nomen variabilis. Subroutinam ut <code>Temperature::fahrenheit(100)<\/code> vocas. Pro <code>100<\/code> computat <code>100 * 9/5 + 32<\/code>. Eventus est <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simplex <code>package<\/code> solum spatium nominum dat. Pro bibliotheca <code>module<\/code> adhiberemus. Bibliothecam iterum atque iterum adhibere potes. Postea, cum obiectis, <code>class<\/code> adhiberemus. Sed spatium nominum in omnibus his casibus eodem modo operatur.<\/span><\/li><\/ol>"]]}}}</script>
