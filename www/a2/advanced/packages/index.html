<script type="application/json" id="page-data">{"u":"advanced/packages","n":724,"k":"section","pv":"advanced/installing-modules","nx":"advanced/packages/packages-modules","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Packages and namespaces","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A <em>namespace<\/em> is a container with a name.<\/span> <span class=\"sg\" data-s=\"1\">It holds other things with names, for example, variables and subroutines.<\/span> <span class=\"sg\" data-s=\"2\">With namespaces, two things can have the same name without a problem.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> and <code>Physics::pi<\/code> can both exist.<\/span> <span class=\"sg\" data-s=\"4\">A <em>package<\/em> is the simplest kind of namespace.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You already used a namespace, but you did not call it that.<\/span> <span class=\"sg\" data-s=\"1\">Every <code>module<\/code> creates one.<\/span> <span class=\"sg\" data-s=\"2\">This section looks at packages directly.<\/span> <span class=\"sg\" data-s=\"3\">It also shows how to get into a namespace from outside.<\/span> <span class=\"sg\" data-s=\"4\">For this, you use <code>our<\/code> variables and the separator <code>::<\/code>.<\/span><\/p>"]]},"de":{"t":"Pakete und Namensräume","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Namensraum<\/em> (Namespace) ist ein Behälter mit einem Namen.<\/span> <span class=\"sg\" data-s=\"1\">Er enthält andere Dinge mit Namen, zum Beispiel Variablen und Subroutinen.<\/span> <span class=\"sg\" data-s=\"2\">Mit Namensräumen können zwei Dinge ohne Problem denselben Namen haben.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> und <code>Physics::pi<\/code> können beide existieren.<\/span> <span class=\"sg\" data-s=\"4\">Ein <em>Package<\/em> ist die einfachste Art von Namensraum.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Du hast schon einen Namensraum benutzt, aber du hast ihn nicht so genannt.<\/span> <span class=\"sg\" data-s=\"1\">Jedes <code>module<\/code> erzeugt einen.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt schaut sich Packages direkt an.<\/span> <span class=\"sg\" data-s=\"3\">Er zeigt auch, wie du von außen in einen Namensraum kommst.<\/span> <span class=\"sg\" data-s=\"4\">Dafür benutzt du <code>our<\/code>-Variablen und den Trenner <code>::<\/code>.<\/span><\/p>"]]},"nl":{"t":"Pakketten en naamruimten","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <em>naamruimte<\/em> (namespace) is een container met een naam.<\/span> <span class=\"sg\" data-s=\"1\">Die bevat andere dingen met een naam, bijvoorbeeld variabelen en subroutines.<\/span> <span class=\"sg\" data-s=\"2\">Met naamruimten kunnen twee dingen zonder probleem dezelfde naam hebben.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> en <code>Physics::pi<\/code> kunnen allebei bestaan.<\/span> <span class=\"sg\" data-s=\"4\">Een <em>pakket<\/em> (package) is de eenvoudigste soort naamruimte.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je hebt al een naamruimte gebruikt, maar je noemde die niet zo.<\/span> <span class=\"sg\" data-s=\"1\">Elke <code>module<\/code> maakt er een.<\/span> <span class=\"sg\" data-s=\"2\">Dit gedeelte kijkt direct naar pakketten.<\/span> <span class=\"sg\" data-s=\"3\">Het laat ook zien hoe je van buitenaf in een naamruimte komt.<\/span> <span class=\"sg\" data-s=\"4\">Daarvoor gebruik je <code>our<\/code>-variabelen en het scheidingsteken <code>::<\/code>.<\/span><\/p>"]]},"es":{"t":"Paquetes y espacios de nombres","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>espacio de nombres<\/em> (namespace) es un contenedor con nombre.<\/span> <span class=\"sg\" data-s=\"1\">Guarda otras cosas con nombre, por ejemplo, variables y subrutinas.<\/span> <span class=\"sg\" data-s=\"2\">Con los espacios de nombres, dos cosas pueden tener el mismo nombre sin problema.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> y <code>Physics::pi<\/code> pueden existir a la vez.<\/span> <span class=\"sg\" data-s=\"4\">Un <em>paquete<\/em> (package) es el tipo más simple de espacio de nombres.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ya has usado un espacio de nombres, pero no lo has llamado así.<\/span> <span class=\"sg\" data-s=\"1\">Cada <code>module<\/code> crea uno.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección mira los paquetes directamente.<\/span> <span class=\"sg\" data-s=\"3\">También muestra cómo entrar en un espacio de nombres desde fuera.<\/span> <span class=\"sg\" data-s=\"4\">Para esto, usas variables <code>our<\/code> y el separador <code>::<\/code>.<\/span><\/p>"]]},"it":{"t":"Pacchetti e namespace","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>namespace<\/em> è un contenitore con un nome.<\/span> <span class=\"sg\" data-s=\"1\">Contiene altre cose con un nome, per esempio variabili e subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Con i namespace, due cose possono avere lo stesso nome senza problemi.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> e <code>Physics::pi<\/code> possono esistere tutte e due.<\/span> <span class=\"sg\" data-s=\"4\">Un <em>package<\/em> è il tipo più semplice di namespace.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hai già usato un namespace, ma non lo hai chiamato così.<\/span> <span class=\"sg\" data-s=\"1\">Ogni <code>module<\/code> ne crea uno.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione guarda direttamente i package.<\/span> <span class=\"sg\" data-s=\"3\">Mostra anche come entrare in un namespace dall'esterno.<\/span> <span class=\"sg\" data-s=\"4\">Per questo usi le variabili <code>our<\/code> e il separatore <code>::<\/code>.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un vārdtelpas 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Vārdtelpa<\/em> (namespace) ir konteiners ar nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā glabā citas lietas ar nosaukumiem, piemēram, mainīgos un apakšprogrammas.<\/span> <span class=\"sg\" data-s=\"2\">Ar vārdtelpām divām lietām bez problēmām var būt vienāds nosaukums.<\/span> <span class=\"sg\" data-s=\"3\">Var pastāvēt gan <code>Maths::pi<\/code>, gan <code>Physics::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vienkāršāko vārdtelpas veidu sauc par <em>pakotni<\/em> (package).<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs jau izmantojāt vārdtelpu, bet nesaucāt to tā.<\/span> <span class=\"sg\" data-s=\"1\">Katrs <code>module<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa aplūko pakotnes tieši.<\/span> <span class=\"sg\" data-s=\"3\">Tā arī parāda, kā piekļūt vārdtelpai no ārpuses.<\/span> <span class=\"sg\" data-s=\"4\">Tam jūs izmantojat <code>our<\/code> mainīgos un atdalītāju <code>::<\/code>.<\/span><\/p>"]]},"ru":{"t":"Пакеты и пространства имён","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Пространство имён<\/em> — это контейнер с именем.<\/span> <span class=\"sg\" data-s=\"1\">В нём лежат другие вещи с именами, например переменные и подпрограммы.<\/span> <span class=\"sg\" data-s=\"2\">С пространствами имён у двух вещей может быть одно и то же имя, и это не проблема.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> и <code>Physics::pi<\/code> могут существовать вместе.<\/span> <span class=\"sg\" data-s=\"4\">Самый простой вид пространства имён — это <em>пакет<\/em>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали пространство имён, но не называли его так.<\/span> <span class=\"sg\" data-s=\"1\">Каждый <code>module<\/code> создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел рассказывает о самих пакетах.<\/span> <span class=\"sg\" data-s=\"3\">Ещё он показывает, как попасть в пространство имён снаружи.<\/span> <span class=\"sg\" data-s=\"4\">Для этого вы используете переменные <code>our<\/code> и разделитель <code>::<\/code>.<\/span><\/p>"]]},"uk":{"t":"Пакунки та простори імен","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Простір імен<\/em> — це контейнер з іменем.<\/span> <span class=\"sg\" data-s=\"1\">Він містить інші речі з іменами, наприклад, змінні й підпрограми.<\/span> <span class=\"sg\" data-s=\"2\">Завдяки просторам імен дві речі можуть мати однакове ім'я без проблем.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> і <code>Physics::pi<\/code> можуть існувати разом.<\/span> <span class=\"sg\" data-s=\"4\">А <em>пакунок<\/em> — це найпростіший вид простору імен.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися простором імен, але не називали його так.<\/span> <span class=\"sg\" data-s=\"1\">Кожен <code>module<\/code> створює такий простір.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ розглядає пакунки напряму.<\/span> <span class=\"sg\" data-s=\"3\">Також він показує, як дістатися до простору імен ззовні.<\/span> <span class=\"sg\" data-s=\"4\">Для цього ви використовуєте змінні <code>our<\/code> і роздільник <code>::<\/code>.<\/span><\/p>"]]},"bg":{"t":"Пакети и пространства от имена 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Пространството от имена<\/em> е контейнер с име.<\/span> <span class=\"sg\" data-s=\"1\">То съдържа други неща с имена, например променливи и подпрограми.<\/span> <span class=\"sg\" data-s=\"2\">С пространствата от имена две неща могат да имат едно и също име без проблем.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> и <code>Physics::pi<\/code> могат да съществуват едновременно.<\/span> <span class=\"sg\" data-s=\"4\">А <em>пакетът<\/em> е най-простият вид пространство от имена.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали пространство от имена, но не сте го наричали така.<\/span> <span class=\"sg\" data-s=\"1\">Всеки <code>module<\/code> създава такова.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел разглежда пакетите директно.<\/span> <span class=\"sg\" data-s=\"3\">Той показва и как да влезете в пространство от имена отвън.<\/span> <span class=\"sg\" data-s=\"4\">За това използвате <code>our<\/code> променливи и разделителя <code>::<\/code>.<\/span><\/p>"]]},"eo":{"t":"Pakoj kaj nomspacoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Nomspaco<\/em> estas ujo kun nomo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi tenas aliajn aferojn kun nomoj, ekzemple variablojn kaj subrutinojn.<\/span> <span class=\"sg\" data-s=\"2\">Per nomspacoj, du aferoj povas havi la saman nomon sen problemo.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> kaj <code>Physics::pi<\/code> povas ambaŭ ekzisti.<\/span> <span class=\"sg\" data-s=\"4\">La <em>pako<\/em> estas la plej simpla speco de nomspaco.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis nomspacon, sed vi ne nomis ĝin tiel.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu <code>module<\/code> kreas unu.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio rigardas pakojn rekte.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ montras, kiel eniri en nomspacon de ekstere.<\/span> <span class=\"sg\" data-s=\"4\">Por tio, vi uzas <code>our<\/code>-variablojn kaj la apartigilon <code>::<\/code>.<\/span><\/p>"]]},"la":{"t":"Fasciculi et spatia nominum","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Spatium nominum<\/em> est receptaculum cum nomine.<\/span> <span class=\"sg\" data-s=\"1\">Alias res cum nominibus continet, exempli gratia variabiles et subroutinas.<\/span> <span class=\"sg\" data-s=\"2\">Per spatia nominum duae res idem nomen habere possunt sine molestia.<\/span> <span class=\"sg\" data-s=\"3\"><code>Maths::pi<\/code> et <code>Physics::pi<\/code> ambo esse possunt.<\/span> <span class=\"sg\" data-s=\"4\">Simplicissimum genus spatii nominum est <em>fasciculus<\/em> (package).<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Spatium nominum iam adhibuisti, sed id non ita vocavisti.<\/span> <span class=\"sg\" data-s=\"1\">Omnis <code>module<\/code> unum creat.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio fasciculos directe inspicit.<\/span> <span class=\"sg\" data-s=\"3\">Etiam ostendit quomodo ab extra in spatium nominum intres.<\/span> <span class=\"sg\" data-s=\"4\">Ad hoc variabiles <code>our<\/code> et separatorem <code>::<\/code> adhibes.<\/span><\/p>"]]}}}</script>
