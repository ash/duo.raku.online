ame!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eseguilo nel modo giusto.<\/span> <span class=\"sg\" data-s=\"1\">Allora saluta la persona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ora eseguilo senza argomenti.<\/span> <span class=\"sg\" data-s=\"1\">La firma non corrisponde.<\/span> <span class=\"sg\" data-s=\"2\">Quindi Raku stampa il messaggio di utilizzo.<\/span> <span class=\"sg\" data-s=\"3\">Non saluta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku crea il messaggio dai nomi dei parametri.<\/span> <span class=\"sg\" data-s=\"1\">Quindi dai ai parametri dei buoni nomi.<\/span> <span class=\"sg\" data-s=\"2\">Allora il testo di aiuto è utile, e non fai nessun lavoro in più.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argomenti con nome<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> può avere parametri posizionali.<\/span> <span class=\"sg\" data-s=\"1\">Può avere anche parametri con nome.<\/span> <span class=\"sg\" data-s=\"2\">Sulla riga di comando, un parametro con nome diventa un'opzione come <code>--opzione=valore<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi dargli un valore predefinito.<\/span> <span class=\"sg\" data-s=\"4\">Allora l'opzione non è obbligatoria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"lv":{"t":"Vairāk par MAIN apakšprogrammām","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <code>MAIN<\/code>, <a href=\"https://course.raku.org/lv/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">lai saņemtu komandrindas argumentus<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>MAIN<\/code> Raku jūsu labā dara vairāk.<\/span> <span class=\"sg\" data-s=\"2\">Tas ne tikai nodod vērtības iekšā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lietošanas paziņojums<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dažreiz komandrindas argumenti neatbilst <code>MAIN<\/code> parakstam.<\/span> <span class=\"sg\" data-s=\"1\">Paraksts ir tā parametru saraksts.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku neizpilda ķermeni.<\/span> <span class=\"sg\" data-s=\"3\">Tā vietā tas izdrukā <em>lietošanas paziņojumu<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Šo paziņojumu Raku izveido pats.<\/span> <span class=\"sg\" data-s=\"5\">Paziņojums parāda, kā palaist programmu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Palaidiet to pareizi.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā sasveicinās ar cilvēku:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tagad palaidiet to bez argumenta.<\/span> <span class=\"sg\" data-s=\"1\">Paraksts neatbilst.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc Raku izdrukā lietošanas paziņojumu.<\/span> <span class=\"sg\" data-s=\"3\">Tas nesasveicinās:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku veido paziņojumu no parametru nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc dodiet parametriem labus nosaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Tad palīdzības teksts ir noderīgs, un jums nav jāstrādā vairāk.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosaukti argumenti<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai <code>MAIN<\/code> var būt pozicionāli parametri.<\/span> <span class=\"sg\" data-s=\"1\">Tai var būt arī nosaukti parametri.<\/span> <span class=\"sg\" data-s=\"2\">Komandrindā nosaukts parametrs kļūst par opciju, piemēram, <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat tam dot noklusējuma vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Tad opcija nav obligāta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"ru":{"t":"Подробнее о MAIN","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы использовали <code>MAIN<\/code>, <a href=\"https://course.raku.org/ru/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">чтобы получать аргументы командной строки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku делает для вас с <code>MAIN<\/code> больше.<\/span> <span class=\"sg\" data-s=\"2\">Он не только передаёт значения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сообщение об использовании<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Иногда аргументы командной строки не подходят к сигнатуре <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатура — это список её параметров.<\/span> <span class=\"sg\" data-s=\"2\">Тогда Raku не выполняет тело.<\/span> <span class=\"sg\" data-s=\"3\">Вместо этого он выводит <em>сообщение об использовании<\/em> (usage message).<\/span> <span class=\"sg\" data-s=\"4\">Raku сам создаёт это сообщение.<\/span> <span class=\"sg\" data-s=\"5\">Сообщение показывает, как запускать программу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустите её правильно.<\/span> <span class=\"sg\" data-s=\"1\">Тогда она здоровается с человеком:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Теперь запустите её без аргумента.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатура не подходит.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому Raku выводит сообщение об использовании.<\/span> <span class=\"sg\" data-s=\"3\">Он не здоровается:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku строит сообщение из имён параметров.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому давайте параметрам хорошие имена.<\/span> <span class=\"sg\" data-s=\"2\">Тогда текст справки полезен, и лишней работы нет.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные аргументы<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У <code>MAIN<\/code> могут быть позиционные параметры.<\/span> <span class=\"sg\" data-s=\"1\">Ещё у него могут быть именованные параметры.<\/span> <span class=\"sg\" data-s=\"2\">В командной строке именованный параметр становится опцией вида <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ему можно дать значение по умолчанию.<\/span> <span class=\"sg\" data-s=\"4\">Тогда опция не обязательна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"uk":{"t":"Докладніше про підпрограми MAIN","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви використовували <code>MAIN<\/code>, <a href=\"https://course.raku.org/uk/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">щоб отримувати аргументи командного рядка<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku робить для вас із <code>MAIN<\/code> більше.<\/span> <span class=\"sg\" data-s=\"2\">Він не лише передає значення всередину.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повідомлення про використання<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Іноді аргументи командного рядка не відповідають сигнатурі <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатура — це список її параметрів.<\/span> <span class=\"sg\" data-s=\"2\">Тоді Raku не виконує тіло.<\/span> <span class=\"sg\" data-s=\"3\">Натомість він виводить <em>повідомлення про використання<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Raku сам створює це повідомлення.<\/span> <span class=\"sg\" data-s=\"5\">Повідомлення показує, як запускати програму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подивіться на цю програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть її правильно.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вона вітається з людиною:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тепер запустіть її без аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатура не збігається.<\/span> <span class=\"sg\" data-s=\"2\">Тож Raku виводить повідомлення про використання.<\/span> <span class=\"sg\" data-s=\"3\">Він не вітається:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku складає повідомлення з імен параметрів.<\/span> <span class=\"sg\" data-s=\"1\">Тож дайте параметрам добрі імена.<\/span> <span class=\"sg\" data-s=\"2\">Тоді текст довідки корисний, і ви не робите зайвої роботи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані аргументи<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> може мати позиційні параметри.<\/span> <span class=\"sg\" data-s=\"1\">Також <code>MAIN<\/code> може мати іменовані параметри.<\/span> <span class=\"sg\" data-s=\"2\">У командному рядку іменований параметр стає опцією, як-от <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете дати йому типове значення.<\/span> <span class=\"sg\" data-s=\"4\">Тоді опція не обов'язкова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"bg":{"t":"Повече за MAIN подпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ използвахте <code>MAIN<\/code>, за да <a href=\"https://course.raku.org/bg/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">получавате аргументи от командния ред<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku прави още неща за вас с <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той не само подава стойностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Съобщение за употреба<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Понякога аргументите от командния ред не съвпадат със сигнатурата на <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатурата е списъкът с параметри на <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогава Raku не изпълнява тялото.<\/span> <span class=\"sg\" data-s=\"3\">Вместо това той отпечатва <em>съобщение за употреба<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Raku сам създава това съобщение.<\/span> <span class=\"sg\" data-s=\"5\">Съобщението показва как да стартирате програмата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вижте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стартирайте я правилно.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя поздравява човека:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Сега я стартирайте без аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Сигнатурата не съвпада.<\/span> <span class=\"sg\" data-s=\"2\">Затова Raku отпечатва съобщението за употреба.<\/span> <span class=\"sg\" data-s=\"3\">Той не поздравява:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku прави съобщението от имената на параметрите.<\/span> <span class=\"sg\" data-s=\"1\">Затова давайте на параметрите добри имена.<\/span> <span class=\"sg\" data-s=\"2\">Тогава текстът за помощ е полезен, а вие не вършите допълнителна работа.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани аргументи<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> може да има позиционни параметри.<\/span> <span class=\"sg\" data-s=\"1\">Може да има и именувани параметри.<\/span> <span class=\"sg\" data-s=\"2\">На командния ред именуваният параметър става опция като <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да му дадете стойност по подразбиране.<\/span> <span class=\"sg\" data-s=\"4\">Тогава опцията не е задължителна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"eo":{"t":"Pli pri MAIN-subrutino","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj, vi uzis <code>MAIN<\/code> <a href=\"https://course.raku.org/eo/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">por ricevi komandliniajn argumentojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras pli por vi kun <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne nur transdonas la valorojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La uzad-mesaĝo<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje la komandliniaj argumentoj ne kongruas kun la signaturo de <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La signaturo estas ĝia listo de parametroj.<\/span> <span class=\"sg\" data-s=\"2\">Tiam Raku ne rulas la korpon.<\/span> <span class=\"sg\" data-s=\"3\">Anstataŭe ĝi presas <em>uzad-mesaĝon<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Raku mem kreas ĉi tiun mesaĝon.<\/span> <span class=\"sg\" data-s=\"5\">La mesaĝo montras, kiel ruli la programon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu ĝin ĝuste.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi salutas la personon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nun rulu ĝin sen argumento.<\/span> <span class=\"sg\" data-s=\"1\">La signaturo ne kongruas.<\/span> <span class=\"sg\" data-s=\"2\">Do Raku presas la uzad-mesaĝon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne salutas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku faras la mesaĝon el la nomoj de la parametroj.<\/span> <span class=\"sg\" data-s=\"1\">Do donu al la parametroj bonajn nomojn.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la helpteksto estas utila, kaj vi faras neniun kroman laboron.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj argumentoj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> povas havi poziciajn parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas havi ankaŭ nomitajn parametrojn.<\/span> <span class=\"sg\" data-s=\"2\">En la komandlinio, nomita parametro fariĝas opcio kiel <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas doni al ĝi defaŭltan valoron.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la opcio ne estas deviga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"la":{"t":"Plus de MAIN subprogrammatibus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <code>MAIN<\/code> <a href=\"https://course.raku.org/la/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">ad argumenta lineae mandati accipienda<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Raku plura tibi cum <code>MAIN<\/code> facit.<\/span> <span class=\"sg\" data-s=\"2\">Non solum valores tradit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nuntius de usu<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Interdum argumenta lineae mandati cum signatura <code>MAIN<\/code> non congruunt.<\/span> <span class=\"sg\" data-s=\"1\">Signatura est index parametrorum eius.<\/span> <span class=\"sg\" data-s=\"2\">Tum Raku corpus non exsequitur.<\/span> <span class=\"sg\" data-s=\"3\">Pro eo <em>nuntium de usu<\/em> imprimit.<\/span> <span class=\"sg\" data-s=\"4\">Raku hunc nuntium ipse facit.<\/span> <span class=\"sg\" data-s=\"5\">Nuntius ostendit quomodo programma curras.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Specta hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Recte id curre.<\/span> <span class=\"sg\" data-s=\"1\">Tum personam salutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nunc id sine argumento curre.<\/span> <span class=\"sg\" data-s=\"1\">Signatura non congruit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Raku nuntium de usu imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Non salutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku nuntium ex nominibus parametrorum facit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque parametris bona nomina da.<\/span> <span class=\"sg\" data-s=\"2\">Tum textus auxilii utilis est, et nihil amplius laboras.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argumenta nominata<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> parametros positionarios habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam parametros nominatos habere potest.<\/span> <span class=\"sg\" data-s=\"2\">In linea mandati parametrus nominatus fit optio ut <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ei valorem praefinitum dare potes.<\/span> <span class=\"sg\" data-s=\"4\">Tum optio non necessaria est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]}}}</script>
