de><\/span> <span class=\"sg\" data-s=\"4\">Diese Sequenz hat kein Ende.<\/span> <span class=\"sg\" data-s=\"5\">Nimm dann mit <code>head<\/code> die ersten vier Zahlen.<\/span> <span class=\"sg\" data-s=\"6\">Das ist nur sicher, weil die Sequenz lazy ist.<\/span> <span class=\"sg\" data-s=\"7\">Eine lazy Sequenz macht ihre Werte erst, wenn du sie brauchst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Oefening ’Een open bereik‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opgave<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">De ster op zichzelf, <code>*<\/code>, betekent “geen grens”.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik hem als het einde van een reeks.<\/span> <span class=\"sg\" data-s=\"2\">Schrijf de even getallen als de reeks <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Deze reeks heeft geen einde.<\/span> <span class=\"sg\" data-s=\"5\">Neem dan de eerste vier getallen met <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Dit is alleen veilig omdat de reeks lui is.<\/span> <span class=\"sg\" data-s=\"7\">Een luie reeks maakt haar waarden pas als je ze nodig hebt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Un rango abierto","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La estrella sola, <code>*<\/code>, significa \"sin límite\".<\/span> <span class=\"sg\" data-s=\"1\">Úsala como final de una secuencia.<\/span> <span class=\"sg\" data-s=\"2\">Escribe los números pares como la secuencia <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Esta secuencia no tiene fin.<\/span> <span class=\"sg\" data-s=\"5\">Después toma los cuatro primeros números con <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Esto es seguro solo porque la secuencia es perezosa.<\/span> <span class=\"sg\" data-s=\"7\">Una secuencia perezosa crea sus valores solo cuando los necesitas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Ve la solución<\/a><\/span><\/p>"]]},"it":{"t":"Un intervallo aperto","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La stella da sola, <code>*<\/code>, significa “nessun limite”.<\/span> <span class=\"sg\" data-s=\"1\">Usala come fine di una sequenza.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi i numeri pari come la sequenza <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Questa sequenza non ha fine.<\/span> <span class=\"sg\" data-s=\"5\">Poi prendi i primi quattro numeri con <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Questo è sicuro solo perché la sequenza è lazy.<\/span> <span class=\"sg\" data-s=\"7\">Una sequenza lazy crea i suoi valori solo quando ti servono.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Atvērts diapazons","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Viena pati zvaigznīte, <code>*<\/code>, nozīmē «bez ierobežojuma».<\/span> <span class=\"sg\" data-s=\"1\">Lietojiet to kā virknes beigas.<\/span> <span class=\"sg\" data-s=\"2\">Uzrakstiet pāra skaitļus kā virkni <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Šai virknei nav beigu.<\/span> <span class=\"sg\" data-s=\"5\">Tad ar <code>head<\/code> paņemiet pirmos četrus skaitļus.<\/span> <span class=\"sg\" data-s=\"6\">Tas ir droši tikai tāpēc, ka virkne ir slinka.<\/span> <span class=\"sg\" data-s=\"7\">Slinka virkne veido savas vērtības tikai tad, kad tās ir vajadzīgas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Открытый диапазон","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Одна звёздочка, <code>*<\/code>, значит «без ограничения».<\/span> <span class=\"sg\" data-s=\"1\">Используйте её как конец последовательности.<\/span> <span class=\"sg\" data-s=\"2\">Запишите чётные числа как последовательность <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">У этой последовательности нет конца.<\/span> <span class=\"sg\" data-s=\"5\">Потом возьмите первые четыре числа с помощью <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Это безопасно только потому, что последовательность ленивая.<\/span> <span class=\"sg\" data-s=\"7\">Ленивая последовательность создаёт значения, только когда они нужны.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Відкритий діапазон»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Сама зірочка, <code>*<\/code>, означає «без обмежень».<\/span> <span class=\"sg\" data-s=\"1\">Використайте її як кінець послідовності.<\/span> <span class=\"sg\" data-s=\"2\">Запишіть парні числа як послідовність <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Ця послідовність не має кінця.<\/span> <span class=\"sg\" data-s=\"5\">Потім візьміть перші чотири числа за допомогою <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Це безпечно лише тому, що послідовність лінива.<\/span> <span class=\"sg\" data-s=\"7\">Лінива послідовність створює свої значення, лише коли вони потрібні.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Отворен диапазон","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Звездата сама, <code>*<\/code>, означава „без граница“.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте я като край на последователност.<\/span> <span class=\"sg\" data-s=\"2\">Запишете четните числа като последователността <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Тази последователност няма край.<\/span> <span class=\"sg\" data-s=\"5\">После вземете първите четири числа с <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Това е безопасно само защото последователността е мързелива.<\/span> <span class=\"sg\" data-s=\"7\">Мързеливата последователност създава стойностите си само когато ви трябват.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Malfermita intervalo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La stelo sola, <code>*<\/code>, signifas “sen limo”.<\/span> <span class=\"sg\" data-s=\"1\">Uzu ĝin kiel la finon de sekvenco.<\/span> <span class=\"sg\" data-s=\"2\">Skribu la parajn nombrojn kiel la sekvencon <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekvenco ne havas finon.<\/span> <span class=\"sg\" data-s=\"5\">Poste prenu la unuajn kvar nombrojn per <code>head<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tio estas sekura nur, ĉar la sekvenco estas maldiligenta.<\/span> <span class=\"sg\" data-s=\"7\">Maldiligenta sekvenco faras siajn valorojn nur, kiam vi bezonas ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Intervallum apertum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Stella sola, <code>*<\/code>, «nullum limitem» significat.<\/span> <span class=\"sg\" data-s=\"1\">Eam ut finem seriei adhibe.<\/span> <span class=\"sg\" data-s=\"2\">Scribe numeros pares ut seriem <code>2, 4 ...<\/code><\/span> <span class=\"sg\" data-s=\"3\">*<code>.<\/code><\/span> <span class=\"sg\" data-s=\"4\">Haec series finem non habet.<\/span> <span class=\"sg\" data-s=\"5\">Tum primos quattuor numeros cum <code>head<\/code> cape.<\/span> <span class=\"sg\" data-s=\"6\">Hoc tutum est solum quia series pigra est.<\/span> <span class=\"sg\" data-s=\"7\">Series pigra valores suos facit solum cum eos requiris.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>(2 4 6 8)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/whatever/exercises/open-range/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
