<script type="application/json" id="page-data">{"u":"advanced/whatever","n":638,"k":"section","pv":"advanced/signatures/quiz","nx":"advanced/whatever/exercises","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Whatever star","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Maybe you have seen <code>*<\/code> in expressions like <code>* * 2<\/code> or <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You use them with <code>map<\/code> and <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This <code>*<\/code> is the <em>Whatever star<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">The expression around it makes a small function.<\/span> <span class=\"sg\" data-s=\"4\">The function has one argument.<\/span> <span class=\"sg\" data-s=\"5\">Raku makes it right there, in place.<\/span> <span class=\"sg\" data-s=\"6\">This section explains what the star really is.<\/span> <span class=\"sg\" data-s=\"7\">It also compares the star with a block.<\/span> <span class=\"sg\" data-s=\"8\">And it shows where the star alone simply means “whatever you want”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">A star makes a function<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">An expression can have <code>*<\/code> in it.<\/span> <span class=\"sg\" data-s=\"1\">Then Raku turns the whole expression into a function.<\/span> <span class=\"sg\" data-s=\"2\">This function is a <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In it, the star stands for the argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> is a function.<\/span> <span class=\"sg\" data-s=\"1\">It takes one argument and multiplies it by two.<\/span> <span class=\"sg\" data-s=\"2\">That is why <code>(1..5).map(* * 2)<\/code> works.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> gets exactly this kind of function with one argument.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever or a block<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A Whatever expression is a short way to write a function.<\/span> <span class=\"sg\" data-s=\"1\">You can also write the same function as a block.<\/span> <span class=\"sg\" data-s=\"2\">These three lines do the same thing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">The Whatever form has no parameter name.<\/span> <span class=\"sg\" data-s=\"1\">The block form uses the topic variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The pointy form has the name <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The last one, <code>-&gt; $x { ... }<\/code>, is itself a small function.<\/span> <span class=\"sg\" data-s=\"4\">You will learn about it later, in <a href=\"/advanced/anonymous-subroutines/\">Anonymous subroutines<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Here, see it simply as a third form of the same function.<\/span> <span class=\"sg\" data-s=\"6\">This function has one argument.<\/span> <span class=\"sg\" data-s=\"7\">For a simple expression, the star is the shortest.<\/span> <span class=\"sg\" data-s=\"8\">That is why people often use it with <code>map<\/code>, <code>grep<\/code>, and <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Use a <strong>block<\/strong> if the code needs more than one expression.<\/span> <span class=\"sg\" data-s=\"1\">A block is also better if a clear parameter name helps.<\/span> <span class=\"sg\" data-s=\"2\">Use the <strong>star<\/strong> if one short expression is enough.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one star<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Each <code>*<\/code> in the expression is a separate argument.<\/span> <span class=\"sg\" data-s=\"1\">They come in order.<\/span> <span class=\"sg\" data-s=\"2\">So two stars make a function with <strong>two<\/strong> arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, <code>* + *<\/code> is a function with two arguments.<\/span> <span class=\"sg\" data-s=\"1\">It adds them.<\/span> <span class=\"sg\" data-s=\"2\">For example, they can be a total so far and the next element.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The Whatever star alone<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The star alone, <code>*<\/code>, means “whatever”.<\/span> <span class=\"sg\" data-s=\"1\">It can mean “as much as there is”.<\/span> <span class=\"sg\" data-s=\"2\">It can also mean “no limit”.<\/span> <span class=\"sg\" data-s=\"3\">Here are two common uses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is the array length, so *-1 is the last index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is an open-ended range<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code>, the star is the number of elements.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code>, the star means “no upper limit”.<\/span> <span class=\"sg\" data-s=\"2\">Sometimes the star makes a function.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes it means “whatever you want”.<\/span> <span class=\"sg\" data-s=\"4\">Either way, it is one of Raku’s most useful short forms.<\/span><\/p>"]]},"de":{"t":"Der Whatever-Stern","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Vielleicht hast du <code>*<\/code> schon in Ausdrücken wie <code>* * 2<\/code> oder <code>* %% 2<\/code> gesehen.<\/span> <span class=\"sg\" data-s=\"1\">Du benutzt sie mit <code>map<\/code> und <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dieses <code>*<\/code> ist der <em>Whatever-Stern<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Der Ausdruck um ihn herum macht eine kleine Funktion.<\/span> <span class=\"sg\" data-s=\"4\">Die Funktion hat ein Argument.<\/span> <span class=\"sg\" data-s=\"5\">Raku macht sie direkt an dieser Stelle.<\/span> <span class=\"sg\" data-s=\"6\">Dieser Abschnitt erklärt, was der Stern wirklich ist.<\/span> <span class=\"sg\" data-s=\"7\">Er vergleicht den Stern auch mit einem Block.<\/span> <span class=\"sg\" data-s=\"8\">Und er zeigt, wo der Stern allein einfach „was auch immer du willst“ bedeutet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ein Stern erzeugt eine Funktion<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Ausdruck kann ein <code>*<\/code> enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Dann macht Raku aus dem ganzen Ausdruck eine Funktion.<\/span> <span class=\"sg\" data-s=\"2\">Diese Funktion ist ein <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Darin steht der Stern für das Argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> ist eine Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt ein Argument und multipliziert es mit zwei.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb funktioniert <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> bekommt genau so eine Funktion mit einem Argument.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever oder Block<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit einem Whatever-Ausdruck kannst du eine Funktion kurz schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst dieselbe Funktion auch als Block schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Diese drei Zeilen machen dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Die Whatever-Form hat keinen Parameternamen.<\/span> <span class=\"sg\" data-s=\"1\">Die Block-Form benutzt die Topic-Variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die Pfeil-Form hat den Namen <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die letzte, <code>-&gt; $x { ... }<\/code>, ist selbst eine kleine Funktion.<\/span> <span class=\"sg\" data-s=\"4\">Du lernst sie später kennen, in <a href=\"https://course.raku.org/de/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonyme Subroutinen<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Sieh sie hier einfach als dritte Form derselben Funktion.<\/span> <span class=\"sg\" data-s=\"6\">Diese Funktion hat ein Argument.<\/span> <span class=\"sg\" data-s=\"7\">Für einen einfachen Ausdruck ist der Stern am kürzesten.<\/span> <span class=\"sg\" data-s=\"8\">Deshalb benutzt man ihn oft mit <code>map<\/code>, <code>grep<\/code> und <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nimm einen <strong>Block<\/strong>, wenn der Code mehr als einen Ausdruck braucht.<\/span> <span class=\"sg\" data-s=\"1\">Ein Block ist auch besser, wenn ein klarer Parametername hilft.<\/span> <span class=\"sg\" data-s=\"2\">Nimm den <strong>Stern<\/strong>, wenn ein kurzer Ausdruck reicht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als ein Stern<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>*<\/code> im Ausdruck ist ein eigenes Argument.<\/span> <span class=\"sg\" data-s=\"1\">Sie kommen der Reihe nach.<\/span> <span class=\"sg\" data-s=\"2\">Zwei Sterne machen also eine Funktion mit <strong>zwei<\/strong> Argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>* + *<\/code> eine Funktion mit zwei Argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Sie addiert die beiden.<\/span> <span class=\"sg\" data-s=\"2\">Das können zum Beispiel die Summe bis jetzt und das nächste Element sein.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der Whatever-Stern allein<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der Stern allein, <code>*<\/code>, bedeutet „was auch immer“.<\/span> <span class=\"sg\" data-s=\"1\">Er kann „so viel, wie da ist“ bedeuten.<\/span> <span class=\"sg\" data-s=\"2\">Er kann auch „ohne Grenze“ bedeuten.<\/span> <span class=\"sg\" data-s=\"3\">Hier sind zwei häufige Verwendungen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * ist die Array-Länge, also ist *-1 der letzte Index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* ist ein offener Bereich<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> ist der Stern die Anzahl der Elemente.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code> bedeutet der Stern „keine obere Grenze“.<\/span> <span class=\"sg\" data-s=\"2\">Manchmal macht der Stern eine Funktion.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal bedeutet er „was auch immer du willst“.<\/span> <span class=\"sg\" data-s=\"4\">In beiden Fällen ist er eine der nützlichsten Kurzformen von Raku.<\/span><\/p>"]]},"nl":{"t":"De Whatever-ster","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Misschien heb je <code>*<\/code> al gezien in uitdrukkingen als <code>* * 2<\/code> of <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je gebruikt ze bij <code>map<\/code> en <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deze <code>*<\/code> is de <em>Whatever-ster<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">De uitdrukking eromheen maakt een kleine functie.<\/span> <span class=\"sg\" data-s=\"4\">De functie heeft één argument.<\/span> <span class=\"sg\" data-s=\"5\">Raku maakt die meteen, ter plekke.<\/span> <span class=\"sg\" data-s=\"6\">Deze sectie legt uit wat de ster echt is.<\/span> <span class=\"sg\" data-s=\"7\">Ze vergelijkt de ster ook met een blok.<\/span> <span class=\"sg\" data-s=\"8\">En ze laat zien waar de ster op zichzelf gewoon “wat je maar wilt” betekent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een ster maakt een functie<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Er kan een <code>*<\/code> in een uitdrukking staan.<\/span> <span class=\"sg\" data-s=\"1\">Dan maakt Raku van de hele uitdrukking een functie.<\/span> <span class=\"sg\" data-s=\"2\">Deze functie is een <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Daarin staat de ster voor het argument:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> is een functie.<\/span> <span class=\"sg\" data-s=\"1\">Die neemt één argument en vermenigvuldigt het met twee.<\/span> <span class=\"sg\" data-s=\"2\">Daarom werkt <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> krijgt precies zo'n functie met één argument.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever of een blok<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een Whatever-uitdrukking is een korte manier om een functie te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dezelfde functie ook als blok schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Deze drie regels doen hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">De Whatever-vorm heeft geen naam voor de parameter.<\/span> <span class=\"sg\" data-s=\"1\">De blokvorm gebruikt de onderwerpsvariabele <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De pijlvorm heeft de naam <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De laatste, <code>-&gt; $x { ... }<\/code>, is zelf een kleine functie.<\/span> <span class=\"sg\" data-s=\"4\">Je leert hem later kennen, in <a href=\"https://course.raku.org/nl/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonieme subroutines<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Zie hem hier gewoon als een derde vorm van dezelfde functie.<\/span> <span class=\"sg\" data-s=\"6\">Deze functie heeft één argument.<\/span> <span class=\"sg\" data-s=\"7\">Voor een eenvoudige uitdrukking is de ster het kortst.<\/span> <span class=\"sg\" data-s=\"8\">Daarom gebruiken mensen hem vaak bij <code>map<\/code>, <code>grep<\/code> en <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gebruik een <strong>blok<\/strong> als de code meer dan één uitdrukking nodig heeft.<\/span> <span class=\"sg\" data-s=\"1\">Een blok is ook beter als een duidelijke naam voor de parameter helpt.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik de <strong>ster<\/strong> als één korte uitdrukking genoeg is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één ster<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke <code>*<\/code> in de uitdrukking is een apart argument.<\/span> <span class=\"sg\" data-s=\"1\">Ze komen op volgorde.<\/span> <span class=\"sg\" data-s=\"2\">Twee sterren maken dus een functie met <strong>twee<\/strong> argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>* + *<\/code> een functie met twee argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Die telt ze op.<\/span> <span class=\"sg\" data-s=\"2\">Dat kunnen bijvoorbeeld een totaal tot nu toe en het volgende element zijn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De Whatever-ster op zichzelf<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De ster op zichzelf, <code>*<\/code>, betekent “wat dan ook”.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan “zoveel als er is” betekenen.<\/span> <span class=\"sg\" data-s=\"2\">Hij kan ook “geen grens” betekenen.<\/span> <span class=\"sg\" data-s=\"3\">Hier zijn twee voorbeelden die vaak voorkomen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is de lengte van de array, dus *-1 is de laatste index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is een open bereik<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> is de ster het aantal elementen.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code> betekent de ster “geen bovengrens”.<\/span> <span class=\"sg\" data-s=\"2\">Soms maakt de ster een functie.<\/span> <span class=\"sg\" data-s=\"3\">Soms betekent hij “wat je maar wilt”.<\/span> <span class=\"sg\" data-s=\"4\">Hoe dan ook is hij een van de nuttigste korte vormen van Raku.<\/span><\/p>"]]},"es":{"t":"La estrella Whatever","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Quizás has visto <code>*<\/code> en expresiones como <code>* * 2<\/code> o <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Las usas con <code>map<\/code> y <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Este <code>*<\/code> es la <em>estrella Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La expresión que la rodea crea una pequeña función.<\/span> <span class=\"sg\" data-s=\"4\">La función tiene un argumento.<\/span> <span class=\"sg\" data-s=\"5\">Raku la crea justo ahí, en ese lugar.<\/span> <span class=\"sg\" data-s=\"6\">Esta sección explica qué es de verdad la estrella.<\/span> <span class=\"sg\" data-s=\"7\">También compara la estrella con un bloque.<\/span> <span class=\"sg\" data-s=\"8\">Y muestra dónde la estrella sola significa simplemente \"lo que quieras\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una estrella crea una función<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una expresión puede tener un <code>*<\/code> dentro.<\/span> <span class=\"sg\" data-s=\"1\">Entonces Raku convierte toda la expresión en una función.<\/span> <span class=\"sg\" data-s=\"2\">Esta función es un <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">En ella, la estrella representa el argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> es una función.<\/span> <span class=\"sg\" data-s=\"1\">Toma un argumento y lo multiplica por dos.<\/span> <span class=\"sg\" data-s=\"2\">Por eso funciona <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> recibe justo este tipo de función con un argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever o un bloque<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una expresión Whatever es una forma corta de escribir una función.<\/span> <span class=\"sg\" data-s=\"1\">También puedes escribir la misma función como un bloque.<\/span> <span class=\"sg\" data-s=\"2\">Estas tres líneas hacen lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever no tiene nombre de parámetro.<\/span> <span class=\"sg\" data-s=\"1\">La forma de bloque usa la variable tópica <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La forma puntiaguda tiene el nombre <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La última, <code>-&gt; $x { ... }<\/code>, es en sí misma una pequeña función.<\/span> <span class=\"sg\" data-s=\"4\">La verás más adelante, en <a href=\"https://course.raku.org/es/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subrutinas anónimas<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Aquí, mírala simplemente como una tercera forma de la misma función.<\/span> <span class=\"sg\" data-s=\"6\">Esta función tiene un argumento.<\/span> <span class=\"sg\" data-s=\"7\">Para una expresión simple, la estrella es la más corta.<\/span> <span class=\"sg\" data-s=\"8\">Por eso la gente la usa mucho con <code>map<\/code>, <code>grep<\/code> y <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Usa un <strong>bloque<\/strong> si el código necesita más de una expresión.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque también es mejor si ayuda un nombre de parámetro claro.<\/span> <span class=\"sg\" data-s=\"2\">Usa la <strong>estrella<\/strong> si basta con una expresión corta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una estrella<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada <code>*<\/code> en la expresión es un argumento distinto.<\/span> <span class=\"sg\" data-s=\"1\">Van en orden.<\/span> <span class=\"sg\" data-s=\"2\">Así que dos estrellas crean una función con <strong>dos<\/strong> argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>* + *<\/code> es una función con dos argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Los suma.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, pueden ser el total hasta ahora y el siguiente elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La estrella Whatever sola<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La estrella sola, <code>*<\/code>, significa \"lo que sea\".<\/span> <span class=\"sg\" data-s=\"1\">Puede significar \"todo lo que haya\".<\/span> <span class=\"sg\" data-s=\"2\">También puede significar \"sin límite\".<\/span> <span class=\"sg\" data-s=\"3\">Aquí tienes dos usos comunes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * es la longitud del arreglo, asi que *-1 es el ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* es un rango abierto<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code>, la estrella es el número de elementos.<\/span> <span class=\"sg\" data-s=\"1\">En <code>1..*<\/code>, la estrella significa \"sin límite superior\".<\/span> <span class=\"sg\" data-s=\"2\">A veces la estrella crea una función.<\/span> <span class=\"sg\" data-s=\"3\">A veces significa \"lo que quieras\".<\/span> <span class=\"sg\" data-s=\"4\">En los dos casos, es una de las formas cortas más útiles de Raku.<\/span><\/p>"]]},"it":{"t":"La stella Whatever","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Forse hai visto <code>*<\/code> in espressioni come <code>* * 2<\/code> o <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Le usi con <code>map<\/code> e <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo <code>*<\/code> è la <em>Whatever star<\/em> (stella Whatever).<\/span> <span class=\"sg\" data-s=\"3\">L'espressione intorno alla stella crea una piccola funzione.<\/span> <span class=\"sg\" data-s=\"4\">La funzione ha un argomento.<\/span> <span class=\"sg\" data-s=\"5\">Raku la crea proprio lì, sul posto.<\/span> <span class=\"sg\" data-s=\"6\">Questa sezione spiega che cos'è davvero la stella.<\/span> <span class=\"sg\" data-s=\"7\">Confronta anche la stella con un blocco.<\/span> <span class=\"sg\" data-s=\"8\">E mostra dove la stella da sola significa semplicemente “qualsiasi cosa tu voglia”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una stella crea una funzione<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un'espressione può contenere <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora Raku trasforma tutta l'espressione in una funzione.<\/span> <span class=\"sg\" data-s=\"2\">Questa funzione è un <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In questa funzione, la stella sta per l'argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> è una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Prende un argomento e lo moltiplica per due.<\/span> <span class=\"sg\" data-s=\"2\">Per questo <code>(1..5).map(* * 2)<\/code> funziona.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> riceve proprio questo tipo di funzione con un argomento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever o un blocco<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un'espressione Whatever è un modo breve per scrivere una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scrivere la stessa funzione anche come blocco.<\/span> <span class=\"sg\" data-s=\"2\">Queste tre righe fanno la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever non ha un nome di parametro.<\/span> <span class=\"sg\" data-s=\"1\">La forma a blocco usa la variabile topic <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La forma pointy ha il nome <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'ultima, <code>-&gt; $x { ... }<\/code>, è già da sola una piccola funzione.<\/span> <span class=\"sg\" data-s=\"4\">La studierai più avanti, in <a href=\"https://course.raku.org/it/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subroutine anonime<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Qui vedila semplicemente come una terza forma della stessa funzione.<\/span> <span class=\"sg\" data-s=\"6\">Questa funzione ha un argomento.<\/span> <span class=\"sg\" data-s=\"7\">Per un'espressione semplice, la stella è la forma più corta.<\/span> <span class=\"sg\" data-s=\"8\">Per questo le persone la usano spesso con <code>map<\/code>, <code>grep<\/code> e <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Usa un <strong>blocco<\/strong> se il codice ha bisogno di più di un'espressione.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco è meglio anche se un nome chiaro per il parametro aiuta.<\/span> <span class=\"sg\" data-s=\"2\">Usa la <strong>stella<\/strong> se basta una breve espressione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piu di una stella<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>*<\/code> nell'espressione è un argomento separato.<\/span> <span class=\"sg\" data-s=\"1\">Gli argomenti vengono in ordine.<\/span> <span class=\"sg\" data-s=\"2\">Quindi due stelle creano una funzione con <strong>due<\/strong> argomenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui <code>* + *<\/code> è una funzione con due argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Li somma.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, possono essere il totale fino a ora e l'elemento successivo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La stella Whatever da sola<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La stella da sola, <code>*<\/code>, significa “qualsiasi cosa”.<\/span> <span class=\"sg\" data-s=\"1\">Può significare “tutto quello che c'è”.<\/span> <span class=\"sg\" data-s=\"2\">Può anche significare “nessun limite”.<\/span> <span class=\"sg\" data-s=\"3\">Ecco due usi comuni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * è la lunghezza dell'array, quindi *-1 è l'ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* è un intervallo aperto<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code>, la stella è il numero di elementi.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code>, la stella significa “nessun limite superiore”.<\/span> <span class=\"sg\" data-s=\"2\">A volte la stella crea una funzione.<\/span> <span class=\"sg\" data-s=\"3\">A volte significa “qualsiasi cosa tu voglia”.<\/span> <span class=\"sg\" data-s=\"4\">In ogni caso, è una delle forme brevi più utili di Raku.<\/span><\/p>"]]},"lv":{"t":"Whatever zvaigzne 🆕","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūs esat redzējuši <code>*<\/code> izteiksmēs, piemēram, <code>* * 2<\/code> vai <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tās lietojat ar <code>map<\/code> un <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šī <code>*<\/code> ir <em>Whatever zvaigznīte<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Izteiksme ap to izveido mazu funkciju.<\/span> <span class=\"sg\" data-s=\"4\">Funkcijai ir viens arguments.<\/span> <span class=\"sg\" data-s=\"5\">Raku to izveido turpat, uz vietas.<\/span> <span class=\"sg\" data-s=\"6\">Šī sadaļa paskaidro, kas īsti ir zvaigznīte.<\/span> <span class=\"sg\" data-s=\"7\">Tā arī salīdzina zvaigznīti ar bloku.<\/span> <span class=\"sg\" data-s=\"8\">Un tā parāda, kur viena pati zvaigznīte vienkārši nozīmē «cik nu vēlaties».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Zvaigznīte veido funkciju<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izteiksmē var būt <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad Raku pārvērš visu izteiksmi par funkciju.<\/span> <span class=\"sg\" data-s=\"2\">Šī funkcija ir <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tajā zvaigznīte apzīmē argumentu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> ir funkcija.<\/span> <span class=\"sg\" data-s=\"1\">Tā ņem vienu argumentu un reizina to ar diviem.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>(1..5).map(* * 2)<\/code> darbojas.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> saņem tieši šādu funkciju ar vienu argumentu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever vai bloks<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever izteiksme ir īss veids, kā uzrakstīt funkciju.<\/span> <span class=\"sg\" data-s=\"1\">To pašu funkciju jūs varat uzrakstīt arī kā bloku.<\/span> <span class=\"sg\" data-s=\"2\">Šīs trīs rindas dara vienu un to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Whatever formā nav parametra nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Bloka forma lieto tēmas mainīgo <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bultiņas formā ir nosaukums <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pēdējā, <code>-&gt; $x { ... }<\/code>, pati ir maza funkcija.<\/span> <span class=\"sg\" data-s=\"4\">Par to jūs uzzināsiet vēlāk, sadaļā <a href=\"https://course.raku.org/lv/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonīmas apakšprogrammas<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Šeit vienkārši uztveriet to kā trešo tās pašas funkcijas formu.<\/span> <span class=\"sg\" data-s=\"6\">Šai funkcijai ir viens arguments.<\/span> <span class=\"sg\" data-s=\"7\">Vienkāršai izteiksmei zvaigznīte ir visīsākā.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc to bieži lieto ar <code>map<\/code>, <code>grep<\/code> un <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lietojiet <strong>bloku<\/strong>, ja kodam vajag vairāk nekā vienu izteiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Bloks ir labāks arī tad, ja palīdz skaidrs parametra nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Lietojiet <strong>zvaigznīti<\/strong>, ja pietiek ar vienu īsu izteiksmi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viena zvaigznīte<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katra <code>*<\/code> izteiksmē ir atsevišķs arguments.<\/span> <span class=\"sg\" data-s=\"1\">Tie nāk pēc kārtas.<\/span> <span class=\"sg\" data-s=\"2\">Tātad divas zvaigznītes veido funkciju ar <strong>diviem<\/strong> argumentiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>* + *<\/code> ir funkcija ar diviem argumentiem.<\/span> <span class=\"sg\" data-s=\"1\">Tā tos saskaita.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, tie var būt līdzšinējā summa un nākamais elements.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever zvaigznīte viena pati<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Viena pati zvaigznīte, <code>*<\/code>, nozīmē «cik nu ir».<\/span> <span class=\"sg\" data-s=\"1\">Tā var nozīmēt «cik vien ir».<\/span> <span class=\"sg\" data-s=\"2\">Tā var nozīmēt arī «bez ierobežojuma».<\/span> <span class=\"sg\" data-s=\"3\">Šeit ir divi bieži lietojumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is the array length, so *-1 is the last index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is an open-ended range<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Izteiksmē <code>@a[*-1]<\/code> zvaigznīte ir elementu skaits.<\/span> <span class=\"sg\" data-s=\"1\">Izteiksmē <code>1..*<\/code> zvaigznīte nozīmē «bez augšējās robežas».<\/span> <span class=\"sg\" data-s=\"2\">Dažreiz zvaigznīte izveido funkciju.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz tā nozīmē «cik nu vēlaties».<\/span> <span class=\"sg\" data-s=\"4\">Jebkurā gadījumā tā ir viens no Raku noderīgākajiem saīsinājumiem.<\/span><\/p>"]]},"ru":{"t":"Звёздочка Whatever","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Может быть, вы уже видели <code>*<\/code> в выражениях вроде <code>* * 2<\/code> или <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы используете их с <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эта <code>*<\/code> — <em>звёздочка Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Выражение вокруг неё создаёт маленькую функцию.<\/span> <span class=\"sg\" data-s=\"4\">У функции один аргумент.<\/span> <span class=\"sg\" data-s=\"5\">Raku создаёт её прямо там, на месте.<\/span> <span class=\"sg\" data-s=\"6\">Этот раздел объясняет, что такое звёздочка на самом деле.<\/span> <span class=\"sg\" data-s=\"7\">Ещё он сравнивает звёздочку с блоком.<\/span> <span class=\"sg\" data-s=\"8\">И он показывает, где одна звёздочка просто значит «что угодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звёздочка создаёт функцию<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В выражении может быть <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда Raku превращает всё выражение в функцию.<\/span> <span class=\"sg\" data-s=\"2\">Эта функция — <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В ней звёздочка обозначает аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — это функция.<\/span> <span class=\"sg\" data-s=\"1\">Она берёт один аргумент и умножает его на два.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>(1..5).map(* * 2)<\/code> работает.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> получает как раз такую функцию с одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever или блок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Выражение Whatever — это короткий способ записать функцию.<\/span> <span class=\"sg\" data-s=\"1\">Ту же функцию можно записать и как блок.<\/span> <span class=\"sg\" data-s=\"2\">Эти три строки делают одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">В форме Whatever нет имени параметра.<\/span> <span class=\"sg\" data-s=\"1\">Форма блока использует топик-переменную <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В стрелочной форме есть имя <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Последняя, <code>-&gt; $x { ... }<\/code>, сама по себе — маленькая функция.<\/span> <span class=\"sg\" data-s=\"4\">Вы узнаете о ней позже, в разделе <a href=\"https://course.raku.org/ru/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимные подпрограммы<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Здесь просто считайте её третьей формой той же функции.<\/span> <span class=\"sg\" data-s=\"6\">У этой функции один аргумент.<\/span> <span class=\"sg\" data-s=\"7\">Для простого выражения звёздочка — самая короткая форма.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому её часто используют с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Используйте <strong>блок<\/strong>, если коду нужно больше одного выражения.<\/span> <span class=\"sg\" data-s=\"1\">Блок лучше и тогда, когда помогает понятное имя параметра.<\/span> <span class=\"sg\" data-s=\"2\">Используйте <strong>звёздочку<\/strong>, если хватает одного короткого выражения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Несколько звёздочек<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>*<\/code> в выражении — отдельный аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Они идут по порядку.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому две звёздочки дают функцию с <strong>двумя<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>* + *<\/code> — функция с двумя аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Она складывает их.<\/span> <span class=\"sg\" data-s=\"2\">Например, это могут быть текущая сумма и следующий элемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Одна звёздочка Whatever<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Одна звёздочка, <code>*<\/code>, значит «что угодно».<\/span> <span class=\"sg\" data-s=\"1\">Она может значить «сколько есть».<\/span> <span class=\"sg\" data-s=\"2\">Ещё она может значить «без ограничения».<\/span> <span class=\"sg\" data-s=\"3\">Вот два частых примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * — это длина массива, поэтому *-1 — последний индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* — это диапазон без верхней границы<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звёздочка — это количество элементов.<\/span> <span class=\"sg\" data-s=\"1\">В <code>1..*<\/code> звёздочка значит «нет верхней границы».<\/span> <span class=\"sg\" data-s=\"2\">Иногда звёздочка создаёт функцию.<\/span> <span class=\"sg\" data-s=\"3\">Иногда она значит «что угодно».<\/span> <span class=\"sg\" data-s=\"4\">В любом случае это одно из самых полезных сокращений в Raku.<\/span><\/p>"]]},"uk":{"t":"Зірочка Whatever","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви бачили <code>*<\/code> у таких виразах, як <code>* * 2<\/code> або <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви використовуєте їх із <code>map<\/code> і <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ця <code>*<\/code> — <em>зірочка Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вираз навколо неї створює невелику функцію.<\/span> <span class=\"sg\" data-s=\"4\">Ця функція має один аргумент.<\/span> <span class=\"sg\" data-s=\"5\">Raku створює її прямо тут, на місці.<\/span> <span class=\"sg\" data-s=\"6\">Цей розділ пояснює, чим насправді є зірочка.<\/span> <span class=\"sg\" data-s=\"7\">Ще він порівнює зірочку з блоком.<\/span> <span class=\"sg\" data-s=\"8\">А ще він показує, де сама зірочка просто означає «як завгодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зірочка створює функцію<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У виразі може бути <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді Raku перетворює весь вираз на функцію.<\/span> <span class=\"sg\" data-s=\"2\">Ця функція — <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У ній зірочка означає аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — це функція.<\/span> <span class=\"sg\" data-s=\"1\">Вона бере один аргумент і множить його на два.<\/span> <span class=\"sg\" data-s=\"2\">Ось чому працює <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> отримує саме таку функцію з одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever чи блок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вираз із Whatever — це короткий спосіб записати функцію.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете записати ту саму функцію й блоком.<\/span> <span class=\"sg\" data-s=\"2\">Ці три рядки роблять те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Форма з Whatever не має імені параметра.<\/span> <span class=\"sg\" data-s=\"1\">Форма з блоком використовує топічну змінну <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Стрілкова форма має ім'я <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Остання, <code>-&gt; $x { ... }<\/code>, сама є невеликою функцією.<\/span> <span class=\"sg\" data-s=\"4\">Ви вивчите її пізніше, у розділі <a href=\"https://course.raku.org/uk/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонімні підпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Тут просто вважайте її третьою формою тієї самої функції.<\/span> <span class=\"sg\" data-s=\"6\">Ця функція має один аргумент.<\/span> <span class=\"sg\" data-s=\"7\">Для простого виразу зірочка найкоротша.<\/span> <span class=\"sg\" data-s=\"8\">Тому її часто використовують із <code>map<\/code>, <code>grep<\/code> і <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <strong>блок<\/strong>, якщо коду потрібно більше одного виразу.<\/span> <span class=\"sg\" data-s=\"1\">Блок також кращий, якщо допомагає зрозуміле ім'я параметра.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте <strong>зірочку<\/strong>, якщо досить одного короткого виразу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше ніж одна зірочка<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожна <code>*<\/code> у виразі — окремий аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Вони йдуть по порядку.<\/span> <span class=\"sg\" data-s=\"2\">Тож дві зірочки створюють функцію з <strong>двома<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>* + *<\/code> — функція з двома аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Вона їх додає.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, це можуть бути сума до цього моменту й наступний елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зірочка Whatever сама по собі<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Сама зірочка, <code>*<\/code>, означає «як завгодно».<\/span> <span class=\"sg\" data-s=\"1\">Вона може означати «скільки є всього».<\/span> <span class=\"sg\" data-s=\"2\">Ще вона може означати «без обмежень».<\/span> <span class=\"sg\" data-s=\"3\">Ось два звичні застосування:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * це довжина масиву, тож *-1 це останній індекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* це відкритий діапазон<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У <code>@a[*-1]<\/code> зірочка — це кількість елементів.<\/span> <span class=\"sg\" data-s=\"1\">У <code>1..*<\/code> зірочка означає «без верхньої межі».<\/span> <span class=\"sg\" data-s=\"2\">Іноді зірочка створює функцію.<\/span> <span class=\"sg\" data-s=\"3\">Іноді вона означає «як завгодно».<\/span> <span class=\"sg\" data-s=\"4\">У будь-якому разі це одне з найкорисніших скорочень у Raku.<\/span><\/p>"]]},"bg":{"t":"Звездата Whatever 🆕","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Може би сте виждали <code>*<\/code> в изрази като <code>* * 2<\/code> или <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Използвате ги с <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тази <code>*<\/code> е <em>Whatever звездата<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Изразът около нея създава малка функция.<\/span> <span class=\"sg\" data-s=\"4\">Функцията има един аргумент.<\/span> <span class=\"sg\" data-s=\"5\">Raku я създава точно там, на място.<\/span> <span class=\"sg\" data-s=\"6\">Този раздел обяснява какво всъщност е звездата.<\/span> <span class=\"sg\" data-s=\"7\">Той също сравнява звездата с блок.<\/span> <span class=\"sg\" data-s=\"8\">И показва къде звездата сама просто означава „каквото искате“.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звездата създава функция<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Един израз може да съдържа <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава Raku превръща целия израз във функция.<\/span> <span class=\"sg\" data-s=\"2\">Тази функция е <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В нея звездата заема мястото на аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> е функция.<\/span> <span class=\"sg\" data-s=\"1\">Тя приема един аргумент и го умножава по две.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>(1..5).map(* * 2)<\/code> работи.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> получава точно такава функция с един аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever или блок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever изразът е кратък начин да напишете функция.<\/span> <span class=\"sg\" data-s=\"1\">Можете да напишете същата функция и като блок.<\/span> <span class=\"sg\" data-s=\"2\">Тези три реда правят едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Whatever формата няма име на параметър.<\/span> <span class=\"sg\" data-s=\"1\">Блоковата форма използва тематичната променлива <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pointy формата има името <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Последната, <code>-&gt; $x { ... }<\/code>, сама по себе си е малка функция.<\/span> <span class=\"sg\" data-s=\"4\">Ще научите за нея по-късно, в <a href=\"https://course.raku.org/bg/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимни подпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Тук я гледайте просто като трета форма на същата функция.<\/span> <span class=\"sg\" data-s=\"6\">Тази функция има един аргумент.<\/span> <span class=\"sg\" data-s=\"7\">За прост израз звездата е най-кратка.<\/span> <span class=\"sg\" data-s=\"8\">Затова хората често я използват с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Използвайте <strong>блок<\/strong>, ако кодът има нужда от повече от един израз.<\/span> <span class=\"sg\" data-s=\"1\">Блокът е по-добър и ако ясно име на параметър помага.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте <strong>звездата<\/strong>, ако един кратък израз е достатъчен.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една звезда<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяка <code>*<\/code> в израза е отделен аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Те идват по ред.<\/span> <span class=\"sg\" data-s=\"2\">Така две звезди правят функция с <strong>два<\/strong> аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>* + *<\/code> е функция с два аргумента.<\/span> <span class=\"sg\" data-s=\"1\">Тя ги събира.<\/span> <span class=\"sg\" data-s=\"2\">Например те могат да са сумата досега и следващият елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever звездата сама по себе си<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Звездата сама, <code>*<\/code>, означава „каквото и да е“.<\/span> <span class=\"sg\" data-s=\"1\">Тя може да значи „колкото има“.<\/span> <span class=\"sg\" data-s=\"2\">Може да значи и „без граница“.<\/span> <span class=\"sg\" data-s=\"3\">Ето две чести употреби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * е дължината на масива, така че *-1 е последният индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* е отворен диапазон<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звездата е броят на елементите.<\/span> <span class=\"sg\" data-s=\"1\">В <code>1..*<\/code> звездата означава „без горна граница“.<\/span> <span class=\"sg\" data-s=\"2\">Понякога звездата създава функция.<\/span> <span class=\"sg\" data-s=\"3\">Понякога тя означава „каквото искате“.<\/span> <span class=\"sg\" data-s=\"4\">И в двата случая тя е един от най-полезните кратки записи в Raku.<\/span><\/p>"]]},"eo":{"t":"La Whatever-stelo","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Eble vi vidis <code>*<\/code> en esprimoj kiel <code>* * 2<\/code> aŭ <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi uzas ilin kun <code>map<\/code> kaj <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu <code>*<\/code> estas la <em>Whatever-stelo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La esprimo ĉirkaŭ ĝi faras malgrandan funkcion.<\/span> <span class=\"sg\" data-s=\"4\">La funkcio havas unu argumenton.<\/span> <span class=\"sg\" data-s=\"5\">Raku faras ĝin ĝuste tie, surloke.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu sekcio klarigas, kio la stelo vere estas.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ankaŭ komparas la stelon kun bloko.<\/span> <span class=\"sg\" data-s=\"8\">Kaj ĝi montras, kie la stelo sola simple signifas “kion ajn vi volas”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stelo kreas funkcion<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esprimo povas enhavi <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam Raku faras funkcion el la tuta esprimo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu funkcio estas <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">En ĝi, la stelo reprezentas la argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> estas funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas unu argumenton kaj multiplikas ĝin per du.<\/span> <span class=\"sg\" data-s=\"2\">Tial <code>(1..5).map(* * 2)<\/code> funkcias.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> ricevas ĝuste tian funkcion kun unu argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever aŭ bloko<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever-esprimo estas mallonga maniero skribi funkcion.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas skribi la saman funkcion kiel blokon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj tri linioj faras la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La Whatever-formo ne havas nomon de parametro.<\/span> <span class=\"sg\" data-s=\"1\">La blok-formo uzas la teman variablon <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La pinta formo havas la nomon <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La lasta, <code>-&gt; $x { ... }<\/code>, mem estas malgranda funkcio.<\/span> <span class=\"sg\" data-s=\"4\">Vi lernos pri ĝi poste, en <a href=\"https://course.raku.org/eo/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonimaj subrutinoj<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tie, vidu ĝin simple kiel trian formon de la sama funkcio.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu funkcio havas unu argumenton.<\/span> <span class=\"sg\" data-s=\"7\">Por simpla esprimo, la stelo estas la plej mallonga.<\/span> <span class=\"sg\" data-s=\"8\">Tial oni ofte uzas ĝin kun <code>map<\/code>, <code>grep<\/code> kaj <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzu <strong>blokon<\/strong>, se la kodo bezonas pli ol unu esprimon.<\/span> <span class=\"sg\" data-s=\"1\">Bloko estas ankaŭ pli bona, se klara nomo de parametro helpas.<\/span> <span class=\"sg\" data-s=\"2\">Uzu la <strong>stelon<\/strong>, se unu mallonga esprimo sufiĉas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu stelo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>*<\/code> en la esprimo estas aparta argumento.<\/span> <span class=\"sg\" data-s=\"1\">Ili venas laŭ ordo.<\/span> <span class=\"sg\" data-s=\"2\">Do du steloj faras funkcion kun <strong>du<\/strong> argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>* + *<\/code> estas funkcio kun du argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi adicias ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, ili povas esti la sumo ĝis nun kaj la sekva elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La Whatever-stelo sola<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La stelo sola, <code>*<\/code>, signifas “kion ajn”.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas signifi “tiom, kiom estas”.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas signifi ankaŭ “sen limo”.<\/span> <span class=\"sg\" data-s=\"3\">Jen du oftaj uzoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * estas la tabellongo, do *-1 estas la lasta indekso\n\nsay (1..*).head(3); # (1 2 3)  — 1..* estas senfinpunkta amplekso<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code>, la stelo estas la nombro de elementoj.<\/span> <span class=\"sg\" data-s=\"1\">En <code>1..*<\/code>, la stelo signifas “sen supra limo”.<\/span> <span class=\"sg\" data-s=\"2\">Kelkfoje la stelo faras funkcion.<\/span> <span class=\"sg\" data-s=\"3\">Kelkfoje ĝi signifas “kion ajn vi volas”.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiuokaze, ĝi estas unu el la plej utilaj mallongaj formoj de Raku.<\/span><\/p>"]]},"la":{"t":"Stella Whatever","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Fortasse <code>*<\/code> in expressionibus ut <code>* * 2<\/code> vel <code>* %% 2<\/code> vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Eas cum <code>map<\/code> et <code>grep<\/code> adhibes.<\/span> <span class=\"sg\" data-s=\"2\">Hoc <code>*<\/code> est <em>stella Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Expressio circa eam parvam functionem facit.<\/span> <span class=\"sg\" data-s=\"4\">Functio unum argumentum habet.<\/span> <span class=\"sg\" data-s=\"5\">Raku eam ibi statim facit.<\/span> <span class=\"sg\" data-s=\"6\">Haec sectio explicat quid stella vere sit.<\/span> <span class=\"sg\" data-s=\"7\">Etiam stellam cum clausula comparat.<\/span> <span class=\"sg\" data-s=\"8\">Et ostendit ubi stella sola simpliciter «quidquid vis» significet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stella functionem facit<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Expressio <code>*<\/code> continere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum Raku totam expressionem in functionem vertit.<\/span> <span class=\"sg\" data-s=\"2\">Haec functio est <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In ea stella argumentum significat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> est functio.<\/span> <span class=\"sg\" data-s=\"1\">Unum argumentum accipit et id per duo multiplicat.<\/span> <span class=\"sg\" data-s=\"2\">Ideo <code>(1..5).map(* * 2)<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"3\"><code>map<\/code> prorsus talem functionem cum uno argumento accipit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever aut clausula<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Expressio Whatever est modus brevis functionem scribendi.<\/span> <span class=\"sg\" data-s=\"1\">Eandem functionem etiam ut clausulam scribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Hae tres lineae idem faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Forma Whatever nomen parametri non habet.<\/span> <span class=\"sg\" data-s=\"1\">Forma clausulae variabilem thematis <code>$_<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Forma cuspidata nomen <code>$x<\/code> habet.<\/span> <span class=\"sg\" data-s=\"3\">Ultima, <code>-&gt; $x { ... }<\/code>, ipsa parva functio est.<\/span> <span class=\"sg\" data-s=\"4\">De ea postea disces, in <a href=\"https://course.raku.org/la/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subprogrammatis anonymis<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Hic eam simpliciter ut tertiam formam eiusdem functionis vide.<\/span> <span class=\"sg\" data-s=\"6\">Haec functio unum argumentum habet.<\/span> <span class=\"sg\" data-s=\"7\">Pro expressione simplici stella brevissima est.<\/span> <span class=\"sg\" data-s=\"8\">Ideo homines eam saepe cum <code>map<\/code>, <code>grep<\/code> et <code>sort<\/code> adhibent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Clausulam<\/strong> adhibe si codex plus quam unam expressionem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Clausula etiam melior est si clarum nomen parametri adiuvat.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Stellam<\/strong> adhibe si una brevis expressio satis est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plures stellae<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quaeque <code>*<\/code> in expressione est argumentum separatum.<\/span> <span class=\"sg\" data-s=\"1\">Ordine veniunt.<\/span> <span class=\"sg\" data-s=\"2\">Itaque duae stellae functionem cum <strong>duobus<\/strong> argumentis faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic <code>* + *<\/code> est functio cum duobus argumentis.<\/span> <span class=\"sg\" data-s=\"1\">Haec argumenta addit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, summa adhuc collecta et elementum sequens esse possunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stella Whatever sola<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Stella sola, <code>*<\/code>, «quidquid» significat.<\/span> <span class=\"sg\" data-s=\"1\">Significare potest «quantum est».<\/span> <span class=\"sg\" data-s=\"2\">Etiam «nullum limitem» significare potest.<\/span> <span class=\"sg\" data-s=\"3\">Ecce duo usus communes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * est longitudo ordinis, ergo *-1 est index ultimus\n\nsay (1..*).head(3); # (1 2 3)  — 1..* est intervallum sine fine<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> stella est numerus elementorum.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code> stella «nullum terminum superiorem» significat.<\/span> <span class=\"sg\" data-s=\"2\">Interdum stella functionem facit.<\/span> <span class=\"sg\" data-s=\"3\">Interdum «quidquid vis» significat.<\/span> <span class=\"sg\" data-s=\"4\">Utroque modo, est una ex utilissimis formis brevibus Raku.<\/span><\/p>"]]}}}</script>
