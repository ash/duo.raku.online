class=\"sg\" data-s=\"4\">Puoi dare tu i pesi.<\/span> <span class=\"sg\" data-s=\"5\">Metti ogni valore in coppia con il suo peso.<\/span> <span class=\"sg\" data-s=\"6\">Poi trasforma la lista in un mix con <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Prendi un peso con <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sommi i pesi con <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tutti e due funzionano come per un bag.<\/span> <span class=\"sg\" data-s=\"3\">Solo che i numeri non devono essere interi.<\/span> <span class=\"sg\" data-s=\"4\">Qui <code>total<\/code> somma i pesi <code>2.5<\/code> e <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Il risultato è <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Quindi <code>total<\/code> dà la somma dei pesi.<\/span> <span class=\"sg\" data-s=\"7\">Non conta i valori.<\/span> <span class=\"sg\" data-s=\"8\">I bag e i mix sono utili quando devi contare delle quantità.<\/span> <span class=\"sg\" data-s=\"9\">Per esempio, un bag può contare le parole in un testo.<\/span> <span class=\"sg\" data-s=\"10\">Ti dice quante volte compare ogni parola.<\/span> <span class=\"sg\" data-s=\"11\">Un mix può dare dei pesi a delle opzioni.<\/span><\/p>"]]},"lv":{"t":"Somas un maisījumi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Kopa atceras tikai to, <em>vai<\/em> vērtība tajā ir.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz jūs gribat zināt arī, <em>cik reižu<\/em> tā tur ir.<\/span> <span class=\"sg\" data-s=\"2\">Tam ir <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas katrai vērtībai glabā skaitu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai izveidotu maisu, izmantojiet rutīnu <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maiss nesavieno atkārtotas vērtības vienā.<\/span> <span class=\"sg\" data-s=\"2\">Tas tās saskaita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prasiet maisam vērtību ar indeksu <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs uzzināt, cik reižu šī vērtība nonāca maisā.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>total<\/code> saskaita visus skaitus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> ir līdzīgs maisam.<\/span> <span class=\"sg\" data-s=\"1\">Bet maisījumā skaitus sauc par <em>svariem<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Svaram nav jābūt veselam skaitlim.<\/span> <span class=\"sg\" data-s=\"3\">Tas var būt arī daļskaitlis.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat norādīt svarus paši.<\/span> <span class=\"sg\" data-s=\"5\">Savienojiet katru vērtību pārī ar tās svaru.<\/span> <span class=\"sg\" data-s=\"6\">Pēc tam pārvērtiet sarakstu par maisījumu ar <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Svaru jūs iegūstat ar <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Svarus jūs saskaitāt ar <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Abi darbojas tāpat kā maisam.<\/span> <span class=\"sg\" data-s=\"3\">Tikai skaitļiem nav jābūt veseliem.<\/span> <span class=\"sg\" data-s=\"4\">Šeit <code>total<\/code> saskaita svarus <code>2.5<\/code> un <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Rezultāts ir <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tātad <code>total<\/code> dod svaru summu.<\/span> <span class=\"sg\" data-s=\"7\">Tas neskaita vērtības.<\/span> <span class=\"sg\" data-s=\"8\">Maisi un maisījumi noder, kad jums jāskaita daudzumi.<\/span> <span class=\"sg\" data-s=\"9\">Piemēram, maiss var saskaitīt vārdus tekstā.<\/span> <span class=\"sg\" data-s=\"10\">Tas pasaka, cik bieži parādās katrs vārds.<\/span> <span class=\"sg\" data-s=\"11\">Maisījums var dot svarus izvēles variantiem.<\/span><\/p>"]]},"ru":{"t":"Мультимножества и смеси","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Множество помнит только, <em>есть ли<\/em> в нём значение.<\/span> <span class=\"sg\" data-s=\"1\">Иногда вы хотите знать ещё, <em>сколько раз<\/em> оно там есть.<\/span> <span class=\"sg\" data-s=\"2\">Для этого есть <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он хранит счётчик для каждого значения.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать мультимножество, используйте подпрограмму <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мультимножество не соединяет повторы в одно значение.<\/span> <span class=\"sg\" data-s=\"2\">Оно их считает:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Спросите мультимножество о значении с помощью индекса <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так вы узнаёте, сколько раз это значение попало в мультимножество.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>total<\/code> складывает все счётчики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> похож на мультимножество.<\/span> <span class=\"sg\" data-s=\"1\">Но в смеси счётчики называются <em>весами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вес не обязательно целое число.<\/span> <span class=\"sg\" data-s=\"3\">Он может быть и дробью.<\/span> <span class=\"sg\" data-s=\"4\">Вы можете сами задать веса.<\/span> <span class=\"sg\" data-s=\"5\">Соедините каждое значение с его весом в пару.<\/span> <span class=\"sg\" data-s=\"6\">Потом превратите список в смесь с помощью <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Вы получаете вес с помощью <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы складываете веса с помощью <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Оба способа работают так же, как для мультимножества.<\/span> <span class=\"sg\" data-s=\"3\">Только числа не обязаны быть целыми.<\/span> <span class=\"sg\" data-s=\"4\">Здесь <code>total<\/code> складывает веса <code>2.5<\/code> и <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Результат — <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Значит, <code>total<\/code> даёт сумму весов.<\/span> <span class=\"sg\" data-s=\"7\">Он не считает значения.<\/span> <span class=\"sg\" data-s=\"8\">Мультимножества и смеси полезны, когда нужно считать количества.<\/span> <span class=\"sg\" data-s=\"9\">Например, мультимножество может посчитать слова в тексте.<\/span> <span class=\"sg\" data-s=\"10\">Оно показывает, как часто встречается каждое слово.<\/span> <span class=\"sg\" data-s=\"11\">А смесь может дать веса вариантам.<\/span><\/p>"]]},"uk":{"t":"Мультимножини та суміші","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Множина пам'ятає лише, <em>чи<\/em> є в ній значення.<\/span> <span class=\"sg\" data-s=\"1\">Іноді ви також хочете знати, <em>скільки разів<\/em> воно там трапляється.<\/span> <span class=\"sg\" data-s=\"2\">Для цього є <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він зберігає лічильник для кожного значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб створити мультимножину, використайте підпрограму <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мультимножина не з'єднує повторені значення в одне.<\/span> <span class=\"sg\" data-s=\"2\">Вона їх рахує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Запитайте мультимножину про значення через індекс <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви отримаєте, скільки разів це значення потрапило в мультимножину.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>total<\/code> додає всі лічильники:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> схожий на мультимножину.<\/span> <span class=\"sg\" data-s=\"1\">Але в суміші лічильники називають <em>вагами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вага не мусить бути цілим числом.<\/span> <span class=\"sg\" data-s=\"3\">Вона може бути й дробом.<\/span> <span class=\"sg\" data-s=\"4\">Ви можете самі задати ваги.<\/span> <span class=\"sg\" data-s=\"5\">Поєднайте кожне значення з його вагою в пару.<\/span> <span class=\"sg\" data-s=\"6\">Потім перетворіть список на суміш через <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Вагу ви отримуєте через <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ваги ви додаєте через <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Обидва способи працюють так само, як для мультимножини.<\/span> <span class=\"sg\" data-s=\"3\">Лише числа не мусять бути цілими.<\/span> <span class=\"sg\" data-s=\"4\">Тут <code>total<\/code> додає ваги <code>2.5<\/code> і <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Результат — <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тож <code>total<\/code> дає суму ваг.<\/span> <span class=\"sg\" data-s=\"7\">Він не рахує значення.<\/span> <span class=\"sg\" data-s=\"8\">Мультимножини й суміші корисні, коли треба рахувати кількості.<\/span> <span class=\"sg\" data-s=\"9\">Наприклад, мультимножина може рахувати слова в тексті.<\/span> <span class=\"sg\" data-s=\"10\">Вона каже, як часто трапляється кожне слово.<\/span> <span class=\"sg\" data-s=\"11\">Суміш може давати ваги варіантам.<\/span><\/p>"]]},"bg":{"t":"Торби и смеси","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Множеството помни само <em>дали<\/em> една стойност е в него.<\/span> <span class=\"sg\" data-s=\"1\">Понякога искате да знаете и <em>колко пъти<\/em> я има.<\/span> <span class=\"sg\" data-s=\"2\">За това има <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той пази брояч за всяка стойност.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да създадете торба, използвайте подпрограмата <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Торбата не слива повторените стойности в една.<\/span> <span class=\"sg\" data-s=\"2\">Тя ги брои:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Попитайте торбата за стойност с индекса <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Получавате колко пъти тази стойност е влязла в торбата.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>total<\/code> събира всички броячи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> е като торба.<\/span> <span class=\"sg\" data-s=\"1\">Но в сместа броячите се наричат <em>тегла<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Теглото не е задължително цяло число.<\/span> <span class=\"sg\" data-s=\"3\">То може да е и дроб.<\/span> <span class=\"sg\" data-s=\"4\">Можете сами да зададете теглата.<\/span> <span class=\"sg\" data-s=\"5\">Свържете всяка стойност с нейното тегло.<\/span> <span class=\"sg\" data-s=\"6\">После превърнете списъка в смес с <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Получавате тегло с <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Събирате теглата с <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">И двете работят както при торбата.<\/span> <span class=\"sg\" data-s=\"3\">Само че числата може да не са цели.<\/span> <span class=\"sg\" data-s=\"4\">Тук <code>total<\/code> събира теглата <code>2.5<\/code> и <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Резултатът е <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Значи <code>total<\/code> дава сумата на теглата.<\/span> <span class=\"sg\" data-s=\"7\">Той не брои стойностите.<\/span> <span class=\"sg\" data-s=\"8\">Торбите и смесите са полезни, когато трябва да броите количества.<\/span> <span class=\"sg\" data-s=\"9\">Например торбата може да брои думите в текст.<\/span> <span class=\"sg\" data-s=\"10\">Тя ви казва колко често се среща всяка дума.<\/span> <span class=\"sg\" data-s=\"11\">Сместа може да дава тегла на опции.<\/span><\/p>"]]},"eo":{"t":"Sakoj kaj miksaĵoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Aro memoras nur, <em>ĉu<\/em> valoro estas en ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Foje vi ankaŭ volas scii, <em>kiom da fojoj<\/em> ĝi estas tie.<\/span> <span class=\"sg\" data-s=\"2\">Por tio ekzistas la <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi tenas kalkulon por ĉiu valoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por fari sakon, uzu la rutinon <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sako ne kunigas ripetitajn valorojn en unu.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi kalkulas ilin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Petu valoron de la sako per la subskribo <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ricevas, kiom da fojoj ĉi tiu valoro eniris la sakon.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>total<\/code> sumigas ĉiujn kalkulojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> similas al sako.<\/span> <span class=\"sg\" data-s=\"1\">Sed en miksaĵo, la kalkuloj nomiĝas <em>pezoj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Pezo ne devas esti tuta nombro.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi povas ankaŭ esti frakcio.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas mem doni la pezojn.<\/span> <span class=\"sg\" data-s=\"5\">Parigu ĉiun valoron kun ĝia pezo.<\/span> <span class=\"sg\" data-s=\"6\">Poste faru el la listo miksaĵon per <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Vi ricevas pezon per <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi sumigas la pezojn per <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ambaŭ funkcias same kiel por sako.<\/span> <span class=\"sg\" data-s=\"3\">Nur la nombroj ne devas esti tutaj.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tie, <code>total<\/code> sumigas la pezojn <code>2.5<\/code> kaj <code>0.75<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La rezulto estas <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Do <code>total<\/code> donas la sumon de la pezoj.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ne kalkulas la valorojn.<\/span> <span class=\"sg\" data-s=\"8\">Sakoj kaj miksaĵoj estas utilaj, kiam vi bezonas kalkuli kvantojn.<\/span> <span class=\"sg\" data-s=\"9\">Ekzemple, sako povas kalkuli la vortojn en teksto.<\/span> <span class=\"sg\" data-s=\"10\">Ĝi diras al vi, kiom ofte ĉiu vorto aperas.<\/span> <span class=\"sg\" data-s=\"11\">Miksaĵo povas doni pezojn al opcioj.<\/span><\/p>"]]},"la":{"t":"Sacculi et mixturae","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Coniunctum solum meminit <em>num<\/em> valor in eo sit.<\/span> <span class=\"sg\" data-s=\"1\">Interdum etiam scire vis <em>quotiens<\/em> ibi sit.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc habemus <code>Bag<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Numerum pro quoque valore servat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut sacculum facias, functionem <code>bag<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Sacculus valores repetitos in unum non iungit.<\/span> <span class=\"sg\" data-s=\"2\">Eos numerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sacculum de valore interroga cum subscripto <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Accipis quotiens hunc valorem in sacculum posueris.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>total<\/code> omnes numeros addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> similis est sacculo.<\/span> <span class=\"sg\" data-s=\"1\">Sed in mixtura numeri <em>pondera<\/em> vocantur.<\/span> <span class=\"sg\" data-s=\"2\">Pondus non semper numerus integer est.<\/span> <span class=\"sg\" data-s=\"3\">Etiam fractio esse potest.<\/span> <span class=\"sg\" data-s=\"4\">Pondera ipse dare potes.<\/span> <span class=\"sg\" data-s=\"5\">Quemque valorem cum pondere suo coniunge.<\/span> <span class=\"sg\" data-s=\"6\">Deinde indicem in mixturam cum <code>.Mix<\/code> converte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Pondus cum <code>&lt; &gt;<\/code> accipis.<\/span> <span class=\"sg\" data-s=\"1\">Pondera cum <code>total<\/code> addis.<\/span> <span class=\"sg\" data-s=\"2\">Ambo eodem modo operantur ac pro sacculo.<\/span> <span class=\"sg\" data-s=\"3\">Solum numeri non semper integri sunt.<\/span> <span class=\"sg\" data-s=\"4\">Hic <code>total<\/code> pondera <code>2.5<\/code> et <code>0.75<\/code> addit.<\/span> <span class=\"sg\" data-s=\"5\">Eventus est <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Itaque <code>total<\/code> summam ponderum dat.<\/span> <span class=\"sg\" data-s=\"7\">Valores non numerat.<\/span> <span class=\"sg\" data-s=\"8\">Sacculi et mixturae utiles sunt cum quantitates numerare debes.<\/span> <span class=\"sg\" data-s=\"9\">Exempli gratia, sacculus verba in textu numerare potest.<\/span> <span class=\"sg\" data-s=\"10\">Tibi dicit quotiens quodque verbum appareat.<\/span> <span class=\"sg\" data-s=\"11\">Mixtura optionibus pondera dare potest.<\/span><\/p>"]]}}}</script>
