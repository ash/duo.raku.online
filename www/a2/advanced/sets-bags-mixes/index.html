<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes","n":490,"k":"section","pv":"advanced/date-and-time/exercises/day-of-week/solution","nx":"advanced/sets-bags-mixes/operations","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sets, bags, and mixes","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku has arrays and hashes.<\/span> <span class=\"sg\" data-s=\"1\">It also has a few special containers for groups of values.<\/span> <span class=\"sg\" data-s=\"2\">The simplest one is the <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Its values are <em>distinct<\/em>, so each value is different from the others.<\/span> <span class=\"sg\" data-s=\"4\">The values in a set have no order.<\/span> <span class=\"sg\" data-s=\"5\">A value is in the set, or it is not.<\/span> <span class=\"sg\" data-s=\"6\">If a value comes twice, the set ignores the second one.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To make a set, use the <code>set<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">Values that repeat become one value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">We give the set five numbers.<\/span> <span class=\"sg\" data-s=\"1\">But it has only three elements.<\/span> <span class=\"sg\" data-s=\"2\">This is because <code>1<\/code> and <code>2<\/code> appear more than once.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You usually ask a set one main question.<\/span> <span class=\"sg\" data-s=\"1\">Is a value in the set?<\/span> <span class=\"sg\" data-s=\"2\">The <code>∈<\/code> operator answers it.<\/span> <span class=\"sg\" data-s=\"3\">You read <code>∈<\/code> as “is an element of”.<\/span> <span class=\"sg\" data-s=\"4\">It returns a Boolean, <code>True<\/code> or <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maybe you want to use only plain ASCII characters.<\/span> <span class=\"sg\" data-s=\"1\">Then write the same operator as <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The next topics show how to combine sets.<\/span> <span class=\"sg\" data-s=\"1\">They also show bags and mixes.<\/span> <span class=\"sg\" data-s=\"2\">Bags and mixes are close relatives of sets.<\/span><\/p>"]]},"de":{"t":"Sets, Bags und Mixes","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku hat Arrays und Hashes.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat auch ein paar besondere Container für Gruppen von Werten.<\/span> <span class=\"sg\" data-s=\"2\">Der einfachste ist das <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Seine Werte sind <em>verschieden<\/em>, also ist jeder Wert anders als die anderen.<\/span> <span class=\"sg\" data-s=\"4\">Die Werte in einem Set haben keine Reihenfolge.<\/span> <span class=\"sg\" data-s=\"5\">Ein Wert ist im Set oder nicht.<\/span> <span class=\"sg\" data-s=\"6\">Wenn ein Wert zweimal kommt, ignoriert das Set den zweiten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Für ein Set benutze die Routine <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Werte, die sich wiederholen, werden zu einem Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wir geben dem Set fünf Zahlen.<\/span> <span class=\"sg\" data-s=\"1\">Aber es hat nur drei Elemente.<\/span> <span class=\"sg\" data-s=\"2\">Der Grund: <code>1<\/code> und <code>2<\/code> kommen mehr als einmal vor.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Einem Set stellst du meistens eine Hauptfrage.<\/span> <span class=\"sg\" data-s=\"1\">Ist ein Wert im Set?<\/span> <span class=\"sg\" data-s=\"2\">Der Operator <code>∈<\/code> beantwortet sie.<\/span> <span class=\"sg\" data-s=\"3\">Du liest <code>∈<\/code> als \"ist Element von\".<\/span> <span class=\"sg\" data-s=\"4\">Er gibt einen Booleschen Wert zurück, <code>True<\/code> oder <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vielleicht willst du nur einfache ASCII-Zeichen benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Dann schreib denselben Operator als <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, wie du Sets kombinierst.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch Bags und Mixes.<\/span> <span class=\"sg\" data-s=\"2\">Bags und Mixes sind enge Verwandte von Sets.<\/span><\/p>"]]},"nl":{"t":"Sets, bags en mixes","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku heeft arrays en hashes.<\/span> <span class=\"sg\" data-s=\"1\">Het heeft ook een paar speciale containers voor groepen waarden.<\/span> <span class=\"sg\" data-s=\"2\">De eenvoudigste is de <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De waarden ervan zijn <em>uniek<\/em>, dus elke waarde is anders dan de andere.<\/span> <span class=\"sg\" data-s=\"4\">De waarden in een set hebben geen volgorde.<\/span> <span class=\"sg\" data-s=\"5\">Een waarde zit in de set, of niet.<\/span> <span class=\"sg\" data-s=\"6\">Als een waarde twee keer voorkomt, negeert de set de tweede.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een set maak je met de <code>set<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"1\">Waarden die vaker voorkomen, worden één waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">We geven de set vijf getallen.<\/span> <span class=\"sg\" data-s=\"1\">Maar hij heeft maar drie elementen.<\/span> <span class=\"sg\" data-s=\"2\">Dat komt doordat <code>1<\/code> en <code>2<\/code> meer dan één keer voorkomen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Meestal stel je een set één hoofdvraag.<\/span> <span class=\"sg\" data-s=\"1\">Zit een waarde in de set?<\/span> <span class=\"sg\" data-s=\"2\">De operator <code>∈<\/code> geeft het antwoord.<\/span> <span class=\"sg\" data-s=\"3\">Je leest <code>∈<\/code> als \"is een element van\".<\/span> <span class=\"sg\" data-s=\"4\">Hij geeft een Boolean terug, <code>True<\/code> of <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Misschien wil je alleen gewone ASCII-tekens gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf dezelfde operator dan als <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je sets combineert.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook bags en mixes zien.<\/span> <span class=\"sg\" data-s=\"2\">Bags en mixes zijn nauwe familie van sets.<\/span><\/p>"]]},"es":{"t":"Conjuntos, bolsas y mezclas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku tiene arrays y hashes.<\/span> <span class=\"sg\" data-s=\"1\">También tiene algunos contenedores especiales para grupos de valores.<\/span> <span class=\"sg\" data-s=\"2\">El más simple es el <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sus valores son <em>distintos<\/em>, así que cada valor es diferente de los otros.<\/span> <span class=\"sg\" data-s=\"4\">Los valores de un set no tienen orden.<\/span> <span class=\"sg\" data-s=\"5\">Un valor está en el set, o no está.<\/span> <span class=\"sg\" data-s=\"6\">Si un valor aparece dos veces, el set ignora el segundo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para crear un set, usa la rutina <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los valores que se repiten se convierten en un solo valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le damos cinco números al set.<\/span> <span class=\"sg\" data-s=\"1\">Pero solo tiene tres elementos.<\/span> <span class=\"sg\" data-s=\"2\">Es porque <code>1<\/code> y <code>2<\/code> aparecen más de una vez.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalmente le haces a un set una pregunta principal.<\/span> <span class=\"sg\" data-s=\"1\">¿Está un valor en el set?<\/span> <span class=\"sg\" data-s=\"2\">El operador <code>∈<\/code> la responde.<\/span> <span class=\"sg\" data-s=\"3\">Lees <code>∈<\/code> como \"es un elemento de\".<\/span> <span class=\"sg\" data-s=\"4\">Devuelve un Booleano, <code>True<\/code> o <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quizás quieres usar solo caracteres ASCII simples.<\/span> <span class=\"sg\" data-s=\"1\">Entonces escribe el mismo operador como <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran cómo combinar sets.<\/span> <span class=\"sg\" data-s=\"1\">También muestran los bags y los mixes.<\/span> <span class=\"sg\" data-s=\"2\">Los bags y los mixes son parientes cercanos de los sets.<\/span><\/p>"]]},"it":{"t":"Set, bag e mix","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ha gli array e gli hash.<\/span> <span class=\"sg\" data-s=\"1\">Ha anche alcuni contenitori speciali per gruppi di valori.<\/span> <span class=\"sg\" data-s=\"2\">Il più semplice è il <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">I suoi valori sono <em>distinti<\/em>, quindi ogni valore è diverso dagli altri.<\/span> <span class=\"sg\" data-s=\"4\">I valori in un set non hanno un ordine.<\/span> <span class=\"sg\" data-s=\"5\">Un valore è nel set, oppure non c'è.<\/span> <span class=\"sg\" data-s=\"6\">Se un valore arriva due volte, il set ignora il secondo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per creare un set, usa la routine <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I valori che si ripetono diventano un solo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diamo al set cinque numeri.<\/span> <span class=\"sg\" data-s=\"1\">Ma il set ha solo tre elementi.<\/span> <span class=\"sg\" data-s=\"2\">Questo perché <code>1<\/code> e <code>2<\/code> compaiono più di una volta.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Di solito fai a un set una domanda principale.<\/span> <span class=\"sg\" data-s=\"1\">Un valore è nel set?<\/span> <span class=\"sg\" data-s=\"2\">L'operatore <code>∈<\/code> risponde a questa domanda.<\/span> <span class=\"sg\" data-s=\"3\">Leggi <code>∈<\/code> come “è un elemento di”.<\/span> <span class=\"sg\" data-s=\"4\">Restituisce un booleano, <code>True<\/code> o <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forse vuoi usare solo i semplici caratteri ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Allora scrivi lo stesso operatore come <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano come combinare i set.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche i bag e i mix.<\/span> <span class=\"sg\" data-s=\"2\">I bag e i mix sono parenti stretti dei set.<\/span><\/p>"]]},"lv":{"t":"Kopas, somas un maisījumi","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ir masīvi un jaukteņi.<\/span> <span class=\"sg\" data-s=\"1\">Raku ir arī daži īpaši konteineri vērtību grupām.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršākais no tiem ir <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā vērtības ir <em>atšķirīgas<\/em>, tāpēc katra vērtība atšķiras no citām.<\/span> <span class=\"sg\" data-s=\"4\">Kopas vērtībām nav secības.<\/span> <span class=\"sg\" data-s=\"5\">Vērtība ir kopā, vai arī tās tur nav.<\/span> <span class=\"sg\" data-s=\"6\">Ja vērtība parādās divreiz, kopa otro ignorē.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izveidotu kopu, izmantojiet rutīnu <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vērtības, kas atkārtojas, kļūst par vienu vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mēs dodam kopai piecus skaitļus.<\/span> <span class=\"sg\" data-s=\"1\">Bet tajā ir tikai trīs elementi.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tāpēc, ka <code>1<\/code> un <code>2<\/code> parādās vairāk nekā vienu reizi.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parasti jūs kopai uzdodat vienu galveno jautājumu.<\/span> <span class=\"sg\" data-s=\"1\">Vai vērtība ir kopā?<\/span> <span class=\"sg\" data-s=\"2\">Operators <code>∈<\/code> uz to atbild.<\/span> <span class=\"sg\" data-s=\"3\">«Ir elements no» — tā jūs lasāt <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas atgriež Būla vērtību, <code>True<\/code> vai <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūs gribat izmantot tikai vienkāršas ASCII rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Tad rakstiet to pašu operatoru kā <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, kā apvienot kopas.<\/span> <span class=\"sg\" data-s=\"1\">Tie parāda arī maisus un maisījumus.<\/span> <span class=\"sg\" data-s=\"2\">Maisi un maisījumi ir kopu tuvi radinieki.<\/span><\/p>"]]},"ru":{"t":"Множества, мультимножества и смеси","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В Raku есть массивы и хеши.<\/span> <span class=\"sg\" data-s=\"1\">Ещё в нём есть несколько особых контейнеров для групп значений.<\/span> <span class=\"sg\" data-s=\"2\">Самый простой из них — <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Его значения <em>уникальны<\/em>, то есть каждое значение отличается от других.<\/span> <span class=\"sg\" data-s=\"4\">У значений в множестве нет порядка.<\/span> <span class=\"sg\" data-s=\"5\">Значение либо есть в множестве, либо его нет.<\/span> <span class=\"sg\" data-s=\"6\">Если значение встречается дважды, множество пропускает второе.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать множество, используйте подпрограмму <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторяющиеся значения становятся одним значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Мы даём множеству пять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Но в нём только три элемента.<\/span> <span class=\"sg\" data-s=\"2\">Это потому, что <code>1<\/code> и <code>2<\/code> встречаются больше одного раза.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обычно вы задаёте множеству один главный вопрос.<\/span> <span class=\"sg\" data-s=\"1\">Есть ли значение в множестве?<\/span> <span class=\"sg\" data-s=\"2\">На него отвечает оператор <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вы читаете <code>∈<\/code> как «является элементом».<\/span> <span class=\"sg\" data-s=\"4\">Он возвращает булево значение, <code>True<\/code> или <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Может быть, вы хотите использовать только простые символы ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Тогда пишите тот же оператор как <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как комбинировать множества.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают мультимножества (bags) и смеси (mixes).<\/span> <span class=\"sg\" data-s=\"2\">Мультимножества и смеси — близкие родственники множеств.<\/span><\/p>"]]},"uk":{"t":"Множини, мультимножини та суміші","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У Raku є масиви й хеші.<\/span> <span class=\"sg\" data-s=\"1\">Також є кілька особливих контейнерів для груп значень.<\/span> <span class=\"sg\" data-s=\"2\">Найпростіший із них — <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Його значення <em>різні<\/em>, тобто кожне значення відрізняється від інших.<\/span> <span class=\"sg\" data-s=\"4\">Значення в множині не мають порядку.<\/span> <span class=\"sg\" data-s=\"5\">Значення або є в множині, або його там немає.<\/span> <span class=\"sg\" data-s=\"6\">Якщо значення трапляється двічі, множина ігнорує друге.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб створити множину, використайте підпрограму <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значення, що повторюються, стають одним значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ми даємо множині п'ять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Але вона має лише три елементи.<\/span> <span class=\"sg\" data-s=\"2\">Це тому, що <code>1<\/code> і <code>2<\/code> трапляються більше ніж один раз.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви зазвичай ставите множині одне головне запитання.<\/span> <span class=\"sg\" data-s=\"1\">Чи є значення в множині?<\/span> <span class=\"sg\" data-s=\"2\">Оператор <code>∈<\/code> відповідає на нього.<\/span> <span class=\"sg\" data-s=\"3\">Ви читаєте <code>∈<\/code> як «є елементом».<\/span> <span class=\"sg\" data-s=\"4\">Він повертає булеве значення, <code>True<\/code> або <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви хочете використовувати лише прості символи ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Тоді пишіть той самий оператор як <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як поєднувати множини.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують мультимножини й суміші.<\/span> <span class=\"sg\" data-s=\"2\">Мультимножини й суміші — близькі родичі множин.<\/span><\/p>"]]},"bg":{"t":"Множества, торби и смеси","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku има масиви и хешове.<\/span> <span class=\"sg\" data-s=\"1\">Той има и няколко специални контейнера за групи от стойности.<\/span> <span class=\"sg\" data-s=\"2\">Най-простият е <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Неговите стойности са <em>различни<\/em>, тоест всяка стойност се различава от другите.<\/span> <span class=\"sg\" data-s=\"4\">Стойностите в множеството нямат ред.<\/span> <span class=\"sg\" data-s=\"5\">Всяка стойност или е в множеството, или липсва.<\/span> <span class=\"sg\" data-s=\"6\">Ако една стойност дойде два пъти, множеството пропуска втората.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да създадете множество, използвайте подпрограмата <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стойностите, които се повтарят, стават една стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Даваме на множеството пет числа.<\/span> <span class=\"sg\" data-s=\"1\">Но то има само три елемента.<\/span> <span class=\"sg\" data-s=\"2\">Това е така, защото <code>1<\/code> и <code>2<\/code> се появяват повече от веднъж.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обикновено задавате на множеството един основен въпрос.<\/span> <span class=\"sg\" data-s=\"1\">Има ли дадена стойност в множеството?<\/span> <span class=\"sg\" data-s=\"2\">Операторът <code>∈<\/code> отговаря на този въпрос.<\/span> <span class=\"sg\" data-s=\"3\">Четете <code>∈<\/code> като „е елемент на“.<\/span> <span class=\"sg\" data-s=\"4\">Той връща булева стойност, <code>True<\/code> или <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Може би искате да използвате само обикновени ASCII символи.<\/span> <span class=\"sg\" data-s=\"1\">Тогава напишете същия оператор като <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да комбинирате множества.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и торбите и смесите.<\/span> <span class=\"sg\" data-s=\"2\">Торбите и смесите са близки роднини на множествата.<\/span><\/p>"]]},"eo":{"t":"Aroj, sakoj kaj miksaĵoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku havas tabelojn kaj hakojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ havas kelkajn specialajn ujojn por grupoj de valoroj.<\/span> <span class=\"sg\" data-s=\"2\">La plej simpla estas la <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝiaj valoroj estas <em>distingaj<\/em>, do ĉiu valoro diferencas de la aliaj.<\/span> <span class=\"sg\" data-s=\"4\">La valoroj en aro ne havas ordon.<\/span> <span class=\"sg\" data-s=\"5\">Valoro estas en la aro, aŭ ĝi ne estas.<\/span> <span class=\"sg\" data-s=\"6\">Se valoro venas dufoje, la aro ignoras la duan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por fari aron, uzu la rutinon <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Valoroj, kiuj ripetiĝas, fariĝas unu valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ni donas al la aro kvin nombrojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi havas nur tri elementojn.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas, ĉar <code>1<\/code> kaj <code>2<\/code> aperas pli ol unufoje.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kutime vi faras al aro unu ĉefan demandon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu valoro estas en la aro?<\/span> <span class=\"sg\" data-s=\"2\">La operatoro <code>∈<\/code> respondas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Vi legas <code>∈<\/code> kiel «estas elemento de».<\/span> <span class=\"sg\" data-s=\"4\">Ĝi redonas Boolean valoron, <code>True<\/code> aŭ <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eble vi volas uzi nur simplajn ASCII-signojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiam skribu la saman operatoron kiel <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel kombini arojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras sakojn kaj miksaĵojn.<\/span> <span class=\"sg\" data-s=\"2\">Sakoj kaj miksaĵoj estas proksimaj parencoj de aroj.<\/span><\/p>"]]},"la":{"t":"Coniuncta, sacculi, et mixturae","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ordines et hashes habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam aliquot receptacula specialia pro gregibus valorum habet.<\/span> <span class=\"sg\" data-s=\"2\">Simplicissimum est <code>Set<\/code>, id est coniunctum.<\/span> <span class=\"sg\" data-s=\"3\">Valores eius <em>distincti<\/em> sunt, itaque quisque valor ab aliis differt.<\/span> <span class=\"sg\" data-s=\"4\">Valores in coniuncto ordinem non habent.<\/span> <span class=\"sg\" data-s=\"5\">Valor in coniuncto est, aut non est.<\/span> <span class=\"sg\" data-s=\"6\">Si valor bis venit, coniunctum secundum neglegit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut coniunctum facias, functionem <code>set<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Valores repetiti unus valor fiunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Coniuncto quinque numeros damus.<\/span> <span class=\"sg\" data-s=\"1\">Sed solum tria elementa habet.<\/span> <span class=\"sg\" data-s=\"2\">Nam <code>1<\/code> et <code>2<\/code> plus quam semel apparent.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Coniuncto plerumque unam quaestionem praecipuam ponis.<\/span> <span class=\"sg\" data-s=\"1\">Estne valor in coniuncto?<\/span> <span class=\"sg\" data-s=\"2\">Operator <code>∈<\/code> ei respondet.<\/span> <span class=\"sg\" data-s=\"3\"><code>∈<\/code> legis ut “est elementum”.<\/span> <span class=\"sg\" data-s=\"4\">Valorem Booleanum reddit, <code>True<\/code> vel <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fortasse solum characteres ASCII simplices adhibere vis.<\/span> <span class=\"sg\" data-s=\"1\">Tum eundem operatorem ut <code>(elem)<\/code> scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Proxima themata ostendunt quomodo coniuncta componas.<\/span> <span class=\"sg\" data-s=\"1\">Etiam sacculos et mixturas ostendunt.<\/span> <span class=\"sg\" data-s=\"2\">Sacculi et mixturae propinqui cognati coniunctorum sunt.<\/span><\/p>"]]}}}</script>
