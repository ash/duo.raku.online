<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes/operations","n":491,"k":"topic","pv":"advanced/sets-bags-mixes","nx":"advanced/sets-bags-mixes/operations/quiz","tr":["advanced","advanced/sets-bags-mixes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Set operations","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">You can combine sets with the usual operations from set theory.<\/span> <span class=\"sg\" data-s=\"1\">Set theory is a part of mathematics.<\/span> <span class=\"sg\" data-s=\"2\">Each operator has a Unicode symbol.<\/span> <span class=\"sg\" data-s=\"3\">It also has a way to write it in ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Use the one that you like better.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <em>union<\/em> is <code>∪<\/code>, or <code>(|)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">It takes all the values from both sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The value <code>3<\/code> is in both sets.<\/span> <span class=\"sg\" data-s=\"1\">So the union has five distinct elements: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <em>intersection<\/em> is <code>∩<\/code>, or <code>(&amp;)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">It keeps only the values that are in both sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the intersection has <code>2<\/code> and <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">These values are in both sets.<\/span> <span class=\"sg\" data-s=\"2\">A set has no order.<\/span> <span class=\"sg\" data-s=\"3\">So in the output, the two elements can come in any order.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">These operations give a set too.<\/span> <span class=\"sg\" data-s=\"1\">So you can ask it the same questions.<\/span> <span class=\"sg\" data-s=\"2\">How many elements does it have?<\/span> <span class=\"sg\" data-s=\"3\">Is a certain value in it?<\/span><\/p>"]]},"de":{"t":"Mengenoperationen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Du kannst Sets mit den üblichen Operationen aus der Mengenlehre kombinieren.<\/span> <span class=\"sg\" data-s=\"1\">Die Mengenlehre ist ein Teil der Mathematik.<\/span> <span class=\"sg\" data-s=\"2\">Jeder Operator hat ein Unicode-Symbol.<\/span> <span class=\"sg\" data-s=\"3\">Man kann ihn auch in ASCII schreiben.<\/span> <span class=\"sg\" data-s=\"4\">Benutze die Form, die dir besser gefällt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <em>Vereinigung<\/em> ist <code>∪<\/code>, oder <code>(|)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt alle Werte aus beiden Sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Wert <code>3<\/code> ist in beiden Sets.<\/span> <span class=\"sg\" data-s=\"1\">Also hat die Vereinigung fünf verschiedene Elemente: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <em>Durchschnitt<\/em> ist <code>∩<\/code>, oder <code>(&amp;)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Er behält nur die Werte, die in beiden Sets sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — beachte, dass Sets ungeordnet sind\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier hat der Durchschnitt <code>2<\/code> und <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Diese Werte sind in beiden Sets.<\/span> <span class=\"sg\" data-s=\"2\">Ein Set hat keine Reihenfolge.<\/span> <span class=\"sg\" data-s=\"3\">Also können die zwei Elemente in der Ausgabe in jeder Reihenfolge kommen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diese Operationen geben auch ein Set.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du ihm dieselben Fragen stellen.<\/span> <span class=\"sg\" data-s=\"2\">Wie viele Elemente hat das Set?<\/span> <span class=\"sg\" data-s=\"3\">Ist ein bestimmter Wert darin?<\/span><\/p>"]]},"nl":{"t":"Set-operaties","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je kunt sets combineren met de gewone bewerkingen uit de verzamelingenleer.<\/span> <span class=\"sg\" data-s=\"1\">De verzamelingenleer is een deel van de wiskunde.<\/span> <span class=\"sg\" data-s=\"2\">Elke operator heeft een Unicode-symbool.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt hem ook in ASCII schrijven.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik de vorm die je het fijnst vindt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <em>vereniging<\/em> is <code>∪<\/code>, of <code>(|)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Die neemt alle waarden uit beide sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De waarde <code>3<\/code> zit in beide sets.<\/span> <span class=\"sg\" data-s=\"1\">Dus heeft de vereniging vijf unieke elementen: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <em>doorsnede<\/em> is <code>∩<\/code>, of <code>(&amp;)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Die houdt alleen de waarden die in beide sets zitten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — merk op dat sets ongeordend zijn\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier heeft de doorsnede <code>2<\/code> en <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deze waarden zitten in beide sets.<\/span> <span class=\"sg\" data-s=\"2\">Een set heeft geen volgorde.<\/span> <span class=\"sg\" data-s=\"3\">Dus kunnen de twee elementen in de uitvoer in elke volgorde staan.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Deze bewerkingen geven ook een set.<\/span> <span class=\"sg\" data-s=\"1\">Dus kun je hem dezelfde vragen stellen.<\/span> <span class=\"sg\" data-s=\"2\">Hoeveel elementen heeft hij?<\/span> <span class=\"sg\" data-s=\"3\">Zit een bepaalde waarde erin?<\/span><\/p>"]]},"es":{"t":"Operaciones de conjuntos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puedes combinar sets con las operaciones normales de la teoría de conjuntos.<\/span> <span class=\"sg\" data-s=\"1\">La teoría de conjuntos es una parte de las matemáticas.<\/span> <span class=\"sg\" data-s=\"2\">Cada operador tiene un símbolo Unicode.<\/span> <span class=\"sg\" data-s=\"3\">También tiene una forma de escribirlo en ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Usa la que más te guste.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>unión<\/em> es <code>∪<\/code>, o <code>(|)<\/code> en ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Toma todos los valores de los dos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El valor <code>3<\/code> está en los dos sets.<\/span> <span class=\"sg\" data-s=\"1\">Así que la unión tiene cinco elementos distintos: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>intersección<\/em> es <code>∩<\/code>, o <code>(&amp;)<\/code> en ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Guarda solo los valores que están en los dos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, la intersección tiene <code>2<\/code> y <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Estos valores están en los dos sets.<\/span> <span class=\"sg\" data-s=\"2\">Un set no tiene orden.<\/span> <span class=\"sg\" data-s=\"3\">Así que en la salida, los dos elementos pueden salir en cualquier orden.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estas operaciones también dan un set.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes hacerle las mismas preguntas.<\/span> <span class=\"sg\" data-s=\"2\">¿Cuántos elementos tiene?<\/span> <span class=\"sg\" data-s=\"3\">¿Está en él un valor concreto?<\/span><\/p>"]]},"it":{"t":"Operazioni sui set","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puoi combinare i set con le solite operazioni della teoria degli insiemi.<\/span> <span class=\"sg\" data-s=\"1\">La teoria degli insiemi è una parte della matematica.<\/span> <span class=\"sg\" data-s=\"2\">Ogni operatore ha un simbolo Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Ha anche un modo di scriverlo in ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Usa quello che ti piace di più.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'<em>unione<\/em> è <code>∪<\/code>, o <code>(|)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Prende tutti i valori dei due set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il valore <code>3<\/code> è in tutti e due i set.<\/span> <span class=\"sg\" data-s=\"1\">Quindi l'unione ha cinque elementi distinti: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'<em>intersezione<\/em> è <code>∩<\/code>, o <code>(&amp;)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Tiene solo i valori che sono in tutti e due i set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota che i set non sono ordinati\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui l'intersezione ha <code>2<\/code> e <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questi valori sono in tutti e due i set.<\/span> <span class=\"sg\" data-s=\"2\">Un set non ha un ordine.<\/span> <span class=\"sg\" data-s=\"3\">Così nell'output i due elementi possono venire in qualsiasi ordine.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anche queste operazioni danno un set.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi fargli le stesse domande.<\/span> <span class=\"sg\" data-s=\"2\">Quanti elementi ha?<\/span> <span class=\"sg\" data-s=\"3\">Un certo valore è nel set?<\/span><\/p>"]]},"lv":{"t":"Kopu operācijas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kopas var apvienot ar parastajām kopu teorijas operācijām.<\/span> <span class=\"sg\" data-s=\"1\">Kopu teorija ir matemātikas daļa.<\/span> <span class=\"sg\" data-s=\"2\">Katram operatoram ir Unikoda simbols.<\/span> <span class=\"sg\" data-s=\"3\">Tam ir arī veids, kā to rakstīt ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet to, kas jums labāk patīk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Apvienojums<\/em> ir <code>∪<\/code>, vai ASCII pierakstā <code>(|)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem visas vērtības no abām kopām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vērtība <code>3<\/code> ir abās kopās.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc apvienojumā ir pieci atšķirīgi elementi: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Šķēlums<\/em> ir <code>∩<\/code>, vai ASCII pierakstā <code>(&amp;)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas patur tikai tās vērtības, kas ir abās kopās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit šķēlumā ir <code>2<\/code> un <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šīs vērtības ir abās kopās.<\/span> <span class=\"sg\" data-s=\"2\">Kopai nav secības.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc izvadē abi elementi var būt jebkurā secībā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Arī šīs operācijas dod kopu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tai var uzdot tos pašus jautājumus.<\/span> <span class=\"sg\" data-s=\"2\">Cik tajā ir elementu?<\/span> <span class=\"sg\" data-s=\"3\">Vai tajā ir noteikta vērtība?<\/span><\/p>"]]},"ru":{"t":"Операции над множествами","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Множества можно комбинировать обычными операциями из теории множеств.<\/span> <span class=\"sg\" data-s=\"1\">Теория множеств — это часть математики.<\/span> <span class=\"sg\" data-s=\"2\">У каждого оператора есть символ в Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Ещё его можно записать в ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Используйте тот вариант, который вам больше нравится.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Объединение<\/em> — это <code>∪<\/code>, или <code>(|)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Оно берёт все значения из обоих множеств:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значение <code>3<\/code> есть в обоих множествах.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в объединении пять разных элементов: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Пересечение<\/em> — это <code>∩<\/code>, или <code>(&amp;)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Оно оставляет только значения, которые есть в обоих множествах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — обратите внимание, что множества неупорядочены\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь в пересечении <code>2<\/code> и <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Эти значения есть в обоих множествах.<\/span> <span class=\"sg\" data-s=\"2\">У множества нет порядка.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому при выводе два элемента могут идти в любом порядке.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Эти операции тоже дают множество.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому ему можно задать те же вопросы.<\/span> <span class=\"sg\" data-s=\"2\">Сколько в нём элементов?<\/span> <span class=\"sg\" data-s=\"3\">Есть ли в нём нужное значение?<\/span><\/p>"]]},"uk":{"t":"Операції над множинами","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Множини можна поєднувати звичайними операціями з теорії множин.<\/span> <span class=\"sg\" data-s=\"1\">Теорія множин — це частина математики.<\/span> <span class=\"sg\" data-s=\"2\">Кожен оператор має символ Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Його також можна записати в ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Використовуйте той запис, який вам більше подобається.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Об'єднання<\/em> — це <code>∪<\/code>, або <code>(|)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Воно бере всі значення з обох множин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значення <code>3<\/code> є в обох множинах.<\/span> <span class=\"sg\" data-s=\"1\">Тож об'єднання має п'ять різних елементів: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Переріз<\/em> — це <code>∩<\/code>, або <code>(&amp;)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Він залишає лише ті значення, які є в обох множинах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — зверніть увагу, що множини невпорядковані\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут переріз має <code>2<\/code> і <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ці значення є в обох множинах.<\/span> <span class=\"sg\" data-s=\"2\">Множина не має порядку.<\/span> <span class=\"sg\" data-s=\"3\">Тож у виводі ці два елементи можуть іти в будь-якому порядку.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ці операції теж дають множину.<\/span> <span class=\"sg\" data-s=\"1\">Тож їй можна ставити ті самі запитання.<\/span> <span class=\"sg\" data-s=\"2\">Скільки в ній елементів?<\/span> <span class=\"sg\" data-s=\"3\">Чи є в ній певне значення?<\/span><\/p>"]]},"bg":{"t":"Операции с множества","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете да комбинирате множества с обичайните операции от теорията на множествата.<\/span> <span class=\"sg\" data-s=\"1\">Теорията на множествата е част от математиката.<\/span> <span class=\"sg\" data-s=\"2\">Всеки оператор има Unicode символ.<\/span> <span class=\"sg\" data-s=\"3\">Той има и начин да се запише в ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте този, който ви харесва повече.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Обединението<\/em> е <code>∪<\/code>, или <code>(|)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">То взема всички стойности от двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойността <code>3<\/code> е и в двете множества.<\/span> <span class=\"sg\" data-s=\"1\">Затова обединението има пет различни елемента: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Сечението<\/em> е <code>∩<\/code>, или <code>(&amp;)<\/code> в ASCII.<\/span> <span class=\"sg\" data-s=\"1\">То пази само стойностите, които са и в двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук сечението има <code>2<\/code> и <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тези стойности са и в двете множества.<\/span> <span class=\"sg\" data-s=\"2\">Множеството няма ред.<\/span> <span class=\"sg\" data-s=\"3\">Затова в изхода двата елемента могат да дойдат във всякакъв ред.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тези операции също дават множество.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да му задавате същите въпроси.<\/span> <span class=\"sg\" data-s=\"2\">Колко елемента има то?<\/span> <span class=\"sg\" data-s=\"3\">Има ли дадена стойност в него?<\/span><\/p>"]]},"eo":{"t":"Araj operacioj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas kombini arojn per la kutimaj operacioj el la aroteorio.<\/span> <span class=\"sg\" data-s=\"1\">Aroteorio estas parto de matematiko.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu operatoro havas Unikodan simbolon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ havas manieron skribi ĝin per ASCII.<\/span> <span class=\"sg\" data-s=\"4\">Uzu tiun, kiun vi pli ŝatas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>kunigo<\/em> estas <code>∪<\/code>, aŭ <code>(|)<\/code> en ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas ĉiujn valorojn el ambaŭ aroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La valoro <code>3<\/code> estas en ambaŭ aroj.<\/span> <span class=\"sg\" data-s=\"1\">Do la kunigo havas kvin distingajn elementojn: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <em>komunaĵo<\/em> estas <code>∩<\/code>, aŭ <code>(&amp;)<\/code> en ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi konservas nur la valorojn, kiuj estas en ambaŭ aroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — notu, ke aroj estas neordigitaj\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la komunaĵo havas <code>2<\/code> kaj <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj valoroj estas en ambaŭ aroj.<\/span> <span class=\"sg\" data-s=\"2\">Aro ne havas ordon.<\/span> <span class=\"sg\" data-s=\"3\">Do en la eligo, la du elementoj povas veni en ajna ordo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj operacioj ankaŭ donas aron.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas fari al ĝi la samajn demandojn.<\/span> <span class=\"sg\" data-s=\"2\">Kiom da elementoj ĝi havas?<\/span> <span class=\"sg\" data-s=\"3\">Ĉu certa valoro estas en ĝi?<\/span><\/p>"]]},"la":{"t":"Operationes coniunctorum","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Coniuncta componere potes operationibus usitatis ex theoria coniunctorum.<\/span> <span class=\"sg\" data-s=\"1\">Theoria coniunctorum pars mathematicae est.<\/span> <span class=\"sg\" data-s=\"2\">Quisque operator symbolum Unicode habet.<\/span> <span class=\"sg\" data-s=\"3\">Etiam modum scribendi in ASCII habet.<\/span> <span class=\"sg\" data-s=\"4\">Eum adhibe quem mavis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Unio<\/em> est <code>∪<\/code>, vel <code>(|)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Omnes valores ex ambobus coniunctis sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor <code>3<\/code> in ambobus coniunctis est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque unio quinque elementa distincta habet: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Intersectio<\/em> est <code>∩<\/code>, vel <code>(&amp;)<\/code> in ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Solum valores servat qui in ambobus coniunctis sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota inopias non ordinatas esse\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic intersectio <code>2<\/code> et <code>3<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Hi valores in ambobus coniunctis sunt.<\/span> <span class=\"sg\" data-s=\"2\">Coniunctum ordinem non habet.<\/span> <span class=\"sg\" data-s=\"3\">Itaque in exitu duo elementa quolibet ordine venire possunt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hae operationes quoque coniunctum dant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque easdem quaestiones ei ponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Quot elementa habet?<\/span> <span class=\"sg\" data-s=\"3\">Estne certus valor in eo?<\/span><\/p>"]]}}}</script>
