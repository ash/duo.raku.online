<script type="application/json" id="page-data">{"u":"advanced/quoting","n":465,"k":"section","pv":"advanced/strings/exercises/find-domain/solution","nx":"advanced/quoting/q-qq-big-q","tr":["advanced"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quoting constructs","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you used <a href=\"/essentials/strings/\">single and double quotes for strings<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku has many more ways to quote strings.<\/span> <span class=\"sg\" data-s=\"2\">We call them <em>quoting constructs<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Single and double quotes are the two most common ones.<\/span> <span class=\"sg\" data-s=\"4\">Each construct does a different amount of work on the text.<\/span> <span class=\"sg\" data-s=\"5\">You choose exactly how much.<\/span> <span class=\"sg\" data-s=\"6\">At one end, it is “take every character as it is”.<\/span> <span class=\"sg\" data-s=\"7\">At the other end, it is “interpolate variables, escapes, and even code”.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This section shows the three base forms: <code>q<\/code>, <code>qq<\/code>, and <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It also shows adverbs.<\/span> <span class=\"sg\" data-s=\"2\">Adverbs change how the base forms work.<\/span> <span class=\"sg\" data-s=\"3\">And it shows <em>heredocs<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">They are for text with many lines.<\/span><\/p>"]]},"de":{"t":"Quoting-Konstrukte","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Im Grundlagenteil hast du <a href=\"https://course.raku.org/de/essentials/strings/\" target=\"_blank\" rel=\"noopener\">einfache und doppelte Anführungszeichen für Strings<\/a> benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat noch viele weitere Arten, Strings zu quoten.<\/span> <span class=\"sg\" data-s=\"2\">Wir nennen sie <em>Quoting-Konstrukte<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Einfache und doppelte Anführungszeichen sind die zwei häufigsten davon.<\/span> <span class=\"sg\" data-s=\"4\">Jedes Konstrukt macht unterschiedlich viel mit dem Text.<\/span> <span class=\"sg\" data-s=\"5\">Du wählst genau, wie viel.<\/span> <span class=\"sg\" data-s=\"6\">An einem Ende heißt es „nimm jedes Zeichen, wie es ist“.<\/span> <span class=\"sg\" data-s=\"7\">Am anderen Ende heißt es „interpoliere Variablen, Escape-Sequenzen und sogar Code“.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt die drei Grundformen: <code>q<\/code>, <code>qq<\/code> und <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch Adverbien.<\/span> <span class=\"sg\" data-s=\"2\">Adverbien ändern, wie die Grundformen arbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Und er zeigt <em>Heredocs<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Sie sind für Text mit vielen Zeilen.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsconstructies","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials gebruikte je <a href=\"https://course.raku.org/nl/essentials/strings/\" target=\"_blank\" rel=\"noopener\">enkele en dubbele aanhalingstekens voor strings<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft nog veel meer manieren om strings te quoten.<\/span> <span class=\"sg\" data-s=\"2\">We noemen ze <em>quoting-constructies<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Enkele en dubbele aanhalingstekens zijn de twee meest gebruikte.<\/span> <span class=\"sg\" data-s=\"4\">Elke constructie doet meer of minder werk met de tekst.<\/span> <span class=\"sg\" data-s=\"5\">Je kiest precies hoeveel.<\/span> <span class=\"sg\" data-s=\"6\">Aan de ene kant is het \"neem elk teken zoals het is\".<\/span> <span class=\"sg\" data-s=\"7\">Aan de andere kant is het \"interpoleer variabelen, escapes en zelfs code\".<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel laat de drie basisvormen zien: <code>q<\/code>, <code>qq<\/code> en <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het laat ook bijwoorden zien.<\/span> <span class=\"sg\" data-s=\"2\">Bijwoorden veranderen hoe de basisvormen werken.<\/span> <span class=\"sg\" data-s=\"3\">En het laat <em>heredocs<\/em> zien.<\/span> <span class=\"sg\" data-s=\"4\">Die zijn voor tekst met veel regels.<\/span><\/p>"]]},"es":{"t":"Construcciones de entrecomillado","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, usaste <a href=\"https://course.raku.org/es/essentials/strings/\" target=\"_blank\" rel=\"noopener\">comillas simples y dobles para las cadenas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene muchas más formas de entrecomillar cadenas.<\/span> <span class=\"sg\" data-s=\"2\">Las llamamos <em>construcciones de entrecomillado<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Las comillas simples y dobles son las dos más comunes.<\/span> <span class=\"sg\" data-s=\"4\">Cada construcción hace más o menos trabajo con el texto.<\/span> <span class=\"sg\" data-s=\"5\">Tú eliges exactamente cuánto.<\/span> <span class=\"sg\" data-s=\"6\">En un extremo está «toma cada carácter tal como está».<\/span> <span class=\"sg\" data-s=\"7\">En el otro extremo está «interpola variables, secuencias de escape e incluso código».<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra las tres formas base: <code>q<\/code>, <code>qq<\/code> y <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También muestra los adverbios.<\/span> <span class=\"sg\" data-s=\"2\">Los adverbios cambian cómo funcionan las formas base.<\/span> <span class=\"sg\" data-s=\"3\">Y muestra los <em>heredocs<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Sirven para texto con muchas líneas.<\/span><\/p>"]]},"it":{"t":"Costrutti di quoting","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai usato <a href=\"https://course.raku.org/it/essentials/strings/\" target=\"_blank\" rel=\"noopener\">virgolette singole e doppie per le stringhe<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha molti altri modi per scrivere stringhe tra virgolette.<\/span> <span class=\"sg\" data-s=\"2\">Li chiamiamo <em>costrutti di quoting<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Le virgolette singole e doppie sono i due più comuni.<\/span> <span class=\"sg\" data-s=\"4\">Ogni costrutto fa più o meno lavoro sul testo.<\/span> <span class=\"sg\" data-s=\"5\">Tu scegli esattamente quanto.<\/span> <span class=\"sg\" data-s=\"6\">A un estremo c'è \"prendi ogni carattere così com'è\".<\/span> <span class=\"sg\" data-s=\"7\">All'altro estremo c'è \"interpola variabili, sequenze di escape e anche codice\".<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra le tre forme base: <code>q<\/code>, <code>qq<\/code> e <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche gli avverbi.<\/span> <span class=\"sg\" data-s=\"2\">Gli avverbi cambiano come funzionano le forme base.<\/span> <span class=\"sg\" data-s=\"3\">E mostra gli <em>heredoc<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Servono per il testo su molte righe.<\/span><\/p>"]]},"lv":{"t":"Citēšanas konstrukcijas 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">vienpēdiņas un dubultpēdiņas virknēm<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā ir vēl daudz citu veidu, kā citēt virknes.<\/span> <span class=\"sg\" data-s=\"2\">Mēs tos saucam par <em>citēšanas konstrukcijām<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vienpēdiņas un dubultpēdiņas ir divas biežākās no tām.<\/span> <span class=\"sg\" data-s=\"4\">Katra konstrukcija apstrādā tekstu citā mērā.<\/span> <span class=\"sg\" data-s=\"5\">Jūs precīzi izvēlaties, cik daudz.<\/span> <span class=\"sg\" data-s=\"6\">Vienā galā ir \"ņem katru rakstzīmi tādu, kāda tā ir\".<\/span> <span class=\"sg\" data-s=\"7\">Otrā galā ir \"interpolē mainīgos, aizbēgšanas secības un pat kodu\".<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda trīs bāzes formas: <code>q<\/code>, <code>qq<\/code> un <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā parāda arī adverbus.<\/span> <span class=\"sg\" data-s=\"2\">Adverbi maina to, kā bāzes formas strādā.<\/span> <span class=\"sg\" data-s=\"3\">Un tā parāda <em>heredoc<\/em> konstrukcijas.<\/span> <span class=\"sg\" data-s=\"4\">Tās der tekstam ar daudzām rindām.<\/span><\/p>"]]},"ru":{"t":"Конструкции кавычек","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В части «Основы» вы использовали <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарные и двойные кавычки для строк<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">В Raku есть ещё много способов заключить строку в кавычки.<\/span> <span class=\"sg\" data-s=\"2\">Мы называем их <em>конструкциями цитирования<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Одинарные и двойные кавычки — две самые частые из них.<\/span> <span class=\"sg\" data-s=\"4\">Каждая конструкция делает с текстом разное количество работы.<\/span> <span class=\"sg\" data-s=\"5\">Вы сами выбираете, сколько именно.<\/span> <span class=\"sg\" data-s=\"6\">На одном конце — «брать каждый символ как есть».<\/span> <span class=\"sg\" data-s=\"7\">На другом конце — «интерполировать переменные, управляющие последовательности и даже код».<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Этот раздел показывает три базовые формы: <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает наречия.<\/span> <span class=\"sg\" data-s=\"2\">Наречия меняют работу базовых форм.<\/span> <span class=\"sg\" data-s=\"3\">И он показывает <em>heredoc'и<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Они нужны для текста в несколько строк.<\/span><\/p>"]]},"uk":{"t":"Конструкції цитування","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви використовували <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарні та подвійні лапки для рядків<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku має набагато більше способів брати рядки в лапки.<\/span> <span class=\"sg\" data-s=\"2\">Ми називаємо їх <em>конструкціями цитування<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Одинарні й подвійні лапки — дві найпоширеніші з них.<\/span> <span class=\"sg\" data-s=\"4\">Кожна конструкція робить різну кількість роботи з текстом.<\/span> <span class=\"sg\" data-s=\"5\">Ви вибираєте, скільки саме.<\/span> <span class=\"sg\" data-s=\"6\">На одному кінці — «залиш кожен символ без змін».<\/span> <span class=\"sg\" data-s=\"7\">На другому кінці — «інтерполюй змінні, екрановані послідовності й навіть код».<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує три базові форми: <code>q<\/code>, <code>qq<\/code> та <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він також показує наріччя.<\/span> <span class=\"sg\" data-s=\"2\">Наріччя змінюють роботу базових форм.<\/span> <span class=\"sg\" data-s=\"3\">І він показує <em>heredoc<\/em>-и.<\/span> <span class=\"sg\" data-s=\"4\">Вони потрібні для тексту з багатьма рядками.<\/span><\/p>"]]},"bg":{"t":"Конструкции за цитиране 🆕","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" използвахте <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">единични и двойни кавички за низове<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku има много повече начини за цитиране на низове.<\/span> <span class=\"sg\" data-s=\"2\">Наричаме ги <em>конструкции за цитиране<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Единичните и двойните кавички са двете най-често срещани.<\/span> <span class=\"sg\" data-s=\"4\">Всяка конструкция обработва текста в различна степен.<\/span> <span class=\"sg\" data-s=\"5\">Вие избирате точно колко.<\/span> <span class=\"sg\" data-s=\"6\">В единия край е „остави всеки символ непроменен\".<\/span> <span class=\"sg\" data-s=\"7\">В другия край е „интерполирай променливи, екраниращи последователности и дори код\".<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тази секция показва трите основни форми: <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя показва и наречията.<\/span> <span class=\"sg\" data-s=\"2\">Наречията променят как работят основните форми.<\/span> <span class=\"sg\" data-s=\"3\">Показва и <em>heredoc<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Това е форма за текст с много редове.<\/span><\/p>"]]},"eo":{"t":"Citaj konstruoj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">En la parto Essentials, vi uzis <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">unuopajn kaj duoblajn citilojn por ĉenoj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas multe pli da manieroj citi ĉenojn.<\/span> <span class=\"sg\" data-s=\"2\">Ni nomas ilin <em>citaj konstruaĵoj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Unuopaj kaj duoblaj citiloj estas la du plej oftaj.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu konstruaĵo faras malsaman kvanton da laboro sur la teksto.<\/span> <span class=\"sg\" data-s=\"5\">Vi elektas ĝuste kiom.<\/span> <span class=\"sg\" data-s=\"6\">Ĉe unu fino estas “prenu ĉiun signon tia, kia ĝi estas”.<\/span> <span class=\"sg\" data-s=\"7\">Ĉe la alia fino estas “interpolu variablojn, eskapojn kaj eĉ kodon”.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras la tri bazajn formojn: <code>q<\/code>, <code>qq<\/code> kaj <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras adverbojn.<\/span> <span class=\"sg\" data-s=\"2\">Adverboj ŝanĝas, kiel la bazaj formoj funkcias.<\/span> <span class=\"sg\" data-s=\"3\">Kaj ĝi montras <em>heredoc<\/em>-ojn.<\/span> <span class=\"sg\" data-s=\"4\">Ili estas por teksto kun multaj linioj.<\/span><\/p>"]]},"la":{"t":"Constructiones quotationis","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">apostrophos simplices et duplices pro seriebus<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Raku multos alios modos citandi habet.<\/span> <span class=\"sg\" data-s=\"2\">Hos modos <em>constructiones citandi<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"3\">Apostrophi simplices et duplices duo maxime communes sunt.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque constructio plus vel minus in textu laborat.<\/span> <span class=\"sg\" data-s=\"5\">Tu exacte eligis quantum.<\/span> <span class=\"sg\" data-s=\"6\">In uno fine est “omnem characterem ut est sume”.<\/span> <span class=\"sg\" data-s=\"7\">In altero fine est “variabiles, effugia, atque etiam codicem interpola”.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec sectio tres formas fundamentales ostendit: <code>q<\/code>, <code>qq<\/code>, et <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam adverbia ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Adverbia opus formarum fundamentalium mutant.<\/span> <span class=\"sg\" data-s=\"3\">Et <em>heredocs<\/em> ostendit.<\/span> <span class=\"sg\" data-s=\"4\">Sunt pro textu multarum linearum.<\/span><\/p>"]]}}}</script>
