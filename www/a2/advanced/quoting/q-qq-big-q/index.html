em>adverbios<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Con ellos, eliges exactamente qué características están activadas.<\/span><\/p>"]]},"it":{"t":"q, qq e Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono tre operatori di quoting base.<\/span> <span class=\"sg\" data-s=\"1\">Cambiano il testo al loro interno in misura diversa:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — come le virgolette singole: quasi tutto il testo resta così com'è<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — come le virgolette doppie: Raku interpola variabili e sequenze di escape<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — il più letterale: Raku non cambia <strong>niente<\/strong><\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ognuno prende il testo tra due delimitatori.<\/span> <span class=\"sg\" data-s=\"1\">I delimitatori sono i caratteri intorno al testo.<\/span> <span class=\"sg\" data-s=\"2\">Conosci già <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">È una forma breve di <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">E <code>\"…\"<\/code> è una forma breve di <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> non cambia <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> lo interpola.<\/span> <span class=\"sg\" data-s=\"2\">Le sequenze di escape con backslash come <code>\\n<\/code> funzionano allo stesso modo.<\/span> <span class=\"sg\" data-s=\"3\">Solo <code>qq<\/code> e <code>\"…\"<\/code> trasformano <code>\\n<\/code> in un vero carattere di nuova riga.<\/span> <span class=\"sg\" data-s=\"4\">Sia <code>q<\/code> che <code>Q<\/code> lo tengono come due caratteri: <code>\\<\/code> e <code>n<\/code>:<\/span><\/p>"],["code",0,"<pr  class=\"sg\" data-s=\"1\"><code>qq<\/code> — kā dubultpēdiņas: Raku interpolē mainīgos un aizbēgšanas secības<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — visburtiskākais: Raku <strong>neko<\/strong> nemaina<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrs no tiem ņem tekstu starp diviem norobežotājiem.<\/span> <span class=\"sg\" data-s=\"1\">Norobežotāji ir rakstzīmes ap tekstu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs jau zināt <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir <code>q<\/code> īsā forma.<\/span> <span class=\"sg\" data-s=\"4\">Un <code>\"…\"<\/code> ir <code>qq<\/code> īsā forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> nemaina <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> to interpolē.<\/span> <span class=\"sg\" data-s=\"2\">Atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code>, strādā tāpat.<\/span> <span class=\"sg\" data-s=\"3\">Tikai <code>qq<\/code> un <code>\"…\"<\/code> pārvērš <code>\\n<\/code> par īstu jaunrindu.<\/span> <span class=\"sg\" data-s=\"4\">Gan <code>q<\/code>, gan <code>Q<\/code> to atstāj kā divas rakstzīmes: <code>\\<\/code> un <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tad kāda ir atšķirība starp <code>q<\/code> un <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> ir kā vienpēdiņas.<\/span> <span class=\"sg\" data-s=\"2\">Tas tomēr apstrādā <em>nelielu<\/em> aizbēgšanas secību kopu.<\/span> <span class=\"sg\" data-s=\"3\">Dubulta atpakaļsvītra <code>\\\\<\/code> kļūst par vienu atpakaļsvītru.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat arī aizbēgt aizverošo norobežotāju ar atpakaļsvītru.<\/span> <span class=\"sg\" data-s=\"5\">Bet vienkāršā <code>Q<\/code> forma nemaina pilnīgi <strong>neko<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q saspiež aizēto atpakaļsvītru\nsay Q{a\\\\b}; # a\\\\b  — Q saglabā abas rakstzīmes<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot jebkurus norobežotājus: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas palīdz, kad pašā tekstā ir pēdiņas.<\/span> <span class=\"sg\" data-s=\"2\">Šie trīs operatori ir pamats.<\/span> <span class=\"sg\" data-s=\"3\">Nākamā tēma parāda <a href=\"https://course.raku.org/lv/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbus<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ar tiem jūs precīzi izvēlaties, kuras funkcijas ir ieslēgtas.<\/span><\/p>"]]},"ru":{"t":"q, qq и Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть три базовых оператора цитирования.<\/span> <span class=\"sg\" data-s=\"1\">Они меняют текст внутри себя в разной степени:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — как одинарные кавычки: почти весь текст остаётся как есть<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — как двойные кавычки: Raku интерполирует переменные и управляющие последовательности<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — самая буквальная форма: Raku <strong>ничего<\/strong> не меняет<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждый из них берёт текст между двумя разделителями.<\/span> <span class=\"sg\" data-s=\"1\">Разделители — это символы вокруг текста.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже знаете <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это короткая форма <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">А <code>\"…\"<\/code> — короткая форма <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> не меняет <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> интерполирует его.<\/span> <span class=\"sg\" data-s=\"2\">Управляющие последовательности с обратным слэшем, например <code>\\n<\/code>, работают так же.<\/span> <span class=\"sg\" data-s=\"3\">Только <code>qq<\/code> и <code>\"…\"<\/code> превращают <code>\\n<\/code> в настоящий перевод строки.<\/span> <span class=\"sg\" data-s=\"4\">И <code>q<\/code>, и <code>Q<\/code> оставляют его двумя символами: <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Так в чём разница между <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> похож на одинарные кавычки.<\/span> <span class=\"sg\" data-s=\"2\">Он всё же обрабатывает <em>небольшой<\/em> набор управляющих последовательностей.<\/span> <span class=\"sg\" data-s=\"3\">Двойной обратный слэш <code>\\\\<\/code> превращается в один обратный слэш.<\/span> <span class=\"sg\" data-s=\"4\">Ещё можно экранировать закрывающий разделитель обратным слэшем.<\/span> <span class=\"sg\" data-s=\"5\">Но простая форма <code>Q<\/code> не меняет <strong>совсем ничего<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Можно использовать любые разделители: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это удобно, когда в самом тексте есть кавычки.<\/span> <span class=\"sg\" data-s=\"2\">Эти три оператора — основа.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема показывает <a href=\"https://course.raku.org/ru/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречия<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">С ними вы точно выбираете, какие возможности включены.<\/span><\/p>"]]},"uk":{"t":"q, qq та Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Є три базові оператори цитування.<\/span> <span class=\"sg\" data-s=\"1\">Вони змінюють текст усередині себе різною мірою:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — як одинарні лапки: майже весь текст лишається як є<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — як подвійні лапки: Raku інтерполює змінні та екрановані послідовності<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — найбуквальніший: Raku <strong>нічого<\/strong> не змінює<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожен із них бере текст між двома роздільниками.<\/span> <span class=\"sg\" data-s=\"1\">Роздільники — це символи навколо тексту.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже знаєте <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це коротка форма <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">А <code>\"…\"<\/code> — коротка форма <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> не змінює <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> його інтерполює.<\/span> <span class=\"sg\" data-s=\"2\">Екрановані послідовності, як-от <code>\\n<\/code>, працюють так само.<\/span> <span class=\"sg\" data-s=\"3\">Тільки <code>qq<\/code> і <code>\"…\"<\/code> перетворюють <code>\\n<\/code> на справжній перехід рядка.<\/span> <span class=\"sg\" data-s=\"4\">І <code>q<\/code>, і <code>Q<\/code> лишають його двома символами: <code>\\<\/code> та <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;новий рядок&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">То в чому різниця між <code>q<\/code> і <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> — як одинарні лапки.<\/span> <span class=\"sg\" data-s=\"2\">Він усе ж обробляє <em>невеликий<\/em> набір екранованих послідовностей.<\/span> <span class=\"sg\" data-s=\"3\">Подвійна зворотна коса риска <code>\\\\<\/code> стає однією.<\/span> <span class=\"sg\" data-s=\"4\">Також можна екранувати закривальний роздільник зворотною косою рискою.<\/span> <span class=\"sg\" data-s=\"5\">А проста форма <code>Q<\/code> не змінює зовсім <strong>нічого<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q згортає екрановану зворотну косу риску\nsay Q{a\\\\b}; # a\\\\b  — Q зберігає обидва символи<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Можна брати будь-які роздільники: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це допомагає, коли в самому тексті є лапки.<\/span> <span class=\"sg\" data-s=\"2\">Ці три оператори — основа.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема показує <a href=\"https://course.raku.org/uk/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наріччя<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">З ними ви вибираєте, які саме можливості ввімкнені.<\/span><\/p>"]]},"bg":{"t":"q, qq и Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има три основни оператора за цитиране.<\/span> <span class=\"sg\" data-s=\"1\">Те променят текста в себе си в различна степен:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — като единични кавички: почти целият текст остава без промяна<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — като двойни кавички: Raku интерполира променливите и екраниращите последователности<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — най-буквалният: Raku не променя <strong>нищо<\/strong><\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всеки от тях взема текста между два разделителя.<\/span> <span class=\"sg\" data-s=\"1\">Разделителите са символите около текста.<\/span> <span class=\"sg\" data-s=\"2\">Вече познавате <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това е кратка форма на <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">А <code>\"…\"<\/code> е кратка форма на <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> не променя <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> го интерполира.<\/span> <span class=\"sg\" data-s=\"2\">Екраниращите последователности като <code>\\n<\/code> работят по същия начин.<\/span> <span class=\"sg\" data-s=\"3\">Само <code>qq<\/code> и <code>\"…\"<\/code> превръщат <code>\\n<\/code> в истински нов ред.<\/span> <span class=\"sg\" data-s=\"4\">И <code>q<\/code>, и <code>Q<\/code> го оставят като два символа: <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Каква е тогава разликата между <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> е като единичните кавички.<\/span> <span class=\"sg\" data-s=\"2\">Той все пак обработва <em>малък<\/em> брой екраниращи последователности.<\/span> <span class=\"sg\" data-s=\"3\">Двойната обратна наклонена черта <code>\\\\<\/code> става една.<\/span> <span class=\"sg\" data-s=\"4\">Можете също да екранирате затварящия разделител с обратна наклонена черта.<\/span> <span class=\"sg\" data-s=\"5\">Но обикновената форма <code>Q<\/code> не променя <strong>абсолютно нищо<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q колапсира екранираната обратна наклонена черта\nsay Q{a\\\\b}; # a\\\\b  — Q запазва и двата символа<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате всякакви разделители: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това помага, когато самият текст има кавички.<\/span> <span class=\"sg\" data-s=\"2\">Тези три оператора са основата.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема показва <a href=\"https://course.raku.org/bg/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречията<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">С тях избирате точно кои функции са включени.<\/span><\/p>"]]},"eo":{"t":"q, qq, kaj Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas tri bazaj citaj operatoroj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ŝanĝas la tekston ene de si malsame multe:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — kiel unuopaj citiloj: preskaŭ la tuta teksto restas sen ŝanĝo<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — kiel duoblaj citiloj: Raku interpolas variablojn kaj eskapojn<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — la plej laŭlitera: Raku ŝanĝas <strong>nenion<\/strong><\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu el ili prenas la tekston inter du limigiloj.<\/span> <span class=\"sg\" data-s=\"1\">Limigiloj estas la signoj ĉirkaŭ la teksto.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam konas <code>'…'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas mallonga formo de <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Kaj <code>\"…\"<\/code> estas mallonga formo de <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> ne ŝanĝas <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> interpolas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Maldekstre-streketaj eskapoj kiel <code>\\n<\/code> funkcias same.<\/span> <span class=\"sg\" data-s=\"3\">Nur <code>qq<\/code> kaj <code>\"…\"<\/code> faras el <code>\\n<\/code> veran novlinion.<\/span> <span class=\"sg\" data-s=\"4\">Kaj <code>q<\/code> kaj <code>Q<\/code> tenas ĝin kiel du signojn: <code>\\<\/code> kaj <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Do kio estas la diferenco inter <code>q<\/code> kaj <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> estas kiel unuopaj citiloj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankoraŭ traktas <em>malgrandan<\/em> aron da eskapoj.<\/span> <span class=\"sg\" data-s=\"3\">Duobla maldekstra streketo <code>\\\\<\/code> fariĝas unu maldekstra streketo.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas eskapi la fermilon per maldekstra streketo.<\/span> <span class=\"sg\" data-s=\"5\">Sed la simpla <code>Q<\/code>-formo ŝanĝas <strong>nenion<\/strong> ajn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q kolapsas la eskapitan maldekstran streketon\nsay Q{a\\\\b}; # a\\\\b  — Q konservas ambaŭ signojn<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi ajnajn limigilojn: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio helpas, kiam la teksto mem havas citilojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj tri operatoroj estas la bazo.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo montras <a href=\"https://course.raku.org/eo/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbojn<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Per ili, vi elektas ĝuste, kiuj funkcioj estas ŝaltitaj.<\/span><\/p>"]]},"la":{"t":"q, qq, et Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres operatores citandi fundamentales sunt.<\/span> <span class=\"sg\" data-s=\"1\">Textum intra se plus vel minus mutant:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — sicut apostrophi simplices: fere totus textus ut est manet<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — sicut apostrophi duplices: Raku variabiles et effugia interpolat<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — maxime ad litteram: Raku <strong>nihil<\/strong> mutat<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Quisque eorum textum inter duos delimitatores accipit.<\/span> <span class=\"sg\" data-s=\"1\">Delimitatores sunt characteres circa textum.<\/span> <span class=\"sg\" data-s=\"2\">Iam <code>'…'<\/code> nosti.<\/span> <span class=\"sg\" data-s=\"3\">Est forma brevis pro <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Et <code>\"…\"<\/code> est forma brevis pro <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> non mutat <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>qq<\/code> eam interpolat.<\/span> <span class=\"sg\" data-s=\"2\">Effugia per obliquum reversum ut <code>\\n<\/code> eodem modo operantur.<\/span> <span class=\"sg\" data-s=\"3\">Solum <code>qq<\/code> et <code>\"…\"<\/code> convertunt <code>\\n<\/code> in verum finem lineae.<\/span> <span class=\"sg\" data-s=\"4\">Et <code>q<\/code> et <code>Q<\/code> id ut duos characteres servant: <code>\\<\/code> et <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Quae ergo est differentia inter <code>q<\/code> et <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> est sicut apostrophi simplices.<\/span> <span class=\"sg\" data-s=\"2\">Adhuc <em>parvum<\/em> numerum effugiorum tractat.<\/span> <span class=\"sg\" data-s=\"3\">Obliquus reversus duplex <code>\\\\<\/code> fit unus obliquus reversus.<\/span> <span class=\"sg\" data-s=\"4\">Etiam delimitatorem claudentem cum obliquo reverso effugere potes.<\/span> <span class=\"sg\" data-s=\"5\">Sed forma simplex <code>Q<\/code> <strong>nihil<\/strong> omnino mutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Quoslibet delimitatores adhibere potes: <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code>, <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc adiuvat cum textus ipse apostrophos habet.<\/span> <span class=\"sg\" data-s=\"2\">Hi tres operatores fundamentum sunt.<\/span> <span class=\"sg\" data-s=\"3\">Proximum thema <a href=\"https://course.raku.org/la/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbia<\/em><\/a> ostendit.<\/span> <span class=\"sg\" data-s=\"4\">Cum eis exacte proprietates accensas eligis.<\/span><\/p>"]]}}}</script>
