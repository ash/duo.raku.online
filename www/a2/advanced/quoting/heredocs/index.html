<script type="application/json" id="page-data">{"u":"advanced/quoting/heredocs","n":470,"k":"topic","pv":"advanced/quoting/adverbs/quiz","nx":"advanced/quoting/exercises","tr":["advanced","advanced/quoting"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A <em>heredoc<\/em> is a quoting form for text with many lines.<\/span> <span class=\"sg\" data-s=\"1\">It has no delimiters around the text.<\/span> <span class=\"sg\" data-s=\"2\">Instead, you give a terminator word with <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The terminator marks the end.<\/span> <span class=\"sg\" data-s=\"4\">The string starts on the next line.<\/span> <span class=\"sg\" data-s=\"5\">It goes on until a line with only that word:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">The terminator marks the end of the text.<\/span> <span class=\"sg\" data-s=\"1\">Here, it is <code>END<\/code>, but you can use any word.<\/span> <span class=\"sg\" data-s=\"2\">Look at the <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The text keeps the newline before the terminator.<\/span> <span class=\"sg\" data-s=\"4\">So the text already ends with a line break.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> adds a second one.<\/span> <span class=\"sg\" data-s=\"6\">Then you get an empty line at the end.<\/span> <span class=\"sg\" data-s=\"7\">This heredoc starts with <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">So the text is not interpolated.<\/span> <span class=\"sg\" data-s=\"9\">To interpolate variables, use <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here is a useful detail.<\/span> <span class=\"sg\" data-s=\"1\">Look at the <strong>indentation of the closing terminator<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku removes it from every line of the text.<\/span> <span class=\"sg\" data-s=\"3\">So you can indent a heredoc like the code around it.<\/span> <span class=\"sg\" data-s=\"4\">The indentation does not get into the string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This prints the same <code>Hello,<\/code> and <code>World!<\/code> as the first example.<\/span> <span class=\"sg\" data-s=\"1\">Here, the closing <code>END<\/code> has eight spaces in front of it.<\/span> <span class=\"sg\" data-s=\"2\">So Raku removes eight spaces from each line.<\/span> <span class=\"sg\" data-s=\"3\">The function returns just <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">There are no spaces at the start.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">The closing terminator decides how many spaces Raku removes.<\/span> <span class=\"sg\" data-s=\"1\">So each line of the text needs at least that many spaces.<\/span> <span class=\"sg\" data-s=\"2\">Maybe a line has fewer spaces.<\/span> <span class=\"sg\" data-s=\"3\">Then Raku cannot remove all of them.<\/span> <span class=\"sg\" data-s=\"4\">It warns: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Avoid this warning.<\/span> <span class=\"sg\" data-s=\"6\">Do not indent the terminator more than any line of the text.<\/span> <span class=\"sg\" data-s=\"7\">Heredocs are the natural choice for templates and messages.<\/span> <span class=\"sg\" data-s=\"8\">In fact, they are good for any text with several lines.<\/span><\/p>"]]},"de":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Heredoc<\/em> ist eine Quoting-Form für Text mit vielen Zeilen.<\/span> <span class=\"sg\" data-s=\"1\">Es hat keine Trennzeichen um den Text herum.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen gibst du mit <code>:to<\/code> ein Abschlusswort an.<\/span> <span class=\"sg\" data-s=\"3\">Das Abschlusswort markiert das Ende.<\/span> <span class=\"sg\" data-s=\"4\">Der String beginnt in der nächsten Zeile.<\/span> <span class=\"sg\" data-s=\"5\">Er geht bis zu einer Zeile mit nur diesem Wort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe ist:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Das Abschlusswort markiert das Ende des Textes.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist es <code>END<\/code>, aber du kannst jedes Wort benutzen.<\/span> <span class=\"sg\" data-s=\"2\">Sieh dir das <code>print<\/code> an.<\/span> <span class=\"sg\" data-s=\"3\">Der Text behält den Zeilenumbruch vor dem Abschlusswort.<\/span> <span class=\"sg\" data-s=\"4\">Deshalb endet der Text schon mit einem Zeilenumbruch.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> fügt einen zweiten hinzu.<\/span> <span class=\"sg\" data-s=\"6\">Dann bekommst du am Ende eine Leerzeile.<\/span> <span class=\"sg\" data-s=\"7\">Dieses Heredoc beginnt mit <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Deshalb wird der Text nicht interpoliert.<\/span> <span class=\"sg\" data-s=\"9\">Um Variablen zu interpolieren, benutze <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein nützliches Detail.<\/span> <span class=\"sg\" data-s=\"1\">Sieh dir die <strong>Einrückung des schließenden Abschlussworts<\/strong> an.<\/span> <span class=\"sg\" data-s=\"2\">Raku entfernt sie aus jeder Zeile des Textes.<\/span> <span class=\"sg\" data-s=\"3\">So kannst du ein Heredoc genauso einrücken wie den Code drumherum.<\/span> <span class=\"sg\" data-s=\"4\">Die Einrückung kommt nicht in den String:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das gibt dasselbe <code>Hello,<\/code> und <code>World!<\/code> aus wie das erste Beispiel.<\/span> <span class=\"sg\" data-s=\"1\">Hier hat das schließende <code>END<\/code> acht Leerzeichen davor.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb entfernt Raku acht Leerzeichen aus jeder Zeile.<\/span> <span class=\"sg\" data-s=\"3\">Die Funktion gibt nur <code>Hello,\\nWorld!<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"4\">Am Anfang stehen keine Leerzeichen.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Das schließende Abschlusswort bestimmt, wie viele Leerzeichen Raku entfernt.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb braucht jede Zeile des Textes mindestens so viele Leerzeichen.<\/span> <span class=\"sg\" data-s=\"2\">Vielleicht hat eine Zeile weniger Leerzeichen.<\/span> <span class=\"sg\" data-s=\"3\">Dann kann Raku nicht alle entfernen.<\/span> <span class=\"sg\" data-s=\"4\">Raku warnt: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Vermeide diese Warnung.<\/span> <span class=\"sg\" data-s=\"6\">Rücke das Abschlusswort nicht weiter ein als irgendeine Zeile des Textes.<\/span> <span class=\"sg\" data-s=\"7\">Heredocs sind die natürliche Wahl für Vorlagen und Nachrichten.<\/span> <span class=\"sg\" data-s=\"8\">Eigentlich sind sie gut für jeden Text mit mehreren Zeilen.<\/span><\/p>"]]},"nl":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>heredoc<\/em> is een quoting-vorm voor tekst met veel regels.<\/span> <span class=\"sg\" data-s=\"1\">Hij heeft geen scheidingstekens rond de tekst.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan geef je een afsluitwoord op met <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het afsluitwoord geeft het einde aan.<\/span> <span class=\"sg\" data-s=\"4\">De string begint op de volgende regel.<\/span> <span class=\"sg\" data-s=\"5\">Hij gaat door tot een regel met alleen dat woord:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Het afsluitwoord geeft het einde van de tekst aan.<\/span> <span class=\"sg\" data-s=\"1\">Hier is het <code>END<\/code>, maar je kunt elk woord gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Kijk naar de <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De tekst houdt de nieuwe regel voor het afsluitwoord.<\/span> <span class=\"sg\" data-s=\"4\">Daarom eindigt de tekst al met een regelafbreking.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> voegt er een tweede toe.<\/span> <span class=\"sg\" data-s=\"6\">Dan krijg je een lege regel aan het einde.<\/span> <span class=\"sg\" data-s=\"7\">Deze heredoc begint met <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Daarom interpoleert Raku de tekst niet.<\/span> <span class=\"sg\" data-s=\"9\">Gebruik <code>qq:to<\/code> om variabelen te interpoleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier is een handig detail.<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar de <strong>inspringing van het afsluitwoord<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku haalt die van elke regel van de tekst weg.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je een heredoc laten inspringen zoals de code eromheen.<\/span> <span class=\"sg\" data-s=\"4\">De inspringing komt niet in de string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit drukt dezelfde <code>Hello,<\/code> en <code>World!<\/code> af als het eerste voorbeeld.<\/span> <span class=\"sg\" data-s=\"1\">Hier staan er acht spaties voor het afsluitende <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daarom haalt Raku acht spaties van elke regel weg.<\/span> <span class=\"sg\" data-s=\"3\">De functie geeft alleen <code>Hello,\\nWorld!<\/code> terug.<\/span> <span class=\"sg\" data-s=\"4\">Er staan geen spaties aan het begin.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Het afsluitwoord bepaalt hoeveel spaties Raku weghaalt.<\/span> <span class=\"sg\" data-s=\"1\">Elke regel van de tekst heeft dus minstens zoveel spaties nodig.<\/span> <span class=\"sg\" data-s=\"2\">Misschien heeft een regel minder spaties.<\/span> <span class=\"sg\" data-s=\"3\">Dan kan Raku ze niet allemaal weghalen.<\/span> <span class=\"sg\" data-s=\"4\">Raku waarschuwt: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Voorkom deze waarschuwing.<\/span> <span class=\"sg\" data-s=\"6\">Laat het afsluitwoord nooit verder inspringen dan een regel van de tekst.<\/span> <span class=\"sg\" data-s=\"7\">Heredocs zijn de natuurlijke keuze voor sjablonen en berichten.<\/span> <span class=\"sg\" data-s=\"8\">Eigenlijk zijn ze goed voor elke tekst met meerdere regels.<\/span><\/p>"]]},"es":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> es una forma de entrecomillado para texto con muchas líneas.<\/span> <span class=\"sg\" data-s=\"1\">No tiene delimitadores alrededor del texto.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, das una palabra terminadora con <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El terminador marca el final.<\/span> <span class=\"sg\" data-s=\"4\">La cadena empieza en la línea siguiente.<\/span> <span class=\"sg\" data-s=\"5\">Sigue hasta una línea con solo esa palabra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">El terminador marca el final del texto.<\/span> <span class=\"sg\" data-s=\"1\">Aquí es <code>END<\/code>, pero puedes usar cualquier palabra.<\/span> <span class=\"sg\" data-s=\"2\">Mira el <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El texto conserva el salto de línea antes del terminador.<\/span> <span class=\"sg\" data-s=\"4\">Por eso el texto ya termina con un salto de línea.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> añade un segundo salto.<\/span> <span class=\"sg\" data-s=\"6\">Entonces tienes una línea vacía al final.<\/span> <span class=\"sg\" data-s=\"7\">Este heredoc empieza con <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Por eso el texto no se interpola.<\/span> <span class=\"sg\" data-s=\"9\">Para interpolar variables, usa <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un detalle útil.<\/span> <span class=\"sg\" data-s=\"1\">Mira la <strong>indentación del terminador de cierre<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku la quita de cada línea del texto.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes indentar un heredoc como el código de alrededor.<\/span> <span class=\"sg\" data-s=\"4\">La indentación no llega a la cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esto imprime los mismos <code>Hello,<\/code> y <code>World!<\/code> que el primer ejemplo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, el <code>END<\/code> de cierre tiene ocho espacios delante.<\/span> <span class=\"sg\" data-s=\"2\">Por eso Raku quita ocho espacios de cada línea.<\/span> <span class=\"sg\" data-s=\"3\">La función devuelve solo <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">No hay espacios al principio.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">El terminador de cierre decide cuántos espacios quita Raku.<\/span> <span class=\"sg\" data-s=\"1\">Por eso cada línea del texto necesita al menos esos espacios.<\/span> <span class=\"sg\" data-s=\"2\">Quizás una línea tiene menos espacios.<\/span> <span class=\"sg\" data-s=\"3\">Entonces Raku no puede quitarlos todos.<\/span> <span class=\"sg\" data-s=\"4\">Muestra una advertencia: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Evita esta advertencia.<\/span> <span class=\"sg\" data-s=\"6\">No indentes el terminador más que ninguna línea del texto.<\/span> <span class=\"sg\" data-s=\"7\">Los heredocs son la opción natural para plantillas y mensajes.<\/span> <span class=\"sg\" data-s=\"8\">De hecho, son buenos para cualquier texto con varias líneas.<\/span><\/p>"]]},"it":{"t":"Heredoc","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> è una forma di quoting per il testo su molte righe.<\/span> <span class=\"sg\" data-s=\"1\">Non ha delimitatori intorno al testo.<\/span> <span class=\"sg\" data-s=\"2\">Invece, dai una parola terminatore con <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il terminatore segna la fine.<\/span> <span class=\"sg\" data-s=\"4\">La stringa inizia dalla riga dopo.<\/span> <span class=\"sg\" data-s=\"5\">Continua fino a una riga con solo quella parola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Il terminatore segna la fine del testo.<\/span> <span class=\"sg\" data-s=\"1\">Qui è <code>END<\/code>, ma puoi usare qualsiasi parola.<\/span> <span class=\"sg\" data-s=\"2\">Guarda il <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il testo tiene il carattere di nuova riga prima del terminatore.<\/span> <span class=\"sg\" data-s=\"4\">Così il testo finisce già con un a capo.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> ne aggiunge un secondo.<\/span> <span class=\"sg\" data-s=\"6\">Allora hai una riga vuota alla fine.<\/span> <span class=\"sg\" data-s=\"7\">Questo heredoc inizia con <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Quindi Raku non interpola il testo.<\/span> <span class=\"sg\" data-s=\"9\">Per interpolare le variabili, usa <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ecco un dettaglio utile.<\/span> <span class=\"sg\" data-s=\"1\">Guarda l'<strong>indentazione del terminatore di chiusura<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku la toglie da ogni riga del testo.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi indentare un heredoc come il codice intorno.<\/span> <span class=\"sg\" data-s=\"4\">L'indentazione non entra nella stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo stampa gli stessi <code>Hello,<\/code> e <code>World!<\/code> del primo esempio.<\/span> <span class=\"sg\" data-s=\"1\">Qui il terminatore <code>END<\/code> ha otto spazi davanti.<\/span> <span class=\"sg\" data-s=\"2\">Così Raku toglie otto spazi da ogni riga.<\/span> <span class=\"sg\" data-s=\"3\">La funzione restituisce solo <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Non ci sono spazi all'inizio.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Il terminatore di chiusura decide quanti spazi toglie Raku.<\/span> <span class=\"sg\" data-s=\"1\">Quindi ogni riga del testo ha bisogno di almeno quegli spazi.<\/span> <span class=\"sg\" data-s=\"2\">Forse una riga ha meno spazi.<\/span> <span class=\"sg\" data-s=\"3\">Allora Raku non può toglierli tutti.<\/span> <span class=\"sg\" data-s=\"4\">Avvisa: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Evita questo avviso.<\/span> <span class=\"sg\" data-s=\"6\">Non indentare il terminatore più delle righe del testo.<\/span> <span class=\"sg\" data-s=\"7\">Gli heredoc sono la scelta naturale per template e messaggi.<\/span> <span class=\"sg\" data-s=\"8\">In realtà, vanno bene per qualsiasi testo su più righe.<\/span><\/p>"]]},"lv":{"t":"Heredoc","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> ir citēšanas forma tekstam ar daudzām rindām.<\/span> <span class=\"sg\" data-s=\"1\">Tai nav norobežotāju ap tekstu.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā jūs norādāt terminatora vārdu ar <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Terminators atzīmē beigas.<\/span> <span class=\"sg\" data-s=\"4\">Virkne sākas nākamajā rindā.<\/span> <span class=\"sg\" data-s=\"5\">Tā turpinās līdz rindai, kurā ir tikai šis vārds:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Terminators atzīmē teksta beigas.<\/span> <span class=\"sg\" data-s=\"1\">Šeit tas ir <code>END<\/code>, bet jūs varat izmantot jebkuru vārdu.<\/span> <span class=\"sg\" data-s=\"2\">Apskatiet <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Teksts saglabā jaunrindu pirms terminatora.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc teksts jau beidzas ar rindas pārtraukumu.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> pievieno vēl vienu.<\/span> <span class=\"sg\" data-s=\"6\">Tad beigās jūs saņemat tukšu rindu.<\/span> <span class=\"sg\" data-s=\"7\">Šis heredoc sākas ar <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc Raku neinterpolē tekstu.<\/span> <span class=\"sg\" data-s=\"9\">Lai interpolētu mainīgos, izmantojiet <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit ir noderīga detaļa.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet <strong>aizverošā terminatora atkāpi<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku to noņem no katras teksta rindas.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat atkāpēt heredoc tāpat kā kodu apkārt.<\/span> <span class=\"sg\" data-s=\"4\">Atkāpe nenonāk virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā tos pašus <code>Hello,<\/code> un <code>World!<\/code> kā pirmajā piemērā.<\/span> <span class=\"sg\" data-s=\"1\">Šeit aizverošajam <code>END<\/code> priekšā ir astoņas atstarpes.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc Raku noņem astoņas atstarpes no katras rindas.<\/span> <span class=\"sg\" data-s=\"3\">Funkcija atgriež tikai <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sākumā nav atstarpju.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Aizverošais terminators nosaka, cik atstarpju Raku noņem.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc katrai teksta rindai vajag vismaz tik daudz atstarpju.<\/span> <span class=\"sg\" data-s=\"2\">Varbūt kādai rindai ir mazāk atstarpju.<\/span> <span class=\"sg\" data-s=\"3\">Tad Raku nevar noņemt tās visas.<\/span> <span class=\"sg\" data-s=\"4\">Tas brīdina: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Izvairieties no šī brīdinājuma.<\/span> <span class=\"sg\" data-s=\"6\">Neatkāpiet terminatoru vairāk par jebkuru teksta rindu.<\/span> <span class=\"sg\" data-s=\"7\">Heredoc ir dabiska izvēle veidnēm un ziņojumiem.<\/span> <span class=\"sg\" data-s=\"8\">Patiesībā tie der jebkuram tekstam ar vairākām rindām.<\/span><\/p>"]]},"ru":{"t":"Heredoc-строки","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — это форма цитирования для текста в несколько строк.<\/span> <span class=\"sg\" data-s=\"1\">У неё нет разделителей вокруг текста.<\/span> <span class=\"sg\" data-s=\"2\">Вместо них вы даёте слово-терминатор с <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Терминатор отмечает конец.<\/span> <span class=\"sg\" data-s=\"4\">Текст начинается на следующей строке.<\/span> <span class=\"sg\" data-s=\"5\">Он идёт до строки, где есть только это слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это выводит:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Терминатор отмечает конец текста.<\/span> <span class=\"sg\" data-s=\"1\">Здесь это <code>END<\/code>, но можно взять любое слово.<\/span> <span class=\"sg\" data-s=\"2\">Посмотрите на <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текст сохраняет перевод строки перед терминатором.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому текст уже заканчивается переводом строки.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> добавляет второй.<\/span> <span class=\"sg\" data-s=\"6\">Тогда в конце получается пустая строка.<\/span> <span class=\"sg\" data-s=\"7\">Этот heredoc начинается с <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому текст не интерполируется.<\/span> <span class=\"sg\" data-s=\"9\">Чтобы интерполировать переменные, используйте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вот полезная деталь.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на <strong>отступ закрывающего терминатора<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku убирает его из каждой строки текста.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому у heredoc'а можно сделать такой же отступ, как у кода вокруг него.<\/span> <span class=\"sg\" data-s=\"4\">Этот отступ не попадает в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Это печатает те же <code>Hello,<\/code> и <code>World!<\/code>, что и первый пример.<\/span> <span class=\"sg\" data-s=\"1\">Здесь у закрывающего <code>END<\/code> впереди восемь пробелов.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому Raku убирает восемь пробелов из каждой строки.<\/span> <span class=\"sg\" data-s=\"3\">Функция возвращает просто <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В начале пробелов нет.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Закрывающий терминатор решает, сколько пробелов убирает Raku.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в каждой строке текста нужно хотя бы столько же пробелов.<\/span> <span class=\"sg\" data-s=\"2\">Может быть, в какой-то строке пробелов меньше.<\/span> <span class=\"sg\" data-s=\"3\">Тогда Raku не может убрать их все.<\/span> <span class=\"sg\" data-s=\"4\">Он предупреждает: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Избегайте этого предупреждения.<\/span> <span class=\"sg\" data-s=\"6\">Делайте у терминатора отступ не больше, чем у каждой строки текста.<\/span> <span class=\"sg\" data-s=\"7\">Heredoc'и — естественный выбор для шаблонов и сообщений.<\/span> <span class=\"sg\" data-s=\"8\">На самом деле они хороши для любого текста в несколько строк.<\/span><\/p>"]]},"uk":{"t":"Heredoc-и","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — це форма цитування для тексту з багатьма рядками.<\/span> <span class=\"sg\" data-s=\"1\">Навколо тексту в нього немає роздільників.<\/span> <span class=\"sg\" data-s=\"2\">Натомість ви даєте слово-термінатор через <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Термінатор позначає кінець.<\/span> <span class=\"sg\" data-s=\"4\">Рядок починається з наступного рядка коду.<\/span> <span class=\"sg\" data-s=\"5\">Він триває до рядка, де є лише це слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Термінатор позначає кінець тексту.<\/span> <span class=\"sg\" data-s=\"1\">Тут це <code>END<\/code>, але можна взяти будь-яке слово.<\/span> <span class=\"sg\" data-s=\"2\">Подивіться на <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текст зберігає перехід рядка перед термінатором.<\/span> <span class=\"sg\" data-s=\"4\">Тож текст уже закінчується розривом рядка.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> додає другий.<\/span> <span class=\"sg\" data-s=\"6\">Тоді в кінці ви отримуєте порожній рядок.<\/span> <span class=\"sg\" data-s=\"7\">Цей heredoc починається з <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Тому текст не інтерполюється.<\/span> <span class=\"sg\" data-s=\"9\">Щоб інтерполювати змінні, використовуйте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ось корисна деталь.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на <strong>відступ закривального термінатора<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku прибирає його з кожного рядка тексту.<\/span> <span class=\"sg\" data-s=\"3\">Тож heredoc можна писати з відступом, як код навколо.<\/span> <span class=\"sg\" data-s=\"4\">Відступ не потрапляє в рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це виводить ті самі <code>Hello,<\/code> та <code>World!<\/code>, що й перший приклад.<\/span> <span class=\"sg\" data-s=\"1\">Тут закривальне <code>END<\/code> має попереду вісім пробілів.<\/span> <span class=\"sg\" data-s=\"2\">Тому Raku прибирає вісім пробілів із кожного рядка.<\/span> <span class=\"sg\" data-s=\"3\">Функція повертає просто <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">На початку немає пробілів.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Закривальний термінатор визначає, скільки пробілів прибирає Raku.<\/span> <span class=\"sg\" data-s=\"1\">Тож кожен рядок тексту потребує щонайменше стільки пробілів.<\/span> <span class=\"sg\" data-s=\"2\">Можливо, у рядку менше пробілів.<\/span> <span class=\"sg\" data-s=\"3\">Тоді Raku не може прибрати їх усі.<\/span> <span class=\"sg\" data-s=\"4\">Він попереджає: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Уникайте цього попередження.<\/span> <span class=\"sg\" data-s=\"6\">Не робіть термінатору більший відступ, ніж у будь-якого рядка тексту.<\/span> <span class=\"sg\" data-s=\"7\">Heredoc-и — природний вибір для шаблонів і повідомлень.<\/span> <span class=\"sg\" data-s=\"8\">Насправді вони добрі для будь-якого тексту з кількох рядків.<\/span><\/p>"]]},"bg":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> е форма на цитиране за текст с много редове.<\/span> <span class=\"sg\" data-s=\"1\">Тя няма разделители около текста.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това задавате терминираща дума с <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Терминаторът показва края.<\/span> <span class=\"sg\" data-s=\"4\">Низът започва на следващия ред.<\/span> <span class=\"sg\" data-s=\"5\">Той продължава до ред, в който има само тази дума:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Терминаторът показва края на текста.<\/span> <span class=\"sg\" data-s=\"1\">Тук това е <code>END<\/code>, но можете да използвате всяка дума.<\/span> <span class=\"sg\" data-s=\"2\">Вижте <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текстът пази новия ред преди терминатора.<\/span> <span class=\"sg\" data-s=\"4\">Затова текстът вече завършва с край на ред.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> добавя още един.<\/span> <span class=\"sg\" data-s=\"6\">Тогава получавате празен ред в края.<\/span> <span class=\"sg\" data-s=\"7\">Този heredoc започва с <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Затова текстът не се интерполира.<\/span> <span class=\"sg\" data-s=\"9\">За да интерполирате променливи, използвайте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ето един полезен детайл.<\/span> <span class=\"sg\" data-s=\"1\">Вижте <strong>отстъпа на затварящия терминатор<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku го премахва от всеки ред на текста.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да отместите heredoc като кода около него.<\/span> <span class=\"sg\" data-s=\"4\">Отстъпът не влиза в низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва същите <code>Hello,<\/code> и <code>World!<\/code> като първия пример.<\/span> <span class=\"sg\" data-s=\"1\">Тук затварящият <code>END<\/code> има осем интервала пред себе си.<\/span> <span class=\"sg\" data-s=\"2\">Затова Raku премахва осем интервала от всеки ред.<\/span> <span class=\"sg\" data-s=\"3\">Функцията връща просто <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В началото няма интервали.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Затварящият терминатор решава колко интервала премахва Raku.<\/span> <span class=\"sg\" data-s=\"1\">Затова всеки ред от текста има нужда от поне толкова интервала.<\/span> <span class=\"sg\" data-s=\"2\">Може някой ред да има по-малко интервали.<\/span> <span class=\"sg\" data-s=\"3\">Тогава Raku не може да премахне всички.<\/span> <span class=\"sg\" data-s=\"4\">Raku предупреждава: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Избягвайте това предупреждение.<\/span> <span class=\"sg\" data-s=\"6\">Не отмествайте терминатора повече от който и да е ред на текста.<\/span> <span class=\"sg\" data-s=\"7\">Heredoc-ите са естественият избор за шаблони и съобщения.<\/span> <span class=\"sg\" data-s=\"8\">Всъщност те са добри за всеки текст с няколко реда.<\/span><\/p>"]]},"eo":{"t":"Heredokoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> estas cita formo por teksto kun multaj linioj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne havas limigilojn ĉirkaŭ la teksto.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, vi donas finan vorton per <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La finilo markas la finon.<\/span> <span class=\"sg\" data-s=\"4\">La ĉeno komenciĝas en la sekva linio.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi daŭras ĝis linio kun nur tiu vorto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">La finilo markas la finon de la teksto.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie ĝi estas <code>END<\/code>, sed vi povas uzi ajnan vorton.<\/span> <span class=\"sg\" data-s=\"2\">Rigardu la <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La teksto tenas la novlinion antaŭ la finilo.<\/span> <span class=\"sg\" data-s=\"4\">Do la teksto jam finiĝas per liniorompo.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> aldonas duan.<\/span> <span class=\"sg\" data-s=\"6\">Tiam vi ricevas malplenan linion ĉe la fino.<\/span> <span class=\"sg\" data-s=\"7\">Ĉi tiu heredoc komenciĝas per <code>q:to<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Do Raku ne interpolas la tekston.<\/span> <span class=\"sg\" data-s=\"9\">Por interpoli variablojn, uzu <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jen utila detalo.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu la <strong>krommarĝenon de la ferma finilo<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku forigas ĝin el ĉiu linio de la teksto.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas krommarĝenigi heredoc-on kiel la kodon ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"4\">La krommarĝeno ne eniras la ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tio presas la samajn <code>Hello,<\/code> kaj <code>World!<\/code> kiel la unua ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, la ferma <code>END<\/code> havas ok spacetojn antaŭ si.<\/span> <span class=\"sg\" data-s=\"2\">Do Raku forigas ok spacetojn el ĉiu linio.<\/span> <span class=\"sg\" data-s=\"3\">La funkcio redonas nur <code>Hello,\\nWorld!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ne estas spacetoj komence.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La ferma finilo decidas, kiom da spacetoj Raku forigas.<\/span> <span class=\"sg\" data-s=\"1\">Do ĉiu linio de la teksto bezonas almenaŭ tiom da spacetoj.<\/span> <span class=\"sg\" data-s=\"2\">Eble iu linio havas malpli da spacetoj.<\/span> <span class=\"sg\" data-s=\"3\">Tiam Raku ne povas forigi ĉiujn.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi avertas: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Evitu ĉi tiun averton.<\/span> <span class=\"sg\" data-s=\"6\">Ne krommarĝenigu la finilon pli ol iu ajn linio de la teksto.<\/span> <span class=\"sg\" data-s=\"7\">Heredoc-oj estas la natura elekto por ŝablonoj kaj mesaĝoj.<\/span> <span class=\"sg\" data-s=\"8\">Fakte, ili taŭgas por ajna teksto kun pluraj linioj.<\/span><\/p>"]]},"la":{"t":"Heredocs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> est forma citandi pro textu multarum linearum.<\/span> <span class=\"sg\" data-s=\"1\">Nullos delimitatores circa textum habet.<\/span> <span class=\"sg\" data-s=\"2\">Pro eis verbum terminans cum <code>:to<\/code> das.<\/span> <span class=\"sg\" data-s=\"3\">Terminator finem signat.<\/span> <span class=\"sg\" data-s=\"4\">Series in proxima linea incipit.<\/span> <span class=\"sg\" data-s=\"5\">Usque ad lineam cum solo illo verbo pergit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Terminator finem textus signat.<\/span> <span class=\"sg\" data-s=\"1\">Hic est <code>END<\/code>, sed quodlibet verbum adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Specta <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Textus finem lineae ante terminatorem servat.<\/span> <span class=\"sg\" data-s=\"4\">Itaque textus iam cum fractura lineae desinit.<\/span> <span class=\"sg\" data-s=\"5\"><code>say<\/code> alteram addit.<\/span> <span class=\"sg\" data-s=\"6\">Tum lineam vacuam in fine accipis.<\/span> <span class=\"sg\" data-s=\"7\">Hoc heredoc cum <code>q:to<\/code> incipit.<\/span> <span class=\"sg\" data-s=\"8\">Itaque Raku textum non interpolat.<\/span> <span class=\"sg\" data-s=\"9\">Ut variabiles interpoles, <code>qq:to<\/code> adhibe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ecce res utilis.<\/span> <span class=\"sg\" data-s=\"1\">Specta <strong>indentationem terminatoris claudentis<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Raku eam ab omni linea textus removet.<\/span> <span class=\"sg\" data-s=\"3\">Itaque heredoc sicut codicem circa id indentare potes.<\/span> <span class=\"sg\" data-s=\"4\">Indentatio in seriem non venit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc idem <code>Hello,<\/code> et <code>World!<\/code> imprimit ac primum exemplum.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>END<\/code> claudens octo spatia ante se habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Raku octo spatia ab omni linea removet.<\/span> <span class=\"sg\" data-s=\"3\">Functio solum <code>Hello,\\nWorld!<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"4\">Nulla spatia in initio sunt.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Terminator claudens numerum spatiorum statuit quae Raku removet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque omnis linea textus saltem tot spatia requirit.<\/span> <span class=\"sg\" data-s=\"2\">Fortasse linea pauciora spatia habet.<\/span> <span class=\"sg\" data-s=\"3\">Tum Raku omnia removere non potest.<\/span> <span class=\"sg\" data-s=\"4\">Monet: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Hoc monitum vita.<\/span> <span class=\"sg\" data-s=\"6\">Terminatorem non plus quam ullam lineam textus indenta.<\/span> <span class=\"sg\" data-s=\"7\">Heredocs sunt naturalis electio pro exemplaribus et nuntiis.<\/span> <span class=\"sg\" data-s=\"8\">Re vera bona sunt pro quolibet textu plurium linearum.<\/span><\/p>"]]}}}</script>
