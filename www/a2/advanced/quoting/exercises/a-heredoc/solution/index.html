<script type="application/json" id="page-data">{"u":"advanced/quoting/exercises/a-heredoc/solution","n":477,"k":"solution","pv":"advanced/quoting/exercises/a-heredoc","nx":"advanced/date-and-time","tr":["advanced","advanced/quoting"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"L":{"en":{"t":"The solution of ’A heredoc‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The heredoc starts with <code>qq:to<\/code>, not with <code>q:to<\/code>. So it interpolates. It works like a <code>qq<\/code> string. It fills in the scalars <code>$name<\/code>, <code>$count<\/code>, and <code>$item<\/code>. It <em>also<\/em> runs code inside the text. The block <code>{$count * $price}<\/code> calculates <code>3 * 25<\/code>. So the total <code>75<\/code> appears in the text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Look at the double quotes in <code>\"$item\"<\/code>. Here, they are just normal characters. In a heredoc, quotes are not delimiters. So they need no backslash. Raku prints the quotes as they are. But it still interpolates <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body and the closing <code>END<\/code> both have four spaces in front. Raku removes the indentation of the terminator from every line. So these four spaces never get into the string. The output starts at the left edge.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The heredoc already ends with a newline. So the program uses <code>print<\/code>, not <code>say<\/code>. <code>say<\/code> adds one more newline. That gives an extra empty line.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc beginnt mit <code>qq:to<\/code>, nicht mit <code>q:to<\/code>. Also interpoliert das Heredoc. Es funktioniert wie ein <code>qq<\/code>-String. Es setzt die Skalare <code>$name<\/code>, <code>$count<\/code> und <code>$item<\/code> ein. Es führt <em>auch<\/em> Code im Text aus. Der Block <code>{$count * $price}<\/code> berechnet <code>3 * 25<\/code>. Deshalb erscheint die Gesamtsumme <code>75<\/code> im Text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sieh dir die doppelten Anführungszeichen in <code>\"$item\"<\/code> an. Hier sind sie nur normale Zeichen. In einem Heredoc sind Anführungszeichen keine Trennzeichen. Deshalb brauchen sie keinen Backslash. Raku gibt die Anführungszeichen so aus, wie sie sind. Aber Raku interpoliert <code>$item<\/code> trotzdem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf und das schließende <code>END<\/code> haben beide vier Leerzeichen davor. Raku entfernt die Einrückung des Abschlussworts aus jeder Zeile. Deshalb kommen diese vier Leerzeichen nie in den String. Die Ausgabe beginnt am linken Rand.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc endet schon mit einem Zeilenumbruch. Deshalb benutzt das Programm <code>print<\/code>, nicht <code>say<\/code>. <code>say<\/code> fügt noch einen Zeilenumbruch hinzu. Das ergibt eine zusätzliche Leerzeile.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc begint met <code>qq:to<\/code>, niet met <code>q:to<\/code>. Daarom interpoleert hij. Hij werkt als een <code>qq<\/code>-string. Hij vult de scalars <code>$name<\/code>, <code>$count<\/code> en <code>$item<\/code> in. Hij voert <em>ook<\/em> code in de tekst uit. Het blok <code>{$count * $price}<\/code> berekent <code>3 * 25<\/code>. Daarom staat het totaal <code>75<\/code> in de tekst.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kijk naar de dubbele aanhalingstekens in <code>\"$item\"<\/code>. Hier zijn het gewoon normale tekens. In een heredoc zijn aanhalingstekens geen scheidingstekens. Daarom hebben ze geen backslash nodig. Raku drukt de aanhalingstekens af zoals ze zijn. Maar Raku interpoleert <code>$item<\/code> toch.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De inhoud en het afsluitende <code>END<\/code> hebben allebei vier spaties ervoor. Raku haalt de inspringing van het afsluitwoord van elke regel weg. Daarom komen deze vier spaties nooit in de string. De uitvoer begint aan de linkerkant.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc eindigt al met een nieuwe regel. Daarom gebruikt het programma <code>print<\/code>, niet <code>say<\/code>. <code>say<\/code> voegt nog een nieuwe regel toe. Dat geeft een extra lege regel.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc empieza con <code>qq:to<\/code>, no con <code>q:to<\/code>. Por eso interpola. Funciona como una cadena <code>qq<\/code>. Rellena los escalares <code>$name<\/code>, <code>$count<\/code> y <code>$item<\/code>. <em>También<\/em> ejecuta código dentro del texto. El bloque <code>{$count * $price}<\/code> calcula <code>3 * 25<\/code>. Así que el total <code>75<\/code> aparece en el texto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mira las comillas dobles en <code>\"$item\"<\/code>. Aquí, son solo caracteres normales. En un heredoc, las comillas no son delimitadores. Por eso no necesitan barra invertida. Raku imprime las comillas tal como están. Pero aun así interpola <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo y el <code>END<\/code> de cierre tienen los dos cuatro espacios delante. Raku quita la indentación del terminador de cada línea. Por eso estos cuatro espacios nunca llegan a la cadena. La salida empieza en el borde izquierdo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc ya termina con un salto de línea. Por eso el programa usa <code>print<\/code>, no <code>say<\/code>. <code>say<\/code> añade otro salto de línea. Eso da una línea vacía de más.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc inizia con <code>qq:to<\/code>, non con <code>q:to<\/code>. Quindi interpola. Funziona come una stringa <code>qq<\/code>. Inserisce gli scalari <code>$name<\/code>, <code>$count<\/code> e <code>$item<\/code>. Esegue <em>anche<\/em> il codice dentro il testo. Il blocco <code>{$count * $price}<\/code> calcola <code>3 * 25<\/code>. Così il totale <code>75<\/code> appare nel testo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Guarda le virgolette doppie in <code>\"$item\"<\/code>. Qui sono solo caratteri normali. In un heredoc, le virgolette non sono delimitatori. Quindi non serve il backslash. Raku stampa le virgolette così come sono. Ma interpola comunque <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo e il terminatore <code>END<\/code> alla fine hanno tutti e due quattro spazi davanti. Raku toglie da ogni riga l'indentazione del terminatore. Così questi quattro spazi non entrano mai nella stringa. L'output inizia dal bordo sinistro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc finisce già con un carattere di nuova riga. Quindi il programma usa <code>print<\/code>, non <code>say<\/code>. <code>say<\/code> aggiunge un altro carattere di nuova riga. Questo dà una riga vuota in più.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc sākas ar <code>qq:to<\/code>, nevis ar <code>q:to<\/code>. Tāpēc tas interpolē. Tas strādā kā <code>qq<\/code> virkne. Tas ievieto skalāru <code>$name<\/code>, <code>$count<\/code> un <code>$item<\/code> vērtības. Tas <em>arī<\/em> izpilda kodu teksta iekšienē. Bloks <code>{$count * $price}<\/code> aprēķina <code>3 * 25<\/code>. Tāpēc kopsumma <code>75<\/code> parādās tekstā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Apskatiet dubultpēdiņas <code>\"$item\"<\/code>. Šeit tās ir tikai parastas rakstzīmes. Heredoc iekšienē pēdiņas nav norobežotāji. Tāpēc tām nevajag atpakaļsvītru. Raku izdrukā pēdiņas tādas, kādas tās ir. Bet tas joprojām interpolē <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pamattekstam un aizverošajam <code>END<\/code> abiem priekšā ir četras atstarpes. Raku noņem terminatora atkāpi no katras rindas. Tāpēc šīs četras atstarpes nekad nenonāk virknē. Izvade sākas pie kreisās malas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc jau beidzas ar jaunrindu. Tāpēc programma izmanto <code>print<\/code>, nevis <code>say<\/code>. <code>say<\/code> pievieno vēl vienu jaunrindu. Tā rodas lieka tukša rinda.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc начинается с <code>qq:to<\/code>, а не с <code>q:to<\/code>. Поэтому он интерполирует. Он работает как строка <code>qq<\/code>. Он вставляет скаляры <code>$name<\/code>, <code>$count<\/code> и <code>$item<\/code>. Он <em>также<\/em> выполняет код внутри текста. Блок <code>{$count * $price}<\/code> вычисляет <code>3 * 25<\/code>. Поэтому итоговая сумма <code>75<\/code> появляется в тексте.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Посмотрите на двойные кавычки в <code>\"$item\"<\/code>. Здесь это просто обычные символы. В heredoc'е кавычки — не разделители. Поэтому им не нужен обратный слэш. Raku печатает кавычки как есть. Но <code>$item<\/code> он всё равно интерполирует.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У тела и у закрывающего <code>END<\/code> впереди по четыре пробела. Raku убирает отступ терминатора из каждой строки. Поэтому эти четыре пробела никогда не попадают в строку. Вывод начинается у левого края.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже заканчивается переводом строки. Поэтому программа использует <code>print<\/code>, а не <code>say<\/code>. <code>say<\/code> добавляет ещё один перевод строки. Это даёт лишнюю пустую строку.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc починається з <code>qq:to<\/code>, а не з <code>q:to<\/code>. Тому він інтерполює. Він працює як рядок <code>qq<\/code>. Він підставляє скаляри <code>$name<\/code>, <code>$count<\/code> та <code>$item<\/code>. Він <em>також<\/em> виконує код усередині тексту. Блок <code>{$count * $price}<\/code> обчислює <code>3 * 25<\/code>. Тож сума <code>75<\/code> з'являється в тексті.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Подивіться на подвійні лапки в <code>\"$item\"<\/code>. Тут це просто звичайні символи. У heredoc-у лапки не є роздільниками. Тому їм не потрібна зворотна коса риска. Raku виводить лапки без змін. Але він усе одно інтерполює <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло і закривальне <code>END<\/code> мають попереду по чотири пробіли. Raku прибирає відступ термінатора з кожного рядка. Тож ці чотири пробіли ніколи не потрапляють у рядок. Вивід починається з лівого краю.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже закінчується переходом рядка. Тому програма використовує <code>print<\/code>, а не <code>say<\/code>. <code>say<\/code> додає ще один перехід рядка. Це дає зайвий порожній рядок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът започва с <code>qq:to<\/code>, а не с <code>q:to<\/code>. Затова той интерполира. Работи като низ с <code>qq<\/code>. Попълва скаларите <code>$name<\/code>, <code>$count<\/code> и <code>$item<\/code>. Той <em>също<\/em> изпълнява код в текста. Блокът <code>{$count * $price}<\/code> изчислява <code>3 * 25<\/code>. Затова общата сума <code>75<\/code> се появява в текста.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вижте двойните кавички в <code>\"$item\"<\/code>. Тук те са просто обикновени символи. В heredoc кавичките не са разделители. Затова не им трябва обратна наклонена черта. Raku отпечатва кавичките без промяна. Но все пак интерполира <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото и затварящият <code>END<\/code> имат по четири интервала отпред. Raku премахва отстъпа на терминатора от всеки ред. Затова тези четири интервала никога не влизат в низа. Изходът започва от левия край.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът вече завършва с нов ред. Затова програмата използва <code>print<\/code>, а не <code>say<\/code>. <code>say<\/code> добавя още един нов ред. Така се получава излишен празен ред.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Heredoko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc komenciĝas per <code>qq:to<\/code>, ne per <code>q:to<\/code>. Do ĝi interpolas. Ĝi funkcias kiel <code>qq<\/code>-ĉeno. Ĝi enmetas la skalarojn <code>$name<\/code>, <code>$count<\/code> kaj <code>$item<\/code>. Ĝi <em>ankaŭ<\/em> rulas kodon ene de la teksto. La bloko <code>{$count * $price}<\/code> kalkulas <code>3 * 25<\/code>. Do la totalo <code>75<\/code> aperas en la teksto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Rigardu la duoblajn citilojn en <code>\"$item\"<\/code>. Ĉi tie ili estas nur normalaj signoj. En heredoc, citiloj ne estas limigiloj. Do ili ne bezonas maldekstran streketon. Raku presas la citilojn sen ŝanĝo. Sed ĝi tamen interpolas <code>$item<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La korpo kaj la ferma <code>END<\/code> ambaŭ havas kvar spacetojn antaŭe. Raku forigas la krommarĝenon de la finilo el ĉiu linio. Do ĉi tiuj kvar spacetoj neniam eniras la ĉenon. La eligo komenciĝas ĉe la maldekstra rando.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc jam finiĝas per novlinio. Do la programo uzas <code>print<\/code>, ne <code>say<\/code>. <code>say<\/code> aldonas ankoraŭ unu novlinion. Tio donas kroman malplenan linion.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc cum <code>qq:to<\/code> incipit, non cum <code>q:to<\/code>. Itaque interpolat. Sicut series <code>qq<\/code> operatur. Scalares <code>$name<\/code>, <code>$count<\/code>, et <code>$item<\/code> implet. <em>Etiam<\/em> codicem intra textum exsequitur. Claustrum <code>{$count * $price}<\/code> computat <code>3 * 25<\/code>. Itaque summa <code>75<\/code> in textu apparet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Specta apostrophos duplices in <code>\"$item\"<\/code>. Hic solum characteres normales sunt. In heredoc apostrophi delimitatores non sunt. Itaque nullum obliquum reversum requirunt. Raku apostrophos ut sunt imprimit. Sed <code>$item<\/code> tamen interpolat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus et <code>END<\/code> claudens ambo quattuor spatia ante se habent. Raku indentationem terminatoris ab omni linea removet. Itaque haec quattuor spatia numquam in seriem veniunt. Eventus a margine sinistro incipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc iam cum fine lineae desinit. Itaque programma <code>print<\/code> adhibet, non <code>say<\/code>. <code>say<\/code> alium finem lineae addit. Sic alia linea vacua apparet.<\/span><\/li><\/ol>"]]}}}</script>
