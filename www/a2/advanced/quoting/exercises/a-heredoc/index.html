a-s=\"3\">Тоді у виводі не буде відступу.<\/span> <span class=\"sg\" data-s=\"4\">Виведіть результат.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Візьміть <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> та <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді програма виводить ось це.<\/span> <span class=\"sg\" data-s=\"2\">На початку рядків немає пробілів:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Heredoc","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Напишете писмо, което потвърждава поръчка.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте heredoc, който <em>интерполира<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Съставете писмото от няколко променливи.<\/span> <span class=\"sg\" data-s=\"3\">Променливите са клиент <code>$name<\/code>, артикул <code>$item<\/code>, цена <code>$price<\/code> и брой <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Цената е за един артикул.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc-ът слага вътре стойностите на променливите.<\/span> <span class=\"sg\" data-s=\"6\">Той <em>също<\/em> намира общата сума.<\/span> <span class=\"sg\" data-s=\"7\">За целта в текста има блок <code>{ … }<\/code> (<code>$count * $price<\/code>).<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Отместете тялото на heredoc-а.<\/span> <span class=\"sg\" data-s=\"1\">То трябва да е подравнено с кода около него.<\/span> <span class=\"sg\" data-s=\"2\">Сложете затварящия терминатор със същия отстъп като текста.<\/span> <span class=\"sg\" data-s=\"3\">Тогава изходът няма отстъп.<\/span> <span class=\"sg\" data-s=\"4\">Отпечатайте резултата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вземете <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> и <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава програмата отпечатва това.<\/span> <span class=\"sg\" data-s=\"2\">В началото на редовете няма интервали:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Heredoko","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Skribu leteron, kiu konfirmas mendon.<\/span> <span class=\"sg\" data-s=\"1\">Uzu heredoc-on, kiu <em>interpolas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Konstruu la leteron el kelkaj variabloj.<\/span> <span class=\"sg\" data-s=\"3\">La variabloj estas kliento <code>$name<\/code>, <code>$item<\/code>, <code>$price<\/code> kaj <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La prezo estas por unu varo.<\/span> <span class=\"sg\" data-s=\"5\">La heredoc enmetas la valorojn de la variabloj.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi <em>ankaŭ<\/em> trovas la totalon.<\/span> <span class=\"sg\" data-s=\"7\">Por tio, ĝi havas <code>{ … }<\/code>-blokon ene de la teksto (<code>$count * $price<\/code>).<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Krommarĝenigu la korpon de la heredoc.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi devas kongrui kun la kodo ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Metu la fermilon je la sama krommarĝeno kiel la teksto.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la eligo ne havas krommarĝenon.<\/span> <span class=\"sg\" data-s=\"4\">Presu la rezulton.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prenu <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> kaj <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la programo presas ĉi tion.<\/span> <span class=\"sg\" data-s=\"2\">Ne estas spacetoj komence de la linioj:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Heredoc","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Scribe epistulam quae emptionem confirmat.<\/span> <span class=\"sg\" data-s=\"1\">Heredoc adhibe quod <em>interpolat<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Epistulam ex paucis variabilibus aedifica.<\/span> <span class=\"sg\" data-s=\"3\">Variabiles sunt emptor <code>$name<\/code>, res <code>$item<\/code>, pretium <code>$price<\/code>, et numerus <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Pretium est pro una re.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc valores variabilium inserit.<\/span> <span class=\"sg\" data-s=\"6\"><em>Etiam<\/em> summam invenit.<\/span> <span class=\"sg\" data-s=\"7\">Ad hoc claustrum <code>{ … }<\/code> intra textum habet (<code>$count * $price<\/code>).<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Corpus heredoc indenta.<\/span> <span class=\"sg\" data-s=\"1\">Cum codice circa id congruere debet.<\/span> <span class=\"sg\" data-s=\"2\">Terminatorem claudentem eadem indentatione ac textum pone.<\/span> <span class=\"sg\" data-s=\"3\">Tum output nullam indentationem habet.<\/span> <span class=\"sg\" data-s=\"4\">Eventum imprime.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sume <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code>, et <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum programma hoc imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Nulla spatia in initio linearum sunt:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
