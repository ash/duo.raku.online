"<ol><li><span class=\"sg\" data-s=\"0\">La <code>q<\/code>-formo kutime tenas la tekston sen ŝanĝo. La adverbo <code>:c<\/code> (fermo) ŝanĝas tion. Ĝi ŝaltas interpoladon de <code>{ … }<\/code>-kodo en la teksto. Ene de la krampoj, <code>$x<\/code> estas vera kodo. Do <code>{$x ** 2}<\/code> donas <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>$x<\/code> ekster la krampoj restas ekzakte sen ŝanĝo. Tio estas, ĉar la skalara adverbo <code>:s<\/code> <em>ne<\/em> estas ŝaltita. Jen la tuta ideo de unu adverbo por ĉiu funkcio. Vi ricevas kodon en la teksto. Sed vi ne samtempe ŝaltas interpoladon de <code>$<\/code>-variabloj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi povas uzi plurajn adverbojn kune. Aldonu ankaŭ <code>:s<\/code>. Tiam Raku interpolas ankaŭ la unuan <code>$x<\/code>. Nun ambaŭ funkcioj estas ŝaltitaj:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"la":{"t":"Solutio: Clausura in q catena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Forma <code>q<\/code> plerumque textum ut est servat. Adverbium <code>:c<\/code> (clausura) hoc mutat. Interpolationem codicis <code>{ … }<\/code> in textu accendit. Intra uncos <code>$x<\/code> verus codex est. Itaque <code>{$x ** 2}<\/code> dat <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> extra uncos exacte ut est manet. Nam adverbium scalare <code>:s<\/code> <em>non<\/em> accensum est. Hoc est totum consilium: unum adverbium pro quaque proprietate. Codicem in textu accipis. Sed non etiam interpolationem variabilium <code>$<\/code> accendis.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Plura adverbia simul adhibere potes. Adde etiam <code>:s<\/code>. Tum Raku etiam primum <code>$x<\/code> interpolat. Nunc ambae proprietates accensae sunt:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]}}}</script>
