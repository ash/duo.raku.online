<script type="application/json" id="page-data">{"u":"advanced/quoting/adverbs","n":468,"k":"topic","pv":"advanced/quoting/q-qq-big-q/quiz","nx":"advanced/quoting/adverbs/quiz","tr":["advanced","advanced/quoting"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quoting adverbs","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">You can change how a quoting construct works.<\/span> <span class=\"sg\" data-s=\"1\">For this, you use <em>adverbs<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">A quoting construct has several features.<\/span> <span class=\"sg\" data-s=\"3\">For example, it can interpolate scalars.<\/span> <span class=\"sg\" data-s=\"4\">It can run code in braces.<\/span> <span class=\"sg\" data-s=\"5\">It can process backslashes.<\/span> <span class=\"sg\" data-s=\"6\">Each feature has its own adverb.<\/span> <span class=\"sg\" data-s=\"7\">The adverb turns this one feature on or off.<\/span> <span class=\"sg\" data-s=\"8\">So you can start from <code>q<\/code> or <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Then you add back exactly the features you need.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are some common adverbs:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — put the values of scalar variables (<code>$x<\/code>) into the string<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — run the code in <code>{ … }<\/code> and put the result into the string<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — handle backslash escapes, like <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Add one adverb to <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>q<\/code> gets one feature.<\/span> <span class=\"sg\" data-s=\"2\">For example, let it run code, but nothing else:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">With plain <code>q<\/code>, Raku prints <code>{ 3 * 4 }<\/code> as it is.<\/span> <span class=\"sg\" data-s=\"1\">Only <code>:c<\/code> runs the block.<\/span> <span class=\"sg\" data-s=\"2\">Then Raku puts the result into the string.<\/span> <span class=\"sg\" data-s=\"3\">A <code>$variable<\/code> still stays as it is.<\/span> <span class=\"sg\" data-s=\"4\">Look at the delimiters here: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Delimiters are the characters around the text.<\/span> <span class=\"sg\" data-s=\"6\">You can also use <code>{…}<\/code> as delimiters.<\/span> <span class=\"sg\" data-s=\"7\">There is no error, because the compiler counts the braces correctly.<\/span> <span class=\"sg\" data-s=\"8\">But then the inner <code>{ 3 * 4 }<\/code> is just a part of the text.<\/span> <span class=\"sg\" data-s=\"9\">It is not code.<\/span> <span class=\"sg\" data-s=\"10\">So <code>:c<\/code> does not run it, and it stays as it is.<\/span> <span class=\"sg\" data-s=\"11\">Does the text have a <code>{ … }<\/code> block?<\/span> <span class=\"sg\" data-s=\"12\">Then do not use <code>{…}<\/code> as delimiters.<\/span> <span class=\"sg\" data-s=\"13\">Use other delimiters.<\/span> <span class=\"sg\" data-s=\"14\">Then the code in the braces runs.<\/span> <span class=\"sg\" data-s=\"15\">You can also add scalar interpolation to <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"16\">Without it, <code>Q<\/code> keeps all the text as it is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverbs can also turn features <strong>off<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">For this, write a <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Here, we use <code>qq<\/code>, but <code>$<\/code> stays a normal character:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is the same as <code>Q<\/code> with all interpolation adverbs on.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> is the same as <code>Q<\/code> with fewer adverbs on.<\/span> <span class=\"sg\" data-s=\"2\">With the adverbs, you can choose every feature between these two ends.<\/span><\/p>"]]},"de":{"t":"Quoting-Adverbien","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Du kannst ändern, wie ein Quoting-Konstrukt arbeitet.<\/span> <span class=\"sg\" data-s=\"1\">Dafür benutzt du <em>Adverbien<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Quoting-Konstrukt hat mehrere Funktionen.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel kann es Skalare interpolieren.<\/span> <span class=\"sg\" data-s=\"4\">Es kann Code in geschweiften Klammern ausführen.<\/span> <span class=\"sg\" data-s=\"5\">Es kann Backslashes verarbeiten.<\/span> <span class=\"sg\" data-s=\"6\">Jede Funktion hat ihr eigenes Adverb.<\/span> <span class=\"sg\" data-s=\"7\">Das Adverb schaltet genau diese Funktion ein oder aus.<\/span> <span class=\"sg\" data-s=\"8\">So kannst du mit <code>q<\/code> oder <code>Q<\/code> beginnen.<\/span> <span class=\"sg\" data-s=\"9\">Dann fügst du genau die Funktionen wieder hinzu, die du brauchst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind einige häufige Adverbien:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — setzt die Werte von skalaren Variablen (<code>$x<\/code>) in den String ein<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — führt den Code in <code>{ … }<\/code> aus und setzt das Ergebnis in den String ein<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verarbeitet Backslash-Escape-Sequenzen wie <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Füge zu <code>q<\/code> ein Adverb hinzu.<\/span> <span class=\"sg\" data-s=\"1\">Dann bekommt <code>q<\/code> eine Funktion.<\/span> <span class=\"sg\" data-s=\"2\">Lass es zum Beispiel Code ausführen, aber sonst nichts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Mit einfachem <code>q<\/code> gibt Raku <code>{ 3 * 4 }<\/code> genau so aus, wie es ist.<\/span> <span class=\"sg\" data-s=\"1\">Nur <code>:c<\/code> führt den Block aus.<\/span> <span class=\"sg\" data-s=\"2\">Dann setzt Raku das Ergebnis in den String ein.<\/span> <span class=\"sg\" data-s=\"3\">Eine <code>$variable<\/code> bleibt trotzdem, wie sie ist.<\/span> <span class=\"sg\" data-s=\"4\">Sieh dir die Trennzeichen hier an: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Trennzeichen sind die Zeichen um den Text herum.<\/span> <span class=\"sg\" data-s=\"6\">Du kannst auch <code>{…}<\/code> als Trennzeichen benutzen.<\/span> <span class=\"sg\" data-s=\"7\">Das gibt keinen Fehler, weil der Compiler die Klammern richtig zählt.<\/span> <span class=\"sg\" data-s=\"8\">Aber dann ist das innere <code>{ 3 * 4 }<\/code> nur ein Teil des Textes.<\/span> <span class=\"sg\" data-s=\"9\">Es ist kein Code.<\/span> <span class=\"sg\" data-s=\"10\">Deshalb führt <code>:c<\/code> es nicht aus, und es bleibt, wie es ist.<\/span> <span class=\"sg\" data-s=\"11\">Hat der Text einen <code>{ … }<\/code>-Block?<\/span> <span class=\"sg\" data-s=\"12\">Dann benutze <code>{…}<\/code> nicht als Trennzeichen.<\/span> <span class=\"sg\" data-s=\"13\">Benutze andere Trennzeichen.<\/span> <span class=\"sg\" data-s=\"14\">Dann läuft der Code in den Klammern.<\/span> <span class=\"sg\" data-s=\"15\">Du kannst auch skalare Interpolation zu <code>Q<\/code> hinzufügen.<\/span> <span class=\"sg\" data-s=\"16\">Ohne sie lässt <code>Q<\/code> den ganzen Text, wie er ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverbien können Funktionen auch <strong>ausschalten<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Schreib dafür ein <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hier benutzen wir <code>qq<\/code>, aber <code>$<\/code> bleibt ein normales Zeichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ist dasselbe wie <code>Q<\/code> mit allen eingeschalteten Interpolations-Adverbien.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> ist dasselbe wie <code>Q<\/code> mit weniger eingeschalteten Adverbien.<\/span> <span class=\"sg\" data-s=\"2\">Mit den Adverbien kannst du jede Funktion zwischen diesen zwei Enden wählen.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsadverbia","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Je kunt veranderen hoe een quoting-constructie werkt.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor gebruik je <em>bijwoorden<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Een quoting-constructie heeft een paar functies.<\/span> <span class=\"sg\" data-s=\"3\">Ze kan bijvoorbeeld scalars interpoleren.<\/span> <span class=\"sg\" data-s=\"4\">Ze kan code tussen accolades uitvoeren.<\/span> <span class=\"sg\" data-s=\"5\">Ze kan backslashes verwerken.<\/span> <span class=\"sg\" data-s=\"6\">Elke functie heeft een eigen bijwoord.<\/span> <span class=\"sg\" data-s=\"7\">Het bijwoord zet deze ene functie aan of uit.<\/span> <span class=\"sg\" data-s=\"8\">Je kunt dus beginnen met <code>q<\/code> of <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Daarna voeg je precies de functies weer toe die je nodig hebt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar veelgebruikte bijwoorden:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — zet de waarden van scalaire variabelen (<code>$x<\/code>) in de string<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — voer de code in <code>{ … }<\/code> uit en zet het resultaat in de string<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verwerk backslash-escapes, zoals <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Voeg één bijwoord toe aan <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dan krijgt <code>q<\/code> één functie.<\/span> <span class=\"sg\" data-s=\"2\">Laat hem bijvoorbeeld code uitvoeren, maar verder niets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — gewone q laat het blok onaangeroerd\nsay q:c/result: {3 * 4}/; # result: 12        — :c voert het blok uit<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Met gewone <code>q<\/code> drukt Raku <code>{ 3 * 4 }<\/code> af zoals het is.<\/span> <span class=\"sg\" data-s=\"1\">Alleen <code>:c<\/code> voert het blok uit.<\/span> <span class=\"sg\" data-s=\"2\">Dan zet Raku het resultaat in de string.<\/span> <span class=\"sg\" data-s=\"3\">Een <code>$variable<\/code> blijft nog steeds zoals hij is.<\/span> <span class=\"sg\" data-s=\"4\">Kijk naar de scheidingstekens hier: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Scheidingstekens zijn de tekens rond de tekst.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt ook <code>{…}<\/code> als scheidingstekens gebruiken.<\/span> <span class=\"sg\" data-s=\"7\">Er komt geen fout, want de compiler telt de accolades goed.<\/span> <span class=\"sg\" data-s=\"8\">Maar dan is de binnenste <code>{ 3 * 4 }<\/code> gewoon een deel van de tekst.<\/span> <span class=\"sg\" data-s=\"9\">Het is geen code.<\/span> <span class=\"sg\" data-s=\"10\">Daarom voert <code>:c<\/code> het niet uit, en het blijft zoals het is.<\/span> <span class=\"sg\" data-s=\"11\">Heeft de tekst een <code>{ … }<\/code>-blok?<\/span> <span class=\"sg\" data-s=\"12\">Gebruik dan geen <code>{…}<\/code> als scheidingstekens.<\/span> <span class=\"sg\" data-s=\"13\">Gebruik andere scheidingstekens.<\/span> <span class=\"sg\" data-s=\"14\">Dan draait de code tussen de accolades.<\/span> <span class=\"sg\" data-s=\"15\">Je kunt ook scalaire interpolatie aan <code>Q<\/code> toevoegen.<\/span> <span class=\"sg\" data-s=\"16\">Zonder die interpolatie laat <code>Q<\/code> alle tekst zoals hij is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bijwoorden kunnen functies ook <strong>uitzetten<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf daarvoor een <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hier gebruiken we <code>qq<\/code>, maar <code>$<\/code> blijft een gewoon teken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is hetzelfde als <code>Q<\/code> met alle interpolatie-bijwoorden aan.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> is hetzelfde als <code>Q<\/code> met minder bijwoorden aan.<\/span> <span class=\"sg\" data-s=\"2\">Met de bijwoorden kies je elke functie zelf, tussen deze twee in.<\/span><\/p>"]]},"es":{"t":"Adverbios de entrecomillado","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Puedes cambiar cómo funciona una construcción de entrecomillado.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, usas <em>adverbios<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Una construcción de entrecomillado tiene varias características.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, puede interpolar escalares.<\/span> <span class=\"sg\" data-s=\"4\">Puede ejecutar código entre llaves.<\/span> <span class=\"sg\" data-s=\"5\">Puede procesar barras invertidas.<\/span> <span class=\"sg\" data-s=\"6\">Cada característica tiene su propio adverbio.<\/span> <span class=\"sg\" data-s=\"7\">El adverbio activa o desactiva esa característica.<\/span> <span class=\"sg\" data-s=\"8\">Así puedes empezar desde <code>q<\/code> o <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Luego añades exactamente las características que necesitas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunos adverbios comunes:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — pone los valores de las variables escalares (<code>$x<\/code>) en la cadena<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — ejecuta el código en <code>{ … }<\/code> y pone el resultado en la cadena<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — procesa las secuencias de escape con barra invertida, como <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Añade un adverbio a <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces <code>q<\/code> tiene una característica.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, deja que ejecute código, pero nada más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Con <code>q<\/code> simple, Raku imprime <code>{ 3 * 4 }<\/code> tal como está.<\/span> <span class=\"sg\" data-s=\"1\">Solo <code>:c<\/code> ejecuta el bloque.<\/span> <span class=\"sg\" data-s=\"2\">Entonces Raku pone el resultado en la cadena.<\/span> <span class=\"sg\" data-s=\"3\">Una <code>$variable<\/code> sigue igual.<\/span> <span class=\"sg\" data-s=\"4\">Mira los delimitadores aquí: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Los delimitadores son los caracteres alrededor del texto.<\/span> <span class=\"sg\" data-s=\"6\">También puedes usar <code>{…}<\/code> como delimitadores.<\/span> <span class=\"sg\" data-s=\"7\">No hay error, porque el compilador cuenta bien las llaves.<\/span> <span class=\"sg\" data-s=\"8\">Pero entonces el <code>{ 3 * 4 }<\/code> de dentro es solo una parte del texto.<\/span> <span class=\"sg\" data-s=\"9\">No es código.<\/span> <span class=\"sg\" data-s=\"10\">Así que <code>:c<\/code> no lo ejecuta, y queda tal como está.<\/span> <span class=\"sg\" data-s=\"11\">¿Tiene el texto un bloque <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Entonces no uses <code>{…}<\/code> como delimitadores.<\/span> <span class=\"sg\" data-s=\"13\">Usa otros delimitadores.<\/span> <span class=\"sg\" data-s=\"14\">Así el código entre las llaves se ejecuta.<\/span> <span class=\"sg\" data-s=\"15\">También puedes añadir interpolación escalar a <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"16\">Sin ella, <code>Q<\/code> deja todo el texto tal como está:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los adverbios también pueden <strong>desactivar<\/strong> características.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, escribe un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aquí usamos <code>qq<\/code>, pero <code>$<\/code> sigue siendo un carácter normal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> es lo mismo que <code>Q<\/code> con todos los adverbios de interpolación activados.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> es lo mismo que <code>Q<\/code> con menos adverbios activados.<\/span> <span class=\"sg\" data-s=\"2\">Con los adverbios, puedes elegir cada característica entre estos dos extremos.<\/span><\/p>"]]},"it":{"t":"Avverbi di quoting","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Puoi cambiare come funziona un costrutto di quoting.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, usi gli <em>avverbi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Un costrutto di quoting ha diverse funzionalità.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, può interpolare gli scalari.<\/span> <span class=\"sg\" data-s=\"4\">Può eseguire il codice tra parentesi graffe.<\/span> <span class=\"sg\" data-s=\"5\">Può elaborare i backslash.<\/span> <span class=\"sg\" data-s=\"6\">Ogni funzionalità ha il suo avverbio.<\/span> <span class=\"sg\" data-s=\"7\">L'avverbio attiva o disattiva solo questa funzionalità.<\/span> <span class=\"sg\" data-s=\"8\">Così puoi partire da <code>q<\/code> o <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Poi aggiungi esattamente le funzionalità che ti servono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni avverbi comuni:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — mette nella stringa i valori delle variabili scalari (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — esegue il codice in <code>{ … }<\/code> e mette il risultato nella stringa<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — gestisce le sequenze di escape con backslash, come <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aggiungi un avverbio a <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora <code>q<\/code> riceve una funzionalità.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, fagli eseguire il codice, ma nient'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Con il semplice <code>q<\/code>, Raku stampa <code>{ 3 * 4 }<\/code> così com'è.<\/span> <span class=\"sg\" data-s=\"1\">Solo <code>:c<\/code> esegue il blocco.<\/span> <span class=\"sg\" data-s=\"2\">Poi Raku mette il risultato nella stringa.<\/span> <span class=\"sg\" data-s=\"3\">Una variabile come <code>$variable<\/code> resta comunque così com'è.<\/span> <span class=\"sg\" data-s=\"4\">Guarda i delimitatori qui: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">I delimitatori sono i caratteri intorno al testo.<\/span> <span class=\"sg\" data-s=\"6\">Puoi usare anche <code>{…}<\/code> come delimitatori.<\/span> <span class=\"sg\" data-s=\"7\">Non c'è nessun errore, perché il compilatore conta bene le parentesi graffe.<\/span> <span class=\"sg\" data-s=\"8\">Ma allora il <code>{ 3 * 4 }<\/code> interno è solo una parte del testo.<\/span> <span class=\"sg\" data-s=\"9\">Non è codice.<\/span> <span class=\"sg\" data-s=\"10\">Così <code>:c<\/code> non lo esegue, e resta così com'è.<\/span> <span class=\"sg\" data-s=\"11\">Il testo ha un blocco <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Allora non usare <code>{…}<\/code> come delimitatori.<\/span> <span class=\"sg\" data-s=\"13\">Usa altri delimitatori.<\/span> <span class=\"sg\" data-s=\"14\">Così Raku esegue il codice tra le parentesi graffe.<\/span> <span class=\"sg\" data-s=\"15\">Puoi anche aggiungere a <code>Q<\/code> l'interpolazione degli scalari.<\/span> <span class=\"sg\" data-s=\"16\">Senza di essa, <code>Q<\/code> lascia tutto il testo così com'è:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gli avverbi possono anche <strong>disattivare<\/strong> le funzionalità.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, scrivi un <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Qui usiamo <code>qq<\/code>, ma <code>$<\/code> resta un carattere normale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> è come <code>Q<\/code> con tutti gli avverbi di interpolazione attivi.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> è come <code>Q<\/code> con meno avverbi attivi.<\/span> <span class=\"sg\" data-s=\"2\">Con gli avverbi puoi scegliere ogni funzionalità tra questi due estremi.<\/span><\/p>"]]},"lv":{"t":"Citēšanas apzīmētāji","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Jūs varat mainīt, kā strādā citēšanas konstrukcija.<\/span> <span class=\"sg\" data-s=\"1\">Tam jūs izmantojat <em>adverbus<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Citēšanas konstrukcijai ir vairākas funkcijas.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, tā var interpolēt skalārus.<\/span> <span class=\"sg\" data-s=\"4\">Tā var izpildīt kodu figūriekavās.<\/span> <span class=\"sg\" data-s=\"5\">Tā var apstrādāt atpakaļsvītras.<\/span> <span class=\"sg\" data-s=\"6\">Katrai funkcijai ir savs adverbs.<\/span> <span class=\"sg\" data-s=\"7\">Adverbs ieslēdz vai izslēdz tieši šo funkciju.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc jūs varat sākt no <code>q<\/code> vai <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Tad jūs pievienojat tieši tās funkcijas, kas jums vajadzīgas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir daži bieži lietoti adverbi:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — ievieto virknē skalāro mainīgo (<code>$x<\/code>) vērtības<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — izpilda kodu <code>{ … }<\/code> un ievieto rezultātu virknē<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — apstrādā atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pievienojiet <code>q<\/code> vienu adverbu.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>q<\/code> iegūst vienu funkciju.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, ļaujiet tam izpildīt kodu, bet neko citu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — parasts q atstāj bloku neskartu\nsay q:c/result: {3 * 4}/; # result: 12        — :c izpilda bloku<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Ar parastu <code>q<\/code> Raku izdrukā <code>{ 3 * 4 }<\/code> tādu, kāds tas ir.<\/span> <span class=\"sg\" data-s=\"1\">Tikai <code>:c<\/code> izpilda bloku.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku ievieto rezultātu virknē.<\/span> <span class=\"sg\" data-s=\"3\"><code>$mainīgais<\/code> joprojām paliek tāds, kāds tas ir.<\/span> <span class=\"sg\" data-s=\"4\">Apskatiet šeit norobežotājus: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Norobežotāji ir rakstzīmes ap tekstu.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat izmantot arī <code>{…}<\/code> kā norobežotājus.<\/span> <span class=\"sg\" data-s=\"7\">Kļūdas nav, jo kompilators pareizi saskaita figūriekavas.<\/span> <span class=\"sg\" data-s=\"8\">Bet tad iekšējais <code>{ 3 * 4 }<\/code> ir tikai daļa no teksta.<\/span> <span class=\"sg\" data-s=\"9\">Tas nav kods.<\/span> <span class=\"sg\" data-s=\"10\">Tāpēc <code>:c<\/code> to neizpilda, un tas paliek tāds, kāds ir.<\/span> <span class=\"sg\" data-s=\"11\">Vai tekstā ir <code>{ … }<\/code> bloks?<\/span> <span class=\"sg\" data-s=\"12\">Tad neizmantojiet <code>{…}<\/code> kā norobežotājus.<\/span> <span class=\"sg\" data-s=\"13\">Izmantojiet citus norobežotājus.<\/span> <span class=\"sg\" data-s=\"14\">Tad kods figūriekavās izpildās.<\/span> <span class=\"sg\" data-s=\"15\">Jūs varat arī pievienot skalāro interpolēšanu formai <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"16\">Bez tās <code>Q<\/code> atstāj visu tekstu tādu, kāds tas ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverbi var arī <strong>izslēgt<\/strong> funkcijas.<\/span> <span class=\"sg\" data-s=\"1\">Tam uzrakstiet <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šeit mēs izmantojam <code>qq<\/code>, bet <code>$<\/code> paliek parasta rakstzīme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ir tas pats, kas <code>Q<\/code> ar visiem ieslēgtiem interpolēšanas adverbiem.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> ir tas pats, kas <code>Q<\/code> ar mazāk ieslēgtiem adverbiem.<\/span> <span class=\"sg\" data-s=\"2\">Ar adverbiem jūs varat izvēlēties katru funkciju starp šiem diviem galiem.<\/span><\/p>"]]},"ru":{"t":"Наречия кавычек","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Работу конструкции цитирования можно изменить.<\/span> <span class=\"sg\" data-s=\"1\">Для этого есть <em>наречия<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">У конструкции цитирования есть несколько возможностей.<\/span> <span class=\"sg\" data-s=\"3\">Например, она может интерполировать скаляры.<\/span> <span class=\"sg\" data-s=\"4\">Она может выполнять код в фигурных скобках.<\/span> <span class=\"sg\" data-s=\"5\">Она может обрабатывать обратные слэши.<\/span> <span class=\"sg\" data-s=\"6\">У каждой возможности есть своё наречие.<\/span> <span class=\"sg\" data-s=\"7\">Наречие включает или выключает эту одну возможность.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому можно начать с <code>q<\/code> или <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Потом вы добавляете обратно ровно те возможности, которые вам нужны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот несколько частых наречий:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — вставить значения скалярных переменных (<code>$x<\/code>) в строку<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — выполнить код в <code>{ … }<\/code> и вставить результат в строку<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обработать управляющие последовательности с обратным слэшем, например <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Добавьте одно наречие к <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда у <code>q<\/code> появляется одна возможность.<\/span> <span class=\"sg\" data-s=\"2\">Например, пусть он выполняет код, но больше ничего:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">С простым <code>q<\/code> Raku печатает <code>{ 3 * 4 }<\/code> как есть.<\/span> <span class=\"sg\" data-s=\"1\">Только <code>:c<\/code> выполняет блок.<\/span> <span class=\"sg\" data-s=\"2\">Тогда Raku вставляет результат в строку.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$переменная<\/code> всё равно остаётся как есть.<\/span> <span class=\"sg\" data-s=\"4\">Посмотрите на разделители здесь: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Разделители — это символы вокруг текста.<\/span> <span class=\"sg\" data-s=\"6\">В качестве разделителей можно использовать и <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ошибки не будет, потому что компилятор правильно считает скобки.<\/span> <span class=\"sg\" data-s=\"8\">Но тогда внутренний <code>{ 3 * 4 }<\/code> — просто часть текста.<\/span> <span class=\"sg\" data-s=\"9\">Это не код.<\/span> <span class=\"sg\" data-s=\"10\">Поэтому <code>:c<\/code> его не выполняет, и он остаётся как есть.<\/span> <span class=\"sg\" data-s=\"11\">В тексте есть блок <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Тогда не используйте <code>{…}<\/code> как разделители.<\/span> <span class=\"sg\" data-s=\"13\">Используйте другие разделители.<\/span> <span class=\"sg\" data-s=\"14\">Тогда код в фигурных скобках выполнится.<\/span> <span class=\"sg\" data-s=\"15\">Ещё к <code>Q<\/code> можно добавить интерполяцию скаляров.<\/span> <span class=\"sg\" data-s=\"16\">Без неё <code>Q<\/code> оставляет весь текст как есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наречия могут и <strong>выключать<\/strong> возможности.<\/span> <span class=\"sg\" data-s=\"1\">Для этого напишите <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Здесь мы используем <code>qq<\/code>, но <code>$<\/code> остаётся обычным символом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> — то же самое, что <code>Q<\/code> со всеми включёнными наречиями интерполяции.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> — то же самое, что <code>Q<\/code> с меньшим числом включённых наречий.<\/span> <span class=\"sg\" data-s=\"2\">С наречиями вы сами выбираете каждую возможность между этими двумя концами.<\/span><\/p>"]]},"uk":{"t":"Наріччя цитування","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Ви можете змінити роботу конструкції цитування.<\/span> <span class=\"sg\" data-s=\"1\">Для цього ви використовуєте <em>наріччя<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкція цитування має кілька можливостей.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, вона може інтерполювати скаляри.<\/span> <span class=\"sg\" data-s=\"4\">Вона може виконувати код у фігурних дужках.<\/span> <span class=\"sg\" data-s=\"5\">Вона може обробляти зворотні косі риски.<\/span> <span class=\"sg\" data-s=\"6\">Кожна можливість має своє наріччя.<\/span> <span class=\"sg\" data-s=\"7\">Наріччя вмикає або вимикає цю одну можливість.<\/span> <span class=\"sg\" data-s=\"8\">Тож можна почати з <code>q<\/code> або <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Потім ви додаєте саме ті можливості, які вам потрібні.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось кілька поширених наріч:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — вставити значення скалярних змінних (<code>$x<\/code>) у рядок<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — виконати код у <code>{ … }<\/code> і вставити результат у рядок<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обробити екрановані послідовності, як-от <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Додайте до <code>q<\/code> одне наріччя.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>q<\/code> отримує одну можливість.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, нехай він виконує код, але більше нічого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — звичайний q залишає блок недоторканим\nsay q:c/result: {3 * 4}/; # result: 12        — :c виконує блок<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Зі звичайним <code>q<\/code> Raku виводить <code>{ 3 * 4 }<\/code> без змін.<\/span> <span class=\"sg\" data-s=\"1\">Тільки <code>:c<\/code> виконує блок.<\/span> <span class=\"sg\" data-s=\"2\">Тоді Raku вставляє результат у рядок.<\/span> <span class=\"sg\" data-s=\"3\"><code>$змінна<\/code> все одно лишається без змін.<\/span> <span class=\"sg\" data-s=\"4\">Подивіться на роздільники тут: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Роздільники — це символи навколо тексту.<\/span> <span class=\"sg\" data-s=\"6\">Як роздільники можна взяти й <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Помилки немає, бо компілятор правильно рахує фігурні дужки.<\/span> <span class=\"sg\" data-s=\"8\">Але тоді внутрішнє <code>{ 3 * 4 }<\/code> — просто частина тексту.<\/span> <span class=\"sg\" data-s=\"9\">Це не код.<\/span> <span class=\"sg\" data-s=\"10\">Тож <code>:c<\/code> його не виконує, і воно лишається без змін.<\/span> <span class=\"sg\" data-s=\"11\">Текст має блок <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Тоді не беріть <code>{…}<\/code> як роздільники.<\/span> <span class=\"sg\" data-s=\"13\">Беріть інші роздільники.<\/span> <span class=\"sg\" data-s=\"14\">Тоді код у фігурних дужках виконується.<\/span> <span class=\"sg\" data-s=\"15\">До <code>Q<\/code> теж можна додати інтерполяцію скалярів.<\/span> <span class=\"sg\" data-s=\"16\">Без неї <code>Q<\/code> лишає весь текст як є:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наріччя можуть також <strong>вимикати<\/strong> можливості.<\/span> <span class=\"sg\" data-s=\"1\">Для цього напишіть <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тут ми використовуємо <code>qq<\/code>, але <code>$<\/code> лишається звичайним символом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> — це те саме, що <code>Q<\/code> з усіма увімкненими наріччями інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> — це те саме, що <code>Q<\/code> з меншою кількістю наріч.<\/span> <span class=\"sg\" data-s=\"2\">З наріччями ви можете вибрати кожну можливість між цими двома кінцями.<\/span><\/p>"]]},"bg":{"t":"Наречия за цитиране","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Можете да промените как работи една конструкция за цитиране.<\/span> <span class=\"sg\" data-s=\"1\">За целта използвате <em>наречия<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкцията за цитиране има няколко функции.<\/span> <span class=\"sg\" data-s=\"3\">Например тя може да интерполира скалари.<\/span> <span class=\"sg\" data-s=\"4\">Може да изпълнява код във фигурни скоби.<\/span> <span class=\"sg\" data-s=\"5\">Може да обработва обратни наклонени черти.<\/span> <span class=\"sg\" data-s=\"6\">Всяка функция има свое наречие.<\/span> <span class=\"sg\" data-s=\"7\">Наречието включва или изключва тази една функция.<\/span> <span class=\"sg\" data-s=\"8\">Така можете да започнете от <code>q<\/code> или <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">После добавяте обратно точно функциите, които ви трябват.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето някои често срещани наречия:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — слага стойностите на скаларните променливи (<code>$x<\/code>) в низа<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — изпълнява кода в <code>{ … }<\/code> и слага резултата в низа<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обработва екраниращите последователности с обратна наклонена черта, като <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Добавете едно наречие към <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава <code>q<\/code> получава една функция.<\/span> <span class=\"sg\" data-s=\"2\">Например нека изпълнява код, но нищо друго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — обикновено q оставя блока непроменен\nsay q:c/result: {3 * 4}/; # result: 12        — :c изпълнява блока<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">С обикновено <code>q<\/code> Raku отпечатва <code>{ 3 * 4 }<\/code> без промяна.<\/span> <span class=\"sg\" data-s=\"1\">Само <code>:c<\/code> изпълнява блока.<\/span> <span class=\"sg\" data-s=\"2\">Тогава Raku слага резултата в низа.<\/span> <span class=\"sg\" data-s=\"3\"><code>$variable<\/code> пак остава без промяна.<\/span> <span class=\"sg\" data-s=\"4\">Вижте разделителите тук: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Разделителите са символите около текста.<\/span> <span class=\"sg\" data-s=\"6\">Можете да използвате и <code>{…}<\/code> като разделители.<\/span> <span class=\"sg\" data-s=\"7\">Няма грешка, защото компилаторът брои скобите правилно.<\/span> <span class=\"sg\" data-s=\"8\">Но тогава вътрешният <code>{ 3 * 4 }<\/code> е просто част от текста.<\/span> <span class=\"sg\" data-s=\"9\">Той не е код.<\/span> <span class=\"sg\" data-s=\"10\">Затова <code>:c<\/code> не го изпълнява и той остава без промяна.<\/span> <span class=\"sg\" data-s=\"11\">Има ли текстът блок <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Тогава не използвайте <code>{…}<\/code> като разделители.<\/span> <span class=\"sg\" data-s=\"13\">Използвайте други разделители.<\/span> <span class=\"sg\" data-s=\"14\">Тогава кодът във фигурните скоби се изпълнява.<\/span> <span class=\"sg\" data-s=\"15\">Можете също да добавите интерполиране на скалари към <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"16\">Без него <code>Q<\/code> пази целия текст без промяна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Наречията могат и да <strong>изключват<\/strong> функции.<\/span> <span class=\"sg\" data-s=\"1\">За целта напишете <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тук използваме <code>qq<\/code>, но <code>$<\/code> остава обикновен символ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> е същото като <code>Q<\/code> с включени всички наречия за интерполация.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> е същото като <code>Q<\/code> с по-малко включени наречия.<\/span> <span class=\"sg\" data-s=\"2\">С наречията можете да изберете всяка функция между тези два края.<\/span><\/p>"]]},"eo":{"t":"Citaj adverboj","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Vi povas ŝanĝi, kiel cita konstruaĵo funkcias.<\/span> <span class=\"sg\" data-s=\"1\">Por tio vi uzas <em>adverbojn<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Cita konstruaĵo havas plurajn funkciojn.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, ĝi povas interpoli skalarojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi povas ruli kodon en krampoj.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi povas prilabori maldekstrajn streketojn.<\/span> <span class=\"sg\" data-s=\"6\">Ĉiu funkcio havas sian propran adverbon.<\/span> <span class=\"sg\" data-s=\"7\">La adverbo ŝaltas aŭ malŝaltas ĉi tiun unu funkcion.<\/span> <span class=\"sg\" data-s=\"8\">Do vi povas komenci de <code>q<\/code> aŭ <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Poste vi aldonas reen ĝuste la funkciojn, kiujn vi bezonas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj oftaj adverboj:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — meti la valorojn de skalaraj variabloj (<code>$x<\/code>) en la ĉenon<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — ruli la kodon en <code>{ … }<\/code> kaj meti la rezulton en la ĉenon<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — trakti maldekstre-streketajn eskapojn, kiel <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aldonu unu adverbon al <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>q<\/code> ricevas unu funkcion.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, lasu ĝin ruli kodon, sed nenion alian:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — simpla q lasas la blokon netuŝita\nsay q:c/result: {3 * 4}/; # result: 12        — :c ruligas la blokon<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Kun simpla <code>q<\/code>, Raku presas <code>{ 3 * 4 }<\/code> sen ŝanĝo.<\/span> <span class=\"sg\" data-s=\"1\">Nur <code>:c<\/code> rulas la blokon.<\/span> <span class=\"sg\" data-s=\"2\">Tiam Raku metas la rezulton en la ĉenon.<\/span> <span class=\"sg\" data-s=\"3\"><code>$variablo<\/code> tamen restas sen ŝanĝo.<\/span> <span class=\"sg\" data-s=\"4\">Rigardu la limigilojn ĉi tie: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Limigiloj estas la signoj ĉirkaŭ la teksto.<\/span> <span class=\"sg\" data-s=\"6\">Vi ankaŭ povas uzi <code>{…}<\/code> kiel limigilojn.<\/span> <span class=\"sg\" data-s=\"7\">Ne estas eraro, ĉar la kompililo ĝuste nombras la krampojn.<\/span> <span class=\"sg\" data-s=\"8\">Sed tiam la interna <code>{ 3 * 4 }<\/code> estas nur parto de la teksto.<\/span> <span class=\"sg\" data-s=\"9\">Ĝi ne estas kodo.<\/span> <span class=\"sg\" data-s=\"10\">Do <code>:c<\/code> ne rulas ĝin, kaj ĝi restas sen ŝanĝo.<\/span> <span class=\"sg\" data-s=\"11\">Ĉu la teksto havas <code>{ … }<\/code>-blokon?<\/span> <span class=\"sg\" data-s=\"12\">Tiam ne uzu <code>{…}<\/code> kiel limigilojn.<\/span> <span class=\"sg\" data-s=\"13\">Uzu aliajn limigilojn.<\/span> <span class=\"sg\" data-s=\"14\">Tiam la kodo en la krampoj ruliĝas.<\/span> <span class=\"sg\" data-s=\"15\">Vi ankaŭ povas aldoni skalaran interpoladon al <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"16\">Sen ĝi, <code>Q<\/code> tenas la tutan tekston sen ŝanĝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverboj ankaŭ povas <strong>malŝalti<\/strong> funkciojn.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, skribu <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie ni uzas <code>qq<\/code>, sed <code>$<\/code> restas normala signo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> estas la sama kiel <code>Q<\/code> kun ĉiuj interpolaj adverboj ŝaltitaj.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> estas la sama kiel <code>Q<\/code> kun malpli da adverboj ŝaltitaj.<\/span> <span class=\"sg\" data-s=\"2\">Per la adverboj, vi povas elekti ĉiun funkcion inter ĉi tiuj du finoj.<\/span><\/p>"]]},"la":{"t":"Adverbia quotationis","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Modum constructionis citandi mutare potes.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <em>adverbia<\/em> adhibes.<\/span> <span class=\"sg\" data-s=\"2\">Constructio citandi plures proprietates habet.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, scalares interpolare potest.<\/span> <span class=\"sg\" data-s=\"4\">Codicem in uncis exsequi potest.<\/span> <span class=\"sg\" data-s=\"5\">Obliquos reversos tractare potest.<\/span> <span class=\"sg\" data-s=\"6\">Quaeque proprietas suum adverbium habet.<\/span> <span class=\"sg\" data-s=\"7\">Adverbium hanc unam proprietatem accendit vel exstinguit.<\/span> <span class=\"sg\" data-s=\"8\">Itaque a <code>q<\/code> vel <code>Q<\/code> incipere potes.<\/span> <span class=\"sg\" data-s=\"9\">Deinde exacte proprietates quas requiris rursus addis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce aliqua adverbia communia:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — valores variabilium scalarium (<code>$x<\/code>) in seriem pone<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — codicem in <code>{ … }<\/code> exsequere et eventum in seriem pone<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — effugia per obliquum reversum tracta, ut <code>\\n<\/code><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adde unum adverbium ad <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>q<\/code> unam proprietatem accipit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, permitte ei codicem exsequi, sed nihil aliud:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",17,"<p><span class=\"sg\" data-s=\"0\">Cum simplici <code>q<\/code> Raku <code>{ 3 * 4 }<\/code> ut est imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Solum <code>:c<\/code> claustrum exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Tum Raku eventum in seriem ponit.<\/span> <span class=\"sg\" data-s=\"3\"><code>$variable<\/code> tamen ut est manet.<\/span> <span class=\"sg\" data-s=\"4\">Specta delimitatores hic: <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Delimitatores sunt characteres circa textum.<\/span> <span class=\"sg\" data-s=\"6\">Etiam <code>{…}<\/code> ut delimitatores adhibere potes.<\/span> <span class=\"sg\" data-s=\"7\">Nullus error est, quia compilator uncos recte numerat.<\/span> <span class=\"sg\" data-s=\"8\">Sed tum interior <code>{ 3 * 4 }<\/code> solum pars textus est.<\/span> <span class=\"sg\" data-s=\"9\">Codex non est.<\/span> <span class=\"sg\" data-s=\"10\">Itaque <code>:c<\/code> eum non exsequitur, et ut est manet.<\/span> <span class=\"sg\" data-s=\"11\">Habetne textus claustrum <code>{ … }<\/code>?<\/span> <span class=\"sg\" data-s=\"12\">Tum <code>{…}<\/code> ut delimitatores noli adhibere.<\/span> <span class=\"sg\" data-s=\"13\">Alios delimitatores adhibe.<\/span> <span class=\"sg\" data-s=\"14\">Tum codex in uncis currit.<\/span> <span class=\"sg\" data-s=\"15\">Etiam interpolationem scalarem ad <code>Q<\/code> addere potes.<\/span> <span class=\"sg\" data-s=\"16\">Sine ea <code>Q<\/code> totum textum ut est servat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverbia etiam proprietates <strong>exstinguere<\/strong> possunt.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <code>!<\/code> scribe.<\/span> <span class=\"sg\" data-s=\"2\">Hic <code>qq<\/code> adhibemus, sed <code>$<\/code> character normalis manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> idem est ac <code>Q<\/code> cum omnibus adverbiis interpolationis accensis.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> idem est ac <code>Q<\/code> cum paucioribus adverbiis accensis.<\/span> <span class=\"sg\" data-s=\"2\">Cum adverbiis quamque proprietatem inter hos duos fines eligere potes.<\/span><\/p>"]]}}}</script>
