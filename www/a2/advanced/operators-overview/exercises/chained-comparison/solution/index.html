r way.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Verketteter Vergleich","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sie können Vergleichsoperatoren verketten. Also bedeutet <code>0 &lt;= 73 &lt;= 100<\/code>: „0 ist höchstens 73, und 73 ist höchstens 100“. Der Operator <code>&lt;=<\/code> erlaubt auch die Enden. Also ist auch ein Ergebnis von genau <code>0<\/code> oder <code>100<\/code> gültig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Teile sind wahr. Also ist der ganze Ausdruck <code>True<\/code>. Sehen Sie sich den mittleren Wert an, <code>73<\/code>. Sie schreiben ihn nur einmal. Aber Raku vergleicht ihn mit beiden Werten neben ihm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ohne Verkettung müssen Sie beide Vergleiche schreiben. Sie verbinden sie mit <code>&amp;&amp;<\/code>. Und Sie schreiben den mittleren Wert zweimal: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Die verkettete Form sagt dasselbe kürzer.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gekoppelde vergelijking","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de opgave op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Je kunt vergelijkingsoperatoren schakelen. <code>0 &lt;= 73 &lt;= 100<\/code> betekent dus \"0 is hoogstens 73, en 73 is hoogstens 100\". De operator <code>&lt;=<\/code> staat ook de uiteinden toe. Een score van precies <code>0<\/code> of <code>100<\/code> is dus ook geldig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide delen zijn waar. De hele expressie is dus <code>True<\/code>. Kijk naar de middelste waarde, <code>73<\/code>. Je schrijft die maar één keer. Maar Raku vergelijkt hem met de twee waarden ernaast.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Zonder schakelen moet je beide vergelijkingen schrijven. Je verbindt ze met <code>&amp;&amp;<\/code>. En je schrijft de middelste waarde twee keer: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. De geschakelde vorm zegt hetzelfde op een kortere manier.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Comparación encadenada","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" s.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abas daļas ir patiesas. Tāpēc visa izteiksme ir <code>True<\/code>. Paskatieties uz vidējo vērtību, <code>73<\/code>. Jūs to rakstāt tikai vienu reizi. Bet Raku to salīdzina ar abām blakus vērtībām.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bez ķēdēšanas jums jāraksta abas salīdzināšanas. Jūs tās savienojat ar <code>&amp;&amp;<\/code>. Un vidējo vērtību jūs rakstāt divas reizes: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Ķēdētā forma saka to pašu īsāk.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Цепочечное сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторы сравнения можно соединять в цепочку. Поэтому <code>0 &lt;= 73 &lt;= 100<\/code> значит «0 не больше 73, а 73 не больше 100». Оператор <code>&lt;=<\/code> разрешает и границы. Поэтому результат ровно <code>0<\/code> или <code>100<\/code> тоже допустимый.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обе части истинны. Поэтому всё выражение равно <code>True<\/code>. Посмотрите на среднее значение, <code>73<\/code>. Вы пишете его только один раз. Но Raku сравнивает его с обоими соседними значениями.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без цепочки нужно писать оба сравнения. Вы соединяете их с помощью <code>&amp;&amp;<\/code>. И вы пишете среднее значение два раза: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Форма с цепочкой говорит то же самое короче.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ланцюжок порівнянь","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в ланцюжки. Тож <code>0 &lt;= 73 &lt;= 100<\/code> означає «0 не більше за 73, і 73 не більше за 100». Оператор <code>&lt;=<\/code> дозволяє й краї. Тож бал рівно <code>0<\/code> або <code>100<\/code> теж дійсний.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидві частини істинні. Тож увесь вираз дає <code>True<\/code>. Подивіться на середнє значення, <code>73<\/code>. Ви пишете його лише раз. Але Raku порівнює його з обома значеннями поруч.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без ланцюжка треба написати обидва порівняння. Ви з'єднуєте їх через <code>&amp;&amp;<\/code>. І ви пишете середнє значення двічі: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Форма з ланцюжком каже те саме коротше.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Верижно сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Можете да свързвате операторите за сравнение във верига. Така <code>0 &lt;= 73 &lt;= 100<\/code> означава „0 е най-много 73, и 73 е най-много 100“. Операторът <code>&lt;=<\/code> позволява и краищата. Така резултат от точно <code>0<\/code> или <code>100<\/code> също е валиден.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двете части са верни. Така целият израз е <code>True<\/code>. Вижте средната стойност, <code>73<\/code>. Пишете я само веднъж. Но Raku я сравнява с двете стойности до нея.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без верига трябва да напишете двете сравнения. Свързвате ги с <code>&amp;&amp;<\/code>. И пишете средната стойност два пъти: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Верижната форма казва същото по по-кратък начин.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ĉenita komparo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi povas ĉeni komparajn operatorojn. Do <code>0 &lt;= 73 &lt;= 100<\/code> signifas «0 estas maksimume 73, kaj 73 estas maksimume 100». La operatoro <code>&lt;=<\/code> permesas ankaŭ la finojn. Do poentaro de ĝuste <code>0<\/code> aŭ <code>100<\/code> ankaŭ estas valida.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambaŭ partoj estas veraj. Do la tuta esprimo estas <code>True<\/code>. Rigardu la mezan valoron, <code>73<\/code>. Vi skribas ĝin nur unufoje. Sed Raku komparas ĝin kun ambaŭ valoroj apud ĝi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sen ĉenado, vi devas skribi ambaŭ komparojn. Vi kunigas ilin per <code>&amp;&amp;<\/code>. Kaj vi skribas la mezan valoron dufoje: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La ĉenita formo diras la samon pli mallonge.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Comparatio catenata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo munus solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Operatores comparationis catenare potes. Ergo <code>0 &lt;= 73 &lt;= 100<\/code> significat “0 est ad summum 73, et 73 est ad summum 100”. Operator <code>&lt;=<\/code> etiam fines permittit. Ergo punctum exacte <code>0<\/code> vel <code>100<\/code> quoque validum est.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambae partes verae sunt. Ergo tota expressio <code>True<\/code> est. Specta valorem medium, <code>73<\/code>. Eum semel tantum scribis. Sed Raku eum cum ambobus valoribus vicinis comparat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sine catenatione ambas comparationes scribere debes. Eas cum <code>&amp;&amp;<\/code> coniungis. Et valorem medium bis scribis: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Forma catenata idem brevius dicit.<\/span><\/li><\/ol>"]]}}}</script>
