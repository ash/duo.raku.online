тор бере свої операнди першим.<\/span> <span class=\"sg\" data-s=\"2\">Множення має вищий пріоритет, ніж додавання.<\/span> <span class=\"sg\" data-s=\"3\">Тож множення відбувається першим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku читає вираз як <code>2 + (3 * 4)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат — <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви завжди можете додати дужки.<\/span> <span class=\"sg\" data-s=\"3\">Вони дають інший порядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Асоціативність<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Деякі оператори мають <em>однаковий<\/em> пріоритет.<\/span> <span class=\"sg\" data-s=\"1\">Тоді порядок вирішує асоціативність.<\/span> <span class=\"sg\" data-s=\"2\">Віднімання лівоасоціативне.<\/span> <span class=\"sg\" data-s=\"3\">Тож Raku групує його зліва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це <code>(8 - 3) - 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат — <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але піднесення до степеня, оператор <code>**<\/code>, правоасоціативне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут Raku групує вираз як <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це <code>2 ** 9<\/code>, і результат — <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ланцюжки порівнянь<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в <em>ланцюжки<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вони йдуть один за одним.<\/span> idi la ordon.<\/span> <span class=\"sg\" data-s=\"2\">Kiu operatoro venas unue?<\/span> <span class=\"sg\" data-s=\"3\">Du reguloj decidas tion: <em>prioritato<\/em> kaj <em>asocieco<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Prioritato<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prioritato decidas, kiu operatoro estas pli forta.<\/span> <span class=\"sg\" data-s=\"1\">La pli forta operatoro prenas siajn operandojn unue.<\/span> <span class=\"sg\" data-s=\"2\">Multipliko havas pli altan prioritaton ol adicio.<\/span> <span class=\"sg\" data-s=\"3\">Do multipliko okazas unue:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku legas la esprimon kiel <code>2 + (3 * 4)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas <code>14<\/code>, ne <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ĉiam povas aldoni krampojn.<\/span> <span class=\"sg\" data-s=\"3\">Ili donas alian ordon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asocieco<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kelkaj operatoroj havas la <em>saman<\/em> prioritaton.<\/span> <span class=\"sg\" data-s=\"1\">Tiam asocieco decidas la ordon.<\/span> <span class=\"sg\" data-s=\"2\">Subtraho estas maldekstre-asocia.<\/span> <span class=\"sg\" data-s=\"3\">Do Raku grupigas ĝin de maldekstre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio estas <code>(8 - 3) - 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed potencigo, la operatoro <code>**<\/code>, estas dekstre-asocia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span cla re>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valorem medium cum ambobus valoribus vicinis comparat.<\/span> <span class=\"sg\" data-s=\"1\"><code>1 &lt; 2 &lt; 3<\/code> verum est.<\/span> <span class=\"sg\" data-s=\"2\">Nam <code>1 &lt; 2<\/code> verum est, et <code>2 &lt; 3<\/code> quoque verum est.<\/span><\/p>"]]}}}</script>
