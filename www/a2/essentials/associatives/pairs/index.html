orem paris etiam alio modo legere potes.<\/span> <span class=\"sg\" data-s=\"1\">Par subscribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Nomen clavis eius in uncis angularibus pone.<\/span> <span class=\"sg\" data-s=\"3\">Ecce quomodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota: clavis sine spatiis quotationes non requirit.<\/span> <span class=\"sg\" data-s=\"1\">Si clavis spatia habet, regulae paulo strictiores sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota: hoc tempore codex uncos curvos adhibet.<\/span><\/p>"]]}}}</script>
