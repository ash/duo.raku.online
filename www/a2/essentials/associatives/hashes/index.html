; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Preni la elementojn<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por preni elementon, vi subskribas la haketon.<\/span> <span class=\"sg\" data-s=\"1\">Vi faras tion same kiel ĉe <a href=\"/essentials/associatives/pairs/\">paroj<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Metu ŝnuron en angulajn krampojn aŭ en kurbajn krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haketoj estas ŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi povas ŝanĝi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas ŝanĝi la valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas aldoni novajn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ŝlosiloj kaj valoroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku havas du enkonstruajn metodojn por haketoj, <code>keys<\/code> kaj <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>keys<\/code> redonas liston de la ŝlosiloj.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>values<\/code> redonas liston de la valoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo povas presi ekzemple ĉi tion:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la elementoj de haketo ne havas ordon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ambaŭ metodoj uzas la saman ordon.<\/span><\/p>"]]},"la":{"t":"Hashes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Hash<\/em> est alius typus datorum associativus in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Est typus datorum aggregatus.<\/span> <span class=\"sg\" data-s=\"2\">Multa elementa continet.<\/span> <span class=\"sg\" data-s=\"3\">Quodque elementum nomen et valorem habet.<\/span> <span class=\"sg\" data-s=\"4\">Variabiles hash novum sigillum adhibent: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc hash uti potes.<\/span> <span class=\"sg\" data-s=\"1\">Ei aliquos valores primos assignare potes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam ambas res simul facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc etiam cum aliis typis datorum operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elementa accipere<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut elementum accipias, hash subscribis.<\/span> <span class=\"sg\" data-s=\"1\">Hoc eodem modo facis ac cum <a href=\"/essentials/associatives/pairs/\">paribus<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Chordam in uncis angularibus vel in uncis curvis pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;Gallia&gt;;\nsay %capitals{'Italia'};<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hashes sunt mutabiles.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: eos mutare potes.<\/span> <span class=\"sg\" data-s=\"2\">Valores mutare potes.<\/span> <span class=\"sg\" data-s=\"3\">Etiam novos addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germania&gt; = 'Berolinum';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Claves et valores<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku duas methodos inbuilt pro hashibus habet, <code>keys<\/code> et <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>keys<\/code> listam clavium reddit.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>values<\/code> listam valorum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma hoc imprimere potest, exempli gratia:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germania Italia Gallia)     (Berolinum Roma Lutetia)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota: elementa hash nullum ordinem habent.<\/span> <span class=\"sg\" data-s=\"1\">Sed ambae methodi eundem ordinem adhibent.<\/span><\/p>"]]}}}</script>
