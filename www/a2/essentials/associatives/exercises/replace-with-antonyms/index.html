pan class=\"sg\" data-s=\"4\">Деяких слів немає в словнику.<\/span> <span class=\"sg\" data-s=\"5\">Не змінюйте ці слова.<\/span> <span class=\"sg\" data-s=\"6\">Виведіть їх без змін.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Зберігайте словник антонімів у хеші.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть хеш прямо в коді.<\/span> <span class=\"sg\" data-s=\"2\">Щоб допомогти вам, ми зробили список приблизно з 200 пар.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете скопіювати його і вставити у свою програму: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Кожна пара є в списку двічі, по одному разу в кожному напрямку.<\/span> <span class=\"sg\" data-s=\"5\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зробіть програму якомога простішою.<\/span> <span class=\"sg\" data-s=\"1\">Виведіть кожне слово в окремому рядку.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму і дайте їй кілька слів.<\/span> <span class=\"sg\" data-s=\"1\">Хоча б деякі слова мають бути в словнику.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Замяна с антоними" de>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Anstataŭigi per antonimoj","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Skribu programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas vortojn el la komanda linio.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ŝanĝas ĉiun vorton en ĝian antonimon.<\/span> <span class=\"sg\" data-s=\"3\">Antonimo estas vorto kun la mala signifo.<\/span> <span class=\"sg\" data-s=\"4\">Kelkaj vortoj ne estas en la vortaro.<\/span> <span class=\"sg\" data-s=\"5\">Ne ŝanĝu ĉi tiujn vortojn.<\/span> <span class=\"sg\" data-s=\"6\">Presu ilin tiel, kiel ili estas.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tenu la vortaron de antonimoj en haketo.<\/span> <span class=\"sg\" data-s=\"1\">Skribu la haketon rekte en la kodo.<\/span> <span class=\"sg\" data-s=\"2\">Por helpi vin, ni faris liston de ĉirkaŭ 200 paroj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas kopii kaj alglui ĝin en vian programon: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu paro estas dufoje en la listo, unufoje en ĉiu direkto.<\/span> <span class=\"sg\" data-s=\"5\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Faru la ar bis in indice est, semel in utraque directione.<\/span> <span class=\"sg\" data-s=\"5\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fac programma quam simplicissimum potes.<\/span> <span class=\"sg\" data-s=\"1\">Quodque verbum in sua linea imprime.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Curre programma et da ei pauca verba.<\/span> <span class=\"sg\" data-s=\"1\">Saltem quaedam verba in dictionario esse debent.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
