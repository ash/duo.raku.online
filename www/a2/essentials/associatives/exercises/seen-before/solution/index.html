ss=\"sg\" data-s=\"4\">Програмата използва тази дума като ключ на хеша.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето решението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %seen;\nloop {\n    my $word = prompt 'Дума: ';\n    if %seen{$word} {\n        say %seen{$word} == 1 ?? 'Виждано!' !! say \"Виждано %seen{$word} пъти!\";\n    }\n    %seen{$word}++;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/seen-before.raku\" target=\"_blank\" rel=\"noopener\">seen-before.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/seen-before.raku\nДума: Аз\nДума: никога\nДума: не\nДума: видях\nДума: трион\nВиждано!\nДума: това\nДума: трион\nВиждано 2 пъти!\nВярно\nДума: като\nДума: това\nВиждано!\nДума: трион\nВиждано 3 пъти!\nВярно\nДума: трионен\nДума: ^C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кодът <code>%seen{$word}++<\/code> добавя 1 към стойността.<\/span> <span class=\"sg\" data-s=\"1\">Ако стойността още не съществува, кодът също я създава.<\/span> <span class=\"sg\" data-s=\"2\">Създаването на стойност по този начин се нарича <em>автовивификация<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Забележете, че това не се случва, когато само <em>четете<\/em> стойността.<\/span> <span class=\"sg\" data-s=\"4\">Например, това не се случва в условието <code>if %seen{$word}<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Vidita antaŭe?","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas klasika tasko por haketo.<\/span> <span class=\"sg\" data-s=\"1\">La haketo memoras, kiuj eroj venis antaŭe.<\/span> <span class=\"sg\" data-s=\"2\">Antaŭ la buklo, la programo kreas la haketon <code>%seen<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">En la buklo, la uzanto enigas vorton, <code>$word<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La programo uzas ĉi tiun vorton kiel ŝlosilon de la haketo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %seen;\nloop {\n    my $word = prompt 'Word: ';\n    if %seen{$word} {\n        say %seen{$word} == 1 ?? 'Seen!' !! say \"Seen %seen{$word} times!\";\n    }\n    %seen{$word}++;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/seen-before.raku\" target=\"_blank\" rel=\"noopener\">seen-before.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/seen-before.raku\nWord: I\nWord: never\nWord: saw\nWord: a\nWord: saw\nSeen!\nWord: that\nWord: saw\nSeen 2 times!\nTrue\nWord: as\nWord: that\nSeen!\nWord: saw\nSeen 3 times!\nTrue\nWord: sawed\nWord: ^C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La kodo <code>%seen{$word}++<\/code> aldonas 1 al la valoro.<\/span> <span class=\"sg\" data-s=\"1\">Se la valoro ankoraŭ ne ekzistas, la kodo ankaŭ kreas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu maniero krei valoron nomiĝas <em>aŭtovivigo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Notu, ke tio ne okazas, kiam vi nur <em>legas<\/em> la valoron.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, ĝi ne okazas en la kondiĉo <code>if %seen{$word}<\/code>.<\/span><\/p>"]]},"la":{"t":"Solutio: Visus prius?","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc est munus classicum pro tabula.<\/span> <span class=\"sg\" data-s=\"1\">Tabula res priores memoria tenet.<\/span> <span class=\"sg\" data-s=\"2\">Ante circulum, programma tabulam <code>%seen<\/code> creat.<\/span> <span class=\"sg\" data-s=\"3\">In circulo, usor verbum inserit, <code>$word<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Programma hoc verbum ut clavem tabulae adhibet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %seen;\nloop {\n    my $word = prompt 'Verbum: ';\n    if %seen{$word} {\n        say %seen{$word} == 1 ?? 'Visum!' !! say \"Visum %seen{$word} vicibus!\";\n    }\n    %seen{$word}++;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/seen-before.raku\" target=\"_blank\" rel=\"noopener\">seen-before.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/seen-before.raku\nVerbum: Ego\nVerbum: numquam\nVerbum: vidi\nVerbum: a\nVerbum: vidi\nVisum!\nVerbum: quod\nVerbum: vidi\nVisum 2 vicibus!\nVerum\nVerbum: ut\nVerbum: quod\nVisum!\nVerbum: vidi\nVisum 3 vicibus!\nVerum\nVerbum: serravit\nVerbum: ^C<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Codex <code>%seen{$word}++<\/code> valori 1 addit.<\/span> <span class=\"sg\" data-s=\"1\">Si valor nondum est, codex eum etiam creat.<\/span> <span class=\"sg\" data-s=\"2\">Talem creationem valoris <em>autovivificationem<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"3\">Nota: si valorem tantum <em>legis<\/em>, hoc non fit.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, hoc non fit in condicione <code>if %seen{$word}<\/code>.<\/span><\/p>"]]}}}
