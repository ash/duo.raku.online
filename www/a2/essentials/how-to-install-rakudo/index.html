"2\">Ще ви можете перевіряти невеликі скрипти в оболонці REPL.<\/span> <span class=\"sg\" data-s=\"3\">Усі інструкції є на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Номер версії Rakudo має дві частини.<\/span> <span class=\"sg\" data-s=\"1\">Це рік і місяць випуску.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви легко бачите, наскільки новий ваш компілятор.<\/span> <span class=\"sg\" data-s=\"3\">Запустіть цю команду, щоб побачити номер його версії:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тут ви бачите три номери версій.<\/span> <span class=\"sg\" data-s=\"1\">Перший — це версія самого Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Далі йде версія мови Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поки що кожне оновлення мови отримує наступну літеру.<\/span> <span class=\"sg\" data-s=\"4\">Ця літера — молодша, або менша, частина версії.<\/span> <span class=\"sg\" data-s=\"5\">Наприклад, далі буде <code>v6.e<\/code>, і так далі.<\/span> <span class=\"sg\" data-s=\"6\">У кінці ви бачите назву віртуальної машини.<\/span> <span class=\"sg\" data-s=\"7\">Цей компілятор використовує MoarVM версії <code>2026.06<\/code>.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Rakudo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Трябва ви компилатор, за да изпълните програма на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Първо трябва да го инсталирате.<\/span> <span class=\"sg\" data-s=\"2\">Този курс използва Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Има също <a href=\"https://course.raku.org/bg/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> и <a href=\"https://course.raku.org/bg/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Тях инсталирате отделно.<\/span> <span class=\"sg\" data-s=\"5\">Прочетете <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Как да инсталирате Raku++<\/a> и <a href=\"https://course.raku.org/bg/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Как да инсталирате mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Отидете на <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">сайта на Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Там можете да изтеглите правилната версия за вашата операционна система.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Източници<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Изтеглете инсталатор за вашата система от <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Има версии за всички основни операционни системи: Windows, Mac OS и Linux.<\/span> <span class=\"sg\" data-s=\"2\">Има и изходен код.<\/span> <span class=\"sg\" data-s=\"3\">Можете сами да го компилирате.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker образи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да вземете Rakudo и като docker образ.<\/span> <span class=\"sg\" data-s=\"1\">С него можете да изпълнявате програми.<\/span> <span class=\"sg\" data-s=\"2\">Можете и да пробвате малки скриптове в обвивката REPL.<\/span> <span class=\"sg\" data-s=\"3\">Всички указания са на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Номерът на версията на Rakudo има две части.<\/span> <span class=\"sg\" data-s=\"1\">Това са годината и месецът на изданието.<\/span> <span class=\"sg\" data-s=\"2\">Така лесно виждате колко нов е вашият компилатор.<\/span> <span class=\"sg\" data-s=\"3\">Изпълнете тази команда, за да видите номера на версията:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тук виждате три номера на версии.<\/span> <span class=\"sg\" data-s=\"1\">Първият е версията на самия Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това идва версията на езика Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Засега всяко обновление на езика получава следващата буква.<\/span> <span class=\"sg\" data-s=\"4\">Тази буква е минорната, тоест малката, част от версията.<\/span> <span class=\"sg\" data-s=\"5\">Например следващата е <code>v6.e<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"6\">Накрая виждате името на виртуалната машина.<\/span> <span class=\"sg\" data-s=\"7\">Този компилатор използва MoarVM версия <code>2026.06<\/code>.<\/span><\/p>"]]},"eo":{"t":"Kiel instali Rakudo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Vi bezonas kompililon por ruli Raku-programon.<\/span> <span class=\"sg\" data-s=\"1\">Vi devas unue instali ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu kurso uzas Rakudo.<\/span> <span class=\"sg\" data-s=\"3\">Ekzistas ankaŭ <a href=\"https://course.raku.org/eo/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Vi instalas ilin aparte.<\/span> <span class=\"sg\" data-s=\"5\">Legu <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Kiel instali Raku++<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Kiel instali mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Iru al <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">la retejo de Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Tie vi povas elŝuti la ĝustan version por via mastruma sistemo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Elŝutu instalilon por via sistemo ĉe <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Estas versioj por ĉiuj ĉefaj mastrumaj sistemoj: Windows, Mac OS kaj Linux.<\/span> <span class=\"sg\" data-s=\"2\">Estas ankaŭ la fontkodo.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas mem kompili ĝin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-bildoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas ricevi Rakudo kiel docker-bildon.<\/span> <span class=\"sg\" data-s=\"1\">Per ĝi vi povas ruli programojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas provi malgrandajn skriptojn en ŝelo REPL.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiuj instrukcioj estas ĉe <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versinumeroj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Versinumero de Rakudo havas du partojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas la jaro kaj la monato de la eldono.<\/span> <span class=\"sg\" data-s=\"2\">Do vi facile vidas, kiom nova estas via kompililo.<\/span> <span class=\"sg\" data-s=\"3\">Rulu ĉi tiun komandon por vidi ĝian versinumeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie vi vidas tri versinumerojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la versio de Rakudo mem: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste venas la versio de la lingvo Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nuntempe ĉiu ĝisdatigo de la lingvo ricevas la sekvan literon.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu litero estas la malĉefa, aŭ malgranda, parto de la versio.<\/span> <span class=\"sg\" data-s=\"5\">Ekzemple, la sekva estas <code>v6.e<\/code>, kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"6\">Fine vi vidas la nomon de la virtuala maŝino.<\/span> <span class=\"sg\" data-s=\"7\">Ĉi tiu kompililo uzas MoarVM version <code>2026.06<\/code>.<\/span><\/p>"]]},"la":{"t":"Quomodo Rakudo installare","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Compilatorem habere debes ad programma Raku currendum.<\/span> <span class=\"sg\" data-s=\"1\">Eum primum installare debes.<\/span> <span class=\"sg\" data-s=\"2\">Hic cursus Rakudo adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Sunt etiam <a href=\"https://course.raku.org/la/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> et <a href=\"https://course.raku.org/la/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Eos seorsum installas.<\/span> <span class=\"sg\" data-s=\"5\">Lege <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Quomodo Raku++ installare<\/a> et <a href=\"https://course.raku.org/la/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Quomodo mutsu installare<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Adi <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">sedem interretialem Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Ibi rectam versionem pro systemate tuo deprimere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontes<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma installationis pro systemate tuo apud <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a> deprime.<\/span> <span class=\"sg\" data-s=\"1\">Sunt versiones pro omnibus systematibus praecipuis: Windows, Mac OS et Linux.<\/span> <span class=\"sg\" data-s=\"2\">Est etiam codex fontalis.<\/span> <span class=\"sg\" data-s=\"3\">Eum ipse compilare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imagines Docker<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo etiam ut imaginem docker accipere potes.<\/span> <span class=\"sg\" data-s=\"1\">Cum ea programmata currere potes.<\/span> <span class=\"sg\" data-s=\"2\">Potes etiam brevia scripta in cortice REPL probare.<\/span> <span class=\"sg\" data-s=\"3\">Omnia praecepta sunt apud <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Numerus versionis Rakudo duas partes habet.<\/span> <span class=\"sg\" data-s=\"1\">Sunt annus et mensis emissionis.<\/span> <span class=\"sg\" data-s=\"2\">Itaque facile vides quam novus compilator tuus sit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc imperatum exsequere et numerum versionis vide:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Hic tres numeros versionum vides.<\/span> <span class=\"sg\" data-s=\"1\">Primus est versio ipsius Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deinde est versio linguae Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nunc quaeque renovatio linguae litteram sequentem accipit.<\/span> <span class=\"sg\" data-s=\"4\">Haec littera est pars minor, vel parva, versionis.<\/span> <span class=\"sg\" data-s=\"5\">Exempli gratia, <code>v6.e<\/code> deinde venit, et cetera.<\/span> <span class=\"sg\" data-s=\"6\">In fine nomen machinae virtualis vides.<\/span> <span class=\"sg\" data-s=\"7\">Hic compilator MoarVM, versionem <code>2026.06<\/code>, adhibet.<\/span><\/p>"]]}}}</script>
