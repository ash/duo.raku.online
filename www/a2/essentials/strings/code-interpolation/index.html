ation","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Code-Interpolation ist das nächste Level der Interpolation.<\/span> <span class=\"sg\" data-s=\"1\">Sie können Code direkt in einen String in doppelten Anführungszeichen schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Der Code kann einfach sein.<\/span> <span class=\"sg\" data-s=\"3\">Er kann auch komplex sein!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie den Code zwischen geschweifte Klammern, <code>{<\/code> und <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nochmals Variablen<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine Anwendung dieser Methode.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal steht direkt nach einer Variablen ein Text.<\/span> <span class=\"sg\" data-s=\"2\">Raku kann diesen Text aus Versehen als Teil des Namens lesen.<\/span> <span class=\"sg\" data-s=\"3\">Um das zu verhindern, setzen Sie die Variable in geschweifte Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne geschweifte Klammern versucht Raku, eine Variable <code>$whats<\/code> zu interpolieren.<\/span> <span class=\"sg\" data-s=\"1\">Aber diese Variable gibt es nicht.<\/span><\/p>"]]},"nl":{"t":"Code interpolatie","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Code interpolatie is het volgende niveau van interpolatie.<\/span> <span class=\"sg\" data-s=\"1\">U kunt code direct in een string met dubbele aanhalingstekens zetten.<\/span> <span class=\"sg\" data-s=\"2\">De code kan eenvoudig zijn.<\/span> <span class=\"sg\" data-s=\"3\">Hij kan ook complex zijn!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schrijf de code tussen accolades, <code>{<\/code> en <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"De som van $a en $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nDe som van 10 en 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opnieuw variabelen<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is één manier om deze methode te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Soms staat er tekst direct na een variabele.<\/span> <span class=\"sg\" data-s=\"2\">Raku kan deze tekst dan per ongeluk als deel van de naam lezen.<\/span> <span class=\"sg\" data-s=\"3\">Om dat te voorkomen, zet u de variabele tussen accolades:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hoeveel = 5;\nmy $wat = 'pak';\nsay \"Er zijn $hoeveel {$wat}ken.\"; # Er zijn 5 pakken.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder accolades probeert Raku een variabele <code>$watken<\/code> te interpoleren.<\/span> <span class=\"sg\" data-s=\"1\">Maar zo'n variabele bestaat niet.<\/span><\/p>"]]},"es":{"t":"Interpolación de código","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La interpolación de código es el siguiente nivel de interpolación.<\/span> <span class=\"sg\" data-s=\"1\">Puedes poner código directamente dentro de una cadena entre comillas dobles.<\/span> <span class=\"sg\" data-s=\"2\">El código puede ser simple.<\/span> <span class=\"sg\" data-s=\"3\">¡También puede ser complejo!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Escribe el código entre llaves, <code>{<\/code> y <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La suma de $a y $b es {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa suma de 10 y 20 es 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variables de nuevo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un uso de este método.<\/span> <span class=\"sg\" data-s=\"1\">A veces una variable tiene un texto justo después.<\/span> <span class=\"sg\" data-s=\"2\">Por error, Raku puede leer este texto como parte del nombre.<\/span> <span class=\"sg\" data-s=\"3\">Para evitarlo, pon la variable entre llaves:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'traje';\nsay \"Hay $how-many {$what}s.\"; # Hay 5 trajes.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin llaves, Raku intenta interpolar una variable <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero esa variable no existe.<\/span><\/p>"]]},"it":{"t":"Interpolazione del codice","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">L'interpolazione di codice è il livello successivo di interpolazione.<\/span> <span class=\"sg\" data-s=\"1\">Puoi mettere del codice proprio dentro una stringa tra doppi apici.<\/span> <span class=\"sg\" data-s=\"2\">Il codice può essere semplice.<\/span> <span class=\"sg\" data-s=\"3\">Può essere anche complesso!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scrivi il codice tra parentesi graffe, <code>{<\/code> e <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La somma di $a e $b è {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa somma di 10 e 20 è 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ancora variabili<\/span><\/h3>"],["p",4,"<p> ],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Tur ir $how-many {$what}s.\"; # Tur ir 5 uzvalki.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez cirtainajām iekavām Raku mēģina interpolēt mainīgo <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet tāda mainīgā nav.<\/span><\/p>"]]},"ru":{"t":"Интерполяция кода","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Интерполяция кода — это следующий уровень интерполяции.<\/span> <span class=\"sg\" data-s=\"1\">Можно вставить код прямо в строку в двойных кавычках.<\/span> <span class=\"sg\" data-s=\"2\">Код может быть простым.<\/span> <span class=\"sg\" data-s=\"3\">А может быть и сложным!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Напишите код в фигурных скобках, <code>{<\/code> и <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">И снова переменные<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот один случай, где нужен этот способ.<\/span> <span class=\"sg\" data-s=\"1\">Иногда сразу после переменной идёт текст.<\/span> <span class=\"sg\" data-s=\"2\">Raku может по ошибке прочитать этот текст как часть имени.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы этого не было, поставьте переменную в фигурные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без фигурных скобок Raku пытается интерполировать переменную <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но такой переменной нет.<\/span><\/p>"]]},"uk":{"t":"Інтерполяція коду","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Інтерполяція коду — це наступний рівень інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете вставити код прямо в рядок у подвійних лапках.<\/span> <span class=\"sg\" data-s=\"2\">Код може бути простим.<\/span> <span class=\"sg\" data-s=\"3\">Він може бути і складним!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пишіть код між фігурними дужками, <code>{<\/code> і <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Знову про змінні<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось одне застосування цього методу.<\/span> <span class=\"sg\" data-s=\"1\">Іноді одразу після змінної йде текст.<\/span> <span class=\"sg\" data-s=\"2\">Raku може помилково прочитати цей текст як частину імені.<\/span> <span class=\"sg\" data-s=\"3\">Щоб цього не сталося, візьміть змінну у фігурні дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без фігурних дужок Raku намагається інтерполювати змінну <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але такої змінної немає.<\/span><\/p>"]]},"bg":{"t":"Кодова интерполация","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Интерполацията на код е следващото ниво на интерполацията.<\/span> <span class=\"sg\" data-s=\"1\">Можете да сложите код направо в низ с двойни кавички.<\/span> <span class=\"sg\" data-s=\"2\">Кодът може да е прост.<\/span> <span class=\"sg\" data-s=\"3\">Може да е и сложен!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Напишете кода между къдрави скоби, <code>{<\/code> и <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Сумата на $a и $b е {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nСумата на 10 и 20 е 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отново променливи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето една употреба на този метод.<\/span> <span class=\"sg\" data-s=\"1\">Понякога след променливата веднага следва текст.<\/span> <span class=\"sg\" data-s=\"2\">Raku може по грешка да прочете този текст като част от името.<\/span> <span class=\"sg\" data-s=\"3\">За да спрете това, сложете променливата в къдрави скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Има $how-many {$what}s.\"; # Има 5 костюма.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без къдрави скоби Raku се опитва да интерполира променлива <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но такава променлива няма.<\/span><\/p>"]]},"eo":{"t":"Koda interpolado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Koda interpolado estas la sekva nivelo de interpolado.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas meti kodon rekte en ŝnuron en duoblaj citiloj.<\/span> <span class=\"sg\" data-s=\"2\">La kodo povas esti simpla.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ povas esti kompleksa!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Skribu la kodon inter krampoj, <code>{<\/code> kaj <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La sumo de $a kaj $b estas {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa sumo de 10 kaj 20 estas 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabloj denove<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen unu uzo de ĉi tiu metodo.<\/span> <span class=\"sg\" data-s=\"1\">Kelkfoje variablo havas iom da teksto tuj post si.<\/span> <span class=\"sg\" data-s=\"2\">Erare, Raku povas legi tiun tekston kiel parton de la nomo.<\/span> <span class=\"sg\" data-s=\"3\">Por eviti tion, metu la variablon inter krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Estas $how-many {$what}s.\"; # Estas 5 vestoj.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sen krampoj, Raku provas interpoli variablon <code>$whats<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed tia variablo ne ekzistas.<\/span><\/p>"]]},"la":{"t":"Codice interpolatio","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Interpolatio codicis est proximus gradus interpolationis.<\/span> <span class=\"sg\" data-s=\"1\">Codicem directe intra stringam in quotationibus duplicibus ponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Codex simplex esse potest.<\/span> <span class=\"sg\" data-s=\"3\">Etiam complexus esse potest!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Codicem inter uncos curvos scribe, <code>{<\/code> et <code>}<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Summa $a et $b est {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nSumma 10 et 20 est 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles iterum<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecce unus usus huius methodi.<\/span> <span class=\"sg\" data-s=\"1\">Interdum variabilis textum statim post se habet.<\/span> <span class=\"sg\" data-s=\"2\">Raku per errorem hunc textum ut partem nominis legere potest.<\/span> <span class=\"sg\" data-s=\"3\">Ut hoc vites, variabilem in uncos curvos pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Sunt $how-many {$what}s.\"; # Sunt 5 suits.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine uncis curvis, Raku variabilem <code>$whats<\/code> interpolare conatur.<\/span> <span class=\"sg\" data-s=\"1\">Sed nulla talis variabilis est.<\/span><\/p>"]]}}}</script>
