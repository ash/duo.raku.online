s=\"1\">Then use this form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"de":{"t":"Zeichenkettenverkettung","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Sie können zwei Zeichenketten zusammenfügen.<\/span> <span class=\"sg\" data-s=\"1\">Dann bekommen Sie eine neue, längere Zeichenkette.<\/span> <span class=\"sg\" data-s=\"2\">Das nennen wir Zeichenkettenverkettung.<\/span> <span class=\"sg\" data-s=\"3\">In Raku verketten Sie Zeichenketten mit einem Operator.<\/span> <span class=\"sg\" data-s=\"4\">Können Sie seinen Namen raten?<\/span> <span class=\"sg\" data-s=\"5\">Es ist der Verkettungsoperator!<\/span> <span class=\"sg\" data-s=\"6\">Dieser Operator ist eine Tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Um zwei Zeichenketten zu verketten, setzen Sie <code>~<\/code> zwischen sie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal stehen die Zeichenketten in Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Dann können wir ‚Variablen verketten‘.<\/span> <span class=\"sg\" data-s=\"2\">Na ja, eigentlich verketten wir die Zeichenketten in diesen Variablen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können das Ergebnis auch in einer neuen Variablen speichern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Verkettung und Zuweisung in einem Schritt<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal möchten Sie eine Zeichenkette am Ende einer Variablen hinzufügen.<\/span> <span class=\"sg\" data-s=\"1\">Dann verwenden Sie diese Form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstatt von \n$str = $str ~ $another-str;\n\n# verwenden Sie:\n$str ~= $another-str;<\/code><\/pre>"]]},"nl":{"t":"String concatenatie","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Je kunt twee strings samenvoegen.<\/span> <span class=\"sg\" data-s=\"1\">Dan krijg je een nieuwe, langere string.<\/span> <span class=\"sg\" data-s=\"2\">We noemen dit stringconcatenatie.<\/span> <span class=\"sg\" data-s=\"3\">In Raku concateneer je strings met een operator.<\/span> <span class=\"sg\" data-s=\"4\">Kun je de naam raden?<\/span> <span class=\"sg\" data-s=\"5\">Het is de concatenatie-operator!<\/span> <span class=\"sg\" data-s=\"6\">Deze operator is een tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Om twee strings te concateneren, zet je <code>~<\/code> ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Soms staan de strings in variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Dan kunnen we ‘de variabelen concateneren’.<\/span> <span class=\"sg\" data-s=\"2\">Nou ja, eigenlijk concateneren we de strings in deze variabelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt het resultaat ook in een nieuwe variabele zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatie en toewijzing in één stap<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms wil je een string aan het eind van een variabele toevoegen.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik dan deze vorm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># In plaats van \ ne di stringhe","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Puoi unire due stringhe.<\/span> <span class=\"sg\" data-s=\"1\">Così ottieni una nuova stringa, più lunga.<\/span> <span class=\"sg\" data-s=\"2\">La chiamiamo concatenazione di stringhe.<\/span> <span class=\"sg\" data-s=\"3\">In Raku, concateni le stringhe con un operatore.<\/span> <span class=\"sg\" data-s=\"4\">Indovini il suo nome?<\/span> <span class=\"sg\" data-s=\"5\">È l'operatore di concatenazione!<\/span> <span class=\"sg\" data-s=\"6\">Questo operatore è una tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Per concatenare due stringhe, metti <code>~<\/code> tra di loro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte le stringhe sono in variabili.<\/span> <span class=\"sg\" data-s=\"1\">Allora possiamo ‘concatenare le variabili’.<\/span> <span class=\"sg\" data-s=\"2\">Beh, in realtà concateniamo le stringhe in queste variabili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi anche mettere il risultato in una nuova variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenazione e assegnazione in un solo passo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi aggiungere una stringa alla fine di una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Allora usa questa forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Invece di \n$str = $str ~ $another-str;\n\n# usa:\n$str ~= $another-str;<\/code><\/pre>"]]},"lv":{"t":"Virkņu savienošana","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Jūs varat savienot divas virknes kopā.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs iegūstat jaunu, garāku virkni.<\/span> <span class=\"sg\" data-s=\"2\">Mēs to saucam par virkņu savienošanu.<\/span> <span class=\"sg\" data-s=\"3\">Raku valodā jūs savienojat virknes ar operatoru.<\/span> <span class=\"sg\" data-s=\"4\">Vai jūs varat uzminēt tā nosaukumu?<\/span> <span class=\"sg\" data-s=\"5\">Tas ir savienošanas operators!<\/span> <span class=\"sg\" data-s=\"6\">Šis operators ir tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Lai savienotu divas virknes, ielieciet <code>~<\/code> starp tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz virknes ir mainīgajos.<\/span> <span class=\"sg\" data-s=\"1\">Tad mēs varam ‘savienot mainīgos’.<\/span> <span class=\"sg\" data-s=\"2\">Nu, patiesībā mēs savienojam virknes šajos mainīgajos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī ielikt rezultātu jaunā mainīgajā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Savienošana un piešķiršana vienā solī<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs gribat pievienot virkni mainīgā beigās.<\/span> <span class=\"sg\" data-s=\"1\">Tad izmantojiet šo formu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Tā vietā, lai izmantotu\n$str = $str ~ $another-str;\n\n# izmantojiet:\n$str ~= $another-str;<\/code><\/pre>"]]},"ru":{"t":"Конкатенация строк","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Две строки можно соединить.<\/span> <span class=\"sg\" data-s=\"1\">Тогда получится новая, более длинная строка.<\/span> <span class=\"sg\" data-s=\"2\">Мы называем это конкатенацией строк.<\/span> <span class=\"sg\" data-s=\"3\">В Raku строки соединяют с помощью оператора.<\/span> <span class=\"sg\" data-s=\"4\">Угадаете, как он называется?<\/span> <span class=\"sg\" data-s=\"5\">Это оператор конкатенации!<\/span> <span class=\"sg\" data-s=\"6\">Этот оператор — тильда: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Чтобы соединить две строки, поставьте между ними <code>~<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда строки хранятся в переменных.<\/span> <span class=\"sg\" data-s=\"1\">Тогда мы можем «конкатенировать переменные».<\/span> <span class=\"sg\" data-s=\"2\">Ну, на самом деле мы конкатенируем строки в этих переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можно также записать результат в новую переменную:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенация и присвоение за один шаг<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно добавить строку в конец переменной.<\/span> <span class=\"sg\" data-s=\"1\">Тогда используйте такую форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"uk":{"t":"Конкатенація рядків","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ви можете з'єднати два рядки разом.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви отримаєте новий, довший рядок.<\/span> <span class=\"sg\" data-s=\"2\">Ми називаємо це конкатенацією рядків.<\/span> <span class=\"sg\" data-s=\"3\">У Raku ви конкатенуєте рядки за допомогою оператора.<\/span> <span class=\"sg\" data-s=\"4\">Вгадаєте, як він називається?<\/span> <span class=\"sg\" data-s=\"5\">Це оператор конкатенації!<\/span> <span class=\"sg\" data-s=\"6\">Цей оператор — тильда: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Щоб конкатенувати два рядки, поставте <code>~<\/code> між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді рядки зберігаються у змінних.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ми можемо ‘конкатенувати змінні’.<\/span> <span class=\"sg\" data-s=\"2\">Ну, насправді ми конкатенуємо рядки в цих змінних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також можете покласти результат у нову змінну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенація і присвоєння за один крок<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді ви хочете додати рядок у кінець змінної.<\/span> <span class=\"sg\" data-s=\"1\">Тоді використовуйте таку форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Замість \n$str = $str ~ $another-str;\n\n# використовуйте:\n$str ~= $another-str;<\/code><\/pre>"]]},"bg":{"t":"Конкатенация на стрингове","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Можете да съедините два низа.<\/span> <span class=\"sg\" data-s=\"1\">Тогава получавате нов, по-дълъг низ.<\/span> <span class=\"sg\" data-s=\"2\">Това наричаме конкатенация на низове.<\/span> <span class=\"sg\" data-s=\"3\">В Raku конкатенирате низове с оператор.<\/span> <span class=\"sg\" data-s=\"4\">Можете ли да познаете името му?<\/span> <span class=\"sg\" data-s=\"5\">Това е операторът за конкатенация!<\/span> <span class=\"sg\" data-s=\"6\">Този оператор е тилда: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">За да конкатенирате два низа, сложете <code>~<\/code> между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога низовете са в променливи.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можем да „конкатенираме променливите“.<\/span> <span class=\"sg\" data-s=\"2\">Е, всъщност конкатенираме низовете в тези променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да сложите резултата в нова променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенация и присвояване в една стъпка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога искате да добавите низ в края на променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тогава използвайте тази форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Вместо \n$str = $str ~ $another-str;\n\n# използвайте:\n$str ~= $another-str;<\/code><\/pre>"]]},"eo":{"t":"Ĉena konkatenado","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Vi povas kunigi du ĉenojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ricevas novan, pli longan ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">Ni nomas tion konkatenado de ĉenoj.<\/span> <span class=\"sg\" data-s=\"3\">En Raku, vi kunigas ĉenojn per operatoro.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu vi povas diveni ĝian nomon?<\/span> <span class=\"sg\" data-s=\"5\">Ĝi estas la konkatenada operatoro!<\/span> <span class=\"sg\" data-s=\"6\">Tiu operatoro estas tildo: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Por kunigi du ĉenojn, metu <code>~<\/code> inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje la ĉenoj estas en variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ni povas ‘kunigi la variablojn’.<\/span> <span class=\"sg\" data-s=\"2\">Nu, fakte ni kunigas la ĉenojn en tiuj variabloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas meti la rezulton en novan variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkatenado kaj asigno en unu paŝo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje vi volas aldoni ĉenon al la fino de variablo.<\/span> <span class=\"sg\" data-s=\"1\">Tiam uzu ĉi tiun formon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstataŭ \n$str = $str ~ $another-str;\n\n# uzu:\n$str ~= $another-str;<\/code><\/pre>"]]},"la":{"t":"Catena concatenatio","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Duas chordas coniungere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum novam chordam longiorem accipis.<\/span> <span class=\"sg\" data-s=\"2\">Hoc concatenationem chordarum vocamus.<\/span> <span class=\"sg\" data-s=\"3\">In Raku chordas operatore concatenas.<\/span> <span class=\"sg\" data-s=\"4\">Potesne nomen eius divinare?<\/span> <span class=\"sg\" data-s=\"5\">Est operator concatenationis!<\/span> <span class=\"sg\" data-s=\"6\">Hic operator est tilde: <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ut duas chordas concatenes, <code>~<\/code> inter eas pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum chordae in variabilibus sunt.<\/span> <span class=\"sg\" data-s=\"1\">Tum ‘variabiles concatenare’ possumus.<\/span> <span class=\"sg\" data-s=\"2\">Re vera autem chordas in his variabilibus concatenamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eventum etiam in novam variabilem ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatio et assignatio uno gradu<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum chordam ad finem variabilis addere vis.<\/span> <span class=\"sg\" data-s=\"1\">Tum hac forma utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Pro\n$str = $str ~ $another-str;\n\n# utere:\n$str ~= $another-str;<\/code><\/pre>"]]}}}</script>
