r = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta vez, el programa imprime <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mira la segunda línea.<\/span> <span class=\"sg\" data-s=\"2\">Tiene dos llamadas a métodos, una después de la otra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitud en puntos de código<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Para terminar este tema, aquí hay un método útil más para la longitud de las cadenas: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da el número de puntos de código de la cadena.<\/span> <span class=\"sg\" data-s=\"2\">Un punto de código es el número de un carácter en Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Antes de contar, Raku normaliza la cadena.<\/span> <span class=\"sg\" data-s=\"4\">Pone la cadena en una forma estándar.<\/span> <span class=\"sg\" data-s=\"5\">A menudo, <code>codes<\/code> y <code>chars<\/code> dan el mismo resultado.<\/span> <span class=\"sg\" data-s=\"6\">Pero en algunos casos raros, los dos métodos dan resultados diferentes.<\/span> <span class=\"sg\" data-s=\"7\">Por ejemplo, puedes construir ‘un carácter imposible’.<\/span> <span class=\"sg\" data-s=\"8\">En todo el espacio Unicode no hay un solo punto de código para él.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">El carácter <code>x̨<\/code> no tiene un punto de código propio.<\/span> <span class=\"sg\" data-s=\"1\">Solo puedes construirlo con dos partes.<\/span> <span class=\"sg\" data-s=\"2\">La primera parte es la letra minúscula <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La segunda parte es el carácter combinante <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Añade una marca a la letra.<\/span> <span class=\"sg\" data-s=\"5\">Así que es un solo carácter, pero tiene dos puntos de código.<\/span> <span class=\"sg\" data-s=\"6\">Por eso el programa imprime esto:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"it":{"t":"Lunghezza della stringa","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Le stringhe di Raku sono stringhe Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Per questo, alcune cose semplici sono un po' più difficili.<\/span> <span class=\"sg\" data-s=\"2\">O, almeno, devi pensarci di più.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, prendi la lunghezza di una stringa.<\/span> <span class=\"sg\" data-s=\"4\">È il numero di caratteri?<\/span> <span class=\"sg\" data-s=\"5\">O è il numero di byte?<\/span> <span class=\"sg\" data-s=\"6\">E a volte lo stesso carattere ha parti diverse in stringhe diverse.<\/span> <span class=\"sg\" data-s=\"7\">È ancora un solo carattere, allora?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in caratteri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il <em>metodo<\/em> <code>chars<\/code> dà la lunghezza di una stringa in caratteri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Parliamo dei metodi più avanti.<\/span> <span class=\"sg\" data-s=\"1\">Ma possiamo già usarli ora.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, puoi chiamare metodi su quasi ogni oggetto.<\/span> <span class=\"sg\" data-s=\"3\">Anche le stringhe e le variabili scalari sono oggetti.<\/span> <span class=\"sg\" data-s=\"4\">Per chiamare un metodo, scrivi un punto.<\/span> <span class=\"sg\" data-s=\"5\">Qui la variabile contiene una stringa.<\/span> <span class=\"sg\" data-s=\"6\">Chiamiamo il metodo su questa variabile: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo saluto cinese ha quattro caratteri: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">E <code>$str.chars<\/code> dà esattamente <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in byte<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo è solo per tua informazione.<\/span> <span class=\"sg\" data-s=\"1\">Ecco come avere la lunghezza di una stringa in byte.<\/span> <span class=\"sg\" data-s=\"2\">Per questo, devi sapere la codifica della stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa volta, il programma stampa <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Guarda la seconda riga.<\/span> <span class=\"sg\" data-s=\"2\">Ha due chiamate di metodo, una dopo l'altra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in punti di codice<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Per finire questo argomento, ecco un altro metodo utile per la lunghezza delle stringhe: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dà il numero di punti di codice nella stringa.<\/span> <span class=\"sg\" data-s=\"2\">Un punto di codice è il numero di un carattere in Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Prima di contare, Raku normalizza la stringa.<\/span> <span class=\"sg\" data-s=\"4\">La porta a una forma standard.<\/span> <span class=\"sg\" data-s=\"5\">Spesso, <code>codes<\/code> e <code>chars<\/code> danno lo stesso risultato.<\/span> <span class=\"sg\" data-s=\"6\">Ma in alcuni casi rari, i due metodi danno risultati diversi.<\/span> <span class=\"sg\" data-s=\"7\">Per esempio, puoi costruire ‘un carattere impossibile’.<\/span> <span class=\"sg\" data-s=\"8\">In tutto lo spazio Unicode non c'è un solo punto di codice per questo carattere.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il carattere <code>x̨<\/code> non ha un suo punto di codice.<\/span> <span class=\"sg\" data-s=\"1\">Puoi costruirlo solo da due parti.<\/span> <span class=\"sg\" data-s=\"2\">La prima parte è la lettera minuscola <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La seconda parte è il carattere combinante <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Aggiunge un segno alla lettera.<\/span> <span class=\"sg\" data-s=\"5\">Quindi, è un solo carattere, ma ha due punti di codice.<\/span> <span class=\"sg\" data-s=\"6\">Ecco perché il programma stampa questo:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"lv":{"t":"Virknes garums","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku virknes ir Unicode virknes.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc dažas vienkāršas lietas ir nedaudz grūtākas.<\/span> <span class=\"sg\" data-s=\"2\">Vai vismaz jums par tām jādomā vairāk.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, ņemiet virknes garumu.<\/span> <span class=\"sg\" data-s=\"4\">Vai tas ir rakstzīmju skaits?<\/span> <span class=\"sg\" data-s=\"5\">Vai arī tas ir baitu skaits?<\/span> <span class=\"sg\" data-s=\"6\">Un dažreiz vienai un tai pašai rakstzīmei dažādās virknēs ir dažādas daļas.<\/span> <span class=\"sg\" data-s=\"7\">Vai tā tad joprojām ir viena rakstzīme?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums rakstzīmēs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Metode<\/em> <code>chars<\/code> dod virknes garumu rakstzīmēs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Par metodēm mēs runāsim vēlāk.<\/span> <span class=\"sg\" data-s=\"1\">Bet mēs tās varam izmantot jau tagad.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā jūs varat izsaukt metodes gandrīz katram objektam.<\/span> <span class=\"sg\" data-s=\"3\">Virknes un skalārie mainīgie arī ir objekti.<\/span> <span class=\"sg\" data-s=\"4\">Lai izsauktu metodi, rakstiet punktu.<\/span> <span class=\"sg\" data-s=\"5\">Šeit mainīgais glabā virkni.<\/span> <span class=\"sg\" data-s=\"6\">Mēs izsaucam metodi šim mainīgajam: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šim ķīniešu sveicienam ir četras rakstzīmes: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>$str.chars<\/code> dod tieši <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums baitos<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir tikai jūsu informācijai.<\/span> <span class=\"sg\" data-s=\"1\">Lūk, kā iegūt virknes garumu baitos.<\/span> <span class=\"sg\" data-s=\"2\">Šim nolūkam jums jāzina virknes kodējums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šoreiz programma izdrukā <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet otro rindu.<\/span> <span class=\"sg\" data-s=\"2\">Tajā ir divi metožu izsaukumi, viens pēc otra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums koda punktos<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Lai pabeigtu šo tēmu, lūk, vēl viena noderīga metode virknes garumam: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā dod koda punktu skaitu virknē.<\/span> <span class=\"sg\" data-s=\"2\">Koda punkts ir rakstzīmes numurs Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Pirms skaitīšanas Raku normalizē virkni.<\/span> <span class=\"sg\" data-s=\"4\">Tas pārveido virkni standarta formā.<\/span> <span class=\"sg\" data-s=\"5\">Bieži <code>codes<\/code> un <code>chars<\/code> dod vienādu rezultātu.<\/span> <span class=\"sg\" data-s=\"6\">Bet dažos retos gadījumos abas metodes dod dažādus rezultātus.<\/span> <span class=\"sg\" data-s=\"7\">Piemēram, jūs varat izveidot ‘neiespējamu’ rakstzīmi.<\/span> <span class=\"sg\" data-s=\"8\">Visā Unicode telpā tai nav viena koda punkta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Rakstzīmei <code>x̨<\/code> nav sava koda punkta.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to varat izveidot tikai no divām daļām.<\/span> <span class=\"sg\" data-s=\"2\">Pirmā daļa ir mazais burts <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Otrā daļa ir kombinējošā rakstzīme <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tā pievieno burtam zīmi.<\/span> <span class=\"sg\" data-s=\"5\">Tātad tā ir viena rakstzīme, bet tai ir divi koda punkti.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc programma izdrukā šo:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"ru":{"t":"Длина строки","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Строки в Raku — это строки Юникода.<\/span> <span class=\"sg\" data-s=\"1\">Из-за этого некоторые простые вещи немного сложнее.<\/span> <span class=\"sg\" data-s=\"2\">Или, по крайней мере, о них нужно больше думать.<\/span> <span class=\"sg\" data-s=\"3\">Например, возьмём длину строки.<\/span> <span class=\"sg\" data-s=\"4\">Это количество символов?<\/span> <span class=\"sg\" data-s=\"5\">Или это количество байтов?<\/span> <span class=\"sg\" data-s=\"6\">А иногда один и тот же символ состоит из разных частей в разных строках.<\/span> <span class=\"sg\" data-s=\"7\">Тогда это всё ещё один символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Метод<\/em> <code>chars<\/code> даёт длину строки в символах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">О методах мы поговорим позже.<\/span> <span class=\"sg\" data-s=\"1\">Но мы уже можем их использовать.<\/span> <span class=\"sg\" data-s=\"2\">В Raku можно вызвать метод почти для любого объекта.<\/span> <span class=\"sg\" data-s=\"3\">Строки и скалярные переменные — тоже объекты.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы вызвать метод, поставьте точку.<\/span> <span class=\"sg\" data-s=\"5\">Здесь переменная хранит строку.<\/span> <span class=\"sg\" data-s=\"6\">Мы вызываем метод для этой переменной: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом китайском приветствии четыре символа: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> даёт ровно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в байтах<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это только для справки.<\/span> <span class=\"sg\" data-s=\"1\">Вот как узнать длину строки в байтах.<\/span> <span class=\"sg\" data-s=\"2\">Для этого нужно знать кодировку строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этот раз программа печатает <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на вторую строку.<\/span> <span class=\"sg\" data-s=\"2\">В ней два вызова методов, один за другим.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в кодовых позициях<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Чтобы закончить тему, вот ещё один полезный метод для длины строки: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он даёт количество кодовых позиций в строке.<\/span> <span class=\"sg\" data-s=\"2\">Кодовая позиция — это номер символа в Юникоде.<\/span> <span class=\"sg\" data-s=\"3\">Перед подсчётом Raku нормализует строку.<\/span> <span class=\"sg\" data-s=\"4\">Он приводит строку к стандартному виду.<\/span> <span class=\"sg\" data-s=\"5\">Часто <code>codes<\/code> и <code>chars<\/code> дают одинаковый результат.<\/span> <span class=\"sg\" data-s=\"6\">Но в некоторых редких случаях эти два метода дают разные результаты.<\/span> <span class=\"sg\" data-s=\"7\">Например, можно собрать «невозможный» символ.<\/span> <span class=\"sg\" data-s=\"8\">Во всём пространстве Юникода для него нет ни одной кодовой позиции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У символа <code>x̨<\/code> нет своей кодовой позиции.<\/span> <span class=\"sg\" data-s=\"1\">Его можно собрать только из двух частей.<\/span> <span class=\"sg\" data-s=\"2\">Первая часть — строчная буква <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вторая часть — комбинирующий символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Он добавляет к букве значок.<\/span> <span class=\"sg\" data-s=\"5\">Значит, это один символ, но у него две кодовые позиции.<\/span> <span class=\"sg\" data-s=\"6\">Вот почему программа печатает это:<\/span><\/p>"],["code",0,"<pre><code>1\n2<\/code><\/pre>"]]},"uk":{"t":"Довжина рядка","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Рядки в Raku — це рядки Юнікоду.<\/span> <span class=\"sg\" data-s=\"1\">Через це деякі прості речі трохи складніші.<\/span> <span class=\"sg\" data-s=\"2\">Або, принаймні, про них треба більше думати.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, візьмемо довжину рядка.<\/span> <span class=\"sg\" data-s=\"4\">Це кількість символів?<\/span> <span class=\"sg\" data-s=\"5\">Чи це кількість байтів?<\/span> <span class=\"sg\" data-s=\"6\">А іноді той самий символ має різні частини в різних рядках.<\/span> <span class=\"sg\" data-s=\"7\">Чи це тоді все ще один символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Метод<\/em> <code>chars<\/code> дає довжину рядка в символах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Про методи ми поговоримо пізніше.<\/span> <span class=\"sg\" data-s=\"1\">Але ми вже можемо їх використовувати.<\/span> <span class=\"sg\" data-s=\"2\">У Raku ви можете викликати методи майже на кожному об'єкті.<\/span> <span class=\"sg\" data-s=\"3\">Рядки і скалярні змінні — теж об'єкти.<\/span> <span class=\"sg\" data-s=\"4\">Щоб викликати метод, напишіть крапку.<\/span> <span class=\"sg\" data-s=\"5\">Тут змінна зберігає рядок.<\/span> <span class=\"sg\" data-s=\"6\">Ми викликаємо метод на цій змінній: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це китайське привітання має чотири символи: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">І <code>$str.chars<\/code> дає саме <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в байтах<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це лише для довідки.<\/span> <span class=\"sg\" data-s=\"1\">Ось як отримати довжину рядка в байтах.<\/span> <span class=\"sg\" data-s=\"2\">Для цього треба знати кодування рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цього разу програма виводить <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на другий рядок.<\/span> <span class=\"sg\" data-s=\"2\">У ньому два виклики методів, один за одним.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в кодових точках<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">На завершення теми ось ще один корисний метод для довжини рядка: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він дає кількість кодових точок у рядку.<\/span> <span class=\"sg\" data-s=\"2\">Кодова точка — це номер символу в Юнікоді.<\/span> <span class=\"sg\" data-s=\"3\">Перед підрахунком Raku нормалізує рядок.<\/span> <span class=\"sg\" data-s=\"4\">Він приводить рядок до стандартної форми.<\/span> <span class=\"sg\" data-s=\"5\">Часто <code>codes<\/code> і <code>chars<\/code> дають однаковий результат.<\/span> <span class=\"sg\" data-s=\"6\">Але в деяких рідкісних випадках ці два методи дають різні результати.<\/span> <span class=\"sg\" data-s=\"7\">Наприклад, ви можете створити ‘неможливий’ символ.<\/span> <span class=\"sg\" data-s=\"8\">У всьому просторі Юнікоду немає для нього єдиної кодової точки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Символ <code>x̨<\/code> не має власної кодової точки.<\/span> <span class=\"sg\" data-s=\"1\">Його можна створити лише з двох частин.<\/span> <span class=\"sg\" data-s=\"2\">Перша частина — мала літера <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Друга частина — комбінований символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він додає до літери позначку.<\/span> <span class=\"sg\" data-s=\"5\">Отже, це один символ, але в нього дві кодові точки.<\/span> <span class=\"sg\" data-s=\"6\">Тому програма виводить ось що:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"bg":{"t":"Дължина на стринг","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Низовете в Raku са Юникод низове.<\/span> <span class=\"sg\" data-s=\"1\">Затова някои прости неща са малко по-трудни.<\/span> <span class=\"sg\" data-s=\"2\">Или поне трябва да мислите повече за тях.<\/span> <span class=\"sg\" data-s=\"3\">Например, вземете дължината на низ.<\/span> <span class=\"sg\" data-s=\"4\">Дали е броят на символите?<\/span> <span class=\"sg\" data-s=\"5\">Или е броят на байтовете?<\/span> <span class=\"sg\" data-s=\"6\">А понякога един и същ символ има различни части в различни низове.<\/span> <span class=\"sg\" data-s=\"7\">Тогава той още ли е един символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в символи<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Методът<\/em> <code>chars<\/code> дава дължината на низа в символи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">За методите ще говорим по-късно.<\/span> <span class=\"sg\" data-s=\"1\">Но вече можем да ги използваме.<\/span> <span class=\"sg\" data-s=\"2\">В Raku можете да извиквате методи на почти всеки обект.<\/span> <span class=\"sg\" data-s=\"3\">Низовете и скаларните променливи също са обекти.<\/span> <span class=\"sg\" data-s=\"4\">За да извикате метод, пишете точка.<\/span> <span class=\"sg\" data-s=\"5\">Тук променливата пази низ.<\/span> <span class=\"sg\" data-s=\"6\">Извикваме метода на тази променлива: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този китайски поздрав има четири символа: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> дава точно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в байтове<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е само за ваша информация.<\/span> <span class=\"sg\" data-s=\"1\">Ето как да получите дължината на низ в байтове.<\/span> <span class=\"sg\" data-s=\"2\">За това трябва да знаете кодировката на низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този път програмата отпечатва <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вижте втория ред.<\/span> <span class=\"sg\" data-s=\"2\">Той има две извиквания на методи, едно след друго.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в кодови точки<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">За да завършим темата, ето още един полезен метод за дължината на низ: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той дава броя на кодовите точки в низа.<\/span> <span class=\"sg\" data-s=\"2\">Кодовата точка е номерът на символ в Юникод.<\/span> <span class=\"sg\" data-s=\"3\">Преди да брои, Raku нормализира низа.<\/span> <span class=\"sg\" data-s=\"4\">Той дава на низа стандартна форма.<\/span> <span class=\"sg\" data-s=\"5\">Често <code>codes<\/code> и <code>chars<\/code> дават един и същ резултат.<\/span> <span class=\"sg\" data-s=\"6\">Но в някои редки случаи двата метода дават различни резултати.<\/span> <span class=\"sg\" data-s=\"7\">Например, можете да създадете „невъзможен“ символ.<\/span> <span class=\"sg\" data-s=\"8\">В цялото Юникод пространство няма отделна кодова точка за него.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Символът <code>x̨<\/code> няма собствена кодова точка.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го създадете само от две части.<\/span> <span class=\"sg\" data-s=\"2\">Първата част е малката буква <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Втората част е комбиниращият символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той добавя знак към буквата.<\/span> <span class=\"sg\" data-s=\"5\">Така това е един символ, но той има две кодови точки.<\/span> <span class=\"sg\" data-s=\"6\">Затова програмата отпечатва това:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"eo":{"t":"Ĉena longo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ŝnuroj en Raku estas Unikodaj ŝnuroj.<\/span> <span class=\"sg\" data-s=\"1\">Pro tio, kelkaj simplaj aferoj estas iom pli malfacilaj.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ, almenaŭ, vi devas pensi pli pri ili.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, prenu la longecon de ŝnuro.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu ĝi estas la nombro de karakteroj?<\/span> <span class=\"sg\" data-s=\"5\">Aŭ ĉu ĝi estas la nombro de bajtoj?<\/span> <span class=\"sg\" data-s=\"6\">Kaj kelkfoje la sama karaktero havas malsamajn partojn en malsamaj ŝnuroj.<\/span> <span class=\"sg\" data-s=\"7\">Ĉu ĝi tiam ankoraŭ estas unu karaktero?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en karakteroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>metodo<\/em> <code>chars<\/code> donas la longecon de ŝnuro en karakteroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ni parolos pri metodoj poste.<\/span> <span class=\"sg\" data-s=\"1\">Sed ni jam povas uzi ilin nun.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, vi povas voki metodojn sur preskaŭ ĉiu objekto.<\/span> <span class=\"sg\" data-s=\"3\">Ŝnuroj kaj skalaj variabloj ankaŭ estas objektoj.<\/span> <span class=\"sg\" data-s=\"4\">Por voki metodon, skribu punkton.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tie, la variablo tenas ŝnuron.<\/span> <span class=\"sg\" data-s=\"6\">Ni vokas la metodon sur ĉi tiu variablo: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ĉina saluto havas kvar karakterojn: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>$str.chars<\/code> donas ekzakte <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en bajtoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas nur por via informo.<\/span> <span class=\"sg\" data-s=\"1\">Jen kiel ricevi la longecon de ŝnuro en bajtoj.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, vi devas scii la kodadon de la ŝnuro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, la programo presas <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu la duan linion.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas du vokojn de metodoj, unu post la alia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en kodpunktoj<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Por fini ĉi tiun temon, jen ankoraŭ unu utila metodo por la longeco de ŝnuro: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi donas la nombron de kodpunktoj en la ŝnuro.<\/span> <span class=\"sg\" data-s=\"2\">Kodpunkto estas la numero de karaktero en Unikodo.<\/span> <span class=\"sg\" data-s=\"3\">Antaŭ ol kalkuli, Raku normaligas la ŝnuron.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi donas al la ŝnuro norman formon.<\/span> <span class=\"sg\" data-s=\"5\">Ofte, <code>codes<\/code> kaj <code>chars<\/code> donas la saman rezulton.<\/span> <span class=\"sg\" data-s=\"6\">Sed en kelkaj maloftaj kazoj, la du metodoj donas malsamajn rezultojn.<\/span> <span class=\"sg\" data-s=\"7\">Ekzemple, vi povas konstrui ‘neeblan’ karakteron.<\/span> <span class=\"sg\" data-s=\"8\">La tuta Unikoda spaco ne havas unu solan kodpunkton por ĝi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La karaktero <code>x̨<\/code> ne havas propran kodpunkton.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas konstrui ĝin nur el du partoj.<\/span> <span class=\"sg\" data-s=\"2\">La unua parto estas la malgranda litero <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La dua parto estas la kombina karaktero <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi aldonas signon al la litero.<\/span> <span class=\"sg\" data-s=\"5\">Do, ĝi estas unu karaktero, sed ĝi havas du kodpunktojn.<\/span> <span class=\"sg\" data-s=\"6\">Tial la programo presas jenon:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"la":{"t":"Catena longitudo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Fila in Raku sunt fila Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Propter hoc quaedam res simplices paulo difficiliores sunt.<\/span> <span class=\"sg\" data-s=\"2\">Vel saltem de eis plus cogitare debes.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, sume longitudinem fili.<\/span> <span class=\"sg\" data-s=\"4\">Estne numerus characterum?<\/span> <span class=\"sg\" data-s=\"5\">An est numerus byteorum?<\/span> <span class=\"sg\" data-s=\"6\">Et interdum idem character in diversis filis diversas partes habet.<\/span> <span class=\"sg\" data-s=\"7\">Estne tum adhuc unus character?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in characteribus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Methodus<\/em> <code>chars<\/code> longitudinem fili in characteribus dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">De methodis postea loquimur.<\/span> <span class=\"sg\" data-s=\"1\">Sed eis iam nunc uti possumus.<\/span> <span class=\"sg\" data-s=\"2\">In Raku methodos in fere omni obiecto vocare potes.<\/span> <span class=\"sg\" data-s=\"3\">Fila et variabiles scalares etiam obiecta sunt.<\/span> <span class=\"sg\" data-s=\"4\">Ut methodum voces, punctum scribe.<\/span> <span class=\"sg\" data-s=\"5\">Hic variabilis filum tenet.<\/span> <span class=\"sg\" data-s=\"6\">Methodum in hac variabili vocamus: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec salutatio Sinensis quattuor characteres habet: 你好世界.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>$str.chars<\/code> exacte <code>4<\/code> dat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in byteis<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc solum ad notitiam tuam est.<\/span> <span class=\"sg\" data-s=\"1\">Sic longitudinem fili in byteis accipis.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc codificationem fili scire debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore programma <code>12<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Specta secundam lineam.<\/span> <span class=\"sg\" data-s=\"2\">Duas vocationes methodorum habet, alteram post alteram.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in punctis codicis<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Denique, ecce alia methodus utilis pro longitudine fili: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Numerum punctorum codicis in filo dat.<\/span> <span class=\"sg\" data-s=\"2\">Punctum codicis est numerus characteris in Unicode.<\/span> <span class=\"sg\" data-s=\"3\">Antequam numerat, Raku filum normalizat.<\/span> <span class=\"sg\" data-s=\"4\">Filum ad formam communem ducit.<\/span> <span class=\"sg\" data-s=\"5\">Saepe <code>codes<\/code> et <code>chars<\/code> eundem eventum dant.<\/span> <span class=\"sg\" data-s=\"6\">Sed in quibusdam casibus raris duae methodi diversos eventus dant.<\/span> <span class=\"sg\" data-s=\"7\">Exempli gratia, characterem ‘impossibilem’ aedificare potes.<\/span> <span class=\"sg\" data-s=\"8\">Totum spatium Unicode nullum unum punctum codicis pro eo habet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Character <code>x̨<\/code> nullum punctum codicis proprium habet.<\/span> <span class=\"sg\" data-s=\"1\">Eum solum ex duabus partibus aedificare potes.<\/span> <span class=\"sg\" data-s=\"2\">Prima pars est littera minuscula <code>x<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Secunda pars est character combinans <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Is signum litterae addit.<\/span> <span class=\"sg\" data-s=\"5\">Ita unus character est, sed duo puncta codicis habet.<\/span> <span class=\"sg\" data-s=\"6\">Ideo programma hoc imprimit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1
