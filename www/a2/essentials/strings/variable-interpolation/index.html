 el valor de la variable en su lugar.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku usa el valor que tiene la variable en el momento de la interpolación.<\/span> <span class=\"sg\" data-s=\"1\">Puedes cambiar el valor de <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego la interpolas otra vez.<\/span> <span class=\"sg\" data-s=\"3\">Ahora la cadena recibe el nuevo valor.<\/span> <span class=\"sg\" data-s=\"4\">Vamos a probarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta vez, la misma cadena crea mensajes diferentes:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"it":{"t":"Interpolazione delle variabili","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nelle ultime sezioni, alcune stringhe erano tra virgolette singole.<\/span> <span class=\"sg\" data-s=\"1\">Altre stringhe erano tra virgolette doppie.<\/span> <span class=\"sg\" data-s=\"2\">Lo hai notato?<\/span> <span class=\"sg\" data-s=\"3\">La differenza è molto importante.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ti serve una virgoletta singola dentro una stringa?<\/span> <span class=\"sg\" data-s=\"1\">Il modo più facile è usare le virgolette doppie, naturalmente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A proposito, un vero apostrofo è comunque meglio di una virgoletta singola.<\/span> <span class=\"sg\" data-s=\"1\">Il motivo è che <a href=\"/essentials/on-unicode/\">Raku è bravo con Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ma il vero potere delle virgolette doppie è un altro.<\/span> <span class=\"sg\" data-s= iņas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Starp citu, īsts apostrofs tomēr ir labāks par vienpēdiņu.<\/span> <span class=\"sg\" data-s=\"1\">Iemesls ir tas, ka <a href=\"/essentials/on-unicode/\">Raku labi strādā ar Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bet dubulto pēdiņu īstais spēks ir kas cits.<\/span> <span class=\"sg\" data-s=\"1\">Tās var <em>interpolēt<\/em> mainīgos.<\/span> <span class=\"sg\" data-s=\"2\">Drīz mēs redzēsim, ka tās var arī izpildīt kodu!<\/span> <span class=\"sg\" data-s=\"3\">Apskatiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kā jūs varat uzminēt, programma izdrukā <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku noņem nosaukumu <code>$name<\/code> kopā ar sigilu <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tas ieliek mainīgā vērtību.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku izmanto mainīgā vērtību interpolācijas brīdī.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat mainīt <code>$name<\/code> vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs to interpolējat vēlreiz.<\/span> <span class=\"sg\" data-s=\"3\">Tagad virkne saņem jauno vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Pārbaudīsim to:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šoreiz tā pati virkne veido dažādus ziņojumus:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"ru":{"t":"Интерполяция переменных","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В прошлых разделах некоторые строки были в одинарных кавычках.<\/span> <span class=\"sg\" data-s=\"1\">Другие строки были в двойных кавычках.<\/span> <span class=\"sg\" data-s=\"2\">Вы это заметили?<\/span> <span class=\"sg\" data-s=\"3\">Разница очень важна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам нужна одинарная кавычка внутри строки?<\/span> <span class=\"sg\" data-s=\"1\">Проще всего, конечно, взять двойные кавычки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кстати, настоящий апостроф всё равно лучше, чем одинарная кавычка.<\/span> <span class=\"sg\" data-s=\"1\">Причина в том, что <a href=\"/essentials/on-unicode/\">Raku хорошо работает с Юникодом<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Но настоящая сила двойных кавычек в другом.<\/span> <span class=\"sg\" data-s=\"1\">Они умеют <em>интерполировать<\/em> переменные.<\/span> <span class=\"sg\" data-s=\"2\">Скоро мы увидим, что они могут и выполнять код!<\/span> <span class=\"sg\" data-s=\"3\">Посмотрите на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Как вы можете догадаться, программа печатает <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku убирает имя <code>$name<\/code> вместе с сигилом <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На его место он ставит значение переменной.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku берёт значение переменной в момент интерполяции.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете изменить значение <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потом вы снова интерполируете её.<\/span> <span class=\"sg\" data-s=\"3\">Теперь строка получает новое значение.<\/span> <span class=\"sg\" data-s=\"4\">Давайте проверим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этот раз одна и та же строка даёт разные сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>Hello, Karl!\nHello, Anna!<\/code><\/pre>"]]},"uk":{"t":"Інтерполяція змінних","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У попередніх розділах деякі рядки були в одинарних лапках.<\/span> <span class=\"sg\" data-s=\"1\">Інші рядки були в подвійних лапках.<\/span> <span class=\"sg\" data-s=\"2\">Ви це помітили?<\/span> <span class=\"sg\" data-s=\"3\">Різниця дуже важлива.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам потрібна одинарна лапка всередині рядка?<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший спосіб — це, звісно, подвійні лапки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До речі, справжній апостроф усе ж кращий за одинарну лапку.<\/span> <span class=\"sg\" data-s=\"1\">Причина в тому, що <a href=\"/essentials/on-unicode/\">Raku добре працює з Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Але справжня сила подвійних лапок — в іншому.<\/span> <span class=\"sg\" data-s=\"1\">Вони можуть <em>інтерполювати<\/em> змінні.<\/span> <span class=\"sg\" data-s=\"2\">Скоро ми побачимо, що вони можуть і виконувати код!<\/span> <span class=\"sg\" data-s=\"3\">Подивіться на цю програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Як ви можете здогадатися, програма виводить <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku прибирає ім'я <code>$name<\/code> разом із сигілом <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На його місце він ставить значення змінної.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku бере значення змінної на момент інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете змінити значення <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім ви знову її інтерполюєте.<\/span> <span class=\"sg\" data-s=\"3\">Тепер рядок отримує нове значення.<\/span> <span class=\"sg\" data-s=\"4\">Давайте перевіримо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цього разу той самий рядок створює різні повідомлення:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"bg":{"t":"Променлива интерполация","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В последните раздели някои низове бяха в единични кавички.<\/span> <span class=\"sg\" data-s=\"1\">Други низове бяха в двойни кавички.<\/span> <span class=\"sg\" data-s=\"2\">Забелязахте ли това?<\/span> <span class=\"sg\" data-s=\"3\">Разликата е много важна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трябва ли ви единична кавичка в низа?<\/span> <span class=\"sg\" data-s=\"1\">Най-лесният начин е, разбира се, да използвате двойни кавички:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Между другото, истинският апостроф все пак е по-добър от единичната кавичка.<\/span> <span class=\"sg\" data-s=\"1\">Причината е, че <a href=\"/essentials/on-unicode/\">Raku е добър с Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Но истинската сила на двойните кавички е в друго.<\/span> <span class=\"sg\" data-s=\"1\">Те могат да <em>интерполират<\/em> променливи.<\/span> <span class=\"sg\" data-s=\"2\">Скоро ще видим, че могат и да изпълняват код!<\/span> <span class=\"sg\" data-s=\"3\">Вижте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Както се досещате, програмата отпечатва <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku маха името <code>$name<\/code>, заедно със сигила <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На негово място слага стойността на променливата.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku използва стойността на променливата в момента на интерполацията.<\/span> <span class=\"sg\" data-s=\"1\">Можете да промените стойността на <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">После я интерполирате отново.<\/span> <span class=\"sg\" data-s=\"3\">Сега низът получава новата стойност.<\/span> <span class=\"sg\" data-s=\"4\">Нека го проверим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този път същият низ прави различни съобщения:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"eo":{"t":"Variabla interpolado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la lastaj sekcioj, kelkaj ŝnuroj estis en unuopaj citiloj.<\/span> <span class=\"sg\" data-s=\"1\">Aliaj ŝnuroj estis en duoblaj citiloj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu vi rimarkis tion?<\/span> <span class=\"sg\" data-s=\"3\">La diferenco estas tre grava.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi bezonas unuopan citilon en ŝnuro?<\/span> <span class=\"sg\" data-s=\"1\">La plej facila maniero estas uzi duoblajn citilojn, kompreneble:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cetere, vera apostrofo estas ankoraŭ pli bona ol unuopa citilo.<\/span> <span class=\"sg\" data-s=\"1\">La kialo estas, ke <a href=\"/essentials/on-unicode/\">Raku estas bona pri Unikodo<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sed la vera forto de duoblaj citiloj estas io alia.<\/span> <span class=\"sg\" data-s=\"1\">Ili povas <em>interpoli<\/em> variablojn.<\/span> <span class=\"sg\" data-s=\"2\">Baldaŭ ni vidos, ke ili povas ankaŭ ruli kodon!<\/span> <span class=\"sg\" data-s=\"3\">Rigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiel vi povas diveni, la programo presas <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku forprenas la nomon <code>$name<\/code>, kun la sigelo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi metas la valoron de la variablo en ĝian lokon.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku uzas la valoron de la variablo en la momento de interpolado.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas ŝanĝi la valoron de <code>$name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste vi interpolas ĝin denove.<\/span> <span class=\"sg\" data-s=\"3\">Nun la ŝnuro ricevas la novan valoron.<\/span> <span class=\"sg\" data-s=\"4\">Ni testu ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, la sama ŝnuro faras malsamajn mesaĝojn:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"la":{"t":"Variabile interpolatio","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In sectionibus prioribus quaedam stringae in quotationibus singulis erant.<\/span> <span class=\"sg\" data-s=\"1\">Aliae stringae in quotationibus duplicibus erant.<\/span> <span class=\"sg\" data-s=\"2\">Hocne animadvertisti?<\/span> <span class=\"sg\" data-s=\"3\">Differentia valde gravis est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Singulamne quotationem intra stringam requiris?<\/span> <span class=\"sg\" data-s=\"1\">Via facillima est, scilicet, quotationibus duplicibus uti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ceterum, verus apostrophus adhuc melior est quam singula quotatio.<\/span> <span class=\"sg\" data-s=\"1\">Causa est quod <a href=\"/essentials/on-unicode/\">Raku bonum est in Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sed vera vis quotationum duplicium alia res est.<\/span> <span class=\"sg\" data-s=\"1\">Variabiles <em>interpolare<\/em> possunt.<\/span> <span class=\"sg\" data-s=\"2\">Mox videbimus eas etiam codicem exsequi posse!<\/span> <span class=\"sg\" data-s=\"3\">Specta hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut divinare potes, programma <code>Salve, Karl!<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Raku nomen <code>$nomen<\/code> cum sigillo <code>$<\/code> aufert.<\/span> <span class=\"sg\" data-s=\"2\">Eius loco valorem variabilis ponit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku valorem variabilis momento interpolationis adhibet.<\/span> <span class=\"sg\" data-s=\"1\">Valorem <code>$nomen<\/code> mutare potes.<\/span> <span class=\"sg\" data-s=\"2\">Tum eam iterum interpolas.<\/span> <span class=\"sg\" data-s=\"3\">Nunc stringa novum valorem accipit.<\/span> <span class=\"sg\" data-s=\"4\">Experiamur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";\n\n$nomen = 'Anna';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore eadem stringa diversos nuntios facit:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salve, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Salve, Anna!<\/span><\/p>"]]}}}</script>
