0.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai visto i trattini in alcuni nomi di variabili?<\/span> <span class=\"sg\" data-s=\"1\">Guarda <code>$chair-price<\/code> o <code>$tables-total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, questi nomi vanno benissimo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">A volte due segni del dollaro sono uno accanto all'altro.<\/span> <span class=\"sg\" data-s=\"1\">Non farti confondere.<\/span> <span class=\"sg\" data-s=\"2\">Raku li legge uno per uno.<\/span> <span class=\"sg\" data-s=\"3\">Guarda <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Il primo segno del dollaro è escapato.<\/span> <span class=\"sg\" data-s=\"5\">Quindi è solo un segno del dollaro.<\/span> <span class=\"sg\" data-s=\"6\">Il secondo fa parte del nome della variabile <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutte le stringhe sono tra doppi apici.<\/span> <span class=\"sg\" data-s=\"1\">Così Raku può interpolare le variabili e i caratteri speciali.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Torniamo su questo compito più avanti.<\/span> <span class=\"sg\" data-s=\"1\">Prima impariamo gli array e gli hash.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Pirkumu tabula","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, viens veids, kā to atrisināt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Visi skaitļi ir ierakstīti tieši kodā.<\/span> <span class=\"sg\" data-s=\"1\">Tos glabā vairāki mainīgie.<\/span> <span class=\"sg\" data-s=\"2\">Mēs izmantojam arī reizināšanas operatoru <code>*<\/code>, lai iegūtu rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Vairāk par operatoriem jūs uzzināsiet nākamajās kursa sadaļās.<\/span> <span class=\"sg\" data-s=\"4\">Bet jau tagad tādam kodam kā <code>$chair-price * $chairs<\/code> vajadzētu būt skaidram.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Trīs koda rindas veido izvadi.<\/span> <span class=\"sg\" data-s=\"1\">Tās izdrukā trīs tabulas rindas.<\/span> <span class=\"sg\" data-s=\"2\">Pirmā rinda ir galvene.<\/span> <span class=\"sg\" data-s=\"3\">Apskatiet kolonnas.<\/span> <span class=\"sg\" data-s=\"4\">Starp tām ir tabulācijas rakstzīmes <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Datu rindās ir aizbēgta dolāra zīme: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tajās ir arī dažādi mainīgie.<\/span> <span class=\"sg\" data-s=\"7\">Mēs gribam interpolēt šos mainīgos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izdrukā tabulu:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vai jūs redzējāt defises dažos mainīgo nosaukumos?<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet <code>$chair-price<\/code> vai <code>$tables-total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā tādi nosaukumi ir pilnīgi pareizi.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Dažreiz divas dolāra zīmes stāv blakus.<\/span> <span class=\"sg\" data-s=\"1\">Neļaujiet tam jūs samulsināt.<\/span> <span class=\"sg\" data-s=\"2\">Raku tās lasa pa vienai.<\/span> <span class=\"sg\" data-s=\"3\">Apskatiet <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Pirmā dolāra zīme ir aizbēgta.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc tā ir vienkārši dolāra zīme.<\/span> <span class=\"sg\" data-s=\"6\">Otrā ir daļa no mainīgā nosaukuma <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visas virknes ir dubultajās pēdiņās.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku var interpolēt mainīgos un speciālās rakstzīmes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pie šī uzdevuma mēs atgriezīsimies vēlāk.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms mēs uzzināsim par masīviem un hešiem.<\/span><\/p>"]]},"ru":{"t":"Решение: Таблица покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Все числа записаны прямо в коде.<\/span> <span class=\"sg\" data-s=\"1\">Их хранят несколько переменных.<\/span> <span class=\"sg\" data-s=\"2\">Мы также используем оператор умножения <code>*<\/code>, чтобы получить результат.<\/span> <span class=\"sg\" data-s=\"3\">Об операторах вы узнаете больше в следующих разделах курса.<\/sp их по одному.<\/span> <span class=\"sg\" data-s=\"3\">Посмотрите на <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Первый знак доллара экранирован.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому это просто знак доллара.<\/span> <span class=\"sg\" data-s=\"6\">Второй знак — часть имени переменной <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Все строки стоят в двойных кавычках.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku может интерполировать переменные и специальные символы.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мы вернёмся к этой задаче позже.<\/span> <span class=\"sg\" data-s=\"1\">Сначала мы узнаем о массивах и словарях.<\/span><\/p>"]]},"uk":{"t":"Solution: Таблиця покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб вирішити це завдання:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Усі числа записані прямо в коді.<\/span> <span class=\"sg\" data-s=\"1\">Їх зберігають кілька змінних.<\/span> <span class=\"sg\" data-s=\"2\">Ми також використовуємо оператор множення <code>*<\/code>, щоб отримати результат.<\/span> <span class=\"sg\" data-s=\"3\">Більше про оператори ви дізнаєтеся в наступних розділах курсу.<\/span> <span class=\"sg\" data-s=\"4\">Але навіть зараз код на зразок <code>$chair-price * $chairs<\/code> має бути зрозумілим.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Три рядки коду створюють вивід.<\/span> <span class=\"sg\" data-s=\"1\">Вони друкують три рядки таблиці.<\/span> <span class=\"sg\" data-s=\"2\">Перший рядок — це заголовок.<\/span> <span class=\"sg\" data-s=\"3\">Подивіться на стовпці.<\/span> <span class=\"sg\" data-s=\"4\">Їх розділяють символи табуляції <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">У рядках з даними є екранований знак долара: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">У них також є різні змінні.<\/span> <span class=\"sg\" data-s=\"7\">Ми хочемо інтерполювати ці змінні.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідні дані<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму.<\/span> <span class=\"sg\" data-s=\"1\">Вона друкує таблицю:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви бачили дефіси в деяких іменах змінних?<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на <code>$chair-price<\/code> або <code>$tables-total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У Raku такі імена — цілком нормальні.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Іноді два знаки долара стоять поруч.<\/span> <span class=\"sg\" data-s=\"1\">Це не повинно вас плутати.<\/span> <span class=\"sg\" data-s=\"2\">Raku читає їх по одному.<\/span> <span class=\"sg\" data-s=\"3\">Подивіться на <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Перший знак долара екранований.<\/span> <span class=\"sg\" data-s=\"5\">Тому це просто знак долара.<\/span> <span class=\"sg\" data-s=\"6\">Другий — частина імені змінної <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усі рядки — у подвійних лапках.<\/span> <span class=\"sg\" data-s=\"1\">Тому Raku може інтерполювати змінні і спеціальні символи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми повернемося до цього завдання пізніше.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку вивчимо масиви та хеші.<\/span><\/p>"]]},"bg":{"t":"Solution: Таблица за покупки","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да я решите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всички числа са написани направо в кода.<\/span> <span class=\"sg\" data-s=\"1\">Няколко променливи ги пазят.<\/span> <span class=\"sg\" data-s=\"2\">Използваме и оператора за умножение <code>*<\/code>, за да получим резултата.<\/span> <span class=\"sg\" data-s=\"3\">Ще научите повече за операторите в следващите секции на курса.<\/span> <span class=\"sg\" data-s=\"4\">Но още сега код като <code>$chair-price * $chairs<\/code> трябва да е ясен.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Три реда код правят изхода.<\/span> <span class=\"sg\" data-s=\"1\">Те отпечатват трите реда на таблицата.<\/span> <span class=\"sg\" data-s=\"2\">Първият ред е заглавието.<\/span> <span class=\"sg\" data-s=\"3\">Вижте колоните.<\/span> <span class=\"sg\" data-s=\"4\">Табулационните символи <code>\\t<\/code> ги разделят.<\/span> <span class=\"sg\" data-s=\"5\">Редовете с данни имат избягал знак за долар: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Те имат и различни променливи.<\/span> <span class=\"sg\" data-s=\"7\">Искаме да интерполираме тези променливи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва таблицата:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Видяхте ли тиретата в някои имена на променливи?<\/span> <span class=\"sg\" data-s=\"1\">Вижте <code>$chair-price<\/code> или <code>$tables-total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В Raku такива имена са съвсем наред.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Понякога два знака за долар стоят един до друг.<\/span> <span class=\"sg\" data-s=\"1\">Не се бъркайте от това.<\/span> <span class=\"sg\" data-s=\"2\">Raku ги чете един по един.<\/span> <span class=\"sg\" data-s=\"3\">Вижте <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Първият знак за долар е избягал.<\/span> <span class=\"sg\" data-s=\"5\">Затова той е просто знак за долар.<\/span> <span class=\"sg\" data-s=\"6\">Вторият е част от името на променливата <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всички низове са в двойни кавички.<\/span> <span class=\"sg\" data-s=\"1\">Така Raku може да интерполира променливите и специалните символи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По-късно ще се върнем към тази задача.<\/span> <span class=\"sg\" data-s=\"1\">Първо ще научим за масиви и хешове.<\/span><\/p>"]]},"eo":{"t":"Solvo: Aĉettabelo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj nombroj estas skribitaj rekte en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj variabloj tenas ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ uzas la operatoron de multipliko <code>*<\/code> por ricevi la rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Vi lernos pli pri operatoroj en la sekvaj sekcioj de la kurso.<\/span> <span class=\"sg\" data-s=\"4\">Sed eĉ nun, kodo kiel <code>$chair-price * $chairs<\/code> devus esti klara.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Tri linioj de kodo faras la eligon.<\/span> <span class=\"sg\" data-s=\"1\">Ili presas la tri liniojn de la tabelo.<\/span> <span class=\"sg\" data-s=\"2\">La unua linio estas la kaplinio.<\/span> <span class=\"sg\" data-s=\"3\">Rigardu la kolumnojn.<\/span> <span class=\"sg\" data-s=\"4\">Tabokarakteroj <code>\\t<\/code> apartigas ilin.<\/span> <span class=\"sg\" data-s=\"5\">La datumaj linioj havas eskapitan dolarsignon: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ili ankaŭ havas malsamajn variablojn.<\/span> <span class=\"sg\" data-s=\"7\">Ni volas interpoli tiujn variablojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas la tabelon:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi vidis la streketojn en kelkaj nomoj de variabloj?<\/span> <span class=\"sg\" data-s=\"1\">Rigardu <code>$chair-price<\/code> aŭ <code>$tables-total<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, tiaj nomoj estas tute en ordo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje du dolarsignoj staras unu apud la alia.<\/span> <span class=\"sg\" data-s=\"1\">Ne lasu tion konfuzi vin.<\/span> <span class=\"sg\" data-s=\"2\">Raku legas ilin unu post la alia.<\/span> <span class=\"sg\" data-s=\"3\">Rigardu <code>\\$$price<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La unua dolarsigno estas eskapita.<\/span> <span class=\"sg\" data-s=\"5\">Do ĝi estas nur dolarsigno.<\/span> <span class=\"sg\" data-s=\"6\">La dua estas parto de la nomo de variablo <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj ŝnuroj estas en duoblaj citiloj.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku povas interpoli la variablojn kaj la specialajn karakterojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poste ni revenos al ĉi tiu tasko.<\/span> <span class=\"sg\" data-s=\"1\">Unue, ni lernos pri tabeloj kaj haketoj.<\/span><\/p>"]]},"la":{"t":"Solutio: Tabula emptio","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo id solvere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sella-pretium = 20.57;\nmy $sellae = 4;\nmy $sellae-totalis = $sella-pretium * $sellae;\n\nmy $mensa-pretium = 50.18;\nmy $mensae = 1;\nmy $mensae-totalis = $mensa-pretium * $mensae;\n\nsay \"Item\\tPretium\\tN\\tTotalis\";\nsay \"Sellae\\t\\$$sella-pretium\\t$sellae\\t\\$$sellae-totalis\";\nsay \"Mensae\\t\\$$mensa-pretium\\t$mensae\\t\\$$mensae-totalis\";<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Omnes numeri directe in codice scripti sunt.<\/span> <span class=\"sg\" data-s=\"1\">Variae variabiles eos tenent.<\/span> <span class=\"sg\" data-s=\"2\">Etiam operatore multiplicationis <code>*<\/code> eventum computamus.<\/span> <span class=\"sg\" data-s=\"3\">Plura de operatoribus in proximis sectionibus cursus disces.<\/span> <span class=\"sg\" data-s=\"4\">Sed iam nunc codex ut <code>$sella-pretium * $sellae<\/code> clarus esse debet.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Tres lineae codicis exitum faciunt.<\/span> <span class=\"sg\" data-s=\"1\">Eae tres lineas tabulae imprimunt.<\/span> <span class=\"sg\" data-s=\"2\">Prima linea est caput.<\/span> <span class=\"sg\" data-s=\"3\">Specta columnas.<\/span> <span class=\"sg\" data-s=\"4\">Characteres tabulationis <code>\\t<\/code> eas separant.<\/span> <span class=\"sg\" data-s=\"5\">Lineae datorum signum dollari effugitum habent: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Etiam varias variabiles habent.<\/span> <span class=\"sg\" data-s=\"7\">Has variabiles interpolare volumus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma curre.<\/span> <span class=\"sg\" data-s=\"1\">Tabulam imprimit:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Pretium   N      Totalis\nSellae  $20.57    4      $82.28\nMensae  $50.18    1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vidistine hyphena in quibusdam nominibus variabilium?<\/span> <span class=\"sg\" data-s=\"1\">Specta <code>$sella-pretium<\/code> vel <code>$mensae-totalis<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In Raku talia nomina omnino bona sunt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Interdum duo signa dollari iuxta se stant.<\/span> <span class=\"sg\" data-s=\"1\">Noli propter hoc turbari.<\/span> <span class=\"sg\" data-s=\"2\">Raku ea unum post alterum legit.<\/span> <span class=\"sg\" data-s=\"3\">Specta <code>\\$$pretium<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Primum signum dollari effugitum est.<\/span> <span class=\"sg\" data-s=\"5\">Itaque solum signum dollari est.<\/span> <span class=\"sg\" data-s=\"6\">Secundum est pars nominis variabilis <code>$pretium<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes chordae in quotationibus duplicibus sunt.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku variabiles et characteres speciales interpolare potest.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postea ad hoc munus redimus.<\/span> <span class=\"sg\" data-s=\"1\">Primum de arrayis et hashis discimus.<\/span><\/p>"]]}}}</script>
