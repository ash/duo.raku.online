:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Segno di dollaro <code>\\n<\/code> | Nuova riga <code>\\r<\/code> | Ritorno a capo (torna all'inizio della riga) <code>\\t<\/code> | Tabulazione orizzontale <code>\\\"<\/code> | Doppio apice <code>\\\\<\/code> | Barra rovesciata<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le virgolette intorno a una stringa sono importanti.<\/span> <span class=\"sg\" data-s=\"1\">Dicono a Raku cosa fare con i caratteri speciali.<\/span> <span class=\"sg\" data-s=\"2\">Guarda questi due esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esegui questo programma.<\/span> <span class=\"sg\" data-s=\"1\">La prima stringa resta com'è, su una riga.<\/span> <span class=\"sg\" data-s=\"2\">La seconda stringa ora è in due parti:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tra doppi apici, <code>\\n<\/code> è una sequenza speciale.<\/span> <span class=\"sg\" data-s=\"1\">Raku la trasforma in un carattere di nuova riga.<\/span> <span class=\"sg\" data-s=\"2\">Tra apici singoli, <code>\\n<\/code> sono solo due caratteri normali: <code>\\<\/code> e <code>n<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è un'eccezione interessante per <code>'<\/code> e <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tra apici singoli, puoi fare l'escape di un apice singolo.<\/span> <span class=\"sg\" data-s=\"2\">Metti un <code>\\<\/code> prima dell'apice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte un apice singolo viene dopo una barra rovesciata.<\/span> <span class=\"sg\" data-s=\"1\">Allora devi fare l'escape anche della barra rovesciata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"lv":{"t":"Speciālo rakstzīmju izbēgšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iedomājieties, ka jūs gribat izdrukāt cenu zīmi.<\/span> <span class=\"sg\" data-s=\"1\">Produkta nosaukums ir skalārajā mainīgajā.<\/span> <span class=\"sg\" data-s=\"2\">Cena ir citā skalārajā mainīgajā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Cena ir dolāros.<\/span> <span class=\"sg\" data-s=\"1\">Kā tad izdrukāt zīmi?<\/span> <span class=\"sg\" data-s=\"2\">Jūs gribat šādu izvadi: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bet dubultajās pēdiņās dolāra zīme norāda uz mainīgo.<\/span> <span class=\"sg\" data-s=\"4\">Raku interpolē šo mainīgo.<\/span> <span class=\"sg\" data-s=\"5\">Lai izdrukātu pašu <code>$<\/code>, aizbēdziet to ar atpakaļslīpsvītru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot arī virkņu savienošanu.<\/span> <span class=\"sg\" data-s=\"1\">Tad jums nav jāaizbēg <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Šis variants izdrukā tieši tādu pašu virkni.<\/span> <span class=\"sg\" data-s=\"1\">Bet interpolācija izskatās dabiskāk.<\/span> <span class=\"sg\" data-s=\"2\">To ir vieglāk lasīt.<\/span> <span class=\"sg\" data-s=\"3\">Apskatiet virkni vienkāršajās pēdiņās: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Šeit Raku neinterpolē <code>$<\/code> rakstzīmi.<\/span> <span class=\"sg\" data-s=\"5\">Tas to arī neaizbēg.<\/span> <span class=\"sg\" data-s=\"6\">Tā ir galvenā atšķirība.<\/span> <span class=\"sg\" data-s=\"7\">Vienkāršajās pēdiņās speciālās rakstzīmes paliek tādas, kādas tās ir.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl dažas speciālās rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Virknēs dubultajās pēdiņās tām ir īpaša nozīme:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Dolāra zīme <code>\\n<\/code> | Jauna rinda <code>\\r<\/code> | Karietes atgriešana (atpakaļ uz rindas sākumu) <code>\\t<\/code> | Horizontāla tabulācija <code>\\\"<\/code> | Dubultā pēdiņa <code>\\\\<\/code> | Atpakaļslīpsvītra<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēdiņas ap virkni ir svarīgas.<\/span> <span class=\"sg\" data-s=\"1\">Tās saka Raku, ko darīt ar speciālajām rakstzīmēm.<\/span> <span class=\"sg\" data-s=\"2\">Apskatiet šos divus piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Palaidiet šo programmu.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā virkne paliek tāda, kāda tā ir, vienā rindā.<\/span> <span class=\"sg\" data-s=\"2\">Otrā virkne tagad ir divās daļās:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dubultajās pēdiņās <code>\\n<\/code> ir speciāla secība.<\/span> <span class=\"sg\" data-s=\"1\">Raku to pārvērš par jaunas rindas rakstzīmi.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršajās pēdiņās <code>\\n<\/code> ir vienkārši divas parastas rakstzīmes: <code>\\<\/code> un <code>n<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir interesants izņēmums ar <code>'<\/code> un <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršajās pēdiņās jūs varat aizbēgt vienpēdiņu.<\/span> <span class=\"sg\" data-s=\"2\">Ielieciet tās priekšā <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz aiz atpakaļslīpsvītras ir vienpēdiņa.<\/span> <span class=\"sg\" data-s=\"1\">Tad jums jāaizbēg arī atpakaļslīpsvītra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"ru":{"t":"Экранирование специальных символов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Представьте, что вы хотите напечатать ценник.<\/span> <span class=\"sg\" data-s=\"1\">Название товара хранится в скалярной переменной.<\/span> <span class=\"sg\" data-s=\"2\">Цена хранится в другой скалярной переменной.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Цена в долларах.<\/span> <span class=\"sg\" data-s=\"1\">Как тогда напечатать ценник?<\/span> <span class=\"sg\" data-s=\"2\">Вам нужен такой вывод: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но в двойных кавычках знак доллара обозначает переменную.<\/span> <span class=\"sg\" data-s=\"4\">Raku интерполирует эту переменную.<\/span> <span class=\"sg\" data-s=\"5\">Чтобы напечатать сам знак <code>$<\/code>, экранируйте его обратным слэшем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно также использовать конкатенацию строк.<\/span> <span class=\"sg\" data-s=\"1\">Тогда не нужно экранировать <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Этот вариант печатает точно такую же строку.<\/span> <span class=\"sg\" data-s=\"1\">Но интерполяция выглядит естественнее.<\/span> <span class=\"sg\" data-s=\"2\">Её легче читать.<\/span> <span class=\"sg\" data-s=\"3\">Посмотрите на строку в одинарных кавычках: <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Здесь Raku не интерполирует символ <code>$<\/code>.<\/span> <span cla
