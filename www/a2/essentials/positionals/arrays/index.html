/span> <span class=\"sg\" data-s=\"3\">Così nel nostro esempio <code>@cities[1]<\/code> è <code>'Roma'<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gli array sono mutabili.<\/span> <span class=\"sg\" data-s=\"1\">Questo vuol dire che puoi cambiarli.<\/span> <span class=\"sg\" data-s=\"2\">Per cambiare un elemento, assegnagli un nuovo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Roma';\n@cities[1] = 'Parigi';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo questo, l'istruzione <code>say @cities[1]<\/code> stampa il nuovo valore, <code>'Parigi'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dimensione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Che cos'è la lunghezza di un array?<\/span> <span class=\"sg\" data-s=\"1\">È il numero dei suoi elementi.<\/span> <span class=\"sg\" data-s=\"2\">Per ottenerla, usa il metodo <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte usi un array dove Raku vuole un numero.<\/span> <span class=\"sg\" data-s=\"1\">Allora ottieni la dimensione dell'array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui l'<a href=\"https://course.raku.org/it/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">operatore prefisso <code>+<\/code><\/a> vuole un numero dal suo argomento.<\/span> <span class=\"sg\" data-s=\"1\">Così il risultato di <code>+@cities<\/code> è <code>3<\/code>.<\/span><\/p>"]]},"lv":{"t":"Masīvi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir agregātu datu tipi.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka masīvs var glabāt vairāk nekā vienu vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Ar to masīvi atšķiras no <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem elementiem<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat indeksēt masīva elementus jeb <em>apzīmēt tos ar apakšindeksiem<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Citiem vārdiem sakot, katram elementam ir pozīcija.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc mēs šāda veida datus saucam par pozicionāliem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīva mainīgajiem ir cits sigils: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukuma noteikumi ir tādi paši kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad mums ir masīvs.<\/span> <span class=\"sg\" data-s=\"1\">Tā nosaukums ir <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat ielikt tajā dažas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī izveidot masīvu uzreiz ar vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksēšana<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu vienu masīva elementu, izmantojiet iekavu pāri.<\/span> <span class=\"sg\" data-s=\"1\">Lieciet tās aiz mainīgā nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka sigils nemainās.<\/span> <span class=\"sg\" data-s=\"1\">Tas vienmēr ir <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku skaita elementus no nulles.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc mūsu piemērā <code>@cities[1]<\/code> ir <code>'Roma'<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir maināmi.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka jūs varat tos mainīt.<\/span> <span class=\"sg\" data-s=\"2\">Lai mainītu elementu, vienkārši piešķiriet tam jaunu vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Roma';\n@cities[1] = 'Parīze';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc tam izteiksme <code>say @cities[1]<\/code> izdrukā jauno vērtību <code>'Parīze'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izmērs<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kas ir masīva garums?<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tā elementu skaits.<\/span> <span class=\"sg\" data-s=\"2\">Lai to iegūtu, izmantojiet metodi <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs izmantojat masīvu tur, kur Raku vajag skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs saņemat masīva izmēru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <a href=\"https://course.raku.org/lv/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> prefiksa operatoram<\/a> vajag skaitli no tā argumenta.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>+@cities<\/code> rezultāts ir <code>3<\/code>.<\/span><\/p>"]]},"ru":{"t":"Массивы","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Массивы — это агрегированные типы данных.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что массив может хранить больше одного значения.<\/span> <span class=\"sg\" data-s=\"2\">Этим массивы отличаются от <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных элементов<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Элементы массива можно индексировать, или <em>субскриптировать<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Другими словами, у каждого элемента есть позиция.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому такие данные мы называем позиционными.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У переменных-массивов другой сигил: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для имени такие же, как <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скаляров<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь у нас есть массив.<\/span> <span class=\"sg\" data-s=\"1\">Его имя — <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете положить в него несколько значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете также создать массив вместе со значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексация<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить один элемент массива, используйте пару скобок.<\/span> <span class=\"sg\" data-s=\"1\">Поставьте их после имени переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: сигил не меняется.<\/span> <span class=\"sg\" data-s=\"1\">Это всегда <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku считает элементы с нуля.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому в нашем примере <code>@cities[1]<\/code> — это <code>'Rome'<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Массивы изменяемы.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что их можно менять.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы изменить элемент, просто присвойте ему новое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После этого оператор <code>say @cities[1]<\/code> выводит новое значение, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Что такое длина массива?<\/span> <span class=\"sg\" data-s=\"1\">Это количество его элементов.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы её получить, используйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда вы используете массив там, где Raku нужно число.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы получаете размер массива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <a href=\"https://course.raku.org/ru/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">префиксный оператор <code>+<\/code><\/a> ждёт от своего аргумента число.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому результат <code>+@cities<\/code> — это <code>3<\/code>.<\/span><\/p>"]]},"uk":{"t":"Масиви","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Масиви — це агрегатні типи даних.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що масив може зберігати більше одного значення.<\/span> <span class=\"sg\" data-s=\"2\">Цим масиви відрізняються від <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярних елементів<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете індексувати, або <em>підписувати<\/em>, елементи масиву.<\/span> <span class=\"sg\" data-s=\"4\">Іншими словами, кожен елемент має позицію.<\/span> <span class=\"sg\" data-s=\"5\">Тому ми називаємо такі дані позиційними.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінні-масиви мають інший сигіл: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для імені такі самі, як <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скалярів<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер у нас є масив.<\/span> <span class=\"sg\" data-s=\"1\">Його назва — <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете покласти в нього кілька значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також можете створити масив одразу зі значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Індексація<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати один елемент масиву, використовуйте пару дужок.<\/span> <span class=\"sg\" data-s=\"1\">Поставте їх після імені змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що сигіл не змінюється.<\/span> <span class=\"sg\" data-s=\"1\">Він завжди <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku рахує елементи з нуля.<\/span> <span class=\"sg\" data-s=\"3\">Тож у нашому прикладі <code>@cities[1]<\/code> — це <code>'Rome'<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Масиви є змінними.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що ви можете їх змінювати.<\/span> <span class=\"sg\" data-s=\"2\">Щоб змінити елемент, просто присвойте йому нове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після цього оператор <code>say @cities[1]<\/code> виводить нове значення, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Розмір<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Що таке довжина масиву?<\/span> <span class=\"sg\" data-s=\"1\">Це кількість його елементів.<\/span> <span class=\"sg\" data-s=\"2\">Щоб її отримати, використовуйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді ви використовуєте масив там, де Raku потрібне число.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви отримуєте розмір масиву:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <a href=\"https://course.raku.org/uk/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> префіксний оператор<\/a> потребує числа від свого аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Тож результат <code>+@cities<\/code> — це <code>3<\/code>.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Масивите са агрегатни типове данни.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че един масив може да съдържа повече от една стойност.<\/span> <span class=\"sg\" data-s=\"2\">Това отличава масивите от <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларните елементи<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да индексирате, или <em>подписвате<\/em>, елементите на масива.<\/span> <span class=\"sg\" data-s=\"4\">С други думи, всеки елемент има позиция.<\/span> <span class=\"sg\" data-s=\"5\">Затова наричаме този вид данни позиционни.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивните променливи имат друг сигил: <code>@<\/code>.<\/s вата стойност, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каква е дължината на един масив?<\/span> <span class=\"sg\" data-s=\"1\">Това е броят на неговите елементи.<\/span> <span class=\"sg\" data-s=\"2\">За да я получите, използвайте метода <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога използвате масив там, където Raku иска число.<\/span> <span class=\"sg\" data-s=\"1\">Тогава получавате размера на масива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <a href=\"https://course.raku.org/bg/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">префиксният оператор <code>+<\/code><\/a> иска число от своя аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Така че резултатът от <code>+@cities<\/code> е <code>3<\/code>.<\/span><\/p>"]]},"eo":{"t":"Tabeloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Tabeloj estas agregitaj datumtipoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke tabelo povas teni pli ol unu valoron.<\/span> <span class=\"sg\" data-s=\"2\">Per tio tabeloj diferencas de <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj elementoj<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas indeksi, aŭ <em>subskribi<\/em>, la elementojn de tabelo.<\/span> <span class=\"sg\" data-s=\"4\">Alivorte, ĉiu elemento havas pozicion.<\/span> <span class=\"sg\" data-s=\"5\">Tial ni nomas ĉi tiun specon de datumoj poziciaj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabelaj variabloj havas alian sigelon: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La reguloj por la nomo estas la samaj kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">por skaloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun ni havas tabelon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia nomo estas <code>@urboj<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas meti kelkajn valorojn en ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas krei la tabelon kun valoroj en ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksado<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por preni unu eron de tabelo, uzu paron de krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Metu ilin post la nomon de la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @urboj[1];<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la sigelo ne ŝanĝiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĉiam estas <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Raku nombras la elementojn ekde nulo.<\/span> <span class=\"sg\" data-s=\"3\">Do en nia ekzemplo, <code>@urboj[1]<\/code> estas <code>'Romo'<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tabeloj estas ŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi povas ŝanĝi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Por ŝanĝi eron, simple asignu novan valoron al ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@urboj[0] = 'Romo';\n@urboj[1] = 'Parizo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post tio, la deklaro <code>say @urboj[1]<\/code> presas la novan valoron, <code>'Parizo'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Grandeco<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kio estas la longo de tabelo?<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la nombro de ĝiaj elementoj.<\/span> <span class=\"sg\" data-s=\"2\">Por ricevi ĝin, uzu la metodon <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @urboj.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Foje vi uzas tabelon, kie Raku bezonas nombron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ricevas la grandecon de la tabelo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@urboj; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la <a href=\"https://course.raku.org/eo/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> prefiksa operatoro<\/a> bezonas nombron de sia argumento.<\/span> <span class=\"sg\" data-s=\"1\">Do la rezulto de <code>+@urboj<\/code> estas <code>3<\/code>.<\/span><\/p>"]]},"la":{"t":"Array","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Arrayes sunt genera datorum aggregata.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: array plus quam unum valorem continere potest.<\/span> <span class=\"sg\" data-s=\"2\">Hoc arrays a <a href=\"https://course.raku.org/la/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">scalaribus elementis<\/a> distinguit.<\/span> <span class=\"sg\" data-s=\"3\">Elementa array indicare, vel <em>subscribere<\/em>, potes.<\/span> <span class=\"sg\" data-s=\"4\">Aliis verbis, quodque elementum positionem habet.<\/span> <span class=\"sg\" data-s=\"5\">Ideo hoc genus datorum positionalia vocamus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabiles array aliud sigillum habent: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Regulae pro nomine eaedem sunt ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">pro scalaribus<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\ utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum array adhibes ubi Raku numerum requirit.<\/span> <span class=\"sg\" data-s=\"1\">Tum magnitudinem array accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <a href=\"https://course.raku.org/la/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> praefixus operator<\/a> numerum ex argumento suo requirit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eventus <code>+@cities<\/code> est <code>3<\/code>.<\/span><\/p>"]]}}}</script>
