n><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Призначення списку масиву<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете зберегти список у змінній з сигілом <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Що тоді відбувається?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тоді змінна <code>@data<\/code> містить масив.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете змінювати його елементи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Змінна чи список<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Список незмінний.<\/span> <span class=\"sg\" data-s=\"1\">Але ви все одно можете знову використати його змінну.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете покласти в неї новий список.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"bg":{"t":"Списъци","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Списъците приличат на масиви, но са неизменяеми.<\/span> <span class=\"sg\" data-s=\"1\">Не можете да променяте размера на списък.<\/span> <span class=\"sg\" data-s=\"2\">Не можете да променяте и неговите елементи.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте скоби, за да създадете списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране на списъци<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да вземете един елемент от списък, използвайте квадратни скоби.<\/span> <span class=\"sg\" data-s=\"1\">Сложете индекса в тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но не можете да дадете нова стойност на
