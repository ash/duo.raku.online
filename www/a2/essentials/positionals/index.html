<script type="application/json" id="page-data">{"u":"essentials/positionals","n":210,"k":"section","pv":"essentials/typed-variables/exercises/input-number/solution","nx":"essentials/positionals/arrays","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Positional data types","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Now it is time for more complex data types.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, some data types are positional.<\/span> <span class=\"sg\" data-s=\"2\">You can index them, or <em>subscript<\/em> them.<\/span> <span class=\"sg\" data-s=\"3\">So you can get an element by its number.<\/span> <span class=\"sg\" data-s=\"4\">We already know one positional data type: <a href=\"/essentials/ranges/\">ranges<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This section shows two more positional data types: <code>Array<\/code> and <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The second part of the course tells more about them.<\/span> <span class=\"sg\" data-s=\"2\">We also look at ranges again.<\/span> <span class=\"sg\" data-s=\"3\">This time, we look at them as a positional data type.<\/span><\/p>"]]},"de":{"t":"Positionale Datentypen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jetzt ist es Zeit für komplexere Datentypen.<\/span> <span class=\"sg\" data-s=\"1\">Manche Datentypen in Raku sind Positionsdaten-Typen.<\/span> <span class=\"sg\" data-s=\"2\">Sie können sie indizieren oder <em>subskriptieren<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">So bekommen Sie ein Element über seine Nummer.<\/span> <span class=\"sg\" data-s=\"4\">Wir kennen schon einen Positionsdaten-Typ: <a href=\"https://course.raku.org/de/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">Ranges<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt zeigt zwei weitere Positionsdaten-Typen: <code>Array<\/code> und <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mehr dazu steht im zweiten Teil des Kurses.<\/span> <span class=\"sg\" data-s=\"2\">Wir sehen uns auch Ranges noch einmal an.<\/span> <span class=\"sg\" data-s=\"3\">Diesmal sehen wir sie als Positionsdaten-Typ.<\/span><\/p>"]]},"nl":{"t":"Positionele datentypen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nu is het tijd voor complexere gegevenstypen.<\/span> <span class=\"sg\" data-s=\"1\">In Raku zijn sommige gegevenstypen positioneel.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze indexeren, of <em>subscripten<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Zo krijg je een element met zijn nummer.<\/span> <span class=\"sg\" data-s=\"4\">We kennen al één positioneel gegevenstype: <a href=\"https://course.raku.org/nl/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">reeksen<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Deze sectie laat nog twee positionele gegevenstypen zien: <code>Array<\/code> en <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het tweede deel van de cursus vertelt er meer over.<\/span> <span class=\"sg\" data-s=\"2\">We kijken ook nog een keer naar reeksen.<\/span> <span class=\"sg\" data-s=\"3\">Deze keer bekijken we ze als positioneel gegevenstype.<\/span><\/p>"]]},"es":{"t":"Tipos de datos posicionales","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ahora es hora de ver tipos de datos más complejos.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, algunos tipos de datos son posicionales.<\/span> <span class=\"sg\" data-s=\"2\">Puedes indexarlos, o <em>subscriptarlos<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes obtener un elemento por su número.<\/span> <span class=\"sg\" data-s=\"4\">Ya conocemos un tipo de dato posicional: los <a href=\"https://course.raku.org/es/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">rangos<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta sección muestra dos tipos de datos posicionales más: <code>Array<\/code> y <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La segunda parte del curso cuenta más sobre ellos.<\/span> <span class=\"sg\" data-s=\"2\">También volvemos a ver los rangos.<\/span> <span class=\"sg\" data-s=\"3\">Esta vez, los vemos como un tipo de dato posicional.<\/span><\/p>"]]},"it":{"t":"Tipi di dati posizionali","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ora è il momento di tipi di dati più complessi.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, alcuni tipi di dati sono posizionali.<\/span> <span class=\"sg\" data-s=\"2\">Puoi indicizzarli, o <em>sottoscriverli<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi prendere un elemento con il suo numero.<\/span> <span class=\"sg\" data-s=\"4\">Conosciamo già un tipo di dato posizionale: gli <a href=\"https://course.raku.org/it/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalli<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa sezione mostra altri due tipi di dati posizionali: <code>Array<\/code> e <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La seconda parte del corso dice di più su di loro.<\/span> <span class=\"sg\" data-s=\"2\">Guardiamo anche di nuovo gli intervalli.<\/span> <span class=\"sg\" data-s=\"3\">Questa volta li guardiamo come un tipo di dato posizionale.<\/span><\/p>"]]},"lv":{"t":"Pozicionālie datu tipi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tagad ir laiks sarežģītākiem datu tipiem.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā daži datu tipi ir pozicionāli.<\/span> <span class=\"sg\" data-s=\"2\">Jūs tos varat indeksēt jeb <em>subscriptēt<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tātad jūs varat iegūt elementu pēc tā numura.<\/span> <span class=\"sg\" data-s=\"4\">Mēs jau zinām vienu pozicionālu datu tipu: <a href=\"https://course.raku.org/lv/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">diapazoni<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa parāda vēl divus pozicionālus datu tipus: <code>Array<\/code> un <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kursa otrā daļa par tiem stāsta vairāk.<\/span> <span class=\"sg\" data-s=\"2\">Mēs arī vēlreiz apskatām diapazonus.<\/span> <span class=\"sg\" data-s=\"3\">Šoreiz mēs tos apskatām kā pozicionālu datu tipu.<\/span><\/p>"]]},"ru":{"t":"Позиционные типы данных","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Теперь пора поговорить о более сложных типах данных.<\/span> <span class=\"sg\" data-s=\"1\">В Raku некоторые типы данных — позиционные.<\/span> <span class=\"sg\" data-s=\"2\">Их можно индексировать, или <em>субскриптировать<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">То есть можно получить элемент по его номеру.<\/span> <span class=\"sg\" data-s=\"4\">Один позиционный тип данных мы уже знаем: <a href=\"https://course.raku.org/ru/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазоны<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этом разделе есть ещё два позиционных типа данных: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вторая часть курса рассказывает о них больше.<\/span> <span class=\"sg\" data-s=\"2\">Ещё мы снова смотрим на диапазоны.<\/span> <span class=\"sg\" data-s=\"3\">На этот раз мы смотрим на них как на позиционный тип данных.<\/span><\/p>"]]},"uk":{"t":"Позиційні типи даних","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Тепер час для складніших типів даних.<\/span> <span class=\"sg\" data-s=\"1\">У Raku деякі типи даних позиційні.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете їх індексувати, або <em>субскриптувати<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете отримати елемент за його номером.<\/span> <span class=\"sg\" data-s=\"4\">Ми вже знаємо один позиційний тип даних: <a href=\"https://course.raku.org/uk/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">діапазони<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Цей розділ показує ще два позиційні типи даних: <code>Array<\/code> і <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Друга частина курсу розповідає про них більше.<\/span> <span class=\"sg\" data-s=\"2\">Ми також знову дивимося на діапазони.<\/span> <span class=\"sg\" data-s=\"3\">Цього разу ми дивимося на них як на позиційний тип даних.<\/span><\/p>"]]},"bg":{"t":"Позиционни типове данни","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Сега е време за по-сложни типове данни.<\/span> <span class=\"sg\" data-s=\"1\">В Raku някои типове данни са позиционни.<\/span> <span class=\"sg\" data-s=\"2\">Можете да ги индексирате, или <em>подписвате<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да вземете елемент по неговия номер.<\/span> <span class=\"sg\" data-s=\"4\">Вече знаем един позиционен тип данни: <a href=\"https://course.raku.org/bg/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазоните<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Този раздел показва още два позиционни типа данни: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Втората част на курса разказва повече за тях.<\/span> <span class=\"sg\" data-s=\"2\">Също така пак разглеждаме диапазоните.<\/span> <span class=\"sg\" data-s=\"3\">Този път ги разглеждаме като позиционен тип данни.<\/span><\/p>"]]},"eo":{"t":"Poziciaj datentipoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nun estas tempo por pli kompleksaj datumtipoj.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, kelkaj datumtipoj estas poziciaj.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas indeksi ilin, aŭ <em>subskribi<\/em> ilin.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas preni elementon per ĝia numero.<\/span> <span class=\"sg\" data-s=\"4\">Ni jam konas unu pozician datumtipon: <a href=\"https://course.raku.org/eo/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervaloj<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio montras du pliajn poziciajn datumtipojn: <code>Array<\/code> kaj <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La dua parto de la kurso diras pli pri ili.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ denove rigardas intervalojn.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi-foje ni rigardas ilin kiel pozician datumtipon.<\/span><\/p>"]]},"la":{"t":"Positionalia data genera","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nunc tempus est typorum datorum magis complexorum.<\/span> <span class=\"sg\" data-s=\"1\">In Raku quidam typi datorum sunt positionis.<\/span> <span class=\"sg\" data-s=\"2\">Eos indicare potes, vel <em>subscribere<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sic elementum per numerum eius obtinere potes.<\/span> <span class=\"sg\" data-s=\"4\">Iam unum typum datorum positionis novimus: <a href=\"https://course.raku.org/la/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalla<\/a>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec sectio duos alios typos datorum positionis ostendit: <code>Array<\/code> et <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Secunda pars cursus plura de eis narrat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam intervalla iterum spectamus.<\/span> <span class=\"sg\" data-s=\"3\">Hoc tempore ea ut typum datorum positionis spectamus.<\/span><\/p>"]]}}}</script>
