<script type="application/json" id="page-data">{"u":"essentials/positionals/nested-arrays","n":213,"k":"topic","pv":"essentials/positionals/arrays/quiz","nx":"essentials/positionals/nested-arrays/quiz","tr":["essentials","essentials/positionals"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Nested arrays","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">An array can contain any other data.<\/span> <span class=\"sg\" data-s=\"1\">It can even contain other arrays.<\/span> <span class=\"sg\" data-s=\"2\">These are nested arrays.<\/span> <span class=\"sg\" data-s=\"3\">Use square brackets to show where each nested array starts and ends:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can also add one more pair of brackets.<\/span> <span class=\"sg\" data-s=\"1\">They go around the outer, top-level array.<\/span> <span class=\"sg\" data-s=\"2\">The next example has the same data structure as before.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To get an inner item, add more indices.<\/span> <span class=\"sg\" data-s=\"1\">Add as many as you need.<\/span> <span class=\"sg\" data-s=\"2\">With each pair of square brackets, you go one level deeper:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Prints 4\nsay @table[2][1]; # Prints 200 <\/code><\/pre>"]]},"de":{"t":"Verschachtelte Arrays","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Array kann beliebige andere Daten enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Es kann sogar andere Arrays enthalten.<\/span> <span class=\"sg\" data-s=\"2\">Das sind verschachtelte Arrays.<\/span> <span class=\"sg\" data-s=\"3\">Zeigen Sie mit eckigen Klammern, wo jedes verschachtelte Array beginnt und endet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können auch noch ein Paar Klammern hinzufügen.<\/span> <span class=\"sg\" data-s=\"1\">Die Klammern stehen um das äußere, oberste Array.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Beispiel hat dieselbe Datenstruktur wie vorher.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um ein inneres Element zu bekommen, fügen Sie weitere Indizes hinzu.<\/span> <span class=\"sg\" data-s=\"1\">Nehmen Sie so viele, wie Sie brauchen.<\/span> <span class=\"sg\" data-s=\"2\">Mit jedem Paar eckiger Klammern gehen Sie eine Ebene tiefer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Gibt 4 aus\nsay @table[2][1]; # Gibt 200 aus<\/code><\/pre>"]]},"nl":{"t":"Geneste arrays","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een array kan elke andere soort data bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan zelfs andere arrays bevatten.<\/span> <span class=\"sg\" data-s=\"2\">Dat zijn geneste arrays.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik vierkante haken om te laten zien waar elke geneste array begint en eindigt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook nog een paar haken toevoegen.<\/span> <span class=\"sg\" data-s=\"1\">Die staan rond de buitenste array, op het hoogste niveau.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende voorbeeld heeft dezelfde datastructuur als hiervoor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een item binnenin te krijgen, voeg je meer indices toe.<\/span> <span class=\"sg\" data-s=\"1\">Voeg er zoveel toe als je nodig hebt.<\/span> <span class=\"sg\" data-s=\"2\">Met elk paar vierkante haken ga je een niveau dieper:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Print 4\nsay @table[2][1]; # Print 200 <\/code><\/pre>"]]},"es":{"t":"Arrays anidados","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un arreglo puede contener cualquier otro dato.<\/span> <span class=\"sg\" data-s=\"1\">Incluso puede contener otros arreglos.<\/span> <span class=\"sg\" data-s=\"2\">Estos son arreglos anidados.<\/span> <span class=\"sg\" data-s=\"3\">Usa corchetes para mostrar dónde empieza y termina cada arreglo anidado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También puedes añadir un par más de corchetes.<\/span> <span class=\"sg\" data-s=\"1\">Van alrededor del arreglo exterior, el de nivel superior.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente ejemplo tiene la misma estructura de datos que antes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para obtener un elemento interno, añade más índices.<\/span> <span class=\"sg\" data-s=\"1\">Añade tantos como necesites.<\/span> <span class=\"sg\" data-s=\"2\">Con cada par de corchetes, bajas un nivel más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprime 4\nsay @table[2][1]; # Imprime 200 <\/code><\/pre>"]]},"it":{"t":"Array annidati","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un array può contenere qualsiasi altro dato.<\/span> <span class=\"sg\" data-s=\"1\">Può contenere anche altri array.<\/span> <span class=\"sg\" data-s=\"2\">Questi sono array annidati.<\/span> <span class=\"sg\" data-s=\"3\">Usa le parentesi quadre per mostrare dove ogni array annidato inizia e finisce:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche aggiungere un'altra coppia di parentesi quadre.<\/span> <span class=\"sg\" data-s=\"1\">Vanno intorno all'array esterno, quello di livello superiore.<\/span> <span class=\"sg\" data-s=\"2\">Il prossimo esempio ha la stessa struttura dati di prima.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per prendere un elemento interno, aggiungi altri indici.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungine quanti ti servono.<\/span> <span class=\"sg\" data-s=\"2\">Con ogni coppia di parentesi quadre scendi di un livello:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Stampa 4\nsay @table[2][1]; # Stampa 200 <\/code><\/pre>"]]},"lv":{"t":"Ligzdoti masīvi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Masīvs var saturēt jebkurus citus datus.<\/span> <span class=\"sg\" data-s=\"1\">Tas var saturēt pat citus masīvus.<\/span> <span class=\"sg\" data-s=\"2\">Tie ir ligzdoti masīvi.<\/span> <span class=\"sg\" data-s=\"3\">Ar kvadrātiekavām parādiet, kur katrs ligzdotais masīvs sākas un beidzas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat pievienot arī vēl vienu iekavu pāri.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir ap ārējo, augstākā līmeņa masīvu.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajā piemērā ir tā pati datu struktūra kā iepriekš.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu iekšējo elementu, pievienojiet vairāk indeksu.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojiet tik daudz, cik jums vajag.<\/span> <span class=\"sg\" data-s=\"2\">Ar katru kvadrātiekavu pāri jūs ejat vienu līmeni dziļāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Izdrukā 4\nsay @table[2][1]; # Izdrukā 200 <\/code><\/pre>"]]},"ru":{"t":"Вложенные массивы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Массив может содержать любые другие данные.<\/span> <span class=\"sg\" data-s=\"1\">Он может содержать даже другие массивы.<\/span> <span class=\"sg\" data-s=\"2\">Это вложенные массивы.<\/span> <span class=\"sg\" data-s=\"3\">Используйте квадратные скобки, чтобы показать, где начинается и кончается каждый вложенный массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можно также добавить ещё одну пару скобок.<\/span> <span class=\"sg\" data-s=\"1\">Они стоят вокруг внешнего массива, массива верхнего уровня.<\/span> <span class=\"sg\" data-s=\"2\">В следующем примере та же структура данных, что и раньше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить внутренний элемент, добавьте ещё индексы.<\/span> <span class=\"sg\" data-s=\"1\">Добавьте столько, сколько нужно.<\/span> <span class=\"sg\" data-s=\"2\">С каждой парой квадратных скобок вы спускаетесь на один уровень глубже:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Выводит 4\nsay @table[2][1]; # Выводит 200 <\/code><\/pre>"]]},"uk":{"t":"Вкладені масиви","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Масив може містити будь-які інші дані.<\/span> <span class=\"sg\" data-s=\"1\">Він може містити навіть інші масиви.<\/span> <span class=\"sg\" data-s=\"2\">Це вкладені масиви.<\/span> <span class=\"sg\" data-s=\"3\">Використовуйте квадратні дужки, щоб показати, де починається і де закінчується кожен вкладений масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви також можете додати ще одну пару дужок.<\/span> <span class=\"sg\" data-s=\"1\">Вони стоять навколо зовнішнього масиву, масиву верхнього рівня.<\/span> <span class=\"sg\" data-s=\"2\">Наступний приклад має ту саму структуру даних, що й раніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати внутрішній елемент, додайте більше індексів.<\/span> <span class=\"sg\" data-s=\"1\">Додайте стільки, скільки потрібно.<\/span> <span class=\"sg\" data-s=\"2\">З кожною парою квадратних дужок ви йдете на один рівень глибше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Виведе 4\nsay @table[2][1]; # Виведе 200 <\/code><\/pre>"]]},"bg":{"t":"Вложени масиви","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Масивът може да съдържа всякакви други данни.<\/span> <span class=\"sg\" data-s=\"1\">Той може да съдържа дори други масиви.<\/span> <span class=\"sg\" data-s=\"2\">Това са вложени масиви.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте квадратни скоби, за да покажете къде започва и къде свършва всеки вложен масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да добавите и още една двойка скоби.<\/span> <span class=\"sg\" data-s=\"1\">Те стоят около външния масив на най-високо ниво.<\/span> <span class=\"sg\" data-s=\"2\">Следващият пример има същата структура от данни като преди.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да вземете вътрешен елемент, добавете още индекси.<\/span> <span class=\"sg\" data-s=\"1\">Добавете толкова, колкото ви трябват.<\/span> <span class=\"sg\" data-s=\"2\">С всяка двойка квадратни скоби слизате едно ниво по-дълбоко:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Извежда 4\nsay @table[2][1]; # Извежда 200 <\/code><\/pre>"]]},"eo":{"t":"Nestitaj tabeloj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tabelo povas enhavi ajnajn aliajn datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi eĉ povas enhavi aliajn tabelojn.<\/span> <span class=\"sg\" data-s=\"2\">Tiuj estas nestitaj tabeloj.<\/span> <span class=\"sg\" data-s=\"3\">Uzu kvadratajn krampojn por montri, kie ĉiu nestita tabelo komenciĝas kaj finiĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas aldoni unu plian paron de krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili iras ĉirkaŭ la ekstera, supra-nivela tabelo.<\/span> <span class=\"sg\" data-s=\"2\">La sekva ekzemplo havas la saman datumstrukturon kiel antaŭe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por preni internan eron, aldonu pliajn indeksojn.<\/span> <span class=\"sg\" data-s=\"1\">Aldonu tiom, kiom vi bezonas.<\/span> <span class=\"sg\" data-s=\"2\">Per ĉiu paro de kvadrataj krampoj, vi iras unu nivelon pli profunden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Presas 4\nsay @table[2][1]; # Presas 200 <\/code><\/pre>"]]},"la":{"t":"Nidificata array","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tabula quaelibet alia data continere potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam alias tabulas continere potest.<\/span> <span class=\"sg\" data-s=\"2\">Hae sunt tabulae nidificatae.<\/span> <span class=\"sg\" data-s=\"3\">Claudibus quadratis utere, ut ostendas ubi quaeque tabula nidificata incipit et desinit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam aliud par claudium addere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ea tabulam exteriorem summi gradus circumdant.<\/span> <span class=\"sg\" data-s=\"2\">Proximum exemplum eandem structuram datorum habet ac prius.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut rem interiorem obtineas, plures indices adde.<\/span> <span class=\"sg\" data-s=\"1\">Tot adde quot requiris.<\/span> <span class=\"sg\" data-s=\"2\">Cum quoque pari claudium quadratorum, uno gradu profundius descendis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprimit 4\nsay @table[2][1]; # Imprimit 200 <\/code><\/pre>"]]}}}</script>
