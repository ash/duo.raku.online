arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Die Zeile zeigt drei Dinge.<\/span> <span class=\"sg\" data-s=\"1\">Das erste ist die Veröffentlichung von Raku++ selbst: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das zweite ist das Datum des Builds.<\/span> <span class=\"sg\" data-s=\"3\">Das dritte ist die Plattform für diese Programmdatei.<\/span> <span class=\"sg\" data-s=\"4\">Die Version der Sprache Raku ist etwas anderes.<\/span> <span class=\"sg\" data-s=\"5\">Sie können die Sprache selbst fragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie das mit der Versionsmeldung von Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Sie steht auf der <a href=\"https://course.raku.org/de/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Seite zur Rakudo-Installation<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">So sehen Sie, wie die beiden Compiler ihre Versionen zeigen.<\/span><\/p>"]]},"nl":{"t":"Raku++ installeren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je kunt Raku++ krijgen via zijn website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Het staat ook op GitHub: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Als je het installeert, krijg je één programmabestand: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je hoeft verder niets in te stellen.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ heeft geen aparte virtuele machine om te installeren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het installatieprogramma<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Op macOS, Linux en de BSD's heb je maar één opdracht nodig.<\/span> <span class=\"sg\" data-s=\"1\"  C++ geschreven. Je kunt het dus ook zelf bouwen vanaf de broncode. De repository zegt welke hulpmiddelen je nodig hebt.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Welke versie heb je?<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de optie <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De regel toont drie dingen.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is de uitgave van Raku++ zelf: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het tweede is de datum van de build.<\/span> <span class=\"sg\" data-s=\"3\">Het derde is het platform voor dit programmabestand.<\/span> <span class=\"sg\" data-s=\"4\">De versie van de taal Raku is iets anders.<\/span> <span class=\"sg\" data-s=\"5\">Die kun je aan de taal zelf vragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vergelijk dit met de versieregel van Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Die staat op de <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">installatiepagina van Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Je ziet hoe de twee compilers hun versies laten zien.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Raku++","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puedes obtener Raku++ de su sitio web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">También está en GitHub: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando lo instalas, recibes un solo archivo de programa: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">No necesitas configurar nada más.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ no tiene ninguna máquina virtual aparte para instalar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El instalador<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En macOS, Linux y los sistemas BSD, solo necesitas un comando.<\/span> <span class=\"sg\" data-s=\"1\">Descarga la versión para tu ordenador.<\/span> <span class=\"sg\" data-s=\"2\">Comprueba la versión.<\/span> <span class=\"sg\" data-s=\"3\">Después pone <code>rakupp<\/code> en tu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">No necesita permisos de administrador:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En Windows, usa en cambio una ventana de PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Otra forma es el programa de instalación, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes descargarlo de la página de versiones del repositorio.<\/span> <span class=\"sg\" data-s=\"3\">Este es el comando para PowerShell:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El instalador te pregunta si también quieres el nombre <code>raku<\/code> para Raku++.<\/span> <span class=\"sg\" data-s=\"1\">Después, abre una terminal nueva.<\/span> <span class=\"sg\" data-s=\"2\">Así el nuevo <code>PATH<\/code> empieza a funcionar.<\/span> <span class=\"sg\" data-s=\"3\">Más adelante, <code>rakupp upgrade<\/code> lo actualiza a la versión más nueva.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otras formas de instalarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">En macOS, con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, no necesitas instalar nada. <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> inicia el REPL interactivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Hay archivos comprimidos ya preparados para cada plataforma. Están en la página de versiones del repositorio.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ está escrito en C++. Así que también puedes compilarlo tú mismo a partir del código fuente. El repositorio dice qué herramientas necesitas.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Qué versión tienes?<\/span> <span class=\"sg\" data-s=\"1\">Usa la opción <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La línea muestra tres cosas.<\/span> <span class=\"sg\" data-s=\"1\">La primera es la versión del propio Raku++: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La segunda es la fecha de la compilación.<\/span> <span class=\"sg\" data-s=\"3\">La tercera es la plataforma de este archivo de programa.<\/span> <span class=\"sg\" data-s=\"4\">La versión del lenguaje Raku es otra cosa.<\/span> <span class=\"sg\" data-s=\"5\">Puedes preguntarle al propio lenguaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Compara esto con el mensaje de versión de Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Está en la <a href=\"https://course.raku.org/es/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">página de instalación de Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes ver cómo muestran sus versiones los dos compiladores.<\/span><\/p>"]]},"it":{"t":"Come installare Raku++","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puoi prendere Raku++ dal suo sito web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">È anche su GitHub: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Quando lo installi, ricevi un solo file di programma: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Non devi configurare nient'altro.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ non ha una macchina virtuale separata da installare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma di installazione<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Su macOS, Linux e i sistemi BSD, ti serve un solo comando.<\/span> <span class=\"sg\" data-s=\"1\">Scarica la build per il tuo computer.<\/span> <span class=\"sg\" data-s=\"2\">Controlla la build.<\/span> <span class=\"sg\" data-s=\"3\">Poi mette <code>rakupp<\/code> nel tuo <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Non servono i diritti di amministratore:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Su Windows, usa invece una finestra di PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Un altro modo è il programma di installazione, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi scaricarlo dalla pagina delle release del repository.<\/span> <span class=\"sg\" data-s=\"3\">Ecco il comando per PowerShell:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il programma di installazione chiede se vuoi anche il nome <code>raku<\/code> per Raku++.<\/span> <span class=\"sg\" data-s=\"1\">Dopo, apri un nuovo terminale.<\/span> <span class=\"sg\" data-s=\"2\">Allora il nuovo <code>PATH<\/code> inizia a funzionare.<\/span> <span class=\"sg\" data-s=\"3\">Più tardi, <code>rakupp upgrade<\/code> lo aggiorna all'ultima release.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri modi per installarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Su macOS, con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, non devi installare niente. <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> avvia il REPL interattivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Ci sono archivi già pronti per ogni piattaforma. Si trovano nella pagina delle release del repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ è scritto in C++. Quindi puoi anche compilarlo tu dal codice sorgente. Il repository dice quali strumenti ti servono.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quale versione hai?<\/span> <span class=\"sg\" data-s=\"1\">Usa l'opzione <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La riga mostra tre cose.<\/span> <span class=\"sg\" data-s=\"1\">La prima è la release di Raku++ stesso: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La seconda è la data della build.<\/span> <span class=\"sg\" data-s=\"3\">La terza è la piattaforma per questo file di programma.<\/span> <span class=\"sg\" data-s=\"4\">La versione del linguaggio Raku è un'altra cosa.<\/span> <span class=\"sg\" data-s=\"5\">Puoi chiederla al linguaggio stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Confronta questo con il messaggio di versione di Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Si trova nella <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina di installazione di Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi vedere come i due compilatori mostrano le loro versioni.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku++ var dabūt tā tīmekļa vietnē, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir arī GitHub vietnē: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Kad jūs to instalējat, jūs saņemat vienu programmas failu: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jums nekas cits nav jāiestata.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ nav jāinstalē atsevišķa virtuālā mašīna.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzstādītājs<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">macOS, Linux un BSD sistēmās jums vajag tikai vienu komandu.<\/span> <span class=\"sg\" data-s=\"1\">Tā lejupielādē būvējumu jūsu datoram.<\/span> <span class=\"sg\" data-s=\"2\">Tā pārbauda būvējumu.<\/span> <span class=\"sg\" data-s=\"3\">Tad tā pievieno <code>rakupp<\/code> jūsu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tai nevajag administratora tiesības:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Windows sistēmā tā vietā lietojiet PowerShell logu.<\/span> <span class=\"sg\" data-s=\"1\">Cits veids ir instalēšanas programma, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">To var lejupielādēt no repozitorija izlaidumu lappuses.<\/span> <span class=\"sg\" data-s=\"3\">Šeit ir komanda PowerShell logam:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzstādītājs jautā, vai jūs gribat Raku++ arī ar nosaukumu <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam atveriet jaunu termināli.<\/span> <span class=\"sg\" data-s=\"2\">Tad jaunais <code>PATH<\/code> sāk darboties.<\/span> <span class=\"sg\" data-s=\"3\">Vēlāk <code>rakupp upgrade<\/code> to atjaunina uz jaunāko izlaidumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi instalēšanas veidi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">macOS sistēmā, ar Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ar Docker jums nekas nav jāinstalē. <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> palaiž interaktīvo REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Katrai platformai ir gatavi arhīvi. Tie ir repozitorija izlaidumu lappusē.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ ir uzrakstīts C++ valodā. Tāpēc jūs varat arī paši to uzbūvēt no pirmkoda. Repozitorijs saka, kādi rīki jums vajadzīgi.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kāda versija jums ir?<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet opciju <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rinda rāda trīs lietas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā ir paša Raku++ izlaidums: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Otrā ir būvējuma datums.<\/span> <span class=\"sg\" data-s=\"3\">Trešā ir šī programmas faila platforma.<\/span> <span class=\"sg\" data-s=\"4\">Raku valodas versija ir cita lieta.<\/span> <span class=\"sg\" data-s=\"5\">To jūs varat pajautāt pašai valodai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar Rakudo versijas paziņojumu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo instalēšanas lappusē<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs redzēsiet, kā abi kompilatori rāda savas versijas.<\/span><\/p>"]]},"ru":{"t":"Как установить Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku++ можно скачать с его сайта, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Он также есть на GitHub: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Когда вы его устанавливаете, вы получаете один файл программы: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Больше ничего настраивать не нужно.<\/span> <span class=\"sg\" data-s=\"4\">У Raku++ нет отдельной виртуальной машины для установки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установщик<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В macOS, Linux и системах BSD нужна только одна команда.<\/span> <span class=\"sg\" data-s=\"1\">Она скачивает сборку для вашего компьютера.<\/span> <span class=\"sg\" data-s=\"2\">Она проверяет сборку.<\/span> <span class=\"sg\" data-s=\"3\">Потом она добавляет <code>rakupp<\/code> в ваш <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ей не нужны права администратора:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В Windows вместо этого используйте окно PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Другой способ — программа установки, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Её можно скачать со страницы релизов репозитория.<\/span> <span class=\"sg\" data-s=\"3\">Вот команда для PowerShell:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Установщик спрашивает, нужно ли вам ещё имя <code>raku<\/code> для Raku++.<\/span> <span class=\"sg\" data-s=\"1\">После этого откройте новый терминал.<\/span> <span class=\"sg\" data-s=\"2\">Тогда новый <code>PATH<\/code> начнёт работать.<\/span> <span class=\"sg\" data-s=\"3\">Позже <code>rakupp upgrade<\/code> обновит его до самого нового выпуска.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие способы установки<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">В macOS, через Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">С Docker вам не нужно ничего устанавливать. Команда <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускает интерактивную оболочку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Есть готовые архивы для каждой платформы. Они лежат на странице релизов репозитория.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ написан на C++. Поэтому вы можете сами собрать его из исходного кода. В репозитории написано, какие инструменты вам нужны.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Какая у вас версия?<\/span> <span class=\"sg\" data-s=\"1\">Используйте опцию <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Эта строка показывает три вещи.<\/span> <span class=\"sg\" data-s=\"1\">Первая — выпуск самого Raku++: <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вторая — дата сборки.<\/span> <span class=\"sg\" data-s=\"3\">Третья — платформа для этого файла программы.<\/span> <span class=\"sg\" data-s=\"4\">Версия языка Raku — это другое.<\/span> <span class=\"sg\" data-s=\"5\">Вы можете спросить её у самого языка:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сравните это с сообщением о версии Rakudo.<\/span> <span class=\"sg\" data-s=\"1\">Оно есть на <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">странице установки Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Вы увидите, как два компилятора показывают свои версии.<\/span><\/p>"]]},"uk":{"t":"Як встановити Raku++","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви можете взяти Raku++ з його сайту, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Він також є на GitHub: <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Коли ви його встановите, ви отримаєте один файл програми: <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вам не треба більше нічого налаштовувати.<\/span> <span class=\"sg\" data-s=\"4\">У Raku++ немає окремої віртуальної машини для встановлення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлювач<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У macOS, Linux і системах BSD вам потрібна лише одна команда.<\/span> <span class=\"sg\" data-s=\"1\">Вона завантажує збірку для вашого комп'ютера.<\/span> <span class=\"sg\" data-s=\"2\">Вона перевіряє збірку.<\/span> <span class=\"sg\" data-s=\"3\">Потім вона додає <code>rakupp<\/code> до вашого <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Їй не потрібні права адміністратора:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У Windows натомість використайте вікно PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Інший спосіб — програма встановлення, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете завантажити її зі сторінки випусків репозиторію.<\/span> <span class=\"sg\" data-s=\"3\">Ось команда для PowerShell:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Встановлювач питає, чи хочете ви також назву <code>raku<\/code> для Raku++.<\/span> <span class=\"sg\" data-s=\"1\">Після цього відкрийте новий термінал.<\/span> <span class=\"sg\" data-s=\"2\">Тоді новий <code>PATH<\/code> почне працювати.<\/span> <span class=\"sg\" data-s=\"3\">Пізніше <code>rakupp upgrade<\/code> оновить його до найновішого випуску.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші способи встановлення<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">У macOS, з Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">З Docker вам не треба нічого встановлювати. <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускає інтерактивну оболонку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Є готові архіви для кожної платформи. Вони лежать на сторінці випусків репозиторію.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ написано мовою C++. Тож ви можете й самі зібрати його з вихідного коду. Репозиторій каже, які інструменти вам потрібні.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h
