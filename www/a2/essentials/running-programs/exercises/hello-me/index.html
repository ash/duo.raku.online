Poste donu la dosieron al la komandlinia interpretilo.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ rulu ĝin en alia maniero el la pli fruaj paĝoj.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu vi volas vidi ekzemplon?<\/span> <span class=\"sg\" data-s=\"5\">Aŭ ĉu via programo ne funkcias pro iu kialo?<\/span> <span class=\"sg\" data-s=\"6\">Tiam rigardu la funkciantan solvon.<\/span> <span class=\"sg\" data-s=\"7\">La ligilo estas sube.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/running-programs/exercises/hello-me/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Salve, me!","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Scribe programma et id exsequere.<\/span> <span class=\"sg\" data-s=\"1\">Salutationem cum nomine tuo imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Serva programma in fasciculo.<\/span> <span class=\"sg\" data-s=\"3\">Exsequere id ex linea mandati.<\/span> <span class=\"sg\" data-s=\"4\">Si vis, <a href=\"https://course.raku.org/la/essentials/running-programs/\" target=\"_blank\" rel=\"noopener\">programma exsequere<\/a> online vel directe ex IDE.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic vides quomodo programma exsequaris.<\/span> <span class=\"sg\" data-s=\"1\">Etiam output eius vides:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello-me.raku\nSalve, Andreas!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Conare hoc opus ipse solvere.<\/span> <span class=\"sg\" data-s=\"1\">Serva codicem in fasciculo.<\/span> <span class=\"sg\" data-s=\"2\">Deinde fasciculum interpreti lineae mandati da.<\/span> <span class=\"sg\" data-s=\"3\">Aut eum alio modo ex paginis prioribus exsequere.<\/span> <span class=\"sg\" data-s=\"4\">Visne exemplum videre?<\/span> <span class=\"sg\" data-s=\"5\">An programma tuum aliqua de causa non operatur?<\/span> <span class=\"sg\" data-s=\"6\">Tum solutionem operantem inspice.<\/span> <span class=\"sg\" data-s=\"7\">Nexus infra est.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/running-programs/exercises/hello-me/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
