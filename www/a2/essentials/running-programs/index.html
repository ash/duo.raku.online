<script type="application/json" id="page-data">{"u":"essentials/running-programs","n":14,"k":"section","pv":"essentials/on-unicode","nx":"essentials/running-programs/from-command-line","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Running programs","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">one of the earlier sections<\/a>, we wrote a simple program.<\/span> <span class=\"sg\" data-s=\"1\">But we did not run it yet.<\/span> <span class=\"sg\" data-s=\"2\">There are many ways to run a program.<\/span> <span class=\"sg\" data-s=\"3\">You can use a command-line tool on your computer.<\/span> <span class=\"sg\" data-s=\"4\">You can use a REPL shell.<\/span> <span class=\"sg\" data-s=\"5\">You can run the program directly from an <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">You can use an online service, like <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Or you can use a docker container.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This section has five topics.<\/span> <span class=\"sg\" data-s=\"1\">You can read all of them.<\/span> <span class=\"sg\" data-s=\"2\">Or you can read only the ones you need.<\/span> <span class=\"sg\" data-s=\"3\">After the topics, there is a task.<\/span><\/p>"]]},"de":{"t":"Programme ausführen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">einem der früheren Abschnitte<\/a> haben wir ein einfaches Programm geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Aber wir haben es noch nicht ausgeführt.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt viele Wege, ein Programm auszuführen.<\/span> <span class=\"sg\" data-s=\"3\">Sie können ein Befehlszeilentool auf Ihrem Computer benutzen.<\/span> <span class=\"sg\" data-s=\"4\">Sie können eine REPL-Shell benutzen.<\/span> <span class=\"sg\" data-s=\"5\">Sie können das Programm direkt aus einer <a href=\"/essentials/editors-and-ides/\">IDE<\/a> ausführen.<\/span> <span class=\"sg\" data-s=\"6\">Sie können einen Online-Dienst benutzen, wie <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Oder Sie können einen Docker-Container benutzen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt hat fünf Themen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können alle lesen.<\/span> <span class=\"sg\" data-s=\"2\">Oder Sie lesen nur die Themen, die Sie brauchen.<\/span> <span class=\"sg\" data-s=\"3\">Nach den Themen gibt es eine Aufgabe.<\/span><\/p>"]]},"nl":{"t":"Programma's uitvoeren","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">een van de vorige secties<\/a> hebben we een eenvoudig programma geschreven.<\/span> <span class=\"sg\" data-s=\"1\">Maar we hebben het nog niet uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn veel manieren om een programma uit te voeren.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt een opdrachtregelprogramma op je computer gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt een REPL-shell gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Je kunt het programma direct vanuit een <a href=\"/essentials/editors-and-ides/\">IDE<\/a> uitvoeren.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt een online dienst gebruiken, zoals <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Of je gebruikt een docker-container.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Deze sectie heeft vijf onderwerpen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze allemaal lezen.<\/span> <span class=\"sg\" data-s=\"2\">Of je leest alleen de onderwerpen die je nodig hebt.<\/span> <span class=\"sg\" data-s=\"3\">Na de onderwerpen is er een opdracht.<\/span><\/p>"]]},"es":{"t":"Ejecución de programas","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">una de las secciones anteriores<\/a>, escribimos un programa simple.<\/span> <span class=\"sg\" data-s=\"1\">Pero todavía no lo ejecutamos.<\/span> <span class=\"sg\" data-s=\"2\">Hay muchas formas de ejecutar un programa.<\/span> <span class=\"sg\" data-s=\"3\">Puedes usar una herramienta de línea de comandos en tu ordenador.<\/span> <span class=\"sg\" data-s=\"4\">Puedes usar un shell REPL.<\/span> <span class=\"sg\" data-s=\"5\">Puedes ejecutar el programa directamente desde un <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Puedes usar un servicio en línea, como <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">O puedes usar un contenedor de Docker.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta sección tiene cinco temas.<\/span> <span class=\"sg\" data-s=\"1\">Puedes leerlos todos.<\/span> <span class=\"sg\" data-s=\"2\">O puedes leer solo los que necesitas.<\/span> <span class=\"sg\" data-s=\"3\">Después de los temas, hay una tarea.<\/span><\/p>"]]},"it":{"t":"Esecuzione dei programmi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una delle sezioni precedenti<\/a> abbiamo scritto un semplice programma.<\/span> <span class=\"sg\" data-s=\"1\">Ma non l'abbiamo ancora eseguito.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono molti modi per eseguire un programma.<\/span> <span class=\"sg\" data-s=\"3\">Puoi usare uno strumento da riga di comando sul tuo computer.<\/span> <span class=\"sg\" data-s=\"4\">Puoi usare una shell REPL.<\/span> <span class=\"sg\" data-s=\"5\">Puoi eseguire il programma direttamente da un <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Puoi usare un servizio online, come <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Oppure puoi usare un container docker.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa sezione ha cinque argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Puoi leggerli tutti.<\/span> <span class=\"sg\" data-s=\"2\">Oppure puoi leggere solo quelli che ti servono.<\/span> <span class=\"sg\" data-s=\"3\">Dopo gli argomenti, c'è un compito.<\/span><\/p>"]]},"lv":{"t":"Programmu palaišana","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\"><a href=\"/essentials/hello-world/\">Vienā no iepriekšējām sadaļām<\/a> mēs uzrakstījām vienkāršu programmu.<\/span> <span class=\"sg\" data-s=\"1\">Bet mēs to vēl nepalaidām.<\/span> <span class=\"sg\" data-s=\"2\">Ir daudz veidu, kā palaist programmu.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat lietot komandrindas rīku savā datorā.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat lietot REPL čaulu.<\/span> <span class=\"sg\" data-s=\"5\">Jūs varat palaist programmu tieši no <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat lietot tiešsaistes pakalpojumu, piemēram, <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Vai arī jūs varat lietot docker konteineru.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā ir pieci temati.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat izlasīt tos visus.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī jūs varat izlasīt tikai tos, kas jums vajadzīgi.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tematiem ir uzdevums.<\/span><\/p>"]]},"ru":{"t":"Запуск программ","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одной из прошлых глав<\/a> мы написали простую программу.<\/span> <span class=\"sg\" data-s=\"1\">Но мы её ещё не запускали.<\/span> <span class=\"sg\" data-s=\"2\">Есть много способов запустить программу.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете использовать инструмент командной строки на своём компьютере.<\/span> <span class=\"sg\" data-s=\"4\">Вы можете использовать оболочку REPL.<\/span> <span class=\"sg\" data-s=\"5\">Вы можете запустить программу прямо из <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Вы можете использовать онлайн-сервис, например <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Или вы можете использовать docker-контейнер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этой теме есть пять глав.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете прочитать их все.<\/span> <span class=\"sg\" data-s=\"2\">Или можно прочитать только нужные.<\/span> <span class=\"sg\" data-s=\"3\">После глав идёт задание.<\/span><\/p>"]]},"uk":{"t":"Запуск програм","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одному з попередніх розділів<\/a> ми написали просту програму.<\/span> <span class=\"sg\" data-s=\"1\">Але ми ще не запускали її.<\/span> <span class=\"sg\" data-s=\"2\">Є багато способів запустити програму.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете використати інструмент командного рядка на вашому комп'ютері.<\/span> <span class=\"sg\" data-s=\"4\">Ви можете використати оболонку REPL.<\/span> <span class=\"sg\" data-s=\"5\">Ви можете запустити програму прямо з <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Ви можете використати онлайн-сервіс, наприклад <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Або ви можете використати docker-контейнер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі є п'ять тем.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете прочитати їх усі.<\/span> <span class=\"sg\" data-s=\"2\">Або ви можете прочитати лише ті, які вам потрібні.<\/span> <span class=\"sg\" data-s=\"3\">Після тем є завдання.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на програми","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">една от предишните секции<\/a> написахме проста програма.<\/span> <span class=\"sg\" data-s=\"1\">Но още не я стартирахме.<\/span> <span class=\"sg\" data-s=\"2\">Има много начини да стартирате програма.<\/span> <span class=\"sg\" data-s=\"3\">Можете да използвате команден инструмент на вашия компютър.<\/span> <span class=\"sg\" data-s=\"4\">Можете да използвате REPL shell.<\/span> <span class=\"sg\" data-s=\"5\">Можете да стартирате програмата директно от <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Можете да използвате онлайн услуга, като <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Или можете да използвате docker контейнер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази секция има пет теми.<\/span> <span class=\"sg\" data-s=\"1\">Можете да прочетете всички.<\/span> <span class=\"sg\" data-s=\"2\">Или можете да прочетете само тези, които ви трябват.<\/span> <span class=\"sg\" data-s=\"3\">След темите има задача.<\/span><\/p>"]]},"eo":{"t":"Lanĉado de programoj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">unu el la pli fruaj sekcioj<\/a>, ni skribis simplan programon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ni ankoraŭ ne rulis ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Estas multaj manieroj ruli programon.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas uzi komandlinian ilon en via komputilo.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas uzi REPL-ŝelon.<\/span> <span class=\"sg\" data-s=\"5\">Vi povas ruli la programon rekte el <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Vi povas uzi retan servon, kiel <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Aŭ vi povas uzi docker-ujon.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio havas kvin temojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas legi ĉiujn.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ vi povas legi nur tiujn, kiujn vi bezonas.<\/span> <span class=\"sg\" data-s=\"3\">Post la temoj, estas tasko.<\/span><\/p>"]]},"la":{"t":"Currendo programmata","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una ex sectionibus prioribus<\/a> programma simplex scripsimus.<\/span> <span class=\"sg\" data-s=\"1\">Sed id nondum cucurrimus.<\/span> <span class=\"sg\" data-s=\"2\">Multae viae sunt ad programma currendum.<\/span> <span class=\"sg\" data-s=\"3\">Instrumentum lineae mandati in computatro tuo adhibere potes.<\/span> <span class=\"sg\" data-s=\"4\">REPL concham adhibere potes.<\/span> <span class=\"sg\" data-s=\"5\">Programma directe ex <a href=\"/essentials/editors-and-ides/\">IDE<\/a> currere potes.<\/span> <span class=\"sg\" data-s=\"6\">Servitium online adhibere potes, ut <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"7\">Aut continens docker adhibere potes.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec sectio quinque argumenta habet.<\/span> <span class=\"sg\" data-s=\"1\">Omnia legere potes.<\/span> <span class=\"sg\" data-s=\"2\">Aut sola necessaria legere potes.<\/span> <span class=\"sg\" data-s=\"3\">Post argumenta est exercitatio.<\/span><\/p>"]]}}}</script>
