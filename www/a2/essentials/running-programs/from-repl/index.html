,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"de":{"t":"Ausführen von REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL steht für <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein eingebauter Shell-Modus.<\/span> <span class=\"sg\" data-s=\"2\">Sie geben Anweisungen ein.<\/span> <span class=\"sg\" data-s=\"3\">Nach jeder Anweisung sehen Sie das Ergebnis auf dem Bildschirm.<\/span> <span class=\"sg\" data-s=\"4\">Sie sehen den Zustand der Variablen.<\/span> <span class=\"sg\" data-s=\"5\">Sie sehen auch die Ausgabe Ihres Programms.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Geben Sie das ein, um die Rakudo-Shell zu starten:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe hängt von Ihrer Version des Compilers ab.<\/span> <span class=\"sg\" data-s=\"1\">In der Ausgabe oben schlägt die Shell vor, einige Module zu installieren.<\/span> <span class=\"sg\" data-s=\"2\">Mit ihnen ist die Shell angenehmer.<\/span> <span class=\"sg\" data-s=\"3\">Darum sehen Sie diese Nachricht.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Am Ende sehen Sie das Prompt-Zeichen <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hier geben Sie Ihr Programm oder Teile davon ein.<\/span> <span class=\"sg\" data-s=\"2\">Die Shell kompiliert Ihren Code Zeile für Zeile.<\/span> <span class=\"sg\" data-s=\"3\">Das macht sie, wenn Sie die Eingabetaste drücken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"nl":{"t":"Uitvoeren vanaf REPL","b":[["p", ntegrado.<\/span> <span class=\"sg\" data-s=\"2\">Escribes instrucciones.<\/span> <span class=\"sg\" data-s=\"3\">Después de cada una, ves el resultado en la pantalla.<\/span> <span class=\"sg\" data-s=\"4\">Ves el estado de las variables.<\/span> <span class=\"sg\" data-s=\"5\">También ves la salida de tu programa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Escribe esto para iniciar el shell de Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La salida depende de tu versión del compilador.<\/span> <span class=\"sg\" data-s=\"1\">En la salida de arriba, el shell sugiere instalar algunos módulos.<\/span> <span class=\"sg\" data-s=\"2\">Con ellos, el shell es más cómodo de usar.<\/span> <span class=\"sg\" data-s=\"3\">Por eso ves este mensaje.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Al final, ves el carácter de prompt <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aquí escribes tu programa o partes de él.<\/span> <span class=\"sg\" data-s=\"2\">El shell compila tu código línea por línea.<\/span> <span class=\"sg\" data-s=\"3\">Lo hace cuando presionas Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"it":{"t":"Esecuzione da REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL sta per <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È una modalità shell integrata.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi delle istruzioni.<\/span> <span class=\"sg\" data-s=\"3\">Dopo ognuna, vedi il risultato sullo schermo.<\/span> <span class=\"sg\" data-s=\"4\">Vedi lo stato delle variabil  čaulu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izvade ir atkarīga no jūsu kompilatora versijas.<\/span> <span class=\"sg\" data-s=\"1\">Augstāk redzamajā izvadē čaula iesaka instalēt dažus moduļus.<\/span> <span class=\"sg\" data-s=\"2\">Ar tiem čaulu ir patīkamāk lietot.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs redzat šo ziņojumu.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beigās jūs redzat uzvednes rakstzīmi <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šeit jūs ievadāt savu programmu vai tās daļas.<\/span> <span class=\"sg\" data-s=\"2\">Čaula kompilē jūsu kodu pa rindai.<\/span> <span class=\"sg\" data-s=\"3\">Tā to dara, kad jūs nospiežat Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"ru":{"t":"Запуск из REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL — это сокращение от <em>Read–eval–print loop<\/em> (прочитать-выполнить-вывести-повторить).<\/span> <span class=\"sg\" data-s=\"1\">Это встроенный режим командной оболочки.<\/span> <span class=\"sg\" data-s=\"2\">Вы пишете инструкции.<\/span> <span class=\"sg\" data-s=\"3\">После каждой вы видите результат на экране.<\/span> <span class=\"sg\" data-s=\"4\">Вы видите состояние переменных.<\/span> <span class=\"sg\" data-s=\"5\">Ещё вы видите вывод вашей программы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наберите эту команду, чтобы запустить оболочку Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вывод зависит от вашей версии компилятора.<\/span> <span class=\"sg\" data-s=\"1\">В выводе выше оболочка предлагает установить некоторые модули.<\/span> <span class=\"sg\" data-s=\"2\">С ними оболочкой удобнее пользоваться.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому вы видите это сообщение.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В конце вы видите символ запроса <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Здесь вы пишете вашу программу или её части.<\/span> <span class=\"sg\" data-s=\"2\">Оболочка компилирует ваш код строка за строкой.<\/span> <span class=\"sg\" data-s=\"3\">Она делает это, когда вы нажимаете Enter.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; say 'Hello, World';\nHello, World\n&gt;<\/code><\/pre>"]]},"uk":{"t":"Запуск з REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL — це скорочення від <em>Read–eval–print loop<\/em> (цикл читання-оцінки-друку).<\/span> <span class=\"sg\" data-s=\"1\">Це вбудований режим оболонки.<\/span> <span class=\"sg\" data-s=\"2\">Ви вводите інструкції.<\/span> <span class=\"sg\" data-s=\"3\">Після кожної ви бачите результат на екрані.<\/span> <span class=\"sg\" data-s=\"4\">Ви бачите стан змінних.<\/span> <span class=\"sg\" data-s=\"5\">Ви також бачите вивід вашої програми.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Введіть це, щоб запустити оболонку Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вивід залежить від вашої версії компілятора.<\/span> <span class=\"sg\" data-s=\"1\">У виводі вище оболонка радить встановити деякі модулі.<\/span> <span class=\"sg\" data-s=\"2\">З ними оболонкою зручніше користуватися.<\/span> <span class=\"sg\" data-s=\"3\">Тому ви бачите це повідомлення.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У кінці ви бачите символ запиту <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тут ви вводите свою програму або її частини.<\/span> <span class=\"sg\" data-s=\"2\">Оболонка компілює ваш код рядок за рядком.<\/span> <span class=\"sg\" data-s=\"3\">Вона робить це, коли ви натискаєте Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"bg":{"t":"Изпълнение от REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL е съкращение от <em>Read–eval–print loop<\/em> (Чети-изпълнявай-печатай цикъл).<\/span> <span class=\"sg\" data-s=\"1\">Това е вграден режим на обвивката.<\/span> <span class=\"sg\" data-s=\"2\">Вие пишете инструкции.<\/span> <span class=\"sg\" data-s=\"3\">След всяка от тях виждате резултата на екрана.<\/span> <span class=\"sg\" data-s=\"4\">Виждате състоянието на променливите.<\/span> <span class=\"sg\" data-s=\"5\">Виждате и изхода на вашата програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Въведете това, за да стартирате обвивката на Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Изходът зависи от вашата версия на компилатора.<\/span> <span class=\"sg\" data-s=\"1\">В изхода по-горе обвивката предлага да инсталирате някои модули.<\/span> <span class=\"sg\" data-s=\"2\">С тях обвивката е по-удобна.<\/span> <span class=\"sg\" data-s=\"3\">Затова виждате това съобщение.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Накрая виждате символа за подканяне <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тук пишете вашата програма или части от нея.<\/span> <span class=\"sg\" data-s=\"2\">Обвивката компилира кода ви ред по ред.<\/span> <span class=\"sg\" data-s=\"3\">Тя прави това, когато натиснете Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"eo":{"t":"Lanĉado de REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL estas mallongigo de <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas enkonstruita ŝelreĝimo.<\/span> <span class=\"sg\" data-s=\"2\">Vi tajpas instrukciojn.<\/span> <span class=\"sg\" data-s=\"3\">Post ĉiu, vi vidas la rezulton sur la ekrano.<\/span> <span class=\"sg\" data-s=\"4\">Vi vidas la staton de la variabloj.<\/span> <span class=\"sg\" data-s=\"5\">Vi ankaŭ vidas la eligon de via programo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tajpu ĉi tion por starti la ŝelon de Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La eligo dependas de via versio de la kompililo.<\/span> <span class=\"sg\" data-s=\"1\">En la supra eligo, la ŝelo proponas instali kelkajn modulojn.<\/span> <span class=\"sg\" data-s=\"2\">Kun ili, la ŝelo estas pli agrabla por uzi.<\/span> <span class=\"sg\" data-s=\"3\">Tial vi vidas ĉi tiun mesaĝon.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fine, vi vidas la promptan signon <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie vi tajpas vian programon aŭ partojn de ĝi.<\/span> <span class=\"sg\" data-s=\"2\">La ŝelo kompilas vian kodon linion post linio.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi faras tion, kiam vi premas Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"la":{"t":"Currendo ex REPL","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">REPL est nomen breve pro <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Est modus testudinis in-aedificatus.<\/span> <span class=\"sg\" data-s=\"2\">Instructiones scribis.<\/span> <span class=\"sg\" data-s=\"3\">Post quamque, eventum in scrinio vides.<\/span> <span class=\"sg\" data-s=\"4\">Statum variabilium vides.<\/span> <span class=\"sg\" data-s=\"5\">Etiam output programmatis tui vides.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc scribe ad testudinem Rakudo incipiendam:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Output ex versione compilatoris tui pendet.<\/span> <span class=\"sg\" data-s=\"1\">In output supra testudo installationem aliquorum modulorum suadet.<\/span> <span class=\"sg\" data-s=\"2\">Cum eis testudo commodior est.<\/span> <span class=\"sg\" data-s=\"3\">Ideo hunc nuntium vides.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In fine characterem promptum <code>&gt;<\/code> vides.<\/span> <span class=\"sg\" data-s=\"1\">Hic programma tuum vel partes eius scribis.<\/span> <span class=\"sg\" data-s=\"2\">Testudo codicem tuum lineam per lineam compilat.<\/span> <span class=\"sg\" data-s=\"3\">Hoc facit cum Enter premis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; dic 'Salve, Munde';     Salve, Munde     &gt;<\/span><\/p>"]]}}}</script>
