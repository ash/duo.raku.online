<script type="application/json" id="page-data">{"u":"essentials/booleans","n":98,"k":"section","pv":"essentials/numbers/exercises/sum1-100/solution","nx":"essentials/booleans/operations","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Boolean type in Raku","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku has a built-in type for Boolean values.<\/span> <span class=\"sg\" data-s=\"1\">Its name is <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In fact, <code>Bool<\/code> is an enumeration.<\/span> <span class=\"sg\" data-s=\"3\">An enumeration is a type with a fixed list of values.<\/span> <span class=\"sg\" data-s=\"4\"><code>Bool<\/code> has only two values: <code>True<\/code> and <code>False<\/code>.<\/span><\/p>"]]},"de":{"t":"Boolescher Typ","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku hat einen eingebauten Typ für Boolesche Werte.<\/span> <span class=\"sg\" data-s=\"1\">Er heißt <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eigentlich ist <code>Bool<\/code> eine Enumeration.<\/span> <span class=\"sg\" data-s=\"3\">Eine Enumeration ist ein Typ mit einer festen Liste von Werten.<\/span> <span class=\"sg\" data-s=\"4\"><code>Bool<\/code> hat nur zwei Werte: <code>True<\/code> und <code>False<\/code>.<\/span><\/p>"]]},"nl":{"t":"Boolean type","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een ingebouwd type voor Booleaanse waarden.<\/span> <span class=\"sg\" data-s=\"1\">De naam is <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eigenlijk is <code>Bool<\/code> een enumeratie.<\/span> <span class=\"sg\" data-s=\"3\">Een enumeratie is een type met een vaste lijst van waarden.<\/span> <span class=\"sg\" data-s=\"4\"><code>Bool<\/code> heeft maar twee waarden: <code>True<\/code> en <code>False<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipo booleano","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku tiene un tipo incorporado para valores Booleanos.<\/span> <span class=\"sg\" data-s=\"1\">Su nombre es <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En realidad, <code>Bool<\/code> es una enumeración.<\/span> <span class=\"sg\" data-s=\"3\">Una enumeración es un tipo con una lista fija de valores.<\/span> <span class=\"sg\" data-s=\"4\"><code>Bool<\/code> tiene solo dos valores: <code>True<\/code> y <code>False<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipo booleano","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ha un tipo integrato per i valori booleani.<\/span> <span class=\"sg\" data-s=\"1\">Il suo nome è <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In realtà, <code>Bool<\/code> è un'enumerazione.<\/span> <span class=\"sg\" data-s=\"3\">Un'enumerazione è un tipo con una lista fissa di valori.<\/span> <span class=\"sg\" data-s=\"4\"><code>Bool<\/code> ha solo due valori: <code>True<\/code> e <code>False<\/code>.<\/span><\/p>"]]},"lv":{"t":"Loģiskais tips","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir iebūvēts tips Būla vērtībām.<\/span> <span class=\"sg\" data-s=\"1\">Tā nosaukums ir <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Patiesībā <code>Bool<\/code> ir uzskaitījums.<\/span> <span class=\"sg\" data-s=\"3\">Uzskaitījums ir tips ar fiksētu vērtību sarakstu.<\/span> <span class=\"sg\" data-s=\"4\">Tipam <code>Bool<\/code> ir tikai divas vērtības: <code>True<\/code> un <code>False<\/code>.<\/span><\/p>"]]},"ru":{"t":"Булев тип","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенный тип для логических значений.<\/span> <span class=\"sg\" data-s=\"1\">Он называется <code>Bool<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">На самом деле <code>Bool<\/code> — это перечисление.<\/span> <span class=\"sg\" data-s=\"3\">Перечисление — это тип с фиксированным списком значений.<\/span> <span class=\"sg\" data-s=\"4\">У <code>Bool<\/code> только два значения: <code>True<\/code> и <code>False<\/code>.<\/span><\/p>"]]},"uk":{"t":"Логічний тип","b":[["p",5,"
