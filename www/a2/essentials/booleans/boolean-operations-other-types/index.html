"sg\" data-s=\"0\">La prossima sezione parla di <a href=\"https://course.raku.org/it/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">come cambiare i dati da un tipo a un altro<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ma prima, guarda una caratteristica importante di Raku.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare le operazioni booleane con stringhe o interi.<\/span> <span class=\"sg\" data-s=\"3\">Allora Raku non cambia i valori in valori booleani.<\/span> <span class=\"sg\" data-s=\"4\">Neanche il risultato è un valore booleano.<\/span> <span class=\"sg\" data-s=\"5\">Guarda questi esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco le regole 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">dalla documentazione<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> restituisce il primo valore che per Raku è Falso. Se non c'è un valore così, restituisce l'ultimo valore.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> restituisce il primo valore che per Raku è Vero. Se non c'è un valore così, restituisce l'ultimo valore.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> restituisce il valore Vero se c'è un solo valore Vero. Se tutti i valori sono Falsi, restituisce l'ultimo valore. Se più di un valore è Vero, restituisce <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui vediamo un nuovo valore, <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È un valore ‘null’.<\/span><\/p>"]]},"lv":{"t":"Loģiskās operācijas ar citiem tipiem","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nākamā sadaļa ir par <a href=\"https://course.raku.org/lv/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">datu maiņu no viena tipa uz citu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bet vispirms apskatiet svarīgu Raku īpatnību.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat lietot booleānas operācijas ar virknēm vai integeriem.<\/span> <span class=\"sg\" data-s=\"3\">Tad Raku nepārvērš vērtības par booleānām vērtībām.<\/span> <span class=\"sg\" data-s=\"4\">Arī rezultāts nav booleāna vērtība.<\/span> <span class=\"sg\" data-s=\"5\">Apskatiet šos piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir noteikumi 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">no dokumentācijas<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> atgriež pirmo vērtību, ko Raku uzskata par False. Ja tādas vērtības nav, tas atgriež pēdējo vērtību.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> atgriež pirmo vērtību, ko Raku uzskata par True. Ja tādas vērtības nav, tas atgriež pēdējo vērtību.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> atgriež True vērtību, ja ir tikai viena True vērtība. Ja visas vērtības ir False, tas atgriež pēdējo vērtību. Ja vairāk nekā viena vērtība ir True, tas atgriež <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit mēs redzam jaunu vērtību — <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir ‘null’ vērtība.<\/span><\/p>"]]},"ru":{"t":"Логические операции с другими типами","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Следующая глава рассказывает о <a href=\"https://course.raku.org/ru/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">переводе данных из одного типа в другой<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но сначала посмотрите на одну важную особенность Raku.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете применять логические операции к строкам или целым числам.<\/span> <span class=\"sg\" data-s=\"3\">Тогда Raku не превращает значения в булевы.<\/span> <span class=\"sg\" data-s=\"4\">Результат — тоже не булево значение.<\/span> <span class=\"sg\" data-s=\"5\">Посмотрите на эти примеры:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">из документации<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> возвращает первое значение, которое для Raku равно False. Если такого значения нет, он возвращает последнее значение.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> возвращает первое значение, которое для Raku равно True. Если такого значения нет, он возвращает последнее значение.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> возвращает значение True, если такое значение только одно. Если все значения равны False, он возвращает последнее значение. Если значений True больше одного, он возвращает <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь мы видим новое значение — <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это «нулевое» значение.<\/span><\/p>"]]},"uk":{"t":"Логічні операції з іншими типами","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Наступний розділ — про <a href=\"https://course.raku.org/uk/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">зміну даних з одного типу на інший<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Але спершу подивіться на одну важливу особливість Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете застосовувати булеві операції до рядків або цілих чисел.<\/span> <span class=\"sg\" data-s=\"3\">Тоді Raku не змінює ці значення на булеві.<\/span> <span class=\"sg\" data-s=\"4\">Результат теж не є булевим значенням.<\/span> <span class=\"sg\" data-s=\"5\">Подивіться на ці приклади:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">з документації<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> повертає перше значення, яке для Raku є False. Якщо такого значення немає, він повертає останнє значення.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> повертає перше значення, яке для Raku є True. Якщо такого значення немає, він повертає останнє значення.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> повертає значення, яке є True, якщо таке значення лише одне. Якщо всі значення False, він повертає останнє значення. Якщо значень True більше одного, він повертає <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут ми бачимо нове значення, <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це значення «null».<\/span><\/p>"]]},"bg":{"t":"Булеви операции с други типове","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Следващата секция е за <a href=\"https://course.raku.org/bg/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">промяна на данни от един тип в друг<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но първо вижте една важна особеност на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате булеви операции с низове или цели числа.<\/span> <span class=\"sg\" data-s=\"3\">Тогава Raku не превръща стойностите в булеви стойности.<\/span> <span class=\"sg\" data-s=\"4\">Резултатът също не е булева стойност.<\/span> <span class=\"sg\" data-s=\"5\">Вижте тези примери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето правилата 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">от документацията<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> връща първата стойност, която Raku вижда като False. Ако няма такава стойност, връща последната стойност.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> връща първата стойност, която Raku вижда като True. Ако няма такава стойност, връща последната стойност.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> връща True стойността, ако има само една True стойност. Ако всички стойности са False, връща последната стойност. Ако повече от една стойност е True, връща <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук виждаме нова стойност, <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е ‘null’ стойност.<\/span><\/p>"]]},"eo":{"t":"Booleaj operacioj kun aliaj tipoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La sekva sekcio temas pri <a href=\"https://course.raku.org/eo/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">ŝanĝo de datumoj el unu tipo al alia<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sed unue, rigardu gravan trajton de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi Booleajn operaciojn kun ĉenoj aŭ entjeroj.<\/span> <span class=\"sg\" data-s=\"3\">Tiam Raku ne ŝanĝas la valorojn al Booleaj valoroj.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ la rezulto ne estas Boolea valoro.<\/span> <span class=\"sg\" data-s=\"5\">Rigardu ĉi tiujn ekzemplojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la reguloj 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">el la dokumentaro<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> redonas la unuan valoron, kiu estas Falsa por Raku. Se ne ekzistas tia valoro, ĝi redonas la lastan valoron.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> redonas la unuan valoron, kiu estas Vera por Raku. Se ne ekzistas tia valoro, ĝi redonas la lastan valoron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> redonas la Veran valoron, se estas nur unu Vera valoro. Se ĉiuj valoroj estas Falsaj, ĝi redonas la lastan valoron. Se pli ol unu valoro estas Vera, ĝi redonas <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie ni vidas novan valoron, <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ‘nul’ valoro.<\/span><\/p>"]]},"la":{"t":"Booleana operationes cum aliis typis","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Sectio proxima est de <a href=\"https://course.raku.org/la/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">mutatione datorum ex uno typo in alium<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sed primum unam proprietatem gravem Raku specta.<\/span> <span class=\"sg\" data-s=\"2\">Operationes Booleanas etiam ad chordas vel integros applicare potes.<\/span> <span class=\"sg\" data-s=\"3\">Tum Raku valores in valores Booleanos non mutat.<\/span> <span class=\"sg\" data-s=\"4\">Nec eventus est valor Booleanus.<\/span> <span class=\"sg\" data-s=\"5\">Specta haec exempla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt regulae 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">ex documentis<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> reddit primum valorem quem Raku ut Falsum videt. Si talis valor non est, ultimum valorem reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> reddit primum valorem quem Raku ut Verum videt. Si talis valor non est, ultimum valorem reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> reddit valorem Verum, si solum unus valor Verus est. Si omnes valores Falsi sunt, ultimum valorem reddit. Si plures valores Veri sunt, <code>Nil<\/code> reddit.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic novum valorem videmus, <code>Nil<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Est valor ‘nullum’.<\/span><\/p>"]]}}}</script>
