code>$ raku t.raku\nŠis ir tas, ko parasti izdrukā pirmā programma:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tālāk apskatīsim vairāk par funkciju izveidi un izmantošanu.<\/span><\/p>"]]},"ru":{"t":"Создание и вызов функций","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Этот раздел — последний в первой части курса.<\/span> <span class=\"sg\" data-s=\"1\">После него вы можете написать почти <em>любую<\/em> программу на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел — о <em>функциях<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">У функций есть и другие названия: <em>подпрограммы<\/em> или просто <em>рутины<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Функция — это часть кода со своим именем.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете использовать её много раз.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы использовать функцию, вы её <em>вызываете<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете вызвать её из разных мест программы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Создание функции<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать функцию, напишите ключевое слово <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После него напишите имя функции.<\/span> <span class=\"sg\" data-s=\"2\">Тело функции напишите в фигурных скобках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Использование функции<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Чтобы использовать функцию, просто напишите её имя.<\/span> <span class=\"sg\" data-s=\"1\">Напишите его там, где вы хотите вызвать функцию.<\/span> <span class=\"sg\" data-s=\"2\">В Raku вы можете создать функцию до этого места.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете создать её и после этого места.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит оба сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дальше мы узнаем больше о том, как создавать и использовать функции.<\/span><\/p>"]]},"uk":{"t":"Створення та виклик функцій","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Цим розділом закінчується перша частина курсу.<\/span> <span class=\"sg\" data-s=\"1\">Після нього ви можете написати майже <em>будь-яку<\/em> програму на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ — про <em>функції<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Функції мають також інші назви: <em>підпрограми<\/em> або просто <em>рутини<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Функція — це частина коду з власним ім'ям.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете використовувати її багато разів.<\/span> <span class=\"sg\" data-s=\"2\">Щоб використати функцію, ви її <em>викликаєте<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете викликати її з різних місць програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Створення функції<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб створити функцію, напишіть ключове слово <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після нього напишіть ім'я функції.<\/span> <span class=\"sg\" data-s=\"2\">Тіло функції помістіть у фігурні дужки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Використання функції<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Щоб використати функцію, просто напишіть її ім'я.<\/span> <span class=\"sg\" data-s=\"1\">Пишіть його там, де хочете викликати функцію.<\/span> <span class=\"sg\" data-s=\"2\">У Raku ви можете створити функцію перед цим місцем.<\/span> <span class=\"sg\" data-s=\"3\">Ви також можете створити її після цього місця.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе обидва повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Далі дізнаймося більше про створення і використання функцій.<\/span><\/p>"]]},"bg":{"t":"Създаване и извикване на функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Първата част на курса завършва с тази секция.<\/span> <span class=\"sg\" data-s=\"1\">След нея можете да пишете почти <em>всяка<\/em> програма в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тази секция е за <em>функциите<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Функциите имат и други имена: <em>подпрограми<\/em> или просто <em>рутини<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Функцията е част от кода със собствено име.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я използвате много пъти.<\/span> <span class=\"sg\" data-s=\"2\">За да използвате функция, вие я <em>извиквате<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да я извиквате от различни места в програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Създаване на функция<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да създадете функция, напишете ключовата дума <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След нея напишете името на функцията.<\/span> <span class=\"sg\" data-s=\"2\">Сложете тялото на функцията в къдрави скоби.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Използване на функция<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За да използвате функцията, просто напишете нейното име.<\/span> <span class=\"sg\" data-s=\"1\">Напишете го там, където искате да извикате функцията.<\/span> <span class=\"sg\" data-s=\"2\">В Raku можете да създадете функцията преди това място.<\/span> <span class=\"sg\" data-s=\"3\">Можете да я създадете и след това място.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Това е, което първата програма обикновено отпечатва:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва и двете съобщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТова е, което първата програма обикновено отпечатва:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега нека видим още как да създаваме и използваме функции.<\/span><\/p>"]]},"eo":{"t":"Kreado kaj vokado de funkcioj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La unua parto de la kurso finiĝas per ĉi tiu sekcio.<\/span> <span class=\"sg\" data-s=\"1\">Post ĝi, vi povas skribi preskaŭ <em>ĉiun<\/em> programon en Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio temas pri <em>funkcioj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Funkcioj havas ankaŭ aliajn nomojn: <em>subrutinoj<\/em>, aŭ simple <em>rutinoj<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Funkcio estas parto de kodo kun sia propra nomo.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin multajn fojojn.<\/span> <span class=\"sg\" data-s=\"2\">Por uzi funkcion, vi <em>vokas<\/em> ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas voki ĝin el diversaj lokoj en la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreado de funkcio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por krei funkcion, skribu la ŝlosilvorton <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post ĝi, skribu la nomon de la funkcio.<\/span> <span class=\"sg\" data-s=\"2\">Metu la korpon de la funkcio en kurbajn krampojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzado de funkcio<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por uzi la funkcion, simple skribu ĝian nomon.<\/span> <span class=\"sg\" data-s=\"1\">Skribu ĝin tie, kie vi volas voki la funkcion.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, vi povas krei la funkcion antaŭ ĉi tiu loko.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas krei ĝin post ĉi tiu loko.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Jen kion la unua programo kutime presas:';\nsaluton;    \n\nsub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas ambaŭ mesaĝojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nJen kion la unua programo kutime presas:\nSaluton, Mondo!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun ni vidu pli pri kreado kaj uzado de funkcioj.<\/span><\/p>"]]},"la":{"t":"Creando et vocando functiones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Prima pars cursus in hac sectione finem habet.<\/span> <span class=\"sg\" data-s=\"1\">Post eam fere <em>quodlibet<\/em> programma in Raku scribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio de <em>functionibus<\/em> est.<\/span> <span class=\"sg\" data-s=\"3\">Functiones etiam alia nomina habent: <em>subroutinae<\/em>, vel solum <em>routinae<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Functio est pars codicis cum proprio nomine.<\/span> <span class=\"sg\" data-s=\"1\">Eam multis vicibus adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Ut functionem adhibeas, eam <em>vocas<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Eam ex diversis locis in programmate vocare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare functionem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut functionem crees, scribe verbum <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post id scribe nomen functionis.<\/span> <span class=\"sg\" data-s=\"2\">Corpus functionis in uncis curvis pone.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Utendo functione<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ut functionem adhibeas, solum nomen eius scribe.<\/span> <span class=\"sg\" data-s=\"1\">Id scribe ubi functionem vocare vis.<\/span> <span class=\"sg\" data-s=\"2\">In Raku functionem ante hunc locum creare potes.<\/span> <span class=\"sg\" data-s=\"3\">Etiam post hunc locum eam creare potes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hoc est quod primum programma plerumque imprimit:';\nsaluta;    \n\nsub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma utrumque nuntium imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHoc est quod primum programma plerumque imprimit:\nSalve, Mundi!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deinde plura de creatione et usu functionum videamus.<\/span><\/p>"]]}}}</script>
