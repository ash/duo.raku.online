<script type="application/json" id="page-data">{"u":"essentials/functions/identifiers","n":269,"k":"topic","pv":"essentials/functions","nx":"essentials/functions/identifiers/quiz","tr":["essentials","essentials/functions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Function names","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">The name of a function is an identifier.<\/span> <span class=\"sg\" data-s=\"1\">It follows the same rules as <a href=\"/essentials/scalar-variables/identifiers/\">variable names<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">It must start with a letter or an underscore (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Then it can have letters, digits and underscores.<\/span> <span class=\"sg\" data-s=\"4\">It can also have hyphens (<code>-<\/code>) and apostrophes (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">An apostrophe is a single quote.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">After an apostrophe or a hyphen, there must be a letter.<\/span> <span class=\"sg\" data-s=\"1\">People do not often use apostrophes in names.<\/span> <span class=\"sg\" data-s=\"2\">But they use hyphens a lot.<\/span> <span class=\"sg\" data-s=\"3\">With hyphens, a name can say more.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are some examples of correct function names.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"de":{"t":"Funktionsnamen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Der Name einer Funktion ist ein Bezeichner.<\/span> <span class=\"sg\" data-s=\"1\">Er folgt denselben Regeln wie <a href=\"https://course.raku.org/de/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">Variablennamen<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Er muss mit einem Buchstaben oder einem Unterstrich (<code>_<\/code>) beginnen.<\/span> <span class=\"sg\" data-s=\"3\">Danach kann er Buchstaben, Ziffern und Unterstriche haben.<\/span> <span class=\"sg\" data-s=\"4\">Er kann auch Bindestriche (<code>-<\/code>) und Apostrophe (<code>'<\/code>) haben.<\/span> <span class=\"sg\" data-s=\"5\">Ein Apostroph ist ein einfaches Anführungszeichen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nach einem Apostroph oder einem Bindestrich muss ein Buchstabe kommen.<\/span> <span class=\"sg\" data-s=\"1\">Man verwendet in Namen nicht oft Apostrophe.<\/span> <span class=\"sg\" data-s=\"2\">Aber Bindestriche verwendet man viel.<\/span> <span class=\"sg\" data-s=\"3\">Mit Bindestrichen kann ein Name mehr sagen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind einige Beispiele für richtige Funktionsnamen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"nl":{"t":"Functienamen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De naam van een functie is een identificator.<\/span> <span class=\"sg\" data-s=\"1\">Voor de naam gelden dezelfde regels als voor <a href=\"https://course.raku.org/nl/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">namen van variabelen<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">De naam moet beginnen met een letter of een underscore (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Daarna kan de naam letters, cijfers en underscores hebben.<\/span> <span class=\"sg\" data-s=\"4\">Hij kan ook koppeltekens (<code>-<\/code>) en apostrofs (<code>'<\/code>) hebben.<\/span> <span class=\"sg\" data-s=\"5\">Een apostrof is een enkel aanhalingsteken.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Na een apostrof of een koppelteken moet een letter komen.<\/span> <span class=\"sg\" data-s=\"1\">Mensen gebruiken niet vaak apostrofs in namen.<\/span> <span class=\"sg\" data-s=\"2\">Maar ze gebruiken wel vaak koppeltekens.<\/span> <span class=\"sg\" data-s=\"3\">Met koppeltekens kan een naam meer zeggen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar voorbeelden van juiste functienamen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"es":{"t":"Nombres de funciones","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">El nombre de una función es un identificador.<\/span> <span class=\"sg\" data-s=\"1\">Sigue las mismas reglas que los <a href=\"https://course.raku.org/es/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nombres de variables<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Debe empezar con una letra o un guion bajo (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Después puede tener letras, dígitos y guiones bajos.<\/span> <span class=\"sg\" data-s=\"4\">También puede tener guiones (<code>-<\/code>) y apóstrofes (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Un apóstrofe es una comilla simple.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Después de un apóstrofe o un guion, debe ir una letra.<\/span> <span class=\"sg\" data-s=\"1\">La gente no usa mucho los apóstrofes en los nombres.<\/span> <span class=\"sg\" data-s=\"2\">Pero sí usa mucho los guiones.<\/span> <span class=\"sg\" data-s=\"3\">Con guiones, un nombre puede decir más.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunos ejemplos de nombres de funciones correctos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"it":{"t":"Nomi delle funzioni","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Il nome di una funzione è un identificatore.<\/span> <span class=\"sg\" data-s=\"1\">Segue le stesse regole dei <a href=\"https://course.raku.org/it/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomi delle variabili<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Deve iniziare con una lettera o un trattino basso (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Poi può avere lettere, cifre e trattini bassi.<\/span> <span class=\"sg\" data-s=\"4\">Può avere anche trattini (<code>-<\/code>) e apostrofi (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Un apostrofo è una virgoletta singola.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dopo un apostrofo o un trattino, ci deve essere una lettera.<\/span> <span class=\"sg\" data-s=\"1\">Le persone non usano spesso gli apostrofi nei nomi.<\/span> <span class=\"sg\" data-s=\"2\">Ma usano molto i trattini.<\/span> <span class=\"sg\" data-s=\"3\">Con i trattini, un nome può dire di più.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni esempi di nomi di funzioni corretti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"lv":{"t":"Funkciju nosaukumi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Funkcijas nosaukums ir identifikators.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir tie paši noteikumi kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">mainīgo nosaukumiem<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tam jāsākas ar burtu vai pasvītrojuma zīmi (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Tālāk tajā var būt burti, cipari un pasvītrojuma zīmes.<\/span> <span class=\"sg\" data-s=\"4\">Tajā var būt arī domuzīmes (<code>-<\/code>) un apostrofi (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Apostrofs ir vienpēdiņa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc apostrofa vai domuzīmes jābūt burtam.<\/span> <span class=\"sg\" data-s=\"1\">Cilvēki nosaukumos reti lieto apostrofus.<\/span> <span class=\"sg\" data-s=\"2\">Bet domuzīmes viņi lieto bieži.<\/span> <span class=\"sg\" data-s=\"3\">Ar domuzīmēm nosaukums var pateikt vairāk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, daži pareizu funkciju nosaukumu piemēri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"ru":{"t":"Имена функций","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Имя функции — это идентификатор.<\/span> <span class=\"sg\" data-s=\"1\">У него те же правила, что и у <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имён переменных<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Оно должно начинаться с буквы или символа подчёркивания (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Потом в нём могут быть буквы, цифры и подчёркивания.<\/span> <span class=\"sg\" data-s=\"4\">В нём также могут быть дефисы (<code>-<\/code>) и апострофы (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Апостроф — это одиночная кавычка.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">После апострофа или дефиса должна быть буква.<\/span> <span class=\"sg\" data-s=\"1\">Люди нечасто используют апострофы в именах.<\/span> <span class=\"sg\" data-s=\"2\">Но дефисы они используют часто.<\/span> <span class=\"sg\" data-s=\"3\">С дефисами имя может сказать больше.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот несколько примеров правильных имён функций.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"uk":{"t":"Імена функцій","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ім'я функції — це ідентифікатор.<\/span> <span class=\"sg\" data-s=\"1\">Для нього діють ті самі правила, що й для <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">імен змінних<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Воно має починатися з літери або підкреслення (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Далі в ньому можуть бути літери, цифри і підкреслення.<\/span> <span class=\"sg\" data-s=\"4\">Також у ньому можуть бути дефіси (<code>-<\/code>) і апострофи (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Апостроф — це одинарна лапка.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Після апострофа чи дефіса має стояти літера.<\/span> <span class=\"sg\" data-s=\"1\">Люди нечасто вживають апострофи в іменах.<\/span> <span class=\"sg\" data-s=\"2\">Але дефіси вони вживають часто.<\/span> <span class=\"sg\" data-s=\"3\">З дефісами ім'я може сказати більше.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось кілька прикладів правильних імен функцій.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"bg":{"t":"Имена на функции","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Името на функцията е идентификатор.<\/span> <span class=\"sg\" data-s=\"1\">То следва същите правила като <a href=\"https://course.raku.org/bg/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имената на променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">То трябва да започва с буква или долна черта (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">След това може да има букви, цифри и долни черти.<\/span> <span class=\"sg\" data-s=\"4\">Може да има и тирета (<code>-<\/code>) и апострофи (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Апострофът е единична кавичка.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">След апостроф или тире трябва да има буква.<\/span> <span class=\"sg\" data-s=\"1\">Хората рядко използват апострофи в имената.<\/span> <span class=\"sg\" data-s=\"2\">Но използват тирета много често.<\/span> <span class=\"sg\" data-s=\"3\">С тирета едно име може да казва повече.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето няколко примера за правилни имена на функции.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"eo":{"t":"Funkciaj nomoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La nomo de funkcio estas identigilo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi sekvas la samajn regulojn kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomoj de variabloj<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi devas komenciĝi per litero aŭ substreko (<code>_<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi povas havi literojn, ciferojn kaj substrekojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ povas havi streketojn (<code>-<\/code>) kaj apostrofojn (<code>'<\/code>).<\/span> <span class=\"sg\" data-s=\"5\">Apostrofo estas unuopa citilo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Post apostrofo aŭ streketo, devas esti litero.<\/span> <span class=\"sg\" data-s=\"1\">Homoj ne ofte uzas apostrofojn en nomoj.<\/span> <span class=\"sg\" data-s=\"2\">Sed ili multe uzas streketojn.<\/span> <span class=\"sg\" data-s=\"3\">Kun streketoj, nomo povas diri pli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj ekzemploj de ĝustaj funkciaj nomoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu-ilin<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluton-mondo<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NombroDeElementoj<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">estas-valida<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esti_aŭ_ne_esti<\/span><\/p>"]]},"la":{"t":"Nomina functionum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nomen functionis est identificator.<\/span> <span class=\"sg\" data-s=\"1\">Easdem regulas sequitur ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomina variabilium<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">A littera vel ab underscore (<code>_<\/code>) incipere debet.<\/span> <span class=\"sg\" data-s=\"3\">Deinde litteras, digitos et underscores habere potest.<\/span> <span class=\"sg\" data-s=\"4\">Etiam hyphenas (<code>-<\/code>) et apostrophos (<code>'<\/code>) habere potest.<\/span> <span class=\"sg\" data-s=\"5\">Apostrophus est apex singulus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Post apostrophum vel hyphenam littera esse debet.<\/span> <span class=\"sg\" data-s=\"1\">Homines apostrophos in nominibus non saepe adhibent.<\/span> <span class=\"sg\" data-s=\"2\">Sed hyphenas multum adhibent.<\/span> <span class=\"sg\" data-s=\"3\">Cum hyphenis nomen plus dicere potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce aliqua exempla rectorum nominum functionum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta-illos<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salve-mundum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumerusRerum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">est-validus<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esse-vel-non_esse<\/span><\/p>"]]}}}</script>
