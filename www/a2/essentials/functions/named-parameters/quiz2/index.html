<script type="application/json" id="page-data">{"u":"essentials/functions/named-parameters/quiz2","n":280,"k":"quiz","pv":"essentials/functions/named-parameters/quiz1","nx":"essentials/functions/default-values","tr":["essentials","essentials/functions","essentials/functions/named-parameters"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Variables as named parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the function from the last quiz again:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program also has three variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You pass two of the three variables to the function.<\/span> <span class=\"sg\" data-s=\"1\">Which calls are correct?<\/span> <span class=\"sg\" data-s=\"2\">Mark all of them.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positional arguments are passed here instead of the named ones.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Not a valid Raku syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Same as above.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Also fine, while a bit redundant.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz 2 — Variablen als benannte Parameter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist noch einmal die Funktion aus dem letzten Quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm hat auch drei Variablen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du übergibst der Funktion zwei der drei Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Welche Aufrufe sind richtig?<\/span> <span class=\"sg\" data-s=\"2\">Markiere sie alle.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionsargumente werden hier anstelle der benannten übergeben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Keine gültige Raku-Syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Dasselbe wie oben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Auch in Ordnung, wenn auch etwas redundant.<\/span><\/span><\/li><\/ul>"]]},"nl":{"t":"Quiz 2 — Variabelen als benoemde parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is weer de functie uit de vorige quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma heeft ook drie variabelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je geeft twee van de drie variabelen aan de functie door.<\/span> <span class=\"sg\" data-s=\"1\">Welke aanroepen zijn juist?<\/span> <span class=\"sg\" data-s=\"2\">Markeer ze allemaal.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionele argumenten worden hier doorgegeven in plaats van de benoemde.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Geen geldige Raku-syntaxis.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Geen benoemde parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span clas brado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No hay un parámetro nombrado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Igual que el anterior.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">También está bien, aunque un poco redundante.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz 2 — Variabili come parametri nominati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco di nuovo la funzione del quiz precedente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma ha anche tre variabili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Passi due delle tre variabili alla funzione.<\/span> <span class=\"sg\" data-s=\"1\">Quali chiamate sono corrette?<\/span> <span class=\"sg\" data-s=\"2\">Segnale tutte.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Qui vengono passati argomenti posizionali invece di quelli nominati.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Sintassi Raku non valida.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Uguale a sopra.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Anche questo va bene, sebbene un po' ridondante.<\/span><\/span><\/li><\/ul>"]]},"lv":{"t":"Tests 2 — Mainīgie kā nosauktie parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, atkal funkcija no iepriekšējās viktorīnas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmā ir arī trīs mainīgie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs nododat funkcijai divus no trim mainīgajiem.<\/span> <span class=\"sg\" data-s=\"1\">Kuri izsaukumi ir pareizi?<\/span> <span class=\"sg\" data-s=\"2\">Atzīmējiet tos visus.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Šeit tiek nodoti pozicionālie argumenti, nevis nosauktie.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Nav derīga Raku sintakse.<\/span
