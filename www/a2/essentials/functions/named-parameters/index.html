,2,"<p><span class=\"sg\" data-s=\"0\">Šī funkcija pieņem divus parametrus.<\/span> <span class=\"sg\" data-s=\"1\">To nosaukumi ir <code>$from<\/code> un <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izsauktu funkciju, uzrakstiet katra argumenta nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nenododiet argumentus kā pozicionālos.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir kļūda.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, izsaukums <code>distance(30, 10)<\/code> dod kļūdu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pārāk daudz pozicionālo argumentu; tika gaidīti 0 argumenti, bet tika saņemti 2         sub distance pie t.raku 1. rindas         blokā &lt;unit&gt; pie t.raku 2. rindas<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lūk, labā ziņa.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat rakstīt nosauktos argumentus jebkurā secībā.<\/span> <span class=\"sg\" data-s=\"2\">Šie divi izsaukumi dara tieši to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mainīgo nodošana<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs gribat nodot vērtību no mainīgā.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgajam ir tāds pats nosaukums kā parametram.<\/span> <span class=\"sg\" data-s=\"2\">Tad palīdz īpaša sintakse.<\/span> <span class=\"sg\" data-s=\"3\">Ar to jūs rakstāt mazāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis izsaukums dara to pašu, ko garāks izsaukums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atkal secība nav svarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz mainīgajam un parametram ir dažādi nosaukumi.<\/span> <span class=\"sg\" data-s=\"1\">Tad nododiet pāri vienā no šiem veidiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vai:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"ru":{"t":"Именованные параметры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Именованные<\/em> параметры не похожи на <a href=\"/essentials/functions/positional-parameters/\">позиционные параметры<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">В вызове вы пишете их имена.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта функция принимает два параметра.<\/span> <span class=\"sg\" data-s=\"1\">Их имена — <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать функцию, напишите имя каждого аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не передавайте аргументы как позиционные.<\/span> <span class=\"sg\" data-s=\"1\">Это ошибка.<\/span> <span class=\"sg\" data-s=\"2\">Например, вызов <code>distance(30, 10)<\/code> даёт ошибку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Слишком много позиционных аргументов; ожидалось 0 аргументов, но получено 2         в подпрограмме distance на строке 1 в t.raku         в блоке &lt;unit&gt; на строке 2 в t.raku<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">А вот хорошая новость.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете писать именованные аргументы в любом порядке.<\/span> <span class=\"sg\" data-s=\"2\">Эти два вызова делают точно одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача переменных<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда вы хотите передать значение из переменной.<\/span> <span class=\"sg\" data-s=\"1\">У переменной то же имя, что и у параметра.<\/span> <span class=\"sg\" data-s=\"2\">Тогда помогает особый синтаксис.<\/span> <span class=\"sg\" data-s=\"3\">С ним вы пишете меньше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот вызов делает то же, что и более длинный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И снова порядок не важен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда у переменной и параметра разные имена.<\/span> <span class=\"sg\" data-s=\"1\">Тогда передайте пару одним из этих способов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"uk":{"t":"Іменовані параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Іменовані<\/em> параметри не такі, як <a href=\"/essentials/functions/positional-parameters/\">позиційні параметри<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">У виклику ви пишете їхні імена.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця функція приймає два параметри.<\/span> <span class=\"sg\" data-s=\"1\">Їхні імена — <code>$from<\/code> і <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб викликати функцію, напишіть ім'я кожного аргументу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не передавайте аргументи як позиційні.<\/span> <span class=\"sg\" data-s=\"1\">Це помилка.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, виклик <code>distance(30, 10)<\/code> дає помилку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Занадто багато позиційних аргументів; очікувалося 0 аргументів, але отримано 2         в підпрограмі distance на рядку 1 у файлі t.raku         в блоці &lt;unit&gt; на рядку 2 у файлі t.raku<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ось хороша новина.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете писати іменовані аргументи в будь-якому порядку.<\/span> <span class=\"sg\" data-s=\"2\">Ці два виклики роблять те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача змінних<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді ви хочете передати значення зі змінної.<\/span> <span class=\"sg\" data-s=\"1\">Змінна має те саме ім'я, що й параметр.<\/span> <span class=\"sg\" data-s=\"2\">Тоді допомагає спеціальний синтаксис.<\/span> <span class=\"sg\" data-s=\"3\">З ним ви друкуєте менше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей виклик робить те саме, що й довший:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">І знову порядок не має значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді змінна і параметр мають різні імена.<\/span> <span class=\"sg\" data-s=\"1\">Тоді передайте пару одним із цих способів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# або:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"bg":{"t":"Именувани параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Именуваните<\/em> параметри не са като <a href=\"/essentials/functions/positional-parameters/\">позиционните параметри<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">При извикване пишете техните имена.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази функция приема два параметъра.<\/span> <span class=\"sg\" data-s=\"1\">Техните имена са <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да извикате функцията, напишете името на всеки аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не предавайте аргументите като позиционни.<\/span> <span class=\"sg\" data-s=\"1\">Това е грешка.<\/span> <span class=\"sg\" data-s=\"2\">Например извикването <code>distance(30, 10)<\/code> дава грешка:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прекалено много позиционни аргументи; очаквани 0 аргумента, но получени 2         в sub distance на ред 1 в t.raku         в блок &lt;unit&gt; на ред 2 в t.raku<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ето и добрата част.<\/span> <span class=\"sg\" data-s=\"1\">Можете да пишете именуваните аргументи в произволен ред.<\/span> <span class=\"sg\" data-s=\"2\">Тези две извиквания правят точно едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Предаване на променливи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога искате да предадете стойност от променлива.<\/span> <span class=\"sg\" data-s=\"1\">Променливата има същото име като параметъра.<\/span> <span class=\"sg\" data-s=\"2\">Тогава помага специален синтаксис.<\/span> <span class=\"sg\" data-s=\"3\">С него пишете по-малко:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това извикване прави същото като едно по-дълго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отново, редът няма значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога променливата и параметърът имат различни имена.<\/span> <span class=\"sg\" data-s=\"1\">Тогава предайте двойка по един от тези начини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"eo":{"t":"Nomitaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Nomitaj<\/em> parametroj ne estas kiel <a href=\"/essentials/functions/positional-parameters/\">poziciaj parametroj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">En voko, vi skribas iliajn nomojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu funkcio prenas du parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">Iliaj nomoj estas <code>$from<\/code> kaj <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por voki la funkcion, skribu la nomon de ĉiu argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ne pasu la argumentojn kiel poziciajn.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas eraro.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la voko <code>distance(30, 10)<\/code> donas eraron:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro multaj poziciaj pasis; atendis 0 argumentojn sed ricevis 2         en sub distance ĉe t.raku linio 1         en bloko &lt;unit&gt; ĉe t.raku linio 2<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jen la bona parto.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas skribi nomitajn argumentojn en ajna ordo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj du vokoj faras ĝuste la saman aferon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasante variablojn<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje vi volas pasi valoron el variablo.<\/span> <span class=\"sg\" data-s=\"1\">La variablo havas la saman nomon kiel la parametro.<\/span> <span class=\"sg\" data-s=\"2\">Tiam helpas speciala sintakso.<\/span> <span class=\"sg\" data-s=\"3\">Per ĝi vi tajpas malpli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu voko faras la samon kiel pli longa voko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Denove, la ordo ne gravas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje la variablo kaj la parametro havas malsamajn nomojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiam pasu paron en unu el ĉi tiuj manieroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# aŭ:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"la":{"t":"Nominate parametra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri <em>nominati<\/em> non sunt sicut <a href=\"/essentials/functions/positional-parameters/\">parametri positionales<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">In vocatione nomina eorum scribis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec functio duos parametros accipit.<\/span> <span class=\"sg\" data-s=\"1\">Nomina eorum sunt <code>$from<\/code> et <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut functionem voces, nomen cuiusque argumenti scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Noli argumenta sicut positionalia transmittere.<\/span> <span class=\"sg\" data-s=\"1\">Hoc error est.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, vocatio <code>distance(30, 10)<\/code> errorem dat:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Troppi positionale transmissi; expectati 0 argumenti sed accepti 2         in sub distance ad t.raku linea 1         in block &lt;unit&gt; ad t.raku linea 2<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ecce pars bona.<\/span> <span class=\"sg\" data-s=\"1\">Argumenta nominata quolibet ordine scribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Hae duae vocationes prorsus idem faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles transmittentes<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum valorem ex variabili transmittere vis.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis idem nomen ac parameter habet.<\/span> <span class=\"sg\" data-s=\"2\">Tum syntaxis specialis adiuvat.<\/span> <span class=\"sg\" data-s=\"3\">Cum ea minus scribis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec vocatio idem facit ac longior vocatio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iterum, ordo non refert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum variabilis et parameter diversa nomina habent.<\/span> <span class=\"sg\" data-s=\"1\">Tum par uno ex his modis transmitte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vel:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]}}}</script>
