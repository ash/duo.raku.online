:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, <code>diff(10, 20)<\/code> и <code>diff(20, 10)<\/code> дават различни резултати.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Във функцията по-горе параметрите са списък със запетаи.<\/span> <span class=\"sg\" data-s=\"1\">Такива параметри се наричат <em>позиционни<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">При извикване редът на аргументите е важен.<\/span> <span class=\"sg\" data-s=\"3\">Той определя значението на всеки параметър.<\/span><\/p>"]]},"eo":{"t":"Poziciaj parametroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La ordo de funkciaj parametroj estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, prenu funkcion.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi trovas la diferencon inter du nombroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, <code>diff(10, 20)<\/code> kaj <code>diff(20, 10)<\/code> donas malsamajn rezultojn.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En la supra funkcio, la parametroj estas listo kun komoj.<\/span> <span class=\"sg\" data-s=\"1\">Tiajn parametrojn oni nomas <em>poziciaj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">En voko, la ordo de la argumentoj estas grava.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi decidas la signifon de ĉiu parametro.<\/span><\/p>"]]},"la":{"t":"Positional parametra","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ordo parametrorum functionis magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, sume functionem.<\/span> <span class=\"sg\" data-s=\"2\">Ea differentiam inter duos numeros invenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Certe <code>diff(10, 20)<\/code> et <code>diff(20, 10)<\/code> diversos eventus dant.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In functione supra parametri sunt index cum commatibus.<\/span> <span class=\"sg\" data-s=\"1\">Tales parametros <em>positionales<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"2\">In vocatione ordo argumentorum magni momenti est.<\/span> <span class=\"sg\" data-s=\"3\">Is sensum cuiusque parametri statuit.<\/span><\/p>"]]}}}</script>
