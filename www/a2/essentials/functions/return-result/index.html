<script type="application/json" id="page-data">{"u":"essentials/functions/return-result","n":274,"k":"topic","pv":"essentials/functions/function-parameters/quiz2","nx":"essentials/functions/return-result/quiz","tr":["essentials","essentials/functions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Returning the result","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Often a function does something and also returns a result.<\/span> <span class=\"sg\" data-s=\"1\">In functional programming, for example, functions should have no side effects.<\/span> <span class=\"sg\" data-s=\"2\">Printing to the console is one such side effect.<\/span> <span class=\"sg\" data-s=\"3\">But Raku lets you do this.<\/span> <span class=\"sg\" data-s=\"4\">Let's see how a function returns a value.<\/span> <span class=\"sg\" data-s=\"5\">We also see how the calling code gets this value.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, the function <code>add<\/code> takes two numbers.<\/span> <span class=\"sg\" data-s=\"1\">It returns their sum.<\/span> <span class=\"sg\" data-s=\"2\">The function has the word <code>return<\/code> in its code.<\/span> <span class=\"sg\" data-s=\"3\">The calling code can use this value like any other value.<\/span> <span class=\"sg\" data-s=\"4\">In the program above, we assign it to a variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The last value<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The result can be the last value in the function body.<\/span> <span class=\"sg\" data-s=\"1\">Then, in Raku, you do not have to write <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">So we can make our function <code>add<\/code> simpler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Note that the line has no semicolon at the end.<\/span> <span class=\"sg\" data-s=\"1\">The line is the last one in the code block.<\/span> <span class=\"sg\" data-s=\"2\">So a semicolon is not needed there.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Small and simple functions like this are often written on one line.<\/span> <span class=\"sg\" data-s=\"1\">Then the code is shorter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No data to return<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes a function must return before the end of its body.<\/span> <span class=\"sg\" data-s=\"1\">If the function returns no result, use <code>return<\/code> with no value.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"de":{"t":"Das Ergebnis zurückgeben","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Oft tut eine Funktion etwas und gibt auch ein Ergebnis zurück.<\/span> <span class=\"sg\" data-s=\"1\">In der funktionalen Programmierung zum Beispiel sollen Funktionen keine Nebeneffekte haben.<\/span> <span class=\"sg\" data-s=\"2\">Das Drucken auf die Konsole ist so ein Nebeneffekt.<\/span> <span class=\"sg\" data-s=\"3\">Aber Raku erlaubt dir das.<\/span> <span class=\"sg\" data-s=\"4\">Schauen wir, wie eine Funktion einen Wert zurückgibt.<\/span> <span class=\"sg\" data-s=\"5\">Wir sehen auch, wie der aufrufende Code diesen Wert bekommt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier nimmt die Funktion <code>add<\/code> zwei Zahlen.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt ihre Summe zurück.<\/span> <span class=\"sg\" data-s=\"2\">Die Funktion hat das Wort <code>return<\/code> in ihrem Code.<\/span> <span class=\"sg\" data-s=\"3\">Der aufrufende Code kann diesen Wert wie jeden anderen Wert verwenden.<\/span> <span class=\"sg\" data-s=\"4\">Im Programm oben weisen wir ihn einer Variablen zu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der letzte Wert<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis kann der letzte Wert im Körper der Funktion sein.<\/span> <span class=\"sg\" data-s=\"1\">Dann musst du in Raku kein <code>return<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"2\">So können wir unsere Funktion <code>add<\/code> einfacher machen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachte: Die Zeile hat am Ende kein Semikolon.<\/span> <span class=\"sg\" data-s=\"1\">Die Zeile ist die letzte im Codeblock.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb braucht man dort kein Semikolon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kleine und einfache Funktionen wie diese schreibt man oft in eine Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Dann ist der Code kürzer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Keine Daten zum Zurückgeben<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal muss eine Funktion vor dem Ende ihres Körpers zurückkehren.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Funktion kein Ergebnis zurückgibt, verwende <code>return<\/code> ohne Wert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"nl":{"t":"Het resultaat teruggeven","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een functie doet vaak iets en geeft ook een resultaat terug.<\/span> <span class=\"sg\" data-s=\"1\">In functionele programmering mogen functies bijvoorbeeld geen bijwerkingen hebben.<\/span> <span class=\"sg\" data-s=\"2\">Printen naar de console is zo'n bijwerking.<\/span> <span class=\"sg\" data-s=\"3\">Maar Raku staat dit wel toe.<\/span> <span class=\"sg\" data-s=\"4\">Laten we kijken hoe een functie een waarde teruggeeft.<\/span> <span class=\"sg\" data-s=\"5\">We zien ook hoe de aanroepende code deze waarde krijgt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier krijgt de functie <code>add<\/code> twee getallen.<\/span> <span class=\"sg\" data-s=\"1\">De functie geeft hun som terug.<\/span> <span class=\"sg\" data-s=\"2\">In de code van de functie staat het woord <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De aanroepende code kan deze waarde gebruiken zoals elke andere waarde.<\/span> <span class=\"sg\" data-s=\"4\">In het programma hierboven wijzen we de waarde toe aan een variabele.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De laatste waarde<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het resultaat kan de laatste waarde in het lichaam van de functie zijn.<\/span> <span class=\"sg\" data-s=\"1\">Dan hoef je in Raku geen <code>return<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Dus kunnen we onze functie <code>add<\/code> eenvoudiger maken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let op: de regel heeft geen puntkomma aan het einde.<\/span> <span class=\"sg\" data-s=\"1\">De regel is de laatste in het codeblok.<\/span> <span class=\"sg\" data-s=\"2\">Daarom is daar geen puntkomma nodig.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kleine en simpele functies zoals deze schrijf je vaak op één regel.<\/span> <span class=\"sg\" data-s=\"1\">Dan is de code korter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geen gegevens om terug te geven<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms moet een functie al voor het einde van het lichaam terugkeren.<\/span> <span class=\"sg\" data-s=\"1\">Als de functie geen resultaat teruggeeft, gebruik dan <code>return<\/code> zonder waarde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is boven de limiet\";\n}<\/code><\/pre>"]]},"es":{"t":"Devolver el resultado","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A menudo una función hace algo y también devuelve un resultado.<\/span> <span class=\"sg\" data-s=\"1\">En la programación funcional, por ejemplo, las funciones no deben tener efectos secundarios.<\/span> <span class=\"sg\" data-s=\"2\">Imprimir en la consola es uno de estos efectos.<\/span> <span class=\"sg\" data-s=\"3\">Pero Raku te deja hacer esto.<\/span> <span class=\"sg\" data-s=\"4\">Veamos cómo una función devuelve un valor.<\/span> <span class=\"sg\" data-s=\"5\">También vemos cómo el código que llama recibe este valor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, la función <code>add<\/code> toma dos números.<\/span> <span class=\"sg\" data-s=\"1\">Devuelve su suma.<\/span> <span class=\"sg\" data-s=\"2\">La función tiene la palabra <code>return<\/code> en su código.<\/span> <span class=\"sg\" data-s=\"3\">El código que llama puede usar este valor como cualquier otro valor.<\/span> <span class=\"sg\" data-s=\"4\">En el programa de arriba, lo asignamos a una variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El último valor<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El resultado puede ser el último valor en el cuerpo de la función.<\/span> <span class=\"sg\" data-s=\"1\">Entonces, en Raku, no tienes que escribir <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así podemos hacer más simple nuestra función <code>add<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota que la línea no tiene punto y coma al final.<\/span> <span class=\"sg\" data-s=\"1\">La línea es la última del bloque de código.<\/span> <span class=\"sg\" data-s=\"2\">Por eso allí no hace falta un punto y coma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A menudo escribimos funciones pequeñas y simples como esta en una sola línea.<\/span> <span class=\"sg\" data-s=\"1\">Así el código es más corto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sin datos para devolver<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces una función debe retornar antes del final de su cuerpo.<\/span> <span class=\"sg\" data-s=\"1\">Si la función no devuelve ningún resultado, usa <code>return<\/code> sin valor.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x está por encima del límite\";\n}<\/code><\/pre>"]]},"it":{"t":"Restituzione del risultato","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Spesso una funzione fa qualcosa e restituisce anche un risultato.<\/span> <span class=\"sg\" data-s=\"1\">Nella programmazione funzionale, per esempio, le funzioni non devono avere effetti collaterali.<\/span> <span class=\"sg\" data-s=\"2\">Stampare sulla console è uno di questi effetti collaterali.<\/span> <span class=\"sg\" data-s=\"3\">Ma Raku ti permette di farlo.<\/span> <span class=\"sg\" data-s=\"4\">Vediamo come una funzione restituisce un valore.<\/span> <span class=\"sg\" data-s=\"5\">Vediamo anche come il codice chiamante prende questo valore.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui, la funzione <code>add<\/code> prende due numeri.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce la loro somma.<\/span> <span class=\"sg\" data-s=\"2\">La funzione ha la parola <code>return<\/code> nel suo codice.<\/span> <span class=\"sg\" data-s=\"3\">Il codice chiamante può usare questo valore come ogni altro valore.<\/span> <span class=\"sg\" data-s=\"4\">Nel programma sopra, lo assegniamo a una variabile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">L'ultimo valore<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il risultato può essere l'ultimo valore nel corpo della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Allora, in Raku, non devi scrivere <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Così possiamo rendere più semplice la nostra funzione <code>add<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che la riga non ha il punto e virgola alla fine.<\/span> <span class=\"sg\" data-s=\"1\">La riga è l'ultima del blocco di codice.<\/span> <span class=\"sg\" data-s=\"2\">Così lì il punto e virgola non serve.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funzioni piccole e semplici come questa spesso si scrivono su una riga.<\/span> <span class=\"sg\" data-s=\"1\">Così il codice è più corto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nessun dato da restituire<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte una funzione deve uscire prima della fine del suo corpo.<\/span> <span class=\"sg\" data-s=\"1\">Se la funzione non restituisce un risultato, usa <code>return<\/code> senza valore.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"lv":{"t":"Rezultāta atgriešana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Bieži funkcija kaut ko dara un arī atgriež rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Funkcionālajā programmēšanā, piemēram, funkcijām nevajadzētu būt blakusparādībām.<\/span> <span class=\"sg\" data-s=\"2\">Drukāšana uz konsoles ir viena tāda blakusparādība.<\/span> <span class=\"sg\" data-s=\"3\">Bet Raku ļauj jums to darīt.<\/span> <span class=\"sg\" data-s=\"4\">Apskatīsim, kā funkcija atgriež vērtību.<\/span> <span class=\"sg\" data-s=\"5\">Mēs arī apskatīsim, kā izsaucošais kods saņem šo vērtību.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit funkcija <code>add<\/code> pieņem divus skaitļus.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež to summu.<\/span> <span class=\"sg\" data-s=\"2\">Funkcijas kodā ir vārds <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Izsaucošais kods var izmantot šo vērtību kā jebkuru citu vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Programmā augstāk mēs to piešķiram mainīgajam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pēdējā vērtība<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rezultāts var būt pēdējā vērtība funkcijas ķermenī.<\/span> <span class=\"sg\" data-s=\"1\">Tad Raku valodā jums nav jāraksta <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc mēs varam padarīt savu funkciju <code>add<\/code> vienkāršāku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka rindas beigās nav semikola.<\/span> <span class=\"sg\" data-s=\"1\">Šī rinda ir pēdējā koda blokā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc semikols tur nav vajadzīgs.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tādas mazas un vienkāršas funkcijas bieži raksta vienā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Tad kods ir īsāks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nav datu, ko atgriezt<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz funkcijai jāatgriežas pirms tās ķermeņa beigām.<\/span> <span class=\"sg\" data-s=\"1\">Ja funkcija neatgriež rezultātu, izmantojiet <code>return<\/code> bez vērtības.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x ir virs limita\";\n}<\/code><\/pre>"]]},"ru":{"t":"Возврат результата","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Часто функция что-то делает и ещё возвращает результат.<\/span> <span class=\"sg\" data-s=\"1\">Например, в функциональном программировании у функций не должно быть побочных эффектов.<\/span> <span class=\"sg\" data-s=\"2\">Вывод на консоль — один из таких побочных эффектов.<\/span> <span class=\"sg\" data-s=\"3\">Но Raku разрешает так делать.<\/span> <span class=\"sg\" data-s=\"4\">Давайте посмотрим, как функция возвращает значение.<\/span> <span class=\"sg\" data-s=\"5\">Мы также посмотрим, как вызывающий код получает это значение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь функция <code>add<\/code> принимает два числа.<\/span> <span class=\"sg\" data-s=\"1\">Она возвращает их сумму.<\/span> <span class=\"sg\" data-s=\"2\">В коде функции есть слово <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вызывающий код может использовать это значение как любое другое.<\/span> <span class=\"sg\" data-s=\"4\">В программе выше мы присваиваем его переменной.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последнее значение<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат может быть последним значением в теле функции.<\/span> <span class=\"sg\" data-s=\"1\">Тогда в Raku вам не нужно писать <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому мы можем сделать нашу функцию <code>add<\/code> проще:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: в конце строки нет точки с запятой.<\/span> <span class=\"sg\" data-s=\"1\">Это последняя строка в блоке кода.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому точка с запятой там не нужна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такие маленькие и простые функции часто пишут в одну строку.<\/span> <span class=\"sg\" data-s=\"1\">Тогда код короче:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Нечего возвращать<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда из функции нужно выйти до конца её тела.<\/span> <span class=\"sg\" data-s=\"1\">Если функция не возвращает результат, напишите <code>return<\/code> без значения.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"uk":{"t":"Повернення результату","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Часто функція щось робить і ще повертає результат.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, у функціональному програмуванні функції не повинні мати побічних ефектів.<\/span> <span class=\"sg\" data-s=\"2\">Виведення на консоль — один із таких побічних ефектів.<\/span> <span class=\"sg\" data-s=\"3\">Але Raku дозволяє це робити.<\/span> <span class=\"sg\" data-s=\"4\">Давайте подивимося, як функція повертає значення.<\/span> <span class=\"sg\" data-s=\"5\">Ми також побачимо, як його отримує код, що викликає функцію.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут функція <code>add<\/code> приймає два числа.<\/span> <span class=\"sg\" data-s=\"1\">Вона повертає їхню суму.<\/span> <span class=\"sg\" data-s=\"2\">У коді функції є слово <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Код, що викликає функцію, може використовувати це значення як будь-яке інше.<\/span> <span class=\"sg\" data-s=\"4\">У програмі вище ми присвоюємо його змінній.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Останнє значення<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат може бути останнім значенням у тілі функції.<\/span> <span class=\"sg\" data-s=\"1\">Тоді в Raku не треба писати <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож ми можемо зробити нашу функцію <code>add<\/code> простішою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу: у кінці рядка немає крапки з комою.<\/span> <span class=\"sg\" data-s=\"1\">Цей рядок — останній у блоці коду.<\/span> <span class=\"sg\" data-s=\"2\">Тому крапка з комою там не потрібна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такі маленькі й прості функції часто пишуть в один рядок.<\/span> <span class=\"sg\" data-s=\"1\">Тоді код коротший:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Немає даних для повернення<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді з функції треба повернутися до кінця її тіла.<\/span> <span class=\"sg\" data-s=\"1\">Якщо функція не повертає результату, пишіть <code>return<\/code> без значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x перевищує ліміт\";\n}<\/code><\/pre>"]]},"bg":{"t":"Връщане на резултат","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Често функцията прави нещо и освен това връща резултат.<\/span> <span class=\"sg\" data-s=\"1\">Във функционалното програмиране, например, функциите не трябва да имат странични ефекти.<\/span> <span class=\"sg\" data-s=\"2\">Печатането на конзолата е един такъв страничен ефект.<\/span> <span class=\"sg\" data-s=\"3\">Но Raku ви позволява да го правите.<\/span> <span class=\"sg\" data-s=\"4\">Нека видим как функцията връща стойност.<\/span> <span class=\"sg\" data-s=\"5\">Ще видим и как извикващият код получава тази стойност.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук функцията <code>add<\/code> приема две числа.<\/span> <span class=\"sg\" data-s=\"1\">Тя връща тяхната сума.<\/span> <span class=\"sg\" data-s=\"2\">Функцията има думата <code>return<\/code> в своя код.<\/span> <span class=\"sg\" data-s=\"3\">Извикващият код може да използва тази стойност като всяка друга стойност.<\/span> <span class=\"sg\" data-s=\"4\">В програмата по-горе я присвояваме на променлива.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последната стойност<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Резултатът може да е последната стойност в тялото на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Тогава в Raku не е нужно да пишете <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така можем да направим нашата функция <code>add<\/code> по-проста:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че редът няма точка и запетая в края.<\/span> <span class=\"sg\" data-s=\"1\">Редът е последният в блока код.<\/span> <span class=\"sg\" data-s=\"2\">Затова там не е нужна точка и запетая.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Малки и прости функции като тази често се пишат на един ред.<\/span> <span class=\"sg\" data-s=\"1\">Тогава кодът е по-кратък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Няма данни за връщане<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога функцията трябва да излезе преди края на своето тяло.<\/span> <span class=\"sg\" data-s=\"1\">Ако функцията не връща резултат, използвайте <code>return<\/code> без стойност.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x е над лимита\";\n}<\/code><\/pre>"]]},"eo":{"t":"Redonante la rezulton","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ofte funkcio faras ion kaj ankaŭ redonas rezulton.<\/span> <span class=\"sg\" data-s=\"1\">En funkcia programado, ekzemple, funkcioj ne devus havi flankajn efikojn.<\/span> <span class=\"sg\" data-s=\"2\">Presi al la konzolo estas unu tia flanka efiko.<\/span> <span class=\"sg\" data-s=\"3\">Sed Raku permesas al vi fari tion.<\/span> <span class=\"sg\" data-s=\"4\">Ni vidu, kiel funkcio redonas valoron.<\/span> <span class=\"sg\" data-s=\"5\">Ni ankaŭ vidas, kiel la vokanta kodo ricevas ĉi tiun valoron.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la funkcio <code>add<\/code> prenas du nombrojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas ilian sumon.<\/span> <span class=\"sg\" data-s=\"2\">La funkcio havas la vorton <code>return<\/code> en sia kodo.<\/span> <span class=\"sg\" data-s=\"3\">La vokanta kodo povas uzi ĉi tiun valoron kiel ajnan alian valoron.<\/span> <span class=\"sg\" data-s=\"4\">En la supra programo, ni asignas ĝin al variablo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La lasta valoro<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La rezulto povas esti la lasta valoro en la korpo de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Tiam, en Raku, vi ne devas skribi <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do ni povas fari nian funkcion <code>add<\/code> pli simpla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke la linio ne havas punkto-komon ĉe la fino.<\/span> <span class=\"sg\" data-s=\"1\">La linio estas la lasta en la kodobloko.<\/span> <span class=\"sg\" data-s=\"2\">Do tie ne necesas punkto-komo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tiajn malgrandajn kaj simplajn funkciojn oni ofte skribas en unu linio.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la kodo estas pli mallonga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neniuj datumoj por redoni<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje funkcio devas reveni antaŭ la fino de sia korpo.<\/span> <span class=\"sg\" data-s=\"1\">Se la funkcio ne redonas rezulton, uzu <code>return<\/code> sen valoro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x estas super la limo\";\n}<\/code><\/pre>"]]},"la":{"t":"Redonando resultatum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Saepe functio aliquid facit et etiam eventum reddit.<\/span> <span class=\"sg\" data-s=\"1\">In programmate functionali, exempli gratia, functiones nullos effectus laterales habere debent.<\/span> <span class=\"sg\" data-s=\"2\">Imprimere ad consolam est talis effectus lateralis.<\/span> <span class=\"sg\" data-s=\"3\">Sed Raku hoc tibi permittit.<\/span> <span class=\"sg\" data-s=\"4\">Videamus quomodo functio valorem reddit.<\/span> <span class=\"sg\" data-s=\"5\">Etiam videmus quomodo codex vocans hunc valorem accipit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic functio <code>add<\/code> duos numeros accipit.<\/span> <span class=\"sg\" data-s=\"1\">Summam eorum reddit.<\/span> <span class=\"sg\" data-s=\"2\">Functio verbum <code>return<\/code> in codice suo habet.<\/span> <span class=\"sg\" data-s=\"3\">Codex vocans hunc valorem sicut quemlibet alium valorem adhibere potest.<\/span> <span class=\"sg\" data-s=\"4\">In programmate supra eum variabili assignamus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ultimus valor<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eventus potest esse ultimus valor in corpore functionis.<\/span> <span class=\"sg\" data-s=\"1\">Tum in Raku non necesse est <code>return<\/code> scribere.<\/span> <span class=\"sg\" data-s=\"2\">Itaque functionem nostram <code>add<\/code> simpliciorem facere possumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota: linea in fine punctum-commatum non habet.<\/span> <span class=\"sg\" data-s=\"1\">Linea est ultima in clausula codicis.<\/span> <span class=\"sg\" data-s=\"2\">Itaque punctum-commatum ibi non necessarium est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tales parvas et simplices functiones saepe in una linea scribimus.<\/span> <span class=\"sg\" data-s=\"1\">Tum codex brevior est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nulla data reddenda<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum functio ante finem corporis sui redire debet.<\/span> <span class=\"sg\" data-s=\"1\">Si functio nullum eventum reddit, utere <code>return<\/code> sine valore.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x est supra limitem\";\n}<\/code><\/pre>"]]}}}</script>
