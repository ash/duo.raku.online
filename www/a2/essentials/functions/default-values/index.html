<script type="application/json" id="page-data">{"u":"essentials/functions/default-values","n":281,"k":"topic","pv":"essentials/functions/named-parameters/quiz2","nx":"essentials/functions/default-values/quiz1","tr":["essentials","essentials/functions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Default values","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Positional and named parameters can have default values.<\/span> <span class=\"sg\" data-s=\"1\">A parameter with a default value is not required.<\/span> <span class=\"sg\" data-s=\"2\">You can skip it when you call the function.<\/span> <span class=\"sg\" data-s=\"3\">Then the parameter gets its default value.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positional parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here is an example.<\/span> <span class=\"sg\" data-s=\"1\">The function has a positional parameter with a default value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The first call passes a name as its only argument.<\/span> <span class=\"sg\" data-s=\"1\">So it prints <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The second call uses the default value.<\/span> <span class=\"sg\" data-s=\"3\">It prints <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes a function has more than one parameter.<\/span> <span class=\"sg\" data-s=\"1\">Then the default values must be at the end of the list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # WRONG<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Named parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Named parameters get default values in the same way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The order of named parameters does not matter.<\/span> <span class=\"sg\" data-s=\"1\">So any of them can have a default value.<\/span> <span class=\"sg\" data-s=\"2\">Even the first one in the list can have it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"de":{"t":"Standardwerte","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Positionsparameter und benannte Parameter können Standardwerte haben.<\/span> <span class=\"sg\" data-s=\"1\">Ein Parameter mit Standardwert ist nicht Pflicht.<\/span> <span class=\"sg\" data-s=\"2\">Beim Aufruf der Funktion können Sie ihn weglassen.<\/span> <span class=\"sg\" data-s=\"3\">Dann bekommt der Parameter seinen Standardwert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionsparameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel.<\/span> <span class=\"sg\" data-s=\"1\">Die Funktion hat einen Positionsparameter mit Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf übergibt einen Namen als einziges Argument.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb druckt er <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der zweite Aufruf verwendet den Standardwert.<\/span> <span class=\"sg\" data-s=\"3\">Er druckt <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal hat eine Funktion mehr als einen Parameter.<\/span> <span class=\"sg\" data-s=\"1\">Dann müssen die Standardwerte am Ende der Liste stehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # korrekt\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSCH<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benannte Parameter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Benannte Parameter bekommen Standardwerte auf die gleiche Weise:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Reihenfolge der benannten Parameter spielt keine Rolle.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb kann jeder von ihnen einen Standardwert haben.<\/span> <span class=\"sg\" data-s=\"2\">Auch der erste in der Liste kann einen haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"nl":{"t":"Standaardwaarden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Positionele en benoemde parameters kunnen standaardwaarden hebben.<\/span> <span class=\"sg\" data-s=\"1\">Een parameter met een standaardwaarde is niet verplicht.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt hem weglaten als je de functie aanroept.<\/span> <span class=\"sg\" data-s=\"3\">Dan krijgt de parameter zijn standaardwaarde.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionele parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld.<\/span> <span class=\"sg\" data-s=\"1\">De functie heeft een positionele parameter met een standaardwaarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep geeft een naam door als enig argument.<\/span> <span class=\"sg\" data-s=\"1\">Daarom print hij <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De tweede aanroep gebruikt de standaardwaarde.<\/span> <span class=\"sg\" data-s=\"3\">Hij print <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms heeft een functie meer dan één parameter.<\/span> <span class=\"sg\" data-s=\"1\">Dan moeten de standaardwaarden aan het einde van de lijst staan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FOUT<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benoemde parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Benoemde parameters krijgen op dezelfde manier standaardwaarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De volgorde van benoemde parameters maakt niet uit.<\/span> <span class=\"sg\" data-s=\"1\">Dus elke parameter kan een standaardwaarde hebben.<\/span> <span class=\"sg\" data-s=\"2\">Zelfs de eerste in de lijst kan er een hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"es":{"t":"Valores predeterminados","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Los parámetros posicionales y nombrados pueden tener valores predeterminados.<\/span> <span class=\"sg\" data-s=\"1\">Un parámetro con valor predeterminado no es obligatorio.<\/span> <span class=\"sg\" data-s=\"2\">Puedes omitirlo cuando llamas a la función.<\/span> <span class=\"sg\" data-s=\"3\">Entonces el parámetro recibe su valor predeterminado.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros posicionales<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un ejemplo.<\/span> <span class=\"sg\" data-s=\"1\">La función tiene un parámetro posicional con un valor predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La primera llamada pasa un nombre como único argumento.<\/span> <span class=\"sg\" data-s=\"1\">Por eso imprime <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La segunda llamada usa el valor predeterminado.<\/span> <span class=\"sg\" data-s=\"3\">Imprime <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces una función tiene más de un parámetro.<\/span> <span class=\"sg\" data-s=\"1\">Entonces los valores predeterminados deben estar al final de la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correcto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # INCORRECTO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros nombrados<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los parámetros nombrados reciben valores predeterminados de la misma forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El orden de los parámetros nombrados no importa.<\/span> <span class=\"sg\" data-s=\"1\">Así que cualquiera de ellos puede tener un valor predeterminado.<\/span> <span class=\"sg\" data-s=\"2\">Incluso el primero de la lista puede tenerlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"it":{"t":"Valori predefiniti","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">I parametri posizionali e nominati possono avere valori predefiniti.<\/span> <span class=\"sg\" data-s=\"1\">Un parametro con un valore predefinito non è obbligatorio.<\/span> <span class=\"sg\" data-s=\"2\">Puoi saltarlo quando chiami la funzione.<\/span> <span class=\"sg\" data-s=\"3\">Allora il parametro prende il suo valore predefinito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri posizionali<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio.<\/span> <span class=\"sg\" data-s=\"1\">La funzione ha un parametro posizionale con un valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata passa un nome come unico argomento.<\/span> <span class=\"sg\" data-s=\"1\">Così stampa <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La seconda chiamata usa il valore predefinito.<\/span> <span class=\"sg\" data-s=\"3\">Stampa <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte una funzione ha più di un parametro.<\/span> <span class=\"sg\" data-s=\"1\">Allora i valori predefiniti devono stare alla fine dell'elenco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # corretto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # SBAGLIATO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I parametri nominati prendono i valori predefiniti nello stesso modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'ordine dei parametri nominati non importa.<\/span> <span class=\"sg\" data-s=\"1\">Così ognuno di loro può avere un valore predefinito.<\/span> <span class=\"sg\" data-s=\"2\">Anche il primo dell'elenco può averlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"lv":{"t":"Noklusējuma vērtības","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Pozicionālajiem un nosauktajiem parametriem var būt noklusējuma vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Parametrs ar noklusējuma vērtību nav obligāts.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat to izlaist, kad izsaucat funkciju.<\/span> <span class=\"sg\" data-s=\"3\">Tad parametrs saņem savu noklusējuma vērtību.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pozicionālie parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lūk, piemērs.<\/span> <span class=\"sg\" data-s=\"1\">Funkcijai ir pozicionāls parametrs ar noklusējuma vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pirmais izsaukums nodod vārdu kā vienīgo argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tas izdrukā <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Otrais izsaukums izmanto noklusējuma vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tas izdrukā <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz funkcijai ir vairāk nekā viens parametrs.<\/span> <span class=\"sg\" data-s=\"1\">Tad noklusējuma vērtībām jābūt saraksta beigās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # pareizi\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # NEPAREIZI<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosauktie parametri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nosauktie parametri saņem noklusējuma vērtības tāpat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nosaukto parametru secība nav svarīga.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jebkuram no tiem var būt noklusējuma vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Tā var būt pat pirmajam sarakstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"ru":{"t":"Значения по умолчанию","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Позиционные и именованные параметры могут иметь значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">Параметр со значением по умолчанию не обязателен.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете пропустить его, когда вызываете функцию.<\/span> <span class=\"sg\" data-s=\"3\">Тогда параметр получает своё значение по умолчанию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционные параметры<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот пример.<\/span> <span class=\"sg\" data-s=\"1\">У функции есть позиционный параметр со значением по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Первый вызов передаёт имя как единственный аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому он печатает <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Второй вызов использует значение по умолчанию.<\/span> <span class=\"sg\" data-s=\"3\">Он печатает <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда у функции больше одного параметра.<\/span> <span class=\"sg\" data-s=\"1\">Тогда значения по умолчанию должны быть в конце списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные параметры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именованные параметры получают значения по умолчанию так же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Порядок именованных параметров не важен.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому значение по умолчанию может быть у любого из них.<\/span> <span class=\"sg\" data-s=\"2\">Оно может быть даже у первого в списке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"uk":{"t":"Значення за замовчуванням","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Позиційні та іменовані параметри можуть мати значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Параметр зі значенням за замовчуванням не обов'язковий.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете пропустити його, коли викликаєте функцію.<\/span> <span class=\"sg\" data-s=\"3\">Тоді параметр отримує своє значення за замовчуванням.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиційні параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось приклад.<\/span> <span class=\"sg\" data-s=\"1\">Функція має позиційний параметр зі значенням за замовчуванням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перший виклик передає ім'я як єдиний аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Тому він виводить <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Другий виклик використовує значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"3\">Він виводить <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді функція має більше одного параметра.<\/span> <span class=\"sg\" data-s=\"1\">Тоді значення за замовчуванням мають бути в кінці списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Іменовані параметри отримують значення за замовчуванням так само:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Порядок іменованих параметрів не має значення.<\/span> <span class=\"sg\" data-s=\"1\">Тому будь-який з них може мати значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"2\">Навіть перший у списку може його мати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"bg":{"t":"Стойности по подразбиране","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Позиционните и именуваните параметри могат да имат стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Параметър със стойност по подразбиране не е задължителен.<\/span> <span class=\"sg\" data-s=\"2\">Можете да го пропуснете, когато извиквате функцията.<\/span> <span class=\"sg\" data-s=\"3\">Тогава параметърът получава своята стойност по подразбиране.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционни параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето един пример.<\/span> <span class=\"sg\" data-s=\"1\">Функцията има позиционен параметър със стойност по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първото извикване предава име като единствен аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Затова то отпечатва <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Второто извикване използва стойността по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">То отпечатва <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога функцията има повече от един параметър.<\/span> <span class=\"sg\" data-s=\"1\">Тогава стойностите по подразбиране трябва да са в края на списъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правилно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # ГРЕШНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Именуваните параметри получават стойности по подразбиране по същия начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Редът на именуваните параметри няма значение.<\/span> <span class=\"sg\" data-s=\"1\">Затова всеки от тях може да има стойност по подразбиране.<\/span> <span class=\"sg\" data-s=\"2\">Дори първият в списъка може да има такава:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"eo":{"t":"Defaŭltaj valoroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Poziciaj kaj nomitaj parametroj povas havi defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Parametro kun defaŭlta valoro ne estas deviga.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas preterlasi ĝin, kiam vi vokas la funkcion.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la parametro ricevas sian defaŭltan valoron.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Poziciaj parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">La funkcio havas pozician parametron kun defaŭlta valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La unua voko pasas nomon kiel sian solan argumenton.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi presas <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La dua voko uzas la defaŭltan valoron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi presas <code>Hello, World!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje funkcio havas pli ol unu parametron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la defaŭltaj valoroj devas esti ĉe la fino de la listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # ĝuste\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # MALĜUSTE<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj parametroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nomitaj parametroj ricevas defaŭltajn valorojn laŭ la sama maniero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La ordo de nomitaj parametroj ne gravas.<\/span> <span class=\"sg\" data-s=\"1\">Do ĉiu el ili povas havi defaŭltan valoron.<\/span> <span class=\"sg\" data-s=\"2\">Eĉ la unua en la listo povas havi ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"la":{"t":"Defaulte valores","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametri positionis et nominati valores praedefinitos habere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Parameter cum valore praedefinito non necessarius est.<\/span> <span class=\"sg\" data-s=\"2\">Eum omittere potes cum functionem vocas.<\/span> <span class=\"sg\" data-s=\"3\">Tum parameter valorem suum praedefinitum accipit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri positionis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecce exemplum.<\/span> <span class=\"sg\" data-s=\"1\">Functio parametrum positionis cum valore praedefinito habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta($nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta('Merinda');\nsaluta();<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio nomen ut solum argumentum dat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>Salve, Merinda!<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Secunda vocatio valorem praedefinitum adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Ea imprimit <code>Salve, Mundus!<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum functio plus quam unum parametrum habet.<\/span> <span class=\"sg\" data-s=\"1\">Tum valores praedefiniti in fine indicis esse debent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # rectum\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSUM<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Parametri nominati eodem modo valores praedefinitos accipiunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Merinda'); # Salve, Merinda!\nsaluta(); # Salve, Mundus!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ordo parametrorum nominatorum non refert.<\/span> <span class=\"sg\" data-s=\"1\">Itaque quilibet eorum valorem praedefinitum habere potest.<\/span> <span class=\"sg\" data-s=\"2\">Etiam primus in indice eum habere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$salutatio = 'Salve', :$nomen) {\n    say \"$salutatio, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Alla'); # Salve, Alla!<\/code><\/pre>"]]}}}</script>
