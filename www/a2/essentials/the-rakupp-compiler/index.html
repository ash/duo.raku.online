span> <span class=\"sg\" data-s=\"2\">Può anche trasformare un programma in codice nativo.<\/span> <span class=\"sg\" data-s=\"3\">Così il programma diventa più veloce.<\/span> <span class=\"sg\" data-s=\"4\">Non deve prima avviare un grande sistema di runtime.<\/span> <span class=\"sg\" data-s=\"5\">Quindi <code>rakupp<\/code> parte in pochi millisecondi.<\/span> <span class=\"sg\" data-s=\"6\">Per questo è comodo per gli script brevi.<\/span> <span class=\"sg\" data-s=\"7\">È comodo anche per il lavoro di ogni giorno sulla riga di comando.<\/span> <span class=\"sg\" data-s=\"8\">Il suo autore lo chiama il compilatore Raku più veloce.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalmente, Raku++ supporta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Supporta anche 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Un programma chiede 6.e con <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La versione 5.4.1 è uscita nell'ottobre 2026.<\/span> <span class=\"sg\" data-s=\"4\">Supera tutti i 1.425 file di test di Roast.<\/span> <span class=\"sg\" data-s=\"5\">Roast è l'insieme ufficiale dei test di Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ gira anche in un browser web.<\/span> <span class=\"sg\" data-s=\"1\">Per questo, è compilato in WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">Il campo da gioco su <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> usa Raku++.<\/span> <span class=\"sg\" data-s=\"3\">Lì puoi provare Raku senza installare niente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modalità interprete e compilatore<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esegui un programma direttamente, come con Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Oppure chiedi a Raku++ di fare un file di programma nativo.<\/span> <span class=\"sg\" data-s=\"1\">Funziona da solo.<\/span> <span class=\"sg\" data-s=\"2\">Ed è ancora più veloce:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per imparare ogni giorno, ti serve solo la semplice modalità interprete.<\/span> <span class=\"sg\" data-s=\"1\">Le modalità di compilazione servono per avere più velocità.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ è open source.<\/span> <span class=\"sg\" data-s=\"1\">Lo trovi su <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La pagina ha anche i file delle release e le istruzioni per compilarlo.<\/span><\/p>"]]},"lv":{"t":"Kompilators Raku++ 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> ir otrs Raku kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Tā programmas fails saucas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pirmā versija iznāca 2026. gada jūlijā.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo darbojas uz MoarVM virtuālās mašīnas.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ ir citāds.<\/span> <span class=\"sg\" data-s=\"5\">Tā autors to uzrakstīja <strong>C++<\/strong> valodā.<\/span> <span class=\"sg\" data-s=\"6\">Tam nav vajadzīga sava virtuālā mašīna.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Tas vienlaikus ir <strong>interpretators<\/strong> un <strong>kompilators<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas var izpildīt programmu tieši.<\/span> <span class=\"sg\" data-s=\"2\">Tas var arī pārvērst programmu mašīnkodā.<\/span> <span class=\"sg\" data-s=\"3\">Tad programma darbojas ātrāk.<\/span> <span class=\"sg\" data-s=\"4\">Tam nav vispirms jāpalaiž liela izpildlaika sistēma.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc <code>rakupp<\/code> startē tikai dažās milisekundēs.<\/span> <span class=\"sg\" data-s=\"6\">Tas ir ērts īsiem skriptiem.<\/span> <span class=\"sg\" data-s=\"7\">Tas ir ērts arī ikdienas darbam komandrindā.<\/span> <span class=\"sg\" data-s=\"8\">Tā autors to sauc par ātrāko Raku kompilatoru.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma Raku++ atbalsta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Tas atbalsta arī 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Programma pieprasa 6.e ar <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Versija 5.4.1 iznāca 2026. gada oktobrī.<\/span> <span class=\"sg\" data-s=\"4\">Tā iztur visus 1425 Roast testu failus.<\/span> <span class=\"sg\" data-s=\"5\">Roast ir oficiālā Raku testu kopa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ darbojas arī tīmekļa pārlūkprogrammā.<\/span> <span class=\"sg\" data-s=\"1\">Pārlūkam to kompilē uz WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">Spēļu laukums vietnē <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> darbojas ar to.<\/span> <span class=\"sg\" data-s=\"3\">Tur jūs varat izmēģināt Raku, neko neinstalējot.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpretatora un kompilatora režīmi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu tieši, tāpat kā ar Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vai arī palūdziet Raku++ izveidot mašīnkoda programmas failu.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas patstāvīgi.<\/span> <span class=\"sg\" data-s=\"2\">Un tas ir vēl ātrāks:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ikdienas mācībām jums vajag tikai vienkāršo interpretatora režīmu.<\/span> <span class=\"sg\" data-s=\"1\">Kompilēšanas režīmi ir papildu ātrumam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To var atrast vietnē <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Šajā lapā ir arī izlaidumu faili un norādes, kā to uzbūvēt.<\/span><\/p>"]]},"ru":{"t":"Компилятор Raku++ 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — это второй компилятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Файл его программы называется <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Первая версия вышла в июле 2026 года.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo работает на виртуальной машине MoarVM.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ устроен по-другому.<\/span> <span class=\"sg\" data-s=\"5\">Автор написал его на <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Ему не нужна своя виртуальная машина.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Он одновременно и <strong>интерпретатор<\/strong>, и <strong>компилятор<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Он может выполнить программу напрямую.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он может превратить программу в машинный код.<\/span> <span class=\"sg\" data-s=\"3\">Так она работает быстрее.<\/span> <span class=\"sg\" data-s=\"4\">Ему не нужно сначала запускать большую среду выполнения.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому <code>rakupp<\/code> запускается всего за несколько миллисекунд.<\/span> <span class=\"sg\" data-s=\"6\">Это удобно для коротких скриптов.<\/span> <span class=\"sg\" data-s=\"7\">Это удобно и для повседневной работы в командной строке.<\/span> <span class=\"sg\" data-s=\"8\">Автор называет его самым быстрым компилятором Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">По умолчанию Raku++ поддерживает Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Он также поддерживает 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Программа просит 6.e с помощью <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Версия 5.4.1 вышла в октябре 2026 года.<\/span> <span class=\"sg\" data-s=\"4\">Она проходит все 1425 тестовых файлов Roast.<\/span> <span class=\"sg\" data-s=\"5\">Roast — это официальный набор тестов Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ также работает в веб-браузере.<\/span> <span class=\"sg\" data-s=\"1\">Для этого его компилируют в WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">Песочница на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> работает на нём.<\/span> <span class=\"sg\" data-s=\"3\">Там вы можете попробовать Raku, ничего не устанавливая.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режимы интерпретатора и компилятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите программу напрямую, как с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Или попросите Raku++ сделать файл программы в машинном коде.<\/span> <span class=\"sg\" data-s=\"1\">Он работает сам по себе.<\/span> <span class=\"sg\" data-s=\"2\">И он ещё быстрее:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для обычной учёбы вам нужен только простой режим интерпретатора.<\/span> <span class=\"sg\" data-s=\"1\">Режимы компиляции нужны для большей скорости.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете найти его на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На этой странице также есть файлы выпусков и инструкции по сборке.<\/span><\/p>"]]},"uk":{"t":"Компілятор Raku++","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — це другий компілятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Його файл програми називається <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Перша версія вийшла в липні 2026 року.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo працює на віртуальній машині MoarVM.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ інший.<\/span> <span class=\"sg\" data-s=\"5\">Автор написав його мовою <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Йому не потрібна власна віртуальна машина.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Він одночасно <strong>інтерпретатор<\/strong> і <strong>компілятор<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Він може запускати програму напряму.<\/span> <span class=\"sg\" data-s=\"2\">Він також може перетворити програму на машинний код.<\/span> <span class=\"sg\" data-s=\"3\">Так програма працює швидше.<\/span> <span class=\"sg\" data-s=\"4\">Йому не треба спочатку запускати велике середовище виконання.<\/span> <span class=\"sg\" data-s=\"5\">Тому <code>rakupp<\/code> стартує лише за кілька мілісекунд.<\/span> <span class=\"sg\" data-s=\"6\">Це робить його зручним для коротких скриптів.<\/span> <span class=\"sg\" data-s=\"7\">Він також зручний для щоденної роботи в командному рядку.<\/span> <span class=\"sg\" data-s=\"8\">Автор називає його найшвидшим компілятором Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням Raku++ підтримує Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Він також підтримує 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Програма просить 6.e рядком <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Версія 5.4.1 вийшла в жовтні 2026 року.<\/span> <span class=\"sg\" data-s=\"4\">Вона проходить усі 1425 тестових файлів Roast.<\/span> <span class=\"sg\" data-s=\"5\">Roast — це офіційний набір тестів Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ також працює у веб-браузері.<\/span> <span class=\"sg\" data-s=\"1\">Для цього його компілюють у WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">Майданчик на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> працює на ньому.<\/span> <span class=\"sg\" data-s=\"3\">Там ви можете спробувати Raku, нічого не встановлюючи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими інтерпретатора й компілятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму напряму, як з Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Або попросіть Raku++ зробити файл програми з машинним кодом.<\/span> <span class=\"sg\" data-s=\"1\">Він працює сам по собі.<\/span> <span class=\"sg\" data-s=\"2\">І він ще швидший:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для щоденного навчання вам потрібен лише простий режим інтерпретатора.<\/span> <span class=\"sg\" data-s=\"1\">Режими компіляції — для додаткової швидкості.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете знайти його на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На цій сторінці також є файли випусків та інструкції, як його зібрати.<\/span><\/p>"]]},"bg":{"t":"Компилаторът Raku++","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> е втори компилатор на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Програмният му файл се казва <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Първата версия излезе през юли 2026.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo работи върху виртуалната машина MoarVM.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ е различен.<\/span> <span class=\"sg\" data-s=\"5\">Авторът му го написа на <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Той няма нужда от собствена виртуална машина.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Той е едновременно <strong>интерпретатор<\/strong> и <strong>компилатор<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Може да изпълни програма направо.<\/span> <span class=\"sg\" data-s=\"2\">Може и да превърне програмата в машинен код.<\/span> <span class=\"sg\" data-s=\"3\">Така тя става по-бърза.<\/span> <span class=\"sg\" data-s=\"4\">Не трябва първо да стартира голяма среда за изпълнение.<\/span> <span class=\"sg\" data-s=\"5\">Затова <code>rakupp<\/code> тръгва само за няколко милисекунди.<\/span> <span class=\"sg\" data-s=\"6\">Така той е удобен за кратки скриптове.<\/span> <span class=\"sg\" data-s=\"7\">Удобен е и за ежедневна работа в командния ред.<\/span> <span class=\"sg\" data-s=\"8\">Авторът му го нарича най-бързия компилатор на Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">По подразбиране Raku++ поддържа Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Той поддържа и 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Програмата иска 6.e с <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Версия 5.4.1 излезе през октомври 2026.<\/span> <span class=\"sg\" data-s=\"4\">Тя минава всички 1425 тестови файла на Roast.<\/span> <span class=\"sg\" data-s=\"5\">Roast е официалният набор от тестове на Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ работи и в уеб браузър.<\/span> <span class=\"sg\" data-s=\"1\">За това той е компилиран до WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">Площадката на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> работи с него.<\/span> <span class=\"sg\" data-s=\"3\">Там можете да пробвате Raku, без да инсталирате нищо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими на интерпретатор и компилатор<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Изпълнете програма направо, както с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Или помолете Raku++ да направи машинен програмен файл.<\/span> <span class=\"sg\" data-s=\"1\">Той работи сам.<\/span> <span class=\"sg\" data-s=\"2\">И е още по-бърз:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За ежедневно учене ви трябва само простият режим на интерпретатор.<\/span> <span class=\"sg\" data-s=\"1\">Компилиращите режими са за допълнителна скорост.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го намерите на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там има и файлове на изданията и указания за изграждане.<\/span><\/p>"]]},"eo":{"t":"La kompililo Raku++ 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> estas dua kompililo de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia programdosiero nomiĝas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La unua versio aperis en julio 2026.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo rulas sur la virtuala maŝino MoarVM.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ estas malsama.<\/span> <span class=\"sg\" data-s=\"5\">Ĝia aŭtoro verkis ĝin en <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ne bezonas propran virtualan maŝinon.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ĝi estas samtempe <strong>interpretilo<\/strong> kaj <strong>kompililo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas ruli programon rekte.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ povas ŝanĝi programon en maŝinan kodon.<\/span> <span class=\"sg\" data-s=\"3\">Tio faras ĝin pli rapida.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ne bezonas unue starti grandan rultempan sistemon.<\/span> <span class=\"sg\" data-s=\"5\">Do <code>rakupp<\/code> startas en nur kelkaj milisekundoj.<\/span> <span class=\"sg\" data-s=\"6\">Tio faras ĝin agrabla por mallongaj skriptoj.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi estas ankaŭ agrabla por ĉiutaga laboro en la komandlinio.<\/span> <span class=\"sg\" data-s=\"8\">Ĝia aŭtoro nomas ĝin la plej rapida kompililo de Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, Raku++ subtenas Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ subtenas 6.e.<\/span> <span class=\"sg\" data-s=\"2\">Programo petas 6.e per <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Versio 5.4.1 aperis en oktobro 2026.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi trapasas ĉiujn 1425 testodosierojn de Roast.<\/span> <span class=\"sg\" data-s=\"5\">Roast estas la oficiala aro de testoj de Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ ankaŭ rulas en retumilo.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, oni kompilas ĝin al WebAssembly.<\/span> <span class=\"sg\" data-s=\"2\">La provejo ĉe <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> funkcias per ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Tie vi povas provi Raku sen instali ion ajn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reĝimoj de interpretilo kaj kompililo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu programon rekte, kiel per Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aŭ petu al Raku++ fari maŝinkodan programdosieron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi rulas memstare.<\/span> <span class=\"sg\" data-s=\"2\">Kaj ĝi estas eĉ pli rapida:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ĉiutaga lernado, vi bezonas nur la simplan interpretilan reĝimon.<\/span> <span class=\"sg\" data-s=\"1\">La kompilaj reĝimoj estas por plia rapideco.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin ĉe <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La paĝo ankaŭ havas eldonajn dosierojn kaj instrukciojn por konstrui ĝin.<\/span><\/p>"]]},"la":{"t":"Compilator Raku++ 🆕","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> est alter compilator Raku.<\/span> <span class=\"sg\" data-s=\"1\">Fasciculus programmatis eius nomen <code>rakupp<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Prima versio mense Iulio anni 2026 apparuit.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo in machina virtuali MoarVM currit.<\/span> <span class=\"sg\" data-s=\"4\">Raku++ diversum est.<\/span> <span class=\"sg\" data-s=\"5\">Auctor eius id in <strong>C++<\/strong> scripsit.<\/span> <span class=\"sg\" data-s=\"6\">Machinam virtualem propriam non requirit.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Simul <strong>interpres<\/strong> et <strong>compilator<\/strong> est.<\/span> <span class=\"sg\" data-s=\"1\">Programma directe currere potest.<\/span> <span class=\"sg\" data-s=\"2\">Etiam programma in codicem nativum vertere potest.<\/span> <span class=\"sg\" data-s=\"3\">Hoc id celerius facit.<\/span> <span class=\"sg\" data-s=\"4\">Primum nullum magnum systema exsecutionis incipere debet.<\/span> <span class=\"sg\" data-s=\"5\">Itaque <code>rakupp<\/code> intra pauca millisecunda incipit.<\/span> <span class=\"sg\" data-s=\"6\">Ideo iucundum est ad brevia scripta.<\/span> <span class=\"sg\" data-s=\"7\">Etiam iucundum est ad cotidianum laborem in linea imperandi.<\/span> <span class=\"sg\" data-s=\"8\">Auctor eius id compilatorem Raku celerrimum vocat.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ex more Raku++ Raku 6.d sustinet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam 6.e sustinet.<\/span> <span class=\"sg\" data-s=\"2\">Programma 6.e petit per <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Versio 5.4.1 mense Octobri anni 2026 apparuit.<\/span> <span class=\"sg\" data-s=\"4\">Omnia 1425 archiva probationum Roast transit.<\/span> <span class=\"sg\" data-s=\"5\">Roast est series officialis probationum Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ etiam in navigatro interretiali currit.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc in WebAssembly compilatur.<\/span> <span class=\"sg\" data-s=\"2\">Palaestra apud <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> in eo currit.<\/span> <span class=\"sg\" data-s=\"3\">Ibi Raku experiri potes sine ulla installatione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modi interpretis et compilatoris<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma directe exsequere, sicut cum Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aut Raku++ iube fasciculum programmatis nativum facere.<\/span> <span class=\"sg\" data-s=\"1\">Per se currit.<\/span> <span class=\"sg\" data-s=\"2\">Et etiam celerius est:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad cotidianum discendum, modus interpretis simplex tibi satis est.<\/span> <span class=\"sg\" data-s=\"1\">Modi compilandi sunt ad maiorem celeritatem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Id apud <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a> invenire potes.<\/span> <span class=\"sg\" data-s=\"2\">Pagina etiam fasciculos emissos et praecepta aedificandi habet.<\/span><\/p>"]]}}}</script>
