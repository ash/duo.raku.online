"h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quale versione hai?<\/span> <span class=\"sg\" data-s=\"1\">Usa l'opzione <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa è la release di mutsu stesso.<\/span> <span class=\"sg\" data-s=\"1\">La versione del linguaggio Raku è un'altra cosa.<\/span> <span class=\"sg\" data-s=\"2\">La chiedi al linguaggio, come con gli altri compilatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Confronta questo con <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> e <a href=\"https://course.raku.org/it/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Guarda come mostrano le loro versioni.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ir gatavi mutsu būvējumi macOS un Linux sistēmām.<\/span> <span class=\"sg\" data-s=\"1\">Tie darbojas ar Intel/AMD un ar ARM procesoriem.<\/span> <span class=\"sg\" data-s=\"2\">Projekts ir GitHub vietnē: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Būvējumus var atrast tā izlaidumu lappusē.<\/span> <span class=\"sg\" data-s=\"4\">Katrā būvējumā ir divi programmas faili: pats <code>mutsu<\/code> un <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> ir tā pakotņu pārvaldnieks.<\/span> <span class=\"sg\" data-s=\"6\">Tas instalē Raku moduļus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vieglākais veids, kā instalēt izlaidumu, ir <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Šis rīks instalē un atjaunina rīkus izstrādātājiem.<\/span> <span class=\"sg\" data-s=\"2\">Jums vajag tikai vienu komandu.<\/span> <span class=\"sg\" data-s=\"3\">Tā lejupielādē būvējumu jūsu datoram.<\/span> <span class=\"sg\" data-s=\"4\">Tā arī pievieno <code>mutsu<\/code> un <code>mzef<\/code> jūsu <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ar Docker jūs varat lietot mutsu bez instalēšanas.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas jebkurā sistēmā ar Docker, arī Windows.<\/span> <span class=\"sg\" data-s=\"2\">Šī komanda palaiž interaktīvo REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un šī komanda palaiž programmu no pašreizējā direktorija:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Būvēšana no pirmkoda<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu ir uzrakstīts Rust valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat arī paši to uzbūvēt ar Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Ņemiet pirmkodu no tā repozitorija.<\/span> <span class=\"sg\" data-s=\"3\">Repozitorijs izskaidro detaļas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kāda versija jums ir?<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet opciju <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir paša mutsu izlaidums.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodas versija ir cita lieta.<\/span> <span class=\"sg\" data-s=\"2\">To jūs jautājat pašai valodai, tāpat kā ar citiem kompilatoriem:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> un <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Paskatieties, kā tie rāda savas versijas.<\/span><\/p>"]]},"ru":{"t":"Как установить mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У mutsu есть готовые сборки для macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Они работают на процессорах Intel/AMD и ARM.<\/span> <span class=\"sg\" data-s=\"2\">Проект находится на GitHub: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Сборки можно найти на его странице релизов.<\/span> <span class=\"sg\" data-s=\"4\">В каждой сборке есть две программы: сам <code>mutsu<\/code> и <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> — это его менеджер пакетов.<\/span> <span class=\"sg\" data-s=\"6\">Он устанавливает модули Raku.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С помощью mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Самый простой способ установить выпуск — <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Эта программа устанавливает и обновляет инструменты для разработчиков.<\/span> <span class=\"sg\" data-s=\"2\">Вам н \"2\">Её нужно спросить у самого языка, как и с другими компиляторами:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сравните это с <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите, как они показывают свои версии.<\/span><\/p>"]]},"uk":{"t":"Як встановити mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У mutsu є готові збірки для macOS і Linux.<\/span> <span class=\"sg\" data-s=\"1\">Вони працюють на процесорах Intel/AMD і ARM.<\/span> <span class=\"sg\" data-s=\"2\">Проєкт є на GitHub: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете знайти збірки на його сторінці випусків.<\/span> <span class=\"sg\" data-s=\"4\">Кожна збірка має два файли програм: сам <code>mutsu<\/code> і <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> — це його менеджер пакетів.<\/span> <span class=\"sg\" data-s=\"6\">Він встановлює модулі Raku.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Найпростіший спосіб встановити випуск — це <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ця програма встановлює й оновлює інструменти для розробників.<\/span> <span class=\"sg\" data-s=\"2\">Вам потрібна лише одна команда.<\/span> <span class=\"sg\" data-s=\"3\">Вона завантажує збірку для вашого комп'ютера.<\/span> <span class=\"sg\" data-s=\"4\">Вона також додає <code>mutsu<\/code> і <code>mzef<\/code> до вашого <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">З Docker ви можете користуватися mutsu без встановлення.<\/span> <span class=\"sg\" data-s=\"1\">Це працює в будь-якій системі з Docker, також у Windows.<\/span> <span class=\"sg\" data-s=\"2\">Ця команда запускає інтерактивну оболонку REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А ця команда запускає програму з поточного каталогу:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Збирання з вихідного коду<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu написано мовою Rust.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете й самі зібрати його за допомогою Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Використайте вихідний код з його репозиторію.<\/span> <span class=\"sg\" data-s=\"3\">Репозиторій пояснює всі подробиці.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Яка у вас версія?<\/span> <span class=\"sg\" data-s=\"1\">Використайте опцію <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це випуск самого mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Версія мови Raku — це інша річ.<\/span> <span class=\"sg\" data-s=\"2\">Про неї ви питаєте саму мову, як і з іншими компіляторами:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це з <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> і <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться, як вони показують свої версії.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu има готови компилации за macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Те работят на процесори Intel/AMD и ARM.<\/span> <span class=\"sg\" data-s=\"2\">Проектът е в GitHub: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Компилациите са на страницата му с издания.<\/span> <span class=\"sg\" data-s=\"4\">Всяка компилация има два програмни файла: самия <code>mutsu<\/code> и <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> е неговият мениджър на пакети.<\/span> <span class=\"sg\" data-s=\"6\">Той инсталира модули на Raku.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Най-лесният начин да инсталирате издание е <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Тази програма инсталира и обновява инструменти за разработчици.<\/span> <span class=\"sg\" data-s=\"2\">Трябва ви само една команда.<\/span> <span class=\"sg\" data-s=\"3\">Тя изтегля компилацията за вашия компютър.<\/span> <span class=\"sg\" data-s=\"4\">Освен това поставя <code>mutsu<\/code> и <code>mzef<\/code> във вашия <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С Docker можете да използвате mutsu, без да го инсталирате.<\/span> <span class=\"sg\" data-s=\"1\">Това работи на всяка система с Docker, също и на Windows.<\/span> <span class=\"sg\" data-s=\"2\">Тази команда стартира интерактивната обвивка REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А тази команда изпълнява програма от текущата директория:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изграждане от изходния код<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu е написан на Rust.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете и сами да го изградите с Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте изходния код от хранилището му.<\/span> <span class=\"sg\" data-s=\"3\">Хранилището обяснява подробностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коя версия имате?<\/span> <span class=\"sg\" data-s=\"1\">Използвайте опцията <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е изданието на самия mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Версията на езика Raku е друго нещо.<\/span> <span class=\"sg\" data-s=\"2\">За нея питате самия език, както при другите компилатори:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сравнете това с <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Вижте как те показват версиите си.<\/span><\/p>"]]},"eo":{"t":"Kiel instali mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu havas pretajn binaraĵojn por macOS kaj Linukso.<\/span> <span class=\"sg\" data-s=\"1\">Ili funkcias sur procesoroj Intel/AMD kaj ARM.<\/span> <span class=\"sg\" data-s=\"2\">La projekto estas en GitHub: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Vi trovas la binaraĵojn en ĝia eldona paĝo.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu binaraĵo havas du programdosierojn: <code>mutsu<\/code> mem kaj <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> estas ĝia pakaĵadministrilo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi instalas Raku-modulojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La plej facila maniero instali eldonon estas <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu ilo instalas kaj ĝisdatigas ilojn por programistoj.<\/span> <span class=\"sg\" data-s=\"2\">Vi bezonas nur unu komandon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi elŝutas la binaraĵon por via komputilo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ metas <code>mutsu<\/code> kaj <code>mzef<\/code> en vian <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per Docker, vi povas uzi mutsu sen instali ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias sur ĉiu sistemo kun Docker, ankaŭ sur Vindozo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu komando lanĉas la interagan ŝelon REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tiu komando rulas programon el la nuna dosierujo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konstrui el la fontkodo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu estas skribita en Rust.<\/span> <span class=\"sg\" data-s=\"1\">Do vi ankaŭ povas mem konstrui ĝin per Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Uzu la fontkodon el ĝia deponejo.<\/span> <span class=\"sg\" data-s=\"3\">La deponejo klarigas la detalojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiun version vi havas?<\/span> <span class=\"sg\" data-s=\"1\">Uzu la opcion <code>--version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la eldono de mutsu mem.<\/span> <span class=\"sg\" data-s=\"1\">La versio de la lingvo Raku estas alia afero.<\/span> <span class=\"sg\" data-s=\"2\">Vi demandas la lingvon pri ĝi, kiel ĉe la aliaj kompililoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komparu tion kun <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vidu, kiel ili montras siajn versiojn.<\/span><\/p>"]]},"la":{"t":"Quomodo mutsu installare","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu versiones paratas pro macOS et Linux habet.<\/span> <span class=\"sg\" data-s=\"1\">In processoriis Intel/AMD et ARM currunt.<\/span> <span class=\"sg\" data-s=\"2\">Propositum in GitHub est: <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Versiones in pagina emissionum eius invenis.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque versio duos fasciculos programmatis habet: ipsum <code>mutsu<\/code> et <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"5\"><code>mzef<\/code> est eius instrumentum moderandi modulos.<\/span> <span class=\"sg\" data-s=\"6\">Modulos Raku installat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum mise<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Via facillima emissionem installandi est <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc instrumentum instrumenta pro programmatoribus installat et renovat.<\/span> <span class=\"sg\" data-s=\"2\">Unum imperatum satis est.<\/span> <span class=\"sg\" data-s=\"3\">Versionem pro computatro tuo deprimit.<\/span> <span class=\"sg\" data-s=\"4\">Etiam <code>mutsu<\/code> et <code>mzef<\/code> in <code>PATH<\/code> tuum ponit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum Docker, mutsu uti potes sine installatione.<\/span> <span class=\"sg\" data-s=\"1\">Hoc in omni systemate cum Docker valet, etiam in Windows.<\/span> <span class=\"sg\" data-s=\"2\">Hoc imperatum corticem REPL interactivum incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et hoc imperatum programma ex directoria currenti exsequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ex codice fonte aedificare<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu in Rust scriptus est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eum etiam ipse cum Cargo aedificare potes.<\/span> <span class=\"sg\" data-s=\"2\">Codicem fontem ex repositorio eius adhibe.<\/span> <span class=\"sg\" data-s=\"3\">Repositorium singula explicat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quam versionem habes?<\/span> <span class=\"sg\" data-s=\"1\">Optione <code>--version<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec est emissio ipsius mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Versio linguae Raku alia res est.<\/span> <span class=\"sg\" data-s=\"2\">Eam ab ipsa lingua quaeris, sicut apud alios compilatores:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc confer cum <a href=\"https://course.raku.org/la/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> et <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vide quomodo versiones suas ostendant.<\/span><\/p>"]]}}}</script>
