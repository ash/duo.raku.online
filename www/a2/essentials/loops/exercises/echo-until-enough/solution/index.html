><\/p>"]]},"bg":{"t":"Solution: Ехо до достатъчност","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази програма има нужда от цикъл.<\/span> <span class=\"sg\" data-s=\"1\">Цикълът спира, когато потребителят въведе специална дума.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да решите задачата с <code>while<\/code>, <code>until<\/code> или <code>repeat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тези начини са много подобни.<\/span> <span class=\"sg\" data-s=\"2\">Ето един от тях.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $word;\nrepeat {\n    $word = prompt 'Вашата дума: ';\n    say $word;\n} while $word ne 'достатъчно';\n\nsay 'ОК, готово.';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/echo-until-enough.raku\" target=\"_blank\" rel=\"noopener\">echo-until-enough.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата.<\/span> <span class=\"sg\" data-s=\"1\">Въведете няколко различни думи.<\/span> <span class=\"sg\" data-s=\"2\">След това спрете цикъла.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/echo-until-enough.raku\nВашата дума: това\nтова\nВашата дума: е\nе\nВашата дума: моята\nмоята\nВашата дума: дума\nдума\nВашата дума: достатъчно\nдостатъчно\nОК, готово.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че създавате променливата <code>$word<\/code> <em>преди<\/em> цикъла.<\/span> <span class=\"sg\" data-s=\"1\">Тестът <code>while<\/code> не е в тялото на цикъла.<\/span> <span class=\"sg\" data-s=\"2\">Затова тестът не може да види променлива от тялото на цикъла.<\/span><\/p>"]]},"eo":{"t":"Solv  class=\"sg\" data-s=\"0\">Hoc programma ansam requirit.<\/span> <span class=\"sg\" data-s=\"1\">Ansa desinit cum usor verbum speciale inserit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Problema cum <code>while<\/code>, <code>until<\/code>, vel <code>repeat<\/code> solvere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hi modi valde similes sunt.<\/span> <span class=\"sg\" data-s=\"2\">Hic est unus ex eis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $verbum;\nrepeat {\n    $verbum = prompt 'Tuum verbum: ';\n    say $verbum;\n} while $verbum ne 'satis';\n\nsay 'OK, confectum.';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/echo-until-enough.raku\" target=\"_blank\" rel=\"noopener\">echo-usque-satis.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Curre programma.<\/span> <span class=\"sg\" data-s=\"1\">Insere pauca verba diversa.<\/span> <span class=\"sg\" data-s=\"2\">Deinde ansam siste.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/echo-usque-satis.raku\nTuum verbum: hoc\nhoc\nTuum verbum: est\nest\nTuum verbum: meum\nmeum\nTuum verbum: verbum\nverbum\nTuum verbum: satis\nsatis\nOK, confectum.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota: variabilem <code>$verbum<\/code> <em>ante<\/em> ansam creas.<\/span> <span class=\"sg\" data-s=\"1\">Probatio <code>while<\/code> non est intra corpus ansae.<\/span> <span class=\"sg\" data-s=\"2\">Itaque probatio variabilem intra ansam videre non potest.<\/span><\/p>"]]}}}</script>
