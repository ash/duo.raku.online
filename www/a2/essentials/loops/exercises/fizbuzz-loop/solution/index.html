; $n {\n    my $fizzbuzz = '';\n    $fizzbuzz ~= 'Fizz' if $n %% 3;\n    $fizzbuzz ~= 'Buzz' if $n %% 5;\n    say \"$n: $fizzbuzz\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/fizbuzz-loop.raku\" target=\"_blank\" rel=\"noopener\">fizbuzz-loop.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/fizbuzz-loop.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu solvo havas unu malgrandan problemon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĉiam presas spacon post la dupunkto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi faras tion eĉ sen Fizz aŭ Buzz.<\/span> <span class=\"sg\" data-s=\"3\">Tre zorgema programisto ne ŝatas tion.<\/span> <span class=\"sg\" data-s=\"4\">Ŝanĝu la programon kaj riparu ĝin.<\/span><\/p>"]]},"la":{"t":"Solutio: FizzBuzz in ansa","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore, programma quemque numerum in circulo probat.<\/span> <span class=\"sg\" data-s=\"1\">Verba non statim imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Primum, ea in variabili separata colligit.<\/span> <span class=\"sg\" data-s=\"3\">Deinde hanc variabilem in chordam ponit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est nova solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..50 -&gt; $n {\n    my $fizzbuzz = '';\n    $fizzbuzz ~= 'Fizz' if $n %% 3;\n    $fizzbuzz ~= 'Buzz' if $n %% 5;\n    say \"$n: $fizzbuzz\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/fizbuzz-loop.raku\" target=\"_blank\" rel=\"noopener\">fizbuzz-loop.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/fizbuzz-loop.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec solutio unum parvum problema habet.<\/span> <span class=\"sg\" data-s=\"1\">Semper spatium post colon imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc facit etiam sine Fizz aut Buzz.<\/span> <span class=\"sg\" data-s=\"3\">Programmatori valde diligenti hoc non placet.<\/span> <span class=\"sg\" data-s=\"4\">Muta programma et id corrige.<\/span><\/p>"]]}}}</script>
