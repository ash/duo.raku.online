ня з клаузою <code>where<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За факториела на <code>N<\/code> умножаваме всички цели числа от 1 до <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Например, факториелът на 4 е 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата няколко пъти с различни стойности на <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази програма използва оператора <code>*=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е кратък начин да умножите и присвоите: <code>$x *= $y<\/code> означава същото като <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да използвате ‘пълен’ цикъл вместо постфиксната форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Още за това<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Връщаме се към тази задача няколко пъти в курса.<\/span> <span class=\"sg\" data-s=\"1\">В тази част на курса я решаваме и с рекурсия.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Във втората част на курса ще научите за операторите за редукция.<\/span> <span class=\"sg\" data-s=\"1\">С тях решението е много лесно.<\/span> <span class=\"sg\" data-s=\"2\">Ще научите също как да създадете свой оператор <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава можете да пишете <code>$n!<\/code>, за да получите факториел.<\/span> <span class=\"sg\" data-s=\"4\">По-късно ще видим още едно интересно решение с клаузата <code>where<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Faktorialo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La faktorialo de <code>N<\/code> estas ĉiuj tutaj nombroj de 1 ĝis <code>N<\/code>, multiplikitaj kune.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la faktorialo de 4 estas 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kelkajn fojojn kun malsamaj valoroj de <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo uzas la operatoron <code>*=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas mallonga maniero por multipliki kaj asigni: <code>$x *= $y<\/code> signifas la samon kiel <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas uzi ‘plenan’ buklon anstataŭ la postfiksa formo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli pri tio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni revenas al ĉi tiu tasko plurajn fojojn en la kurso.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu parto de la kurso, ni ankaŭ solvas ĝin per rekursio.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En la dua parto de la kurso, vi lernos pri reduktaj operatoroj.<\/span> <span class=\"sg\" data-s=\"1\">Kun ili, la solvo estas tre facila.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ lernos fari vian propran operatoron <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi povas skribi <code>$n!<\/code> por ricevi faktorialon.<\/span> <span class=\"sg\" data-s=\"4\">Poste ni vidos ankoraŭ unu interesan solvon kun la <code>where<\/code> klaŭzo.<\/span><\/p>"]]},"la":{"t":"Solutio: Factorial","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Factorialis <code>N<\/code> est multiplicatio omnium numerorum integrorum ab 1 ad <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, factorialis 4 est 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programma aliquoties cum valoribus diversis <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc programma utitur operatore <code>*=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Est modus brevis multiplicandi et assignandi: <code>$x *= $y<\/code> idem significat ac <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes etiam ‘plenum’ circulum adhibere pro forma postfixa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plura de hoc<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad hoc problema aliquoties in cursu redimus.<\/span> <span class=\"sg\" data-s=\"1\">In hac parte cursus, id etiam recursione solvimus.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In secunda parte cursus, de operatoribus reductionis disces.<\/span> <span class=\"sg\" data-s=\"1\">Cum eis, solutio facillima est.<\/span> <span class=\"sg\" data-s=\"2\">Etiam disces tuum operatorem <code>!<\/code> facere.<\/span> <span class=\"sg\" data-s=\"3\">Deinde <code>$n!<\/code> scribere potes ut factorialem invenias.<\/span> <span class=\"sg\" data-s=\"4\">Postea, aliam solutionem iucundam cum clausula <code>where<\/code> videbimus.<\/span><\/p>"]]}}}</script>
