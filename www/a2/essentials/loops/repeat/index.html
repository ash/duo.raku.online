e>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con questo valore, la condizione è già <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ma Raku esegue comunque prima il blocco di codice.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora cambiamo il programma e usiamo <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eseguilo e controlla se funziona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"lv":{"t":"Izmantojot <code>repeat<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz <code>while<\/code> vai <code>until<\/code> bloks neizpildās nemaz.<\/span> <span class=\"sg\" data-s=\"1\">Tā notiek, kad nosacījums sākumā ir <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>repeat<\/code> bloks ir citāds: tas vienmēr izpildās vismaz vienu reizi.<\/span> <span class=\"sg\" data-s=\"3\">Raku pārbauda nosacījumu pēc bloka.<\/span> <span class=\"sg\" data-s=\"4\">Pārbaudei jūs izmantojat tos pašus vārdus, <code>while<\/code> vai <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šo programmu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Ievadiet skaitli: ';\n    say \"Jūs ievadījāt $x.\";\n} while $x &lt;= 10;\nsay \"$x ir lielāks par 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sākumā mainīgais <code>$x<\/code> ir <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1 ><span class=\"sg\" data-s=\"0\">В начале переменная <code>$x<\/code> равна <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Условие <code>while<\/code> проверяет, меньше или равно ли <code>$x<\/code> числу <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С этим значением условие уже равно <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но блок кода всё равно сначала выполняется.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число: 10\nВы ввели 10.\nВведите число: 20\nВы ввели 20.\n20 больше 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь давайте изменим программу и используем <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Введите число: ';\n    say \"Вы ввели $x.\";\n} until $x &gt; 10;\nsay \"$x больше 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите её и проверьте, что она работает:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число: 5\nВы ввели 5.\nВведите число: 15\nВы ввели 15.\n15 больше 10.<\/code><\/pre>"]]},"uk":{"t":"Використання <code>repeat<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді блок <code>while<\/code> або <code>until<\/code> узагалі не виконується.<\/span> <span class=\"sg\" data-s=\"1\">Це буває, коли умова на початку є <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок <code>repeat<\/code> інший: він завжди виконується хоча б один раз.<\/span> <span class=\"sg\" data-s=\"3\">Raku перевіряє умову після блоку.<\/span> <span class=\"sg\" data-s=\"4\">Для перевірки ви використовуєте ті самі слова, <code>while<\/code> або <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подивіться на цю програму.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\   $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В началото променливата <code>$x<\/code> е <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Условието <code>while<\/code> проверява дали <code>$x<\/code> е по-малко или равно на <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С тази стойност условието вече е <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но блокът с код все пак се изпълнява първо.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега нека променим програмата и да използваме <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте я и проверете, че работи:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"eo":{"t":"Uzante <code>repeat<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje <code>while<\/code> aŭ <code>until<\/code> bloko tute ne ruliĝas.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, kiam la kondiĉo estas <code>False<\/code> komence.<\/span> <span class=\"sg\" data-s=\"2\">Bloko <code>repeat<\/code> estas malsama: ĝi ĉiam ruliĝas almenaŭ unu fojon.<\/span> <span class=\"sg\" data-s=\"3\">Raku kontrolas la kondiĉon post la bloko.<\/span> <span class=\"sg\" data-s=\"4\">Vi uzas la samajn vortojn, <code>while<\/code> aŭ <code>until<\/code>, por la kontrolo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rigardu ĉi tiun programon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Komence, la variablo <code>$x<\/code> estas <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La <code>while<\/code> kondiĉo kontrolas, ĉu <code>$x<\/code> estas malpli ol aŭ egala al <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kun ĉi tiu valoro, la kondiĉo jam estas <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sed la koda bloko tamen ruliĝas unue.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun ni ŝanĝu la programon kaj uzu <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu ĝin kaj kontrolu, ke ĝi funkcias:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"la":{"t":"Utendo <code>repeat<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum clausula <code>while<\/code> vel <code>until<\/code> omnino non currit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit cum condicio initio <code>False<\/code> est.<\/span> <span class=\"sg\" data-s=\"2\">Clausula <code>repeat<\/code> diversa est: semper saltem semel currit.<\/span> <span class=\"sg\" data-s=\"3\">Raku condicionem post clausulam inspicit.<\/span> <span class=\"sg\" data-s=\"4\">Eadem verba, <code>while<\/code> vel <code>until<\/code>, ad probationem adhibes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Specta hoc programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Intra numerum: ';\n    say \"Intrasti $x.\";\n} while $x &lt;= 10;\nsay \"$x maior est quam 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Initio, variabilis <code>$x<\/code> est <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Condicio <code>while<\/code> inspicit an <code>$x<\/code> minor quam <code>10<\/code> vel aequalis <code>10<\/code> sit.<\/span> <span class=\"sg\" data-s=\"2\">Cum hoc valore, condicio iam <code>False<\/code> est.<\/span> <span class=\"sg\" data-s=\"3\">Sed clausula codicis tamen primum currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 10\nIntrasti 10.\nIntra numerum: 20\nIntrasti 20.\n20 maior est quam 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc programma mutemus et <code>until<\/code> adhibeamus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Intra numerum: ';\n    say \"Intrasti $x.\";\n} until $x &gt; 10;\nsay \"$x maior est quam 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre id et inspice an operetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 5\nIntrasti 5.\nIntra numerum: 15\nIntrasti 15.\n15 maior est quam 10.<\/code><\/pre>"]]}}}</script>
