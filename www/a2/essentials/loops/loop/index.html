<script type="application/json" id="page-data">{"u":"essentials/loops/loop","n":158,"k":"topic","pv":"essentials/loops/modifiers","nx":"essentials/loops/infinite-loops","tr":["essentials","essentials/loops"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"loop","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> statement in Raku is like the classic loops in the C language and similar languages.<\/span> <span class=\"sg\" data-s=\"1\">It takes three statements.<\/span> <span class=\"sg\" data-s=\"2\">The first one sets the start value.<\/span> <span class=\"sg\" data-s=\"3\">The second one is the test.<\/span> <span class=\"sg\" data-s=\"4\">The third one changes the loop variable.<\/span> <span class=\"sg\" data-s=\"5\">The body of the loop runs again and again while the test is <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, <code>++<\/code> is an operator after a variable.<\/span> <span class=\"sg\" data-s=\"1\">It adds 1 to the variable.<\/span> <span class=\"sg\" data-s=\"2\">You will learn more operators in the second part of the course.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program runs the body of the loop five times.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can leave out some or even all of the statements in the header of <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">For example, here is the same program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">People do not use <code>loop<\/code> very often in Raku.<\/span> <span class=\"sg\" data-s=\"1\">You can see it, for example, in programs that a tool translated from C to Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku has easier loops, such as <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">We look at <code>for<\/code> very soon.<\/span><\/p>"]]},"de":{"t":"Drei-Anweisungs-Schleife <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Anweisung in Raku ist wie die klassischen Schleifen in der Sprache C und ähnlichen Sprachen.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt drei Anweisungen.<\/span> <span class=\"sg\" data-s=\"2\">Die erste setzt den Startwert.<\/span> <span class=\"sg\" data-s=\"3\">Die zweite ist der Test.<\/span> <span class=\"sg\" data-s=\"4\">Die dritte ändert die Schleifenvariable.<\/span> <span class=\"sg\" data-s=\"5\">Der Schleifenkörper läuft immer wieder, solange der Test <code>True<\/code> ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>++<\/code> ein Operator hinter einer Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Er addiert 1 zur Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Im zweiten Teil des Kurses lernen Sie mehr Operatoren kennen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm führt den Körper der Schleife fünfmal aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDer aktuelle Wert des Zählers ist 0.\nDer aktuelle Wert des Zählers ist 1.\nDer aktuelle Wert des Zählers ist 2.\nDer aktuelle Wert des Zählers ist 3.\nDer aktuelle Wert des Zählers ist 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können einige oder sogar alle Anweisungen im Kopf von <code>loop<\/code> weglassen.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist zum Beispiel dasselbe Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Man benutzt <code>loop<\/code> in Raku nicht sehr oft.<\/span> <span class=\"sg\" data-s=\"1\">Sie sehen es zum Beispiel in Programmen, die ein Werkzeug von C nach Raku übersetzt hat.<\/span> <span class=\"sg\" data-s=\"2\">Raku hat einfachere Schleifen, wie <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Wir sehen uns <code>for<\/code> sehr bald an.<\/span><\/p>"]]},"nl":{"t":"Drie-zins <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-instructie in Raku lijkt op de klassieke lussen in de taal C en vergelijkbare talen.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt drie instructies.<\/span> <span class=\"sg\" data-s=\"2\">De eerste geeft de startwaarde.<\/span> <span class=\"sg\" data-s=\"3\">De tweede is de test.<\/span> <span class=\"sg\" data-s=\"4\">De derde verandert de lusvariabele.<\/span> <span class=\"sg\" data-s=\"5\">Het lichaam van de lus draait steeds opnieuw zolang de test <code>True<\/code> is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"De huidige waarde van de teller is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>++<\/code> een operator achter een variabele.<\/span> <span class=\"sg\" data-s=\"1\">Hij telt 1 op bij de variabele.<\/span> <span class=\"sg\" data-s=\"2\">In het tweede deel van de cursus leer je meer operators.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma voert het lichaam van de lus vijf keer uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDe huidige waarde van de teller is 0.\nDe huidige waarde van de teller is 1.\nDe huidige waarde van de teller is 2.\nDe huidige waarde van de teller is 3.\nDe huidige waarde van de teller is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt sommige of zelfs alle instructies in de kop van <code>loop<\/code> weglaten.<\/span> <span class=\"sg\" data-s=\"1\">Hier is bijvoorbeeld hetzelfde programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"De huidige waarde van de teller is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku gebruiken mensen <code>loop<\/code> niet zo vaak.<\/span> <span class=\"sg\" data-s=\"1\">Je ziet het bijvoorbeeld in programma's die een tool van C naar Raku heeft vertaald.<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft makkelijkere lussen, zoals <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">We bekijken <code>for<\/code> heel binnenkort.<\/span><\/p>"]]},"es":{"t":"Bucle de tres sentencias <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La declaración <code>loop<\/code> en Raku es como los bucles clásicos del lenguaje C y de lenguajes parecidos.<\/span> <span class=\"sg\" data-s=\"1\">Toma tres declaraciones.<\/span> <span class=\"sg\" data-s=\"2\">La primera da el valor inicial.<\/span> <span class=\"sg\" data-s=\"3\">La segunda es la prueba.<\/span> <span class=\"sg\" data-s=\"4\">La tercera cambia la variable del bucle.<\/span> <span class=\"sg\" data-s=\"5\">El cuerpo del bucle se ejecuta una y otra vez mientras la prueba es <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"El valor actual del contador es $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>++<\/code> es un operador que va después de una variable.<\/span> <span class=\"sg\" data-s=\"1\">Suma 1 a la variable.<\/span> <span class=\"sg\" data-s=\"2\">Vas a aprender más operadores en la segunda parte del curso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa ejecuta el cuerpo del bucle cinco veces.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEl valor actual del contador es 0.\nEl valor actual del contador es 1.\nEl valor actual del contador es 2.\nEl valor actual del contador es 3.\nEl valor actual del contador es 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes quitar algunas o incluso todas las declaraciones del encabezado de <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, aquí está el mismo programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"El valor actual del contador es $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, la gente no usa <code>loop<\/code> muy a menudo.<\/span> <span class=\"sg\" data-s=\"1\">Puedes verlo, por ejemplo, en programas que una herramienta tradujo de C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku tiene bucles más fáciles, como <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vamos a ver <code>for<\/code> muy pronto.<\/span><\/p>"]]},"it":{"t":"Ciclo <code>loop<\/code> a tre istruzioni","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">L'istruzione <code>loop<\/code> in Raku è come i cicli classici del linguaggio C e di linguaggi simili.<\/span> <span class=\"sg\" data-s=\"1\">Prende tre istruzioni.<\/span> <span class=\"sg\" data-s=\"2\">La prima imposta il valore iniziale.<\/span> <span class=\"sg\" data-s=\"3\">La seconda è il test.<\/span> <span class=\"sg\" data-s=\"4\">La terza cambia la variabile del ciclo.<\/span> <span class=\"sg\" data-s=\"5\">Il corpo del ciclo si ripete finché il test è <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Il valore attuale del contatore è $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui <code>++<\/code> è un operatore che va dopo una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge 1 alla variabile.<\/span> <span class=\"sg\" data-s=\"2\">Imparerai altri operatori nella seconda parte del corso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma esegue il corpo del ciclo cinque volte.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIl valore attuale del contatore è 0.\nIl valore attuale del contatore è 1.\nIl valore attuale del contatore è 2.\nIl valore attuale del contatore è 3.\nIl valore attuale del contatore è 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi togliere alcune o anche tutte le istruzioni nell'intestazione di <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, ecco lo stesso programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Il valore attuale del contatore è $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku le persone non usano molto spesso <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo puoi vedere, per esempio, in programmi che uno strumento ha tradotto da C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku ha cicli più facili, come <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vediamo <code>for<\/code> molto presto.<\/span><\/p>"]]},"lv":{"t":"Trīs izteiksmju cikls","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> paziņojums Raku valodā ir līdzīgs klasiskajiem cikliem C valodā un līdzīgās valodās.<\/span> <span class=\"sg\" data-s=\"1\">Tas pieņem trīs paziņojumus.<\/span> <span class=\"sg\" data-s=\"2\">Pirmais iestata sākuma vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Otrais ir pārbaude.<\/span> <span class=\"sg\" data-s=\"4\">Trešais maina cikla mainīgo.<\/span> <span class=\"sg\" data-s=\"5\">Cikla ķermenis izpildās atkal un atkal, kamēr pārbaude ir <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>++<\/code> ir operators aiz mainīgā.<\/span> <span class=\"sg\" data-s=\"1\">Tas pieskaita mainīgajam 1.<\/span> <span class=\"sg\" data-s=\"2\">Vairāk operatoru jūs uzzināsiet kursa otrajā daļā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izpilda cikla ķermeni piecas reizes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izlaist dažus vai pat visus paziņojumus <code>loop<\/code> galvenē.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šeit ir tā pati programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku valodā <code>loop<\/code> neizmanto ļoti bieži.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to varat redzēt, piemēram, programmās, ko kāds rīks pārtulkoja no C uz Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā ir vieglāki cikli, piemēram, <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pavisam drīz mēs apskatīsim <code>for<\/code>.<\/span><\/p>"]]},"ru":{"t":"<code>loop<\/code> с тремя инструкциями","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> в Raku похож на классические циклы в языке C и в близких к нему языках.<\/span> <span class=\"sg\" data-s=\"1\">Он принимает три выражения.<\/span> <span class=\"sg\" data-s=\"2\">Первое задаёт начальное значение.<\/span> <span class=\"sg\" data-s=\"3\">Второе — это проверка.<\/span> <span class=\"sg\" data-s=\"4\">Третье меняет переменную цикла.<\/span> <span class=\"sg\" data-s=\"5\">Тело цикла выполняется снова и снова, пока проверка даёт <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущее значение счетчика: $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>++<\/code> — это оператор после переменной.<\/span> <span class=\"sg\" data-s=\"1\">Он прибавляет 1 к переменной.<\/span> <span class=\"sg\" data-s=\"2\">Больше операторов вы узнаете во второй части курса.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выполняет тело цикла пять раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущее значение счетчика: 0.\nТекущее значение счетчика: 1.\nТекущее значение счетчика: 2.\nТекущее значение счетчика: 3.\nТекущее значение счетчика: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно пропустить некоторые или даже все выражения в заголовке <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Например, вот та же программа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущее значение счетчика: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku <code>loop<\/code> используют не очень часто.<\/span> <span class=\"sg\" data-s=\"1\">Его можно увидеть, например, в программах, которые инструмент перевёл с C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">В Raku есть более простые циклы, например <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Цикл <code>for<\/code> мы рассмотрим очень скоро.<\/span><\/p>"]]},"uk":{"t":"Триопераційний цикл <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> у Raku схожий на класичні цикли в мові C та подібних мовах.<\/span> <span class=\"sg\" data-s=\"1\">Він приймає три вирази.<\/span> <span class=\"sg\" data-s=\"2\">Перший задає початкове значення.<\/span> <span class=\"sg\" data-s=\"3\">Другий — це тест.<\/span> <span class=\"sg\" data-s=\"4\">Третій змінює змінну циклу.<\/span> <span class=\"sg\" data-s=\"5\">Тіло циклу виконується знову і знову, поки тест є <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Поточне значення лічильника: $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>++<\/code> — це оператор, який стоїть після змінної.<\/span> <span class=\"sg\" data-s=\"1\">Він додає 1 до змінної.<\/span> <span class=\"sg\" data-s=\"2\">Більше операторів ви вивчите в другій частині курсу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виконує тіло циклу п'ять разів.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nПоточне значення лічильника: 0.\nПоточне значення лічильника: 1.\nПоточне значення лічильника: 2.\nПоточне значення лічильника: 3.\nПоточне значення лічильника: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете пропустити деякі або навіть усі вирази в заголовку <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ось та сама програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Поточне значення лічильника: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku <code>loop<\/code> використовують не дуже часто.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете побачити його, наприклад, у програмах, які інструмент переклав з C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">У Raku є простіші цикли, як-от <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ми дуже скоро розглянемо <code>for<\/code>.<\/span><\/p>"]]},"bg":{"t":"Тристатъментен цикъл <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>loop<\/code> в Raku прилича на класическите цикли в езика C и подобни езици.<\/span> <span class=\"sg\" data-s=\"1\">Той приема три израза.<\/span> <span class=\"sg\" data-s=\"2\">Първият задава началната стойност.<\/span> <span class=\"sg\" data-s=\"3\">Вторият е тестът.<\/span> <span class=\"sg\" data-s=\"4\">Третият променя променливата на цикъла.<\/span> <span class=\"sg\" data-s=\"5\">Тялото на цикъла се изпълнява отново и отново, докато тестът е <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущата стойност на брояча е $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>++<\/code> е оператор след променлива.<\/span> <span class=\"sg\" data-s=\"1\">Той добавя 1 към променливата.<\/span> <span class=\"sg\" data-s=\"2\">Ще научите още оператори във втората част на курса.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата изпълнява тялото на цикъла пет пъти.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущата стойност на брояча е 0.\nТекущата стойност на брояча е 1.\nТекущата стойност на брояча е 2.\nТекущата стойност на брояча е 3.\nТекущата стойност на брояча е 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да пропуснете някои или дори всички изрази в заглавието на <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Например, ето същата програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущата стойност на брояча е $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku хората не използват <code>loop<\/code> много често.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го видите, например, в програми, които някой инструмент е превел от C към Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku има по-лесни цикли, като <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ще разгледаме <code>for<\/code> много скоро.<\/span><\/p>"]]},"eo":{"t":"Trideklaro <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> deklaro en Raku estas kiel la klasikaj bukloj en la lingvo C kaj similaj lingvoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas tri deklarojn.<\/span> <span class=\"sg\" data-s=\"2\">La unua donas la komencan valoron.<\/span> <span class=\"sg\" data-s=\"3\">La dua estas la testo.<\/span> <span class=\"sg\" data-s=\"4\">La tria ŝanĝas la buklan variablon.<\/span> <span class=\"sg\" data-s=\"5\">La korpo de la buklo ruliĝas denove kaj denove, dum la testo estas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>++<\/code> estas operatoro post variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas 1 al la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Vi lernos pli da operatoroj en la dua parto de la kurso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo rulas la korpon de la buklo kvin fojojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nLa nuna valoro de la kalkulilo estas 0.\nLa nuna valoro de la kalkulilo estas 1.\nLa nuna valoro de la kalkulilo estas 2.\nLa nuna valoro de la kalkulilo estas 3.\nLa nuna valoro de la kalkulilo estas 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas forlasi kelkajn aŭ eĉ ĉiujn deklarojn en la kapo de <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, jen la sama programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Homoj ne tre ofte uzas <code>loop<\/code> en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas vidi ĝin, ekzemple, en programoj, kiujn ilo tradukis de C al Raku.<\/span> <span class=\"sg\" data-s=\"2\">Raku havas pli facilajn buklojn, kiel <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ni rigardos <code>for<\/code> tre baldaŭ.<\/span><\/p>"]]},"la":{"t":"Tribus partibus <code>loop<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Enuntiatum <code>loop<\/code> in Raku simile est ansis classicis in lingua C et in linguis similibus.<\/span> <span class=\"sg\" data-s=\"1\">Tria enuntiata accipit.<\/span> <span class=\"sg\" data-s=\"2\">Primum valorem initialem ponit.<\/span> <span class=\"sg\" data-s=\"3\">Secundum est probatio.<\/span> <span class=\"sg\" data-s=\"4\">Tertium variabilem ansae mutat.<\/span> <span class=\"sg\" data-s=\"5\">Corpus ansae iterum atque iterum currit dum probatio <code>True<\/code> est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>++<\/code> est operator post variabilem.<\/span> <span class=\"sg\" data-s=\"1\">Ad variabilem 1 addit.<\/span> <span class=\"sg\" data-s=\"2\">Plures operatores in secunda parte cursus disces.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma corpus ansae quinquies exsequitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliqua vel etiam omnia enuntiata in capite <code>loop<\/code> omittere potes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, hic est idem programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Homines <code>loop<\/code> in Raku non valde saepe adhibent.<\/span> <span class=\"sg\" data-s=\"1\">Id videre potes, exempli gratia, in programmatibus quae instrumentum a C ad Raku convertit.<\/span> <span class=\"sg\" data-s=\"2\">Raku faciliores ansas habet, sicut <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Brevi <code>for<\/code> spectamus.<\/span><\/p>"]]}}}</script>
