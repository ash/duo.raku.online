<script type="application/json" id="page-data">{"u":"essentials/loops/loop","n":158,"k":"topic","pv":"essentials/loops/modifiers","nx":"essentials/loops/infinite-loops","tr":["essentials","essentials/loops"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"loop","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku has a <code>loop<\/code> statement.<\/span> <span class=\"sg\" data-s=\"1\">It works like the loops in C and similar languages.<\/span> <span class=\"sg\" data-s=\"2\">It has three statements.<\/span> <span class=\"sg\" data-s=\"3\">The first one gives the loop variable its start value.<\/span> <span class=\"sg\" data-s=\"4\">The second one is a test.<\/span> <span class=\"sg\" data-s=\"5\">The third one changes the loop variable.<\/span> <span class=\"sg\" data-s=\"6\">The loop runs while the test is <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, <code>++<\/code> is an operator.<\/span> <span class=\"sg\" data-s=\"1\">You write it after a variable.<\/span> <span class=\"sg\" data-s=\"2\">It adds 1 to the variable.<\/span> <span class=\"sg\" data-s=\"3\">The second part of the course has more operators.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The body of the loop runs five times.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can leave out some of the three statements in <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can even leave out all of them.<\/span> <span class=\"sg\" data-s=\"2\">For example, here is the same program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku, people do not use <code>loop<\/code> very often.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes a tool changes C code into Raku code.<\/span> <span class=\"sg\" data-s=\"2\">You can see <code>loop<\/code> in such code.<\/span> <span class=\"sg\" data-s=\"3\">Raku has easier loops, like <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">We look at <code>for<\/code> very soon.<\/span><\/p>"]]},"de":{"t":"Drei-Anweisungs-Schleife <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine <code>loop<\/code>-Anweisung.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktioniert wie die Schleifen in C und ähnlichen Sprachen.<\/span> <span class=\"sg\" data-s=\"2\">Sie hat drei Anweisungen.<\/span> <span class=\"sg\" data-s=\"3\">Die erste gibt der Schleifenvariablen ihren Startwert.<\/span> <span class=\"sg\" data-s=\"4\">Die zweite ist ein Test.<\/span> <span class=\"sg\" data-s=\"5\">Die dritte ändert die Schleifenvariable.<\/span> <span class=\"sg\" data-s=\"6\">Die Schleife läuft, solange der Test <code>True<\/code> ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>++<\/code> ein Operator.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben ihn hinter eine Variable.<\/span> <span class=\"sg\" data-s=\"2\">Er addiert 1 zur Variablen.<\/span> <span class=\"sg\" data-s=\"3\">Im zweiten Teil des Kurses gibt es mehr Operatoren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Körper der Schleife läuft fünfmal.<\/span><\/p>"],["code",0,"<pre class=\"la teller is $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>++<\/code> een operator.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft hem na een variabele.<\/span> <span class=\"sg\" data-s=\"2\">Hij telt 1 op bij de variabele.<\/span> <span class=\"sg\" data-s=\"3\">Het tweede deel van de cursus heeft meer operators.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het lichaam van de lus draait vijf keer.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDe huidige waarde van de teller is 0.\nDe huidige waarde van de teller is 1.\nDe huidige waarde van de teller is 2.\nDe huidige waarde van de teller is 3.\nDe huidige waarde van de teller is 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt sommige van de drie instructies in <code>loop<\/code> weglaten.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze zelfs allemaal weglaten.<\/span> <span class=\"sg\" data-s=\"2\">Hier is bijvoorbeeld hetzelfde programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"De huidige waarde van de teller is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku gebruiken mensen <code>loop<\/code> niet zo vaak.<\/span> <span class=\"sg\" data-s=\"1\">Soms zet een tool C-code om in Raku-code.<\/span> <span class=\"sg\" data-s=\"2\">In zulke code zie je <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft makkelijkere lussen, zoals <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">We bekijken <code>for<\/code> heel binnenkort.<\/span><\/p>"]]},"es":{"t":"Bucle de tres sentencias <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku tiene una declaración <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Funciona como los bucles de C y de lenguajes parecidos.<\/span> <span class=\"sg\" data-s=\"2\">Tiene tres declaraciones.<\/span> <span class=\"sg\" data-s=\"3\">La primera da el valor inicial a la variable del bucle.<\/span> <span class=\"sg\" data-s=\"4\">La segunda es una prueba.<\/span> <span class=\"sg\" data-s=\"5\">La tercera cambia la variable del bucle.<\/span> <span class=\"sg\" data-s=\"6\">El bucle se ejecuta mientras la prueba es <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"El valor actual del contador es $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>++<\/code> es un operador.<\/span> <span class=\"sg\" data-s=\"1\">Lo escribes después de una variable.<\/span> <span class=\"sg\" data-s=\"2\">Suma 1 a la variable.<\/span> <span class=\"sg\" data-s=\"3\">La segunda parte del curso tiene más operadores.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El cuerpo del bucle se ejecuta cinco veces.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEl valor actual del contador es 0.\nEl valor actual del contador es 1.\nEl valor actual del contador es 2.\nEl valor actual del contador es 3.\nEl valor actual del contador es 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes quitar algunas de las tres declaraciones de <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Incluso puedes quitarlas todas.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, aquí está el mismo programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"El valor actual del contador es $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En Raku, la gente no usa <code>loop<\/code> muy a menudo.<\/span> <span class=\"sg\" data-s=\"1\">A veces una herramienta convierte código de C en código de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Puedes ver <code>loop<\/code> en ese código.<\/span> <span class=\"sg\" data-s=\"3\">Raku tiene bucles más fáciles, como <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vamos a ver <code>for<\/code> muy pronto.<\/span><\/p>"]]},"it":{"t":"Ciclo <code>loop<\/code> a tre istruzioni","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ha l'istruzione <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Funziona come i cicli in C e in linguaggi simili.<\/span> <span class=\"sg\" data-s=\"2\">Ha tre istruzioni.<\/span> <span class=\"sg\" data-s=\"3\">La prima dà alla variabile del ciclo il valore iniziale.<\/span> <span class=\"sg\" data-s=\"4\">La seconda è un test.<\/span> <span class=\"sg\" data-s=\"5\">La terza cambia la variabile del ciclo.<\/span> <span class=\"sg\" data-s=\"6\">Il ciclo gira finché il test è <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Il valore attuale del contatore è $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui <code>++<\/code> è un operatore.<\/span> <span class=\"sg\" data-s=\"1\">Lo scrivi dopo una variabile.<\/span> <span class=\"sg\" data-s=\"2\">Aggiunge 1 alla variabile.<\/span> <span class=\"sg\" data-s=\"3\">La seconda parte del corso ha altri operatori.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il corpo del ciclo si ripete cinque volte.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIl valore attuale del contatore è 0.\nIl valore attuale del contatore è 1.\nIl valore attuale del contatore è 2.\nIl valore attuale del contatore è 3.\nIl valore attuale del contatore è 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi togliere alcune delle tre istruzioni di <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche toglierle tutte.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, ecco lo stesso programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Il valore attuale del contatore è $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku, le persone non usano spesso <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A volte uno strumento cambia il codice C in codice Raku.<\/span> <span class=\"sg\" data-s=\"2\">In questo codice puoi vedere <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha cicli più facili, come <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vediamo <code>for<\/code> tra poco.<\/span><\/p>"]]},"lv":{"t":"Trīs izteiksmju cikls","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir <code>loop<\/code> paziņojums.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas kā cikli C valodā un līdzīgās valodās.<\/span> <span class=\"sg\" data-s=\"2\">Tam ir trīs paziņojumi.<\/span> <span class=\"sg\" data-s=\"3\">Pirmais dod cikla mainīgajam sākuma vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Otrais ir pārbaude.<\/span> <span class=\"sg\" data-s=\"5\">Trešais maina cikla mainīgo.<\/span> <span class=\"sg\" data-s=\"6\">Cikls izpildās, kamēr pārbaude ir <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>++<\/code> ir operators.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to rakstāt aiz mainīgā.<\/span> <span class=\"sg\" data-s=\"2\">Tas pieskaita mainīgajam 1.<\/span> <span class=\"sg\" data-s=\"3\">Kursa otrajā daļā ir vairāk operatoru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cikla ķermenis izpildās piecas reizes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izlaist dažus no trim <code>loop<\/code> paziņojumiem.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat izlaist pat visus.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, šeit ir tā pati programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku valodā <code>loop<\/code> neizmanto ļoti bieži.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz kāds rīks pārvērš C kodu Raku kodā.<\/span> <span class=\"sg\" data-s=\"2\">Šādā kodā jūs varat redzēt <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku valodā ir vieglāki cikli, piemēram, <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Mēs apskatīsim <code>for<\/code> pavisam drīz.<\/span><\/p>"]]},"ru":{"t":"<code>loop<\/code> с тремя инструкциями","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В Raku есть оператор <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он работает как циклы в C и похожих языках.<\/span> <span class=\"sg\" data-s=\"2\">У него три выражения.<\/span> <span class=\"sg\" data-s=\"3\">Первое даёт переменной цикла начальное значение.<\/span> <span class=\"sg\" data-s=\"4\">Второе — это проверка.<\/span> <span class=\"sg\" data-s=\"5\">Третье меняет переменную цикла.<\/span> <span class=\"sg\" data-s=\"6\">Цикл работает, пока проверка даёт <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущее значение счетчика: $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>++<\/code> — это оператор.<\/span> <span class=\"sg\" data-s=\"1\">Вы пишете его после переменной.<\/span> <span class=\"sg\" data-s=\"2\">Он прибавляет 1 к переменной.<\/span> <span class=\"sg\" data-s=\"3\">Во второй части курса есть ещё операторы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тело цикла выполняется пять раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущее значение счетчика: 0.\nТекущее значение счетчика: 1.\nТекущее значение счетчика: 2.\nТекущее значение счетчика: 3.\nТекущее значение счетчика: 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы можете пропустить некоторые из трёх выражений в <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можно даже пропустить их все.<\/span> <span class=\"sg\" data-s=\"2\">Например, вот та же программа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущее значение счетчика: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku <code>loop<\/code> используют не очень часто.<\/span> <span class=\"sg\" data-s=\"1\">Иногда инструмент переводит код с C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">В таком коде вы можете увидеть <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В Raku есть более простые циклы, например <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Цикл <code>for<\/code> мы рассмотрим очень скоро.<\/span><\/p>"]]},"uk":{"t":"Триопераційний цикл <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">У Raku є оператор <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він працює як цикли в C та подібних мовах.<\/span> <span class=\"sg\" data-s=\"2\">Він має три вирази.<\/span> <span class=\"sg\" data-s=\"3\">Перший дає змінній циклу початкове значення.<\/span> <span class=\"sg\" data-s=\"4\">Другий — це тест.<\/span> <span class=\"sg\" data-s=\"5\">Третій змінює змінну циклу.<\/span> <span class=\"sg\" data-s=\"6\">Цикл працює, поки тест є <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Поточне значення лічильника: $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут <code>++<\/code> — це оператор.<\/span> <span class=\"sg\" data-s=\"1\">Ви пишете його після змінної.<\/span> <span class=\"sg\" data-s=\"2\">Він додає 1 до змінної.<\/span> <span class=\"sg\" data-s=\"3\">У другій частині курсу є більше операторів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тіло циклу виконується п'ять разів.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nПоточне значення лічильника: 0.\nПоточне значення лічильника: 1.\nПоточне значення лічильника: 2.\nПоточне значення лічильника: 3.\nПоточне значення лічильника: 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете пропустити деякі з трьох виразів у <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете навіть пропустити їх усі.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, ось та сама програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Поточне значення лічильника: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У Raku <code>loop<\/code> використовують не дуже часто.<\/span> <span class=\"sg\" data-s=\"1\">Іноді інструмент перекладає код з C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете побачити <code>loop<\/code> у такому коді.<\/span> <span class=\"sg\" data-s=\"3\">У Raku є простіші цикли, як-от <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ми дуже скоро розглянемо <code>for<\/code>.<\/span><\/p>"]]},"bg":{"t":"Тристатъментен цикъл <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku има оператор <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той работи като циклите в C и подобни езици.<\/span> <span class=\"sg\" data-s=\"2\">Той има три израза.<\/span> <span class=\"sg\" data-s=\"3\">Първият дава на променливата на цикъла началната ѝ стойност.<\/span> <span class=\"sg\" data-s=\"4\">Вторият е тест.<\/span> <span class=\"sg\" data-s=\"5\">Третият променя променливата на цикъла.<\/span> <span class=\"sg\" data-s=\"6\">Цикълът работи, докато тестът е <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущата стойност на брояча е $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук <code>++<\/code> е оператор.<\/span> <span class=\"sg\" data-s=\"1\">Пишете го след променлива.<\/span> <span class=\"sg\" data-s=\"2\">Той добавя 1 към променливата.<\/span> <span class=\"sg\" data-s=\"3\">Във втората част на курса има още оператори.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тялото на цикъла се изпълнява пет пъти.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущата стойност на брояча е 0.\nТекущата стойност на брояча е 1.\nТекущата стойност на брояча е 2.\nТекущата стойност на брояча е 3.\nТекущата стойност на брояча е 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да пропуснете някои от трите израза в <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да пропуснете дори всички.<\/span> <span class=\"sg\" data-s=\"2\">Например, ето същата програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущата стойност на брояча е $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku хората не използват <code>loop<\/code> много често.<\/span> <span class=\"sg\" data-s=\"1\">Понякога един инструмент превръща код на C в код на Raku.<\/span> <span class=\"sg\" data-s=\"2\">В такъв код можете да видите <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku има по-лесни цикли, като <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Скоро ще разгледаме <code>for<\/code>.<\/span><\/p>"]]},"eo":{"t":"Trideklaro <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku havas la deklaron <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi funkcias kiel la bukloj en C kaj similaj lingvoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas tri deklarojn.<\/span> <span class=\"sg\" data-s=\"3\">La unua donas al la bukla variablo ĝian komencan valoron.<\/span> <span class=\"sg\" data-s=\"4\">La dua estas testo.<\/span> <span class=\"sg\" data-s=\"5\">La tria ŝanĝas la buklan variablon.<\/span> <span class=\"sg\" data-s=\"6\">La buklo ruliĝas, dum la testo estas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>++<\/code> estas operatoro.<\/span> <span class=\"sg\" data-s=\"1\">Vi skribas ĝin post variablo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi aldonas 1 al la variablo.<\/span> <span class=\"sg\" data-s=\"3\">La dua parto de la kurso havas pli da operatoroj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La korpo de la buklo ruliĝas kvin fojojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nLa nuna valoro de la kalkulilo estas 0.\nLa nuna valoro de la kalkulilo estas 1.\nLa nuna valoro de la kalkulilo estas 2.\nLa nuna valoro de la kalkulilo estas 3.\nLa nuna valoro de la kalkulilo estas 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas forlasi kelkajn el la tri deklaroj en <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi eĉ povas forlasi ĉiujn.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, jen la sama programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En Raku, homoj ne tre ofte uzas <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Foje ilo ŝanĝas C-kodon en Raku-kodon.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas vidi <code>loop<\/code> en tia kodo.<\/span> <span class=\"sg\" data-s=\"3\">Raku havas pli facilajn buklojn, kiel <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ni rigardas <code>for<\/code> tre baldaŭ.<\/span><\/p>"]]},"la":{"t":"Tribus partibus <code>loop<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku enuntiatum <code>loop<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Operatur sicut ansae in lingua C et in linguis similibus.<\/span> <span class=\"sg\" data-s=\"2\">Tria enuntiata habet.<\/span> <span class=\"sg\" data-s=\"3\">Primum variabili ansae valorem initialem dat.<\/span> <span class=\"sg\" data-s=\"4\">Secundum est probatio.<\/span> <span class=\"sg\" data-s=\"5\">Tertium variabilem ansae mutat.<\/span> <span class=\"sg\" data-s=\"6\">Ansa currit dum probatio <code>True<\/code> est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>++<\/code> est operator.<\/span> <span class=\"sg\" data-s=\"1\">Eum post variabilem scribis.<\/span> <span class=\"sg\" data-s=\"2\">Ad variabilem 1 addit.<\/span> <span class=\"sg\" data-s=\"3\">Secunda pars cursus plures operatores habet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Corpus ansae quinquies currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aliqua ex tribus enuntiatis in <code>loop<\/code> omittere potes.<\/span> <span class=\"sg\" data-s=\"1\">Etiam omnia omittere potes.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, hic est idem programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In Raku, homines <code>loop<\/code> non saepe adhibent.<\/span> <span class=\"sg\" data-s=\"1\">Interdum instrumentum codicem C in codicem Raku convertit.<\/span> <span class=\"sg\" data-s=\"2\">In tali codice <code>loop<\/code> videre potes.<\/span> <span class=\"sg\" data-s=\"3\">Raku faciliores ansas habet, sicut <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Mox <code>for<\/code> spectamus.<\/span><\/p>"]]}}}</script>
