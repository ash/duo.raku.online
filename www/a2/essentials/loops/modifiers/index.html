<script type="application/json" id="page-data">{"u":"essentials/loops/modifiers","n":157,"k":"topic","pv":"essentials/loops/repeat/quiz","nx":"essentials/loops/loop","tr":["essentials","essentials/loops"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"while and until as statement modifiers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can also put <code>while<\/code> or <code>until<\/code> after a statement.<\/span> <span class=\"sg\" data-s=\"1\">We call this a statement modifier.<\/span> <span class=\"sg\" data-s=\"2\">You already know it <a href=\"/essentials/conditional-checks/modifiers/\">from <code>if<\/code> and <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here is an example.<\/span> <span class=\"sg\" data-s=\"1\">It finds the remainder, or what is left after division:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, <code>-=<\/code> is an operator.<\/span> <span class=\"sg\" data-s=\"1\">It does two things.<\/span> <span class=\"sg\" data-s=\"2\">It takes a number away.<\/span> <span class=\"sg\" data-s=\"3\">It also saves the result in the variable.<\/span> <span class=\"sg\" data-s=\"4\">So <code>$x -= 3<\/code> is the same as <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>while<\/code> modifier repeats the statement <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It repeats it while <code>$x &gt; 2<\/code> is <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">When <code>$x &gt; 2<\/code> is <code>False<\/code>, the loop stops.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If the condition is <code>False<\/code> at the start, the statement never runs.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can write the same program with <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then you need the opposite condition:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"de":{"t":"<code>while<\/code> und <code>until<\/code> als Anweisungsmodifikatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können <code>while<\/code> oder <code>until<\/code> auch hinter eine Anweisung setzen.<\/span> <span class=\"sg\" data-s=\"1\">Das nennen wir einen Anweisungsmodifikator.<\/span> <span class=\"sg\" data-s=\"2\">Sie kennen das schon <a href=\"https://course.raku.org/de/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">von <code>if<\/code> und <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel.<\/span> <span class=\"sg\" data-s=\"1\">Es berechnet den Rest, also das, was nach der Division übrig bleibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>-=<\/code> ein Operator.<\/span> <span class=\"sg\" data-s=\"1\">Er macht zwei Dinge.<\/span> <span class=\"sg\" data-s=\"2\">Er zieht eine Zahl ab.<\/span> <span class=\"sg\" data-s=\"3\">Außerdem speichert er das Ergebnis in der Variablen.<\/span> <span class=\"sg\" data-s=\"4\">Also ist <code>$x -= 3<\/code> dasselbe wie <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der <code>while<\/code>-Modifikator wiederholt die Anweisung <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er wiederholt sie, solange <code>$x &gt; 2<\/code> <code>True<\/code> ist.<\/span> <span class=\"sg\" data-s=\"2\">Wenn <code>$x &gt; 2<\/code> <code>False<\/code> ist, stoppt die Schleife.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn die Bedingung am Anfang <code>False<\/code> ist, läuft die Anweisung nie.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können dasselbe Programm mit <code>until<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Dann brauchen Sie die umgekehrte Bedingung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"nl":{"t":"<code>while<\/code> en <code>until<\/code> als zinsmodificatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt <code>while<\/code> of <code>until<\/code> ook na een statement zetten.<\/span> <span class=\"sg\" data-s=\"1\">We noemen dit een statement modifier.<\/span> <span class=\"sg\" data-s=\"2\">Je kent dit al <a href=\"https://course.raku.org/nl/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">van <code>if<\/code> en <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld.<\/span> <span class=\"sg\" data-s=\"1\">Het berekent de rest, of wat er overblijft na het delen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>-=<\/code> een operator.<\/span> <span class=\"sg\" data-s=\"1\">Hij doet twee dingen.<\/span> <span class=\"sg\" data-s=\"2\">Hij trekt een getal af.<\/span> <span class=\"sg\" data-s=\"3\">Hij bewaart ook het resultaat in de variabele.<\/span> <span class=\"sg\" data-s=\"4\"><code>$x -= 3<\/code> is dus hetzelfde als <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>while<\/code>-modifier herhaalt de statement <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij herhaalt die zolang <code>$x &gt; 2<\/code> <code>True<\/code> is.<\/span> <span class=\"sg\" data-s=\"2\">Als <code>$x &gt; 2<\/code> <code>False<\/code> is, stopt de lus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als de conditie aan het begin <code>False<\/code> is, draait de statement n ode> al principio, la declaración nunca se ejecuta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes escribir el mismo programa con <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces necesitas la condición contraria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"it":{"t":"<code>while<\/code> e <code>until<\/code> come modificatori di istruzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche mettere <code>while<\/code> o <code>until<\/code> dopo un'istruzione.<\/span> <span class=\"sg\" data-s=\"1\">Lo chiamiamo modificatore di istruzione.<\/span> <span class=\"sg\" data-s=\"2\">Lo conosci già <a href=\"https://course.raku.org/it/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">da <code>if<\/code> e <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio.<\/span> <span class=\"sg\" data-s=\"1\">Trova il resto, cioè quello che rimane dopo la divisione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui <code>-=<\/code> è un operatore.<\/span> <span class=\"sg\" data-s=\"1\">Fa due cose.<\/span> <span class=\"sg\" data-s=\"2\">Toglie un numero.<\/span> <span class=\"sg\" data-s=\"3\">Salva anche il risultato nella variabile.<\/span> <span class=\"sg\" data-s=\"4\">Quindi <code>$x -= 3<\/code> è uguale a <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il modificatore <code>while<\/code> ripete l'istruzione <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ripete finché <code>$x &gt; 2<\/code> è <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quando <code>$x &gt; 2<\/code> è <code>False<\/code>, il ciclo si ferma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la condizione cījums sākumā ir <code>False<\/code>, teikums nekad neizpildās.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To pašu programmu jūs varat uzrakstīt ar <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad jums vajag pretēju nosacījumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"ru":{"t":"<code>while<\/code> и <code>until<\/code> как модификаторы инструкций","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы также можете поставить <code>while<\/code> или <code>until<\/code> после выражения.<\/span> <span class=\"sg\" data-s=\"1\">Мы называем это модификатором выражения.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже знаете это <a href=\"https://course.raku.org/ru/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">по <code>if<\/code> и <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот пример.<\/span> <span class=\"sg\" data-s=\"1\">Он находит остаток, то есть то, что остаётся после деления:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-=<\/code> — это оператор.<\/span> <span class=\"sg\" data-s=\"1\">Он делает две вещи.<\/span> <span class=\"sg\" data-s=\"2\">Он вычитает число.<\/span> <span class=\"sg\" data-s=\"3\">Ещё он сохраняет результат в переменной.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому <code>$x -= 3<\/code> — это то же самое, что <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модификатор <code>while<\/code> повторяет выражение <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он повторяет его, пока <code>$x &gt; 2<\/code> равно <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когда <code>$x &gt; 2<\/code> равно <code>False<\/code>, цикл останавливается.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если условие в начале равно <code>False<\/code>, выражение не выполняется ни разу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете написать ту же программу с <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда нужно противоположное условие:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"uk":{"t":"<code>while<\/code> та <code>until<\/code> як модифікатори операторів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви також можете поставити <code>while<\/code> або <code>until<\/code> після виразу.<\/span> <span class=\"sg\" data-s=\"1\">Ми називаємо це модифікатором виразу.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже знаєте його <a href=\"https://course.raku.org/uk/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">з <code>if<\/code> і <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось приклад.<\/span> <span class=\"sg\" data-s=\"1\">Він знаходить остачу, тобто те, що залишається після ділення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут <code>-=<\/code> — це оператор.<\/span> <span class=\"sg\" data-s=\"1\">Він робить дві речі.<\/span> <span class=\"sg\" data-s=\"2\">Він віднімає число.<\/span> <span class=\"sg\" data-s=\"3\">Він також зберігає результат у змінній.<\/span> <span class=\"sg\" data-s=\"4\">Тож <code>$x -= 3<\/code> — те саме, що <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модифікатор <code>while<\/code> повторює вираз <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повторює його, поки <code>$x &gt; 2<\/code> є <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коли <code>$x &gt; 2<\/code> є <code>False<\/code>, цикл зупиняється.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо умова на початку є <code>False<\/code>, вираз ніколи не виконується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете написати ту саму програму з <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вам потрібна протилежна умова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"bg":{"t":"<code>while<\/code> и <code>until<\/code> като модификатори на изречения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да поставите <code>while<\/code> или <code>until<\/code> и след израз.<\/span> <span class=\"sg\" data-s=\"1\">Наричаме това модификатор на израз.<\/span> <span class=\"sg\" data-s=\"2\">Вече го познавате <a href=\"https://course.raku.org/bg/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">от <code>if<\/code> и <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето един пример.<\/span> <span class=\"sg\" data-s=\"1\">Той намира остатъка, тоест това, което остава след делението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-=<\/code> е оператор.<\/span> <span class=\"sg\" data-s=\"1\">Той прави две неща.<\/span> <span class=\"sg\" data-s=\"2\">Изважда число.<\/span> <span class=\"sg\" data-s=\"3\">Освен това записва резултата в променливата.<\/span> <span class=\"sg\" data-s=\"4\">Значи <code>$x -= 3<\/code> е същото като <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модификаторът <code>while<\/code> повтаря израза <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той го повтаря, докато <code>$x &gt; 2<\/code> е <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когато <code>$x &gt; 2<\/code> е <code>False<\/code>, цикълът спира.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако условието е <code>False<\/code> в началото, изразът никога не се изпълнява.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да напишете същата програма с <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава ви трябва обратното условие:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"eo":{"t":"<code>while<\/code> kaj <code>until<\/code> kiel modifiloj de deklaroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas meti <code>while<\/code> aŭ <code>until<\/code> post deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Ni nomas tion deklara modifilo.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam konas ĝin <a href=\"https://course.raku.org/eo/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">el <code>if<\/code> kaj <code>unless<\/code><\/a>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi trovas la reston, aŭ tion, kio restas post divido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>-=<\/code> estas operatoro.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi faras du aferojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi deprenas nombron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ konservas la rezulton en la variablo.<\/span> <span class=\"sg\" data-s=\"4\">Do <code>$x -= 3<\/code> estas la sama kiel <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> modifilo ripetas la deklaron <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ripetas ĝin, dum <code>$x &gt; 2<\/code> estas <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kiam <code>$x &gt; 2<\/code> estas <code>False<\/code>, la buklo haltas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la kondiĉo estas <code>False<\/code> komence, la deklaro neniam ruliĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi la saman programon per <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi bezonas la malan kondiĉon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"la":{"t":"<code>while<\/code> et <code>until<\/code> ut statement modificatores","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Potes etiam <code>while<\/code> vel <code>until<\/code> post sententiam ponere.<\/span> <span class=\"sg\" data-s=\"1\">Hoc modificatorem sententiae vocamus.<\/span> <span class=\"sg\" data-s=\"2\">Iam id <a href=\"https://course.raku.org/la/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">ex <code>if<\/code> et <code>unless<\/code><\/a> cognoscis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum.<\/span> <span class=\"sg\" data-s=\"1\">Residuum invenit, id est, quod post divisionem restat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>-=<\/code> est operator.<\/span> <span class=\"sg\" data-s=\"1\">Duas res facit.<\/span> <span class=\"sg\" data-s=\"2\">Numerum aufert.<\/span> <span class=\"sg\" data-s=\"3\">Etiam resultatum in variabili servat.<\/span> <span class=\"sg\" data-s=\"4\">Itaque <code>$x -= 3<\/code> idem est ac <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modificator <code>while<\/code> sententiam <code>$x -= 3<\/code> repetit.<\/span> <span class=\"sg\" data-s=\"1\">Eam repetit dum <code>$x &gt; 2<\/code> est <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cum <code>$x &gt; 2<\/code> est <code>False<\/code>, ansa desinit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si condicio initio <code>False<\/code> est, sententia numquam currit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem programma cum <code>until<\/code> scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum condicionem contrariam habere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]}}}</script>
