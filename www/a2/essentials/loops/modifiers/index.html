 <span class=\"sg\" data-s=\"1\">Такая форма называется модификатором выражения.<\/span> <span class=\"sg\" data-s=\"2\">Она работает <a href=\"https://course.raku.org/ru/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">так же<\/a>, как <code>if<\/code> и <code>unless<\/code> после выражения.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот пример.<\/span> <span class=\"sg\" data-s=\"1\">Он находит остаток от деления:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-=<\/code> — это оператор.<\/span> <span class=\"sg\" data-s=\"1\">Он вычитает и присваивает одновременно.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$x -= 3<\/code> значит то же самое, что <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модификатор <code>while<\/code> повторяет выражение <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он повторяет его, пока условие <code>$x &gt; 2<\/code> равно <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когда условие становится <code>False<\/code>, цикл останавливается.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если условие с самого начала равно <code>False<\/code>, выражение не выполняется совсем.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ту же программу можно написать с <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для этого нужно взять противоположное условие:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"uk":{"t":"<code>while<\/code> та <code>until<\/code> як модифікатори операторів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви також можете писати <code>while<\/code> і <code>until<\/code> після виразу.<\/span> <span class=\"sg\" data-s=\"1\">Таку форму називають модифікатором виразу.<\/span> <span class=\"sg\" data-s=\"2\">Вона працює <a href=\"https://course.raku.org/uk/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">так само, як<\/a> <code>if<\/code> і <code>unless<\/code> після виразу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось приклад.<\/span> <span class=\"sg\" data-s=\"1\">Він знаходить остачу від ділення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>-=<\/code> — це оператор.<\/span> <span class=\"sg\" data-s=\"1\">Він віднімає й присвоює одночасно.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>$x -= 3<\/code> означає те саме, що <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модифікатор <code>while<\/code> повторює вираз <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повторює його, поки умова <code>$x &gt; 2<\/code> є <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коли умова стає <code>False<\/code>, цикл зупиняється.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо умова на початку є <code>False<\/code>, вираз узагалі не виконується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете написати ту саму програму з <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для цього потрібно використати протилежну умову:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"bg":{"t":"<code>while<\/code> и <code>until<\/code> като модификатори на изречения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да пишете <code>while<\/code> и <code>until<\/code> и след израз.<\/span> <span class=\"sg\" data-s=\"1\">Тази форма се нарича модификатор на израз.<\/span> <span class=\"sg\" data-s=\"2\">Тя работи <a href=\"https://course.raku.org/bg/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">като<\/a> <code>if<\/code> и <code>unless<\/code> след израз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето един пример.<\/span> <span class=\"sg\" data-s=\"1\">Той намира остатъка от деление:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-=<\/code> е оператор.<\/span> <span class=\"sg\" data-s=\"1\">Той изважда и присвоява едновременно.<\/span> <span class=\"sg\" data-s=\"2\">Значи <code>$x -= 3<\/code> означава същото като <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модификаторът <code>while<\/code> повтаря израза <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той го повтаря, докато условието <code>$x &gt; 2<\/code> е <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когато условието стане <code>False<\/code>, цикълът спира.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако условието е <code>False<\/code> в началото, изразът изобщо не се изпълнява.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да напишете същата програма с <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За това трябва да използвате обратното условие:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"eo":{"t":"<code>while<\/code> kaj <code>until<\/code> kiel modifiloj de deklaroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas skribi <code>while<\/code> kaj <code>until<\/code> post deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu formo nomiĝas modifilo de deklaro.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi funkcias <a href=\"https://course.raku.org/eo/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">kiel<\/a> <code>if<\/code> kaj <code>unless<\/code> post deklaro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi trovas la reston de divido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>-=<\/code> estas operatoro.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi subtrahas kaj asignas samtempe.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$x -= 3<\/code> signifas la samon kiel <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> modifilo ripetas la deklaron <code>$x -= 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ripetas ĝin, dum la kondiĉo <code>$x &gt; 2<\/code> estas <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kiam la kondiĉo fariĝas <code>False<\/code>, la buklo haltas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se la kondiĉo estas <code>False<\/code> komence, la deklaro tute ne ruliĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi la saman programon per <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, vi devas uzi la malan kondiĉon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"la":{"t":"<code>while<\/code> et <code>until<\/code> ut statement modificatores","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Potes etiam <code>while<\/code> et <code>until<\/code> post sententiam scribere.<\/span> <span class=\"sg\" data-s=\"1\">Haec forma modificator sententiae vocatur.<\/span> <span class=\"sg\" data-s=\"2\">Operatur <a href=\"https://course.raku.org/la/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">sicut<\/a> <code>if<\/code> et <code>unless<\/code> post sententiam.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum.<\/span> <span class=\"sg\" data-s=\"1\">Residuum divisionis invenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>-=<\/code> est operator.<\/span> <span class=\"sg\" data-s=\"1\">Simul subtrahit et assignat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>$x -= 3<\/code> idem significat ac <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modificator <code>while<\/code> sententiam <code>$x -= 3<\/code> repetit.<\/span> <span class=\"sg\" data-s=\"1\">Eam repetit dum condicio <code>$x &gt; 2<\/code> est <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cum condicio fit <code>False<\/code>, ansa desinit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si condicio initio <code>False<\/code> est, sententia omnino non currit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem programma cum <code>until<\/code> scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc, condicionem contrariam adhibere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]}}}</script>
