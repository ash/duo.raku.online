<script type="application/json" id="page-data">{"u":"essentials/on-unicode","n":13,"k":"section","pv":"essentials/hello-world","nx":"essentials/running-programs","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Notes on using Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku expects all your program files to be in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">What does this mean in practice?<\/span> <span class=\"sg\" data-s=\"2\">You do not have to worry about characters outside ASCII.<\/span> <span class=\"sg\" data-s=\"3\">For example, you can put them into strings.<\/span> <span class=\"sg\" data-s=\"4\">But that is not all.<\/span> <span class=\"sg\" data-s=\"5\">Your program may also read a UTF-8 text file.<\/span> <span class=\"sg\" data-s=\"6\">Most likely, you do not have to worry about that either.<\/span> <span class=\"sg\" data-s=\"7\">Also, Raku gets the length of a string right.<\/span> <span class=\"sg\" data-s=\"8\">It counts characters, not bytes.<\/span> <span class=\"sg\" data-s=\"9\">We look at this in more detail later.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is the next thing to know.<\/span> <span class=\"sg\" data-s=\"1\">Names in your program can have non-Latin or non-English letters.<\/span> <span class=\"sg\" data-s=\"2\">If you like, you can name a variable <code>$ι<\/code> instead of <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The compiler reads it correctly.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku is very careful with the Unicode properties of characters.<\/span> <span class=\"sg\" data-s=\"1\">For example, it knows which characters are letters or digits.<\/span> <span class=\"sg\" data-s=\"2\">It also knows which characters make pairs.<\/span> <span class=\"sg\" data-s=\"3\">Parentheses and other brackets are pairs.<\/span> <span class=\"sg\" data-s=\"4\">Often, different parts of the program can use different brackets.<\/span> <span class=\"sg\" data-s=\"5\">For example, our ‘Hello, World!’ program can use these non-Latin quotes.<\/span> <span class=\"sg\" data-s=\"6\">You will see them again later, in Raku grammars:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Some built-in operators have two forms.<\/span> <span class=\"sg\" data-s=\"1\">One form uses Unicode, and the other uses only ASCII.<\/span> <span class=\"sg\" data-s=\"2\">For example, you can write ‘not equal’ as <code>!=<\/code> or as <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It is the same with set operations.<\/span> <span class=\"sg\" data-s=\"4\">One example is <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Its ASCII form is <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">There is also a built-in constant.<\/span> <span class=\"sg\" data-s=\"7\">You can write it as <code>pi<\/code> or as <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">With numbers, you can write fractions as <code>½<\/code> instead of <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can also calculate the square of <code>$x<\/code> as <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This uses a superscript character.<\/span> <span class=\"sg\" data-s=\"3\">It is small and written high.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the full list of these pairs: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode and ASCII symbols<\/a>.<\/span><\/p>"]]},"de":{"t":"Hinweise zur Verwendung von Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku erwartet alle Ihre Programmdateien in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Was bedeutet das in der Praxis?<\/span> <span class=\"sg\" data-s=\"2\">Sie müssen sich keine Sorgen um Zeichen außerhalb von ASCII machen.<\/span> <span class=\ code, die andere nur ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel können Sie „ungleich“ als <code>!=<\/code> oder als <code>≠<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"3\">Bei Mengenoperationen ist es genauso.<\/span> <span class=\"sg\" data-s=\"4\">Ein Beispiel ist <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Seine ASCII-Form ist <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Es gibt auch eine eingebaute Konstante.<\/span> <span class=\"sg\" data-s=\"7\">Sie können sie als <code>pi<\/code> oder als <code>π<\/code> schreiben.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bei Zahlen können Sie Brüche als <code>½<\/code> statt <code>0.5<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Sie können auch das Quadrat von <code>$x<\/code> als <code>$x²<\/code> berechnen.<\/span> <span class=\"sg\" data-s=\"2\">Dafür nutzen Sie ein hochgestelltes Zeichen.<\/span> <span class=\"sg\" data-s=\"3\">Es ist klein und steht oben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die ganze Liste dieser Paare: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode- und ASCII-Symbole<\/a>.<\/span><\/p>"]]},"nl":{"t":"Opmerkingen over het gebruik van Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku verwacht al je programmabestanden in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Wat betekent dit in de praktijk?<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft je geen zorgen te maken over tekens buiten ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze bijvoorbeeld in strings zetten.<\/span> <span class=\"sg\" data-s=\"4\">Maar dat is niet alles.<\/span> <span class=\"sg\" data-s=\"5\">Je programma kan ook een UTF-8-tekstbestand lezen.<\/span> <span class=\"sg\" data-s=\"6\">Ook dan hoef je je waarschijnlijk geen zorgen te maken.<\/span> <span class=\"sg\" data-s=\"7\">Ook bepaalt Raku de lengte van een string goed.<\/span> <span class=\"sg\" data-s=\"8\">Het telt tekens, geen bytes.<\/span> <span class=\"sg\" data-s=\"9\">We bekijken dit later in meer detail.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is het volgende punt.<\/span> <span class=\"sg\" data-s=\"1\">Namen in je programma kunnen niet-Latijnse of niet-Engelse letters hebben.<\/span> <span class=\"sg\" data-s=\"2\">Als je wilt, kun je een variabele <code>$ι<\/code> noemen in plaats van <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De compiler leest dat goed.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku is heel precies met de Unicode-eigenschappen van tekens.<\/span> <span class=\"sg\" data-s=\"1\">Het weet bijvoorbeeld welke tekens letters of cijfers zijn.<\/span> <span class=\"sg\" data-s=\"2\">Het weet ook welke tekens paren vormen.<\/span> <span class=\"sg\" data-s=\"3\">Haakjes en andere haken zijn paren.<\/span> <span class=\"sg\" data-s=\"4\">Vaak kunnen verschillende delen van het programma verschillende haakjes gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Ons 'Hello, World!'-programma kan bijvoorbeeld deze niet-Latijnse aanhalingstekens gebruiken.<\/span> <span class=\"sg\" data-s=\"6\">Je ziet ze later terug, bij Raku-grammatica's:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Sommige ingebouwde operators hebben twee vormen.<\/span> <span class=\"sg\" data-s=\"1\">De ene vorm gebruikt Unicode, de andere alleen ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ‘niet gelijk’ bijvoorbeeld schrijven als <code>!=<\/code> of als <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bij setbewerkingen is het net zo.<\/span> <span class=\"sg\" data-s=\"4\">Een voorbeeld is <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">De ASCII-vorm daarvan is <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Er is ook een ingebouwde constante.<\/span> <span class=\"sg\" data-s=\"7\">Die kun je schrijven als <code>pi<\/code> of als <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bij getallen kun je breuken schrijven als <code>½<\/code> in plaats van <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ook het kwadraat van <code>$x<\/code> berekenen als <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebruikt een superscript-teken.<\/span> <span class=\"sg\" data-s=\"3\">Het is klein en staat hoog.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is de volledige lijst van deze paren: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode- en ASCII-symbolen<\/a>.<\/span><\/p>"]]},"es":{"t":"Notas sobre el uso de Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku espera que todos tus archivos de programa estén en UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué significa esto en la práctica?<\/span> <span class=\"sg\" data-s=\"2\">No tienes que preocuparte por los caracteres fuera de ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, puedes ponerlos en cadenas.<\/span> <span class=\"sg\" data-s=\"4\">Pero eso no es todo.<\/span> <span class=\"sg\" data-s=\"5\">Tu programa también puede leer un archivo de texto UTF-8.<\/span> <span class=\"sg\" data-s=\"6\">Seguramente tampoco tienes que preocuparte por eso.<\/span> <span class=\"sg\" data-s=\"7\">Además, Raku calcula bien la longitud de una cadena.<\/span> <span class=\"sg\" data-s=\"8\">Cuenta caracteres, no bytes.<\/span> <span class=\"sg\" data-s=\"9\">Más adelante vemos esto con más detalle.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes lo siguiente que debes saber.<\/span> <span class=\"sg\" data-s=\"1\">Los nombres en tu programa pueden tener letras no latinas o no inglesas.<\/span> <span class=\"sg\" data-s=\"2\">Si quieres, puedes llamar a una variable <code>$ι<\/code> en lugar de <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El compilador la lee correctamente.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku tiene mucho cuidado con las propiedades Unicode de los caracteres.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, sabe qué caracteres son letras o dígitos.<\/span> <span class=\"sg\" data-s=\"2\">También sabe qué caracteres forman pares.<\/span> <span class=\"sg\" data-s=\"3\">Los paréntesis y los otros corchetes son pares.<\/span> <span class=\"sg\" data-s=\"4\">A menudo, partes diferentes del programa pueden usar corchetes diferentes.<\/span> <span class=\"sg\" data-s=\"5\">Por ejemplo, nuestro programa ‘¡Hola, Mundo!’ puede usar estas comillas no latinas.<\/span> <span class=\"sg\" data-s=\"6\">Vas a verlas otra vez más adelante, en las gramáticas de Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Algunos operadores integrados tienen dos formas.<\/span> <span class=\"sg\" data-s=\"1\">Una forma usa Unicode, y la otra usa solo ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, puedes escribir ‘distinto’ como <code>!=<\/code> o como <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pasa lo mismo con las operaciones de conjuntos.<\/span> <span class=\"sg\" data-s=\"4\">Un ejemplo es <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Su forma ASCII es <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">También hay una constante integrada.<\/span> <span class=\"sg\" data-s=\"7\">Puedes escribirla como <code>pi<\/code> o como <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con números, puedes escribir fracciones como <code>½<\/code> en lugar de <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También puedes calcular el cuadrado de <code>$x<\/code> como <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto usa un carácter en superíndice.<\/span> <span class=\"sg\" data-s=\"3\">Es pequeño y está escrito arriba.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí está la lista completa de estos pares: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Símbolos Unicode y ASCII<\/a>.<\/span><\/p>"]]},"it":{"t":"Note sull'uso di Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku si aspetta tutti i file del tuo programma in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Che cosa significa in pratica?<\/span> <span class=\"sg\" data-s=\"2\">Non devi preoccuparti dei caratteri fuori da ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, puoi metterli nelle stringhe.<\/span> <span class=\"sg\" data-s=\"4\">Ma non è tutto.<\/span> <span class=\"sg\" data-s=\"5\">Il tuo programma può anche leggere un file di testo UTF-8.<\/span> <span class=\"sg\" data-s=\"6\">Molto probabilmente, non devi preoccuparti nemmeno di questo.<\/span> <span class=\"sg\" data-s=\"7\">Inoltre, Raku calcola bene la lunghezza di una stringa.<\/span> <span class=\"sg\" data-s=\"8\">Conta i caratteri, non i byte.<\/span> <span class=\"sg\" data-s=\"9\">Ne parliamo in dettaglio più avanti.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco la prossima cosa da sapere.<\/span> <span class=\"sg\" data-s=\"1\">I nomi nel tuo programma possono avere lettere non latine o non inglesi.<\/span> <span class=\"sg\" data-s=\"2\">Se vuoi, puoi chiamare una variabile <code>$ι<\/code> invece di <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il compilatore la legge correttamente.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku sta molto attento alle proprietà Unicode dei caratteri.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, sa quali caratteri sono lettere o cifre.<\/span> <span class=\"sg\" data-s=\"2\">Sa anche quali caratteri formano coppie.<\/span> <span class=\"sg\" data-s=\"3\">Le parentesi tonde e le altre parentesi sono coppie.<\/span> <span class=\"sg\" data-s=\"4\">Spesso parti diverse del programma possono usare parentesi diverse.<\/span> <span class=\"sg\" data-s=\"5\">Per esempio, il nostro programma ‘Hello, World!’ può usare queste virgolette non latine.<\/span> <span class=\"sg\" data-s=\"6\">Le vedrai di nuovo più avanti, nelle grammatiche Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Alcuni operatori integrati hanno due forme.<\/span> <span class=\"sg\" data-s=\"1\">Una forma usa Unicode e l'altra usa solo ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, puoi scrivere ‘non uguale’ come <code>!=<\/code> o come <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lo stesso vale per le operazioni sugli insiemi.<\/span> <span class=\"sg\" data-s=\"4\">Un esempio è <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La sua forma ASCII è <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">C'è anche una costante integrata.<\/span> <span class=\"sg\" data-s=\"7\">Puoi scriverla come <code>pi<\/code> o come <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con i numeri, puoi scrivere le frazioni come <code>½<\/code> invece di <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche calcolare il quadrato di <code>$x<\/code> come <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo usa un carattere apice.<\/span> <span class=\"sg\" data-s=\"3\">È piccolo e scritto in alto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco l'elenco completo di queste coppie: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Simboli Unicode e ASCII<\/a>.<\/span><\/p>"]]},"lv":{"t":"Piezīmes par Unicode izmantošanu","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku sagaida, ka visi jūsu programmu faili ir UTF-8 kodējumā.<\/span> <span class=\"sg\" data-s=\"1\">Ko tas nozīmē praksē?<\/span> <span class=\"sg\" data-s=\"2\">Jums nav jāuztraucas par rakstzīmēm ārpus ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, jūs varat tās likt virknēs.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas nav viss.<\/span> <span class=\"sg\" data-s=\"5\">Jūsu programma var arī lasīt UTF-8 teksta failu.<\/span> <span class=\"sg\" data-s=\"6\">Droši vien arī par to jums nav jāuztraucas.<\/span> <span class=\"sg\" data-s=\"7\">Raku arī pareizi nosaka virknes garumu.<\/span> <span class=\"sg\" data-s=\"8\">Tas skaita rakstzīmes, nevis baitus.<\/span> <span class=\"sg\" data-s=\"9\">Sīkāk mēs to apskatīsim vēlāk.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir nākamā lieta, kas jums jāzina.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukumos jūsu programmā var būt ne-latīņu vai ne-angļu burti.<\/span> <span class=\"sg\" data-s=\"2\">Ja vēlaties, mainīgo var nosaukt <code>$ι<\/code>, nevis <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kompilators to nolasa pareizi.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ļoti rūpīgi strādā ar rakstzīmju Unicode īpašībām.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tas zina, kuras rakstzīmes ir burti vai cipari.<\/span> <span class=\"sg\" data-s=\"2\">Tas arī zina, kuras rakstzīmes veido pārus.<\/span> <span class=\"sg\" data-s=\"3\">Apaļās iekavas un citas iekavas ir pāri.<\/span> <span class=\"sg\" data-s=\"4\">Bieži dažādās programmas daļās var lietot dažādas iekavas.<\/span> <span class=\"sg\" data-s=\"5\">Piemēram, mūsu \"Hello, World!\" programma var lietot šīs ne-latīņu pēdiņas.<\/span> <span class=\"sg\" data-s=\"6\">Jūs tās vēlreiz redzēsiet vēlāk, Raku gramatikās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Dažiem iebūvētiem operatoriem ir divas formas.<\/span> <span class=\"sg\" data-s=\"1\">Viena forma lieto Unicode, bet otra tikai ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, ‘nav vienāds’ var rakstīt kā <code>!=<\/code> vai kā <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas pats ir ar kopu operācijām.<\/span> <span class=\"sg\" data-s=\"4\">Viens piemērs ir <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tā ASCII forma ir <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ir arī iebūvēta konstante.<\/span> <span class=\"sg\" data-s=\"7\">To var rakstīt kā <code>pi<\/code> vai kā <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ar skaitļiem jūs varat rakstīt daļskaitļus kā <code>½<\/code>, nevis <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat arī aprēķināt <code>$x<\/code> kvadrātu kā <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas izmanto augšraksta rakstzīmi.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir maza un stāv augstu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir pilns šo pāru saraksts: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode un ASCII simboli<\/a>.<\/span><\/p>"]]},"ru":{"t":"Заметки по использованию Юникода","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku ждёт, что все файлы вашей программы будут в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Что это значит на практике?<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужно волноваться о символах не из ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Например, вы можете писать их в строках.<\/span> <span class=\"sg\" data-s=\"4\">Но это не всё.<\/span> <span class=\"sg\" data-s=\"5\">Ваша программа может ещё читать текстовый файл в UTF-8.<\/span> <span class=\"sg\" data-s=\"6\">Скорее всего, об этом тоже не нужно волноваться.<\/span> <span class=\"sg\" data-s=\"7\">Ещё Raku правильно находит длину строки.<\/span> <span class=\"sg\" data-s=\"8\">Он считает символы, а не байты.<\/span> <span class=\"sg\" data-s=\"9\">Позже мы посмотрим на это подробнее.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот следующая важная вещь.<\/span> <span class=\"sg\" data-s=\"1\">В именах в вашей программе могут быть нелатинские или неанглийские буквы.<\/span> <span class=\"sg\" data-s=\"2\">Если хотите, вы можете назвать переменную <code>$и<\/code> вместо <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилятор правильно её читает.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku очень внимательно относится к свойствам символов в Юникоде.<\/span> <span class=\"sg\" data-s=\"1\">Например, он знает, какие символы — буквы или цифры.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он знает, какие символы образуют пары.<\/span> <span class=\"sg\" data-s=\"3\">Круглые скобки и другие скобки — это пары.<\/span> <span class=\"sg\" data-s=\"4\">Часто разные части программы могут использовать разные скобки.<\/span> <span class=\"sg\" data-s=\"5\">Например, наша программа \"Привет, Мир!\" может использовать эти нелатинские кавычки.<\/span> <span class=\"sg\" data-s=\"6\">Вы увидите их снова позже, в грамматиках Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">У некоторых встроенных операторов есть две формы.<\/span> <span class=\"sg\" data-s=\"1\">Одна форма использует Юникод, а другая — только ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Например, «не равно» можно написать как <code>!=<\/code> или как <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">То же самое с операциями над множествами.<\/span> <span class=\"sg\" data-s=\"4\">Один пример — <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Его форма в ASCII — <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Есть и встроенная константа.<\/span> <span class=\"sg\" data-s=\"7\">Её можно написать как <code>pi<\/code> или как <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С числами вы можете писать дроби как <code>½<\/code> вместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё вы можете вычислить квадрат <code>$x<\/code> как <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Здесь нужен символ в верхнем индексе.<\/span> <span class=\"sg\" data-s=\"3\">Он маленький и стоит выше строки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот полный список таких пар: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Юникод и ASCII символы<\/a>.<\/span><\/p>"]]},"uk":{"t":"Примітки щодо використання Юнікоду","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Для Raku всі файли ваших програм мають бути в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Що це означає на практиці?<\/span> <span class=\"sg\" data-s=\"2\">Вам не треба хвилюватися про символи поза ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ви можете писати їх у рядках.<\/span> <span class=\"sg\" data-s=\"4\">Але це не все.<\/span> <span class=\"sg\" data-s=\"5\">Ваша програма може також читати текстовий файл у UTF-8.<\/span> <span class=\"sg\" data-s=\"6\">Швидше за все, про це вам теж не треба хвилюватися.<\/span> <span class=\"sg\" data-s=\"7\">Також Raku правильно визначає довжину рядка.<\/span> <span class=\"sg\" data-s=\"8\">Він рахує символи, а не байти.<\/span> <span class=\"sg\" data-s=\"9\">Ми подивимося на це детальніше пізніше.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось наступне, що треба знати.<\/span> <span class=\"sg\" data-s=\"1\">Імена у вашій програмі можуть мати нелатинські або неанглійські літери.<\/span> <span class=\"sg\" data-s=\"2\">Якщо хочете, можете назвати змінну <code>$ι<\/code> замість <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компілятор правильно її читає.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku дуже уважно ставиться до властивостей символів Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, він знає, які символи — це літери або цифри.<\/span> <span class=\"sg\" data-s=\"2\">Він також знає, які символи утворюють пари.<\/span> <span class=\"sg\" data-s=\"3\">Круглі та інші дужки — це пари.<\/span> <span class=\"sg\" data-s=\"4\">Часто різні частини програми можуть використовувати різні дужки.<\/span> <span class=\"sg\" data-s=\"5\">Наприклад, наша програма «Hello, World!» може використовувати ці нелатинські лапки.<\/span> <span class=\"sg\" data-s=\"6\">Ви побачите їх знову пізніше, у граматиках Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Деякі вбудовані оператори мають дві форми.<\/span> <span class=\"sg\" data-s=\"1\">Одна форма використовує Unicode, а інша — тільки ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, ви можете написати «не дорівнює» як <code>!=<\/code> або як <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Так само з операціями з множинами.<\/span> <span class=\"sg\" data-s=\"4\">Один приклад — <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Його форма в ASCII — <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Є також вбудована константа.<\/span> <span class=\"sg\" data-s=\"7\">Ви можете писати її як <code>pi<\/code> або як <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">З числами ви можете писати дроби як <code>½<\/code> замість <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви також можете рахувати квадрат <code>$x<\/code> як <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тут ви використовуєте символ надрядкового індексу.<\/span> <span class=\"sg\" data-s=\"3\">Він маленький і стоїть угорі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось повний список таких пар: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode and ASCII symbols<\/a>.<\/span><\/p>"]]},"bg":{"t":"Бележки относно използването на Unicode","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku очаква всичките ви програмни файлове да са в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Какво означава това на практика?<\/span> <span class=\"sg\" data-s=\"2\">Не трябва да се притеснявате за символи извън ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Например можете да ги слагате в низове.<\/span> <span class=\"sg\" data-s=\"4\">Но това не е всичко.<\/span> <span class=\"sg\" data-s=\"5\">Вашата програма може и да чете текстов файл в UTF-8.<\/span> <span class=\"sg\" data-s=\"6\">Най-вероятно и за това не трябва да се притеснявате.<\/span> <span class=\"sg\" data-s=\"7\">Освен това Raku намира правилно дължината на низа.<\/span> <span class=\"sg\" data-s=\"8\">Той брои символи, а не байтове.<\/span> <span class=\"sg\" data-s=\"9\">Ще разгледаме това по-подробно по-късно.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето следващото важно нещо.<\/span> <span class=\"sg\" data-s=\"1\">Имената в програмата ви могат да имат не-латински или не-английски букви.<\/span> <span class=\"sg\" data-s=\"2\">Ако искате, можете да наречете променлива <code>$ι<\/code> вместо <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилаторът я чете правилно.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku е много внимателен с Unicode свойствата на символите.<\/span> <span class=\"sg\" data-s=\"1\">Например той знае кои символи са букви или цифри.<\/span> <span class=\"sg\" data-s=\"2\">Той знае и кои символи образуват двойки.<\/span> <span class=\"sg\" data-s=\"3\">Кръглите скоби и другите видове скоби са двойки.<\/span> <span class=\"sg\" data-s=\"4\">Често различни части на програмата могат да използват различни скоби.<\/span> <span class=\"sg\" data-s=\"5\">Например нашата програма „Hello, World!“ може да използва тези не-латински кавички.<\/span> <span class=\"sg\" data-s=\"6\">Ще ги видите пак по-късно, в граматиките на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Някои вградени оператори имат две форми.<\/span> <span class=\"sg\" data-s=\"1\">Едната форма използва Unicode, а другата използва само ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Например можете да напишете „не е равно“ като <code>!=<\/code> или като <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Същото е и при операциите с множества.<\/span> <span class=\"sg\" data-s=\"4\">Един пример е <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Неговата ASCII форма е <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Има и вградена константа.<\/span> <span class=\"sg\" data-s=\"7\">Можете да я напишете като <code>pi<\/code> или като <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">При числата можете да пишете дроби като <code>½<\/code> вместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете също да изчислите квадрата на <code>$x<\/code> като <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това използва надписан символ.<\/span> <span class=\"sg\" data-s=\"3\">Той е малък и стои високо.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пълния списък на тези двойки: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode и ASCII символи<\/a>.<\/span><\/p>"]]},"eo":{"t":"Notoj pri uzado de Unikodo","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku atendas ĉiujn viajn programdosierojn en UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Kion tio signifas en praktiko?<\/span> <span class=\"sg\" data-s=\"2\">Vi ne devas zorgi pri karakteroj ekster ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, vi povas meti ilin en ŝnurojn.<\/span> <span class=\"sg\" data-s=\"4\">Sed tio ne estas ĉio.<\/span> <span class=\"sg\" data-s=\"5\">Via programo ankaŭ povas legi UTF-8-tekstdosieron.<\/span> <span class=\"sg\" data-s=\"6\">Plej verŝajne, ankaŭ pri tio vi ne devas zorgi.<\/span> <span class=\"sg\" data-s=\"7\">Ankaŭ, Raku ĝuste trovas la longecon de ŝnuro.<\/span> <span class=\"sg\" data-s=\"8\">Ĝi kalkulas karakterojn, ne bajtojn.<\/span> <span class=\"sg\" data-s=\"9\">Ni rigardas tion pli detale poste.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen la sekva afero por scii.<\/span> <span class=\"sg\" data-s=\"1\">Nomoj en via programo povas havi ne-latinajn aŭ ne-anglajn literojn.<\/span> <span class=\"sg\" data-s=\"2\">Se vi volas, vi povas nomi variablon <code>$ι<\/code> anstataŭ <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La kompililo ĝuste legas ĝin.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku estas tre zorga pri la Unikodaj ecoj de karakteroj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ĝi scias, kiuj karakteroj estas literoj aŭ ciferoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ scias, kiuj karakteroj faras parojn.<\/span> <span class=\"sg\" data-s=\"3\">Rondaj krampoj kaj aliaj krampoj estas paroj.<\/span> <span class=\"sg\" data-s=\"4\">Ofte, malsamaj partoj de la programo povas uzi malsamajn krampojn.<\/span> <span class=\"sg\" data-s=\"5\">Ekzemple, nia programo ‘Saluton, Mondo!’ povas uzi ĉi tiujn ne-latinajn citilojn.<\/span> <span class=\"sg\" data-s=\"6\">Vi vidos ilin denove poste, en Raku-gramatikoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Saluton, Mondo!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Iuj enkonstruitaj operatoroj havas du formojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu formo uzas Unikodon, kaj la alia uzas nur ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, vi povas skribi ‘ne egala’ kiel <code>!=<\/code> aŭ kiel <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Same estas por operacioj kun aroj.<\/span> <span class=\"sg\" data-s=\"4\">Unu ekzemplo estas <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝia ASCII-formo estas <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Estas ankaŭ enkonstruita konstanto.<\/span> <span class=\"sg\" data-s=\"7\">Vi povas skribi ĝin kiel <code>pi<\/code> aŭ kiel <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kun nombroj, vi povas skribi frakciojn kiel <code>½<\/code> anstataŭ <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas kalkuli la kvadraton de <code>$x<\/code> kiel <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio uzas superskriban karakteron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas malgranda kaj skribita alte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la plena listo de ĉi tiuj paroj: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unikodaj kaj ASCII-simboloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Notae de usu Unicodi","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Raku omnes fasciculos programmatis tui in UTF-8 exspectat.<\/span> <span class=\"sg\" data-s=\"1\">Quid hoc in usu significat?<\/span> <span class=\"sg\" data-s=\"2\">De characteribus extra ASCII curare non debes.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, eos in stringas ponere potes.<\/span> <span class=\"sg\" data-s=\"4\">Sed hoc non est totum.<\/span> <span class=\"sg\" data-s=\"5\">Programma tuum etiam fasciculum textus UTF-8 legere potest.<\/span> <span class=\"sg\" data-s=\"6\">Verisimiliter ne de hoc quidem curare debes.<\/span> <span class=\"sg\" data-s=\"7\">Etiam Raku longitudinem stringae recte invenit.<\/span> <span class=\"sg\" data-s=\"8\">Characteres numerat, non bytes.<\/span> <span class=\"sg\" data-s=\"9\">Hoc postea accuratius spectamus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc deinde scire debes.<\/span> <span class=\"sg\" data-s=\"1\">Nomina in programmate tuo litteras non-Latinas vel non-Anglicas habere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Si vis, variabile nominare potes <code>$ι<\/code> loco <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Compilator id recte legit.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku proprietates Unicodi characterum valde diligenter tractat.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, litteras et digitos novit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam paria characterum novit.<\/span> <span class=\"sg\" data-s=\"3\">Parentheses et alii unci paria sunt.<\/span> <span class=\"sg\" data-s=\"4\">Saepe diversae partes programmatis diversos uncos adhibere possunt.<\/span> <span class=\"sg\" data-s=\"5\">Exempli gratia, programma nostrum ‘Hello, World!’ hos characteres citationis non-Latinos adhibere potest.<\/span> <span class=\"sg\" data-s=\"6\">Eos postea iterum videbis, in grammaticis Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Quidam operatores in-builti duas formas habent.<\/span> <span class=\"sg\" data-s=\"1\">Una forma Unicodum adhibet, altera solum ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, ‘non aequale’ scribere potes ut <code>!=<\/code> vel ut <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Idem est cum operationibus set.<\/span> <span class=\"sg\" data-s=\"4\">Unum exemplum est <code>∈<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Forma eius ASCII est <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Est etiam constans in-builta.<\/span> <span class=\"sg\" data-s=\"7\">Eam scribere potes ut <code>pi<\/code> vel ut <code>π<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum numeris, fractiones scribere potes ut <code>½<\/code> loco <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam quadratum <code>$x<\/code> computare potes ut <code>$x²<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc characterem superscriptum adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Parvus est et in alto stat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est plenus index horum parium: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Symbola Unicode et ASCII<\/a>.<\/span><\/p>"]]}}}</script>
