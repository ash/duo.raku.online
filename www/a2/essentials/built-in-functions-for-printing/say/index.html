an><\/li><li><span class=\"sg\" data-s=\"3\">Изпраща го към потока <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За потребителя това е просто.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> отпечатва стойността на променлива в терминала.<\/span> <span class=\"sg\" data-s=\"2\">След това тя добавя нов ред.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първата стъпка има нужда от малко обяснение.<\/span> <span class=\"sg\" data-s=\"1\">Всеки вграден тип данни има метод <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Целите числа и низовете са примери за такива типове.<\/span> <span class=\"sg\" data-s=\"3\">За тези прости типове <code>gist<\/code> връща елемента като лесна за четене стойност.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои данни са по-сложни, например масиви или хешове.<\/span> <span class=\"sg\" data-s=\"1\">За такива данни <code>gist<\/code> добавя малко форматиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да извикате <code>say<\/code> като функция.<\/span> <span class=\"sg\" data-s=\"1\">Можете също да я извикате като метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да подадете повече от един аргумент на <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя съединява частите на изхода.<\/span> <span class=\"sg\" data-s=\"2\">Между тях няма интервали.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"eo":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La enkonstruita rutino <code>say<\/code> faras kvar aferojn:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vokas la metodon <code>gist<\/code> sur siaj argumentoj.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aldonas novlinian karakteron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertas la rezulton al UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendas ĝin al la fluo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por la uzanto, ĝi estas simpla.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> presas la valoron de variablo en la terminalo.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi aldonas novlinion.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La unua paŝo bezonas iom da klarigo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu enkonstruita datentipo havas metodon <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Entjeroj kaj ĉenoj estas ekzemploj de tiaj tipoj.<\/span> <span class=\"sg\" data-s=\"3\">Por ĉi tiuj simplaj tipoj, <code>gist<\/code> redonas la objekton kiel facile legeblan valoron.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkaj datumoj estas pli kompleksaj, ekzemple vektoroj aŭ asociaj tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Por tiaj datumoj, <code>gist<\/code> aldonas iom da formatado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas voki <code>say<\/code> kiel funkcion.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas voki ĝin kiel metodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas pasi pli ol unu argumenton al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kunigas la partojn de la eligo.<\/span> <span class=\"sg\" data-s=\"2\">Ne estas spacoj inter ili.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"la":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutina aedificata <code>say<\/code> quattuor res facit:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vocavit methodum <code>gist<\/code> in argumentis suis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Addit novam lineam characterem.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convertit eventum ad UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mittit ad <code>STDOUT<\/code> rivum.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Usori res simplex est.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> valorem variabilis in terminali imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde novam lineam addit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Primus gradus aliquam explicationem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Omne genus aedificatum datorum methodum <code>gist<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Integri et chordae sunt exempla talium generum.<\/span> <span class=\"sg\" data-s=\"3\">Pro his generibus simplicibus, <code>gist<\/code> rem ut valorem facile legibilem reddit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaedam data magis complexa sunt, exempli gratia ordines vel tabulae.<\/span> <span class=\"sg\" data-s=\"1\">Pro talibus datis, <code>gist<\/code> aliquam formam addit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Potes <code>say<\/code> ut functionem vocare.<\/span> <span class=\"sg\" data-s=\"1\">Etiam eam ut methodum vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Plus quam unum argumentum ad <code>say<\/code> dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Partes output iungit.<\/span> <span class=\"sg\" data-s=\"2\">Nulla spatia inter eas sunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]}}}</script>
