<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing/exercises/compare-say-and-put/solution","n":318,"k":"solution","pv":"essentials/built-in-functions-for-printing/exercises/compare-say-and-put","nx":"essentials/built-in-functions-for-printing/exercises/print-the-warning","tr":["essentials","essentials/built-in-functions-for-printing"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Solution: Compare <code>say<\/code> and <code>put<\/code>","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $i = 256;\nsay $i;\nput $i;\n\nmy Rat $r = 1/8;\nsay $r;\nput $r;\n\nmy Num $n = 6.022e23;\nsay $n;\nput $n;\n\nmy Str $s = 'camelia';\nsay $s;\nput $s;\n\nmy @a = &lt;red green blue&gt;;\n# say @a.WHAT;\nsay @a;\nput @a;\n\nmy List $l = (10, 20, 30);\n# say $l.WHAT;\nsay $l;\nput $l;\n\nmy Range $range = 1..5;\nsay $range;\nput $range;\n\nmy %h = x =&gt; 10, y =&gt; 20;\nsay %h;\nput %h;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can also print the type of a variable.<\/span> <span class=\"sg\" data-s=\"1\">The code shows this for the array and the list.<\/span> <span class=\"sg\" data-s=\"2\">This way, you can be sure that the type is right.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Find the program in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/built-in-functions-for-printing/compare-say-and-put.raku\" target=\"_blank\" rel=\"noopener\">compare-say-and-put.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the output of the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/built-in-functions-for-printing/compare-say-and-put.raku\n256\n256\n0.125\n0.125\n6.022e+23\n6.022e+23\ncamelia\ncamelia\n[red green blue]\nred green blue\n(10 20 30)\n10 20 30\n1..5\n1 2 3 4 5\n{x =&gt; 10, y =&gt; 20}\nx\t10\ny\t20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Look at the output of the program.<\/span> <span class=\"sg\" data-s=\"1\">Numbers and strings are simple data types.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> and <code>put<\/code> print them in the same way.<\/span> <span class=\"sg\" data-s=\"3\">Data types with many values are different.<\/span> <span class=\"sg\" data-s=\"4\">For them, <code>say<\/code> gives a bit more ‘noisy’ output than <code>put<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">But with hashes, <code>put<\/code> prints a table.<\/span> <span class=\"sg\" data-s=\"6\"><code>say<\/code> prints the hash on one line.<\/span> <span class=\"sg\" data-s=\"7\">The <code>Range<\/code> is very interesting.<\/span> <span class=\"sg\" data-s=\"8\"><code>say<\/code> keeps the short form <code>1..5<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">But <code>put<\/code> prints all the values one by one: <code>1 2 3 4 5<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Why is the output different?<\/span> <span class=\"sg\" data-s=\"1\">It depends on two methods: <code>Str<\/code> and <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Each type has its own version of these methods.<\/span> <span class=\"sg\" data-s=\"3\">We talk more about this later in the course.<\/span><\/p>"]]}}}</script>
