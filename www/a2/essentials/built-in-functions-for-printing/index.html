<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing","n":311,"k":"section","pv":"essentials/more-on-functions/exercises/factorial-with-multi-functions/solution","nx":"essentials/built-in-functions-for-printing/say","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in functions for printing","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">We often use the built-in routine <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It prints data to the console.<\/span> <span class=\"sg\" data-s=\"2\">To be more exact, it prints to the <code>STDOUT<\/code> stream.<\/span> <span class=\"sg\" data-s=\"3\">Raku has a few more functions that print.<\/span> <span class=\"sg\" data-s=\"4\">Most of them were in the <a href=\"/essentials/hello-world/\">‘Hello, World!’ examples<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">But we only looked at them quickly.<\/span> <span class=\"sg\" data-s=\"6\">This section gives more details.<\/span><\/p>"]]},"de":{"t":"Eingebaute Funktionen zum Drucken","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Wir verwenden oft die eingebaute Routine <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie druckt Daten auf die Konsole.<\/span> <span class=\"sg\" data-s=\"2\">Genauer gesagt druckt sie in den <code>STDOUT<\/code>-Stream.<\/span> <span class=\"sg\" data-s=\"3\">Raku hat noch ein paar andere Funktionen zum Drucken.<\/span> <span class=\"sg\" data-s=\"4\">Die meisten davon waren schon in den <a href=\"https://course.raku.org/de/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">Beispielen zu ‚Hallo, Welt!‘<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Aber wir haben sie nur kurz angesehen.<\/span> <span class=\"sg\" data-s=\"6\">Dieser Abschnitt gibt mehr Details.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde functies voor het afdrukken","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">We gebruiken vaak de ingebouwde routine <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die print gegevens naar de console.<\/span> <span class=\"sg\" data-s=\"2\">Om precies te zijn, print hij naar de <code>STDOUT<\/code>-stroom.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft nog een paar functies die printen.<\/span> <span class=\"sg\" data-s=\"4\">De meeste zagen we al in de <a href=\"https://course.raku.org/nl/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">voorbeelden van ‘Hallo, Wereld!’<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Maar we hebben ze maar kort bekeken.<\/span> <span class=\"sg\" data-s=\"6\">Deze sectie geeft meer details.<\/span><\/p>"]]},"es":{"t":"Funciones integradas para imprimir","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">A menudo usamos la rutina incorporada <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Imprime datos en la consola.<\/span> <span class=\"sg\" data-s=\"2\">Para ser más exactos, imprime en el flujo <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku tiene algunas funciones más que imprimen.<\/span> <span class=\"sg\" data-s=\"4\">La mayoría estaban en los <a href=\"https://course.raku.org/es/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ejemplos de '¡Hola, Mundo!'<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Pero solo las vimos muy rápido.<\/span> <span class=\"sg\" data-s=\"6\">Esta sección da más detalles.<\/span><\/p>"]]},"it":{"t":"Funzioni integrate per la stampa","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Usiamo spesso la routine integrata <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Stampa dati sulla console.<\/span> <span class=\"sg\" data-s=\"2\">Più precisamente, stampa sul flusso <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha alcune altre funzioni che stampano.<\/span> <span class=\"sg\" data-s=\"4\">Quasi tutte erano negli <a href=\"https://course.raku.org/it/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">esempi di 'Hello, World!'<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Ma le abbiamo guardate solo velocemente.<\/span> <span class=\"sg\" data-s=\"6\">Questa sezione dà più dettagli.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās drukāšanas funkcijas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Mēs bieži izmantojam iebūvēto rutīnu <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā izdrukā datus konsolē.<\/span> <span class=\"sg\" data-s=\"2\">Precīzāk sakot, tā drukā uz <code>STDOUT<\/code> plūsmu.<\/span> <span class=\"sg\" data-s=\"3\">Raku valodā ir vēl dažas funkcijas, kas drukā.<\/span> <span class=\"sg\" data-s=\"4\">Lielākā daļa no tām bija <a href=\"https://course.raku.org/lv/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">piemēros ar ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Bet mēs tās tikai īsi apskatījām.<\/span> <span class=\"sg\" data-s=\"6\">Šajā sadaļā ir vairāk informācijas.<\/span><\/p>"]]},"ru":{"t":"Встроенные функции для вывода","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Мы часто используем встроенную процедуру <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она выводит данные на консоль.<\/span> <span class=\"sg\" data-s=\"2\">Точнее, она выводит их в поток <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В Raku есть ещё несколько функций для вывода.<\/span> <span class=\"sg\" data-s=\"4\">Большинство из них были в <a href=\"https://course.raku.org/ru/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерах ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Но мы только быстро посмотрели на них.<\/span> <span class=\"sg\" data-s=\"6\">В этом разделе больше подробностей.<\/span><\/p>"]]},"uk":{"t":"Вбудовані функції для друку","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ми часто використовуємо вбудовану процедуру <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона виводить дані на консоль.<\/span> <span class=\"sg\" data-s=\"2\">Точніше, вона виводить їх у потік <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У Raku є ще кілька функцій для друку.<\/span> <span class=\"sg\" data-s=\"4\">Більшість із них були в <a href=\"https://course.raku.org/uk/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">прикладах «Привіт, Світ!»<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Але ми розглянули їх лише коротко.<\/span> <span class=\"sg\" data-s=\"6\">Цей розділ дає більше деталей.<\/span><\/p>"]]},"bg":{"t":"Вградени функции за принтиране","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Често използваме вградената рутина <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва данни на конзолата.<\/span> <span class=\"sg\" data-s=\"2\">По-точно, тя отпечатва на потока <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku има още няколко функции за отпечатване.<\/span> <span class=\"sg\" data-s=\"4\">Повечето от тях бяха в <a href=\"https://course.raku.org/bg/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерите за ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Но ги разгледахме само набързо.<\/span> <span class=\"sg\" data-s=\"6\">Този раздел дава повече подробности.<\/span><\/p>"]]},"eo":{"t":"Enkonstruataj funkcioj por presado","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ni ofte uzas la enkonstruitan rutinon <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas datumojn al la konzolo.<\/span> <span class=\"sg\" data-s=\"2\">Pli precize, ĝi presas al la fluo <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku havas kelkajn pliajn funkciojn por presi.<\/span> <span class=\"sg\" data-s=\"4\">Plej multaj el ili estis en la <a href=\"https://course.raku.org/eo/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ekzemploj de ‘Saluton, Mondo!’<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Sed ni nur rapide rigardis ilin.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu sekcio donas pli da detaloj.<\/span><\/p>"]]},"la":{"t":"In aedificavit functiones ad print","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Rutinam aedificatam <code>say<\/code> saepe adhibemus.<\/span> <span class=\"sg\" data-s=\"1\">Data ad consolam imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Accuratius, ad rivum <code>STDOUT<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Raku paucas alias functiones habet quae imprimunt.<\/span> <span class=\"sg\" data-s=\"4\">Plurimae earum in <a href=\"https://course.raku.org/la/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">exemplis ‘Salve, Mundi!’<\/a> erant.<\/span> <span class=\"sg\" data-s=\"5\">Sed eas solum celeriter spectavimus.<\/span> <span class=\"sg\" data-s=\"6\">Haec sectio plura singula dat.<\/span><\/p>"]]}}}</script>
