<script type="application/json" id="page-data">{"u":"essentials/ranges/excluding-endpoints","n":112,"k":"topic","pv":"essentials/ranges","nx":"essentials/ranges/excluding-endpoints/quiz","tr":["essentials","essentials/ranges"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Excluding the endpoints of a range","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">You can leave out one end of the range, or both ends.<\/span> <span class=\"sg\" data-s=\"1\">For this, add the <code>^<\/code> character to the range operator.<\/span> <span class=\"sg\" data-s=\"2\">In this way, you get three more operators.<\/span> <span class=\"sg\" data-s=\"3\">The comments show the numbers that each range gives.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The cases above are simple.<\/span> <span class=\"sg\" data-s=\"1\">In such cases, you can leave out the spaces around the range operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Some ranges start with 0, for example, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">There is a short way to write such a range: <code>^5<\/code>.<\/span><\/p>"]]},"de":{"t":"Endpunkte ausschließen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie können ein Ende des Bereichs weglassen oder beide Enden.<\/span> <span class=\"sg\" data-s=\"1\">Dafür fügen Sie das Zeichen <code>^<\/code> zum Bereichsoperator hinzu.<\/span> <span class=\"sg\" data-s=\"2\">So bekommen Sie drei weitere Operatoren.<\/span> <span class=\"sg\" data-s=\"3\">Die Kommentare zeigen die Zahlen, die jeder Bereich liefert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Fälle oben sind einfach.<\/span> <span class=\"sg\" data-s=\"1\">In solchen Fällen können Sie die Leerzeichen um den Bereichsoperator weglassen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manche Bereiche beginnen mit 0, zum Beispiel <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Für solche Bereiche gibt es eine kurze Schreibweise: <code>^5<\/code>.<\/span><\/p>"]]},"nl":{"t":"Uitsluiting van eindpunten","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt één uiteinde van het bereik weglaten, of beide uiteinden.<\/span> <span class=\"sg\" data-s=\"1\">Voeg daarvoor het teken <code>^<\/code> toe aan de bereikoperator.<\/span> <span class=\"sg\" data-s=\"2\">Zo krijg je nog drie operators.<\/span> <span class=\"sg\" data-s=\"3\">De opmerkingen laten de getallen zien die elk bereik geeft.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De gevallen hierboven zijn eenvoudig.<\/span> <span class=\"sg\" data-s=\"1\">In zulke gevallen kun je de spaties rond de bereikoperator weglaten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommige bereiken beginnen met 0, bijvoorbeeld <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er is een korte manier om zo'n bereik te schrijven: <code>^5<\/code>.<\/span><\/p>"]]},"es":{"t":"Excluir extremos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes quitar un extremo del rango, o los dos extremos.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, añade el carácter <code>^<\/code> al operador de rango.<\/span> <span class=\"sg\" data-s=\"2\">Así obtienes tres operadores más.<\/span> <span class=\"sg\" data-s=\"3\">Los comentarios muestran los números que da cada rango.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los casos de arriba son simples.<\/span> <span class=\"sg\" data-s=\"1\">En estos casos, puedes quitar los espacios alrededor del operador de rango:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Algunos rangos empiezan con 0, por ejemplo, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hay una forma corta de escribir este rango: <code>^5<\/code>.<\/span><\/p>"]]},"it":{"t":"Escludere gli endpoint","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi lasciare fuori un estremo dell'intervallo, o tutti e due.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, aggiungi il carattere <code>^<\/code> all'operatore di intervallo.<\/span> <span class=\"sg\" data-s=\"2\">Così hai altri tre operatori.<\/span> <span class=\"sg\" data-s=\"3\">I commenti mostrano i numeri che dà ogni intervallo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I casi qui sopra sono semplici.<\/span> <span class=\"sg\" data-s=\"1\">In casi così, puoi togliere gli spazi intorno all'operatore di intervallo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcuni intervalli iniziano da 0, per esempio, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">C'è un modo breve per scrivere un intervallo così: <code>^5<\/code>.<\/span><\/p>"]]},"lv":{"t":"Galapunktu izslēgšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat neiekļaut diapazonā vienu galu vai abus galus.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, pievienojiet diapazona operatoram rakstzīmi <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā jūs iegūstat vēl trīs operatorus.<\/span> <span class=\"sg\" data-s=\"3\">Komentāri parāda skaitļus, ko dod katrs diapazons.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gadījumi augstāk ir vienkārši.<\/span> <span class=\"sg\" data-s=\"1\">Šādos gadījumos jūs varat izlaist atstarpes ap diapazona operatoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daži diapazoni sākas ar 0, piemēram, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ir īss veids, kā uzrakstīt šādu diapazonu: <code>^5<\/code>.<\/span><\/p>"]]},"ru":{"t":"Исключение концов интервала","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы можете не включать в интервал один его конец или оба конца.<\/span> <span class=\"sg\" data-s=\"1\">Для этого добавьте символ <code>^<\/code> к оператору интервала.<\/span> <span class=\"sg\" data-s=\"2\">Так вы получаете ещё три оператора.<\/span> <span class=\"sg\" data-s=\"3\">Комментарии показывают числа, которые даёт каждый интервал.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Случаи выше простые.<\/span> <span class=\"sg\" data-s=\"1\">В таких случаях можно не ставить пробелы вокруг оператора интервала:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Некоторые интервалы начинаются с 0, например, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Есть короткий способ записать такой интервал: <code>^5<\/code>.<\/span><\/p>"]]},"uk":{"t":"Виключаючи кінцеві точки","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можна не включати один кінець діапазону або обидва кінці.<\/span> <span class=\"sg\" data-s=\"1\">Для цього додайте до оператора діапазону символ <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так ви отримуєте ще три оператори.<\/span> <span class=\"sg\" data-s=\"3\">Коментарі показують числа, які дає кожен діапазон.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Випадки вище прості.<\/span> <span class=\"sg\" data-s=\"1\">У таких випадках пробіли навколо оператора діапазону можна не ставити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі діапазони починаються з 0, наприклад, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такий діапазон можна записати коротше: <code>^5<\/code>.<\/span><\/p>"]]},"bg":{"t":"Изключване на крайните точки","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да пропуснете единия край на диапазона или и двата края.<\/span> <span class=\"sg\" data-s=\"1\">За това добавете символа <code>^<\/code> към оператора за диапазон.<\/span> <span class=\"sg\" data-s=\"2\">Така получавате още три оператора.<\/span> <span class=\"sg\" data-s=\"3\">Коментарите показват числата, които дава всеки диапазон.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Случаите по-горе са прости.<\/span> <span class=\"sg\" data-s=\"1\">В такива случаи можете да пропуснете интервалите около оператора за диапазон:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои диапазони започват с 0, например <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Има кратък начин да запишете такъв диапазон: <code>^5<\/code>.<\/span><\/p>"]]},"eo":{"t":"Ekskludante finojn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas preterlasi unu finon de la intervalo, aŭ ambaŭ finojn.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, aldonu la karakteron <code>^<\/code> al la intervala operatoro.<\/span> <span class=\"sg\" data-s=\"2\">Tiel vi ricevas tri pliajn operatorojn.<\/span> <span class=\"sg\" data-s=\"3\">La komentoj montras la nombrojn, kiujn donas ĉiu intervalo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La supraj kazoj estas simplaj.<\/span> <span class=\"sg\" data-s=\"1\">En tiaj kazoj, vi povas preterlasi la spacojn ĉirkaŭ la intervala operatoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iuj intervaloj komenciĝas per 0, ekzemple, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Estas mallonga maniero skribi tian intervalon: <code>^5<\/code>.<\/span><\/p>"]]},"la":{"t":"Exclusis extremitatibus","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Unum finem intervalli omittere potes, vel ambos fines.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc, characterem <code>^<\/code> ad operatorem intervalli adde.<\/span> <span class=\"sg\" data-s=\"2\">Sic tres alios operatores accipis.<\/span> <span class=\"sg\" data-s=\"3\">Commentaria numeros ostendunt quos quodque intervallum dat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Casus supra simplices sunt.<\/span> <span class=\"sg\" data-s=\"1\">In talibus casibus spatia circa operatorem intervalli omittere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaedam intervalla a 0 incipiunt, exempli gratia, <code>0..^5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tale intervallum breviter scribere potes: <code>^5<\/code>.<\/span><\/p>"]]}}}</script>
