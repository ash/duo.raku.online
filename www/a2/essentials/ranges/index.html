ode>.<\/span><\/p>"]]},"eo":{"t":"Intervaloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, intervalo faras liston de eroj.<\/span> <span class=\"sg\" data-s=\"1\">La eroj venas en ordo, unu post alia.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">En la plej simpla kazo, intervalo estas listo de entjeroj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu entjero estas je 1 pli granda ol la antaŭa.<\/span> <span class=\"sg\" data-s=\"2\">Por fari intervalon, uzu la operatoron <code>..<\/code> kun du valoroj.<\/span> <span class=\"sg\" data-s=\"3\">La unua valoro estas la plej malgranda valoro de la intervalo.<\/span> <span class=\"sg\" data-s=\"4\">La dua valoro estas la plej granda valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 .. 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ne bezonas spacojn ĉirkaŭ la operatoro.<\/span> <span class=\"sg\" data-s=\"1\">Do vi ankaŭ povas skribi la saman intervalon tiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1..5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intervalo faras liston.<\/span> <span class=\"sg\" data-s=\"1\">Sed la intervalo mem estas unu objekto.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas teni ĝin en skalara variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = 1 .. 5;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ne nur nombroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas fari intervalojn el aliaj datumtipoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias, se Raku scias, kiel ricevi la sekvan valoron.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $letters = 'a' .. 'z';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, intervaloj havas sian propran datumtipon.<\/span> <span class=\"sg\" data-s=\"1\">La variablo <code>$r<\/code> havas la tipon <code>Range<\/code>.<\/span><\/p>"]]},"la":{"t":"Intervalla","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku intervallum indicem rerum facit.<\/span> <span class=\"sg\" data-s=\"1\">Res in ordine sunt, una post alteram.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In casu simplicissimo intervallum est index numerorum integrorum.<\/span> <span class=\"sg\" data-s=\"1\">Quisque numerus uno maior est quam prior.<\/span> <span class=\"sg\" data-s=\"2\">Ad intervallum faciendum, operatore <code>..<\/code> cum duobus valoribus utere.<\/span> <span class=\"sg\" data-s=\"3\">Primus valor est minimus valor intervalli.<\/span> <span class=\"sg\" data-s=\"4\">Secundus valor est maximus valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 .. 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Spatia circa operatorem necessaria non sunt.<\/span> <span class=\"sg\" data-s=\"1\">Itaque idem intervallum etiam sic scribere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1..5<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intervallum indicem facit.<\/span> <span class=\"sg\" data-s=\"1\">Sed intervallum ipsum est unum obiectum.<\/span> <span class=\"sg\" data-s=\"2\">Itaque id in variabili scalari tenere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = 1 .. 5;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Non solum numeri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam ex aliis generibus datorum intervalla facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc operatur, si Raku valorem proximum invenire scit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $letters = 'a' .. 'z';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku intervalla proprium genus datorum habent.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis <code>$r<\/code> genus <code>Range<\/code> habet.<\/span><\/p>"]]}}}</script>
