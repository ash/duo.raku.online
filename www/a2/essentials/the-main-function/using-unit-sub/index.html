<script type="application/json" id="page-data">{"u":"essentials/the-main-function/using-unit-sub","n":327,"k":"topic","pv":"essentials/the-main-function/multi-main-functions/quiz","nx":"essentials/the-main-function/using-unit-sub/quiz","tr":["essentials","essentials/the-main-function"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using unit sub","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">With <code>unit sub<\/code>, the rest of the file becomes the body of the function!<\/span> <span class=\"sg\" data-s=\"1\">This is very useful with <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Without it, curly braces go around almost the whole file.<\/span> <span class=\"sg\" data-s=\"3\">With <code>unit sub<\/code>, you do not need these braces.<\/span> <span class=\"sg\" data-s=\"4\">Also, the lines need no extra spaces at the start.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is an example program with <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this file, <code>MAIN<\/code> is the only function.<\/span> <span class=\"sg\" data-s=\"1\">Is this true for your program too?<\/span> <span class=\"sg\" data-s=\"2\">Then try to use <code>unit sub MAIN<\/code>, as in the example above.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Mit <code>unit sub<\/code> wird der Rest der Datei zum Körper der Funktion!<\/span> <span class=\"sg\" data-s=\"1\">Das ist mit <code>MAIN<\/code> sehr nützlich.<\/span> <span class=\"sg\" data-s=\"2\">Ohne <code>unit sub<\/code> stehen geschweifte Klammern um fast die ganze Datei.<\/span> <span class=\"sg\" data-s=\"3\">Mit <code>unit sub<\/code> brauchen Sie diese Klammern nicht.<\/span> <span class=\"sg\" data-s=\"4\">Außerdem brauchen die Zeilen am Anfang keine extra Leerzeichen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispielprogramm mit <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Die Summe von $a und $b ist $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In dieser Datei ist <code>MAIN<\/code> die einzige Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Ist das auch in Ihrem Programm so?<\/span> <span class=\"sg\" data-s=\"2\">Dann probieren Sie <code>unit sub MAIN<\/code> aus, wie im Beispiel oben.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Met <code>unit sub<\/code> wordt de rest van het bestand het lichaam van de functie!<\/span> <span class=\"sg\" data-s=\"1\">Dit is heel handig bij <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Zonder dit staan er accolades om bijna het hele bestand.<\/span> <span class=\"sg\" data-s=\"3\">Met <code>unit sub<\/code> heb je die accolades niet nodig.<\/span> <span class=\"sg\" data-s=\"4\">Ook hebben de regels dan geen extra spaties aan het begin nodig.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeldprogramma met <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"De som van $a en $b is $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In dit bestand is <code>MAIN<\/code> de enige functie.<\/span> <span class=\"sg\" data-s=\"1\">Is dat bij jouw programma ook zo?<\/span> <span class=\"sg\" data-s=\"2\">Probeer dan <code>unit sub MAIN<\/code> te gebruiken, zoals in het voorbeeld hierboven.<\/span><\/p>"]]},"es":{"t":"Uso de <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">¡Con <code>unit sub<\/code>, el resto del archivo se convierte en el cuerpo de la función!<\/span> <span class=\"sg\" data-s=\"1\">Esto es muy útil con <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sin <code>unit sub<\/code>, las llaves rodean casi todo el archivo.<\/span> <span class=\"sg\" data-s=\"3\">Con <code>unit sub<\/code>, no necesitas estas llaves.<\/span> <span class=\"sg\" data-s=\"4\">Además, las líneas no necesitan espacios extra al principio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un programa de ejemplo con <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La suma de $a y $b es $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En este archivo, <code>MAIN<\/code> es la única función.<\/span> <span class=\"sg\" data-s=\"1\">¿Pasa lo mismo en tu programa?<\/span> <span class=\"sg\" data-s=\"2\">Entonces prueba a usar <code>unit sub MAIN<\/code>, como en el ejemplo de arriba.<\/span><\/p>"]]},"it":{"t":"Uso di <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Con <code>unit sub<\/code>, il resto del file diventa il corpo della funzione!<\/span> <span class=\"sg\" data-s=\"1\">Questo è molto utile con <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Senza <code>unit sub<\/code>, le parentesi graffe vanno intorno a quasi tutto il file.<\/span> <span class=\"sg\" data-s=\"3\">Con <code>unit sub<\/code>, non servono queste parentesi.<\/span> <span class=\"sg\" data-s=\"4\">Inoltre, le righe non hanno bisogno di spazi in più all'inizio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un programma di esempio con <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La somma di $a e $b è $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In questo file, <code>MAIN<\/code> è l'unica funzione.<\/span> <span class=\"sg\" data-s=\"1\">Vale anche per il tuo programma?<\/span> <span class=\"sg\" data-s=\"2\">Allora prova a usare <code>unit sub MAIN<\/code>, come nell'esempio sopra.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ar <code>unit sub<\/code> pārējais fails kļūst par funkcijas ķermeni!<\/span> <span class=\"sg\" data-s=\"1\">Tas ir ļoti noderīgi ar <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bez tā figūriekavas aptver gandrīz visu failu.<\/span> <span class=\"sg\" data-s=\"3\">Ar <code>unit sub<\/code> jums šīs iekavas nav vajadzīgas.<\/span> <span class=\"sg\" data-s=\"4\">Arī rindām sākumā nav vajadzīgas liekas atstarpes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir programmas piemērs ar <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Summa no $a un $b ir $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā failā <code>MAIN<\/code> ir vienīgā funkcija.<\/span> <span class=\"sg\" data-s=\"1\">Vai tā ir arī jūsu programmā?<\/span> <span class=\"sg\" data-s=\"2\">Tad mēģiniet izmantot <code>unit sub MAIN<\/code>, kā piemērā augstāk.<\/span><\/p>"]]},"ru":{"t":"Использование <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">С <code>unit sub<\/code> остальная часть файла становится телом функции!<\/span> <span class=\"sg\" data-s=\"1\">Это очень удобно с <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без <code>unit sub<\/code> фигурные скобки стоят вокруг почти всего файла.<\/span> <span class=\"sg\" data-s=\"3\">С <code>unit sub<\/code> эти скобки не нужны.<\/span> <span class=\"sg\" data-s=\"4\">Кроме того, строкам не нужны лишние пробелы в начале.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример программы с <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумма $a и $b равна $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом файле <code>MAIN<\/code> — единственная функция.<\/span> <span class=\"sg\" data-s=\"1\">В вашей программе тоже так?<\/span> <span class=\"sg\" data-s=\"2\">Тогда попробуйте использовать <code>unit sub MAIN<\/code>, как в примере выше.<\/span><\/p>"]]},"uk":{"t":"Використання <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">З <code>unit sub<\/code> решта файлу стає тілом функції!<\/span> <span class=\"sg\" data-s=\"1\">Це дуже корисно з <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без нього фігурні дужки стоять навколо майже всього файлу.<\/span> <span class=\"sg\" data-s=\"3\">З <code>unit sub<\/code> ці дужки вам не потрібні.<\/span> <span class=\"sg\" data-s=\"4\">Також рядкам не потрібні зайві пробіли на початку.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад програми з <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сума $a та $b дорівнює $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому файлі <code>MAIN<\/code> — єдина функція.<\/span> <span class=\"sg\" data-s=\"1\">У вашій програмі теж так?<\/span> <span class=\"sg\" data-s=\"2\">Тоді спробуйте використати <code>unit sub MAIN<\/code>, як у прикладі вище.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">С <code>unit sub<\/code> останалата част от файла става тяло на функцията!<\/span> <span class=\"sg\" data-s=\"1\">Това е много полезно с <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без него почти целият файл е в къдрави скоби.<\/span> <span class=\"sg\" data-s=\"3\">С <code>unit sub<\/code> тези скоби не ви трябват.<\/span> <span class=\"sg\" data-s=\"4\">Също така редовете нямат нужда от допълнителни интервали в началото.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето примерна програма с <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумата на $a и $b е $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този файл <code>MAIN<\/code> е единствената функция.<\/span> <span class=\"sg\" data-s=\"1\">Така ли е и във вашата програма?<\/span> <span class=\"sg\" data-s=\"2\">Тогава опитайте да използвате <code>unit sub MAIN<\/code>, както в примера по-горе.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Per <code>unit sub<\/code>, la resto de la dosiero fariĝas la korpo de la funkcio!<\/span> <span class=\"sg\" data-s=\"1\">Tio estas tre utila kun <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sen ĝi, kurbaj krampoj ĉirkaŭas preskaŭ la tutan dosieron.<\/span> <span class=\"sg\" data-s=\"3\">Per <code>unit sub<\/code>, vi ne bezonas ĉi tiujn krampojn.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ, la linioj ne bezonas kromajn spacojn ĉe la komenco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzempla programo kun <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La sumo de $a kaj $b estas $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu dosiero, <code>MAIN<\/code> estas la sola funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu tio veras ankaŭ por via programo?<\/span> <span class=\"sg\" data-s=\"2\">Tiam provu uzi <code>unit sub MAIN<\/code>, kiel en la supra ekzemplo.<\/span><\/p>"]]},"la":{"t":"Utendo <code>unit sub<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum <code>unit sub<\/code>, reliqua pars fasciculi corpus functionis fit!<\/span> <span class=\"sg\" data-s=\"1\">Hoc cum <code>MAIN<\/code> valde utile est.<\/span> <span class=\"sg\" data-s=\"2\">Sine eo, unci curvi fere totum fasciculum circumdant.<\/span> <span class=\"sg\" data-s=\"3\">Cum <code>unit sub<\/code>, hos uncos non requiris.<\/span> <span class=\"sg\" data-s=\"4\">Etiam lineae in initio spatia addita non requirunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce exemplum programmatis cum <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In hoc fasciculo, <code>MAIN<\/code> sola functio est.<\/span> <span class=\"sg\" data-s=\"1\">Estne hoc etiam in programmate tuo verum?<\/span> <span class=\"sg\" data-s=\"2\">Tum <code>unit sub MAIN<\/code> adhibere tenta, sicut in exemplo supra.<\/span><\/p>"]]}}}</script>
