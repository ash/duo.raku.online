rgument verdoppelt dieses Programm das Argument.<\/span> <span class=\"sg\" data-s=\"1\">Mit zwei Argumenten addiert es die beiden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"nl":{"t":"Meerdere <code>MAIN<\/code> functies","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Net als elke andere functie in Raku kan <code>MAIN<\/code> <code>multi<\/code>-varianten hebben.<\/span> <span class=\"sg\" data-s=\"1\">Zo kan het programma op verschillende invoer anders reageren.<\/span> <span class=\"sg\" data-s=\"2\">De invoer kan een ander aantal parameters hebben.<\/span> <span class=\"sg\" data-s=\"3\">Of de parameters kunnen andere types hebben.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met één argument verdubbelt dit programma het.<\/span> <span class=\"sg\" data-s=\"1\">Met twee argumenten telt het ze op:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"es":{"t":"Múltiples funciones <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Como cualquier otra función en Raku, <code>MAIN<\/code> puede tener variantes <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así, el programa puede reaccionar de formas diferentes a entradas diferentes.<\/span> <span class=\"sg\" data-s=\"2\">La entrada puede tener un número diferente de parámetros.<\/span> <span class=\"sg\" data-s=\"3\">O los parámetros pueden tener tipos diferentes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con un argumento, este programa lo duplica.<\/span> <span class=\"sg\" data-s=\"1\">Con dos argumentos, los suma:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"it":{"t":"Più funzioni <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Come ogni altra funzione in Raku, <code>MAIN<\/code> può avere varianti <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Così il programma può reagire in modi diversi a input diversi.<\/span> <span class=\"sg\" data-s=\"2\">L'input può avere un numero diverso di parametri.<\/span> <span class=\"sg\" data-s=\"3\">Oppure i parametri possono avere tipi diversi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con un argomento, questo programma lo raddoppia.<\/span> <span class=\"sg\" data-s=\"1\">Con due argomenti, li somma:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"lv":{"t":"Vairākas <code>MAIN<\/code> funkcijas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā jebkurai citai funkcijai Raku valodā, <code>MAIN<\/code> funkcijai var būt <code>multi<\/code> varianti.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc programma var dažādi reaģēt uz dažādu ievadi.<\/span> <span class=\"sg\" data-s=\"2\">Ievadē var būt atšķirīgs parametru skaits.<\/span> <span class=\"sg\" data-s=\"3\">Vai arī parametriem var būt dažādi tipi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar vienu argumentu šī programma to dubulto.<\/span> <span class=\"sg\" data-s=\"1\">Ar diviem argumentiem tā tos saskaita:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"ru":{"t":"Несколько <\/code> варианти.<\/span> <span class=\"sg\" data-s=\"1\">Така програмата може да реагира различно на различни входни данни.<\/span> <span class=\"sg\" data-s=\"2\">Входните данни могат да имат различен брой параметри.<\/span> <span class=\"sg\" data-s=\"3\">Или параметрите могат да имат различни типове.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При един аргумент тази програма го удвоява.<\/span> <span class=\"sg\" data-s=\"1\">При два аргумента тя ги събира:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"eo":{"t":"Multoblaj <code>MAIN<\/code> funkcioj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiel ĉiu alia funkcio en Raku, <code>MAIN<\/code> povas havi <code>multi<\/code> variantojn.<\/span> <span class=\"sg\" data-s=\"1\">Do la programo povas reagi al malsama enigo en malsamaj manieroj.<\/span> <span class=\"sg\" data-s=\"2\">La enigo povas havi malsaman nombron de parametroj.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ la parametroj povas havi malsamajn tipojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun unu argumento, ĉi tiu programo duobligas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Kun du argumentoj, ĝi adicias ilin:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"la":{"t":"Multiplicem <code>MAIN<\/code> functiones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sicut quaevis alia functio in Raku, <code>MAIN<\/code> variantes <code>multi<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Ita programma ad diversum input diversis modis respondere potest.<\/span> <span class=\"sg\" data-s=\"2\">Input alium numerum parametrorum habere potest.<\/span> <span class=\"sg\" data-s=\"3\">Aut parametri alios typos habere possunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum uno argumento, hoc programma id duplicat.<\/span> <span class=\"sg\" data-s=\"1\">Cum duobus argumentis, ea addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]}}}</script>
