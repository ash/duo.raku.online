-s=\"0\">Вижте тази програма.<\/span> <span class=\"sg\" data-s=\"1\">Тя събира две числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата така.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва сумата на двата си аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Като всяка друга функция, <code>MAIN<\/code> може да има стойности по подразбиране за аргументите си.<\/span> <span class=\"sg\" data-s=\"1\">Някои аргументи могат да ги имат.<\/span> <span class=\"sg\" data-s=\"2\">Дори всички аргументи могат да ги имат.<\/span> <span class=\"sg\" data-s=\"3\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога няма втори аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Тогава програмата използва стойността по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"eo":{"t":"Legante komando-linio argumentojn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>MAIN<\/code> estas utila pro du kialoj.<\/span> <span class=\"sg\" data-s=\"1\">Unue, ĝi klare montras, kie la programo komenciĝas.<\/span> <span class=\"sg\" data-s=\"2\">Due, ĝi havas argumentojn.<\/span> <span class=\"sg\" data-s=\"3\">Ili ricevas siajn valorojn el la komando-linio.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estas du manieroj legi komando-liniajn argumentojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu maniero estas la <a href=\"https://course.raku.org/eo/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> tabelo<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ni jam uzis ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Nun ni rigardu la duan manieron.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rigardu ĉi tiun programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi adicias du nombrojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon tiel.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas la sumon de siaj du argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiel ĉiu alia funkcio, <code>MAIN<\/code> povas havi defaŭltajn valorojn por siaj argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj argumentoj povas havi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Eĉ ĉiuj argumentoj povas havi ilin.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje ne estas dua argumento.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la programo uzas la defaŭltan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"la":{"t":"Legere linea mandati argumenta","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Functio <code>MAIN<\/code> duabus de causis utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Primo, clare ostendit ubi programma incipit.<\/span> <span class=\"sg\" data-s=\"2\">Secundo, argumenta habet.<\/span> <span class=\"sg\" data-s=\"3\">Ea valores suos ex linea mandati accipiunt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Argumenta lineae mandati duobus modis legere possumus.<\/span> <span class=\"sg\" data-s=\"1\">Unus modus est <a href=\"https://course.raku.org/la/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> array<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Id iam adhibuimus.<\/span> <span class=\"sg\" data-s=\"3\">Nunc secundum modum spectamus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Specta hoc programma.<\/span> <span class=\"sg\" data-s=\"1\">Duos numeros addit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma sic curre.<\/span> <span class=\"sg\" data-s=\"1\">Summam duorum argumentorum suorum imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sicut quaevis alia functio, <code>MAIN<\/code> valores praedefinitos pro argumentis suis habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Quaedam argumenta eos habere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Etiam omnia argumenta eos habere possunt.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum nullum secundum argumentum est.<\/span> <span class=\"sg\" data-s=\"1\">Tum programma valorem praedefinitum adhibet:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]}}}</script>
