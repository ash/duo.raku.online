<script type="application/json" id="page-data">{"u":"essentials/the-main-function","n":321,"k":"section","pv":"essentials/built-in-functions-for-printing/exercises/print-the-warning/solution","nx":"essentials/the-main-function/reading-command-line-arguments","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The MAIN function","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A Raku program does not need any special code at the start.<\/span> <span class=\"sg\" data-s=\"1\">So you can start with useful code at once.<\/span> <span class=\"sg\" data-s=\"2\">This code is not inside any <a href=\"/essentials/code-blocks/\">code block<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">For example, it is not inside a <a href=\"/essentials/functions/\">function<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">We call this part of the program the <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A program can have a function with the special name <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In this case, Raku first compiles everything.<\/span> <span class=\"sg\" data-s=\"2\">Next, it runs the mainline code.<\/span> <span class=\"sg\" data-s=\"3\">After that, it runs the <code>MAIN<\/code> function.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">First, this program runs the <code>say<\/code>s at the top level.<\/span> <span class=\"sg\" data-s=\"1\">Then it calls <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Of course, a program can also have only the <code>MAIN<\/code> function.<\/span> <span class=\"sg\" data-s=\"1\">Then it has no other mainline code.<\/span><\/p>"]]},"de":{"t":"Die <code>MAIN<\/code>-Funktion","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Raku-Programm braucht keinen besonderen Code am Anfang.<\/span> <span class=\"sg\" data-s=\"1\">Sie können also sofort mit nützlichem Code beginnen.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Code steht in keinem <a href=\"https://course.raku.org/de/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">Codeblock<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Er steht zum Beispiel nicht in einer <a href=\"https://course.raku.org/de/essentials/functions/\" target=\"_blank\" rel=\"noopener\">Funktion<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Wir nennen diesen Teil des Programms <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Programm kann eine Funktion mit dem speziellen Namen <code>MAIN<\/code> haben.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall kompiliert Raku zuerst alles.<\/span> <span class=\"sg\" data-s=\"2\">Dann führt Raku den mainline-Code aus.<\/span> <span class=\"sg\" data-s=\"3\">Danach führt Raku die Funktion <code>MAIN<\/code> aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline-Code';\n\nsub MAIN {\n    say '3. MAIN aufgerufen';\n}\n\nsay '2. Auch mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zuerst führt dieses Programm die <code>say<\/code>s auf der obersten Ebene aus.<\/span> <span class=\"sg\" data-s=\"1\">Dann ruft es <code>MAIN<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline-Code\n2. Auch mainline\n3. MAIN aufgerufen<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Natürlich kann ein Programm auch nur die Funktion <code>MAIN<\/code> haben.<\/span> <span class=\"sg\" data-s=\"1\">Dann hat es keinen anderen mainline-Code.<\/span><\/p>"]]},"nl":{"t":"De <code>MAIN<\/code> functie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een Raku-programma heeft aan het begin geen speciale code nodig.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dus meteen met nuttige code beginnen.<\/span> <span class=\"sg\" data-s=\"2\">Deze code staat niet in een <a href=\"https://course.raku.org/nl/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">codeblok<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Hij staat bijvoorbeeld niet in een <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functie<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">We noemen dit deel van het programma de <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een programma kan een functie met de speciale naam <code>MAIN<\/code> hebben.<\/span> <span class=\"sg\" data-s=\"1\">In dat geval compileert Raku eerst alles.<\/span> <span class=\"sg\" data-s=\"2\">Daarna voert het de mainline-code uit.<\/span> <span class=\"sg\" data-s=\"3\">Als laatste voert het de <code>MAIN<\/code>-functie uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eerst voert dit programma de <code>say<\/code>s op het hoogste niveau uit.<\/span> <span class=\"sg\" data-s=\"1\">Dan roept het <code>MAIN<\/code> aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk kan een programma ook alleen de <code>MAIN<\/code>-functie hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dan heeft het geen andere mainline-code.<\/span><\/p>"]]},"es":{"t":"La función <code>MAIN<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un programa en Raku no necesita ningún código especial al principio.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes empezar con código útil enseguida.<\/span> <span class=\"sg\" data-s=\"2\">Este código no está dentro de ningún <a href=\"https://course.raku.org/es/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">bloque de código<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, no está dentro de una <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">función<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Llamamos <em>mainline<\/em> a esta parte del programa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un programa puede tener una función con el nombre especial <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, Raku primero compila todo.<\/span> <span class=\"sg\" data-s=\"2\">Luego, ejecuta el código mainline.<\/span> <span class=\"sg\" data-s=\"3\">Después de eso, ejecuta la función <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Código mainline';\n\nsub MAIN {\n    say '3. MAIN llamado';\n}\n\nsay '2. También mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Primero, este programa ejecuta los <code>say<\/code> del nivel superior.<\/span> <span class=\"sg\" data-s=\"1\">Luego llama a <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Código mainline\n2. También mainline\n3. MAIN llamado<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, un programa también puede tener solo la función <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces no tiene otro código mainline.<\/span><\/p>"]]},"it":{"t":"La funzione <code>MAIN<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un programma Raku non ha bisogno di codice speciale all'inizio.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi iniziare subito con codice utile.<\/span> <span class=\"sg\" data-s=\"2\">Questo codice non è dentro nessun <a href=\"https://course.raku.org/it/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">blocco di codice<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, non è dentro una <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funzione<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Chiamiamo questa parte del programma <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un programma può avere una funzione con il nome speciale <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, Raku prima compila tutto.<\/span> <span class=\"sg\" data-s=\"2\">Poi esegue il codice mainline.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, esegue la funzione <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Codice mainline';\n\nsub MAIN {\n    say '3. MAIN chiamato';\n}\n\nsay '2. Anche mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prima, questo programma esegue i <code>say<\/code> di livello superiore.<\/span> <span class=\"sg\" data-s=\"1\">Poi chiama <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codice mainline\n2. Anche mainline\n3. MAIN chiamato<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Certo, un programma può anche avere solo la funzione <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora non ha altro codice mainline.<\/span><\/p>"]]},"lv":{"t":"<code>MAIN<\/code> funkcija","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku programmai sākumā nevajag nekāda īpaša koda.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat uzreiz sākt ar noderīgu kodu.<\/span> <span class=\"sg\" data-s=\"2\">Šis kods nav iekšā nevienā <a href=\"https://course.raku.org/lv/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">koda blokā<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, tas nav iekšā <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcijā<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Šo programmas daļu mēs saucam par <em>galveno līniju<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programmā var būt funkcija ar īpašu nosaukumu <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tādā gadījumā Raku vispirms visu kompilē.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku izpilda galvenās līnijas kodu.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam Raku izpilda <code>MAIN<\/code> funkciju.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Galvenās līnijas kods';\n\nsub MAIN {\n    say '3. MAIN izsaukts';\n}\n\nsay '2. Arī galvenā līnija';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vispirms šī programma izpilda augstākā līmeņa <code>say<\/code> komandas.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā izsauc <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Galvenās līnijas kods\n2. Arī galvenā līnija\n3. MAIN izsaukts<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Protams, programmā var būt arī tikai <code>MAIN<\/code> funkcija.<\/span> <span class=\"sg\" data-s=\"1\">Tad tajā nav cita galvenās līnijas koda.<\/span><\/p>"]]},"ru":{"t":"Функция <code>MAIN<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Программе на Raku не нужен никакой особый код в начале.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете сразу начать с полезного кода.<\/span> <span class=\"sg\" data-s=\"2\">Этот код не находится ни в каком <a href=\"https://course.raku.org/ru/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блоке кода<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Например, он не находится внутри <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функции<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Эту часть программы мы называем <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В программе может быть функция со специальным именем <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае Raku сначала всё компилирует.<\/span> <span class=\"sg\" data-s=\"2\">Потом он выполняет код mainline.<\/span> <span class=\"sg\" data-s=\"3\">После этого он выполняет функцию <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сначала эта программа выполняет <code>say<\/code> на верхнем уровне.<\/span> <span class=\"sg\" data-s=\"1\">Затем она вызывает <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Конечно, в программе может быть и только функция <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда в ней нет другого кода mainline.<\/span><\/p>"]]},"uk":{"t":"Функція <code>MAIN<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Програмі на Raku не потрібен спеціальний код на початку.<\/span> <span class=\"sg\" data-s=\"1\">Тому ви можете одразу почати з корисного коду.<\/span> <span class=\"sg\" data-s=\"2\">Цей код не знаходиться в жодному <a href=\"https://course.raku.org/uk/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блоці коду<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, він не знаходиться у <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функції<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Цю частину програми ми називаємо <em>mainline<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програма може мати функцію зі спеціальною назвою <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У такому разі Raku спочатку компілює весь код.<\/span> <span class=\"sg\" data-s=\"2\">Далі він виконує код mainline.<\/span> <span class=\"sg\" data-s=\"3\">Після цього він виконує функцію <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спочатку ця програма виконує <code>say<\/code> на верхньому рівні.<\/span> <span class=\"sg\" data-s=\"1\">Потім вона викликає <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Звичайно, програма може мати й лише функцію <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді в ній немає іншого коду mainline.<\/span><\/p>"]]},"bg":{"t":"Функцията <code>MAIN<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Програмата на Raku няма нужда от специален код в началото.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете веднага да започнете с полезен код.<\/span> <span class=\"sg\" data-s=\"2\">Този код не е в нито един <a href=\"https://course.raku.org/bg/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">код блок<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Например, той не е във <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функция<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Тази част от програмата наричаме <em>основна линия<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмата може да има функция със специалното име <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В този случай Raku първо компилира всичко.<\/span> <span class=\"sg\" data-s=\"2\">След това изпълнява основния код.<\/span> <span class=\"sg\" data-s=\"3\">После изпълнява функцията <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Основен код';\n\nsub MAIN {\n    say '3. MAIN извикана';\n}\n\nsay '2. Също основен код';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Първо тази програма изпълнява <code>say<\/code> на най-високо ниво.<\/span> <span class=\"sg\" data-s=\"1\">След това извиква <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Основен код\n2. Също основен код\n3. MAIN извикана<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разбира се, програмата може да има и само функцията <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя няма друг основен код.<\/span><\/p>"]]},"eo":{"t":"La <code>MAIN<\/code> funkcio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku-programo ne bezonas specialan kodon ĉe la komenco.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas tuj komenci per utila kodo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu kodo ne estas en <a href=\"https://course.raku.org/eo/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">koda bloko<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, ĝi ne estas en <a href=\"https://course.raku.org/eo/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcio<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ni nomas ĉi tiun parton de la programo <em>ĉeflinio<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programo povas havi funkcion kun la speciala nomo <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, Raku unue kompilas ĉion.<\/span> <span class=\"sg\" data-s=\"2\">Poste, ĝi rulas la ĉeflinian kodon.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, ĝi rulas la funkcion <code>MAIN<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Ĉeflinia kodo';\n\nsub MAIN {\n    say '3. MAIN vokita';\n}\n\nsay '2. Ankaŭ ĉeflinio';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unue, ĉi tiu programo rulas la <code>say<\/code>-ojn sur la supra nivelo.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi vokas <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Ĉeflinia kodo\n2. Ankaŭ ĉeflinio\n3. MAIN vokita<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, programo ankaŭ povas havi nur la funkcion <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi havas neniun alian ĉeflinian kodon.<\/span><\/p>"]]},"la":{"t":"<code>MAIN<\/code> functio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Programma Raku nullum codicem specialem in initio requirit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque statim cum codice utili incipere potes.<\/span> <span class=\"sg\" data-s=\"2\">Hic codex in nullo <a href=\"https://course.raku.org/la/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">claustro codicis<\/a> est.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, non est in <a href=\"https://course.raku.org/la/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functione<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Hanc partem programmatis <em>mainline<\/em> vocamus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma functionem cum nomine speciali <code>MAIN<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc in casu Raku primum omnia compilat.<\/span> <span class=\"sg\" data-s=\"2\">Deinde codicem mainline currit.<\/span> <span class=\"sg\" data-s=\"3\">Postea functionem <code>MAIN<\/code> currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Codex mainline';\n\nsub MAIN {\n    say '3. MAIN vocata';\n}\n\nsay '2. Etiam mainline';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Primum hoc programma instructiones <code>say<\/code> in summo gradu currit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>MAIN<\/code> vocat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codex mainline\n2. Etiam mainline\n3. MAIN vocata<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Certe programma etiam solum functionem <code>MAIN<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum nullum alium codicem mainline habet.<\/span><\/p>"]]}}}</script>
