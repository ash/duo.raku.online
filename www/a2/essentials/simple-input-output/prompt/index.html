an> <span class=\"sg\" data-s=\"6\">Ni skribu tian programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Rulu ĉi tiun programon.<\/span> <span class=\"sg\" data-s=\"1\">Eble vi ne komprenas, kio okazas.<\/span> <span class=\"sg\" data-s=\"2\">La programo nur atendas iun enigon.<\/span> <span class=\"sg\" data-s=\"3\">Do estas bone unue presi mesaĝon.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la programo estas pli facila por uzi.<\/span> <span class=\"sg\" data-s=\"5\">Vi ne bezonas apartan <code>say<\/code> por tio.<\/span> <span class=\"sg\" data-s=\"6\">Vi povas doni la mesaĝon al <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Kiun lingvon vi intencas lerni? '<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio baldaŭ finiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Sed unue, ni kunmetu ĉiujn partojn.<\/span> <span class=\"sg\" data-s=\"2\">La nova programo demandas, kion la uzanto volas.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi presas frazon kun la teksto de la uzanto.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Vi intencas lerni ', prompt 'Kiun lingvon vi intencas lerni? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi enigas <code>Raku<\/code>, la programo presas ĉi tiun frazon:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi intencas lerni Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bone, nun ni povas paroli al la programo.<\/span> <span class=\"sg\" data-s=\"1\">Kaj ni povas igi la programon paroli al ni!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>say<\/code> devas koni la ĉenojn antaŭ ol presi ilin.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku unue rulas <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiel la dialogo iras en la ĝusta ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nKiun lingvon vi intencas lerni? Raku\nVi intencas lerni Raku<\/code><\/pre>"]]},"la":{"t":"Initus cum <code>prompt<\/code>","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> est contrarium verbi <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Usorem exspectat.<\/span> <span class=\"sg\" data-s=\"2\">Usor aliquid scribit et Enter premit.<\/span> <span class=\"sg\" data-s=\"3\">Deinde <code>prompt<\/code> input ad programma ut stringam mittit.<\/span> <span class=\"sg\" data-s=\"4\">Eventum <code>prompt<\/code> capere et verbo <code>say<\/code> dare potes.<\/span> <span class=\"sg\" data-s=\"5\">Tum programma repetit quod usor scribit.<\/span> <span class=\"sg\" data-s=\"6\">Tale programma scribamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Curre hoc programma.<\/span> <span class=\"sg\" data-s=\"1\">Fortasse rem non intellegis.<\/span> <span class=\"sg\" data-s=\"2\">Programma solum aliquod input exspectat.<\/span> <span class=\"sg\" data-s=\"3\">Itaque bonum est primum nuntium imprimere.<\/span> <span class=\"sg\" data-s=\"4\">Tum usus programmatis facilior est.<\/span> <span class=\"sg\" data-s=\"5\">Ad hoc separatam <code>say<\/code> non requiris.<\/span> <span class=\"sg\" data-s=\"6\">Nuntium verbo <code>prompt<\/code> dare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Quam linguam discere vis? '<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec sectio mox desinit.<\/span> <span class=\"sg\" data-s=\"1\">Sed primum omnes partes componamus.<\/span> <span class=\"sg\" data-s=\"2\">Novum programma usorem de votis eius rogat.<\/span> <span class=\"sg\" data-s=\"3\">Deinde locutionem cum textu usoris imprimit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Discere vis ', prompt 'Quam linguam discere vis? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si
