-s=\"0\">Deze regel kan een deel van een groter programma zijn.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan ook het hele programma zijn.<\/span> <span class=\"sg\" data-s=\"2\">Natuurlijk drukt hij <code>42<\/code> af naar de uitvoer.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we nu een string proberen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Goed!<\/span> <span class=\"sg\" data-s=\"1\">Nu staat <code>Hello, World!<\/code> op het scherm.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>say<\/code> kan meer dan één argument krijgen.<\/span> <span class=\"sg\" data-s=\"1\">We kunnen dus meerdere waarden tegelijk afdrukken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Maar kijk naar de uitvoer.<\/span> <span class=\"sg\" data-s=\"1\">De delen worden samengevoegd tot één string: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het is dus beter om er een spatie tussen te zetten.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dit probleem al oplossen.<\/span> <span class=\"sg\" data-s=\"4\">Bijvoorbeeld zo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>say<\/code> drukt alle argumenten af.<\/span> <span class=\"sg\" data-s=\"1\">Daarna voegt hij een nieuwe-regelteken toe aan de uitvoer.<\/span><\/p>"]]},"es":{"t":"Salida con <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La función <code>say<\/code> imprime valores en el flujo de salida estándar, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La gente también la llama subrutina, o simplemente rutina.<\/span> <span class=\"sg\" data-s=\"2\">¿Ejecutas el programa en una terminal?<\/span> <span class=\"sg\" data-s=\"3\">Entonces ves la salida allí.<\/span> <span class=\"sg\" data-s=\"4\">¿Usas un servicio en línea?<\/span> <span class=\"sg\" data-s=\"5\">Entonces la salida va a una parte especial de la página web.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay un ejemplo de uso de <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta línea puede ser parte de un programa más grande.<\/span> <span class=\"sg\" data-s=\"1\">También puede ser el programa completo.<\/span> <span class=\"sg\" data-s=\"2\">Por supuesto, imprime <code>42<\/code> en la salida.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora probemos con una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¡Bien!<\/span> <span class=\"sg\" data-s=\"1\">Ahora <code>Hello, World!<\/code> está en la pantalla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>say<\/code> puede tomar más de un argumento.<\/span> <span class=\"sg\" data-s=\"1\">Así que podemos imprimir varios valores a la vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pero mira la salida.<\/span> <span class=\"sg\" data-s=\"1\">Sus partes forman una sola cadena: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que es mejor agregar un espacio entre ellas.<\/span> <span class=\"sg\" data-s=\"3\">Ya puedes resolver este problema.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>say<\/code> imprime todos los argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Después agrega un carácter de nueva línea a la salida.<\/sp ma.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>say<\/code> stampa tutti gli argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Poi aggiunge un carattere di nuova riga all'output.<\/span><\/p>"]]},"lv":{"t":"Izvade ar <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> izdrukā vērtības uz standarta izvades straumi, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To sauc arī par apakšprogrammu jeb vienkārši par rutīnu.<\/span> <span class=\"sg\" data-s=\"2\">Vai jūs palaižat programmu terminālī?<\/span> <span class=\"sg\" data-s=\"3\">Tad jūs redzat izvadi tur.<\/span> <span class=\"sg\" data-s=\"4\">Vai jūs lietojat tiešsaistes pakalpojumu?<\/span> <span class=\"sg\" data-s=\"5\">Tad izvade nonāk īpašā tīmekļa lapas daļā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir piemērs, kā izmantot <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī rinda var būt daļa no lielākas programmas.<\/span> <span class=\"sg\" data-s=\"1\">Tā var būt arī visa programma.<\/span> <span class=\"sg\" data-s=\"2\">Protams, tā izdrukā <code>42<\/code> izvadē.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad pamēģināsim virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Labi!<\/span> <span class=\"sg\" data-s=\"1\">Tagad <code>Hello, World!<\/code> ir uz ekrāna.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> var ņemt vairāk nekā vienu argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc mēs varam izdrukāt vairākas vērtības uzreiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bet paskatieties uz izvadi.<\/span> <span class=\"sg\" data-s=\"1\">Tās daļas ir savienotas vienā virknē: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc labāk starp tām pievienot atstarpi.<\/span> <span class=\"sg\" data-s=\"3\">Jūs jau varat atrisināt šo problēmu.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> izdrukā visus argumentus.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā pievieno izvadei jaunas rindas rakstzīmi.<\/span><\/p>"]]},"ru":{"t":"Вывод с использованием <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функция <code>say<\/code> печатает значения в стандартный поток вывода, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Её также называют подпрограммой, или просто программой.<\/span> <span class=\"sg\" data-s=\"2\">Вы запускаете программу в терминале?<\/span> <span class=\"sg\" data-s=\"3\">Тогда вы видите вывод там.<\/span> <span class=\"sg\" data-s=\"4\">Вы используете онлайн-сервис?<\/span> <span class=\"sg\" data-s=\"5\">Тогда вывод попадает в особую часть веб-страницы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример использования <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Эта строка может быть частью большой программы.<\/span> <span class=\"sg\" data-s=\"1\">Она также может быть целой программой.<\/span> <span class=\"sg\" data-s=\"2\">Конечно, она выводит <code>42<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь давайте попробуем строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хорошо!<\/span> <span class=\"sg\" data-s=\"1\">Теперь <code>Hello, World!<\/code> на экране.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>say<\/code> может принимать больше одного аргумента.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому мы можем напечатать несколько значений сразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Но посмотрите на вывод.<\/span> <span class=\"sg\" data-s=\"1\">Все его части идут одной строкой: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому лучше добавить между ними пробел.<\/span> <span class=\"sg\" data-s=\"3\">Вы уже можете решить эту проблему.<\/span> <span class=\"sg\" data-s=\"4\">Например, вот так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>say<\/code> печатает все аргументы.<\/span> <span class=\"sg\" data-s=\"1\">Потом она добавляет в вывод символ новой строки.<\/span><\/p>"]]},"uk":{"t":"Вивід з <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функція <code>say<\/code> виводить значення в стандартний потік виводу, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Її також називають підпрограмою або просто рутиною.<\/span> <span class=\"sg\" data-s=\"2\">Ви запускаєте програму в терміналі?<\/span> <span class=\"sg\" data-s=\"3\">Тоді ви бачите вивід там.<\/span> <span class=\"sg\" data-s=\"4\">Ви користуєтеся онлайн-сервісом?<\/span> <span class=\"sg\" data-s=\"5\">Тоді вивід іде в особливу частину веб-сторінки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад використання <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей рядок може бути частиною більшої програми.<\/span> <span class=\"sg\" data-s=\"1\">Він також може бути всією програмою.<\/span> <span class=\"sg\" data-s=\"2\">Звісно, він виводить <code>42<\/code> на екран.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер давайте спробуємо рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добре!<\/span> <span class=\"sg\" data-s=\"1\">Тепер <code>Hello, World!<\/code> на екрані.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутина <code>say<\/code> може брати більше одного аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Тож ми можемо виводити кілька значень одразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Але подивіться на вивід.<\/span> <span class=\"sg\" data-s=\"1\">Його частини з'єднані в один рядок: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тому краще додати між ними пробіл.<\/span> <span class=\"sg\" data-s=\"3\">Ви вже можете розв'язати цю проблему.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, ось так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутина <code>say<\/code> виводить усі аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Потім вона додає до виводу символ нового рядка.<\/span><\/p>"]]},"bg":{"t":"Извеждане с <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>say<\/code> отпечатва стойности на стандартния изходен поток, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Хората я наричат и подпрограма, или просто рутина.<\/span> <span class=\"sg\" data-s=\"2\">Изпълнявате ли програмата в терминал?<\/span> <span class=\"sg\" data-s=\"3\">Тогава виждате изхода там.<\/span> <span class=\"sg\" data-s=\"4\">Използвате ли онлайн услуга?<\/span> <span class=\"sg\" data-s=\"5\">Тогава изходът отива в специална част от уеб страницата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за използване на <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този ред може да бъде част от по-голяма програма.<\/span> <span class=\"sg\" data-s=\"1\">Той може да бъде и цялата програма.<\/span> <span class=\"sg\" data-s=\"2\">Разбира се, той отпечатва <code>42<\/code> на изхода.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега нека опитаме със стринг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добре!<\/span> <span class=\"sg\" data-s=\"1\">Сега <code>Hello, World!<\/code> е на екрана.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутината <code>say<\/code> може да приеме повече от един аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Така можем да отпечатаме няколко стойности наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Но вижте изхода.<\/span> <span class=\"sg\" data-s=\"1\">Частите му са свързани в един стринг: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова е по-добре да добавите интервал между тях.<\/span> <span class=\"sg\" data-s=\"3\">Вече можете да решите този проблем.<\/span> <span class=\"sg\" data-s=\"4\">Например, ето така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутината <code>say<\/code> отпечатва всички аргументи.<\/span> <span class=\"sg\" data-s=\"1\">След това добавя символ за нов ред към изхода.<\/span><\/p>"]]},"eo":{"t":"Eligo per <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>say<\/code> presas valorojn al la norma eliga fluo, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Oni ankaŭ nomas ĝin subrutino, aŭ simple rutino.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu vi rulas la programon en terminalo?<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi vidas la eligon tie.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu vi uzas retan servon?<\/span> <span class=\"sg\" data-s=\"5\">Tiam la eligo iras al speciala parto de la retpaĝo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de uzado de <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu linio povas esti parto de pli granda programo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ povas esti la tuta programo.<\/span> <span class=\"sg\" data-s=\"2\">Kompreneble, ĝi presas <code>42<\/code> al la eligo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun ni provu ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bone!<\/span> <span class=\"sg\" data-s=\"1\">Nun <code>Hello, World!<\/code> estas sur la ekrano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>say<\/code> povas preni pli ol unu argumenton.<\/span> <span class=\"sg\" data-s=\"1\">Do ni povas presi plurajn valorojn samtempe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sed rigardu la eligon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝiaj partoj estas kunigitaj en unu ŝnuron: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do estas pli bone aldoni spacon inter ili.<\/span> <span class=\"sg\" data-s=\"3\">Vi jam povas solvi ĉi tiun problemon.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, tiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>say<\/code> presas ĉiujn argumentojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi aldonas novlinian signon al la eligo.<\/span><\/p>"]]},"la":{"t":"Output cum <code>say<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Functio <code>say<\/code> valores ad fluxum output standardum, <code>STDOUT<\/code>, imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Homines eam etiam subrutinam vocant, vel simpliciter rutinam.<\/span> <span class=\"sg\" data-s=\"2\">Currisne programma in terminali?<\/span> <span class=\"sg\" data-s=\"3\">Tum output ibi vides.<\/span> <span class=\"sg\" data-s=\"4\">Uterisne officio online?<\/span> <span class=\"sg\" data-s=\"5\">Tum output ad partem specialem paginae interretialis it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum utendi <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec linea pars maioris programmatis esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam totum programma esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Certe <code>42<\/code> ad output imprimit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc stringam experiamur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Salve, Munde!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bene!<\/span> <span class=\"sg\" data-s=\"1\">Nunc <code>Salve, Munde!<\/code> in scrinio est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutina <code>say<\/code> plus quam unum argumentum accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Itaque plures valores simul imprimere possumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Salve, Munde!';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sed output specta.<\/span> <span class=\"sg\" data-s=\"1\">Partes eius in unam stringam iunguntur: <code>42Salve, Munde!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque melius est spatium inter eas addere.<\/span> <span class=\"sg\" data-s=\"3\">Hanc quaestionem iam solvere potes.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, sic:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Salve, Munde!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutina <code>say<\/code> omnia argumenta imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde characterem novae lineae ad output addit.<\/span><\/p>"]]}}}</script>
