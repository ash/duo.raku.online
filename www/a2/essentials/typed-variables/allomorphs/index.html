,0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il programma crea tre variabili scalari.<\/span> <span class=\"sg\" data-s=\"1\">Due di loro, <code>$i<\/code> e <code>$s<\/code>, sono variabili tipizzate.<\/span> <span class=\"sg\" data-s=\"2\">Così <code>$i<\/code> può contenere solo interi.<\/span> <span class=\"sg\" data-s=\"3\">E <code>$s<\/code> può contenere solo stringhe.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> restituisce un valore.<\/span> <span class=\"sg\" data-s=\"1\">Il suo tipo dipende dai caratteri che scriviamo.<\/span> <span class=\"sg\" data-s=\"2\">A volte la stringa in input può essere un numero intero.<\/span> <span class=\"sg\" data-s=\"3\">Allora il risultato ha il tipo <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Questo tipo è <em>sia<\/em> <code>Int<\/code> che <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Così puoi assegnarlo a una variabile <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Puoi anche assegnarlo a una variabile <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Per esempio, inserisci <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Allora il programma non si rompe.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il tipo <code>IntStr<\/code> è un esempio di <em>allomorfo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un allomorfo è un tipo di dato fatto di due altri tipi.<\/span> <span class=\"sg\" data-s=\"2\">Ecco alcuni altri esempi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora inserisci una stringa che non può essere un intero.<\/span> <span class=\"sg\" data-s=\"1\">Il programma si rompe.<\/span> <span class=\"sg\" data-s=\"2\">Succede quando assegniamo <code>$input<\/code> a <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte la stringa in input è un numero, ma non un intero.<\/span> <span class=\"sg\" data-s=\"1\">Nota che anche allora ottieni un errore.<\/span> <span class=\"sg\" data-s=\"2\">Un contenitore intero non può contenere un numero in virgola mobile.<\/span> <span class=\"sg\" data-s=\"3\">Non può contenere neanche un numero razionale.<\/span> <span class=\"sg\" data-s=\"4\">Così ottieni un'eccezione:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il secondo assegnamento, <code>$s = $input<\/code>, non si rompe mai.<\/span> <span class=\"sg\" data-s=\"1\">Una stringa può accettare qualsiasi input.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente di questo programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"lv":{"t":"Allomorfi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šo programmu.<\/span> <span class=\"sg\" data-s=\"1\">Vēl to nepalaidiet.<\/span> <span class=\"sg\" data-s=\"2\">Vai jūs varat pateikt, kuras ievades vērtības to salauž?<\/span> <span class=\"sg\" data-s=\"3\">Un kurā rindā?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma izveido trīs skalāros mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Divi no tiem, <code>$i<\/code> un <code>$s<\/code>, ir tipizēti mainīgie.<\/span> <span class=\"sg\" data-s=\"2\">Tātad <code>$i<\/code> var glabāt tikai veselus skaitļus.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>$s<\/code> var glabāt tikai virknes.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> atgriež vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tās tips ir atkarīgs no rakstzīmēm, ko mēs ievadām.<\/span> <span class=\"sg\" data-s=\"2\">Dažreiz ievades virkne var būt vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"3\">Tad rezultātam ir tips <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Šis tips ir <em>gan<\/em> <code>Int<\/code>, gan <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tātad jūs varat to piešķirt <code>Int<\/code> mainīgajam.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat to piešķirt arī <code>Str<\/code> mainīgajam.<\/span> <span class=\"sg\" data-s=\"7\">Piemēram, jūs ievadāt <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Tad programma nesalūst.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IntStr<\/code> tips ir <em>allomorfa<\/em> piemērs.<\/span> <span class=\"sg\" data-s=\"1\">Allomorfs ir datu tips, kas sastāv no diviem citiem tipiem.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir vēl daži piemēri.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad ievadiet virkni, kas nevar būt vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Programma salūst.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek, kad mēs piešķiram <code>$input<\/code> mainīgajam <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz ievades virkne ir skaitlis, bet ne vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka arī tad jūs saņemat kļūdu.<\/span> <span class=\"sg\" data-s=\"2\">Vesela skaitļa konteiners nevar glabāt peldošā punkta skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Tas nevar glabāt arī racionālu skaitli.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc jūs saņemat izņēmumu:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otrā piešķiršana, <code>$s = $input<\/code>, nekad nesalūst.<\/span> <span class=\"sg\" data-s=\"1\">Virkne var pieņemt jebkuru ievadi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast šīs programmas avota kodu failā <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"ru":{"t":"Алломорфы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на эту программу.<\/span> <span class=\"sg\" data-s=\"1\">Пока не запускайте её.<\/span> <span class=\"sg\" data-s=\"2\">Можете ли вы сказать, какие входные значения её ломают?<\/span> <span class=\"sg\" data-s=\"3\">И на какой строке?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Программа создаёт три скалярные переменные.<\/span> <span class=\"sg\" data-s=\"1\">Две из них, <code>$i<\/code> и <code>$s<\/code>, — типизированные переменные.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$i<\/code> может хранить только целые числа.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$s<\/code> может хранить только строки.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> возвращает значение.<\/span> <span class=\"sg\" data-s=\"1\">Его тип зависит от символов, которые мы вводим.<\/span> <span class=\"sg\" data-s=\"2\">Иногда входная строка может быть целым числом.<\/span> <span class=\"sg\" data-s=\"3\">Тогда у результата тип <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Этот тип — <em>одновременно<\/em> <code>Int<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому его можно присвоить переменной типа <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Его можно присвоить и переменной типа <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Например, вы вводите <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Тогда программа не ломается.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> — это пример <em>алломорфа<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Алломорф — это тип данных из двух других типов.<\/span> <span class=\"sg\" data-s=\"2\">Вот ещё несколько примеров.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь введите строку, которая не может быть целым числом.<\/span> <span class=\"sg\" data-s=\"1\">Программа ломается.<\/span> <span class=\"sg\" data-s=\"2\">Это происходит, когда мы присваиваем <code>$input<\/code> переменной <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда входная строка — это число, но не целое.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание: тогда вы тоже получаете ошибку.<\/span> <span class=\"sg\" data-s=\"2\">Контейнер для целых чисел не может хранить число с плавающей запятой.<\/span> <span class=\"sg\" data-s=\"3\">Рациональное число он тоже не может хранить.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому вы получаете исключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второе присваивание, <code>$s = $input<\/code>, никогда не ломается.<\/span> <span class=\"sg\" data-s=\"1\">Строка может принять любой ввод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код этой программы можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"uk":{"t":"Аломорфи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Подивіться на цю програму.<\/span> <span class=\"sg\" data-s=\"1\">Поки не запускайте її.<\/span> <span class=\"sg\" data-s=\"2\">Чи можете ви сказати, які вхідні значення її зламають?<\/span> <span class=\"sg\" data-s=\"3\">І на якому рядку?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програма створює три скалярні змінні.<\/span> <span class=\"sg\" data-s=\"1\">Дві з них, <code>$i<\/code> і <code>$s<\/code>, — типізовані змінні.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>$i<\/code> може зберігати лише цілі числа.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$s<\/code> може зберігати лише рядки.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> повертає значення.<\/span> <span class=\"sg\" data-s=\"1\">Його тип залежить від символів, які ми вводимо.<\/span> <span class=\"sg\" data-s=\"2\">Іноді вхідний рядок може бути цілим числом.<\/span> <span class=\"sg\" data-s=\"3\">Тоді результат має тип <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Цей тип є <em>одночасно<\/em> <code>Int<\/code> і <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тож ви можете присвоїти його змінній <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ви також можете присвоїти його змінній <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Наприклад, ви вводите <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Тоді програма не ламається.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> — це приклад <em>аломорфа<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Аломорф — це тип даних, який складається з двох інших типів.<\/span> <span class=\"sg\" data-s=\"2\">Ось ще кілька прикладів.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер введіть рядок, який не може бути цілим числом.<\/span> <span class=\"sg\" data-s=\"1\">Програма ламається.<\/span> <span class=\"sg\" data-s=\"2\">Це стається, коли ми присвоюємо <code>$input<\/code> змінній <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді вхідний рядок — це число, але не ціле.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що тоді ви теж отримуєте помилку.<\/span> <span class=\"sg\" data-s=\"2\">Контейнер для цілих чисел не може зберігати число з плаваючою комою.<\/span> <span class=\"sg\" data-s=\"3\">Раціональне число він теж не може зберігати.<\/span> <span class=\"sg\" data-s=\"4\">Тож ви отримуєте виняток:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Друге присвоєння, <code>$s = $input<\/code>, ніколи не ламається.<\/span> <span class=\"sg\" data-s=\"1\">Рядок може прийняти будь-які вхідні дані.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код цієї програми у файлі <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"bg":{"t":"Аломорфи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вижте тази програма.<\/span> <span class=\"sg\" data-s=\"1\">Още не я стартирайте.<\/span> <span class=\"sg\" data-s=\"2\">Можете ли да кажете кои входни стойности я чупят?<\/span> <span class=\"sg\" data-s=\"3\">И на кой ред?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмата създава три скаларни променливи.<\/span> <span class=\"sg\" data-s=\"1\">Две от тях, <code>$i<\/code> и <code>$s<\/code>, са типизирани променливи.<\/span> <span class=\"sg\" data-s=\"2\">Така <code>$i<\/code> може да съдържа само цели числа.<\/span> <span class=\"sg\" data-s=\"3\">А <code>$s<\/code> може да съдържа само низове.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> връща стойност.<\/span> <span class=\"sg\" data-s=\"1\">Нейният тип зависи от символите, които въвеждаме.<\/span> <span class=\"sg\" data-s=\"2\">Понякога входният низ може да е цяло число.<\/span> <span class=\"sg\" data-s=\"3\">Тогава резултатът има тип <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Този тип е <em>едновременно<\/em> <code>Int<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Затова можете да го присвоите на променлива от тип <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Можете да го присвоите и на променлива от тип <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Например, въвеждате <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Тогава програмата не се чупи.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типът <code>IntStr<\/code> е пример за <em>аломорф<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Аломорфът е тип данни, съставен от два други типа.<\/span> <span class=\"sg\" data-s=\"2\">Ето още няколко примера.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега въведете низ, който не може да е цяло число.<\/span> <span class=\"sg\" data-s=\"1\">Програмата се чупи.<\/span> <span class=\"sg\" data-s=\"2\">Това става, когато присвояваме <code>$input<\/code> на <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога входният низ е число, но не е цяло число.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание, че и тогава получавате грешка.<\/span> <span class=\"sg\" data-s=\"2\">Контейнер за цели числа не може да съдържа число с плаваща запетая.<\/span> <span class=\"sg\" data-s=\"3\">Той не може да съдържа и рационално число.<\/span> <span class=\"sg\" data-s=\"4\">Затова получавате изключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второто присвояване, <code>$s = $input<\/code>, никога не се чупи.<\/span> <span class=\"sg\" data-s=\"1\">Низът може да приеме всякакъв вход.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код на тази програма във файла <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"eo":{"t":"Alomorfoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Rigardu ĉi tiun programon.<\/span> <span class=\"sg\" data-s=\"1\">Ne rulu ĝin ankoraŭ.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu vi povas diri, kiuj enigaj valoroj rompas ĝin?<\/span> <span class=\"sg\" data-s=\"3\">Kaj ĉe kiu linio?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La programo kreas tri skalarajn variablojn.<\/span> <span class=\"sg\" data-s=\"1\">Du el ili, <code>$i<\/code> kaj <code>$s<\/code>, estas tipitaj variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$i<\/code> povas teni nur entjerojn.<\/span> <span class=\"sg\" data-s=\"3\">Kaj <code>$s<\/code> povas teni nur ĉenojn.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> redonas valoron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia tipo dependas de la karakteroj, kiujn ni tajpas.<\/span> <span class=\"sg\" data-s=\"2\">Foje la eniga ĉeno povas esti entjera nombro.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la rezulto havas la tipon <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu tipo estas <em>ambaŭ<\/em> <code>Int<\/code> kaj <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Do vi povas asigni ĝin al <code>Int<\/code> variablo.<\/span> <span class=\"sg\" data-s=\"6\">Vi ankaŭ povas asigni ĝin al <code>Str<\/code> variablo.<\/span> <span class=\"sg\" data-s=\"7\">Ekzemple, vi enigas <code>1234<\/code>.<\/span> <span class=\"sg\" data-s=\"8\">Tiam la programo ne rompiĝas.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La tipo <code>IntStr<\/code> estas ekzemplo de <em>alomorfo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Alomorfo estas datumtipo farita el du aliaj tipoj.<\/span> <span class=\"sg\" data-s=\"2\">Jen kelkaj pliaj ekzemploj.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun enigu ĉenon, kiu ne povas esti entjero.<\/span> <span class=\"sg\" data-s=\"1\">La programo rompiĝas.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam ni asignas <code>$input<\/code> al <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje la eniga ĉeno estas nombro, sed ne entjero.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke ankaŭ tiam vi ricevas eraron.<\/span> <span class=\"sg\" data-s=\"2\">Entjera ujo ne povas teni glitkoman nombron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ ne povas teni racian nombron.<\/span> <span class=\"sg\" data-s=\"4\">Do vi ricevas escepton:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dua asigno, <code>$s = $input<\/code>, neniam rompiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉeno povas preni ajnan enigon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon de ĉi tiu programo en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"la":{"t":"Allomorphes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Specta hoc programma.<\/span> <span class=\"sg\" data-s=\"1\">Noli id statim currere.<\/span> <span class=\"sg\" data-s=\"2\">Potesne dicere qui valores inputi id frangant?<\/span> <span class=\"sg\" data-s=\"3\">Et in qua linea?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma tres variabiles scalares creat.<\/span> <span class=\"sg\" data-s=\"1\">Duae earum, <code>$i<\/code> et <code>$s<\/code>, sunt variabiles typatae.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>$i<\/code> solum integros continere potest.<\/span> <span class=\"sg\" data-s=\"3\">Et <code>$s<\/code> solum chordas continere potest.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\"><code>prompt<\/code> valorem reddit.<\/span> <span class=\"sg\" data-s=\"1\">Typus eius a characteribus pendet quos scribimus.<\/span> <span class=\"sg\" data-s=\"2\">Interdum chorda inputi numerus integer esse potest.<\/span> <span class=\"sg\" data-s=\"3\">Tum eventus typum <code>IntStr<\/code> habet.<\/span> <span class=\"sg\" data-s=\"4\">Hic typus est <em>et<\/em> <code>Int<\/code> et <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Itaque eum variabili <code>Int<\/code> assignare potes.<\/span> <span class=\"sg\" data-s=\"6\">Eum etiam variabili <code>Str<\/code> assignare potes.<\/span> <span class=\"sg\" data-s=\"7\">Exempli gratia, <code>1234<\/code> inseris.<\/span> <span class=\"sg\" data-s=\"8\">Tum programma non frangitur.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Typus <code>IntStr<\/code> est exemplum <em>allomorphi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Allomorphus est typus datorum ex duobus aliis typis factus.<\/span> <span class=\"sg\" data-s=\"2\">Hic sunt pauca alia exempla.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc chordam insere quae integer esse non potest.<\/span> <span class=\"sg\" data-s=\"1\">Programma frangitur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc accidit cum <code>$input<\/code> ad <code>$i<\/code> assignamus:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum chorda inputi numerus est, sed non integer.<\/span> <span class=\"sg\" data-s=\"1\">Nota: tum quoque errorem accipis.<\/span> <span class=\"sg\" data-s=\"2\">Continens integrum numerum puncti fluctuantis continere non potest.<\/span> <span class=\"sg\" data-s=\"3\">Neque numerum rationalem continere potest.<\/span> <span class=\"sg\" data-s=\"4\">Itaque exceptionem accipis:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secunda assignatio, <code>$s = $input<\/code>, numquam frangitur.<\/span> <span class=\"sg\" data-s=\"1\">Chorda quodlibet inputum accipere potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis huius programmatis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]}}}</script>
