 un programma Raku del tutto corretto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma Raku ti permette anche di dire cosa può contenere una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Gli argomenti qui sotto ti dicono di più.<\/span><\/p>"]]},"lv":{"t":"Tipizētie mainīgie","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku valodā skalārs mainīgais jeb skalāra konteiners glabā vienu objektu.<\/span> <span class=\"sg\" data-s=\"1\">Šis objekts var būt dažādu tipu.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, viens un tas pats mainīgais vispirms var saturēt skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas var saturēt virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl viens piemērs.<\/span> <span class=\"sg\" data-s=\"1\">Vienā izteiksmē ir dažādi datu tipi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas laikam nav labs veids, kā rakstīt kodu.<\/span> <span class=\"sg\" data-s=\"1\">Bet tā ir pilnīgi pareiza Raku programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet Raku arī ļauj jums pateikt, ko mainīgais drīkst glabāt.<\/span> <span class=\"sg\" data-s=\"1\">Zemāk esošās tēmas pastāsta vairāk.<\/span><\/p>"]]},"ru":{"t":"Типизированные переменные","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku скалярная переменная, или скалярный контейнер, хранит один объект.<\/span> <span class=\"sg\" data-s=\"1\">Этот объект может быть разных типов.<\/span> <span class=\"sg\" data-s=\"2\">Например, одна и та же переменная может сначала содержать число.<\/span> <span class=\"sg\" data-s=\"3\">Потом она может содержать строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот ещё один пр \"2\">Например, една и съща променлива може първо да съдържа число.<\/span> <span class=\"sg\" data-s=\"3\">След това тя може да съдържа низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето още един пример.<\/span> <span class=\"sg\" data-s=\"1\">В един израз има различни типове данни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това вероятно не е добър начин да пишете код.<\/span> <span class=\"sg\" data-s=\"1\">Но това е напълно правилна програма на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но Raku ви позволява и да кажете какво може да съдържа една променлива.<\/span> <span class=\"sg\" data-s=\"1\">Темите по-долу разказват повече.<\/span><\/p>"]]},"eo":{"t":"Tipitaj variabloj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, skalara variablo, aŭ skalara ujo, tenas unu objekton.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu objekto povas esti de malsamaj tipoj.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la sama variablo povas unue enhavi nombron.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi povas enhavi ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen alia ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Unu esprimo havas malsamajn datumtipojn en si:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio verŝajne ne estas bona maniero skribi kodon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi estas tute ĝusta Raku-programo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed Raku ankaŭ lasas vin diri, kion variablo povas teni.<\/span> <span class=\"sg\" data-s=\"
