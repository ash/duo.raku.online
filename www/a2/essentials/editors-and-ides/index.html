аммы на Raku — это простой текст.<\/span> <span class=\"sg\" data-s=\"1\">Обычно вы храните их в текстовых файлах.<\/span> <span class=\"sg\" data-s=\"2\">Но есть некоторые исключения.<\/span> <span class=\"sg\" data-s=\"3\">Например, вы можете запустить программу онлайн.<\/span> <span class=\"sg\" data-s=\"4\">Или вы можете запустить её в командной строке.<\/span> <span class=\"sg\" data-s=\"5\">Ещё вы можете подготовить код и запустить его через <code>EVAL<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Есть и несколько других редких случаев.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku ждёт текст программы в кодировке UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете взять любой текстовый редактор.<\/span> <span class=\"sg\" data-s=\"2\">Но он не должен сохранять форматирование в файле.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете использовать <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> или <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Любой из них — хороший выбор.<\/span> <span class=\"sg\" data-s=\"5\">Но, может быть, вы захотите попробовать и популярные новые приложения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот ссылки на некоторые популярные IDE.<\/span> <span class=\"sg\" data-s=\"1\">IDE — это программа, где вы пишете и запускаете код.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — для Windows, Mac OS и Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE для Raku, она сделана только для программирования на Raku. Она работает на Windows, Mac OS и Linux.<\/span><\/li><\/ul>"]]},"uk":{"t":"Редактори та IDE","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Програми Raku — це звичайний текст.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай ви зберігаєте їх у текстових файлах.<\/span> <span class=\"sg\" data-s=\"2\">Але є кілька винятків.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ви можете запустити програму онлайн.<\/span> <span class=\"sg\" data-s=\"4\">Або ви можете запустити її в командному рядку.<\/span> <span class=\"sg\" data-s=\"5\">Також ви можете підготувати код і запустити його через <code>EVAL<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Є й кілька інших рідкісних випадків.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku чекає текст програми в кодуванні UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете використовувати будь-який текстовий редактор.<\/span> <span class=\"sg\" data-s=\"2\">Але він не повинен зберігати форматування у файлі.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете використовувати <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> або <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кожен із них — добрий вибір.<\/span> <span class=\"sg\" data-s=\"5\">Але, можливо, ви захочете спробувати й кілька популярних нових програм.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось посилання на кілька популярних IDE.<\/span> <span class=\"sg\" data-s=\"1\">IDE — це програма для написання і запуску коду.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — для Windows, Mac OS та Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE для Raku, зроблений саме для програмування на Raku. Він працює у Windows, Mac OS та Linux.<\/span><\/li><\/ul>"]]},"bg":{"t":"Редактори и IDE","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Програмите на Raku са обикновен текст.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено ги пазите в текстови файлове.<\/span> <span class=\"sg\" data-s=\"2\">Но има някои изключения.<\/span> <span class=\"sg\" data-s=\"3\">Например можете да изпълните програма онлайн.<\/span> <span class=\"sg\" data-s=\"4\">Или можете да я изпълните в командния ред.<\/span> <span class=\"sg\" data-s=\"5\">Можете и да подготвите код и да го изпълните с <code>EVAL<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Има и още няколко редки случая.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku очаква текста на програмата в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да използвате всеки текстов редактор.<\/span> <span class=\"sg\" data-s=\"2\">Но той не трябва да записва форматиране във файла.<\/span> <span class=\"sg\" data-s=\"3\">Можете да използвате <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> или <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всеки от тях е добър избор.<\/span> <span class=\"sg\" data-s=\"5\">Но може да искате да опитате и някои нови популярни приложения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето връзки към някои популярни IDE.<\/span> <span class=\"sg\" data-s=\"1\">IDE е програма за писане и изпълнение на код.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — за Windows, Mac OS и Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE за Raku, направен само за програмиране на Raku. Работи на Windows, Mac OS и Linux.<\/span><\/li><\/ul>"]]},"eo":{"t":"Redaktiloj kaj IDEj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku-programoj estas simpla teksto.<\/span> <span class=\"sg\" data-s=\"1\">Kutime vi konservas ilin en tekstaj dosieroj.<\/span> <span class=\"sg\" data-s=\"2\">Sed estas kelkaj esceptoj.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, vi povas ruli programon rete.<\/span> <span class=\"sg\" data-s=\"4\">Aŭ vi povas ruli ĝin en la komandlinio.<\/span> <span class=\"sg\" data-s=\"5\">Vi ankaŭ povas prepari kodon kaj ruli ĝin per <code>EVAL<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Estas ankaŭ kelkaj aliaj raraj kazoj.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku atendas la programtekston en UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas uzi ajnan tekstredaktilon.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi ne rajtas konservi formatigon en la dosiero.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas uzi <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> aŭ <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu el ili estas bona elekto.<\/span> <span class=\"sg\" data-s=\"5\">Sed vi eble ankaŭ volas provi kelkajn popularajn novajn aplikaĵojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen ligiloj al kelkaj popularaj IDE-oj.<\/span> <span class=\"sg\" data-s=\"1\">IDE estas programo por skribi kaj ruli kodon.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — por Vindozo, Mac OS kaj Linukso<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — la Raku IDE, farita nur por programado en Raku. Ĝi funkcias sur Vindozo, Mac OS kaj Linukso.<\/span><\/li><\/ul>"]]},"la":{"t":"Editores et IDEs","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Programmata Raku sunt textus simplex.<\/span> <span class=\"sg\" data-s=\"1\">Plerumque ea in fasciculis textus servas.<\/span> <span class=\"sg\" data-s=\"2\">Sed sunt quaedam exceptiones.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, programma online currere potes.<\/span> <span class=\"sg\" data-s=\"4\">Aut id in linea mandati currere potes.<\/span> <span class=\"sg\" data-s=\"5\">Potes etiam codicem parare et eum per <code>EVAL<\/code> currere.<\/span> <span class=\"sg\" data-s=\"6\">Sunt etiam pauci alii casus rari.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku textum programmatis in UTF-8 exspectat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque quolibet editore textus uti potes.<\/span> <span class=\"sg\" data-s=\"2\">Sed editor formam textus in fasciculo servare non debet.<\/span> <span class=\"sg\" data-s=\"3\">Potes uti <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> aut <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Quisque ex eis bona electio est.<\/span> <span class=\"sg\" data-s=\"5\">Sed fortasse etiam aliquas novas applicationes populares experiri vis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic sunt nexus ad aliquos IDEs populares.<\/span> <span class=\"sg\" data-s=\"1\">IDE est programma ad codicem scribendum et currendum.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — pro Fenestra, Mac OS et Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE Raku, factum tantum ad programmandum in Raku. In Fenestra, Mac OS et Linux currit.<\/span><\/li><\/ul>"]]}}}</script>
