\" data-s=\"0\">Здесь в строке записано число с плавающей запятой.<\/span> <span class=\"sg\" data-s=\"1\">Raku преобразует его в целое число.<\/span><\/p>"]]},"uk":{"t":"Перетворення типів за допомогою конструкторів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Є схожий спосіб.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете створити новий об'єкт потрібного типу.<\/span> <span class=\"sg\" data-s=\"2\">Для цього викличте конструктор типу.<\/span> <span class=\"sg\" data-s=\"3\">Конструктор створює нові об'єкти.<\/span> <span class=\"sg\" data-s=\"4\">Його назва така сама, як назва типу.<\/span> <span class=\"sg\" data-s=\"5\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = Int('1.23E4');\nsay $n;      # 12300\nsay $n.WHAT; # (Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут у рядку є число з плаваючою комою.<\/span> <span class=\"sg\" data-s=\"1\">Raku перетворює його на ціле число.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на типове с форми на конструктора","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Има и подобен начин.<\/span> <span class=\"sg\" data-s=\"1\">Можете да създадете нов обект от типа, който ви трябва.<\/span> <span class=\"sg\" data-s=\"2\">За целта извикайте конструктора на типа.<\/span> <span class=\"sg\" data-s=\"3\">Конструкторът създава нови обекти.<\/span> <span class=\"sg\" data-s=\"4\">Името му е същото като името на типа.<\/span> <span class=\"sg\" data-s=\"5\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = Int('1.23E4');\nsay $n;      # 12300\nsay $n.WHAT; # (Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук низът съдържа число с плаваща запетая.<\/span> <span class=\"sg\" data-s=\"1\">Raku го преобразува в цяло число.<\/span><\/p>"]]},"eo":{"t":"Konvertante tipojn uzante konstruistajn formojn","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Estas simila maniero.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas fari novan objekton de la n
