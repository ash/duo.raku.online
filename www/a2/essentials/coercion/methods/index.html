<script type="application/json" id="page-data">{"u":"essentials/coercion/methods","n":183,"k":"topic","pv":"essentials/coercion/what/quiz","nx":"essentials/coercion/new","tr":["essentials","essentials/coercion"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Converting types using type coercion methods","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">You can convert a value to another type.<\/span> <span class=\"sg\" data-s=\"1\">Another word for this is to <em>coerce<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">To do it, call a method.<\/span> <span class=\"sg\" data-s=\"3\">Its name is the name of the data type.<\/span> <span class=\"sg\" data-s=\"4\">For example, convert a string into an integer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Often, you do not need to convert values yourself.<\/span> <span class=\"sg\" data-s=\"1\">Raku does it for you.<\/span> <span class=\"sg\" data-s=\"2\">This code works correctly and as you expect:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The two variables, <code>$a<\/code> and <code>$b<\/code>, contain strings.<\/span> <span class=\"sg\" data-s=\"1\">But the expression adds them with <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">So Raku converts both strings to integers here.<\/span> <span class=\"sg\" data-s=\"3\">Then <code>$c<\/code> also gets an integer.<\/span> <span class=\"sg\" data-s=\"4\">In the last line, Raku interpolates this variable in a string.<\/span> <span class=\"sg\" data-s=\"5\">For this, Raku turns the number into digit characters.<\/span><\/p>"]]},"de":{"t":"Typumwandlung mit Typumwandlungsmethoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sie können einen Wert in einen anderen Typ umwandeln.<\/span> <span class=\"sg\" data-s=\"1\">Ein anderes Wort dafür ist <em>erzwingen<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Dazu rufen Sie eine Methode auf.<\/span> <span class=\"sg\" data-s=\"3\">Ihr Name ist der Name des Datentyps.<\/span> <span class=\"sg\" data-s=\"4\">Wandeln Sie zum Beispiel einen String in eine ganze Zahl um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Oft müssen Sie Werte nicht selbst umwandeln.<\/span> <span class=\"sg\" data-s=\"1\">Raku macht das für Sie.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Code funktioniert richtig und wie erwartet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Das Ergebnis ist $c.\"; # Das Ergebnis ist 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Die beiden Variablen <code>$a<\/code> und <code>$b<\/code> enthalten Strings.<\/span> <span class=\"sg\" data-s=\"1\">Aber der Ausdruck addiert sie mit <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Darum wandelt Raku hier beide Strings in ganze Zahlen um.<\/span> <span class=\"sg\" data-s=\"3\">Dann bekommt auch <code>$c<\/code> eine ganze Zahl.<\/span> <span class=\"sg\" data-s=\"4\">In der letzten Zeile interpoliert Raku diese Variable in einen String.<\/span> <span class=\"sg\" data-s=\"5\">Dafür macht Raku aus der Zahl Ziffernzeichen.<\/span><\/p>"]]},"nl":{"t":"Typen converteren met type coercie methoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je kunt een waarde omzetten naar een ander type.<\/span> <span class=\"sg\" data-s=\"1\">Een ander woord hiervoor is <em>forceren<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Roep daarvoor een methode aan.<\/span> <span class=\"sg\" data-s=\"3\">Die methode heeft dezelfde naam als het datatype.<\/span> <span class=\"sg\" data-s=\"4\">Zet bijvoorbeeld een string om naar een integer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vaak hoef je waarden niet zelf om te zetten.<\/span> <span class=\"sg\" data-s=\"1\">Raku doet het voor je.<\/span> <span class=\"sg\" data-s=\"2\">Deze code werkt goed en zoals je verwacht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De twee variabelen, <code>$a<\/code> en <code>$b<\/code>, bevatten strings.<\/span> <span class=\"sg\" data-s=\"1\">Maar de expressie telt ze op met <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daarom zet Raku hier beide strings om naar integers.<\/span> <span class=\"sg\" data-s=\"3\">Dan krijgt <code>$c<\/code> ook een integer.<\/span> <span class=\"sg\" data-s=\"4\">In de laatste regel interpoleert Raku deze variabele in een string.<\/span> <span class=\"sg\" data-s=\"5\">Daarvoor maakt Raku van het getal cijfertekens.<\/span><\/p>"]]},"es":{"t":"Conversión de tipos usando métodos de coerción de tipos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puedes convertir un valor a otro tipo.<\/span> <span class=\"sg\" data-s=\"1\">Otra palabra para esto es <em>coaccionar<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Para hacerlo, llama a un método.<\/span> <span class=\"sg\" data-s=\"3\">Su nombre es el nombre del tipo de dato.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, convierte una cadena en un entero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A menudo no necesitas convertir valores tú mismo.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo hace por ti.<\/span> <span class=\"sg\" data-s=\"2\">Este código funciona correctamente y como esperas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Las dos variables, <code>$a<\/code> y <code>$b<\/code>, contienen cadenas.<\/span> <span class=\"sg\" data-s=\"1\">Pero la expresión las suma con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que aquí Raku convierte las dos cadenas en enteros.<\/span> <span class=\"sg\" data-s=\"3\">Luego <code>$c<\/code> también recibe un entero.<\/span> <span class=\"sg\" data-s=\"4\">En la última línea, Raku interpola esta variable en una cadena.<\/span> <span class=\"sg\" data-s=\"5\">Para esto, Raku convierte el número en caracteres de dígitos.<\/span><\/p>"]]},"it":{"t":"Conversione dei tipi usando i metodi di coercizione del tipo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puoi convertire un valore in un altro tipo.<\/span> <span class=\"sg\" data-s=\"1\">Un'altra parola per questo è <em>coercere<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per farlo, chiama un metodo.<\/span> <span class=\"sg\" data-s=\"3\">Il suo nome è il nome del tipo di dato.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, converti una stringa in un intero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Spesso non devi convertire i valori da solo.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo fa per te.<\/span> <span class=\"sg\" data-s=\"2\">Questo codice funziona bene, come ti aspetti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Le due variabili, <code>$a<\/code> e <code>$b<\/code>, contengono stringhe.<\/span> <span class=\"sg\" data-s=\"1\">Ma l'espressione le somma con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Così qui Raku converte tutte e due le stringhe in interi.<\/span> <span class=\"sg\" data-s=\"3\">Poi anche <code>$c<\/code> riceve un intero.<\/span> <span class=\"sg\" data-s=\"4\">Nell'ultima riga, Raku interpola questa variabile in una stringa.<\/span> <span class=\"sg\" data-s=\"5\">Per questo, Raku trasforma il numero in cifre.<\/span><\/p>"]]},"lv":{"t":"Tipu konvertēšana, izmantojot tipu piespiedu metodes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs varat konvertēt vērtību uz citu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir arī cits vārds: <em>piespiest<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izdarītu, izsauciet metodi.<\/span> <span class=\"sg\" data-s=\"3\">Tās nosaukums ir datu tipa nosaukums.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, konvertējiet virkni par veselu skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bieži jums nav pašiem jākonvertē vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Raku to izdara jūsu vietā.<\/span> <span class=\"sg\" data-s=\"2\">Šis kods strādā pareizi un kā gaidīts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Rezultāts ir $c.\"; # Rezultāts ir 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Abi mainīgie, <code>$a<\/code> un <code>$b<\/code>, satur virknes.<\/span> <span class=\"sg\" data-s=\"1\">Bet izteiksme tās saskaita ar <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc šeit Raku pārveido abas virknes par veseliem skaitļiem.<\/span> <span class=\"sg\" data-s=\"3\">Tad arī <code>$c<\/code> saņem veselu skaitli.<\/span> <span class=\"sg\" data-s=\"4\">Pēdējā rindā Raku interpolē šo mainīgo virknē.<\/span> <span class=\"sg\" data-s=\"5\">Lai to izdarītu, Raku pārvērš skaitli ciparu rakstzīmēs.<\/span><\/p>"]]},"ru":{"t":"Приведение типов с помощью методов приведения типов","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы можете преобразовать значение в другой тип.<\/span> <span class=\"sg\" data-s=\"1\">Другое слово для этого — <em>привести<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Для этого вызовите метод.<\/span> <span class=\"sg\" data-s=\"3\">Его имя — это имя типа данных.<\/span> <span class=\"sg\" data-s=\"4\">Например, преобразуйте строку в целое число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Часто вам не нужно преобразовывать значения самим.<\/span> <span class=\"sg\" data-s=\"1\">Raku делает это за вас.<\/span> <span class=\"sg\" data-s=\"2\">Этот код работает правильно и так, как вы ждёте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Две переменные, <code>$a<\/code> и <code>$b<\/code>, содержат строки.<\/span> <span class=\"sg\" data-s=\"1\">Но выражение складывает их с помощью <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому здесь Raku преобразует обе строки в целые числа.<\/span> <span class=\"sg\" data-s=\"3\">Тогда <code>$c<\/code> тоже получает целое число.<\/span> <span class=\"sg\" data-s=\"4\">В последней строке Raku интерполирует эту переменную в строку.<\/span> <span class=\"sg\" data-s=\"5\">Для этого Raku превращает число в символы цифр.<\/span><\/p>"]]},"uk":{"t":"Перетворення типів за допомогою методів примусу типів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви можете перетворити значення на інший тип.<\/span> <span class=\"sg\" data-s=\"1\">Це ще називають <em>примусовим приведенням<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Для цього викличте метод.<\/span> <span class=\"sg\" data-s=\"3\">Його назва — це назва типу даних.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, перетворіть рядок на ціле число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Часто вам не треба самим перетворювати значення.<\/span> <span class=\"sg\" data-s=\"1\">Raku робить це за вас.<\/span> <span class=\"sg\" data-s=\"2\">Цей код працює правильно і так, як ви очікуєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Дві змінні, <code>$a<\/code> і <code>$b<\/code>, містять рядки.<\/span> <span class=\"sg\" data-s=\"1\">Але вираз додає їх за допомогою <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож тут Raku перетворює обидва рядки на цілі числа.<\/span> <span class=\"sg\" data-s=\"3\">Тоді <code>$c<\/code> теж отримує ціле число.<\/span> <span class=\"sg\" data-s=\"4\">В останньому рядку Raku інтерполює цю змінну в рядок.<\/span> <span class=\"sg\" data-s=\"5\">Для цього Raku перетворює число на символи цифр.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на типове с методи за преобразуване на типове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете да преобразувате стойност в друг тип.<\/span> <span class=\"sg\" data-s=\"1\">Друга дума за това е <em>принудително преобразуване<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">За да го направите, извикайте метод.<\/span> <span class=\"sg\" data-s=\"3\">Името му е името на типа данни.<\/span> <span class=\"sg\" data-s=\"4\">Например, преобразувайте низ в цяло число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Често не е нужно сами да преобразувате стойностите.<\/span> <span class=\"sg\" data-s=\"1\">Raku го прави вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Този код работи правилно и както очаквате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Резултатът е $c.\"; # Резултатът е 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Двете променливи, <code>$a<\/code> и <code>$b<\/code>, съдържат низове.<\/span> <span class=\"sg\" data-s=\"1\">Но изразът ги събира с <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова тук Raku преобразува двата низа в цели числа.<\/span> <span class=\"sg\" data-s=\"3\">После <code>$c<\/code> също получава цяло число.<\/span> <span class=\"sg\" data-s=\"4\">На последния ред Raku интерполира тази променлива в низ.<\/span> <span class=\"sg\" data-s=\"5\">За целта Raku превръща числото в цифрови символи.<\/span><\/p>"]]},"eo":{"t":"Konvertante tipojn uzante tipajn devigmetodojn","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas konverti valoron al alia tipo.<\/span> <span class=\"sg\" data-s=\"1\">Alia vorto por tio estas <em>devigi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Por fari tion, voku metodon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia nomo estas la nomo de la datumtipo.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, konvertu ŝnuron al entjero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ofte vi ne bezonas mem konverti valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras tion por vi.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu kodo funkcias ĝuste kaj kiel vi atendas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"La rezulto estas $c.\"; # La rezulto estas 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La du variabloj, <code>$a<\/code> kaj <code>$b<\/code>, enhavas ŝnurojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed la esprimo adicias ilin per <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do ĉi tie Raku konvertas ambaŭ ŝnurojn al entjeroj.<\/span> <span class=\"sg\" data-s=\"3\">Tiam <code>$c<\/code> ankaŭ ricevas entjeron.<\/span> <span class=\"sg\" data-s=\"4\">En la lasta linio, Raku interpolas ĉi tiun variablon en ŝnuron.<\/span> <span class=\"sg\" data-s=\"5\">Por tio, Raku faras el la nombro ciferajn karakterojn.<\/span><\/p>"]]},"la":{"t":"Convertendo generibus utendo coercitionis methodis","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Valorem ad alium typum convertere potes.<\/span> <span class=\"sg\" data-s=\"1\">Aliud verbum pro hoc est <em>coercere<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc methodum voca.<\/span> <span class=\"sg\" data-s=\"3\">Nomen eius est nomen generis datorum.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, converte stringam in integrum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Saepe non necesse est valores ipse convertere.<\/span> <span class=\"sg\" data-s=\"1\">Raku id pro te facit.<\/span> <span class=\"sg\" data-s=\"2\">Hic codex recte et ut exspectas operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Duae variabiles, <code>$a<\/code> et <code>$b<\/code>, stringas continent.<\/span> <span class=\"sg\" data-s=\"1\">Sed expressio eas cum <code>+<\/code> addit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Raku hic ambas stringas in integros convertit.<\/span> <span class=\"sg\" data-s=\"3\">Deinde <code>$c<\/code> quoque integrum accipit.<\/span> <span class=\"sg\" data-s=\"4\">In ultima linea, Raku hanc variabilem in stringa interpolat.<\/span> <span class=\"sg\" data-s=\"5\">Ad hoc Raku numerum in characteres digitorum vertit.<\/span><\/p>"]]}}}</script>
