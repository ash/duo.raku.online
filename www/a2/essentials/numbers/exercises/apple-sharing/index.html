> <span class=\"sg\" data-s=\"1\">Сложете ги в променливи, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $N = 3;\nmy $K = 11;\n\n# Вашият код тук . . .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка ябълка остава цяла.<\/span> <span class=\"sg\" data-s=\"1\">Не можете да режете ябълките на парчета.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С числата по-горе програмата трябва да отпечата това:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku apple-sharing.raku\nВсеки човек получава 3 ябълка(и).\nОстават 2 ябълка(и).<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Засега не се тревожете за правилната форма на съществителните.<\/span> <span class=\"sg\" data-s=\"1\">Изходът може да изглежда странно, когато не остават ябълки.<\/span> <span class=\"sg\" data-s=\"2\">Засега това е наред.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/numbers/exercises/apple-sharing/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Poma divido","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas <em>N<\/em> homoj kaj <em>K<\/em> pomoj.<\/span> <span class=\"sg\" data-s=\"1\">La homoj dividas la pomojn egale.<\/span> <span class=\"sg\" data-s=\"2\">Skribu programon, kiu respondas ĉi tiujn demandojn:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Kiom da pomoj ricevas ĉiu persono?<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Kiom da pomoj restas en la korbo?<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Skribu la nombrojn <em>N<\/em> kaj <em>K<\/em> rekte en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">Metu ilin en variablojn, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $N = 3;\nmy $K = 11;\n\n# Via kodo ĉi tie . . .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu pomo restas tuta.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne povas tranĉi pomojn en pecojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun la nombroj supre, la programo devas presi ĉi tion:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku apple-sharing.raku\nĈiu persono ricevas 3 pomo(j)n.\nEstas 2 pomo(j)n restantaj.<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por nun, ne zorgu pri la ĝusta formo de la substantivoj.<\/span> <span class=\"sg\" data-s=\"1\">La eligo ankaŭ povas aspekti stranga, kiam neniu pomo restas.<\/span> <span class=\"sg\" data-s=\"2\">Por nun tio estas en ordo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/numbers/exercises/apple-sharing/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Pomum communicatio","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sunt <em>N<\/em> homines et <em>K<\/em> poma.<\/span> <span class=\"sg\" data-s=\"1\">Homines poma aequaliter inter se dividunt.<\/span> <span class=\"sg\" data-s=\"2\">Scribe programma quod ad has quaestiones respondet:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Quot poma quisque homo accipit?<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Quot poma in corbe manent?<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeros <em>N<\/em> et <em>K<\/em> directe in codice scribe.<\/span> <span class=\"sg\" data-s=\"1\">Eos in variabiles pone, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $N = 3;\nmy $K = 11;\n\n# Codex tuus hic . . .<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quodque pomum integrum manet.<\/span> <span clas
