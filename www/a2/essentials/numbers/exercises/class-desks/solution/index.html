io: Classis scrinia","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $students = 23;\n\nmy $desks = $students div 2 + $students % 2;\n\nsay \"$desks desks must be bought.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem plenum invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/numbers/class-desks.raku\" target=\"_blank\" rel=\"noopener\">class-desks.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma bis vel saepius curre.<\/span> <span class=\"sg\" data-s=\"1\">Numerum discipulorum imparem et numerum parem tenta.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, <code>23<\/code> et <code>24<\/code> tenta.<\/span> <span class=\"sg\" data-s=\"3\">Pro utroque numero programma eundem eventum imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/numbers/class-desks.raku\n12 desks must be bought.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Numerum discipulorum per duo modo dividere non potes.<\/span> <span class=\"sg\" data-s=\"1\">Programma cum numeris et paribus et imparibus operari debet.<\/span> <span class=\"sg\" data-s=\"2\">Sic numerum sursum rotundare potes: <code>$students div 2 + $students % 2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Expressio duas partes habet.<\/span> <span class=\"sg\" data-s=\"4\">Si numerus discipulorum par est, secunda pars nulla est.<\/span> <span class=\"sg\" data-s=\"5\">Tum eventus est dimidium numeri discipulorum.<\/span> <span class=\"sg\" data-s=\"6\">Sed si impar est, prima pars adhuc numerus integer est.<\/span> <span class=\"sg\" data-s=\"7\">Nam <code>div<\/code> utimur, non <code>/<\/co
