div<\/code> | Gehele deling <code>mod<\/code> | Gehele modulo<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De operator <code>div<\/code> rondt het resultaat naar beneden af.<\/span> <span class=\"sg\" data-s=\"1\">Dus <code>10 div 3<\/code> is <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En <code>-10 div 3<\/code> is <code>-4<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zowel <code>div<\/code> als <code>mod<\/code> hebben gehele operanden nodig.<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar de regels met <code>Error<\/code> in het programma hieronder.<\/span> <span class=\"sg\" data-s=\"2\">Als je de <code>#<\/code> bij die regels weghaalt, werkt het programma niet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Macht<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee manieren om <em>x<\/em> tot de macht <em>y<\/em> te krijgen.<\/span> <span class=\"sg\" data-s=\"1\">De eerste manier is de operator <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De tweede manier is om superscript cijfers te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn kleine cijfers bovenaan de regel.<\/span> <span class=\"sg\" data-s=\"2\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook twee of meer superscript cijfers gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Dan kan de macht groter zijn dan 9.<\/span> <span class=\"sg\" data-s=\"2\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een negatieve macht werkt ook:<\/span><\/p II:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Multiplicación <code>÷<\/code> | División<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa paréntesis para cambiar el orden de las operaciones:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Módulo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador de módulo es <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es igual en muchos otros lenguajes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Módulo<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Da el resto de la división entera de dos números.<\/span> <span class=\"sg\" data-s=\"1\">El resto es lo que queda después de la división.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>10 % 3<\/code> es <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pero nota que <code>-10 % 3<\/code> es <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Veamos por qué.<\/span> <span class=\"sg\" data-s=\"5\">Divide el primer número entre el segundo número.<\/span> <span class=\"sg\" data-s=\"6\">Redondea el resultado hacia abajo.<\/span> <span class=\"sg\" data-s=\"7\">Multiplícalo por el segundo número.<\/span> <span class=\"sg\" data-s=\"8\">Luego réstalo del primer número.<\/span> <span class=\"sg\" data-s=\"9\">Este es el resultado de <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Así que <code>$a % $b<\/code> es lo mismo que <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Divisibilidad<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku también tiene un operador útil para la divisibilidad.<\/span> <span class=\"sg\" data-s=\"1\">Comprueba si un número es divisible por otro.<\/span> <span class=\"sg\" data-s=\"2\">Esto significa que no hay resto.<\/span><\/p>"],["p",1," ador <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La segunda forma es usar dígitos en superíndice.<\/span> <span class=\"sg\" data-s=\"1\">Son dígitos pequeños en la parte de arriba de la línea.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También puedes usar dos o más dígitos en superíndice.<\/span> <span class=\"sg\" data-s=\"1\">Así la potencia puede ser mayor que 9.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una potencia negativa también funciona:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota que las dos últimas expresiones dan un número <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operaciones con asignación<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas actualizar una variable con una operación.<\/span> <span class=\"sg\" data-s=\"1\">Todas las operaciones tienen una forma corta para esto.<\/span> <span class=\"sg\" data-s=\"2\">Aquí hay un ejemplo con <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma completa<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">es lo mismo que:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"it":{"t":"Operazioni con i numeri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sicuramente conosci già alcune operazioni con i numeri in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ecco due parole da ricordare.<\/span> <span class=\"sg\" data-s=\"2\">Il simbolo di un'<em>operazione<\/em> si chiama <em>operatore<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un'operazione lavora su alcuni oggetti.<\/span> <span class=\"sg\" data-s=\"4\">Questi oggetti si chiamano <em>operandi<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmetica<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operatore<\/strong> | <strong>Operazione<\/strong> <code>+<\/code> | Addizione <code>-<\/code> | Sottrazione <code>*<\/code> | Moltiplicazione <code>/<\/code> | Divisione<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku <a href=\"https://course.raku.org/it/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">supporta Unicode<\/a> molto bene.<\/span> <span class=\"sg\" data-s=\"1\">Quindi alcuni di questi operatori hanno una seconda forma con simboli non ASCII:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Moltiplicazione <code>÷<\/code> | Divisione<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usa le parentesi per cambiare l'ordine delle operazioni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'operatore modulo è <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È lo stesso in molti altri linguaggi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulo<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Dà il resto della divisione intera di due numeri.<\/span> <span class=\"sg\" data-s=\"1\">Il resto è quello che rimane dopo la divisione.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>10 % 3<\/code> è <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ma nota che <code>-10 % 3<\/code> è <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ecco perché.<\/span> <span class=\"sg\" data-s=\"5\">Dividi il primo numero per il secondo numero.<\/span> <span class=\"sg\" data-s=\"6\">Arrotonda il risultato verso il basso.<\/span> <span class=\"sg\" data-s=\"7\">Moltiplicalo per il secondo numero.<\/span> <span class=\"sg\" data-s=\"8\">Poi togli questo valore dal primo numero.<\/span> <span class=\"sg\" data-s=\"9\">Questo è il risultato di <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Quindi <code>$a % $b<\/code> è lo stesso di <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Divisibilità<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ha anche un operatore utile per la divisibilità.<\/span> <span class=\"sg\" data-s=\"1\">Controlla se un numero è divisibile per un altro.<\/span> <span class=\"sg\" data-s=\"2\">Questo vuol dire che non c'è resto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Divisibilità<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo è un operatore infisso.<\/span> <span class=\"sg\" data-s=\"1\">Va tra i suoi due operandi: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il primo operando è divisibile per il secondo?<\/span> <span class=\"sg\" data-s=\"3\">Allora il risultato è il valore booleano <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Se non lo è, il risultato è <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operazioni intere<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcune operazioni speciali danno risultati interi.<\/span> <span class=\"sg\" data-s=\"1\">I loro operatori sono parole, non simboli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Divisione intera <code>mod<\/code> | Modulo intero<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>div<\/code> arrotonda il risultato verso il basso.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>10 div 3<\/code> è <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">E <code>-10 div 3<\/code> è <code>-4<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sia <code>div<\/code> che <code>mod<\/code> hanno bisogno di operandi interi.<\/span> <span class=\"sg\" data-s=\"1\">Guarda le righe con <code>Error<\/code> nel programma qui sotto.<\/span> <span class=\"sg\" data-s=\"2\">Se togli il <code>#<\/code> da queste righe, il programma non funziona:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Potenza<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per avere <em>x<\/em> alla potenza di <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il primo modo è l'operatore <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il secondo modo è usare le cifre in apice.<\/span> <span class=\"sg\" data-s=\"1\">Sono piccole cifre in alto sulla riga.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche usare due o più cifre in apice.<\/span> <span class=\"sg\" data-s=\"1\">Così la potenza può essere più grande di 9.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche una potenza negativa funziona:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che le ultime due espressioni danno un numero <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operazioni con assegnazione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte devi aggiornare una variabile con un'operazione.<\/span> <span class=\"sg\" data-s=\"1\">Tutte le operazioni hanno una forma breve per questo.<\/span> <span class=\"sg\" data-s=\"2\">Ecco un esempio con <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La forma completa<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">è uguale a:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"lv":{"t":"Operācijas ar skaitļiem","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Mēs esam droši, ka jūs jau zināt dažas operācijas ar skaitļiem Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir divi vārdi, ko atcerēties.<\/span> <span class=\"sg\" data-s=\"2\">Katras <em>operācijas<\/em> simbolu sauc par <em>operatoru<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Operācija strādā ar dažiem objektiem.<\/span> <span class=\"sg\" data-s=\"4\">Tos sauc par <em>operandiem<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmētika<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operators<\/strong> | <strong>Operācija<\/strong> <code>+<\/code> | Saskaitīšana <code>-<\/code> | Atņemšana <code>*<\/code> | Reizināšana <code>/<\/code> | Dalīšana<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ļoti labi <a href=\"https://course.raku.org/lv/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">atbalsta Unicode<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc dažiem no šiem operatoriem ir otra forma ar ne-ASCII simboliem:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Reizināšana <code>÷<\/code> | Dalīšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet iekavas, lai mainītu operāciju secību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Moduļa operators ir <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daudzās citās valodās tas ir tāds pats.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulis<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Tas dod divu skaitļu veselā dalījuma atlikumu.<\/span> <span class=\"sg\" data-s=\"1\">Atlikums ir tas, kas paliek pāri pēc dalīšanas.<\/span> <span class=\"sg\" data-s=\"2\">Tātad <code>10 % 3<\/code> ir <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bet ievērojiet, ka <code>-10 % 3<\/code> ir <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Lūk, kāpēc.<\/span> <span class=\"sg\" data-s=\"5\">Izdaliet pirmo skaitli ar otro skaitli.<\/span> <span class=\"sg\" data-s=\"6\">Noapaļojiet rezultātu uz leju.<\/span> <span class=\"sg\" data-s=\"7\">Sareiziniet to ar otro skaitli.<\/span> <span class=\"sg\" data-s=\"8\">Tad atņemiet to no pirmā skaitļa.<\/span> <span class=\"sg\" data-s=\"9\">Tas ir <code>%<\/code> rezultāts.<\/span> <span class=\"sg\" data-s=\"10\">Tātad <code>$a % $b<\/code> ir tas pats, kas <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dalāmība<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir arī noderīgs operators dalāmības pārbaudei.<\/span> <span class=\"sg\" data-s=\"1\">Tas pārbauda, vai viens skaitlis ir dalāms ar otru.<\/span> <span class=\"sg\" data-s=\"2\">Tas nozīmē, ka nav atlikuma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Dalāmība<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas ir infiksu operators.<\/span> <span class=\"sg\" data-s=\"1\">Tas atrodas starp saviem diviem operandiem: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vai pirmais operands ir dalāms ar otro?<\/span> <span class=\"sg\" data-s=\"3\">Tad rezultāts ir Būla vērtība <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ja nē, rezultāts ir <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Veselo skaitļu operācijas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažas īpašas operācijas dod veselu skaitļu rezultātus.<\/span> <span class=\"sg\" data-s=\"1\">To operatori ir vārdi, nevis simboli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Veselo skaitļu dalīšana <code>mod<\/code> | Veselo skaitļu modulis<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operators <code>div<\/code> noapaļo rezultātu uz leju.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>10 div 3<\/code> ir <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>-10 div 3<\/code> ir <code>-4<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoriem <code>div<\/code> un <code>mod<\/code> vajag veselu skaitļu operandus.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet rindas ar atzīmi <code>Kļūda<\/code> programmā zemāk.<\/span> <span class=\"sg\" data-s=\"2\">Ja jūs no tām noņemat <code>#<\/code>, programma nestrādā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Kļūda\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Kļūda<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pakāpe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir divi veidi, kā iegūt <em>x<\/em> pakāpē <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais veids ir operators <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Otrais veids ir izmantot augšraksta ciparus.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir mazi cipari rindas augšā.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot arī divus vai vairāk augšraksta ciparus.<\/span> <span class=\"sg\" data-s=\"1\">Tad pakāpe var būt lielāka par 9.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Negatīva pakāpe arī strādā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka pēdējās divas izteiksmes dod <code>Rat<\/code> skaitli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operācijas ar piešķiršanu<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag atjaunināt mainīgo ar kādu operāciju.<\/span> <span class=\"sg\" data-s=\"1\">Visām operācijām tam ir īsa forma.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir piemērs ar <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pilnā forma<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">ir tas pats, kas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"uk":{"t":"Операції з числами","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ми впевнені, що ви вже знаєте деякі операції з числами в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ось два слова, які варто запам'ятати.<\/span> <span class=\"sg\" data-s=\"2\">Символ <em>операції<\/em> називається <em>оператором<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Операція працює з деякими об'єктами.<\/span> <span class=\"sg\" data-s=\"4\">Вони називаються <em>операндами<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операція<\/strong> <code>+<\/code> | Додавання <code>-<\/code> | Віднімання <code>*<\/code> | Множення <code>/<\/code> | Ділення<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku дуже добре <a href=\"https://course.raku.org/uk/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">підтримує Unicode<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Тому деякі з цих операторів мають ще одну форму з не-ASCII символами:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Множення <code>÷<\/code> | Ділення<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Використовуйте дужки, щоб змінити порядок операцій:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модуль<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор модуля — це <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У багатьох інших мовах він такий самий.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Модуль<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Він дає залишок від цілочисельного ділення двох чисел.<\/span> <span class=\"sg\" data-s=\"1\">Залишок — це те, що лишається після ділення.<\/span> <span class=\"sg\" data-s=\"2\">Тому <code>10 % 3<\/code> дорівнює <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Але зверніть увагу: <code>-10 % 3<\/code> дорівнює <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ось чому.<\/span> <span class=\"sg\" data-s=\"5\">Поділіть перше число на друге.<\/span> <span class=\"sg\" data-s=\"6\">Округліть результат вниз.<\/span> <span class=\"sg\" data-s=\"7\">Помножте його на друге число.<\/span> <span class=\"sg\" data-s=\"8\">Потім відніміть це від першого числа.<\/span> <span class=\"sg\" data-s=\"9\">Це і є результат <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Тож <code>$a % $b<\/code> — те саме, що <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кратність<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku також є корисний оператор для подільності чисел.<\/span> <span class=\"sg\" data-s=\"1\">Він перевіряє, чи ділиться одне число на інше.<\/span> <span class=\"sg\" data-s=\"2\">Це означає, що залишку немає.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Кратність<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це інфіксний оператор.<\/span> <span class=\"sg\" data-s=\"1\">Він стоїть між двома операндами: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Перший операнд ділиться на другий?<\/span> <span class=\"sg\" data-s=\"3\">Тоді результат — булеве значення <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Якщо ні, результат — <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цілі операції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі спеціальні операції дають у результаті цілі числа.<\/span> <span class=\"sg\" data-s=\"1\">Їхні оператори — це слова, а не символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Ціле ділення <code>mod<\/code> | Цілий модуль<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>div<\/code> округлює результат вниз.<\/span> <span class=\"sg\" data-s=\"1\">Тому <code>10 div 3<\/code> дорівнює <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А <code>-10 div 3<\/code> дорівнює <code>-4<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">І <code>div<\/code>, і <code>mod<\/code> потребують цілих операндів.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на рядки з позначкою <code>Error<\/code> у програмі нижче.<\/span> <span class=\"sg\" data-s=\"2\">Якщо прибрати з них <code>#<\/code>, програма не працює:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степінь<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Є два способи піднести <em>x<\/em> до степеня <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Перший спосіб — оператор <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Другий спосіб — використати надрядкові цифри.<\/span> <span class=\"sg\" data-s=\"1\">Це маленькі цифри вгорі рядка.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можна також використати дві або більше надрядкових цифр.<\/span> <span class=\"sg\" data-s=\"1\">Тоді степінь може бути більшим за 9.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Від'ємний степінь теж працює:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу: останні два вирази дають число типу <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Операції з присвоєнням<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді потрібно оновити змінну за допомогою операції.<\/span> <span class=\"sg\" data-s=\"1\">Усі операції мають для цього коротку форму.<\/span> <span class=\"sg\" data-s=\"2\">Ось приклад із <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повна форма<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">це те саме, що:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"bg":{"t":"Операции с числа","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Сигурни сме, че вече знаете някои операции с числа в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ето две думи за запомняне.<\/span> <span class=\"sg\" data-s=\"2\">Символът на една <em>операция<\/em> се нарича <em>оператор<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Операцията работи с някакви обекти.<\/span> <span class=\"sg\" data-s=\"4\">Те се наричат <em>операнди<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операция<\/strong> <code>+<\/code> | Събиране <code>-<\/code> | Изваждане <code>*<\/code> | Умножение <code>/<\/code> | Деление<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku <a href=\"https://course.raku.org/bg/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">поддържа Unicode<\/a> много добре.<\/span> <span class=\"sg\" data-s=\"1\">Затова някои от тези оператори имат и втора форма с не-ASCII символи:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Умножение <code>÷<\/code> | Деление<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Използвайте скоби, за да промените реда на операциите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модуло<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторът за модуло е <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той е същият в много други езици.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Модуло<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Той дава остатъка от целочисленото деление на две числа.<\/span> <span class=\"sg\" data-s=\"1\">Остатъкът е това, което остава след делението.<\/span> <span class=\"sg\" data-s=\"2\">Така <code>10 % 3<\/code> е <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но забележете, че <code>-10 % 3<\/code> е <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ето защо.<\/span> <span class=\"sg\" data-s=\"5\">Разделете първото число на второто число.<\/span> <span class=\"sg\" data-s=\"6\">Закръглете резултата надолу.<\/span> <span class=\"sg\" data-s=\"7\">Умножете го по второто число.<\/span> <span class=\"sg\" data-s=\"8\">После извадете това от първото число.<\/span> <span class=\"sg\" data-s=\"9\">Това е резултатът от <code>%<\/code>.<\/span> <span class=\"sg\" data-s=\"10\">Така <code>$a % $b<\/code> е същото като <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Делимост<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има и полезен оператор за делимост.<\/span> <span class=\"sg\" data-s=\"1\">Той проверява дали едно число се дели на друго.<\/span> <span class=\"sg\" data-s=\"2\">Това значи, че няма остатък.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Делимост<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това е инфиксен оператор.<\/span> <span class=\"sg\" data-s=\"1\">Той стои между двата си операнда: <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Дели ли се първият операнд на втория?<\/span> <span class=\"sg\" data-s=\"3\">Тогава резултатът е булевата стойност <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ако не, резултатът е <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Целочислени операции<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои специални операции дават цели числа като резултат.<\/span> <span class=\"sg\" data-s=\"1\">Техните оператори са думи, а не символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Целочислено деление <code>mod<\/code> | Целочислено модуло<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>div<\/code> закръгля резултата надолу.<\/span> <span class=\"sg\" data-s=\"1\">Така <code>10 div 3<\/code> е <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А <code>-10 div 3<\/code> е <code>-4<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">И <code>div<\/code>, и <code>mod<\/code> искат целочислени операнди.<\/span> <span class=\"sg\" data-s=\"1\">Вижте редовете с <code>Error<\/code> в програмата по-долу.<\/span> <span class=\"sg\" data-s=\"2\">Ако махнете <code>#<\/code> от тях, програмата не работи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степенуване<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Има два начина да получите <em>x<\/em> на степен <em>y<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Първият начин е операторът <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вторият начин е да използвате надписани цифри.<\/span> <span class=\"sg\" data-s=\"1\">Това са малки цифри в горната част на реда.<\/span> <span class=\"sg\" data-s=\"2\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате и две или повече надписани цифри.<\/span> <span class=\"sg\" data-s=\"1\">Тогава степента може да е по-голяма от 9.<\/span> <span class=\"sg\" data-s=\"2\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отрицателна степен също работи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че последните два израза дават число <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Операции с п
