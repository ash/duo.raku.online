\" data-s=\"2\">Raku ve <code>0.1<\/code>, <code>0.2<\/code> y <code>0.3<\/code> como números racionales.<\/span> <span class=\"sg\" data-s=\"3\">Por dentro, los guarda como <code>1/10<\/code>, <code>2/10<\/code> y <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ejecuta el código desde la línea de comandos y compruébalo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Formas Unicode<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">También puedes usar caracteres Unicode para las fracciones, como <code>½<\/code>, <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tal vez no siempre son fáciles de escribir con el teclado.<\/span> <span class=\"sg\" data-s=\"2\">Pero son exactamente los mismos valores que sus versiones ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Una versión ASCII puede ser una fracción o un número decimal:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Algunas fracciones, como <code>1/3<\/code>, tienen menos formas: solo <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La forma decimal no sirve para ellas.<\/span> <span class=\"sg\" data-s=\"2\">Necesita un número infinito de dígitos.<\/span><\/p>"]]},"it":{"t":"Numeri razionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I numeri razionali sono una caratteristica unica di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Il loro tipo di dato è <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dentro Raku, un numero razionale è una frazione.<\/span> <span class=\"sg\" data-s=\"1\">Ha due parti intere.<\/span> <span class=\"sg\" data-s=\"2\">Il numeratore sta sopra e il denominatore sta sotto.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi salvare facilmente numeri come 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Restano esatti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ci sono alcuni modi per scrivere un numero <code>Rat<\/code> in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota che qui la barra fa parte del modo di scrivere il numero.<\/span> <span class=\"sg\" data-s=\"1\">Non è un operatore di divisione.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>1/2<\/code> non vuol dire ‘dividi 1 per 2’.<\/span> <span class=\"sg\" data-s=\"3\">Ma Raku stampa i numeri razionali come numeri decimali o interi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il testo dopo il simbolo <code>#<\/code> è un commento.<\/span> <span class=\"sg\" data-s=\"1\">Il compilatore lo ignora.<\/span> <span class=\"sg\" data-s=\"2\">Nel corso, questi commenti mostrano l'output del programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Questo è importante da sapere.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scrivere un numero in forma decimale, per esempio, <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Allora Raku crea un numero <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Non è un intero.<\/span> <span class=\"sg\" data-s=\"4\">Ma non è nemmeno un numero a virgola mobile.<\/span> <span class=\"sg\" data-s=\"5\">Altri linguaggi chiamano questi numeri <code>float<\/code> o <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">È comunque un numero razionale!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Guarda questo esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un linguaggio di programmazione può usare l'aritmetica a virgola mobile per questi calcoli.<\/span> <span class=\"sg\" data-s=\"1\">Allora il risultato non è 0.<\/span> <span class=\"sg\" data-s=\"2\">Il sito <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> ha una lista completa di esempi così.<\/span> <span class=\"sg\" data-s=\"3\">In questi esempi, l'aritmetica a virgola mobile non dà il risultato che ti aspetti.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ma Raku stampa esattamente <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Perché?<\/span> <span class=\"sg\" data-s=\"2\">Raku vede <code>0.1<\/code>, <code>0.2<\/code> e <code>0.3<\/code> come numeri razionali.<\/span> <span class=\"sg\" data-s=\"3\">Dentro, li tiene come <code>1/10<\/code>, <code>2/10<\/code> e <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Esegui il codice dalla riga di comando e controlla:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forme Unicode<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi anche usare i caratteri Unicode per le frazioni, come <code>½<\/code>, <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Forse non sono sempre facili da scrivere con la tastiera.<\/span> <span class=\"sg\" data-s=\"2\">Ma hanno esattamente gli stessi valori delle loro versioni ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Una versione ASCII può essere una frazione o un numero decimale:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Alcune frazioni, come <code>1/3<\/code>, hanno meno forme: solo <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una forma decimale per loro non funziona.<\/span> <span class=\"sg\" data-s=\"2\">Ha bisogno di un numero infinito di cifre.<\/span><\/p>"]]},"lv":{"t":"Racionālie skaitļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Racionālie skaitļi ir unikāla Raku iezīme.<\/span> <span class=\"sg\" data-s=\"1\">To datu tips ir <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku iekšienē racionāls skaitlis ir daļskaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir divas veselu skaitļu daļas.<\/span> <span class=\"sg\" data-s=\"2\">Skaitītājs ir augšā, un saucējs ir apakšā.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat viegli glabāt tādus skaitļus kā 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Tie paliek precīzi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir daži veidi, kā Raku valodā uzrakstīt <code>Rat<\/code> skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka slīpsvītra šeit ir daļa no skaitļa pieraksta.<\/span> <span class=\"sg\" data-s=\"1\">Tā nav dalīšanas operators.<\/span> <span class=\"sg\" data-s=\"2\">Tātad <code>1/2<\/code> nenozīmē ‘daliet 1 ar 2’.<\/span> <span class=\"sg\" data-s=\"3\">Bet Raku izdrukā racionālos skaitļus kā decimālskaitļus vai veselus skaitļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Teksts pēc simbola <code>#<\/code> ir komentārs.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators to ignorē.<\/span> <span class=\"sg\" data-s=\"2\">Kursā šie komentāri parāda programmas izvadi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimāldaļas forma<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tas ir svarīgi zināt.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat uzrakstīt skaitli decimāldaļas formā, piemēram, <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku izveido <code>Rat<\/code> skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Tas nav vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas nav arī peldošā punkta skaitlis.<\/span> <span class=\"sg\" data-s=\"5\">Citās valodās tādus skaitļus sauc par <code>float<\/code> vai <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tas joprojām ir racionāls skaitlis!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šo piemēru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programmēšanas valoda šiem aprēķiniem var izmantot peldošā punkta aritmētiku.<\/span> <span class=\"sg\" data-s=\"1\">Tad rezultāts nav 0.<\/span> <span class=\"sg\" data-s=\"2\">Vietnē <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> ir pilns šādu piemēru saraksts.<\/span> <span class=\"sg\" data-s=\"3\">Tajos peldošā punkta aritmētika nedod gaidīto rezultātu.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bet Raku izdrukā tieši <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kāpēc?<\/span> <span class=\"sg\" data-s=\"2\">Raku uztver <code>0.1<\/code>, <code>0.2<\/code> un <code>0.3<\/code> kā racionālus skaitļus.<\/span> <span class=\"sg\" data-s=\"3\">Iekšēji tas tos glabā kā <code>1/10<\/code>, <code>2/10<\/code> un <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Palaidiet kodu no komandrindas un pārbaudiet:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikoda formas<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot arī Unikoda rakstzīmes daļskaitļiem, piemēram, <code>½<\/code>, <code>¼<\/code> vai <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Varbūt tās ne vienmēr ir viegli ierakstīt ar tastatūru.<\/span> <span class=\"sg\" data-s=\"2\">Bet tās ir tieši tādas pašas vērtības kā to ASCII versijas.<\/span> <span class=\"sg\" data-s=\"3\">ASCII versija var būt daļskaitlis vai decimālskaitlis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažiem daļskaitļiem, piemēram, <code>1/3<\/code>, ir mazāk formu: tikai <code>⅓<\/code> vai <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Decimāldaļas forma tiem neder.<\/span> <span class=\"sg\" data-s=\"2\">Tai vajag bezgalīgi daudz ciparu.<\/span><\/p>"]]},"ru":{"t":"Рациональные числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рациональные числа — это уникальная особенность Raku.<\/span> <span class=\"sg\" data-s=\"1\">Их тип данных — <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Внутри Raku рациональное число — это дробь.<\/span> <span class=\"sg\" data-s=\"1\">У неё две целые части.<\/span> <span class=\"sg\" data-s=\"2\">Числитель стоит сверху, а знаменатель снизу.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому вы можете легко хранить числа вроде 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Они остаются точными.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Есть несколько способов записать число <code>Rat<\/code> в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что косая черта здесь — часть записи числа.<\/span> <span class=\"sg\" data-s=\"1\">Это не оператор деления.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>1/2<\/code> не значит «раздели 1 на 2».<\/span> <span class=\"sg\" data-s=\"3\">Но Raku выводит рациональные числа как десятичные или целые числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Текст после знака <code>#<\/code> — это комментарий.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор его пропускает.<\/span> <span class=\"sg\" data-s=\"2\">В курсе такие комментарии показывают вывод программы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десятичная форма<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Это важно знать.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете записать число в десятичной форме, например, <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогда Raku создаёт число <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это не целое число.<\/span> <span class=\"sg\" data-s=\"4\">Но это и не число с плавающей точкой.<\/span> <span class=\"sg\" data-s=\"5\">Другие языки называют такие числа <code>float<\/code> или <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Это всё равно рациональное число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на этот пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Язык программирования может использовать для этих вычислений арифметику с плавающей точкой.<\/span> <span class=\"sg\" data-s=\"1\">Тогда результат не равен 0.<\/span> <span class=\"sg\" data-s=\"2\">На сайте <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> есть полный список таких примеров.<\/span> <span class=\"sg\" data-s=\"3\">В них арифметика с плавающей точкой даёт не тот результат, который вы ждёте.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Но Raku выводит ровно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Почему?<\/span> <span class=\"sg\" data-s=\"2\">Raku видит <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> как рациональные числа.<\/span> <span class=\"sg\" data-s=\"3\">Внутри он хранит их как <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Запустите код из командной строки и проверьте:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для дробей вы также можете использовать символы Юникода, например <code>½<\/code>, <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Может быть, их не всегда легко набрать на клавиатуре.<\/span> <span class=\"sg\" data-s=\"2\">Но это точно такие же значения, как их версии в ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Версия в ASCII может быть дробью или десятичным числом:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У некоторых дробей, например <code>1/3<\/code>, меньше форм: только <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Десятичная форма для них не подходит.<\/span> <span class=\"sg\" data-s=\"2\">Ей нужно бесконечное число цифр.<\/span><\/p>"]]},"uk":{"t":"Раціональні числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Раціональні числа — унікальна особливість Raku.<\/span> <span class=\"sg\" data-s=\"1\">Їхній тип даних — <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всередині Raku раціональне число — це дріб.<\/span> <span class=\"sg\" data-s=\"1\">Він має дві цілі частини.<\/span> <span class=\"sg\" data-s=\"2\">Чисельник стоїть зверху, а знаменник — знизу.<\/span> <span class=\"sg\" data-s=\"3\">Тому можна легко зберігати числа на зразок 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Вони залишаються точними.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Є кілька способів записати число <code>Rat<\/code> у Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу: слеш тут — частина запису числа.<\/span> <span class=\"sg\" data-s=\"1\">Це не оператор ділення.<\/span> <span class=\"sg\" data-s=\"2\">Тому <code>1/2<\/code> не означає «поділити 1 на 2».<\/span> <span class=\"sg\" data-s=\"3\">Але Raku виводить раціональні числа як десяткові або цілі числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Текст після символу <code>#<\/code> — це коментар.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор його ігнорує.<\/span> <span class=\"sg\" data-s=\"2\">У курсі такі коментарі показують вивід програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десяткова форма<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Це важливо знати.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете записати число в десятковій формі, наприклад, <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тоді Raku створює число <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це не ціле число.<\/span> <span class=\"sg\" data-s=\"4\">Але це й не число з плаваючою комою.<\/span> <span class=\"sg\" data-s=\"5\">В інших мовах такі числа називають <code>float<\/code> або <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Це все одно раціональне число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подивіться на цей приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Мова програмування може використовувати для цих обчислень арифметику з плаваючою комою.<\/span> <span class=\"sg\" data-s=\"1\">Тоді результат не дорівнює 0.<\/span> <span class=\"sg\" data-s=\"2\">На вебсайті <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> є повний список таких прикладів.<\/span> <span class=\"sg\" data-s=\"3\">У них арифметика з плаваючою комою не дає результату, який ви очікуєте.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Але Raku виводить точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чому?<\/span> <span class=\"sg\" data-s=\"2\">Raku бачить <code>0.1<\/code>, <code>0.2<\/code> і <code>0.3<\/code> як раціональні числа.<\/span> <span class=\"sg\" data-s=\"3\">Всередині він зберігає їх як <code>1/10<\/code>, <code>2/10<\/code> і <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Запустіть код із командного рядка і перевірте:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні форми<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для дробів можна також використовувати символи Unicode, наприклад <code>½<\/code>, <code>¼<\/code> або <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, їх не завжди легко набрати на клавіатурі.<\/span> <span class=\"sg\" data-s=\"2\">Але це точно такі самі значення, як їхні ASCII версії.<\/span> <span class=\"sg\" data-s=\"3\">ASCII версія може бути дробом або десятковим числом:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Деякі дроби, як <code>1/3<\/code>, мають менше форм: лише <code>⅓<\/code> або <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Десяткова форма для них не працює.<\/span> <span class=\"sg\" data-s=\"2\">Їй потрібна нескінченна кількість цифр.<\/span><\/p>"]]},"bg":{"t":"Рационални числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рационалните числа са уникална особеност на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Техният тип данни е <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вътре в Raku рационалното число е дроб.<\/span> <span class=\"sg\" data-s=\"1\">Тя има две цели части.<\/span> <span class=\"sg\" data-s=\"2\">Числителят е отгоре, а знаменателят е отдолу.<\/span> <span class=\"sg\" data-s=\"3\">Така можете лесно да пазите числа като 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Те остават точни.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Има няколко начина да запишете число <code>Rat<\/code> в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Забележете, че наклонената черта тук е част от записа на числото.<\/span> <span class=\"sg\" data-s=\"1\">Тя не е оператор за деление.<\/span> <span class=\"sg\" data-s=\"2\">Така <code>1/2<\/code> не значи „раздели 1 на 2“.<\/span> <span class=\"sg\" data-s=\"3\">Но Raku отпечатва рационалните числа като десетични числа или цели числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Текстът след символа <code>#<\/code> е коментар.<\/span> <span class=\"sg\" data-s=\"1\">Компилаторът го пропуска.<\/span> <span class=\"sg\" data-s=\"2\">В курса тези коментари показват изхода на програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десетична форма<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Важно е да знаете това.<\/span> <span class=\"sg\" data-s=\"1\">Можете да запишете число в десетична форма, например <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогава Raku създава число <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">То не е цяло число.<\/span> <span class=\"sg\" data-s=\"4\">Но не е и число с плаваща запетая.<\/span> <span class=\"sg\" data-s=\"5\">Другите езици наричат такива числа <code>float<\/code> или <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">То пак е рационално число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вижте този пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Един език за програмиране може да използва аритметика с плаваща запетая за тези изчисления.<\/span> <span class=\"sg\" data-s=\"1\">Тогава резултатът не е 0.<\/span> <span class=\"sg\" data-s=\"2\">Сайтът <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> има пълен списък с такива примери.<\/span> <span class=\"sg\" data-s=\"3\">В тях аритметиката с плаваща запетая не дава резултата, който очаквате.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Но Raku отпечатва точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Защо?<\/span> <span class=\"sg\" data-s=\"2\">Raku вижда <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> като рационални числа.<\/span> <span class=\"sg\" data-s=\"3\">Вътре той ги пази като <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Стартирайте кода от командния ред и проверете:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode форми<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате и Unicode символи за дроби, като <code>½<\/code>, <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Може би не винаги е лесно да ги напишете с клавиатурата.<\/span> <span class=\"sg\" data-s=\"2\">Но те са точно същите стойности като техните ASCII версии.<\/span> <span class=\"sg\" data-s=\"3\">Една ASCII версия може да е дроб или десетично число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Някои дроби, като <code>1/3<\/code>, имат по-малко форми: само <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Десетичната форма не работи за тях.<\/span> <span class=\"sg\" data-s=\"2\">Тя има нужда от безкрайно много цифри.<\/span><\/p>"]]},"eo":{"t":"Raciaj nombroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raciaj nombroj estas unika trajto de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ilia datumtipo estas <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ene de Raku, racia nombro estas frakcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas du entjerajn partojn.<\/span> <span class=\"sg\" data-s=\"2\">La numeratoro estas supre, kaj la denominatoro estas sube.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas facile konservi nombrojn kiel 1/3.<\/span> <span class=\"sg\" data-s=\"4\">Ili restas ekzaktaj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas kelkaj manieroj skribi <code>Rat<\/code> nombron en Raku:<\/span><\/p>"] umeri rationales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeri rationales sunt proprietas singularis Raku.<\/span> <span class=\"sg\" data-s=\"1\">Eorum typus datae est <code>Rat<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Intus in Raku numerus rationalis est fractio.<\/span> <span class=\"sg\" data-s=\"1\">Duas partes integras habet.<\/span> <span class=\"sg\" data-s=\"2\">Numerator supra est, et denominator infra.<\/span> <span class=\"sg\" data-s=\"3\">Ita numeros ut 1/3 facile servare potes.<\/span> <span class=\"sg\" data-s=\"4\">Exacti manent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Numerum <code>Rat<\/code> in Raku pluribus modis scribere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota: virgula hic est pars scripturae numeri.<\/span> <span class=\"sg\" data-s=\"1\">Non est operator divisionis.<\/span> <span class=\"sg\" data-s=\"2\">Ita <code>1/2<\/code> non significat ‘divide 1 per 2’.<\/span> <span class=\"sg\" data-s=\"3\">Sed Raku numeros rationales ut numeros decimales vel integros imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Textus post symbolum <code>#<\/code> est commentarium.<\/span> <span class=\"sg\" data-s=\"1\">Compilator eum ignorat.<\/span> <span class=\"sg\" data-s=\"2\">In cursu haec commentaria exitum programmatis ostendunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hoc scire gravissimum est.<\/span> <span class=\"sg\" data-s=\"1\">Numerum in forma decimali scribere potes, exempli gratia, <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tum Raku numerum <code>Rat<\/code> facit.<\/span> <span class=\"sg\" data-s=\"3\">Non est numerus integer.<\/span> <span class=\"sg\
