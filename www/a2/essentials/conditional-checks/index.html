<script type="application/json" id="page-data">{"u":"essentials/conditional-checks","n":126,"k":"section","pv":"essentials/code-blocks/local-variables/quiz","nx":"essentials/conditional-checks/if","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Conditional checks","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes a program must do different things in different situations.<\/span> <span class=\"sg\" data-s=\"1\">For this, you can use <code>if<\/code> and similar words.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">All of them need a condition.<\/span> <span class=\"sg\" data-s=\"1\">The condition can be a <a href=\"/essentials/booleans/\">Boolean<\/a> value, <code>True<\/code> or <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It can be a Boolean expression.<\/span> <span class=\"sg\" data-s=\"3\">Such an expression gives <code>True<\/code> or <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Or it can be any other expression.<\/span> <span class=\"sg\" data-s=\"5\">Raku must be able to <a href=\"/essentials/coercion/\">change<\/a> its value into <code>True<\/code> or <code>False<\/code>.<\/span><\/p>"]]},"de":{"t":"Bedingte Überprüfungen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal muss ein Programm in verschiedenen Situationen verschiedene Dinge tun.<\/span> <span class=\"sg\" data-s=\"1\">Dafür können Sie <code>if<\/code> und ähnliche Wörter benutzen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Alle diese Wörter brauchen eine Bedingung.<\/span> <span class=\"sg\" data-s=\"1\">Die Bedingung kann ein <a href=\"https://course.raku.org/de/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolean<\/a>-Wert sein, <code>True<\/code> oder <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie kann ein Boolean-Ausdruck sein.<\/span> <span class=\"sg\" data-s=\"3\">So ein Ausdruck ergibt <code>True<\/code> oder <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Oder sie kann jeder andere Ausdruck sein.<\/span> <span class=\"sg\" data-s=\"5\">Raku muss seinen Wert in <code>True<\/code> oder <code>False<\/code> <a href=\"https://course.raku.org/de/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">ändern<\/a> können.<\/span><\/p>"]]},"nl":{"t":"Voorwaardelijke controles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms moet een programma verschillende dingen doen in verschillende situaties.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor kun je <code>if<\/code> en vergelijkbare woorden gebruiken.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ze hebben allemaal een voorwaarde nodig.<\/span> <span class=\"sg\" data-s=\"1\">De voorwaarde kan een <a href=\"https://course.raku.org/nl/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleaanse<\/a> waarde zijn, <code>True<\/code> of <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het kan een Booleaanse expressie zijn.<\/span> <span class=\"sg\" data-s=\"3\">Zo'n expressie geeft <code>True<\/code> of <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Of het kan een andere expressie zijn.<\/span> <span class=\"sg\" data-s=\"5\">Raku moet de waarde ervan kunnen <a href=\"https://course.raku.org/nl/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">omzetten<\/a> naar <code>True<\/code> of <code>False<\/code>.<\/span><\/p>"]]},"es":{"t":"Controles condicionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces un programa debe hacer cosas diferentes en situaciones diferentes.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, puedes usar <code>if<\/code> y palabras parecidas.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Todos necesitan una condición.<\/span> <span class=\"sg\" data-s=\"1\">La condición puede ser un valor <a href=\"https://course.raku.org/es/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleano<\/a>, <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puede ser una expresión Booleana.<\/span> <span class=\"sg\" data-s=\"3\">Una expresión así da <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">O puede ser cualquier otra expresión.<\/span> <span class=\"sg\" data-s=\"5\">Raku debe poder <a href=\"https://course.raku.org/es/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">cambiar<\/a> su valor a <code>True<\/code> o <code>False<\/code>.<\/span><\/p>"]]},"it":{"t":"Controlli condizionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte un programma deve fare cose diverse in situazioni diverse.<\/span> <span class=\"sg\" data-s=\"1\">Per questo puoi usare <code>if<\/code> e parole simili.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tutti hanno bisogno di una condizione.<\/span> <span class=\"sg\" data-s=\"1\">La condizione può essere un valore <a href=\"https://course.raku.org/it/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">booleano<\/a>, <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Può essere un'espressione booleana.<\/span> <span class=\"sg\" data-s=\"3\">Questa espressione dà <code>True<\/code> o <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Oppure può essere qualsiasi altra espressione.<\/span> <span class=\"sg\" data-s=\"5\">Raku deve poter <a href=\"https://course.raku.org/it/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">cambiare<\/a> il suo valore in <code>True<\/code> o <code>False<\/code>.<\/span><\/p>"]]},"lv":{"t":"Nosacījumu pārbaudes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz programmai dažādās situācijās jādara dažādas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Tam jūs varat izmantot <code>if<\/code> un līdzīgus vārdus.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Visām tām vajag nosacījumu.<\/span> <span class=\"sg\" data-s=\"1\">Nosacījums var būt <a href=\"https://course.raku.org/lv/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Būla<\/a> vērtība, <code>True<\/code> vai <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas var būt Būla izteiksme.<\/span> <span class=\"sg\" data-s=\"3\">Šāda izteiksme dod <code>True<\/code> vai <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vai arī tas var būt jebkura cita izteiksme.<\/span> <span class=\"sg\" data-s=\"5\">Raku jāspēj <a href=\"https://course.raku.org/lv/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">pārvērst<\/a> tās vērtību par <code>True<\/code> vai <code>False<\/code>.<\/span><\/p>"]]},"ru":{"t":"Проверка условий","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда программа должна делать разные вещи в разных ситуациях.<\/span> <span class=\"sg\" data-s=\"1\">Для этого можно использовать <code>if<\/code> и похожие слова.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Им всем нужно условие.<\/span> <span class=\"sg\" data-s=\"1\">Условие может быть <a href=\"https://course.raku.org/ru/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булевым<\/a> значением: <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Оно может быть булевым выражением.<\/span> <span class=\"sg\" data-s=\"3\">Такое выражение даёт <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Или это может быть любое другое выражение.<\/span> <span class=\"sg\" data-s=\"5\">Raku должен уметь <a href=\"https://course.raku.org/ru/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">превратить<\/a> его значение в <code>True<\/code> или <code>False<\/code>.<\/span><\/p>"]]},"uk":{"t":"Умовні перевірки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді програма має робити різні речі в різних ситуаціях.<\/span> <span class=\"sg\" data-s=\"1\">Для цього ви можете використати <code>if<\/code> і схожі слова.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Усім їм потрібна умова.<\/span> <span class=\"sg\" data-s=\"1\">Умова може бути <a href=\"https://course.raku.org/uk/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булевим<\/a> значенням, <code>True<\/code> або <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вона може бути булевим виразом.<\/span> <span class=\"sg\" data-s=\"3\">Такий вираз дає <code>True<\/code> або <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Або це може бути будь-який інший вираз.<\/span> <span class=\"sg\" data-s=\"5\">Raku має вміти <a href=\"https://course.raku.org/uk/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">перетворити<\/a> його значення на <code>True<\/code> або <code>False<\/code>.<\/span><\/p>"]]},"bg":{"t":"Условни проверки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога програмата трябва да прави различни неща в различни ситуации.<\/span> <span class=\"sg\" data-s=\"1\">За това можете да използвате <code>if<\/code> и подобни думи.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Всички те имат нужда от условие.<\/span> <span class=\"sg\" data-s=\"1\">Условието може да е <a href=\"https://course.raku.org/bg/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булева<\/a> стойност, <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">То може да е булев израз.<\/span> <span class=\"sg\" data-s=\"3\">Такъв израз дава <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Или може да е всеки друг израз.<\/span> <span class=\"sg\" data-s=\"5\">Raku трябва да може да <a href=\"https://course.raku.org/bg/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">превърне<\/a> неговата стойност в <code>True<\/code> или <code>False<\/code>.<\/span><\/p>"]]},"eo":{"t":"Kondiĉaj kontroloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje programo devas fari malsamajn aferojn en malsamaj situacioj.<\/span> <span class=\"sg\" data-s=\"1\">Por tio vi povas uzi <code>if<\/code> kaj similajn vortojn.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj el ili bezonas kondiĉon.<\/span> <span class=\"sg\" data-s=\"1\">La kondiĉo povas esti <a href=\"https://course.raku.org/eo/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Boolea<\/a> valoro, <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas esti Boolea esprimo.<\/span> <span class=\"sg\" data-s=\"3\">Tia esprimo donas <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Aŭ ĝi povas esti iu ajn alia esprimo.<\/span> <span class=\"sg\" data-s=\"5\">Raku devas povi <a href=\"https://course.raku.org/eo/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">ŝanĝi<\/a> ĝian valoron al <code>True<\/code> aŭ <code>False<\/code>.<\/span><\/p>"]]},"la":{"t":"Conditiones comprobationes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum programma in diversis casibus diversa facere debet.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <code>if<\/code> et similia verba adhibere potes.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Omnia haec condicionem requirunt.<\/span> <span class=\"sg\" data-s=\"1\">Condicio potest esse valor <a href=\"https://course.raku.org/la/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">Booleanus<\/a>, <code>True<\/code> aut <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Potest esse expressio Booleana.<\/span> <span class=\"sg\" data-s=\"3\">Talis expressio <code>True<\/code> aut <code>False<\/code> dat.<\/span> <span class=\"sg\" data-s=\"4\">Aut potest esse quaelibet alia expressio.<\/span> <span class=\"sg\" data-s=\"5\">Raku debet posse valorem eius in <code>True<\/code> aut <code>False<\/code> <a href=\"https://course.raku.org/la/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">mutare<\/a>.<\/span><\/p>"]]}}}</script>
