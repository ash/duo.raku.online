itli, <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>Rat<\/code> skaitļiem jūs šeit nezaudējat precizitāti.<\/span> <span class=\"sg\" data-s=\"3\">Raku saglabā visus ciparus.<\/span> <span class=\"sg\" data-s=\"4\">Pēdējā piemērā ir <code>2e17<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tas izmanto <code>Num<\/code> skaitļus.<\/span> <span class=\"sg\" data-s=\"6\">To precizitāte ir ierobežota.<\/span> <span class=\"sg\" data-s=\"7\">Tie nevar saglabāt visus ciparus.<\/span><\/p>"]]},"ru":{"t":"Сравнение чисел","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Используйте эти операторы, чтобы сравнить два числа.<\/span> <span class=\"sg\" data-s=\"1\">Вы знаете другие языки программирования?<\/span> <span class=\"sg\" data-s=\"2\">Тогда они все вам хорошо понятны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Равно <code>!=<\/code> | Не равно <code>&lt;<\/code> | Меньше <code>&lt;=<\/code> | Меньше или равно <code>&gt;<\/code> | Больше <code>&gt;=<\/code> | Больше или равно<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизительно равно<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">В Raku есть стандартные операторы.<\/span> <span class=\"sg\" data-s=\"1\">И ещё Raku добавляет один оператор: <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Этот оператор проверяет, что два числа почти равны.<\/span> <span class=\"sg\" data-s=\"3\">Результат равен <code>True<\/code>, если числа близки.<\/span> <span class=\"sg\" data-s=\"4\">Raku сравнивает разницу с размером самих чисел.<\/span> <span class=\"sg\" data-s=\"5\">Так получается относительная разница.<\/span> <span class=\"sg\" data-s=\"6\">Она не должна быть больше встроенного значения <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Это значение равно <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",1,"<p><span class=\" pan> <span class=\"sg\" data-s=\"2\">З числами <code>Rat<\/code> ви тут не втрачаєте точність.<\/span> <span class=\"sg\" data-s=\"3\">Raku зберігає всі цифри.<\/span> <span class=\"sg\" data-s=\"4\">В останньому прикладі є <code>2e17<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Він використовує числа типу <code>Num<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Їхня точність обмежена.<\/span> <span class=\"sg\" data-s=\"7\">Вони не можуть зберегти всі цифри.<\/span><\/p>"]]},"bg":{"t":"Сравняване на числа","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Използвайте тези оператори, за да сравните две числа.<\/span> <span class=\"sg\" data-s=\"1\">Знаете ли други езици за програмиране?<\/span> <span class=\"sg\" data-s=\"2\">Тогава всички те са ви много ясни.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Равно <code>!=<\/code> | Не е равно <code>&lt;<\/code> | По-малко от <code>&lt;=<\/code> | По-малко или равно <code>&gt;<\/code> | По-голямо от <code>&gt;=<\/code> | По-голямо или равно<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизително равно<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku има стандартните оператори.<\/span> <span class=\"sg\" data-s=\"1\">Той добавя и още един: <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Този оператор проверява дали две числа са почти равни.<\/span> <span class=\"sg\" data-s=\"3\">Резултатът е <code>True<\/code>, ако числата са близки.<\/span> <span class=\"sg\" data-s=\"4\">Raku сравнява разликата с размера на числата.<\/span> <span class=\"sg\" data-s=\"5\">Така се получава относителната разлика.<\/span> <span class=\"sg\" data-s=\"6\">Тя не трябва да е по-голяма от вградената стойност <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Тази стойност е <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode версии<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои от тези оператори gala<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Proksimume-egala<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku havas la normajn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ aldonas unu plian: <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu operatoro kontrolas, ĉu du nombroj estas preskaŭ egalaj.<\/span> <span class=\"sg\" data-s=\"3\">La rezulto estas <code>True<\/code>, se la nombroj estas proksimaj.<\/span> <span class=\"sg\" data-s=\"4\">Raku komparas la diferencon kun la grandeco de la nombroj.<\/span> <span class=\"sg\" data-s=\"5\">Tio donas la relativan diferencon.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ne rajtas esti pli granda ol la enkonstruita valoro <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ĉi tiu valoro estas <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj versioj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj el ĉi tiuj operatoroj havas ankaŭ Unikodan formon:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemploj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj ekzemploj de komparo de nombroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>1.000000000000000000000001<\/code> estas <code>Rat<\/code> nombro.<\/span> <span class=\"sg\" data-s=\"1\">La esprimo komparas ĝin kun tre proksima nombro, <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kun <code>Rat<\/code> nombroj, vi ne perdas precizecon ĉi tie.<\/span> <span class=\"sg\" data-s=\"3\">Raku konservas ĉiujn ciferojn.<\/span> <span class=\"sg\" data-s=\"4\">La lasta ekzemplo havas <code>2e17<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi uzas <code>Num<\/code> nombrojn.<\/span> <span class=\"sg\" data-s=\"6\">Ilia precizeco estas limigita.<\/span> <span class=\"sg\" data-s=\"7\">Ili ne povas konservi ĉiujn ciferojn.<\/span><\/p>"]]},"la":{"t":"Comparando numeri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Utere his operatoribus ad duos numeros comparandos.<\/span> <span class=\"sg\" data-s=\"1\">Alias linguas programmandi novisti?<\/span> <span class=\"sg\" data-s=\"2\">Tum omnes tibi valde clari sunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Aequalis <code>!=<\/code> | Non aequalis <code>&lt;<\/code> | Minor quam <code>&lt;=<\/code> | Minor aut aequalis <code>&gt;<\/code> | Maior quam <code>&gt;=<\/code> | Maior aut aequalis<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fere-aequalis<\/span><\/h3>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku operatores usitatos habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam unum alium addit: <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hic operator probat si duo numeri fere aequales sunt.<\/span> <span class=\"sg\" data-s=\"3\">Eventus est <code>True<\/code> si numeri propinqui sunt.<\/span> <span class=\"sg\" data-s=\"4\">Raku differentiam cum magnitudine numerorum comparat.<\/span> <span class=\"sg\" data-s=\"5\">Hoc differentiam relativam dat.<\/span> <span class=\"sg\" data-s=\"6\">Non debet maior esse quam valor in-builtus <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Hic valor est <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiones Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quidam ex his operatoribus etiam formam Unicode habent:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exempla<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt exempla quae numeros comparant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # Verum\nsay 10 != 10; # Falsum\n\nsay 15 &lt; 10;  # Falsum\nsay 10 &lt;= 10; # Verum\nsay 16 &gt; 10;  # Verum\nsay 10 &gt;= 14; # Falsum\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # Verum\nsay 2e17 + 1 =~= 2e17 + 100; # Verum<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Nota: <code>1.000000000000000000000001<\/code> est numerus <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Expressio eum cum numero valde propinquo comparat, <code>1.000000000000000000000002<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cum numeris <code>Rat<\/code> hic praecisionem non amittis.<\/span> <span class=\"sg\" data-s=\"3\">Raku omnes digitos servat.<\/span> <span class=\"sg\" data-s=\"4\">Ultimum exemplum <code>2e17<\/code> habet.<\/span> <span class=\"sg\" data-s=\"5\">Numeris <code>Num<\/code> utitur.<\/span> <span class=\"sg\" data-s=\"6\">Praecisio eorum restricta est.<\/span> <span class=\"sg\" data-s=\"7\">Non possunt omnes digitos servare.<\/span><\/p>"]]}}}</script>
