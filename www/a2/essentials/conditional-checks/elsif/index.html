<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/elsif","n":130,"k":"topic","pv":"essentials/conditional-checks/else","nx":"essentials/conditional-checks/elsif/quiz","tr":["essentials","essentials/conditional-checks"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using elsif","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Now you know <code>if<\/code> and <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But what if you need many tests, one after another?<\/span> <span class=\"sg\" data-s=\"2\">Raku has at least two ways for this.<\/span> <span class=\"sg\" data-s=\"3\">In fact, it has even more.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">One way is a chain of blocks: <code>if<\/code>, <code>elsif<\/code>, and <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Look at how we write <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is not <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It is not <code>else if<\/code> either.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This program has three branches.<\/span> <span class=\"sg\" data-s=\"1\">It has three tests, one after another.<\/span> <span class=\"sg\" data-s=\"2\">As soon as one condition is <code>True<\/code>, Raku runs its code block.<\/span> <span class=\"sg\" data-s=\"3\">If no test is <code>True<\/code>, Raku runs the <code>else<\/code> block.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here are a few test runs of the program.<\/span> <span class=\"sg\" data-s=\"1\">Together, they use all the blocks:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Another way is the pair <a href=\"/advanced/given-when/\"><code>given<\/code> and <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">We learn it later.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jetzt kennen Sie <code>if<\/code> und <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aber was ist, wenn Sie viele Tests nacheinander brauchen?<\/span> <span class=\"sg\" data-s=\"2\">Raku hat dafür mindestens zwei Wege.<\/span> <span class=\"sg\" data-s=\"3\">Eigentlich hat es sogar noch mehr.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Weg ist eine Kette von Blöcken: <code>if<\/code>, <code>elsif<\/code> und <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich an, wie wir <code>elsif<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Es ist nicht <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Es ist auch nicht <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Geben Sie die Zahl ein: ';\nif $x &gt; 100 {\n    say \"$x ist größer als 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x ist größer als 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x ist größer als 25.\";\n}\nelse {\n    say \"$x ist 25 oder kleiner.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm hat drei Zweige.<\/span> <span class=\"sg\" data-s=\"1\">Es hat drei Tests, einen nach dem anderen.<\/span> <span class=\"sg\" data-s=\"2\">Sobald eine Bedingung <code>True<\/code> ist, führt Raku ihren Codeblock aus.<\/span> <span class=\"sg\" data-s=\"3\">Wenn kein Test <code>True<\/code> ist, führt Raku den <code>else<\/code>-Block aus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier sind ein paar Testläufe des Programms.<\/span> <span class=\"sg\" data-s=\"1\">Zusammen benutzen sie alle Blöcke:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nGeben Sie die Zahl ein: 120\n120 ist größer als 100.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 75      \n75 ist größer als 50.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 30\n30 ist größer als 25.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 10\n10 ist 25 oder kleiner.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein anderer Weg ist das Paar <a href=\"https://course.raku.org/de/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> und <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Wir lernen es später.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nu ken je <code>if<\/code> en <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar wat als je veel tests na elkaar nodig hebt?<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft hiervoor minstens twee manieren.<\/span> <span class=\"sg\" data-s=\"3\">Eigenlijk heeft het er nog meer.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eén manier is een keten van blokken: <code>if<\/code>, <code>elsif<\/code> en <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kijk hoe we <code>elsif<\/code> schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Het is niet <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het is ook niet <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Voer het nummer in: ';\nif $x &gt; 100 {\n    say \"$x is groter dan 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is groter dan 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is groter dan 25.\";\n}\nelse {\n    say \"$x is 25 of kleiner.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit programma heeft drie takken.<\/span> <span class=\"sg\" data-s=\"1\">Het heeft drie tests, na elkaar.<\/span> <span class=\"sg\" data-s=\"2\">Zodra één voorwaarde <code>True<\/code> is, voert Raku zijn codeblok uit.<\/span> <span class=\"sg\" data-s=\"3\">Als geen enkele test <code>True<\/code> is, voert Raku het <code>else<\/code>-blok uit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar testruns van het programma.<\/span> <span class=\"sg\" data-s=\"1\">Samen gebruiken ze alle blokken:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer het nummer in: 120\n120 is groter dan 100.\n\n$ raku t.raku\nVoer het nummer in: 75      \n75 is groter dan 50.\n\n$ raku t.raku\nVoer het nummer in: 30\n30 is groter dan 25.\n\n$ raku t.raku\nVoer het nummer in: 10\n10 is 25 of kleiner.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een andere manier is het paar <a href=\"https://course.raku.org/nl/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> en <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Dat leren we later.<\/span><\/p>"]]},"es":{"t":"Uso de <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ahora conoces <code>if<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero, ¿qué pasa si necesitas muchas pruebas, una tras otra?<\/span> <span class=\"sg\" data-s=\"2\">Raku tiene al menos dos formas para esto.<\/span> <span class=\"sg\" data-s=\"3\">De hecho, tiene aún más.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una forma es una cadena de bloques: <code>if<\/code>, <code>elsif<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mira cómo escribimos <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No es <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tampoco es <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Introduce el número: ';\nif $x &gt; 100 {\n    say \"$x es mayor que 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x es mayor que 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x es mayor que 25.\";\n}\nelse {\n    say \"$x es 25 o menor.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Este programa tiene tres ramas.<\/span> <span class=\"sg\" data-s=\"1\">Tiene tres pruebas, una tras otra.<\/span> <span class=\"sg\" data-s=\"2\">En cuanto una condición es <code>True<\/code>, Raku ejecuta su bloque de código.<\/span> <span class=\"sg\" data-s=\"3\">Si ninguna prueba es <code>True<\/code>, Raku ejecuta el bloque <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunas ejecuciones de prueba del programa.<\/span> <span class=\"sg\" data-s=\"1\">Juntas, usan todos los bloques:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntroduce el número: 120\n120 es mayor que 100.\n\n$ raku t.raku\nIntroduce el número: 75      \n75 es mayor que 50.\n\n$ raku t.raku\nIntroduce el número: 30\n30 es mayor que 25.\n\n$ raku t.raku\nIntroduce el número: 10\n10 es 25 o menor.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otra forma es el par <a href=\"https://course.raku.org/es/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> y <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Lo aprendemos más tarde.<\/span><\/p>"]]},"it":{"t":"Uso di <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ora conosci <code>if<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma se ti servono molti test, uno dopo l'altro?<\/span> <span class=\"sg\" data-s=\"2\">Raku ha almeno due modi per farlo.<\/span> <span class=\"sg\" data-s=\"3\">In realtà, ne ha anche di più.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un modo è una catena di blocchi: <code>if<\/code>, <code>elsif<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Guarda come scriviamo <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Non è <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">E non è neanche <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Inserisci il numero: ';\nif $x &gt; 100 {\n    say \"$x è maggiore di 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x è maggiore di 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x è maggiore di 25.\";\n}\nelse {\n    say \"$x è 25 o minore.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo programma ha tre rami.<\/span> <span class=\"sg\" data-s=\"1\">Ha tre test, uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"2\">Appena una condizione è <code>True<\/code>, Raku esegue il suo blocco di codice.<\/span> <span class=\"sg\" data-s=\"3\">Se nessun test è <code>True<\/code>, Raku esegue il blocco <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco alcune esecuzioni di prova del programma.<\/span> <span class=\"sg\" data-s=\"1\">Insieme, usano tutti i blocchi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nInserisci il numero: 120\n120 è maggiore di 100.\n\n$ raku t.raku\nInserisci il numero: 75      \n75 è maggiore di 50.\n\n$ raku t.raku\nInserisci il numero: 30\n30 è maggiore di 25.\n\n$ raku t.raku\nInserisci il numero: 10\n10 è 25 o minore.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un altro modo è la coppia <a href=\"https://course.raku.org/it/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> e <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">La impariamo più avanti.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tagad jūs zināt <code>if<\/code> un <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet ko darīt, ja jums vajag daudz testu, vienu pēc otra?<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā tam ir vismaz divi veidi.<\/span> <span class=\"sg\" data-s=\"3\">Patiesībā to ir vēl vairāk.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Viens veids ir bloku ķēde: <code>if<\/code>, <code>elsif<\/code> un <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, kā mēs rakstām <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas nav arī <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šai programmai ir trīs zari.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir trīs testi, viens pēc otra.<\/span> <span class=\"sg\" data-s=\"2\">Tiklīdz viens nosacījums ir <code>True<\/code>, Raku izpilda tā koda bloku.<\/span> <span class=\"sg\" data-s=\"3\">Ja neviens tests nav <code>True<\/code>, Raku izpilda <code>else<\/code> bloku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit ir dažas programmas testa izpildes.<\/span> <span class=\"sg\" data-s=\"1\">Kopā tās izmanto visus blokus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cits veids ir pāris <a href=\"https://course.raku.org/lv/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> un <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Mēs to apgūsim vēlāk.<\/span><\/p>"]]},"ru":{"t":"Использование <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Теперь вы знаете <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но что делать, если нужно много проверок, одна за другой?<\/span> <span class=\"sg\" data-s=\"2\">В Raku для этого есть как минимум два способа.<\/span> <span class=\"sg\" data-s=\"3\">На самом деле их даже больше.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Один способ — это цепочка блоков: <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите, как мы пишем <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это не <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">И это также не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этой программе три ветки.<\/span> <span class=\"sg\" data-s=\"1\">В ней три проверки, одна за другой.<\/span> <span class=\"sg\" data-s=\"2\">Как только одно условие равно <code>True<\/code>, Raku выполняет его блок кода.<\/span> <span class=\"sg\" data-s=\"3\">Если ни одна проверка не равна <code>True<\/code>, Raku выполняет блок <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот несколько тестовых запусков программы.<\/span> <span class=\"sg\" data-s=\"1\">Вместе они используют все блоки:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75\n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Другой способ — это пара <a href=\"https://course.raku.org/ru/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> и <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Мы узнаем о ней позже.<\/span><\/p>"]]},"uk":{"t":"Використання <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Тепер ви знаєте <code>if<\/code> і <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але що, якщо вам потрібно багато тестів, один за одним?<\/span> <span class=\"sg\" data-s=\"2\">У Raku є щонайменше два способи для цього.<\/span> <span class=\"sg\" data-s=\"3\">Насправді їх навіть більше.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Один спосіб — це ланцюг блоків: <code>if<\/code>, <code>elsif<\/code> та <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться, як ми пишемо <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це не <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">І це також не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Введіть число: ';\nif $x &gt; 100 {\n    say \"$x більше за 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x більше за 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x більше за 25.\";\n}\nelse {\n    say \"$x дорівнює 25 або менше.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У цій програмі є три гілки.<\/span> <span class=\"sg\" data-s=\"1\">У ній є три тести, один за одним.<\/span> <span class=\"sg\" data-s=\"2\">Щойно одна умова стає <code>True<\/code>, Raku виконує її блок коду.<\/span> <span class=\"sg\" data-s=\"3\">Якщо жоден тест не дає <code>True<\/code>, Raku виконує блок <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось кілька тестових запусків програми.<\/span> <span class=\"sg\" data-s=\"1\">Разом вони використовують усі блоки:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведіть число: 120\n120 більше за 100.\n\n$ raku t.raku\nВведіть число: 75      \n75 більше за 50.\n\n$ raku t.raku\nВведіть число: 30\n30 більше за 25.\n\n$ raku t.raku\nВведіть число: 10\n10 дорівнює 25 або менше.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інший спосіб — пара <a href=\"https://course.raku.org/uk/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> та <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ми вивчимо її пізніше.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Сега знаете <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А ако ви трябват много тестове, един след друг?<\/span> <span class=\"sg\" data-s=\"2\">Raku има поне два начина за това.<\/span> <span class=\"sg\" data-s=\"3\">Всъщност има дори повече.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Един начин е верига от блокове: <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вижте как пишем <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това не е <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това не е и <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази програма има три клона.<\/span> <span class=\"sg\" data-s=\"1\">Тя има три теста, един след друг.<\/span> <span class=\"sg\" data-s=\"2\">Щом едно условие е <code>True<\/code>, Raku изпълнява неговия блок код.<\/span> <span class=\"sg\" data-s=\"3\">Ако нито един тест не е <code>True<\/code>, Raku изпълнява блока <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето няколко тестови изпълнения на програмата.<\/span> <span class=\"sg\" data-s=\"1\">Заедно те използват всички блокове:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Друг начин е двойката <a href=\"https://course.raku.org/bg/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> и <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ще я научим по-късно.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nun vi konas <code>if<\/code> kaj <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed kion fari, se vi bezonas multajn testojn, unu post la alia?<\/span> <span class=\"sg\" data-s=\"2\">Raku havas almenaŭ du manierojn por tio.<\/span> <span class=\"sg\" data-s=\"3\">Fakte, ĝi havas eĉ pli.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unu maniero estas ĉeno de blokoj: <code>if<\/code>, <code>elsif<\/code> kaj <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu, kiel ni skribas <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne estas <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ ne estas <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo havas tri branĉojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas tri testojn, unu post la alia.<\/span> <span class=\"sg\" data-s=\"2\">Tuj kiam unu kondiĉo estas <code>True<\/code>, Raku rulas ĝian blokon de kodo.<\/span> <span class=\"sg\" data-s=\"3\">Se neniu testo estas <code>True<\/code>, Raku rulas la <code>else<\/code> blokon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj provaj ruloj de la programo.<\/span> <span class=\"sg\" data-s=\"1\">Kune ili uzas ĉiujn blokojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alia maniero estas la paro <a href=\"https://course.raku.org/eo/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> kaj <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ni lernos ĝin poste.<\/span><\/p>"]]},"la":{"t":"Utendo <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nunc <code>if<\/code> et <code>else<\/code> novisti.<\/span> <span class=\"sg\" data-s=\"1\">Sed quid si multas probationes requiris, unam post alteram?<\/span> <span class=\"sg\" data-s=\"2\">Raku saltem duos modos ad hoc habet.<\/span> <span class=\"sg\" data-s=\"3\">Re vera etiam plures habet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unus modus est catena clausularum: <code>if<\/code>, <code>elsif<\/code>, et <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Specta quomodo <code>elsif<\/code> scribimus.<\/span> <span class=\"sg\" data-s=\"2\">Non est <code>elseif<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Neque est <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Intra numerum: ';\nif $x &gt; 100 {\n    say \"$x maior est quam 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x maior est quam 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x maior est quam 25.\";\n}\nelse {\n    say \"$x est 25 vel minor.\";\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc programma tres ramos habet.<\/span> <span class=\"sg\" data-s=\"1\">Tres probationes habet, unam post alteram.<\/span> <span class=\"sg\" data-s=\"2\">Simul ac una condicio <code>True<\/code> est, Raku clausulam codicis eius exsequitur.<\/span> <span class=\"sg\" data-s=\"3\">Si nulla probatio <code>True<\/code> est, Raku clausulam <code>else<\/code> exsequitur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic sunt pauci cursus programmatis ad probandum.<\/span> <span class=\"sg\" data-s=\"1\">Simul omnes clausulas adhibent:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 120\n120 maior est quam 100.\n\n$ raku t.raku\nIntra numerum: 75      \n75 maior est quam 50.\n\n$ raku t.raku\nIntra numerum: 30\n30 maior est quam 25.\n\n$ raku t.raku\nIntra numerum: 10\n10 est 25 vel minor.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alius modus est par <a href=\"https://course.raku.org/la/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> et <code>when<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Id postea discimus.<\/span><\/p>"]]}}}</script>
