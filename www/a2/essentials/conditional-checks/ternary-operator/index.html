=\"sg\" data-s=\"2\">Първо има булев тест.<\/span> <span class=\"sg\" data-s=\"3\">Неговият резултат е <code>True<\/code> или <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">След теста идват два израза.<\/span> <span class=\"sg\" data-s=\"5\">Raku изпълнява само един от тях.<\/span> <span class=\"sg\" data-s=\"6\">Резултатът от теста избира кой от тях.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Със сегашната стойност на <code>$shines<\/code> програмата отпечатва <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сменете стойността на <code>Moon<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогава резултатът е <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да свържете тернарни изрази във верига.<\/span> <span class=\"sg\" data-s=\"1\">Но не я правете твърде сложна.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук програмата отпечатва част от деня.<\/span> <span class=\"sg\" data-s=\"1\">Частта зависи от стойността в <code>$hours<\/code>.<\/span><\/p>"]]},"eo":{"t":"Ternara operatoro","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">La ternara operatoro en Raku havas du partojn: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Unue, estas Boolea testo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia rezulto estas <code>True<\/code> aŭ <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Du esprimoj venas post la testo.<\/span> <span class=\"sg\" data-s=\"5\">Raku rulas nur unu el ili.<\/span> <span class=\"sg\" data-s=\"6\">La rezulto de la testo elektas la esprimon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kun la nuna valoro de <code>$shines<\/code>, la programo presas <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ŝanĝu la valoron al <code>Moon<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la rezulto estas <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas kunigi ternarajn esprimojn en ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ne faru ĝin tro malfacila.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la programo presas parton de la tago.<\/span> <span class=\"sg\" data-s=\"1\">La parto dependas de la valoro en <code>$hours<\/code>.<\/span><\/p>"]]},"la":{"t":"Ternarius operator","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Operator ternarius in Raku duas partes habet: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Primum est probatio Booleana.<\/span> <span class=\"sg\" data-s=\"3\">Eventus eius est <code>True<\/code> aut <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Duae expressiones post probationem veniunt.<\/span> <span class=\"sg\" data-s=\"5\">Raku tantum unam ex eis exsequitur.<\/span> <span class=\"sg\" data-s=\"6\">Eventus probationis unam eligit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sol';\nmy $tempus-diei = $shines eq 'Sol' ?? 'dies' !! 'nox';\nsay $tempus-diei;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum valore praesenti variabilis <code>$shines<\/code>, programma <code>dies<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Muta valorem in <code>Luna<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tum eventus est <code>nox<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Expressiones ternarias in catenam iungere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed noli eam nimis difficilem facere.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $horae = 20;\nmy $tempus-diei =\n    $horae &lt;= 6 ?? 'Nox' !!\n    $horae &lt;= 12 ?? 'Mane' !! \n    $horae &lt;= 18 ?? 'Postmeridianum' !! 'Vespera';\nsay $tempus-diei;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic programma partem diei imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Pars a valore in <code>$horae<\/code> pendet.<\/span><\/p>"]]}}}</script>
