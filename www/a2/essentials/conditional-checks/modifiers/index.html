ess<\/code> statim post sententiam.<\/span> <span class=\"sg\" data-s=\"4\">In Raku haec <em>modificatores sententiae<\/em> vocantur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Bonum postmeridianum' if $horae &gt; 12;\n\nsay 'Omnia systemata operantur' unless $fractum;<\/code><\/pre>"]]}}}</script>
