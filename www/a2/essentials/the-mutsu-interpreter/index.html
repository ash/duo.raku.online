<\/span> <span class=\"sg\" data-s=\"2\">Igual que Rakudo, compila tu programa a bytecode.<\/span> <span class=\"sg\" data-s=\"3\">Después ejecuta el bytecode en una máquina virtual.<\/span> <span class=\"sg\" data-s=\"4\">Pero esta máquina no es MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Es la máquina propia de mutsu.<\/span> <span class=\"sg\" data-s=\"6\">Está dentro del archivo de programa <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu admite Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Su autor todavía trabaja mucho en él.<\/span> <span class=\"sg\" data-s=\"2\">Aún no está listo para proyectos reales.<\/span> <span class=\"sg\" data-s=\"3\">El autor lo dice claramente.<\/span> <span class=\"sg\" data-s=\"4\">Pero ya pasa casi todos los archivos de pruebas de Roast.<\/span> <span class=\"sg\" data-s=\"5\">Así que casi todos los programas de este curso funcionan en él sin cambios.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Falta una parte que es importante mientras aprendes.<\/span> <span class=\"sg\" data-s=\"1\">Todavía no tiene algunas comprobaciones en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"2\">Estas comprobaciones ocurren antes de ejecutar el programa.<\/span> <span class=\"sg\" data-s=\"3\">Este es el caso más visible, en la versión 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Quizás olvidas declarar una variable.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo y Raku++ avisan de esto antes de ejecutar el programa.<\/span> <span class=\"sg\" data-s=\"6\">Pero mutsu no lo hace.<\/span> <span class=\"sg\" data-s=\"7\">¿El curso muestra un mensaje de error así?<\/span> <span class=\"sg\" data-s=\"8\">Entonces prueba ese ejemplo con uno de los otros dos compiladores.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en el navegador<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">También puedes compilar mutsu a WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Entonces funciona dentro de una página web.<\/span> <span class=\"sg\" data-s=\"2\">Su sitio web, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, usa esto.<\/span> <span class=\"sg\" data-s=\"3\">Tiene una introducción a Raku en inglés y en japonés.<\/span> <span class=\"sg\" data-s=\"4\">También tiene un tutorial.<\/span> <span class=\"sg\" data-s=\"5\">En él, pruebas las cosas tú mismo.<\/span> <span class=\"sg\" data-s=\"6\">Y tiene un campo de pruebas.<\/span> <span class=\"sg\" data-s=\"7\">Allí puedes ejecutar Raku sin instalar nada.<\/span> <span class=\"sg\" data-s=\"8\">Todas estas páginas ejecutan el propio mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Módulos<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu trae su propia copia del gestor de paquetes zef.<\/span> <span class=\"sg\" data-s=\"1\">Esta copia se llama <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que puedes instalar módulos de Raku para mutsu como siempre.<\/span> <span class=\"sg\" data-s=\"3\">Escribe <code>mzef install<\/code> y después el nombre del módulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu es de código abierto.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlo en <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La página también tiene versiones compiladas e instrucciones para compilarlo.<\/span><\/p>"]]},"it":{"t":"L'interprete mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> è una terza implementazione di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tokuhiro Matsuno l'ha scritta in <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Come Rakudo, compila il tuo programma in bytecode.<\/span> <span class=\"sg\" data-s=\"3\">Poi esegue il bytecode su una macchina virtuale.<\/span> <span class=\"sg\" data-s=\"4\">Ma questa macchina non è MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">È la macchina di mutsu stesso.<\/span> <span class=\"sg\" data-s=\"6\">Si trova dentro il file di programma <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu supporta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Il suo autore ci lavora ancora molto.<\/span> <span class=\"sg\" data-s=\"2\">Non è ancora pronto per progetti veri.<\/span> <span class=\"sg\" data-s=\"3\">L'autore lo dice chiaramente.<\/span> <span class=\"sg\" data-s=\"4\">Ma supera già quasi tutti i file di test di Roast.<\/span> <span class=\"sg\" data-s=\"5\">Quindi quasi tutti i programmi di questo corso funzionano su mutsu senza cambiamenti.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Una cosa che manca è importante mentre impari.<\/span> <span class=\"sg\" data-s=\"1\">Alcuni controlli in fase di compilazione non ci sono ancora.<\/span> <span class=\"sg\" data-s=\"2\">Questi controlli avvengono prima di eseguire il programma.<\/span> <span class=\"sg\" data-s=\"3\">Ecco il caso più visibile, nella versione 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Forse dimentichi di dichiarare una variabile.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo e Raku++ lo segnalano prima di eseguire il programma.<\/span> <span class=\"sg\" data-s=\"6\">Ma mutsu non lo fa.<\/span> <span class=\"sg\" data-s=\"7\">Il corso mostra un messaggio di errore così?<\/span> <span class=\"sg\" data-s=\"8\">Allora prova quell'esempio con uno degli altri due compilatori.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku nel browser<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Puoi anche compilare mutsu in WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Allora gira dentro una pagina web.<\/span> <span class=\"sg\" data-s=\"2\">Il suo sito, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, usa questa possibilità.<\/span> <span class=\"sg\" data-s=\"3\">Ha un'introduzione a Raku in inglese e in giapponese.<\/span> <span class=\"sg\" data-s=\"4\">Ha anche un tutorial.<\/span> <span class=\"sg\" data-s=\"5\">Nel tutorial provi le cose da solo.<\/span> <span class=\"sg\" data-s=\"6\">E ha un campo da gioco.<\/span> <span class=\"sg\" data-s=\"7\">Lì puoi eseguire Raku senza installare niente.<\/span> <span class=\"sg\" data-s=\"8\">Tutte queste pagine usano mutsu stesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu ha una sua copia del gestore di pacchetti zef.<\/span> <span class=\"sg\" data-s=\"1\">Questa copia si chiama <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi puoi installare i moduli Raku per mutsu come al solito.<\/span> <span class=\"sg\" data-s=\"3\">Scrivi <code>mzef install<\/code> e poi il nome del modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu è open source.<\/span> <span class=\"sg\" data-s=\"1\">Lo trovi su <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La pagina ha anche le build delle release e le istruzioni di compilazione.<\/span><\/p>"]]},"lv":{"t":"Interpretators mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> ir trešā Raku īstenošana.<\/span> <span class=\"sg\" data-s=\"1\">Tokuhiro Matsuno to uzrakstīja <strong>Rust<\/strong> valodā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat kā Rakudo, tas kompilē jūsu programmu baitkodā.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas izpilda baitkodu uz virtuālās mašīnas.<\/span> <span class=\"sg\" data-s=\"4\">Bet šī mašīna nav MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Tā ir paša mutsu mašīna.<\/span> <span class=\"sg\" data-s=\"6\">Tā atrodas <code>mutsu<\/code> programmas failā.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu atbalsta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Tā autors joprojām daudz pie tā strādā.<\/span> <span class=\"sg\" data-s=\"2\">Tas vēl nav gatavs īstiem projektiem.<\/span> <span class=\"sg\" data-s=\"3\">Autors to saka skaidri.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas jau iztur gandrīz visus Roast testu failus.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc gandrīz visas šī kursa programmas uz tā darbojas bez izmaiņām.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Mācoties ir svarīga viena lieta, kas vēl trūkst.<\/span> <span class=\"sg\" data-s=\"1\">Dažu kompilēšanas laika pārbaužu vēl nav.<\/span> <span class=\"sg\" data-s=\"2\">Šīs pārbaudes notiek pirms programmas palaišanas.<\/span> <span class=\"sg\" data-s=\"3\">Šeit ir pats redzamākais gadījums versijā 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Varbūt jūs aizmirstat deklarēt mainīgo.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo un Raku++ par to ziņo pirms programmas palaišanas.<\/span> <span class=\"sg\" data-s=\"6\">Bet mutsu to nedara.<\/span> <span class=\"sg\" data-s=\"7\">Vai kurss rāda šādu kļūdas paziņojumu?<\/span> <span class=\"sg\" data-s=\"8\">Tad izmēģiniet šo piemēru ar kādu no abiem pārējiem kompilatoriem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku pārlūkprogrammā<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī kompilēt mutsu uz WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas darbojas tīmekļa lappusē.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietne, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, to izmanto.<\/span> <span class=\"sg\" data-s=\"3\">Tajā ir Raku ievads angļu un japāņu valodā.<\/span> <span class=\"sg\" data-s=\"4\">Tajā ir arī pamācība.<\/span> <span class=\"sg\" data-s=\"5\">Pamācībā jūs visu izmēģināt paši.<\/span> <span class=\"sg\" data-s=\"6\">Un tajā ir spēļu laukums.<\/span> <span class=\"sg\" data-s=\"7\">Tur jūs varat palaist Raku, neko neinstalējot.<\/span> <span class=\"sg\" data-s=\"8\">Visās šajās lappusēs darbojas pats mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļi<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu nāk ar savu zef pakotņu pārvaldnieka kopiju.<\/span> <span class=\"sg\" data-s=\"1\">Šo kopiju sauc <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc ar mutsu jūs varat instalēt Raku moduļus kā parasti.<\/span> <span class=\"sg\" data-s=\"3\">Ierakstiet <code>mzef install<\/code> un tad moduļa nosaukumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To var atrast vietnē <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Šajā lapā ir arī izlaidumu būvējumi un būvēšanas norādes.<\/span><\/p>"]]},"ru":{"t":"Интерпретатор mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — это третья реализация Raku.<\/span> <span class=\"sg\" data-s=\"1\">Токухиро Мацуно написал его на <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Как и Rakudo, он компилирует вашу программу в байт-код.<\/span> <span class=\"sg\" data-s=\"3\">Потом он выполняет байт-код на виртуальной машине.<\/span> <span class=\"sg\" data-s=\"4\">Но эта машина — не MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Это собственная машина mutsu.<\/span> <span class=\"sg\" data-s=\"6\">Она находится внутри файла программы <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu поддерживает Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Его автор всё ещё много над ним работает.<\/span> <span class=\"sg\" data-s=\"2\">Пока mutsu не готов для настоящих проектов.<\/span> <span class=\"sg\" data-s=\"3\">Автор прямо об этом говорит.<\/span> <span class=\"sg\" data-s=\"4\">Но он уже проходит почти все тестовые файлы Roast.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому почти все программы из этого курса работают на нём без изменений.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Одного пока не хватает, и это важно для учёбы.<\/span> <span class=\"sg\" data-s=\"1\">Некоторых проверок во время компиляции ещё нет.<\/span> <span class=\"sg\" data-s=\"2\">Эти проверки идут до запуска программы.<\/span> <span class=\"sg\" data-s=\"3\">Вот самый заметный случай, в версии 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Допустим, вы забыли объявить переменную.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo и Raku++ сообщают об этом до запуска программы.<\/span> <span class=\"sg\" data-s=\"6\">А mutsu — нет.<\/span> <span class=\"sg\" data-s=\"7\">Курс показывает такое сообщение об ошибке?<\/span> <span class=\"sg\" data-s=\"8\">Тогда попробуйте этот пример с одним из двух других компиляторов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузере<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Вы также можете скомпилировать mutsu в WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тогда он работает прямо на веб-странице.<\/span> <span class=\"sg\" data-s=\"2\">Его сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, использует это.<\/span> <span class=\"sg\" data-s=\"3\">На нём есть введение в Raku на английском и японском.<\/span> <span class=\"sg\" data-s=\"4\">Ещё там есть учебник.<\/span> <span class=\"sg\" data-s=\"5\">В нём вы сами пробуете разные вещи.<\/span> <span class=\"sg\" data-s=\"6\">И там есть песочница.<\/span> <span class=\"sg\" data-s=\"7\">В ней можно запускать Raku, ничего не устанавливая.<\/span> <span class=\"sg\" data-s=\"8\">Все эти страницы работают на самом mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вместе с mutsu идёт своя копия менеджера пакетов zef.<\/span> <span class=\"sg\" data-s=\"1\">Эта копия называется <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вы можете устанавливать модули Raku для mutsu как обычно.<\/span> <span class=\"sg\" data-s=\"3\">Напишите <code>mzef install<\/code>, а потом название модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете найти его на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На этой странице также есть готовые сборки и инструкции по сборке.<\/span><\/p>"]]},"uk":{"t":"Інтерпретатор mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — це третя реалізація Raku.<\/span> <span class=\"sg\" data-s=\"1\">Токухіро Мацуно написав його мовою <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Як і Rakudo, він компілює вашу програму в байткод.<\/span> <span class=\"sg\" data-s=\"3\">Потім він виконує байткод на віртуальній машині.<\/span> <span class=\"sg\" data-s=\"4\">Але ця машина — не MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Це власна машина mutsu.<\/span> <span class=\"sg\" data-s=\"6\">Вона є всередині файлу програми <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu підтримує Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Його автор досі багато над ним працює.<\/span> <span class=\"sg\" data-s=\"2\">Поки що mutsu не готовий для справжніх проєктів.<\/span> <span class=\"sg\" data-s=\"3\">Автор прямо про це каже.<\/span> <span class=\"sg\" data-s=\"4\">Але mutsu вже проходить майже всі тестові файли Roast.<\/span> <span class=\"sg\" data-s=\"5\">Тож майже всі програми з цього курсу працюють на ньому без змін.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Однієї важливої для навчання частини ще немає.<\/span> <span class=\"sg\" data-s=\"1\">Деяких перевірок під час компіляції поки немає.<\/span> <span class=\"sg\" data-s=\"2\">Ці перевірки відбуваються до запуску програми.<\/span> <span class=\"sg\" data-s=\"3\">Ось найпомітніший випадок, у версії 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Можливо, ви забули оголосити змінну.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo і Raku++ повідомляють про це до запуску програми.<\/span> <span class=\"sg\" data-s=\"6\">Але mutsu цього не робить.<\/span> <span class=\"sg\" data-s=\"7\">Курс показує таке повідомлення про помилку?<\/span> <span class=\"sg\" data-s=\"8\">Тоді спробуйте цей приклад з одним із двох інших компіляторів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku у браузері<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ви також можете скомпілювати mutsu у WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тоді він працює всередині веб-сторінки.<\/span> <span class=\"sg\" data-s=\"2\">Його сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, використовує це.<\/span> <span class=\"sg\" data-s=\"3\">На сайті є вступ до Raku англійською та японською мовами.<\/span> <span class=\"sg\" data-s=\"4\">Там є також підручник.<\/span> <span class=\"sg\" data-s=\"5\">У ньому ви все пробуєте самі.<\/span> <span class=\"sg\" data-s=\"6\">І ще там є майданчик.<\/span> <span class=\"sg\" data-s=\"7\">На ньому ви можете запускати Raku, нічого не встановлюючи.<\/span> <span class=\"sg\" data-s=\"8\">Усі ці сторінки працюють на самому mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модулі<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu має власну копію менеджера пакетів zef.<\/span> <span class=\"sg\" data-s=\"1\">Ця копія називається <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви можете встановлювати модулі Raku для mutsu як завжди.<\/span> <span class=\"sg\" data-s=\"3\">Введіть <code>mzef install<\/code>, а потім назву модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете знайти його на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На цій сторінці також є збірки випусків та інструкції зі збирання.<\/span><\/p>"]]},"bg":{"t":"Интерпретаторът mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> е трета реализация на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Токухиро Мацуно го написа на <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Като Rakudo, той компилира програмата ви до байткод.<\/span> <span class=\"sg\" data-s=\"3\">След това изпълнява байткода на виртуална машина.<\/span> <span class=\"sg\" data-s=\"4\">Но тази машина не е MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Тя е собствената машина на mutsu.<\/span> <span class=\"sg\" data-s=\"6\">Тя е вътре в програмния файл <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu поддържа Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Авторът му още работи много по него.<\/span> <span class=\"sg\" data-s=\"2\">Той още не е готов за истински проекти.<\/span> <span class=\"sg\" data-s=\"3\">Авторът казва това ясно.<\/span> <span class=\"sg\" data-s=\"4\">Но той вече минава почти всички тестови файлове на Roast.<\/span> <span class=\"sg\" data-s=\"5\">Затова почти всички програми от курса работят на него без промени.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Една липсваща част е важна, докато учите.<\/span> <span class=\"sg\" data-s=\"1\">Някои проверки по време на компилация още ги няма.<\/span> <span class=\"sg\" data-s=\"2\">Тези проверки стават преди изпълнението на програмата.<\/span> <span class=\"sg\" data-s=\"3\">Ето най-видимия случай, във версия 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Може би забравяте да декларирате променлива.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo и Raku++ съобщават за това преди изпълнението на програмата.<\/span> <span class=\"sg\" data-s=\"6\">Но mutsu не го прави.<\/span> <span class=\"sg\" data-s=\"7\">Курсът показва ли такова съобщение за грешка?<\/span> <span class=\"sg\" data-s=\"8\">Тогава пробвайте този пример с някой от другите два компилатора.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузъра<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Можете също да компилирате mutsu до WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тогава той работи вътре в уеб страница.<\/span> <span class=\"sg\" data-s=\"2\">Сайтът му, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, използва това.<\/span> <span class=\"sg\" data-s=\"3\">На него има въведение в Raku на английски и японски.<\/span> <span class=\"sg\" data-s=\"4\">Има и ръководство.<\/span> <span class=\"sg\" data-s=\"5\">В него вие сами пробвате нещата.<\/span> <span class=\"sg\" data-s=\"6\">Има и площадка.<\/span> <span class=\"sg\" data-s=\"7\">Там можете да изпълнявате Raku, без да инсталирате нищо.<\/span> <span class=\"sg\" data-s=\"8\">Всички тези страници изпълняват самия mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu идва със собствено копие на мениджъра на пакети zef.<\/span> <span class=\"sg\" data-s=\"1\">Това копие се казва <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да инсталирате модули на Raku за mutsu както обикновено.<\/span> <span class=\"sg\" data-s=\"3\">Напишете <code>mzef install<\/code> и след това името на модула.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го намерите на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">На страницата има и готови компилации и указания за изграждане.<\/span><\/p>"]]},"eo":{"t":"La interpretilo mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> estas tria realigo de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tokuhiro Matsuno verkis ĝin en <strong>Rust<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Kiel Rakudo, ĝi kompilas vian programon al bajtkodo.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi rulas la bajtkodon sur virtuala maŝino.<\/span> <span class=\"sg\" data-s=\"4\">Sed ĉi tiu maŝino ne estas MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi estas la propra maŝino de mutsu.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi estas ene de la programdosiero <code>mutsu<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu subtenas Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia aŭtoro ankoraŭ multe laboras pri ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankoraŭ ne estas preta por veraj projektoj.<\/span> <span class=\"sg\" data-s=\"3\">La aŭtoro diras tion klare.<\/span> <span class=\"sg\" data-s=\"4\">Sed ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast.<\/span> <span class=\"sg\" data-s=\"5\">Do preskaŭ ĉiuj programoj en ĉi tiu kurso funkcias sur ĝi senŝanĝe.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Unu mankanta parto gravas, dum vi lernas.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj kompiltempaj kontroloj ankoraŭ ne ekzistas.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj kontroloj okazas antaŭ ol la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"3\">Jen la plej videbla kazo, en versio 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Eble vi forgesas deklari variablon.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo kaj Raku++ raportas tion antaŭ ol la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"6\">Sed mutsu ne faras tion.<\/span> <span class=\"sg\" data-s=\"7\">Ĉu la kurso montras tian erarmesaĝon?<\/span> <span class=\"sg\" data-s=\"8\">Tiam provu tiun ekzemplon per unu el la aliaj du kompililoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en la retumilo<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas kompili mutsu al WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi rulas ene de retpaĝo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia retejo, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, uzas tion.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi havas enkondukon al Raku en la angla kaj la japana.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ havas lernilon.<\/span> <span class=\"sg\" data-s=\"5\">En ĝi, vi mem provas aferojn.<\/span> <span class=\"sg\" data-s=\"6\">Kaj ĝi havas provejon.<\/span> <span class=\"sg\" data-s=\"7\">Tie vi povas ruli Raku sen instali ion ajn.<\/span> <span class=\"sg\" data-s=\"8\">Ĉiuj ĉi tiuj paĝoj rulas mutsu mem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduloj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu venas kun sia propra kopio de la pakaĵadministrilo zef.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu kopio nomiĝas <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas instali Raku-modulojn por mutsu kiel kutime.<\/span> <span class=\"sg\" data-s=\"3\">Tajpu <code>mzef install<\/code> kaj poste la nomon de la modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin ĉe <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La paĝo ankaŭ havas eldonajn binaraĵojn kaj instrukciojn por konstrui ĝin.<\/span><\/p>"]]},"la":{"t":"Interpres mutsu","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> est tertia implementatio Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tokuhiro Matsuno eum in <strong>Rust<\/strong> scripsit.<\/span> <span class=\"sg\" data-s=\"2\">Sicut Rakudo, programma tuum in bytecode compilat.<\/span> <span class=\"sg\" data-s=\"3\">Deinde bytecode in machina virtuali exsequitur.<\/span> <span class=\"sg\" data-s=\"4\">Sed haec machina non est MoarVM.<\/span> <span class=\"sg\" data-s=\"5\">Est machina propria mutsu.<\/span> <span class=\"sg\" data-s=\"6\">In fasciculo programmatis <code>mutsu<\/code> inest.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">mutsu Raku 6.d sustinet.<\/span> <span class=\"sg\" data-s=\"1\">Auctor eius adhuc multum in eo laborat.<\/span> <span class=\"sg\" data-s=\"2\">Nondum paratus est ad vera incepta.<\/span> <span class=\"sg\" data-s=\"3\">Auctor hoc aperte dicit.<\/span> <span class=\"sg\" data-s=\"4\">Sed iam paene omnia archiva probationum Roast transit.<\/span> <span class=\"sg\" data-s=\"5\">Itaque paene omnia programmata huius cursus in eo immutata currunt.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dum discis, unus defectus magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\">Quaedam examinationes tempore compilationis nondum adsunt.<\/span> <span class=\"sg\" data-s=\"2\">Hae examinationes fiunt antequam programma currit.<\/span> <span class=\"sg\" data-s=\"3\">Ecce casus clarissimus, in versione 0.24.0.<\/span> <span class=\"sg\" data-s=\"4\">Fortasse variabilem declarare oblivisceris.<\/span> <span class=\"sg\" data-s=\"5\">Rakudo et Raku++ hoc nuntiant antequam programma currit.<\/span> <span class=\"sg\" data-s=\"6\">Sed mutsu hoc non facit.<\/span> <span class=\"sg\" data-s=\"7\">Ostenditne cursus talem nuntium erroris?<\/span> <span class=\"sg\" data-s=\"8\">Tum illud exemplum cum uno ex aliis duobus compilatoribus experire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in navigatro interretiali<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Etiam mutsu in WebAssembly compilare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum intra paginam interretialem currit.<\/span> <span class=\"sg\" data-s=\"2\">Situs eius interretialis, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, hoc adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Introductionem in Raku Anglice et Iaponice habet.<\/span> <span class=\"sg\" data-s=\"4\">Etiam institutionem habet.<\/span> <span class=\"sg\" data-s=\"5\">In ea res ipse experiris.<\/span> <span class=\"sg\" data-s=\"6\">Et palaestram habet.<\/span> <span class=\"sg\" data-s=\"7\">Ibi Raku currere potes sine ulla installatione.<\/span> <span class=\"sg\" data-s=\"8\">Omnes hae paginae ipso mutsu currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu suum exemplar instrumenti moderandi modulos zef habet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc exemplar nomen <code>mzef<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque modulos Raku pro mutsu more solito installare potes.<\/span> <span class=\"sg\" data-s=\"3\">Scribe <code>mzef install<\/code> et deinde nomen moduli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Eum apud <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a> invenire potes.<\/span> <span class=\"sg\" data-s=\"2\">Pagina etiam versiones emissas et praecepta aedificandi habet.<\/span><\/p>"]]}}}</script>
