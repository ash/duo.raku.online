qué.<\/span> <span class=\"sg\" data-s=\"4\">En ese caso, la función <code>factorial<\/code> recibe un valor <a href=\"https://course.raku.org/es/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Así que Raku no puede usar la primera variante de la multi-función.<\/span> <span class=\"sg\" data-s=\"6\">La llamada recursiva <code>factorial(2 - 1)<\/code> es diferente.<\/span> <span class=\"sg\" data-s=\"7\">Allí, el argumento es un entero.<\/span> <span class=\"sg\" data-s=\"8\">Así que Raku puede llamar a la primera variante.<\/span><\/p>"]]},"it":{"t":"Solution: Fattoriale con multi-funzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo esercizio parla ancora di fattoriali.<\/span> <span class=\"sg\" data-s=\"1\">Con questo compito, possiamo mostrare altre caratteristiche di Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per calcolare un fattoriale, possiamo partire dal numero dato.<\/span> <span class=\"sg\" data-s=\"1\">Poi scendiamo.<\/span> <span class=\"sg\" data-s=\"2\">Dobbiamo fermarci quando il numero è 1.<\/span> <span class=\"sg\" data-s=\"3\">Le multi-funzioni possono farlo.<\/span> <span class=\"sg\" data-s=\"4\">Metti il caso <code>$n == 1<\/code> in una multi-funzione a parte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco la soluzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data- nājums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentārs<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka programma pārvērš ievades argumentu par veselu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Tā to dara ar <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bez tā ievade <code>1<\/code> dod bezgalīgu ciklu.<\/span> <span class=\"sg\" data-s=\"3\">Lūk, kāpēc.<\/span> <span class=\"sg\" data-s=\"4\">Tad funkcija <code>factorial<\/code> saņem <a href=\"https://course.raku.org/lv/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a> vērtību.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc Raku nevar izmantot daudzfunkcijas pirmo variantu.<\/span> <span class=\"sg\" data-s=\"6\">Rekursīvais izsaukums <code>factorial(2 - 1)<\/code> ir citāds.<\/span> <span class=\"sg\" data-s=\"7\">Tur arguments ir vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc Raku var izsaukt pirmo variantu.<\/span><\/p>"]]},"ru":{"t":"Решение: Факториал с мульти-функциями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Это упражнение снова о факториалах.<\/span> <span class=\"sg\" data-s=\"1\">На этой задаче мы можем показать больше возможностей Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Чтобы найти факториал, можно начать с данного числа.<\/span> <span class=\"sg\" data-s=\"1\">Потом мы идём вниз.<\/span> <span class=\"sg\" data-s=\"2\">Мы должны остановиться, когда число равно 1.<\/span> <span class=\"sg\" data-s=\"3\">Multi-функции умеют это делать.<\/span> <span class=\"sg\" data-s=\"4\">Поместите случай <code>$n == 1<\/code> в отдельную multi-функцию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарий<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: программа превращает входной аргумент в целое число.<\/span> <span class=\"sg\" data-s=\"1\">Она делает это с помощью <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без этого при вводе <code>1<\/code> получается бесконечный цикл.<\/span> <span class=\"sg\" data-s=\"3\">Вот почему.<\/span> <span class=\"sg\" data-s=\"4\">Тогда функция <code>factorial<\/code> получает значение <a href=\"https://course.raku.org/ru/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому Raku не может использовать первый вариант multi-функции.<\/span> <span class=\"sg\" data-s=\"6\">Рекурсивный вызов <code>factorial(2 - 1)<\/code> — другое дело.<\/span> <span class=\"sg\" data-s=\"7\">Там аргумент — целое число.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому Raku может вызвать первый вариант.<\/span><\/p>"]]},"uk":{"t":"Solution: Факторіал з мульти-функціями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця вправа знову про факторіали.<\/span> <span class=\"sg\" data-s=\"1\">На цьому завданні ми можемо показати більше можливостей Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Щоб знайти факторіал, ми можемо почати з даного числа.<\/span> <span class=\"sg\" data-s=\"1\">Потім ми рухаємося вниз.<\/span> <span class=\"sg\" data-s=\"2\">Ми маємо зупинитися, коли число дорівнює 1.<\/span> <span class=\"sg\" data-s=\"3\">Multi-функції можуть це зробити.<\/span> <span class=\"sg\" data-s=\"4\">Винесіть випадок <code>$n == 1<\/code> в окрему multi-функцію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось розв'язок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що програма перетворює вхідний аргумент на ціле число.<\/span> <span class=\"sg\" data-s=\"1\">Вона робить це за до ons.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че програмата превръща входния аргумент в цяло число.<\/span> <span class=\"sg\" data-s=\"1\">Тя прави това с <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без това входът <code>1<\/code> дава безкраен цикъл.<\/span> <span class=\"sg\" data-s=\"3\">Ето причината.<\/span> <span class=\"sg\" data-s=\"4\">Тогава функцията <code>factorial<\/code> получава стойност от тип <a href=\"https://course.raku.org/bg/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Затова Raku не може да използва първия вариант на мулти-функцията.<\/span> <span class=\"sg\" data-s=\"6\">Рекурсивното извикване <code>factorial(2 - 1)<\/code> е различно.<\/span> <span class=\"sg\" data-s=\"7\">Там аргументът е цяло число.<\/span> <span class=\"sg\" data-s=\"8\">Затова Raku може да извика първия вариант.<\/span><\/p>"]]},"eo":{"t":"Solvo: Faktorialo kun multi-funkcioj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzerco denove temas pri faktorioj.<\/span> <span class=\"sg\" data-s=\"1\">Per ĉi tiu tasko, ni povas montri pli da trajtoj de Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Por trovi faktorion, ni povas komenci ĉe la donita nombro.<\/span> <span class=\"sg\" data-s=\"1\">Poste ni iras malsupren.<\/span> <span class=\"sg\" data-s=\"2\">Ni devas halti, kiam la nombro estas 1.<\/span> <span class=\"sg\" data-s=\"3\">Multi-funkcioj povas fari tion.<\/span> <span class=\"sg\" data-s=\"4\">Metu la kazon <code>$n == 1<\/cod iterum de factorialibus est.<\/span> <span class=\"sg\" data-s=\"1\">Hoc munere plures proprietates Raku ostendere possumus.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ut factorialem inveniamus, a numero dato incipere possumus.<\/span> <span class=\"sg\" data-s=\"1\">Deinde descendimus.<\/span> <span class=\"sg\" data-s=\"2\">Consistere debemus cum numerus est 1.<\/span> <span class=\"sg\" data-s=\"3\">Multi-functiones hoc facere possunt.<\/span> <span class=\"sg\" data-s=\"4\">Pone casum <code>$n == 1<\/code> in suam multi-functionem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenias programmatum in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Nota: programma argumentum inputum in integrum mutat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc per <code>@*ARGS[0].Int<\/code> facit.<\/span> <span class=\"sg\" data-s=\"2\">Sine eo, inputum <code>1<\/code> circulum infinitum dat.<\/span> <span class=\"sg\" data-s=\"3\">Ecce causa.<\/span> <span class=\"sg\" data-s=\"4\">Functio <code>factorial<\/code> tum valorem <a href=\"https://course.raku.org/la/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a> accipit.<\/span> <span class=\"sg\" data-s=\"5\">Itaque Raku primam variantem multi-functionis adhibere non potest.<\/span> <span class=\"sg\" data-s=\"6\">Vocatio recursiva <code>factorial(2 - 1)<\/code> alia est.<\/span> <span class=\"sg\" data-s=\"7\">Ibi argumentum est integer.<\/span> <span class=\"sg\" data-s=\"8\">Itaque Raku primam variantem vocare potest.<\/span><\/p>"]]}}}</script>
