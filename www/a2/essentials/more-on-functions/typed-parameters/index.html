<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/typed-parameters","n":300,"k":"topic","pv":"essentials/more-on-functions/mind-the-space","nx":"essentials/more-on-functions/typed-parameters/quiz","tr":["essentials","essentials/more-on-functions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Typed parameters of functions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, a function parameter can have a type.<\/span> <span class=\"sg\" data-s=\"1\">Then it only takes values of this type.<\/span> <span class=\"sg\" data-s=\"2\">This is very much like <a href=\"/essentials/typed-variables/type-constraints/\">typed variables<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now the arguments of the function must be integers.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can pass only <code>Int<\/code> values.<\/span> <span class=\"sg\" data-s=\"1\">Any other type gives a compile-time error.<\/span> <span class=\"sg\" data-s=\"2\">Such an error comes before the program runs.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Note that Raku does not convert the types for you here.<\/span> <span class=\"sg\" data-s=\"1\">In other cases, such a conversion is possible.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK and is 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Is it a compile-time error?<\/span> <span class=\"sg\" data-s=\"1\">Look at the start of the error message.<\/span> <span class=\"sg\" data-s=\"2\">Is it <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Then the error happened at compile time. %%/tipblock<\/span><\/p>"]]},"de":{"t":"Typisierte Parameter","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku kann ein Funktionsparameter einen Typ haben.<\/span> <span class=\"sg\" data-s=\"1\">Dann nimmt er nur Werte von diesem Typ.<\/span> <span class=\"sg\" data-s=\"2\">Das ist sehr ähnlich wie bei <a href=\"https://course.raku.org/de/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">typisierten Variablen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt müssen die Argumente der Funktion ganze Zahlen sein.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fehler<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können nur Werte vom Typ <code>Int<\/code> übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Jeder andere Typ führt zu einem Kompilierungsfehler.<\/span> <span class=\"sg\" data-s=\"2\">So ein Fehler kommt vor dem Start des Programms.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Fehler beim Kompilieren von t.raku\nDas Aufrufen von add(Num, Num) wird niemals mit der deklarierten Signatur (Int $x, Int $y) funktionieren\nin t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie: Raku wandelt die Typen hier nicht für Sie um.<\/span> <span class=\"sg\" data-s=\"1\">In anderen Fällen ist so eine Umwandlung möglich.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fehler\nsay '3' + '4'; # OK und ergibt 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Ist es ein Kompilierungsfehler?<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich den Anfang der Fehlermeldung an.<\/span> <span class=\"sg\" data-s=\"2\">Steht dort <code>===SORRY!=== Fehler beim Kompilieren<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Dann ist der Fehler zur Kompilierzeit passiert. %%/tipblock<\/span><\/p>"]]},"nl":{"t":"Getypte parameters","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku kan een parameter van een functie een type hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dan neemt de parameter alleen waarden van dit type aan.<\/span> <span class=\"sg\" data-s=\"2\">Dit lijkt heel erg op <a href=\"https://course.raku.org/nl/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">getypte variabelen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu moeten de argumenten van de functie gehele getallen zijn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fout<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt alleen <code>Int<\/code>-waarden doorgeven.<\/span> <span class=\"sg\" data-s=\"1\">Elk ander type geeft een compile-tijd fout.<\/span> <span class=\"sg\" data-s=\"2\">Zo'n fout komt al voordat het programma draait.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Let op: Raku zet de types hier niet voor je om.<\/span> <span class=\"sg\" data-s=\"1\">In andere gevallen is zo'n omzetting wel mogelijk.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fout\nsay '3' + '4'; # OK en is 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Is het een compile-tijd fout?<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar het begin van het foutbericht.<\/span> <span class=\"sg\" data-s=\"2\">Is het <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Dan gebeurde de fout op compile-tijd. %%/tipblock<\/span><\/p>"]]},"es":{"t":"Parámetros tipados","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, un parámetro de función puede tener un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Entonces solo acepta valores de este tipo.<\/span> <span class=\"sg\" data-s=\"2\">Esto es muy parecido a las <a href=\"https://course.raku.org/es/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variables tipadas<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora los argumentos de la función deben ser enteros.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Solo puedes pasar valores <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cualquier otro tipo da un error de compilación.<\/span> <span class=\"sg\" data-s=\"2\">Este error aparece antes de ejecutar el programa.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota que aquí Raku no convierte los tipos por ti.<\/span> <span class=\"sg\" data-s=\"1\">En otros casos, esta conversión es posible.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK y es 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## ¿Es un error de compilación?<\/span> <span class=\"sg\" data-s=\"1\">Mira el principio del mensaje de error.<\/span> <span class=\"sg\" data-s=\"2\">¿Es <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Entonces el error ocurrió en tiempo de compilación. %%/tipblock<\/span><\/p>"]]},"it":{"t":"Parametri tipizzati","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, un parametro di una funzione può avere un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Allora prende solo valori di questo tipo.<\/span> <span class=\"sg\" data-s=\"2\">È molto simile alle <a href=\"https://course.raku.org/it/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabili tipizzate<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora gli argomenti della funzione devono essere numeri interi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Errore<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi passare solo valori <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni altro tipo dà un errore di compilazione.<\/span> <span class=\"sg\" data-s=\"2\">Questo errore arriva prima che il programma parta.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che qui Raku non converte i tipi per te.<\/span> <span class=\"sg\" data-s=\"1\">In altri casi, questa conversione è possibile.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Errore\nsay '3' + '4'; # OK ed è 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## È un errore di compilazione?<\/span> <span class=\"sg\" data-s=\"1\">Guarda l'inizio del messaggio di errore.<\/span> <span class=\"sg\" data-s=\"2\">È <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Allora l'errore è avvenuto durante la compilazione. %%/tipblock<\/span><\/p>"]]},"lv":{"t":"Tipizētie parametri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā funkcijas parametram var būt tips.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas pieņem tikai šī tipa vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir ļoti līdzīgi <a href=\"https://course.raku.org/lv/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tipizētajiem mainīgajiem<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad funkcijas argumentiem jābūt veseliem skaitļiem.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Kļūda<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat nodot tikai <code>Int<\/code> vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Jebkurš cits tips dod kļūdu kompilācijas laikā.<\/span> <span class=\"sg\" data-s=\"2\">Šāda kļūda rodas pirms programmas palaišanas.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Kļūda kompilējot t.raku\nIzsaukums add(Num, Num) nekad nedarbosies ar deklarēto parakstu (Int $x, Int $y)\nt.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka šeit Raku jūsu vietā nepārvērš tipus.<\/span> <span class=\"sg\" data-s=\"1\">Citos gadījumos šāda pārvēršana ir iespējama.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Kļūda\nsay '3' + '4'; # OK un ir 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Vai tā ir kļūda kompilācijas laikā?<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet kļūdas ziņojuma sākumu.<\/span> <span class=\"sg\" data-s=\"2\">Vai tas ir <code>===SORRY!=== Kļūda kompilējot<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tad kļūda notika kompilācijas laikā. %%/tipblock<\/span><\/p>"]]},"ru":{"t":"Типизированные параметры","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku у параметра функции может быть тип.<\/span> <span class=\"sg\" data-s=\"1\">Тогда он принимает только значения этого типа.<\/span> <span class=\"sg\" data-s=\"2\">Это очень похоже на <a href=\"https://course.raku.org/ru/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизированные переменные<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь аргументы функции должны быть целыми числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Ошибка<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы можете передавать только значения <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Любой другой тип даёт ошибку времени компиляции.<\/span> <span class=\"sg\" data-s=\"2\">Такая ошибка появляется ещё до запуска программы.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: здесь Raku сам не преобразует типы.<\/span> <span class=\"sg\" data-s=\"1\">В других случаях такое преобразование возможно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Ошибка\nsay '3' + '4'; # OK и результат 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Это ошибка времени компиляции?<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на начало сообщения об ошибке.<\/span> <span class=\"sg\" data-s=\"2\">Оно начинается с <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тогда ошибка произошла во время компиляции. %%/tipblock<\/span><\/p>"]]},"uk":{"t":"Типізовані параметри","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku параметр функції може мати тип.<\/span> <span class=\"sg\" data-s=\"1\">Тоді він приймає лише значення цього типу.<\/span> <span class=\"sg\" data-s=\"2\">Це дуже схоже на <a href=\"https://course.raku.org/uk/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типізовані змінні<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер аргументи функції мають бути цілими числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Помилка<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете передавати лише значення <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Будь-який інший тип дає помилку під час компіляції.<\/span> <span class=\"sg\" data-s=\"2\">Така помилка буває ще до запуску програми.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу: тут Raku не перетворює типи за вас.<\/span> <span class=\"sg\" data-s=\"1\">В інших випадках таке перетворення можливе.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Помилка\nsay '3' + '4'; # OK і результат 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Це помилка під час компіляції?<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на початок повідомлення про помилку.<\/span> <span class=\"sg\" data-s=\"2\">Там написано <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тоді помилка сталася під час компіляції. %%/tipblock<\/span><\/p>"]]},"bg":{"t":"Типизирани параметри","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku параметърът на функция може да има тип.<\/span> <span class=\"sg\" data-s=\"1\">Тогава той приема само стойности от този тип.<\/span> <span class=\"sg\" data-s=\"2\">Това много прилича на <a href=\"https://course.raku.org/bg/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизираните променливи<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега аргументите на функцията трябва да са цели числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Грешка<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да предавате само стойности <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всеки друг тип дава грешка по време на компилация.<\/span> <span class=\"sg\" data-s=\"2\">Такава грешка идва, преди програмата да се стартира.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че тук Raku не превръща типовете вместо вас.<\/span> <span class=\"sg\" data-s=\"1\">В други случаи такова превръщане е възможно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Грешка\nsay '3' + '4'; # ОК и е 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Дали грешката е по време на компилация?<\/span> <span class=\"sg\" data-s=\"1\">Вижте началото на съобщението за грешка.<\/span> <span class=\"sg\" data-s=\"2\">Започва ли то с <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Тогава грешката е станала по време на компилация. %%/tipblock<\/span><\/p>"]]},"eo":{"t":"Tipitaj parametroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, parametro de funkcio povas havi tipon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi prenas nur valorojn de tiu tipo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tio estas tre simila al <a href=\"https://course.raku.org/eo/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tipitaj variabloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la argumentoj de la funkcio devas esti entjeroj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Eraro<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas pasi nur valorojn de tipo <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu alia tipo donas kompila-tempan eraron.<\/span> <span class=\"sg\" data-s=\"2\">Tia eraro okazas antaŭ ol la programo ruliĝas.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke Raku ne konvertas la tipojn por vi ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">En aliaj kazoj, tia konverto eblas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Eraro\nsay '3' + '4'; # BONE kaj estas 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Ĉu ĝi estas kompila-tempa eraro?<\/span> <span class=\"sg\" data-s=\"1\">Rigardu la komencon de la erarmesaĝo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉu ĝi estas <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tiam la eraro okazis dum kompila tempo. %%/tipblock<\/span><\/p>"]]},"la":{"t":"Typis parametra","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku parameter functionis typum habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum solum valores huius typi accipit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc valde simile est <a href=\"https://course.raku.org/la/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabilibus typatis<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc argumenta functionis numeri integri esse debent.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Solum valores <code>Int<\/code> transmittere potes.<\/span> <span class=\"sg\" data-s=\"1\">Quilibet alius typus errorem temporis compilationis dat.<\/span> <span class=\"sg\" data-s=\"2\">Talis error venit antequam programma currit.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota: Raku hic typos pro te non convertit.<\/span> <span class=\"sg\" data-s=\"1\">In aliis casibus talis conversio possibilis est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK et est 7<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Estne error temporis compilationis?<\/span> <span class=\"sg\" data-s=\"1\">Specta initium nuntii erroris.<\/span> <span class=\"sg\" data-s=\"2\">Estne <code>===SORRY!=== Error while compiling<\/code>?<\/span> <span class=\"sg\" data-s=\"3\">Tum error tempore compilationis accidit. %%/tipblock<\/span><\/p>"]]}}}</script>
