<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/multi-functions","n":304,"k":"topic","pv":"essentials/more-on-functions/return-type/quiz","nx":"essentials/more-on-functions/multi-functions/quiz1","tr":["essentials","essentials/more-on-functions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multi-functions","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku has <em>multiple dispatch<\/em> based on the signature of a function.<\/span> <span class=\"sg\" data-s=\"1\">With it, several functions can have the same name.<\/span> <span class=\"sg\" data-s=\"2\">But they take different types of input data.<\/span> <span class=\"sg\" data-s=\"3\">Write the declarator <code>multi<\/code> before each variant of the function.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can leave out <code>sub<\/code> after <code>multi<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, the same function has two variants.<\/span> <span class=\"sg\" data-s=\"1\">The compiler looks at the arguments in each call.<\/span> <span class=\"sg\" data-s=\"2\">Then it chooses the right variant.<\/span> <span class=\"sg\" data-s=\"3\">This is multiple dispatch.<\/span> <span class=\"sg\" data-s=\"4\">Compare these two calls:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The first call runs the variant with integer parameters.<\/span> <span class=\"sg\" data-s=\"1\">The second call runs the second variant.<\/span> <span class=\"sg\" data-s=\"2\">That variant expects two strings.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literal parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is an interesting case.<\/span> <span class=\"sg\" data-s=\"1\">A variant can have a literal value as a parameter.<\/span> <span class=\"sg\" data-s=\"2\">A literal is a value in the code, like <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Look at these two variants:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'This is the answer'}\nmulti sub f($x) {say \"$x is not the answer\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku runs the first variant only when the argument is exactly 42.<\/span> <span class=\"sg\" data-s=\"1\">In all other cases, Raku runs the second variant.<\/span> <span class=\"sg\" data-s=\"2\">The order of the two definitions does not matter.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is not the answer\nf(42); # This is the answer<\/code><\/pre>"]]},"de":{"t":"Multi-Funktionen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku hat <em>Multiple Dispatch<\/em> auf Basis der Signatur einer Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Damit können mehrere Funktionen denselben Namen haben.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie nehmen verschiedene Typen von Eingabedaten.<\/span> <span class=\"sg\" data-s=\"3\">Schreiben Sie den Deklarator <code>multi<\/code> vor jede Variante der Funktion.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können <code>sub<\/code> nach <code>multi<\/code> weglassen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier hat dieselbe Funktion zwei Varianten.<\/span> <span class=\"sg\" data-s=\"1\">Der Compiler sieht sich die Argumente in jedem Aufruf an.<\/span> <span class=\"sg\" data-s=\"2\">Dann wählt er die richtige Variante.<\/span> <span class=\"sg\" data-s=\"3\">Das ist Multiple Dispatch.<\/span> <span class=\"sg\" data-s=\"4\">Vergleichen Sie diese zwei Aufrufe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf führt die Variante mit ganzzahligen Parametern aus.<\/span> <span class=\"sg\" data-s=\"1\">Der zweite Aufruf führt die zweite Variante aus.<\/span> <span class=\"sg\" data-s=\"2\">Diese Variante erwartet zwei Zeichenketten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literale Parameter<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein interessanter Fall.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variante kann einen literalen Wert als Parameter haben.<\/span> <span class=\"sg\" data-s=\"2\">Ein Literal ist ein Wert im Code, wie <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sehen Sie sich diese zwei Varianten an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Das ist die Antwort'}\nmulti sub f($x) {say \"$x ist nicht die Antwort\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku führt die erste Variante nur aus, wenn das Argument genau 42 ist.<\/span> <span class=\"sg\" data-s=\"1\">In allen anderen Fällen führt Raku die zweite Variante aus.<\/span> <span class=\"sg\" data-s=\"2\">Die Reihenfolge der zwei Definitionen spielt keine Rolle.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ist nicht die Antwort\nf(42); # Das ist die Antwort<\/code><\/pre>"]]},"nl":{"t":"Multi-functies","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku heeft <em>meervoudige dispatch<\/em> op basis van de signatuur van een functie.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kunnen meerdere functies dezelfde naam hebben.<\/span> <span class=\"sg\" data-s=\"2\">Maar ze krijgen verschillende soorten invoergegevens.<\/span> <span class=\"sg\" data-s=\"3\">Schrijf de declarator <code>multi<\/code> voor elke variant van de functie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt <code>sub<\/code> na <code>multi<\/code> weglaten.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier heeft dezelfde functie twee varianten.<\/span> <span class=\"sg\" data-s=\"1\">De compiler kijkt naar de argumenten in elke aanroep.<\/span> <span class=\"sg\" data-s=\"2\">Dan kiest hij de juiste variant.<\/span> <span class=\"sg\" data-s=\"3\">Dit is meervoudige dispatch.<\/span> <span class=\"sg\" data-s=\"4\">Vergelijk deze twee aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep voert de variant met integer-parameters uit.<\/span> <span class=\"sg\" data-s=\"1\">De tweede aanroep voert de tweede variant uit.<\/span> <span class=\"sg\" data-s=\"2\">Die variant verwacht twee strings.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Letterlijke parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is een interessant geval.<\/span> <span class=\"sg\" data-s=\"1\">Een variant kan een letterlijke waarde als parameter hebben.<\/span> <span class=\"sg\" data-s=\"2\">Een letterlijke waarde is een waarde in de code, zoals <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kijk naar deze twee varianten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Dit is het antwoord'}\nmulti sub f($x) {say \"$x is niet het antwoord\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku voert de eerste variant alleen uit als het argument precies 42 is.<\/span> <span class=\"sg\" data-s=\"1\">In alle andere gevallen voert Raku de tweede variant uit.<\/span> <span class=\"sg\" data-s=\"2\">De volgorde van de twee definities maakt niet uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is niet het antwoord\nf(42); # Dit is het antwoord<\/code><\/pre>"]]},"es":{"t":"Multi-funciones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku tiene <em>despacho múltiple<\/em> basado en la firma de una función.<\/span> <span class=\"sg\" data-s=\"1\">Con él, varias funciones pueden tener el mismo nombre.<\/span> <span class=\"sg\" data-s=\"2\">Pero toman diferentes tipos de datos de entrada.<\/span> <span class=\"sg\" data-s=\"3\">Escribe el declarador <code>multi<\/code> antes de cada variante de la función.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes omitir <code>sub<\/code> después de <code>multi<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, la misma función tiene dos variantes.<\/span> <span class=\"sg\" data-s=\"1\">El compilador mira los argumentos en cada llamada.<\/span> <span class=\"sg\" data-s=\"2\">Después elige la variante correcta.<\/span> <span class=\"sg\" data-s=\"3\">Esto es el despacho múltiple.<\/span> <span class=\"sg\" data-s=\"4\">Compara estas dos llamadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La primera llamada ejecuta la variante con parámetros enteros.<\/span> <span class=\"sg\" data-s=\"1\">La segunda llamada ejecuta la segunda variante.<\/span> <span class=\"sg\" data-s=\"2\">Esa variante espera dos cadenas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros literales<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un caso interesante.<\/span> <span class=\"sg\" data-s=\"1\">Una variante puede tener un valor literal como parámetro.<\/span> <span class=\"sg\" data-s=\"2\">Un literal es un valor escrito en el código, como <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mira estas dos variantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Esta es la respuesta'}\nmulti sub f($x) {say \"$x no es la respuesta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ejecuta la primera variante solo cuando el argumento es exactamente 42.<\/span> <span class=\"sg\" data-s=\"1\">En todos los otros casos, Raku ejecuta la segunda variante.<\/span> <span class=\"sg\" data-s=\"2\">El orden de las dos definiciones no importa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 no es la respuesta\nf(42); # Esta es la respuesta<\/code><\/pre>"]]},"it":{"t":"Multi-funzioni","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ha il <em>multiple dispatch<\/em> basato sulla firma di una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Con il multiple dispatch, più funzioni possono avere lo stesso nome.<\/span> <span class=\"sg\" data-s=\"2\">Ma prendono tipi diversi di dati di input.<\/span> <span class=\"sg\" data-s=\"3\">Scrivi il dichiaratore <code>multi<\/code> prima di ogni variante della funzione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo <code>multi<\/code>, puoi non scrivere <code>sub<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui, la stessa funzione ha due varianti.<\/span> <span class=\"sg\" data-s=\"1\">Il compilatore guarda gli argomenti di ogni chiamata.<\/span> <span class=\"sg\" data-s=\"2\">Poi sceglie la variante giusta.<\/span> <span class=\"sg\" data-s=\"3\">Questo è il multiple dispatch.<\/span> <span class=\"sg\" data-s=\"4\">Confronta queste due chiamate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata esegue la variante con parametri interi.<\/span> <span class=\"sg\" data-s=\"1\">La seconda chiamata esegue la seconda variante.<\/span> <span class=\"sg\" data-s=\"2\">Quella variante si aspetta due stringhe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri letterali<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco un caso interessante.<\/span> <span class=\"sg\" data-s=\"1\">Una variante può avere un valore letterale come parametro.<\/span> <span class=\"sg\" data-s=\"2\">Un letterale è un valore scritto nel codice, come <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Guarda queste due varianti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Questa è la risposta'}\nmulti sub f($x) {say \"$x non è la risposta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku esegue la prima variante solo quando l'argomento è esattamente 42.<\/span> <span class=\"sg\" data-s=\"1\">In tutti gli altri casi, Raku esegue la seconda variante.<\/span> <span class=\"sg\" data-s=\"2\">L'ordine delle due definizioni non importa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non è la risposta\nf(42); # Questa è la risposta<\/code><\/pre>"]]},"lv":{"t":"Daudzfunkcijas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir <em>vairākkārtējs izsaukums<\/em>, kas balstās uz funkcijas parakstu.<\/span> <span class=\"sg\" data-s=\"1\">Ar to vairākām funkcijām var būt vienāds nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Bet tās pieņem dažādu tipu ievaddatus.<\/span> <span class=\"sg\" data-s=\"3\">Uzrakstiet deklaratoru <code>multi<\/code> pirms katra funkcijas varianta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc <code>multi<\/code> jūs varat izlaist <code>sub<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit vienai funkcijai ir divi varianti.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators skatās uz argumentiem katrā izsaukumā.<\/span> <span class=\"sg\" data-s=\"2\">Tad tas izvēlas pareizo variantu.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir vairākkārtējs izsaukums.<\/span> <span class=\"sg\" data-s=\"4\">Salīdziniet šos divus izsaukumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmais izsaukums palaiž variantu ar veselu skaitļu parametriem.<\/span> <span class=\"sg\" data-s=\"1\">Otrais izsaukums palaiž otro variantu.<\/span> <span class=\"sg\" data-s=\"2\">Šis variants gaida divas virknes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literālie parametri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lūk, interesants gadījums.<\/span> <span class=\"sg\" data-s=\"1\">Variantam kā parametrs var būt literāla vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Literālis ir vērtība kodā, piemēram, <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Apskatiet šos divus variantus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Šī ir atbilde'}\nmulti sub f($x) {say \"$x nav atbilde\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku palaiž pirmo variantu tikai tad, ja arguments ir tieši 42.<\/span> <span class=\"sg\" data-s=\"1\">Visos citos gadījumos Raku palaiž otro variantu.<\/span> <span class=\"sg\" data-s=\"2\">Abu definīciju secība nav svarīga.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 nav atbilde\nf(42); # Šī ir atbilde<\/code><\/pre>"]]},"ru":{"t":"Мульти-функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku есть <em>множественная диспетчеризация<\/em> по сигнатуре функции.<\/span> <span class=\"sg\" data-s=\"1\">С ней у нескольких функций может быть одно имя.<\/span> <span class=\"sg\" data-s=\"2\">Но они принимают разные типы входных данных.<\/span> <span class=\"sg\" data-s=\"3\">Пишите декларатор <code>multi<\/code> перед каждым вариантом функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После <code>multi<\/code> можно не писать <code>sub<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь у одной функции два варианта.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор смотрит на аргументы в каждом вызове.<\/span> <span class=\"sg\" data-s=\"2\">Потом он выбирает нужный вариант.<\/span> <span class=\"sg\" data-s=\"3\">Это и есть множественная диспетчеризация.<\/span> <span class=\"sg\" data-s=\"4\">Сравните эти два вызова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Первый вызов запускает вариант с целочисленными параметрами.<\/span> <span class=\"sg\" data-s=\"1\">Второй вызов запускает второй вариант.<\/span> <span class=\"sg\" data-s=\"2\">Этот вариант ожидает две строки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литеральные параметры<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот интересный случай.<\/span> <span class=\"sg\" data-s=\"1\">Параметром варианта может быть литеральное значение.<\/span> <span class=\"sg\" data-s=\"2\">Литерал — это значение прямо в коде, например <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Посмотрите на эти два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Это ответ'}\nmulti sub f($x) {say \"$x не является ответом\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku запускает первый вариант, только когда аргумент равен ровно 42.<\/span> <span class=\"sg\" data-s=\"1\">Во всех других случаях Raku запускает второй вариант.<\/span> <span class=\"sg\" data-s=\"2\">Порядок двух определений не важен.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не является ответом\nf(42); # Это ответ<\/code><\/pre>"]]},"uk":{"t":"Мульти-функції","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku є <em>множинна диспетчеризація<\/em> на основі сигнатури функції.<\/span> <span class=\"sg\" data-s=\"1\">Завдяки їй кілька функцій можуть мати одну назву.<\/span> <span class=\"sg\" data-s=\"2\">Але вони приймають різні типи вхідних даних.<\/span> <span class=\"sg\" data-s=\"3\">Пишіть декларацію <code>multi<\/code> перед кожним варіантом функції.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після <code>multi<\/code> можна не писати <code>sub<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут одна й та сама функція має два варіанти.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор дивиться на аргументи в кожному виклику.<\/span> <span class=\"sg\" data-s=\"2\">Потім він вибирає потрібний варіант.<\/span> <span class=\"sg\" data-s=\"3\">Це і є множинна диспетчеризація.<\/span> <span class=\"sg\" data-s=\"4\">Порівняйте ці два виклики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перший виклик запускає варіант із цілими параметрами.<\/span> <span class=\"sg\" data-s=\"1\">Другий виклик запускає другий варіант.<\/span> <span class=\"sg\" data-s=\"2\">Цей варіант очікує два рядки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Літеральні параметри<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось цікавий випадок.<\/span> <span class=\"sg\" data-s=\"1\">Варіант може мати літеральне значення як параметр.<\/span> <span class=\"sg\" data-s=\"2\">Літерал — це значення прямо в коді, як <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Подивіться на ці два варіанти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Це відповідь'}\nmulti sub f($x) {say \"$x не є відповіддю\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku запускає перший варіант, лише коли аргумент дорівнює саме 42.<\/span> <span class=\"sg\" data-s=\"1\">В усіх інших випадках Raku запускає другий варіант.<\/span> <span class=\"sg\" data-s=\"2\">Порядок двох визначень не має значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не є відповіддю\nf(42); # Це відповідь<\/code><\/pre>"]]},"bg":{"t":"Мулти-функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku има <em>многократно разпределение<\/em> според подписа на функцията.<\/span> <span class=\"sg\" data-s=\"1\">С него няколко функции могат да имат едно и също име.<\/span> <span class=\"sg\" data-s=\"2\">Но те приемат различни типове входни данни.<\/span> <span class=\"sg\" data-s=\"3\">Напишете декларатора <code>multi<\/code> пред всеки вариант на функцията.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да пропуснете <code>sub<\/code> след <code>multi<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук една и съща функция има два варианта.<\/span> <span class=\"sg\" data-s=\"1\">Компилаторът гледа аргументите във всяко извикване.<\/span> <span class=\"sg\" data-s=\"2\">После избира правилния вариант.<\/span> <span class=\"sg\" data-s=\"3\">Това е многократно разпределение.<\/span> <span class=\"sg\" data-s=\"4\">Сравнете тези две извиквания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първото извикване изпълнява варианта с целочислени параметри.<\/span> <span class=\"sg\" data-s=\"1\">Второто извикване изпълнява втория вариант.<\/span> <span class=\"sg\" data-s=\"2\">Този вариант очаква два низа.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литерални параметри<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето един интересен случай.<\/span> <span class=\"sg\" data-s=\"1\">Един вариант може да има литерална стойност като параметър.<\/span> <span class=\"sg\" data-s=\"2\">Литералът е стойност в кода, например <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вижте тези два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Това е отговорът'}\nmulti sub f($x) {say \"$x не е отговорът\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku изпълнява първия вариант само когато аргументът е точно 42.<\/span> <span class=\"sg\" data-s=\"1\">Във всички други случаи Raku изпълнява втория вариант.<\/span> <span class=\"sg\" data-s=\"2\">Редът на двете дефиниции няма значение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не е отговорът\nf(42); # Това е отговорът<\/code><\/pre>"]]},"eo":{"t":"Multi-funkcioj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku havas <em>multoblan sendon<\/em> laŭ la subskribo de funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Per ĝi, pluraj funkcioj povas havi la saman nomon.<\/span> <span class=\"sg\" data-s=\"2\">Sed ili prenas malsamajn tipojn de eniraj datumoj.<\/span> <span class=\"sg\" data-s=\"3\">Skribu la deklarilon <code>multi<\/code> antaŭ ĉiu varianto de la funkcio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas preterlasi <code>sub<\/code> post <code>multi<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la sama funkcio havas du variantojn.<\/span> <span class=\"sg\" data-s=\"1\">La kompililo rigardas la argumentojn en ĉiu voko.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi elektas la ĝustan varianton.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tio estas multobla sendo.<\/span> <span class=\"sg\" data-s=\"4\">Komparu ĉi tiujn du vokojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La unua voko rulas la varianton kun entjeraj parametroj.<\/span> <span class=\"sg\" data-s=\"1\">La dua voko rulas la duan varianton.<\/span> <span class=\"sg\" data-s=\"2\">Tiu varianto atendas du ĉenojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literalaj parametroj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen interesa kazo.<\/span> <span class=\"sg\" data-s=\"1\">Varianto povas havi literalan valoron kiel parametron.<\/span> <span class=\"sg\" data-s=\"2\">Literalo estas valoro en la kodo, kiel <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Rigardu ĉi tiujn du variantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Ĉi tio estas la respondo'}\nmulti sub f($x) {say \"$x ne estas la respondo\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku rulas la unuan varianton nur, kiam la argumento estas ĝuste 42.<\/span> <span class=\"sg\" data-s=\"1\">En ĉiuj aliaj kazoj, Raku rulas la duan varianton.<\/span> <span class=\"sg\" data-s=\"2\">La ordo de la du difinoj ne gravas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ne estas la respondo\nf(42); # Ĉi tio estas la respondo<\/code><\/pre>"]]},"la":{"t":"Multi-functiones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku <em>multiplicem distributionem<\/em> secundum signaturam functionis habet.<\/span> <span class=\"sg\" data-s=\"1\">Cum ea plures functiones idem nomen habere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Sed diversos typos datorum inputorum accipiunt.<\/span> <span class=\"sg\" data-s=\"3\">Scribe declaratorem <code>multi<\/code> ante quamque variantem functionis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes <code>sub<\/code> post <code>multi<\/code> omittere.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic eadem functio duas variantes habet.<\/span> <span class=\"sg\" data-s=\"1\">Compilator argumenta in quaque vocatione spectat.<\/span> <span class=\"sg\" data-s=\"2\">Deinde variantem rectam eligit.<\/span> <span class=\"sg\" data-s=\"3\">Haec est multiplex distributio.<\/span> <span class=\"sg\" data-s=\"4\">Compara has duas vocationes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio variantem cum parametris integris currit.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vocatio secundam variantem currit.<\/span> <span class=\"sg\" data-s=\"2\">Ea varians duas chordas exspectat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literales parametri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecce casus iucundus.<\/span> <span class=\"sg\" data-s=\"1\">Varians valorem literalem ut parametrum habere potest.<\/span> <span class=\"sg\" data-s=\"2\">Valor literalis est valor in codice, ut <code>42<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Specta has duas variantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Hoc est responsum'}\nmulti sub f($x) {say \"$x non est responsum\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku primam variantem solum currit cum argumentum est exacte 42.<\/span> <span class=\"sg\" data-s=\"1\">In omnibus aliis casibus Raku secundam variantem currit.<\/span> <span class=\"sg\" data-s=\"2\">Ordo duarum definitionum non refert.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non est responsum\nf(42); # Hoc est responsum<\/code><\/pre>"]]}}}</script>
