ch problems.<\/span> <span class=\"sg\" data-s=\"3\">Also, try not to use parentheses in other places when you can.<\/span> <span class=\"sg\" data-s=\"4\">For example, you do not need them with <code>if<\/code> and <code>for<\/code>.<\/span><\/p>"]]},"de":{"t":"Achte auf den Abstand","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Funktionen in Raku sind meist leicht zu verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Normalerweise machen sie keine Probleme.<\/span> <span class=\"sg\" data-s=\"2\">Aber passen Sie bei einer Sache auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Schreiben Sie kein Leerzeichen zwischen den Funktionsnamen und die Klammern.<\/span> <span class=\"sg\" data-s=\"1\">In den Klammern stehen die Argumente.<\/span> <span class=\"sg\" data-s=\"2\">Aber nach <code>for<\/code> und <code>if<\/code> setzen Sie ein Leerzeichen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lange Geschichte<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine einfache Funktion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich zuerst den Namen der Funktion an.<\/span> <span class=\"sg\" data-s=\"1\">Die öffnende Klammer kommt direkt danach, ohne Leerzeichen.<\/span> <span class=\"sg\" data-s=\"2\">Die Parameter stehen in diesen Klammern.<\/span> <span class=\"sg\" data-s=\"3\">Manche Code-Stile in anderen Sprachen brauchen dort ein Leerzeichen.<\/span> <span class=\"sg\" data-s=\"4\">Raku akzeptiert das auch.<\/span> <span class=\"sg\" data-s=\"5\">Aber das ist kein guter Weg, Code zu schreiben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bei einem Funktionsaufruf ist das fehlende Leerzeichen wichtig.<\/span> <span class=\ or<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fazit<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier ist also das Wichtigste.<\/span> <span class=\"sg\" data-s=\"1\">Setzen Sie kein Leerzeichen zwischen einen Funktionsnamen und seine Klammern.<\/span> <span class=\"sg\" data-s=\"2\">Dann vermeiden Sie solche Probleme.<\/span> <span class=\"sg\" data-s=\"3\">Versuchen Sie auch, an anderen Stellen möglichst keine Klammern zu verwenden.<\/span> <span class=\"sg\" data-s=\"4\">Zum Beispiel brauchen Sie sie bei <code>if<\/code> und <code>for<\/code> nicht.<\/span><\/p>"]]},"nl":{"t":"Let op de spatie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Functies in Raku zijn meestal makkelijk te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Ze geven bijna nooit problemen.<\/span> <span class=\"sg\" data-s=\"2\">Maar let op één ding.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zet geen spatie tussen de naam van de functie en de haakjes.<\/span> <span class=\"sg\" data-s=\"1\">Tussen de haakjes staan de argumenten.<\/span> <span class=\"sg\" data-s=\"2\">Maar zet wel een spatie na <code>for<\/code> en <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lang verhaal<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een eenvoudige functie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kijk eerst naar de naam van de functie.<\/span> <span class=\"sg\" data-s=\"1\">Het openingshaakje komt direct na de naam, zonder spatie.<\/span> <span class=\"sg\" data-s=\"2\">De parameters staan tussen deze haakjes.<\/span> <span class=\"sg\" data-s=\"3\">Sommige codestijlen in andere talen willen daar een spatie.<\/span> <span class=\"sg\" data-s=\"4\">Raku accepteert dat ook.<\/span> <span class=\"sg\" data-s=\"5\">Maar zo schrijf je geen goede code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In een functieaanroep is de ontbrekende spatie belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Soms roep je een functie aan zonder haakjes.<\/span> <span class=\"sg\" data-s=\"2\">Dan moet je een spatie na de naam van de functie zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar met haakjes mag er geen spatie voor de haakjes staan.<\/span> <span class=\"sg\" data-s=\"1\">Deze aanroep is goed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En deze aanroep is fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Deze code geeft een uitzondering:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de aanroep met een spatie: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku denkt dat je één argument aan de functie doorgeeft.<\/span> <span class=\"sg\" data-s=\"2\">Dit argument is <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt het type van dit argument makkelijk controleren.<\/span> <span class=\"sg\" data-s=\"4\">Verander de functie.<\/span> <span class=\"sg\" data-s=\"5\">De functie moet maar één argument aannemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De aanroep <code>f (5, 6)<\/code> geeft dus een <a href=\"https://course.raku.org/nl/essentials/positional  necesitan un espacio allí.<\/span> <span class=\"sg\" data-s=\"4\">Raku también lo acepta.<\/span> <span class=\"sg\" data-s=\"5\">Pero no es una buena forma de escribir código:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En una llamada a función, la falta de espacio es importante.<\/span> <span class=\"sg\" data-s=\"1\">A veces llamas a una función sin paréntesis.<\/span> <span class=\"sg\" data-s=\"2\">Entonces debes poner un espacio después del nombre de la función:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero con paréntesis, no debe haber un espacio antes de ellos.<\/span> <span class=\"sg\" data-s=\"1\">Esta llamada es correcta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y esta llamada es incorrecta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este código causa una excepción:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Mira la llamada con un espacio: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku piensa que pasas un solo argumento a la función.<\/span> <span class=\"sg\" data-s=\"2\">Este argumento es <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puedes comprobar fácilmente el tipo de este argumento.<\/span> <span class=\"sg\" data-s=\"4\">Cambia la función.<\/span> <span class=\"sg\" data-s=\"5\">La función debe tomar solo un argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code>< class=\"sg\" data-s=\"1\">El compilador piensa que <code>loop(...)<\/code> es una llamada a función.<\/span> <span class=\"sg\" data-s=\"2\">Agrega un espacio para arreglar el problema.<\/span> <span class=\"sg\" data-s=\"3\">O, mejor, escribe este código con <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusión<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Así que esta es la idea principal.<\/span> <span class=\"sg\" data-s=\"1\">No pongas un espacio entre el nombre de una función y sus paréntesis.<\/span> <span class=\"sg\" data-s=\"2\">Así evitas estos problemas.<\/span> <span class=\"sg\" data-s=\"3\">Además, si puedes, no uses paréntesis en otros lugares.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, no los necesitas con <code>if<\/code> y <code>for<\/code>.<\/span><\/p>"]]},"it":{"t":"Attenzione agli spazi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Le funzioni in Raku sono quasi sempre facili da usare.<\/span> <span class=\"sg\" data-s=\"1\">Di solito, non causano problemi.<\/span> <span class=\"sg\" data-s=\"2\">Ma fai attenzione a una cosa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non scrivere uno spazio tra il nome della funzione e le parentesi.<\/span> <span class=\"sg\" data-s=\"1\">Le parentesi contengono gli argomenti.<\/span> <span class=\"sg\" data-s=\"2\">Ma metti uno spazio dopo <code>for<\/code> e <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Storia lunga<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una funzione semplice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Prima, guarda il nome della funzione.<\/span> <span class=\"sg\" data-s=\"1\">La parentesi aperta viene subito dopo, senza spazio.<\/span> <span class=\"sg\" data-s=\"2\">I parametri sono dentro queste parentesi.<\/span> <span class=\"sg\" data-s=\"3\">Alcuni stili di codice in altri linguaggi vogliono uno spazio lì.<\/span> <span class=\"sg\" data-s=\"4\">Anche Raku lo accetta.<\/span> <span class=\"sg\" data-s=\"5\">Ma questo non è un buon modo di scrivere codice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In una chiamata di funzione, è importante non avere lo spazio.<\/span> <span class=\"sg\" data-s=\"1\">A volte chiami una funzione senza parentesi.<\/span> <span class=\"sg\" data-s=\"2\">Allora devi mettere uno spazio dopo il nome della funzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma prima delle parentesi non ci deve essere uno spazio.<\/span> <span class=\"sg\" data-s=\"1\">Questa chiamata è corretta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E questa chiamata è sbagliata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo codice causa un'eccezione:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Guarda la chiamata con uno spazio: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku pensa che passi un solo argomento alla funzione.<\/span> <span class=\"sg\" data-s=\"2\">Questo argomento è <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi controllare facilmente il tipo di questo argomento.<\/span> <span class=\"sg\" data-s=\"4\">Cambia la funzione.<\/span> <span class=\"sg\" data-s=\"5\">La funzione deve prendere un solo argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi, la chiamata <code>f (5, 6)<\/code> passa una <a href=\"https://course.raku.org/it/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lista<\/a> alla funzione.<\/span> <span class=\"sg\" data-s=\"1\">Tutta la lista è un solo argomento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando serve lo spazio<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte serve uno spazio.<\/span> <span class=\"sg\" data-s=\"1\">Succede quando usi le parentesi dopo una parola chiave.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, la parola chiave può essere <code>if<\/code>, <code>for<\/code> o <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo codice è sbagliato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il messaggio di errore ti dice cosa c'è di sbagliato:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con <code>if<\/code>, le parentesi non servono per niente.<\/span> <span class=\"sg\" data-s=\"1\">Senza di esse, questo problema non può succedere.<\/span> <span class=\"sg\" data-s=\"2\">Ma a volte le parentesi servono, per esempio con <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora devi mettere uno spazio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In questo codice succede la stessa cosa.<\/span> <span class=\"sg\" data-s=\"1\">Il compilatore pensa che <code>loop(...)<\/code> sia una chiamata di funzione.<\/span> <span class=\"sg\" data-s=\"2\">Aggiungi uno spazio per risolvere il problema.<\/span> <span class=\"sg\" data-s=\"3\">Oppure, meglio, scrivi questo codice con <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusione<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Allora, ecco il punto principale.<\/span> <span class=\"sg\" data-s=\"1\">Non mettere uno spazio tra il nome di una funzione e le sue parentesi.<\/span> <span class=\"sg\" data-s=\"2\">Così eviti questi problemi.<\/span> <span class=\"sg\" data-s=\"3\">Inoltre, quando puoi, cerca di non usare le parentesi in altri punti.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, con <code>if<\/code> e <code>for<\/code> non servono.<\/span><\/p>"]]},"lv":{"t":"Pievērsiet uzmanību atstarpēm","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā funkcijas pārsvarā ir viegli lietot.<\/span> <span class=\"sg\" data-s=\"1\">Parasti tās nerada problēmas.<\/span> <span class=\"sg\" data-s=\"2\">Bet esiet uzmanīgi ar vienu lietu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Īsumā<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nerakstiet atstarpi starp funkcijas nosaukumu un iekavām.<\/span> <span class=\"sg\" data-s=\"1\">Iekavās ir argumenti.<\/span> <span class=\"sg\" data-s=\"2\">Bet pēc <code>for<\/code> un <code>if<\/code> gan lieciet atstarpi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garā versija<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, vienkārša funkcija:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Vispirms apskatiet funkcijas nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Atverošā iekava ir uzreiz pēc tā, bez atstarpes.<\/span> <span class=\"sg\" data-s=\"2\">Parametri ir šajās iekavās.<\/span> <span class=\"sg\" data-s=\"3\">Dažos citu valodu koda stilos tur vajag atstarpi.<\/span> <span class=\"sg\" data-s=\"4\">Raku to arī pieņem.<\/span> <span class=\"sg\" data-s=\"5\">Bet tas nav labs veids, kā rakstīt kodu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Funkcijas izsaukumā atstarpes trūkums ir svarīgs.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz jūs izsaucat funkciju bez iekavām.<\/span> <span class=\"sg\" data-s=\"2\">Tad pēc funkcijas nosaukuma jums jāliek atstarpe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet ar iekavām pirms tām nedrīkst būt atstarpes.<\/span> <span class=\"sg\" data-s=\"1\">Šis izsaukums ir pareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un šis izsaukums ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis kods izraisa izņēmumu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Apskatiet izsaukumu ar atstarpi: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku domā, ka jūs nododat funkcijai vienu argumentu.<\/span> <span class=\"sg\" data-s=\"2\">Šis arguments ir <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat viegli pārbaudīt šī argumenta tipu.<\/span> <span class=\"sg\" data-s=\"4\">Mainiet funkciju.<\/span> <span class=\"sg\" data-s=\"5\">Tai jāpieņem tikai viens arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad izsaukums <code>f (5, 6)<\/code> nodod funkcijai <a href=\"https://course.raku.org/lv/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">sarakstu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Viss saraksts ir viens arguments.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kad jums vajag atstarpi<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag atstarpi.<\/span> <span class=\"sg\" data-s=\"1\">Tā notiek, kad jūs liekat iekavas pēc atslēgvārda.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, atslēgvārds var būt <code>if<\/code>, <code>for<\/code> vai <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šis kods ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kļūdas ziņojums jums pasaka, kas ir nepareizi:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ar <code>if<\/code> jums iekavas nemaz nav vajadzīgas.<\/span> <span class=\"sg\" data-s=\"1\">Bez tām šī problēma nevar rasties.<\/span> <span class=\"sg\" data-s=\"2\">Bet dažreiz jums vajag iekavas, piemēram, ar <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad jums jāliek atstarpe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas pats notiek šajā kodā.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators domā, ka <code>loop(...)<\/code> ir funkcijas izsaukums.<\/span> <span class=\"sg\" data-s=\"2\">Pievienojiet atstarpi, lai salabotu problēmu.<\/span> <span class=\"sg\" data-s=\"3\">Vai, vēl labāk, uzrakstiet šo kodu ar <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Secinājums<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tātad, lūk, galvenais.<\/span> <span class=\"sg\" data-s=\"1\">Nelieciet atstarpi starp funkcijas nosaukumu un tās iekavām.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs izvairāties no šādām problēmām.<\/span> <span class=\"sg\" data-s=\"3\">Arī citās vietās mēģiniet nelietot iekavas, kad varat.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, ar <code>if<\/code> un <code>for<\/code> tās nav vajadzīgas.<\/span><\/p>"]]},"ru":{"t":"Внимание к пробелам","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функции в Raku в основном легко использовать.<\/span> <span class=\"sg\" data-s=\"1\">Обычно с ними нет проблем.<\/span> <span class=\"sg\" data-s=\"2\">Но будьте осторожны с одной вещью.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не ставьте пробел между именем функции и скобками.<\/span> <span class=\"sg\" data-s=\"1\">В скобках находятся аргументы.<\/span> <span class=\"sg\" data-s=\"2\">Но после <code>for<\/code> и <code>if<\/code> обязательно ставьте пробел.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длинная история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот простая функция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Сначала посмотрите на имя функции.<\/span> <span class=\"sg\" data-s=\"1\">Открывающая скобка стоит сразу после него, без пробела.<\/span> <span class=\"sg\" data-s=\"2\">В этих скобках находятся параметры.<\/span> <span class=\"sg\" data-s=\"3\">В других языках некоторые стили кода требуют там пробел.<\/span> <span class=\"sg\" data-s=\"4\">Raku тоже это принимает.<\/span> <span class=\"sg\" data-s=\"5\">Но это не лучший способ писать код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В вызове функции важно, что пробела нет.<\/span> <span class=\"sg\" data-s=\"1\">Иногда вы вызываете функцию без скобок.<\/span> <span class=\"sg\" data-s=\"2\">Тогда после имени функции нужно поставить пробел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но если есть скобки, перед ними не должно быть пробела.<\/span> <span class=\"sg\" data-s=\"1\">Этот вызов правильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А этот вызов неправильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Этот код вызывает исключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на вызов с пробелом: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku думает, что вы передаёте функции один аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Этот аргумент — <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете легко проверить тип этого аргумента.<\/span> <span class=\"sg\" data-s=\"4\">Измените функцию.<\/span> <span class=\"sg\" data-s=\"5\">Она должна принимать только один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значит, вызов <code>f (5, 6)<\/code> передаёт функции <a href=\"https://course.raku.org/ru/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Весь список — это один аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Когда нужен пробел<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда пробел нужен.<\/span> <span class=\"sg\" data-s=\"1\">Так бывает, когда вы ставите скобки после ключевого слова.<\/span> <span class=\"sg\" data-s=\"2\">Например, ключевым словом может быть <code>if<\/code>, <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Этот код неправильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сообщение об ошибке говорит, что не так:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С <code>if<\/code> скобки совсем не нужны.<\/span> <span class=\"sg\" data-s=\"1\">Без них этой проблемы не может быть.<\/span> <span class=\"sg\" data-s=\"2\">Но иногда скобки нужны, например, с <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда обязательно ставьте пробел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этом коде происходит то же самое.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор думает, что <code>loop(...)<\/code> — это вызов функции.<\/span> <span class=\"sg\" data-s=\"2\">Добавьте пробел, чтобы исправить проблему.<\/span> <span class=\"sg\" data-s=\"3\">Или, лучше, напишите этот код с <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Итак, вот главное.<\/span> <span class=\"sg\" data-s=\"1\">Не ставьте пробел между именем функции и её скобками.<\/span> <span class=\"sg\" data-s=\"2\">Тогда таких проблем не будет.<\/span> <span class=\"sg\" data-s=\"3\">Также старайтесь не ставить скобки в других местах, если можно.<\/span> <span class=\"sg\" data-s=\"4\">Например, с <code>if<\/code> и <code>for<\/code> они не нужны.<\/span><\/p>"]]},"uk":{"t":"Зверніть увагу на пробіли","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функції в Raku здебільшого легко використовувати.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай вони не створюють проблем.<\/span> <span class=\"sg\" data-s=\"2\">Але з однією річчю будьте обережні.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коротко<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не пишіть пробіл між назвою функції та дужками.<\/span> <span class=\"sg\" data-s=\"1\">У дужках стоять аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Але після <code>for<\/code> та <code>if<\/code> пробіл ставте.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Детально<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось проста функція:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Спочатку подивіться на назву функції.<\/span> <span class=\"sg\" data-s=\"1\">Відкривна дужка йде одразу після неї, без пробілу.<\/span> <span class=\"sg\" data-s=\"2\">Параметри стоять у цих дужках.<\/span> <span class=\"sg\" data-s=\"3\">Деякі стилі коду в інших мовах вимагають там пробіл.<\/span> <span class=\"sg\" data-s=\"4\">Raku теж це приймає.<\/span> <span class=\"sg\" data-s=\"5\">Але це не добрий спосіб писати код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У виклику функції відсутність пробілу важлива.<\/span> <span class=\"sg\" data-s=\"1\">Іноді ви викликаєте функцію без дужок.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ви маєте поставити пробіл після назви функції:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але з дужками пробілу перед ними бути не повинно.<\/span> <span class=\"sg\" data-s=\"1\">Цей виклик правильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А цей виклик неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цей код викликає виняток:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Подивіться на виклик із пробілом: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku думає, що ви передаєте функції один аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Цей аргумент — <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви легко можете перевірити тип цього аргументу.<\/span> <span class=\"sg\" data-s=\"4\">Змініть функцію.<\/span> <span class=\"sg\" data-s=\"5\">Вона має приймати лише один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, виклик <code>f (5, 6)<\/code> передає функції <a href=\"https://course.raku.org/uk/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Увесь список — це один аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коли вам потрібен пробіл<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді пробіл потрібен.<\/span> <span class=\"sg\" data-s=\"1\">Це буває, коли ви ставите дужки після ключового слова.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, ключове слово може бути <code>if<\/code>, <code>for<\/code> або <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Цей код неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повідомлення про помилку каже, що не так:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">З <code>if<\/code> дужки взагалі не потрібні.<\/span> <span class=\"sg\" data-s=\"1\">Без них ця проблема не може статися.<\/span> <span class=\"sg\" data-s=\"2\">Але іноді дужки потрібні, наприклад, з <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді ви маєте поставити пробіл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У цьому коді відбувається те саме.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор думає, що <code>loop(...)<\/code> — це виклик функції.<\/span> <span class=\"sg\" data-s=\"2\">Додайте пробіл, щоб виправити проблему.<\/span> <span class=\"sg\" data-s=\"3\">Або, краще, напишіть цей код із <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Висновок<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Отже, ось головне.<\/span> <span class=\"sg\" data-s=\"1\">Не ставте пробіл між назвою функції та її дужками.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ви уникнете таких проблем.<\/span> <span class=\"sg\" data-s=\"3\">Також намагайтеся не ставити дужки в інших місцях, коли можна.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, з <code>if<\/code> і <code>for<\/code> вони не потрібні.<\/span><\/p>"]]},"bg":{"t":"Внимание към пространството","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Функциите в Raku са предимно лесни за използване.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено те не създават проблеми.<\/span> <span class=\"sg\" data-s=\"2\">Но внимавайте с едно нещо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не пишете интервал между името на функцията и скобите.<\/span> <span class=\"sg\" data-s=\"1\">В скобите са аргументите.<\/span> <span class=\"sg\" data-s=\"2\">Но слагайте интервал след <code>for<\/code> и <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дълга история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето една проста функция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Първо, вижте името на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Отварящата скоба идва веднага след него, без интервал.<\/span> <span class=\"sg\" data-s=\"2\">Параметрите са в тези скоби.<\/span> <span class=\"sg\" data-s=\"3\">Някои стилове на кодиране в други езици искат интервал там.<\/span> <span class=\"sg\" data-s=\"4\">Raku също го приема.<\/span> <span class=\"sg\" data-s=\"5\">Но това не е добър начин да пишете код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">При извикване на функция липсата на интервал е важна.<\/span> <span class=\"sg\" data-s=\"1\">Понякога извиквате функция без скоби.<\/span> <span class=\"sg\" data-s=\"2\">Тогава трябва да сложите интервал след името на функцията:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но със скоби не трябва да има интервал преди тях.<\/span> <span class=\"sg\" data-s=\"1\">Това извикване е правилно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А това извикване е грешно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този код предизвиква изключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Вижте извикването с интервал: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku мисли, че предавате един аргумент на функцията.<\/span> <span class=\"sg\" data-s=\"2\">Този аргумент е <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Можете лесно да проверите типа на този аргумент.<\/span> <span class=\"sg\" data-s=\"4\">Променете функцията.<\/span> <span class=\"sg\" data-s=\"5\">Тя трябва да приема само един аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Значи извикването <code>f (5, 6)<\/code> предава <a href=\"https://course.raku.org/bg/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">списък<\/a> на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Целият списък е един аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кога ви трябва интервал<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога ви трябва интервал.<\/span> <span class=\"sg\" data-s=\"1\">Това става, когато използвате скоби след ключова дума.<\/span> <span class=\"sg\" data-s=\"2\">Например, ключовата дума може да е <code>if<\/code>, <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Този код е грешен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съобщението за грешка ви казва какво не е наред:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С <code>if<\/code> изобщо не ви трябват скоби.<\/span> <span class=\"sg\" data-s=\"1\">Без тях този проблем не може да се случи.<\/span> <span class=\"sg\" data-s=\"2\">Но понякога ви трябват скоби, например с <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава трябва да сложите интервал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Същото се случва и в този код.<\/span> <span class=\"sg\" data-s=\"1\">Компилаторът мисли, че <code>loop(...)<\/code> е извикване на функция.<\/span> <span class=\"sg\" data-s=\"2\">Добавете интервал, за да оправите проблема.<\/span> <span class=\"sg\" data-s=\"3\">Или, още по-добре, напишете този код с <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И така, ето главното.<\/span> <span class=\"sg\" data-s=\"1\">Не слагайте интервал между името на функцията и нейните скоби.<\/span> <span class=\"sg\" data-s=\"2\">Така избягвате такива проблеми.<\/span> <span class=\"sg\" data-s=\"3\">Също така, опитайте да не използвате скоби на други места, когато можете.<\/span> <span class=\"sg\" data-s=\"4\">Например, с <code>if<\/code> и <code>for<\/code> те не ви трябват.<\/span><\/p>"]]},"eo":{"t":"Atentu la spacon","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Funkcioj en Raku estas plejparte facile uzeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Kutime ili ne kaŭzas problemojn.<\/span> <span class=\"sg\" data-s=\"2\">Sed estu atenta pri unu afero.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ne skribu spacon inter la nomo de la funkcio kaj la parentezoj.<\/span> <span class=\"sg\" data-s=\"1\">La parentezoj enhavas la argumentojn.<\/span> <span class=\"sg\" data-s=\"2\">Sed ja metu spacon post <code>for<\/code> kaj <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa rakonto<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen simpla funkcio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unue, rigardu la nomon de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La malferma parentezo venas tuj post ĝi, sen spaco.<\/span> <span class=\"sg\" data-s=\"2\">La parametroj estas en ĉi tiuj parentezoj.<\/span> <span class=\"sg\" data-s=\"3\">Iuj kodstiloj en aliaj lingvoj bezonas spacon tie.<\/span> <span class=\"sg\" data-s=\"4\">Raku ankaŭ akceptas ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Sed tio ne estas bona maniero skribi kodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En funkcia voko, la manko de spaco estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Kelkfoje vi vokas funkcion sen parentezoj.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi devas meti spacon post la nomo de la funkcio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed kun parentezoj, ne devas esti spaco antaŭ ili.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu voko estas ĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tiu voko estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu kodo kaŭzas escepton:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro malmultaj poziciaj pasis; atendis 2 argumentojn sed ricevis 1       sub f ĉe t.raku linio 1       en bloko &lt;unit&gt; ĉe t.raku linio 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rigardu la vokon kun spaco: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku pensas, ke vi pasas unu argumenton al la funkcio.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu argumento estas <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas facile kontroli la tipon de ĉi tiu argumento.<\/span> <span class=\"sg\" data-s=\"4\">Ŝanĝu la funkcion.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi devas preni nur unu argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do, la voko <code>f (5, 6)<\/code> pasas <a href=\"https://course.raku.org/eo/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">liston<\/a> al la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La tuta listo estas unu argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kiam vi bezonas spacon<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje vi bezonas spacon.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, kiam vi uzas parentezojn post ŝlosilvorto.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la ŝlosilvorto povas esti <code>if<\/code>, <code>for<\/code> aŭ <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu kodo estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La erarmesaĝo diras al vi, kio estas malĝusta:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===PARDONU!===     La vorto 'if' estas interpretita kiel 'if()' funkciovoko.<\/span> <span class=\"sg\" data-s=\"1\">Bonvolu uzi     blankspacon anstataŭ parentezoj.     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Neatendita bloko en infiksa pozicio (du terminoj en vico)     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kun <code>if<\/code>, vi tute ne bezonas parentezojn.<\/span> <span class=\"sg\" data-s=\"1\">Sen ili, ĉi tiu problemo ne povas okazi.<\/span> <span class=\"sg\" data-s=\"2\">Sed kelkfoje vi bezonas parentezojn, ekzemple, kun <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi devas meti spacon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La sama afero okazas en ĉi tiu kodo.<\/span> <span class=\"sg\" data-s=\"1\">La kompililo pensas, ke <code>loop(...)<\/code> estas funkcia voko.<\/span> <span class=\"sg\" data-s=\"2\">Aldonu spacon por ripari la problemon.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ, pli bone, skribu ĉi tiun kodon per <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkludo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Do, jen la ĉefa punkto.<\/span> <span class=\"sg\" data-s=\"1\">Ne metu spacon inter la nomo de funkcio kaj ĝiaj parentezoj.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi evitas tiajn problemojn.<\/span> <span class=\"sg\" data-s=\"3\">Ankaŭ provu ne uzi parentezojn en aliaj lokoj, kiam vi povas.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, vi ne bezonas ilin kun <code>if<\/code> kaj <code>for<\/code>.<\/span><\/p>"]]},"la":{"t":"Cave spatium","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Functiones in Raku plerumque faciles sunt.<\/span> <span class=\"sg\" data-s=\"1\">Fere numquam difficultates afferunt.<\/span> <span class=\"sg\" data-s=\"2\">Sed unam rem cave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nullum spatium inter nomen functionis et parentheses scribe.<\/span> <span class=\"sg\" data-s=\"1\">Parentheses argumenta continent.<\/span> <span class=\"sg\" data-s=\"2\">Sed post <code>for<\/code> et <code>if<\/code> spatium pone.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa fabula<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce functio simplex:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Primum, specta nomen functionis.<\/span> <span class=\"sg\" data-s=\"1\">Parenthesis aperiens statim post id venit, sine spatio.<\/span> <span class=\"sg\" data-s=\"2\">Parametri in his parenthesibus sunt.<\/span> <span class=\"sg\" data-s=\"3\">Quidam styli codicis in aliis linguis ibi spatium requirunt.<\/span> <span class=\"sg\" data-s=\"4\">Raku id quoque accipit.<\/span> <span class=\"sg\" data-s=\"5\">Sed hic non est bonus modus codicem scribendi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In vocatione functionis absentia spatii magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\">Interdum functionem sine parenthesibus vocas.<\/span> <span class=\"sg\" data-s=\"2\">Tum post nomen functionis spatium ponere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed cum parenthesibus nullum spatium ante eas esse debet.<\/span> <span class=\"sg\" data-s=\"1\">Haec vocatio recta est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et haec vocatio est falsa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic codex exceptionem facit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Specta vocationem cum spatio: <code>f (5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku putat te unum argumentum functioni transmittere.<\/span> <span class=\"sg\" data-s=\"2\">Hoc argumentum est <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Typum huius argumenti facile probare potes.<\/span> <span class=\"sg\" data-s=\"4\">Muta functionem.<\/span> <span class=\"sg\" data-s=\"5\">Ea solum unum argumentum accipere debet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque vocatio <code>f (5, 6)<\/code> <a href=\"https://course.raku.org/la/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">indicem<\/a> functioni transmittit.<\/span> <span class=\"sg\" data-s=\"1\">Totus index est unum argumentum.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando spatium requiris<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum spatium requiris.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit cum parentheses post verbum clavis adhibes.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, verbum clavis potest esse <code>if<\/code>, <code>for<\/code> vel <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hic codex falsus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuntius erroris tibi dicit quid falsum sit:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum <code>if<\/code> parentheses omnino non requiris.<\/span> <span class=\"sg\" data-s=\"1\">Sine eis hoc problema fieri non potest.<\/span> <span class=\"sg\" data-s=\"2\">Sed interdum parentheses requiris, exempli gratia cum <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tum spatium ponere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Idem in hoc codice fit.<\/span> <span class=\"sg\" data-s=\"1\">Compilator putat <code>loop(...)<\/code> vocationem functionis esse.<\/span> <span class=\"sg\" data-s=\"2\">Adde spatium ut problema solvas.<\/span> <span class=\"sg\" data-s=\"3\">Aut, melius, hunc codicem cum <code>for<\/code> scribe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusio<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Itaque, haec est res praecipua.<\/span> <span class=\"sg\" data-s=\"1\">Noli spatium inter nomen functionis et parentheses eius ponere.<\/span> <span class=\"sg\" data-s=\"2\">Tum talia problemata vitas.<\/span> <span class=\"sg\" data-s=\"3\">Etiam conare parentheses aliis locis non adhibere, si potes.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, eas cum <code>if<\/code> et <code>for<\/code> non requiris.<\/span><\/p>"]]}}}</script>
