<script type="application/json" id="page-data">{"u":"essentials/raku-vs-rakudo","n":3,"k":"section","pv":"essentials/what-is-raku","nx":"essentials/the-rakudo-compiler","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Raku vs. Rakudo, Raku++ and mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is the name of the programming language.<\/span> <span class=\"sg\" data-s=\"1\">A <strong>compiler<\/strong> is a program.<\/span> <span class=\"sg\" data-s=\"2\">It reads your code and runs it.<\/span> <span class=\"sg\" data-s=\"3\">Raku can have more than one compiler.<\/span> <span class=\"sg\" data-s=\"4\">This course uses <strong>Rakudo<\/strong>, the older and well-known one.<\/span> <span class=\"sg\" data-s=\"5\">There are also newer ones: <strong>Raku++<\/strong> and <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one compiler<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku’s design does not say which compiler to use.<\/span> <span class=\"sg\" data-s=\"1\">The design documents come with a set of tests.<\/span> <span class=\"sg\" data-s=\"2\">This set is called Roast.<\/span> <span class=\"sg\" data-s=\"3\">Anyone can write a compiler.<\/span> <span class=\"sg\" data-s=\"4\">If it passes these tests, it is a Raku compiler.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">For a long time, Rakudo was the only complete and stable compiler.<\/span> <span class=\"sg\" data-s=\"1\">Now this is not true.<\/span> <span class=\"sg\" data-s=\"2\">In July 2026, a second compiler came out: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Its author wrote it in C++.<\/span> <span class=\"sg\" data-s=\"4\">Its program file is called <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Version 5.4.1 passes all the Roast tests.<\/span> <span class=\"sg\" data-s=\"6\">It also starts very fast.<\/span> <span sg\" data-s=\"5\">Version 5.4.1 besteht alle Roast-Tests.<\/span> <span class=\"sg\" data-s=\"6\">Er startet auch sehr schnell.<\/span> <span class=\"sg\" data-s=\"7\">Dieser Kurs verwendet Rakudo für seine Beispiele.<\/span> <span class=\"sg\" data-s=\"8\">Aber Sie lernen die Sprache Raku selbst.<\/span> <span class=\"sg\" data-s=\"9\">Fast alles davon läuft auch auf Raku++, ohne Änderungen.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch noch einen dritten: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Er ist ein Interpreter.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno hat ihn in Rust geschrieben.<\/span> <span class=\"sg\" data-s=\"3\">Er übersetzt Raku-Code in Bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Dann führt seine eigene virtuelle Maschine diesen Bytecode aus.<\/span> <span class=\"sg\" data-s=\"5\">Sie können ihn auch in einem Webbrowser ausführen, mit WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Seine Website hat ein Raku-Tutorial und einen Spielplatz.<\/span> <span class=\"sg\" data-s=\"7\">Beide laufen auf mutsu.<\/span> <span class=\"sg\" data-s=\"8\">Der Autor arbeitet noch viel daran.<\/span> <span class=\"sg\" data-s=\"9\">Der Autor sagt: mutsu ist noch nicht bereit für echte Projekte.<\/span> <span class=\"sg\" data-s=\"10\">Aber er besteht schon fast alle Roast-Testdateien.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Seiten zeigen alle drei: Rakudo, Raku++ und mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, wie man sie installiert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe Links<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"Raku, Rakudo, Raku++ en mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> is de naam van de programmeertaal.<\/span> <span class=\"sg\" data-s=\"1\">Een <strong>compiler<\/strong> is een programma.<\/span> <span class=\"sg\" data-s=\"2\">Het leest je code en voert die uit.<\/span> <span class=\"sg\" data-s=\"3\">Raku kan meer dan één compiler hebben.<\/span> <span class=\"sg\" data-s=\"4\">Deze cursus gebruikt <strong>Rakudo<\/strong>, de oudere en bekende.<\/span> <span class=\"sg\" data-s=\"5\">Er zijn ook nieuwere: <strong>Raku++<\/strong> en <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één compiler<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het ontwerp van Raku zegt niet welke compiler je moet gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Bij de ontwerpdocumenten hoort een set tests.<\/span> <span class=\"sg\" data-s=\"2\">Die set heet Roast.<\/span> <span class=\"sg\" data-s=\"3\">Iedereen mag een compiler schrijven.<\/span> <span class=\"sg\" data-s=\"4\">Als die voor deze tests slaagt, is het een Raku-compiler.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Lange tijd was Rakudo de enige complete en stabiele compiler.<\/span> <span class=\"sg\" data-s=\"1\">Nu klopt dat niet meer.<\/span> <span class=\"sg\" data-s=\"2\">In juli 2026 kwam er een tweede compiler: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">De auteur schreef hem in C++.<\/span> <span class=\"sg\" data-s=\"4\">Zijn programmabestand heet <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Versie 5.4.1 slaagt voor alle Roast-tests.<\/span> <span class=\"sg\" data-s=\"6\">Hij start ook heel snel.<\/span> <span class=\"sg\" data-s=\"7\">Deze cursus gebruikt Rakudo voor de voorbeelden.<\/span> <span class=\"sg\" data-s=\"8\">Maar je leert de taal Raku zelf.<\/span> <span class=\"sg\" data-s=\"9\">Bijna alles daarvan werkt ook op Raku++, zonder veranderingen.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Er is ook een derde: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Het is een interpreter.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno schreef hem in Rust.<\/span> <span class=\"sg\" data-s=\"3\">Hij compileert Raku-code naar bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Daarna voert zijn eigen virtuele machine die bytecode uit.<\/span> <span class=\"sg\" data-s=\"5\">Je kunt hem ook in een webbrowser uitvoeren, via WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Zijn website heeft een Raku-tutorial en een speeltuin.<\/span> <span class=\"sg\" data-s=\"7\">Allebei draaien ze op mutsu.<\/span> <span class=\"sg\" data-s=\"8\">De auteur werkt er nog hard aan.<\/span> <span class=\"sg\" data-s=\"9\">De auteur zegt dat hij nog niet klaar is voor echte projecten.<\/span> <span class=\"sg\" data-s=\"10\">Maar hij slaagt nu al voor bijna alle testbestanden van Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende pagina's laten alle drie zien: Rakudo, Raku++ en mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien hoe je ze installeert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Externe links<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"Raku, Rakudo, Raku++ y mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> es el nombre del lenguaje de programación.<\/span> <span class=\"sg\" data-s=\"1\">Un <strong>compilador<\/strong> es un programa.<\/span> <span class=\"sg\" data-s=\"2\">Lee su código y lo ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">Raku puede tener más de un compilador.<\/span> <span class=\"sg\" data-s=\"4\">Este curso usa <strong>Rakudo<\/strong>, el más antiguo y conocido.<\/span> <span class=\"sg\" data-s=\"5\">También hay otros más nuevos: <strong>Raku++<\/strong> y <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de un compilador<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El diseño de Raku no dice qué compilador usar.<\/span> <span class=\"sg\" data-s=\"1\">Los documentos de diseño vienen con un conjunto de pruebas.<\/span> <span class=\"sg\" data-s=\"2\">Este conjunto se llama Roast.<\/span> <span class=\"sg\" data-s=\"3\">Cualquiera puede escribir un compilador.<\/span> <span class=\"sg\" data-s=\"4\">Si pasa estas pruebas, es un compilador de Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Durante mucho tiempo, Rakudo fue el único compilador completo y estable.<\/span> <span class=\"sg\" data-s=\"1\">Ahora esto ya no es verdad.<\/span> <span class=\"sg\" data-s=\"2\">En julio de 2026 salió un segundo compilador: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Su autor lo escribió en C++.<\/span> <span class=\"sg\" data-s=\"4\">Su archivo de programa se llama <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La versión 5.4.1 pasa todas las pruebas de Roast.<\/span> <span class=\"sg\" data-s=\"6\">También arranca muy rápido.<\/span> <span class=\"sg\" data-s=\"7\">Este curso usa Rakudo para sus ejemplos.<\/span> <span class=\"sg\" data-s=\"8\">Pero usted aprende el lenguaje Raku en sí.<\/span> <span class=\"sg\" data-s=\"9\">Casi todo funciona también en Raku++, sin cambios.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">También hay un tercero: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Es un intérprete.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno lo escribió en Rust.<\/span> <span class=\"sg\" data-s=\"3\">Compila el código Raku a bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Después, su propia máquina virtual ejecuta este bytecode.<\/span> <span class=\"sg\" data-s=\"5\">También puede ejecutarlo en un navegador web, mediante WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Su sitio web tiene un tutorial de Raku y un campo de pruebas.<\/span> <span class=\"sg\" data-s=\"7\">Los dos funcionan con mutsu.<\/span> <span class=\"sg\" data-s=\"8\">El autor todavía trabaja mucho en él.<\/span> <span class=\"sg\" data-s=\"9\">El autor dice que aún no está listo para proyectos reales.<\/span> <span class=\"sg\" data-s=\"10\">Pero ya pasa casi todos los archivos de pruebas de Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las próximas páginas muestran cada uno de los tres: Rakudo, Raku++ y mutsu.<\/span> <span class=\"sg\" data-s=\"1\">También muestran cómo instalarlos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enlaces externos<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Raku, Rakudo, Raku++ e mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> è il nome del linguaggio di programmazione.<\/span> <span class=\"sg\" data-s=\"1\">Un <strong>compilatore<\/strong> è un programma.<\/span> <span class=\"sg\" data-s=\"2\">Legge il vostro codice e lo esegue.<\/span> <span class=\"sg\" data-s=\"3\">Raku può avere più di un compilatore.<\/span> <span class=\"sg\" data-s=\"4\">Questo corso usa <strong>Rakudo<\/strong>, quello più vecchio e famoso.<\/span> <span class=\"sg\" data-s=\"5\">Ci sono anche compilatori più nuovi: <strong>Raku++<\/strong> e <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di un compilatore<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il progetto di Raku non dice quale compilatore usare.<\/span> <span class=\"sg\" data-s=\"1\">I documenti del progetto hanno un insieme di test.<\/span> <span class=\"sg\" data-s=\"2\">Questo insieme si chiama Roast.<\/span> <span class=\"sg\" data-s=\"3\">Chiunque può scrivere un compilatore.<\/span> <span class=\"sg\" data-s=\"4\">Se supera questi test, è un compilatore Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Per molto tempo, Rakudo è stato l'unico compilatore completo e stabile.<\/span> <span class=\"sg\" data-s=\"1\">Ora non è più così.<\/span> <span class=\"sg\" data-s=\"2\">Nel luglio 2026 è uscito un secondo compilatore: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Il suo autore l'ha scritto in C++.<\/span> <span class=\"sg\" data-s=\"4\">Il suo file di programma si chiama <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La versione 5.4.1 supera tutti i test di Roast.<\/span> <span class=\"sg\" data-s=\"6\">Inoltre parte molto in fretta.<\/span> <span class=\"sg\" data-s=\"7\">Questo corso usa Rakudo per i suoi esempi.<\/span> <span class=\"sg\" data-s=\"8\">Ma voi imparate il linguaggio Raku stesso.<\/span> <span class=\"sg\" data-s=\"9\">Quasi tutto gira anche su Raku++, senza cambiamenti.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Ce n'è anche un terzo: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">È un interprete.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno l'ha scritto in Rust.<\/span> <span class=\"sg\" data-s=\"3\">Compila il codice Raku in bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Poi la sua macchina virtuale esegue questo bytecode.<\/span> <span class=\"sg\" data-s=\"5\">Potete anche eseguirlo in un browser web, grazie a WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Il suo sito ha un tutorial di Raku e un campo da gioco.<\/span> <span class=\"sg\" data-s=\"7\">Tutti e due girano su mutsu.<\/span> <span class=\"sg\" data-s=\"8\">L'autore ci lavora ancora molto.<\/span> <span class=\"sg\" data-s=\"9\">L'autore dice che non è ancora pronto per progetti veri.<\/span> <span class=\"sg\" data-s=\"10\">Ma supera già quasi tutti i file di test di Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le prossime pagine mostrano tutti e tre: Rakudo, Raku++ e mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche come installarli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Collegamenti esterni<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Raku, Rakudo, Raku++ un mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ir programmēšanas valodas nosaukums.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Kompilators<\/strong> ir programma.<\/span> <span class=\"sg\" data-s=\"2\">Tas nolasa jūsu kodu un izpilda to.<\/span> <span class=\"sg\" data-s=\"3\">Raku valodai var būt vairāki kompilatori.<\/span> <span class=\"sg\" data-s=\"4\">Šis kurss lieto <strong>Rakudo<\/strong>, vecāko un labi zināmo kompilatoru.<\/span> <span class=\"sg\" data-s=\"5\">Ir arī jaunāki: <strong>Raku++<\/strong> un <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens kompilators<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku uzbūve nesaka, kuru kompilatoru lietot.<\/span> <span class=\"sg\" data-s=\"1\">Uzbūves dokumentiem ir līdzi testu kopa.<\/span> <span class=\"sg\" data-s=\"2\">Šo kopu sauc Roast.<\/span> <span class=\"sg\" data-s=\"3\">Kompilatoru var uzrakstīt jebkurš.<\/span> <span class=\"sg\" data-s=\"4\">Ja tas iztur šos testus, tas ir Raku kompilators.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ilgu laiku Rakudo bija vienīgais pilnīgais un stabilais kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Tagad tā vairs nav.<\/span> <span class=\"sg\" data-s=\"2\">2026. gada jūlijā iznāca otrs kompilators: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Tā autors to uzrakstīja C++ valodā.<\/span> <span class=\"sg\" data-s=\"4\">Tā programmas fails saucas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Versija 5.4.1 iztur visus Roast testus.<\/span> <span class=\"sg\" data-s=\"6\">Tas arī startē ļoti ātri.<\/span> <span class=\"sg\" data-s=\"7\">Šis kurss piemēros lieto Rakudo.<\/span> <span class=\"sg\" data-s=\"8\">Bet jūs mācāties pašu Raku valodu.<\/span> <span class=\"sg\" data-s=\"9\">Gandrīz viss no tās darbojas arī uz Raku++, bez izmaiņām.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Ir arī trešais: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir interpretators.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno to uzrakstīja Rust valodā.<\/span> <span class=\"sg\" data-s=\"3\">Tas kompilē Raku kodu baitkodā.<\/span> <span class=\"sg\" data-s=\"4\">Tad šo baitkodu izpilda tā paša virtuālā mašīna.<\/span> <span class=\"sg\" data-s=\"5\">To var palaist arī tīmekļa pārlūkprogrammā, ar WebAssembly palīdzību.<\/span> <span class=\"sg\" data-s=\"6\">Tā vietnē ir Raku pamācība un spēļu laukums.<\/span> <span class=\"sg\" data-s=\"7\">Abi darbojas uz mutsu.<\/span> <span class=\"sg\" data-s=\"8\">Autors joprojām daudz pie tā strādā.<\/span> <span class=\"sg\" data-s=\"9\">Autors saka, ka tas vēl nav gatavs īstiem projektiem.<\/span> <span class=\"sg\" data-s=\"10\">Bet tas jau iztur gandrīz visus Roast testu failus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamās lappuses rāda katru no trim: Rakudo, Raku++ un mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Tās arī rāda, kā tos uzstādīt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — это название языка программирования.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компилятор<\/strong> — это программа.<\/span> <span class=\"sg\" data-s=\"2\">Она читает ваш код и выполняет его.<\/span> <span class=\"sg\" data-s=\"3\">У Raku может быть больше одного компилятора.<\/span> <span class=\"sg\" data-s=\"4\">В этом курсе мы используем <strong>Rakudo<\/strong>, старый и хорошо известный компилятор.<\/span> <span class=\"sg\" data-s=\"5\">Есть и более новые: <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компиляторов может быть несколько<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не говорит, какой компилятор использовать.<\/span> <span class=\"sg\" data-s=\"1\">Вместе с документами дизайна идёт набор тестов.<\/span> <span class=\"sg\" data-s=\"2\">Этот набор называется Roast.<\/span> <span class=\"sg\" data-s=\"3\">Любой может написать компилятор.<\/span> <span class=\"sg\" data-s=\"4\">Если он проходит эти тесты, это компилятор Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Долгое время Rakudo был единственным полным и стабильным компилятором.<\/span> <span class=\"sg\" data-s=\"1\">Теперь это не так.<\/span> <span class=\"sg\" data-s=\"2\">В июле 2026 года вышел второй компилятор: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Автор написал его на C++.<\/span> <span class=\"sg\" data-s=\"4\">Файл этой программы называется <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Версия 5.4.1 проходит все тесты Roast.<\/span> <span class=\"sg\" data-s=\"6\">Ещё он запускается очень быстро.<\/span> <span class=\"sg\" data-s=\"7\">Для примеров этот курс использует Rakudo.<\/span> <span class=\"sg\" data-s=\"8\">Но вы изучаете сам язык Raku.<\/span> <span class=\"sg\" data-s=\"9\">Почти всё это работает и на Raku++, без изменений.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Есть ещё и третий: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Это интерпретатор.<\/span> <span class=\"sg\" data-s=\"2\">Токухиро Мацуно написал его на Rust.<\/span> <span class=\"sg\" data-s=\"3\">Он компилирует код на Raku в байт-код.<\/span> <span class=\"sg\" data-s=\"4\">Потом этот байт-код выполняет его собственная виртуальная машина.<\/span> <span class=\"sg\" data-s=\"5\">Ещё его можно запустить в веб-браузере, через WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">На его сайте есть учебник по Raku и песочница.<\/span> <span class=\"sg\" data-s=\"7\">Оба работают на mutsu.<\/span> <span class=\"sg\" data-s=\"8\">Автор всё ещё много над ним работает.<\/span> <span class=\"sg\" data-s=\"9\">Автор говорит, что он пока не готов для настоящих проектов.<\/span> <span class=\"sg\" data-s=\"10\">Но он уже проходит почти все тестовые файлы Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие страницы рассказывают о каждом из трёх: Rakudo, Raku++ и mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, как их установить.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Raku, Rakudo, Raku++ та mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — це назва мови програмування.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компілятор<\/strong> — це програма.<\/span> <span class=\"sg\" data-s=\"2\">Вона читає ваш код і запускає його.<\/span> <span class=\"sg\" data-s=\"3\">Raku може мати більше ніж один компілятор.<\/span> <span class=\"sg\" data-s=\"4\">Цей курс використовує <strong>Rakudo<\/strong>, старіший і добре відомий компілятор.<\/span> <span class=\"sg\" data-s=\"5\">Є також новіші: <strong>Raku++<\/strong> і <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компіляторів може бути кілька<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не каже, який компілятор використовувати.<\/span> <span class=\"sg\" data-s=\"1\">Дизайн-документи мають набір тестів.<\/span> <span class=\"sg\" data-s=\"2\">Цей набір називається Roast.<\/span> <span class=\"sg\" data-s=\"3\">Будь-хто може написати компілятор.<\/span> <span class=\"sg\" data-s=\"4\">Якщо він проходить ці тести, це компілятор Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Довгий час Rakudo був єдиним повним і стабільним компілятором.<\/span> <span class=\"sg\" data-s=\"1\">Тепер це не так.<\/span> <span class=\"sg\" data-s=\"2\">У липні 2026 року вийшов другий компілятор: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Автор написав його мовою C++.<\/span> <span class=\"sg\" data-s=\"4\">Його файл програми називається <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Версія 5.4.1 проходить усі тести Roast.<\/span> <span class=\"sg\" data-s=\"6\">Він також запускається дуже швидко.<\/span> <span class=\"sg\" data-s=\"7\">Цей курс використовує Rakudo для прикладів.<\/span> <span class=\"sg\" data-s=\"8\">Але ви вивчаєте саму мову Raku.<\/span> <span class=\"sg\" data-s=\"9\">Майже все з неї працює і на Raku++, без змін.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Є ще й третій: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Це інтерпретатор.<\/span> <span class=\"sg\" data-s=\"2\">Токухіро Мацуно написав його мовою Rust.<\/span> <span class=\"sg\" data-s=\"3\">Він компілює код Raku в байткод.<\/span> <span class=\"sg\" data-s=\"4\">Потім його власна віртуальна машина виконує цей байткод.<\/span> <span class=\"sg\" data-s=\"5\">Ви також можете запускати його у веб-браузері, через WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">На його сайті є підручник з Raku і майданчик.<\/span> <span class=\"sg\" data-s=\"7\">Обидва працюють на mutsu.<\/span> <span class=\"sg\" data-s=\"8\">Автор досі багато працює над ним.<\/span> <span class=\"sg\" data-s=\"9\">Автор каже, що mutsu ще не готовий для справжніх проєктів.<\/span> <span class=\"sg\" data-s=\"10\">Але він уже проходить майже всі тестові файли Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні сторінки показують кожен із трьох: Rakudo, Raku++ і mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують, як їх встановити.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> е името на езика за програмиране.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компилатор<\/strong> е програма.<\/span> <span class=\"sg\" data-s=\"2\">Тя чете вашия код и го изпълнява.<\/span> <span class=\"sg\" data-s=\"3\">Raku може да има повече от един компилатор.<\/span> <span class=\"sg\" data-s=\"4\">Този курс използва <strong>Rakudo<\/strong>, по-стария и добре познат компилатор.<\/span> <span class=\"sg\" data-s=\"5\">Има и по-нови: <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от един компилатор<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Дизайнът на Raku не казва кой компилатор да използвате.<\/span> <span class=\"sg\" data-s=\"1\">Към документите за дизайна има набор от тестове.<\/span> <span class=\"sg\" data-s=\"2\">Този набор се казва Roast.<\/span> <span class=\"sg\" data-s=\"3\">Всеки може да напише компилатор.<\/span> <span class=\"sg\" data-s=\"4\">Ако той минава тези тестове, това е компилатор на Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Дълго време Rakudo беше единственият пълен и стабилен компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Сега това не е вярно.<\/span> <span class=\"sg\" data-s=\"2\">През юли 2026 се появи втори компилатор: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Авторът му го написа на C++.<\/span> <span class=\"sg\" data-s=\"4\">Програмният му файл се казва <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Версия 5.4.1 минава всички тестове на Roast.<\/span> <span class=\"sg\" data-s=\"6\">Освен това той стартира много бързо.<\/span> <span class=\"sg\" data-s=\"7\">Този курс използва Rakudo за примерите си.<\/span> <span class=\"sg\" data-s=\"8\">Но вие учите самия език Raku.<\/span> <span class=\"sg\" data-s=\"9\">Почти всичко от него работи и на Raku++, без промени.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Има и трета реализация: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Това е интерпретатор.<\/span> <span class=\"sg\" data-s=\"2\">Токухиро Мацуно го написа на Rust.<\/span> <span class=\"sg\" data-s=\"3\">Той компилира кода на Raku до байткод.<\/span> <span class=\"sg\" data-s=\"4\">След това собствената му виртуална машина изпълнява този байткод.<\/span> <span class=\"sg\" data-s=\"5\">Можете да го пускате и в уеб браузър, чрез WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Сайтът му има ръководство по Raku и площадка.<\/span> <span class=\"sg\" data-s=\"7\">И двете работят на mutsu.<\/span> <span class=\"sg\" data-s=\"8\">Авторът още работи усилено по него.<\/span> <span class=\"sg\" data-s=\"9\">Авторът казва, че той още не е готов за истински проекти.<\/span> <span class=\"sg\" data-s=\"10\">Но вече минава почти всички тестови файлове на Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите страници показват всяка от трите реализации: Rakudo, Raku++ и mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и как да ги инсталирате.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Raku, Rakudo, Raku++ kaj mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> estas la nomo de la programlingvo.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Kompililo<\/strong> estas programo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi legas vian kodon kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Raku povas havi pli ol unu kompililon.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu kurso uzas <strong>Rakudo<\/strong>, la pli malnovan kaj bone konatan.<\/span> <span class=\"sg\" data-s=\"5\">Ekzistas ankaŭ pli novaj: <strong>Raku++<\/strong> kaj <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu kompililo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La dezajno de Raku ne diras, kiun kompililon uzi.<\/span> <span class=\"sg\" data-s=\"1\">La dezajnaj dokumentoj venas kun aro da testoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu aro nomiĝas Roast.<\/span> <span class=\"sg\" data-s=\"3\">Iu ajn povas verki kompililon.<\/span> <span class=\"sg\" data-s=\"4\">Se ĝi trapasas ĉi tiujn testojn, ĝi estas kompililo de Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Longan tempon, Rakudo estis la sola kompleta kaj stabila kompililo.<\/span> <span class=\"sg\" data-s=\"1\">Nun tio ne estas vera.<\/span> <span class=\"sg\" data-s=\"2\">En julio 2026, aperis dua kompililo: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia aŭtoro verkis ĝin en C++.<\/span> <span class=\"sg\" data-s=\"4\">Ĝia programdosiero nomiĝas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Versio 5.4.1 trapasas ĉiujn testojn de Roast.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ankaŭ startas tre rapide.<\/span> <span class=\"sg\" data-s=\"7\">Ĉi tiu kurso uzas Rakudo por siaj ekzemploj.<\/span> <span class=\"sg\" data-s=\"8\">Sed vi lernas la lingvon Raku mem.<\/span> <span class=\"sg\" data-s=\"9\">Preskaŭ ĉio el ĝi rulas ankaŭ sur Raku++, sen ŝanĝoj.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ tria: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas interpretilo.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno verkis ĝin en Rust.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi kompilas Raku-kodon al bajtkodo.<\/span> <span class=\"sg\" data-s=\"4\">Poste ĝia propra virtuala maŝino rulas ĉi tiun bajtkodon.<\/span> <span class=\"sg\" data-s=\"5\">Vi ankaŭ povas ruli ĝin en retumilo, per WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Ĝia retejo havas lernilon pri Raku kaj provejon.<\/span> <span class=\"sg\" data-s=\"7\">Ambaŭ funkcias per mutsu.<\/span> <span class=\"sg\" data-s=\"8\">La aŭtoro ankoraŭ multe laboras pri ĝi.<\/span> <span class=\"sg\" data-s=\"9\">La aŭtoro diras, ke ĝi ankoraŭ ne estas preta por veraj projektoj.<\/span> <span class=\"sg\" data-s=\"10\">Sed ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj paĝoj montras ĉiun el la tri: Rakudo, Raku++ kaj mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kiel instali ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ ĉe GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Raku, Rakudo, Raku++ et mutsu","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> est nomen linguae programmandi.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Compilator<\/strong> est programma.<\/span> <span class=\"sg\" data-s=\"2\">Codicem tuum legit et exsequitur.<\/span> <span class=\"sg\" data-s=\"3\">Raku plures quam unum compilatorem habere potest.<\/span> <span class=\"sg\" data-s=\"4\">Hic cursus <strong>Rakudo<\/strong> adhibet, veterem et notum.<\/span> <span class=\"sg\" data-s=\"5\">Sunt etiam recentiores: <strong>Raku++<\/strong> et <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam unus compilator<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ratio linguae Raku non dicit quem compilatorem adhibeas.<\/span> <span class=\"sg\" data-s=\"1\">Documenta rationis cum serie probationum veniunt.<\/span> <span class=\"sg\" data-s=\"2\">Nomen huius seriei est Roast.<\/span> <span class=\"sg\" data-s=\"3\">Quisque compilatorem scribere potest.<\/span> <span class=\"sg\" data-s=\"4\">Si compilator has probationes transit, compilator Raku est.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Diu Rakudo solus compilator plenus et stabilis erat.<\/span> <span class=\"sg\" data-s=\"1\">Nunc hoc verum non est.<\/span> <span class=\"sg\" data-s=\"2\">Mense Iulio anni 2026 alter compilator apparuit: <strong>Raku++<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Auctor eius id in C++ scripsit.<\/span> <span class=\"sg\" data-s=\"4\">Fasciculus programmatis eius nomen <code>rakupp<\/code> habet.<\/span> <span class=\"sg\" data-s=\"5\">Versio 5.4.1 omnes probationes Roast transit.<\/span> <span class=\"sg\" data-s=\"6\">Etiam valde celeriter incipit.<\/span> <span class=\"sg\" data-s=\"7\">Hic cursus in exemplis suis Rakudo adhibet.<\/span> <span class=\"sg\" data-s=\"8\">Sed linguam Raku ipsam discis.<\/span> <span class=\"sg\" data-s=\"9\">Paene tota etiam in Raku++ currit, sine mutationibus.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Est etiam tertius: <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Interpres est.<\/span> <span class=\"sg\" data-s=\"2\">Tokuhiro Matsuno eum in Rust scripsit.<\/span> <span class=\"sg\" data-s=\"3\">Codicem Raku in bytecode compilat.<\/span> <span class=\"sg\" data-s=\"4\">Deinde machina virtualis eius propria hunc bytecode exsequitur.<\/span> <span class=\"sg\" data-s=\"5\">Eum etiam in navigatro interretiali currere potes, per WebAssembly.<\/span> <span class=\"sg\" data-s=\"6\">Situs eius interretialis institutionem Raku et palaestram habet.<\/span> <span class=\"sg\" data-s=\"7\">Ambae in mutsu currunt.<\/span> <span class=\"sg\" data-s=\"8\">Auctor adhuc multum in eo laborat.<\/span> <span class=\"sg\" data-s=\"9\">Auctor dicit: nondum paratus est ad vera incepta.<\/span> <span class=\"sg\" data-s=\"10\">Sed iam paene omnia archiva probationum Roast transit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Paginae sequentes singulos e tribus ostendunt: Rakudo, Raku++ et mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendunt quomodo eos installes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]}}}</script>
