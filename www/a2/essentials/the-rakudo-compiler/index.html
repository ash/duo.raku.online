<script type="application/json" id="page-data">{"u":"essentials/the-rakudo-compiler","n":4,"k":"section","pv":"essentials/raku-vs-rakudo","nx":"essentials/how-to-install-rakudo","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Rakudo compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is the main compiler of Raku.<\/span> <span class=\"sg\" data-s=\"1\">This course uses it.<\/span> <span class=\"sg\" data-s=\"2\">Today, Rakudo is the most complete way to run Raku.<\/span> <span class=\"sg\" data-s=\"3\">It is also very well tested in real work.<\/span> <span class=\"sg\" data-s=\"4\">So when people say “the Raku compiler”, they usually mean Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo itself is written mostly in Raku.<\/span> <span class=\"sg\" data-s=\"1\">A smaller language helps to build it.<\/span> <span class=\"sg\" data-s=\"2\">This language is NQP, short for “Not Quite Perl”.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo compiles your program to bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Then it runs the bytecode on a virtual machine called <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">When you install Rakudo, you get MoarVM too.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo tries to cover the whole language.<\/span> <span class=\"sg\" data-s=\"7\">Do you need every part of Raku to work?<\/span> <span class=\"sg\" data-s=\"8\">Then Rakudo is the safest choice.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo supports Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">New versions of Rakudo come out often.<\/span> <span class=\"sg\" data-s=\"2\">So you get fixes and new features quickly.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The virtual machine<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Normally, Rakudo runs on MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM is a virtual machine made just for Raku.<\/span> <span class=\"sg\" data-s=\"2\">But Rakudo can also work with other virtual machines.<\/span> <span class=\"sg\" data-s=\"3\">You can build it on top of them.<\/span> <span class=\"sg\" data-s=\"4\">Still, MoarVM is the standard choice.<\/span> <span class=\"sg\" data-s=\"5\">It has good support.<\/span> <span class=\"sg\" data-s=\"6\">This course expects you to use MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">This is the main difference between Rakudo and <a href=\"/essentials/the-rakupp-compiler/\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ is written in C++.<\/span> <span class=\"sg\" data-s=\"9\">It does not need a virtual machine of its own.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code and links<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source.<\/span> <span class=\"sg\" data-s=\"1\">Anyone can watch its development:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Der Rakudo-Compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ist der wichtigste Compiler von Raku.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Kurs verwendet ihn.<\/span> <span class=\"sg\" data-s=\"2\">Heute ist Rakudo der vollständigste Weg, Raku auszuführen.<\/span> <span class=\"sg\" data-s=\"3\">Er ist auch in der Praxis sehr gut getestet.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Leute also „den Raku-Compiler“ sagen, meinen sie meistens Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo selbst ist vor allem in Raku geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Eine kleinere Sprache hilft beim Bauen.<\/span> <span class=\"sg\" data-s=\"2\">Diese Sprache ist NQP, kurz für „Not Quite Perl“.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo übersetzt Ihr Programm in Bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Dann führt er den Bytecode auf einer virtuellen Maschine namens <strong>MoarVM<\/strong> aus.<\/span> <span class=\"sg\" data-s=\"5\">Wenn Sie Rakudo installieren, bekommen Sie MoarVM auch.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo will die ganze Sprache unterstützen.<\/span> <span class=\"sg\" data-s=\"7\">Soll jeder Teil von Raku funktionieren?<\/span> <span class=\"sg\" data-s=\"8\">Dann ist Rakudo die sicherste Wahl.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo unterstützt Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Neue Versionen von Rakudo kommen oft heraus.<\/span> <span class=\"sg\" data-s=\"2\">So bekommen Sie Korrekturen und neue Funktionen schnell.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die virtuelle Maschine<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Normalerweise läuft Rakudo auf MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM ist eine virtuelle Maschine, extra für Raku gemacht.<\/span> <span class=\"sg\" data-s=\"2\">Aber Rakudo kann auch mit anderen virtuellen Maschinen arbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Sie können ihn auf ihnen aufbauen.<\/span> <span class=\"sg\" data-s=\"4\">Trotzdem ist MoarVM die Standardwahl.<\/span> <span class=\"sg\" data-s=\"5\">Sie hat gute Unterstützung.<\/span> <span class=\"sg\" data-s=\"6\">Dieser Kurs erwartet, dass Sie MoarVM benutzen.<\/span> <span class=\"sg\" data-s=\"7\">Das ist der wichtigste Unterschied zwischen Rakudo und <a href=\"https://course.raku.org/de/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ ist in C++ geschrieben.<\/span> <span class=\"sg\" data-s=\"9\">Es braucht keine eigene virtuelle Maschine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode und Links<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo ist quelloffen.<\/span> <span class=\"sg\" data-s=\"1\">Jeder kann seine Entwicklung ansehen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"De Rakudo-compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is de belangrijkste compiler van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Deze cursus gebruikt het.<\/span> <span class=\"sg\" data-s=\"2\">Vandaag is Rakudo de meest complete manier om Raku uit te voeren.<\/span> <span class=\"sg\" data-s=\"3\">Het is ook heel goed getest in echt werk.<\/span> <span class=\"sg\" data-s=\"4\">Als mensen “de Raku-compiler” zeggen, bedoelen ze dus meestal Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo zelf is vooral in Raku geschreven.<\/span> <span class=\"sg\" data-s=\"1\">Een kleinere taal helpt om het te bouwen.<\/span> <span class=\"sg\" data-s=\"2\">Die taal is NQP, een afkorting van “Not Quite Perl”.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo compileert je programma naar bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Daarna voert het de bytecode uit op een virtuele machine die <strong>MoarVM<\/strong> heet.<\/span> <span class=\"sg\" data-s=\"5\">Als je Rakudo installeert, krijg je MoarVM er ook bij.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo probeert de hele taal te dekken.<\/span> <span class=\"sg\" data-s=\"7\">Moet elk deel van Raku voor jou werken?<\/span> <span class=\"sg\" data-s=\"8\">Dan is Rakudo de veiligste keuze.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo ondersteunt Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Nieuwe versies van Rakudo komen vaak uit.<\/span> <span class=\"sg\" data-s=\"2\">Zo krijg je snel verbeteringen en nieuwe mogelijkheden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De virtuele machine<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Normaal draait Rakudo op MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM is een virtuele machine, speciaal gemaakt voor Raku.<\/span> <span class=\"sg\" data-s=\"2\">Maar Rakudo kan ook met andere virtuele machines werken.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt het bovenop die machines bouwen.<\/span> <span class=\"sg\" data-s=\"4\">Toch is MoarVM de standaardkeuze.<\/span> <span class=\"sg\" data-s=\"5\">Het heeft goede ondersteuning.<\/span> <span class=\"sg\" data-s=\"6\">Deze cursus verwacht dat je MoarVM gebruikt.<\/span> <span class=\"sg\" data-s=\"7\">Dit is het grootste verschil tussen Rakudo en <a href=\"https://course.raku.org/nl/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ is in C++ geschreven.<\/span> <span class=\"sg\" data-s=\"9\">Het heeft geen eigen virtuele machine nodig.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode en links<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source.<\/span> <span class=\"sg\" data-s=\"1\">Iedereen kan de ontwikkeling volgen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"El compilador Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> es el compilador principal de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Este curso lo usa.<\/span> <span class=\"sg\" data-s=\"2\">Hoy, Rakudo es la forma más completa de ejecutar Raku.<\/span> <span class=\"sg\" data-s=\"3\">También está muy bien probado en el trabajo real.<\/span> <span class=\"sg\" data-s=\"4\">Así que cuando la gente dice «el compilador de Raku», normalmente habla de Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo está escrito sobre todo en el propio Raku.<\/span> <span class=\"sg\" data-s=\"1\">Un lenguaje más pequeño ayuda a construirlo.<\/span> <span class=\"sg\" data-s=\"2\">Este lenguaje es NQP, la forma corta de «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo compila tu programa a bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Después ejecuta el bytecode en una máquina virtual llamada <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Cuando instalas Rakudo, también recibes MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo intenta cubrir todo el lenguaje.<\/span> <span class=\"sg\" data-s=\"7\">¿Necesitas que funcione cada parte de Raku?<\/span> <span class=\"sg\" data-s=\"8\">Entonces Rakudo es la opción más segura.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo admite Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Salen versiones nuevas de Rakudo a menudo.<\/span> <span class=\"sg\" data-s=\"2\">Así recibes rápido las correcciones y las funciones nuevas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La máquina virtual<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Normalmente, Rakudo funciona sobre MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM es una máquina virtual hecha solo para Raku.<\/span> <span class=\"sg\" data-s=\"2\">Pero Rakudo también puede funcionar con otras máquinas virtuales.<\/span> <span class=\"sg\" data-s=\"3\">Puedes construirlo sobre ellas.<\/span> <span class=\"sg\" data-s=\"4\">Aun así, MoarVM es la opción estándar.<\/span> <span class=\"sg\" data-s=\"5\">Tiene buen soporte.<\/span> <span class=\"sg\" data-s=\"6\">Este curso espera que uses MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Esta es la diferencia principal entre Rakudo y <a href=\"https://course.raku.org/es/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ está escrito en C++.<\/span> <span class=\"sg\" data-s=\"9\">No necesita una máquina virtual propia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente y enlaces<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo es de código abierto.<\/span> <span class=\"sg\" data-s=\"1\">Cualquiera puede seguir su desarrollo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Il compilatore Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> è il compilatore principale di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Questo corso lo usa.<\/span> <span class=\"sg\" data-s=\"2\">Oggi Rakudo è il modo più completo per eseguire Raku.<\/span> <span class=\"sg\" data-s=\"3\">È anche molto ben testato nel lavoro reale.<\/span> <span class=\"sg\" data-s=\"4\">Quindi, quando le persone dicono «il compilatore Raku», di solito intendono Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo stesso è scritto soprattutto in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Un linguaggio più piccolo aiuta a costruirlo.<\/span> <span class=\"sg\" data-s=\"2\">Questo linguaggio è NQP, abbreviazione di «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo compila il tuo programma in bytecode.<\/span> <span class=\"sg\" data-s=\"4\">Poi esegue il bytecode su una macchina virtuale chiamata <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Quando installi Rakudo, ricevi anche MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo cerca di coprire tutto il linguaggio.<\/span> <span class=\"sg\" data-s=\"7\">Ti serve che ogni parte di Raku funzioni?<\/span> <span class=\"sg\" data-s=\"8\">Allora Rakudo è la scelta più sicura.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo supporta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Nuove versioni di Rakudo escono spesso.<\/span> <span class=\"sg\" data-s=\"2\">Così ricevi presto correzioni e nuove funzioni.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La macchina virtuale<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Di solito, Rakudo gira su MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM è una macchina virtuale fatta solo per Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ma Rakudo può funzionare anche con altre macchine virtuali.<\/span> <span class=\"sg\" data-s=\"3\">Puoi costruirlo sopra di loro.<\/span> <span class=\"sg\" data-s=\"4\">Comunque, MoarVM è la scelta standard.<\/span> <span class=\"sg\" data-s=\"5\">Ha un buon supporto.<\/span> <span class=\"sg\" data-s=\"6\">Questo corso si aspetta che tu usi MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Questa è la differenza principale tra Rakudo e <a href=\"https://course.raku.org/it/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ è scritto in C++.<\/span> <span class=\"sg\" data-s=\"9\">Non ha bisogno di una sua macchina virtuale.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente e collegamenti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo è open source.<\/span> <span class=\"sg\" data-s=\"1\">Chiunque può seguire il suo sviluppo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Kompilators Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ir galvenais Raku kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Šis kurss to lieto.<\/span> <span class=\"sg\" data-s=\"2\">Šodien Rakudo ir vispilnīgākais veids, kā palaist Raku.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir arī ļoti labi pārbaudīts īstā darbā.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc, kad cilvēki saka «Raku kompilators», viņi parasti domā Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo pats lielākoties ir uzrakstīts Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tā uzbūvei palīdz mazāka valoda.<\/span> <span class=\"sg\" data-s=\"2\">Šī valoda ir NQP, saīsinājums no «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo kompilē jūsu programmu baitkodā.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas izpilda baitkodu virtuālajā mašīnā, ko sauc <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Kad jūs instalējat Rakudo, jūs saņemat arī MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo cenšas aptvert visu valodu.<\/span> <span class=\"sg\" data-s=\"7\">Vai jums vajag, lai strādā katra Raku daļa?<\/span> <span class=\"sg\" data-s=\"8\">Tad Rakudo ir drošākā izvēle.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo atbalsta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Jaunas Rakudo versijas iznāk bieži.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs ātri saņemat labojumus un jaunas iespējas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Virtuālā mašīna<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Parasti Rakudo darbojas uz MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM ir virtuālā mašīna tieši Raku valodai.<\/span> <span class=\"sg\" data-s=\"2\">Bet Rakudo var strādāt arī ar citām virtuālajām mašīnām.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo var uzbūvēt uz tām.<\/span> <span class=\"sg\" data-s=\"4\">Tomēr MoarVM ir standarta izvēle.<\/span> <span class=\"sg\" data-s=\"5\">Tai ir labs atbalsts.<\/span> <span class=\"sg\" data-s=\"6\">Šis kurss sagaida, ka jūs lietojat MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Tā ir galvenā atšķirība starp Rakudo un <a href=\"https://course.raku.org/lv/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ ir uzrakstīts C++ valodā.<\/span> <span class=\"sg\" data-s=\"9\">Tam nav vajadzīga sava virtuālā mašīna.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods un saites<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">Ikviens var vērot tā izstrādi:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Компилятор Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — это главный компилятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Этот курс использует его.<\/span> <span class=\"sg\" data-s=\"2\">Сегодня Rakudo — самый полный способ запускать Raku.<\/span> <span class=\"sg\" data-s=\"3\">Его также очень хорошо проверили в реальной работе.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому, когда говорят «компилятор Raku», обычно имеют в виду Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написан в основном на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Небольшой язык помогает его собирать.<\/span> <span class=\"sg\" data-s=\"2\">Это язык NQP, сокращение от «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo компилирует вашу программу в байт-код.<\/span> <span class=\"sg\" data-s=\"4\">Потом он выполняет байт-код на виртуальной машине под названием <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Когда вы устанавливаете Rakudo, вы получаете и MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo старается охватить весь язык.<\/span> <span class=\"sg\" data-s=\"7\">Вам нужно, чтобы работала каждая часть Raku?<\/span> <span class=\"sg\" data-s=\"8\">Тогда Rakudo — самый надёжный выбор.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo поддерживает Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Новые версии Rakudo выходят часто.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вы быстро получаете исправления и новые возможности.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуальная машина<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Обычно Rakudo работает на MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM — это виртуальная машина специально для Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но Rakudo может работать и с другими виртуальными машинами.<\/span> <span class=\"sg\" data-s=\"3\">Его можно собрать поверх них.<\/span> <span class=\"sg\" data-s=\"4\">Всё же MoarVM — стандартный выбор.<\/span> <span class=\"sg\" data-s=\"5\">У неё хорошая поддержка.<\/span> <span class=\"sg\" data-s=\"6\">Этот курс ждёт, что вы используете MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Это главная разница между Rakudo и <a href=\"https://course.raku.org/ru/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ написан на C++.<\/span> <span class=\"sg\" data-s=\"9\">Ему не нужна своя виртуальная машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код и ссылки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Любой может следить за его разработкой:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Компілятор Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — це головний компілятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Цей курс використовує його.<\/span> <span class=\"sg\" data-s=\"2\">Сьогодні Rakudo — найповніший спосіб запускати Raku.<\/span> <span class=\"sg\" data-s=\"3\">Його також дуже добре перевірили в справжній роботі.<\/span> <span class=\"sg\" data-s=\"4\">Тож коли люди кажуть «компілятор Raku», вони зазвичай мають на увазі Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написали здебільшого мовою Raku.<\/span> <span class=\"sg\" data-s=\"1\">Менша мова допомагає його зібрати.<\/span> <span class=\"sg\" data-s=\"2\">Ця мова — NQP, скорочення від «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo компілює вашу програму в байткод.<\/span> <span class=\"sg\" data-s=\"4\">Потім він виконує байткод на віртуальній машині <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Коли ви встановлюєте Rakudo, ви отримуєте й MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo намагається охопити всю мову.<\/span> <span class=\"sg\" data-s=\"7\">Вам потрібно, щоб працювала кожна частина Raku?<\/span> <span class=\"sg\" data-s=\"8\">Тоді Rakudo — найбезпечніший вибір.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo підтримує Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Нові версії Rakudo виходять часто.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви швидко отримуєте виправлення і нові можливості.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Віртуальна машина<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Зазвичай Rakudo працює на MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM — це віртуальна машина, зроблена саме для Raku.<\/span> <span class=\"sg\" data-s=\"2\">Але Rakudo може працювати й з іншими віртуальними машинами.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете зібрати його поверх них.<\/span> <span class=\"sg\" data-s=\"4\">Проте MoarVM — це стандартний вибір.<\/span> <span class=\"sg\" data-s=\"5\">Вона має добру підтримку.<\/span> <span class=\"sg\" data-s=\"6\">Цей курс розраховує на MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Це головна відмінність між Rakudo і <a href=\"https://course.raku.org/uk/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ написано мовою C++.<\/span> <span class=\"sg\" data-s=\"9\">Йому не потрібна власна віртуальна машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код і посилання<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Будь-хто може стежити за його розробкою:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Компилаторът Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> е основният компилатор на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Този курс го използва.<\/span> <span class=\"sg\" data-s=\"2\">Днес Rakudo е най-пълният начин да изпълнявате Raku.<\/span> <span class=\"sg\" data-s=\"3\">Той е и много добре изпитан в реална работа.<\/span> <span class=\"sg\" data-s=\"4\">Затова, когато хората кажат „компилаторът на Raku“, обикновено имат предвид Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Самият Rakudo е написан главно на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Един по-малък език помага при изграждането му.<\/span> <span class=\"sg\" data-s=\"2\">Този език е NQP, съкратено от „Not Quite Perl“.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo компилира програмата ви до байткод.<\/span> <span class=\"sg\" data-s=\"4\">След това изпълнява байткода във виртуална машина на име <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Когато инсталирате Rakudo, получавате и MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo се стреми да покрие целия език.<\/span> <span class=\"sg\" data-s=\"7\">Искате ли всяка част на Raku да работи?<\/span> <span class=\"sg\" data-s=\"8\">Тогава Rakudo е най-сигурният избор.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo поддържа Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Нови версии на Rakudo излизат често.<\/span> <span class=\"sg\" data-s=\"2\">Така получавате поправки и нови възможности бързо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуалната машина<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Обикновено Rakudo работи върху MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM е виртуална машина, направена само за Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но Rakudo може да работи и с други виртуални машини.<\/span> <span class=\"sg\" data-s=\"3\">Можете да го изградите върху тях.<\/span> <span class=\"sg\" data-s=\"4\">Все пак MoarVM е стандартният избор.<\/span> <span class=\"sg\" data-s=\"5\">Тя има добра поддръжка.<\/span> <span class=\"sg\" data-s=\"6\">Този курс очаква да използвате MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Това е основната разлика между Rakudo и <a href=\"https://course.raku.org/bg/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ е написан на C++.<\/span> <span class=\"sg\" data-s=\"9\">Той няма нужда от собствена виртуална машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код и връзки<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Всеки може да следи разработката му:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"La kompililo Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> estas la ĉefa kompililo de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu kurso uzas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Hodiaŭ, Rakudo estas la plej kompleta maniero ruli Raku.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas ankaŭ tre bone provita en vera laboro.<\/span> <span class=\"sg\" data-s=\"4\">Do kiam oni diras «la kompililo de Raku», oni kutime celas Rakudo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo mem estas skribita plejparte en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Pli malgranda lingvo helpas konstrui ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu lingvo estas NQP, mallongigo de «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo kompilas vian programon al bajtkodo.<\/span> <span class=\"sg\" data-s=\"4\">Poste ĝi rulas la bajtkodon sur virtuala maŝino nomata <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Kiam vi instalas Rakudo, vi ricevas ankaŭ MoarVM.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo provas kovri la tutan lingvon.<\/span> <span class=\"sg\" data-s=\"7\">Ĉu vi bezonas, ke ĉiu parto de Raku funkciu?<\/span> <span class=\"sg\" data-s=\"8\">Tiam Rakudo estas la plej sekura elekto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo subtenas Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Novaj versioj de Rakudo aperas ofte.<\/span> <span class=\"sg\" data-s=\"2\">Do vi ricevas korektojn kaj novajn funkciojn rapide.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La virtuala maŝino<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Normale, Rakudo rulas sur MoarVM.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM estas virtuala maŝino farita nur por Raku.<\/span> <span class=\"sg\" data-s=\"2\">Sed Rakudo povas ankaŭ funkcii kun aliaj virtualaj maŝinoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas konstrui ĝin sur ili.<\/span> <span class=\"sg\" data-s=\"4\">Tamen MoarVM estas la norma elekto.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi havas bonan subtenon.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu kurso atendas, ke vi uzas MoarVM.<\/span> <span class=\"sg\" data-s=\"7\">Jen la ĉefa diferenco inter Rakudo kaj <a href=\"https://course.raku.org/eo/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ estas skribita en C++.<\/span> <span class=\"sg\" data-s=\"9\">Ĝi ne bezonas propran virtualan maŝinon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo kaj ligiloj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu povas rigardi ĝian disvolvadon:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Compilator Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> est compilator praecipuus linguae Raku.<\/span> <span class=\"sg\" data-s=\"1\">Hic cursus eo utitur.<\/span> <span class=\"sg\" data-s=\"2\">Hodie Rakudo est via plenissima ad Raku currendum.<\/span> <span class=\"sg\" data-s=\"3\">Etiam in vero labore bene probatum est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque cum homines «compilatorem Raku» dicunt, plerumque Rakudo significant.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rakudo ipsum maxima ex parte in Raku scriptum est.<\/span> <span class=\"sg\" data-s=\"1\">Lingua minor id aedificare adiuvat.<\/span> <span class=\"sg\" data-s=\"2\">Haec lingua est NQP, id est «Not Quite Perl».<\/span> <span class=\"sg\" data-s=\"3\">Rakudo programma tuum in bytecode compilat.<\/span> <span class=\"sg\" data-s=\"4\">Deinde bytecode in machina virtuali nomine <strong>MoarVM<\/strong> exsequitur.<\/span> <span class=\"sg\" data-s=\"5\">Cum Rakudo installas, etiam MoarVM accipis.<\/span> <span class=\"sg\" data-s=\"6\">Rakudo totam linguam comprehendere conatur.<\/span> <span class=\"sg\" data-s=\"7\">Debentne omnes partes Raku operari?<\/span> <span class=\"sg\" data-s=\"8\">Tum Rakudo electio tutissima est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rakudo Raku 6.d sustinet.<\/span> <span class=\"sg\" data-s=\"1\">Novae versiones Rakudo saepe apparent.<\/span> <span class=\"sg\" data-s=\"2\">Itaque correctiones et novas facultates celeriter accipis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Machina virtualis<\/span><\/h3>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Plerumque Rakudo in MoarVM currit.<\/span> <span class=\"sg\" data-s=\"1\">MoarVM est machina virtualis tantum pro Raku facta.<\/span> <span class=\"sg\" data-s=\"2\">Sed Rakudo etiam cum aliis machinis virtualibus operari potest.<\/span> <span class=\"sg\" data-s=\"3\">Id super eas aedificare potes.<\/span> <span class=\"sg\" data-s=\"4\">Tamen MoarVM est electio vulgaris.<\/span> <span class=\"sg\" data-s=\"5\">Bonum auxilium habet.<\/span> <span class=\"sg\" data-s=\"6\">In hoc cursu MoarVM adhibes.<\/span> <span class=\"sg\" data-s=\"7\">Haec est praecipua differentia inter Rakudo et <a href=\"https://course.raku.org/la/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"8\">Raku++ in C++ scriptum est.<\/span> <span class=\"sg\" data-s=\"9\">Machinam virtualem propriam non requirit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons et nexus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Quisque progressum eius spectare potest:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]}}}</script>
