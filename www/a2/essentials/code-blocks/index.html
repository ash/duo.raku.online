<script type="application/json" id="page-data">{"u":"essentials/code-blocks","n":119,"k":"section","pv":"essentials/ranges/exercises/number-in-limits/solution","nx":"essentials/code-blocks/lexical-scope","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Code blocks","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A code block is a part of your program.<\/span> <span class=\"sg\" data-s=\"1\">It is inside a pair of curly braces: <code>{<\/code> and <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A block has several statements in it.<\/span> <span class=\"sg\" data-s=\"3\">They work together, like one big statement.<\/span> <span class=\"sg\" data-s=\"4\">The next sections show many ways to use blocks.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This program does not really need the code block.<\/span> <span class=\"sg\" data-s=\"1\">But code blocks are very useful in other cases.<\/span> <span class=\"sg\" data-s=\"2\">We look at them very soon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">But first, let's look at the idea of <em>scope<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Scope is about where you can use a variable.<\/span><\/p>"]]},"de":{"t":"Codeblöcke","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Codeblock ist ein Teil Ihres Programms.<\/span> <span class=\"sg\" data-s=\"1\">Er steht zwischen zwei geschweiften Klammern: <code>{<\/code> und <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ein Block enthält mehrere Anweisungen.<\/span> <span class=\"sg\" data-s=\"3\">Sie arbeiten zusammen, wie eine große Anweisung.<\/span> <span class=\"sg\" data-s=\"4\">Die nächsten Abschnitte zeigen viele Wege, Blöcke zu benutzen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hallo, Welt!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm braucht den Codeblock eigentlich nicht.<\/span> <span class=\"sg\" data-s=\"1\">Aber Codeblöcke sind in anderen Fällen sehr nützlich.<\/span> <span class=\"sg\" data-s=\"2\">Wir sehen sie uns sehr bald an.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber zuerst sehen wir uns die Idee des <em>Scopes<\/em> an.<\/span> <span class=\"sg\" data-s=\"1\">Der Scope zeigt, wo Sie eine Variable benutzen können.<\/span><\/p>"]]},"nl":{"t":"Code blokken","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een codeblok is een deel van je programma.<\/span> <span class=\"sg\" data-s=\"1\">Het staat tussen een paar accolades: <code>{<\/code> en <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een blok heeft meerdere instructies.<\/span> <span class=\"sg\" data-s=\"3\">Ze werken samen, als één grote instructie.<\/span> <span class=\"sg\" data-s=\"4\">In de volgende secties zie je veel manieren om blokken te gebruiken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hallo, Wereld!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit programma heeft het codeblok eigenlijk niet nodig.<\/span> <span class=\"sg\" data-s=\"1\">Maar codeblokken zijn heel nuttig in andere gevallen.<\/span> <span class=\"sg\" data-s=\"2\">We bekijken ze heel binnenkort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar eerst bekijken we het idee van <em>scope<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Scope gaat over waar je een variabele kunt gebruiken.<\/span><\/p>"]]},"es":{"t":"Bloques de código","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un bloque de código es una parte de tu programa.<\/span> <span class=\"sg\" data-s=\"1\">Está dentro de un par de llaves: <code>{<\/code> y <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un bloque tiene varias declaraciones dentro.<\/span> <span class=\"sg\" data-s=\"3\">Funcionan juntas, como una gran declaración.<\/span> <span class=\"sg\" data-s=\"4\">Las siguientes secciones muestran muchas formas de usar bloques.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say '¡Hola, Mundo!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este programa no necesita realmente el bloque de código.<\/span> <span class=\"sg\" data-s=\"1\">Pero los bloques de código son muy útiles en otros casos.<\/span> <span class=\"sg\" data-s=\"2\">Los vemos muy pronto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero primero, veamos la idea de <em>alcance<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El alcance trata de dónde puedes usar una variable.<\/span><\/p>"]]},"it":{"t":"Blocchi di codice","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un blocco di codice è una parte del tuo programma.<\/span> <span class=\"sg\" data-s=\"1\">Sta dentro una coppia di parentesi graffe: <code>{<\/code> e <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un blocco contiene diverse istruzioni.<\/span> <span class=\"sg\" data-s=\"3\">Lavorano insieme, come una grande istruzione.<\/span> <span class=\"sg\" data-s=\"4\">Le prossime sezioni mostrano molti modi di usare i blocchi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A questo programma il blocco di codice non serve davvero.<\/span> <span class=\"sg\" data-s=\"1\">Ma i blocchi di codice sono molto utili in altri casi.<\/span> <span class=\"sg\" data-s=\"2\">Li vediamo molto presto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma prima, guardiamo l'idea di <em>ambito<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">L'ambito dice dove puoi usare una variabile.<\/span><\/p>"]]},"lv":{"t":"Koda bloki","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Koda bloks ir jūsu programmas daļa.<\/span> <span class=\"sg\" data-s=\"1\">Tas atrodas starp cirtainajām iekavām: <code>{<\/code> un <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Blokā ir vairāki paziņojumi.<\/span> <span class=\"sg\" data-s=\"3\">Tie strādā kopā kā viens liels paziņojums.<\/span> <span class=\"sg\" data-s=\"4\">Nākamās sadaļas rāda daudzus veidus, kā izmantot blokus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šai programmai koda bloks īsti nav vajadzīgs.<\/span> <span class=\"sg\" data-s=\"1\">Bet citos gadījumos koda bloki ir ļoti noderīgi.<\/span> <span class=\"sg\" data-s=\"2\">Mēs tos apskatīsim pavisam drīz.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet vispirms apskatīsim <em>apjoma<\/em> ideju.<\/span> <span class=\"sg\" data-s=\"1\">Apjoms parāda, kur jūs varat izmantot mainīgo.<\/span><\/p>"]]},"ru":{"t":"Блоки кода","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок кода — это часть вашей программы.<\/span> <span class=\"sg\" data-s=\"1\">Он находится внутри пары фигурных скобок: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В блоке есть несколько инструкций.<\/span> <span class=\"sg\" data-s=\"3\">Они работают вместе, как одна большая инструкция.<\/span> <span class=\"sg\" data-s=\"4\">Следующие главы показывают много способов использовать блоки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этой программе блок кода на самом деле не нужен.<\/span> <span class=\"sg\" data-s=\"1\">Но блоки кода очень полезны в других случаях.<\/span> <span class=\"sg\" data-s=\"2\">Мы увидим их очень скоро.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но сначала давайте узнаем, что такое <em>область видимости<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Она показывает, где можно использовать переменную.<\/span><\/p>"]]},"uk":{"t":"Блоки коду","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок коду — це частина вашої програми.<\/span> <span class=\"sg\" data-s=\"1\">Він стоїть у парі фігурних дужок: <code>{<\/code> і <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У блоці є кілька операторів.<\/span> <span class=\"sg\" data-s=\"3\">Вони працюють разом, як один великий оператор.<\/span> <span class=\"sg\" data-s=\"4\">Наступні розділи покажуть багато способів використати блоки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цій програмі блок коду насправді не потрібен.<\/span> <span class=\"sg\" data-s=\"1\">Але блоки коду дуже корисні в інших випадках.<\/span> <span class=\"sg\" data-s=\"2\">Ми скоро їх розглянемо.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але спочатку давайте подивимося на ідею <em>області видимості<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Область видимості показує, де можна використати змінну.<\/span><\/p>"]]},"bg":{"t":"Кодови блокове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Кодовият блок е част от вашата програма.<\/span> <span class=\"sg\" data-s=\"1\">Той е вътре в чифт къдрави скоби: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В един блок има няколко израза.<\/span> <span class=\"sg\" data-s=\"3\">Те работят заедно, като един голям израз.<\/span> <span class=\"sg\" data-s=\"4\">Следващите раздели показват много начини да използвате блоковете.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази програма всъщност няма нужда от кодовия блок.<\/span> <span class=\"sg\" data-s=\"1\">Но кодовите блокове са много полезни в други случаи.<\/span> <span class=\"sg\" data-s=\"2\">Скоро ще ги разгледаме.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но първо, нека разгледаме идеята за <em>обхват<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Обхватът показва къде можете да използвате една променлива.<\/span><\/p>"]]},"eo":{"t":"Kodoblokoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kodobloko estas parto de via programo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ene de paro de kurbaj krampoj: <code>{<\/code> kaj <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bloko havas plurajn deklarojn.<\/span> <span class=\"sg\" data-s=\"3\">Ili laboras kune, kiel unu granda deklaro.<\/span> <span class=\"sg\" data-s=\"4\">La sekvaj sekcioj montras multajn manierojn uzi blokojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo ne vere bezonas la kodoblokon.<\/span> <span class=\"sg\" data-s=\"1\">Sed kodoblokoj estas tre utilaj en aliaj kazoj.<\/span> <span class=\"sg\" data-s=\"2\">Ni rigardos ilin tre baldaŭ.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed unue, ni rigardu la ideon de <em>amplekso<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La amplekso montras, kie vi povas uzi variablon.<\/span><\/p>"]]},"la":{"t":"Codicis sectiones","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Claustrum codicis est pars programmatis tui.<\/span> <span class=\"sg\" data-s=\"1\">Intra par uncinorum curvorum est: <code>{<\/code> et <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Claustrum plures enuntiationes habet.<\/span> <span class=\"sg\" data-s=\"3\">Simul operantur, quasi una magna enuntiatio.<\/span> <span class=\"sg\" data-s=\"4\">Sectiones sequentes multos usus claustrorum ostendunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Salve, Munde!';\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma claustrum codicis non vere requirit.<\/span> <span class=\"sg\" data-s=\"1\">Sed claustra codicis in aliis casibus valde utilia sunt.<\/span> <span class=\"sg\" data-s=\"2\">Eos casus mox videmus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed primum notionem <em>ambitus<\/em> spectemus.<\/span> <span class=\"sg\" data-s=\"1\">Ambitus ostendit ubi variabilem adhibere potes.<\/span><\/p>"]]}}}</script>
