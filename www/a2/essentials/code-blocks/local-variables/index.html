 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ahora hay dos variables en el programa.<\/span> <span class=\"sg\" data-s=\"1\">Tienen el mismo nombre.<\/span> <span class=\"sg\" data-s=\"2\">Pero son variables diferentes.<\/span> <span class=\"sg\" data-s=\"3\">En el ámbito global, cada <code>$x<\/code> es la variable global.<\/span> <span class=\"sg\" data-s=\"4\">Dentro del bloque, <code>$x<\/code> es una variable local.<\/span> <span class=\"sg\" data-s=\"5\">No es el <code>$x<\/code> global.<\/span> <span class=\"sg\" data-s=\"6\">El programa imprime dos valores diferentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"it":{"t":"Variabili locali","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora crei una variabile nello scope globale.<\/span> <span class=\"sg\" data-s=\"1\">La crei anche localmente, dentro il blocco.<\/span> <span class=\"sg\" data-s=\"2\">Che cosa succede allora?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ora nel programma ci sono due variabili.<\/span> <span class=\"sg\" data-s=\"1\">Hanno lo stesso nome.<\/span> <span class=\"sg\" data-s=\"2\">Ma sono variabili diverse.<\/span> <span class=\"sg\" data-s=\"3\">Nello scope globale, ogni <code>$x<\/code> è la variabile globale.<\/span> <span class=\"sg\" data-s=\"4\">Dentro il blocco, <code>$x<\/code> è una variabile locale.<\/span> <span class=\"sg\" data-s=\"5\">Non è il <code>$x<\/code> globale.<\/span> <span class=\"sg\" data-s=\"6\">Il programma stampa due valori diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"lv":{"t":"Vietējie mainīgie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad jūs izveidojat mainīgo globālajā apjomā.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izveidojat arī lokāl рамата отпечатва две различни стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"eo":{"t":"Lokaj variabloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun vi kreas variablon en la tutmonda amplekso.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ kreas ĝin loke, ene de la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Kio okazas tiam?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Nun estas du variabloj en la programo.<\/span> <span class=\"sg\" data-s=\"1\">Ili havas la saman nomon.<\/span> <span class=\"sg\" data-s=\"2\">Sed ili estas malsamaj variabloj.<\/span> <span class=\"sg\" data-s=\"3\">En la tutmonda amplekso, ĉiu <code>$x<\/code> estas la tutmonda variablo.<\/span> <span class=\"sg\" data-s=\"4\">Ene de la bloko, <code>$x<\/code> estas loka variablo.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ne estas la tutmonda <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">La programo presas du malsamajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"la":{"t":"Locales variabiles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc variabilem in ambitu globali creas.<\/span> <span class=\"sg\" data-s=\"1\">Eam etiam localiter creas, intra clausulam.<\/span> <span class=\"sg\" data-s=\"2\">Quid tum fit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Nunc duae variabiles in programmate sunt.<\/span> <span class=\"sg\" data-s=\"1\">Idem nomen habent.<\/span> <span class=\"sg\" data-s=\"2\">Sed variabiles diversae sunt.<\/span> <span class=\"sg\" data-s=\"3\">In ambitu globali, omne <code>$x<\/code> est variabilis globalis.<\/span> <span class=\"sg\" data-s=\"4\">Intra clausulam
