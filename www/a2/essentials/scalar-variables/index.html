<script type="application/json" id="page-data">{"u":"essentials/scalar-variables","n":31,"k":"section","pv":"essentials/comments/embedded","nx":"essentials/scalar-variables/declaring-a-variable","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Scalar variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Until now, our programs had text strings written right in the code.<\/span> <span class=\"sg\" data-s=\"1\">Now we add a little freedom.<\/span> <span class=\"sg\" data-s=\"2\">The programs can use variables.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku has a few kinds of variables.<\/span> <span class=\"sg\" data-s=\"1\">A variable is a container.<\/span> <span class=\"sg\" data-s=\"2\">It keeps some data, like a box.<\/span> <span class=\"sg\" data-s=\"3\">We start with the simplest containers.<\/span> <span class=\"sg\" data-s=\"4\">They keep only one value.<\/span> <span class=\"sg\" data-s=\"5\">We call them <em>scalars<\/em>, or scalar variables.<\/span> <span class=\"sg\" data-s=\"6\">Every variable has a name.<\/span> <span class=\"sg\" data-s=\"7\">A special character comes before the name.<\/span> <span class=\"sg\" data-s=\"8\">It shows the kind of container.<\/span> <span class=\"sg\" data-s=\"9\">This character is the <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">For scalar containers, the sigil is the dollar sign <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are two scalar variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"de":{"t":"Skalare Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bis jetzt hatten unsere Programme Textzeichenfolgen direkt im Code.<\/span> <span class=\"sg\" data-s=\"1\">Jetzt bringen wir ein wenig Freiheit hinein.<\/span> <span class=\"sg\" data-s=\"2\">Die Programme können Variablen verwenden.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku hat einige Arten von Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable ist ein Behälter.<\/span> <span class=\"sg\" data-s=\"2\">Sie speichert Daten, wie eine Kiste.<\/span> <span class=\"sg\" data-s=\"3\">Wir beginnen mit den einfachsten Behältern.<\/span> <span class=\"sg\" data-s=\"4\">Sie speichern nur einen Wert.<\/span> <span class=\"sg\" data-s=\"5\">Wir nennen sie <em>Skalare<\/em> oder skalare Variablen.<\/span> <span class=\"sg\" data-s=\"6\">Jede Variable hat einen Namen.<\/span> <span class=\"sg\" data-s=\"7\">Vor dem Namen steht ein besonderes Zeichen.<\/span> <span class=\"sg\" data-s=\"8\">Es zeigt die Art des Behälters.<\/span> <span class=\"sg\" data-s=\"9\">Dieses Zeichen ist das <em>Sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Für skalare Behälter ist das Sigil das Dollarzeichen <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind zwei skalare Variablen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"nl":{"t":"Scalare variabelen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe hadden onze programma's tekststrings direct in de code.<\/span> <span class=\"sg\" data-s=\"1\">Nu voegen we een beetje vrijheid toe.<\/span> <span class=\"sg\" data-s=\"2\">De programma's kunnen variabelen gebruiken.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een paar soorten variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele is een container.<\/span> <span class=\"sg\" data-s=\"2\">Hij bewaart wat gegevens, zoals een doos.<\/span> <span class=\"sg\" data-s=\"3\">We beginnen met de eenvoudigste containers.<\/span> <span class=\"sg\" data-s=\"4\">Ze bewaren maar één waarde.<\/span> <span class=\"sg\" data-s=\"5\">We noemen ze <em>scalars<\/em>, of scalaire variabelen.<\/span> <span class=\"sg\" data-s=\"6\">Elke variabele heeft een naam.<\/span> <span class=\"sg\" data-s=\"7\">Voor de naam staat een speciaal teken.<\/span> <span class=\"sg\" data-s=\"8\">Het laat zien wat voor container het is.<\/span> <span class=\"sg\" data-s=\"9\">Dit teken is de <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Voor scalaire containers is de sigil het dollarteken <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn twee scalaire variabelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"es":{"t":"Variables escalares","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, nuestros programas tenían cadenas de texto escritas directamente en el código.<\/span> <span class=\"sg\" data-s=\"1\">Ahora añadimos un poco de libertad.<\/span> <span class=\"sg\" data-s=\"2\">Los programas pueden usar variables.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku tiene algunos tipos de variables.<\/span> <span class=\"sg\" data-s=\"1\">Una variable es un contenedor.<\/span> <span class=\"sg\" data-s=\"2\">Guarda algunos datos, como una caja.<\/span> <span class=\"sg\" data-s=\"3\">Empezamos con los contenedores más simples.<\/span> <span class=\"sg\" data-s=\"4\">Solo guardan un valor.<\/span> <span class=\"sg\" data-s=\"5\">Los llamamos <em>escalares<\/em>, o variables escalares.<\/span> <span class=\"sg\" data-s=\"6\">Cada variable tiene un nombre.<\/span> <span class=\"sg\" data-s=\"7\">Delante del nombre va un carácter especial.<\/span> <span class=\"sg\" data-s=\"8\">Indica el tipo de contenedor.<\/span> <span class=\"sg\" data-s=\"9\">Este carácter es el <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Para los contenedores escalares, el sigil es el signo de dólar <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay dos variables escalares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"it":{"t":"Variabili scalari","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Finora, i nostri programmi avevano stringhe di testo scritte direttamente nel codice.<\/span> <span class=\"sg\" data-s=\"1\">Ora aggiungiamo un po' di libertà.<\/span> <span class=\"sg\" data-s=\"2\">I programmi possono usare variabili.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku ha alcuni tipi di variabili.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile è un contenitore.<\/span> <span class=\"sg\" data-s=\"2\">Contiene dei dati, come una scatola.<\/span> <span class=\"sg\" data-s=\"3\">Iniziamo con i contenitori più semplici.<\/span> <span class=\"sg\" data-s=\"4\">Contengono un solo valore.<\/span> <span class=\"sg\" data-s=\"5\">Li chiamiamo <em>scalari<\/em>, o variabili scalari.<\/span> <span class=\"sg\" data-s=\"6\">Ogni variabile ha un nome.<\/span> <span class=\"sg\" data-s=\"7\">Prima del nome c'è un carattere speciale.<\/span> <span class=\"sg\" data-s=\"8\">Mostra il tipo di contenitore.<\/span> <span class=\"sg\" data-s=\"9\">Questo carattere è il <em>sigillo<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Per i contenitori scalari, il sigillo è il segno del dollaro <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco due variabili scalari:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"lv":{"t":"Skalarie mainīgie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Līdz šim mūsu programmās teksta virknes bija ierakstītas tieši kodā.<\/span> <span class=\"sg\" data-s=\"1\">Tagad mēs pievienojam nedaudz brīvības.<\/span> <span class=\"sg\" data-s=\"2\">Programmas var izmantot mainīgos.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir dažu veidu mainīgie.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais ir konteiners.<\/span> <span class=\"sg\" data-s=\"2\">Tas glabā datus, kā kaste.<\/span> <span class=\"sg\" data-s=\"3\">Mēs sākam ar vienkāršākajiem konteineriem.<\/span> <span class=\"sg\" data-s=\"4\">Tie glabā tikai vienu vērtību.<\/span> <span class=\"sg\" data-s=\"5\">Mēs tos saucam par <em>skalāriem<\/em> jeb skalārajiem mainīgajiem.<\/span> <span class=\"sg\" data-s=\"6\">Katram mainīgajam ir nosaukums.<\/span> <span class=\"sg\" data-s=\"7\">Pirms nosaukuma ir īpaša rakstzīme.<\/span> <span class=\"sg\" data-s=\"8\">Tā parāda konteinera veidu.<\/span> <span class=\"sg\" data-s=\"9\">Šī rakstzīme ir <em>sigils<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Skalārajiem konteineriem sigils ir dolāra zīme <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir divi skalārie mainīgie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"ru":{"t":"Скалярные переменные","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">До сих пор мы писали текстовые строки прямо в коде программ.<\/span> <span class=\"sg\" data-s=\"1\">Теперь мы добавим немного свободы.<\/span> <span class=\"sg\" data-s=\"2\">Программы могут использовать переменные.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько видов переменных.<\/span> <span class=\"sg\" data-s=\"1\">Переменная — это контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Она хранит данные, как коробка.<\/span> <span class=\"sg\" data-s=\"3\">Мы начнём с самых простых контейнеров.<\/span> <span class=\"sg\" data-s=\"4\">Они хранят только одно значение.<\/span> <span class=\"sg\" data-s=\"5\">Мы называем их <em>скалярами<\/em>, или скалярными переменными.<\/span> <span class=\"sg\" data-s=\"6\">У каждой переменной есть имя.<\/span> <span class=\"sg\" data-s=\"7\">Перед именем стоит особый символ.<\/span> <span class=\"sg\" data-s=\"8\">Он показывает вид контейнера.<\/span> <span class=\"sg\" data-s=\"9\">Этот символ — <em>сигил<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Для скалярных контейнеров сигил — это знак доллара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот две скалярные переменные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"uk":{"t":"Скалярні змінні","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досі в наших програмах текстові рядки були записані прямо в коді.<\/span> <span class=\"sg\" data-s=\"1\">Тепер додамо трохи свободи.<\/span> <span class=\"sg\" data-s=\"2\">Програми можуть використовувати змінні.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">У Raku є кілька видів змінних.<\/span> <span class=\"sg\" data-s=\"1\">Змінна — це контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Вона зберігає дані, як коробка.<\/span> <span class=\"sg\" data-s=\"3\">Почнемо з найпростіших контейнерів.<\/span> <span class=\"sg\" data-s=\"4\">Вони зберігають лише одне значення.<\/span> <span class=\"sg\" data-s=\"5\">Ми називаємо їх <em>скалярами<\/em>, або скалярними змінними.<\/span> <span class=\"sg\" data-s=\"6\">Кожна змінна має ім'я.<\/span> <span class=\"sg\" data-s=\"7\">Перед ім'ям стоїть спеціальний символ.<\/span> <span class=\"sg\" data-s=\"8\">Він показує вид контейнера.<\/span> <span class=\"sg\" data-s=\"9\">Цей символ — <em>сигіл<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Для скалярних контейнерів сигіл — це знак долара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось дві скалярні змінні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"bg":{"t":"Скаларни променливи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Досега нашите програми имаха текстови низове, написани направо в кода.<\/span> <span class=\"sg\" data-s=\"1\">Сега добавяме малко свобода.<\/span> <span class=\"sg\" data-s=\"2\">Програмите могат да използват променливи.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku има няколко вида променливи.<\/span> <span class=\"sg\" data-s=\"1\">Променливата е контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Тя пази някакви данни, като кутия.<\/span> <span class=\"sg\" data-s=\"3\">Започваме с най-простите контейнери.<\/span> <span class=\"sg\" data-s=\"4\">Те пазят само една стойност.<\/span> <span class=\"sg\" data-s=\"5\">Наричаме ги <em>скалари<\/em>, или скаларни променливи.<\/span> <span class=\"sg\" data-s=\"6\">Всяка променлива има име.<\/span> <span class=\"sg\" data-s=\"7\">Пред името стои специален символ.<\/span> <span class=\"sg\" data-s=\"8\">Той показва вида на контейнера.<\/span> <span class=\"sg\" data-s=\"9\">Този символ е <em>сигилът<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">За скаларните контейнери сигилът е знакът за долар <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето две скаларни променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"eo":{"t":"Skalaraj variabloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, niaj programoj havis tekstajn ĉenojn rekte en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">Nun ni aldonas iom da libereco.<\/span> <span class=\"sg\" data-s=\"2\">La programoj povas uzi variablojn.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku havas kelkajn specojn de variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Variablo estas ujo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi tenas iujn datumojn, kiel skatolo.<\/span> <span class=\"sg\" data-s=\"3\">Ni komencas per la plej simplaj ujoj.<\/span> <span class=\"sg\" data-s=\"4\">Ili tenas nur unu valoron.<\/span> <span class=\"sg\" data-s=\"5\">Ni nomas ilin <em>skalaroj<\/em>, aŭ skalaraj variabloj.<\/span> <span class=\"sg\" data-s=\"6\">Ĉiu variablo havas nomon.<\/span> <span class=\"sg\" data-s=\"7\">Speciala signo staras antaŭ la nomo.<\/span> <span class=\"sg\" data-s=\"8\">Ĝi montras la specon de ujo.<\/span> <span class=\"sg\" data-s=\"9\">Tiu signo estas la <em>sigelo<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Por skalaraj ujoj, la sigelo estas la dolara signo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen du skalaraj variabloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"la":{"t":"Scalari variabiles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Adhuc programmata nostra chordas textus in ipso codice scriptas habebant.<\/span> <span class=\"sg\" data-s=\"1\">Nunc paulum libertatis addimus.<\/span> <span class=\"sg\" data-s=\"2\">Programmata variabilibus uti possunt.<\/span><\/p>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Raku pauca genera variabilium habet.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis est continens.<\/span> <span class=\"sg\" data-s=\"2\">Aliqua data tenet, sicut arca.<\/span> <span class=\"sg\" data-s=\"3\">Incipimus a continentibus simplicissimis.<\/span> <span class=\"sg\" data-s=\"4\">Unum tantum valorem tenent.<\/span> <span class=\"sg\" data-s=\"5\">Ea <em>scalars<\/em> vel variabiles scalares vocamus.<\/span> <span class=\"sg\" data-s=\"6\">Omnis variabilis nomen habet.<\/span> <span class=\"sg\" data-s=\"7\">Ante nomen est character specialis.<\/span> <span class=\"sg\" data-s=\"8\">Is genus continentis monstrat.<\/span> <span class=\"sg\" data-s=\"9\">Hic character est <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"10\">Pro continentibus scalaribus, sigil est signum dollari <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce duae variabiles scalares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]}}}</script>
