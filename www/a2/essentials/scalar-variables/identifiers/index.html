e single quote <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Here, the single quote means an apostrophe.<\/span> <span class=\"sg\" data-s=\"4\">An identifier must start with a letter or an underscore.<\/span> <span class=\"sg\" data-s=\"5\">After a <code>-<\/code> or a <code>'<\/code>, there must be a letter.<\/span> <span class=\"sg\" data-s=\"6\">Here are a few more correct identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Again, you choose the names.<\/span> <span class=\"sg\" data-s=\"1\">But some names look like a secret code.<\/span> <span class=\"sg\" data-s=\"2\">It is probably a bad idea to choose such names on purpose.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode characters<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In fact, there are many more letters and digits.<\/span> <span class=\"sg\" data-s=\"1\">Unicode has properties for every character.<\/span> <span class=\"sg\" data-s=\"2\">They say if the character is a letter or a decimal digit.<\/span> <span class=\"sg\" data-s=\"3\">Raku uses these properties.<\/span> <span class=\"sg\" data-s=\"4\">For example, these variables are correct in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # where ۲ is a digit<\/code><\/pre>"]]},"de":{"t":"Namen der Variablen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Bevor wir weitermachen, sehen wir uns ein interessantes Thema an.<\/span> <span class=\"sg\" data-s=\"1\">Welche Namen können Variablen haben?<\/span> <span class=\"sg\" data-s=\"2\">Bis jetzt haben wir einfache Namen verwendet, wie <code>$name<\/code> oder <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Diese Namen haben nur Kleinbuchstaben aus dem englischen Alphabet.<\/span> <span class=\"sg\" data-s=\"4\">Aber es gibt mehr Möglichkeiten.<\/span><\/p>"],["h",1,"<h3><span class= >Es ist wahrscheinlich eine schlechte Idee, solche Namen mit Absicht zu wählen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Zeichen<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich gibt es noch viel mehr Buchstaben und Ziffern.<\/span> <span class=\"sg\" data-s=\"1\">Unicode hat Eigenschaften für jedes Zeichen.<\/span> <span class=\"sg\" data-s=\"2\">Sie sagen, ob das Zeichen ein Buchstabe oder eine Dezimalziffer ist.<\/span> <span class=\"sg\" data-s=\"3\">Raku verwendet diese Eigenschaften.<\/span> <span class=\"sg\" data-s=\"4\">Zum Beispiel sind diese Variablen in Raku korrekt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # wobei ۲ eine Ziffer ist<\/code><\/pre>"]]},"nl":{"t":"Namen van de variabelen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Voordat we verder gaan, kijken we naar een interessant onderwerp.<\/span> <span class=\"sg\" data-s=\"1\">Welke namen kunnen variabelen hebben?<\/span> <span class=\"sg\" data-s=\"2\">Tot nu toe gebruikten we eenvoudige namen, zoals <code>$name<\/code> of <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ze hebben alleen kleine letters uit het Engelse alfabet.<\/span> <span class=\"sg\" data-s=\"4\">Maar er zijn meer mogelijkheden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hoofdletters en kleine letters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Namen van variabelen heten ook <em>identifiers<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">In identifiers zijn hoofdletters en kleine letters verschillend.<\/span> <span class=\"sg\" data-s=\"2\">Daarom is elke naam hieronder een andere scalaire container:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jij bepaalt hoe je je variabelen noemt.<\/span> <span class=\"sg\" data-s=\"1\">Maar hier is een idee.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik namen met alleen hoofdletters voor constanten.<\/span> <span class=\"sg\" data-s=\"3\">Constanten zijn waarden die niet veranderen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere tekens<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Er zijn ook nog andere ASCII-tekens mogelijk.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt cijfers en het onderstrepingsteken <code>_<\/code> gebruiken.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ook het koppelteken <code>-<\/code> en het enkele aanhalingsteken <code>'<\/code> gebruiken.<\/span> <span class=\"sg\" data-s=\"3\">Hier betekent het enkele aanhalingsteken een apostrof.<\/span> <span class=\"sg\" data-s=\"4\">Een identifier moet beginnen met een letter of een onderstrepingsteken.<\/span> <span class=\"sg\" data-s=\"5\">Na een <code>-<\/code> of een <code>'<\/code> moet een letter komen.<\/span> <span class=\"sg\" data-s=\"6\">Hier zijn nog een paar correcte identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nogmaals, jij kiest de namen.<\/span> <span class=\"sg\" data-s=\"1\">Maar sommige namen lijken op een geheime code.<\/span> <span class=\"sg\" data-s=\"2\">Het is waarschijnlijk een slecht idee om zulke namen expres te kiezen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode tekens<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Eigenlijk zijn er veel meer letters en cijfers.<\/span> <span class=\"sg\" data-s=\"1\">Unicode heeft eigenschappen voor elk teken.<\/span> <span class=\"sg\" data-s=\"2\">Die zeggen of het teken een letter of een decimaal cijfer is.<\/span> <span class=\"sg\" data-s=\"3\">Raku gebruikt deze eigenschappen.<\/span> <span class=\"sg\" data-s=\"4\">Deze variabelen zijn bijvoorbeeld correct in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # waarbij ۲ een ci uscole sono diverse.<\/span> <span class=\"sg\" data-s=\"2\">Quindi ogni nome qui sotto indica un contenitore scalare diverso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Decidi tu come chiamare le tue variabili.<\/span> <span class=\"sg\" data-s=\"1\">Ma ecco un'idea.<\/span> <span class=\"sg\" data-s=\"2\">Usa i nomi tutti in maiuscolo per le costanti.<\/span> <span class=\"sg\" data-s=\"3\">Le costanti sono valori che non cambiano.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri caratteri<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Sono possibili anche altri caratteri ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usare le cifre e il trattino basso <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare anche il trattino <code>-<\/code> e l'apice singolo <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Qui l'apice singolo indica un apostrofo.<\/span> <span class=\"sg\" data-s=\"4\">Un identificatore deve iniziare con una lettera o con un trattino basso.<\/span> <span class=\"sg\" data-s=\"5\">Dopo un <code>-<\/code> o un <code>'<\/code>, ci deve essere una lettera.<\/span> <span class=\"sg\" data-s=\"6\">Ecco altri identificatori corretti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ancora una volta, scegli tu i nomi.<\/span> <span class=\"sg\" data-s=\"1\">Ma alcuni nomi sembrano un codice segreto.<\/span> <span class=\"sg\" data-s=\"2\">Probabilmente non è una buona idea scegliere apposta nomi così.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caratteri Unicode<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In realtà, ci sono molte più lettere e cifre.<\/span> <span class=\"sg\" data-s=\"1\">Unicode ha delle proprietà per ogni carattere.<\/span> <span class=\"sg\" data-s=\"2\">Dicono se il carattere è una lettera o una cifra decimale.<\/span> <span class=\"sg\" data-s=\"3\">Raku usa queste proprietà.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, queste variabili sono corrette in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # dove ۲ è una cifra<\/code><\/pre>"]]},"lv":{"t":"Mainīgo nosaukumi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pirms mēs ejam tālāk, apskatīsim interesantu tēmu.<\/span> <span class=\"sg\" data-s=\"1\">Kādi nosaukumi var būt mainīgajiem?<\/span> <span class=\"sg\" data-s=\"2\">Līdz šim mēs izmantojām vienkāršus nosaukumus, piemēram, <code>$name<\/code> vai <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tajos ir tikai mazie angļu alfabēta burti.<\/span> <span class=\"sg\" data-s=\"4\">Bet ir arī citas iespējas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lielie un mazie burti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mainīgo nosaukumus sauc arī par <em>identifikatoriem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Identifikatoros lielie un mazie burti ir dažādi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc katrs nosaukums zemāk nozīmē citu skalāro konteineru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs paši izlemjat, kā nosaukt savus mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Bet lūk, viena ideja.<\/span> <span class=\"sg\" data-s=\"2\">Nosaukumus tikai ar lielajiem burtiem atstājiet konstantēm.<\/span> <span class=\"sg\" data-s=\"3\">Konstantes ir vērtības, kas nemainās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi rakstzīmes<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Var izmantot arī dažas citas ASCII rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat izmantot ciparus un apakšsvītru <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat izmantot arī defisi <code>-<\/code> un vienpēdiņu <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šeit vienpēdiņa nozīmē apostrofu.<\/span> <span class=\"sg\" data-s=\"4\">Identifikatoram jāsākas ar burtu vai apakšsvītru.<\/span> <span class=\"sg\" data-s=\"5\">Pēc <code>-<\/code> vai <code>'<\/code> ir jābūt burtam.<\/span> <span class=\"sg\" data-s=\"6\">Šeit ir vēl daži pareizi identifikatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Atkal, nosaukumus izvēlaties jūs.<\/span> <span class=\"sg\" data-s=\"1\">Bet daži nosaukumi izskatās kā slepens kods.<\/span> <span class=\"sg\" data-s=\"2\">Droši vien nav laba ideja tādus nosaukumus izvēlēties tīšām.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode rakstzīmes<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Patiesībā burtu un ciparu ir daudz vairāk.<\/span> <span class=\"sg\" data-s=\"1\">Unicode katrai rakstzīmei ir īpašības.<\/span> <span class=\"sg\" data-s=\"2\">Tās saka, vai rakstzīme ir burts vai decimālais cipars.<\/span> <span class=\"sg\" data-s=\"3\">Raku izmanto šīs īpašības.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, šie mainīgie Raku valodā ir pareizi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kur ۲ ir cipars<\/code><\/pre>"]]},"ru":{"t":"Имена переменных","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Прежде чем идти дальше, давайте посмотрим на интересную тему.<\/span> <span class=\"sg\" data-s=\"1\">Какие имена могут быть у переменных?<\/span> <span class=\"sg\" data-s=\"2\">До сих пор мы использовали простые имена, например <code>$name<\/code> или <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В них есть только строчные буквы английского алфавита.<\/span> <span class=\"sg\" data-s=\"4\">Но вариантов больше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Большие и маленькие буквы<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Имена переменных также называют <em>идентификаторами<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В идентификаторах большие и маленькие буквы различаются.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому каждое имя ниже означает другой скалярный контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы сами решаете, как называть переменные.<\/span> <span class=\"sg\" data-s=\"1\">Но вот идея.<\/span> <span class=\"sg\" data-s=\"2\">Оставьте имена из одних больших букв для констант.<\/span> <span class=\"sg\" data-s=\"3\">Константы — это значения, которые не меняются.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие символы<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Можно использовать и некоторые другие символы ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете брать цифры и нижнее подчёркивание <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ещё можно брать дефис <code>-<\/code> и одинарную кавычку <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Здесь одинарная кавычка означает апостроф.<\/span> <span class=\"sg\" data-s=\"4\">Идентификатор должен начинаться с буквы или с подчёркивания.<\/span> <span class=\"sg\" data-s=\"5\">После <code>-<\/code> или <code>'<\/code> должна идти буква.<\/span> <span class=\"sg\" data-s=\"6\">Вот ещё несколько правильных идентификаторов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Опять же, имена выбираете вы.<\/span> <span class=\"sg\" data-s=\"1\">Но некоторые имена похожи на секретный код.<\/span> <span class=\"sg\" data-s=\"2\">Наверное, не стоит выбирать такие имена специально.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">На самом деле букв и цифр гораздо больше.<\/span> <span class=\"sg\" data-s=\"1\">В Юникоде у каждого символа есть свойства.<\/span> <span class=\"sg\" data-s=\"2\">Они говорят, буква это или десятичная цифра.<\/span> <span class=\"sg\" data-s=\"3\">Raku использует эти свойства.<\/span> <span class=\"sg\" data-s=\"4\">Например, такие переменные в Raku правильные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # где ۲ это число<\/code><\/pre>"]]},"uk":{"t":"Імена змінних","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Перш ніж іти далі, давайте подивимося на цікаву тему.<\/span> <span class=\"sg\" data-s=\"1\">Які імена можуть мати змінні?<\/span> <span class=\"sg\" data-s=\"2\">Досі ми використовували прості імена, як <code>$name<\/code> або <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У них є лише малі літери англійського алфавіту.<\/span> <span class=\"sg\" data-s=\"4\">Але є й інші варіанти.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Великі та малі літери<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Імена змінних також називаються <em>ідентифікаторами<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В ідентифікаторах великі та малі літери різні.<\/span> <span class=\"sg\" data-s=\"2\">Тому кожне ім'я нижче означає інший скалярний контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви самі вирішуєте, як називати змінні.<\/span> <span class=\"sg\" data-s=\"1\">Але ось одна ідея.<\/span> <span class=\"sg\" data-s=\"2\">Залиште імена з одних великих літер для констант.<\/span> <span class=\"sg\" data-s=\"3\">Константи — це значення, які не змінюються.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші символи<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Деякі інші символи ASCII теж можна використовувати.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете використовувати цифри і підкреслення <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Також можна використовувати дефіс <code>-<\/code> та одинарну лапку <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тут одинарна лапка означає апостроф.<\/span> <span class=\"sg\" data-s=\"4\">Ідентифікатор має починатися з літери або підкреслення.<\/span> <span class=\"sg\" data-s=\"5\">Після <code>-<\/code> або <code>'<\/code> має бути літера.<\/span> <span class=\"sg\" data-s=\"6\">Ось ще кілька правильних ідентифікаторів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Знову ж таки, імена обираєте ви.<\/span> <span class=\"sg\" data-s=\"1\">Але деякі імена схожі на секретний код.<\/span> <span class=\"sg\" data-s=\"2\">Мабуть, погана ідея обирати такі імена навмисно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні символи<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Насправді літер і цифр набагато більше.<\/span> <span class=\"sg\" data-s=\"1\">У Unicode кожен символ має властивості.<\/span> <span class=\"sg\" data-s=\"2\">Вони кажуть, чи є символ літерою або десятковою цифрою.<\/span> <span class=\"sg\" data-s=\"3\">Raku використовує ці властивості.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, ці змінні правильні в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # де ۲ є цифрою<\/code><\/pre>"]]},"bg":{"t":"Имена на променливите","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Преди да продължим, нека разгледаме една интересна тема.<\/span> <span class=\"sg\" data-s=\"1\">Какви имена могат да имат променливите?<\/span> <span class=\"sg\" data-s=\"2\">Досега използвахме прости имена, като <code>$name<\/code> или <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Те имат само малки букви от английската азбука.<\/span> <span class=\"sg\" data-s=\"4\">Но има и други възможности.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Главни и малки букви<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Имената на променливите се наричат също <em>идентификатори<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">В идентификаторите главните и малките букви са различни.<\/span> <span class=\"sg\" data-s=\"2\">Затова всяко име по-долу означава различен скаларен контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вие решавате как да наричате своите променливи.<\/span> <span class=\"sg\" data-s=\"1\">Но ето една идея.<\/span> <span class=\"sg\" data-s=\"2\">Пазете имената само с главни букви за константите.<\/span> <span class=\"sg\" data-s=\"3\">Константите са стойности, които не се променят.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други символи<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате и някои други ASCII символи.<\/span> <span class=\"sg\" data-s=\"1\">Можете да пишете цифри и долна черта <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете също да пишете тире <code>-<\/code> и единична кавичка <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тук единичната кавичка означава апостроф.<\/span> <span class=\"sg\" data-s=\"4\">Идентификаторът трябва да започва с буква или с долна черта.<\/span> <span class=\"sg\" data-s=\"5\">След <code>-<\/code> или <code>'<\/code> трябва да има буква.<\/span> <span class=\"sg\" data-s=\"6\">Ето още няколко правилни идентификатора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Отново, вие избирате имената.<\/span> <span class=\"sg\" data-s=\"1\">Но някои имена приличат на таен код.<\/span> <span class=\"sg\" data-s=\"2\">Вероятно е лоша идея да избирате такива имена нарочно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode символи<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всъщност има много повече букви и цифри.<\/span> <span class=\"sg\" data-s=\"1\">Unicode има свойства за всеки символ.<\/span> <span class=\"sg\" data-s=\"2\">Те казват дали символът е буква или десетична цифра.<\/span> <span class=\"sg\" data-s=\"3\">Raku използва тези свойства.<\/span> <span class=\"sg\" data-s=\"4\">Например, тези променливи са правилни в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # където ۲ е цифра<\/code><\/pre>"]]},"eo":{"t":"Nomoj de la variabloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni daŭrigas, ni rigardu interesan temon.<\/span> <span class=\"sg\" data-s=\"1\">Kiajn nomojn povas havi variabloj?<\/span> <span class=\"sg\" data-s=\"2\">Ĝis nun, ni uzis simplajn nomojn, kiel <code>$name<\/code> aŭ <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ili havas nur malgrandajn literojn de la angla alfabeto.<\/span> <span class=\"sg\" data-s=\"4\">Sed estas pli da eblecoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Grandaj kaj malgrandaj literoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomoj de variabloj ankaŭ nomiĝas <em>identigiloj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">En identigiloj, grandaj kaj malgrandaj literoj estas malsamaj.<\/span> <span class=\"sg\" data-s=\"2\">Do ĉiu nomo sube signifas malsaman skalan ujon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi decidas, kiel nomi viajn variablojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed jen ideo.<\/span> <span class=\"sg\" data-s=\"2\">Tenu nomojn el nur grandaj literoj por konstantoj.<\/span> <span class=\"sg\" data-s=\"3\">Konstantoj estas valoroj, kiuj ne ŝanĝiĝas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj signoj<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kelkaj aliaj ASCII-signoj ankaŭ eblas.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ciferojn kaj la substrekon <code>_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas uzi la strekon <code>-<\/code> kaj la unuopan citilon <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tie, la unuopa citilo signifas apostrofon.<\/span> <span class=\"sg\" data-s=\"4\">Identigilo devas komenciĝi per litero aŭ substreko.<\/span> <span class=\"sg\" data-s=\"5\">Post <code>-<\/code> aŭ <code>'<\/code>, devas esti litero.<\/span> <span class=\"sg\" data-s=\"6\">Jen kelkaj pliaj ĝustaj identigiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Denove, vi elektas la nomojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed kelkaj nomoj aspektas kiel sekreta kodo.<\/span> <span class=\"sg\" data-s=\"2\">Verŝajne estas malbona ideo intence elekti tiajn nomojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj signoj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Fakte, ekzistas multe pli da literoj kaj ciferoj.<\/span> <span class=\"sg\" data-s=\"1\">Unikodo havas ecojn por ĉiu signo.<\/span> <span class=\"sg\" data-s=\"2\">Ili diras, ĉu la signo estas litero aŭ decimala cifero.<\/span> <span class=\"sg\" data-s=\"3\">Raku uzas tiujn ecojn.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, ĉi tiuj variabloj estas ĝustaj en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kie ۲ estas cifero<\/code><\/pre>"]]},"la":{"t":"Nomina variabilium","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Antequam pergimus, rem iucundam spectemus.<\/span> <span class=\"sg\" data-s=\"1\">Quae nomina variabiles habere possunt?<\/span> <span class=\"sg\" data-s=\"2\">Adhuc nomina simplicia adhibuimus, ut <code>$name<\/code> vel <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ea solum litteras minusculas alphabeti Anglici habent.<\/span> <span class=\"sg\" data-s=\"4\">Sed plures optiones sunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Litterae maiusculae et minusculae<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomina variabilium etiam <em>identificatores<\/em> vocantur.<\/span> <span class=\"sg\" data-s=\"1\">In identificatoribus litterae maiusculae et minusculae differunt.<\/span> <span class=\"sg\" data-s=\"2\">Itaque omne nomen infra aliud continens scalare significat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tu nomina variabilium tuarum eligis.<\/span> <span class=\"sg\" data-s=\"1\">Sed ecce consilium.<\/span> <span class=\"sg\" data-s=\"2\">Nomina tota maiuscula pro constantibus serva.<\/span> <span class=\"sg\" data-s=\"3\">Constantes sunt valores qui numquam mutantur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliae litterae<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Etiam alii characteres ASCII possibiles sunt.<\/span> <span class=\"sg\" data-s=\"1\">Digitos et underscore <code>_<\/code> adhibere potes.<\/span> <span class=\"sg\" data-s=\"2\">Etiam hyphen <code>-<\/code> et apicem singulum <code>'<\/code> adhibere potes.<\/span> <span class=\"sg\" data-s=\"3\">Hic apex singulus apostrophum significat.<\/span> <span class=\"sg\" data-s=\"4\">Identificator a littera vel ab underscore incipere debet.<\/span> <span class=\"sg\" data-s=\"5\">Post <code>-<\/code> vel <code>'<\/code> littera esse debet.<\/span> <span class=\"sg\" data-s=\"6\">Ecce alii aliquot identificatores recti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iterum, tu nomina eligis.<\/span> <span class=\"sg\" data-s=\"1\">Sed quaedam nomina sicut codex secretus videntur.<\/span> <span class=\"sg\" data-s=\"2\">Talia nomina consulto eligere fortasse malum consilium est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Characteres Unicode<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Re vera multo plures litterae et digiti sunt.<\/span> <span class=\"sg\" data-s=\"1\">Unicode proprietates pro omni charactere habet.<\/span> <span class=\"sg\" data-s=\"2\">Eae dicunt utrum character littera an digitus decimalis sit.<\/span> <span class=\"sg\" data-s=\"3\">Raku has proprietates adhibet.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, hae variabiles in Raku rectae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # ubi ۲ est digitus<\/code><\/pre>"]]}}}</script>
