<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/declaration-with-initialization/quiz2","n":40,"k":"quiz","pv":"essentials/scalar-variables/declaration-with-initialization/quiz1","nx":"essentials/scalar-variables/defined-or-operator","tr":["essentials","essentials/scalar-variables","essentials/scalar-variables/declaration-with-initialization"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz 2: Declaration and initialization or declaration with initialization","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Here are some short programs, each on one line.<\/span> <span class=\"sg\" data-s=\"1\">In some of them, one statement does two things.<\/span> <span class=\"sg\" data-s=\"2\">It declares a variable and gives it a value.<\/span> <span class=\"sg\" data-s=\"3\">Mark these programs.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Here, the variable is first created and then a value is assigned to it.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">You can use the variable to initialize another variable.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz 2: Deklaration und Initialisierung oder Deklaration mit Initialisierung","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier sind einige kurze Programme, jedes in einer Zeile.<\/span> <span class=\"sg\" data-s=\"1\">In einigen davon macht eine Anweisung zwei Dinge.<\/span> <span class=\"sg\" data-s=\"2\">Sie deklariert eine Variable und gibt ihr einen Wert.<\/span> <span class=\"sg\" data-s=\"3\">Markiere diese Programme.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Hier wird die Variable zuers <\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Puedes usar la variable para inicializar otra variable.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz 2: Dichiarazione e inizializzazione o dichiarazione con inizializzazione","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni programmi brevi, ognuno su una riga.<\/span> <span class=\"sg\" data-s=\"1\">In alcuni, un'istruzione fa due cose.<\/span> <span class=\"sg\" data-s=\"2\">Dichiara una variabile e le dà un valore.<\/span> <span class=\"sg\" data-s=\"3\">Segna questi programmi.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Qui, la variabile viene prima creata e poi le viene assegnato un valore.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Puoi usare la variabile per inizializzare un'altra variabile.<\/span><\/span><\/li><\/ul>"]]},"lv":{"t":"Tests 2: Deklarācija un inicializācija vai deklarācija ar inicializāciju","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir dažas īsas programmas, katra vienā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Dažās no tām viens paziņojums dara divas lietas.<\/span> <span class=\"sg\" data-s=\"2\">Tas deklarē mainīgo un piešķir tam vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Atzīmējiet šīs programmas.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Šeit mainīgais vispirms tiek izveidots un pēc tam tam tiek piešķirta vērtība.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Jūs varat izmantot mainīgo, lai inicializētu citu mainīgo.<\/span><\/span><\/li><\/ul>"]]},"ru":{"t":"Тест 2: Объявление и инициализация или объявление с инициализацией","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот несколько коротких программ, каждая в одну строку.<\/span> <span class=\"sg\" data-s=\"1\">В некоторых из них одна инструкция делает две вещи.<\/span> <span class=\"sg\" data-s=\"2\">Она объявляет переменную и даёт ей значение.<\/span> <span class=\"sg\" data-s=\"3\">Отметьте эти программы.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Здесь переменная сначала создается, а уже потом ей присваивается значение.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Вы можете использовать другую переменную для инициализации.<\/span><\/span><\/li><\/ul>"]]},"uk":{"t":"Тест 2: Оголошення та ініціалізація або оголошення з ініціалізацією","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось кілька коротких програм, кожна в одному рядку.<\/span> <span class=\"sg\" data-s=\"1\">У деяких із них один вираз робить дві речі.<\/span> <span class=\"sg\" data-s=\"2\">Він оголошує змінну і дає їй значення.<\/span> <span class=\"sg\" data-s=\"3\">Позначте ці програми.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Тут змінна спочатку створюється, а потім їй присвоюється значення.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Ви можете використовувати змінну для ініціалізації іншої змінної.<\/span><\/span><\/li><\/ul>"]]},"bg":{"t":"Тест 2: Деклариране и инициализация или деклариране с инициализация","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето няколко кратки програми, всяка на един ред.<\/span> <span class=\"sg\" data-s=\"1\">В някои от тях едно изречение прави две неща.<\/span> <span class=\"sg\" data-s=\"2\">То декларира променлива и ѝ дава стойност.<\/span> <span class=\"sg\" data-s=\"3\">Отбележете тези програми.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Тук променливата първо се създава и след това ѝ се присвоява стойност.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Можете да използвате променливата за инициализация на друга променлива.<\/span><\/span><\/li><\/ul>"]]},"eo":{"t":"Kvizo 2: Deklarado kaj inicialigo aŭ deklarado kun inicialigo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj mallongaj programoj, ĉiu en unu linio.<\/span> <span class=\"sg\" data-s=\"1\">En kelkaj el ili, unu deklaro faras du aferojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi deklaras variablon kaj donas al ĝi valoron.<\/span> <span class=\"sg\" data-s=\"3\">Marku tiujn programojn.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Ĉi tie, la variablo estas unue kreita kaj poste valoro estas asignita al ĝi.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Vi povas uzi la variablon por inicialigi alian variablon.<\/span><\/span><\/li><\/ul>"]]},"la":{"t":"Quiz 2: Declaratio et initializatione vel declaratio cum initializatione","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic sunt aliquot programmata brevia, singula in una linea.<\/span> <span class=\"sg\" data-s=\"1\">In quibusdam una enuntiatio duas res facit.<\/span> <span class=\"sg\" data-s=\"2\">Variabilem declarat et ei valorem dat.<\/span> <span class=\"sg\" data-s=\"3\">Nota haec programmata.<\/span><\/p>"],["quiz",3,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $a; $a = 42;<span class=\"quiz-note\">Hic, variabilis primum creatur et deinde valor ei assignatur.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">my $a = 42;<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"2\">my $a = 42; my $b = $a;<span class=\"quiz-note\">Potes variabile uti ad aliud variabile initium.<\/span><\/span><\/li><\/ul>"]]}}}</script>
