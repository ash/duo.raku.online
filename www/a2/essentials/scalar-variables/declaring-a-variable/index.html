 <span class=\"sg\" data-s=\"1\">Raku tiene palabras especiales para esto.<\/span> <span class=\"sg\" data-s=\"2\">Se llaman <em>declaradores<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Para declarar una variable, usa <code>my<\/code>, así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ahora tienes una nueva variable.<\/span> <span class=\"sg\" data-s=\"1\">Todavía no tiene valor.<\/span> <span class=\"sg\" data-s=\"2\">Pero el compilador ya conoce su nombre.<\/span> <span class=\"sg\" data-s=\"3\">Más tarde, el programa usa el mismo nombre otra vez.<\/span> <span class=\"sg\" data-s=\"4\">Entonces el compilador reconoce esta variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un solo <code>my<\/code> puede declarar dos o más variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"it":{"t":"Dichiarazione di una variabile","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Devi annunciare una variabile prima di usarla.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha parole speciali per questo.<\/span> <span class=\"sg\" data-s=\"2\">Si chiamano <em>dichiaratori<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Per dichiarare una variabile, usa <code>my<\/code>, così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ora hai una nuova variabile.<\/span> <span class=\"sg\" data-s=\"1\">Non ha ancora un valore.<\/span> <span class=\"sg\" data-s=\"2\">Ma il compilatore conosce già il suo nome.<\/span> <span class=\"sg\" data-s=\"3\">Più avanti, il programma usa di nuovo lo stesso nome.<\/span> <span class=\"sg\" data-s=\"4\">Allora il compilatore sa quale variabile è.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di una variabile<\/span><\/h3>"],["p",1,"<p><span c айте <code>my<\/code>, ето така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Сега имате нова променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тя още няма стойност.<\/span> <span class=\"sg\" data-s=\"2\">Но компилаторът вече знае нейното име.<\/span> <span class=\"sg\" data-s=\"3\">По-късно програмата използва същото име отново.<\/span> <span class=\"sg\" data-s=\"4\">Тогава компилаторът знае коя е тази променлива.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една променлива<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Един <code>my<\/code> може да декларира две или повече променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"eo":{"t":"Deklarado de variablo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi devas anonci variablon antaŭ ol vi uzas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas specialajn vortojn por tio.<\/span> <span class=\"sg\" data-s=\"2\">Ili nomiĝas <em>deklariloj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Por deklari variablon, uzu <code>my<\/code>, jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nun vi havas novan variablon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankoraŭ ne havas valoron.<\/span> <span class=\"sg\" data-s=\"2\">Sed la kompililo jam konas ĝian nomon.<\/span> <span class=\"sg\" data-s=\"3\">Poste, la programo uzas la saman nomon denove.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la kompililo scias, kiu variablo ĝi estas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu variablo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unu <code>my<\/code> povas deklari du aŭ pli da variabloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"la":{"t":"Declarando variabilem","b":[["p",4,"<p><span
