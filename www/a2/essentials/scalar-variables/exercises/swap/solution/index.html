nación no hace nada útil.<\/span> <span class=\"sg\" data-s=\"2\">Puedes verlo fácilmente.<\/span> <span class=\"sg\" data-s=\"3\">Cambia los valores del lado derecho, por ejemplo, así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ahora el programa imprime todavía más advertencias.<\/span> <span class=\"sg\" data-s=\"1\">Pero también puedes ver otra cosa.<\/span> <span class=\"sg\" data-s=\"2\">Solo <code>$b<\/code> recibe un nuevo valor:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"it":{"t":"Solution: Scambiare valori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma usa la sintassi di Raku della sezione sulle <a href=\"https://course.raku.org/it/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">variabili scalari<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esegui il programma.<\/span> <span class=\"sg\" data-s=\"1\">Controlla che stampi i valori nell'altro ordine.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il programma ha tre passi.<\/span> <span class=\"sg\" data-s=\"1\">Per prima cosa, crea le variabili e dà loro dei valori.<\/span> <span class=\"sg\" data-s=\"2\">Poi scambia i valori.<\/span> <span class=\"sg\" data-s=\"3\">Alla fine, li stampa.<\/span> <span class=\"sg\" data-s=\"4\">Ogni passo usa le due variabili in un'istruzione.<\/span> <span class=\"sg\" data-s=\"5\">Guarda la parte più interessante.<\/span> <span class=\"sg\" data-s=\"6\">Qui le variabili si scambiano i valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ti servono le parentesi sul lato sinistro.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche aggiungerle sul lato destro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa succede senza le parentesi?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Allora ricevi un avviso.<\/span> <span class=\"sg\" data-s=\"1\">Dice che <code>$a<\/code> sul lato destro non è usato:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In realtà, questa riga è uguale a <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa assegnazione non fa niente di utile.<\/span> <span class=\"sg\" data-s=\"2\">Puoi vederlo facilmente.<\/span> <span class=\"sg\" data-s=\"3\">Cambia i valori sul lato destro, per esempio così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora il programma stampa ancora più avvisi.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi vedere anche un'altra cosa.<\/span> <span class=\"sg\" data-s=\"2\">Solo <code>$b<\/code> riceve un nuovo valore:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"lv":{"t":"Risinājums: Vērtību apmaiņa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izmanto Raku sintaksi no sadaļas par <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu.<\/span> <span class=\"sg\" data-s=\"1\">Pārbaudiet, vai tā izdrukā vērtības otrādā secībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Programmā ir trīs soļi.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms tā izveido mainīgos un piešķir tiem vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Tad tā samaina vērtības vietām.<\/span> <span class=\"sg\" data-s=\"3\">Beigās programma tās izdrukā.<\/span> <span class=\"sg\" data-s=\"4\">Katrs solis izmanto abus mainīgos vienā paziņojumā.<\/span> <span class=\"sg\" data-s=\"5\">Apskatiet pašu interesantāko daļu.<\/span> <span class=\"sg\" data-s=\"6\">Šeit mainīgie samaina savas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kreisajā pusē jums vajag iekavas.<\/span> <span class=\"sg\" data-s=\"1\">Labajā pusē jūs tās varat arī pievienot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kas notiek bez iekavām?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tad jūs saņemat brīdinājumu.<\/span> <span class=\"sg\" data-s=\"1\">Tas saka, ka <code>$a<\/code> labajā pusē nav izmantots:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda, 2. rinda)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Patiesībā šī rinda ir tas pats, kas <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī piešķiršana nedara neko noderīgu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to varat viegli redzēt.<\/span> <span class=\"sg\" data-s=\"3\">Nomainiet vērtības labajā pusē, piemēram, šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad programma izdrukā vēl vairāk brīdinājumu.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varat redzēt arī ko citu.<\/span> <span class=\"sg\" data-s=\"2\">Tikai <code>$b<\/code> saņem jaunu vērtību:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga \"*\" izmantošana izteiksmē \"3 * $a\" sink kontekstā (2. rinda)\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda)\n10, 40<\/code><\/pre>"]]},"ru":{"t":"Решение: Замена значений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа использует синтаксис Raku из раздела о <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных переменных<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустите программу.<\/span> <span class=\"sg\" data-s=\"1\">Проверьте, что она печатает значения в другом порядке.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В программе три шага.<\/span> <span class=\"sg\" data-s=\"1\">Сначала она создаёт переменные и даёт им значения.<\/span> <span class=\"sg\" data-s=\"2\">Потом она меняет значения местами.<\/span> <span class=\"sg\" data-s=\"3\">В конце она их печатает.<\/span> <span class=\"sg\" data-s=\"4\">Каждый шаг использует обе переменные в одной инструкции.<\/span> <span class=\"sg\" data-s=\"5\">Посмотрите на самую интересную часть.<\/span> <span class=\"sg\" data-s=\"6\">Здесь переменные меняются значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Слева нужны скобки.<\/span> <span class=\"sg\" data-s=\"1\">Справа их тоже можно добавить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что будет без скобок?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тогда вы получите предупреждение.<\/span> <span class=\"sg\" data-s=\"1\">Оно говорит, что <code>$a<\/code> справа не используется:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">На самом деле эта строка — то же самое, что <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Такое присваивание не делает ничего полезного.<\/span> <span class=\"sg\" data-s=\"2\">Это легко увидеть.<\/span> <span class=\"sg\" data-s=\"3\">Измените значения справа, например, вот так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь программа печатает ещё больше предупреждений.<\/span> <span class=\"sg\" data-s=\"1\">Но вы видите и кое-что другое.<\/span> <span class=\"sg\" data-s=\"2\">Только <code>$b<\/code> получает новое значение:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"uk":{"t":"Розв'язання: Обмін значеннями","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма використовує синтаксис Raku з розділу про <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярні змінні<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму.<\/span> <span class=\"sg\" data-s=\"1\">Перевірте, що вона виводить значення в іншому порядку.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Програма має три кроки.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку вона створює змінні і дає їм значення.<\/span> <span class=\"sg\" data-s=\"2\">Потім вона міняє значення місцями.<\/span> <span class=\"sg\" data-s=\"3\">Наприкінці вона їх виводить.<\/span> <span class=\"sg\" data-s=\"4\">Кожен крок використовує обидві змінні в одному виразі.<\/span> <span class=\"sg\" data-s=\"5\">Подивіться на найцікавішу частину.<\/span> <span class=\"sg\" data-s=\"6\">Тут змінні міняються значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам потрібні дужки з лівого боку.<\/span> <span class=\"sg\" data-s=\"1\">Ви також можете додати їх з правого боку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що буде без дужок?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тоді ви отримаєте попередження.<\/span> <span class=\"sg\" data-s=\"1\">Воно каже, що <code>$a<\/code> праворуч не використовується:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Насправді цей рядок — те саме, що <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це присвоєння не робить нічого корисного.<\/span> <span class=\"sg\" data-s=\"2\">Ви легко можете це побачити.<\/span> <span class=\"sg\" data-s=\"3\">Змініть значення праворуч, наприклад, ось так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер програма виводить ще більше попереджень.<\/span> <span class=\"sg\" data-s=\"1\">Але ви також бачите дещо інше.<\/span> <span class=\"sg\" data-s=\"2\">Нове значення отримує лише <code>$b<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"bg":{"t":"Solution: Размяна на стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма използва синтаксиса на Raku от секцията за <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларни променливи<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата.<\/span> <span class=\"sg\" data-s=\"1\">Проверете, че тя отпечатва стойностите в обратен ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Програмата има три стъпки.<\/span> <span class=\"sg\" data-s=\"1\">Първо тя създава променливите и им дава стойности.<\/span> <span class=\"sg\" data-s=\"2\">После разменя стойностите.<\/span> <span class=\"sg\" data-s=\"3\">Накрая ги отпечатва.<\/span> <span class=\"sg\" data-s=\"4\">Всяка стъпка използва двете променливи в едно изречение.<\/span> <span class=\"sg\" data-s=\"5\">Вижте най-интересната част.<\/span> <span class=\"sg\" data-s=\"6\">Тук променливите разменят своите стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трябват ви скоби от лявата страна.<\/span> <span class=\"sg\" data-s=\"1\">Можете да ги добавите и от дясната страна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво става без скобите?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тогава получавате предупреждение.<\/span> <span class=\"sg\" data-s=\"1\">То казва, че <code>$a<\/code> от дясната страна не се използва:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всъщност този ред е същото като <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това присвояване не прави нищо полезно.<\/span> <span class=\"sg\" data-s=\"2\">Можете лесно да го видите.<\/span> <span class=\"sg\" data-s=\"3\">Променете стойностите от дясната страна, например, ето така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега програмата отпечатва още повече предупреждения.<\/span> <span class=\"sg\" data-s=\"1\">Но можете да видите и нещо друго.<\/span> <span class=\"sg\" data-s=\"2\">Само <code>$b<\/code> получава нова стойност:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"eo":{"t":"Solvo: Interŝanĝi valorojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo uzas Raku-sintakson el la sekcio pri <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj variabloj<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontokodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon.<\/span> <span class=\"sg\" data-s=\"1\">Kontrolu, ke ĝi presas la valorojn en la alia ordo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La programo havas tri paŝojn.<\/span> <span class=\"sg\" data-s=\"1\">Unue, ĝi kreas la variablojn kaj donas al ili valorojn.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi interŝanĝas la valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Fine, ĝi presas ilin.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu paŝo uzas ambaŭ variablojn en unu deklaro.<\/span> <span class=\"sg\" data-s=\"5\">Rigardu la plej interesan parton.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tie, la variabloj interŝanĝas siajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi bezonas krampojn ĉe la maldekstra flanko.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas aldoni ilin ĉe la dekstra flanko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas sen la krampoj?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tiam vi ricevas averton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi diras, ke la programo ne uzas <code>$a<\/code> ĉe la dekstra flanko:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de $a en sink-kunteksto (linioj 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fakte, ĉi tiu linio estas la sama kiel <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu asigno faras nenion utilan.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas facile vidi tion.<\/span> <span class=\"sg\" data-s=\"3\">Ŝanĝu la valorojn ĉe la dekstra flanko, ekzemple, jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun la programo presas eĉ pli da avertoj.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas vidi ion alian.<\/span> <span class=\"sg\" data-s=\"2\">Nur <code>$b<\/code> ricevas novan valoron:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de \"*\" en esprimo \"3 * $a\" en sink-kunteksto (linio 2)\nSenzaŭza uzo de $a en sink-kunteksto (linio 2)\n10, 40<\/code><\/pre>"]]},"la":{"t":"Solutio: Commutatio valorum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma syntaxi Raku ex sectione de <a href=\"https://course.raku.org/la/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">variabilibus scalaribus<\/a> utitur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma currite.<\/span> <span class=\"sg\" data-s=\"1\">Videte: valores ordine contrario apparent.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Programma tres gradus habet.<\/span> <span class=\"sg\" data-s=\"1\">Primum variabiles creat et eis valores dat.<\/span> <span class=\"sg\" data-s=\"2\">Deinde valores permutat.<\/span> <span class=\"sg\" data-s=\"3\">Denique eos imprimit.<\/span> <span class=\"sg\" data-s=\"4\">Omnis gradus ambas variabiles in una enuntiatione adhibet.<\/span> <span class=\"sg\" data-s=\"5\">Specta partem maxime iucundam.<\/span> <span class=\"sg\" data-s=\"6\">Hic variabiles valores suos permutant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In latere sinistro parentheses necessariae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Eas etiam in latere dextro addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid fit sine parenthesibus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tum monitionem accipis.<\/span> <span class=\"sg\" data-s=\"1\">Ea dicit <code>$a<\/code> in latere dextro non adhiberi:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus $a in contextu sink (lineae 2, 2)\n10, 20<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Re vera haec linea eadem est atque <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Haec assignatio nihil utile facit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc facile videre potes.<\/span> <span class=\"sg\" data-s=\"3\">Muta valores in latere dextro, exempli gratia, sic:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc programma etiam plures monitiones imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Sed aliud quoque videre potes.<\/span> <span class=\"sg\" data-s=\"2\">Solum <code>$b<\/code> novum valorem accipit:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus \"*\" in expressione \"3 * $a\" in contextu sink (linea 2)\nInutilis usus $a in contextu sink (linea 2)\n10, 40<\/code><\/pre>"]]}}}</script>
