/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ця програма нічого не виводить.<\/span> <span class=\"sg\" data-s=\"1\">Rakudo компілює і запускає її.<\/span> <span class=\"sg\" data-s=\"2\">Ви не маєте побачити жодних помилок:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось проблеми з іменами в завданні:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">В імені не може бути пробілів: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Змінній потрібен сигіл: <code>Name<\/code>. У Raku є і змінні без сигіла. Але навіть для них не можна написати <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Ім'я не може починатися з апострофа: <code>$'Middle'Name<\/code>. Насправді тут це одинарна лапка.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Ім'я також не може починатися з цифри: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">В імені не може бути двох дефісів поруч: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Поправете идентификаторите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да поправите идентификаторите по повече от един начин.<\/span> <span class=\"sg\" data-s=\"1\">Ето някои начини:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Втора улица, 12';\nmy $from-to = 'Лондон до Париж';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всички тези идентификатори са правилни.<\/span> <span class=\"sg\" data-s=\"1\">Но имената с апострофи не са добра идея.<\/span> <span class=\"sg\" data-s=\"2\">Избягвайте ги, ако нямате (<code>$don't<\/code>) силна причина.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази програма не отпечатва нищо.<\/span> <span class=\"sg\" data-s=\"1\">Rakudo я компилира и изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Не трябва да видите грешки:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето проблемите с имената в задачата:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Името не може да има интервали: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Променливата има нужда от сигил: <code>Name<\/code>. В Raku има и променливи без сигил. Но дори за тях не можете да пишете <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Името не може да започва с апостроф: <code>$'Middle'Name<\/code>. Всъщност тук това е единична кавичка.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Името не може да започва и с цифра: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Името не може да има две тирета едно до друго: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Korekti la identigilojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas korekti la identigilojn en pli ol unu maniero.<\/span> <span class=\"sg\" data-s=\"1\">Jen kelkaj manieroj:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj ĉi tiuj identigiloj estas ĝustaj.<\/span> <span class=\"sg\" data-s=\"1\">Sed nomoj kun apostrofoj ne estas bona ideo.<\/span> <span class=\"sg\" data-s=\"2\">Evitu ilin, se vi <code>$don't<\/code> havas fortan kialon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas nenion.<\/span> <span class=\"sg\" data-s=\"1\">Rakudo kompilas kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne devus vidi erarojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la problemoj kun la nomoj en la tasko:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Nomo ne povas havi spacojn: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variablo bezonas sigilon: <code>Name<\/code>. Raku ja havas variablojn sen sigilo. Sed eĉ por ili, vi ne povas skribi <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Nomo ne povas komenciĝi per apostrofo: <code>$'Middle'Name<\/code>. Fakte, ĉi tie ĝi estas unuopa citilo.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nomo ankaŭ ne povas komenciĝi per cifero: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Nomo ne povas havi du streketojn unu apud la alia: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Corrigere identifiers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Identificatores pluribus modis corrigere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ecce aliqui modi:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omnes hi identificatores recti sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed nomina cum apostrophis non sunt bonum consilium.<\/span> <span class=\"sg\" data-s=\"2\">Ea vita, si <code>$non<\/code> habes causam gravem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma nihil imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Rakudo id compilat et exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Errores videre non debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce problemata nominum in munere:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Nomen spatia habere non potest: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variabilis sigillum requirit: <code>Name<\/code>. Raku quidem variabiles sine sigillo habet. Sed etiam pro eis <code>my Name<\/code> scribere non potes.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Nomen ab apostropho incipere non potest: <code>$'Middle'Name<\/code>. Re vera hic est apex singulus.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nomen etiam a digito incipere non
