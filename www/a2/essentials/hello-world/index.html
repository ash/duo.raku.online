 class=\"sg\" data-s=\"0\">Чудово!<\/span> <span class=\"sg\" data-s=\"1\">Тепер ми знаємо основні речі.<\/span> <span class=\"sg\" data-s=\"2\">Ми можемо говорити з Raku і бачити відповідь.<\/span> <span class=\"sg\" data-s=\"3\">Тож давайте перейдемо до першої справжньої програми: «Привіт, Світ!».<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скоро ми вивчимо основи функцій.<\/span> <span class=\"sg\" data-s=\"1\">Але спочатку — кілька інших способів написати цю програму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">По-перше, ви можете взяти аргумент функції в дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Hello, World!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По-друге, ви можете використати інші функції: <code>put<\/code> і <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">І знову, ви можете писати їх з дужками або без них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Hello, World!';\n\nprint(\"Hello, World!\\n\");<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">З <code>print<\/code> ви маєте самі додати символ нового рядка.<\/span> <span class=\"sg\" data-s=\"1\">Цей символ починає новий рядок.<\/span> <span class=\"sg\" data-s=\"2\">Поставте його в кінці повідомлення.<\/span> <span class=\"sg\" data-s=\"3\">Але не хвилюйтеся.<\/span> <span class=\"sg\" data-s=\"4\">Ми поговоримо про всі ці деталі пізніше.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перед тим як іти далі, ось ще один цікавий спосіб.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете викликати функцію як метод.<\/span> <span class=\"sg\" data-s=\"2\">Викличте її прямо на рядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Hello, World!'.say;<\/code><\/pre>"]]},"bg":{"t":"Здравей, свят!","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Чудесно!<\/span> <span class=\"sg\" data-s=\"1\">Сега знаем основните неща.<\/span> <span class=\"sg\" data-s=\"2\">Можем да говорим с Raku и да виждаме отговора му.<\/span> <span class=\"sg\" data-s=\"3\">Така че да преминем към първата истинска програма: „Hello, World!“.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скоро ще научим основите на функциите.<\/span> <span class=\"sg\" data-s=\"1\">Но първо, ето още няколко начина да напишете тази програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Първо, можете да сложите аргумента на функцията в скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Hello, World!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второ, можете да използвате други функции: <code>put<\/code> и <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Пак можете да ги пишете със или без скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Hello, World!';\n\nprint(\"Hello, World!\\n\");<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">С <code>print<\/code> трябва сами да добавите символа за нов ред.<\/span> <span class=\"sg\" data-s=\"1\">Този символ започва нов ред.<\/span> <span class=\"sg\" data-s=\"2\">Сложете го в края на съобщението.<\/span> <span class=\"sg\" data-s=\"3\">Но не се притеснявайте.<\/span> <span class=\"sg\" data-s=\"4\">Ще разгледаме всички тези детайли по-късно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Преди да продължим, ето още един интересен начин.<\/span> <span class=\"sg\" data-s=\"1\">Можете да извикате функцията като метод.<\/span> <span class=\"sg\" data-s=\"2\">Извикайте я направо върху низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Hello, World!'.say;<\/code><\/pre>"]]},"eo":{"t":"Saluton, Mondo!","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bonege!<\/span> <span class=\"sg\" data-s=\"1\">Nun ni scias la bazajn aferojn.<\/span> <span class=\"sg\" data-s=\"2\">Ni povas paroli al Raku kaj vidi ĝian respondon.<\/span> <span class=\"sg\" data-s=\"3\">Do ni iru al la unua vera programo: ‘Saluton, Mondo!’.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Saluton, Mondo!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Baldaŭ ni lernas la bazojn de funkcioj.<\/span> <span class=\"sg\" data-s=\"1\">Sed unue, jen kelkaj aliaj manieroj skribi ĉi tiun programon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unue, vi povas meti la argumenton de la funkcio en krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Saluton, Mondo!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Due, vi povas uzi aliajn funkciojn: <code>put<\/code> kaj <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Denove, vi povas skribi ilin kun aŭ sen krampoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Saluton, Mondo!';\n\nprint(\"Saluton, Mondo!\\n\");<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kun <code>print<\/code>, vi devas mem aldoni la novlinian karakteron.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu karaktero komencas novan linion.<\/span> <span class=\"sg\" data-s=\"2\">Metu ĝin ĉe la fino de la mesaĝo.<\/span> <span class=\"sg\" data-s=\"3\">Sed ne zorgu.<\/span> <span class=\"sg\" data-s=\"4\">Ni rigardas ĉiujn ĉi tiujn detalojn poste.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni daŭrigas, jen unu plia ekscita maniero.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas voki la funkcion kiel metodon.<\/span> <span class=\"sg\" data-s=\"2\">Voku ĝin rekte sur la ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Saluton, Mondo!'.say;<\/code><\/pre>"]]},"la":{"t":"Salve, Mundi!","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Optime!<\/span> <span class=\"sg\" data-s=\"1\">Nunc res fundamentales scimus.<\/span> <span class=\"sg\" data-s=\"2\">Cum Raku loqui et responsum eius videre possumus.<\/span> <span class=\"sg\" data-s=\"3\">Ergo ad primum verum programma eamus: ‘Salve, Mundi!’.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Salve, Mundi!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mox elementa functionum discimus.<\/span> <span class=\"sg\" data-s=\"1\">Sed primum vide alios modos ad hoc programma scribendum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Primum, argumentum functionis in parenthesibus ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Salve, Mundi!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secundum, aliis functionibus uti potes: <code>put<\/code> et <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Iterum, eas cum parenthesibus aut sine eis scribere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Salve, Mundi!';\n\nprint(\"Salve, Mundi!\\n\");<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum <code>print<\/code>, characterem novae lineae ipse addere debes.<\/span> <span class=\"sg\" data-s=\"1\">Hic character novam lineam incipit.<\/span> <span class=\"sg\" data-s=\"2\">Pone eum in fine nuntii.<\/span> <span class=\"sg\" data-s=\"3\">Sed noli curare.<\/span> <span class=\"sg\" data-s=\"4\">Omnia haec singula postea spectamus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Antequam pergimus, hic est alius modus mirabilis.<\/span> <span class=\"sg\" data-s=\"1\">Functionem ut methodum vocare potes.<\/span> <span class=\"sg\" data-s=\"2\">Voca eam directe in chorda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Salve, Mundi!'.say;<\/code><\/pre>"]]}}}</script>
