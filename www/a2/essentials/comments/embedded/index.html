 class=\"sg\" data-s=\"1\">Ze zien eruit als meerregelige opmerkingen.<\/span> <span class=\"sg\" data-s=\"2\">Er is maar één verschil.<\/span> <span class=\"sg\" data-s=\"3\">Je zet ze tussen andere delen van het programma.<\/span> <span class=\"sg\" data-s=\"4\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Gebruikersinvoer hier verwacht] prompt 'Wat is je naam? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een goede syntax-highlighter toont code in kleuren.<\/span> <span class=\"sg\" data-s=\"1\">Dat helpt veel om de opmerkingen te zien.<\/span><\/p>"]]},"es":{"t":"Comentarios incrustados","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Los comentarios embebidos también se llaman comentarios en línea.<\/span> <span class=\"sg\" data-s=\"1\">Se parecen a los comentarios de varias líneas.<\/span> <span class=\"sg\" data-s=\"2\">Solo hay una diferencia.<\/span> <span class=\"sg\" data-s=\"3\">Los pones entre otras partes del programa.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Se espera entrada del usuario aquí] prompt '¿Cuál es tu nombre? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un buen resaltador de sintaxis muestra el código en colores.<\/span> <span class=\"sg\" data-s=\"1\">Esto ayuda mucho a ver los comentarios.<\/span><\/p>"]]},"it":{"t":"Commenti incorporati","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">I commenti incorporati si chiamano anche commenti inline.<\/span> <span class=\"sg\" data-s=\"1\">Sono come i commenti multi-linea.<\/span> <span class=\"sg\" data-s=\"2\">C'è solo una differenza.<\/span> <span class=\"sg\" data-s=\"3\">Li metti tra altre parti del programma.<\/span> <span class=\"sg\" data-s=\"4\">Ad esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un buon evidenziatore di sintassi mostra il codice a colori.<\/span> <span class=\"sg\" data-s=\"1\">Questo aiuta molto a vedere i commenti.<\/span><\/p>"]]},"lv":{"t":"Iekļautie komentāri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Iekļautos komentārus sauc arī par inline komentāriem.<\/span> <span class=\"sg\" data-s=\"1\">Tie izskatās kā vairākrindu komentāri.<\/span> <span class=\"sg\" data-s=\"2\">Ir tikai viena atšķirība.<\/span> <span class=\"sg\" data-s=\"3\">Jūs tos liekat starp citām programmas daļām.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Šeit tiek gaidīta lietotāja ievade] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Labs sintakses izcēlējs rāda kodu krāsās.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļoti palīdz ieraudzīt komentārus.<\/span><\/p>"]]},"ru":{"t":"Вложенные комментарии","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вложенные комментарии также называют строчными комментариями.<\/span> <span class=\"sg\" data-s=\"1\">Они выглядят как многострочные комментарии.<\/span> <span class=\"sg\" data-s=\"2\">Есть только одна разница.<\/span> <span class=\"sg\" data-s=\"3\">Вы ставите их между другими частями программы.<\/span> <span class=\"sg\" data-s=\"4\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'What is your name? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хорошая подсветка синтаксиса показывает код разными цветами.<\/span> <span class=\"sg\" data-s=\"1\">Это очень помогает видеть комментарии.<\/span><\/p>"]]},"uk":{"t":"Вбудовані коментарі","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вбудовані коментарі ще називають рядковими коментарями.<\/span> <span class=\"sg\" data-s=\"1\">Вони схожі на багаторядкові коментарі.<\/span> <span class=\"sg\" data-s=\"2\">Є тільки одна різниця.<\/span> <span class=\"sg\" data-s=\"3\">Ви ставите їх між іншими частинами програми.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Тут очікується введення користувача] prompt 'Як вас звати? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хороший підсвічувач синтаксису показує код різними кольорами.<\/span> <span class=\"sg\" data-s=\"1\">Це дуже допомагає бачити коментарі.<\/span><\/p>"]]},"bg":{"t":"Вградени коментари","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Вградените коментари се казват още inline коментари.<\/span> <span class=\"sg\" data-s=\"1\">Те изглеждат като многострочните коментари.<\/span> <span class=\"sg\" data-s=\"2\">Има само една разлика.<\/span> <span class=\"sg\" data-s=\"3\">Поставяте ги между други части на програмата.<\/span> <span class=\"sg\" data-s=\"4\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Очаква се потребителски вход тук] prompt 'Как се казваш? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добрият синтактичен оцветител показва кода в цветове.<\/span> <span class=\"sg\" data-s=\"1\">Това много помага да виждате коментарите.<\/span><\/p>"]]},"eo":{"t":"Enmetitaj komentoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Enigitaj komentoj ankaŭ nomiĝas enliniaj komentoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili aspektas kiel plurliniaj komentoj.<\/span> <span class=\"sg\" data-s=\"2\">Estas nur unu diferenco.<\/span> <span class=\"sg\" data-s=\"3\">Vi metas ilin inter aliaj partoj de la programo.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[Uzanta enigo atendita ĉi tie] prompt 'Kio estas via nomo? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bona sintaksa reliefigilo montras kodon en koloroj.<\/span> <span class=\"sg\" data-s=\"1\">Tio multe helpas vidi la komentojn.<\/span><\/p>"]]},"la":{"t":"Inscripti commentarii","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Commentarios incorporatos etiam commentarios in linea vocamus.<\/span> <span class=\"sg\" data-s=\"1\">Similes sunt commentariis multi-lineae.<\/span> <span class=\"sg\" data-s=\"2\">Una sola differentia est.<\/span> <span class=\"sg\" data-s=\"3\">Eos inter alias partes programmatis ponis.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n$name = #`[User input expected here] prompt 'Quod est nomen tuum? ';\nsay $name;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bonus syntax highlighter codicem coloribus ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc multum adiuvat ad commentarios videndos.<\/span><\/p>"]]}}}</script>
