<script type="application/json" id="page-data">{"u":"essentials/comments","n":26,"k":"section","pv":"essentials/simple-input-output/prompt","nx":"essentials/comments/single-line","tr":["essentials"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Comments in Raku","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Comments are parts of a program for human readers.<\/span> <span class=\"sg\" data-s=\"1\">The compiler mostly skips comments.<\/span> <span class=\"sg\" data-s=\"2\">There are some rare cases.<\/span> <span class=\"sg\" data-s=\"3\">For example, a comment can be part of an error message.<\/span> <span class=\"sg\" data-s=\"4\">But we do not look at this now.<\/span><\/p>"]]},"de":{"t":"Kommentare","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kommentare sind Teile eines Programms für menschliche Leser.<\/span> <span class=\"sg\" data-s=\"1\">Der Compiler überspringt Kommentare meistens.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt einige seltene Fälle.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel kann ein Kommentar Teil einer Fehlermeldung sein.<\/span> <span class=\"sg\" data-s=\"4\">Aber das sehen wir uns jetzt nicht an.<\/span><\/p>"]]},"nl":{"t":"Opmerkingen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Opmerkingen zijn delen van een programma voor menselijke lezers.<\/span> <span class=\"sg\" data-s=\"1\">De compiler slaat opmerkingen meestal over.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn een paar zeldzame gevallen.<\/span> <span class=\"sg\" data-s=\"3\">Een opmerking kan bijvoorbeeld deel zijn van een foutmelding.<\/span> <span class=\"sg\" data-s=\"4\">Maar daar kijken we nu niet naar.<\/span><\/p>"]]},"es":{"t":"Comentarios","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Los comentarios son partes de un programa para lectores humanos.<\/span> <span class=\"sg\" data-s=\"1\">El compilador casi siempre ignora los comentarios.<\/span> <span class=\"sg\" data-s=\"2\">Hay algunos casos raros.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, un comentario puede ser parte de un mensaje de error.<\/span> <span class=\"sg\" data-s=\"4\">Pero ahora no vemos esto.<\/span><\/p>"]]},"it":{"t":"Commenti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">I commenti sono parti del programma per le persone che lo leggono.<\/span> <span class=\"sg\" data-s=\"1\">Il compilatore di solito salta i commenti.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono alcuni casi rari.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, un commento può far parte di un messaggio di errore.<\/span> <span class=\"sg\" data-s=\"4\">Ma ora non guardiamo questo caso.<\/span><\/p>"]]},"lv":{"t":"Komentāri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Komentāri ir programmas daļas, ko lasa cilvēki.<\/span> <span class=\"sg\" data-s=\"1\">Kompilators komentārus lielākoties izlaiž.<\/span> <span class=\"sg\" data-s=\"2\">Ir daži reti gadījumi.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, komentārs var būt daļa no kļūdas ziņojuma.<\/span> <span class=\"sg\" data-s=\"4\">Bet tagad mēs to neskatām.<\/span><\/p>"]]},"ru":{"t":"Комментарии","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Комментарии — это части программы для людей.<\/span> <span class=\"sg\" data-s=\"1\">Компилятор обычно пропускает комментарии.<\/span> <span class=\"sg\" data-s=\"2\">Есть несколько редких случаев.<\/span> <span class=\"sg\" data-s=\"3\">Например, комментарий может быть частью сообщения об ошибке.<\/span> <span class=\"sg\" data-s=\"4\">Но сейчас мы об этом не говорим.<\/span><\/p>"]]},"uk":{"t":"Коментарі","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Коментарі — це частини програми для людей, які її читають.<\/span> <span class=\"sg\" data-s=\"1\">Компілятор здебільшого пропускає коментарі.<\/span> <span class=\"sg\" data-s=\"2\">Є кілька рідкісних випадків.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, коментар може бути частиною повідомлення про помилку.<\/span> <span class=\"sg\" data-s=\"4\">Але з
