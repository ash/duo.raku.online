<script type="application/json" id="page-data">{"u":"oop/standard-streams","n":860,"k":"section","pv":"oop/mop/exercises/add-a-method/solution","nx":"oop/standard-streams/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Standard streams","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Every program has three <em>standard streams<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">A stream carries text into a program or out of it.<\/span> <span class=\"sg\" data-s=\"2\">The three streams connect the program with the outside world.<\/span> <span class=\"sg\" data-s=\"3\">They are standard output, standard error, and standard input.<\/span> <span class=\"sg\" data-s=\"4\">Raku gives you three special variables for them: <code>$*OUT<\/code>, <code>$*ERR<\/code>, and <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Standard output is for the normal output of a program.<\/span> <span class=\"sg\" data-s=\"1\">You already use it all the time.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> and <code>print<\/code> send their text to <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Error messages and other messages about problems go to standard error.<\/span> <span class=\"sg\" data-s=\"1\">This is a separate stream.<\/span> <span class=\"sg\" data-s=\"2\">So these messages do not mix with the program's real output.<\/span> <span class=\"sg\" data-s=\"3\">The <code>note<\/code> routine writes to standard error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This is useful.<\/span> <span class=\"sg\" data-s=\"1\">You can send each of the two streams to a different place.<\/span> <span class=\"sg\" data-s=\"2\">This is called redirecting.<\/span> <span class=\"sg\" data-s=\"3\">For example, you can save the output in a file.<\/span> <span class=\"sg\" data-s=\"4\">But you still see the error messages on the screen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can also write to the streams directly.<\/span> <span class=\"sg\" data-s=\"1\">Each of <code>$*OUT<\/code> and <code>$*ERR<\/code> is a <em>handle<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">With a handle, a program can write or read data.<\/span> <span class=\"sg\" data-s=\"3\">Each handle has its own <code>say<\/code> and <code>print<\/code> methods:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The third stream, <code>$*IN<\/code>, is standard input.<\/span> <span class=\"sg\" data-s=\"1\">It brings text into the program, for example from the keyboard.<\/span> <span class=\"sg\" data-s=\"2\">You already used it, but not directly.<\/span> <span class=\"sg\" data-s=\"3\">The <code>prompt<\/code> function reads a line from it.<\/span> <span class=\"sg\" data-s=\"4\">We come back to reading input on the page about <a href=\"/oop/file-handles/\">file handles<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">This is because <code>$*IN<\/code> is a handle, just like an open file.<\/span><\/p>"]]},"de":{"t":"Standardströme","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm hat drei <em>Standardströme<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ein Strom bringt Text in ein Programm hinein oder aus ihm heraus.<\/span> <span class=\"sg\" data-s=\"2\">Die drei Ströme verbinden das Programm mit der Außenwelt.<\/span> <span class=\"sg\" data-s=\"3\">Es sind die Standardausgabe, die Standardfehlerausgabe und die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"4\">Raku gibt Ihnen dafür drei besondere Variablen: <code>$*OUT<\/code>, <code>$*ERR<\/code> und <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Standardausgabe ist für die normale Ausgabe eines Programms.<\/span> <span class=\"sg\" data-s=\"1\">Sie benutzen sie schon die ganze Zeit.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> und <code>print<\/code> schicken ihren Text an <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fehlermeldungen und andere Meldungen über Probleme gehen an die Standardfehlerausgabe.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein eigener Strom.<\/span> <span class=\"sg\" data-s=\"2\">So mischen sich diese Meldungen nicht mit der echten Ausgabe des Programms.<\/span> <span class=\"sg\" data-s=\"3\">Die Routine <code>note<\/code> schreibt auf die Standardfehlerausgabe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das ist nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Sie können jeden der zwei Ströme an einen anderen Ort schicken.<\/span> <span class=\"sg\" data-s=\"2\">Das nennt man Umleiten.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel können Sie die Ausgabe in einer Datei speichern.<\/span> <span class=\"sg\" data-s=\"4\">Aber Sie sehen die Fehlermeldungen trotzdem auf dem Bildschirm.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie können auch direkt in die Ströme schreiben.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> und <code>$*ERR<\/code> sind jeweils ein <em>Handle<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mit einem Handle kann ein Programm Daten schreiben oder lesen.<\/span> <span class=\"sg\" data-s=\"3\">Jeder Handle hat seine eigenen Methoden <code>say<\/code> und <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Der dritte Strom, <code>$*IN<\/code>, ist die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"1\">Er bringt Text in das Programm, zum Beispiel von der Tastatur.<\/span> <span class=\"sg\" data-s=\"2\">Sie haben ihn schon benutzt, aber nicht direkt.<\/span> <span class=\"sg\" data-s=\"3\">Die Funktion <code>prompt<\/code> liest eine Zeile daraus.<\/span> <span class=\"sg\" data-s=\"4\">Zum Lesen von Eingaben kommen wir auf der Seite über <a href=\"https://course.raku.org/de/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">Dateihandles<\/a> zurück.<\/span> <span class=\"sg\" data-s=\"5\">Der Grund: <code>$*IN<\/code> ist ein Handle, genau wie eine offene Datei.<\/span><\/p>"]]},"nl":{"t":"Standaardstromen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Elk programma heeft drie <em>standaardstromen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Een stroom brengt tekst in een programma of eruit.<\/span> <span class=\"sg\" data-s=\"2\">De drie stromen verbinden het programma met de buitenwereld.<\/span> <span class=\"sg\" data-s=\"3\">Het zijn standaarduitvoer, standaardfout en standaardinvoer.<\/span> <span class=\"sg\" data-s=\"4\">Raku geeft je er drie bijzondere variabelen voor: <code>$*OUT<\/code>, <code>$*ERR<\/code> en <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Standaarduitvoer is voor de gewone uitvoer van een programma.<\/span> <span class=\"sg\" data-s=\"1\">Je gebruikt hem al de hele tijd.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> en <code>print<\/code> sturen hun tekst naar <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Foutmeldingen en andere meldingen over problemen gaan naar de standaardfout.<\/span> <span class=\"sg\" data-s=\"1\">Dat is een aparte stroom.<\/span> <span class=\"sg\" data-s=\"2\">Dus mengen deze meldingen niet met de echte uitvoer van het programma.<\/span> <span class=\"sg\" data-s=\"3\">De routine <code>note<\/code> schrijft naar de standaardfout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dat is handig.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt elk van de twee stromen naar een andere plek sturen.<\/span> <span class=\"sg\" data-s=\"2\">Dat heet omleiden.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt bijvoorbeeld de uitvoer in een bestand opslaan.<\/span> <span class=\"sg\" data-s=\"4\">Maar je ziet de foutmeldingen nog steeds op het scherm.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook rechtstreeks naar de stromen schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Zowel <code>$*OUT<\/code> als <code>$*ERR<\/code> is een <em>handle<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Met een handle kan een programma gegevens schrijven of lezen.<\/span> <span class=\"sg\" data-s=\"3\">Elke handle heeft eigen methoden <code>say<\/code> en <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De derde stroom, <code>$*IN<\/code>, is de standaardinvoer.<\/span> <span class=\"sg\" data-s=\"1\">Die brengt tekst in het programma, bijvoorbeeld van het toetsenbord.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt hem al gebruikt, maar niet direct.<\/span> <span class=\"sg\" data-s=\"3\">De functie <code>prompt<\/code> leest er een regel uit.<\/span> <span class=\"sg\" data-s=\"4\">Op de pagina over <a href=\"https://course.raku.org/nl/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">bestandshandles<\/a> komen we terug op het lezen van invoer.<\/span> <span class=\"sg\" data-s=\"5\">Dat komt doordat <code>$*IN<\/code> een handle is, net als een open bestand.<\/span><\/p>"]]},"es":{"t":"Flujos estándar","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Todo programa tiene tres <em>flujos estándar<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un flujo lleva texto hacia dentro o hacia fuera de un programa.<\/span> <span class=\"sg\" data-s=\"2\">Los tres flujos conectan el programa con el mundo exterior.<\/span> <span class=\"sg\" data-s=\"3\">Son la salida estándar, el error estándar y la entrada estándar.<\/span> <span class=\"sg\" data-s=\"4\">Raku te da tres variables especiales para ellos: <code>$*OUT<\/code>, <code>$*ERR<\/code> y <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La salida estándar es para la salida normal de un programa.<\/span> <span class=\"sg\" data-s=\"1\">Ya la usas todo el tiempo.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> y <code>print<\/code> mandan su texto a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los mensajes de error y otros mensajes sobre problemas van al error estándar.<\/span> <span class=\"sg\" data-s=\"1\">Es un flujo aparte.<\/span> <span class=\"sg\" data-s=\"2\">Así que estos mensajes no se mezclan con la salida real del programa.<\/span> <span class=\"sg\" data-s=\"3\">La rutina <code>note<\/code> escribe en el error estándar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esto es útil.<\/span> <span class=\"sg\" data-s=\"1\">Puedes mandar cada uno de los dos flujos a un sitio distinto.<\/span> <span class=\"sg\" data-s=\"2\">Esto se llama redirigir.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, puedes guardar la salida en un archivo.<\/span> <span class=\"sg\" data-s=\"4\">Pero sigues viendo los mensajes de error en la pantalla.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir directamente en los flujos.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> y <code>$*ERR<\/code> son <em>manejadores<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Con un manejador, un programa puede escribir o leer datos.<\/span> <span class=\"sg\" data-s=\"3\">Cada manejador tiene sus propios métodos <code>say<\/code> y <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El tercer flujo, <code>$*IN<\/code>, es la entrada estándar.<\/span> <span class=\"sg\" data-s=\"1\">Lleva texto al programa, por ejemplo desde el teclado.<\/span> <span class=\"sg\" data-s=\"2\">Ya la usaste, pero no directamente.<\/span> <span class=\"sg\" data-s=\"3\">La función <code>prompt<\/code> lee una línea de ella.<\/span> <span class=\"sg\" data-s=\"4\">Volvemos a la lectura de la entrada en la página sobre <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejadores de archivo<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Esto pasa porque <code>$*IN<\/code> es un manejador, igual que un archivo abierto.<\/span><\/p>"]]},"it":{"t":"Flussi standard","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni programma ha tre <em>flussi standard<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un flusso porta il testo dentro un programma o fuori dal programma.<\/span> <span class=\"sg\" data-s=\"2\">I tre flussi collegano il programma con il mondo esterno.<\/span> <span class=\"sg\" data-s=\"3\">Sono l'output standard, l'errore standard e l'input standard.<\/span> <span class=\"sg\" data-s=\"4\">Raku ti dà tre variabili speciali per questi flussi: <code>$*OUT<\/code>, <code>$*ERR<\/code> e <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'output standard serve per il normale output di un programma.<\/span> <span class=\"sg\" data-s=\"1\">Lo usi già continuamente.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> e <code>print<\/code> mandano il loro testo a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I messaggi di errore e gli altri messaggi sui problemi vanno all'errore standard.<\/span> <span class=\"sg\" data-s=\"1\">Questo è un flusso separato.<\/span> <span class=\"sg\" data-s=\"2\">Così questi messaggi non si mescolano con il vero output del programma.<\/span> <span class=\"sg\" data-s=\"3\">La routine <code>note<\/code> scrive sull'errore standard:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo è utile.<\/span> <span class=\"sg\" data-s=\"1\">Puoi mandare ognuno dei due flussi in un posto diverso.<\/span> <span class=\"sg\" data-s=\"2\">Questo si chiama redirigere.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, puoi salvare l'output in un file.<\/span> <span class=\"sg\" data-s=\"4\">Ma vedi ancora i messaggi di errore sullo schermo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi anche scrivere direttamente sui flussi.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> e <code>$*ERR<\/code> sono due <em>handle<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Con un handle un programma può scrivere o leggere dati.<\/span> <span class=\"sg\" data-s=\"3\">Ogni handle ha i suoi metodi <code>say<\/code> e <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il terzo flusso, <code>$*IN<\/code>, è l'input standard.<\/span> <span class=\"sg\" data-s=\"1\">Porta il testo dentro il programma, per esempio dalla tastiera.<\/span> <span class=\"sg\" data-s=\"2\">L'hai già usato, ma non direttamente.<\/span> <span class=\"sg\" data-s=\"3\">La funzione <code>prompt<\/code> legge una riga da questo flusso.<\/span> <span class=\"sg\" data-s=\"4\">Torniamo alla lettura dell'input nella pagina sugli <a href=\"https://course.raku.org/it/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">handle di file<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Questo perché <code>$*IN<\/code> è un handle, proprio come un file aperto.<\/span><\/p>"]]},"lv":{"t":"Standarta plūsmas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrai programmai ir trīs <em>standarta plūsmas<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Plūsma nes tekstu programmā vai ārā no tās.<\/span> <span class=\"sg\" data-s=\"2\">Šīs trīs plūsmas savieno programmu ar ārējo pasauli.<\/span> <span class=\"sg\" data-s=\"3\">Tās ir standarta izvade, standarta kļūdas un standarta ievade.<\/span> <span class=\"sg\" data-s=\"4\">Raku dod jums tām trīs speciālus mainīgos: <code>$*OUT<\/code>, <code>$*ERR<\/code> un <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Standarta izvade ir programmas parastajai izvadei.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to jau lietojat visu laiku.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> un <code>print<\/code> sūta savu tekstu uz <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kļūdu paziņojumi un citi paziņojumi par problēmām iet uz standarta kļūdu plūsmu.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir atsevišķa plūsma.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc šie paziņojumi nesajaucas ar programmas īsto izvadi.<\/span> <span class=\"sg\" data-s=\"3\">Rutīna <code>note<\/code> raksta standarta kļūdu plūsmā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas ir noderīgi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat sūtīt katru no abām plūsmām uz citu vietu.<\/span> <span class=\"sg\" data-s=\"2\">To sauc par novirzīšanu.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, jūs varat saglabāt izvadi failā.<\/span> <span class=\"sg\" data-s=\"4\">Bet kļūdu paziņojumus jūs joprojām redzat ekrānā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat rakstīt plūsmās arī tieši.<\/span> <span class=\"sg\" data-s=\"1\">Gan <code>$*OUT<\/code>, gan <code>$*ERR<\/code> ir <em>turis<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ar turi programma var rakstīt vai lasīt datus.<\/span> <span class=\"sg\" data-s=\"3\">Katram turim ir savas metodes <code>say<\/code> un <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Trešā plūsma, <code>$*IN<\/code>, ir standarta ievade.<\/span> <span class=\"sg\" data-s=\"1\">Tā ienes tekstu programmā, piemēram, no tastatūras.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to jau lietojāt, bet ne tieši.<\/span> <span class=\"sg\" data-s=\"3\">Funkcija <code>prompt<\/code> nolasa no tās rindu.<\/span> <span class=\"sg\" data-s=\"4\">Mēs atgriežamies pie ievades lasīšanas lapā par <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">failu turiem<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Tas ir tāpēc, ka <code>$*IN<\/code> ir turis, gluži kā atvērts fails.<\/span><\/p>"]]},"ru":{"t":"Стандартные потоки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">У каждой программы есть три <em>стандартных потока<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Поток передаёт текст в программу или из неё.<\/span> <span class=\"sg\" data-s=\"2\">Эти три потока связывают программу с внешним миром.<\/span> <span class=\"sg\" data-s=\"3\">Это стандартный вывод, стандартный поток ошибок и стандартный ввод.<\/span> <span class=\"sg\" data-s=\"4\">Raku даёт вам для них три специальные переменные: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стандартный вывод нужен для обычного вывода программы.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже всё время им пользуетесь.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>print<\/code> отправляют свой текст в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # уходит в стандартный вывод<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Сообщения об ошибках и другие сообщения о проблемах идут в стандартный поток ошибок.<\/span> <span class=\"sg\" data-s=\"1\">Это отдельный поток.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому такие сообщения не смешиваются с настоящим выводом программы.<\/span> <span class=\"sg\" data-s=\"3\">Процедура <code>note<\/code> пишет в стандартный поток ошибок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # уходит в стандартный поток ошибок<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Это полезно.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете отправить эти два потока в разные места.<\/span> <span class=\"sg\" data-s=\"2\">Это называется перенаправлением.<\/span> <span class=\"sg\" data-s=\"3\">Например, можно сохранить вывод в файл.<\/span> <span class=\"sg\" data-s=\"4\">Но сообщения об ошибках вы всё равно видите на экране.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В потоки можно писать и напрямую.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$*OUT<\/code>, и <code>$*ERR<\/code> — это <em>дескрипторы<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Через дескриптор программа может писать или читать данные.<\/span> <span class=\"sg\" data-s=\"3\">У каждого дескриптора есть свои методы <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Третий поток, <code>$*IN<\/code>, — это стандартный ввод.<\/span> <span class=\"sg\" data-s=\"1\">Он передаёт текст в программу, например с клавиатуры.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже пользовались им, но не напрямую.<\/span> <span class=\"sg\" data-s=\"3\">Функция <code>prompt<\/code> читает из него строку.<\/span> <span class=\"sg\" data-s=\"4\">Мы вернёмся к чтению ввода на странице о <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловых дескрипторах<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Это потому, что <code>$*IN<\/code> — такой же дескриптор, как открытый файл.<\/span><\/p>"]]},"uk":{"t":"Стандартні потоки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожна програма має три <em>стандартні потоки<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Потік несе текст у програму або з неї.<\/span> <span class=\"sg\" data-s=\"2\">Ці три потоки з'єднують програму із зовнішнім світом.<\/span> <span class=\"sg\" data-s=\"3\">Це стандартний вивід, стандартний потік помилок і стандартне введення.<\/span> <span class=\"sg\" data-s=\"4\">Raku дає вам для них три спеціальні змінні: <code>$*OUT<\/code>, <code>$*ERR<\/code> і <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стандартний вивід — для звичайного виводу програми.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже весь час ним користуєтеся.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> і <code>print<\/code> надсилають свій текст до <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # іде в стандартний вивід<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Повідомлення про помилки та інші проблеми йдуть у стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"1\">Це окремий потік.<\/span> <span class=\"sg\" data-s=\"2\">Тож ці повідомлення не змішуються зі справжнім виводом програми.<\/span> <span class=\"sg\" data-s=\"3\">Підпрограма <code>note<\/code> пише у стандартний потік помилок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # іде в стандартний потік помилок<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це корисно.<\/span> <span class=\"sg\" data-s=\"1\">Кожен із двох потоків можна надіслати в інше місце.<\/span> <span class=\"sg\" data-s=\"2\">Це називають перенаправленням.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ви можете зберегти вивід у файлі.<\/span> <span class=\"sg\" data-s=\"4\">Але повідомлення про помилки ви все ще бачите на екрані.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У потоки можна також писати напряму.<\/span> <span class=\"sg\" data-s=\"1\">Кожен із потоків <code>$*OUT<\/code> і <code>$*ERR<\/code> — це <em>дескриптор<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Через дескриптор програма може писати або читати дані.<\/span> <span class=\"sg\" data-s=\"3\">Кожен дескриптор має власні методи <code>say<\/code> і <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Третій потік, <code>$*IN<\/code>, — це стандартне введення.<\/span> <span class=\"sg\" data-s=\"1\">Він приносить текст у програму, наприклад із клавіатури.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже користувалися ним, але не напряму.<\/span> <span class=\"sg\" data-s=\"3\">Функція <code>prompt<\/code> читає з нього рядок.<\/span> <span class=\"sg\" data-s=\"4\">Ми повернемося до читання введення на сторінці про <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптори файлів<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Це тому, що <code>$*IN<\/code> — дескриптор, так само як відкритий файл.<\/span><\/p>"]]},"bg":{"t":"Стандартни потоци","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Всяка програма има три <em>стандартни потока<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Потокът носи текст към програмата или от нея.<\/span> <span class=\"sg\" data-s=\"2\">Трите потока свързват програмата с външния свят.<\/span> <span class=\"sg\" data-s=\"3\">Те са стандартен изход, стандартна грешка и стандартен вход.<\/span> <span class=\"sg\" data-s=\"4\">Raku ви дава три специални променливи за тях: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Стандартният изход е за обикновения изход на програмата.<\/span> <span class=\"sg\" data-s=\"1\">Вие вече го използвате през цялото време.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>print<\/code> изпращат текста си в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # отива в стандартния изход<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Съобщенията за грешки и други съобщения за проблеми отиват в стандартната грешка.<\/span> <span class=\"sg\" data-s=\"1\">Това е отделен поток.<\/span> <span class=\"sg\" data-s=\"2\">Затова тези съобщения не се смесват с истинския изход на програмата.<\/span> <span class=\"sg\" data-s=\"3\">Процедурата <code>note<\/code> пише в стандартната грешка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # отива в стандартната грешка<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това е полезно.<\/span> <span class=\"sg\" data-s=\"1\">Можете да изпратите всеки от двата потока на различно място.<\/span> <span class=\"sg\" data-s=\"2\">Това се нарича пренасочване.<\/span> <span class=\"sg\" data-s=\"3\">Например можете да запишете изхода във файл.<\/span> <span class=\"sg\" data-s=\"4\">Но пак виждате съобщенията за грешки на екрана.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете и да пишете направо в потоците.<\/span> <span class=\"sg\" data-s=\"1\">Всеки от <code>$*OUT<\/code> и <code>$*ERR<\/code> е <em>манипулатор<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Чрез манипулатора програмата може да пише или да чете данни.<\/span> <span class=\"sg\" data-s=\"3\">Всеки манипулатор има свои методи <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Третият поток, <code>$*IN<\/code>, е стандартният вход.<\/span> <span class=\"sg\" data-s=\"1\">Той носи текст към програмата, например от клавиатурата.<\/span> <span class=\"sg\" data-s=\"2\">Вече сте го използвали, но не направо.<\/span> <span class=\"sg\" data-s=\"3\">Функцията <code>prompt<\/code> чете ред от него.<\/span> <span class=\"sg\" data-s=\"4\">Ще се върнем към четенето на вход на страницата за <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулаторите на файлове<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Това е така, защото <code>$*IN<\/code> е манипулатор, точно като отворен файл.<\/span><\/p>"]]},"eo":{"t":"Normaj fluoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu programo havas tri <em>normajn fluojn<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Fluo portas tekston en programon aŭ el ĝi.<\/span> <span class=\"sg\" data-s=\"2\">La tri fluoj konektas la programon kun la ekstera mondo.<\/span> <span class=\"sg\" data-s=\"3\">Ili estas norma eligo, norma erarfluo kaj norma enigo.<\/span> <span class=\"sg\" data-s=\"4\">Raku donas al vi tri specialajn variablojn por ili: <code>$*OUT<\/code>, <code>$*ERR<\/code> kaj <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Norma eligo estas por la normala eligo de programo.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam uzas ĝin la tutan tempon.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> kaj <code>print<\/code> sendas sian tekston al <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # iras al norma eligo<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Erarmesaĝoj kaj aliaj mesaĝoj pri problemoj iras al norma erarfluo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas aparta fluo.<\/span> <span class=\"sg\" data-s=\"2\">Do ĉi tiuj mesaĝoj ne miksiĝas kun la vera eligo de la programo.<\/span> <span class=\"sg\" data-s=\"3\">La rutino <code>note<\/code> skribas al norma erarfluo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # iras al norma erarfluo<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tio estas utila.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas sendi ĉiun el la du fluoj al alia loko.<\/span> <span class=\"sg\" data-s=\"2\">Tio nomiĝas redirektado.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, vi povas konservi la eligon en dosiero.<\/span> <span class=\"sg\" data-s=\"4\">Sed vi ankoraŭ vidas la erarmesaĝojn sur la ekrano.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas skribi al la fluoj rekte.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu el <code>$*OUT<\/code> kaj <code>$*ERR<\/code> estas <em>tenilo<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per tenilo, programo povas skribi aŭ legi datumojn.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu tenilo havas siajn proprajn metodojn <code>say<\/code> kaj <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La tria fluo, <code>$*IN<\/code>, estas norma enigo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi portas tekston en la programon, ekzemple de la klavaro.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam uzis ĝin, sed ne rekte.<\/span> <span class=\"sg\" data-s=\"3\">La funkcio <code>prompt<\/code> legas linion el ĝi.<\/span> <span class=\"sg\" data-s=\"4\">Ni revenas al legado de enigo en la paĝo pri <a href=\"https://course.raku.org/eo/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">dosierteniloj<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Tio estas, ĉar <code>$*IN<\/code> estas tenilo, same kiel malfermita dosiero.<\/span><\/p>"]]},"la":{"t":"Fluxus normales","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Omne programma tria <em>fluenta vulgaria<\/em> habet.<\/span> <span class=\"sg\" data-s=\"1\">Fluentum textum in programma fert aut ex eo.<\/span> <span class=\"sg\" data-s=\"2\">Tria fluenta programma cum mundo externo coniungunt.<\/span> <span class=\"sg\" data-s=\"3\">Sunt exitus vulgaris, error vulgaris et introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"4\">Raku tibi tres variabiles speciales pro eis dat: <code>$*OUT<\/code>, <code>$*ERR<\/code> et <code>$*IN<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Exitus vulgaris est pro exitu ordinario programmatis.<\/span> <span class=\"sg\" data-s=\"1\">Eo iam semper uteris.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> et <code>print<\/code> textum suum ad <code>$*OUT<\/code> mittunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # ad exitum vulgarem it<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nuntii errorum et alii nuntii de difficultatibus ad errorem vulgarem eunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est fluentum separatum.<\/span> <span class=\"sg\" data-s=\"2\">Itaque hi nuntii cum vero exitu programmatis non miscentur.<\/span> <span class=\"sg\" data-s=\"3\">Procedura <code>note<\/code> in errorem vulgarem scribit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # ad errorem vulgarem it<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc utile est.<\/span> <span class=\"sg\" data-s=\"1\">Utrumque fluentum in alium locum mittere potes.<\/span> <span class=\"sg\" data-s=\"2\">Hoc redirigere vocatur.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, exitum in archivo servare potes.<\/span> <span class=\"sg\" data-s=\"4\">Sed nuntios errorum adhuc in screen vides.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In fluenta etiam directe scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Utrumque, <code>$*OUT<\/code> et <code>$*ERR<\/code>, est <em>tractabulum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per tractabulum programma data scribere aut legere potest.<\/span> <span class=\"sg\" data-s=\"3\">Quodque tractabulum proprias methodos <code>say<\/code> et <code>print<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tertium fluentum, <code>$*IN<\/code>, est introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"1\">Textum in programma fert, exempli gratia ex claviatura.<\/span> <span class=\"sg\" data-s=\"2\">Iam id adhibuisti, sed non directe.<\/span> <span class=\"sg\" data-s=\"3\">Functio <code>prompt<\/code> lineam ex eo legit.<\/span> <span class=\"sg\" data-s=\"4\">Ad introitum legendum redimus in pagina de <a href=\"https://course.raku.org/la/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">tractabulis archivorum<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Nam <code>$*IN<\/code> tractabulum est, sicut archivum apertum.<\/span><\/p>"]]}}}</script>
