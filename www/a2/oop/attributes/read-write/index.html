g\" data-s=\"0\">Normalerweise ist der Accessor von <code>has $.name<\/code> <em>nur lesbar<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Der Konstruktor gibt dem Attribut seinen Wert.<\/span> <span class=\"sg\" data-s=\"2\">Der Konstruktor ist die Methode, die das Objekt erstellt, hier <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Danach kann Code außerhalb des Objekts den Wert lesen.<\/span> <span class=\"sg\" data-s=\"4\">Aber er kann ihn nicht ändern.<\/span> <span class=\"sg\" data-s=\"5\">Versuchen Sie, ihm einen neuen Wert zuzuweisen.<\/span> <span class=\"sg\" data-s=\"6\">Das gibt einen Fehler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm stoppt mit diesem Fehler:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Möchten Sie den Wert über den Accessor ändern?<\/span> <span class=\"sg\" data-s=\"1\">Dann markieren Sie das Attribut mit dem Trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jetzt gibt der Accessor einen Container zurück, in den Sie schreiben können.<\/span> <span class=\"sg\" data-s=\"1\">Also funktioniert die Zuweisung.<\/span> <span class=\"sg\" data-s=\"2\">Der <code>name<\/code> des Objekts ist jetzt <code>Max<\/code>.<\/span><\/p>"]]},"nl":{"t":"Lees-schrijfattributen","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Standaard is de accessor van <code>has $.name<\/code> <em>alleen-lezen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De constructor geeft het attribuut zijn waarde.<\/span> <span class=\"sg\" data-s=\"2\">De constructor is de methode die het object maakt, hier <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Daarna kan code buiten het object de waarde lezen.<\/span> <span class=\"sg\" data-s=\"4\">Maar die code kan de waarde niet veranderen.<\/span> <span class=\"sg\" data-s=\"5\">Probeer er een nieuwe waarde aan toe te kennen.<\/span> <span class=\"sg\" data-s=\"6\">Dat geeft een fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma stopt met deze fout:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wil je de waarde via de accessor veranderen?<\/span> <span class=\"sg\" data-s=\"1\">Markeer het attribuut dan met de trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nu geeft de accessor een container terug waarin je kunt schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Dus werkt de toekenning.<\/span> <span class=\"sg\" data-s=\"2\">De <code>name<\/code> van het object is nu <code>Max<\/code>.<\/span><\/p>"]]},"es":{"t":"Atributos de lectura y escritura","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Por defecto, el accesor de <code>has $.name<\/code> es de <em>solo lectura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El constructor da al atributo su valor.<\/span> <span class=\"sg\" data-s=\"2\">El constructor es el método que crea el objeto, aquí <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Después, el código de fuera del objeto puede leer el valor.<\/span> <span class=\"sg\" data-s=\"4\">Pero no puede cambiarlo.<\/span> <span class=\"sg\" data-s=\"5\">Intenta asignarle un valor nuevo.<\/span> <span class=\"sg\" data-s=\"6\">Esto da un error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa se detiene con este error:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Quieres cambiar el valor a través del accesor?<\/span> <span class=\"sg\" data-s=\"1\">Entonces marca el atributo con el rasgo <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ahora el accesor devuelve un contenedor en el que puedes escribir.<\/span> <span class=\"sg\" data-s=\"1\">Así que la asignación funciona.<\/span> <span class=\"sg\" data-s=\"2\">El <code>name<\/code> del objeto ahora es <code>Max<\/code>.<\/span><\/p>"]]},"it":{"t":"Attributi in lettura e scrittura","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalmente l'accessore di <code>has $.name<\/code> è di <em>sola lettura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il costruttore dà all'attributo il suo valore.<\/span> <span class=\"sg\" data-s=\"2\">Il costruttore è il metodo che crea l'oggetto, qui <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, il codice fuori dall'oggetto può leggere il valore.<\/span> <span class=\"sg\" data-s=\"4\">Ma non lo può cambiare.<\/span> <span class=\"sg\" data-s=\"5\">Prova ad assegnargli un nuovo valore.<\/span> <span class=\"sg\" data-s=\"6\">Questo dà un errore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma si ferma con questo errore:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vuoi cambiare il valore attraverso l'accessore?<\/span> <span class=\"sg\" data-s=\"1\">Allora segna l'attributo con il tratto <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora l'accessore restituisce un contenitore in cui puoi scrivere.<\/span> <span class=\"sg\" data-s=\"1\">Così l'assegnamento funziona.<\/span> <span class=\"sg\" data-s=\"2\">Il <code>name<\/code> dell'oggetto ora è <code>Max<\/code>.<\/span><\/p>"]]},"lv":{"t":"Lasāmi un rakstāmi atribūti","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma piekļuves metode no <code>has $.name<\/code> ir <em>tikai lasāma<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Konstruktors dod atribūtam tā vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Konstruktors ir metode, kas veido objektu, šeit <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam kods ārpus objekta var nolasīt vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas nevar to mainīt.<\/span> <span class=\"sg\" data-s=\"5\">Pamēģiniet piešķirt tai jaunu vērtību.<\/span> <span class=\"sg\" data-s=\"6\">Tas dod kļūdu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma apstājas ar šo kļūdu:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai jūs gribat mainīt vērtību caur piekļuves metodi?<\/span> <span class=\"sg\" data-s=\"1\">Tad atzīmējiet atribūtu ar iezīmi <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad piekļuves metode atgriež konteineru, kurā var rakstīt.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc piešķiršana darbojas.<\/span> <span class=\"sg\" data-s=\"2\">Objekta <code>name<\/code> tagad ir <code>Max<\/code>.<\/span><\/p>"]]},"ru":{"t":"Атрибуты для чтения и записи","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">По умолчанию аксессор из <code>has $.name<\/code> работает <em>только на чтение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструктор даёт атрибуту значение.<\/span> <span class=\"sg\" data-s=\"2\">Конструктор — это метод, который создаёт объект, здесь это <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">После этого код снаружи объекта может читать значение.<\/span> <span class=\"sg\" data-s=\"4\">Но он не может его изменить.<\/span> <span class=\"sg\" data-s=\"5\">Попробуйте присвоить ему новое значение.<\/span> <span class=\"sg\" data-s=\"6\">Это даёт ошибку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа останавливается с такой ошибкой:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хотите менять значение через аксессор?<\/span> <span class=\"sg\" data-s=\"1\">Тогда пометьте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь аксессор возвращает контейнер, в который можно записывать.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому присваивание работает.<\/span> <span class=\"sg\" data-s=\"2\">Атрибут <code>name<\/code> у объекта теперь равен <code>Max<\/code>.<\/span><\/p>"]]},"uk":{"t":"Атрибути для читання й запису","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням аксесор із <code>has $.name<\/code> доступний <em>лише для читання<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструктор дає атрибуту значення.<\/span> <span class=\"sg\" data-s=\"2\">Конструктор — це метод, який створює об'єкт, тут це <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Після цього код поза об'єктом може читати значення.<\/span> <span class=\"sg\" data-s=\"4\">Але він не може його змінити.<\/span> <span class=\"sg\" data-s=\"5\">Спробуйте присвоїти йому нове значення.<\/span> <span class=\"sg\" data-s=\"6\">Це дає помилку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма зупиняється з такою помилкою:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хочете змінювати значення через аксесор?<\/span> <span class=\"sg\" data-s=\"1\">Тоді позначте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер аксесор повертає контейнер, у який можна записувати.<\/span> <span class=\"sg\" data-s=\"1\">Тож присвоєння працює.<\/span> <span class=\"sg\" data-s=\"2\">Тепер <code>name<\/code> об'єкта — це <code>Max<\/code>.<\/span><\/p>"]]},"bg":{"t":"Атрибути за четене и писане","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">По подразбиране аксесорът от <code>has $.name<\/code> е <em>само за четене<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструкторът дава стойност на атрибута.<\/span> <span class=\"sg\" data-s=\"2\">Конструкторът е методът, който създава обекта, тук <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">След това кодът извън обекта може да чете стойността.<\/span> <span class=\"sg\" data-s=\"4\">Но не може да я променя.<\/span> <span class=\"sg\" data-s=\"5\">Опитайте да ѝ присвоите нова стойност.<\/span> <span class=\"sg\" data-s=\"6\">Това дава грешка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата спира с тази грешка:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Искате ли да променяте стойността през аксесора?<\/span> <span class=\"sg\" data-s=\"1\">Тогава отбележете атрибута с трейта <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега аксесорът връща контейнер, в който можете да записвате.<\/span> <span class=\"sg\" data-s=\"1\">Затова присвояването работи.<\/span> <span class=\"sg\" data-s=\"2\">Сега <code>name<\/code> на обекта е <code>Max<\/code>.<\/span><\/p>"]]},"eo":{"t":"Leg- kaj skribeblaj atributoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, la atingilo de <code>has $.name<\/code> estas <em>nur-legebla<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La konstruilo donas al la atributo ĝian valoron.<\/span> <span class=\"sg\" data-s=\"2\">La konstruilo estas la metodo, kiu faras la objekton, ĉi tie <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, kodo ekster la objekto povas legi la valoron.<\/span> <span class=\"sg\" data-s=\"4\">Sed ĝi ne povas ŝanĝi ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Provu atribui novan valoron al ĝi.<\/span> <span class=\"sg\" data-s=\"6\">Tio donas eraron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo haltas kun ĉi tiu eraro:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi volas ŝanĝi la valoron tra la atingilo?<\/span> <span class=\"sg\" data-s=\"1\">Tiam marku la atributon per la trajto <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun la atingilo redonas ujon, en kiun vi povas skribi.<\/span> <span class=\"sg\" data-s=\"1\">Do la atribuo funkcias.<\/span> <span class=\"sg\" data-s=\"2\">La <code>name<\/code> de la objekto nun estas <code>Max<\/code>.<\/span><\/p>"]]},"la":{"t":"Attributa legenda et scribenda","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ex more, accessor ex <code>has $.name<\/code> <em>solum legendus<\/em> est.<\/span> <span class=\"sg\" data-s=\"1\">Constructor attributo valorem eius dat.<\/span> <span class=\"sg\" data-s=\"2\">Constructor est methodus quae obiectum facit, hic <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Postea codex extra obiectum valorem legere potest.<\/span> <span class=\"sg\" data-s=\"4\">Sed eum mutare non potest.<\/span> <span class=\"sg\" data-s=\"5\">Tempta ei novum valorem assignare.<\/span> <span class=\"sg\" data-s=\"6\">Hoc errorem dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma cum hoc errore desinit:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visne valorem per accessorem mutare?<\/span> <span class=\"sg\" data-s=\"1\">Tum attributum proprietate <code>is rw<\/code> nota:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc accessor receptaculum reddit in quo scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Itaque assignatio operatur.<\/span> <span class=\"sg\" data-s=\"2\"><code>name<\/code> obiecti nunc est <code>Max<\/code>.<\/span><\/p>"]]}}}</script>
