.<\/span><\/p>"]]},"de":{"t":"Standardwerte","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Attribut kann einen <em>Standardwert<\/em> haben.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal erstellen Sie ein Objekt ohne Wert für das Attribut.<\/span> <span class=\"sg\" data-s=\"2\">Dann nimmt Raku den Standardwert.<\/span> <span class=\"sg\" data-s=\"3\">Schreiben Sie den Standardwert mit <code>=<\/code> hinter das Attribut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie noch eine Sache.<\/span> <span class=\"sg\" data-s=\"1\">Sie können einem Attribut einen Typ geben, wie einer Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Der Wert muss dann diesen Typ haben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier bekommt <code>new<\/code> kein <code>weight<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also bekommt das Attribut den Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber Sie können trotzdem einen eigenen Wert angeben.<\/span> <span class=\"sg\" data-s=\"1\">Er ersetzt den Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Manchmal hat ein Attribut keinen Standardwert.<\/span> <span class=\"sg\" data-s=\"1\">Sie übergeben auch keinen Wert dafür an <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann ist das Attribut einfach undefiniert.<\/span> <span class=\"sg\" data-s=\"3\">Es ist wie eine neue skalare Variable.<\/span><\/p>"]]},"nl":{"t":"Standaardwaarden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een attribuut kan een <em>standaardwaarde<\/em> hebben.<\/span> <sp <code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota ancora una cosa.<\/span> <span class=\"sg\" data-s=\"1\">Puoi dare un tipo a un attributo, come a una variabile.<\/span> <span class=\"sg\" data-s=\"2\">Allora il valore deve essere di questo tipo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>new<\/code> non riceve <code>weight<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Così l'attributo prende il valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma puoi sempre dare un tuo valore.<\/span> <span class=\"sg\" data-s=\"1\">Sostituisce il valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte un attributo non ha un valore predefinito.<\/span> <span class=\"sg\" data-s=\"1\">E non passi a <code>new<\/code> nessun valore per l'attributo.<\/span> <span class=\"sg\" data-s=\"2\">Allora l'attributo è semplicemente non definito.<\/span> <span class=\"sg\" data-s=\"3\">È come una nuova variabile scalare.<\/span><\/p>"]]},"lv":{"t":"Noklusētās vērtības","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Atribūtam var būt <em>noklusētā vērtība<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz jūs veidojat objektu bez vērtības šim atribūtam.<\/span> <span class=\"sg\" data-s=\"2\">Tad Raku izmanto noklusēto vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Rakstiet noklusēto vērtību aiz atribūta ar <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet vēl vienu lietu.<\/span> <span class=\"sg\" da span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ ne transdonas valoron por ĝi al <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la atributo estas simple nedifinita.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas kiel nova skalara variablo.<\/span><\/p>"]]},"la":{"t":"Valores praedefiniti","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Attributum <em>valorem praedefinitum<\/em> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Interdum obiectum sine valore pro attributo facis.<\/span> <span class=\"sg\" data-s=\"2\">Tum Raku valore praedefinito utitur.<\/span> <span class=\"sg\" data-s=\"3\">Scribe valorem praedefinitum post attributum, cum <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota etiam rem aliam.<\/span> <span class=\"sg\" data-s=\"1\">Attributo genus dare potes, sicut variabili.<\/span> <span class=\"sg\" data-s=\"2\">Tum valor hoc genus habere debet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>new<\/code> nullum <code>weight<\/code> accipit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque attributum valorem praedefinitum accipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed tamen valorem tuum dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Is valorem praedefinitum superat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum attributum valorem praedefinitum non habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam valorem pro eo ad <code>new<\/code> non tradis.<\/span> <span class=\"sg\" data-s=\"2\">Tum attributum simpliciter indefinitum est.<\/span> <span class=\"sg\" data-s=\"3\">Est sicut nova variabilis scalaris.<\/span><\/p>"]]}}}</script>
