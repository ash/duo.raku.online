>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk object krijgt een eigen kopie van deze attributen.<\/span> <span class=\"sg\" data-s=\"1\">Je geeft ze waarden als je het object maakt.<\/span> <span class=\"sg\" data-s=\"2\">Geef de waarden als benoemde argumenten mee aan <code>new<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de <code>$.<\/code> in <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij doet twee dingen.<\/span> <span class=\"sg\" data-s=\"2\">Ten eerste maakt hij een attribuut.<\/span> <span class=\"sg\" data-s=\"3\">Ten tweede maakt hij een methode met dezelfde naam.<\/span> <span class=\"sg\" data-s=\"4\">Deze methode geeft de waarde van het attribuut terug.<\/span> <span class=\"sg\" data-s=\"5\">Zo'n methode heet een <em>accessor<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Verschillende objecten bewaren hun eigen waarden.<\/span> <span class=\"sg\" data-s=\"1\">Ze delen die niet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten twee dingen zien.<\/span> <span class=\"sg\" data-s=\"1\">Eerst maak je attributen die je kunt veranderen.<\/span> <span class=\"sg\" data-s=\"2\">Dan geef je attributen standaardwaarden.<\/span> <span class=\"sg\" data-s=\"3\">Er is ook een manier om <em>private<\/em> attributen te maken.<\/span> <span class=\"sg\" data-s=\"4\">Code buiten het object kan ze niet zien.<\/span> <span class=\"sg\" data-s=\"5\">Na de methoden komen we erop terug.<\/span><\/p>"]]},"es":{"t":"Atributos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una clase vacía no es muy útil.<\/span> <span class=\"sg\" data-s=\"1\">Un objeto necesita sus propios datos.<\/span> <span class=\"sg\" data-s=\"2\">Para esto, das a la clase unos <em>atributos<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un atributo es un dato dentro de un objeto.<\/span> <span class=\"sg\" data-s=\"4\">Para crear un atributo, escribe la palabra clave <code>has<\/code> dentro de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada objeto recibe su propia copia de estos atributos.<\/span> <span class=\"sg\" data-s=\"1\">Les das valores cuando creas el objeto.<\/span> <span class=\"sg\" data-s=\"2\">Pasa los valores a <code>new<\/code> como argumentos con nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Mira el <code>$.<\/code> de <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hace dos cosas.<\/span> <span class=\"sg\" data-s=\"2\">Primero, crea un atributo.<\/span> <span class=\"sg\" data-s=\"3\">Segundo, crea un método con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"4\">Este método devuelve el valor del atributo.<\/span> <span class=\"sg\" data-s=\"5\">Un método así se llama <em>accesor<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Objetos distintos guardan sus propios valores.<\/span> <span class=\"sg\" data-s=\"1\">No los comparten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes muestran dos cosas.<\/span> <span class=\"sg\" data-s=\"1\">Primero, creas atributos que puedes cambiar.<\/span> <span class=\"sg\" data-s=\"2\">Después das valores por defecto a los atributos.<\/span> <span class=\"sg\" data-s=\"3\">También hay una manera de crear atributos <em>privados<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">El código de fuera del objeto no los ve.<\/span> <span class=\"sg\" data-s=\"5\">Volvemos a ellos después de los métodos.<\/span><\/p>"]]},"it":{"t":"Attributi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una classe vuota non è molto utile.<\/span> <span class=\"sg\" data-s=\"1\">Un oggetto ha bisogno di dati propri.<\/span> <span class=\"sg\" data-s=\"2\">Per questo dai alla classe degli <em>attributi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un attributo è un dato dentro un oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Per creare un attributo, scrivi la parola chiave <code>has<\/code> dentro la classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni oggetto riceve la sua copia di questi attributi.<\/span> <span class=\"sg\" data-s=\"1\">Dai loro i valori quando crei l'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Passa i valori a <code>new<\/code> come argomenti nominati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Guarda <code>$.<\/code> in <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Fa due cose.<\/span> <span class=\"sg\" data-s=\"2\">Primo, crea un attributo.<\/span> <span class=\"sg\" data-s=\"3\">Secondo, crea un metodo con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"4\">Questo metodo restituisce il valore dell'attributo.<\/span> <span class=\"sg\" data-s=\"5\">Un metodo così si chiama <em>accessore<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Oggetti diversi conservano i propri valori.<\/span> <span class=\"sg\" data-s=\"1\">Non li condividono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano due cose.<\/span> <span class=\"sg\" data-s=\"1\">Prima crei attributi che puoi cambiare.<\/span> <span class=\"sg\" data-s=\"2\">Poi dai agli attributi dei valori predefiniti.<\/span> <span class=\"sg\" data-s=\"3\">C'è anche un modo per creare attributi <em>privati<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Il codice fuori dall'oggetto non li vede.<\/span> <span class=\"sg\" data-s=\"5\">Ci torniamo dopo i metodi.<\/span><\/p>"]]},"lv":{"t":"Atribūti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tukša klase nav īpaši noderīga.<\/span> <span class=\"sg\" data-s=\"1\">Objektam vajag savus datus.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs dodat klasei <em>atribūtus<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Atribūts ir daļa no objekta datiem.<\/span> <span class=\"sg\" data-s=\"4\">Lai izveidotu atribūtu, rakstiet klasē atslēgvārdu <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrs objekts saņem savu šo atribūtu kopiju.<\/span> <span class=\"sg\" data-s=\"1\">Jūs dodat tiem vērtības, kad veidojat objektu.<\/span> <span class=\"sg\" data-s=\"2\">Padodiet vērtības metodei <code>new<\/code> kā nosauktus argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Apskatiet <code>$.<\/code> kodā <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas dara divas lietas.<\/span> <span class=\"sg\" data-s=\"2\">Pirmkārt, tas izveido atribūtu.<\/span> <span class=\"sg\" data-s=\"3\">Otrkārt, tas izveido metodi ar tādu pašu nosaukumu.<\/span> <span class=\"sg\" data-s=\"4\">Šī metode atgriež atribūta vērtību.<\/span> <span class=\"sg\" data-s=\"5\">Tādu metodi sauc par <em>piekļuves metodi<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažādi objekti glabā savas vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Tie nedala tās savā starpā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda divas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms jūs veidojat atribūtus, kurus var mainīt.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam jūs dodat atribūtiem noklusētās vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Ir arī veids, kā veidot <em>privātus<\/em> atribūtus.<\/span> <span class=\"sg\" data-s=\"4\">Kods ārpus objekta tos neredz.<\/span> <span class=\"sg\" data-s=\"5\">Pie tiem mēs atgriežamies pēc metodēm.<\/span><\/p>"]]},"ru":{"t":"Атрибуты","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Пустой класс не очень полезен.<\/span> <span class=\"sg\" data-s=\"1\">Объекту нужны свои данные.<\/span> <span class=\"sg\" data-s=\"2\">Для этого вы даёте классу <em>атрибуты<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Атрибут — это часть данных внутри объекта.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы создать атрибут, напишите внутри класса ключевое слово <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый объект получает свою копию этих атрибутов.<\/span> <span class=\"sg\" data-s=\"1\">Вы даёте им значения, когда создаёте объект.<\/span> <span class=\"sg\" data-s=\"2\">Передайте значения в <code>new<\/code> как именованные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на <code>$.<\/code> в <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Эта запись делает две вещи.<\/span> <span class=\"sg\" data-s=\"2\">Во-первых, она создаёт атрибут.<\/span> <span class=\"sg\" data-s=\"3\">Во-вторых, она создаёт метод с тем же именем.<\/span> <span class=\"sg\" data-s=\"4\">Этот метод возвращает значение атрибута.<\/span> <span class=\"sg\" data-s=\"5\">Такой метод называется <em>аксессором<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разные объекты хранят свои значения.<\/span> <span class=\"sg\" data-s=\"1\">Они не делят их между собой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают две вещи.<\/span> <span class=\"sg\" data-s=\"1\">Сначала вы делаете атрибуты, которые можно менять.<\/span> <span class=\"sg\" data-s=\"2\">Потом вы даёте атрибутам значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"3\">Есть ещё способ сделать <em>приватные<\/em> атрибуты.<\/span> <span class=\"sg\" data-s=\"4\">Код снаружи объекта их не видит.<\/span> <span class=\"sg\" data-s=\"5\">Мы вернёмся к ним после методов.<\/span><\/p>"]]},"uk":{"t":"Атрибути","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Порожній клас не дуже корисний.<\/span> <span class=\"sg\" data-s=\"1\">Об'єктові потрібні власні дані.<\/span> <span class=\"sg\" data-s=\"2\">Для цього ви даєте класу <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Атрибут — це частина даних усередині об'єкта.<\/span> <span class=\"sg\" data-s=\"4\">Щоб створити атрибут, напишіть ключове слово <code>has<\/code> усередині класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен об'єкт отримує власну копію цих атрибутів.<\/span> <span class=\"sg\" data-s=\"1\">Ви даєте їм значення, коли створюєте об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Передайте значення до <code>new<\/code> як іменовані аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Подивіться на <code>$.<\/code> у <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він робить дві речі.<\/span> <span class=\"sg\" data-s=\"2\">По-перше, він створює атрибут.<\/span> <span class=\"sg\" data-s=\"3\">По-друге, він створює метод із тим самим ім'ям.<\/span> <span class=\"sg\" data-s=\"4\">Цей метод повертає значення атрибута.<\/span> <span class=\"sg\" data-s=\"5\">Такий метод називають <em>аксесором<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Різні об'єкти зберігають власні значення.<\/span> <span class=\"sg\" data-s=\"1\">Вони не мають спільних значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують дві речі.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку ви створюєте атрибути, які можна змінювати.<\/span> <span class=\"sg\" data-s=\"2\">Потім ви даєте атрибутам типові значення.<\/span> <span class=\"sg\" data-s=\"3\">Є також спосіб створити <em>приватні<\/em> атрибути.<\/span> <span class=\"sg\" data-s=\"4\">Код поза об'єктом їх не бачить.<\/span> <span class=\"sg\" data-s=\"5\">Ми повернемося до них після методів.<\/span><\/p>"]]},"bg":{"t":"Атрибути","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Празният клас не е много полезен.<\/span> <span class=\"sg\" data-s=\"1\">Обектът има нужда от свои данни.<\/span> <span class=\"sg\" data-s=\"2\">Затова давате на класа <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Атрибутът е една част от данните в обекта.<\/span> <span class=\"sg\" data-s=\"4\">За да създадете атрибут, напишете ключовата дума <code>has<\/code> вътре в класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки обект получава свое копие на тези атрибути.<\/span> <span class=\"sg\" data-s=\"1\">Давате им стойности, когато създавате обекта.<\/span> <span class=\"sg\" data-s=\"2\">Подайте стойностите на <code>new<\/code> като именувани аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Вижте <code>$.<\/code> в <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това <code>$.<\/code> върши две неща.<\/span> <span class=\"sg\" data-s=\"2\">Първо, създава атрибут.<\/span> <span class=\"sg\" data-s=\"3\">Второ, създава метод със същото име.<\/span> <span class=\"sg\" data-s=\"4\">Този метод връща стойността на атрибута.<\/span> <span class=\"sg\" data-s=\"5\">Такъв метод се нарича <em>аксесор<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Различните обекти пазят свои стойности.<\/span> <span class=\"sg\" data-s=\"1\">Те не ги споделят:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват две неща.<\/span> <span class=\"sg\" data-s=\"1\">Първо, правите атрибути, които можете да променяте.<\/span> <span class=\"sg\" data-s=\"2\">После давате на атрибутите стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">Има и начин да направите <em>частни<\/em> атрибути.<\/span> <span class=\"sg\" data-s=\"4\">Кодът извън обекта не ги вижда.<\/span> <span class=\"sg\" data-s=\"5\">Връщаме се към тях след методите.<\/span><\/p>"]]},"eo":{"t":"Atributoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Malplena klaso ne estas tre utila.<\/span> <span class=\"sg\" data-s=\"1\">Objekto bezonas siajn proprajn datumojn.<\/span> <span class=\"sg\" data-s=\"2\">Por tio vi donas al la klaso <em>atributojn<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Atributo estas peco de datumoj en objekto.<\/span> <span class=\"sg\" data-s=\"4\">Por krei atributon, skribu la ŝlosilvorton <code>has<\/code> en la klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu objekto ricevas sian propran kopion de ĉi tiuj atributoj.<\/span> <span class=\"sg\" data-s=\"1\">Vi donas al ili valorojn, kiam vi faras la objekton.<\/span> <span class=\"sg\" data-s=\"2\">Transdonu la valorojn al <code>new<\/code> kiel nomitajn argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rigardu <code>$.<\/code> en <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi faras du aferojn.<\/span> <span class=\"sg\" data-s=\"2\">Unue, ĝi kreas atributon.<\/span> <span class=\"sg\" data-s=\"3\">Due, ĝi kreas metodon kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu metodo redonas la valoron de la atributo.<\/span> <span class=\"sg\" data-s=\"5\">Tia metodo nomiĝas <em>atingilo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Malsamaj objektoj tenas siajn proprajn valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili ne dividas ilin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras du aferojn.<\/span> <span class=\"sg\" data-s=\"1\">Unue, vi faras atributojn, kiujn vi povas ŝanĝi.<\/span> <span class=\"sg\" data-s=\"2\">Poste vi donas al atributoj defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Estas ankaŭ maniero fari <em>privatajn<\/em> atributojn.<\/span> <span class=\"sg\" data-s=\"4\">Kodo ekster la objekto ne povas vidi ilin.<\/span> <span class=\"sg\" data-s=\"5\">Ni revenas al ili post la metodoj.<\/span><\/p>"]]},"la":{"t":"Attributa","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Classis vacua non valde utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Obiectum propria data habere debet.<\/span> <span class=\"sg\" data-s=\"2\">Ideo classi <em>attributa<\/em> das.<\/span> <span class=\"sg\" data-s=\"3\">Attributum est pars datorum in obiecto.<\/span> <span class=\"sg\" data-s=\"4\">Ut attributum facias, scribe verbum <code>has<\/code> intra classem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quodque obiectum propriam copiam horum attributorum accipit.<\/span> <span class=\"sg\" data-s=\"1\">Valores eis das cum obiectum facis.<\/span> <span class=\"sg\" data-s=\"2\">Trade valores ad <code>new<\/code> ut argumenta nominata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Specta <code>$.<\/code> in <code>has $.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Duas res agit.<\/span> <span class=\"sg\" data-s=\"2\">Primo attributum creat.<\/span> <span class=\"sg\" data-s=\"3\">Secundo methodum eiusdem nominis creat.<\/span> <span class=\"sg\" data-s=\"4\">Haec methodus valorem attributi reddit.<\/span> <span class=\"sg\" data-s=\"5\">Talem methodum <em>accessorem<\/em> appellamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diversa obiecta proprios valores servant.<\/span> <span class=\"sg\" data-s=\"1\">Eos non communicant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia duas res ostendunt.<\/span> <span class=\"sg\" data-s=\"1\">Primo attributa facis quae mutare potes.<\/span> <span class=\"sg\" data-s=\"2\">Deinde attributis valores praedefinitos das.<\/span> <span class=\"sg\" data-s=\"3\">Attributa etiam <em>privata<\/em> facere potes.<\/span> <span class=\"sg\" data-s=\"4\">Codex extra obiectum ea videre non potest.<\/span> <span class=\"sg\" data-s=\"5\">Post methodos ad ea redimus.<\/span><\/p>"]]}}}</script>
