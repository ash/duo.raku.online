ss=\"sg\" data-s=\"4\">Un valor de este tipo se llama <em>objeto<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para crear una clase, escribe la palabra clave <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después, escribe un nombre y un bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta clase <code>Dog<\/code> está vacía por ahora.<\/span> <span class=\"sg\" data-s=\"1\">Pero ya es un tipo nuevo.<\/span> <span class=\"sg\" data-s=\"2\">Un objeto de una clase también se llama <em>instancia<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> es un método.<\/span> <span class=\"sg\" data-s=\"4\">Para crear una instancia, llámalo sobre el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora la variable <code>$rex<\/code> tiene dentro un objeto <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cada llamada a <code>new<\/code> crea un objeto nuevo y separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> y <code>$fido<\/code> son dos perros distintos.<\/span> <span class=\"sg\" data-s=\"1\">La clase todavía está vacía, pero los perros son distintos.<\/span> <span class=\"sg\" data-s=\"2\">En las secciones siguientes, das a una clase sus propios datos.<\/span> <span class=\"sg\" data-s=\"3\">Estos datos se llaman <em>atributos<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Una clase también recibe su propio comportamiento, o sea, sus acciones.<\/span> <span class=\"sg\" data-s=\"5\">Estas acciones se llaman <em>métodos<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">El primer tema mira más de cerca una clase y sus instancias.<\/span> <span class=\"sg\" da /p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> un <code>$fido<\/code> ir divi dažādi suņi.<\/span> <span class=\"sg\" data-s=\"1\">Klase vēl ir tukša, bet suņi ir dažādi.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajās sadaļās jūs dodat klasei savus datus.<\/span> <span class=\"sg\" data-s=\"3\">Šos datus sauc par <em>atribūtiem<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Klase saņem arī savu uzvedību jeb darbības.<\/span> <span class=\"sg\" data-s=\"5\">Šīs darbības sauc par <em>metodēm<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Pirmais temats tuvāk aplūko klasi un tās instances.<\/span> <span class=\"sg\" data-s=\"7\">Tas parāda, kā tās atšķiras.<\/span><\/p>"]]},"ru":{"t":"Классы","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">До сих пор вы пользовались только типами, которые уже есть в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это числа, строки, массивы и так далее.<\/span> <span class=\"sg\" data-s=\"2\">В <em>объектно-ориентированном программировании<\/em> вы можете создавать свои типы.<\/span> <span class=\"sg\" data-s=\"3\">Такой тип называется <em>классом<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Значение такого типа называется <em>объектом<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать класс, напишите ключевое слово <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После него напишите имя и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Этот класс <code>Dog<\/code> пока пустой.<\/span> <span class=\"sg\" data-s=\"1\">Но это уже новый тип.<\/span> <span class=\"sg\" data-s=\"2\">Объект класса ещё называют <em>экземпляром<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> — это метод.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы создать экземпляр, вызовите его у имени класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь в переменной <code>$rex<\/code> лежит объект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждый вызов <code>new<\/code> создаёт новый, отдельный объект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> — две разные собаки.<\/span> <span class=\"sg\" data-s=\"1\">Класс ещё пустой, но собаки разные.<\/span> <span class=\"sg\" data-s=\"2\">В следующих разделах вы дадите классу свои данные.<\/span> <span class=\"sg\" data-s=\"3\">Эти данные называются <em>атрибутами<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ещё класс получит своё поведение, то есть действия.<\/span> <span class=\"sg\" data-s=\"5\">Эти действия называются <em>методами<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Первая тема подробнее рассказывает о классе и его экземплярах.<\/span> <span class=\"sg\" data-s=\"7\">Она показывает, чем они отличаются.<\/span><\/p>"]]},"uk":{"t":"Класи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Досі ви використовували лише типи, які вже є в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це числа, рядки, масиви тощо.<\/span> <span class=\"sg\" data-s=\"2\">З <em>об'єктно-орієнтованим програмуванням<\/em> ви можете створювати власні типи.<\/span> <span class=\"sg\" data-s=\"3\">Такий тип називають <em>класом<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Значення такого типу називають <em>об'єктом<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб створити клас, напишіть ключове слово <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після нього напишіть ім'я та блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цей клас <code>Dog<\/code> поки що порожній.<\/span> <span class=\"sg\" data-s=\"1\">Але це вже новий тип.<\/span> <span class=\"sg\" data-s=\"2\">Об'єкт класу ще називають <em>екземпляром<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> — це метод.<\/span> <span class=\"sg\" data-s=\"4\">Щоб створити екземпляр, викличте його для імені класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер у змінній <code>$rex<\/code> є об'єкт <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожен виклик <code>new<\/code> створює новий, окремий об'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> і <code>$fido<\/code> — два різні пси.<\/span> <span class=\"sg\" data-s=\"1\">Клас ще порожній, але пси різні.<\/span> <span class=\"sg\" data-s=\"2\">У наступних розділах ви даєте класу власні дані.<\/span> <span class=\"sg\" data-s=\"3\">Ці дані називають <em>атрибутами<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Клас також отримує власну поведінку, тобто дії.<\/span> <span class=\"sg\" data-s=\"5\">Ці дії називають <em>методами<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Перша тема уважніше розглядає клас і його екземпляри.<\/span> <span class=\"sg\" data-s=\"7\">Вона показує, чим вони різні.<\/span><\/p>"]]},"bg":{"t":"Класове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Досега използвахте само типовете, които идват с Raku.<\/span> <span class=\"sg\" data-s=\"1\">Това са числа, низове, масиви и така нататък.<\/span> <span class=\"sg\" data-s=\"2\">С <em>обектно-ориентираното програмиране<\/em> можете да създавате свои типове.<\/span> <span class=\"sg\" data-s=\"3\">Такъв тип се нарича <em>клас<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Стойност от такъв тип се нарича <em>обект<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да създадете клас, напишете ключовата дума <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След нея напишете име и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този клас <code>Dog<\/code> засега е празен.<\/span> <span class=\"sg\" data-s=\"1\">Но той вече е нов тип.<\/span> <span class=\"sg\" data-s=\"2\">Обект от клас се нарича още <em>екземпляр<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> е метод.<\/span> <span class=\"sg\" data-s=\"4\">За да създадете екземпляр, извикайте го върху името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега в променливата <code>$rex<\/code> има обект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всяко извикване на <code>new<\/code> създава нов, отделен обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> са две различни кучета.<\/span> <span class=\"sg\" data-s=\"1\">Класът е още празен, но кучетата са различни.<\/span> <span class=\"sg\" data-s=\"2\">В следващите раздели давате на класа собствени данни.<\/span> <span class=\"sg\" data-s=\"3\">Тези данни се наричат <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Класът получава и свое поведение, или действия.<\/span> <span class=\"sg\" data-s=\"5\">Тези действия се наричат <em>методи<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Първата тема разглежда по-отблизо класа и неговите екземпляри.<\/span> <span class=\"sg\" data-s=\"7\">Тя показва как се различават.<\/span><\/p>"]]},"eo":{"t":"Klasoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun vi uzis nur la tipojn, kiuj venas kun Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas nombroj, ĉenoj, tabeloj kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"2\">Per <em>objekt-orientita programado<\/em> vi povas fari viajn proprajn tipojn.<\/span> <span class=\"sg\" data-s=\"3\">Tia tipo nomiĝas <em>klaso<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Valoro de ĉi tiu tipo nomiĝas <em>objekto<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por fari klason, skribu la ŝlosilvorton <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post ĝi, skribu nomon kaj blokon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu klaso <code>Dog<\/code> nun estas malplena.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi jam estas nova tipo.<\/span> <span class=\"sg\" data-s=\"2\">Objekto de klaso ankaŭ nomiĝas <em>ekzemplero<\/em>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> estas metodo.<\/span> <span class=\"sg\" data-s=\"4\">Por fari ekzempleron, voku ĝin sur la nomo de la klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun la variablo <code>$rex<\/code> havas objekton <code>Dog<\/code> en si.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu voko de <code>new<\/code> faras novan, apartan objekton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> kaj <code>$fido<\/code> estas du malsamaj hundoj.<\/span> <span class=\"sg\" data-s=\"1\">La klaso estas ankoraŭ malplena, sed la hundoj estas malsamaj.<\/span> <span class=\"sg\" data-s=\"2\">En la sekvaj sekcioj, vi donas al klaso ĝiajn proprajn datumojn.<\/span> <span class=\"sg\" data-s=\"3\">Tiuj datumoj nomiĝas <em>atributoj<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Klaso ankaŭ ricevas sian propran konduton, aŭ agojn.<\/span> <span class=\"sg\" data-s=\"5\">Tiuj agoj nomiĝas <em>metodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">La unua temo rigardas pli detale klason kaj ĝiajn ekzemplerojn.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi montras, kiel ili diferencas.<\/span><\/p>"]]},"la":{"t":"Classes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Adhuc solum genera adhibuisti quae cum Raku veniunt.<\/span> <span class=\"sg\" data-s=\"1\">Haec sunt numeri, chordae, ordines et cetera.<\/span> <span class=\"sg\" data-s=\"2\">Per <em>programmationem ad obiecta directam<\/em> tua genera facere potes.<\/span> <span class=\"sg\" data-s=\"3\">Tale genus <em>classem<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"4\">Valorem huius generis <em>obiectum<\/em> appellamus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut classem facias, scribe verbum <code>class<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post id nomen et clausulam scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec classis <code>Dog<\/code> nunc vacua est.<\/span> <span class=\"sg\" data-s=\"1\">Sed iam novum genus est.<\/span> <span class=\"sg\" data-s=\"2\">Obiectum classis etiam <em>exemplar<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> est methodus.<\/span> <span class=\"sg\" data-s=\"4\">Ut exemplar facias, eam in nomine classis voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc variabilis <code>$rex<\/code> obiectum <code>Dog<\/code> continet.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque vocatio <code>new<\/code> novum et separatum obiectum facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> et <code>$fido<\/code> sunt duo diversi canes.<\/span> <span class=\"sg\" data-s=\"1\">Classis adhuc vacua est, sed canes diversi sunt.<\/span> <span class=\"sg\" data-s=\"2\">In sectionibus sequentibus classi propria data das.<\/span> <span class=\"sg\" data-s=\"3\">Haec data <em>attributa<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"4\">Classis etiam propriam agendi rationem accipit, id est actiones.<\/span> <span class=\"sg\" data-s=\"5\">Has actiones <em>methodos<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"6\">Primum argumentum classem et exemplaria eius propius inspicit.<\/span> <span class=\"sg\" data-s=\"7\">Ostendit quomodo differant.<\/span><\/p>"]]}}}</script>
