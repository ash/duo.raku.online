<script type="application/json" id="page-data">{"u":"oop/classes/type-object","n":770,"k":"topic","pv":"oop/classes","nx":"oop/classes/type-object/quiz","tr":["oop","oop/classes"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Type objects and instances","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">You can write a class name, such as <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This name means the <em>type object<\/em> of the class.<\/span> <span class=\"sg\" data-s=\"2\">The type object stands for the type itself.<\/span> <span class=\"sg\" data-s=\"3\">It is not one of the objects of this type.<\/span> <span class=\"sg\" data-s=\"4\">An <em>instance<\/em> is different.<\/span> <span class=\"sg\" data-s=\"5\">You make it with <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">It is a real object.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku sees the difference between them.<\/span> <span class=\"sg\" data-s=\"1\">The method <code>defined<\/code> returns <code>False<\/code> for a type object.<\/span> <span class=\"sg\" data-s=\"2\">It returns <code>True<\/code> for an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A type object has no real data.<\/span> <span class=\"sg\" data-s=\"1\">It only describes a type.<\/span> <span class=\"sg\" data-s=\"2\">So Raku says that it is <em>undefined<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">An instance is a real object.<\/span> <span class=\"sg\" data-s=\"4\">So it is <em>defined<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> shows the same type for both.<\/span> <span class=\"sg\" data-s=\"1\">You saw <code>WHAT<\/code> in the <a href=\"/advanced/containers/\">section about containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\  <span class=\"sg\" data-s=\"4\">Also ist sie <em>definiert<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> zeigt für beide den gleichen Typ.<\/span> <span class=\"sg\" data-s=\"1\">Sie haben <code>WHAT<\/code> im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a> gesehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku zeigt einen Typ in runden Klammern, wie <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also haben <code>Dog<\/code> und <code>Dog.new<\/code> den gleichen Typ, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie sind verschiedene Dinge.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> ist der Typ selbst.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> ist ein Objekt dieses Typs.<\/span><\/p>"]]},"nl":{"t":"Typeobjecten en instanties","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Je kunt een klassenaam schrijven, zoals <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Met deze naam bedoel je het <em>typeobject<\/em> van de klasse.<\/span> <span class=\"sg\" data-s=\"2\">Het typeobject staat voor het type zelf.<\/span> <span class=\"sg\" data-s=\"3\">Het is niet een van de objecten van dit type.<\/span> <span class=\"sg\" data-s=\"4\">Een <em>instantie<\/em> is anders.<\/span> <span class=\"sg\" data-s=\"5\">Je maakt die met <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Het is een echt object.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ziet het verschil tussen de twee.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>defined<\/code> geeft <code>False<\/code> terug voor een typeobject.<\/span> <span class=\"sg\" data-s=\"2\">Voor een instantie geeft ze <code>True<\/code> terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een typeobject heeft geen echte gegevens.<\/span> <span class=\"sg\" data-s=\"1\">Het beschrijft alleen een type.<\/span> <span class=\"sg\" data-s=\"2\">Dus zegt Raku dat het <em>ongedefinieerd<\/em> is.<\/span> <span class=\"sg\" data-s=\"3\">Een instantie is een echt object.<\/span> <span class=\"sg\" data-s=\"4\">Dus is ze <em>gedefinieerd<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> toont voor beide hetzelfde type.<\/span> <span class=\"sg\" data-s=\"1\">Je zag <code>WHAT<\/code> al in de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku toont een type tussen ronde haakjes, zoals <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus hebben <code>Dog<\/code> en <code>Dog.new<\/code> hetzelfde type, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar het zijn verschillende dingen.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> is het type zelf.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> is een object van dit type.<\/span><\/p>"]]},"es":{"t":"Objetos de tipo e instancias","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Puedes escribir el nombre de una clase, como <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Este nombre significa el <em>objeto de tipo<\/em> de la clase.<\/span> <span class=\"sg\" data-s=\"2\">El objeto de tipo representa al tipo mismo.<\/span> <span class=\"sg\" data-s=\"3\">No es uno de los objetos de este tipo.<\/span> <span class=\"sg\" data-s=\"4\">Una <em>instancia<\/em> es otra cosa.<\/span> <span class=\"sg\" data-s=\"5\">La creas con <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Es un objeto real.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ve la diferencia entre ellos.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>defined<\/code> devuelve <code>False<\/code> para un objeto de tipo.<\/span> <span class=\"sg\" data-s=\"2\">Devuelve <code>True<\/code> para una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un objeto de tipo no tiene datos reales.<\/span> <span class=\"sg\" data-s=\"1\">Solo describe un tipo.<\/span> <span class=\"sg\" data-s=\"2\">Así que Raku lo considera <em>no definido<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Una instancia es un objeto real.<\/span> <span class=\"sg\" data-s=\"4\">Así que está <em>definida<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> muestra el mismo tipo para los dos.<\/span> <span class=\"sg\" data-s=\"1\">Viste <code>WHAT<\/code> en la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku muestra un tipo entre paréntesis, como <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>Dog<\/code> y <code>Dog.new<\/code> tienen el mismo tipo, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero son cosas distintas.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> es el tipo mismo.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> es un objeto de este tipo.<\/span><\/p>"]]},"it":{"t":"Oggetti di tipo e istanze","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Puoi scrivere il nome di una classe, per esempio <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo nome indica l'<em>oggetto di tipo<\/em> della classe.<\/span> <span class=\"sg\" data-s=\"2\">L'oggetto di tipo rappresenta il tipo stesso.<\/span> <span class=\"sg\" data-s=\"3\">Non è uno degli oggetti di questo tipo.<\/span> <span class=\"sg\" data-s=\"4\">Un'<em>istanza<\/em> è diversa.<\/span> <span class=\"sg\" data-s=\"5\">La crei con <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">È un oggetto vero.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku vede la differenza tra i due.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>defined<\/code> restituisce <code>False<\/code> per un oggetto di tipo.<\/span> <span class=\"sg\" data-s=\"2\">Restituisce <code>True<\/code> per un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un oggetto di tipo non ha dati veri.<\/span> <span class=\"sg\" data-s=\"1\">Descrive solo un tipo.<\/span> <span class=\"sg\" data-s=\"2\">Così Raku dice che è <em>non definito<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Un'istanza è un oggetto vero.<\/span> <span class=\"sg\" data-s=\"4\">Quindi è <em>definita<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> mostra lo stesso tipo per tutti e due.<\/span> <span class=\"sg\" data-s=\"1\">Hai visto <code>WHAT<\/code> nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku mostra un tipo tra parentesi tonde, come <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>Dog<\/code> e <code>Dog.new<\/code> hanno lo stesso tipo, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma sono cose diverse.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> è il tipo stesso.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> è un oggetto di questo tipo.<\/span><\/p>"]]},"lv":{"t":"Tipa objekti un instances","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Jūs varat rakstīt klases nosaukumu, piemēram, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šis nosaukums nozīmē klases <em>tipa objektu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tipa objekts apzīmē pašu tipu.<\/span> <span class=\"sg\" data-s=\"3\">Tas nav viens no šī tipa objektiem.<\/span> <span class=\"sg\" data-s=\"4\">Bet <em>instance<\/em> ir kas cits.<\/span> <span class=\"sg\" data-s=\"5\">Jūs to veidojat ar <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tā ir īsts objekts.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku redz atšķirību starp tiem.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>defined<\/code> tipa objektam atgriež <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Instancei tā atgriež <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tipa objektam nav īstu datu.<\/span> <span class=\"sg\" data-s=\"1\">Tas tikai apraksta tipu.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc Raku saka, ka tas ir <em>nedefinēts<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Instance ir īsts objekts.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc tā ir <em>definēta<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> abiem rāda vienu un to pašu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs redzējāt <code>WHAT<\/code> <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku rāda tipu apaļās iekavās, piemēram, <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>Dog<\/code> un <code>Dog.new<\/code> tips ir viens un tas pats, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet tās ir dažādas lietas.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> ir pats tips.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> ir šī tipa objekts.<\/span><\/p>"]]},"ru":{"t":"Объекты типа и экземпляры","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Вы можете написать имя класса, например <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это имя означает <em>объект типа<\/em> этого класса.<\/span> <span class=\"sg\" data-s=\"2\">Объект типа обозначает сам тип.<\/span> <span class=\"sg\" data-s=\"3\">Это не один из объектов этого типа.<\/span> <span class=\"sg\" data-s=\"4\">С <em>экземпляром<\/em> всё иначе.<\/span> <span class=\"sg\" data-s=\"5\">Вы создаёте его с помощью <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Это настоящий объект.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku видит разницу между ними.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> возвращает <code>False<\/code> для объекта типа.<\/span> <span class=\"sg\" data-s=\"2\">Для экземпляра он возвращает <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У объекта типа нет настоящих данных.<\/span> <span class=\"sg\" data-s=\"1\">Он только описывает тип.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому Raku называет его <em>неопределённым<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Экземпляр — это настоящий объект.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому он <em>определён<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> показывает для обоих один и тот же тип.<\/span> <span class=\"sg\" data-s=\"1\">Вы видели <code>WHAT<\/code> в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku показывает тип в круглых скобках, например <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значит, у <code>Dog<\/code> и <code>Dog.new<\/code> один и тот же тип, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но это разные вещи.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> — это сам тип.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> — это объект этого типа.<\/span><\/p>"]]},"uk":{"t":"Об'єкти типу та екземпляри","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ви можете написати ім'я класу, наприклад <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це ім'я означає <em>об'єкт типу<\/em> цього класу.<\/span> <span class=\"sg\" data-s=\"2\">Об'єкт типу представляє сам тип.<\/span> <span class=\"sg\" data-s=\"3\">Це не один з об'єктів цього типу.<\/span> <span class=\"sg\" data-s=\"4\">З <em>екземпляром<\/em> усе інакше.<\/span> <span class=\"sg\" data-s=\"5\">Ви створюєте його через <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Це справжній об'єкт.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku бачить різницю між ними.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> повертає <code>False<\/code> для об'єкта типу.<\/span> <span class=\"sg\" data-s=\"2\">Він повертає <code>True<\/code> для екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Об'єкт типу не має справжніх даних.<\/span> <span class=\"sg\" data-s=\"1\">Він лише описує тип.<\/span> <span class=\"sg\" data-s=\"2\">Тому Raku каже, що він <em>невизначений<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Екземпляр — це справжній об'єкт.<\/span> <span class=\"sg\" data-s=\"4\">Тому він <em>визначений<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> показує для обох той самий тип.<\/span> <span class=\"sg\" data-s=\"1\">Ви бачили <code>WHAT<\/code> у <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku показує тип у круглих дужках, як <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>Dog<\/code> і <code>Dog.new<\/code> мають той самий тип, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але це різні речі.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> — це сам тип.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> — це об'єкт цього типу.<\/span><\/p>"]]},"bg":{"t":"Обекти на типа и екземпляри","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Можете да напишете име на клас, например <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това име означава <em>обекта на типа<\/em> на класа.<\/span> <span class=\"sg\" data-s=\"2\">Обектът на типа представя самия тип.<\/span> <span class=\"sg\" data-s=\"3\">Той не е един от обектите от този тип.<\/span> <span class=\"sg\" data-s=\"4\">А <em>екземплярът<\/em> е нещо друго.<\/span> <span class=\"sg\" data-s=\"5\">Създавате го с <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Той е истински обект.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku вижда разликата между тях.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>defined<\/code> връща <code>False<\/code> за обект на типа.<\/span> <span class=\"sg\" data-s=\"2\">Той връща <code>True<\/code> за екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обектът на типа няма истински данни.<\/span> <span class=\"sg\" data-s=\"1\">Той само описва тип.<\/span> <span class=\"sg\" data-s=\"2\">Затова Raku казва, че той е <em>недефиниран<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Екземплярът е истински обект.<\/span> <span class=\"sg\" data-s=\"4\">Затова той е <em>дефиниран<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> показва един и същ тип и за двете.<\/span> <span class=\"sg\" data-s=\"1\">Видяхте <code>WHAT<\/code> в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku показва типа в кръгли скоби, като <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значи <code>Dog<\/code> и <code>Dog.new<\/code> имат един и същ тип, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но те са различни неща.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> е самият тип.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> е обект от този тип.<\/span><\/p>"]]},"eo":{"t":"Tipobjektoj kaj ekzempleroj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Vi povas skribi nomon de klaso, ekzemple <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu nomo signifas la <em>tipobjekton<\/em> de la klaso.<\/span> <span class=\"sg\" data-s=\"2\">La tipobjekto reprezentas la tipon mem.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne estas unu el la objektoj de ĉi tiu tipo.<\/span> <span class=\"sg\" data-s=\"4\">La <em>ekzemplero<\/em> estas alia afero.<\/span> <span class=\"sg\" data-s=\"5\">Vi faras ĝin per <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi estas vera objekto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku vidas la diferencon inter ili.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>defined<\/code> redonas <code>False<\/code> por tipobjekto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi redonas <code>True<\/code> por ekzemplero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tipobjekto ne havas verajn datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi nur priskribas tipon.<\/span> <span class=\"sg\" data-s=\"2\">Do Raku diras, ke ĝi estas <em>nedifinita<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemplero estas vera objekto.<\/span> <span class=\"sg\" data-s=\"4\">Do ĝi estas <em>difinita<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> montras la saman tipon por ambaŭ.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidis <code>WHAT<\/code> en la <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sekcio pri ujoj<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku montras tipon en rondaj krampoj, kiel <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>Dog<\/code> kaj <code>Dog.new<\/code> havas la saman tipon, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed ili estas malsamaj aferoj.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> estas la tipo mem.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> estas objekto de ĉi tiu tipo.<\/span><\/p>"]]},"la":{"t":"Obiecta generis et exempla","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Nomen classis scribere potes, sicut <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc nomen <em>obiectum generis<\/em> classis significat.<\/span> <span class=\"sg\" data-s=\"2\">Obiectum generis ipsum genus repraesentat.<\/span> <span class=\"sg\" data-s=\"3\">Non est unum ex obiectis huius generis.<\/span> <span class=\"sg\" data-s=\"4\">Sed <em>exemplar<\/em> aliud est.<\/span> <span class=\"sg\" data-s=\"5\">Id per <code>new<\/code> facis.<\/span> <span class=\"sg\" data-s=\"6\">Verum obiectum est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku differentiam inter ea videt.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>defined<\/code> pro obiecto generis <code>False<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"2\">Pro exemplari <code>True<\/code> reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Obiectum generis nulla vera data habet.<\/span> <span class=\"sg\" data-s=\"1\">Solum genus describit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Raku id <em>indefinitum<\/em> appellat.<\/span> <span class=\"sg\" data-s=\"3\">Exemplar verum obiectum est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque <em>definitum<\/em> est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> pro utroque idem genus ostendit.<\/span> <span class=\"sg\" data-s=\"1\"><code>WHAT<\/code> in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de receptaculis<\/a> vidisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku genus in parenthesibus ostendit, sicut <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>Dog<\/code> et <code>Dog.new<\/code> idem genus habent, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed diversae res sunt.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> est ipsum genus.<\/span> <span class=\"sg\" data-s=\"4\"><code>Dog.new<\/code> est obiectum huius generis.<\/span><\/p>"]]}}}</script>
