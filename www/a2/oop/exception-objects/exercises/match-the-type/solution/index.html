 è un valore con dentro un errore. Aspetta finché non lo usi. Raku solleva l'eccezione solo quando <em>usiamo<\/em> il valore. Qui proviamo a farne <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'eccezione sollevata ha il tipo incorporato <code>X::Numeric::DivideByZero<\/code>. Il ramo <code>when X::Numeric::DivideByZero<\/code> corrisponde proprio a questo tipo. Qui confronti un tipo preciso. Non intercetti tutto con <code>default<\/code>. Così puoi gestire ogni genere di errore a modo suo.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Saskaņojiet tipu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 1 / 0;\n    say $x;\n\n    CATCH {\n        when X::Numeric::DivideByZero {\n            say 'cannot divide by zero';\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/exception-objects/match-the-type.raku\" target=\"_blank\" rel=\"noopener\">match-the-type.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>cannot divide by zero<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku valodā <code>1 / 0<\/code> neavarē uzreiz. Tas dod slinku <code>Failure<\/code>. <code>Failure<\/code> ir vērtība ar kļūdu iekšā. Tas gaida, līdz jūs to izmantojat. Raku izmet izņēmumu tikai tad, kad mēs vērtību <em>izmantojam<\/em>. Šeit mēs mēģinām to izdrukāt ar <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izmestajam izņēmumam ir iebūvētais tips <code>X::Numeric::DivideByZero<\/code>. Zars <code>when X::Numeric::DivideByZero<\/code> atbilst t
