<script type="application/json" id="page-data">{"u":"oop/exception-objects","n":943,"k":"section","pv":"oop/catch/quiz","nx":"oop/exception-objects/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exception objects","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">An exception describes an error in the program.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, it is an object, like every other object.<\/span> <span class=\"sg\" data-s=\"2\">You write <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Then Raku puts your message into an exception object.<\/span> <span class=\"sg\" data-s=\"4\">The type of this object is <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A <code>CATCH<\/code> block catches the exception.<\/span> <span class=\"sg\" data-s=\"1\">Inside it, you can look at this object.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> gives its type.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> gives its text:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The type is useful.<\/span> <span class=\"sg\" data-s=\"1\">With it, you can treat each error in its own way.<\/span> <span class=\"sg\" data-s=\"2\">Each built-in exception in Raku has its own type.<\/span> <span class=\"sg\" data-s=\"3\">The names of these types start with <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">You can match these types with <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">You did the same with values in a <code>given<\/code>/<code>when<\/code> block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This prints <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This happens because the exception matches the type <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">To handle a certain kind of error, you match its type.<\/span> <span class=\"sg\" data-s=\"3\">This is the basic idea.<\/span> <span class=\"sg\" data-s=\"4\">The section about <a href=\"/oop/custom-exceptions/\">custom exceptions<\/a> builds on it.<\/span><\/p>"]]},"de":{"t":"Ausnahmeobjekte","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme beschreibt einen Fehler im Programm.<\/span> <span class=\"sg\" data-s=\"1\">In Raku ist sie ein Objekt, wie jedes andere Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Sie schreiben <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dann packt Raku Ihre Meldung in ein Ausnahmeobjekt.<\/span> <span class=\"sg\" data-s=\"4\">Der Typ dieses Objekts ist <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <code>CATCH<\/code>-Block fängt die Ausnahme.<\/span> <span class=\"sg\" data-s=\"1\">Darin können Sie sich dieses Objekt ansehen.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> gibt Ihnen seinen Typ.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> gibt Ihnen seinen Text:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Der Typ ist nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Mit ihm können Sie jeden Fehler auf seine eigene Weise behandeln.<\/span> <span class=\"sg\" data-s=\"2\">Jede eingebaute Ausnahme in Raku hat ihren eigenen Typ.<\/span> <span class=\"sg\" data-s=\"3\">Die Namen dieser Typen beginnen mit <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Mit <code>when<\/code> können Sie auf diese Typen prüfen.<\/span> <span class=\"sg\" data-s=\"5\">Dasselbe haben Sie mit Werten in einem <code>given<\/code>/<code>when<\/code>-Block gemacht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das gibt <code>an ad-hoc error: something failed<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Denn die Ausnahme passt auf den Typ <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Um eine bestimmte Art von Fehler zu behandeln, prüfen Sie auf ihren Typ.<\/span> <span class=\"sg\" data-s=\"3\">Das ist die Grundidee.<\/span> <span class=\"sg\" data-s=\"4\">Der Abschnitt über <a href=\"https://course.raku.org/de/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigene Ausnahmen<\/a> baut darauf auf.<\/span><\/p>"]]},"nl":{"t":"Exceptieobjecten","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een exceptie beschrijft een fout in het programma.<\/span> <span class=\"sg\" data-s=\"1\">In Raku is ze een object, net als elk ander object.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dan zet Raku je melding in een exceptieobject.<\/span> <span class=\"sg\" data-s=\"4\">Het type van dit object is <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <code>CATCH<\/code>-blok vangt de exceptie.<\/span> <span class=\"sg\" data-s=\"1\">Daarin kun je naar dit object kijken.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> geeft zijn type.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> geeft zijn tekst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Het type is handig.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kun je elke fout op een eigen manier behandelen.<\/span> <span class=\"sg\" data-s=\"2\">Elke ingebouwde exceptie in Raku heeft een eigen type.<\/span> <span class=\"sg\" data-s=\"3\">De namen van deze typen beginnen met <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt deze typen matchen met <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Je deed hetzelfde met waarden in een <code>given<\/code>/<code>when<\/code>-blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit drukt <code>an ad-hoc error: something failed<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt omdat de exceptie op het type <code>X::AdHoc<\/code> matcht.<\/span> <span class=\"sg\" data-s=\"2\">Om een bepaalde soort fout af te handelen, match je haar type.<\/span> <span class=\"sg\" data-s=\"3\">Dat is het basisidee.<\/span> <span class=\"sg\" data-s=\"4\">De sectie over <a href=\"https://course.raku.org/nl/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigen excepties<\/a> bouwt erop voort.<\/span><\/p>"]]},"es":{"t":"Objetos de excepción","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una excepción describe un error en el programa.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, es un objeto, como cualquier otro objeto.<\/span> <span class=\"sg\" data-s=\"2\">Escribes <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Entonces Raku pone tu mensaje en un objeto de excepción.<\/span> <span class=\"sg\" data-s=\"4\">El tipo de este objeto es <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>CATCH<\/code> captura la excepción.<\/span> <span class=\"sg\" data-s=\"1\">Dentro de él, puedes mirar este objeto.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> da su tipo.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> da su texto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El tipo es útil.<\/span> <span class=\"sg\" data-s=\"1\">Con él, puedes tratar cada error a su manera.<\/span> <span class=\"sg\" data-s=\"2\">Cada excepción incorporada de Raku tiene su propio tipo.<\/span> <span class=\"sg\" data-s=\"3\">Los nombres de estos tipos empiezan por <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Con <code>when<\/code>, puedes comparar con estos tipos.<\/span> <span class=\"sg\" data-s=\"5\">Hiciste lo mismo con valores en un bloque <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pasa porque la excepción coincide con el tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Para manejar una clase concreta de error, comparas con su tipo.<\/span> <span class=\"sg\" data-s=\"3\">Esta es la idea básica.<\/span> <span class=\"sg\" data-s=\"4\">La sección sobre <a href=\"https://course.raku.org/es/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">excepciones personalizadas<\/a> se basa en ella.<\/span><\/p>"]]},"it":{"t":"Oggetti eccezione","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un'eccezione descrive un errore nel programma.<\/span> <span class=\"sg\" data-s=\"1\">In Raku è un oggetto, come ogni altro oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora Raku mette il tuo messaggio in un oggetto eccezione.<\/span> <span class=\"sg\" data-s=\"4\">Il tipo di questo oggetto è <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>CATCH<\/code> intercetta l'eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Dentro il blocco puoi guardare questo oggetto.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> dà il suo tipo.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> dà il suo testo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il tipo è utile.<\/span> <span class=\"sg\" data-s=\"1\">Con il tipo puoi trattare ogni errore a modo suo.<\/span> <span class=\"sg\" data-s=\"2\">Ogni eccezione incorporata di Raku ha il suo tipo.<\/span> <span class=\"sg\" data-s=\"3\">I nomi di questi tipi cominciano con <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Puoi confrontare questi tipi con <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Hai fatto lo stesso con i valori in un blocco <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Succede perché l'eccezione corrisponde al tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per gestire un certo genere di errore, confronti il suo tipo.<\/span> <span class=\"sg\" data-s=\"3\">Questa è l'idea di base.<\/span> <span class=\"sg\" data-s=\"4\">La sezione sulle <a href=\"https://course.raku.org/it/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eccezioni personalizzate<\/a> parte da questa idea.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu objekti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Izņēmums apraksta kļūdu programmā.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā tas ir objekts, tāpat kā jebkurš cits objekts.<\/span> <span class=\"sg\" data-s=\"2\">Jūs rakstāt <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad Raku ieliek jūsu paziņojumu izņēmuma objektā.<\/span> <span class=\"sg\" data-s=\"4\">Šī objekta tips ir <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>CATCH<\/code> noķer izņēmumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā iekšā jūs varat apskatīt šo objektu.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> dod tā tipu.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> dod tā tekstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tips ir noderīgs.<\/span> <span class=\"sg\" data-s=\"1\">Ar to jūs varat apstrādāt katru kļūdu savā veidā.<\/span> <span class=\"sg\" data-s=\"2\">Katram iebūvētajam izņēmumam Raku valodā ir savs tips.<\/span> <span class=\"sg\" data-s=\"3\">Šo tipu nosaukumi sākas ar <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ar <code>when<\/code> jūs varat salīdzināt ar šiem tipiem.<\/span> <span class=\"sg\" data-s=\"5\">To pašu jūs darījāt ar vērtībām blokā <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā notiek, jo izņēmums atbilst tipam <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lai apstrādātu noteiktu kļūdas veidu, jūs salīdzināt ar tās tipu.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir pamata ideja.<\/span> <span class=\"sg\" data-s=\"4\">Sadaļa par <a href=\"https://course.raku.org/lv/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">pašu definētiem izņēmumiem<\/a> būvē uz tās.<\/span><\/p>"]]},"ru":{"t":"Объекты исключений","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Исключение описывает ошибку в программе.<\/span> <span class=\"sg\" data-s=\"1\">В Raku это объект, как и любой другой объект.<\/span> <span class=\"sg\" data-s=\"2\">Вы пишете <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда Raku кладёт ваше сообщение в объект исключения.<\/span> <span class=\"sg\" data-s=\"4\">Тип этого объекта — <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>CATCH<\/code> перехватывает исключение.<\/span> <span class=\"sg\" data-s=\"1\">Внутри него можно посмотреть на этот объект.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> даёт его тип.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> даёт его текст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Знать тип полезно.<\/span> <span class=\"sg\" data-s=\"1\">С ним можно обрабатывать каждую ошибку по-своему.<\/span> <span class=\"sg\" data-s=\"2\">У каждого встроенного исключения в Raku есть свой тип.<\/span> <span class=\"sg\" data-s=\"3\">Имена этих типов начинаются с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Эти типы можно сопоставлять через <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вы делали то же самое со значениями в блоке <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Программа печатает <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так происходит, потому что исключение совпадает с типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы обработать определённый вид ошибки, вы сопоставляете его тип.<\/span> <span class=\"sg\" data-s=\"3\">Это основная идея.<\/span> <span class=\"sg\" data-s=\"4\">На ней строится раздел о <a href=\"https://course.raku.org/ru/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собственных исключениях<\/a>.<\/span><\/p>"]]},"uk":{"t":"Об'єкти винятків","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Виняток описує помилку в програмі.<\/span> <span class=\"sg\" data-s=\"1\">У Raku це об'єкт, як і кожен інший об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді Raku кладе ваше повідомлення в об'єкт винятку.<\/span> <span class=\"sg\" data-s=\"4\">Тип цього об'єкта — <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>CATCH<\/code> перехоплює виняток.<\/span> <span class=\"sg\" data-s=\"1\">Усередині нього можна подивитися на цей об'єкт.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> дає його тип.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> дає його текст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тип корисний.<\/span> <span class=\"sg\" data-s=\"1\">З ним ви можете поводитися з кожною помилкою по-своєму.<\/span> <span class=\"sg\" data-s=\"2\">Кожен вбудований виняток у Raku має свій тип.<\/span> <span class=\"sg\" data-s=\"3\">Імена цих типів починаються з <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ці типи можна зіставляти через <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Те саме ви робили зі значеннями в блоці <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так стається, бо виняток збігається з типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб обробити певний вид помилки, ви зіставляєте його тип.<\/span> <span class=\"sg\" data-s=\"3\">Це основна ідея.<\/span> <span class=\"sg\" data-s=\"4\">Розділ про <a href=\"https://course.raku.org/uk/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">власні винятки<\/a> будується на ній.<\/span><\/p>"]]},"bg":{"t":"Обекти на изключенията","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Изключението описва грешка в програмата.<\/span> <span class=\"sg\" data-s=\"1\">В Raku то е обект, като всеки друг обект.<\/span> <span class=\"sg\" data-s=\"2\">Вие пишете <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава Raku слага вашето съобщение в обект на изключение.<\/span> <span class=\"sg\" data-s=\"4\">Типът на този обект е <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>CATCH<\/code> прихваща изключението.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в него можете да разгледате този обект.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> дава типа му.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> дава текста му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Типът е полезен.<\/span> <span class=\"sg\" data-s=\"1\">С него можете да третирате всяка грешка по свой начин.<\/span> <span class=\"sg\" data-s=\"2\">Всяко вградено изключение в Raku има свой тип.<\/span> <span class=\"sg\" data-s=\"3\">Имената на тези типове започват с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Можете да съпоставяте тези типове с <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Правихте същото със стойности в блок <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това става, защото изключението съвпада с типа <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За да обработите определен вид грешка, съпоставяте нейния тип.<\/span> <span class=\"sg\" data-s=\"3\">Това е основната идея.<\/span> <span class=\"sg\" data-s=\"4\">Разделът за <a href=\"https://course.raku.org/bg/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собствените изключения<\/a> се основава на нея.<\/span><\/p>"]]},"eo":{"t":"Esceptobjektoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Escepto priskribas eraron en la programo.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, ĝi estas objekto, kiel ĉiu alia objekto.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam Raku metas vian mesaĝon en esceptobjekton.<\/span> <span class=\"sg\" data-s=\"4\">La tipo de ĉi tiu objekto estas <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloko <code>CATCH<\/code> kaptas la escepton.<\/span> <span class=\"sg\" data-s=\"1\">Ene de ĝi, vi povas rigardi ĉi tiun objekton.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> donas ĝian tipon.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> donas ĝian tekston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La tipo estas utila.<\/span> <span class=\"sg\" data-s=\"1\">Per ĝi, vi povas trakti ĉiun eraron laŭ ĝia propra maniero.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu enkonstruita escepto en Raku havas sian propran tipon.<\/span> <span class=\"sg\" data-s=\"3\">La nomoj de ĉi tiuj tipoj komenciĝas per <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas kongrui kun ĉi tiuj tipoj per <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vi faris la samon kun valoroj en bloko <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio presas <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, ĉar la escepto kongruas kun la tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por trakti certan specon de eraro, vi kongruas kun ĝia tipo.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas la baza ideo.<\/span> <span class=\"sg\" data-s=\"4\">La sekcio pri <a href=\"https://course.raku.org/eo/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">propraj esceptoj<\/a> konstruas sur ĝi.<\/span><\/p>"]]},"la":{"t":"Obiecta exceptionum","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Exceptio errorem in programmate describit.<\/span> <span class=\"sg\" data-s=\"1\">In Raku obiectum est, sicut omne aliud obiectum.<\/span> <span class=\"sg\" data-s=\"2\">Scribis <code>die 'something failed'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tum Raku nuntium tuum in obiectum exceptionis ponit.<\/span> <span class=\"sg\" data-s=\"4\">Genus huius obiecti est <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Clausula <code>CATCH<\/code> exceptionem capit.<\/span> <span class=\"sg\" data-s=\"1\">Intra eam hoc obiectum inspicere potes.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> genus eius dat.<\/span> <span class=\"sg\" data-s=\"3\"><code>.message<\/code> textum eius dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Genus utile est.<\/span> <span class=\"sg\" data-s=\"1\">Per id quemque errorem suo modo tractare potes.<\/span> <span class=\"sg\" data-s=\"2\">Quaeque exceptio inbuilta in Raku suum genus habet.<\/span> <span class=\"sg\" data-s=\"3\">Nomina horum generum ab <code>X::<\/code> incipiunt.<\/span> <span class=\"sg\" data-s=\"4\">Haec genera per <code>when<\/code> comparare potes.<\/span> <span class=\"sg\" data-s=\"5\">Idem cum valoribus in clausula <code>given<\/code>/<code>when<\/code> fecisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc <code>an ad-hoc error: something failed<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit quia exceptio generi <code>X::AdHoc<\/code> convenit.<\/span> <span class=\"sg\" data-s=\"2\">Ut certum genus erroris tractes, genus eius comparas.<\/span> <span class=\"sg\" data-s=\"3\">Haec est idea fundamentalis.<\/span> <span class=\"sg\" data-s=\"4\">Sectio de <a href=\"https://course.raku.org/la/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">exceptionibus propriis<\/a> super eam aedificat.<\/span><\/p>"]]}}}</script>
