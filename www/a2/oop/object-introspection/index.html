<script type="application/json" id="page-data">{"u":"oop/object-introspection","n":839,"k":"section","pv":"oop/roles/exercises/dancing-robot/solution","nx":"oop/object-introspection/inheritance-chain","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Introspecting objects","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/advanced/containers/\">section about containers<\/a>, you used <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">With it, you asked a value for its type.<\/span> <span class=\"sg\" data-s=\"2\">The same <code>.^<\/code> meta-calls also work with classes and objects.<\/span> <span class=\"sg\" data-s=\"3\">With them, you can see their names and their attributes.<\/span> <span class=\"sg\" data-s=\"4\">You can also see their place in the tree of classes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A meta-method is a method that you call with <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The meta-method <code>.^name<\/code> returns the name of the class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The meta-method <code>.^attributes<\/code> lists the attributes of the class.<\/span> <span class=\"sg\" data-s=\"1\">For each attribute, you see its type.<\/span> <span class=\"sg\" data-s=\"2\">You also see its inner private name.<\/span> <span class=\"sg\" data-s=\"3\">This is the <code>$!<\/code> form.<\/span> <span class=\"sg\" data-s=\"4\">You saw it with <a href=\"/oop/methods/private-attributes/\">private attributes<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspection means that you ask an object about itself.<\/span> <span class=\"sg\" data-s=\"1\">It is useful for tools that work with any kind of object.<\/span> <span class=\"sg\" data-s=\"2\">For example, a tool can print every attribute of an object.<\/span> <span class=\"sg\" data-s=\"3\">It does not need to know the class of the object first.<\/span> <span class=\"sg\" data-s=\"4\">The next topic is about the inheritance chain of a class.<\/span> <span class=\"sg\" data-s=\"5\">This is the line of its parent classes.<\/span><\/p>"]]},"de":{"t":"Objekte inspizieren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a> haben Sie <code>.^name<\/code> benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Damit haben Sie einen Wert nach seinem Typ gefragt.<\/span> <span class=\"sg\" data-s=\"2\">Dieselben Meta-Aufrufe mit <code>.^<\/code> funktionieren auch mit Klassen und Objekten.<\/span> <span class=\"sg\" data-s=\"3\">Mit ihnen sehen Sie ihre Namen und ihre Attribute.<\/span> <span class=\"sg\" data-s=\"4\">Sie sehen auch ihren Platz im Baum der Klassen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Metamethode ist eine Methode, die Sie mit <code>.^<\/code> aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Die Metamethode <code>.^name<\/code> gibt den Namen der Klasse zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die Metamethode <code>.^attributes<\/code> listet die Attribute der Klasse auf.<\/span> <span class=\"sg\" data-s=\"1\">Für jedes Attribut sehen Sie seinen Typ.<\/span> <span class=\"sg\" data-s=\"2\">Sie sehen auch seinen inneren privaten Namen.<\/span> <span class=\"sg\" data-s=\"3\">Das ist die Form mit <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sie haben sie bei den <a href=\"https://course.raku.org/de/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privaten Attributen<\/a> gesehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspektion heißt: Sie fragen ein Objekt nach sich selbst.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist nützlich für Werkzeuge, die mit jeder Art von Objekt arbeiten.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann ein Werkzeug jedes Attribut eines Objekts ausgeben.<\/span> <span class=\"sg\" data-s=\"3\">Es muss die Klasse des Objekts vorher nicht kennen.<\/span> <span class=\"sg\" data-s=\"4\">Im nächsten Thema geht es um die Vererbungskette einer Klasse.<\/span> <span class=\"sg\" data-s=\"5\">Das ist die Linie ihrer Elternklassen.<\/span><\/p>"]]},"nl":{"t":"Objecten introspecteren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a> gebruikte je <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee vroeg je een waarde naar haar type.<\/span> <span class=\"sg\" data-s=\"2\">Dezelfde meta-aanroepen met <code>.^<\/code> werken ook met klassen en objecten.<\/span> <span class=\"sg\" data-s=\"3\">Daarmee kun je hun namen en hun attributen zien.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt ook hun plaats in de boom van klassen zien.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een metamethode is een methode die je aanroept met <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De metamethode <code>.^name<\/code> geeft de naam van de klasse terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De metamethode <code>.^attributes<\/code> geeft een lijst van de attributen van de klasse.<\/span> <span class=\"sg\" data-s=\"1\">Bij elk attribuut zie je zijn type.<\/span> <span class=\"sg\" data-s=\"2\">Je ziet ook zijn interne private naam.<\/span> <span class=\"sg\" data-s=\"3\">Dat is de vorm met <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Je zag die bij <a href=\"https://course.raku.org/nl/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">private attributen<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspectie betekent dat je een object vraagt naar zichzelf.<\/span> <span class=\"sg\" data-s=\"1\">Het is nuttig voor tools die met elke soort object werken.<\/span> <span class=\"sg\" data-s=\"2\">Een tool kan bijvoorbeeld elk attribuut van een object afdrukken.<\/span> <span class=\"sg\" data-s=\"3\">De tool hoeft de klasse van het object niet eerst te kennen.<\/span> <span class=\"sg\" data-s=\"4\">Het volgende onderwerp gaat over de overervingsketen van een klasse.<\/span> <span class=\"sg\" data-s=\"5\">Dat is de lijn van haar ouderklassen.<\/span><\/p>"]]},"es":{"t":"Introspección de objetos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a>, usaste <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con él, le preguntaste a un valor por su tipo.<\/span> <span class=\"sg\" data-s=\"2\">Las mismas metallamadas <code>.^<\/code> también funcionan con clases y objetos.<\/span> <span class=\"sg\" data-s=\"3\">Con ellas, puedes ver sus nombres y sus atributos.<\/span> <span class=\"sg\" data-s=\"4\">También puedes ver su lugar en el árbol de clases.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metamétodo es un método que llamas con <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El metamétodo <code>.^name<\/code> devuelve el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El metamétodo <code>.^attributes<\/code> da la lista de los atributos de la clase.<\/span> <span class=\"sg\" data-s=\"1\">Para cada atributo, ves su tipo.<\/span> <span class=\"sg\" data-s=\"2\">También ves su nombre privado interno.<\/span> <span class=\"sg\" data-s=\"3\">Es la forma <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La conociste con los <a href=\"https://course.raku.org/es/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">atributos privados<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspección significa que preguntas a un objeto por sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Es útil para herramientas que trabajan con cualquier clase de objeto.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, una herramienta puede imprimir cada atributo de un objeto.<\/span> <span class=\"sg\" data-s=\"3\">No necesita saber antes la clase del objeto.<\/span> <span class=\"sg\" data-s=\"4\">El tema siguiente trata de la cadena de herencia de una clase.<\/span> <span class=\"sg\" data-s=\"5\">Es la línea de sus clases padre.<\/span><\/p>"]]},"it":{"t":"Introspezione degli oggetti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a> hai usato <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con questo hai chiesto a un valore il suo tipo.<\/span> <span class=\"sg\" data-s=\"2\">Le stesse metachiamate <code>.^<\/code> funzionano anche con classi e oggetti.<\/span> <span class=\"sg\" data-s=\"3\">Con queste puoi vedere i loro nomi e i loro attributi.<\/span> <span class=\"sg\" data-s=\"4\">Puoi anche vedere il loro posto nell'albero delle classi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metametodo è un metodo che chiami con <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il metametodo <code>.^name<\/code> restituisce il nome della classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il metametodo <code>.^attributes<\/code> elenca gli attributi della classe.<\/span> <span class=\"sg\" data-s=\"1\">Per ogni attributo vedi il suo tipo.<\/span> <span class=\"sg\" data-s=\"2\">Vedi anche il suo nome privato interno.<\/span> <span class=\"sg\" data-s=\"3\">È la forma <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">L'hai vista con gli <a href=\"https://course.raku.org/it/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">attributi privati<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">L'introspezione vuol dire che fai domande a un oggetto su se stesso.<\/span> <span class=\"sg\" data-s=\"1\">È utile per gli strumenti che lavorano con ogni tipo di oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, uno strumento può stampare ogni attributo di un oggetto.<\/span> <span class=\"sg\" data-s=\"3\">Non deve conoscere prima la classe dell'oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Il prossimo argomento parla della catena di ereditarietà di una classe.<\/span> <span class=\"sg\" data-s=\"5\">È la linea delle sue classi genitrici.<\/span><\/p>"]]},"lv":{"t":"Objektu introspekcija","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Sadaļā par konteineriem<\/a> jūs lietojāt <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ar to jūs pajautājāt vērtībai tās tipu.<\/span> <span class=\"sg\" data-s=\"2\">Tie paši <code>.^<\/code> metaizsaukumi strādā arī ar klasēm un objektiem.<\/span> <span class=\"sg\" data-s=\"3\">Ar tiem jūs varat redzēt to nosaukumus un atribūtus.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat redzēt arī to vietu klašu kokā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metametode ir metode, ko jūs izsaucat ar <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Metametode <code>.^name<\/code> atgriež klases nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Metametode <code>.^attributes<\/code> uzskaita klases atribūtus.<\/span> <span class=\"sg\" data-s=\"1\">Katram atribūtam jūs redzat tā tipu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs redzat arī tā iekšējo privāto nosaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir <code>$!<\/code> forma.<\/span> <span class=\"sg\" data-s=\"4\">Jūs to redzējāt pie <a href=\"https://course.raku.org/lv/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privātiem atribūtiem<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspekcija nozīmē, ka jūs jautājat objektam, kāds tas ir.<\/span> <span class=\"sg\" data-s=\"1\">Tā noder rīkiem, kas strādā ar jebkura veida objektiem.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, rīks var izdrukāt katru objekta atribūtu.<\/span> <span class=\"sg\" data-s=\"3\">Tam nav vispirms jāzina objekta klase.<\/span> <span class=\"sg\" data-s=\"4\">Nākamais temats ir par klases mantošanas ķēdi.<\/span> <span class=\"sg\" data-s=\"5\">Tā ir tās vecākklašu līnija.<\/span><\/p>"]]},"ru":{"t":"Интроспекция объектов","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a> вы использовали <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С его помощью вы спрашивали у значения его тип.<\/span> <span class=\"sg\" data-s=\"2\">Те же метавызовы <code>.^<\/code> работают и с классами и объектами.<\/span> <span class=\"sg\" data-s=\"3\">С ними можно увидеть их имена и их атрибуты.<\/span> <span class=\"sg\" data-s=\"4\">Ещё можно увидеть их место в дереве классов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметод — это метод, который вы вызываете через <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^name<\/code> возвращает имя класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перечисляет атрибуты класса.<\/span> <span class=\"sg\" data-s=\"1\">Для каждого атрибута вы видите его тип.<\/span> <span class=\"sg\" data-s=\"2\">Ещё вы видите его внутреннее приватное имя.<\/span> <span class=\"sg\" data-s=\"3\">Это форма с <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вы видели её в <a href=\"https://course.raku.org/ru/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватных атрибутах<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Интроспекция значит, что вы спрашиваете объект о нём самом.<\/span> <span class=\"sg\" data-s=\"1\">Она полезна для инструментов, которые работают с любыми объектами.<\/span> <span class=\"sg\" data-s=\"2\">Например, инструмент может напечатать каждый атрибут объекта.<\/span> <span class=\"sg\" data-s=\"3\">Ему не нужно заранее знать класс объекта.<\/span> <span class=\"sg\" data-s=\"4\">Следующая тема — о цепочке наследования класса.<\/span> <span class=\"sg\" data-s=\"5\">Это линия его родительских классов.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція об'єктів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a> ви користувалися <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">З ним ви питали значення про його тип.<\/span> <span class=\"sg\" data-s=\"2\">Ті самі метавиклики <code>.^<\/code> працюють і з класами та об'єктами.<\/span> <span class=\"sg\" data-s=\"3\">З ними можна побачити їхні імена та атрибути.<\/span> <span class=\"sg\" data-s=\"4\">Також можна побачити їхнє місце в дереві класів.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметод — це метод, який ви викликаєте через <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^name<\/code> повертає ім'я класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перелічує атрибути класу.<\/span> <span class=\"sg\" data-s=\"1\">Для кожного атрибута ви бачите його тип.<\/span> <span class=\"sg\" data-s=\"2\">Ви також бачите його внутрішнє приватне ім'я.<\/span> <span class=\"sg\" data-s=\"3\">Це форма <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ви бачили її в темі про <a href=\"https://course.raku.org/uk/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватні атрибути<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Інтроспекція означає, що ви питаєте об'єкт про нього самого.<\/span> <span class=\"sg\" data-s=\"1\">Вона корисна для інструментів, які працюють з будь-якими об'єктами.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, інструмент може вивести кожен атрибут об'єкта.<\/span> <span class=\"sg\" data-s=\"3\">Йому не треба спершу знати клас цього об'єкта.<\/span> <span class=\"sg\" data-s=\"4\">Наступна тема — про ланцюжок успадкування класу.<\/span> <span class=\"sg\" data-s=\"5\">Це лінія його батьківських класів.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на обекти","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a> използвахте <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С него питахте стойността за нейния тип.<\/span> <span class=\"sg\" data-s=\"2\">Същите метаизвиквания с <code>.^<\/code> работят и с класове и обекти.<\/span> <span class=\"sg\" data-s=\"3\">С тях можете да видите имената и атрибутите им.<\/span> <span class=\"sg\" data-s=\"4\">Можете да видите и мястото им в дървото на класовете.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаметодът е метод, който извиквате с <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метаметодът <code>.^name<\/code> връща името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Метаметодът <code>.^attributes<\/code> изброява атрибутите на класа.<\/span> <span class=\"sg\" data-s=\"1\">За всеки атрибут виждате типа му.<\/span> <span class=\"sg\" data-s=\"2\">Виждате и вътрешното му частно име.<\/span> <span class=\"sg\" data-s=\"3\">Това е формата <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Видяхте я при <a href=\"https://course.raku.org/bg/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">частните атрибути<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Интроспекция значи, че питате обекта за самия него.<\/span> <span class=\"sg\" data-s=\"1\">Тя е полезна за инструменти, които работят с всякакви обекти.<\/span> <span class=\"sg\" data-s=\"2\">Например такъв инструмент може да отпечата всеки атрибут на обекта.<\/span> <span class=\"sg\" data-s=\"3\">Той не трябва първо да знае класа на обекта.<\/span> <span class=\"sg\" data-s=\"4\">Следващата тема е за веригата на наследяване на класа.<\/span> <span class=\"sg\" data-s=\"5\">Това е линията на родителските му класове.<\/span><\/p>"]]},"eo":{"t":"Introspekti objektojn","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sekcio pri ujoj<\/a>, vi uzis <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per ĝi, vi demandis al valoro ĝian tipon.<\/span> <span class=\"sg\" data-s=\"2\">La samaj metavokoj <code>.^<\/code> ankaŭ funkcias kun klasoj kaj objektoj.<\/span> <span class=\"sg\" data-s=\"3\">Per ili, vi povas vidi iliajn nomojn kaj iliajn atributojn.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas vidi ilian lokon en la arbo de klasoj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metametodo estas metodo, kiun vi vokas per <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La metametodo <code>.^name<\/code> redonas la nomon de la klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La metametodo <code>.^attributes<\/code> listigas la atributojn de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">Por ĉiu atributo, vi vidas ĝian tipon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ vidas ĝian internan privatan nomon.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas la formo <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vi vidis ĝin ĉe <a href=\"https://course.raku.org/eo/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privataj atributoj<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspekto signifas, ke vi demandas objekton pri ĝi mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas utila por iloj, kiuj laboras kun ĉiu speco de objekto.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, ilo povas presi ĉiun atributon de objekto.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne bezonas scii la klason de la objekto antaŭe.<\/span> <span class=\"sg\" data-s=\"4\">La sekva temo estas pri la hereda ĉeno de klaso.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi estas la linio de ĝiaj patraj klasoj.<\/span><\/p>"]]},"la":{"t":"Obiecta introspicere","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de receptaculis<\/a> <code>.^name<\/code> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Cum eo valorem de genere suo interrogavisti.<\/span> <span class=\"sg\" data-s=\"2\">Eaedem metavocationes <code>.^<\/code> etiam cum classibus et obiectis operantur.<\/span> <span class=\"sg\" data-s=\"3\">Cum eis nomina et attributa eorum videre potes.<\/span> <span class=\"sg\" data-s=\"4\">Etiam locum eorum in arbore classium videre potes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metamethodus est methodus quam per <code>.^<\/code> vocas.<\/span> <span class=\"sg\" data-s=\"1\">Metamethodus <code>.^name<\/code> nomen classis reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Metamethodus <code>.^attributes<\/code> attributa classis enumerat.<\/span> <span class=\"sg\" data-s=\"1\">Pro quoque attributo genus eius vides.<\/span> <span class=\"sg\" data-s=\"2\">Etiam nomen eius privatum internum vides.<\/span> <span class=\"sg\" data-s=\"3\">Haec est forma <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Eam apud <a href=\"https://course.raku.org/la/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">attributa privata<\/a> vidisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Introspectio hoc significat: obiectum de se ipso interrogas.<\/span> <span class=\"sg\" data-s=\"1\">Utilis est instrumentis quae cum quolibet genere obiecti operantur.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, instrumentum omne attributum obiecti imprimere potest.<\/span> <span class=\"sg\" data-s=\"3\">Classem obiecti prius scire non debet.<\/span> <span class=\"sg\" data-s=\"4\">Argumentum sequens de catena hereditatis classis est.<\/span> <span class=\"sg\" data-s=\"5\">Haec est linea classium parentum eius.<\/span><\/p>"]]}}}</script>
