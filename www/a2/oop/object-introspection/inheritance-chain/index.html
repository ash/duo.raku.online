<script type="application/json" id="page-data">{"u":"oop/object-introspection/inheritance-chain","n":840,"k":"topic","pv":"oop/object-introspection","nx":"oop/object-introspection/inheritance-chain/quiz","tr":["oop","oop/object-introspection"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The inheritance chain","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">One class can inherit from another class.<\/span> <span class=\"sg\" data-s=\"1\">Then you can ask for the whole chain of types.<\/span> <span class=\"sg\" data-s=\"2\">The class is built on these types.<\/span> <span class=\"sg\" data-s=\"3\">The meta-method <code>.^mro<\/code> returns this chain.<\/span> <span class=\"sg\" data-s=\"4\">The name means <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku looks for a method in this order.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Read the list from the left.<\/span> <span class=\"sg\" data-s=\"1\">First, a <code>Dog<\/code> is itself.<\/span> <span class=\"sg\" data-s=\"2\">Then it is an <code>Animal<\/code>, its parent.<\/span> <span class=\"sg\" data-s=\"3\">Then it is <code>Any<\/code> and <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Every Raku object inherits from these two types.<\/span> <span class=\"sg\" data-s=\"5\">They are at the very top.<\/span> <span class=\"sg\" data-s=\"6\">When you call a method on a <code>Dog<\/code>, Raku searches this list.<\/span> <span class=\"sg\" data-s=\"7\">It goes from left to right.<\/span> <span class=\"sg\" data-s=\"8\">It uses the first method that matches.<\/span> <span class=\"sg\" data-s=\"9\">This explains overriding.<\/span> <span class=\"sg\" data-s=\"10\">The child comes earlier in the chain.<\/span> <span class=\"sg\" data-s=\"11\">So its method wins over the method of the parent.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sometimes a class has no parent with <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then the chain is shorter.<\/span> <span class=\"sg\" data-s=\"2\">It has only the class itself, and then <code>Any<\/code> and <code>Mu<\/code>.<\/span><\/p>"]]},"de":{"t":"Die Vererbungskette","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine Klasse kann von einer anderen Klasse erben.<\/span> <span class=\"sg\" data-s=\"1\">Dann können Sie nach der ganzen Kette von Typen fragen.<\/span> <span class=\"sg\" data-s=\"2\">Die Klasse baut auf diesen Typen auf.<\/span> <span class=\"sg\" data-s=\"3\">Die Metamethode <code>.^mro<\/code> gibt diese Kette zurück.<\/span> <span class=\"sg\" data-s=\"4\">Der Name bedeutet <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">In dieser Reihenfolge sucht Raku nach einer Methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie die Liste von links.<\/span> <span class=\"sg\" data-s=\"1\">Zuerst ist ein <code>Dog<\/code> er selbst.<\/span> <span class=\"sg\" data-s=\"2\">Dann ist er ein <code>Animal<\/code>, seine Elternklasse.<\/span> <span class=\"sg\" data-s=\"3\">Dann ist er <code>Any<\/code> und <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jedes Raku-Objekt erbt von diesen zwei Typen.<\/span> <span class=\"sg\" data-s=\"5\">Sie stehen ganz oben.<\/span> <span class=\"sg\" data-s=\"6\">Wenn Sie eine Methode auf einem <code>Dog<\/code> aufrufen, durchsucht Raku diese Liste.<\/span> <span class=\"sg\" data-s=\"7\">Raku geht von links nach rechts.<\/span> <span class=\"sg\" data-s=\"8\">Raku nimmt die erste passende Methode.<\/span> <span class=\"sg\" data-s=\"9\">Das erklärt das Überschreiben.<\/span> <span class=\"sg\" data-s=\"10\">Das Kind steht früher in der Kette.<\/span> <span class=\"sg\" data-s=\"11\">Also gewinnt seine Methode gegen die Methode der Elternklasse.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal hat eine Klasse keine Elternklasse mit <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dann ist die Kette kürzer.<\/span> <span class=\"sg\" data-s=\"2\">Sie hat nur die Klasse selbst und dann <code>Any<\/code> und <code>Mu<\/code>.<\/span><\/p>"]]},"nl":{"t":"De overervingsketen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een klasse kan van een andere klasse erven.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je de hele keten van typen opvragen.<\/span> <span class=\"sg\" data-s=\"2\">De klasse is op deze typen gebouwd.<\/span> <span class=\"sg\" data-s=\"3\">De metamethode <code>.^mro<\/code> geeft deze keten terug.<\/span> <span class=\"sg\" data-s=\"4\">De naam betekent <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku zoekt in deze volgorde naar een methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Lees de lijst vanaf links.<\/span> <span class=\"sg\" data-s=\"1\">Eerst is een <code>Dog<\/code> zichzelf.<\/span> <span class=\"sg\" data-s=\"2\">Dan is hij een <code>Animal<\/code>, zijn ouder.<\/span> <span class=\"sg\" data-s=\"3\">Dan is hij <code>Any<\/code> en <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Elk Raku-object erft van deze twee typen.<\/span> <span class=\"sg\" data-s=\"5\">Ze staan helemaal bovenaan.<\/span> <span class=\"sg\" data-s=\"6\">Als je een methode op een <code>Dog<\/code> aanroept, doorzoekt Raku deze lijst.<\/span> <span class=\"sg\" data-s=\"7\">Raku gaat van links naar rechts.<\/span> <span class=\"sg\" data-s=\"8\">Het gebruikt de eerste methode die past.<\/span> <span class=\"sg\" data-s=\"9\">Dit verklaart het overschrijven.<\/span> <span class=\"sg\" data-s=\"10\">Het kind komt eerder in de keten.<\/span> <span class=\"sg\" data-s=\"11\">Dus wint zijn methode van de methode van de ouder.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Soms heeft een klasse geen ouder met <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dan is de keten korter.<\/span> <span class=\"sg\" data-s=\"2\">Daarin staan alleen de klasse zelf, en dan <code>Any<\/code> en <code>Mu<\/code>.<\/span><\/p>"]]},"es":{"t":"La cadena de herencia","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una clase puede heredar de otra clase.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes pedir la cadena completa de tipos.<\/span> <span class=\"sg\" data-s=\"2\">La clase está construida sobre estos tipos.<\/span> <span class=\"sg\" data-s=\"3\">El metamétodo <code>.^mro<\/code> devuelve esta cadena.<\/span> <span class=\"sg\" data-s=\"4\">El nombre significa <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku busca un método en este orden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Lee la lista desde la izquierda.<\/span> <span class=\"sg\" data-s=\"1\">Primero, un <code>Dog<\/code> es él mismo.<\/span> <span class=\"sg\" data-s=\"2\">Después es un <code>Animal<\/code>, su padre.<\/span> <span class=\"sg\" data-s=\"3\">Después es <code>Any<\/code> y <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Todo objeto de Raku hereda de estos dos tipos.<\/span> <span class=\"sg\" data-s=\"5\">Están arriba del todo.<\/span> <span class=\"sg\" data-s=\"6\">Cuando llamas a un método sobre un <code>Dog<\/code>, Raku recorre esta lista.<\/span> <span class=\"sg\" data-s=\"7\">Va de izquierda a derecha.<\/span> <span class=\"sg\" data-s=\"8\">Usa el primer método adecuado.<\/span> <span class=\"sg\" data-s=\"9\">Esto explica la sobrescritura de métodos.<\/span> <span class=\"sg\" data-s=\"10\">La hija va antes en la cadena.<\/span> <span class=\"sg\" data-s=\"11\">Así que su método gana al método del padre.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A veces una clase no tiene un padre con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces la cadena es más corta.<\/span> <span class=\"sg\" data-s=\"2\">Solo tiene la clase misma, y después <code>Any<\/code> y <code>Mu<\/code>.<\/span><\/p>"]]},"it":{"t":"La catena di ereditarietà","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una classe può ereditare da un'altra classe.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi chiedere tutta la catena di tipi.<\/span> <span class=\"sg\" data-s=\"2\">La classe si basa su questi tipi.<\/span> <span class=\"sg\" data-s=\"3\">Il metametodo <code>.^mro<\/code> restituisce questa catena.<\/span> <span class=\"sg\" data-s=\"4\">Il nome vuol dire <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku cerca un metodo in questo ordine.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Leggi l'elenco da sinistra.<\/span> <span class=\"sg\" data-s=\"1\">Prima, un <code>Dog<\/code> è se stesso.<\/span> <span class=\"sg\" data-s=\"2\">Poi è un <code>Animal<\/code>, il suo genitore.<\/span> <span class=\"sg\" data-s=\"3\">Poi è <code>Any<\/code> e <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ogni oggetto Raku eredita da questi due tipi.<\/span> <span class=\"sg\" data-s=\"5\">Sono proprio in cima.<\/span> <span class=\"sg\" data-s=\"6\">Quando chiami un metodo su un <code>Dog<\/code>, Raku cerca in questo elenco.<\/span> <span class=\"sg\" data-s=\"7\">Va da sinistra a destra.<\/span> <span class=\"sg\" data-s=\"8\">Usa il primo metodo che corrisponde.<\/span> <span class=\"sg\" data-s=\"9\">Questo spiega la sovrascrittura.<\/span> <span class=\"sg\" data-s=\"10\">La figlia viene prima nella catena.<\/span> <span class=\"sg\" data-s=\"11\">Quindi il suo metodo vince sul metodo della genitrice.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte una classe non ha un genitore con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora la catena è più corta.<\/span> <span class=\"sg\" data-s=\"2\">Contiene solo la classe stessa, e poi <code>Any<\/code> e <code>Mu<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mantošanas ķēde","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Viena klase var mantot no citas klases.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat pajautāt visu tipu ķēdi.<\/span> <span class=\"sg\" data-s=\"2\">Klase ir uzbūvēta uz šiem tipiem.<\/span> <span class=\"sg\" data-s=\"3\">Metametode <code>.^mro<\/code> atgriež šo ķēdi.<\/span> <span class=\"sg\" data-s=\"4\">Nosaukums nozīmē <em>method resolution order<\/em> jeb metožu atrisināšanas secību.<\/span> <span class=\"sg\" data-s=\"5\">Raku meklē metodi šādā secībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Lasiet sarakstu no kreisās puses.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms <code>Dog<\/code> ir pats <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad tas ir <code>Animal<\/code>, tā vecākklase.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas ir <code>Any<\/code> un <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Katrs Raku objekts manto no šiem diviem tipiem.<\/span> <span class=\"sg\" data-s=\"5\">Tie ir pašā augšā.<\/span> <span class=\"sg\" data-s=\"6\">Kad jūs izsaucat metodi uz <code>Dog<\/code>, Raku pārmeklē šo sarakstu.<\/span> <span class=\"sg\" data-s=\"7\">Tas iet no kreisās puses uz labo.<\/span> <span class=\"sg\" data-s=\"8\">Tas izmanto pirmo metodi, kas der.<\/span> <span class=\"sg\" data-s=\"9\">Tas izskaidro pārrakstīšanu.<\/span> <span class=\"sg\" data-s=\"10\">Bērnklase ķēdē nāk agrāk.<\/span> <span class=\"sg\" data-s=\"11\">Tāpēc tās metode uzvar vecākklases metodi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz klasei nav vecākklases ar <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad ķēde ir īsāka.<\/span> <span class=\"sg\" data-s=\"2\">Tajā ir tikai pati klase un tad <code>Any<\/code> un <code>Mu<\/code>.<\/span><\/p>"]]},"ru":{"t":"Цепочка наследования","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Один класс может наследовать от другого класса.<\/span> <span class=\"sg\" data-s=\"1\">Тогда можно запросить всю цепочку типов.<\/span> <span class=\"sg\" data-s=\"2\">Класс построен на этих типах.<\/span> <span class=\"sg\" data-s=\"3\">Метаметод <code>.^mro<\/code> возвращает эту цепочку.<\/span> <span class=\"sg\" data-s=\"4\">Название значит <em>method resolution order<\/em>, то есть порядок разрешения методов.<\/span> <span class=\"sg\" data-s=\"5\">В этом порядке Raku ищет метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Читайте список слева.<\/span> <span class=\"sg\" data-s=\"1\">Сначала <code>Dog<\/code> — это сам <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потом это <code>Animal<\/code>, его родитель.<\/span> <span class=\"sg\" data-s=\"3\">Потом это <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Каждый объект Raku наследует от этих двух типов.<\/span> <span class=\"sg\" data-s=\"5\">Они на самом верху.<\/span> <span class=\"sg\" data-s=\"6\">Когда вы вызываете метод у <code>Dog<\/code>, Raku ищет в этом списке.<\/span> <span class=\"sg\" data-s=\"7\">Он идёт слева направо.<\/span> <span class=\"sg\" data-s=\"8\">Он берёт первый подходящий метод.<\/span> <span class=\"sg\" data-s=\"9\">Это объясняет переопределение.<\/span> <span class=\"sg\" data-s=\"10\">Потомок стоит в цепочке раньше.<\/span> <span class=\"sg\" data-s=\"11\">Поэтому его метод побеждает метод родителя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда у класса нет родителя с <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда цепочка короче.<\/span> <span class=\"sg\" data-s=\"2\">В ней только сам класс, а потом <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]},"uk":{"t":"Ланцюжок успадкування","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Один клас може успадковувати від іншого класу.<\/span> <span class=\"sg\" data-s=\"1\">Тоді можна запитати весь ланцюжок типів.<\/span> <span class=\"sg\" data-s=\"2\">Клас побудований на цих типах.<\/span> <span class=\"sg\" data-s=\"3\">Метаметод <code>.^mro<\/code> повертає цей ланцюжок.<\/span> <span class=\"sg\" data-s=\"4\">Назва означає <em>method resolution order<\/em>, тобто «порядок розв'язання методів».<\/span> <span class=\"sg\" data-s=\"5\">У такому порядку Raku шукає метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Читайте список зліва.<\/span> <span class=\"sg\" data-s=\"1\">Спершу <code>Dog<\/code> — це він сам.<\/span> <span class=\"sg\" data-s=\"2\">Потім він — <code>Animal<\/code>, його батько.<\/span> <span class=\"sg\" data-s=\"3\">Потім він — <code>Any<\/code> та <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кожен об'єкт Raku успадковує від цих двох типів.<\/span> <span class=\"sg\" data-s=\"5\">Вони на самій вершині.<\/span> <span class=\"sg\" data-s=\"6\">Коли ви викликаєте метод для <code>Dog<\/code>, Raku шукає в цьому списку.<\/span> <span class=\"sg\" data-s=\"7\">Він іде зліва направо.<\/span> <span class=\"sg\" data-s=\"8\">Він бере перший метод, який підходить.<\/span> <span class=\"sg\" data-s=\"9\">Це пояснює перевизначення.<\/span> <span class=\"sg\" data-s=\"10\">Дитина стоїть у ланцюжку раніше.<\/span> <span class=\"sg\" data-s=\"11\">Тож її метод перемагає метод батька.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді клас не має батька з <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ланцюжок коротший.<\/span> <span class=\"sg\" data-s=\"2\">У ньому лише сам клас, а потім <code>Any<\/code> та <code>Mu<\/code>.<\/span><\/p>"]]},"bg":{"t":"Веригата на наследяване","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Един клас може да наследява друг клас.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да поискате цялата верига от типове.<\/span> <span class=\"sg\" data-s=\"2\">Класът е изграден върху тези типове.<\/span> <span class=\"sg\" data-s=\"3\">Метаметодът <code>.^mro<\/code> връща тази верига.<\/span> <span class=\"sg\" data-s=\"4\">Името означава <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku търси метод в този ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Четете списъка отляво.<\/span> <span class=\"sg\" data-s=\"1\">Първо <code>Dog<\/code> е сам себе си.<\/span> <span class=\"sg\" data-s=\"2\">После е <code>Animal<\/code>, неговият родител.<\/span> <span class=\"sg\" data-s=\"3\">После е <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всеки обект в Raku наследява тези два типа.<\/span> <span class=\"sg\" data-s=\"5\">Те са най-отгоре.<\/span> <span class=\"sg\" data-s=\"6\">Когато извикате метод върху <code>Dog<\/code>, Raku претърсва този списък.<\/span> <span class=\"sg\" data-s=\"7\">Той върви отляво надясно.<\/span> <span class=\"sg\" data-s=\"8\">Използва първия метод, който съвпада.<\/span> <span class=\"sg\" data-s=\"9\">Това обяснява предефинирането.<\/span> <span class=\"sg\" data-s=\"10\">Дъщерният клас идва по-рано във веригата.<\/span> <span class=\"sg\" data-s=\"11\">Затова неговият метод печели пред метода на родителя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога класът няма родител с <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава веригата е по-къса.<\/span> <span class=\"sg\" data-s=\"2\">В нея са само самият клас и после <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]},"eo":{"t":"La hereda ĉeno","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Unu klaso povas heredi de alia klaso.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas peti la tutan ĉenon de tipoj.<\/span> <span class=\"sg\" data-s=\"2\">La klaso estas konstruita sur ĉi tiuj tipoj.<\/span> <span class=\"sg\" data-s=\"3\">La metametodo <code>.^mro<\/code> redonas ĉi tiun ĉenon.<\/span> <span class=\"sg\" data-s=\"4\">La nomo signifas <em>ordo de metodserĉado<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku serĉas metodon en ĉi tiu ordo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Legu la liston de maldekstre.<\/span> <span class=\"sg\" data-s=\"1\">Unue, <code>Dog<\/code> estas si mem.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi estas <code>Animal<\/code>, ĝia patro.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi estas <code>Any<\/code> kaj <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu Raku-objekto heredas de ĉi tiuj du tipoj.<\/span> <span class=\"sg\" data-s=\"5\">Ili estas tute supre.<\/span> <span class=\"sg\" data-s=\"6\">Kiam vi vokas metodon sur <code>Dog<\/code>, Raku traserĉas ĉi tiun liston.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi iras de maldekstre dekstren.<\/span> <span class=\"sg\" data-s=\"8\">Ĝi uzas la unuan metodon, kiu kongruas.<\/span> <span class=\"sg\" data-s=\"9\">Tio klarigas la superregadon.<\/span> <span class=\"sg\" data-s=\"10\">La ido venas pli frue en la ĉeno.<\/span> <span class=\"sg\" data-s=\"11\">Do ĝia metodo venkas la metodon de la patro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Foje klaso ne havas patron kun <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la ĉeno estas pli mallonga.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas nur la klason mem, kaj poste <code>Any<\/code> kaj <code>Mu<\/code>.<\/span><\/p>"]]},"la":{"t":"Catena hereditatis","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una classis ab altera classe heredare potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum totam catenam generum petere potes.<\/span> <span class=\"sg\" data-s=\"2\">Classis super haec genera stat.<\/span> <span class=\"sg\" data-s=\"3\">Metamethodus <code>.^mro<\/code> hanc catenam reddit.<\/span> <span class=\"sg\" data-s=\"4\">Nomen significat <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Raku methodum hoc ordine quaerit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Lege indicem a sinistra.<\/span> <span class=\"sg\" data-s=\"1\">Primum <code>Dog<\/code> est ipse.<\/span> <span class=\"sg\" data-s=\"2\">Deinde est <code>Animal<\/code>, parens eius.<\/span> <span class=\"sg\" data-s=\"3\">Deinde est <code>Any<\/code> et <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Omne obiectum Raku ab his duobus generibus heredat.<\/span> <span class=\"sg\" data-s=\"5\">In summo sunt.<\/span> <span class=\"sg\" data-s=\"6\">Cum methodum in <code>Dog<\/code> vocas, Raku hunc indicem perquirit.<\/span> <span class=\"sg\" data-s=\"7\">A sinistra ad dextram it.<\/span> <span class=\"sg\" data-s=\"8\">Primam methodum convenientem adhibet.<\/span> <span class=\"sg\" data-s=\"9\">Hoc explicat superscribere.<\/span> <span class=\"sg\" data-s=\"10\">Filia prius in catena venit.<\/span> <span class=\"sg\" data-s=\"11\">Itaque methodus eius methodum parentis vincit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum classis nullum parentem cum <code>is<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Tum catena brevior est.<\/span> <span class=\"sg\" data-s=\"2\">Solum ipsam classem habet, et deinde <code>Any<\/code> et <code>Mu<\/code>.<\/span><\/p>"]]}}}</script>
