<script type="application/json" id="page-data">{"u":"oop/subs-vs-methods","n":811,"k":"section","pv":"oop/class-methods/quiz","nx":"oop/subs-vs-methods/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Subroutines vs methods","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Now you know two ways to put some actions together.<\/span> <span class=\"sg\" data-s=\"1\">One is a <em>subroutine<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The other is a <em>method<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">They look similar.<\/span> <span class=\"sg\" data-s=\"4\">But you use them in different ways.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A subroutine stands alone.<\/span> <span class=\"sg\" data-s=\"1\">It does not belong to anything.<\/span> <span class=\"sg\" data-s=\"2\">You call it by its name.<\/span> <span class=\"sg\" data-s=\"3\">You pass it everything that it needs as arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">A method belongs to a class.<\/span> <span class=\"sg\" data-s=\"1\">It is like a function inside the class.<\/span> <span class=\"sg\" data-s=\"2\">You call a method on an object, with a dot.<\/span> <span class=\"sg\" data-s=\"3\">An object is a value of the class.<\/span> <span class=\"sg\" data-s=\"4\">The method can use the data of its object.<\/span> <span class=\"sg\" data-s=\"5\">For this, it has <code>self<\/code> and the attribute accessors.<\/span> <span class=\"sg\" data-s=\"6\">So you do not pass this data to it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Both give the same number.<\/span> <span class=\"sg\" data-s=\"1\">The difference is where the data comes from.<\/span> <span class=\"sg\" data-s=\"2\">The subroutine gets the radius as an argument.<\/span> <span class=\"sg\" data-s=\"3\">The method reads the radius from its object.<\/span> <span class=\"sg\" data-s=\"4\">This is the object that you call it on.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Here is a simple rule.<\/span> <span class=\"sg\" data-s=\"1\">Does the code stand alone and only work with its arguments?<\/span> <span class=\"sg\" data-s=\"2\">Then use a subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Does the code belong to an object and work with its data?<\/span> <span class=\"sg\" data-s=\"4\">Then use a method.<\/span> <span class=\"sg\" data-s=\"5\">Does the code belong to a class, but not to one object?<\/span> <span class=\"sg\" data-s=\"6\">Then use class methods.<\/span><\/p>"]]},"de":{"t":"Subroutinen versus Methoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jetzt kennen Sie zwei Wege, Aktionen zusammenzufassen.<\/span> <span class=\"sg\" data-s=\"1\">Der eine ist eine <em>Subroutine<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Der andere ist eine <em>Methode<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sie sehen ähnlich aus.<\/span> <span class=\"sg\" data-s=\"4\">Aber Sie benutzen sie auf verschiedene Weise.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine steht allein.<\/span> <span class=\"sg\" data-s=\"1\">Sie gehört zu nichts.<\/span> <span class=\"sg\" data-s=\"2\">Sie rufen sie über ihren Namen auf.<\/span> <span class=\"sg\" data-s=\"3\">Sie übergeben ihr alles, was sie braucht, als Argumente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Eine Methode gehört zu einer Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist wie eine Funktion in der Klasse.<\/span> <span class=\"sg\" data-s=\"2\">Sie rufen eine Methode auf einem Objekt auf, mit einem Punkt.<\/span> <span class=\"sg\" data-s=\"3\">Ein Objekt ist ein Wert der Klasse.<\/span> <span class=\"sg\" data-s=\"4\">Die Methode kann die Daten ihres Objekts benutzen.<\/span> <span class=\"sg\" data-s=\"5\">Dafür hat sie <code>self<\/code> und die Accessoren der Attribute.<\/span> <span class=\"sg\" data-s=\"6\">Also übergeben Sie ihr diese Daten nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beide ergeben dieselbe Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied ist, woher die Daten kommen.<\/span> <span class=\"sg\" data-s=\"2\">Die Subroutine bekommt den Radius als Argument.<\/span> <span class=\"sg\" data-s=\"3\">Die Methode liest den Radius aus ihrem Objekt.<\/span> <span class=\"sg\" data-s=\"4\">Das ist das Objekt, auf dem Sie sie aufrufen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine einfache Regel.<\/span> <span class=\"sg\" data-s=\"1\">Steht der Code allein und arbeitet er nur mit seinen Argumenten?<\/span> <span class=\"sg\" data-s=\"2\">Dann nehmen Sie eine Subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Gehört der Code zu einem Objekt und arbeitet er mit den Daten des Objekts?<\/span> <span class=\"sg\" data-s=\"4\">Dann nehmen Sie eine Methode.<\/span> <span class=\"sg\" data-s=\"5\">Gehört der Code zu einer Klasse, aber nicht zu einem einzelnen Objekt?<\/span> <span class=\"sg\" data-s=\"6\">Dann nehmen Sie Klassenmethoden.<\/span><\/p>"]]},"nl":{"t":"Subroutines versus methoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nu ken je twee manieren om een paar acties samen te voegen.<\/span> <span class=\"sg\" data-s=\"1\">De ene is een <em>subroutine<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De andere is een <em>methode<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ze lijken op elkaar.<\/span> <span class=\"sg\" data-s=\"4\">Maar je gebruikt ze op verschillende manieren.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een subroutine staat alleen.<\/span> <span class=\"sg\" data-s=\"1\">Hij hoort nergens bij.<\/span> <span class=\"sg\" data-s=\"2\">Je roept hem aan met zijn naam.<\/span> <span class=\"sg\" data-s=\"3\">Je geeft hem alles wat hij nodig heeft als argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een methode hoort bij een klasse.<\/span> <span class=\"sg\" data-s=\"1\">Ze is als een functie binnen de klasse.<\/span> <span class=\"sg\" data-s=\"2\">Je roept een methode aan op een object, met een punt.<\/span> <span class=\"sg\" data-s=\"3\">Een object is een waarde van de klasse.<\/span> <span class=\"sg\" data-s=\"4\">De methode kan de gegevens van haar object gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Daarvoor heeft ze <code>self<\/code> en de accessors van de attributen.<\/span> <span class=\"sg\" data-s=\"6\">Dus geef je deze gegevens niet aan haar mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beide geven hetzelfde getal.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil is waar de gegevens vandaan komen.<\/span> <span class=\"sg\" data-s=\"2\">De subroutine krijgt de straal als argument.<\/span> <span class=\"sg\" data-s=\"3\">De methode leest de straal uit haar object.<\/span> <span class=\"sg\" data-s=\"4\">Dat is het object waarop je haar aanroept.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier is een simpele regel.<\/span> <span class=\"sg\" data-s=\"1\">Staat de code alleen en werkt ze alleen met haar argumenten?<\/span> <span class=\"sg\" data-s=\"2\">Gebruik dan een subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Hoort de code bij een object en werkt ze met zijn gegevens?<\/span> <span class=\"sg\" data-s=\"4\">Gebruik dan een methode.<\/span> <span class=\"sg\" data-s=\"5\">Hoort de code bij een klasse, maar niet bij één object?<\/span> <span class=\"sg\" data-s=\"6\">Gebruik dan klassemethoden.<\/span><\/p>"]]},"es":{"t":"Subrutinas y métodos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ahora conoces dos formas de juntar algunas acciones.<\/span> <span class=\"sg\" data-s=\"1\">Una es la <em>subrutina<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La otra es el <em>método<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Se parecen.<\/span> <span class=\"sg\" data-s=\"4\">Pero los usas de formas distintas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una subrutina es independiente.<\/span> <span class=\"sg\" data-s=\"1\">No pertenece a nada.<\/span> <span class=\"sg\" data-s=\"2\">La llamas por su nombre.<\/span> <span class=\"sg\" data-s=\"3\">Le pasas como argumentos todo lo que necesita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un método pertenece a una clase.<\/span> <span class=\"sg\" data-s=\"1\">Es como una función dentro de la clase.<\/span> <span class=\"sg\" data-s=\"2\">Llamas a un método sobre un objeto, con un punto.<\/span> <span class=\"sg\" data-s=\"3\">Un objeto es un valor de la clase.<\/span> <span class=\"sg\" data-s=\"4\">El método puede usar los datos de su objeto.<\/span> <span class=\"sg\" data-s=\"5\">Para esto, tiene <code>self<\/code> y los accesores de los atributos.<\/span> <span class=\"sg\" data-s=\"6\">Así que no le pasas estos datos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Los dos dan el mismo número.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia es de dónde vienen los datos.<\/span> <span class=\"sg\" data-s=\"2\">La subrutina recibe el radio como argumento.<\/span> <span class=\"sg\" data-s=\"3\">El método lee el radio de su objeto.<\/span> <span class=\"sg\" data-s=\"4\">Es el objeto sobre el que lo llamas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una regla simple.<\/span> <span class=\"sg\" data-s=\"1\">¿El código es independiente y solo trabaja con sus argumentos?<\/span> <span class=\"sg\" data-s=\"2\">Entonces usa una subrutina.<\/span> <span class=\"sg\" data-s=\"3\">¿El código pertenece a un objeto y trabaja con sus datos?<\/span> <span class=\"sg\" data-s=\"4\">Entonces usa un método.<\/span> <span class=\"sg\" data-s=\"5\">¿El código pertenece a una clase, pero no a un solo objeto?<\/span> <span class=\"sg\" data-s=\"6\">Entonces usa métodos de clase.<\/span><\/p>"]]},"it":{"t":"Subroutine e metodi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ora conosci due modi per mettere insieme alcune azioni.<\/span> <span class=\"sg\" data-s=\"1\">Uno è la <em>subroutine<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">L'altro è il <em>metodo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Si somigliano.<\/span> <span class=\"sg\" data-s=\"4\">Ma li usi in modi diversi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una subroutine sta da sola.<\/span> <span class=\"sg\" data-s=\"1\">Non appartiene a niente.<\/span> <span class=\"sg\" data-s=\"2\">La chiami con il suo nome.<\/span> <span class=\"sg\" data-s=\"3\">Le passi come argomenti tutto quello che le serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Un metodo appartiene a una classe.<\/span> <span class=\"sg\" data-s=\"1\">È come una funzione dentro la classe.<\/span> <span class=\"sg\" data-s=\"2\">Chiami un metodo su un oggetto, con un punto.<\/span> <span class=\"sg\" data-s=\"3\">Un oggetto è un valore della classe.<\/span> <span class=\"sg\" data-s=\"4\">Il metodo può usare i dati del suo oggetto.<\/span> <span class=\"sg\" data-s=\"5\">Per questo ha <code>self<\/code> e gli accessori degli attributi.<\/span> <span class=\"sg\" data-s=\"6\">Quindi non gli passi questi dati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tutti e due danno lo stesso numero.<\/span> <span class=\"sg\" data-s=\"1\">La differenza è da dove arrivano i dati.<\/span> <span class=\"sg\" data-s=\"2\">La subroutine riceve il raggio come argomento.<\/span> <span class=\"sg\" data-s=\"3\">Il metodo legge il raggio dal suo oggetto.<\/span> <span class=\"sg\" data-s=\"4\">È l'oggetto su cui lo chiami.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ecco una regola semplice.<\/span> <span class=\"sg\" data-s=\"1\">Il codice sta da solo e lavora solo con i suoi argomenti?<\/span> <span class=\"sg\" data-s=\"2\">Allora usa una subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Il codice appartiene a un oggetto e lavora con i suoi dati?<\/span> <span class=\"sg\" data-s=\"4\">Allora usa un metodo.<\/span> <span class=\"sg\" data-s=\"5\">Il codice appartiene a una classe, ma non a un solo oggetto?<\/span> <span class=\"sg\" data-s=\"6\">Allora usa i metodi di classe.<\/span><\/p>"]]},"lv":{"t":"Apakšprogrammas un metodes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tagad jūs zināt divus veidus, kā salikt kopā dažas darbības.<\/span> <span class=\"sg\" data-s=\"1\">Viens ir <em>apakšprogramma<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Otrs ir <em>metode<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tās izskatās līdzīgi.<\/span> <span class=\"sg\" data-s=\"4\">Bet jūs tās lietojat dažādi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma stāv viena pati.<\/span> <span class=\"sg\" data-s=\"1\">Tā nepieder nekam.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to izsaucat pēc nosaukuma.<\/span> <span class=\"sg\" data-s=\"3\">Jūs padodat tai visu vajadzīgo kā argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Metode pieder klasei.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir kā funkcija klases iekšā.<\/span> <span class=\"sg\" data-s=\"2\">Jūs izsaucat metodi uz objekta ar punktu.<\/span> <span class=\"sg\" data-s=\"3\">Objekts ir klases vērtība.<\/span> <span class=\"sg\" data-s=\"4\">Metode var lietot sava objekta datus.<\/span> <span class=\"sg\" data-s=\"5\">Tam tai ir <code>self<\/code> un atribūtu piekļuves metodes.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc jūs šos datus tai nepadodat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Abas dod to pašu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir tajā, no kurienes nāk dati.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogramma saņem rādiusu kā argumentu.<\/span> <span class=\"sg\" data-s=\"3\">Metode nolasa rādiusu no sava objekta.<\/span> <span class=\"sg\" data-s=\"4\">Tas ir objekts, uz kura jūs to izsaucat.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vienkāršs likums.<\/span> <span class=\"sg\" data-s=\"1\">Vai kods stāv viens pats un strādā tikai ar saviem argumentiem?<\/span> <span class=\"sg\" data-s=\"2\">Tad lietojiet apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"3\">Vai kods pieder objektam un strādā ar tā datiem?<\/span> <span class=\"sg\" data-s=\"4\">Tad lietojiet metodi.<\/span> <span class=\"sg\" data-s=\"5\">Vai kods pieder klasei, bet ne vienam objektam?<\/span> <span class=\"sg\" data-s=\"6\">Tad lietojiet klases metodes.<\/span><\/p>"]]},"ru":{"t":"Подпрограммы и методы","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Теперь вы знаете два способа собрать вместе какие-то действия.<\/span> <span class=\"sg\" data-s=\"1\">Один из них — <em>подпрограмма<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Другой — <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Выглядят они похоже.<\/span> <span class=\"sg\" data-s=\"4\">Но используете вы их по-разному.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма существует сама по себе.<\/span> <span class=\"sg\" data-s=\"1\">Она ни к чему не относится.<\/span> <span class=\"sg\" data-s=\"2\">Вы вызываете её по имени.<\/span> <span class=\"sg\" data-s=\"3\">Вы передаёте ей всё, что ей нужно, как аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Метод принадлежит классу.<\/span> <span class=\"sg\" data-s=\"1\">Он как функция внутри класса.<\/span> <span class=\"sg\" data-s=\"2\">Вы вызываете метод у объекта, через точку.<\/span> <span class=\"sg\" data-s=\"3\">Объект — это значение этого класса.<\/span> <span class=\"sg\" data-s=\"4\">Метод может использовать данные своего объекта.<\/span> <span class=\"sg\" data-s=\"5\">Для этого у него есть <code>self<\/code> и аксессоры атрибутов.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому эти данные ему не нужно передавать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Оба варианта дают одно и то же число.<\/span> <span class=\"sg\" data-s=\"1\">Разница в том, откуда берутся данные.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмма получает радиус как аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Метод читает радиус из своего объекта.<\/span> <span class=\"sg\" data-s=\"4\">Это тот объект, у которого вы его вызываете.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Вот простое правило.<\/span> <span class=\"sg\" data-s=\"1\">Код существует сам по себе и работает только со своими аргументами?<\/span> <span class=\"sg\" data-s=\"2\">Тогда используйте подпрограмму.<\/span> <span class=\"sg\" data-s=\"3\">Код относится к объекту и работает с его данными?<\/span> <span class=\"sg\" data-s=\"4\">Тогда используйте метод.<\/span> <span class=\"sg\" data-s=\"5\">Код относится к классу, но не к одному объекту?<\/span> <span class=\"sg\" data-s=\"6\">Тогда используйте методы класса.<\/span><\/p>"]]},"uk":{"t":"Підпрограми проти методів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Тепер ви знаєте два способи зібрати кілька дій разом.<\/span> <span class=\"sg\" data-s=\"1\">Один спосіб — <em>підпрограма<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Другий — <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вони схожі на вигляд.<\/span> <span class=\"sg\" data-s=\"4\">Але ви використовуєте їх по-різному.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Підпрограма стоїть окремо.<\/span> <span class=\"sg\" data-s=\"1\">Вона нічому не належить.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте її за іменем.<\/span> <span class=\"sg\" data-s=\"3\">Ви передаєте їй усе потрібне як аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Метод належить класу.<\/span> <span class=\"sg\" data-s=\"1\">Він як функція всередині класу.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте метод для об'єкта, через крапку.<\/span> <span class=\"sg\" data-s=\"3\">Об'єкт — це значення класу.<\/span> <span class=\"sg\" data-s=\"4\">Метод може використовувати дані свого об'єкта.<\/span> <span class=\"sg\" data-s=\"5\">Для цього він має <code>self<\/code> та аксесори атрибутів.<\/span> <span class=\"sg\" data-s=\"6\">Тож ці дані йому не треба передавати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обидва дають те саме число.<\/span> <span class=\"sg\" data-s=\"1\">Різниця в тому, звідки беруться дані.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограма отримує радіус як аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Метод читає радіус зі свого об'єкта.<\/span> <span class=\"sg\" data-s=\"4\">Це об'єкт, для якого ви його викликаєте.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ось просте правило.<\/span> <span class=\"sg\" data-s=\"1\">Код стоїть окремо й працює лише зі своїми аргументами?<\/span> <span class=\"sg\" data-s=\"2\">Тоді використайте підпрограму.<\/span> <span class=\"sg\" data-s=\"3\">Код належить об'єкту й працює з його даними?<\/span> <span class=\"sg\" data-s=\"4\">Тоді використайте метод.<\/span> <span class=\"sg\" data-s=\"5\">Код належить класу, але не одному об'єкту?<\/span> <span class=\"sg\" data-s=\"6\">Тоді використайте методи класу.<\/span><\/p>"]]},"bg":{"t":"Подпрограми срещу методи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Сега знаете два начина да съберете действия заедно.<\/span> <span class=\"sg\" data-s=\"1\">Единият е <em>подпрограма<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Другият е <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Те изглеждат подобни.<\/span> <span class=\"sg\" data-s=\"4\">Но ги използвате по различен начин.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата стои сама.<\/span> <span class=\"sg\" data-s=\"1\">Тя не принадлежи на нищо.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате я по име.<\/span> <span class=\"sg\" data-s=\"3\">Подавате ѝ като аргументи всичко, което ѝ трябва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Методът принадлежи на клас.<\/span> <span class=\"sg\" data-s=\"1\">Той е като функция вътре в класа.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате метода върху обект, с точка.<\/span> <span class=\"sg\" data-s=\"3\">Обектът е стойност от този клас.<\/span> <span class=\"sg\" data-s=\"4\">Методът може да използва данните на своя обект.<\/span> <span class=\"sg\" data-s=\"5\">За това той има <code>self<\/code> и аксесорите на атрибутите.<\/span> <span class=\"sg\" data-s=\"6\">Затова не му подавате тези данни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И двете дават едно и също число.<\/span> <span class=\"sg\" data-s=\"1\">Разликата е откъде идват данните.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмата получава радиуса като аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Методът чете радиуса от своя обект.<\/span> <span class=\"sg\" data-s=\"4\">Това е обектът, върху който го извиквате.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ето едно просто правило.<\/span> <span class=\"sg\" data-s=\"1\">Стои ли кодът сам и работи ли само с аргументите си?<\/span> <span class=\"sg\" data-s=\"2\">Тогава използвайте подпрограма.<\/span> <span class=\"sg\" data-s=\"3\">Принадлежи ли кодът на обект и работи ли с неговите данни?<\/span> <span class=\"sg\" data-s=\"4\">Тогава използвайте метод.<\/span> <span class=\"sg\" data-s=\"5\">Принадлежи ли кодът на клас, но не на един обект?<\/span> <span class=\"sg\" data-s=\"6\">Тогава използвайте методи на класа.<\/span><\/p>"]]},"eo":{"t":"Subprogramoj kaj metodoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nun vi konas du manierojn kunigi kelkajn agojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu estas <em>subrutino<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La alia estas <em>metodo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ili aspektas similaj.<\/span> <span class=\"sg\" data-s=\"4\">Sed vi uzas ilin malsame.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subrutino staras sola.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi apartenas al nenio.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas ĝin per ĝia nomo.<\/span> <span class=\"sg\" data-s=\"3\">Vi transdonas al ĝi ĉion, kion ĝi bezonas, kiel argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Metodo apartenas al klaso.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas kiel funkcio ene de la klaso.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas metodon sur objekto, per punkto.<\/span> <span class=\"sg\" data-s=\"3\">Objekto estas valoro de la klaso.<\/span> <span class=\"sg\" data-s=\"4\">La metodo povas uzi la datumojn de sia objekto.<\/span> <span class=\"sg\" data-s=\"5\">Por tio, ĝi havas <code>self<\/code> kaj la atributajn atingilojn.<\/span> <span class=\"sg\" data-s=\"6\">Do vi ne transdonas ĉi tiujn datumojn al ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ donas la saman nombron.<\/span> <span class=\"sg\" data-s=\"1\">La diferenco estas, de kie venas la datumoj.<\/span> <span class=\"sg\" data-s=\"2\">La subrutino ricevas la radiuson kiel argumenton.<\/span> <span class=\"sg\" data-s=\"3\">La metodo legas la radiuson el sia objekto.<\/span> <span class=\"sg\" data-s=\"4\">Tio estas la objekto, sur kiu vi vokas ĝin.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Jen simpla regulo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu la kodo staras sola kaj laboras nur kun siaj argumentoj?<\/span> <span class=\"sg\" data-s=\"2\">Tiam uzu subrutinon.<\/span> <span class=\"sg\" data-s=\"3\">Ĉu la kodo apartenas al objekto kaj laboras kun ĝiaj datumoj?<\/span> <span class=\"sg\" data-s=\"4\">Tiam uzu metodon.<\/span> <span class=\"sg\" data-s=\"5\">Ĉu la kodo apartenas al klaso, sed ne al unu objekto?<\/span> <span class=\"sg\" data-s=\"6\">Tiam uzu klasmetodojn.<\/span><\/p>"]]},"la":{"t":"Subprogrammata et methodi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nunc duos modos nosti quibus actiones coniungis.<\/span> <span class=\"sg\" data-s=\"1\">Unus est <em>subprogramma<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Alter est <em>methodus<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Similes videntur.<\/span> <span class=\"sg\" data-s=\"4\">Sed eis diversis modis uteris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subprogramma per se stat.<\/span> <span class=\"sg\" data-s=\"1\">Ad nihil pertinet.<\/span> <span class=\"sg\" data-s=\"2\">Id nomine suo vocas.<\/span> <span class=\"sg\" data-s=\"3\">Omnia quibus eget ei ut argumenta tradis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Methodus ad classem pertinet.<\/span> <span class=\"sg\" data-s=\"1\">Est sicut functio intra classem.<\/span> <span class=\"sg\" data-s=\"2\">Methodum in obiecto vocas, cum puncto.<\/span> <span class=\"sg\" data-s=\"3\">Obiectum est valor classis.<\/span> <span class=\"sg\" data-s=\"4\">Methodus datis sui obiecti uti potest.<\/span> <span class=\"sg\" data-s=\"5\">Ad hoc <code>self<\/code> et accessores attributorum habet.<\/span> <span class=\"sg\" data-s=\"6\">Itaque haec data ei non tradis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Utrumque eundem numerum dat.<\/span> <span class=\"sg\" data-s=\"1\">Differentia est unde data veniant.<\/span> <span class=\"sg\" data-s=\"2\">Subprogramma radium ut argumentum accipit.<\/span> <span class=\"sg\" data-s=\"3\">Methodus radium ex suo obiecto legit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc est obiectum in quo eam vocas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ecce regula simplex.<\/span> <span class=\"sg\" data-s=\"1\">Statne codex per se et solum cum argumentis suis operatur?<\/span> <span class=\"sg\" data-s=\"2\">Tum subprogrammate utere.<\/span> <span class=\"sg\" data-s=\"3\">Pertinetne codex ad obiectum et cum datis eius operatur?<\/span> <span class=\"sg\" data-s=\"4\">Tum methodo utere.<\/span> <span class=\"sg\" data-s=\"5\">Pertinetne codex ad classem, sed non ad unum obiectum?<\/span> <span class=\"sg\" data-s=\"6\">Tum methodis classis utere.<\/span><\/p>"]]}}}</script>
