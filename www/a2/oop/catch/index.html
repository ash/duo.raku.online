<script type="application/json" id="page-data">{"u":"oop/catch","n":934,"k":"section","pv":"oop/try/quiz","nx":"oop/catch/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>CATCH<\/code> phaser","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">The <code>try<\/code> block is easy to use.<\/span> <span class=\"sg\" data-s=\"1\">But for <code>try<\/code>, the whole block is one piece.<\/span> <span class=\"sg\" data-s=\"2\">The block either works, or it fails.<\/span> <span class=\"sg\" data-s=\"3\">The <code>CATCH<\/code> phaser gives you more control.<\/span> <span class=\"sg\" data-s=\"4\">An exception is an error that stops the program.<\/span> <span class=\"sg\" data-s=\"5\">With <code>CATCH<\/code>, you handle the exception <em>inside<\/em> its block.<\/span> <span class=\"sg\" data-s=\"6\">This is the block with the error.<\/span> <span class=\"sg\" data-s=\"7\">There, you decide what to do.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> is a phaser.<\/span> <span class=\"sg\" data-s=\"1\">A phaser is a special block.<\/span> <span class=\"sg\" data-s=\"2\">Raku runs it by itself at a certain moment.<\/span> <span class=\"sg\" data-s=\"3\">You met phasers in the <a href=\"/advanced/phasers/\">section about control flow<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">You can put <code>CATCH<\/code> anywhere inside a block.<\/span> <span class=\"sg\" data-s=\"5\">It runs only if code in this block throws an exception.<\/span> <span class=\"sg\" data-s=\"6\">You get the exception in the topic variable <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span cla y<\/code> es fácil de usar.<\/span> <span class=\"sg\" data-s=\"1\">Pero para <code>try<\/code>, todo el bloque es una sola pieza.<\/span> <span class=\"sg\" data-s=\"2\">El bloque funciona o falla.<\/span> <span class=\"sg\" data-s=\"3\">El phaser <code>CATCH<\/code> te da más control.<\/span> <span class=\"sg\" data-s=\"4\">Una excepción es un error que detiene el programa.<\/span> <span class=\"sg\" data-s=\"5\">Con <code>CATCH<\/code>, manejas la excepción <em>dentro<\/em> de su bloque.<\/span> <span class=\"sg\" data-s=\"6\">Este es el bloque con el error.<\/span> <span class=\"sg\" data-s=\"7\">Allí decides qué hacer.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> es un phaser.<\/span> <span class=\"sg\" data-s=\"1\">Un phaser es un bloque especial.<\/span> <span class=\"sg\" data-s=\"2\">Raku lo ejecuta por sí mismo en un momento concreto.<\/span> <span class=\"sg\" data-s=\"3\">Ya conociste los phasers en la <a href=\"https://course.raku.org/es/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sección sobre el flujo de control<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Puedes poner <code>CATCH<\/code> en cualquier lugar dentro de un bloque.<\/span> <span class=\"sg\" data-s=\"5\">Solo se ejecuta si el código de este bloque lanza una excepción.<\/span> <span class=\"sg\" data-s=\"6\">Recibes la excepción en la variable de tema <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code> dentro de <code>CATCH<\/code> maneja cualquier excepción.<\/span> <span class=\"sg\" data-s=\"1\">Cuando termina, la excepción cuenta como manejada.<\/span> <span class=\"sg\" data-s=\"2\">Así que el programa no se detiene.<\/span> <span class=\"sg\" data-s=\"3\">Sigue después del bloque con el <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Por eso el programa imprime <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin el <code>CATCH<\/code>, el <code>die<\/code> detiene el programa.<\/span> <span class=\"sg\" data-s=\"1\">El programa nunca llega a <code>after<\/code>.<\/span><\/p>"]]},"it":{"t":"Il phaser <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>try<\/code> è facile da usare.<\/span> <span class=\"sg\" data-s=\"1\">Ma per <code>try<\/code> tutto il blocco è un solo pezzo.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco o funziona, o fallisce.<\/span> <span class=\"sg\" data-s=\"3\">Il phaser <code>CATCH<\/code> ti dà più controllo.<\/span> <span class=\"sg\" data-s=\"4\">Un'eccezione è un errore che ferma il programma.<\/span> <span class=\"sg\" data-s=\"5\">Con <code>CATCH<\/code> gestisci l'eccezione <em>dentro<\/em> il suo blocco.<\/span> <span class=\"sg\" data-s=\"6\">È il blocco con l'errore.<\/span> <span class=\"sg\" data-s=\"7\">Lì decidi tu che cosa fare.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> è un phaser.<\/span> <span class=\"sg\" data-s=\"1\">Un phaser è un blocco speciale.<\/span> <span class=\"sg\" data-s=\"2\">Raku lo esegue da solo in un certo momento.<\/span> <span class=\"sg\" data-s=\"3\">Hai incontrato i phaser nella <a href=\"https://course.raku.org/it/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sezione sul flusso di controllo<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Puoi mettere <code>CATCH<\/code> ovunque dentro un blocco.<\/span> <span class=\"sg\" data-s=\"5\">Gira solo se il codice di questo blocco solleva un'eccezione.<\/span> <span class=\"sg\" data-s=\"6\">Ricevi l'eccezione nella variabile topic <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code> dentro <code>CATCH<\/code> gestisce ogni eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Quando ha finito, l'eccezione conta come gestita.<\/span> <span class=\"sg\" data-s=\"2\">Quindi il programma non si ferma.<\/span> <span class=\"sg\" data-s=\"3\">Va avanti dopo il blocco con il <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Per questo il programma stampa <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza il <code>CATCH<\/code>, il <code>die<\/code> ferma il programma.<\/span> <span class=\"sg\" data-s=\"1\">Il programma non arriva mai ad <code>after<\/code>.<\/span><\/p>"]]},"lv":{"t":"Fāzeris <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Bloku <code>try<\/code> ir viegli lietot.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>try<\/code> visu bloku uztver kā vienu gabalu.<\/span> <span class=\"sg\" data-s=\"2\">Bloks vai nu darbojas, vai neizdodas.<\/span> <span class=\"sg\" data-s=\"3\">Fāzeris <code>CATCH<\/code> dod jums vairāk vadības.<\/span> <span class=\"sg\" data-s=\"4\">Izņēmums ir kļūda, kas aptur programmu.<\/span> <span class=\"sg\" data-s=\"5\">Ar <code>CATCH<\/code> jūs apstrādājat izņēmumu tā bloka <em>iekšā<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Tas ir bloks ar kļūdu.<\/span> <span class=\"sg\" data-s=\"7\">Tur jūs izlemjat, ko darīt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> ir fāzeris.<\/span> <span class=\"sg\" data-s=\"1\">Fāzeris ir īpašs bloks.<\/span> <span class=\"sg\" data-s=\"2\">Raku to izpilda pats noteiktā brīdī.<\/span> <span class=\"sg\" data-s=\"3\">Fāzerus jūs jau redzējāt <a href=\"https://course.raku.org/lv/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sadaļā par vadības plūsmu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\"><code>CATCH<\/code> jūs varat likt jebkur bloka iekšā.<\/span> <span class=\"sg\" data-s=\"5\">Tas izpildās tikai tad, ja kods šajā blokā izmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"6\">Izņēmumu jūs saņemat tēmas mainīgajā <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>default<\/code> fāzerī <code>CATCH<\/code> apstrādā katru izņēmumu.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas izpildās, izņēmums skaitās apstrādāts.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc programma neapstājas.<\/span> <span class=\"sg\" data-s=\"3\">Tā turpina darbu aiz bloka ar <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc programma izdrukā <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja nav <code>CATCH<\/code>, <code>die<\/code> aptur programmu.<\/span> <span class=\"sg\" data-s=\"1\">Programma nekad nenonāk līdz <code>after<\/code>.<\/span><\/p>"]]},"ru":{"t":"Фазер <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Блоком <code>try<\/code> легко пользоваться.<\/span> <span class=\"sg\" data-s=\"1\">Но для <code>try<\/code> весь блок — одно целое.<\/span> <span class=\"sg\" data-s=\"2\">Блок либо работает, либо даёт сбой.<\/span> <span class=\"sg\" data-s=\"3\">Фазер <code>CATCH<\/code> даёт вам больше контроля.<\/span> <span class=\"sg\" data-s=\"4\">Исключение — это ошибка, которая останавливает программу.<\/span> <span class=\"sg\" data-s=\"5\">С <code>CATCH<\/code> вы обрабатываете исключение <em>внутри<\/em> его блока.<\/span> <span class=\"sg\" data-s=\"6\">Это блок, где случилась ошибка.<\/span> <span class=\"sg\" data-s=\"7\">Там вы решаете, что делать.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> — это фазер.<\/span> <span class=\"sg\" data-s=\"1\">Фазер — это особый блок.<\/span> <span class=\"sg\" data-s=\"2\">Raku сам запускает его в определённый момент.<\/span> <span class=\"sg\" data-s=\"3\">Вы уже встречали фазеры в <a href=\"https://course.raku.org/ru/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">разделе о порядке выполнения<\/a>.<\/span> <span class=\"sg\" data-s=\"4\"><code>CATCH<\/code> можно поставить где угодно внутри блока.<\/span> <span class=\"sg\" data-s=\"5\">Он работает, только если код в этом блоке бросает исключение.<\/span> <span class=\"sg\" data-s=\"6\">Исключение вы получаете в переменной темы <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> внутри <code>CATCH<\/code> обрабатывает любое исключение.<\/span> <span class=\"sg\" data-s=\"1\">После него исключение считается обработанным.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому программа не останавливается.<\/span> <span class=\"sg\" data-s=\"3\">Она идёт дальше после блока с <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вот почему программа печатает <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> вызов <code>die<\/code> останавливает программу.<\/span> <span class=\"sg\" data-s=\"1\">Программа не доходит до <code>after<\/code>.<\/span><\/p>"]]},"uk":{"t":"Фазер <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Блоком <code>try<\/code> легко користуватися.<\/span> <span class=\"sg\" data-s=\"1\">Але для <code>try<\/code> весь блок — це одне ціле.<\/span> <span class=\"sg\" data-s=\"2\">Блок або спрацьовує, або не спрацьовує.<\/span> <span class=\"sg\" data-s=\"3\">Фазер <code>CATCH<\/code> дає вам більше контролю.<\/span> <span class=\"sg\" data-s=\"4\">Виняток — це помилка, яка зупиняє програму.<\/span> <span class=\"sg\" data-s=\"5\">З <code>CATCH<\/code> ви обробляєте виняток <em>усередині<\/em> його блоку.<\/span> <span class=\"sg\" data-s=\"6\">Це блок, де сталася помилка.<\/span> <span class=\"sg\" data-s=\"7\">Там ви вирішуєте, що робити.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> — це фазер.<\/span> <span class=\"sg\" data-s=\"1\">Фазер — це особливий блок.<\/span> <span class=\"sg\" data-s=\"2\">Raku сам запускає його в певний момент.<\/span> <span class=\"sg\" data-s=\"3\">Ви бачили фазери в <a href=\"https://course.raku.org/uk/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">розділі про порядок виконання<\/a>.<\/span> <span class=\"sg\" data-s=\"4\"><code>CATCH<\/code> можна поставити будь-де всередині блоку.<\/span> <span class=\"sg\" data-s=\"5\">Він виконується, лише якщо код у цьому блоці кидає виняток.<\/span> <span class=\"sg\" data-s=\"6\">Виняток ви отримуєте в змінній-топіку <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> усередині <code>CATCH<\/code> обробляє кожен виняток.<\/span> <span class=\"sg\" data-s=\"1\">Коли він виконався, виняток уже оброблений.<\/span> <span class=\"sg\" data-s=\"2\">Тож програма не зупиняється.<\/span> <span class=\"sg\" data-s=\"3\">Вона працює далі після блоку з <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тому програма виводить <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> команда <code>die<\/code> зупиняє програму.<\/span> <span class=\"sg\" data-s=\"1\">Програма так і не доходить до <code>after<\/code>.<\/span><\/p>"]]},"bg":{"t":"Фазерът <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>try<\/code> е лесен за използване.<\/span> <span class=\"sg\" data-s=\"1\">Но за <code>try<\/code> целият блок е едно цяло.<\/span> <span class=\"sg\" data-s=\"2\">Блокът или работи, или се проваля.<\/span> <span class=\"sg\" data-s=\"3\">Фазерът <code>CATCH<\/code> ви дава повече контрол.<\/span> <span class=\"sg\" data-s=\"4\">Изключението е грешка, която спира програмата.<\/span> <span class=\"sg\" data-s=\"5\">С <code>CATCH<\/code> обработвате изключението <em>вътре<\/em> в неговия блок.<\/span> <span class=\"sg\" data-s=\"6\">Това е блокът с грешката.<\/span> <span class=\"sg\" data-s=\"7\">Там вие решавате какво да правите.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> е фазер.<\/span> <span class=\"sg\" data-s=\"1\">Фазерът е специален блок.<\/span> <span class=\"sg\" data-s=\"2\">Raku го изпълнява сам в определен момент.<\/span> <span class=\"sg\" data-s=\"3\">Вече видяхте фазери в <a href=\"https://course.raku.org/bg/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">раздела за управлението на потока<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Можете да сложите <code>CATCH<\/code> където и да е вътре в блок.<\/span> <span class=\"sg\" data-s=\"5\">Той се изпълнява само ако код в този блок хвърли изключение.<\/span> <span class=\"sg\" data-s=\"6\">Получавате изключението в тематичната променлива <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> вътре в <code>CATCH<\/code> обработва всяко изключение.<\/span> <span class=\"sg\" data-s=\"1\">След като той се изпълни, изключението се смята за обработено.<\/span> <span class=\"sg\" data-s=\"2\">Затова програмата не спира.<\/span> <span class=\"sg\" data-s=\"3\">Тя продължава след блока с <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ето защо програмата отпечатва <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> <code>die<\/code> спира програмата.<\/span> <span class=\"sg\" data-s=\"1\">Програмата никога не стига до <code>after<\/code>.<\/span><\/p>"]]},"eo":{"t":"La fazero <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">La bloko <code>try<\/code> estas facile uzebla.<\/span> <span class=\"sg\" data-s=\"1\">Sed por <code>try<\/code>, la tuta bloko estas unu peco.<\/span> <span class=\"sg\" data-s=\"2\">La bloko aŭ funkcias, aŭ malsukcesas.<\/span> <span class=\"sg\" data-s=\"3\">La fazero <code>CATCH<\/code> donas al vi pli da regado.<\/span> <span class=\"sg\" data-s=\"4\">Escepto estas eraro, kiu haltigas la programon.<\/span> <span class=\"sg\" data-s=\"5\">Per <code>CATCH<\/code>, vi traktas la escepton <em>ene<\/em> de ĝia bloko.<\/span> <span class=\"sg\" data-s=\"6\">Tio estas la bloko kun la eraro.<\/span> <span class=\"sg\" data-s=\"7\">Tie vi decidas, kion fari.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> estas fazero.<\/span> <span class=\"sg\" data-s=\"1\">Fazero estas speciala bloko.<\/span> <span class=\"sg\" data-s=\"2\">Raku mem rulas ĝin en certa momento.<\/span> <span class=\"sg\" data-s=\"3\">Vi renkontis fazerojn en la <a href=\"https://course.raku.org/eo/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sekcio pri regofluo<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas meti <code>CATCH<\/code> ie ajn ene de bloko.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ruliĝas nur, se kodo en ĉi tiu bloko ĵetas escepton.<\/span> <span class=\"sg\" data-s=\"6\">Vi ricevas la escepton en la temvariablo <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code> ene de <code>CATCH<\/code> traktas ĉiun escepton.<\/span> <span class=\"sg\" data-s=\"1\">Post kiam ĝi ruliĝas, la escepto kalkuliĝas kiel traktita.<\/span> <span class=\"sg\" data-s=\"2\">Do la programo ne haltas.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi daŭras post la bloko kun la <code>CATCH<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tial la programo presas <code>after<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sen la <code>CATCH<\/code>, la <code>die<\/code> haltigas la programon.<\/span> <span class=\"sg\" data-s=\"1\">La programo neniam atingas <code>after<\/code>.<\/span><\/p>"]]},"la":{"t":"Phasor <code>CATCH<\/code>","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Clausula <code>try<\/code> facilis est.<\/span> <span class=\"sg\" data-s=\"1\">Sed pro <code>try<\/code> tota clausula una pars est.<\/span> <span class=\"sg\" data-s=\"2\">Clausula aut operatur aut deficit.<\/span> <span class=\"sg\" data-s=\"3\">Fasis <code>CATCH<\/code> tibi plus potestatis dat.<\/span> <span class=\"sg\" data-s=\"4\">Exceptio est error qui programma sistit.<\/span> <span class=\"sg\" data-s=\"5\">Per <code>CATCH<\/code> exceptionem <em>intra<\/em> clausulam eius tractas.<\/span> <span class=\"sg\" data-s=\"6\">Haec est clausula cum errore.<\/span> <span class=\"sg\" data-s=\"7\">Ibi decernis quid agas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> fasis est.<\/span> <span class=\"sg\" data-s=\"1\">Fasis est clausula specialis.<\/span> <span class=\"sg\" data-s=\"2\">Raku eam per se certo momento currit.<\/span> <span class=\"sg\" data-s=\"3\">Fases in <a href=\"https://course.raku.org/la/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sectione de ordine exsecutionis<\/a> invenisti.<\/span> <span class=\"sg\" data-s=\"4\"><code>CATCH<\/code> ubicumque intra clausulam ponere potes.<\/span> <span class=\"sg\" data-s=\"5\">Currit solum si codex in hac clausula exceptionem iacit.<\/span> <span class=\"sg\" data-s=\"6\">Exceptionem in variabili thematis <code>$_<\/code> accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Clausula <code>default<\/code> intra <code>CATCH<\/code> omnem exceptionem tractat.<\/span> <span class=\"sg\" data-s=\"1\">Postquam currit, Raku exceptionem pro tractata habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque programma non sistit.<\/span> <span class=\"sg\" data-s=\"3\">Post clausulam cum <code>CATCH<\/code> pergit.<\/span> <span class=\"sg\" data-s=\"4\">Ideo programma <code>after<\/code> imprimit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine <code>CATCH<\/code>, <code>die<\/code> programma sistit.<\/span> <span class=\"sg\" data-s=\"1\">Programma numquam ad <code>after<\/code> pervenit.<\/span><\/p>"
