<script type="application/json" id="page-data">{"u":"oop/catch/exercises/handle-and-continue/solution","n":937,"k":"solution","pv":"oop/catch/exercises/handle-and-continue","nx":"oop/catch/exercises/survive-a-loop","tr":["oop","oop/catch"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Handle and continue‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser is inside the block for one item. So it handles a <code>die<\/code> only for this item. The exception is handled there. So it never gets out of the block. It cannot stop the whole loop.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is a common case for <code>CATCH<\/code>, not for <code>try<\/code>. One round of the loop fails. The program handles the error right there. Then the loop goes on to the next item. The middle item fails. But the program still handles the two <code>ok<\/code> items.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Behandeln und weiterma   {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser zit in het blok voor één item. Dus handelt hij een <code>die<\/code> alleen voor dit item af. De <code>CATCH<\/code> handelt de exceptie daar af. Dus komt de exceptie nooit uit het blok. Ze kan de hele lus niet stoppen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hiervoor gebruik je vaak <code>CATCH<\/code>, en niet <code>try<\/code>. Eén ronde van de lus mislukt. Het programma handelt de fout meteen daar af. Daarna gaat de lus door naar het volgende item. Het middelste item mislukt. Maar het programma verwerkt de twee <code>ok<\/code>-items toch.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Maneje y continúe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El phaser <code>CATCH<\/code> está dentro del bloque para un elemento. Así que maneja un <code>die<\/code> solo para este elemento. El <code>CATCH<\/code> maneja la excepción ahí. Así que la excepción nunca sale del bloque. No puede detener todo el bucle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Este es un caso típico para <code>CATCH<\/code>, no para <code>try<\/code>. Una vuelta del bucle falla. El programa maneja el error allí mismo. Después el bucle pasa al elemento siguiente. El elemento del medio falla. Pero el programa trata igualmente los dos elementos <code>ok<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Gestite e proseguite","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il phaser <code>CATCH<\/code> è dentro il blocco per un elemento. Quindi gestisce un <code>die<\/code> solo per questo elemento. Lì l'eccezione è gestita. Quindi non esce mai dal blocco. Non può fermare tutto il ciclo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questo è un caso tipico per <code>CATCH<\/code>, non per <code>try<\/code>. Un giro del ciclo fallisce. Il programma gestisce l'errore proprio lì. Poi il ciclo passa all'elemento successivo. L'elemento centrale fallisce. Ma il programma lavora comunque sui due elementi <code>ok<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apstrādājiet un turpiniet","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fāzeris <code>CATCH<\/code> atrodas viena elementa blokā. Tāpēc tas apstrādā <code>die<\/code> tikai šim elementam. <code>CATCH<\/code> apstrādā izņēmumu tu у. Средний элемент даёт сбой. Но программа всё равно обрабатывает два элемента <code>ok<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Обробити й продовжити","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> стоїть усередині блоку для одного елемента. Тож він обробляє <code>die<\/code> лише для цього елемента. Виняток обробляється саме там. Тож він ніколи не виходить із блоку. Він не може зупинити весь цикл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це типовий випадок для <code>CATCH<\/code>, а не для <code>try<\/code>. Один прохід циклу дає збій. Програма обробляє помилку прямо там. Потім цикл переходить до наступного елемента. Середній елемент дає збій. Але програма все одно обробляє два елементи <code>ok<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Обработете и продължете","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre cla 1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fasis <code>CATCH<\/code> intra clausulam pro uno elemento est. Itaque <code>die<\/code> solum pro hoc elemento tractat. Ibi exceptionem tractat. Itaque exceptio numquam e clausula exit. Totum anulum sistere non potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic est casus frequens pro <code>CATCH<\/code>, non pro <code>try<\/code>. Unus gyrus anuli deficit. Programma errorem eo ipso loco tractat. Deinde anulus ad elementum sequens pergit. Elementum medium deficit. Sed programma duo elementa <code>ok<\/code> tamen tractat.<\/span><\/li><\/ol>"]]}}}</script>
