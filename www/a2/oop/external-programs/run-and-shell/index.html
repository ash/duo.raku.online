<script type="application/json" id="page-data">{"u":"oop/external-programs/run-and-shell","n":908,"k":"topic","pv":"oop/external-programs","nx":"oop/external-programs/run-and-shell/quiz","tr":["oop","oop/external-programs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"run and shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">There are two ways to start an external program.<\/span> <span class=\"sg\" data-s=\"1\">The first one is the <code>run<\/code> function.<\/span> <span class=\"sg\" data-s=\"2\">It does not use a shell.<\/span> <span class=\"sg\" data-s=\"3\">A shell is a program that reads commands and runs them.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> takes the command and its arguments as <strong>separate<\/strong> values.<\/span> <span class=\"sg\" data-s=\"5\">Arguments are the values that you give to the command.<\/span> <span class=\"sg\" data-s=\"6\">Then <code>run<\/code> starts the program directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This runs the <code>echo<\/code> program with one argument, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The program prints <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The arguments come to the program separately.<\/span> <span class=\"sg\" data-s=\"3\">So no shell can get spaces or special characters wrong.<\/span> <span class=\"sg\" data-s=\"4\">That is why <code>run<\/code> is the safe default choice.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The <code>shell<\/code> function works in another way.<\/span> <span class=\"sg\" data-s=\"1\">It gives a <strong>single string<\/strong> to the shell of the system.<\/span> <span class=\"sg\" data-s=\"2\">The shell reads the string and runs it.<\/span> <span class=\"sg\" data-s=\"3\">So you can use shell features, like redirection and pipes.<\/span> <span class=\"sg\" data-s=\"4\">Redirection sends output to another place, for example to a file.<\/span> <span class=\"sg\" data-s=\"5\">A pipe sends the output of one command to the next one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Here, the shell runs <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A pipe sends its output to <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Then the shell prints <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This is easy, but there is a risk.<\/span> <span class=\"sg\" data-s=\"4\">The shell itself reads the string and finds its parts.<\/span> <span class=\"sg\" data-s=\"5\">Maybe the string comes from input that you do not trust.<\/span> <span class=\"sg\" data-s=\"6\">Then a <code>shell<\/code> command is dangerous.<\/span> <span class=\"sg\" data-s=\"7\">Use <code>run<\/code>, unless you really need shell features.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Both functions return a <code>Proc<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">It tells you how the program ended.<\/span> <span class=\"sg\" data-s=\"2\">Normally, the started program uses the same output as your program.<\/span> <span class=\"sg\" data-s=\"3\">So you see its output on the screen.<\/span> <span class=\"sg\" data-s=\"4\">You can also capture this output.<\/span> <span class=\"sg\" data-s=\"5\">For this, you must ask for it.<\/span> <span class=\"sg\" data-s=\"6\">The next topic shows how.<\/span><\/p>"]]},"de":{"t":"run und shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei Wege, ein externes Programm zu starten.<\/span> <span class=\"sg\" data-s=\"1\">Der erste ist die Funktion <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie benutzt keine Shell.<\/span> <span class=\"sg\" data-s=\"3\">Eine Shell ist ein Programm, das Befehle liest und ausführt.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> nimmt den Befehl und seine Argumente als <strong>getrennte<\/strong> Werte.<\/span> <span class=\"sg\" data-s=\"5\">Argumente sind die Werte, die Sie dem Befehl geben.<\/span> <span class=\"sg\" data-s=\"6\">Dann startet <code>run<\/code> das Programm direkt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das startet das Programm <code>echo<\/code> mit einem Argument: <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm gibt <code>hello<\/code> aus.<\/span> <span class=\"sg\" data-s=\"2\">Die Argumente kommen einzeln beim Programm an.<\/span> <span class=\"sg\" data-s=\"3\">Also kann keine Shell Leerzeichen oder Sonderzeichen falsch verstehen.<\/span> <span class=\"sg\" data-s=\"4\">Darum ist <code>run<\/code> die sichere Standardwahl.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Die Funktion <code>shell<\/code> arbeitet anders.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt eine <strong>einzelne Zeichenkette<\/strong> an die Shell des Systems.<\/span> <span class=\"sg\" data-s=\"2\">Die Shell liest die Zeichenkette und führt sie aus.<\/span> <span class=\"sg\" data-s=\"3\">So können Sie Shell-Möglichkeiten wie Umleitungen und Pipes nutzen.<\/span> <span class=\"sg\" data-s=\"4\">Eine Umleitung schickt Ausgabe an einen anderen Ort, zum Beispiel in eine Datei.<\/span> <span class=\"sg\" data-s=\"5\">Eine Pipe schickt die Ausgabe eines Befehls an den nächsten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Hier führt die Shell <code>echo<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Eine Pipe schickt die Ausgabe von <code>echo<\/code> an <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann gibt die Shell <code>HELLO<\/code> aus.<\/span> <span class=\"sg\" data-s=\"3\">Das ist einfach, aber es gibt ein Risiko.<\/span> <span class=\"sg\" data-s=\"4\">Die Shell selbst liest die Zeichenkette und findet ihre Teile.<\/span> <span class=\"sg\" data-s=\"5\">Vielleicht kommt die Zeichenkette aus einer Eingabe, der Sie nicht vertrauen.<\/span> <span class=\"sg\" data-s=\"6\">Dann ist ein <code>shell<\/code>-Befehl gefährlich.<\/span> <span class=\"sg\" data-s=\"7\">Nehmen Sie <code>run<\/code>, außer Sie brauchen wirklich Shell-Möglichkeiten.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Beide Funktionen geben ein <code>Proc<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es sagt Ihnen, wie das Programm geendet hat.<\/span> <span class=\"sg\" data-s=\"2\">Normalerweise benutzt das gestartete Programm dieselbe Ausgabe wie Ihr Programm.<\/span> <span class=\"sg\" data-s=\"3\">Also sehen Sie seine Ausgabe auf dem Bildschirm.<\/span> <span class=\"sg\" data-s=\"4\">Sie können diese Ausgabe auch auffangen.<\/span> <span class=\"sg\" data-s=\"5\">Dafür müssen Sie danach fragen.<\/span> <span class=\"sg\" data-s=\"6\">Das nächste Thema zeigt, wie das geht.<\/span><\/p>"]]},"nl":{"t":"run en shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee manieren om een extern programma te starten.<\/span> <span class=\"sg\" data-s=\"1\">De eerste is de functie <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die gebruikt geen shell.<\/span> <span class=\"sg\" data-s=\"3\">Een shell is een programma dat commando's leest en uitvoert.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> neemt het commando en zijn argumenten als <strong>losse<\/strong> waarden.<\/span> <span class=\"sg\" data-s=\"5\">Argumenten zijn de waarden die je aan het commando geeft.<\/span> <span class=\"sg\" data-s=\"6\">Daarna start <code>run<\/code> het programma direct:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit draait het programma <code>echo<\/code> met één argument, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het programma drukt <code>hello<\/code> af.<\/span> <span class=\"sg\" data-s=\"2\">De argumenten komen los bij het programma aan.<\/span> <span class=\"sg\" data-s=\"3\">Dus kan geen shell spaties of speciale tekens verkeerd lezen.<\/span> <span class=\"sg\" data-s=\"4\">Daarom is <code>run<\/code> de veilige standaardkeuze.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De functie <code>shell<\/code> werkt op een andere manier.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft <strong>één string<\/strong> aan de shell van het systeem.<\/span> <span class=\"sg\" data-s=\"2\">De shell leest de string en voert hem uit.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je mogelijkheden van de shell gebruiken, zoals omleiding en pipes.<\/span> <span class=\"sg\" data-s=\"4\">Omleiding stuurt uitvoer naar een andere plek, bijvoorbeeld naar een bestand.<\/span> <span class=\"sg\" data-s=\"5\">Een pipe stuurt de uitvoer van het ene commando naar het volgende:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Hier draait de shell <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Een pipe stuurt de uitvoer naar <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daarna drukt de shell <code>HELLO<\/code> af.<\/span> <span class=\"sg\" data-s=\"3\">Dat is makkelijk, maar er is een risico.<\/span> <span class=\"sg\" data-s=\"4\">De shell leest de string zelf en deelt hem op in stukken.<\/span> <span class=\"sg\" data-s=\"5\">Misschien komt de string van invoer die je niet vertrouwt.<\/span> <span class=\"sg\" data-s=\"6\">Dan is een <code>shell<\/code>-commando gevaarlijk.<\/span> <span class=\"sg\" data-s=\"7\">Gebruik <code>run<\/code>, behalve als je echt shellmogelijkheden nodig hebt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Beide functies geven een <code>Proc<\/code>-object terug.<\/span> <span class=\"sg\" data-s=\"1\">Dat vertelt je hoe het programma gestopt is.<\/span> <span class=\"sg\" data-s=\"2\">Normaal gebruikt het gestarte programma dezelfde uitvoer als jouw programma.<\/span> <span class=\"sg\" data-s=\"3\">Dus zie je zijn uitvoer op het scherm.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt deze uitvoer ook opvangen.<\/span> <span class=\"sg\" data-s=\"5\">Daarvoor moet je erom vragen.<\/span> <span class=\"sg\" data-s=\"6\">Het volgende onderwerp laat zien hoe.<\/span><\/p>"]]},"es":{"t":"run y shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Hay dos formas de iniciar un programa externo.<\/span> <span class=\"sg\" data-s=\"1\">La primera es la función <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No usa una shell.<\/span> <span class=\"sg\" data-s=\"3\">Una shell es un programa que lee órdenes y las ejecuta.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> toma la orden y sus argumentos como valores <strong>separados<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Los argumentos son los valores que das a la orden.<\/span> <span class=\"sg\" data-s=\"6\">Después <code>run<\/code> inicia el programa directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esto ejecuta el programa <code>echo<\/code> con un argumento, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El programa imprime <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Los argumentos llegan al programa por separado.<\/span> <span class=\"sg\" data-s=\"3\">Así que ninguna shell puede entender mal los espacios o los caracteres especiales.<\/span> <span class=\"sg\" data-s=\"4\">Por eso <code>run<\/code> es la opción segura por defecto.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La función <code>shell<\/code> funciona de otra forma.<\/span> <span class=\"sg\" data-s=\"1\">Da una <strong>única cadena<\/strong> a la shell del sistema.<\/span> <span class=\"sg\" data-s=\"2\">La shell lee la cadena y la ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes usar herramientas de la shell, como la redirección y las tuberías.<\/span> <span class=\"sg\" data-s=\"4\">La redirección envía la salida a otro lugar, por ejemplo a un archivo.<\/span> <span class=\"sg\" data-s=\"5\">Una tubería envía la salida de una orden a la siguiente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Aquí, la shell ejecuta <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una tubería envía su salida a <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Después la shell imprime <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Esto es fácil, pero hay un riesgo.<\/span> <span class=\"sg\" data-s=\"4\">La shell misma lee la cadena y encuentra sus partes.<\/span> <span class=\"sg\" data-s=\"5\">A lo mejor la cadena viene de una entrada en la que no confías.<\/span> <span class=\"sg\" data-s=\"6\">Entonces una orden <code>shell<\/code> es peligrosa.<\/span> <span class=\"sg\" data-s=\"7\">Usa <code>run<\/code>, a menos que de verdad necesites herramientas de la shell.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Las dos funciones devuelven un objeto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Te dice cómo terminó el programa.<\/span> <span class=\"sg\" data-s=\"2\">Normalmente, el programa iniciado usa la misma salida que tu programa.<\/span> <span class=\"sg\" data-s=\"3\">Así que ves su salida en la pantalla.<\/span> <span class=\"sg\" data-s=\"4\">También puedes capturar esta salida.<\/span> <span class=\"sg\" data-s=\"5\">Para eso, tienes que pedirla.<\/span> <span class=\"sg\" data-s=\"6\">El tema siguiente muestra cómo.<\/span><\/p>"]]},"it":{"t":"run e shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per avviare un programma esterno.<\/span> <span class=\"sg\" data-s=\"1\">Il primo è la funzione <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Non usa una shell.<\/span> <span class=\"sg\" data-s=\"3\">Una shell è un programma che legge comandi e li esegue.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> prende il comando e i suoi argomenti come valori <strong>separati<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Gli argomenti sono i valori che dai al comando.<\/span> <span class=\"sg\" data-s=\"6\">Poi <code>run<\/code> avvia direttamente il programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo esegue il programma <code>echo<\/code> con un argomento, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il programma stampa <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Gli argomenti arrivano al programma separati.<\/span> <span class=\"sg\" data-s=\"3\">Così nessuna shell può sbagliare con gli spazi o i caratteri speciali.<\/span> <span class=\"sg\" data-s=\"4\">Per questo <code>run<\/code> è la scelta predefinita sicura.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>shell<\/code> lavora in un altro modo.<\/span> <span class=\"sg\" data-s=\"1\">Dà una <strong>singola stringa<\/strong> alla shell del sistema.<\/span> <span class=\"sg\" data-s=\"2\">La shell legge la stringa e la esegue.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi usare le funzionalità della shell, come la redirezione e le pipe.<\/span> <span class=\"sg\" data-s=\"4\">La redirezione manda l'output in un altro posto, per esempio in un file.<\/span> <span class=\"sg\" data-s=\"5\">Una pipe manda l'output di un comando al comando successivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Qui la shell esegue <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una pipe manda il suo output a <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi la shell stampa <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo è facile, ma c'è un rischio.<\/span> <span class=\"sg\" data-s=\"4\">La shell stessa legge la stringa e trova le sue parti.<\/span> <span class=\"sg\" data-s=\"5\">Forse la stringa viene da un input di cui non ti fidi.<\/span> <span class=\"sg\" data-s=\"6\">Allora un comando <code>shell<\/code> è pericoloso.<\/span> <span class=\"sg\" data-s=\"7\">Usa <code>run<\/code>, se non ti servono davvero le funzionalità della shell.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tutte e due le funzioni restituiscono un oggetto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ti dice come è finito il programma.<\/span> <span class=\"sg\" data-s=\"2\">Di solito il programma avviato usa lo stesso output del tuo programma.<\/span> <span class=\"sg\" data-s=\"3\">Così vedi il suo output sullo schermo.<\/span> <span class=\"sg\" data-s=\"4\">Puoi anche catturare questo output.<\/span> <span class=\"sg\" data-s=\"5\">Per farlo, devi chiederlo.<\/span> <span class=\"sg\" data-s=\"6\">Il prossimo argomento mostra come.<\/span><\/p>"]]},"lv":{"t":"run un shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Ir divi veidi, kā palaist ārēju programmu.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais ir funkcija <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā nelieto čaulu.<\/span> <span class=\"sg\" data-s=\"3\">Čaula ir programma, kas nolasa komandas un tās izpilda.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> ņem komandu un tās argumentus kā <strong>atsevišķas<\/strong> vērtības.<\/span> <span class=\"sg\" data-s=\"5\">Argumenti ir vērtības, ko jūs dodat komandai.<\/span> <span class=\"sg\" data-s=\"6\">Tad <code>run<\/code> palaiž programmu tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas palaiž programmu <code>echo<\/code> ar vienu argumentu, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Programma izdrukā <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Argumenti nonāk pie programmas atsevišķi.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc neviena čaula nevar pārprast atstarpes vai īpašās rakstzīmes.<\/span> <span class=\"sg\" data-s=\"4\">Tieši tāpēc <code>run<\/code> ir drošā noklusējuma izvēle.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>shell<\/code> strādā citādi.<\/span> <span class=\"sg\" data-s=\"1\">Tā dod <strong>vienu virkni<\/strong> sistēmas čaulai.<\/span> <span class=\"sg\" data-s=\"2\">Čaula nolasa virkni un to izpilda.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat lietot čaulas iespējas, piemēram, novirzīšanu un caurules.<\/span> <span class=\"sg\" data-s=\"4\">Novirzīšana sūta izvadi uz citu vietu, piemēram, uz failu.<\/span> <span class=\"sg\" data-s=\"5\">Caurule sūta vienas komandas izvadi uz nākamo komandu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Šeit čaula palaiž <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Caurule sūta tā izvadi uz <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad čaula izdrukā <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir viegli, bet ir arī risks.<\/span> <span class=\"sg\" data-s=\"4\">Čaula pati nolasa virkni un atrod tās daļas.<\/span> <span class=\"sg\" data-s=\"5\">Varbūt virkne nāk no ievades, kurai jūs neuzticaties.<\/span> <span class=\"sg\" data-s=\"6\">Tad <code>shell<\/code> komanda ir bīstama.<\/span> <span class=\"sg\" data-s=\"7\">Lietojiet <code>run<\/code>, ja vien jums tiešām nevajag čaulas iespējas.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Abas funkcijas atgriež <code>Proc<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tas jums pasaka, kā programma beidza darbu.<\/span> <span class=\"sg\" data-s=\"2\">Parasti palaistā programma lieto to pašu izvadi, ko jūsu programma.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs redzat tās izvadi ekrānā.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat šo izvadi arī noķert.<\/span> <span class=\"sg\" data-s=\"5\">Tam jums tā ir jāpieprasa.<\/span> <span class=\"sg\" data-s=\"6\">Nākamais temats rāda, kā to izdarīt.<\/span><\/p>"]]},"ru":{"t":"run и shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Есть два способа запустить внешнюю программу.<\/span> <span class=\"sg\" data-s=\"1\">Первый способ — функция <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Она не использует оболочку.<\/span> <span class=\"sg\" data-s=\"3\">Оболочка — это программа, которая читает команды и выполняет их.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> принимает команду и её аргументы как <strong>отдельные<\/strong> значения.<\/span> <span class=\"sg\" data-s=\"5\">Аргументы — это значения, которые вы даёте команде.<\/span> <span class=\"sg\" data-s=\"6\">Потом <code>run<\/code> запускает программу напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Этот код запускает программу <code>echo<\/code> с одним аргументом, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Программа печатает <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Аргументы приходят в программу по отдельности.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому никакая оболочка не может неправильно понять пробелы или специальные символы.<\/span> <span class=\"sg\" data-s=\"4\">Вот почему <code>run<\/code> — безопасный выбор по умолчанию.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Функция <code>shell<\/code> работает по-другому.<\/span> <span class=\"sg\" data-s=\"1\">Она даёт <strong>одну строку<\/strong> оболочке системы.<\/span> <span class=\"sg\" data-s=\"2\">Оболочка читает эту строку и выполняет её.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно использовать возможности оболочки, например перенаправление и конвейеры.<\/span> <span class=\"sg\" data-s=\"4\">Перенаправление отправляет вывод в другое место, например в файл.<\/span> <span class=\"sg\" data-s=\"5\">Конвейер передаёт вывод одной команды следующей:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Здесь оболочка запускает <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Конвейер передаёт его вывод в <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потом оболочка печатает <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это просто, но есть риск.<\/span> <span class=\"sg\" data-s=\"4\">Оболочка сама читает строку и находит в ней части.<\/span> <span class=\"sg\" data-s=\"5\">Может быть, строка пришла из ввода, которому вы не доверяете.<\/span> <span class=\"sg\" data-s=\"6\">Тогда команда <code>shell<\/code> опасна.<\/span> <span class=\"sg\" data-s=\"7\">Используйте <code>run<\/code>, если вам правда не нужны возможности оболочки.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обе функции возвращают объект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он говорит, как закончилась программа.<\/span> <span class=\"sg\" data-s=\"2\">Обычно запущенная программа использует тот же вывод, что и ваша программа.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому вы видите её вывод на экране.<\/span> <span class=\"sg\" data-s=\"4\">Этот вывод можно и перехватить.<\/span> <span class=\"sg\" data-s=\"5\">Для этого его нужно запросить.<\/span> <span class=\"sg\" data-s=\"6\">Следующая тема показывает, как это сделать.<\/span><\/p>"]]},"uk":{"t":"run та shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Є два способи запустити зовнішню програму.<\/span> <span class=\"sg\" data-s=\"1\">Перший — це функція <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вона не використовує оболонку.<\/span> <span class=\"sg\" data-s=\"3\">Оболонка — це програма, яка читає команди й виконує їх.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> бере команду та її аргументи як <strong>окремі<\/strong> значення.<\/span> <span class=\"sg\" data-s=\"5\">Аргументи — це значення, які ви даєте команді.<\/span> <span class=\"sg\" data-s=\"6\">Потім <code>run<\/code> запускає програму напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це запускає програму <code>echo<\/code> з одним аргументом, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програма виводить <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Аргументи приходять до програми окремо.<\/span> <span class=\"sg\" data-s=\"3\">Тож жодна оболонка не може неправильно зрозуміти пробіли чи особливі символи.<\/span> <span class=\"sg\" data-s=\"4\">Ось чому <code>run<\/code> — безпечний вибір за замовчуванням.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Функція <code>shell<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"1\">Вона дає <strong>один рядок<\/strong> оболонці системи.<\/span> <span class=\"sg\" data-s=\"2\">Оболонка читає цей рядок і виконує його.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете використовувати можливості оболонки, як-от перенаправлення й канали.<\/span> <span class=\"sg\" data-s=\"4\">Перенаправлення надсилає вивід в інше місце, наприклад у файл.<\/span> <span class=\"sg\" data-s=\"5\">Канал передає вивід однієї команди наступній:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тут оболонка запускає <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Канал передає його вивід до <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім оболонка виводить <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це зручно, але є ризик.<\/span> <span class=\"sg\" data-s=\"4\">Оболонка сама читає рядок і знаходить його частини.<\/span> <span class=\"sg\" data-s=\"5\">Можливо, рядок приходить із введення, якому ви не довіряєте.<\/span> <span class=\"sg\" data-s=\"6\">Тоді команда <code>shell<\/code> небезпечна.<\/span> <span class=\"sg\" data-s=\"7\">Використовуйте <code>run<\/code>, якщо вам не потрібні саме можливості оболонки.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обидві функції повертають об'єкт <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він каже вам, як програма завершилася.<\/span> <span class=\"sg\" data-s=\"2\">Зазвичай запущена програма використовує той самий вивід, що й ваша програма.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви бачите її вивід на екрані.<\/span> <span class=\"sg\" data-s=\"4\">Цей вивід можна також перехопити.<\/span> <span class=\"sg\" data-s=\"5\">Для цього треба про це попросити.<\/span> <span class=\"sg\" data-s=\"6\">Наступна тема показує, як це зробити.<\/span><\/p>"]]},"bg":{"t":"run и shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Има два начина да стартирате външна програма.<\/span> <span class=\"sg\" data-s=\"1\">Първият е функцията <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тя не използва обвивка.<\/span> <span class=\"sg\" data-s=\"3\">Обвивката е програма, която чете команди и ги изпълнява.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> приема командата и аргументите ѝ като <strong>отделни<\/strong> стойности.<\/span> <span class=\"sg\" data-s=\"5\">Аргументите са стойностите, които давате на командата.<\/span> <span class=\"sg\" data-s=\"6\">После <code>run<\/code> стартира програмата направо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това изпълнява програмата <code>echo<\/code> с един аргумент, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Програмата отпечатва <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Аргументите стигат до програмата поотделно.<\/span> <span class=\"sg\" data-s=\"3\">Затова никоя обвивка не може да разбере погрешно интервалите или специалните символи.<\/span> <span class=\"sg\" data-s=\"4\">Ето защо <code>run<\/code> е безопасният избор по подразбиране.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>shell<\/code> работи по друг начин.<\/span> <span class=\"sg\" data-s=\"1\">Тя дава <strong>един-единствен низ<\/strong> на обвивката на системата.<\/span> <span class=\"sg\" data-s=\"2\">Обвивката чете низа и го изпълнява.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да използвате възможности на обвивката, като пренасочване и канали.<\/span> <span class=\"sg\" data-s=\"4\">Пренасочването изпраща изхода на друго място, например във файл.<\/span> <span class=\"sg\" data-s=\"5\">Каналът изпраща изхода на една команда към следващата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тук обвивката изпълнява <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Един канал изпраща изхода на <code>echo<\/code> към <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">После обвивката отпечатва <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това е лесно, но има риск.<\/span> <span class=\"sg\" data-s=\"4\">Самата обвивка чете низа и намира частите му.<\/span> <span class=\"sg\" data-s=\"5\">Може би низът идва от вход, на който не вярвате.<\/span> <span class=\"sg\" data-s=\"6\">Тогава командата за <code>shell<\/code> е опасна.<\/span> <span class=\"sg\" data-s=\"7\">Използвайте <code>run<\/code>, освен ако наистина не ви трябват възможности на обвивката.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">И двете функции връщат обект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той ви казва как е приключила програмата.<\/span> <span class=\"sg\" data-s=\"2\">Обикновено стартираната програма използва същия изход като вашата програма.<\/span> <span class=\"sg\" data-s=\"3\">Затова виждате изхода ѝ на екрана.<\/span> <span class=\"sg\" data-s=\"4\">Можете и да уловите този изход.<\/span> <span class=\"sg\" data-s=\"5\">За това трябва да го поискате.<\/span> <span class=\"sg\" data-s=\"6\">Следващата тема показва как.<\/span><\/p>"]]},"eo":{"t":"run kaj shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Estas du manieroj lanĉi eksteran programon.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la funkcio <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne uzas ŝelon.<\/span> <span class=\"sg\" data-s=\"3\">Ŝelo estas programo, kiu legas komandojn kaj rulas ilin.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> prenas la komandon kaj ĝiajn argumentojn kiel <strong>apartajn<\/strong> valorojn.<\/span> <span class=\"sg\" data-s=\"5\">Argumentoj estas la valoroj, kiujn vi donas al la komando.<\/span> <span class=\"sg\" data-s=\"6\">Poste <code>run<\/code> lanĉas la programon rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio rulas la programon <code>echo<\/code> kun unu argumento, <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La programo presas <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La argumentoj venas al la programo aparte.<\/span> <span class=\"sg\" data-s=\"3\">Do neniu ŝelo povas miskompreni spacojn aŭ specialajn signojn.<\/span> <span class=\"sg\" data-s=\"4\">Tial <code>run<\/code> estas la sekura defaŭlta elekto.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>shell<\/code> funkcias alimaniere.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi donas <strong>unu solan ĉenon<\/strong> al la ŝelo de la sistemo.<\/span> <span class=\"sg\" data-s=\"2\">La ŝelo legas la ĉenon kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas uzi ecojn de la ŝelo, kiel redirektadon kaj duktojn.<\/span> <span class=\"sg\" data-s=\"4\">Redirektado sendas eligon al alia loko, ekzemple al dosiero.<\/span> <span class=\"sg\" data-s=\"5\">Dukto sendas la eligon de unu komando al la sekva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la ŝelo rulas <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dukto sendas ĝian eligon al <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste la ŝelo presas <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas facila, sed estas risko.<\/span> <span class=\"sg\" data-s=\"4\">La ŝelo mem legas la ĉenon kaj trovas ĝiajn partojn.<\/span> <span class=\"sg\" data-s=\"5\">Eble la ĉeno venas el enigo, kiun vi ne fidas.<\/span> <span class=\"sg\" data-s=\"6\">Tiam komando <code>shell<\/code> estas danĝera.<\/span> <span class=\"sg\" data-s=\"7\">Uzu <code>run<\/code>, krom se vi vere bezonas ecojn de la ŝelo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ funkcioj redonas objekton <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi diras al vi, kiel la programo finiĝis.<\/span> <span class=\"sg\" data-s=\"2\">Normale, la lanĉita programo uzas la saman eligon kiel via programo.<\/span> <span class=\"sg\" data-s=\"3\">Do vi vidas ĝian eligon sur la ekrano.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas kapti ĉi tiun eligon.<\/span> <span class=\"sg\" data-s=\"5\">Por tio, vi devas peti ĝin.<\/span> <span class=\"sg\" data-s=\"6\">La sekva temo montras, kiel.<\/span><\/p>"]]},"la":{"t":"run et shell","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Programma externum duobus modis incipere potes.<\/span> <span class=\"sg\" data-s=\"1\">Primus est functio <code>run<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Interpretem non adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Interpres est programma quod imperata legit et currit.<\/span> <span class=\"sg\" data-s=\"4\"><code>run<\/code> imperatum et argumenta eius ut valores <strong>separatos<\/strong> accipit.<\/span> <span class=\"sg\" data-s=\"5\">Argumenta sunt valores quos imperato das.<\/span> <span class=\"sg\" data-s=\"6\">Deinde <code>run<\/code> programma directe incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc programma <code>echo<\/code> cum uno argumento, <code>hello<\/code>, currit.<\/span> <span class=\"sg\" data-s=\"1\">Programma <code>hello<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Argumenta separatim ad programma veniunt.<\/span> <span class=\"sg\" data-s=\"3\">Itaque nullus interpres spatia aut characteres speciales male intellegere potest.<\/span> <span class=\"sg\" data-s=\"4\">Ideo <code>run<\/code> electio praedefinita tuta est.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Functio <code>shell<\/code> alio modo operatur.<\/span> <span class=\"sg\" data-s=\"1\">Ea <strong>unam chordam<\/strong> ad interpretem systematis dat.<\/span> <span class=\"sg\" data-s=\"2\">Interpres chordam legit et currit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque facultates interpretis adhibere potes, ut redirectionem et fistulas.<\/span> <span class=\"sg\" data-s=\"4\">Redirectio exitum in alium locum mittit, exempli gratia in archivum.<\/span> <span class=\"sg\" data-s=\"5\">Fistula exitum unius imperati ad proximum mittit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Hic interpres <code>echo<\/code> currit.<\/span> <span class=\"sg\" data-s=\"1\">Fistula exitum eius ad <code>tr<\/code> mittit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde interpres <code>HELLO<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc facile est, sed periculum est.<\/span> <span class=\"sg\" data-s=\"4\">Ipse interpres chordam legit et partes eius invenit.<\/span> <span class=\"sg\" data-s=\"5\">Fortasse chorda ex introitu venit cui non confidis.<\/span> <span class=\"sg\" data-s=\"6\">Tum imperatum <code>shell<\/code> periculosum est.<\/span> <span class=\"sg\" data-s=\"7\">Utere <code>run<\/code>, nisi facultates interpretis vere requiris.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ambae functiones obiectum <code>Proc<\/code> reddunt.<\/span> <span class=\"sg\" data-s=\"1\">Tibi dicit quomodo programma finierit.<\/span> <span class=\"sg\" data-s=\"2\">Plerumque programma inceptum eundem exitum adhibet quem programma tuum.<\/span> <span class=\"sg\" data-s=\"3\">Itaque exitum eius in screen vides.<\/span> <span class=\"sg\" data-s=\"4\">Etiam hunc exitum capere potes.<\/span> <span class=\"sg\" data-s=\"5\">Ad hoc eum petere debes.<\/span> <span class=\"sg\" data-s=\"6\">Argumentum sequens ostendit quomodo.<\/span><\/p>"]]}}}</script>
