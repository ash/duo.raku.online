<script type="application/json" id="page-data">{"u":"oop/external-programs/exercises/run-a-command/solution","n":917,"k":"solution","pv":"oop/external-programs/exercises/run-a-command","nx":"oop/external-programs/exercises/capture-output","tr":["oop","oop/external-programs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Run a command‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> starts <code>echo<\/code> directly. It passes each string as a separate argument. There is no <code>:out<\/code>. So the output of the program goes straight to the screen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The argument comes to <code>echo<\/code> exactly as you wrote it. So <code>$HOME<\/code> is printed as it is. It is not replaced with your home directory. This is because there is no shell. A shell would replace it. This is why <code>run<\/code> is the safe default choice. With <code>shell<\/code>, the same command can work very differently.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Do you really want to print the home directory? Then let a shell replace the variable. <code>shell 'echo home: $HOME'<\/code> prints something like <code>home: /home/anna<\/code>. Also keep the single quotes in the Raku code. With double quotes, <code>\"$HOME\"<\/code>, there is a problem. Raku itself tries to insert its own variable <code>$HOME<\/code> into the string. This happens before <code>echo<\/code> even runs.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Führen Sie einen Befehl aus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> startet <code>echo<\/code> direkt. Dabei übergibt <code>run<\/code> jede Zeichenkette als eigenes Argument. Es gibt kein <code>:out<\/code>. Also geht die Ausgabe des Programms direkt auf den Bildschirm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Argument kommt genau so bei <code>echo<\/code> an, wie Sie es geschrieben haben. Also gibt das Programm <code>$HOME<\/code> unverändert aus. Nichts ersetzt <code>$HOME<\/code> durch Ihr Heimatverzeichnis. Denn hier gibt es keine Shell. Eine Shell würde die Variable ersetzen. Darum ist <code>run<\/code> die sichere Standardwahl. Mit <code>shell<\/code> kann derselbe Befehl ganz anders arbeiten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Möchten Sie das Heimatverzeichnis wirklich ausgeben? Dann lassen Sie eine Shell die Variable ersetzen. <code>shell 'echo home: $HOME'<\/code> gibt etwas wie <code>home: /home/anna<\/code> aus. Behalten Sie auch die einfachen Anführungszeichen im Raku-Code. Mit doppelten Anführungszeichen, <code>\"$HOME\"<\/code>, gibt es ein Problem. Raku selbst versucht dann, seine eigene Variable <code>$HOME<\/code> in die Zeichenkette einzusetzen. Das passiert, noch bevor <code>echo<\/code> überhaupt läuft.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Draai een commando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> start <code>echo<\/code> direct. De functie geeft elke string als los argument mee. Er is geen <code>:out<\/code>. Dus gaat de uitvoer van het programma meteen naar het scherm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het argument komt bij <code>echo<\/code> precies zoals je het hebt geschreven. Dus verschijnt <code>$HOME<\/code> zoals het er staat. Het wordt niet vervangen door je thuismap. Dat komt doordat er geen shell is. Een shell zou het wel vervangen. Daarom is <code>run<\/code> de veilige standaardkeuze. Met <code>shell<\/code> kan hetzelfde commando heel anders werken.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wil je de thuismap echt afdrukken? Laat dan een shell de variabele vervangen. <code>shell 'echo home: $HOME'<\/code> drukt iets af als <code>home: /home/anna<\/code>. Houd in de Raku-code ook de enkele aanhalingstekens. Met dubbele aanhalingstekens, <code>\"$HOME\"<\/code>, is er een probleem. Raku probeert dan zelf zijn eigen variabele <code>$HOME<\/code> in de string te zetten. Dat gebeurt nog voordat <code>echo<\/code> draait.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Ejecute un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> inicia <code>echo<\/code> directamente. Pasa cada cadena como un argumento separado. No hay <code>:out<\/code>. Así que la salida del programa va directa a la pantalla.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El argumento llega a <code>echo<\/code> justo como lo escribiste. Así que el programa imprime <code>$HOME<\/code> tal cual. No lo cambia por tu carpeta personal. Esto pasa porque no hay ninguna shell. Una shell lo cambiaría. Por eso <code>run<\/code> es la opción segura por defecto. Con <code>shell<\/code>, la misma orden puede funcionar de forma muy distinta.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">¿De verdad quieres imprimir la carpeta personal? Entonces deja que una shell cambie la variable. <code>shell 'echo home: $HOME'<\/code> imprime algo como <code>home: /home/anna<\/code>. Mantén también las comillas simples en el código de Raku. Con comillas dobles, <code>\"$HOME\"<\/code>, hay un problema. Raku mismo intenta poner su propia variable <code>$HOME<\/code> en la cadena. Esto pasa antes de que <code>echo<\/code> se ejecute.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Eseguite un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> avvia <code>echo<\/code> direttamente. Passa ogni stringa come argomento separato. Non c'è <code>:out<\/code>. Quindi l'output del programma va dritto sullo schermo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'argomento arriva a <code>echo<\/code> esattamente come l'hai scritto. Quindi <code>echo<\/code> stampa <code>$HOME<\/code> così com'è. Non lo sostituisce con la tua directory home. Questo perché non c'è una shell. Una shell lo sostituirebbe. Per questo <code>run<\/code> è la scelta predefinita sicura. Con <code>shell<\/code>, lo stesso comando può funzionare in modo molto diverso.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vuoi davvero stampare la directory home? Allora lascia che una shell sostituisca la variabile. <code>shell 'echo home: $HOME'<\/code> stamp turiet vienpēdiņas. Ar dubultpēdiņām, <code>\"$HOME\"<\/code>, ir problēma. Pats Raku mēģina ielikt virknē savu mainīgo <code>$HOME<\/code>. Tas notiek pirms <code>echo<\/code> vispār sāk darbu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Запустите команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускает <code>echo<\/code> напрямую. Он передаёт каждую строку как отдельный аргумент. Здесь нет <code>:out<\/code>. Поэтому вывод программы идёт прямо на экран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент приходит к <code>echo<\/code> точно таким, каким вы его написали. Поэтому <code>$HOME<\/code> печатается как есть. Он не заменяется вашим домашним каталогом. Это потому, что здесь нет оболочки. Оболочка бы его заменила. Вот почему <code>run<\/code> — безопасный выбор по умолчанию. С <code>shell<\/code> та же команда может работать совсем по-другому.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вы правда хотите напечатать домашний каталог? Тогда пусть переменную заменит оболочка. <code>shell 'echo home: $HOME'<\/code> печатает что-то вроде <code>home: /home/anna<\/code>. Ещё оставьте одинарные кавычки в коде на Raku. С двойными кавычками, <code>\"$HOME\"<\/code>, есть проблема. Сам Raku пытается вставить в строку свою переменную <code>$HOME<\/code>. Это происходит ещё до того, как запускается <code>echo<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Запустіть команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускає <code>echo<\/code> напряму. Він передає кожен рядок як окремий аргумент. Тут немає <code>:out<\/code>. Тож вивід програми йде просто на екран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент приходить до <code>echo<\/code> точно так, як ви його написали. Тож <code>$HOME<\/code> виводиться без змін. Він не замінюється вашим домашнім каталогом. Це тому, що тут немає оболонки. Оболонка замінила б його. Ось чому <code>run<\/code> — безпечний вибір за замовчуванням. Через <code>shell<\/code> та сама команда може працювати зовсім інакше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ви справді хочете вивести домашній каталог? Тоді хай змінну замінить оболонка. <code>shell 'echo home: $HOME'<\/code> виводить щось на кшталт <code>home: /home/anna<\/code>. Також залиште одинарні лапки в коді Raku. З подвійними лапками, <code>\"$HOME\"<\/code>, буде проблема. Raku сам намагається вставити в рядок свою змінну <code>$HOME<\/code>. Це стається ще до того, як <code>echo<\/code> запускається.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изпълнете команда","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> стартира <code>echo<\/code> направо. <code>run<\/code> подава всеки низ като отделен аргумент. Тук няма <code>:out<\/code>. Затова изходът на програмата отива право на екрана.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргументът стига до <code>echo<\/code> точно както сте го написали. Затова <code>$HOME<\/code> се отпечатва точно така, както е написан. Той не се заменя с вашата домашна директория. Това е така, защото няма обвивка. Обвивката би го заменила. Ето защо <code>run<\/code> е безопасният избор по подразбиране. С <code>shell<\/code> същата команда може да работи съвсем различно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наистина ли искате да отпечатате домашната директория? Тогава оставете обвивката да замени променливата. <code>shell 'echo home: $HOME'<\/code> отпечатва нещо като <code>home: /home/anna<\/code>. Запазете и единичните кавички в кода на Raku. С двойни кавички, <code>\"$HOME\"<\/code>, има проблем. Самият Raku се опитва да вмъкне своя променлива <code>$HOME<\/code> в низа. Това става, преди <code>echo<\/code> дори да започне работа.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Rulu komandon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> lanĉas <code>echo<\/code> rekte. Ĝi transdonas ĉiun ĉenon kiel apartan argumenton. Ne estas <code>:out<\/code>. Do la eligo de la programo iras rekte al la ekrano.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La argumento venas al <code>echo<\/code> ĝuste tiel, kiel vi skribis ĝin. Do <code>$HOME<\/code> aperas tiel, kiel ĝi estas. Nenio anstataŭigas ĝin per via hejma dosierujo. Tio estas, ĉar ne estas ŝelo. Ŝelo anstataŭigus ĝin. Tial <code>run<\/code> estas la sekura defaŭlta elekto. Kun <code>shell<\/code>, la sama komando povas funkcii tre alie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉu vi vere volas presi la hejman dosierujon? Tiam lasu ŝelon anstataŭigi la variablon. <code>shell 'echo home: $HOME'<\/code> presas ion kiel <code>home: /home/anna<\/code>. Tenu ankaŭ la unuoblajn citilojn en la Raku-kodo. Kun duoblaj citiloj, <code>\"$HOME\"<\/code>, estas problemo. Raku mem provas enmeti sian propran variablon <code>$HOME<\/code> en la ĉenon. Tio okazas eĉ antaŭ ol <code>echo<\/code> ruliĝas.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Mandatum exsequere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> programma <code>echo<\/code> directe incipit. Quamque chordam ut argumentum separatum tradit. Nullum <code>:out<\/code> adest. Itaque exitus programmatis recta in screen it.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Argumentum ad <code>echo<\/code> venit exacte ut id scripsisti. Itaque programma <code>$HOME<\/code> ut est imprimit. Pro eo directoriam domesticam tuam non ponit. Hoc fit quia nullus interpres adest. Interpres eum mutaret. Ideo <code>run<\/code> electio praedefinita tuta est. Cum <code>shell<\/code> idem imperatum valde aliter operari potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Visne vere directoriam domesticam imprimere? Tum sine interpretem variabilem mutare. <code>shell 'echo home: $HOME'<\/code> aliquid ut <code>home: /home/anna<\/code> imprimit. Etiam apostrophos simplices in codice Raku serva. Cum apostrophis duplicibus, <code>\"$HOME\"<\/code>, problema est. Ipsum Raku variabilem suam <code>$HOME<\/code> in chordam inserere conatur. Hoc fit antequam <code>echo<\/code> omnino currit.<\/span><\/li><\/ol>"]]}}}</script>
