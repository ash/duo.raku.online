>:out<\/code> и обрезаем его.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В конце мы убираем за собой в Raku с помощью <code>unlink<\/code>. Оболочка для этого не нужна. Удалить файл — это простая операция файловой системы. Поэтому незачем запускать для этого ещё один процесс. Процесс — это работающая программа.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Передайте змінну дитині","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $file = 'notes.txt';\nspurt $file, \"one\\ntwo\\nthree\\n\";\n\n%*ENV&lt;NOTES&gt; = $file;\n\nmy $proc = shell 'wc -l &lt; \"$NOTES\"', :out;\nsay $proc.out.slurp(:close).trim;\n\nunlink $file;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/read-env.raku\" target=\"_blank\" rel=\"noopener\">read-env.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>3<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> створює <code>notes.txt<\/code> із трьома рядками. Потім ми записуємо ім'я файлу в <code>%*ENV&lt;NOTES&gt;<\/code>. Тож тепер ім'я файлу лежить у середовищі. Кожна дочірня програма отримує це середовище.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Команда <code>shell<\/code> отримує це середовище. Вона замінює <code>$NOTES<\/code> на <code>notes.txt<\/code>. Потім вона передає файл у <code>wc -l<\/code>. <code>wc -l<\/code> рахує рядки файлу. Перенаправлення <code>&lt; \"$NOTES\"<\/code> тут важливе. Через нього вивід — це лише число <code>3<\/code>. Ми перехоплюємо це число через <code>:out<\/code> і обрізаємо його.<\/span><
