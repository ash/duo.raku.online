er/exercises/oop/external-programs/check-exit-code.raku\" target=\"_blank\" rel=\"noopener\">check-exit-code.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>4\nfailure<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> obiectum <code>Proc<\/code> reddit. Id in <code>$proc<\/code> servamus et deinde legimus. Hoc hic magni momenti est. Imperatum deficere potest. Si nemo <code>Proc<\/code> eius servat, Raku exceptionem iacit. Exceptio est error qui programma sistit. Sed hic effectum inspicimus. Hoc idem est ac defectum tractare.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.exitcode<\/code> numerum dat quem imperatum reddidit. Hic est <code>4<\/code>. Etiam <code>Proc<\/code> ut valorem Booleanum probare potes. Valor Booleanus verus aut falsus est. Hoc ad quaestionem simpliciorem respondet: operatumne est imperatum? <code>Proc<\/code> verum est solum cum codex exeundi <code>0<\/code> est. Hic falsum est. Itaque programma <code>failure<\/code> imprimit.<\/span><\/li><\/ol>"]]}}}</script>
