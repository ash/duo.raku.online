<script type="application/json" id="page-data">{"u":"oop/external-programs/the-proc-object","n":911,"k":"topic","pv":"oop/external-programs/capturing-output","nx":"oop/external-programs/the-proc-object/quiz","tr":["oop","oop/external-programs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Proc object","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Every call to <code>run<\/code> or <code>shell<\/code> gives back a <code>Proc<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">It is a small record about the program.<\/span> <span class=\"sg\" data-s=\"2\">It tells you which program ran and how it ended.<\/span> <span class=\"sg\" data-s=\"3\">In the earlier topics, we used its <code>.out<\/code> handle to read output.<\/span> <span class=\"sg\" data-s=\"4\">But a <code>Proc<\/code> holds more than that.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">The most useful part is the <strong>exit code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">It is a small whole number.<\/span> <span class=\"sg\" data-s=\"2\">A program gives it back to the one who started it.<\/span> <span class=\"sg\" data-s=\"3\">With this number, the program says if it worked.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> means success.<\/span> <span class=\"sg\" data-s=\"5\">Any other number means failure.<\/span> <span class=\"sg\" data-s=\"6\">The program itself chooses this failure code.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> gives you the number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Often you only ask a yes-or-no question.<\/span> <span class=\"sg\" data-s=\"1\">Did it work?<\/span> <span class=\"sg\" data-s=\"2\">For this, a <code>Proc<\/code> is true when the exit code is <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Otherwise, it is false.<\/span> <span class=\"sg\" data-s=\"4\">So you can test the <code>Proc<\/code> directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>Proc<\/code> also remembers the command that it started.<\/span> <span class=\"sg\" data-s=\"1\">You find it in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Be careful with one thing.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes a command fails.<\/span> <span class=\"sg\" data-s=\"2\">What if you simply <strong>ignore<\/strong> the <code>Proc<\/code> that it returns?<\/span> <span class=\"sg\" data-s=\"3\">Then Raku raises an exception.<\/span> <span class=\"sg\" data-s=\"4\">An exception is an error that stops the program.<\/span> <span class=\"sg\" data-s=\"5\">Raku does not let the failure stay hidden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">An exit code other than <code>0<\/code> usually means a problem.<\/span> <span class=\"sg\" data-s=\"1\">So a failing <code>Proc<\/code> throws an exception if you throw it away.<\/span> <span class=\"sg\" data-s=\"2\">This happens when the <code>Proc<\/code> goes out of scope.<\/span> <span class=\"sg\" data-s=\"3\">Then no code can reach it any more.<\/span> <span class=\"sg\" data-s=\"4\">This is not about checking the exit code.<\/span> <span class=\"sg\" data-s=\"5\">It is about <em>throwing away<\/em> the result.<\/span> <span class=\"sg\" data-s=\"6\">Just put the <code>Proc<\/code> into a variable.<\/span> <span class=\"sg\" data-s=\"7\">This is enough to avoid the exception.<\/span> <span class=\"sg\" data-s=\"8\">You do not even have to look at the variable again.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So, do you <em>expect<\/em> that a command may fail?<\/span> <span class=\"sg\" data-s=\"1\">Then keep its <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">When you want to know what happened, look at <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Or test the <code>Proc<\/code> as a Boolean.<\/span><\/p>"]]},"de":{"t":"Das Proc-Objekt","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>run<\/code> oder <code>shell<\/code> gibt ein <code>Proc<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es ist ein kleiner Bericht über das Programm.<\/span> <span class=\"sg\" data-s=\"2\">Es sagt Ihnen, welches Programm gelaufen ist und wie es geendet hat.<\/span> <span class=\"sg\" data-s=\"3\">In den früheren Themen haben wir seinen Handle <code>.out<\/code> zum Lesen der Ausgabe benutzt.<\/span> <span class=\"sg\" data-s=\"4\">Aber ein <code>Proc<\/code> enthält mehr als das.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Der nützlichste Teil ist der <strong>Exit-Code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Er ist eine kleine ganze Zahl.<\/span> <span class=\"sg\" data-s=\"2\">Ein Programm gibt sie an den zurück, der es gestartet hat.<\/span> <span class=\"sg\" data-s=\"3\">Mit dieser Zahl sagt das Programm, ob es funktioniert hat.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> bedeutet Erfolg.<\/span> <span class=\"sg\" data-s=\"5\">Jede andere Zahl bedeutet einen Fehler.<\/span> <span class=\"sg\" data-s=\"6\">Das Programm wählt diesen Fehlercode selbst.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> gibt Ihnen die Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Oft stellen Sie nur eine Ja-oder-Nein-Frage.<\/span> <span class=\"sg\" data-s=\"1\">Hat es funktioniert?<\/span> <span class=\"sg\" data-s=\"2\">Dafür ist ein <code>Proc<\/code> wahr, wenn der Exit-Code <code>0<\/code> ist.<\/span> <span class=\"sg\" data-s=\"3\">Sonst ist es falsch.<\/span> <span class=\"sg\" data-s=\"4\">Also können Sie das <code>Proc<\/code> direkt prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Proc<\/code> merkt sich auch den Befehl, den es gestartet hat.<\/span> <span class=\"sg\" data-s=\"1\">Sie finden ihn in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Passen Sie bei einer Sache auf.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal schlägt ein Befehl fehl.<\/span> <span class=\"sg\" data-s=\"2\">Was ist, wenn Sie sein <code>Proc<\/code> einfach <strong>ignorieren<\/strong>?<\/span> <span class=\"sg\" data-s=\"3\">Dann löst Raku eine Ausnahme aus.<\/span> <span class=\"sg\" data-s=\"4\">Eine Ausnahme ist ein Fehler, der das Programm anhält.<\/span> <span class=\"sg\" data-s=\"5\">Raku versteckt den Fehler nicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ein anderer Exit-Code als <code>0<\/code> bedeutet meistens ein Problem.<\/span> <span class=\"sg\" data-s=\"1\">Also wirft ein fehlgeschlagenes <code>Proc<\/code> eine Ausnahme, wenn Sie es wegwerfen.<\/span> <span class=\"sg\" data-s=\"2\">Das passiert, wenn das <code>Proc<\/code> seinen Gültigkeitsbereich verlässt.<\/span> <span class=\"sg\" data-s=\"3\">Dann kann kein Code es mehr erreichen.<\/span> <span class=\"sg\" data-s=\"4\">Es geht hier nicht um das Prüfen des Exit-Codes.<\/span> <span class=\"sg\" data-s=\"5\">Es geht um das <em>Wegwerfen<\/em> des Ergebnisses.<\/span> <span class=\"sg\" data-s=\"6\">Legen Sie das <code>Proc<\/code> einfach in eine Variable.<\/span> <span class=\"sg\" data-s=\"7\">Das reicht schon, um die Ausnahme zu vermeiden.<\/span> <span class=\"sg\" data-s=\"8\">Sie müssen die Variable nicht einmal wieder ansehen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Erwarten<\/em> Sie also, dass ein Befehl fehlschlagen kann?<\/span> <span class=\"sg\" data-s=\"1\">Dann behalten Sie sein <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie wissen möchten, was passiert ist, sehen Sie sich <code>.exitcode<\/code> an.<\/span> <span class=\"sg\" data-s=\"3\">Oder prüfen Sie das <code>Proc<\/code> als Wahrheitswert.<\/span><\/p>"]]},"nl":{"t":"Het Proc-object","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>run<\/code> of <code>shell<\/code> geeft een <code>Proc<\/code>-object terug.<\/span> <span class=\"sg\" data-s=\"1\">Het is een klein verslag over het programma.<\/span> <span class=\"sg\" data-s=\"2\">Het vertelt welk programma draaide en hoe het stopte.<\/span> <span class=\"sg\" data-s=\"3\">In de eerdere onderwerpen gebruikten we zijn handle <code>.out<\/code> om uitvoer te lezen.<\/span> <span class=\"sg\" data-s=\"4\">Maar een <code>Proc<\/code> bevat meer dan dat.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Het nuttigste deel is de <strong>exitcode<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is een klein geheel getal.<\/span> <span class=\"sg\" data-s=\"2\">Een programma geeft het terug aan wie het gestart heeft.<\/span> <span class=\"sg\" data-s=\"3\">Met dit getal zegt het programma of het gewerkt heeft.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> betekent succes.<\/span> <span class=\"sg\" data-s=\"5\">Elk ander getal betekent een mislukking.<\/span> <span class=\"sg\" data-s=\"6\">Het programma kiest deze foutcode zelf.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> geeft je het getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vaak stel je alleen een ja/nee-vraag.<\/span> <span class=\"sg\" data-s=\"1\">Heeft het gewerkt?<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor is een <code>Proc<\/code> waar als de exitcode <code>0<\/code> is.<\/span> <span class=\"sg\" data-s=\"3\">Anders is hij onwaar.<\/span> <span class=\"sg\" data-s=\"4\">Dus kun je de <code>Proc<\/code> direct testen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>Proc<\/code> onthoudt ook het commando dat hij gestart heeft.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt het in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Let op één ding.<\/span> <span class=\"sg\" data-s=\"1\">Soms mislukt een commando.<\/span> <span class=\"sg\" data-s=\"2\">Wat als je de <code>Proc<\/code> die het teruggeeft gewoon <strong>negeert<\/strong>?<\/span> <span class=\"sg\" data-s=\"3\">Dan werpt Raku een exceptie.<\/span> <span class=\"sg\" data-s=\"4\">Een exceptie is een fout die het programma stopt.<\/span> <span class=\"sg\" data-s=\"5\">Raku laat de mislukking niet verborgen blijven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Een andere exitcode dan <code>0<\/code> betekent meestal een probleem.<\/span> <span class=\"sg\" data-s=\"1\">Een mislukkende <code>Proc<\/code> werpt dus een exceptie als je hem weggooit.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebeurt als de <code>Proc<\/code> buiten bereik raakt.<\/span> <span class=\"sg\" data-s=\"3\">Dan kan geen code hem meer bereiken.<\/span> <span class=\"sg\" data-s=\"4\">Het gaat hier niet om het controleren van de exitcode.<\/span> <span class=\"sg\" data-s=\"5\">Het gaat om het <em>weggooien<\/em> van het resultaat.<\/span> <span class=\"sg\" data-s=\"6\">Zet de <code>Proc<\/code> gewoon in een variabele.<\/span> <span class=\"sg\" data-s=\"7\">Dat is genoeg om de exceptie te vermijden.<\/span> <span class=\"sg\" data-s=\"8\">Je hoeft niet eens meer naar de variabele te kijken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Verwacht<\/em> je dus dat een commando kan mislukken?<\/span> <span class=\"sg\" data-s=\"1\">Bewaar dan zijn <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Als je wilt weten wat er gebeurd is, kijk dan naar <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Of test de <code>Proc<\/code> als boolean.<\/span><\/p>"]]},"es":{"t":"El objeto Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>run<\/code> o <code>shell<\/code> devuelve un objeto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es un pequeño registro sobre el programa.<\/span> <span class=\"sg\" data-s=\"2\">Te dice qué programa se ejecutó y cómo terminó.<\/span> <span class=\"sg\" data-s=\"3\">En los temas anteriores, usamos su manejador <code>.out<\/code> para leer la salida.<\/span> <span class=\"sg\" data-s=\"4\">Pero un <code>Proc<\/code> guarda más cosas.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La parte más útil es el <strong>código de salida<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Es un número entero pequeño.<\/span> <span class=\"sg\" data-s=\"2\">Un programa lo devuelve a quien lo inició.<\/span> <span class=\"sg\" data-s=\"3\">Con este número, el programa dice si funcionó.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> significa éxito.<\/span> <span class=\"sg\" data-s=\"5\">Cualquier otro número significa fallo.<\/span> <span class=\"sg\" data-s=\"6\">El programa mismo elige este código de fallo.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> te da el número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A menudo solo haces una pregunta de «sí» o «no».<\/span> <span class=\"sg\" data-s=\"1\">¿Funcionó?<\/span> <span class=\"sg\" data-s=\"2\">Para esto, un <code>Proc<\/code> es verdadero cuando el código de salida es <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Si no, es falso.<\/span> <span class=\"sg\" data-s=\"4\">Así que puedes comprobar el <code>Proc<\/code> directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> también recuerda la orden que inició.<\/span> <span class=\"sg\" data-s=\"1\">La encuentras en <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ten cuidado con una cosa.<\/span> <span class=\"sg\" data-s=\"1\">A veces una orden falla.<\/span> <span class=\"sg\" data-s=\"2\">¿Y si simplemente <strong>ignoras<\/strong> el <code>Proc<\/code> que devuelve?<\/span> <span class=\"sg\" data-s=\"3\">Entonces Raku lanza una excepción.<\/span> <span class=\"sg\" data-s=\"4\">Una excepción es un error que detiene el programa.<\/span> <span class=\"sg\" data-s=\"5\">Raku no deja que el fallo quede oculto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Un código de salida distinto de <code>0<\/code> suele significar un problema.<\/span> <span class=\"sg\" data-s=\"1\">Así que un <code>Proc<\/code> que falla lanza una excepción si lo tiras.<\/span> <span class=\"sg\" data-s=\"2\">Esto pasa cuando el <code>Proc<\/code> sale de su ámbito.<\/span> <span class=\"sg\" data-s=\"3\">Entonces ningún código puede llegar a él.<\/span> <span class=\"sg\" data-s=\"4\">No se trata de comprobar el código de salida.<\/span> <span class=\"sg\" data-s=\"5\">Se trata de <em>tirar<\/em> el resultado.<\/span> <span class=\"sg\" data-s=\"6\">Solo pon el <code>Proc<\/code> en una variable.<\/span> <span class=\"sg\" data-s=\"7\">Esto basta para evitar la excepción.<\/span> <span class=\"sg\" data-s=\"8\">Ni siquiera tienes que mirar la variable otra vez.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Así que, ¿<em>esperas<\/em> que una orden pueda fallar?<\/span> <span class=\"sg\" data-s=\"1\">Entonces guarda su <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando quieras saber qué pasó, mira <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">O comprueba el <code>Proc<\/code> como booleano.<\/span><\/p>"]]},"it":{"t":"L'oggetto Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>run<\/code> o <code>shell<\/code> restituisce un oggetto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È una piccola scheda sul programma.<\/span> <span class=\"sg\" data-s=\"2\">Ti dice quale programma è partito e come è finito.<\/span> <span class=\"sg\" data-s=\"3\">Negli argomenti precedenti abbiamo usato il suo handle <code>.out<\/code> per leggere l'output.<\/span> <span class=\"sg\" data-s=\"4\">Ma un <code>Proc<\/code> contiene più di questo.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La parte più utile è il <strong>codice di uscita<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">È un piccolo numero intero.<\/span> <span class=\"sg\" data-s=\"2\">Un programma lo restituisce a chi lo ha avviato.<\/span> <span class=\"sg\" data-s=\"3\">Con questo numero il programma dice se ha funzionato.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> vuol dire successo.<\/span> <span class=\"sg\" data-s=\"5\">Ogni altro numero vuol dire fallimento.<\/span> <span class=\"sg\" data-s=\"6\">Il programma stesso sceglie questo codice di fallimento.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> ti dà il numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Spesso fai solo una domanda con un sì o un no come risposta.<\/span> <span class=\"sg\" data-s=\"1\">Ha funzionato?<\/span> <span class=\"sg\" data-s=\"2\">Per questo un <code>Proc<\/code> è vero quando il codice di uscita è <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Altrimenti è falso.<\/span> <span class=\"sg\" data-s=\"4\">Così puoi controllare direttamente il <code>Proc<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> ricorda anche il comando che ha avviato.<\/span> <span class=\"sg\" data-s=\"1\">Lo trovi in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Fai attenzione a una cosa.<\/span> <span class=\"sg\" data-s=\"1\">A volte un comando fallisce.<\/span> <span class=\"sg\" data-s=\"2\">E se tu semplicemente <strong>ignori<\/strong> il <code>Proc<\/code> che restituisce?<\/span> <span class=\"sg\" data-s=\"3\">Allora Raku solleva un'eccezione.<\/span> <span class=\"sg\" data-s=\"4\">Un'eccezione è un errore che ferma il programma.<\/span> <span class=\"sg\" data-s=\"5\">Raku non lascia nascosto il fallimento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Un codice di uscita diverso da <code>0<\/code> di solito vuol dire un problema.<\/span> <span class=\"sg\" data-s=\"1\">Quindi un <code>Proc<\/code> fallito solleva un'eccezione se lo butti via.<\/span> <span class=\"sg\" data-s=\"2\">Questo succede quando il <code>Proc<\/code> esce dal suo ambito.<\/span> <span class=\"sg\" data-s=\"3\">Allora nessun codice può più raggiungerlo.<\/span> <span class=\"sg\" data-s=\"4\">Il punto non è controllare il codice di uscita.<\/span> <span class=\"sg\" data-s=\"5\">Il punto è <em>buttare via<\/em> il risultato.<\/span> <span class=\"sg\" data-s=\"6\">Metti semplicemente il <code>Proc<\/code> in una variabile.<\/span> <span class=\"sg\" data-s=\"7\">Questo basta per evitare l'eccezione.<\/span> <span class=\"sg\" data-s=\"8\">Non devi neanche guardare di nuovo la variabile.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quindi, ti <em>aspetti<\/em> che un comando possa fallire?<\/span> <span class=\"sg\" data-s=\"1\">Allora conserva il suo <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quando vuoi sapere che cosa è successo, guarda <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Oppure controlla il <code>Proc<\/code> come valore Booleano.<\/span><\/p>"]]},"lv":{"t":"Proc objekts","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>run<\/code> vai <code>shell<\/code> izsaukums atdod <code>Proc<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir neliels pieraksts par programmu.<\/span> <span class=\"sg\" data-s=\"2\">Tas jums pasaka, kura programma darbojās un kā tā beidza darbu.<\/span> <span class=\"sg\" data-s=\"3\">Iepriekšējos tematos mēs lietojām tā turi <code>.out<\/code>, lai nolasītu izvadi.<\/span> <span class=\"sg\" data-s=\"4\">Bet <code>Proc<\/code> satur vairāk nekā tikai to.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Visnoderīgākā daļa ir <strong>izejas kods<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir neliels vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"2\">Programma to atdod tam, kas to palaida.<\/span> <span class=\"sg\" data-s=\"3\">Ar šo skaitli programma pasaka, vai tā izdevās.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> nozīmē veiksmi.<\/span> <span class=\"sg\" data-s=\"5\">Jebkurš cits skaitlis nozīmē neveiksmi.<\/span> <span class=\"sg\" data-s=\"6\">Programma pati izvēlas šo neveiksmes kodu.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> jums dod šo skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bieži jūs uzdodat tikai jautājumu ar atbildi jā vai nē.<\/span> <span class=\"sg\" data-s=\"1\">Vai tas izdevās?<\/span> <span class=\"sg\" data-s=\"2\">Tādam jautājumam <code>Proc<\/code> ir patiess, kad izejas kods ir <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Citādi tas ir aplams.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc jūs varat pārbaudīt <code>Proc<\/code> tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> arī atceras komandu, ko tas palaida.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to atrodat laukā <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Uzmanieties ar vienu lietu.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz komanda neizdodas.<\/span> <span class=\"sg\" data-s=\"2\">Un ja jūs vienkārši <strong>ignorējat<\/strong> <code>Proc<\/code>, ko tā atgriež?<\/span> <span class=\"sg\" data-s=\"3\">Tad Raku izmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"4\">Izņēmums ir kļūda, kas aptur programmu.<\/span> <span class=\"sg\" data-s=\"5\">Raku neļauj neveiksmei palikt slēptai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Izejas kods, kas nav <code>0<\/code>, parasti nozīmē problēmu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc neveiksmīgs <code>Proc<\/code> izmet izņēmumu, ja jūs to izmetat.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek, kad <code>Proc<\/code> iziet no redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"3\">Tad neviens kods to vairs nevar sasniegt.<\/span> <span class=\"sg\" data-s=\"4\">Te nav runa par izejas koda pārbaudi.<\/span> <span class=\"sg\" data-s=\"5\">Runa ir par rezultāta <em>izmešanu<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Vienkārši ielieciet <code>Proc<\/code> mainīgajā.<\/span> <span class=\"sg\" data-s=\"7\">Ar to pietiek, un izņēmuma nebūs.<\/span> <span class=\"sg\" data-s=\"8\">Jums pat nav vēlreiz jāskatās uz mainīgo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tātad vai jūs <em>gaidāt<\/em>, ka komanda var neizdoties?<\/span> <span class=\"sg\" data-s=\"1\">Tad paturiet tās <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kad gribat zināt, kas notika, ieskatieties <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vai arī pārbaudiet <code>Proc<\/code> kā Būla vērtību.<\/span><\/p>"]]},"ru":{"t":"Объект Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>run<\/code> или <code>shell<\/code> возвращает объект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это небольшая запись о программе.<\/span> <span class=\"sg\" data-s=\"2\">Она говорит, какая программа работала и как она закончилась.<\/span> <span class=\"sg\" data-s=\"3\">В прошлых темах мы читали вывод через его дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Но в <code>Proc<\/code> есть не только это.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Самая полезная часть — <strong>код возврата<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Это небольшое целое число.<\/span> <span class=\"sg\" data-s=\"2\">Программа возвращает его тому, кто её запустил.<\/span> <span class=\"sg\" data-s=\"3\">Этим числом программа говорит, сработала ли она.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> значит успех.<\/span> <span class=\"sg\" data-s=\"5\">Любое другое число значит неудачу.<\/span> <span class=\"sg\" data-s=\"6\">Программа сама выбирает этот код неудачи.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> даёт вам это число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Часто вы задаёте только вопрос «да или нет».<\/span> <span class=\"sg\" data-s=\"1\">Всё сработало?<\/span> <span class=\"sg\" data-s=\"2\">Для этого <code>Proc<\/code> истинен, когда код возврата равен <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Иначе он ложен.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому <code>Proc<\/code> можно проверять напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ещё <code>Proc<\/code> помнит команду, которую он запустил.<\/span> <span class=\"sg\" data-s=\"1\">Вы найдёте её в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Будьте осторожны с одной вещью.<\/span> <span class=\"sg\" data-s=\"1\">Иногда команда даёт сбой.<\/span> <span class=\"sg\" data-s=\"2\">Что, если вы просто <strong>проигнорируете<\/strong> <code>Proc<\/code>, который она возвращает?<\/span> <span class=\"sg\" data-s=\"3\">Тогда Raku бросает исключение.<\/span> <span class=\"sg\" data-s=\"4\">Исключение — это ошибка, которая останавливает программу.<\/span> <span class=\"sg\" data-s=\"5\">Raku не даёт сбою остаться незамеченным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умирает: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Код возврата, который не равен <code>0<\/code>, обычно говорит о проблеме.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому неудачный <code>Proc<\/code> бросает исключение, если вы его выбрасываете.<\/span> <span class=\"sg\" data-s=\"2\">Это происходит, когда <code>Proc<\/code> выходит из области видимости.<\/span> <span class=\"sg\" data-s=\"3\">Тогда никакой код больше не может до него добраться.<\/span> <span class=\"sg\" data-s=\"4\">Дело не в проверке кода возврата.<\/span> <span class=\"sg\" data-s=\"5\">Дело в том, что вы <em>выбрасываете<\/em> результат.<\/span> <span class=\"sg\" data-s=\"6\">Просто положите <code>Proc<\/code> в переменную.<\/span> <span class=\"sg\" data-s=\"7\">Этого хватает, чтобы не было исключения.<\/span> <span class=\"sg\" data-s=\"8\">Вам даже не нужно потом смотреть на эту переменную.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # ошибки нет, хотя команда и не удалась\n# …и $proc больше нигде не используется<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итак, вы <em>ждёте<\/em>, что команда может дать сбой?<\/span> <span class=\"sg\" data-s=\"1\">Тогда сохраните её <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когда захотите узнать, что случилось, посмотрите на <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Или проверьте <code>Proc<\/code> как булево значение.<\/span><\/p>"]]},"uk":{"t":"Об'єкт Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>run<\/code> чи <code>shell<\/code> повертає об'єкт <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це невеликий запис про програму.<\/span> <span class=\"sg\" data-s=\"2\">Він каже, яка програма працювала і як вона завершилася.<\/span> <span class=\"sg\" data-s=\"3\">У попередніх темах ми читали вивід через його дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Але <code>Proc<\/code> містить більше.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Найкорисніша частина — це <strong>код завершення<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Це невелике ціле число.<\/span> <span class=\"sg\" data-s=\"2\">Програма повертає його тому, хто її запустив.<\/span> <span class=\"sg\" data-s=\"3\">Цим числом програма каже, чи вона спрацювала.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> означає успіх.<\/span> <span class=\"sg\" data-s=\"5\">Будь-яке інше число означає невдачу.<\/span> <span class=\"sg\" data-s=\"6\">Програма сама вибирає цей код невдачі.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> дає вам це число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Часто ви ставите лише запитання «так чи ні».<\/span> <span class=\"sg\" data-s=\"1\">Чи спрацювало?<\/span> <span class=\"sg\" data-s=\"2\">Для цього <code>Proc<\/code> істинний, коли код завершення дорівнює <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Інакше він хибний.<\/span> <span class=\"sg\" data-s=\"4\">Тож <code>Proc<\/code> можна перевіряти напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> також пам'ятає команду, яку він запустив.<\/span> <span class=\"sg\" data-s=\"1\">Ви знайдете її в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Будьте уважні з однією річчю.<\/span> <span class=\"sg\" data-s=\"1\">Іноді команда не спрацьовує.<\/span> <span class=\"sg\" data-s=\"2\">А що, як ви просто <strong>проігноруєте<\/strong> <code>Proc<\/code>, який вона повертає?<\/span> <span class=\"sg\" data-s=\"3\">Тоді Raku кидає виняток.<\/span> <span class=\"sg\" data-s=\"4\">Виняток — це помилка, яка зупиняє програму.<\/span> <span class=\"sg\" data-s=\"5\">Raku не дає збою сховатися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# гине: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Код завершення, інший ніж <code>0<\/code>, зазвичай означає проблему.<\/span> <span class=\"sg\" data-s=\"1\">Тож невдалий <code>Proc<\/code> кидає виняток, якщо ви його викинете.<\/span> <span class=\"sg\" data-s=\"2\">Це стається, коли <code>Proc<\/code> виходить за межі області видимості.<\/span> <span class=\"sg\" data-s=\"3\">Тоді жоден код уже не може до нього дістатися.<\/span> <span class=\"sg\" data-s=\"4\">Справа не в перевірці коду завершення.<\/span> <span class=\"sg\" data-s=\"5\">Справа в тому, що ви <em>викидаєте<\/em> результат.<\/span> <span class=\"sg\" data-s=\"6\">Просто покладіть <code>Proc<\/code> у змінну.<\/span> <span class=\"sg\" data-s=\"7\">Цього досить, щоб уникнути винятку.<\/span> <span class=\"sg\" data-s=\"8\">Вам навіть не треба більше дивитися на цю змінну.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # помилки немає, хоч команда й зазнала невдачі\n# …і $proc більше ніколи не використовується<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тож ви <em>очікуєте<\/em>, що команда може не спрацювати?<\/span> <span class=\"sg\" data-s=\"1\">Тоді збережіть її <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коли захочете дізнатися, що сталося, погляньте на <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Або перевірте <code>Proc<\/code> як булеве значення.<\/span><\/p>"]]},"bg":{"t":"Обектът Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>run<\/code> или <code>shell<\/code> връща обект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е малък запис за програмата.<\/span> <span class=\"sg\" data-s=\"2\">Той ви казва коя програма е работила и как е приключила.<\/span> <span class=\"sg\" data-s=\"3\">В предишните теми използвахме манипулатора му <code>.out<\/code>, за да четем изхода.<\/span> <span class=\"sg\" data-s=\"4\">Но <code>Proc<\/code> съдържа повече от това.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Най-полезната част е <strong>кодът на изход<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Това е малко цяло число.<\/span> <span class=\"sg\" data-s=\"2\">Програмата го връща на онзи, който я е стартирал.<\/span> <span class=\"sg\" data-s=\"3\">С това число програмата казва дали е успяла.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> означава успех.<\/span> <span class=\"sg\" data-s=\"5\">Всяко друго число означава провал.<\/span> <span class=\"sg\" data-s=\"6\">Самата програма избира този код за провал.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> ви дава числото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Често питате само въпрос с отговор „да“ или „не“.<\/span> <span class=\"sg\" data-s=\"1\">Проработи ли?<\/span> <span class=\"sg\" data-s=\"2\">За това <code>Proc<\/code> е истина, когато кодът на изход е <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Иначе той е лъжа.<\/span> <span class=\"sg\" data-s=\"4\">Затова можете да проверите <code>Proc<\/code> направо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> помни и командата, която е стартирал.<\/span> <span class=\"sg\" data-s=\"1\">Намирате я в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Внимавайте с едно нещо.<\/span> <span class=\"sg\" data-s=\"1\">Понякога командата се проваля.<\/span> <span class=\"sg\" data-s=\"2\">Какво става, ако просто <strong>пренебрегнете<\/strong> <code>Proc<\/code>, който тя връща?<\/span> <span class=\"sg\" data-s=\"3\">Тогава Raku повдига изключение.<\/span> <span class=\"sg\" data-s=\"4\">Изключението е грешка, която спира програмата.<\/span> <span class=\"sg\" data-s=\"5\">Raku не оставя провала скрит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умира: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Код на изход, различен от <code>0<\/code>, обикновено означава проблем.<\/span> <span class=\"sg\" data-s=\"1\">Затова провалил се <code>Proc<\/code> хвърля изключение, ако го изхвърлите.<\/span> <span class=\"sg\" data-s=\"2\">Това става, когато <code>Proc<\/code> излезе от обхват.<\/span> <span class=\"sg\" data-s=\"3\">Тогава никакъв код не може да стигне до него.<\/span> <span class=\"sg\" data-s=\"4\">Въпросът не е в проверката на кода на изход.<\/span> <span class=\"sg\" data-s=\"5\">Въпросът е в <em>изхвърлянето<\/em> на резултата.<\/span> <span class=\"sg\" data-s=\"6\">Просто сложете <code>Proc<\/code> в променлива.<\/span> <span class=\"sg\" data-s=\"7\">Това е достатъчно, за да избегнете изключението.<\/span> <span class=\"sg\" data-s=\"8\">Дори не е нужно да гледате променливата отново.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # няма грешка, макар да се провали\n# …и $proc никога повече не се използва<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И така, <em>очаквате<\/em> ли, че командата може да се провали?<\/span> <span class=\"sg\" data-s=\"1\">Тогава запазете нейния <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Когато искате да разберете какво е станало, погледнете <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Или проверете <code>Proc<\/code> като булева стойност.<\/span><\/p>"]]},"eo":{"t":"La objekto Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>run<\/code> aŭ <code>shell<\/code> redonas objekton <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas malgranda registro pri la programo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi diras al vi, kiu programo ruliĝis kaj kiel ĝi finiĝis.<\/span> <span class=\"sg\" data-s=\"3\">En la antaŭaj temoj, ni uzis ĝian tenilon <code>.out<\/code> por legi eligon.<\/span> <span class=\"sg\" data-s=\"4\">Sed <code>Proc<\/code> tenas pli ol tion.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La plej utila parto estas la <strong>elirkodo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas malgranda entjero.<\/span> <span class=\"sg\" data-s=\"2\">Programo redonas ĝin al tiu, kiu lanĉis ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Per ĉi tiu nombro, la programo diras, ĉu ĝi funkciis.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> signifas sukceson.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu alia nombro signifas malsukceson.<\/span> <span class=\"sg\" data-s=\"6\">La programo mem elektas ĉi tiun malsukcesan kodon.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> donas al vi la nombron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ofte vi volas scii nur jes aŭ ne.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu ĝi funkciis?<\/span> <span class=\"sg\" data-s=\"2\">Por tio, <code>Proc<\/code> estas vera, kiam la elirkodo estas <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Alie, ĝi estas malvera.<\/span> <span class=\"sg\" data-s=\"4\">Do vi povas testi la <code>Proc<\/code> rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> ankaŭ memoras la komandon, kiun ĝi lanĉis.<\/span> <span class=\"sg\" data-s=\"1\">Vi trovas ĝin en <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Atentu unu aferon.<\/span> <span class=\"sg\" data-s=\"1\">Foje komando malsukcesas.<\/span> <span class=\"sg\" data-s=\"2\">Kio okazas, se vi simple <strong>ignoras<\/strong> la <code>Proc<\/code>, kiun ĝi redonas?<\/span> <span class=\"sg\" data-s=\"3\">Tiam Raku levas escepton.<\/span> <span class=\"sg\" data-s=\"4\">Escepto estas eraro, kiu haltigas la programon.<\/span> <span class=\"sg\" data-s=\"5\">Raku ne lasas la malsukceson resti kaŝita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# mortas: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Elirkodo alia ol <code>0<\/code> kutime signifas problemon.<\/span> <span class=\"sg\" data-s=\"1\">Do malsukcesa <code>Proc<\/code> ĵetas escepton, se vi forĵetas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam la <code>Proc<\/code> eliras el sia amplekso.<\/span> <span class=\"sg\" data-s=\"3\">Tiam neniu kodo plu povas atingi ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Ne temas pri kontrolo de la elirkodo.<\/span> <span class=\"sg\" data-s=\"5\">Temas pri <em>forĵeto<\/em> de la rezulto.<\/span> <span class=\"sg\" data-s=\"6\">Simple metu la <code>Proc<\/code> en variablon.<\/span> <span class=\"sg\" data-s=\"7\">Tio sufiĉas por eviti la escepton.<\/span> <span class=\"sg\" data-s=\"8\">Vi eĉ ne devas rigardi la variablon denove.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # neniu eraro, kvankam ĝi malsukcesis\n# …kaj $proc neniam estas uzata denove<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do, ĉu vi <em>atendas<\/em>, ke komando povas malsukcesi?<\/span> <span class=\"sg\" data-s=\"1\">Tiam tenu ĝian <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi volas scii, kio okazis, rigardu <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ testu la <code>Proc<\/code> kiel Boolean valoron.<\/span><\/p>"]]},"la":{"t":"Obiectum Proc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Omnis vocatio <code>run<\/code> vel <code>shell<\/code> obiectum <code>Proc<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Est parva tabula de programmate.<\/span> <span class=\"sg\" data-s=\"2\">Tibi dicit quod programma cucurrerit et quomodo finierit.<\/span> <span class=\"sg\" data-s=\"3\">In argumentis superioribus per tractabulum eius <code>.out<\/code> exitum legimus.<\/span> <span class=\"sg\" data-s=\"4\">Sed <code>Proc<\/code> plus continet.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Pars utilissima est <strong>codex exeundi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Est parvus numerus integer.<\/span> <span class=\"sg\" data-s=\"2\">Programma eum ei reddit qui id incepit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc numero programma dicit an operatum sit.<\/span> <span class=\"sg\" data-s=\"4\"><code>0<\/code> successum significat.<\/span> <span class=\"sg\" data-s=\"5\">Quilibet alius numerus defectum significat.<\/span> <span class=\"sg\" data-s=\"6\">Ipsum programma hunc codicem defectus eligit.<\/span> <span class=\"sg\" data-s=\"7\"><code>.exitcode<\/code> tibi hunc numerum dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Saepe tantum quaestionem ita-an-non ponis.<\/span> <span class=\"sg\" data-s=\"1\">Operatumne est?<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc <code>Proc<\/code> verum est cum codex exeundi <code>0<\/code> est.<\/span> <span class=\"sg\" data-s=\"3\">Aliter falsum est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque <code>Proc<\/code> directe probare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> etiam imperatum meminit quod incepit.<\/span> <span class=\"sg\" data-s=\"1\">Id in <code>.command<\/code> invenis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De una re cave.<\/span> <span class=\"sg\" data-s=\"1\">Interdum imperatum deficit.<\/span> <span class=\"sg\" data-s=\"2\">Quid si <code>Proc<\/code> quod reddit simpliciter <strong>neglegis<\/strong>?<\/span> <span class=\"sg\" data-s=\"3\">Tum Raku exceptionem excitat.<\/span> <span class=\"sg\" data-s=\"4\">Exceptio est error qui programma sistit.<\/span> <span class=\"sg\" data-s=\"5\">Raku defectum latere non sinit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# moritur: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Codex exeundi alius quam <code>0<\/code> plerumque problema significat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>Proc<\/code> deficiens exceptionem iacit si id abicis.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit cum <code>Proc<\/code> extra circumscriptionem exit.<\/span> <span class=\"sg\" data-s=\"3\">Tum nullus codex id iam attingere potest.<\/span> <span class=\"sg\" data-s=\"4\">Causa non est quod codicem exeundi non probas.<\/span> <span class=\"sg\" data-s=\"5\">Causa est quod effectum <em>abicis<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Simpliciter <code>Proc<\/code> in variabilem pone.<\/span> <span class=\"sg\" data-s=\"7\">Hoc satis est ut exceptionem vites.<\/span> <span class=\"sg\" data-s=\"8\">Ne variabilem quidem iterum inspicere debes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # nullus error, quamquam defecit\n# …et $proc numquam iterum adhibetur<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Itaque <em>exspectasne<\/em> imperatum deficere posse?<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>Proc<\/code> eius serva.<\/span> <span class=\"sg\" data-s=\"2\">Cum scire vis quid acciderit, <code>.exitcode<\/code> inspice.<\/span> <span class=\"sg\" data-s=\"3\">Aut <code>Proc<\/code> ut valorem Booleanum proba.<\/span><\/p>"]]}}}</script>
