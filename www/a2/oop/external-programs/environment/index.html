<script type="application/json" id="page-data">{"u":"oop/external-programs/environment","n":913,"k":"topic","pv":"oop/external-programs/the-proc-object/quiz","nx":"oop/external-programs/environment/quiz","tr":["oop","oop/external-programs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The environment","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Every program starts with a set of <em>environment variables<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Each one is a value with a name.<\/span> <span class=\"sg\" data-s=\"2\">Some examples are <code>HOME<\/code>, <code>PATH<\/code>, and <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The operating system gives these values to the program.<\/span> <span class=\"sg\" data-s=\"4\">In Raku, you find them in the dynamic hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You read an environment variable by its name.<\/span> <span class=\"sg\" data-s=\"1\">Use the name as a key in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> is an ordinary hash.<\/span> <span class=\"sg\" data-s=\"3\">So you can also check if a variable is set.<\/span> <span class=\"sg\" data-s=\"4\">You can even change it for the programs you start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">You can set a key in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then the key becomes part of the environment.<\/span> <span class=\"sg\" data-s=\"2\">Now you start a program with <code>run<\/code> or <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This program is a child of your program.<\/span> <span class=\"sg\" data-s=\"4\">Every child program gets the same environment.<\/span> <span class=\"sg\" data-s=\"5\">This is how you pass settings down to a child program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Your program sets the variable <em>before<\/em> it starts the child.<\/span> <span class=\"sg\" data-s=\"1\">Here, <code>run<\/code> starts a shell as the child.<\/span> <span class=\"sg\" data-s=\"2\">A shell is a program that reads commands and runs them.<\/span> <span class=\"sg\" data-s=\"3\">This shell already has <code>GREETING<\/code> in its own environment.<\/span> <span class=\"sg\" data-s=\"4\">So it can print the value back with <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">You can set any variable in this way.<\/span> <span class=\"sg\" data-s=\"6\">It then reaches every program you start later.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">The <code>*<\/code> twigil tells you that <code>%*ENV<\/code> is a dynamic variable.<\/span> <span class=\"sg\" data-s=\"1\">A twigil is a sign after the sigil.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> is a dynamic variable too.<\/span> <span class=\"sg\" data-s=\"3\">You met it in the part about input and output.<\/span> <span class=\"sg\" data-s=\"4\">Some other variables with a star tell you about the running program.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> holds the command-line arguments.<\/span> <span class=\"sg\" data-s=\"6\">These are the values after the program name in the command.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> is the name of the script itself.<\/span> <span class=\"sg\" data-s=\"8\">Together, these variables tell a program how it was started.<\/span><\/p>"]]},"de":{"t":"Die Umgebung","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm startet mit einer Reihe von <em>Umgebungsvariablen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jede davon ist ein Wert mit einem Namen.<\/span> <span class=\"sg\" data-s=\"2\">Einige Beispiele sind <code>HOME<\/code>, <code>PATH<\/code> und <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Das Betriebssystem gibt diese Werte an das Programm.<\/span> <span class=\"sg\" data-s=\"4\">In Raku finden Sie sie im dynamischen Hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sie lesen eine Umgebungsvariable über ihren Namen.<\/span> <span class=\"sg\" data-s=\"1\">Nehmen Sie den Namen als Schlüssel in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> ist ein normaler Hash.<\/span> <span class=\"sg\" data-s=\"3\">Also können Sie auch prüfen, ob eine Variable gesetzt ist.<\/span> <span class=\"sg\" data-s=\"4\">Sie können sie sogar für die Programme ändern, die Sie starten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Sie können einen Schlüssel in <code>%*ENV<\/code> setzen.<\/span> <span class=\"sg\" data-s=\"1\">Dann wird der Schlüssel ein Teil der Umgebung.<\/span> <span class=\"sg\" data-s=\"2\">Jetzt starten Sie ein Programm mit <code>run<\/code> oder <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dieses Programm ist ein Kind Ihres Programms.<\/span> <span class=\"sg\" data-s=\"4\">Jedes Kindprogramm bekommt dieselbe Umgebung.<\/span> <span class=\"sg\" data-s=\"5\">So geben Sie Einstellungen an ein Kindprogramm weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ihr Programm setzt die Variable, <em>bevor<\/em> es das Kind startet.<\/span> <span class=\"sg\" data-s=\"1\">Hier startet <code>run<\/code> eine Shell als Kind.<\/span> <span class=\"sg\" data-s=\"2\">Eine Shell ist ein Programm, das Befehle liest und ausführt.<\/span> <span class=\"sg\" data-s=\"3\">Diese Shell hat <code>GREETING<\/code> schon in ihrer eigenen Umgebung.<\/span> <span class=\"sg\" data-s=\"4\">Also kann sie den Wert mit <code>echo<\/code> wieder ausgeben.<\/span> <span class=\"sg\" data-s=\"5\">Sie können jede Variable auf diese Weise setzen.<\/span> <span class=\"sg\" data-s=\"6\">Sie erreicht dann jedes Programm, das Sie später starten.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Der Twigil <code>*<\/code> sagt Ihnen, dass <code>%*ENV<\/code> eine dynamische Variable ist.<\/span> <span class=\"sg\" data-s=\"1\">Ein Twigil ist ein Zeichen nach dem Sigil.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> ist auch eine dynamische Variable.<\/span> <span class=\"sg\" data-s=\"3\">Sie haben sie im Teil über Ein- und Ausgabe kennengelernt.<\/span> <span class=\"sg\" data-s=\"4\">Einige andere Variablen mit Stern sagen Ihnen etwas über das laufende Programm.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> enthält die Befehlszeilenargumente.<\/span> <span class=\"sg\" data-s=\"6\">Das sind die Werte nach dem Programmnamen im Befehl.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> ist der Name des Skripts selbst.<\/span> <span class=\"sg\" data-s=\"8\">Zusammen sagen diese Variablen einem Programm, wie es gestartet wurde.<\/span><\/p>"]]},"nl":{"t":"De omgeving","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Elk programma start met een verzameling <em>omgevingsvariabelen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elke variabele is een waarde met een naam.<\/span> <span class=\"sg\" data-s=\"2\">Een paar voorbeelden zijn <code>HOME<\/code>, <code>PATH<\/code> en <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het besturingssysteem geeft deze waarden aan het programma.<\/span> <span class=\"sg\" data-s=\"4\">In Raku vind je ze in de dynamische hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je leest een omgevingsvariabele via haar naam.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de naam als sleutel in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> is een gewone hash.<\/span> <span class=\"sg\" data-s=\"3\">Dus kun je ook kijken of een variabele gezet is.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt haar zelfs wijzigen voor de programma's die je start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Je kunt een sleutel in <code>%*ENV<\/code> zetten.<\/span> <span class=\"sg\" data-s=\"1\">Dan wordt de sleutel deel van de omgeving.<\/span> <span class=\"sg\" data-s=\"2\">Nu start je een programma met <code>run<\/code> of <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dit programma is een kind van jouw programma.<\/span> <span class=\"sg\" data-s=\"4\">Elk kindprogramma krijgt dezelfde omgeving.<\/span> <span class=\"sg\" data-s=\"5\">Zo geef je instellingen door aan een kindprogramma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Je programma zet de variabele <em>voordat<\/em> het kind start.<\/span> <span class=\"sg\" data-s=\"1\">Hier start <code>run<\/code> een shell als kind.<\/span> <span class=\"sg\" data-s=\"2\">Een shell is een programma dat commando's leest en uitvoert.<\/span> <span class=\"sg\" data-s=\"3\">Deze shell heeft <code>GREETING<\/code> al in zijn eigen omgeving.<\/span> <span class=\"sg\" data-s=\"4\">Dus kan hij de waarde met <code>echo<\/code> weer afdrukken.<\/span> <span class=\"sg\" data-s=\"5\">Je kunt elke variabele op deze manier zetten.<\/span> <span class=\"sg\" data-s=\"6\">Die bereikt dan elk programma dat je later start.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">De twigil <code>*<\/code> vertelt je dat <code>%*ENV<\/code> een dynamische variabele is.<\/span> <span class=\"sg\" data-s=\"1\">Een twigil is een teken na de sigil.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> is ook een dynamische variabele.<\/span> <span class=\"sg\" data-s=\"3\">Je kent hem uit het deel over invoer en uitvoer.<\/span> <span class=\"sg\" data-s=\"4\">Een paar andere variabelen met een ster vertellen iets over het draaiende programma.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> bevat de opdrachtregelargumenten.<\/span> <span class=\"sg\" data-s=\"6\">Dat zijn de waarden na de programmanaam in het commando.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> is de naam van het script zelf.<\/span> <span class=\"sg\" data-s=\"8\">Samen vertellen deze variabelen een programma hoe het gestart is.<\/span><\/p>"]]},"es":{"t":"El entorno","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Todo programa empieza con un conjunto de <em>variables de entorno<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Cada una es un valor con nombre.<\/span> <span class=\"sg\" data-s=\"2\">Algunos ejemplos son <code>HOME<\/code>, <code>PATH<\/code> y <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El sistema operativo da estos valores al programa.<\/span> <span class=\"sg\" data-s=\"4\">En Raku, los encuentras en el hash dinámico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lees una variable de entorno por su nombre.<\/span> <span class=\"sg\" data-s=\"1\">Usa el nombre como clave en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> es un hash normal.<\/span> <span class=\"sg\" data-s=\"3\">Así que también puedes comprobar si una variable está definida.<\/span> <span class=\"sg\" data-s=\"4\">Incluso puedes cambiarla para los programas que inicias:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Puedes poner una clave en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces la clave pasa a ser parte del entorno.<\/span> <span class=\"sg\" data-s=\"2\">Ahora inicias un programa con <code>run<\/code> o <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Este programa es un hijo de tu programa.<\/span> <span class=\"sg\" data-s=\"4\">Cada programa hijo recibe el mismo entorno.<\/span> <span class=\"sg\" data-s=\"5\">Así pasas ajustes a un programa hijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tu programa pone la variable <em>antes<\/em> de iniciar el hijo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, <code>run<\/code> inicia una shell como hijo.<\/span> <span class=\"sg\" data-s=\"2\">Una shell es un programa que lee órdenes y las ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">Esta shell ya tiene <code>GREETING<\/code> en su propio entorno.<\/span> <span class=\"sg\" data-s=\"4\">Así que puede imprimir el valor con <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Puedes poner cualquier variable de esta forma.<\/span> <span class=\"sg\" data-s=\"6\">Luego llega a todos los programas que inicias más tarde.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> te dice que <code>%*ENV<\/code> es una variable dinámica.<\/span> <span class=\"sg\" data-s=\"1\">Un twigil es un signo después del sigilo.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> también es una variable dinámica.<\/span> <span class=\"sg\" data-s=\"3\">La conociste en la parte sobre entrada y salida.<\/span> <span class=\"sg\" data-s=\"4\">Otras variables con asterisco te hablan del programa en marcha.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> contiene los argumentos de la línea de comandos.<\/span> <span class=\"sg\" data-s=\"6\">Son los valores después del nombre del programa en la orden.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> es el nombre del propio guion.<\/span> <span class=\"sg\" data-s=\"8\">Juntas, estas variables le dicen a un programa cómo empezó.<\/span><\/p>"]]},"it":{"t":"L'ambiente","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni programma parte con un insieme di <em>variabili d'ambiente<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ognuna è un valore con un nome.<\/span> <span class=\"sg\" data-s=\"2\">Alcuni esempi sono <code>HOME<\/code>, <code>PATH<\/code> e <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il sistema operativo dà questi valori al programma.<\/span> <span class=\"sg\" data-s=\"4\">In Raku li trovi nell'hash dinamico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Leggi una variabile d'ambiente con il suo nome.<\/span> <span class=\"sg\" data-s=\"1\">Usa il nome come chiave in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> è un normale hash.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi anche controllare se una variabile è impostata.<\/span> <span class=\"sg\" data-s=\"4\">Puoi perfino cambiarla per i programmi che avvii:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Puoi impostare una chiave in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora la chiave diventa parte dell'ambiente.<\/span> <span class=\"sg\" data-s=\"2\">Ora avvii un programma con <code>run<\/code> o <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo programma è un figlio del tuo programma.<\/span> <span class=\"sg\" data-s=\"4\">Ogni programma figlio riceve lo stesso ambiente.<\/span> <span class=\"sg\" data-s=\"5\">Così passi delle impostazioni a un programma figlio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il tuo programma imposta la variabile <em>prima<\/em> di avviare il figlio.<\/span> <span class=\"sg\" data-s=\"1\">Qui <code>run<\/code> avvia una shell come figlio.<\/span> <span class=\"sg\" data-s=\"2\">Una shell è un programma che legge comandi e li esegue.<\/span> <span class=\"sg\" data-s=\"3\">Questa shell ha già <code>GREETING<\/code> nel suo ambiente.<\/span> <span class=\"sg\" data-s=\"4\">Quindi può stampare di nuovo il valore con <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Puoi impostare qualsiasi variabile in questo modo.<\/span> <span class=\"sg\" data-s=\"6\">Poi la variabile arriva a ogni programma che avvii dopo.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> ti dice che <code>%*ENV<\/code> è una variabile dinamica.<\/span> <span class=\"sg\" data-s=\"1\">Un twigil è un segno dopo il sigillo.<\/span> <span class=\"sg\" data-s=\"2\">Anche <code>$*OUT<\/code> è una variabile dinamica.<\/span> <span class=\"sg\" data-s=\"3\">L'hai incontrata nella parte su input e output.<\/span> <span class=\"sg\" data-s=\"4\">Altre variabili con l'asterisco ti parlano del programma in esecuzione.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> contiene gli argomenti della riga di comando.<\/span> <span class=\"sg\" data-s=\"6\">Sono i valori dopo il nome del programma nel comando.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> è il nome dello script stesso.<\/span> <span class=\"sg\" data-s=\"8\">Insieme, queste variabili dicono a un programma come è stato avviato.<\/span><\/p>"]]},"lv":{"t":"Vide","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Katra programma sāk darbu ar <em>vides mainīgo<\/em> kopu.<\/span> <span class=\"sg\" data-s=\"1\">Katrs no tiem ir vērtība ar nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Daži piemēri ir <code>HOME<\/code>, <code>PATH<\/code> un <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Operētājsistēma dod šīs vērtības programmai.<\/span> <span class=\"sg\" data-s=\"4\">Raku jūs tās atrodat dinamiskajā jauktenī <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vides mainīgo jūs nolasāt pēc tā nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Lietojiet nosaukumu kā atslēgu jauktenī <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> ir parasts jauktenis.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat arī pārbaudīt, vai mainīgais ir uzstādīts.<\/span> <span class=\"sg\" data-s=\"4\">Jūs pat varat to mainīt programmām, ko palaižat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Jūs varat uzstādīt atslēgu jauktenī <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad atslēga kļūst par vides daļu.<\/span> <span class=\"sg\" data-s=\"2\">Tagad jūs palaižat programmu ar <code>run<\/code> vai <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šī programma ir jūsu programmas bērns.<\/span> <span class=\"sg\" data-s=\"4\">Katra bērnprogramma saņem to pašu vidi.<\/span> <span class=\"sg\" data-s=\"5\">Tā jūs nododat iestatījumus tālāk bērnprogrammai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Jūsu programma uzstāda mainīgo <em>pirms<\/em> tā palaiž bērnu.<\/span> <span class=\"sg\" data-s=\"1\">Šeit <code>run<\/code> palaiž čaulu kā bērnu.<\/span> <span class=\"sg\" data-s=\"2\">Čaula ir programma, kas nolasa komandas un tās izpilda.<\/span> <span class=\"sg\" data-s=\"3\">Šai čaulai savā vidē jau ir <code>GREETING<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc tā var izdrukāt vērtību ar <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Šādi jūs varat uzstādīt jebkuru mainīgo.<\/span> <span class=\"sg\" data-s=\"6\">Tad tas sasniedz katru programmu, ko jūs palaižat vēlāk.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Tvigils <code>*<\/code> jums pasaka, ka <code>%*ENV<\/code> ir dinamisks mainīgais.<\/span> <span class=\"sg\" data-s=\"1\">Tvigils ir zīme aiz sigila.<\/span> <span class=\"sg\" data-s=\"2\">Arī <code>$*OUT<\/code> ir dinamisks mainīgais.<\/span> <span class=\"sg\" data-s=\"3\">Jūs to redzējāt daļā par ievadi un izvadi.<\/span> <span class=\"sg\" data-s=\"4\">Daži citi mainīgie ar zvaigznīti jums stāsta par programmu, kas darbojas.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> satur komandrindas argumentus.<\/span> <span class=\"sg\" data-s=\"6\">Tās ir vērtības aiz programmas nosaukuma komandā.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> ir paša skripta nosaukums.<\/span> <span class=\"sg\" data-s=\"8\">Kopā šie mainīgie programmai pasaka, kā tā tika palaista.<\/span><\/p>"]]},"ru":{"t":"Переменные окружения","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждая программа запускается с набором <em>переменных окружения<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Каждая из них — это значение с именем.<\/span> <span class=\"sg\" data-s=\"2\">Вот примеры: <code>HOME<\/code>, <code>PATH<\/code> и <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Эти значения даёт программе операционная система.<\/span> <span class=\"sg\" data-s=\"4\">В Raku они лежат в динамическом хеше <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашний каталог, например /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вы читаете переменную окружения по её имени.<\/span> <span class=\"sg\" data-s=\"1\">Используйте имя как ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> — это обычный хеш.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно и проверить, задана ли переменная.<\/span> <span class=\"sg\" data-s=\"4\">Можно даже изменить её для программ, которые вы запускаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Вы можете задать ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда ключ становится частью окружения.<\/span> <span class=\"sg\" data-s=\"2\">Теперь вы запускаете программу через <code>run<\/code> или <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Эта программа — потомок вашей программы.<\/span> <span class=\"sg\" data-s=\"4\">Каждая дочерняя программа получает то же окружение.<\/span> <span class=\"sg\" data-s=\"5\">Так вы передаёте настройки дочерней программе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ваша программа задаёт переменную <em>до<\/em> того, как запускает потомка.<\/span> <span class=\"sg\" data-s=\"1\">Здесь <code>run<\/code> запускает оболочку как потомка.<\/span> <span class=\"sg\" data-s=\"2\">Оболочка — это программа, которая читает команды и выполняет их.<\/span> <span class=\"sg\" data-s=\"3\">У этой оболочки уже есть <code>GREETING<\/code> в её собственном окружении.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому она может напечатать это значение с помощью <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Так можно задать любую переменную.<\/span> <span class=\"sg\" data-s=\"6\">Потом она попадает в каждую программу, которую вы запустите позже.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Твигил <code>*<\/code> говорит вам, что <code>%*ENV<\/code> — динамическая переменная.<\/span> <span class=\"sg\" data-s=\"1\">Твигил — это знак после сигила.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> — тоже динамическая переменная.<\/span> <span class=\"sg\" data-s=\"3\">Вы встречали её в части о вводе и выводе.<\/span> <span class=\"sg\" data-s=\"4\">Ещё несколько переменных со звёздочкой рассказывают о работающей программе.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> хранит аргументы командной строки.<\/span> <span class=\"sg\" data-s=\"6\">Это значения после имени программы в команде.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> — это имя самого скрипта.<\/span> <span class=\"sg\" data-s=\"8\">Вместе эти переменные говорят программе, как её запустили.<\/span><\/p>"]]},"uk":{"t":"Середовище","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожна програма запускається з набором <em>змінних середовища<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кожна з них — це значення з іменем.<\/span> <span class=\"sg\" data-s=\"2\">Ось кілька прикладів: <code>HOME<\/code>, <code>PATH<\/code> і <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Операційна система дає ці значення програмі.<\/span> <span class=\"sg\" data-s=\"4\">У Raku ви знайдете їх у динамічному хеші <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашній каталог, наприклад /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви читаєте змінну середовища за її іменем.<\/span> <span class=\"sg\" data-s=\"1\">Використайте ім'я як ключ у <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> — це звичайний хеш.<\/span> <span class=\"sg\" data-s=\"3\">Тож можна також перевірити, чи змінна встановлена.<\/span> <span class=\"sg\" data-s=\"4\">Можна навіть змінити її для програм, які ви запускаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ви можете встановити ключ у <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді цей ключ стає частиною середовища.<\/span> <span class=\"sg\" data-s=\"2\">Тепер ви запускаєте програму через <code>run<\/code> чи <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це дочірня програма вашої програми.<\/span> <span class=\"sg\" data-s=\"4\">Кожна дочірня програма отримує те саме середовище.<\/span> <span class=\"sg\" data-s=\"5\">Так ви передаєте налаштування дочірній програмі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ваша програма встановлює змінну <em>до<\/em> запуску дочірньої програми.<\/span> <span class=\"sg\" data-s=\"1\">Тут <code>run<\/code> запускає оболонку як дочірню програму.<\/span> <span class=\"sg\" data-s=\"2\">Оболонка — це програма, яка читає команди й виконує їх.<\/span> <span class=\"sg\" data-s=\"3\">Ця оболонка вже має <code>GREETING<\/code> у своєму середовищі.<\/span> <span class=\"sg\" data-s=\"4\">Тож вона може вивести це значення через <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Так можна встановити будь-яку змінну.<\/span> <span class=\"sg\" data-s=\"6\">Потім вона доходить до кожної програми, яку ви запускаєте пізніше.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Твіґіл <code>*<\/code> каже вам, що <code>%*ENV<\/code> — динамічна змінна.<\/span> <span class=\"sg\" data-s=\"1\">Твіґіл — це знак після сигіла.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> — теж динамічна змінна.<\/span> <span class=\"sg\" data-s=\"3\">Ви бачили її в частині про введення й виведення.<\/span> <span class=\"sg\" data-s=\"4\">Деякі інші змінні із зірочкою розповідають про запущену програму.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> містить аргументи командного рядка.<\/span> <span class=\"sg\" data-s=\"6\">Це значення після імені програми в команді.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> — це ім'я самого скрипта.<\/span> <span class=\"sg\" data-s=\"8\">Разом ці змінні кажуть програмі, як її запустили.<\/span><\/p>"]]},"bg":{"t":"Средата","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Всяка програма стартира с набор от <em>променливи на средата<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка от тях е стойност с име.<\/span> <span class=\"sg\" data-s=\"2\">Ето някои примери: <code>HOME<\/code>, <code>PATH<\/code> и <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Операционната система дава тези стойности на програмата.<\/span> <span class=\"sg\" data-s=\"4\">В Raku ги намирате в динамичния хеш <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашната директория, например /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Четете променливата на средата по нейното име.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте името като ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> е обикновен хеш.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете и да проверите дали дадена променлива е зададена.<\/span> <span class=\"sg\" data-s=\"4\">Можете дори да я промените за програмите, които стартирате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Можете да зададете ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава ключът става част от средата.<\/span> <span class=\"sg\" data-s=\"2\">Сега стартирате програма с <code>run<\/code> или <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тази програма е дете на вашата програма.<\/span> <span class=\"sg\" data-s=\"4\">Всяка дъщерна програма получава същата среда.<\/span> <span class=\"sg\" data-s=\"5\">Така подавате настройки надолу към дъщерна програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Програмата ви задава променливата <em>преди<\/em> да стартира детето.<\/span> <span class=\"sg\" data-s=\"1\">Тук <code>run<\/code> стартира обвивка като дете.<\/span> <span class=\"sg\" data-s=\"2\">Обвивката е програма, която чете команди и ги изпълнява.<\/span> <span class=\"sg\" data-s=\"3\">Тази обвивка вече има <code>GREETING<\/code> в своята среда.<\/span> <span class=\"sg\" data-s=\"4\">Затова тя може да отпечата стойността обратно с <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Можете да зададете всяка променлива по този начин.<\/span> <span class=\"sg\" data-s=\"6\">Тогава тя стига до всяка програма, която стартирате по-късно.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Туигилът <code>*<\/code> ви казва, че <code>%*ENV<\/code> е динамична променлива.<\/span> <span class=\"sg\" data-s=\"1\">Туигилът е знак след сигила.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> също е динамична променлива.<\/span> <span class=\"sg\" data-s=\"3\">Срещнахте я в частта за входа и изхода.<\/span> <span class=\"sg\" data-s=\"4\">Някои други променливи със звездичка ви казват нещо за работещата програма.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> съдържа аргументите от командния ред.<\/span> <span class=\"sg\" data-s=\"6\">Това са стойностите след името на програмата в командата.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> е името на самия скрипт.<\/span> <span class=\"sg\" data-s=\"8\">Заедно тези променливи казват на програмата как е стартирана.<\/span><\/p>"]]},"eo":{"t":"La medio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu programo startas kun aro da <em>mediaj variabloj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu el ili estas valoro kun nomo.<\/span> <span class=\"sg\" data-s=\"2\">Kelkaj ekzemploj estas <code>HOME<\/code>, <code>PATH<\/code> kaj <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La operaciumo donas ĉi tiujn valorojn al la programo.<\/span> <span class=\"sg\" data-s=\"4\">En Raku, vi trovas ilin en la dinamika hako <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # la hejma dosierujo, ekz. /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi legas median variablon per ĝia nomo.<\/span> <span class=\"sg\" data-s=\"1\">Uzu la nomon kiel ŝlosilon en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> estas ordinara hako.<\/span> <span class=\"sg\" data-s=\"3\">Do vi ankaŭ povas kontroli, ĉu variablo havas valoron.<\/span> <span class=\"sg\" data-s=\"4\">Vi eĉ povas ŝanĝi ĝin por la programoj, kiujn vi lanĉas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Vi povas meti ŝlosilon en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la ŝlosilo fariĝas parto de la medio.<\/span> <span class=\"sg\" data-s=\"2\">Nun vi lanĉas programon per <code>run<\/code> aŭ <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu programo estas ido de via programo.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu ida programo ricevas la saman medion.<\/span> <span class=\"sg\" data-s=\"5\">Tiel vi transdonas agordojn al ida programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Via programo starigas la variablon <em>antaŭ<\/em> ol ĝi lanĉas la idon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, <code>run<\/code> lanĉas ŝelon kiel la idon.<\/span> <span class=\"sg\" data-s=\"2\">Ŝelo estas programo, kiu legas komandojn kaj rulas ilin.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu ŝelo jam havas <code>GREETING<\/code> en sia propra medio.<\/span> <span class=\"sg\" data-s=\"4\">Do ĝi povas presi la valoron per <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vi povas starigi ajnan variablon tiel.<\/span> <span class=\"sg\" data-s=\"6\">Tiam ĝi atingas ĉiun programon, kiun vi lanĉas poste.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La tvigilo <code>*<\/code> diras al vi, ke <code>%*ENV<\/code> estas dinamika variablo.<\/span> <span class=\"sg\" data-s=\"1\">Tvigilo estas signo post la sigelo.<\/span> <span class=\"sg\" data-s=\"2\"><code>$*OUT<\/code> ankaŭ estas dinamika variablo.<\/span> <span class=\"sg\" data-s=\"3\">Vi renkontis ĝin en la parto pri enigo kaj eligo.<\/span> <span class=\"sg\" data-s=\"4\">Kelkaj aliaj variabloj kun stelo rakontas al vi pri la ruliĝanta programo.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> tenas la komandliniajn argumentojn.<\/span> <span class=\"sg\" data-s=\"6\">Ili estas la valoroj post la nomo de la programo en la komando.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> estas la nomo de la skripto mem.<\/span> <span class=\"sg\" data-s=\"8\">Kune, ĉi tiuj variabloj diras al programo, kiel oni lanĉis ĝin.<\/span><\/p>"]]},"la":{"t":"Ambitus","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Omne programma cum serie <em>variabilium ambitus<\/em> incipit.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque est valor cum nomine.<\/span> <span class=\"sg\" data-s=\"2\">Exempla quaedam sunt <code>HOME<\/code>, <code>PATH<\/code> et <code>USER<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Systema operativum hos valores programmati dat.<\/span> <span class=\"sg\" data-s=\"4\">In Raku eos in mappa dynamica <code>%*ENV<\/code> invenis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # directoria domestica, exempli gratia /home/anna<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Variabilem ambitus per nomen eius legis.<\/span> <span class=\"sg\" data-s=\"1\">Nomen ut clavem in <code>%*ENV<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"2\"><code>%*ENV<\/code> est mappa ordinaria.<\/span> <span class=\"sg\" data-s=\"3\">Itaque etiam probare potes an variabilis posita sit.<\/span> <span class=\"sg\" data-s=\"4\">Eam etiam mutare potes pro programmatibus quae incipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Clavem in <code>%*ENV<\/code> ponere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum clavis pars ambitus fit.<\/span> <span class=\"sg\" data-s=\"2\">Nunc programma per <code>run<\/code> vel <code>shell<\/code> incipis.<\/span> <span class=\"sg\" data-s=\"3\">Hoc programma est filius programmatis tui.<\/span> <span class=\"sg\" data-s=\"4\">Omne programma filium eundem ambitum accipit.<\/span> <span class=\"sg\" data-s=\"5\">Hoc modo configurationem ad programma filium transmittis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Programma tuum variabilem ponit <em>antequam<\/em> filium incipit.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>run<\/code> interpretem ut filium incipit.<\/span> <span class=\"sg\" data-s=\"2\">Interpres est programma quod imperata legit et currit.<\/span> <span class=\"sg\" data-s=\"3\">Hic interpres iam <code>GREETING<\/code> in suo ambitu habet.<\/span> <span class=\"sg\" data-s=\"4\">Itaque valorem per <code>echo<\/code> rursus imprimere potest.<\/span> <span class=\"sg\" data-s=\"5\">Hoc modo quamlibet variabilem ponere potes.<\/span> <span class=\"sg\" data-s=\"6\">Tum ad omne programma pervenit quod postea incipis.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Twigil <code>*<\/code> tibi ostendit: <code>%*ENV<\/code> est variabilis dynamica.<\/span> <span class=\"sg\" data-s=\"1\">Twigil est signum post sigillum.<\/span> <span class=\"sg\" data-s=\"2\">Etiam <code>$*OUT<\/code> est variabilis dynamica.<\/span> <span class=\"sg\" data-s=\"3\">Eam in parte de introitu et exitu cognovisti.<\/span> <span class=\"sg\" data-s=\"4\">Quaedam aliae variabiles cum stella tibi de programmate currenti narrant.<\/span> <span class=\"sg\" data-s=\"5\"><code>@*ARGS<\/code> argumenta lineae imperandi continet.<\/span> <span class=\"sg\" data-s=\"6\">Sunt valores post nomen programmatis in imperato.<\/span> <span class=\"sg\" data-s=\"7\"><code>$*PROGRAM-NAME<\/code> est nomen ipsius scripti.<\/span> <span class=\"sg\" data-s=\"8\">Simul hae variabiles programmati dicunt quomodo inceperit.<\/span><\/p>"]]}}}</script>
