<script type="application/json" id="page-data">{"u":"oop/external-programs/capturing-output","n":910,"k":"topic","pv":"oop/external-programs/run-and-shell/quiz","nx":"oop/external-programs/the-proc-object","tr":["oop","oop/external-programs"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Capturing output","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Normally, an external program prints to the screen.<\/span> <span class=\"sg\" data-s=\"1\">But maybe you want to read its output in your program.<\/span> <span class=\"sg\" data-s=\"2\">Then add <code>:out<\/code> when you start the program.<\/span> <span class=\"sg\" data-s=\"3\">You get back a <code>Proc<\/code> object.<\/span> <span class=\"sg\" data-s=\"4\">It has an <code>.out<\/code> handle.<\/span> <span class=\"sg\" data-s=\"5\">You can read the output from this handle:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sends the standard output of the program into the <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Standard output is the stream for the normal output of a program.<\/span> <span class=\"sg\" data-s=\"2\">The <code>.out<\/code> handle works like the file handles from the previous section.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> reads all the text from it at once.<\/span> <span class=\"sg\" data-s=\"4\">The <code>:close<\/code> adverb is a useful shortcut.<\/span> <span class=\"sg\" data-s=\"5\">It closes the handle for you after reading.<\/span> <span class=\"sg\" data-s=\"6\">Before, you did this yourself with <code>.close<\/code> on a file handle.<\/span> <span class=\"sg\" data-s=\"7\">So nothing stays open.<\/span> <span class=\"sg\" data-s=\"8\">Finally, <code>.chomp<\/code> removes the newline at the end.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> adds this newline.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The same works with <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is useful with a pipeline.<\/span> <span class=\"sg\" data-s=\"2\">In a pipeline, one command sends its output to the next one.<\/span> <span class=\"sg\" data-s=\"3\">With <code>shell<\/code>, you can capture the final result:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">You can also capture the error stream.<\/span> <span class=\"sg\" data-s=\"1\">This stream is called standard error.<\/span> <span class=\"sg\" data-s=\"2\">A program prints its error messages there.<\/span> <span class=\"sg\" data-s=\"3\">For this stream, use <code>:err<\/code> and the <code>.err<\/code> handle.<\/span> <span class=\"sg\" data-s=\"4\">You can pass both <code>:out<\/code> and <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Then the two streams stay apart.<\/span> <span class=\"sg\" data-s=\"6\">Each one has its own handle.<\/span> <span class=\"sg\" data-s=\"7\">So you can read each of them on its own:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Here, the shell command prints two lines.<\/span> <span class=\"sg\" data-s=\"1\">One line goes to standard output.<\/span> <span class=\"sg\" data-s=\"2\">The other line goes to standard error.<\/span> <span class=\"sg\" data-s=\"3\">The <code>&gt;&amp;2<\/code> part sends it there.<\/span> <span class=\"sg\" data-s=\"4\">We asked for both streams.<\/span> <span class=\"sg\" data-s=\"5\">So <code>.out<\/code> and <code>.err<\/code> hold them separately.<\/span> <span class=\"sg\" data-s=\"6\">The normal output of the program never mixes with its error messages.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Capturing output is very useful.<\/span> <span class=\"sg\" data-s=\"1\">An external program becomes one part of your own program.<\/span> <span class=\"sg\" data-s=\"2\">You run it and read its result.<\/span> <span class=\"sg\" data-s=\"3\">Then your program goes on and uses this data.<\/span><\/p>"]]},"de":{"t":"Ausgabe auffangen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalerweise schreibt ein externes Programm auf den Bildschirm.<\/span> <span class=\"sg\" data-s=\"1\">Aber vielleicht möchten Sie seine Ausgabe in Ihrem Programm lesen.<\/span> <span class=\"sg\" data-s=\"2\">Dann geben Sie beim Start <code>:out<\/code> an.<\/span> <span class=\"sg\" data-s=\"3\">Sie bekommen ein <code>Proc<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"4\">Es hat einen Handle <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Aus diesem Handle können Sie die Ausgabe lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> schickt die Standardausgabe des Programms in das <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Standardausgabe ist der Strom für die normale Ausgabe eines Programms.<\/span> <span class=\"sg\" data-s=\"2\">Der Handle <code>.out<\/code> funktioniert wie die Dateihandles aus dem vorigen Abschnitt.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> liest den ganzen Text auf einmal daraus.<\/span> <span class=\"sg\" data-s=\"4\">Das Adverb <code>:close<\/code> ist eine nützliche Abkürzung.<\/span> <span class=\"sg\" data-s=\"5\">Es schließt den Handle nach dem Lesen für Sie.<\/span> <span class=\"sg\" data-s=\"6\">Früher haben Sie das bei einem Dateihandle selbst mit <code>.close<\/code> gemacht.<\/span> <span class=\"sg\" data-s=\"7\">So bleibt nichts offen.<\/span> <span class=\"sg\" data-s=\"8\">Zum Schluss entfernt <code>.chomp<\/code> den Zeilenumbruch am Ende.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> fügt diesen Zeilenumbruch an.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dasselbe funktioniert mit <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist bei einer Pipeline nützlich.<\/span> <span class=\"sg\" data-s=\"2\">In einer Pipeline schickt ein Befehl seine Ausgabe an den nächsten.<\/span> <span class=\"sg\" data-s=\"3\">Mit <code>shell<\/code> können Sie das Endergebnis auffangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Sie können auch den Fehlerstrom auffangen.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Strom heißt Standardfehlerausgabe.<\/span> <span class=\"sg\" data-s=\"2\">Ein Programm schreibt seine Fehlermeldungen dorthin.<\/span> <span class=\"sg\" data-s=\"3\">Für diesen Strom nehmen Sie <code>:err<\/code> und den Handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Sie können <code>:out<\/code> und <code>:err<\/code> zusammen übergeben.<\/span> <span class=\"sg\" data-s=\"5\">Dann bleiben die zwei Ströme getrennt.<\/span> <span class=\"sg\" data-s=\"6\">Jeder hat seinen eigenen Handle.<\/span> <span class=\"sg\" data-s=\"7\">So können Sie jeden für sich lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier gibt der Shell-Befehl zwei Zeilen aus.<\/span> <span class=\"sg\" data-s=\"1\">Eine Zeile geht an die Standardausgabe.<\/span> <span class=\"sg\" data-s=\"2\">Die andere Zeile geht an die Standardfehlerausgabe.<\/span> <span class=\"sg\" data-s=\"3\">Der Teil <code>&gt;&amp;2<\/code> schickt sie dorthin.<\/span> <span class=\"sg\" data-s=\"4\">Wir haben beide Ströme verlangt.<\/span> <span class=\"sg\" data-s=\"5\">Also enthalten <code>.out<\/code> und <code>.err<\/code> sie getrennt.<\/span> <span class=\"sg\" data-s=\"6\">Die normale Ausgabe des Programms mischt sich nie mit seinen Fehlermeldungen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Auffangen der Ausgabe ist sehr nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Ein externes Programm wird so ein Teil Ihres eigenen Programms.<\/span> <span class=\"sg\" data-s=\"2\">Sie führen es aus und lesen sein Ergebnis.<\/span> <span class=\"sg\" data-s=\"3\">Dann macht Ihr Programm weiter und benutzt diese Daten.<\/span><\/p>"]]},"nl":{"t":"Uitvoer opvangen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Normaal drukt een extern programma af op het scherm.<\/span> <span class=\"sg\" data-s=\"1\">Maar misschien wil je de uitvoer in je programma lezen.<\/span> <span class=\"sg\" data-s=\"2\">Geef dan <code>:out<\/code> mee als je het programma start.<\/span> <span class=\"sg\" data-s=\"3\">Je krijgt een <code>Proc<\/code>-object terug.<\/span> <span class=\"sg\" data-s=\"4\">Het heeft een handle <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Uit deze handle kun je de uitvoer lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> stuurt de standaarduitvoer van het programma naar de <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Standaarduitvoer is de stroom voor de gewone uitvoer van een programma.<\/span> <span class=\"sg\" data-s=\"2\">De handle <code>.out<\/code> werkt als de bestandshandles uit de vorige sectie.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> leest alle tekst er in één keer uit.<\/span> <span class=\"sg\" data-s=\"4\">Het bijwoord <code>:close<\/code> is een handige afkorting.<\/span> <span class=\"sg\" data-s=\"5\">Het sluit de handle voor je na het lezen.<\/span> <span class=\"sg\" data-s=\"6\">Eerder deed je dit zelf met <code>.close<\/code> op een bestandshandle.<\/span> <span class=\"sg\" data-s=\"7\">Zo blijft er niets open.<\/span> <span class=\"sg\" data-s=\"8\">Ten slotte haalt <code>.chomp<\/code> de newline aan het eind weg.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> voegt deze newline toe.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde werkt met <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is handig bij een pipeline.<\/span> <span class=\"sg\" data-s=\"2\">In een pipeline stuurt een commando zijn uitvoer naar het volgende.<\/span> <span class=\"sg\" data-s=\"3\">Met <code>shell<\/code> kun je het eindresultaat opvangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook de foutstroom opvangen.<\/span> <span class=\"sg\" data-s=\"1\">Deze stroom heet standaardfout.<\/span> <span class=\"sg\" data-s=\"2\">Een programma drukt daar zijn foutmeldingen af.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik voor deze stroom <code>:err<\/code> en de handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt <code>:out<\/code> en <code>:err<\/code> allebei meegeven.<\/span> <span class=\"sg\" data-s=\"5\">Dan blijven de twee stromen apart.<\/span> <span class=\"sg\" data-s=\"6\">Elke stroom heeft een eigen handle.<\/span> <span class=\"sg\" data-s=\"7\">Zo kun je ze elk apart lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hier drukt het shellcommando twee regels af.<\/span> <span class=\"sg\" data-s=\"1\">Eén regel gaat naar de standaarduitvoer.<\/span> <span class=\"sg\" data-s=\"2\">De andere regel gaat naar de standaardfout.<\/span> <span class=\"sg\" data-s=\"3\">Het stuk <code>&gt;&amp;2<\/code> stuurt hem daarheen.<\/span> <span class=\"sg\" data-s=\"4\">We vroegen om beide stromen.<\/span> <span class=\"sg\" data-s=\"5\">Dus bevatten <code>.out<\/code> en <code>.err<\/code> ze apart.<\/span> <span class=\"sg\" data-s=\"6\">De gewone uitvoer van het programma mengt zich nooit met zijn foutmeldingen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uitvoer opvangen is heel nuttig.<\/span> <span class=\"sg\" data-s=\"1\">Een extern programma wordt een deel van je eigen programma.<\/span> <span class=\"sg\" data-s=\"2\">Je draait het en leest zijn resultaat.<\/span> <span class=\"sg\" data-s=\"3\">Daarna gaat je programma verder en gebruikt het deze gegevens.<\/span><\/p>"]]},"es":{"t":"Capturar la salida","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Normalmente, un programa externo imprime en la pantalla.<\/span> <span class=\"sg\" data-s=\"1\">Pero a lo mejor quieres leer su salida en tu programa.<\/span> <span class=\"sg\" data-s=\"2\">Entonces añade <code>:out<\/code> al iniciar el programa.<\/span> <span class=\"sg\" data-s=\"3\">Recibes un objeto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tiene un manejador <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Puedes leer la salida de este manejador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> envía la salida estándar del programa al <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La salida estándar es el flujo para la salida normal de un programa.<\/span> <span class=\"sg\" data-s=\"2\">El manejador <code>.out<\/code> funciona como los manejadores de archivo de la sección anterior.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> lee todo su texto de una vez.<\/span> <span class=\"sg\" data-s=\"4\">El adverbio <code>:close<\/code> es un atajo útil.<\/span> <span class=\"sg\" data-s=\"5\">Cierra el manejador por ti después de leer.<\/span> <span class=\"sg\" data-s=\"6\">Antes, tú hacías esto con <code>.close<\/code> sobre un manejador de archivo.<\/span> <span class=\"sg\" data-s=\"7\">Así no queda nada abierto.<\/span> <span class=\"sg\" data-s=\"8\">Por último, <code>.chomp<\/code> quita el salto de línea del final.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> añade este salto de línea.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lo mismo funciona con <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil con una tubería.<\/span> <span class=\"sg\" data-s=\"2\">En una tubería, una orden envía su salida a la siguiente.<\/span> <span class=\"sg\" data-s=\"3\">Con <code>shell<\/code>, puedes capturar el resultado final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">También puedes capturar el flujo de errores.<\/span> <span class=\"sg\" data-s=\"1\">Este flujo se llama error estándar.<\/span> <span class=\"sg\" data-s=\"2\">Un programa imprime ahí sus mensajes de error.<\/span> <span class=\"sg\" data-s=\"3\">Para este flujo, usa <code>:err<\/code> y el manejador <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Puedes pasar <code>:out<\/code> y <code>:err<\/code> a la vez.<\/span> <span class=\"sg\" data-s=\"5\">Entonces los dos flujos quedan separados.<\/span> <span class=\"sg\" data-s=\"6\">Cada uno tiene su propio manejador.<\/span> <span class=\"sg\" data-s=\"7\">Así puedes leer cada uno por separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Aquí, la orden de la shell imprime dos líneas.<\/span> <span class=\"sg\" data-s=\"1\">Una línea va a la salida estándar.<\/span> <span class=\"sg\" data-s=\"2\">La otra línea va al error estándar.<\/span> <span class=\"sg\" data-s=\"3\">La parte <code>&gt;&amp;2<\/code> la envía ahí.<\/span> <span class=\"sg\" data-s=\"4\">Pedimos los dos flujos.<\/span> <span class=\"sg\" data-s=\"5\">Así que <code>.out<\/code> y <code>.err<\/code> los guardan por separado.<\/span> <span class=\"sg\" data-s=\"6\">La salida normal del programa nunca se mezcla con sus mensajes de error.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Capturar la salida es muy útil.<\/span> <span class=\"sg\" data-s=\"1\">Un programa externo se convierte en una parte de tu propio programa.<\/span> <span class=\"sg\" data-s=\"2\">Lo ejecutas y lees su resultado.<\/span> <span class=\"sg\" data-s=\"3\">Después tu programa sigue y usa estos datos.<\/span><\/p>"]]},"it":{"t":"Catturare l'output","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Di solito un programma esterno stampa sullo schermo.<\/span> <span class=\"sg\" data-s=\"1\">Ma forse vuoi leggere il suo output nel tuo programma.<\/span> <span class=\"sg\" data-s=\"2\">Allora aggiungi <code>:out<\/code> quando avvii il programma.<\/span> <span class=\"sg\" data-s=\"3\">Ricevi indietro un oggetto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ha un handle <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Da questo handle puoi leggere l'output:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> manda l'output standard del programma dentro il <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'output standard è il flusso per il normale output di un programma.<\/span> <span class=\"sg\" data-s=\"2\">L'handle <code>.out<\/code> funziona come gli handle di file della sezione precedente.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> legge tutto il testo in una volta.<\/span> <span class=\"sg\" data-s=\"4\">L'avverbio <code>:close<\/code> è una scorciatoia utile.<\/span> <span class=\"sg\" data-s=\"5\">Chiude l'handle per te dopo la lettura.<\/span> <span class=\"sg\" data-s=\"6\">Prima lo facevi da solo con <code>.close<\/code> su un handle di file.<\/span> <span class=\"sg\" data-s=\"7\">Così non resta niente di aperto.<\/span> <span class=\"sg\" data-s=\"8\">Infine <code>.chomp<\/code> toglie il ritorno a capo alla fine.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> aggiunge questo ritorno a capo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lo stesso funziona con <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo è utile con una pipeline.<\/span> <span class=\"sg\" data-s=\"2\">In una pipeline un comando manda il suo output al comando successivo.<\/span> <span class=\"sg\" data-s=\"3\">Con <code>shell<\/code> puoi catturare il risultato finale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Puoi catturare anche il flusso degli errori.<\/span> <span class=\"sg\" data-s=\"1\">Questo flusso si chiama errore standard.<\/span> <span class=\"sg\" data-s=\"2\">Un programma stampa lì i suoi messaggi di errore.<\/span> <span class=\"sg\" data-s=\"3\">Per questo flusso usa <code>:err<\/code> e l'handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Puoi passare sia <code>:out<\/code> sia <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Allora i due flussi restano separati.<\/span> <span class=\"sg\" data-s=\"6\">Ognuno ha il suo handle.<\/span> <span class=\"sg\" data-s=\"7\">Così puoi leggere ognuno per conto suo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Qui il comando della shell stampa due righe.<\/span> <span class=\"sg\" data-s=\"1\">Una riga va sull'output standard.<\/span> <span class=\"sg\" data-s=\"2\">L'altra riga va sull'errore standard.<\/span> <span class=\"sg\" data-s=\"3\">La parte <code>&gt;&amp;2<\/code> la manda lì.<\/span> <span class=\"sg\" data-s=\"4\">Abbiamo chiesto tutti e due i flussi.<\/span> <span class=\"sg\" data-s=\"5\">Quindi <code>.out<\/code> e <code>.err<\/code> li tengono separati.<\/span> <span class=\"sg\" data-s=\"6\">Il normale output del programma non si mescola mai con i suoi messaggi di errore.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Catturare l'output è molto utile.<\/span> <span class=\"sg\" data-s=\"1\">Un programma esterno diventa una parte del tuo programma.<\/span> <span class=\"sg\" data-s=\"2\">Lo esegui e leggi il suo risultato.<\/span> <span class=\"sg\" data-s=\"3\">Poi il tuo programma va avanti e usa questi dati.<\/span><\/p>"]]},"lv":{"t":"Izvades pārtveršana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Parasti ārēja programma drukā ekrānā.<\/span> <span class=\"sg\" data-s=\"1\">Bet varbūt jūs gribat nolasīt tās izvadi savā programmā.<\/span> <span class=\"sg\" data-s=\"2\">Tad pievienojiet <code>:out<\/code>, kad palaižat programmu.<\/span> <span class=\"sg\" data-s=\"3\">Jūs saņemat atpakaļ <code>Proc<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"4\">Tam ir turis <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">No šī tura jūs varat nolasīt izvadi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sūta programmas standarta izvadi uz <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Standarta izvade ir plūsma programmas parastajai izvadei.<\/span> <span class=\"sg\" data-s=\"2\">Turis <code>.out<\/code> darbojas kā failu turi no iepriekšējās sadaļas.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> nolasa no tā visu tekstu uzreiz.<\/span> <span class=\"sg\" data-s=\"4\">Apstākļvārds <code>:close<\/code> ir noderīgs saīsinājums.<\/span> <span class=\"sg\" data-s=\"5\">Tas pēc lasīšanas aizver turi jūsu vietā.<\/span> <span class=\"sg\" data-s=\"6\">Agrāk jūs to darījāt paši ar <code>.close<\/code> uz faila tura.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc nekas nepaliek atvērts.<\/span> <span class=\"sg\" data-s=\"8\">Visbeidzot <code>.chomp<\/code> noņem jaunās rindas rakstzīmi beigās.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> pievieno šo rakstzīmi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas pats darbojas ar <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder ar cauruļvadu.<\/span> <span class=\"sg\" data-s=\"2\">Cauruļvadā viena komanda sūta savu izvadi nākamajai.<\/span> <span class=\"sg\" data-s=\"3\">Ar <code>shell<\/code> jūs varat noķert gala rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Jūs varat noķert arī kļūdu plūsmu.<\/span> <span class=\"sg\" data-s=\"1\">Šo plūsmu sauc par standarta kļūdām.<\/span> <span class=\"sg\" data-s=\"2\">Tur programma drukā savus kļūdu paziņojumus.<\/span> <span class=\"sg\" data-s=\"3\">Šai plūsmai lietojiet <code>:err<\/code> un turi <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat padot gan <code>:out<\/code>, gan <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tad abas plūsmas paliek atsevišķi.<\/span> <span class=\"sg\" data-s=\"6\">Katrai ir savs turis.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc jūs varat lasīt katru no tām atsevišķi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šeit čaulas komanda izdrukā divas rindas.<\/span> <span class=\"sg\" data-s=\"1\">Viena rinda iet uz standarta izvadi.<\/span> <span class=\"sg\" data-s=\"2\">Otra rinda iet uz standarta kļūdām.<\/span> <span class=\"sg\" data-s=\"3\">Daļa <code>&gt;&amp;2<\/code> to sūta turp.<\/span> <span class=\"sg\" data-s=\"4\">Mēs prasījām abas plūsmas.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc <code>.out<\/code> un <code>.err<\/code> tās glabā atsevišķi.<\/span> <span class=\"sg\" data-s=\"6\">Programmas parastā izvade nekad nesajaucas ar tās kļūdu paziņojumiem.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izvades noķeršana ir ļoti noderīga.<\/span> <span class=\"sg\" data-s=\"1\">Ārēja programma kļūst par vienu jūsu programmas daļu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to palaižat un nolasāt tās rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Tad jūsu programma turpina darbu un lieto šos datus.<\/span><\/p>"]]},"ru":{"t":"Захват вывода","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Обычно внешняя программа печатает на экран.<\/span> <span class=\"sg\" data-s=\"1\">Но, может быть, вы хотите прочитать её вывод в своей программе.<\/span> <span class=\"sg\" data-s=\"2\">Тогда добавьте <code>:out<\/code> при запуске программы.<\/span> <span class=\"sg\" data-s=\"3\">Вы получаете обратно объект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">У него есть дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Из этого дескриптора можно прочитать вывод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> отправляет стандартный вывод программы в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стандартный вывод — это поток для обычного вывода программы.<\/span> <span class=\"sg\" data-s=\"2\">Дескриптор <code>.out<\/code> работает как файловые дескрипторы из предыдущего раздела.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> читает из него весь текст сразу.<\/span> <span class=\"sg\" data-s=\"4\">Наречие <code>:close<\/code> — удобное сокращение.<\/span> <span class=\"sg\" data-s=\"5\">Оно закрывает дескриптор за вас после чтения.<\/span> <span class=\"sg\" data-s=\"6\">Раньше вы делали это сами с помощью <code>.close<\/code> у файлового дескриптора.<\/span> <span class=\"sg\" data-s=\"7\">Так ничего не остаётся открытым.<\/span> <span class=\"sg\" data-s=\"8\">Наконец, <code>.chomp<\/code> убирает перевод строки в конце.<\/span> <span class=\"sg\" data-s=\"9\">Этот перевод строки добавляет <code>echo<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">То же работает и с <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это полезно с конвейером.<\/span> <span class=\"sg\" data-s=\"2\">В конвейере одна команда передаёт свой вывод следующей.<\/span> <span class=\"sg\" data-s=\"3\">С <code>shell<\/code> можно перехватить конечный результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Можно перехватить и поток ошибок.<\/span> <span class=\"sg\" data-s=\"1\">Этот поток называется стандартным потоком ошибок.<\/span> <span class=\"sg\" data-s=\"2\">Туда программа печатает свои сообщения об ошибках.<\/span> <span class=\"sg\" data-s=\"3\">Для этого потока используйте <code>:err<\/code> и дескриптор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Можно передать и <code>:out<\/code>, и <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тогда два потока остаются раздельными.<\/span> <span class=\"sg\" data-s=\"6\">У каждого из них свой дескриптор.<\/span> <span class=\"sg\" data-s=\"7\">Поэтому каждый из них можно читать отдельно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Здесь команда оболочки печатает две строки.<\/span> <span class=\"sg\" data-s=\"1\">Одна строка идёт в стандартный вывод.<\/span> <span class=\"sg\" data-s=\"2\">Другая строка идёт в стандартный поток ошибок.<\/span> <span class=\"sg\" data-s=\"3\">Туда её отправляет часть <code>&gt;&amp;2<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Мы попросили оба потока.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому <code>.out<\/code> и <code>.err<\/code> держат их отдельно.<\/span> <span class=\"sg\" data-s=\"6\">Обычный вывод программы никогда не смешивается с её сообщениями об ошибках.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Захват вывода очень полезен.<\/span> <span class=\"sg\" data-s=\"1\">Внешняя программа становится частью вашей программы.<\/span> <span class=\"sg\" data-s=\"2\">Вы запускаете её и читаете её результат.<\/span> <span class=\"sg\" data-s=\"3\">Потом ваша программа идёт дальше и использует эти данные.<\/span><\/p>"]]},"uk":{"t":"Перехоплення виводу","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Зазвичай зовнішня програма виводить текст на екран.<\/span> <span class=\"sg\" data-s=\"1\">Але, можливо, ви хочете прочитати її вивід у своїй програмі.<\/span> <span class=\"sg\" data-s=\"2\">Тоді додайте <code>:out<\/code>, коли запускаєте програму.<\/span> <span class=\"sg\" data-s=\"3\">Ви отримуєте назад об'єкт <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він має дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">З цього дескриптора можна читати вивід:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> надсилає стандартний вивід програми в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стандартний вивід — це потік для звичайного виводу програми.<\/span> <span class=\"sg\" data-s=\"2\">Дескриптор <code>.out<\/code> працює як дескриптори файлів із попереднього розділу.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> читає з нього весь текст за раз.<\/span> <span class=\"sg\" data-s=\"4\">Наріччя <code>:close<\/code> — це зручне скорочення.<\/span> <span class=\"sg\" data-s=\"5\">Воно закриває дескриптор за вас після читання.<\/span> <span class=\"sg\" data-s=\"6\">Раніше ви робили це самі через <code>.close<\/code> для дескриптора файлу.<\/span> <span class=\"sg\" data-s=\"7\">Тож нічого не лишається відкритим.<\/span> <span class=\"sg\" data-s=\"8\">Нарешті, <code>.chomp<\/code> прибирає символ нового рядка в кінці.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> додає цей символ.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так само працює й <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це корисно з конвеєром.<\/span> <span class=\"sg\" data-s=\"2\">У конвеєрі одна команда передає свій вивід наступній.<\/span> <span class=\"sg\" data-s=\"3\">Через <code>shell<\/code> можна перехопити кінцевий результат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Можна також перехопити потік помилок.<\/span> <span class=\"sg\" data-s=\"1\">Цей потік називають стандартним потоком помилок.<\/span> <span class=\"sg\" data-s=\"2\">Туди програма виводить свої повідомлення про помилки.<\/span> <span class=\"sg\" data-s=\"3\">Для цього потоку використовуйте <code>:err<\/code> і дескриптор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Можна передати і <code>:out<\/code>, і <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тоді два потоки лишаються окремими.<\/span> <span class=\"sg\" data-s=\"6\">Кожен має свій дескриптор.<\/span> <span class=\"sg\" data-s=\"7\">Тож кожен із них можна читати окремо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тут команда оболонки виводить два рядки.<\/span> <span class=\"sg\" data-s=\"1\">Один рядок іде в стандартний вивід.<\/span> <span class=\"sg\" data-s=\"2\">Інший рядок іде в стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"3\">Частина <code>&gt;&amp;2<\/code> надсилає його туди.<\/span> <span class=\"sg\" data-s=\"4\">Ми попросили обидва потоки.<\/span> <span class=\"sg\" data-s=\"5\">Тож <code>.out<\/code> і <code>.err<\/code> тримають їх окремо.<\/span> <span class=\"sg\" data-s=\"6\">Звичайний вивід програми ніколи не змішується з її повідомленнями про помилки.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перехоплення виводу дуже корисне.<\/span> <span class=\"sg\" data-s=\"1\">Зовнішня програма стає однією частиною вашої програми.<\/span> <span class=\"sg\" data-s=\"2\">Ви запускаєте її й читаєте її результат.<\/span> <span class=\"sg\" data-s=\"3\">Потім ваша програма працює далі й використовує ці дані.<\/span><\/p>"]]},"bg":{"t":"Улавяне на изхода","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Обикновено външната програма отпечатва на екрана.<\/span> <span class=\"sg\" data-s=\"1\">Но може би искате да прочетете изхода ѝ в своята програма.<\/span> <span class=\"sg\" data-s=\"2\">Тогава добавете <code>:out<\/code>, когато стартирате програмата.<\/span> <span class=\"sg\" data-s=\"3\">Получавате обратно обект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той има манипулатор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">От този манипулатор можете да прочетете изхода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> изпраща стандартния изход на програмата в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стандартният изход е потокът за обикновения изход на програмата.<\/span> <span class=\"sg\" data-s=\"2\">Манипулаторът <code>.out<\/code> работи като манипулаторите на файлове от предишния раздел.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> чете целия текст от него наведнъж.<\/span> <span class=\"sg\" data-s=\"4\">Наречието <code>:close<\/code> е удобно съкращение.<\/span> <span class=\"sg\" data-s=\"5\">То затваря манипулатора вместо вас след четенето.<\/span> <span class=\"sg\" data-s=\"6\">Преди вие правехте това сами с <code>.close<\/code> върху манипулатор на файл.<\/span> <span class=\"sg\" data-s=\"7\">Така нищо не остава отворено.<\/span> <span class=\"sg\" data-s=\"8\">Накрая <code>.chomp<\/code> премахва новия ред в края.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> добавя този нов ред.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Същото работи и с <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е полезно при конвейер.<\/span> <span class=\"sg\" data-s=\"2\">В конвейера една команда изпраща изхода си на следващата.<\/span> <span class=\"sg\" data-s=\"3\">С <code>shell<\/code> можете да уловите крайния резултат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Можете да уловите и потока за грешки.<\/span> <span class=\"sg\" data-s=\"1\">Този поток се нарича стандартна грешка.<\/span> <span class=\"sg\" data-s=\"2\">Програмата отпечатва там съобщенията си за грешки.<\/span> <span class=\"sg\" data-s=\"3\">За този поток използвайте <code>:err<\/code> и манипулатора <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Можете да подадете и <code>:out<\/code>, и <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тогава двата потока остават разделени.<\/span> <span class=\"sg\" data-s=\"6\">Всеки от тях има свой манипулатор.<\/span> <span class=\"sg\" data-s=\"7\">Затова можете да четете всеки от тях поотделно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тук командата на обвивката отпечатва два реда.<\/span> <span class=\"sg\" data-s=\"1\">Единият ред отива в стандартния изход.<\/span> <span class=\"sg\" data-s=\"2\">Другият ред отива в стандартната грешка.<\/span> <span class=\"sg\" data-s=\"3\">Частта <code>&gt;&amp;2<\/code> го изпраща там.<\/span> <span class=\"sg\" data-s=\"4\">Ние поискахме и двата потока.<\/span> <span class=\"sg\" data-s=\"5\">Затова <code>.out<\/code> и <code>.err<\/code> ги държат поотделно.<\/span> <span class=\"sg\" data-s=\"6\">Обикновеният изход на програмата никога не се смесва със съобщенията ѝ за грешки.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Улавянето на изхода е много полезно.<\/span> <span class=\"sg\" data-s=\"1\">Външната програма става една част от вашата програма.<\/span> <span class=\"sg\" data-s=\"2\">Изпълнявате я и четете нейния резултат.<\/span> <span class=\"sg\" data-s=\"3\">После програмата ви продължава и използва тези данни.<\/span><\/p>"]]},"eo":{"t":"Kapti la eligon","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Normale, ekstera programo presas al la ekrano.<\/span> <span class=\"sg\" data-s=\"1\">Sed eble vi volas legi ĝian eligon en via programo.<\/span> <span class=\"sg\" data-s=\"2\">Tiam aldonu <code>:out<\/code>, kiam vi lanĉas la programon.<\/span> <span class=\"sg\" data-s=\"3\">Vi ricevas objekton <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi havas tenilon <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vi povas legi la eligon el ĉi tiu tenilo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sendas la norman eligon de la programo en la <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Norma eligo estas la fluo por la normala eligo de programo.<\/span> <span class=\"sg\" data-s=\"2\">La tenilo <code>.out<\/code> funkcias kiel la dosierteniloj el la antaŭa sekcio.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> legas la tutan tekston el ĝi samtempe.<\/span> <span class=\"sg\" data-s=\"4\">La adverbo <code>:close<\/code> estas utila mallongigo.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi fermas la tenilon por vi post la legado.<\/span> <span class=\"sg\" data-s=\"6\">Antaŭe, vi faris tion mem per <code>.close<\/code> sur dosiertenilo.<\/span> <span class=\"sg\" data-s=\"7\">Do nenio restas malfermita.<\/span> <span class=\"sg\" data-s=\"8\">Fine, <code>.chomp<\/code> forigas la linifinon ĉe la fino.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> aldonas ĉi tiun linifinon.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La samo funkcias kun <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas utila kun dukto.<\/span> <span class=\"sg\" data-s=\"2\">En dukto, unu komando sendas sian eligon al la sekva.<\/span> <span class=\"sg\" data-s=\"3\">Per <code>shell<\/code>, vi povas kapti la finan rezulton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas kapti la erarfluon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu fluo nomiĝas norma erarfluo.<\/span> <span class=\"sg\" data-s=\"2\">Programo presas siajn erarmesaĝojn tien.<\/span> <span class=\"sg\" data-s=\"3\">Por ĉi tiu fluo, uzu <code>:err<\/code> kaj la tenilon <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas transdoni kaj <code>:out<\/code> kaj <code>:err<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tiam la du fluoj restas apartaj.<\/span> <span class=\"sg\" data-s=\"6\">Ĉiu havas sian propran tenilon.<\/span> <span class=\"sg\" data-s=\"7\">Do vi povas legi ĉiun el ili aparte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la ŝela komando presas du liniojn.<\/span> <span class=\"sg\" data-s=\"1\">Unu linio iras al norma eligo.<\/span> <span class=\"sg\" data-s=\"2\">La alia linio iras al norma erarfluo.<\/span> <span class=\"sg\" data-s=\"3\">La parto <code>&gt;&amp;2<\/code> sendas ĝin tien.<\/span> <span class=\"sg\" data-s=\"4\">Ni petis ambaŭ fluojn.<\/span> <span class=\"sg\" data-s=\"5\">Do <code>.out<\/code> kaj <code>.err<\/code> tenas ilin aparte.<\/span> <span class=\"sg\" data-s=\"6\">La normala eligo de la programo neniam miksiĝas kun ĝiaj erarmesaĝoj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kapti eligon estas tre utile.<\/span> <span class=\"sg\" data-s=\"1\">Ekstera programo fariĝas unu parto de via propra programo.<\/span> <span class=\"sg\" data-s=\"2\">Vi rulas ĝin kaj legas ĝian rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Poste via programo daŭras kaj uzas ĉi tiujn datumojn.<\/span><\/p>"]]},"la":{"t":"Exitum capere","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Plerumque programma externum in screen imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Sed fortasse exitum eius in programmate tuo legere vis.<\/span> <span class=\"sg\" data-s=\"2\">Tum <code>:out<\/code> adde cum programma incipis.<\/span> <span class=\"sg\" data-s=\"3\">Obiectum <code>Proc<\/code> accipis.<\/span> <span class=\"sg\" data-s=\"4\">Tractabulum <code>.out<\/code> habet.<\/span> <span class=\"sg\" data-s=\"5\">Ex hoc tractabulo exitum legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> exitum vulgarem programmatis in <code>Proc<\/code> mittit.<\/span> <span class=\"sg\" data-s=\"1\">Exitus vulgaris est fluentum pro exitu ordinario programmatis.<\/span> <span class=\"sg\" data-s=\"2\">Tractabulum <code>.out<\/code> sicut tractabula archivorum ex sectione superiore operatur.<\/span> <span class=\"sg\" data-s=\"3\"><code>.slurp<\/code> totum textum ex eo simul legit.<\/span> <span class=\"sg\" data-s=\"4\">Adverbium <code>:close<\/code> compendium utile est.<\/span> <span class=\"sg\" data-s=\"5\">Post lectionem tractabulum pro te claudit.<\/span> <span class=\"sg\" data-s=\"6\">Antea hoc ipse per <code>.close<\/code> in tractabulo archivi fecisti.<\/span> <span class=\"sg\" data-s=\"7\">Itaque nihil apertum manet.<\/span> <span class=\"sg\" data-s=\"8\">Denique <code>.chomp<\/code> novam lineam in fine removet.<\/span> <span class=\"sg\" data-s=\"9\"><code>echo<\/code> hanc novam lineam addit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Idem cum <code>shell<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc cum fistula utile est.<\/span> <span class=\"sg\" data-s=\"2\">In fistula unum imperatum exitum suum ad proximum mittit.<\/span> <span class=\"sg\" data-s=\"3\">Per <code>shell<\/code> effectum ultimum capere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Etiam fluentum errorum capere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fluentum error vulgaris vocatur.<\/span> <span class=\"sg\" data-s=\"2\">Programma nuntios errorum suos illuc imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Pro hoc fluento <code>:err<\/code> et tractabulum <code>.err<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"4\">Et <code>:out<\/code> et <code>:err<\/code> tradere potes.<\/span> <span class=\"sg\" data-s=\"5\">Tum duo fluenta separata manent.<\/span> <span class=\"sg\" data-s=\"6\">Quodque fluentum suum tractabulum habet.<\/span> <span class=\"sg\" data-s=\"7\">Itaque utrumque separatim legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Hic imperatum interpretis duas lineas imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Una linea ad exitum vulgarem it.<\/span> <span class=\"sg\" data-s=\"2\">Altera linea ad errorem vulgarem it.<\/span> <span class=\"sg\" data-s=\"3\">Pars <code>&gt;&amp;2<\/code> eam illuc mittit.<\/span> <span class=\"sg\" data-s=\"4\">Utrumque fluentum petivimus.<\/span> <span class=\"sg\" data-s=\"5\">Itaque <code>.out<\/code> et <code>.err<\/code> ea separatim tenent.<\/span> <span class=\"sg\" data-s=\"6\">Exitus ordinarius programmatis numquam se cum nuntiis errorum eius miscet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Exitum capere valde utile est.<\/span> <span class=\"sg\" data-s=\"1\">Programma externum fit una pars programmatis tui.<\/span> <span class=\"sg\" data-s=\"2\">Id curris et effectum eius legis.<\/span> <span class=\"sg\" data-s=\"3\">Tum programma tuum pergit et haec data adhibet.<\/span><\/p>"]]}}}</script>
