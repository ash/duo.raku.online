<script type="application/json" id="page-data">{"u":"oop/external-programs","n":907,"k":"section","pv":"oop/file-handles/quiz","nx":"oop/external-programs/run-and-shell","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Running external programs","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A program does not work alone.<\/span> <span class=\"sg\" data-s=\"1\">It often runs other programs and reads what they print.<\/span> <span class=\"sg\" data-s=\"2\">It also looks at its environment.<\/span> <span class=\"sg\" data-s=\"3\">The environment is a set of values.<\/span> <span class=\"sg\" data-s=\"4\">A program gets them when it starts.<\/span> <span class=\"sg\" data-s=\"5\">Raku gives you direct and easy access to all of this.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">This section is about <code>run<\/code> and <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">With them, you start external commands.<\/span> <span class=\"sg\" data-s=\"2\">These are other programs.<\/span> <span class=\"sg\" data-s=\"3\">You also learn to capture what these commands print.<\/span> <span class=\"sg\" data-s=\"4\">Then your program can use their output.<\/span> <span class=\"sg\" data-s=\"5\">At the end, you meet the <code>%*ENV<\/code> hash.<\/span> <span class=\"sg\" data-s=\"6\">It holds the environment variables.<\/span><\/p>"]]},"de":{"t":"Externe Programme ausführen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein Programm arbeitet nicht allein.<\/span> <span class=\"sg\" data-s=\"1\">Oft startet es andere Programme und liest ihre Ausgabe.<\/span> <span class=\"sg\" data-s=\"2\">Es schaut auch auf seine Umgebung.<\/span> <span class=\"sg\" data-s=\"3\">Die Umgebung ist eine Reihe von Werten.<\/span> <span class=\"sg\" data-s=\"4\">Ein Programm bekommt sie beim Start.<\/span> <span class=\"sg\" data-s=\"5\">Raku gibt Ihnen einen direkten und einfachen Zugang zu all dem.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt geht es um <code>run<\/code> und <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Damit starten Sie externe Befehle.<\/span> <span class=\"sg\" data-s=\"2\">Das sind andere Programme.<\/span> <span class=\"sg\" data-s=\"3\">Sie lernen auch, die Ausgabe dieser Befehle aufzufangen.<\/span> <span class=\"sg\" data-s=\"4\">Dann kann Ihr Programm diese Ausgabe benutzen.<\/span> <span class=\"sg\" data-s=\"5\">Am Ende lernen Sie den Hash <code>%*ENV<\/code> kennen.<\/span> <span class=\"sg\" data-s=\"6\">Er enthält die Umgebungsvariablen.<\/span><\/p>"]]},"nl":{"t":"Externe programma's draaien","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een programma werkt niet alleen.<\/span> <span class=\"sg\" data-s=\"1\">Het draait vaak andere programma's en leest wat ze afdrukken.<\/span> <span class=\"sg\" data-s=\"2\">Het kijkt ook naar zijn omgeving.<\/span> <span class=\"sg\" data-s=\"3\">De omgeving is een verzameling waarden.<\/span> <span class=\"sg\" data-s=\"4\">Een programma krijgt ze bij het starten.<\/span> <span class=\"sg\" data-s=\"5\">Raku geeft je direct en makkelijk toegang tot dit alles.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Deze sectie gaat over <code>run<\/code> en <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee start je externe commando's.<\/span> <span class=\"sg\" data-s=\"2\">Dat zijn andere programma's.<\/span> <span class=\"sg\" data-s=\"3\">Je leert ook opvangen wat deze commando's afdrukken.<\/span> <span class=\"sg\" data-s=\"4\">Dan kan je programma hun uitvoer gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Aan het eind leer je de hash <code>%*ENV<\/code> kennen.<\/span> <span class=\"sg\" data-s=\"6\">Die bevat de omgevingsvariabelen.<\/span><\/p>"]]},"es":{"t":"Ejecutar programas externos 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un programa no trabaja solo.<\/span> <span class=\"sg\" data-s=\"1\">A menudo ejecuta otros programas y lee lo que imprimen.<\/span> <span class=\"sg\" data-s=\"2\">También mira su entorno.<\/span> <span class=\"sg\" data-s=\"3\">El entorno es un conjunto de valores.<\/span> <span class=\"sg\" data-s=\"4\">Un programa los recibe cuando empieza.<\/span> <span class=\"sg\" data-s=\"5\">Raku te da acceso directo y fácil a todo esto.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata de <code>run<\/code> y <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con ellas, inicias órdenes externas.<\/span> <span class=\"sg\" data-s=\"2\">Son otros programas.<\/span> <span class=\"sg\" data-s=\"3\">También aprendes a capturar lo que imprimen estas órdenes.<\/span> <span class=\"sg\" data-s=\"4\">Entonces tu programa puede usar su salida.<\/span> <span class=\"sg\" data-s=\"5\">Al final, conoces el hash <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Contiene las variables de entorno.<\/span><\/p>"]]},"it":{"t":"Eseguire programmi esterni 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un programma non lavora da solo.<\/span> <span class=\"sg\" data-s=\"1\">Spesso esegue altri programmi e legge quello che stampano.<\/span> <span class=\"sg\" data-s=\"2\">Guarda anche il suo ambiente.<\/span> <span class=\"sg\" data-s=\"3\">L'ambiente è un insieme di valori.<\/span> <span class=\"sg\" data-s=\"4\">Un programma li riceve quando parte.<\/span> <span class=\"sg\" data-s=\"5\">Raku ti dà un accesso diretto e facile a tutto questo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Questa sezione parla di <code>run<\/code> e <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con queste funzioni avvii comandi esterni.<\/span> <span class=\"sg\" data-s=\"2\">Sono altri programmi.<\/span> <span class=\"sg\" data-s=\"3\">Impari anche a catturare quello che questi comandi stampano.<\/span> <span class=\"sg\" data-s=\"4\">Poi il tuo programma può usare il loro output.<\/span> <span class=\"sg\" data-s=\"5\">Alla fine incontri l'hash <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Contiene le variabili d'ambiente.<\/span><\/p>"]]},"lv":{"t":"Ārējo programmu palaišana 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programma nestrādā viena.<\/span> <span class=\"sg\" data-s=\"1\">Tā bieži palaiž citas programmas un nolasa, ko tās izdrukā.<\/span> <span class=\"sg\" data-s=\"2\">Tā arī skatās uz savu vidi.<\/span> <span class=\"sg\" data-s=\"3\">Vide ir vērtību kopa.<\/span> <span class=\"sg\" data-s=\"4\">Programma tās saņem, kad sāk darbu.<\/span> <span class=\"sg\" data-s=\"5\">Raku dod jums tiešu un vieglu piekļuvi tam visam.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa ir par <code>run<\/code> un <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ar tām jūs palaižat ārējas komandas.<\/span> <span class=\"sg\" data-s=\"2\">Tās ir citas programmas.<\/span> <span class=\"sg\" data-s=\"3\">Jūs arī mācāties noķert to, ko šīs komandas izdrukā.<\/span> <span class=\"sg\" data-s=\"4\">Tad jūsu programma var lietot to izvadi.<\/span> <span class=\"sg\" data-s=\"5\">Beigās jūs iepazīstat jaukteni <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tas satur vides mainīgos.<\/span><\/p>"]]},"ru":{"t":"Запуск внешних программ","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Программа не работает одна.<\/span> <span class=\"sg\" data-s=\"1\">Она часто запускает другие программы и читает, что они печатают.<\/span> <span class=\"sg\" data-s=\"2\">Ещё она смотрит на своё окружение.<\/span> <span class=\"sg\" data-s=\"3\">Окружение — это набор значений.<\/span> <span class=\"sg\" data-s=\"4\">Программа получает их при запуске.<\/span> <span class=\"sg\" data-s=\"5\">Raku даёт вам прямой и простой доступ ко всему этому.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Этот раздел — о <code>run<\/code> и <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С ними вы запускаете внешние команды.<\/span> <span class=\"sg\" data-s=\"2\">Это другие программы.<\/span> <span class=\"sg\" data-s=\"3\">Ещё вы научитесь перехватывать то, что печатают эти команды.<\/span> <span class=\"sg\" data-s=\"4\">Тогда ваша программа может использовать их вывод.<\/span> <span class=\"sg\" data-s=\"5\">В конце вы встретите хеш <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">В нём хранятся переменные окружения.<\/span><\/p>"]]},"uk":{"t":"Запуск зовнішніх програм","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Програма не працює сама по собі.<\/span> <span class=\"sg\" data-s=\"1\">Вона часто запускає інші програми й читає те, що вони виводять.<\/span> <span class=\"sg\" data-s=\"2\">Вона також дивиться на своє середовище.<\/span> <span class=\"sg\" data-s=\"3\">Середовище — це набір значень.<\/span> <span class=\"sg\" data-s=\"4\">Програма отримує їх, коли запускається.<\/span> <span class=\"sg\" data-s=\"5\">Raku дає вам прямий і простий доступ до всього цього.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Цей розділ — про <code>run<\/code> і <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">З ними ви запускаєте зовнішні команди.<\/span> <span class=\"sg\" data-s=\"2\">Це інші програми.<\/span> <span class=\"sg\" data-s=\"3\">Ви також навчитеся перехоплювати те, що ці команди виводять.<\/span> <span class=\"sg\" data-s=\"4\">Тоді ваша програма може використати їхній вивід.<\/span> <span class=\"sg\" data-s=\"5\">Наприкінці ви познайомитеся з хешем <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Він містить змінні середовища.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на външни програми","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Програмата не работи сама.<\/span> <span class=\"sg\" data-s=\"1\">Тя често стартира други програми и чете какво отпечатват те.<\/span> <span class=\"sg\" data-s=\"2\">Тя също гледа своята среда.<\/span> <span class=\"sg\" data-s=\"3\">Средата е набор от стойности.<\/span> <span class=\"sg\" data-s=\"4\">Програмата ги получава, когато стартира.<\/span> <span class=\"sg\" data-s=\"5\">Raku ви дава пряк и лесен достъп до всичко това.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Този раздел е за <code>run<\/code> и <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С тях стартирате външни команди.<\/span> <span class=\"sg\" data-s=\"2\">Това са други програми.<\/span> <span class=\"sg\" data-s=\"3\">Научавате също как да улавяте какво отпечатват тези команди.<\/span> <span class=\"sg\" data-s=\"4\">Тогава програмата ви може да използва изхода им.<\/span> <span class=\"sg\" data-s=\"5\">Накрая се запознавате с хеша <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Той съдържа променливите на средата.<\/span><\/p>"]]},"eo":{"t":"Ruli eksterajn programojn 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programo ne laboras sola.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ofte rulas aliajn programojn kaj legas, kion ili presas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ rigardas sian medion.<\/span> <span class=\"sg\" data-s=\"3\">La medio estas aro de valoroj.<\/span> <span class=\"sg\" data-s=\"4\">Programo ricevas ilin, kiam ĝi startas.<\/span> <span class=\"sg\" data-s=\"5\">Raku donas al vi rektan kaj facilan aliron al ĉio ĉi.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio temas pri <code>run<\/code> kaj <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per ili, vi lanĉas eksterajn komandojn.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas aliaj programoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ lernas kapti tion, kion ĉi tiuj komandoj presas.<\/span> <span class=\"sg\" data-s=\"4\">Tiam via programo povas uzi ilian eligon.<\/span> <span class=\"sg\" data-s=\"5\">Fine, vi renkontas la hakon <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi tenas la mediajn variablojn.<\/span><\/p>"]]},"la":{"t":"Programmata externa exsequi 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Programma solum non operatur.<\/span> <span class=\"sg\" data-s=\"1\">Saepe alia programmata currit et legit quod imprimunt.<\/span> <span class=\"sg\" data-s=\"2\">Etiam ambitum suum inspicit.<\/span> <span class=\"sg\" data-s=\"3\">Ambitus est series valorum.<\/span> <span class=\"sg\" data-s=\"4\">Programma eos accipit cum incipit.<\/span> <span class=\"sg\" data-s=\"5\">Raku tibi ad haec omnia accessum directum et facilem dat.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Haec sectio de <code>run<\/code> et <code>shell<\/code> est.<\/span> <span class=\"sg\" data-s=\"1\">Per ea imperata externa incipis.<\/span> <span class=\"sg\" data-s=\"2\">Haec sunt alia programmata.<\/span> <span class=\"sg\" data-s=\"3\">Etiam discis capere quod haec imperata imprimunt.<\/span> <span class=\"sg\" data-s=\"4\">Tum programma tuum exitum eorum adhibere potest.<\/span> <span class=\"sg\" data-s=\"5\">Ad finem mappam <code>%*ENV<\/code> cognoscis.<\/span> <span class=\"sg\" data-s=\"6\">Variabiles ambitus continet.<\/span><\/p>"]]}}}</script>
