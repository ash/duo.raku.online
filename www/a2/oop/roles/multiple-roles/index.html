keuze dan één keten van overerving.<\/span> <span class=\"sg\" data-s=\"3\">Een klasse neemt precies de vaardigheden die ze nodig heeft.<\/span> <span class=\"sg\" data-s=\"4\">Ze neemt niets meer.<\/span><\/p>"]]},"es":{"t":"Componer varios roles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una clase puede asumir más de un rol.<\/span> <span class=\"sg\" data-s=\"1\">Solo tienes que escribir <code>does<\/code> antes de cada rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ahora la clase <code>Duck<\/code> tiene dos métodos.<\/span> <span class=\"sg\" data-s=\"1\">Tiene <code>move<\/code> de <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Y tiene <code>dive<\/code> de <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta forma de juntar roles se llama <em>composición<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Construyes una clase a partir de varias piezas separadas de comportamiento.<\/span> <span class=\"sg\" data-s=\"2\">Esto a menudo te da más libertad que una sola cadena de herencia.<\/span> <span class=\"sg\" data-s=\"3\">Una clase toma exactamente las capacidades que necesita.<\/span> <span class=\"sg\" data-s=\"4\">No toma nada más.<\/span><\/p>"]]},"it":{"t":"Comporre più ruoli","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Una classe può assumere più di un ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Basta scrivere <code>does<\/code> prima di ogni ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora la classe <code>Duck<\/code> ha due metodi.<\/span> <span class=\"sg\" data-s=\"1\">Ha <code>move<\/code> da <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ha <code>dive<\/code> da <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo modo di mettere insieme i ruoli si chiama <em>composizione<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Costruisci una classe con più pezzi separati di comportamento.<\/span> <span class=\"sg\" data-s=\"2\">Spesso questo ti dà più libertà di una sola catena di ereditarietà.<\/span> <span class=\"sg\" data-s=\"3\">Una classe prende proprio le capacità che le servono.<\/span> <span class=\"sg\" data-s=\"4\">Non prende niente di più.<\/span><\/p>"]]},"lv":{"t":"Vairāku lomu apvienošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Klase var darīt vairāk nekā vienu lomu.<\/span> <span class=\"sg\" data-s=\"1\">Vienkārši rakstiet <code>does<\/code> pirms katras lomas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad klasei <code>Duck<\/code> ir divas metodes.<\/span> <span class=\"sg\" data-s=\"1\">Tai ir <code>move<\/code> no <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tai ir <code>dive<\/code> no <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šādu lomu salikšanu kopā sauc par <em>komponēšanu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs būvējat klasi no vairākiem atsevišķiem uzvedības gabaliem.<\/span> <span class=\"sg\" data-s=\"2\">Tas bieži dod jums vairāk izvēles nekā viena mantošanas ķēde.<\/span> <span class=\"sg\" data-s=\"3\">Klase ņem tieši tās spējas, kas tai vajadzīgas.<\/span> <span class=\"sg\" data-s=\"4\">Neko vairāk tā neņem.<\/span><\/p>"]]},"ru":{"t":"Композиция нескольких ролей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класс может выполнять больше одной роли.<\/span> <span class=\"sg\" data-s=\"1\">Просто напишите <code>does<\/code> перед каждой ролью:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь у класса <code>Duck<\/code> есть два метода.<\/span> <span class=\"sg\" data-s=\"1\">У него есть <code>move<\/code> из <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У него есть <code>dive<\/code> из <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Такое соединение ролей называется <em>композицией<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вы собираете класс из нескольких отдельных кусочков поведения.<\/span> <span class=\"sg\" data-s=\"2\">Это часто даёт больше свободы, чем одна цепочка наследования.<\/span> <span class=\"sg\" data-s=\"3\">Класс берёт ровно те умения, которые ему нужны.<\/span> <span class=\"sg\" data-s=\"4\">Больше он ничего не берёт.<\/span><\/p>"]]},"uk":{"t":"Компонування кількох ролей","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Клас може виконувати більш ніж одну роль.<\/span> <span class=\"sg\" data-s=\"1\">Просто напишіть <code>does<\/code> перед кожною роллю:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер клас <code>Duck<\/code> має два методи.<\/span> <span class=\"sg\" data-s=\"1\">Він має <code>move<\/code> із <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він має <code>dive<\/code> із <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Таке поєднання ролей називають <em>композицією<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ви будуєте клас із кількох окремих частин поведінки.<\/span> <span class=\"sg\" data-s=\"2\">Це часто дає вам більше вибору, ніж один ланцюжок успадкування.<\/span> <span class=\"sg\" data-s=\"3\">Клас бере саме ті вміння, які йому потрібні.<\/span> <span class=\"sg\" data-s=\"4\">Більше він нічого не бере.<\/span><\/p>"]]},"bg":{"t":"Компониране на няколко роли","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Класът може да изпълнява повече от една роля.<\/span> <span class=\"sg\" data-s=\"1\">Просто напишете <code>does<\/code> пред всяка роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Walk {\n    method move { 'walking' }\n}\n\nrole Swim {\n    method dive { 'diving' }\n}\n\nclass Duck does Walk does Swim {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега класът <code>Duck<\/code> има два метода.<\/span> <span class=\"sg\" data-s=\"1\">Той има <code>move<\/code> от <code>Walk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той има и <code>dive<\/code> от <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този начин да събирате роли заедно се нарича <em>композиция<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Изграждате клас от няколко отделни парчета поведение.<\/span> <span class=\"sg\" data-s=\"2\">Това често ви дава повече избор от една верига на наследяване.<\/span> <span class=\"sg\" data-s=\"3\">Класът взема точно способно alk<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Habet <code>dive<\/code> ex <code>Swim<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Duck.new.move; # walking\nsay Duck.new.dive; # diving<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hunc modum partes coniungendi <em>compositionem<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"1\">Classem ex pluribus portionibus agendi rationis separatis aedificas.<\/span> <span class=\"sg\" data-s=\"2\">Hoc saepe plus libertatis dat quam una catena hereditatis.<\/span> <span class=\"sg\" data-s=\"3\">Classis exacte eas facultates sumit quibus eget.<\/span> <span class=\"sg\" data-s=\"4\">Nihil amplius sumit.<\/span><\/p>"]]}}}</script>
