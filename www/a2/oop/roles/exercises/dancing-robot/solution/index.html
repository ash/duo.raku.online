<script type="application/json" id="page-data">{"u":"oop/roles/exercises/dancing-robot/solution","n":838,"k":"solution","pv":"oop/roles/exercises/dancing-robot","nx":"oop/object-introspection","tr":["oop","oop/roles"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A dancing robot‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is not like the earlier examples. <code>Dancing<\/code> does not replace a method that is already there. It brings a completely new method, <code>dance<\/code>. The class <code>Robot<\/code> knows nothing about this method.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mixes the role into one single object. This happens while the program runs. So <code>$dancing<\/code> can do two things. It can <code>speak<\/code>, from the class. It can also <code>dance<\/code>, from the role. The plain <code>$plain<\/code> knows only <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The new ability belongs only to this one object. It does not belong to the class <code>Robot<\/code>. So <code>$plain.dance<\/code> gives an error. <code>$plain<\/code> never got the role.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein tanzender Roboter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das ist anders als in den früheren Beispielen. <code>Dancing<\/code> ersetzt keine Methode, die schon da ist. Die Rolle bringt eine ganz neue Methode mit, <code>dance<\/code>. Die Klasse <code>Robot<\/code> weiß nichts von dieser Methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mischt die Rolle in ein einzelnes Objekt. Das passiert, während das Programm läuft. Also kann <code>$dancing<\/code> zwei Dinge. Es kann <code>speak<\/code>, aus der Klasse. Es kann auch <code>dance<\/code>, aus der Rolle. Der einfache <code>$plain<\/code> kennt nur <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die neue Fähigkeit gehört nur zu diesem einen Objekt. Sie gehört nicht zur Klasse <code>Robot<\/code>. Also gibt <code>$plain.dance<\/code> einen Fehler. <code>$plain<\/code> hat die Rolle nie bekommen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een dansende robot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is anders dan de eerdere voorbeelden. <code>Dancing<\/code> vervangt geen methode die er al is. Hij brengt een helemaal nieuwe methode mee, <code>dance<\/code>. De klasse <code>Robot<\/code> weet niets van deze methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mengt de rol in één enkel object. Dat gebeurt terwijl het programma draait. Dus kan <code>$dancing<\/code> twee dingen. Hij kan <code>speak<\/code>, uit de klasse. Hij kan ook <code>dance<\/code>, uit de rol. De gewone <code>$plain<\/code> kent alleen <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De nieuwe vaardigheid hoort alleen bij dit ene object. Ze hoort niet bij de klasse <code>Robot<\/code>. Dus geeft <code>$plain.dance<\/code> een fout. <code>$plain<\/code> heeft de rol nooit gekregen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un robot que baila","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esto no es como los ejemplos anteriores. <code>Dancing<\/code> no sustituye un método que ya existe. Trae un método completamente nuevo, <code>dance<\/code>. La clase <code>Robot<\/code> no sabe nada de este método.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mezcla el rol en un solo objeto. Esto pasa mientras el programa se ejecuta. Así que <code>$dancing<\/code> puede hacer dos cosas. Sabe hacer <code>speak<\/code>, de la clase. También sabe hacer <code>dance<\/code>, del rol. El simple <code>$plain<\/code> solo sabe hacer <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La capacidad nueva pertenece solo a este objeto. No pertenece a la clase <code>Robot<\/code>. Así que <code>$plain.dance<\/code> da un error. <code>$plain<\/code> nunca recibió el rol.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un robot che balla","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui non è come negli esempi precedenti. <code>Dancing<\/code> non sostituisce un metodo che c'è già. Porta un metodo completamente nuovo, <code>dance<\/code>. La classe <code>Robot<\/code> non sa niente di questo metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> mescola il ruolo in un solo oggetto. Questo succede mentre il programma gira. Quindi <code>$dancing<\/code> sa fare due cose. Sa fare <code>speak<\/code>, dalla classe. Sa fare anche <code>dance<\/code>, dal ruolo. Il semplice <code>$plain<\/code> conosce solo <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La nuova capacità appartiene solo a questo oggetto. Non appartiene alla classe <code>Robot<\/code>. Quindi <code>$plain.dance<\/code> dà un errore. <code>$plain<\/code> non ha mai ricevuto il ruolo.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Dejojošs robots","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šeit ir citādi nekā iepriekšējos piemēros. <code>Dancing<\/code> neaizstāj metodi, kas jau ir. Tā atnes pavisam jaunu metodi, <code>dance<\/code>. Klase <code>Robot<\/code> neko nezina par šo metodi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> iemaisa lomu tikai vienā objektā. Tas notiek, kamēr programma darbojas. Tāpēc <code>$dancing<\/code> prot divas lietas. Tas prot <code>speak<\/code>, no klases. Tas prot arī <code>dance<\/code>, no lomas. Vienkāršais <code>$plain<\/code> prot tikai <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jaunā spēja pieder tikai šim vienam objektam. Tā nepieder klasei <code>Robot<\/code>. Tāpēc <code>$plain.dance<\/code> dod kļūdu. <code>$plain<\/code> nekad nesaņēma lomu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Танцующий робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здесь не так, как в прошлых примерах. <code>Dancing<\/code> не заменяет метод, который уже есть. Она приносит совсем новый метод, <code>dance<\/code>. Класс <code>Robot<\/code> ничего не знает об этом методе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> подмешивает роль в один-единственный объект. Это происходит, пока программа работает. Поэтому <code>$dancing<\/code> умеет две вещи. Он умеет <code>speak<\/code>, из класса. Ещё он умеет <code>dance<\/code>, из роли. Обычный <code>$plain<\/code> знает только <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Новое умение есть только у этого одного объекта. Оно не принадлежит классу <code>Robot<\/code>. Поэтому <code>$plain.dance<\/code> даёт ошибку. <code>$plain<\/code> так и не получил роль.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Робот, що танцює","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тут не так, як у попередніх прикладах. <code>Dancing<\/code> не замінює метод, який клас уже має. Вона приносить зовсім новий метод, <code>dance<\/code>. Клас <code>Robot<\/code> нічого не знає про цей метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> підмішує роль лише в один об'єкт. Це стається, поки програма працює. Тож <code>$dancing<\/code> уміє дві речі. Він уміє <code>speak<\/code>, від класу. Він також уміє <code>dance<\/code>, від ролі. Звичайний <code>$plain<\/code> знає лише <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нове вміння належить лише цьому одному об'єкту. Воно не належить класу <code>Robot<\/code>. Тож <code>$plain.dance<\/code> дає помилку. <code>$plain<\/code> ніколи не отримував ролі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Танцуващ робот","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това не е като в предишните примери. <code>Dancing<\/code> не заменя метод, който вече съществува. Тя носи съвсем нов метод, <code>dance<\/code>. Класът <code>Robot<\/code> не знае нищо за този метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> вмесва ролята в един-единствен обект. Това става, докато програмата работи. Затова <code>$dancing<\/code> може да прави две неща. Той може да <code>speak<\/code>, от класа. Той може и да <code>dance<\/code>, от ролята. Обикновеният <code>$plain<\/code> знае само <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Новата способност принадлежи само на този един обект. Тя не принадлежи на класа <code>Robot<\/code>. Затова <code>$plain.dance<\/code> дава грешка. <code>$plain<\/code> никога не е получавал ролята.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Dancanta roboto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tio ne estas kiel la pli fruaj ekzemploj. <code>Dancing<\/code> ne anstataŭigas metodon, kiu jam ekzistas. Ĝi alportas tute novan metodon, <code>dance<\/code>. La klaso <code>Robot<\/code> scias nenion pri ĉi tiu metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> enmiksas la rolon en unu solan objekton. Tio okazas dum la programo ruliĝas. Do <code>$dancing<\/code> povas fari du aferojn. Ĝi povas <code>speak<\/code>, el la klaso. Ĝi ankaŭ povas <code>dance<\/code>, el la rolo. La simpla <code>$plain<\/code> konas nur <code>speak<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La nova kapablo apartenas nur al ĉi tiu unu objekto. Ĝi ne apartenas al la klaso <code>Robot<\/code>. Do <code>$plain.dance<\/code> donas eraron. <code>$plain<\/code> neniam ricevis la rolon.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Robotum saltans","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>role Dancing {\n    method dance {\n        'spinning around';\n    }\n}\n\nclass Robot {\n    method speak {\n        'beep';\n    }\n}\n\nmy $plain   = Robot.new;\nmy $dancing = Robot.new but Dancing;\n\nsay $plain.speak;\nsay $dancing.speak;\nsay $dancing.dance;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/roles/dancing-robot.raku\" target=\"_blank\" rel=\"noopener\">dancing-robot.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>beep\nbeep\nspinning around<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hoc non est sicut exempla superiora. <code>Dancing<\/code> methodum quae iam adest non substituit. Methodum omnino novam adfert, <code>dance<\/code>. Classis <code>Robot<\/code> nihil de hac methodo scit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Robot.new but Dancing<\/code> partem in unum solum obiectum miscet. Hoc fit dum programma currit. Itaque <code>$dancing<\/code> duas res facere potest. Potest <code>speak<\/code>, ex classe. Etiam potest <code>dance<\/code>, ex parte. Simplex <code>$plain<\/code> solum <code>speak<\/code> scit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nova facultas solum ad hoc unum obiectum pertinet. Ad classem <code>Robot<\/code> non pertinet. Itaque <code>$plain.dance<\/code> errorem dat. <code>$plain<\/code> partem numquam accepit.<\/span><\/li><\/ol>"]]}}}</script>
