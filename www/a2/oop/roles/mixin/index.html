<script type="application/json" id="page-data">{"u":"oop/roles/mixin","n":830,"k":"topic","pv":"oop/roles/multiple-roles","nx":"oop/roles/mixin/quiz","tr":["oop","oop/roles"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Adding a role to an object","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">You do not have to build a role into a class.<\/span> <span class=\"sg\" data-s=\"1\">You can also give a role to an object that already exists.<\/span> <span class=\"sg\" data-s=\"2\">For this, use the operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It mixes the role into one single object.<\/span> <span class=\"sg\" data-s=\"4\">This happens while the program runs.<\/span> <span class=\"sg\" data-s=\"5\">Then <code>but<\/code> returns a new object with the role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Only <code>$loud<\/code> got the role.<\/span> <span class=\"sg\" data-s=\"1\">The class <code>Greeter<\/code> and all other <code>Greeter<\/code> objects stay the same.<\/span> <span class=\"sg\" data-s=\"2\">So <code>$quiet<\/code> still greets in the normal way.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes the role and the class have methods with the same name.<\/span> <span class=\"sg\" data-s=\"4\">Then the version from the role wins.<\/span> <span class=\"sg\" data-s=\"5\">And <code>callsame<\/code> calls the other method, which the role overrides.<\/span> <span class=\"sg\" data-s=\"6\">Here, it is the original <code>greet<\/code> from <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Then its result is changed to capital letters.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An object can get a role in this way.<\/span> <span class=\"sg\" data-s=\"1\">Then it counts as doing this role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> does not change the original object.<\/span> <span class=\"sg\" data-s=\"1\">It gives you a new object.<\/span> <span class=\"sg\" data-s=\"2\">Maybe you want to change the object itself.<\/span> <span class=\"sg\" data-s=\"3\">Then use the operator <code>does<\/code> instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can mix roles into single objects.<\/span> <span class=\"sg\" data-s=\"1\">So you decide for each object what extra behaviour it gets.<\/span> <span class=\"sg\" data-s=\"2\">You do not need a separate class for every combination.<\/span><\/p>"]]},"de":{"t":"Einem Objekt eine Rolle hinzufügen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Sie müssen eine Rolle nicht in eine Klasse einbauen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können eine Rolle auch einem Objekt geben, das es schon gibt.<\/span> <span class=\"sg\" data-s=\"2\">Dafür nehmen Sie den Operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er mischt die Rolle in ein einzelnes Objekt.<\/span> <span class=\"sg\" data-s=\"4\">Das passiert, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"5\">Dann gibt <code>but<\/code> ein neues Objekt mit der Rolle zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Nur <code>$loud<\/code> hat die Rolle bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Die Klasse <code>Greeter<\/code> und alle anderen <code>Greeter<\/code>-Objekte bleiben gleich.<\/span> <span class=\"sg\" data-s=\"2\">Also grüßt <code>$quiet<\/code> weiter auf die normale Weise.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal haben die Rolle und die Klasse Methoden mit demselben Namen.<\/span> <span class=\"sg\" data-s=\"4\">Dann gewinnt die Version aus der Rolle.<\/span> <span class=\"sg\" data-s=\"5\">Und <code>callsame<\/code> ruft die andere Methode auf, die die Rolle überschreibt.<\/span> <span class=\"sg\" data-s=\"6\">Das ist hier das ursprüngliche <code>greet<\/code> aus <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Dann ändert die Methode sein Ergebnis in Großbuchstaben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Objekt kann so eine Rolle bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Dann erfüllt es diese Rolle:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> ändert das ursprüngliche Objekt nicht.<\/span> <span class=\"sg\" data-s=\"1\">Er gibt Ihnen ein neues Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Vielleicht wollen Sie das Objekt selbst ändern.<\/span> <span class=\"sg\" data-s=\"3\">Dann nehmen Sie stattdessen den Operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können Rollen in einzelne Objekte mischen.<\/span> <span class=\"sg\" data-s=\"1\">So entscheiden Sie für jedes Objekt, welches zusätzliche Verhalten es bekommt.<\/span> <span class=\"sg\" data-s=\"2\">Sie brauchen keine eigene Klasse für jede Kombination.<\/span><\/p>"]]},"nl":{"t":"Een rol aan een object toevoegen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Je hoeft een rol niet in een klasse te bouwen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een rol ook geven aan een object dat al bestaat.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik daarvoor de operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die mengt de rol in één enkel object.<\/span> <span class=\"sg\" data-s=\"4\">Dat gebeurt terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"5\">Dan geeft <code>but<\/code> een nieuw object met de rol terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Alleen <code>$loud<\/code> kreeg de rol.<\/span> <span class=\"sg\" data-s=\"1\">De klasse <code>Greeter<\/code> en alle andere <code>Greeter<\/code>-objecten blijven hetzelfde.<\/span> <span class=\"sg\" data-s=\"2\">Dus groet <code>$quiet<\/code> nog steeds op de gewone manier.<\/span> <span class=\"sg\" data-s=\"3\">Soms hebben de rol en de klasse methoden met dezelfde naam.<\/span> <span class=\"sg\" data-s=\"4\">Dan wint de versie uit de rol.<\/span> <span class=\"sg\" data-s=\"5\">En <code>callsame<\/code> roept de andere methode aan, die de rol overschrijft.<\/span> <span class=\"sg\" data-s=\"6\">Hier is dat de oorspronkelijke <code>greet<\/code> uit <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Daarna komt haar resultaat in hoofdletters.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een object kan op deze manier een rol krijgen.<\/span> <span class=\"sg\" data-s=\"1\">Dan telt het als een object dat deze rol doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> verandert het oorspronkelijke object niet.<\/span> <span class=\"sg\" data-s=\"1\">Hij geeft je een nieuw object.<\/span> <span class=\"sg\" data-s=\"2\">Misschien wil je het object zelf veranderen.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik dan in plaats daarvan de operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt rollen in losse objecten mengen.<\/span> <span class=\"sg\" data-s=\"1\">Zo beslis je voor elk object welk extra gedrag het krijgt.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt geen aparte klasse nodig voor elke combinatie.<\/span><\/p>"]]},"es":{"t":"Añadir un rol a un objeto","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">No tienes que meter un rol dentro de una clase.<\/span> <span class=\"sg\" data-s=\"1\">También puedes dar un rol a un objeto que ya existe.<\/span> <span class=\"sg\" data-s=\"2\">Para esto, usa el operador <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mezcla el rol en un solo objeto.<\/span> <span class=\"sg\" data-s=\"4\">Esto pasa mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"5\">Después <code>but<\/code> devuelve un objeto nuevo con el rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> recibió el rol.<\/span> <span class=\"sg\" data-s=\"1\">La clase <code>Greeter<\/code> y todos los demás objetos <code>Greeter<\/code> siguen igual.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>$quiet<\/code> todavía saluda de la forma normal.<\/span> <span class=\"sg\" data-s=\"3\">A veces el rol y la clase tienen métodos con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"4\">Entonces gana la versión del rol.<\/span> <span class=\"sg\" data-s=\"5\">Y <code>callsame<\/code> llama al otro método, el que el rol sobrescribe.<\/span> <span class=\"sg\" data-s=\"6\">Aquí, es el <code>greet<\/code> original de <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Después su resultado pasa a mayúsculas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un objeto puede recibir un rol de esta forma.<\/span> <span class=\"sg\" data-s=\"1\">Entonces cuenta como un objeto con este rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> no cambia el objeto original.<\/span> <span class=\"sg\" data-s=\"1\">Te da un objeto nuevo.<\/span> <span class=\"sg\" data-s=\"2\">Quizás quieres cambiar el objeto mismo.<\/span> <span class=\"sg\" data-s=\"3\">Entonces usa en su lugar el operador <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes mezclar roles en objetos sueltos.<\/span> <span class=\"sg\" data-s=\"1\">Así decides para cada objeto qué comportamiento extra recibe.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas una clase aparte para cada combinación.<\/span><\/p>"]]},"it":{"t":"Aggiungere un ruolo a un oggetto","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Non devi per forza mettere un ruolo dentro una classe.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche dare un ruolo a un oggetto che esiste già.<\/span> <span class=\"sg\" data-s=\"2\">Per questo, usa l'operatore <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mescola il ruolo in un solo oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Questo succede mentre il programma gira.<\/span> <span class=\"sg\" data-s=\"5\">Poi <code>but<\/code> restituisce un nuovo oggetto con il ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> ha ricevuto il ruolo.<\/span> <span class=\"sg\" data-s=\"1\">La classe <code>Greeter<\/code> e tutti gli altri oggetti <code>Greeter<\/code> restano uguali.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>$quiet<\/code> saluta ancora nel modo normale.<\/span> <span class=\"sg\" data-s=\"3\">A volte il ruolo e la classe hanno metodi con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"4\">Allora vince la versione del ruolo.<\/span> <span class=\"sg\" data-s=\"5\">E <code>callsame<\/code> chiama l'altro metodo, che il ruolo sovrascrive.<\/span> <span class=\"sg\" data-s=\"6\">Qui è il <code>greet<\/code> originale di <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Poi il suo risultato diventa maiuscolo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un oggetto può ricevere un ruolo in questo modo.<\/span> <span class=\"sg\" data-s=\"1\">Allora conta come un oggetto con questo ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> non cambia l'oggetto originale.<\/span> <span class=\"sg\" data-s=\"1\">Ti dà un nuovo oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Forse vuoi cambiare l'oggetto stesso.<\/span> <span class=\"sg\" data-s=\"3\">Allora usa invece l'operatore <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi mescolare ruoli in singoli oggetti.<\/span> <span class=\"sg\" data-s=\"1\">Così decidi per ogni oggetto quale comportamento in più riceve.<\/span> <span class=\"sg\" data-s=\"2\">Non ti serve una classe separata per ogni combinazione.<\/span><\/p>"]]},"lv":{"t":"Lomas pievienošana objektam","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Jums nav obligāti jāiebūvē loma klasē.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat dot lomu arī objektam, kas jau eksistē.<\/span> <span class=\"sg\" data-s=\"2\">Tam lietojiet operatoru <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas iemaisa lomu tikai vienā objektā.<\/span> <span class=\"sg\" data-s=\"4\">Tas notiek, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"5\">Tad <code>but<\/code> atgriež jaunu objektu ar šo lomu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Lomu saņēma tikai <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Klase <code>Greeter<\/code> un visi pārējie <code>Greeter<\/code> objekti paliek tādi paši.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>$quiet<\/code> joprojām sveicina parastā veidā.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz lomai un klasei ir metodes ar vienādu nosaukumu.<\/span> <span class=\"sg\" data-s=\"4\">Tad uzvar lomas versija.<\/span> <span class=\"sg\" data-s=\"5\">Un <code>callsame<\/code> izsauc otru metodi, ko loma pārraksta.<\/span> <span class=\"sg\" data-s=\"6\">Šeit tā ir sākotnējā <code>greet<\/code> no <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tad tās rezultātu pārvērš lielajos burtos.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Objekts var šādi saņemt lomu.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas skaitās tāds, kas dara šo lomu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> nemaina sākotnējo objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tas dod jums jaunu objektu.<\/span> <span class=\"sg\" data-s=\"2\">Varbūt jūs gribat mainīt pašu objektu.<\/span> <span class=\"sg\" data-s=\"3\">Tad tā vietā lietojiet operatoru <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat iemaisīt lomas atsevišķos objektos.<\/span> <span class=\"sg\" data-s=\"1\">Tā jūs katram objektam izlemjat, kādu papildu uzvedību tas saņem.<\/span> <span class=\"sg\" data-s=\"2\">Jums nevajag atsevišķu klasi katrai kombinācijai.<\/span><\/p>"]]},"ru":{"t":"Добавление роли объекту","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Роль не обязательно встраивать в класс.<\/span> <span class=\"sg\" data-s=\"1\">Роль можно дать и объекту, который уже есть.<\/span> <span class=\"sg\" data-s=\"2\">Для этого используйте оператор <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он подмешивает роль в один-единственный объект.<\/span> <span class=\"sg\" data-s=\"4\">Это происходит, пока программа работает.<\/span> <span class=\"sg\" data-s=\"5\">Потом <code>but<\/code> возвращает новый объект с этой ролью:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Роль получил только <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Класс <code>Greeter<\/code> и все другие объекты <code>Greeter<\/code> не меняются.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$quiet<\/code> всё так же здоровается обычным образом.<\/span> <span class=\"sg\" data-s=\"3\">Иногда у роли и у класса есть методы с одним именем.<\/span> <span class=\"sg\" data-s=\"4\">Тогда побеждает версия из роли.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> вызывает другой метод, который роль переопределяет.<\/span> <span class=\"sg\" data-s=\"6\">Здесь это исходный <code>greet<\/code> из <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Потом все буквы его результата становятся большими.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Объект может получить роль таким способом.<\/span> <span class=\"sg\" data-s=\"1\">Тогда считается, что он выполняет эту роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> не меняет исходный объект.<\/span> <span class=\"sg\" data-s=\"1\">Он даёт вам новый объект.<\/span> <span class=\"sg\" data-s=\"2\">Может быть, вы хотите изменить сам объект.<\/span> <span class=\"sg\" data-s=\"3\">Тогда используйте вместо него оператор <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Роли можно подмешивать в отдельные объекты.<\/span> <span class=\"sg\" data-s=\"1\">Так вы решаете для каждого объекта, какое ещё поведение он получит.<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужен отдельный класс для каждого сочетания.<\/span><\/p>"]]},"uk":{"t":"Додавання ролі до об'єкта","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Роль не обов'язково вбудовувати в клас.<\/span> <span class=\"sg\" data-s=\"1\">Роль можна дати й об'єкту, який уже існує.<\/span> <span class=\"sg\" data-s=\"2\">Для цього використайте оператор <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він підмішує роль лише в один об'єкт.<\/span> <span class=\"sg\" data-s=\"4\">Це стається, поки програма працює.<\/span> <span class=\"sg\" data-s=\"5\">Потім <code>but<\/code> повертає новий об'єкт із цією роллю:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Роль отримав лише <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Клас <code>Greeter<\/code> і всі інші об'єкти <code>Greeter<\/code> лишаються такими самими.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>$quiet<\/code> і далі вітається звичайно.<\/span> <span class=\"sg\" data-s=\"3\">Іноді роль і клас мають методи з однаковим іменем.<\/span> <span class=\"sg\" data-s=\"4\">Тоді перемагає версія з ролі.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> викликає інший метод, який роль перевизначає.<\/span> <span class=\"sg\" data-s=\"6\">Тут це початковий <code>greet<\/code> із <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Потім його результат переводять у великі літери.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Об'єкт може отримати роль у такий спосіб.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вважається, що він виконує цю роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> не змінює початковий об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Він дає вам новий об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Можливо, ви хочете змінити сам об'єкт.<\/span> <span class=\"sg\" data-s=\"3\">Тоді використайте замість нього оператор <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ролі можна підмішувати в окремі об'єкти.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви вирішуєте для кожного об'єкта, яку додаткову поведінку він отримує.<\/span> <span class=\"sg\" data-s=\"2\">Вам не потрібен окремий клас для кожного поєднання.<\/span><\/p>"]]},"bg":{"t":"Добавяне на роля към обект","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Не е нужно да вграждате ролята в клас.<\/span> <span class=\"sg\" data-s=\"1\">Можете да дадете роля и на обект, който вече съществува.<\/span> <span class=\"sg\" data-s=\"2\">За това използвайте оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той вмесва ролята в един-единствен обект.<\/span> <span class=\"sg\" data-s=\"4\">Това става, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"5\">После <code>but<\/code> връща нов обект с ролята:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Само <code>$loud<\/code> получи ролята.<\/span> <span class=\"sg\" data-s=\"1\">Класът <code>Greeter<\/code> и всички други обекти <code>Greeter<\/code> остават същите.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>$quiet<\/code> още поздравява по обичайния начин.<\/span> <span class=\"sg\" data-s=\"3\">Понякога ролята и класът имат методи с едно и също име.<\/span> <span class=\"sg\" data-s=\"4\">Тогава версията от ролята печели.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> извиква другия метод, който ролята предефинира.<\/span> <span class=\"sg\" data-s=\"6\">Тук това е първоначалният <code>greet<\/code> от <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">После неговият резултат се променя на главни букви.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обектът може да получи роля по този начин.<\/span> <span class=\"sg\" data-s=\"1\">Тогава се смята, че той изпълнява тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> не променя първоначалния обект.<\/span> <span class=\"sg\" data-s=\"1\">Той ви дава нов обект.<\/span> <span class=\"sg\" data-s=\"2\">Може би искате да промените самия обект.<\/span> <span class=\"sg\" data-s=\"3\">Тогава използвайте вместо това оператора <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да вмесвате роли в отделни обекти.<\/span> <span class=\"sg\" data-s=\"1\">Така решавате за всеки обект какво допълнително поведение получава.<\/span> <span class=\"sg\" data-s=\"2\">Не ви трябва отделен клас за всяка комбинация.<\/span><\/p>"]]},"eo":{"t":"Aldoni rolon al objekto","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Vi ne devas enkonstrui rolon en klason.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas doni rolon al objekto, kiu jam ekzistas.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, uzu la operatoron <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi enmiksas la rolon en unu solan objekton.<\/span> <span class=\"sg\" data-s=\"4\">Tio okazas dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"5\">Poste <code>but<\/code> redonas novan objekton kun la rolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Nur <code>$loud<\/code> ricevis la rolon.<\/span> <span class=\"sg\" data-s=\"1\">La klaso <code>Greeter<\/code> kaj ĉiuj aliaj objektoj <code>Greeter<\/code> restas la samaj.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$quiet<\/code> ankoraŭ salutas laŭ la normala maniero.<\/span> <span class=\"sg\" data-s=\"3\">Foje la rolo kaj la klaso havas metodojn kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la versio el la rolo venkas.<\/span> <span class=\"sg\" data-s=\"5\">Kaj <code>callsame<\/code> vokas la alian metodon, kiun la rolo superregas.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tie, ĝi estas la originala <code>greet<\/code> el <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Poste ĝia rezulto ŝanĝiĝas al majuskloj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Objekto povas ricevi rolon tiel.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi validas kiel objekto kun ĉi tiu rolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> ne ŝanĝas la originalan objekton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi donas al vi novan objekton.<\/span> <span class=\"sg\" data-s=\"2\">Eble vi volas ŝanĝi la objekton mem.<\/span> <span class=\"sg\" data-s=\"3\">Tiam uzu anstataŭe la operatoron <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas enmiksi rolojn en unuopajn objektojn.<\/span> <span class=\"sg\" data-s=\"1\">Do vi decidas por ĉiu objekto, kian kroman konduton ĝi ricevas.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas apartan klason por ĉiu kombinaĵo.<\/span><\/p>"]]},"la":{"t":"Partem obiecto addere","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Non necesse est partem in classem aedificare.<\/span> <span class=\"sg\" data-s=\"1\">Partem etiam obiecto dare potes quod iam exsistit.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc, operatore <code>but<\/code> utere.<\/span> <span class=\"sg\" data-s=\"3\">Partem in unum solum obiectum miscet.<\/span> <span class=\"sg\" data-s=\"4\">Hoc fit dum programma currit.<\/span> <span class=\"sg\" data-s=\"5\">Tum <code>but<\/code> novum obiectum cum parte reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solum <code>$loud<\/code> partem accepit.<\/span> <span class=\"sg\" data-s=\"1\">Classis <code>Greeter<\/code> et omnia alia obiecta <code>Greeter<\/code> eadem manent.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>$quiet<\/code> adhuc modo solito salutat.<\/span> <span class=\"sg\" data-s=\"3\">Interdum pars et classis methodos eiusdem nominis habent.<\/span> <span class=\"sg\" data-s=\"4\">Tum versio partis vincit.<\/span> <span class=\"sg\" data-s=\"5\">Et <code>callsame<\/code> alteram methodum vocat, quam pars superscribit.<\/span> <span class=\"sg\" data-s=\"6\">Hic est originalis <code>greet<\/code> ex <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Deinde effectus eius in litteras maiusculas mutatur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Obiectum partem hoc modo accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum Raku scit id hanc partem facere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> obiectum originale non mutat.<\/span> <span class=\"sg\" data-s=\"1\">Novum obiectum tibi dat.<\/span> <span class=\"sg\" data-s=\"2\">Fortasse ipsum obiectum mutare vis.<\/span> <span class=\"sg\" data-s=\"3\">Tum operatore <code>does<\/code> loco eius utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Partes in singula obiecta miscere potes.<\/span> <span class=\"sg\" data-s=\"1\">Itaque pro quoque obiecto decernis quam agendi rationem additam accipiat.<\/span> <span class=\"sg\" data-s=\"2\">Classe separata pro omni coniunctione non eges.<\/span><\/p>"]]}}}</script>
