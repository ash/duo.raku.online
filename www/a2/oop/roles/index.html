<script type="application/json" id="page-data">{"u":"oop/roles","n":828,"k":"section","pv":"oop/inheritance/exercises/inherited-attribute/solution","nx":"oop/roles/multiple-roles","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Roles","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A <em>role<\/em> is a set of methods.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes it also has data.<\/span> <span class=\"sg\" data-s=\"2\">Several classes can share one role.<\/span> <span class=\"sg\" data-s=\"3\">Inheritance says that a class <em>is a<\/em> kind of another class.<\/span> <span class=\"sg\" data-s=\"4\">A role is different.<\/span> <span class=\"sg\" data-s=\"5\">It describes something that a class <em>can do<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You make a role with the keyword <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It looks much like a class.<\/span> <span class=\"sg\" data-s=\"2\">To give a role to a class, use the trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Now the class <code>Person<\/code> has the method <code>hello<\/code> from the role.<\/span> <span class=\"sg\" data-s=\"1\">It works just like a method in the class itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A class can do a role.<\/span> <span class=\"sg\" data-s=\"1\">Then Raku knows that the class has this role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Look at the method <code>hello<\/code> in the role.<\/span> <span class=\"sg\" data-s=\"1\">It uses <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But the role itself has no attribute <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This is not a problem.<\/span> <span class=\"sg\" data-s=\"4\">The method runs as part of the class that composes the role.<\/span> <span class=\"sg\" data-s=\"5\">To compose a role means to take it into the class.<\/span> <span class=\"sg\" data-s=\"6\">And that class has the attribute <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">The next topic shows more.<\/span> <span class=\"sg\" data-s=\"8\">A class can have more than one role at a time.<\/span><\/p>"]]},"de":{"t":"Rollen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Rolle<\/em> ist eine Gruppe von Methoden.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal hat sie auch Daten.<\/span> <span class=\"sg\" data-s=\"2\">Mehrere Klassen können eine Rolle teilen.<\/span> <span class=\"sg\" data-s=\"3\">Vererbung sagt: Eine Klasse <em>ist eine<\/em> Art einer anderen Klasse.<\/span> <span class=\"sg\" data-s=\"4\">Eine Rolle ist anders.<\/span> <span class=\"sg\" data-s=\"5\">Sie beschreibt etwas, das eine Klasse <em>kann<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Rolle erstellen Sie mit dem Schlüsselwort <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie sieht ganz ähnlich aus wie eine Klasse.<\/span> <span class=\"sg\" data-s=\"2\">Einer Klasse geben Sie eine Rolle mit dem Trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt hat die Klasse <code>Person<\/code> die Methode <code>hello<\/code> aus der Rolle.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktioniert genau wie eine Methode in der Klasse selbst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Klasse kann eine Rolle erfüllen.<\/span> <span class=\"sg\" data-s=\"1\">Dann weiß Raku, dass die Klasse diese Rolle hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich die Methode <code>hello<\/code> in der Rolle an.<\/span> <span class=\"sg\" data-s=\"1\">Sie benutzt <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber die Rolle selbst hat kein Attribut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Das ist kein Problem.<\/span> <span class=\"sg\" data-s=\"4\">Die Methode läuft als Teil der Klasse, die die Rolle einbindet.<\/span> <span class=\"sg\" data-s=\"5\">Eine Rolle einbinden heißt, sie in die Klasse aufnehmen.<\/span> <span class=\"sg\" data-s=\"6\">Und diese Klasse hat das Attribut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Das nächste Thema zeigt noch mehr.<\/span> <span class=\"sg\" data-s=\"8\">Eine Klasse kann mehr als eine Rolle zugleich haben.<\/span><\/p>"]]},"nl":{"t":"Rollen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>rol<\/em> is een groep methoden.<\/span> <span class=\"sg\" data-s=\"1\">Soms heeft hij ook gegevens.<\/span> <span class=\"sg\" data-s=\"2\">Meerdere klassen kunnen één rol delen.<\/span> <span class=\"sg\" data-s=\"3\">Overerving zegt dat een klasse een soort van een andere klasse <em>is<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Een rol is anders.<\/span> <span class=\"sg\" data-s=\"5\">Hij beschrijft iets wat een klasse <em>kan doen<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je maakt een rol met het sleutelwoord <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij lijkt veel op een klasse.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik de trait <code>does<\/code> om een rol aan een klasse te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nu heeft de klasse <code>Person<\/code> de methode <code>hello<\/code> uit de rol.<\/span> <span class=\"sg\" data-s=\"1\">Ze werkt net als een methode in de klasse zelf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een klasse kan een rol doen.<\/span> <span class=\"sg\" data-s=\"1\">Dan weet Raku dat de klasse deze rol heeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Kijk naar de methode <code>hello<\/code> in de rol.<\/span> <span class=\"sg\" data-s=\"1\">Ze gebruikt <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar de rol zelf heeft geen attribuut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dat is geen probleem.<\/span> <span class=\"sg\" data-s=\"4\">De methode draait als deel van de klasse die de rol samenstelt.<\/span> <span class=\"sg\" data-s=\"5\">Een rol samenstellen betekent: hem in de klasse opnemen.<\/span> <span class=\"sg\" data-s=\"6\">En die klasse heeft het attribuut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Het volgende onderwerp laat meer zien.<\/span> <span class=\"sg\" data-s=\"8\">Een klasse kan meer dan één rol tegelijk hebben.<\/span><\/p>"]]},"es":{"t":"Roles","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>rol<\/em> es un conjunto de métodos.<\/span> <span class=\"sg\" data-s=\"1\">A veces también tiene datos.<\/span> <span class=\"sg\" data-s=\"2\">Varias clases pueden compartir un rol.<\/span> <span class=\"sg\" data-s=\"3\">La herencia dice que una clase <em>es<\/em> una clase de otra clase.<\/span> <span class=\"sg\" data-s=\"4\">Un rol es distinto.<\/span> <span class=\"sg\" data-s=\"5\">Describe algo que una clase <em>sabe hacer<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Creas un rol con la palabra clave <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se parece mucho a una clase.<\/span> <span class=\"sg\" data-s=\"2\">Para dar un rol a una clase, usa el rasgo <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora la clase <code>Person<\/code> tiene el método <code>hello<\/code> del rol.<\/span> <span class=\"sg\" data-s=\"1\">Funciona igual que un método de la propia clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una clase puede asumir un rol.<\/span> <span class=\"sg\" data-s=\"1\">Entonces Raku sabe que la clase tiene este rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Mira el método <code>hello<\/code> del rol.<\/span> <span class=\"sg\" data-s=\"1\">Usa <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero el rol mismo no tiene ningún atributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Esto no es un problema.<\/span> <span class=\"sg\" data-s=\"4\">El método se ejecuta como parte de la clase que compone el rol.<\/span> <span class=\"sg\" data-s=\"5\">Componer un rol significa meterlo en la clase.<\/span> <span class=\"sg\" data-s=\"6\">Y esa clase tiene el atributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">El tema siguiente muestra algo más.<\/span> <span class=\"sg\" data-s=\"8\">Una clase puede tener más de un rol a la vez.<\/span><\/p>"]]},"it":{"t":"Ruoli","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>ruolo<\/em> è un insieme di metodi.<\/span> <span class=\"sg\" data-s=\"1\">A volte ha anche dei dati.<\/span> <span class=\"sg\" data-s=\"2\">Più classi possono condividere un ruolo.<\/span> <span class=\"sg\" data-s=\"3\">L'ereditarietà dice che una classe <em>è<\/em> un tipo di un'altra classe.<\/span> <span class=\"sg\" data-s=\"4\">Un ruolo è diverso.<\/span> <span class=\"sg\" data-s=\"5\">Descrive qualcosa che una classe <em>sa fare<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Crei un ruolo con la parola chiave <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Somiglia molto a una classe.<\/span> <span class=\"sg\" data-s=\"2\">Per dare un ruolo a una classe, usa il tratto <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora la classe <code>Person<\/code> ha il metodo <code>hello<\/code> del ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Funziona proprio come un metodo nella classe stessa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una classe può assumere un ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Allora Raku sa che la classe ha questo ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Guarda il metodo <code>hello<\/code> nel ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Usa <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma il ruolo stesso non ha un attributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo non è un problema.<\/span> <span class=\"sg\" data-s=\"4\">Il metodo gira come parte della classe che compone il ruolo.<\/span> <span class=\"sg\" data-s=\"5\">Comporre un ruolo vuol dire prenderlo dentro la classe.<\/span> <span class=\"sg\" data-s=\"6\">E quella classe ha l'attributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Il prossimo argomento mostra di più.<\/span> <span class=\"sg\" data-s=\"8\">Una classe può avere più di un ruolo alla volta.<\/span><\/p>"]]},"lv":{"t":"Lomas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Loma<\/em> ir metožu kopa.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz tajā ir arī dati.<\/span> <span class=\"sg\" data-s=\"2\">Vairākas klases var kopīgi lietot vienu lomu.<\/span> <span class=\"sg\" data-s=\"3\">Mantošana saka, ka klase <em>ir<\/em> citas klases veids.<\/span> <span class=\"sg\" data-s=\"4\">Loma ir citāda.<\/span> <span class=\"sg\" data-s=\"5\">Tā apraksta kaut ko, ko klase <em>prot darīt<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lomu jūs izveidojat ar atslēgvārdu <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā izskatās gandrīz kā klase.<\/span> <span class=\"sg\" data-s=\"2\">Lai dotu lomu klasei, lietojiet iezīmi <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad klasei <code>Person<\/code> ir metode <code>hello<\/code> no lomas.<\/span> <span class=\"sg\" data-s=\"1\">Tā strādā tāpat kā metode pašā klasē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klase var darīt lomu.<\/span> <span class=\"sg\" data-s=\"1\">Tad Raku zina, ka klasei ir šī loma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Apskatiet metodi <code>hello<\/code> lomā.<\/span> <span class=\"sg\" data-s=\"1\">Tā lieto <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet pašai lomai nav atribūta <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā nav problēma.<\/span> <span class=\"sg\" data-s=\"4\">Metode izpildās kā daļa no klases, kas komponē lomu.<\/span> <span class=\"sg\" data-s=\"5\">Komponēt lomu nozīmē ņemt to klasē iekšā.<\/span> <span class=\"sg\" data-s=\"6\">Un šai klasei ir atribūts <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Nākamais temats parāda vairāk.<\/span> <span class=\"sg\" data-s=\"8\">Klasei var būt vairāk nekā viena loma reizē.<\/span><\/p>"]]},"ru":{"t":"Роли","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — это набор методов.<\/span> <span class=\"sg\" data-s=\"1\">Иногда в ней есть и данные.<\/span> <span class=\"sg\" data-s=\"2\">Несколько классов могут делить одну роль.<\/span> <span class=\"sg\" data-s=\"3\">Наследование говорит, что класс <em>является<\/em> видом другого класса.<\/span> <span class=\"sg\" data-s=\"4\">Роль устроена иначе.<\/span> <span class=\"sg\" data-s=\"5\">Она описывает то, что класс <em>умеет делать<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы создаёте роль ключевым словом <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она очень похожа на класс.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы дать роль классу, используйте трейт <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь у класса <code>Person<\/code> есть метод <code>hello<\/code> из роли.<\/span> <span class=\"sg\" data-s=\"1\">Он работает так же, как метод в самом классе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Класс может выполнять роль.<\/span> <span class=\"sg\" data-s=\"1\">Тогда Raku знает, что у класса есть эта роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на метод <code>hello<\/code> в роли.<\/span> <span class=\"sg\" data-s=\"1\">Он использует <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но у самой роли нет атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это не проблема.<\/span> <span class=\"sg\" data-s=\"4\">Метод работает как часть класса, который включает роль.<\/span> <span class=\"sg\" data-s=\"5\">Включить роль значит взять её в класс.<\/span> <span class=\"sg\" data-s=\"6\">А у этого класса есть атрибут <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Следующая тема показывает больше.<\/span> <span class=\"sg\" data-s=\"8\">У класса может быть больше одной роли сразу.<\/span><\/p>"]]},"uk":{"t":"Ролі","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — це набір методів.<\/span> <span class=\"sg\" data-s=\"1\">Іноді вона має й дані.<\/span> <span class=\"sg\" data-s=\"2\">Кілька класів можуть мати спільну роль.<\/span> <span class=\"sg\" data-s=\"3\">Успадкування каже, що клас <em>є<\/em> різновидом іншого класу.<\/span> <span class=\"sg\" data-s=\"4\">З роллю все інакше.<\/span> <span class=\"sg\" data-s=\"5\">Вона описує те, що клас <em>уміє робити<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Роль створюють ключовим словом <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона дуже схожа на клас.<\/span> <span class=\"sg\" data-s=\"2\">Щоб дати роль класу, використайте трейт <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер клас <code>Person<\/code> має метод <code>hello<\/code> з ролі.<\/span> <span class=\"sg\" data-s=\"1\">Він працює так само, як метод у самому класі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Клас може виконувати роль.<\/span> <span class=\"sg\" data-s=\"1\">Тоді Raku знає, що клас має цю роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Подивіться на метод <code>hello<\/code> у ролі.<\/span> <span class=\"sg\" data-s=\"1\">Він використовує <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але сама роль не має атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це не проблема.<\/span> <span class=\"sg\" data-s=\"4\">Метод виконується як частина класу, який компонує роль.<\/span> <span class=\"sg\" data-s=\"5\">Компонувати роль означає взяти її в клас.<\/span> <span class=\"sg\" data-s=\"6\">А цей клас має атрибут <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Наступна тема показує більше.<\/span> <span class=\"sg\" data-s=\"8\">Клас може мати більш ніж одну роль одночасно.<\/span><\/p>"]]},"bg":{"t":"Роли","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Ролята<\/em> е набор от методи.<\/span> <span class=\"sg\" data-s=\"1\">Понякога тя има и данни.<\/span> <span class=\"sg\" data-s=\"2\">Няколко класа могат да споделят една роля.<\/span> <span class=\"sg\" data-s=\"3\">Наследяването казва, че един клас <em>е<\/em> вид друг клас.<\/span> <span class=\"sg\" data-s=\"4\">Ролята е нещо друго.<\/span> <span class=\"sg\" data-s=\"5\">Тя описва нещо, което класът <em>може да прави<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Създавате роля с ключовата дума <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя прилича много на клас.<\/span> <span class=\"sg\" data-s=\"2\">За да дадете роля на клас, използвайте трейта <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега класът <code>Person<\/code> има метода <code>hello<\/code> от ролята.<\/span> <span class=\"sg\" data-s=\"1\">Той работи точно като метод в самия клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Класът може да изпълнява роля.<\/span> <span class=\"sg\" data-s=\"1\">Тогава Raku знае, че класът има тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Вижте метода <code>hello<\/code> в ролята.<\/span> <span class=\"sg\" data-s=\"1\">Той използва <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но самата роля няма атрибут <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това не е проблем.<\/span> <span class=\"sg\" data-s=\"4\">Методът се изпълнява като част от класа, който компонира ролята.<\/span> <span class=\"sg\" data-s=\"5\">Да компонирате роля значи да я вземете в класа.<\/span> <span class=\"sg\" data-s=\"6\">А този клас има атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Следващата тема показва още нещо.<\/span> <span class=\"sg\" data-s=\"8\">Класът може да има повече от една роля наведнъж.<\/span><\/p>"]]},"eo":{"t":"Roloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Rolo<\/em> estas aro de metodoj.<\/span> <span class=\"sg\" data-s=\"1\">Foje ĝi ankaŭ havas datumojn.<\/span> <span class=\"sg\" data-s=\"2\">Pluraj klasoj povas kunhavi unu rolon.<\/span> <span class=\"sg\" data-s=\"3\">Heredo diras, ke klaso <em>estas<\/em> speco de alia klaso.<\/span> <span class=\"sg\" data-s=\"4\">Rolo estas malsama.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi priskribas ion, kion klaso <em>povas fari<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi faras rolon per la ŝlosilvorto <code>role<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aspektas tre simile al klaso.<\/span> <span class=\"sg\" data-s=\"2\">Por doni rolon al klaso, uzu la trajton <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun la klaso <code>Person<\/code> havas la metodon <code>hello<\/code> el la rolo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi funkcias same kiel metodo en la klaso mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klaso povas fari rolon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam Raku scias, ke la klaso havas ĉi tiun rolon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Rigardu la metodon <code>hello<\/code> en la rolo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi uzas <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed la rolo mem ne havas atributon <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tio ne estas problemo.<\/span> <span class=\"sg\" data-s=\"4\">La metodo ruliĝas kiel parto de la klaso, kiu kunmetas la rolon.<\/span> <span class=\"sg\" data-s=\"5\">Kunmeti rolon signifas preni ĝin en la klason.<\/span> <span class=\"sg\" data-s=\"6\">Kaj tiu klaso havas la atributon <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">La sekva temo montras pli.<\/span> <span class=\"sg\" data-s=\"8\">Klaso povas havi pli ol unu rolon samtempe.<\/span><\/p>"]]},"la":{"t":"Partes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Pars<\/em> (<em>role<\/em>) est collectio methodorum.<\/span> <span class=\"sg\" data-s=\"1\">Interdum etiam data habet.<\/span> <span class=\"sg\" data-s=\"2\">Plures classes unam partem communicare possunt.<\/span> <span class=\"sg\" data-s=\"3\">Hereditas dicit classem genus alterius classis <em>esse<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Pars alia res est.<\/span> <span class=\"sg\" data-s=\"5\">Describit aliquid quod classis <em>facere potest<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Partem verbo <code>role<\/code> facis.<\/span> <span class=\"sg\" data-s=\"1\">Classi valde similis videtur.<\/span> <span class=\"sg\" data-s=\"2\">Ut partem classi des, proprietate <code>does<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc classis <code>Person<\/code> methodum <code>hello<\/code> ex parte habet.<\/span> <span class=\"sg\" data-s=\"1\">Operatur sicut methodus in ipsa classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Classis partem facere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum Raku scit classem hanc partem habere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Specta methodum <code>hello<\/code> in parte.<\/span> <span class=\"sg\" data-s=\"1\"><code>self.name<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Sed ipsa pars nullum attributum <code>name<\/code> habet.<\/span> <span class=\"sg\" data-s=\"3\">Hoc non est problema.<\/span> <span class=\"sg\" data-s=\"4\">Methodus ut portio classis currit quae partem componit.<\/span> <span class=\"sg\" data-s=\"5\">Partem componere significat: eam in classem accipere.<\/span> <span class=\"sg\" data-s=\"6\">Et illa classis attributum <code>name<\/code> habet.<\/span> <span class=\"sg\" data-s=\"7\">Argumentum sequens plus ostendit.<\/span> <span class=\"sg\" data-s=\"8\">Classis plus quam unam partem simul habere potest.<\/span><\/p>"]]}}}</script>
