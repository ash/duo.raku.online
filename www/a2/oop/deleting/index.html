<script type="application/json" id="page-data">{"u":"oop/deleting","n":889,"k":"section","pv":"oop/directories/exercises/file-or-directory/solution","nx":"oop/deleting/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Deleting files and directories","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> and <code>mkdir<\/code> create things on the disk.<\/span> <span class=\"sg\" data-s=\"1\">Two other routines remove things from the disk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>unlink<\/code> routine deletes a file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> deletes the file with the given name.<\/span> <span class=\"sg\" data-s=\"1\">Like other file-system routines, <code>unlink<\/code> is also a method.<\/span> <span class=\"sg\" data-s=\"2\">You call it on a path object: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Deleting happens at once, and it is forever.<\/span> <span class=\"sg\" data-s=\"1\">There is no trash bin.<\/span> <span class=\"sg\" data-s=\"2\">You cannot get the file back.<\/span> <span class=\"sg\" data-s=\"3\">Note one more thing.<\/span> <span class=\"sg\" data-s=\"4\">After you delete a file, check it with <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">This method checks if the path exists.<\/span> <span class=\"sg\" data-s=\"6\">Do not use <code>.f<\/code> here.<\/span> <span class=\"sg\" data-s=\"7\">The tests <code>.f<\/code> and <code>.d<\/code> check the type of the path.<\/span> <span class=\"sg\" data-s=\"8\">They throw an error when the path is not there.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>rmdir<\/code> routine removes a directory.<\/span> <span class=\"sg\" data-s=\"1\">But the directory must be <strong>empty<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">If the directory is not empty, <code>rmdir<\/code> removes nothing.<\/span> <span class=\"sg\" data-s=\"1\">The directory stays in its place.<\/span> <span class=\"sg\" data-s=\"2\">So you delete a directory with files in two steps.<\/span> <span class=\"sg\" data-s=\"3\">First, you make it empty.<\/span> <span class=\"sg\" data-s=\"4\">Then you remove it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> gives a list of the entries in the directory.<\/span> <span class=\"sg\" data-s=\"1\">You saw it in the previous topic.<\/span> <span class=\"sg\" data-s=\"2\">The program calls <code>.unlink<\/code> on each entry.<\/span> <span class=\"sg\" data-s=\"3\">This removes them all.<\/span> <span class=\"sg\" data-s=\"4\">Now the directory is empty.<\/span> <span class=\"sg\" data-s=\"5\">So <code>rmdir<\/code> can remove it.<\/span> <span class=\"sg\" data-s=\"6\">This simple loop expects only files in the directory.<\/span> <span class=\"sg\" data-s=\"7\">But a directory can also have other directories in it.<\/span> <span class=\"sg\" data-s=\"8\">Then you must empty each inner directory first.<\/span> <span class=\"sg\" data-s=\"9\">You do it in the same way.<\/span><\/p>"]]},"de":{"t":"Dateien und Verzeichnisse löschen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> und <code>mkdir<\/code> legen Dinge auf der Festplatte an.<\/span> <span class=\"sg\" data-s=\"1\">Zwei andere Routinen entfernen Dinge von der Festplatte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>unlink<\/code> löscht eine Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> löscht die Datei mit dem genannten Namen.<\/span> <span class=\"sg\" data-s=\"1\">Wie andere Dateisystemroutinen ist <code>unlink<\/code> auch eine Methode.<\/span> <span class=\"sg\" data-s=\"2\">Sie rufen sie auf einem Pfadobjekt auf: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Das Löschen passiert sofort und gilt für immer.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt keinen Papierkorb.<\/span> <span class=\"sg\" data-s=\"2\">Sie bekommen die Datei nicht zurück.<\/span> <span class=\"sg\" data-s=\"3\">Beachten Sie noch etwas.<\/span> <span class=\"sg\" data-s=\"4\">Nach dem Löschen prüfen Sie die Datei mit <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Diese Methode prüft, ob der Pfad existiert.<\/span> <span class=\"sg\" data-s=\"6\">Nehmen Sie hier nicht <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Die Prüfungen <code>.f<\/code> und <code>.d<\/code> prüfen den Typ des Pfads.<\/span> <span class=\"sg\" data-s=\"8\">Diese Prüfungen werfen einen Fehler, wenn der Pfad nicht da ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>rmdir<\/code> entfernt ein Verzeichnis.<\/span> <span class=\"sg\" data-s=\"1\">Aber das Verzeichnis muss <strong>leer<\/strong> sein:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn das Verzeichnis nicht leer ist, entfernt <code>rmdir<\/code> nichts.<\/span> <span class=\"sg\" data-s=\"1\">Das Verzeichnis bleibt an seinem Platz.<\/span> <span class=\"sg\" data-s=\"2\">Ein Verzeichnis mit Dateien löschen Sie also in zwei Schritten.<\/span> <span class=\"sg\" data-s=\"3\">Zuerst machen Sie es leer.<\/span> <span class=\"sg\" data-s=\"4\">Dann entfernen Sie es:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> gibt eine Liste der Einträge im Verzeichnis.<\/span> <span class=\"sg\" data-s=\"1\">Sie haben das im vorigen Thema gesehen.<\/span> <span class=\"sg\" data-s=\"2\">Das Programm ruft für jeden Eintrag <code>.unlink<\/code> auf.<\/span> <span class=\"sg\" data-s=\"3\">Das entfernt alle Einträge.<\/span> <span class=\"sg\" data-s=\"4\">Jetzt ist das Verzeichnis leer.<\/span> <span class=\"sg\" data-s=\"5\">Also kann <code>rmdir<\/code> das Verzeichnis entfernen.<\/span> <span class=\"sg\" data-s=\"6\">Diese einfache Schleife erwartet nur Dateien im Verzeichnis.<\/span> <span class=\"sg\" data-s=\"7\">Aber ein Verzeichnis kann auch andere Verzeichnisse enthalten.<\/span> <span class=\"sg\" data-s=\"8\">Dann müssen Sie zuerst jedes innere Verzeichnis leeren.<\/span> <span class=\"sg\" data-s=\"9\">Das geht auf die gleiche Weise.<\/span><\/p>"]]},"nl":{"t":"Bestanden en mappen verwijderen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> en <code>mkdir<\/code> maken dingen aan op de schijf.<\/span> <span class=\"sg\" data-s=\"1\">Twee andere routines halen dingen van de schijf weg.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>unlink<\/code> verwijdert een bestand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> verwijdert het bestand met de gegeven naam.<\/span> <span class=\"sg\" data-s=\"1\">Net als andere routines voor het bestandssysteem is <code>unlink<\/code> ook een methode.<\/span> <span class=\"sg\" data-s=\"2\">Je roept hem aan op een padobject: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Verwijderen gebeurt meteen, en het is voor altijd.<\/span> <span class=\"sg\" data-s=\"1\">Er is geen prullenbak.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt het bestand niet terug.<\/span> <span class=\"sg\" data-s=\"3\">Let nog op één ding.<\/span> <span class=\"sg\" data-s=\"4\">Na het verwijderen controleer je het bestand met <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Deze methode controleert of het pad bestaat.<\/span> <span class=\"sg\" data-s=\"6\">Gebruik hier geen <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">De tests <code>.f<\/code> en <code>.d<\/code> controleren het type van het pad.<\/span> <span class=\"sg\" data-s=\"8\">Ze geven een fout als het pad er niet is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>rmdir<\/code> verwijdert een map.<\/span> <span class=\"sg\" data-s=\"1\">Maar de map moet <strong>leeg<\/strong> zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Als de map niet leeg is, verwijdert <code>rmdir<\/code> niets.<\/span> <span class=\"sg\" data-s=\"1\">De map blijft op haar plaats.<\/span> <span class=\"sg\" data-s=\"2\">Een map met bestanden verwijder je dus in twee stappen.<\/span> <span class=\"sg\" data-s=\"3\">Eerst maak je haar leeg.<\/span> <span class=\"sg\" data-s=\"4\">Daarna verwijder je haar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> geeft een lijst van de items in de map.<\/span> <span class=\"sg\" data-s=\"1\">Je zag dat in het vorige onderwerp.<\/span> <span class=\"sg\" data-s=\"2\">Het programma roept <code>.unlink<\/code> aan op elk item.<\/span> <span class=\"sg\" data-s=\"3\">Dat verwijdert ze allemaal.<\/span> <span class=\"sg\" data-s=\"4\">Nu is de map leeg.<\/span> <span class=\"sg\" data-s=\"5\">Dus kan <code>rmdir<\/code> haar verwijderen.<\/span> <span class=\"sg\" data-s=\"6\">Deze eenvoudige lus verwacht alleen bestanden in de map.<\/span> <span class=\"sg\" data-s=\"7\">Maar een map kan ook andere mappen bevatten.<\/span> <span class=\"sg\" data-s=\"8\">Dan moet je eerst elke map daarbinnen leegmaken.<\/span> <span class=\"sg\" data-s=\"9\">Dat doe je op dezelfde manier.<\/span><\/p>"]]},"es":{"t":"Borrar archivos y directorios","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> y <code>mkdir<\/code> crean cosas en el disco.<\/span> <span class=\"sg\" data-s=\"1\">Otras dos rutinas borran cosas del disco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>unlink<\/code> borra un archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> borra el archivo con el nombre que le das.<\/span> <span class=\"sg\" data-s=\"1\">Como otras rutinas del sistema de archivos, <code>unlink<\/code> también es un método.<\/span> <span class=\"sg\" data-s=\"2\">Lo llamas sobre un objeto de ruta: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">El borrado ocurre al momento y es para siempre.<\/span> <span class=\"sg\" data-s=\"1\">No hay papelera.<\/span> <span class=\"sg\" data-s=\"2\">No puedes recuperar el archivo.<\/span> <span class=\"sg\" data-s=\"3\">Fíjate en otra cosa más.<\/span> <span class=\"sg\" data-s=\"4\">Después de borrar un archivo, compruébalo con <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Este método comprueba si la ruta existe.<\/span> <span class=\"sg\" data-s=\"6\">Aquí no uses <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Las comprobaciones <code>.f<\/code> y <code>.d<\/code> miran el tipo de la ruta.<\/span> <span class=\"sg\" data-s=\"8\">Lanzan un error cuando la ruta no está.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>rmdir<\/code> elimina un directorio.<\/span> <span class=\"sg\" data-s=\"1\">Pero el directorio debe estar <strong>vacío<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Si el directorio no está vacío, <code>rmdir<\/code> no elimina nada.<\/span> <span class=\"sg\" data-s=\"1\">El directorio se queda en su sitio.<\/span> <span class=\"sg\" data-s=\"2\">Así que borras un directorio con archivos en dos pasos.<\/span> <span class=\"sg\" data-s=\"3\">Primero, lo vacías.<\/span> <span class=\"sg\" data-s=\"4\">Después, lo eliminas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> da una lista de las entradas del directorio.<\/span> <span class=\"sg\" data-s=\"1\">Lo viste en el tema anterior.<\/span> <span class=\"sg\" data-s=\"2\">El programa llama a <code>.unlink<\/code> sobre cada entrada.<\/span> <span class=\"sg\" data-s=\"3\">Esto las elimina todas.<\/span> <span class=\"sg\" data-s=\"4\">Ahora el directorio está vacío.<\/span> <span class=\"sg\" data-s=\"5\">Así que <code>rmdir<\/code> puede eliminarlo.<\/span> <span class=\"sg\" data-s=\"6\">Este bucle simple espera solo archivos en el directorio.<\/span> <span class=\"sg\" data-s=\"7\">Pero un directorio también puede tener otros directorios dentro.<\/span> <span class=\"sg\" data-s=\"8\">Entonces primero debes vaciar cada directorio interior.<\/span> <span class=\"sg\" data-s=\"9\">Lo haces de la misma manera.<\/span><\/p>"]]},"it":{"t":"Cancellare file e directory","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> e <code>mkdir<\/code> creano cose sul disco.<\/span> <span class=\"sg\" data-s=\"1\">Altre due routine rimuovono cose dal disco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>unlink<\/code> cancella un file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> cancella il file con il nome dato.<\/span> <span class=\"sg\" data-s=\"1\">Come altre routine del file system, <code>unlink<\/code> è anche un metodo.<\/span> <span class=\"sg\" data-s=\"2\">Lo chiami su un oggetto percorso: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La cancellazione avviene subito, ed è per sempre.<\/span> <span class=\"sg\" data-s=\"1\">Non c'è un cestino.<\/span> <span class=\"sg\" data-s=\"2\">Non puoi riavere il file.<\/span> <span class=\"sg\" data-s=\"3\">Nota ancora una cosa.<\/span> <span class=\"sg\" data-s=\"4\">Dopo che cancelli un file, controllalo con <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Questo metodo controlla se il percorso esiste.<\/span> <span class=\"sg\" data-s=\"6\">Qui non usare <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">I test <code>.f<\/code> e <code>.d<\/code> controllano il tipo del percorso.<\/span> <span class=\"sg\" data-s=\"8\">Danno un errore quando il percorso non c'è.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>rmdir<\/code> rimuove una directory.<\/span> <span class=\"sg\" data-s=\"1\">Ma la directory deve essere <strong>vuota<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Se la directory non è vuota, <code>rmdir<\/code> non rimuove niente.<\/span> <span class=\"sg\" data-s=\"1\">La directory resta al suo posto.<\/span> <span class=\"sg\" data-s=\"2\">Quindi cancelli una directory con dei file in due passi.<\/span> <span class=\"sg\" data-s=\"3\">Prima la svuoti.<\/span> <span class=\"sg\" data-s=\"4\">Poi la rimuovi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> dà un elenco delle voci nella directory.<\/span> <span class=\"sg\" data-s=\"1\">L'hai visto nell'argomento precedente.<\/span> <span class=\"sg\" data-s=\"2\">Il programma chiama <code>.unlink<\/code> su ogni voce.<\/span> <span class=\"sg\" data-s=\"3\">Così le rimuove tutte.<\/span> <span class=\"sg\" data-s=\"4\">Ora la directory è vuota.<\/span> <span class=\"sg\" data-s=\"5\">Quindi <code>rmdir<\/code> può rimuoverla.<\/span> <span class=\"sg\" data-s=\"6\">Questo ciclo semplice si aspetta solo file nella directory.<\/span> <span class=\"sg\" data-s=\"7\">Ma una directory può contenere anche altre directory.<\/span> <span class=\"sg\" data-s=\"8\">Allora devi prima svuotare ogni directory interna.<\/span> <span class=\"sg\" data-s=\"9\">Lo fai nello stesso modo.<\/span><\/p>"]]},"lv":{"t":"Failu un direktoriju dzēšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> un <code>mkdir<\/code> rada lietas uz diska.<\/span> <span class=\"sg\" data-s=\"1\">Divas citas rutīnas noņem lietas no diska.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>unlink<\/code> dzēš failu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> izdzēš failu ar doto nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā citas failu sistēmas rutīnas, <code>unlink<\/code> ir arī metode.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to izsaucat uz ceļa objekta: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dzēšana notiek uzreiz, un tā ir uz visiem laikiem.<\/span> <span class=\"sg\" data-s=\"1\">Miskastes nav.<\/span> <span class=\"sg\" data-s=\"2\">Failu nevar dabūt atpakaļ.<\/span> <span class=\"sg\" data-s=\"3\">Ievērojiet vēl vienu lietu.<\/span> <span class=\"sg\" data-s=\"4\">Pēc faila dzēšanas pārbaudiet to ar <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Šī metode pārbauda, vai ceļš eksistē.<\/span> <span class=\"sg\" data-s=\"6\">Šeit nelietojiet <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Pārbaudes <code>.f<\/code> un <code>.d<\/code> pārbauda ceļa tipu.<\/span> <span class=\"sg\" data-s=\"8\">Tās dod kļūdu, ja ceļa nav.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>rmdir<\/code> noņem direktoriju.<\/span> <span class=\"sg\" data-s=\"1\">Bet direktorijai jābūt <strong>tukšai<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ja direktorija nav tukša, <code>rmdir<\/code> neko nenoņem.<\/span> <span class=\"sg\" data-s=\"1\">Direktorija paliek savā vietā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc direktoriju ar failiem jūs dzēšat divos soļos.<\/span> <span class=\"sg\" data-s=\"3\">Vispirms jūs to iztukšojat.<\/span> <span class=\"sg\" data-s=\"4\">Tad jūs to noņemat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> dod direktorijas ierakstu sarakstu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to redzējāt iepriekšējā tematā.<\/span> <span class=\"sg\" data-s=\"2\">Programma izsauc <code>.unlink<\/code> uz katra ieraksta.<\/span> <span class=\"sg\" data-s=\"3\">Tas noņem tos visus.<\/span> <span class=\"sg\" data-s=\"4\">Tagad direktorija ir tukša.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc <code>rmdir<\/code> var to noņemt.<\/span> <span class=\"sg\" data-s=\"6\">Šis vienkāršais cikls sagaida direktorijā tikai failus.<\/span> <span class=\"sg\" data-s=\"7\">Bet direktorijā var būt arī citas direktorijas.<\/span> <span class=\"sg\" data-s=\"8\">Tad jums vispirms jāiztukšo katra iekšējā direktorija.<\/span> <span class=\"sg\" data-s=\"9\">Jūs to darāt tādā pašā veidā.<\/span><\/p>"]]},"ru":{"t":"Удаление файлов и каталогов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> и <code>mkdir<\/code> создают что-то на диске.<\/span> <span class=\"sg\" data-s=\"1\">Две другие процедуры удаляют что-то с диска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>unlink<\/code> удаляет файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> удаляет файл с указанным именем.<\/span> <span class=\"sg\" data-s=\"1\">Как и другие процедуры для файловой системы, <code>unlink<\/code> — это ещё и метод.<\/span> <span class=\"sg\" data-s=\"2\">Вы вызываете его у объекта пути: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Удаление происходит сразу, и это навсегда.<\/span> <span class=\"sg\" data-s=\"1\">Корзины нет.<\/span> <span class=\"sg\" data-s=\"2\">Файл нельзя вернуть.<\/span> <span class=\"sg\" data-s=\"3\">Заметьте ещё одну вещь.<\/span> <span class=\"sg\" data-s=\"4\">После удаления файла проверяйте его через <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Этот метод проверяет, существует ли путь.<\/span> <span class=\"sg\" data-s=\"6\">Не используйте здесь <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Методы <code>.f<\/code> и <code>.d<\/code> проверяют тип пути.<\/span> <span class=\"sg\" data-s=\"8\">Они выдают ошибку, когда пути нет.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>rmdir<\/code> удаляет каталог.<\/span> <span class=\"sg\" data-s=\"1\">Но каталог должен быть <strong>пустым<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Если каталог не пустой, <code>rmdir<\/code> ничего не удаляет.<\/span> <span class=\"sg\" data-s=\"1\">Каталог остаётся на своём месте.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вы удаляете каталог с файлами в два шага.<\/span> <span class=\"sg\" data-s=\"3\">Сначала вы делаете его пустым.<\/span> <span class=\"sg\" data-s=\"4\">Потом вы удаляете его:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # удаляем все записи\nrmdir 'reports';                # теперь каталог пуст\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> даёт список записей в каталоге.<\/span> <span class=\"sg\" data-s=\"1\">Вы видели это в предыдущей теме.<\/span> <span class=\"sg\" data-s=\"2\">Программа вызывает <code>.unlink<\/code> у каждой записи.<\/span> <span class=\"sg\" data-s=\"3\">Это удаляет их все.<\/span> <span class=\"sg\" data-s=\"4\">Теперь каталог пуст.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому <code>rmdir<\/code> может его удалить.<\/span> <span class=\"sg\" data-s=\"6\">Этот простой цикл ожидает в каталоге только файлы.<\/span> <span class=\"sg\" data-s=\"7\">Но в каталоге могут быть и другие каталоги.<\/span> <span class=\"sg\" data-s=\"8\">Тогда сначала нужно очистить каждый внутренний каталог.<\/span> <span class=\"sg\" data-s=\"9\">Вы делаете это тем же способом.<\/span><\/p>"]]},"uk":{"t":"Видалення файлів і каталогів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> і <code>mkdir<\/code> створюють щось на диску.<\/span> <span class=\"sg\" data-s=\"1\">Дві інші підпрограми видаляють це з диска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>unlink<\/code> видаляє файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> видаляє файл із вказаним ім'ям.<\/span> <span class=\"sg\" data-s=\"1\">Як і інші підпрограми файлової системи, <code>unlink<\/code> — це також і метод.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте його для об'єкта шляху: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Видалення відбувається відразу, і це назавжди.<\/span> <span class=\"sg\" data-s=\"1\">Кошика для сміття немає.<\/span> <span class=\"sg\" data-s=\"2\">Ви не можете повернути файл.<\/span> <span class=\"sg\" data-s=\"3\">Зверніть увагу ще на одне.<\/span> <span class=\"sg\" data-s=\"4\">Після видалення файлу перевіряйте його через <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Цей метод перевіряє, чи існує шлях.<\/span> <span class=\"sg\" data-s=\"6\">Не використовуйте тут <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Перевірки <code>.f<\/code> і <code>.d<\/code> перевіряють тип шляху.<\/span> <span class=\"sg\" data-s=\"8\">Вони дають помилку, коли шляху немає.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>rmdir<\/code> видаляє каталог.<\/span> <span class=\"sg\" data-s=\"1\">Але каталог має бути <strong>порожнім<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Якщо каталог не порожній, <code>rmdir<\/code> нічого не видаляє.<\/span> <span class=\"sg\" data-s=\"1\">Каталог лишається на місці.<\/span> <span class=\"sg\" data-s=\"2\">Тож каталог із файлами ви видаляєте у два кроки.<\/span> <span class=\"sg\" data-s=\"3\">Спочатку ви робите його порожнім.<\/span> <span class=\"sg\" data-s=\"4\">Потім ви видаляєте його:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # видалити кожен запис\nrmdir 'reports';                # тепер каталог порожній\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> дає список записів у каталозі.<\/span> <span class=\"sg\" data-s=\"1\">Ви бачили це в попередній темі.<\/span> <span class=\"sg\" data-s=\"2\">Програма викликає <code>.unlink<\/code> для кожного запису.<\/span> <span class=\"sg\" data-s=\"3\">Це видаляє їх усі.<\/span> <span class=\"sg\" data-s=\"4\">Тепер каталог порожній.<\/span> <span class=\"sg\" data-s=\"5\">Тож <code>rmdir<\/code> може його видалити.<\/span> <span class=\"sg\" data-s=\"6\">Цей простий цикл чекає в каталозі тільки файли.<\/span> <span class=\"sg\" data-s=\"7\">Але в каталозі можуть бути й інші каталоги.<\/span> <span class=\"sg\" data-s=\"8\">Тоді спочатку треба спорожнити кожен внутрішній каталог.<\/span> <span class=\"sg\" data-s=\"9\">Ви робите це так само.<\/span><\/p>"]]},"bg":{"t":"Изтриване на файлове и директории","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> и <code>mkdir<\/code> създават неща на диска.<\/span> <span class=\"sg\" data-s=\"1\">Две други процедури премахват неща от диска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>unlink<\/code> изтрива файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> изтрива файла с даденото име.<\/span> <span class=\"sg\" data-s=\"1\">Както другите процедури за файловата система, <code>unlink<\/code> е и метод.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате го върху обект-път: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Изтриването става веднага и е завинаги.<\/span> <span class=\"sg\" data-s=\"1\">Няма кошче.<\/span> <span class=\"sg\" data-s=\"2\">Не можете да върнете файла.<\/span> <span class=\"sg\" data-s=\"3\">Забележете още нещо.<\/span> <span class=\"sg\" data-s=\"4\">След като изтриете файл, проверявайте го с <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Този метод проверява дали пътят съществува.<\/span> <span class=\"sg\" data-s=\"6\">Не използвайте <code>.f<\/code> тук.<\/span> <span class=\"sg\" data-s=\"7\">Проверките <code>.f<\/code> и <code>.d<\/code> проверяват типа на пътя.<\/span> <span class=\"sg\" data-s=\"8\">Те хвърлят грешка, когато пътят не съществува.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>rmdir<\/code> премахва директория.<\/span> <span class=\"sg\" data-s=\"1\">Но директорията трябва да е <strong>празна<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ако директорията не е празна, <code>rmdir<\/code> не премахва нищо.<\/span> <span class=\"sg\" data-s=\"1\">Директорията остава на мястото си.<\/span> <span class=\"sg\" data-s=\"2\">Затова изтривате директория с файлове на две стъпки.<\/span> <span class=\"sg\" data-s=\"3\">Първо я изпразвате.<\/span> <span class=\"sg\" data-s=\"4\">След това я премахвате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # изтриваме всеки елемент\nrmdir 'reports';                # сега директорията е празна\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> дава списък с елементите в директорията.<\/span> <span class=\"sg\" data-s=\"1\">Видяхте го в предишната тема.<\/span> <span class=\"sg\" data-s=\"2\">Програмата извиква <code>.unlink<\/code> върху всеки елемент.<\/span> <span class=\"sg\" data-s=\"3\">Това ги премахва всички.<\/span> <span class=\"sg\" data-s=\"4\">Сега директорията е празна.<\/span> <span class=\"sg\" data-s=\"5\">Затова <code>rmdir<\/code> може да я премахне.<\/span> <span class=\"sg\" data-s=\"6\">Този прост цикъл очаква само файлове в директорията.<\/span> <span class=\"sg\" data-s=\"7\">Но в една директория може да има и други директории.<\/span> <span class=\"sg\" data-s=\"8\">Тогава първо трябва да изпразните всяка вътрешна директория.<\/span> <span class=\"sg\" data-s=\"9\">Правите го по същия начин.<\/span><\/p>"]]},"eo":{"t":"Forigi dosierojn kaj dosierujojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> kaj <code>mkdir<\/code> kreas aferojn sur la disko.<\/span> <span class=\"sg\" data-s=\"1\">Du aliaj rutinoj forigas aferojn de la disko.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>unlink<\/code> forigas dosieron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> forigas la dosieron kun la donita nomo.<\/span> <span class=\"sg\" data-s=\"1\">Kiel aliaj dosiersistemaj rutinoj, <code>unlink<\/code> ankaŭ estas metodo.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas ĝin sur vojobjekto: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Forigo okazas tuj, kaj ĝi estas por ĉiam.<\/span> <span class=\"sg\" data-s=\"1\">Ne estas rubujo.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne povas rehavi la dosieron.<\/span> <span class=\"sg\" data-s=\"3\">Notu ankoraŭ unu aferon.<\/span> <span class=\"sg\" data-s=\"4\">Post kiam vi forigas dosieron, kontrolu ĝin per <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiu metodo kontrolas, ĉu la vojo ekzistas.<\/span> <span class=\"sg\" data-s=\"6\">Ne uzu <code>.f<\/code> ĉi tie.<\/span> <span class=\"sg\" data-s=\"7\">La testoj <code>.f<\/code> kaj <code>.d<\/code> kontrolas la tipon de la vojo.<\/span> <span class=\"sg\" data-s=\"8\">Ili ĵetas eraron, kiam la vojo ne estas tie.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>rmdir<\/code> forigas dosierujon.<\/span> <span class=\"sg\" data-s=\"1\">Sed la dosierujo devas esti <strong>malplena<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Se la dosierujo ne estas malplena, <code>rmdir<\/code> forigas nenion.<\/span> <span class=\"sg\" data-s=\"1\">La dosierujo restas sur sia loko.<\/span> <span class=\"sg\" data-s=\"2\">Do vi forigas dosierujon kun dosieroj en du paŝoj.<\/span> <span class=\"sg\" data-s=\"3\">Unue, vi malplenigas ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Poste vi forigas ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # forigu ĉiun eron\nrmdir 'reports';                # nun la dosierujo estas malplena\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> donas liston de la eroj en la dosierujo.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidis ĝin en la antaŭa temo.<\/span> <span class=\"sg\" data-s=\"2\">La programo vokas <code>.unlink<\/code> sur ĉiu ero.<\/span> <span class=\"sg\" data-s=\"3\">Tio forigas ilin ĉiujn.<\/span> <span class=\"sg\" data-s=\"4\">Nun la dosierujo estas malplena.<\/span> <span class=\"sg\" data-s=\"5\">Do <code>rmdir<\/code> povas forigi ĝin.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu simpla buklo atendas nur dosierojn en la dosierujo.<\/span> <span class=\"sg\" data-s=\"7\">Sed dosierujo povas ankaŭ havi aliajn dosierujojn en si.<\/span> <span class=\"sg\" data-s=\"8\">Tiam vi devas unue malplenigi ĉiun internan dosierujon.<\/span> <span class=\"sg\" data-s=\"9\">Vi faras tion laŭ la sama maniero.<\/span><\/p>"]]},"la":{"t":"Plicas et directoria delere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> et <code>mkdir<\/code> res in disco creant.<\/span> <span class=\"sg\" data-s=\"1\">Duae aliae procedurae res ex disco removent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>unlink<\/code> archivum delet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> archivum cum nomine dato delet.<\/span> <span class=\"sg\" data-s=\"1\">Sicut aliae procedurae systematis archivorum, <code>unlink<\/code> etiam methodus est.<\/span> <span class=\"sg\" data-s=\"2\">Eam in obiecto semitae vocas: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Deletio statim fit, et in perpetuum manet.<\/span> <span class=\"sg\" data-s=\"1\">Nullum quisquiliarium est.<\/span> <span class=\"sg\" data-s=\"2\">Archivum recuperare non potes.<\/span> <span class=\"sg\" data-s=\"3\">Nota etiam unam rem.<\/span> <span class=\"sg\" data-s=\"4\">Postquam archivum deles, id per <code>.e<\/code> proba.<\/span> <span class=\"sg\" data-s=\"5\">Haec methodus probat an semita exsistat.<\/span> <span class=\"sg\" data-s=\"6\">Noli hic <code>.f<\/code> adhibere.<\/span> <span class=\"sg\" data-s=\"7\">Probationes <code>.f<\/code> et <code>.d<\/code> genus semitae probant.<\/span> <span class=\"sg\" data-s=\"8\">Errorem dant cum semita non adest.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>rmdir<\/code> directoriam removet.<\/span> <span class=\"sg\" data-s=\"1\">Sed directoria <strong>vacua<\/strong> esse debet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Si directoria vacua non est, <code>rmdir<\/code> nihil removet.<\/span> <span class=\"sg\" data-s=\"1\">Directoria in loco suo manet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque directoriam cum archivis duobus gradibus deles.<\/span> <span class=\"sg\" data-s=\"3\">Primum eam vacuam facis.<\/span> <span class=\"sg\" data-s=\"4\">Deinde eam removes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # omnem ingressum dele\nrmdir 'reports';                # nunc directoria vacua est\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> indicem ingressuum directoriae dat.<\/span> <span class=\"sg\" data-s=\"1\">Id in argumento superiore vidisti.<\/span> <span class=\"sg\" data-s=\"2\">Programma <code>.unlink<\/code> in unoquoque ingressu vocat.<\/span> <span class=\"sg\" data-s=\"3\">Hoc omnes removet.<\/span> <span class=\"sg\" data-s=\"4\">Nunc directoria vacua est.<\/span> <span class=\"sg\" data-s=\"5\">Itaque <code>rmdir<\/code> eam removere potest.<\/span> <span class=\"sg\" data-s=\"6\">Hic anulus simplex sola archiva in directoria exspectat.<\/span> <span class=\"sg\" data-s=\"7\">Sed directoria etiam alias directorias continere potest.<\/span> <span class=\"sg\" data-s=\"8\">Tum primum quamque directoriam interiorem vacuam facere debes.<\/span> <span class=\"sg\" data-s=\"9\">Hoc eodem modo facis.<\/span><\/p>"]]}}}</script>
