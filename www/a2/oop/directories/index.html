<script type="application/json" id="page-data">{"u":"oop/directories","n":879,"k":"section","pv":"oop/files/exercises/count-characters/solution","nx":"oop/directories/listing","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Working with directories","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need to work with the file system itself.<\/span> <span class=\"sg\" data-s=\"1\">The file system holds all the files and directories on the disk.<\/span> <span class=\"sg\" data-s=\"2\">For example, you check what exists, or you create directories.<\/span> <span class=\"sg\" data-s=\"3\">A directory is a folder.<\/span> <span class=\"sg\" data-s=\"4\">It can hold files and other directories.<\/span> <span class=\"sg\" data-s=\"5\">For this work, Raku uses <em>path objects<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">A path shows where a file or a directory is.<\/span> <span class=\"sg\" data-s=\"7\">The <code>.IO<\/code> method turns any string into a path object.<\/span> <span class=\"sg\" data-s=\"8\">Then the path object answers questions about this path.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Two questions are the most common.<\/span> <span class=\"sg\" data-s=\"1\">Does the path exist?<\/span> <span class=\"sg\" data-s=\"2\">And what kind of thing is it?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> checks if the path exists.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> checks if it is a regular file.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> checks if it is a directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> creates a new directory:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The next topic shows how to list what is in a directory.<\/span><\/p>"]]},"de":{"t":"Mit Verzeichnissen arbeiten","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Manchmal müssen Sie mit dem Dateisystem selbst arbeiten.<\/span> <span class=\"sg\" data-s=\"1\">Das Dateisystem enthält alle Dateien und Verzeichnisse auf der Festplatte.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel prüfen Sie, was da ist, oder Sie legen Verzeichnisse an.<\/span> <span class=\"sg\" data-s=\"3\">Ein Verzeichnis ist ein Ordner.<\/span> <span class=\"sg\" data-s=\"4\">Es kann Dateien und andere Verzeichnisse enthalten.<\/span> <span class=\"sg\" data-s=\"5\">Für diese Arbeit verwendet Raku <em>Pfadobjekte<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ein Pfad zeigt, wo eine Datei oder ein Verzeichnis ist.<\/span> <span class=\"sg\" data-s=\"7\">Die Methode <code>.IO<\/code> macht aus jeder Zeichenkette ein Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"8\">Dann beantwortet das Pfadobjekt Fragen zu diesem Pfad.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zwei Fragen sind am häufigsten.<\/span> <span class=\"sg\" data-s=\"1\">Existiert der Pfad?<\/span> <span class=\"sg\" data-s=\"2\">Und was für ein Ding ist er?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> prüft, ob der Pfad existiert.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> prüft, ob er eine gewöhnliche Datei ist.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> prüft, ob er ein Verzeichnis ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> legt ein neues :<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het volgende onderwerp laat zien hoe je een lijst maakt van wat er in een map zit.<\/span><\/p>"]]},"es":{"t":"Trabajar con directorios","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas trabajar con el propio sistema de archivos.<\/span> <span class=\"sg\" data-s=\"1\">El sistema de archivos guarda todos los archivos y directorios del disco.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, compruebas qué existe o creas directorios.<\/span> <span class=\"sg\" data-s=\"3\">Un directorio es una carpeta.<\/span> <span class=\"sg\" data-s=\"4\">Puede guardar archivos y otros directorios.<\/span> <span class=\"sg\" data-s=\"5\">Para este trabajo, Raku usa <em>objetos de ruta<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Una ruta muestra dónde está un archivo o un directorio.<\/span> <span class=\"sg\" data-s=\"7\">El método <code>.IO<\/code> convierte cualquier cadena en un objeto de ruta.<\/span> <span class=\"sg\" data-s=\"8\">Después el objeto de ruta responde a preguntas sobre esta ruta.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay dos preguntas muy comunes.<\/span> <span class=\"sg\" data-s=\"1\">¿Existe la ruta?<\/span> <span class=\"sg\" data-s=\"2\">¿Y qué clase de cosa hay en esa ruta?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> comprueba si la ruta existe.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> comprueba si es un archivo regular.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> comprueba si es un directorio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> crea un directorio nuevo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El tema siguiente muestra cómo listar lo que hay en un directorio.<\/span><\/p>"]]},"it":{"t":"Lavorare con le directory","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">A volte devi lavorare con il file system stesso.<\/span> <span class=\"sg\" data-s=\"1\">Il file system contiene tutti i file e tutte le directory del disco.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, controlli che cosa esiste, oppure crei delle directory.<\/span> <span class=\"sg\" data-s=\"3\">Una directory è una cartella.<\/span> <span class=\"sg\" data-s=\"4\">Può contenere file e altre directory.<\/span> <span class=\"sg\" data-s=\"5\">Per questo lavoro Raku usa gli <em>oggetti percorso<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Un percorso dice dove si trova un file o una directory.<\/span> <span class=\"sg\" data-s=\"7\">Il metodo <code>.IO<\/code> trasforma qualsiasi stringa in un oggetto percorso.<\/span> <span class=\"sg\" data-s=\"8\">Poi l'oggetto percorso risponde alle domande su questo percorso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Due domande sono le più comuni.<\/span> <span class=\"sg\" data-s=\"1\">Il percorso esiste?<\/span> <span class=\"sg\" data-s=\"2\">E che tipo di cosa è?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> controlla se il percorso esiste.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> controlla se è un file regolare.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> controlla se è una directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> crea una nuova directory:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il prossimo argomento mostra come elencare che cosa c'è in una directory.<\/span><\/p>"]]},"lv":{"t":"Darbs ar direktorijām","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums jāstrādā ar pašu failu sistēmu.<\/span> <span class=\"sg\" data-s=\"1\">Failu sistēma glabā visus failus un direktorijas uz diska.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, jūs pārbaudāt, kas eksistē, vai veidojat direktorijas.<\/span> <span class=\"sg\" data-s=\"3\">Direktorija ir mape.<\/span> <span class=\"sg\" data-s=\"4\">Tajā var būt faili un citas direktorijas.<\/span> <span class=\"sg\" data-s=\"5\">Šim darbam Raku izmanto <em>ceļa objektus<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ceļš parāda, kur atrodas fails vai direktorija.<\/span> <span class=\"sg\" data-s=\"7\">Metode <code>.IO<\/code> pārvērš jebkuru virkni par ceļa objektu.<\/span> <span class=\"sg\" data-s=\"8\">Tad ceļa objekts atbild uz jautājumiem par šo ceļu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Divi jautājumi ir visbiežākie.<\/span> <span class=\"sg\" data-s=\"1\">Vai ceļš eksistē?<\/span> <span class=\"sg\" data-s=\"2\">Un kāda veida lieta tā ir?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> pārbauda, vai ceļš eksistē.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> pārbauda, vai tas ir parasts fails.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> pārbauda, vai tā ir direktorija.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> izveido jaunu direktoriju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamais temats parāda, kā uzskaitīt to, kas ir direktorijā.<\/span><\/p>"]]},"ru":{"t":"Работа с каталогами","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно работать с самой файловой системой.<\/span> <span class=\"sg\" data-s=\"1\">В файловой системе хранятся все файлы и каталоги на диске.<\/span> <span class=\"sg\" data-s=\"2\">Например, вы проверяете, что существует, или создаёте каталоги.<\/span> <span class=\"sg\" data-s=\"3\">Каталог — это папка.<\/span> <span class=\"sg\" data-s=\"4\">В нём могут быть файлы и другие каталоги.<\/span> <span class=\"sg\" data-s=\"5\">Для этой работы Raku использует <em>объекты пути<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Путь показывает, где лежит файл или каталог.<\/span> <span class=\"sg\" data-s=\"7\">Метод <code>.IO<\/code> превращает любую строку в объект пути.<\/span> <span class=\"sg\" data-s=\"8\">Потом объект пути отвечает на вопросы об этом пути.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два вопроса задают чаще всего.<\/span> <span class=\"sg\" data-s=\"1\">Существует ли путь?<\/span> <span class=\"sg\" data-s=\"2\">И что это такое?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — существует ли?\nsay 'greeting.txt'.IO.f; # True  — это файл?\nsay 'greeting.txt'.IO.d; # False — это каталог?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверяет, существует ли путь.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> проверяет, обычный ли это файл.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> проверяет, каталог ли это.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> создаёт новый каталог:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующая тема показывает, как получить список всего, что есть в каталоге.<\/span><\/p>"]]},"uk":{"t":"Робота з каталогами","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Іноді треба працювати із самою файловою системою.<\/span> <span class=\"sg\" data-s=\"1\">Файлова система зберігає всі файли й каталоги на диску.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, ви перевіряєте, що існує, або створюєте каталоги.<\/span> <span class=\"sg\" data-s=\"3\">Каталог — це папка.<\/span> <span class=\"sg\" data-s=\"4\">У ньому можуть бути файли й інші каталоги.<\/span> <span class=\"sg\" data-s=\"5\">Для цієї роботи Raku використовує <em>об'єкти шляху<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Шлях показує, де лежить файл чи каталог.<\/span> <span class=\"sg\" data-s=\"7\">Метод <code>.IO<\/code> перетворює будь-який рядок на об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"8\">Тоді об'єкт шляху відповідає на запитання про цей шлях.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Найчастіше ставлять два запитання.<\/span> <span class=\"sg\" data-s=\"1\">Чи існує шлях?<\/span> <span class=\"sg\" data-s=\"2\">І що це за річ?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — чи існує?\nsay 'greeting.txt'.IO.f; # True  — чи це файл?\nsay 'greeting.txt'.IO.d; # False — чи це каталог?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> перевіряє, чи існує шлях.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> перевіряє, чи це звичайний файл.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> перевіряє, чи це каталог.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> створює новий каталог:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступна тема показує, як отримати список того, що лежить у каталозі.<\/span><\/p>"]]},"bg":{"t":"Работа с директории","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Понякога трябва да работите със самата файлова система.<\/span> <span class=\"sg\" data-s=\"1\">Файловата система съдържа всички файлове и директории на диска.<\/span> <span class=\"sg\" data-s=\"2\">Например проверявате какво съществува или създавате директории.<\/span> <span class=\"sg\" data-s=\"3\">Директорията е папка.<\/span> <span class=\"sg\" data-s=\"4\">Тя може да съдържа файлове и други директории.<\/span> <span class=\"sg\" data-s=\"5\">За тази работа Raku използва <em>обекти-пътища<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Пътят показва къде се намира даден файл или директория.<\/span> <span class=\"sg\" data-s=\"7\">Методът <code>.IO<\/code> превръща всеки низ в обект-път.<\/span> <span class=\"sg\" data-s=\"8\">След това обектът-път отговаря на въпроси за този път.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два въпроса са най-чести.<\/span> <span class=\"sg\" data-s=\"1\">Съществува ли пътят?<\/span> <span class=\"sg\" data-s=\"2\">И какъв вид нещо е той?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — съществува ли?\nsay 'greeting.txt'.IO.f; # True  — файл ли е?\nsay 'greeting.txt'.IO.d; # False — директория ли е?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверява дали пътят съществува.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> проверява дали той е обикновен файл.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> проверява дали той е директория.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> създава нова директория:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващата тема показва как да изброите какво има в директорията.<\/span><\/p>"]]},"eo":{"t":"Labori kun dosierujoj","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Foje vi devas labori kun la dosiersistemo mem.<\/span> <span class=\"sg\" data-s=\"1\">La dosiersistemo tenas ĉiujn dosierojn kaj dosierujojn sur la disko.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, vi kontrolas, kio ekzistas, aŭ vi kreas dosierujojn.<\/span> <span class=\"sg\" data-s=\"3\">Dosierujo estas kiel tekujo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi povas teni dosierojn kaj aliajn dosierujojn.<\/span> <span class=\"sg\" data-s=\"5\">Por ĉi tiu laboro, Raku uzas <em>vojobjektojn<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Vojo montras, kie dosiero aŭ dosierujo estas.<\/span> <span class=\"sg\" data-s=\"7\">La metodo <code>.IO<\/code> faras vojobjekton el ĉiu ĉeno.<\/span> <span class=\"sg\" data-s=\"8\">Tiam la vojobjekto respondas demandojn pri ĉi tiu vojo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du demandoj estas la plej oftaj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu la vojo ekzistas?<\/span> <span class=\"sg\" data-s=\"2\">Kaj kia afero ĝi estas?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — ĉu ĝi ekzistas?\nsay 'greeting.txt'.IO.f; # True  — ĉu ĝi estas dosiero?\nsay 'greeting.txt'.IO.d; # False — ĉu ĝi estas dosierujo?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> kontrolas, ĉu la vojo ekzistas.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> kontrolas, ĉu ĝi estas ordinara dosiero.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> kontrolas, ĉu ĝi estas dosierujo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> kreas novan dosierujon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekva temo montras, kiel listigi, kio estas en dosierujo.<\/span><\/p>"]]},"la":{"t":"Cum directoriis laborare","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Interdum cum ipso systemate archivorum laborare debes.<\/span> <span class=\"sg\" data-s=\"1\">Systema archivorum omnia archiva et directorias in disco tenet.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia probas quid exsistat, aut directorias creas.<\/span> <span class=\"sg\" data-s=\"3\">Directoria est sicut capsa.<\/span> <span class=\"sg\" data-s=\"4\">Archiva et alias directorias tenere potest.<\/span> <span class=\"sg\" data-s=\"5\">Ad hoc opus Raku <em>obiectis semitae<\/em> utitur.<\/span> <span class=\"sg\" data-s=\"6\">Semita ostendit ubi archivum aut directoria sit.<\/span> <span class=\"sg\" data-s=\"7\">Methodus <code>.IO<\/code> quamlibet chordam in obiectum semitae vertit.<\/span> <span class=\"sg\" data-s=\"8\">Deinde obiectum semitae ad quaestiones de hac semita respondet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duae quaestiones frequentissimae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Exsistitne semita?<\/span> <span class=\"sg\" data-s=\"2\">Et cuius generis res est?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — exsistitne?\nsay 'greeting.txt'.IO.f; # True  — estne archivum?\nsay 'greeting.txt'.IO.d; # False — estne directoria?<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> probat an semita exsistat.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> probat an archivum ordinarium sit.<\/span> <span class=\"sg\" data-s=\"2\"><code>.d<\/code> probat an directoria sit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> novam directoriam creat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumentum sequens ostendit quomodo res in directoria enumeres.<\/span><\/p>"]]}}}</script>
