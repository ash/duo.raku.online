<script type="application/json" id="page-data">{"u":"oop/directories/listing","n":880,"k":"topic","pv":"oop/directories","nx":"oop/directories/listing/quiz","tr":["oop","oop/directories"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Listing a directory","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">The <code>dir<\/code> routine returns the entries of a directory.<\/span> <span class=\"sg\" data-s=\"1\">An entry is a file or a directory inside it.<\/span> <span class=\"sg\" data-s=\"2\">Each entry is a path object.<\/span> <span class=\"sg\" data-s=\"3\">The order of the entries is not fixed.<\/span> <span class=\"sg\" data-s=\"4\">So people often sort the result.<\/span> <span class=\"sg\" data-s=\"5\">Then the output always comes in the same order.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This program prints the names of the files in the <code>box<\/code> directory.<\/span> <span class=\"sg\" data-s=\"1\">The names are sorted:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Each entry is a full path object.<\/span> <span class=\"sg\" data-s=\"1\">The <code>basename<\/code> method gives only the name at the end.<\/span> <span class=\"sg\" data-s=\"2\">It does not give the directory part.<\/span> <span class=\"sg\" data-s=\"3\">You can ask a path object all the same questions as before: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">So, for example, you can take only the files from a directory.<\/span><\/p>"]]},"de":{"t":"Ein Verzeichnis auflisten","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>dir<\/code> gibt die Einträge eines Verzeichnisses zurück.<\/span> <span class=\"sg\" data-s=\"1\">Ein Eintrag ist eine Datei oder ein Verzeichnis darin.<\/span> <span class=\"sg\" data-s=\"2\">Jeder Eintrag ist ein Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"3\">Die Reihenfolge der Einträge ist nicht fest.<\/span> <span class=\"sg\" data-s=\"4\">Darum sortiert man das Ergebnis oft.<\/span> <span class=\"sg\" data-s=\"5\">Dann kommt die Ausgabe immer in derselben Reihenfolge.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt die Namen der Dateien im Verzeichnis <code>box<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Die Namen sind sortiert:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jeder Eintrag ist ein vollständiges Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>basename<\/code> gibt nur den Namen am Ende zurück.<\/span> <span class=\"sg\" data-s=\"2\">Den Verzeichnisteil gibt sie nicht zurück.<\/span> <span class=\"sg\" data-s=\"3\">Sie können einem Pfadobjekt alle Fragen von vorhin stellen: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">So können Sie zum Beispiel nur die Dateien aus einem Verzeichnis nehmen.<\/span><\/p>"]]},"nl":{"t":"Een map opsommen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De routine <code>dir<\/code> geeft de items van een map terug.<\/span> <span class=\"sg\" data-s=\"1\">Een item is een bestand of een map daarin.<\/span> <span class=\"sg\" data-s=\"2\">Elk item is een padobject.<\/span> <span class=\"sg\" data-s=\"3\">De volgorde van de items ligt niet vast.<\/span> <span class=\"sg\" data-s=\"4\">Dus sorteren mensen het resultaat vaak.<\/span> <span class=\"sg\" data-s=\"5\">Dan komt de uitvoer altijd in dezelfde volgorde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt de namen af van de bestanden in de map <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De namen staan op volgorde:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Elk item is een volledig padobject.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>basename<\/code> geeft alleen de naam aan het eind.<\/span> <span class=\"sg\" data-s=\"2\">Hij geeft het mapgedeelte niet.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt een padobject dezelfde vragen stellen als eerder: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Zo kun je bijvoorbeeld alleen de bestanden uit een map halen.<\/span><\/p>"]]},"es":{"t":"Listar un directorio","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>dir<\/code> devuelve las entradas de un directorio.<\/span> <span class=\"sg\" data-s=\"1\">Una entrada es un archivo o un directorio que hay dentro.<\/span> <span class=\"sg\" data-s=\"2\">Cada entrada es un objeto de ruta.<\/span> <span class=\"sg\" data-s=\"3\">El orden de las entradas no es fijo.<\/span> <span class=\"sg\" data-s=\"4\">Por eso, la gente suele ordenar el resultado.<\/span> <span class=\"sg\" data-s=\"5\">Entonces la salida siempre tiene el mismo orden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime los nombres de los archivos del directorio <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los nombres van en orden:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cada entrada es un objeto de ruta completo.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>basename<\/code> da solo el nombre del final.<\/span> <span class=\"sg\" data-s=\"2\">No da la parte del directorio.<\/span> <span class=\"sg\" data-s=\"3\">A un objeto de ruta le puedes hacer las mismas preguntas de antes: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Así que, por ejemplo, puedes tomar solo los archivos de un directorio.<\/span><\/p>"]]},"it":{"t":"Elencare una directory","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La routine <code>dir<\/code> restituisce le voci di una directory.<\/span> <span class=\"sg\" data-s=\"1\">Una voce è un file o una directory al suo interno.<\/span> <span class=\"sg\" data-s=\"2\">Ogni voce è un oggetto percorso.<\/span> <span class=\"sg\" data-s=\"3\">L'ordine delle voci non è fisso.<\/span> <span class=\"sg\" data-s=\"4\">Quindi spesso si ordina il risultato.<\/span> <span class=\"sg\" data-s=\"5\">Così l'output arriva sempre nello stesso ordine.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa i nomi dei file nella directory <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I nomi sono in ordine:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni voce è un oggetto percorso completo.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>basename<\/code> dà solo il nome alla fine.<\/span> <span class=\"sg\" data-s=\"2\">Non dà la parte della directory.<\/span> <span class=\"sg\" data-s=\"3\">A un oggetto percorso puoi fare tutte le domande di prima: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Così, per esempio, puoi prendere solo i file da una directory.<\/span><\/p>"]]},"lv":{"t":"Direktorijas satura uzskaitīšana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>dir<\/code> atgriež direktorijas ierakstus.<\/span> <span class=\"sg\" data-s=\"1\">Ieraksts ir fails vai direktorija tās iekšā.<\/span> <span class=\"sg\" data-s=\"2\">Katrs ieraksts ir ceļa objekts.<\/span> <span class=\"sg\" data-s=\"3\">Ierakstu secība nav noteikta.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc programmētāji bieži sakārto rezultātu.<\/span> <span class=\"sg\" data-s=\"5\">Tad izvade vienmēr ir tādā pašā secībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā failu nosaukumus direktorijā <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukumi ir sakārtoti:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrs ieraksts ir pilns ceļa objekts.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>basename<\/code> dod tikai nosaukumu ceļa beigās.<\/span> <span class=\"sg\" data-s=\"2\">Tā nedod direktorijas daļu.<\/span> <span class=\"sg\" data-s=\"3\">Ceļa objektam jūs varat uzdot visus tos pašus jautājumus kā iepriekš: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc jūs varat, piemēram, paņemt no direktorijas tikai failus.<\/span><\/p>"]]},"ru":{"t":"Просмотр содержимого каталога","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>dir<\/code> возвращает записи каталога.<\/span> <span class=\"sg\" data-s=\"1\">Запись — это файл или каталог внутри него.<\/span> <span class=\"sg\" data-s=\"2\">Каждая запись — это объект пути.<\/span> <span class=\"sg\" data-s=\"3\">Порядок записей может меняться.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому результат часто сортируют.<\/span> <span class=\"sg\" data-s=\"5\">Тогда вывод всегда идёт в одном и том же порядке.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает имена файлов в каталоге <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Имена идут по порядку:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждая запись — это полный объект пути.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>basename<\/code> даёт только имя в конце.<\/span> <span class=\"sg\" data-s=\"2\">Часть с каталогом он не даёт.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете задать объекту пути все те же вопросы, что и раньше: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Так что, например, можно взять из каталога только файлы.<\/span><\/p>"]]},"uk":{"t":"Перелік вмісту каталогу","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>dir<\/code> повертає записи каталогу.<\/span> <span class=\"sg\" data-s=\"1\">Запис — це файл або каталог усередині нього.<\/span> <span class=\"sg\" data-s=\"2\">Кожен запис — це об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"3\">Порядок записів не завжди однаковий.<\/span> <span class=\"sg\" data-s=\"4\">Тому результат часто сортують.<\/span> <span class=\"sg\" data-s=\"5\">Тоді вивід завжди йде в тому самому порядку.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить імена файлів у каталозі <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Імена відсортовані:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожен запис — це повний об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>basename<\/code> дає лише ім'я в кінці.<\/span> <span class=\"sg\" data-s=\"2\">Він не дає частину з каталогом.<\/span> <span class=\"sg\" data-s=\"3\">Об'єкту шляху можна ставити всі ті самі запитання, що й раніше: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тож, наприклад, можна взяти з каталогу лише файли.<\/span><\/p>"]]},"bg":{"t":"Изброяване на директория","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>dir<\/code> връща елементите на директория.<\/span> <span class=\"sg\" data-s=\"1\">Елементът е файл или директория вътре в нея.<\/span> <span class=\"sg\" data-s=\"2\">Всеки елемент е обект-път.<\/span> <span class=\"sg\" data-s=\"3\">Редът на елементите не е фиксиран.<\/span> <span class=\"sg\" data-s=\"4\">Затова хората често сортират резултата.<\/span> <span class=\"sg\" data-s=\"5\">Тогава изходът винаги идва в същия ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва имената на файловете в директорията <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Имената са сортирани:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент е пълен обект-път.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>basename<\/code> дава само името в края.<\/span> <span class=\"sg\" data-s=\"2\">Той не дава частта с директорията.<\/span> <span class=\"sg\" data-s=\"3\">Можете да зададете на обекта-път всички същите въпроси както преди: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Така например можете да вземете само файловете от директория.<\/span><\/p>"]]},"eo":{"t":"Listigi dosierujon","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>dir<\/code> redonas la erojn de dosierujo.<\/span> <span class=\"sg\" data-s=\"1\">Ero estas dosiero aŭ dosierujo en ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu ero estas vojobjekto.<\/span> <span class=\"sg\" data-s=\"3\">La ordo de la eroj ne estas fiksita.<\/span> <span class=\"sg\" data-s=\"4\">Do oni ofte ordigas la rezulton.<\/span> <span class=\"sg\" data-s=\"5\">Tiam la eligo ĉiam venas en la sama ordo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas la nomojn de la dosieroj en la dosierujo <code>box<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La nomoj estas ordigitaj:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ero estas plena vojobjekto.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>basename<\/code> donas nur la nomon ĉe la fino.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne donas la parton de la dosierujo.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas fari al vojobjekto ĉiujn samajn demandojn kiel antaŭe: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Do, ekzemple, vi povas preni nur la dosierojn el dosierujo.<\/span><\/p>"]]},"la":{"t":"Directorium enumerare","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>dir<\/code> ingressus directoriae reddit.<\/span> <span class=\"sg\" data-s=\"1\">Ingressus est archivum aut directoria intra eam.<\/span> <span class=\"sg\" data-s=\"2\">Quisque ingressus obiectum semitae est.<\/span> <span class=\"sg\" data-s=\"3\">Ordo ingressuum fixus non est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque homines saepe effectum ordinant.<\/span> <span class=\"sg\" data-s=\"5\">Tum exitus semper eodem ordine venit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc programma nomina archivorum in directoria <code>box<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Nomina in ordine sunt:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Quisque ingressus plenum obiectum semitae est.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>basename<\/code> solum nomen in fine dat.<\/span> <span class=\"sg\" data-s=\"2\">Partem directoriae non dat.<\/span> <span class=\"sg\" data-s=\"3\">Ab obiecto semitae easdem quaestiones ac prius petere potes: <code>.f<\/code>, <code>.d<\/code>, <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Itaque, exempli gratia, sola archiva ex directoria sumere potes.<\/span><\/p>"]]}}}</script>
