<script type="application/json" id="page-data">{"u":"oop/mop/meta-methods","n":848,"k":"topic","pv":"oop/mop","nx":"oop/mop/meta-methods/quiz","tr":["oop","oop/mop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Meta-methods","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">You call a <em>meta-method<\/em> with <code>.^<\/code>, not with <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A normal <code>.method<\/code> runs a method of the object.<\/span> <span class=\"sg\" data-s=\"2\">A <code>.^method<\/code> is different.<\/span> <span class=\"sg\" data-s=\"3\">It calls a method of the <strong>metaobject<\/strong> of the object.<\/span> <span class=\"sg\" data-s=\"4\">A metaobject is an object that describes a type.<\/span> <span class=\"sg\" data-s=\"5\">So the call asks about the type.<\/span> <span class=\"sg\" data-s=\"6\">It does not act as the type.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You already know <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It returns the name of the type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Other meta-methods show how a type is built.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> lists its attributes.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> tells you if a method exists:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> returns the <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is a chain of types.<\/span> <span class=\"sg\" data-s=\"2\">Raku looks for a method in each of them, in this order.<\/span> <span class=\"sg\" data-s=\"3\">It is the line of inheritance of a class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> inherits from <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In the end, every type inherits from <code>Any<\/code> and <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You call a method on a <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Then Raku looks for it along exactly this path.<\/span> <span class=\"sg\" data-s=\"4\">These meta-methods turn your types into data.<\/span> <span class=\"sg\" data-s=\"5\">This data shows how the types are built.<\/span> <span class=\"sg\" data-s=\"6\">You can ask about it while the program runs.<\/span><\/p>"]]},"de":{"t":"Metamethoden","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Metamethode<\/em> rufen Sie mit <code>.^<\/code> auf, nicht mit <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ein normales <code>.method<\/code> führt eine Methode des Objekts aus.<\/span> <span class=\"sg\" data-s=\"2\">Ein <code>.^method<\/code> ist anders.<\/span> <span class=\"sg\" data-s=\"3\">Es ruft eine Methode des <strong>Metaobjekts<\/strong> des Objekts auf.<\/span> <span class=\"sg\" data-s=\"4\">Ein Metaobjekt ist ein Objekt, das einen Typ beschreibt.<\/span> <span class=\"sg\" data-s=\"5\">Der Aufruf fragt also nach dem Typ.<\/span> <span class=\"sg\" data-s=\"6\">Er handelt nicht als der Typ.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie kennen schon <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt den Namen des Typs zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Andere Metamethoden zeigen, wie ein Typ gebaut ist.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> listet seine Attribute auf.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> sagt Ihnen, ob eine Methode existiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> gibt die <em>method resolution order<\/em> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Das ist eine Kette von Typen.<\/span> <span class=\"sg\" data-s=\"2\">Raku sucht in jedem davon nach einer Methode, in dieser Reihenfolge.<\/span> <span class=\"sg\" data-s=\"3\">Sie ist die Vererbungslinie einer Klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erbt von <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Am Ende erbt jeder Typ von <code>Any<\/code> und <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie rufen eine Methode auf einem <code>B<\/code> auf.<\/span> <span class=\"sg\" data-s=\"3\">Dann sucht Raku sie genau entlang dieses Wegs.<\/span> <span class=\"sg\" data-s=\"4\">Diese Metamethoden machen aus Ihren Typen Daten.<\/span> <span class=\"sg\" data-s=\"5\">Diese Daten zeigen, wie die Typen gebaut sind.<\/span> <span class=\"sg\" data-s=\"6\">Sie können sie abfragen, während das Programm läuft.<\/span><\/p>"]]},"nl":{"t":"Metamethoden","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Je roept een <em>metamethode<\/em> aan met <code>.^<\/code>, niet met <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Een gewone <code>.method<\/code> draait een methode van het object.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>.^method<\/code> is anders.<\/span> <span class=\"sg\" data-s=\"3\">Die roept een methode aan van het <strong>metaobject<\/strong> van het object.<\/span> <span class=\"sg\" data-s=\"4\">Een metaobject is een object dat een type beschrijft.<\/span> <span class=\"sg\" data-s=\"5\">Dus vraagt de aanroep iets over het type.<\/span> <span class=\"sg\" data-s=\"6\">Hij treedt niet op als het type.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kent <code>.^name<\/code> al.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft de naam van het type terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Andere metamethoden laten zien hoe een type gebouwd is.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> geeft een lijst van zijn attributen.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> zegt je of een methode bestaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> geeft de <em>method resolution order<\/em> terug.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een keten van typen.<\/span> <span class=\"sg\" data-s=\"2\">Raku zoekt in elk ervan naar een methode, in deze volgorde.<\/span> <span class=\"sg\" data-s=\"3\">Het is de lijn van overerving van een klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erft van <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Uiteindelijk erft elk type van <code>Any<\/code> en <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je roept een methode aan op een <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dan zoekt Raku haar precies langs dit pad.<\/span> <span class=\"sg\" data-s=\"4\">Deze metamethoden maken van je typen gegevens.<\/span> <span class=\"sg\" data-s=\"5\">Deze gegevens laten zien hoe de typen gebouwd zijn.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt ernaar vragen terwijl het programma draait.<\/span><\/p>"]]},"es":{"t":"Metamétodos","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Llamas a un <em>metamétodo<\/em> con <code>.^<\/code>, no con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>.method<\/code> normal ejecuta un método del objeto.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>.^method<\/code> es distinto.<\/span> <span class=\"sg\" data-s=\"3\">Llama a un método del <strong>metaobjeto<\/strong> del objeto.<\/span> <span class=\"sg\" data-s=\"4\">Un metaobjeto es un objeto que describe un tipo.<\/span> <span class=\"sg\" data-s=\"5\">Así que la llamada pregunta por el tipo.<\/span> <span class=\"sg\" data-s=\"6\">No actúa como el tipo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya conoces <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Devuelve el nombre del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Otros metamétodos muestran cómo está hecho un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> da la lista de sus atributos.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> te dice si un método existe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> devuelve el <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es una cadena de tipos.<\/span> <span class=\"sg\" data-s=\"2\">Raku busca un método en cada uno de ellos, en este orden.<\/span> <span class=\"sg\" data-s=\"3\">Es la línea de herencia de una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> hereda de <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Al final, todo tipo hereda de <code>Any<\/code> y <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Llamas a un método sobre un <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Entonces Raku lo busca exactamente por este camino.<\/span> <span class=\"sg\" data-s=\"4\">Estos metamétodos convierten tus tipos en datos.<\/span> <span class=\"sg\" data-s=\"5\">Estos datos muestran cómo están hechos los tipos.<\/span> <span class=\"sg\" data-s=\"6\">Puedes preguntar por ellos mientras el programa se ejecuta.<\/span><\/p>"]]},"it":{"t":"Metametodi","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Chiami un <em>metametodo<\/em> con <code>.^<\/code>, non con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>.method<\/code> normale esegue un metodo dell'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>.^method<\/code> è diverso.<\/span> <span class=\"sg\" data-s=\"3\">Chiama un metodo del <strong>metaoggetto<\/strong> dell'oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Un metaoggetto è un oggetto che descrive un tipo.<\/span> <span class=\"sg\" data-s=\"5\">Quindi la chiamata chiede qualcosa sul tipo.<\/span> <span class=\"sg\" data-s=\"6\">Non agisce come il tipo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Conosci già <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce il nome del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Altri metametodi mostrano come è fatto un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> elenca i suoi attributi.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> ti dice se un metodo esiste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> restituisce il <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È una catena di tipi.<\/span> <span class=\"sg\" data-s=\"2\">Raku cerca un metodo in ognuno di loro, in questo ordine.<\/span> <span class=\"sg\" data-s=\"3\">È la linea di ereditarietà di una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> eredita da <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Alla fine, ogni tipo eredita da <code>Any<\/code> e <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Chiami un metodo su un <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora Raku lo cerca proprio lungo questo percorso.<\/span> <span class=\"sg\" data-s=\"4\">Questi metametodi trasformano i tuoi tipi in dati.<\/span> <span class=\"sg\" data-s=\"5\">Questi dati mostrano come sono fatti i tipi.<\/span> <span class=\"sg\" data-s=\"6\">Puoi fare domande su di loro mentre il programma gira.<\/span><\/p>"]]},"lv":{"t":"Metametodes","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Jūs izsaucat <em>metametodi<\/em> ar <code>.^<\/code>, nevis ar <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Parasta <code>.method<\/code> izpilda objekta metodi.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>.^method<\/code> ir citādi.<\/span> <span class=\"sg\" data-s=\"3\">Tā izsauc metodi uz objekta <strong>metaobjekta<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Metaobjekts ir objekts, kas apraksta tipu.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc izsaukums jautā par tipu.<\/span> <span class=\"sg\" data-s=\"6\">Tas nedarbojas kā tips.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež tipa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Citas metametodes parāda, kā tips ir uzbūvēts.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> uzskaita tā atribūtus.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> pasaka jums, vai tāda metode ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> atgriež <em>metožu atrisināšanas secību<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir tipu ķēde.<\/span> <span class=\"sg\" data-s=\"2\">Raku meklē metodi katrā no tiem, šajā secībā.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir klases mantošanas līnija:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> manto no <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Galu galā katrs tips manto no <code>Any<\/code> un <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs izsaucat metodi uz <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad Raku meklē to tieši pa šo ceļu.<\/span> <span class=\"sg\" data-s=\"4\">Šīs metametodes pārvērš jūsu tipus par datiem.<\/span> <span class=\"sg\" data-s=\"5\">Šie dati parāda, kā tipi ir uzbūvēti.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat par tiem jautāt, kamēr programma darbojas.<\/span><\/p>"]]},"ru":{"t":"Метаметоды","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Вы вызываете <em>метаметод<\/em> через <code>.^<\/code>, а не через <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обычный <code>.method<\/code> выполняет метод объекта.<\/span> <span class=\"sg\" data-s=\"2\">С <code>.^method<\/code> всё иначе.<\/span> <span class=\"sg\" data-s=\"3\">Он вызывает метод <strong>метаобъекта<\/strong> этого объекта.<\/span> <span class=\"sg\" data-s=\"4\">Метаобъект — это объект, который описывает тип.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому такой вызов спрашивает о типе.<\/span> <span class=\"sg\" data-s=\"6\">Он не действует как тип.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает имя типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Другие метаметоды показывают, как устроен тип.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перечисляет его атрибуты.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> говорит, есть ли метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> возвращает <em>порядок разрешения методов<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это цепочка типов.<\/span> <span class=\"sg\" data-s=\"2\">Raku ищет метод в каждом из них, в этом порядке.<\/span> <span class=\"sg\" data-s=\"3\">Это линия наследования класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследует от <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А в конце концов каждый тип наследует от <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы вызываете метод у <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда Raku ищет его ровно по этому пути.<\/span> <span class=\"sg\" data-s=\"4\">Эти метаметоды превращают ваши типы в данные.<\/span> <span class=\"sg\" data-s=\"5\">Эти данные показывают, как устроены типы.<\/span> <span class=\"sg\" data-s=\"6\">О них можно спрашивать, пока программа работает.<\/span><\/p>"]]},"uk":{"t":"Метаметоди","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметод<\/em> викликають через <code>.^<\/code>, а не через <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звичайний <code>.method<\/code> виконує метод об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">А <code>.^method<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"3\">Він викликає метод <strong>метаоб'єкта<\/strong> цього об'єкта.<\/span> <span class=\"sg\" data-s=\"4\">Метаоб'єкт — це об'єкт, який описує тип.<\/span> <span class=\"sg\" data-s=\"5\">Тож цей виклик питає про тип.<\/span> <span class=\"sg\" data-s=\"6\">Він не діє як тип.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає ім'я типу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Інші метаметоди показують, як побудований тип.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перелічує його атрибути.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> каже, чи існує метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> повертає <em>порядок розв'язання методів<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це ланцюжок типів.<\/span> <span class=\"sg\" data-s=\"2\">Raku шукає метод у кожному з них, у такому порядку.<\/span> <span class=\"sg\" data-s=\"3\">Це лінія успадкування класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> успадковує від <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зрештою, кожен тип успадковує від <code>Any<\/code> та <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте метод для <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді Raku шукає його саме цим шляхом.<\/span> <span class=\"sg\" data-s=\"4\">Ці метаметоди перетворюють ваші типи на дані.<\/span> <span class=\"sg\" data-s=\"5\">Ці дані показують, як побудовані типи.<\/span> <span class=\"sg\" data-s=\"6\">Про них можна питати, поки програма працює.<\/span><\/p>"]]},"bg":{"t":"Метаметоди","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Извиквате <em>метаметод<\/em> с <code>.^<\/code>, а не с <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обикновеното <code>.method<\/code> изпълнява метод на обекта.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^method<\/code> е нещо различно.<\/span> <span class=\"sg\" data-s=\"3\">То извиква метод на <strong>метаобекта<\/strong> на обекта.<\/span> <span class=\"sg\" data-s=\"4\">Метаобектът е обект, който описва тип.<\/span> <span class=\"sg\" data-s=\"5\">Затова извикването пита за типа.<\/span> <span class=\"sg\" data-s=\"6\">То не действа като типа.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече знаете <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща името на типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Други метаметоди показват как е изграден типът.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> изброява атрибутите му.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> ви казва дали даден метод съществува:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> връща <em>реда на разрешаване на методите<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това е верига от типове.<\/span> <span class=\"sg\" data-s=\"2\">Raku търси метод във всеки от тях, в този ред.<\/span> <span class=\"sg\" data-s=\"3\">Това е линията на наследяване на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследява <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В крайна сметка всеки тип наследява <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате метод върху <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава Raku го търси точно по този път.<\/span> <span class=\"sg\" data-s=\"4\">Тези метаметоди превръщат вашите типове в данни.<\/span> <span class=\"sg\" data-s=\"5\">Тези данни показват как са изградени типовете.<\/span> <span class=\"sg\" data-s=\"6\">Можете да питате за тях, докато програмата работи.<\/span><\/p>"]]},"eo":{"t":"Metametodoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Vi vokas <em>metametodon<\/em> per <code>.^<\/code>, ne per <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Normala <code>.method<\/code> rulas metodon de la objekto.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^method<\/code> estas malsama.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi vokas metodon de la <strong>metaobjekto<\/strong> de la objekto.<\/span> <span class=\"sg\" data-s=\"4\">Metaobjekto estas objekto, kiu priskribas tipon.<\/span> <span class=\"sg\" data-s=\"5\">Do la voko demandas pri la tipo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi ne agas kiel la tipo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas la nomon de la tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aliaj metametodoj montras, kiel tipo estas konstruita.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> listigas ĝiajn atributojn.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> diras al vi, ĉu metodo ekzistas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> redonas la <em>ordon de metodserĉado<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ĉeno de tipoj.<\/span> <span class=\"sg\" data-s=\"2\">Raku serĉas metodon en ĉiu el ili, en ĉi tiu ordo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas la linio de heredo de klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> heredas de <code>A<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Finfine, ĉiu tipo heredas de <code>Any<\/code> kaj <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas metodon sur <code>B<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam Raku serĉas ĝin laŭ ĝuste ĉi tiu vojo.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiuj metametodoj faras datumojn el viaj tipoj.<\/span> <span class=\"sg\" data-s=\"5\">Ĉi tiuj datumoj montras, kiel la tipoj estas konstruitaj.<\/span> <span class=\"sg\" data-s=\"6\">Vi povas demandi pri ili dum la programo ruliĝas.<\/span><\/p>"]]},"la":{"t":"Metamethodi","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><em>Metamethodum<\/em> per <code>.^<\/code> vocas, non per <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ordinarium <code>.method<\/code> methodum obiecti exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>.^method<\/code> alia res est.<\/span> <span class=\"sg\" data-s=\"3\">Methodum <strong>metaobiecti<\/strong> obiecti vocat.<\/span> <span class=\"sg\" data-s=\"4\">Metaobiectum est obiectum quod genus describit.<\/span> <span class=\"sg\" data-s=\"5\">Itaque vocatio de genere interrogat.<\/span> <span class=\"sg\" data-s=\"6\">Non ut genus agit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iam <code>.^name<\/code> nosti.<\/span> <span class=\"sg\" data-s=\"1\">Nomen generis reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aliae metamethodi formam generis ostendunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> attributa eius enumerat.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^find_method<\/code> tibi dicit an methodus adsit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> <em>ordinem resolutionis methodorum<\/em> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Haec est catena generum.<\/span> <span class=\"sg\" data-s=\"2\">Raku methodum in quoque eorum quaerit, hoc ordine.<\/span> <span class=\"sg\" data-s=\"3\">Est linea hereditatis classis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> ab <code>A<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"1\">Tandem omne genus ab <code>Any<\/code> et <code>Mu<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"2\">Methodum in <code>B<\/code> vocas.<\/span> <span class=\"sg\" data-s=\"3\">Tum Raku eam per hanc ipsam semitam quaerit.<\/span> <span class=\"sg\" data-s=\"4\">Hae metamethodi genera tua in data vertunt.<\/span> <span class=\"sg\" data-s=\"5\">Haec data formam generum ostendunt.<\/span> <span class=\"sg\" data-s=\"6\">De eis interrogare potes dum programma currit.<\/span><\/p>"]]}}}</script>
