<script type="application/json" id="page-data">{"u":"oop/mop","n":847,"k":"section","pv":"oop/object-introspection/exercises/count-attributes/solution","nx":"oop/mop/meta-methods","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The metaobject protocol","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku, another object describes every class, role and type.<\/span> <span class=\"sg\" data-s=\"1\">This object is its <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The metaobject knows the name of the type.<\/span> <span class=\"sg\" data-s=\"3\">It knows the attributes and the methods of the type.<\/span> <span class=\"sg\" data-s=\"4\">It also knows where the type is in the tree of inheritance.<\/span> <span class=\"sg\" data-s=\"5\">The way to use these metaobjects is the <em>metaobject protocol<\/em>, or MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">You already used a small part of it: <code>.^name<\/code> is a MOP call.<\/span> <span class=\"sg\" data-s=\"1\">This section explains the <code>.^<\/code> syntax properly.<\/span> <span class=\"sg\" data-s=\"2\">It shows the most useful meta-methods.<\/span> <span class=\"sg\" data-s=\"3\">These are methods of a metaobject.<\/span> <span class=\"sg\" data-s=\"4\">With them, you can look inside a type.<\/span> <span class=\"sg\" data-s=\"5\">With the MOP, you can even add methods to a class.<\/span> <span class=\"sg\" data-s=\"6\">You can do it while the program runs.<\/span><\/p>"]]},"de":{"t":"Das Metaobjektprotokoll","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku beschreibt ein anderes Objekt jede Klasse, jede Rolle und jeden Typ.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Objekt ist das <em>Metaobjekt<\/em> des Typs.<\/span> <span class=\"sg\" data-s=\"2\">Das Metaobjekt kennt den Namen des Typs.<\/span> <span class=\"sg\" data-s=\"3\">Es kennt die Attribute und die Methoden des Typs.<\/span> <span class=\"sg\" data-s=\"4\">Es kennt auch den Platz des Typs im Vererbungsbaum.<\/span> <span class=\"sg\" data-s=\"5\">Der Weg zu diesen Metaobjekten ist das <em>Metaobjektprotokoll<\/em>, kurz MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Einen kleinen Teil davon haben Sie schon benutzt: <code>.^name<\/code> ist ein MOP-Aufruf.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt erklärt die Syntax <code>.^<\/code> richtig.<\/span> <span class=\"sg\" data-s=\"2\">Er zeigt die nützlichsten Metamethoden.<\/span> <span class=\"sg\" data-s=\"3\">Das sind Methoden eines Metaobjekts.<\/span> <span class=\"sg\" data-s=\"4\">Mit ihnen können Sie in einen Typ hineinsehen.<\/span> <span class=\"sg\" data-s=\"5\">Mit dem MOP können Sie einer Klasse sogar Methoden hinzufügen.<\/span> <span class=\"sg\" data-s=\"6\">Das geht, während das Programm läuft.<\/span><\/p>"]]},"nl":{"t":"Het metaobjectprotocol","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku beschrijft een ander object elke klasse, rol en elk type.<\/span> <span class=\"sg\" data-s=\"1\">Dit object is zijn <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Het metaobject kent de naam van het type.<\/span> <span class=\"sg\" data-s=\"3\">Het kent de attributen en de methoden van het type.<\/span> <span class=\"sg\" data-s=\"4\">Het weet ook waar het type in de overervingsboom staat.<\/span> <span class=\"sg\" data-s=\"5\">De manier om deze metaobjecten te gebruiken is het <em>metaobjectprotocol<\/em>, of MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Je gebruikte er al een klein deel van: <code>.^name<\/code> is een MOP-aanroep.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie legt de <code>.^<\/code>-syntaxis goed uit.<\/span> <span class=\"sg\" data-s=\"2\">Ze toont de nuttigste metamethoden.<\/span> <span class=\"sg\" data-s=\"3\">Dat zijn methoden van een metaobject.<\/span> <span class=\"sg\" data-s=\"4\">Daarmee kun je in een type kijken.<\/span> <span class=\"sg\" data-s=\"5\">Met het MOP kun je zelfs methoden aan een klasse toevoegen.<\/span> <span class=\"sg\" data-s=\"6\">Dat kan terwijl het programma draait.<\/span><\/p>"]]},"es":{"t":"El protocolo de metaobjetos 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En Raku, otro objeto describe cada clase, rol y tipo.<\/span> <span class=\"sg\" data-s=\"1\">Este objeto es su <em>metaobjeto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">El metaobjeto conoce el nombre del tipo.<\/span> <span class=\"sg\" data-s=\"3\">Conoce los atributos y los métodos del tipo.<\/span> <span class=\"sg\" data-s=\"4\">También sabe dónde está el tipo en el árbol de herencia.<\/span> <span class=\"sg\" data-s=\"5\">La forma de usar estos metaobjetos es el <em>protocolo de metaobjetos<\/em>, o MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ya has usado una parte pequeña de él: <code>.^name<\/code> es una llamada al MOP.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección explica bien la sintaxis <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Muestra los metamétodos más útiles.<\/span> <span class=\"sg\" data-s=\"3\">Son métodos de un metaobjeto.<\/span> <span class=\"sg\" data-s=\"4\">Con ellos, puedes mirar dentro de un tipo.<\/span> <span class=\"sg\" data-s=\"5\">Con el MOP, incluso puedes añadir métodos a una clase.<\/span> <span class=\"sg\" data-s=\"6\">Puedes hacerlo mientras el programa se ejecuta.<\/span><\/p>"]]},"it":{"t":"Il protocollo dei metaoggetti 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku, un altro oggetto descrive ogni classe, ruolo e tipo.<\/span> <span class=\"sg\" data-s=\"1\">Questo oggetto è il suo <em>metaoggetto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Il metaoggetto conosce il nome del tipo.<\/span> <span class=\"sg\" data-s=\"3\">Conosce gli attributi e i metodi del tipo.<\/span> <span class=\"sg\" data-s=\"4\">Sa anche dove si trova il tipo nell'albero dell'ereditarietà.<\/span> <span class=\"sg\" data-s=\"5\">Il modo per usare questi metaoggetti è il <em>protocollo dei metaoggetti<\/em>, o MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ne hai già usato una piccola parte: <code>.^name<\/code> è una chiamata MOP.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione spiega bene la sintassi <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mostra i metametodi più utili.<\/span> <span class=\"sg\" data-s=\"3\">Sono metodi di un metaoggetto.<\/span> <span class=\"sg\" data-s=\"4\">Con loro puoi guardare dentro un tipo.<\/span> <span class=\"sg\" data-s=\"5\">Con il MOP puoi perfino aggiungere metodi a una classe.<\/span> <span class=\"sg\" data-s=\"6\">Puoi farlo mentre il programma gira.<\/span><\/p>"]]},"lv":{"t":"Metaobjektu protokols 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Raku valodā katru klasi, lomu un tipu apraksta cits objekts.<\/span> <span class=\"sg\" data-s=\"1\">Šis objekts ir tā <em>metaobjekts<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Metaobjekts zina tipa nosaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Tas zina tipa atribūtus un metodes.<\/span> <span class=\"sg\" data-s=\"4\">Tas zina arī, kur tips ir mantošanas kokā.<\/span> <span class=\"sg\" data-s=\"5\">Veids, kā lietot šos metaobjektus, ir <em>metaobjektu protokols<\/em> jeb MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Jūs jau lietojāt mazu tā daļu: <code>.^name<\/code> ir MOP izsaukums.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa kārtīgi izskaidro <code>.^<\/code> sintaksi.<\/span> <span class=\"sg\" data-s=\"2\">Tā parāda noderīgākās metametodes.<\/span> <span class=\"sg\" data-s=\"3\">Tās ir metaobjekta metodes.<\/span> <span class=\"sg\" data-s=\"4\">Ar tām jūs varat ieskatīties tipa iekšā.<\/span> <span class=\"sg\" data-s=\"5\">Ar MOP jūs varat pat pievienot klasei metodes.<\/span> <span class=\"sg\" data-s=\"6\">Jūs to varat darīt, kamēr programma darbojas.<\/span><\/p>"]]},"ru":{"t":"Протокол метаобъектов 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В Raku у каждого класса, роли и типа есть другой объект, который его описывает.<\/span> <span class=\"sg\" data-s=\"1\">Этот объект — его <em>метаобъект<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Метаобъект знает имя типа.<\/span> <span class=\"sg\" data-s=\"3\">Он знает атрибуты и методы типа.<\/span> <span class=\"sg\" data-s=\"4\">Ещё он знает, где тип стоит в дереве наследования.<\/span> <span class=\"sg\" data-s=\"5\">Способ работать с этими метаобъектами — это <em>протокол метаобъектов<\/em>, или MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Вы уже пользовались маленькой частью MOP: <code>.^name<\/code> — это вызов MOP.<\/span> <span class=\"sg\" data-s=\"1\">Этот раздел как следует объясняет синтаксис <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он показывает самые полезные метаметоды.<\/span> <span class=\"sg\" data-s=\"3\">Это методы метаобъекта.<\/span> <span class=\"sg\" data-s=\"4\">С ними можно заглянуть внутрь типа.<\/span> <span class=\"sg\" data-s=\"5\">С MOP можно даже добавлять методы в класс.<\/span> <span class=\"sg\" data-s=\"6\">Это можно делать, пока программа работает.<\/span><\/p>"]]},"uk":{"t":"Метаоб'єктний протокол","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">У Raku кожен клас, роль і тип описує інший об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Цей об'єкт — його <em>метаоб'єкт<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Метаоб'єкт знає ім'я типу.<\/span> <span class=\"sg\" data-s=\"3\">Він знає атрибути й методи типу.<\/span> <span class=\"sg\" data-s=\"4\">Він також знає, де тип стоїть у дереві успадкування.<\/span> <span class=\"sg\" data-s=\"5\">Спосіб працювати з цими метаоб'єктами — це <em>метаоб'єктний протокол<\/em>, або MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися малою частиною MOP: <code>.^name<\/code> — це виклик MOP.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ як слід пояснює синтаксис <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він показує найкорисніші метаметоди.<\/span> <span class=\"sg\" data-s=\"3\">Це методи метаоб'єкта.<\/span> <span class=\"sg\" data-s=\"4\">З ними можна зазирнути всередину типу.<\/span> <span class=\"sg\" data-s=\"5\">З MOP можна навіть додавати методи до класу.<\/span> <span class=\"sg\" data-s=\"6\">Це можна робити, поки програма працює.<\/span><\/p>"]]},"bg":{"t":"Протоколът на метаобектите","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В Raku друг обект описва всеки клас, роля и тип.<\/span> <span class=\"sg\" data-s=\"1\">Този обект е неговият <em>метаобект<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Метаобектът знае името на типа.<\/span> <span class=\"sg\" data-s=\"3\">Той знае атрибутите и методите на типа.<\/span> <span class=\"sg\" data-s=\"4\">Той знае и къде е типът в дървото на наследяване.<\/span> <span class=\"sg\" data-s=\"5\">Начинът да използвате тези метаобекти е <em>протоколът на метаобектите<\/em>, или MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Вече използвахте малка част от него: <code>.^name<\/code> е извикване към MOP.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел обяснява добре синтаксиса <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той показва най-полезните метаметоди.<\/span> <span class=\"sg\" data-s=\"3\">Това са методи на метаобекта.<\/span> <span class=\"sg\" data-s=\"4\">С тях можете да погледнете вътре в типа.<\/span> <span class=\"sg\" data-s=\"5\">С MOP можете дори да добавяте методи към клас.<\/span> <span class=\"sg\" data-s=\"6\">Можете да го правите, докато програмата работи.<\/span><\/p>"]]},"eo":{"t":"La metaobjekta protokolo 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En Raku, alia objekto priskribas ĉiun klason, rolon kaj tipon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu objekto estas ĝia <em>metaobjekto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La metaobjekto konas la nomon de la tipo.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi konas la atributojn kaj la metodojn de la tipo.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ scias, kie la tipo estas en la arbo de heredo.<\/span> <span class=\"sg\" data-s=\"5\">La maniero uzi ĉi tiujn metaobjektojn estas la <em>metaobjekta protokolo<\/em>, aŭ MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis malgrandan parton de ĝi: <code>.^name<\/code> estas MOP-voko.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio bone klarigas la sintakson <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi montras la plej utilajn metametodojn.<\/span> <span class=\"sg\" data-s=\"3\">Ili estas metodoj de metaobjekto.<\/span> <span class=\"sg\" data-s=\"4\">Per ili, vi povas rigardi en tipon.<\/span> <span class=\"sg\" data-s=\"5\">Per la MOP, vi eĉ povas aldoni metodojn al klaso.<\/span> <span class=\"sg\" data-s=\"6\">Vi povas fari tion dum la programo ruliĝas.<\/span><\/p>"]]},"la":{"t":"Protocollum metaobjectorum 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In Raku, aliud obiectum omnem classem, partem et genus describit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc obiectum est eius <em>metaobiectum<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Metaobiectum nomen generis novit.<\/span> <span class=\"sg\" data-s=\"3\">Attributa et methodos generis novit.<\/span> <span class=\"sg\" data-s=\"4\">Etiam locum generis in arbore hereditatis novit.<\/span> <span class=\"sg\" data-s=\"5\">Modus his metaobiectis utendi est <em>protocollum metaobiectorum<\/em>, sive MOP.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Parvam eius portionem iam adhibuisti: <code>.^name<\/code> est vocatio MOP.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio syntaxin <code>.^<\/code> recte explicat.<\/span> <span class=\"sg\" data-s=\"2\">Metamethodos utilissimas ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Hae sunt methodi metaobiecti.<\/span> <span class=\"sg\" data-s=\"4\">Cum eis intra genus inspicere potes.<\/span> <span class=\"sg\" data-s=\"5\">Per MOP etiam methodos classi addere potes.<\/span> <span class=\"sg\" data-s=\"6\">Hoc facere potes dum programma currit.<\/span><\/p>"]]}}}</script>
