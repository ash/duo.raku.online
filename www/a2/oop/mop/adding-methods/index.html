s=\"sg\" data-s=\"4\">Die Idee sieht so aus.<\/span> <span class=\"sg\" data-s=\"5\">Sie schreiben <code>class<\/code>, <code>role<\/code>, <code>has<\/code> oder <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Dann baut der Compiler Ihren Typ für Sie.<\/span> <span class=\"sg\" data-s=\"7\">Er benutzt dafür MOP-Methoden wie <code>.^add_method<\/code> und <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Wir sagen nicht ohne Grund „die Idee“.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein Modell der Sprache.<\/span> <span class=\"sg\" data-s=\"2\">Es ist kein Versprechen für einen bestimmten Compiler.<\/span> <span class=\"sg\" data-s=\"3\">Das Objektsystem ist über das MOP <em>definiert<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Eine Implementierung ist ein Compiler für Raku.<\/span> <span class=\"sg\" data-s=\"5\">Schickt sie wirklich jede Deklaration durch diese Metamethoden?<\/span> <span class=\"sg\" data-s=\"6\">Und können Sie das sehen?<\/span> <span class=\"sg\" data-s=\"7\">Das entscheidet jede Implementierung selbst.<\/span> <span class=\"sg\" data-s=\"8\">Sie können diese Metamethoden auch selbst <em>aufrufen<\/em>.<\/span> <span class=\"sg\" data-s=\"9\">Aus demselben Grund hängt das Ergebnis dann von der Implementierung ab.<\/span> <span class=\"sg\" data-s=\"10\">Compiler können Ihnen verschiedene Metamethoden geben.<\/span> <span class=\"sg\" data-s=\"11\">Diese Methoden können auch verschieden arbeiten.<\/span> <span class=\"sg\" data-s=\"12\">Code kann <code>.^add_method<\/code> und ähnliche Methoden benutzen.<\/span> <span class=\"sg\" data-s=\"13\">So ein Code läuft vielleicht nicht auf jedem Raku gleich.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Sie können Methoden hinzufügen, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein starkes Werkzeug.<\/span> <span class=\"sg\" data-s=\"2\">Aber Sie brauchen es selten.<\/span> <span class=\"sg\" data-s=\"3\">Die meisten Programme benutzen es nie.<\/span> <span class=\"sg\" data-s=\"4\">Aber es macht das Objektsystem von Raku offen.<\/span> <span class=\"sg\" data-s=\"5\">Auch die Regeln für Klassen sind mit dem MOP geschrieben.<\/span> <span class=\"sg\" data-s=\"6\">Also können Sie diese Regeln erweitern.<\/span> <span class=\"sg\" data-s=\"7\">Für alltäglichen Code brauchen Sie einen anderen Teil des MOP.<\/span> <span class=\"sg\" data-s=\"8\">Sie haben ihn im vorigen Thema gesehen.<\/span> <span class=\"sg\" data-s=\"9\">Das sind die Metamethoden, die in Typen hineinsehen.<\/span><\/p>"]]},"nl":{"t":"Methoden toevoegen tijdens het draaien","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het MOP is niet alleen om in typen te kijken.<\/span> <span class=\"sg\" data-s=\"1\">Het kan een type ook <strong>veranderen<\/strong> terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"2\">De metamethode <code>.^add_method<\/code> voegt een nieuwe methode aan een klasse toe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Empty<\/code> heeft helemaal geen methoden.<\/span> <span class=\"sg\" data-s=\"1\">Dan voegt <code>Empty.^add_method('greet', …)<\/code> er een methode aan toe.<\/span> <span class=\"sg\" data-s=\"2\">Ze heet <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De methode zelf is een anonieme <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Anoniem betekent dat ze geen naam heeft.<\/span> <span class=\"sg\" data-s=\"5\">Daarna kun je <code>.greet<\/code> aanroepen op elk <code>Empty<\/code>-object.<\/span> <span class=\"sg\" data-s=\"6\">Het werkt alsof je de methode in de klasse schreef.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Dit is echte metaprogrammering.<\/span> <span class=\"sg\" data-s=\"1\">Metaprogrammering is code die met code werkt.<\/span> <span class=\"sg\" data-s=\"2\">Hier vragen we het metaobject van <code>Empty<\/code> om een nieuwe methode te laten groeien.<\/span> <span class=\"sg\" data-s=\"3\">Hetzelfde protocol zit achter dingen die je al gebruikt.<\/span> <span class=\"sg\" data-s=\"4\">Dit is het idee.<\/span> <span class=\"sg\" data-s=\"5\">Je schrijft <code>class<\/code>, <code>role<\/code>, <code>has<\/code> of <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Dan bouwt de compiler je type voor je.<\/span> <span class=\"sg\" data-s=\"7\">Hij gebruikt daarvoor MOP-methoden als <code>.^add_method<\/code> en <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">We zeggen niet zomaar “het idee”.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een model van de taal.<\/span> <span class=\"sg\" data-s=\"2\">Het is geen belofte over één bepaalde compiler.<\/span> <span class=\"sg\" data-s=\"3\">Het objectsysteem is <em>gedefinieerd<\/em> via het MOP.<\/span> <span class=\"sg\" data-s=\"4\">Een implementatie is een compiler voor Raku.<\/span> <span class=\"sg\" data-s=\"5\">Stuurt ze echt elke declaratie via deze metamethoden?<\/span> <span class=\"sg\" data-s=\"6\">En kun je dat zien?<\/span> <span class=\"sg\" data-s=\"7\">Elke implementatie beslist dat zelf.<\/span> <span class=\"sg\" data-s=\"8\">Je kunt deze metamethoden ook zelf <em>aanroepen<\/em>.<\/span> <span class=\"sg\" data-s=\"9\">Om dezelfde reden hangt het resultaat dan af van de implementatie.<\/span> <span class=\"sg\" data-s=\"10\">Compilers kunnen je verschillende metamethoden geven.<\/span> <span class=\"sg\" data-s=\"11\">Deze methoden kunnen ook op verschillende manieren werken.<\/span> <span class=\"sg\" data-s=\"12\">Code kan <code>.^add_method<\/code> en vergelijkbare methoden gebruiken.<\/span> <span class=\"sg\" data-s=\"13\">Zulke code draait misschien niet op elke Raku op dezelfde manier.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Je kunt methoden toevoegen terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een krachtig gereedschap.<\/span> <span class=\"sg\" data-s=\"2\">Maar je hebt het zelden nodig.<\/span> <span class=\"sg\" data-s=\"3\">De meeste programma's gebruiken het nooit.<\/span> <span class=\"sg\" data-s=\"4\">Maar het maakt het objectsysteem van Raku open.<\/span> <span class=\"sg\" data-s=\"5\">De regels van klassen zijn ook met het MOP geschreven.<\/span> <span class=\"sg\" data-s=\"6\">Dus kun je deze regels uitbreiden.<\/span> <span class=\"sg\" data-s=\"7\">Voor gewone code heb je een ander deel van het MOP nodig.<\/span> <span class=\"sg\" data-s=\"8\">Je zag het in het vorige onderwerp.<\/span> <span class=\"sg\" data-s=\"9\">Dat zijn de metamethoden die in typen kijken.<\/span><\/p>"]]},"es":{"t":"Añadir métodos en tiempo de ejecución","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El MOP no sirve solo para mirar dentro de los tipos.<\/span> <span class=\"sg\" data-s=\"1\">También puede <strong>cambiar<\/strong> un tipo mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"2\">El metamétodo <code>.^add_method<\/code> añade un método nuevo a una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Empty<\/code> no tiene ningún método.<\/span> <span class=\"sg\" data-s=\"1\">Después <code>Empty.^add_method('greet', …)<\/code> le añade un método.<\/span> <span class=\"sg\" data-s=\"2\">Su nombre es <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El método mismo es un <code>method { … }<\/code> anónimo.<\/span> <span class=\"sg\" data-s=\"4\">Anónimo significa que no tiene nombre.<\/span> <span class=\"sg\" data-s=\"5\">Después de eso, puedes llamar a <code>.greet<\/code> sobre cada objeto <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Funciona igual que un método escrito en la clase.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Esto es metaprogramación de verdad.<\/span> <span class=\"sg\" data-s=\"1\">Metaprogramación significa código que trabaja con código.<\/span> <span class=\"sg\" data-s=\"2\">Aquí, le decimos al metaobjeto de <code>Empty<\/code> que cree un método nuevo.<\/span> <span class=\"sg\" data-s=\"3\">El mismo protocolo está detrás de cosas que ya usas.<\/span> <span class=\"sg\" data-s=\"4\">Esta es la idea.<\/span> <span class=\"sg\" data-s=\"5\">Escribes <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Entonces el compilador construye tu tipo por ti.<\/span> <span class=\"sg\" data-s=\"7\">Usa métodos del MOP como <code>.^add_method<\/code> y <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Decimos «la idea» por una razón.<\/span> <span class=\"sg\" data-s=\"1\">Esto es un modelo del lenguaje.<\/span> <span class=\"sg\" data-s=\"2\">No es una promesa sobre un compilador concreto.<\/span> <span class=\"sg\" data-s=\"3\">El sistema de objetos está <em>definido<\/em> a través del MOP.<\/span> <span class=\"sg\" data-s=\"4\">Una implementación es un compilador de Raku.<\/span> <span class=\"sg\" data-s=\"5\">¿Envía de verdad cada declaración a través de estos metamétodos?<\/span> <span class=\"sg\" data-s=\"6\">¿Y puedes ver esto?<\/span> <span class=\"sg\" data-s=\"7\">Cada implementación lo decide por sí misma.<\/span> <span class=\"sg\" data-s=\"8\">También puedes <em>llamar<\/em> tú mismo a estos metamétodos.<\/span> <span class=\"sg\" data-s=\"9\">Por la misma razón, el resultado depende de la implementación.<\/span> <span class=\"sg\" data-s=\"10\">Los compiladores pueden darte metamétodos distintos.<\/span> <span class=\"sg\" data-s=\"11\">Estos métodos también pueden funcionar de formas distintas.<\/span> <span class=\"sg\" data-s=\"12\">El código puede usar <code>.^add_method<\/code> y métodos parecidos.<\/span> <span class=\"sg\" data-s=\"13\">Ese código quizás no funciona igual en todos los Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Puedes añadir métodos mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"1\">Es una herramienta potente.<\/span> <span class=\"sg\" data-s=\"2\">Pero casi nunca la necesitas.<\/span> <span class=\"sg\" data-s=\"3\">La mayoría de los programas nunca la usan.<\/span> <span class=\"sg\" data-s=\"4\">Pero gracias a ella, el sistema de objetos de Raku es abierto.<\/span> <span class=\"sg\" data-s=\"5\">Las reglas de las clases también están escritas con el MOP.<\/span> <span class=\"sg\" data-s=\"6\">Así que puedes ampliar estas reglas.<\/span> <span class=\"sg\" data-s=\"7\">Para el código de todos los días, necesitas otra parte del MOP.<\/span> <span class=\"sg\" data-s=\"8\">La has visto en el tema anterior.<\/span> <span class=\"sg\" data-s=\"9\">Son los metamétodos que miran dentro de los tipos.<\/span><\/p>"]]},"it":{"t":"Aggiungere metodi a runtime","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il MOP non serve solo per guardare dentro i tipi.<\/span> <span class=\"sg\" data-s=\"1\">Può anche <strong>cambiare<\/strong> un tipo mentre il programma gira.<\/span> <span class=\"sg\" data-s=\"2\">Il metametodo <code>.^add_method<\/code> aggiunge un nuovo metodo a una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La classe <code>Empty<\/code> non ha nessun metodo.<\/span> <span class=\"sg\" data-s=\"1\">Poi <code>Empty.^add_method('greet', …)<\/code> le aggiunge un metodo.<\/span> <span class=\"sg\" data-s=\"2\">Il suo nome è <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il metodo stesso è un <code>method { … }<\/code> anonimo.<\/span> <span class=\"sg\" data-s=\"4\">Anonimo vuol dire che non ha un nome.<\/span> <span class=\"sg\" data-s=\"5\">Dopo, puoi chiamare <code>.greet<\/code> su ogni oggetto <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Funziona come un metodo scritto nella classe.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Questa è vera metaprogrammazione.<\/span> <span class=\"sg\" data-s=\"1\">Metaprogrammazione vuol dire codice che lavora con il codice.<\/span> <span class=\"sg\" data-s=\"2\">Qui diciamo al metaoggetto di <code>Empty<\/code> di far crescere un nuovo metodo.<\/span> <span class=\"sg\" data-s=\"3\">Lo stesso protocollo sta dietro a cose che usi già.<\/span> <span class=\"sg\" data-s=\"4\">Ecco l'idea.<\/span> <span class=\"sg\" data-s=\"5\">Scrivi <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Poi il compilatore costruisce il tuo tipo per te.<\/span> <span class=\"sg\" data-s=\"7\">Usa metodi MOP come <code>.^add_method<\/code> e <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Diciamo «l'idea» per un motivo.<\/span> <span class=\"sg\" data-s=\"1\">Questo è un modello del linguaggio.<\/span> <span class=\"sg\" data-s=\"2\">Non è una promessa su un compilatore preciso.<\/span> <span class=\"sg\" data-s=\"3\">Il sistema a oggetti è <em>definito<\/em> attraverso il MOP.<\/span> <span class=\"sg\" data-s=\"4\">Un'implementazione è un compilatore per Raku.<\/span> <span class=\"sg\" data-s=\"5\">Manda davvero ogni dichiarazione attraverso questi metametodi?<\/span> <span class=\"sg\" data-s=\"6\">E tu puoi vederlo?<\/span> <span class=\"sg\" data-s=\"7\">Ogni implementazione lo decide da sola.<\/span> <span class=\"sg\" data-s=\"8\">Puoi anche <em>chiamare<\/em> tu stesso questi metametodi.<\/span> <span class=\"sg\" data-s=\"9\">Per lo stesso motivo, il risultato dipende dall'implementazione.<\/span> <span class=\"sg\" data-s=\"10\">I compilatori possono darti metametodi diversi.<\/span> <span class=\"sg\" data-s=\"11\">Questi metodi possono anche funzionare in modi diversi.<\/span> <span class=\"sg\" data-s=\"12\">Il codice può usare <code>.^add_method<\/code> e metodi simili.<\/span> <span class=\"sg\" data-s=\"13\">Un codice così può non girare allo stesso modo su ogni Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Puoi aggiungere metodi mentre il programma gira.<\/span> <span class=\"sg\" data-s=\"1\">Questo è uno strumento potente.<\/span> <span class=\"sg\" data-s=\"2\">Ma ti serve di rado.<\/span> <span class=\"sg\" data-s=\"3\">La maggior parte dei programmi non lo usa mai.<\/span> <span class=\"sg\" data-s=\"4\">Ma rende aperto il sistema a oggetti di Raku.<\/span> <span class=\"sg\" data-s=\"5\">Anche le regole delle classi sono scritte con il MOP.<\/span> <span class=\"sg\" data-s=\"6\">Quindi puoi aggiungere cose a queste regole.<\/span> <span class=\"sg\" data-s=\"7\">Per il codice di tutti i giorni, ti serve un'altra parte del MOP.<\/span> <span class=\"sg\" data-s=\"8\">L'hai vista nell'argomento precedente.<\/span> <span class=\"sg\" data-s=\"9\">Sono i metametodi che guardano dentro i tipi.<\/span><\/p>"]]},"lv":{"t":"Metožu pievienošana izpildes laikā","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP nav tikai tam, lai ieskatītos tipos.<\/span> <span class=\"sg\" data-s=\"1\">Tas var arī <strong>mainīt<\/strong> tipu, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"2\">Metametode <code>.^add_method<\/code> pievieno klasei jaunu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Klasei <code>Empty<\/code> nav nevienas metodes.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>Empty.^add_method('greet', …)<\/code> pievieno tai metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tās nosaukums ir <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pati metode ir anonīma <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Anonīma nozīmē, ka tai nav nosaukuma.<\/span> <span class=\"sg\" data-s=\"5\">Pēc tam jūs varat izsaukt <code>.greet<\/code> uz katra <code>Empty<\/code> objekta.<\/span> <span class=\"sg\" data-s=\"6\">Tas strādā tā, it kā jūs būtu uzrakstījuši metodi klasē.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Šī ir īsta metaprogrammēšana.<\/span> <span class=\"sg\" data-s=\"1\">Metaprogrammēšana nozīmē kodu, kas strādā ar kodu.<\/span> <span class=\"sg\" data-s=\"2\">Šeit mēs liekam <code>Empty<\/code> metaobjektam izaudzēt jaunu metodi.<\/span> <span class=\"sg\" data-s=\"3\">Tas pats protokols ir aiz lietām, ko jūs jau izmantojat.<\/span> <span class=\"sg\" data-s=\"4\">Ideja ir šāda.<\/span> <span class=\"sg\" data-s=\"5\">Jūs rakstāt <code>class<\/code>, <code>role<\/code>, <code>has<\/code> vai <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tad kompilators jūsu vietā uzbūvē jūsu tipu.<\/span> <span class=\"sg\" data-s=\"7\">Tas lieto MOP metodes, piemēram, <code>.^add_method<\/code> un <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Mēs sakām «ideja», un tam ir iemesls.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir valodas modelis.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav solījums par kādu vienu kompilatoru.<\/span> <span class=\"sg\" data-s=\"3\">Objektu sistēma ir <em>definēta<\/em> caur MOP.<\/span> <span class=\"sg\" data-s=\"4\">Implementācija ir Raku kompilators.<\/span> <span class=\"sg\" data-s=\"5\">Vai tā tiešām sūta katru deklarāciju caur šīm metametodēm?<\/span> <span class=\"sg\" data-s=\"6\">Un vai jūs to varat redzēt?<\/span> <span class=\"sg\" data-s=\"7\">Katra implementācija to izlemj pati.<\/span> <span class=\"sg\" data-s=\"8\">Jūs varat arī paši <em>izsaukt<\/em> šīs metametodes.<\/span> <span class=\"sg\" data-s=\"9\">Tā paša iemesla dēļ rezultāts ir atkarīgs no implementācijas.<\/span> <span class=\"sg\" data-s=\"10\">Kompilatori var dot jums dažādas metametodes.<\/span> <span class=\"sg\" data-s=\"11\">Šīs metodes var arī strādāt dažādi.<\/span> <span class=\"sg\" data-s=\"12\">Kods var lietot <code>.^add_method<\/code> un līdzīgas metodes.<\/span> <span class=\"sg\" data-s=\"13\">Šāds kods var nestrādāt vienādi katrā Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Jūs varat pievienot metodes, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir spēcīgs rīks.<\/span> <span class=\"sg\" data-s=\"2\">Bet jums to vajag reti.<\/span> <span class=\"sg\" data-s=\"3\">Vairums programmu to nekad nelieto.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas padara Raku objektu sistēmu atvērtu.<\/span> <span class=\"sg\" data-s=\"5\">Arī klašu likumi ir uzrakstīti ar MOP.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc jūs varat šiem likumiem kaut ko pievienot.<\/span> <span class=\"sg\" data-s=\"7\">Ikdienas kodam jums vajag citu MOP daļu.<\/span> <span class=\"sg\" data-s=\"8\">Jūs to redzējāt iepriekšējā tematā.<\/span> <span class=\"sg\" data-s=\"9\">Tās ir metametodes, kas ieskatās tipu iekšā.<\/span><\/p>"]]},"ru":{"t":"Добавление методов во время выполнения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP нужен не только, чтобы заглядывать внутрь типов.<\/span> <span class=\"sg\" data-s=\"1\">Он может и <strong>менять<\/strong> тип, пока программа работает.<\/span> <span class=\"sg\" data-s=\"2\">Метаметод <code>.^add_method<\/code> добавляет в класс новый метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У класса <code>Empty<\/code> совсем нет методов.<\/span> <span class=\"sg\" data-s=\"1\">Потом <code>Empty.^add_method('greet', …)<\/code> добавляет ему метод.<\/span> <span class=\"sg\" data-s=\"2\">Его имя — <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Сам метод — это анонимный <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Анонимный значит, что у него нет имени.<\/span> <span class=\"sg\" data-s=\"5\">После этого можно вызывать <code>.greet<\/code> у любого объекта <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Это работает так, как будто вы написали метод в классе.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Это настоящее метапрограммирование.<\/span> <span class=\"sg\" data-s=\"1\">Метапрограммирование — это код, который работает с кодом.<\/span> <span class=\"sg\" data-s=\"2\">Здесь мы просим метаобъект <code>Empty<\/code> отрастить новый метод.<\/span> <span class=\"sg\" data-s=\"3\">Тот же протокол стоит за вещами, которыми вы уже пользуетесь.<\/span> <span class=\"sg\" data-s=\"4\">Идея такая.<\/span> <span class=\"sg\" data-s=\"5\">Вы пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тогда компилятор строит ваш тип за вас.<\/span> <span class=\"sg\" data-s=\"7\">Он использует MOP-методы, например <code>.^add_method<\/code> и <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Мы говорим «идея» не просто так.<\/span> <span class=\"sg\" data-s=\"1\">Это модель языка.<\/span> <span class=\"sg\" data-s=\"2\">Это не обещание про какой-то один компилятор.<\/span> <span class=\"sg\" data-s=\"3\">Объектная система <em>определена<\/em> через MOP.<\/span> <span class=\"sg\" data-s=\"4\">Реализация — это компилятор для Raku.<\/span> <span class=\"sg\" data-s=\"5\">Правда ли он пропускает каждое объявление через эти метаметоды?<\/span> <span class=\"sg\" data-s=\"6\">И можно ли это увидеть?<\/span> <span class=\"sg\" data-s=\"7\">Каждая реализация решает это сама.<\/span> <span class=\"sg\" data-s=\"8\">Ещё вы можете сами <em>вызывать<\/em> эти метаметоды.<\/span> <span class=\"sg\" data-s=\"9\">По той же причине результат зависит от реализации.<\/span> <span class=\"sg\" data-s=\"10\">Компиляторы могут давать вам разные метаметоды.<\/span> <span class=\"sg\" data-s=\"11\">Эти методы могут и работать по-разному.<\/span> <span class=\"sg\" data-s=\"12\">Код может использовать <code>.^add_method<\/code> и похожие методы.<\/span> <span class=\"sg\" data-s=\"13\">Такой код может работать не одинаково в каждом Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Методы можно добавлять, пока программа работает.<\/span> <span class=\"sg\" data-s=\"1\">Это мощный инструмент.<\/span> <span class=\"sg\" data-s=\"2\">Но он нужен редко.<\/span> <span class=\"sg\" data-s=\"3\">Большинство программ никогда им не пользуются.<\/span> <span class=\"sg\" data-s=\"4\">Но он делает объектную систему Raku открытой.<\/span> <span class=\"sg\" data-s=\"5\">Правила классов тоже написаны с помощью MOP.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому эти правила можно дополнять.<\/span> <span class=\"sg\" data-s=\"7\">Для обычного кода вам нужна другая часть MOP.<\/span> <span class=\"sg\" data-s=\"8\">Вы видели её в прошлой теме.<\/span> <span class=\"sg\" data-s=\"9\">Это метаметоды, которые заглядывают внутрь типов.<\/span><\/p>"]]},"uk":{"t":"Додавання методів під час виконання","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP потрібен не лише для того, щоб зазирати всередину типів.<\/span> <span class=\"sg\" data-s=\"1\">Він може й <strong>змінити<\/strong> тип, поки програма працює.<\/span> <span class=\"sg\" data-s=\"2\">Метаметод <code>.^add_method<\/code> додає до класу новий метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Empty<\/code> зовсім не має методів.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>Empty.^add_method('greet', …)<\/code> додає до нього метод.<\/span> <span class=\"sg\" data-s=\"2\">Його ім'я — <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Сам метод — це анонімний <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Анонімний означає, що він не має імені.<\/span> <span class=\"sg\" data-s=\"5\">Після цього можна викликати <code>.greet<\/code> для кожного об'єкта <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Це працює так, наче ви написали метод у класі.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Це справжнє метапрограмування.<\/span> <span class=\"sg\" data-s=\"1\">Метапрограмування — це код, який працює з кодом.<\/span> <span class=\"sg\" data-s=\"2\">Тут ми кажемо метаоб'єкту <code>Empty<\/code> виростити новий метод.<\/span> <span class=\"sg\" data-s=\"3\">Той самий протокол стоїть за речами, якими ви вже користуєтеся.<\/span> <span class=\"sg\" data-s=\"4\">Ось ідея.<\/span> <span class=\"sg\" data-s=\"5\">Ви пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> чи <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тоді компілятор будує ваш тип за вас.<\/span> <span class=\"sg\" data-s=\"7\">Він використовує методи MOP на зразок <code>.^add_method<\/code> та <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Ми кажемо «ідея» не просто так.<\/span> <span class=\"sg\" data-s=\"1\">Це модель мови.<\/span> <span class=\"sg\" data-s=\"2\">Це не обіцянка про якийсь один компілятор.<\/span> <span class=\"sg\" data-s=\"3\">Об'єктну систему <em>визначено<\/em> через MOP.<\/span> <span class=\"sg\" data-s=\"4\">Реалізація — це компілятор для Raku.<\/span> <span class=\"sg\" data-s=\"5\">Чи справді вона пропускає кожне оголошення через ці метаметоди?<\/span> <span class=\"sg\" data-s=\"6\">І чи можна це побачити?<\/span> <span class=\"sg\" data-s=\"7\">Кожна реалізація вирішує це сама.<\/span> <span class=\"sg\" data-s=\"8\">Ви також можете самі <em>викликати<\/em> ці метаметоди.<\/span> <span class=\"sg\" data-s=\"9\">З тієї самої причини результат залежить від реалізації.<\/span> <span class=\"sg\" data-s=\"10\">Компілятори можуть давати вам різні метаметоди.<\/span> <span class=\"sg\" data-s=\"11\">Ці методи також можуть працювати по-різному.<\/span> <span class=\"sg\" data-s=\"12\">Код може використовувати <code>.^add_method<\/code> і схожі методи.<\/span> <span class=\"sg\" data-s=\"13\">Такий код може працювати не однаково в кожному Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Методи можна додавати, поки програма працює.<\/span> <span class=\"sg\" data-s=\"1\">Це потужний інструмент.<\/span> <span class=\"sg\" data-s=\"2\">Але він рідко потрібен.<\/span> <span class=\"sg\" data-s=\"3\">Більшість програм ніколи ним не користуються.<\/span> <span class=\"sg\" data-s=\"4\">Але саме він робить об'єктну систему Raku відкритою.<\/span> <span class=\"sg\" data-s=\"5\">Правила класів теж написані через MOP.<\/span> <span class=\"sg\" data-s=\"6\">Тож ці правила можна доповнювати.<\/span> <span class=\"sg\" data-s=\"7\">Для щоденного коду вам потрібна інша частина MOP.<\/span> <span class=\"sg\" data-s=\"8\">Ви бачили її в попередній темі.<\/span> <span class=\"sg\" data-s=\"9\">Це метаметоди, які зазирають усередину типів.<\/span><\/p>"]]},"bg":{"t":"Добавяне на методи по време на изпълнение","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP не е само за разглеждане на типове.<\/span> <span class=\"sg\" data-s=\"1\">Той може и да <strong>променя<\/strong> тип, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"2\">Метаметодът <code>.^add_method<\/code> добавя нов метод към клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Empty<\/code> няма никакви методи.<\/span> <span class=\"sg\" data-s=\"1\">После <code>Empty.^add_method('greet', …)<\/code> добавя метод към него.<\/span> <span class=\"sg\" data-s=\"2\">Името му е <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Самият метод е анонимен <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Анонимен значи, че няма име.<\/span> <span class=\"sg\" data-s=\"5\">След това можете да извикате <code>.greet<\/code> върху всеки обект <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Това работи, все едно сте написали метода в класа.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Това е истинско метапрограмиране.<\/span> <span class=\"sg\" data-s=\"1\">Метапрограмирането е код, който работи с код.<\/span> <span class=\"sg\" data-s=\"2\">Тук казваме на метаобекта на <code>Empty<\/code> да си създаде нов метод.<\/span> <span class=\"sg\" data-s=\"3\">Същият протокол стои зад неща, които вече използвате.<\/span> <span class=\"sg\" data-s=\"4\">Ето идеята.<\/span> <span class=\"sg\" data-s=\"5\">Пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тогава компилаторът изгражда вашия тип вместо вас.<\/span> <span class=\"sg\" data-s=\"7\">Той използва методи на MOP като <code>.^add_method<\/code> и <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Казваме „идеята“ с причина.<\/span> <span class=\"sg\" data-s=\"1\">Това е модел на езика.<\/span> <span class=\"sg\" data-s=\"2\">Това не е обещание за някой определен компилатор.<\/span> <span class=\"sg\" data-s=\"3\">Обектната система е <em>дефинирана<\/em> чрез MOP.<\/span> <span class=\"sg\" data-s=\"4\">Реализацията е компилатор за Raku.<\/span> <span class=\"sg\" data-s=\"5\">Наистина ли тя праща всяка декларация през тези метаметоди?<\/span> <span class=\"sg\" data-s=\"6\">И можете ли да видите това?<\/span> <span class=\"sg\" data-s=\"7\">Всяка реализация решава това сама.<\/span> <span class=\"sg\" data-s=\"8\">Можете и сами да <em>извиквате<\/em> тези метаметоди.<\/span> <span class=\"sg\" data-s=\"9\">По същата причина резултатът зависи от реализацията.<\/span> <span class=\"sg\" data-s=\"10\">Компилаторите могат да ви дават различни метаметоди.<\/span> <span class=\"sg\" data-s=\"11\">Тези методи могат и да работят по различен начин.<\/span> <span class=\"sg\" data-s=\"12\">Кодът може да използва <code>.^add_method<\/code> и подобни методи.<\/span> <span class=\"sg\" data-s=\"13\">Такъв код може да не работи еднакво във всеки Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Можете да добавяте методи, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"1\">Това е мощен инструмент.<\/span> <span class=\"sg\" data-s=\"2\">Но рядко ви трябва.<\/span> <span class=\"sg\" data-s=\"3\">Повечето програми никога не го използват.<\/span> <span class=\"sg\" data-s=\"4\">Но той прави обектната система на Raku отворена.<\/span> <span class=\"sg\" data-s=\"5\">Правилата на класовете също са написани с MOP.<\/span> <span class=\"sg\" data-s=\"6\">Затова можете да добавяте към тези правила.<\/span> <span class=\"sg\" data-s=\"7\">За ежедневния код ви трябва друга част от MOP.<\/span> <span class=\"sg\" data-s=\"8\">Видяхте я в предишната тема.<\/span> <span class=\"sg\" data-s=\"9\">Това са метаметодите, които гледат вътре в типовете.<\/span><\/p>"]]},"eo":{"t":"Aldoni metodojn dum la rulado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La MOP ne estas nur por rigardi en tipojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ povas <strong>ŝanĝi<\/strong> tipon dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">La metametodo <code>.^add_method<\/code> aldonas novan metodon al klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La klaso <code>Empty<\/code> havas tute neniujn metodojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste <code>Empty.^add_method('greet', …)<\/code> aldonas metodon al ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia nomo estas <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La metodo mem estas anonima <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Anonima signifas, ke ĝi ne havas nomon.<\/span> <span class=\"sg\" data-s=\"5\">Post tio, vi povas voki <code>.greet<\/code> sur ĉiu objekto <code>Empty<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi funkcias, kvazaŭ vi skribus la metodon en la klaso.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas vera meta-programado.<\/span> <span class=\"sg\" data-s=\"1\">Meta-programado signifas kodon, kiu laboras kun kodo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie, ni petas la metaobjekton de <code>Empty<\/code> kreskigi novan metodon.<\/span> <span class=\"sg\" data-s=\"3\">La sama protokolo estas malantaŭ aferoj, kiujn vi jam uzas.<\/span> <span class=\"sg\" data-s=\"4\">Jen la ideo.<\/span> <span class=\"sg\" data-s=\"5\">Vi skribas <code>class<\/code>, <code>role<\/code>, <code>has<\/code> aŭ <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tiam la kompililo konstruas vian tipon por vi.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi uzas MOP-metodojn kiel <code>.^add_method<\/code> kaj <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Ni havas kialon diri «la ideo».<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas modelo de la lingvo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne estas promeso pri iu certa kompililo.<\/span> <span class=\"sg\" data-s=\"3\">La objekta sistemo estas <em>difinita<\/em> per la MOP.<\/span> <span class=\"sg\" data-s=\"4\">Realigo estas kompililo por Raku.<\/span> <span class=\"sg\" data-s=\"5\">Ĉu ĝi vere sendas ĉiun deklaron tra ĉi tiuj metametodoj?<\/span> <span class=\"sg\" data-s=\"6\">Kaj ĉu vi povas vidi tion?<\/span> <span class=\"sg\" data-s=\"7\">Ĉiu realigo mem decidas tion.<\/span> <span class=\"sg\" data-s=\"8\">Vi ankaŭ povas mem <em>voki<\/em> ĉi tiujn metametodojn.<\/span> <span class=\"sg\" data-s=\"9\">Pro la sama kialo, la rezulto dependas de la realigo.<\/span> <span class=\"sg\" data-s=\"10\">Kompililoj povas doni al vi malsamajn metametodojn.<\/span> <span class=\"sg\" data-s=\"11\">Ĉi tiuj metodoj ankaŭ povas funkcii en malsamaj manieroj.<\/span> <span class=\"sg\" data-s=\"12\">Kodo povas uzi <code>.^add_method<\/code> kaj similajn metodojn.<\/span> <span class=\"sg\" data-s=\"13\">Tia kodo eble ne ruliĝas same sur ĉiu Raku.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Vi povas aldoni metodojn dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas potenca ilo.<\/span> <span class=\"sg\" data-s=\"2\">Sed vi malofte bezonas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">La plej multaj programoj neniam uzas ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Sed ĝi faras la objektan sistemon de Raku malfermita.<\/span> <span class=\"sg\" data-s=\"5\">La reguloj de klasoj ankaŭ estas skribitaj per la MOP.<\/span> <span class=\"sg\" data-s=\"6\">Do vi povas aldoni al ĉi tiuj reguloj.<\/span> <span class=\"sg\" data-s=\"7\">Por ĉiutaga kodo, vi bezonas alian parton de la MOP.<\/span> <span class=\"sg\" data-s=\"8\">Vi vidis ĝin en la antaŭa temo.<\/span> <span class=\"sg\" data-s=\"9\">Ili estas la metametodoj, kiuj rigardas en tipojn.<\/span><\/p>"]]},"la":{"t":"Methodos dum exsecutione addere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP non solum genera intus inspicit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam genus <strong>mutare<\/strong> potest dum programma currit.<\/span> <span class=\"sg\" data-s=\"2\">Metamethodus <code>.^add_method<\/code> novam methodum classi addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Classis <code>Empty<\/code> nullas omnino methodos habet.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>Empty.^add_method('greet', …)<\/code> ei methodum addit.<\/span> <span class=\"sg\" data-s=\"2\">Nomen eius est <code>greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ipsa methodus est anonyma <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Anonyma significat: nomen non habet.<\/span> <span class=\"sg\" data-s=\"5\">Postea <code>.greet<\/code> in omni obiecto <code>Empty<\/code> vocare potes.<\/span> <span class=\"sg\" data-s=\"6\">Operatur sicut methodus in classe scripta.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Haec est vera metaprogrammatio.<\/span> <span class=\"sg\" data-s=\"1\">Metaprogrammatio est codex qui cum codice operatur.<\/span> <span class=\"sg\" data-s=\"2\">Hic metaobiectum classis <code>Empty<\/code> novam methodum facere iubemus.<\/span> <span class=\"sg\" data-s=\"3\">Idem protocollum post res stat quas iam adhibes.<\/span> <span class=\"sg\" data-s=\"4\">Ecce idea.<\/span> <span class=\"sg\" data-s=\"5\">Scribis <code>class<\/code>, <code>role<\/code>, <code>has<\/code> vel <code>method<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tum compilator genus tuum pro te aedificat.<\/span> <span class=\"sg\" data-s=\"7\">Methodis MOP utitur, sicut <code>.^add_method<\/code> et <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",14,"<p><span class=\"sg\" data-s=\"0\">Non sine causa «ideam» dicimus.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est exemplar linguae.<\/span> <span class=\"sg\" data-s=\"2\">Non est promissum de uno compilatore.<\/span> <span class=\"sg\" data-s=\"3\">Systema obiectorum per MOP <em>definitur<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Implementatio est compilator pro Raku.<\/span> <span class=\"sg\" data-s=\"5\">Mittitne revera omnem declarationem per has metamethodos?<\/span> <span class=\"sg\" data-s=\"6\">Et potesne hoc videre?<\/span> <span class=\"sg\" data-s=\"7\">Quaeque implementatio hoc ipsa decernit.<\/span> <span class=\"sg\" data-s=\"8\">Has metamethodos etiam ipse <em>vocare<\/em> potes.<\/span> <span class=\"sg\" data-s=\"9\">Eadem de causa, effectus ab implementatione pendet.<\/span> <span class=\"sg\" data-s=\"10\">Compilatores tibi diversas metamethodos dare possunt.<\/span> <span class=\"sg\" data-s=\"11\">Hae methodi etiam diversis modis operari possunt.<\/span> <span class=\"sg\" data-s=\"12\">Codex <code>.^add_method<\/code> et similes methodos adhibere potest.<\/span> <span class=\"sg\" data-s=\"13\">Talis codex fortasse non in omni Raku eodem modo currit.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Methodos addere potes dum programma currit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est instrumentum potens.<\/span> <span class=\"sg\" data-s=\"2\">Sed raro eo eges.<\/span> <span class=\"sg\" data-s=\"3\">Pleraque programmata eo numquam utuntur.<\/span> <span class=\"sg\" data-s=\"4\">Sed systema obiectorum Raku apertum facit.<\/span> <span class=\"sg\" data-s=\"5\">Etiam regulae classium cum MOP scriptae sunt.<\/span> <span class=\"sg\" data-s=\"6\">Itaque has regulas augere potes.<\/span> <span class=\"sg\" data-s=\"7\">Pro codice cotidiano, aliam portionem MOP requiris.<\/span> <span class=\"sg\" data-s=\"8\">Eam in argumento superiore vidisti.<\/span> <span class=\"sg\" data-s=\"9\">Hae sunt metamethodi quae intra genera inspiciunt.<\/span><\/p>"]]}}}</script>
