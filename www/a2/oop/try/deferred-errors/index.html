<script type="application/json" id="page-data">{"u":"oop/try/deferred-errors","n":925,"k":"topic","pv":"oop/try","nx":"oop/try/exercises","tr":["oop","oop/try"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Not every error is immediate","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">An exception is a kind of error.<\/span> <span class=\"sg\" data-s=\"1\">Normally, a thrown exception stops the program at once.<\/span> <span class=\"sg\" data-s=\"2\">You catch it with <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">But some errors only look fatal.<\/span> <span class=\"sg\" data-s=\"4\">They do not stop your program at the moment they happen.<\/span> <span class=\"sg\" data-s=\"5\">In Raku, some failures stay quiet.<\/span> <span class=\"sg\" data-s=\"6\">Some of them react only later, when you use the result.<\/span> <span class=\"sg\" data-s=\"7\">Others let you look at them, and your program goes on.<\/span> <span class=\"sg\" data-s=\"8\">You already saw two of them in this part.<\/span> <span class=\"sg\" data-s=\"9\">It is useful to see them together in one place.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>A division by zero.<\/strong> It does not fail on its own line.<\/span> <span class=\"sg\" data-s=\"1\">The program makes the bad value and keeps it quietly.<\/span> <span class=\"sg\" data-s=\"2\">The value throws an exception only when you <em>use<\/em> it.<\/span> <span class=\"sg\" data-s=\"3\">For example, you print it or change it into another type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The page <a href=\"/oop/failures/\">Soft failures<\/a> explains this late reaction.<\/span> <span class=\"sg\" data-s=\"1\">It also explains the <code>Failure<\/code> objects behind it.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>A failing external program.<\/strong> <code>run<\/code> and <code>shell<\/code> return a <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes the program fails.<\/span> <span class=\"sg\" data-s=\"2\">Its <code>Proc<\/code> does not throw an exception at that moment.<\/span> <span class=\"sg\" data-s=\"3\">It throws only in one case.<\/span> <span class=\"sg\" data-s=\"4\">That is when you <em>throw away<\/em> the <code>Proc<\/code> without handling it.<\/span> <span class=\"sg\" data-s=\"5\">So keep the <code>Proc<\/code> and read <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Or check if it is true or false.<\/span> <span class=\"sg\" data-s=\"7\">Then the failure stays a simple value.<\/span> <span class=\"sg\" data-s=\"8\">You can react to it.<\/span> <span class=\"sg\" data-s=\"9\">You saw this in <a href=\"/oop/external-programs/the-proc-object/\">The Proc object<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Both cases have one thing in common.<\/span> <span class=\"sg\" data-s=\"1\">A failure can be <em>deferred<\/em>, or put off until later.<\/span> <span class=\"sg\" data-s=\"2\">Then it does not crash the program at once.<\/span> <span class=\"sg\" data-s=\"3\">It becomes a value.<\/span> <span class=\"sg\" data-s=\"4\">You look at this value when you are ready.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> and the <code>CATCH<\/code> phaser handle errors that are thrown at once.<\/span> <span class=\"sg\" data-s=\"6\">The two ways on this page handle the other errors.<\/span><\/p>"]]},"de":{"t":"Nicht jeder Fehler tritt sofort auf","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme ist eine Art Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Normalerweise hält eine geworfene Ausnahme das Programm sofort an.<\/span> <span class=\"sg\" data-s=\"2\">Sie fangen sie mit <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Aber manche Fehler sehen nur fatal aus.<\/span> <span class=\"sg\" data-s=\"4\">Sie halten Ihr Programm nicht sofort an, wenn sie passieren.<\/span> <span class=\"sg\" data-s=\"5\">In Raku bleiben manche Fehlschläge still.<\/span> <span class=\"sg\" data-s=\"6\">Manche davon reagieren erst später, wenn Sie das Ergebnis benutzen.<\/span> <span class=\"sg\" data-s=\"7\">Andere lassen sich ansehen, und Ihr Programm läuft weiter.<\/span> <span class=\"sg\" data-s=\"8\">Zwei davon haben Sie in diesem Teil schon gesehen.<\/span> <span class=\"sg\" data-s=\"9\">Es ist nützlich, sie zusammen an einer Stelle zu sehen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Eine Division durch null.<\/strong> Die Division schlägt nicht in ihrer eigenen Zeile fehl.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm erzeugt den schlechten Wert und behält ihn ohne Meldung.<\/span> <span class=\"sg\" data-s=\"2\">Der Wert wirft erst eine Ausnahme, wenn Sie ihn <em>benutzen<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel geben Sie ihn aus oder wandeln ihn in einen anderen Typ um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Seite <a href=\"https://course.raku.org/de/oop/failures/\" target=\"_blank\" rel=\"noopener\">Weiche Fehlschläge<\/a> erklärt diese späte Reaktion.<\/span> <span class=\"sg\" data-s=\"1\">Die Seite erklärt auch die <code>Failure<\/code>-Objekte dahinter.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Ein fehlschlagendes externes Programm.<\/strong> <code>run<\/code> und <code>shell<\/code> geben ein <code>Proc<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal schlägt das Programm fehl.<\/span> <span class=\"sg\" data-s=\"2\">Sein <code>Proc<\/code> wirft in diesem Moment keine Ausnahme.<\/span> <span class=\"sg\" data-s=\"3\">Es wirft nur in einem Fall.<\/span> <span class=\"sg\" data-s=\"4\">Nämlich dann, wenn Sie das <code>Proc<\/code> ohne Behandlung <em>wegwerfen<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Behalten Sie also das <code>Proc<\/code> und lesen Sie <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Oder prüfen Sie, ob es wahr oder falsch ist.<\/span> <span class=\"sg\" data-s=\"7\">Dann bleibt der Fehlschlag ein einfacher Wert.<\/span> <span class=\"sg\" data-s=\"8\">Sie können darauf reagieren.<\/span> <span class=\"sg\" data-s=\"9\">Das haben Sie in <a href=\"https://course.raku.org/de/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Das Proc-Objekt<\/a> gesehen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Beide Fälle haben etwas gemeinsam.<\/span> <span class=\"sg\" data-s=\"1\">Ein Fehlschlag kann <em>aufgeschoben<\/em> werden, also auf später verschoben.<\/span> <span class=\"sg\" data-s=\"2\">Dann lässt er das Programm nicht sofort abstürzen.<\/span> <span class=\"sg\" data-s=\"3\">Er wird zu einem Wert.<\/span> <span class=\"sg\" data-s=\"4\">Sie sehen sich diesen Wert an, wenn Sie bereit sind.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> und der <code>CATCH<\/code>-Phaser behandeln Fehler, die sofort geworfen werden.<\/span> <span class=\"sg\" data-s=\"6\">Die zwei Wege auf dieser Seite behandeln die anderen Fehler.<\/span><\/p>"]]},"nl":{"t":"Niet elke fout is onmiddellijk","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Een exceptie is een soort fout.<\/span> <span class=\"sg\" data-s=\"1\">Normaal stopt een geworpen exceptie het programma meteen.<\/span> <span class=\"sg\" data-s=\"2\">Je vangt hem met <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Maar sommige fouten lijken alleen fataal.<\/span> <span class=\"sg\" data-s=\"4\">Ze stoppen je programma niet op het moment dat ze gebeuren.<\/span> <span class=\"sg\" data-s=\"5\">In Raku blijven sommige mislukkingen stil.<\/span> <span class=\"sg\" data-s=\"6\">Sommige reageren pas later, als je het resultaat gebruikt.<\/span> <span class=\"sg\" data-s=\"7\">Bij andere kun je ernaar kijken, en je programma gaat door.<\/span> <span class=\"sg\" data-s=\"8\">Je hebt er in dit deel al twee gezien.<\/span> <span class=\"sg\" data-s=\"9\">Het is handig om ze samen op één plek te zien.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Een deling door nul.<\/strong> Die gaat niet mis op haar eigen regel.<\/span> <span class=\"sg\" data-s=\"1\">Het programma maakt de slechte waarde en houdt die stil vast.<\/span> <span class=\"sg\" data-s=\"2\">De waarde werpt pas een exceptie als je haar <em>gebruikt<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Je drukt haar bijvoorbeeld af, of je zet haar om naar een ander type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De pagina <a href=\"https://course.raku.org/nl/oop/failures/\" target=\"_blank\" rel=\"noopener\">Zachte mislukkingen<\/a> legt deze late reactie uit.<\/span> <span class=\"sg\" data-s=\"1\">Die legt ook de <code>Failure<\/code>-objecten erachter uit.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Een mislukkend extern programma.<\/strong> <code>run<\/code> en <code>shell<\/code> geven een <code>Proc<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Soms mislukt het programma.<\/span> <span class=\"sg\" data-s=\"2\">Zijn <code>Proc<\/code> werpt op dat moment geen exceptie.<\/span> <span class=\"sg\" data-s=\"3\">Dat gebeurt alleen in één geval.<\/span> <span class=\"sg\" data-s=\"4\">Dat is als je de <code>Proc<\/code> <em>weggooit<\/em> zonder hem af te handelen.<\/span> <span class=\"sg\" data-s=\"5\">Bewaar de <code>Proc<\/code> dus en lees <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Of kijk of hij waar of onwaar is.<\/span> <span class=\"sg\" data-s=\"7\">Dan blijft de mislukking een gewone waarde.<\/span> <span class=\"sg\" data-s=\"8\">Je kunt erop reageren.<\/span> <span class=\"sg\" data-s=\"9\">Je zag dit in <a href=\"https://course.raku.org/nl/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Het Proc-object<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Beide gevallen hebben één ding gemeen.<\/span> <span class=\"sg\" data-s=\"1\">Een mislukking kan <em>uitgesteld<\/em> worden, of naar later geschoven.<\/span> <span class=\"sg\" data-s=\"2\">Dan laat ze het programma niet meteen crashen.<\/span> <span class=\"sg\" data-s=\"3\">Ze wordt een waarde.<\/span> <span class=\"sg\" data-s=\"4\">Je bekijkt deze waarde als je er klaar voor bent.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> en de <code>CATCH<\/code>-faser handelen fouten af die meteen geworpen worden.<\/span> <span class=\"sg\" data-s=\"6\">De twee manieren op deze pagina handelen de andere fouten af.<\/span><\/p>"]]},"es":{"t":"No todo error es inmediato","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Una excepción es un tipo de error.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente, una excepción lanzada detiene el programa enseguida.<\/span> <span class=\"sg\" data-s=\"2\">La capturas con <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Pero algunos errores solo parecen fatales.<\/span> <span class=\"sg\" data-s=\"4\">No detienen tu programa en el momento en que pasan.<\/span> <span class=\"sg\" data-s=\"5\">En Raku, algunos fallos se quedan callados.<\/span> <span class=\"sg\" data-s=\"6\">Algunos reaccionan solo más tarde, cuando usas el resultado.<\/span> <span class=\"sg\" data-s=\"7\">Otros te dejan mirarlos, y tu programa sigue.<\/span> <span class=\"sg\" data-s=\"8\">Ya viste dos de ellos en esta parte.<\/span> <span class=\"sg\" data-s=\"9\">Es útil verlos juntos en un solo lugar.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Una división por cero.<\/strong> No falla en su propia línea.<\/span> <span class=\"sg\" data-s=\"1\">El programa crea el valor malo y lo guarda en silencio.<\/span> <span class=\"sg\" data-s=\"2\">El valor lanza una excepción solo cuando lo <em>usas<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, lo imprimes o lo conviertes en otro tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La página <a href=\"https://course.raku.org/es/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallos blandos<\/a> explica esta reacción tardía.<\/span> <span class=\"sg\" data-s=\"1\">También explica los objetos <code>Failure<\/code> que hay detrás.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programa externo que falla.<\/strong> <code>run<\/code> y <code>shell<\/code> devuelven un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A veces el programa falla.<\/span> <span class=\"sg\" data-s=\"2\">Su <code>Proc<\/code> no lanza una excepción en ese momento.<\/span> <span class=\"sg\" data-s=\"3\">Solo la lanza en un caso.<\/span> <span class=\"sg\" data-s=\"4\">Es cuando <em>tiras<\/em> el <code>Proc<\/code> sin manejarlo.<\/span> <span class=\"sg\" data-s=\"5\">Así que guarda el <code>Proc<\/code> y lee <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">O comprueba si es verdadero o falso.<\/span> <span class=\"sg\" data-s=\"7\">Entonces el fallo sigue siendo un valor simple.<\/span> <span class=\"sg\" data-s=\"8\">Puedes reaccionar a él.<\/span> <span class=\"sg\" data-s=\"9\">Viste esto en <a href=\"https://course.raku.org/es/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">El objeto Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Los dos casos tienen una cosa en común.<\/span> <span class=\"sg\" data-s=\"1\">Un fallo puede <em>aplazarse<\/em>, es decir, dejarse para más tarde.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el programa no se cae enseguida.<\/span> <span class=\"sg\" data-s=\"3\">Se convierte en un valor.<\/span> <span class=\"sg\" data-s=\"4\">Miras este valor cuando estás listo.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> y el phaser <code>CATCH<\/code> manejan los errores que se lanzan enseguida.<\/span> <span class=\"sg\" data-s=\"6\">Las dos formas de esta página manejan los otros errores.<\/span><\/p>"]]},"it":{"t":"Non ogni errore è immediato","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Un'eccezione è un tipo di errore.<\/span> <span class=\"sg\" data-s=\"1\">Di solito un'eccezione sollevata ferma subito il programma.<\/span> <span class=\"sg\" data-s=\"2\">La intercetti con <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ma alcuni errori sembrano solo fatali.<\/span> <span class=\"sg\" data-s=\"4\">Non fermano il tuo programma nel momento in cui succedono.<\/span> <span class=\"sg\" data-s=\"5\">In Raku alcuni fallimenti restano silenziosi.<\/span> <span class=\"sg\" data-s=\"6\">Alcuni reagiscono solo dopo, quando usi il risultato.<\/span> <span class=\"sg\" data-s=\"7\">Altri ti lasciano guardarli, e il tuo programma va avanti.<\/span> <span class=\"sg\" data-s=\"8\">Ne hai già visti due in questa parte.<\/span> <span class=\"sg\" data-s=\"9\">È utile vederli insieme in un solo posto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Una divisione per zero.<\/strong> Non fallisce sulla sua riga.<\/span> <span class=\"sg\" data-s=\"1\">Il programma crea il valore sbagliato e lo tiene in silenzio.<\/span> <span class=\"sg\" data-s=\"2\">Il valore solleva un'eccezione solo quando lo <em>usi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, lo stampi o lo trasformi in un altro tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pagina <a href=\"https://course.raku.org/it/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallimenti morbidi<\/a> spiega questa reazione in ritardo.<\/span> <span class=\"sg\" data-s=\"1\">Spiega anche gli oggetti <code>Failure<\/code> che ci stanno dietro.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programma esterno che fallisce.<\/strong> <code>run<\/code> e <code>shell<\/code> restituiscono un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A volte il programma fallisce.<\/span> <span class=\"sg\" data-s=\"2\">Il suo <code>Proc<\/code> non solleva un'eccezione in quel momento.<\/span> <span class=\"sg\" data-s=\"3\">La solleva solo in un caso.<\/span> <span class=\"sg\" data-s=\"4\">Succede quando <em>butti via<\/em> il <code>Proc<\/code> senza gestirlo.<\/span> <span class=\"sg\" data-s=\"5\">Quindi conserva il <code>Proc<\/code> e leggi <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Oppure controlla se è vero o falso.<\/span> <span class=\"sg\" data-s=\"7\">Allora il fallimento resta un valore semplice.<\/span> <span class=\"sg\" data-s=\"8\">Puoi reagire a questo valore.<\/span> <span class=\"sg\" data-s=\"9\">Lo hai visto in <a href=\"https://course.raku.org/it/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">L'oggetto Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">I due casi hanno una cosa in comune.<\/span> <span class=\"sg\" data-s=\"1\">Un fallimento può essere <em>differito<\/em>, cioè rimandato a dopo.<\/span> <span class=\"sg\" data-s=\"2\">Allora non fa crollare subito il programma.<\/span> <span class=\"sg\" data-s=\"3\">Diventa un valore.<\/span> <span class=\"sg\" data-s=\"4\">Guardi questo valore quando sei pronto.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> e il phaser <code>CATCH<\/code> gestiscono gli errori sollevati subito.<\/span> <span class=\"sg\" data-s=\"6\">I due modi di questa pagina gestiscono gli altri errori.<\/span><\/p>"]]},"lv":{"t":"Ne katra kļūda parādās uzreiz","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Izņēmums ir kļūdas veids.<\/span> <span class=\"sg\" data-s=\"1\">Parasti izmests izņēmums uzreiz aptur programmu.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to noķerat ar <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bet dažas kļūdas tikai izskatās liktenīgas.<\/span> <span class=\"sg\" data-s=\"4\">Tās neaptur jūsu programmu tajā brīdī, kad tās notiek.<\/span> <span class=\"sg\" data-s=\"5\">Raku valodā dažas neveiksmes paliek klusas.<\/span> <span class=\"sg\" data-s=\"6\">Dažas no tām reaģē tikai vēlāk, kad jūs lietojat rezultātu.<\/span> <span class=\"sg\" data-s=\"7\">Citas ļauj jums tās apskatīt, un jūsu programma turpina darbu.<\/span> <span class=\"sg\" data-s=\"8\">Divas no tām jūs jau redzējāt šajā daļā.<\/span> <span class=\"sg\" data-s=\"9\">Ir noderīgi tās redzēt kopā vienuviet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli.<\/strong> Tā nerada kļūdu savā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Programma izveido slikto vērtību un klusi to patur.<\/span> <span class=\"sg\" data-s=\"2\">Vērtība izmet izņēmumu tikai tad, kad jūs to <em>izmantojat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, jūs to izdrukājat vai pārvēršat citā tipā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lapa <a href=\"https://course.raku.org/lv/oop/failures/\" target=\"_blank\" rel=\"noopener\">Mīkstās neveiksmes<\/a> izskaidro šo vēlo reakciju.<\/span> <span class=\"sg\" data-s=\"1\">Tā izskaidro arī <code>Failure<\/code> objektus aiz tās.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma.<\/strong> <code>run<\/code> un <code>shell<\/code> atgriež <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz programma neizdodas.<\/span> <span class=\"sg\" data-s=\"2\">Tās <code>Proc<\/code> tajā brīdī neizmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"3\">Tas izmet izņēmumu tikai vienā gadījumā.<\/span> <span class=\"sg\" data-s=\"4\">Tas ir tad, kad jūs <em>izmetat<\/em> <code>Proc<\/code> bez apstrādes.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc paturiet <code>Proc<\/code> un nolasiet <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Vai arī pārbaudiet, vai tas ir patiess vai aplams.<\/span> <span class=\"sg\" data-s=\"7\">Tad neveiksme paliek vienkārša vērtība.<\/span> <span class=\"sg\" data-s=\"8\">Jūs varat uz to reaģēt.<\/span> <span class=\"sg\" data-s=\"9\">To jūs redzējāt tematā <a href=\"https://course.raku.org/lv/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Proc objekts<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Abiem gadījumiem ir kas kopīgs.<\/span> <span class=\"sg\" data-s=\"1\">Neveiksmi var <em>atlikt<\/em> jeb atstāt uz vēlāku laiku.<\/span> <span class=\"sg\" data-s=\"2\">Tad programma uzreiz neavarē.<\/span> <span class=\"sg\" data-s=\"3\">Neveiksme kļūst par vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Jūs apskatāt šo vērtību, kad esat gatavi.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> un fāzeris <code>CATCH<\/code> apstrādā kļūdas, kas tiek izmestas uzreiz.<\/span> <span class=\"sg\" data-s=\"6\">Abi šīs lapas veidi apstrādā pārējās kļūdas.<\/span><\/p>"]]},"ru":{"t":"Не всякая ошибка возникает сразу","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Исключение — это вид ошибки.<\/span> <span class=\"sg\" data-s=\"1\">Обычно брошенное исключение сразу останавливает программу.<\/span> <span class=\"sg\" data-s=\"2\">Вы перехватываете его с помощью <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но некоторые ошибки только выглядят фатальными.<\/span> <span class=\"sg\" data-s=\"4\">Они не останавливают программу в тот момент, когда случаются.<\/span> <span class=\"sg\" data-s=\"5\">В Raku некоторые сбои ведут себя тихо.<\/span> <span class=\"sg\" data-s=\"6\">Одни реагируют только позже, когда вы используете результат.<\/span> <span class=\"sg\" data-s=\"7\">Другие дают вам посмотреть на них, а программа идёт дальше.<\/span> <span class=\"sg\" data-s=\"8\">Два таких сбоя вы уже видели в этой части.<\/span> <span class=\"sg\" data-s=\"9\">Полезно увидеть их вместе в одном месте.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль.<\/strong> Оно не даёт сбоя прямо в своей строке.<\/span> <span class=\"sg\" data-s=\"1\">Программа создаёт плохое значение и тихо хранит его.<\/span> <span class=\"sg\" data-s=\"2\">Значение бросает исключение, только когда вы его <em>используете<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Например, вы его печатаете или превращаете в другой тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # здесь ошибки нет\nsay 'still running';\nsay $x;           # только теперь бросается исключение<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Страница <a href=\"https://course.raku.org/ru/oop/failures/\" target=\"_blank\" rel=\"noopener\">Мягкие сбои<\/a> объясняет эту позднюю реакцию.<\/span> <span class=\"sg\" data-s=\"1\">Ещё она объясняет объекты <code>Failure<\/code>, которые стоят за ней.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Внешняя программа, которая дала сбой.<\/strong> <code>run<\/code> и <code>shell<\/code> возвращают <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Иногда программа даёт сбой.<\/span> <span class=\"sg\" data-s=\"2\">Её <code>Proc<\/code> не бросает исключение в этот момент.<\/span> <span class=\"sg\" data-s=\"3\">Он бросает его только в одном случае.<\/span> <span class=\"sg\" data-s=\"4\">Это когда вы <em>выбрасываете<\/em> <code>Proc<\/code> и не обрабатываете его.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому сохраните <code>Proc<\/code> и прочитайте <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Или проверьте, истинен он или ложен.<\/span> <span class=\"sg\" data-s=\"7\">Тогда сбой остаётся простым значением.<\/span> <span class=\"sg\" data-s=\"8\">На него можно отреагировать.<\/span> <span class=\"sg\" data-s=\"9\">Вы видели это в теме <a href=\"https://course.raku.org/ru/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Объект Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">У обоих случаев есть одна общая черта.<\/span> <span class=\"sg\" data-s=\"1\">Сбой можно <em>отложить<\/em>, то есть оставить на потом.<\/span> <span class=\"sg\" data-s=\"2\">Тогда программа из-за него не падает сразу.<\/span> <span class=\"sg\" data-s=\"3\">Он становится значением.<\/span> <span class=\"sg\" data-s=\"4\">Вы смотрите на это значение, когда готовы.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> и фазер <code>CATCH<\/code> обрабатывают ошибки, которые бросаются сразу.<\/span> <span class=\"sg\" data-s=\"6\">Два способа с этой страницы обрабатывают другие ошибки.<\/span><\/p>"]]},"uk":{"t":"Не кожна помилка негайна","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Виняток — це вид помилки.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай кинутий виняток одразу зупиняє програму.<\/span> <span class=\"sg\" data-s=\"2\">Ви перехоплюєте його через <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Але деякі помилки лише здаються фатальними.<\/span> <span class=\"sg\" data-s=\"4\">Вони не зупиняють програму в ту мить, коли стаються.<\/span> <span class=\"sg\" data-s=\"5\">У Raku деякі збої поводяться тихо.<\/span> <span class=\"sg\" data-s=\"6\">Деякі з них реагують лише пізніше, коли ви використовуєте результат.<\/span> <span class=\"sg\" data-s=\"7\">Інші дозволяють вам подивитися на них, і програма працює далі.<\/span> <span class=\"sg\" data-s=\"8\">Два з них ви вже бачили в цій частині.<\/span> <span class=\"sg\" data-s=\"9\">Корисно побачити їх разом в одному місці.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль.<\/strong> Воно не падає у своєму рядку.<\/span> <span class=\"sg\" data-s=\"1\">Програма створює погане значення й тихо тримає його.<\/span> <span class=\"sg\" data-s=\"2\">Значення кидає виняток, лише коли ви його <em>використовуєте<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ви виводите його або перетворюєте на інший тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тут помилки немає\nsay 'still running';\nsay $x;           # ось тепер вона кидається<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сторінка <a href=\"https://course.raku.org/uk/oop/failures/\" target=\"_blank\" rel=\"noopener\">М'які збої<\/a> пояснює цю пізню реакцію.<\/span> <span class=\"sg\" data-s=\"1\">Вона також пояснює об'єкти <code>Failure<\/code>, які за нею стоять.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, яка не спрацювала.<\/strong> <code>run<\/code> і <code>shell<\/code> повертають <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Іноді програма не спрацьовує.<\/span> <span class=\"sg\" data-s=\"2\">Її <code>Proc<\/code> не кидає винятку в цю мить.<\/span> <span class=\"sg\" data-s=\"3\">Він кидає виняток лише в одному випадку.<\/span> <span class=\"sg\" data-s=\"4\">Це коли ви <em>викидаєте<\/em> <code>Proc<\/code> і не обробляєте його.<\/span> <span class=\"sg\" data-s=\"5\">Тож збережіть <code>Proc<\/code> і прочитайте <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Або перевірте, істинний він чи хибний.<\/span> <span class=\"sg\" data-s=\"7\">Тоді збій лишається простим значенням.<\/span> <span class=\"sg\" data-s=\"8\">Ви можете на нього відреагувати.<\/span> <span class=\"sg\" data-s=\"9\">Ви бачили це в темі <a href=\"https://course.raku.org/uk/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Об'єкт Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Обидва випадки мають одну спільну рису.<\/span> <span class=\"sg\" data-s=\"1\">Збій можна <em>відкласти<\/em>, тобто перенести на потім.<\/span> <span class=\"sg\" data-s=\"2\">Тоді програма не падає одразу.<\/span> <span class=\"sg\" data-s=\"3\">Збій стає значенням.<\/span> <span class=\"sg\" data-s=\"4\">Ви дивитеся на це значення, коли готові.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> і фазер <code>CATCH<\/code> обробляють помилки, які кидаються одразу.<\/span> <span class=\"sg\" data-s=\"6\">Два способи з цієї сторінки обробляють інші помилки.<\/span><\/p>"]]},"bg":{"t":"Не всяка грешка е незабавна","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Изключението е вид грешка.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено хвърленото изключение спира програмата веднага.<\/span> <span class=\"sg\" data-s=\"2\">Прихващате го с <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но някои грешки само изглеждат фатални.<\/span> <span class=\"sg\" data-s=\"4\">Те не спират програмата ви в момента, в който се случат.<\/span> <span class=\"sg\" data-s=\"5\">В Raku някои провали остават тихи.<\/span> <span class=\"sg\" data-s=\"6\">Някои от тях реагират едва по-късно, когато използвате резултата.<\/span> <span class=\"sg\" data-s=\"7\">Други ви оставят да ги разгледате, а програмата ви продължава.<\/span> <span class=\"sg\" data-s=\"8\">Вече видяхте два от тях в тази част.<\/span> <span class=\"sg\" data-s=\"9\">Полезно е да ги видим заедно на едно място.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на нула.<\/strong> То не дава грешка на своя ред.<\/span> <span class=\"sg\" data-s=\"1\">Програмата създава лошата стойност и тихо я пази.<\/span> <span class=\"sg\" data-s=\"2\">Стойността хвърля изключение едва когато я <em>използвате<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Например я отпечатвате или я превръщате в друг тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тук няма грешка\nsay 'still running';\nsay $x;           # чак сега хвърля<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Страницата <a href=\"https://course.raku.org/bg/oop/failures/\" target=\"_blank\" rel=\"noopener\">Меки провали<\/a> обяснява тази късна реакция.<\/span> <span class=\"sg\" data-s=\"1\">Тя обяснява и обектите <code>Failure<\/code> зад нея.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма.<\/strong> <code>run<\/code> и <code>shell<\/code> връщат <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Понякога програмата се проваля.<\/span> <span class=\"sg\" data-s=\"2\">Нейният <code>Proc<\/code> не хвърля изключение в този момент.<\/span> <span class=\"sg\" data-s=\"3\">Той хвърля изключение само в един случай.<\/span> <span class=\"sg\" data-s=\"4\">Това е, когато <em>изхвърлите<\/em> <code>Proc<\/code>, без да го обработите.<\/span> <span class=\"sg\" data-s=\"5\">Затова запазете <code>Proc<\/code> и прочетете <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Или проверете дали той е истина, или лъжа.<\/span> <span class=\"sg\" data-s=\"7\">Тогава провалът остава проста стойност.<\/span> <span class=\"sg\" data-s=\"8\">Можете да реагирате на нея.<\/span> <span class=\"sg\" data-s=\"9\">Видяхте това в <a href=\"https://course.raku.org/bg/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Обектът Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Двата случая имат нещо общо.<\/span> <span class=\"sg\" data-s=\"1\">Провалът може да бъде <em>отложен<\/em>, тоест оставен за по-късно.<\/span> <span class=\"sg\" data-s=\"2\">Тогава той не срива програмата веднага.<\/span> <span class=\"sg\" data-s=\"3\">Той става стойност.<\/span> <span class=\"sg\" data-s=\"4\">Вие гледате тази стойност, когато сте готови.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> и фазерът <code>CATCH<\/code> обработват грешките, които се хвърлят веднага.<\/span> <span class=\"sg\" data-s=\"6\">Двата начина на тази страница обработват другите грешки.<\/span><\/p>"]]},"eo":{"t":"Ne ĉiu eraro estas tuja","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Escepto estas speco de eraro.<\/span> <span class=\"sg\" data-s=\"1\">Normale, ĵetita escepto tuj haltigas la programon.<\/span> <span class=\"sg\" data-s=\"2\">Vi kaptas ĝin per <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sed kelkaj eraroj nur aspektas fatalaj.<\/span> <span class=\"sg\" data-s=\"4\">Ili ne haltigas vian programon en la momento, kiam ili okazas.<\/span> <span class=\"sg\" data-s=\"5\">En Raku, kelkaj misfunkcioj restas kvietaj.<\/span> <span class=\"sg\" data-s=\"6\">Kelkaj el ili reagas nur poste, kiam vi uzas la rezulton.<\/span> <span class=\"sg\" data-s=\"7\">Aliaj lasas vin rigardi ilin, kaj via programo daŭras.<\/span> <span class=\"sg\" data-s=\"8\">Vi jam vidis du el ili en ĉi tiu parto.<\/span> <span class=\"sg\" data-s=\"9\">Estas utile vidi ilin kune en unu loko.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Divido per nulo.<\/strong> Ĝi ne malsukcesas en sia propra linio.<\/span> <span class=\"sg\" data-s=\"1\">La programo faras la malbonan valoron kaj kviete tenas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">La valoro ĵetas escepton nur, kiam vi <em>uzas<\/em> ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, vi presas ĝin aŭ ŝanĝas ĝin al alia tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # neniu eraro ĉi tie\nsay 'still running';\nsay $x;           # nur nun ĝi ĵetas<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La paĝo <a href=\"https://course.raku.org/eo/oop/failures/\" target=\"_blank\" rel=\"noopener\">Molaj misfunkcioj<\/a> klarigas ĉi tiun malfruan reagon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ klarigas la objektojn <code>Failure<\/code> malantaŭ ĝi.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Malsukcesanta ekstera programo.<\/strong> <code>run<\/code> kaj <code>shell<\/code> redonas <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Foje la programo malsukcesas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia <code>Proc<\/code> ne ĵetas escepton en tiu momento.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ĵetas nur en unu kazo.<\/span> <span class=\"sg\" data-s=\"4\">Tio estas, kiam vi <em>forĵetas<\/em> la <code>Proc<\/code> sen trakti ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Do tenu la <code>Proc<\/code> kaj legu <code>.exitcode<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Aŭ kontrolu, ĉu ĝi estas vera aŭ malvera.<\/span> <span class=\"sg\" data-s=\"7\">Tiam la misfunkcio restas simpla valoro.<\/span> <span class=\"sg\" data-s=\"8\">Vi povas reagi al ĝi.<\/span> <span class=\"sg\" data-s=\"9\">Vi vidis tion en <a href=\"https://course.raku.org/eo/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">La objekto Proc<\/a>.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ kazoj havas unu komunan aferon.<\/span> <span class=\"sg\" data-s=\"1\">Misfunkcio povas esti <em>prokrastita<\/em>, tio estas, lasita por poste.<\/span> <span class=\"sg\" data-s=\"2\">Tiam ĝi ne tuj kolapsigas la programon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi fariĝas valoro.<\/span> <span class=\"sg\" data-s=\"4\">Vi rigardas ĉi tiun valoron, kiam vi estas preta.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> kaj la fazero <code>CATCH<\/code> traktas erarojn, kiujn Raku ĵetas tuj.<\/span> <span class=\"sg\" data-s=\"6\">La du manieroj sur ĉi tiu paĝo traktas la aliajn erarojn.<\/span><\/p>"]]},"la":{"t":"Non omnis error statim apparet","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Exceptio est genus erroris.<\/span> <span class=\"sg\" data-s=\"1\">Plerumque exceptio iacta programma statim sistit.<\/span> <span class=\"sg\" data-s=\"2\">Eam per <code>try<\/code> capis.<\/span> <span class=\"sg\" data-s=\"3\">Sed quidam errores solum fatales videntur.<\/span> <span class=\"sg\" data-s=\"4\">Cum accidunt, programma tuum non sistunt.<\/span> <span class=\"sg\" data-s=\"5\">In Raku quidam defectus taciti manent.<\/span> <span class=\"sg\" data-s=\"6\">Quidam eorum solum postea reagunt, cum effectum adhibes.<\/span> <span class=\"sg\" data-s=\"7\">Alii te sinunt eos inspicere, et programma tuum pergit.<\/span> <span class=\"sg\" data-s=\"8\">Duos eorum iam in hac parte vidisti.<\/span> <span class=\"sg\" data-s=\"9\">Utile est eos simul uno loco videre.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Divisio per nihil.<\/strong> In sua linea non deficit.<\/span> <span class=\"sg\" data-s=\"1\">Programma valorem malum facit et tacite servat.<\/span> <span class=\"sg\" data-s=\"2\">Valor exceptionem solum iacit cum eum <em>adhibes<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, eum imprimis aut in alium typum mutas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # nullus error hic\nsay 'still running';\nsay $x;           # solum nunc iacit<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pagina <a href=\"https://course.raku.org/la/oop/failures/\" target=\"_blank\" rel=\"noopener\">Defectus molles<\/a> hanc tardam reactionem explicat.<\/span> <span class=\"sg\" data-s=\"1\">Etiam obiecta <code>Failure<\/code> explicat quae post eam sunt.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\"><strong>Programma externum deficiens.<\/strong> <code>run<\/code> et <code>shell<\/code> obiectum <code>Proc<\/code> reddunt.<\/span> <span class=\"sg\" data-s=\"1\">Interdum programma deficit.<\/span> <span class=\"sg\" data-s=\"2\"><code>Proc<\/code> eius eo momento exceptionem non iacit.<\/span> <span class=\"sg\" data-s=\"3\">Solum uno casu iacit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc fit cum <code>Proc<\/code> sine tractatione <em>abicis<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Itaque <code>Proc<\/code> serva et <code>.exitcode<\/code> lege.<\/span> <span class=\"sg\" data-s=\"6\">Aut proba an verum aut falsum sit.<\/span> <span class=\"sg\" data-s=\"7\">Tum defectus manet valor simplex.<\/span> <span class=\"sg\" data-s=\"8\">Ad eum reagere potes.<\/span> <span class=\"sg\" data-s=\"9\">Hoc in <a href=\"https://course.raku.org/la/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Obiecto Proc<\/a> vidisti.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ambo casus unam rem communem habent.<\/span> <span class=\"sg\" data-s=\"1\">Defectus <em>differri<\/em> potest, id est in tempus posterius moveri.<\/span> <span class=\"sg\" data-s=\"2\">Tum programma non statim frangit.<\/span> <span class=\"sg\" data-s=\"3\">Fit valor.<\/span> <span class=\"sg\" data-s=\"4\">Cum paratus es, hunc valorem inspicis.<\/span> <span class=\"sg\" data-s=\"5\"><code>try<\/code> et fasis <code>CATCH<\/code> errores tractant quos codex statim iacit.<\/span> <span class=\"sg\" data-s=\"6\">Duo modi in hac pagina alios errores tractant.<\/span><\/p>"]]}}}</script>
