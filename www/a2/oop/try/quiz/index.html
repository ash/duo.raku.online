\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">eraron<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Du aferoj okazas ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Unue, <code>die<\/code> tuj haltigas la reston de la bloko <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do la programo neniam atingas la linion <code>say 'inside'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La programo presas nenion el la bloko.<\/span> <span class=\"sg\" data-s=\"4\">Due, <code>try<\/code> kaptas la escepton, la eraron de <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Do la programo mem ne haltas.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi daŭras post la bloko.<\/span> <span class=\"sg\" data-s=\"7\"><code>say 'outside'<\/code> ruliĝas kiel kutime.<\/span> <span class=\"sg\" data-s=\"8\">Do la programo presas nur unu linion: <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Vi ankaŭ povas rigardi <code>$r<\/code> kaj <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"10\"><code>$r<\/code> estas nedifinita.<\/span> <span class=\"sg\" data-s=\"11\">La mesaĝo <code>Boom!<\/code> atendas en <code>$!<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid hoc programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, deinde outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">errorem<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",12,"<p><span class=\"sg\" data-s=\"0\">Duae res hic fiunt.<\/span> <span class=\"sg\" data-s=\"1\">Primum <code>die<\/code> reliquam partem clausulae <code>try<\/code> statim sistit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque programma numquam ad lineam <code>say 'inside'<\/code> pervenit.<\/span> <span class=\"sg\" data-s=\"3\">Programma nihil ex clausula imprimit.<\/span> <span class=\"sg\" data-s=\"4\">Secundo <code>try<\/code> exceptionem capit, errorem ex <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Itaque ipsum programma non sistit.<\/span> <span class=\"sg\" data-s=\"6\">Post clausulam pergit.<\/span> <span class=\"sg\" data-s=\"7\"><code>say 'outside'<\/code> ut solet currit.<\/span> <span class=\"sg\" data-s=\"8\">Itaque programma solum unam lineam imprimit: <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Etiam <code>$r<\/code> et <code>$!<\/code> inspicere potes.<\/span> <span class=\"sg\" data-s=\"10\"><code>$r<\/code> indefinitus est.<\/span> <span class=\"sg\" data-s=\"11\">Nuntius <code>Boom!<\/code> in <code>$!<\/code> exspectat.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
