<script type="application/json" id="page-data">{"u":"oop/try","n":924,"k":"section","pv":"oop/external-programs/exercises/read-env/solution","nx":"oop/try/deferred-errors","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Catching exceptions with <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Sometimes something goes wrong in a Raku program.<\/span> <span class=\"sg\" data-s=\"1\">For example, a file is missing, or the code calls <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Then the program throws an error.<\/span> <span class=\"sg\" data-s=\"3\">This kind of error is called an <em>exception<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">If no code handles the exception, the program stops.<\/span> <span class=\"sg\" data-s=\"5\">This is the default.<\/span> <span class=\"sg\" data-s=\"6\">The <code>try<\/code> block helps here.<\/span> <span class=\"sg\" data-s=\"7\">It is a block of code with the word <code>try<\/code> before it.<\/span> <span class=\"sg\" data-s=\"8\">Code in this block may fail.<\/span> <span class=\"sg\" data-s=\"9\">But the program does not crash.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You put the code that may fail into a <code>try<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">Maybe the code throws an exception inside the block.<\/span> <span class=\"sg\" data-s=\"2\">Then the block stops at that place.<\/span> <span class=\"sg\" data-s=\"3\">But the program goes on:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>try<\/code> catches the <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So the program does not crash.<\/span> <span class=\"sg\" data-s=\"2\">It goes straight on to the next statement.<\/span> <span class=\"sg\" data-s=\"3\">It prints:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the block fails.<\/span> <span class=\"sg\" data-s=\"1\">Then it gives an undefined value.<\/span> <span class=\"sg\" data-s=\"2\">So <code>$result<\/code> is undefined:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku keeps the caught exception in the special variable <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can read the message of the exception from there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">So <code>try<\/code> helps with a fatal error.<\/span> <span class=\"sg\" data-s=\"1\">Without <code>try<\/code>, such an error stops the program.<\/span> <span class=\"sg\" data-s=\"2\">With <code>try<\/code>, your program can look at the error.<\/span> <span class=\"sg\" data-s=\"3\">Then it can react to it.<\/span> <span class=\"sg\" data-s=\"4\">What if the block runs without an exception?<\/span> <span class=\"sg\" data-s=\"5\">Then <code>$result<\/code> holds the value of the block.<\/span> <span class=\"sg\" data-s=\"6\">In this case, <code>$!<\/code> is undefined.<\/span><\/p>"]]},"de":{"t":"Ausnahmen mit <code>try<\/code> fangen","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Manchmal geht in einem Raku-Programm etwas schief.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel fehlt eine Datei, oder der Code ruft <code>die<\/code> auf.<\/span> <span class=\"sg\" data-s=\"2\">Dann wirft das Programm einen Fehler.<\/span> <span class=\"sg\" data-s=\"3\">Diese Art von Fehler heißt <em>Ausnahme<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Wenn kein Code die Ausnahme behandelt, hält das Programm an.<\/span> <span class=\"sg\" data-s=\"5\">Das ist der Normalfall.<\/span> <span class=\"sg\" data-s=\"6\">Hier hilft der <code>try<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"7\">Das ist ein Codeblock mit dem Wort <code>try<\/code> davor.<\/span> <span class=\"sg\" data-s=\"8\">Code in diesem Block kann fehlschlagen.<\/span> <span class=\"sg\" data-s=\"9\">Aber das Programm stürzt nicht ab.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie schreiben den Code, der fehlschlagen kann, in einen <code>try<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"1\">Vielleicht wirft der Code im Block eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Dann endet der Block an dieser Stelle.<\/span> <span class=\"sg\" data-s=\"3\">Aber das Programm läuft weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das <code>try<\/code> fängt das <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also stürzt das Programm nicht ab.<\/span> <span class=\"sg\" data-s=\"2\">Es geht direkt zur nächsten Anweisung weiter.<\/span> <span class=\"sg\" data-s=\"3\">Es gibt Folgendes aus:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier schlägt der Block fehl.<\/span> <span class=\"sg\" data-s=\"1\">Dann ergibt er einen undefinierten Wert.<\/span> <span class=\"sg\" data-s=\"2\">Also ist <code>$result<\/code> undefiniert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku speichert die gefangene Ausnahme in der besonderen Variablen <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dort können Sie die Meldung der Ausnahme lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> hilft also bei einem fatalen Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Ohne <code>try<\/code> hält so ein Fehler das Programm an.<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>try<\/code> kann Ihr Programm den Fehler ansehen.<\/span> <span class=\"sg\" data-s=\"3\">Dann kann es darauf reagieren.<\/span> <span class=\"sg\" data-s=\"4\">Was ist, wenn der Block ohne Ausnahme läuft?<\/span> <span class=\"sg\" data-s=\"5\">Dann enthält <code>$result<\/code> den Wert des Blocks.<\/span> <span class=\"sg\" data-s=\"6\">In diesem Fall ist <code>$!<\/code> undefiniert.<\/span><\/p>"]]},"nl":{"t":"Excepties vangen met <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Soms gaat er iets mis in een Raku-programma.<\/span> <span class=\"sg\" data-s=\"1\">Er ontbreekt bijvoorbeeld een bestand, of de code roept <code>die<\/code> aan.<\/span> <span class=\"sg\" data-s=\"2\">Dan werpt het programma een fout.<\/span> <span class=\"sg\" data-s=\"3\">Zo'n fout heet een <em>exceptie<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Als geen code de exceptie afhandelt, stopt het programma.<\/span> <span class=\"sg\" data-s=\"5\">Dat is de standaard.<\/span> <span class=\"sg\" data-s=\"6\">Het <code>try<\/code>-blok helpt hier.<\/span> <span class=\"sg\" data-s=\"7\">Dat is een codeblok met het woord <code>try<\/code> ervoor.<\/span> <span class=\"sg\" data-s=\"8\">Code in dit blok kan mislukken.<\/span> <span class=\"sg\" data-s=\"9\">Maar het programma crasht niet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je zet de code die kan mislukken in een <code>try<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"1\">Misschien werpt de code een exceptie in het blok.<\/span> <span class=\"sg\" data-s=\"2\">Dan stopt het blok op die plek.<\/span> <span class=\"sg\" data-s=\"3\">Maar het programma gaat door:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De <code>try<\/code> vangt de <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus crasht het programma niet.<\/span> <span class=\"sg\" data-s=\"2\">Het gaat meteen door naar de volgende opdracht.<\/span> <span class=\"sg\" data-s=\"3\">Het drukt af:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier mislukt het blok.<\/span> <span class=\"sg\" data-s=\"1\">Dan geeft het een ongedefinieerde waarde.<\/span> <span class=\"sg\" data-s=\"2\">Dus is <code>$result<\/code> ongedefinieerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku bewaart de gevangen exceptie in de bijzondere variabele <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daar kun je de melding van de exceptie uit lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> helpt dus bij een fatale fout.<\/span> <span class=\"sg\" data-s=\"1\">Zonder <code>try<\/code> stopt zo'n fout het programma.<\/span> <span class=\"sg\" data-s=\"2\">Met <code>try<\/code> kan je programma naar de fout kijken.<\/span> <span class=\"sg\" data-s=\"3\">Dan kan het erop reageren.<\/span> <span class=\"sg\" data-s=\"4\">Wat als het blok zonder exceptie draait?<\/span> <span class=\"sg\" data-s=\"5\">Dan bevat <code>$result<\/code> de waarde van het blok.<\/span> <span class=\"sg\" data-s=\"6\">In dat geval is <code>$!<\/code> ongedefinieerd.<\/span><\/p>"]]},"es":{"t":"Capturar excepciones con <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">A veces algo sale mal en un programa de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, falta un archivo, o el código llama a <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el programa lanza un error.<\/span> <span class=\"sg\" data-s=\"3\">Este tipo de error se llama <em>excepción<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Si ningún código maneja la excepción, el programa se detiene.<\/span> <span class=\"sg\" data-s=\"5\">Así funciona por defecto.<\/span> <span class=\"sg\" data-s=\"6\">El bloque <code>try<\/code> ayuda aquí.<\/span> <span class=\"sg\" data-s=\"7\">Es un bloque de código con la palabra <code>try<\/code> delante.<\/span> <span class=\"sg\" data-s=\"8\">El código de este bloque puede fallar.<\/span> <span class=\"sg\" data-s=\"9\">Pero el programa no se cae.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pones el código que puede fallar en un bloque <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A lo mejor el código lanza una excepción dentro del bloque.<\/span> <span class=\"sg\" data-s=\"2\">Entonces el bloque se detiene en ese punto.<\/span> <span class=\"sg\" data-s=\"3\">Pero el programa sigue:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El <code>try<\/code> captura el <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que el programa no se cae.<\/span> <span class=\"sg\" data-s=\"2\">Pasa directamente a la instrucción siguiente.<\/span> <span class=\"sg\" data-s=\"3\">Imprime:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, el bloque falla.<\/span> <span class=\"sg\" data-s=\"1\">Entonces da un valor no definido.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>$result<\/code> no está definido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku guarda la excepción capturada en la variable especial <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Desde ahí puedes leer el mensaje de la excepción:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Así que <code>try<\/code> ayuda con un error fatal.<\/span> <span class=\"sg\" data-s=\"1\">Sin <code>try<\/code>, un error así detiene el programa.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>try<\/code>, tu programa puede mirar el error.<\/span> <span class=\"sg\" data-s=\"3\">Después puede reaccionar a él.<\/span> <span class=\"sg\" data-s=\"4\">¿Y si el bloque se ejecuta sin ninguna excepción?<\/span> <span class=\"sg\" data-s=\"5\">Entonces <code>$result<\/code> contiene el valor del bloque.<\/span> <span class=\"sg\" data-s=\"6\">En este caso, <code>$!<\/code> no está definida.<\/span><\/p>"]]},"it":{"t":"Intercettare le eccezioni con <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">A volte qualcosa va storto in un programma Raku.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, manca un file, o il codice chiama <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Allora il programma solleva un errore.<\/span> <span class=\"sg\" data-s=\"3\">Questo tipo di errore si chiama <em>eccezione<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Se nessun codice gestisce l'eccezione, il programma si ferma.<\/span> <span class=\"sg\" data-s=\"5\">Questo è il comportamento predefinito.<\/span> <span class=\"sg\" data-s=\"6\">Qui ti aiuta il blocco <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">È un blocco di codice con la parola <code>try<\/code> davanti.<\/span> <span class=\"sg\" data-s=\"8\">Il codice in questo blocco può fallire.<\/span> <span class=\"sg\" data-s=\"9\">Ma il programma non crolla.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Metti il codice che può fallire in un blocco <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Forse il codice solleva un'eccezione dentro il blocco.<\/span> <span class=\"sg\" data-s=\"2\">Allora il blocco si ferma in quel punto.<\/span> <span class=\"sg\" data-s=\"3\">Ma il programma va avanti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il <code>try<\/code> intercetta il <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il programma non crolla.<\/span> <span class=\"sg\" data-s=\"2\">Va dritto all'istruzione successiva.<\/span> <span class=\"sg\" data-s=\"3\">Stampa:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui il blocco fallisce.<\/span> <span class=\"sg\" data-s=\"1\">Allora dà un valore non definito.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>$result<\/code> non è definito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku conserva l'eccezione intercettata nella variabile speciale <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da lì puoi leggere il messaggio dell'eccezione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Così <code>try<\/code> aiuta con un errore fatale.<\/span> <span class=\"sg\" data-s=\"1\">Senza <code>try<\/code>, un errore così ferma il programma.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>try<\/code>, il tuo programma può guardare l'errore.<\/span> <span class=\"sg\" data-s=\"3\">Poi può reagire.<\/span> <span class=\"sg\" data-s=\"4\">E se il blocco gira senza un'eccezione?<\/span> <span class=\"sg\" data-s=\"5\">Allora <code>$result<\/code> contiene il valore del blocco.<\/span> <span class=\"sg\" data-s=\"6\">In questo caso <code>$!<\/code> non è definito.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu pārtveršana ar <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Dažreiz Raku programmā kaut kas noiet greizi.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, trūkst faila vai kods izsauc <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad programma izmet kļūdu.<\/span> <span class=\"sg\" data-s=\"3\">Šādu kļūdu sauc par <em>izņēmumu<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ja neviens kods neapstrādā izņēmumu, programma apstājas.<\/span> <span class=\"sg\" data-s=\"5\">Tā notiek pēc noklusējuma.<\/span> <span class=\"sg\" data-s=\"6\">Te palīdz bloks <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tas ir koda bloks ar vārdu <code>try<\/code> priekšā.<\/span> <span class=\"sg\" data-s=\"8\">Kods šajā blokā var neizdoties.<\/span> <span class=\"sg\" data-s=\"9\">Bet programma neavarē.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kodu, kas var neizdoties, jūs ieliekat blokā <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Varbūt kods bloka iekšā izmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"2\">Tad bloks apstājas tajā vietā.<\/span> <span class=\"sg\" data-s=\"3\">Bet programma turpina darbu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> noķer <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc programma neavarē.<\/span> <span class=\"sg\" data-s=\"2\">Tā iet tieši uz nākamo teikumu.<\/span> <span class=\"sg\" data-s=\"3\">Tā izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit bloks neizdodas.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas dod nedefinētu vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>$result<\/code> ir nedefinēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku glabā noķerto izņēmumu speciālajā mainīgajā <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">No turienes jūs varat nolasīt izņēmuma paziņojumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>try<\/code> palīdz ar liktenīgu kļūdu.<\/span> <span class=\"sg\" data-s=\"1\">Bez <code>try<\/code> tāda kļūda aptur programmu.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>try<\/code> jūsu programma var apskatīt kļūdu.<\/span> <span class=\"sg\" data-s=\"3\">Tad tā var uz to reaģēt.<\/span> <span class=\"sg\" data-s=\"4\">Un ja bloks izpildās bez izņēmuma?<\/span> <span class=\"sg\" data-s=\"5\">Tad <code>$result<\/code> satur bloka vērtību.<\/span> <span class=\"sg\" data-s=\"6\">Šajā gadījumā <code>$!<\/code> ir nedefinēts.<\/span><\/p>"]]},"ru":{"t":"Перехват исключений с помощью <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Иногда в программе на Raku что-то идёт не так.<\/span> <span class=\"sg\" data-s=\"1\">Например, нет файла, или код вызывает <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогда программа бросает ошибку.<\/span> <span class=\"sg\" data-s=\"3\">Такую ошибку называют <em>исключением<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Если никакой код не обрабатывает исключение, программа останавливается.<\/span> <span class=\"sg\" data-s=\"5\">Так происходит по умолчанию.<\/span> <span class=\"sg\" data-s=\"6\">Здесь помогает блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Это блок кода со словом <code>try<\/code> перед ним.<\/span> <span class=\"sg\" data-s=\"8\">Код в этом блоке может дать сбой.<\/span> <span class=\"sg\" data-s=\"9\">Но программа не падает.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы кладёте в блок <code>try<\/code> код, который может дать сбой.<\/span> <span class=\"sg\" data-s=\"1\">Может быть, код бросит исключение внутри блока.<\/span> <span class=\"sg\" data-s=\"2\">Тогда блок останавливается в этом месте.<\/span> <span class=\"sg\" data-s=\"3\">Но программа работает дальше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> перехватывает <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому программа не падает.<\/span> <span class=\"sg\" data-s=\"2\">Она сразу переходит к следующей инструкции.<\/span> <span class=\"sg\" data-s=\"3\">Она печатает:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь блок даёт сбой.<\/span> <span class=\"sg\" data-s=\"1\">Тогда он возвращает неопределённое значение.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$result<\/code> не определён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku хранит перехваченное исключение в специальной переменной <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оттуда можно прочитать сообщение исключения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>try<\/code> помогает с фатальной ошибкой.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>try<\/code> такая ошибка останавливает программу.<\/span> <span class=\"sg\" data-s=\"2\">С <code>try<\/code> ваша программа может посмотреть на ошибку.<\/span> <span class=\"sg\" data-s=\"3\">Потом она может на неё отреагировать.<\/span> <span class=\"sg\" data-s=\"4\">А если блок выполняется без исключения?<\/span> <span class=\"sg\" data-s=\"5\">Тогда в <code>$result<\/code> лежит значение блока.<\/span> <span class=\"sg\" data-s=\"6\">В этом случае <code>$!<\/code> не определён.<\/span><\/p>"]]},"uk":{"t":"Перехоплення винятків за допомогою <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Іноді в програмі на Raku щось іде не так.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, немає потрібного файлу або код викликає <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тоді програма кидає помилку.<\/span> <span class=\"sg\" data-s=\"3\">Таку помилку називають <em>винятком<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Якщо жоден код не обробляє виняток, програма зупиняється.<\/span> <span class=\"sg\" data-s=\"5\">Так відбувається за замовчуванням.<\/span> <span class=\"sg\" data-s=\"6\">Тут допомагає блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Це блок коду зі словом <code>try<\/code> перед ним.<\/span> <span class=\"sg\" data-s=\"8\">Код у цьому блоці може не спрацювати.<\/span> <span class=\"sg\" data-s=\"9\">Але програма не падає.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви кладете код, який може не спрацювати, у блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, код кидає виняток усередині блоку.<\/span> <span class=\"sg\" data-s=\"2\">Тоді блок зупиняється в цьому місці.<\/span> <span class=\"sg\" data-s=\"3\">Але програма працює далі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> перехоплює <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож програма не падає.<\/span> <span class=\"sg\" data-s=\"2\">Вона одразу переходить до наступного оператора.<\/span> <span class=\"sg\" data-s=\"3\">Вона виводить:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут блок не спрацьовує.<\/span> <span class=\"sg\" data-s=\"1\">Тоді він дає невизначене значення.<\/span> <span class=\"sg\" data-s=\"2\">Тож змінна <code>$result<\/code> невизначена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku зберігає перехоплений виняток у спеціальній змінній <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звідти можна прочитати повідомлення винятку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>try<\/code> допомагає з фатальною помилкою.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>try<\/code> така помилка зупиняє програму.<\/span> <span class=\"sg\" data-s=\"2\">З <code>try<\/code> ваша програма може подивитися на помилку.<\/span> <span class=\"sg\" data-s=\"3\">Потім вона може на неї відреагувати.<\/span> <span class=\"sg\" data-s=\"4\">А якщо блок виконується без винятку?<\/span> <span class=\"sg\" data-s=\"5\">Тоді <code>$result<\/code> містить значення блоку.<\/span> <span class=\"sg\" data-s=\"6\">У цьому разі <code>$!<\/code> невизначена.<\/span><\/p>"]]},"bg":{"t":"Прихващане на изключения с <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Понякога нещо се обърква в програма на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Например липсва файл или кодът извиква <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогава програмата хвърля грешка.<\/span> <span class=\"sg\" data-s=\"3\">Такъв вид грешка се нарича <em>изключение<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ако никакъв код не обработи изключението, програмата спира.<\/span> <span class=\"sg\" data-s=\"5\">Така е по подразбиране.<\/span> <span class=\"sg\" data-s=\"6\">Тук помага блокът <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Това е блок код с думата <code>try<\/code> пред него.<\/span> <span class=\"sg\" data-s=\"8\">Кодът в този блок може да се провали.<\/span> <span class=\"sg\" data-s=\"9\">Но програмата не се срива.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Слагате кода, който може да се провали, в блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Може би кодът хвърля изключение вътре в блока.<\/span> <span class=\"sg\" data-s=\"2\">Тогава блокът спира на това място.<\/span> <span class=\"sg\" data-s=\"3\">Но програмата продължава:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> прихваща <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова програмата не се срива.<\/span> <span class=\"sg\" data-s=\"2\">Тя продължава направо със следващия оператор.<\/span> <span class=\"sg\" data-s=\"3\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук блокът се проваля.<\/span> <span class=\"sg\" data-s=\"1\">Тогава той дава недефинирана стойност.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>$result<\/code> е недефинирана:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku пази прихванатото изключение в специалната променлива <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оттам можете да прочетете съобщението на изключението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Така <code>try<\/code> помага при фатална грешка.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>try<\/code> такава грешка спира програмата.<\/span> <span class=\"sg\" data-s=\"2\">С <code>try<\/code> програмата ви може да разгледа грешката.<\/span> <span class=\"sg\" data-s=\"3\">После тя може да реагира на нея.<\/span> <span class=\"sg\" data-s=\"4\">Какво става, ако блокът се изпълни без изключение?<\/span> <span class=\"sg\" data-s=\"5\">Тогава <code>$result<\/code> съдържа стойността на блока.<\/span> <span class=\"sg\" data-s=\"6\">В този случай <code>$!<\/code> е недефинирана.<\/span><\/p>"]]},"eo":{"t":"Kapti esceptojn per <code>try<\/code>","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Foje io misiras en Raku-programo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, dosiero mankas, aŭ la kodo vokas <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la programo ĵetas eraron.<\/span> <span class=\"sg\" data-s=\"3\">Tia eraro nomiĝas <em>escepto<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Se neniu kodo traktas la escepton, la programo haltas.<\/span> <span class=\"sg\" data-s=\"5\">Tio estas la defaŭlto.<\/span> <span class=\"sg\" data-s=\"6\">La bloko <code>try<\/code> helpas ĉi tie.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi estas bloko de kodo kun la vorto <code>try<\/code> antaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"8\">Kodo en ĉi tiu bloko povas malsukcesi.<\/span> <span class=\"sg\" data-s=\"9\">Sed la programo ne kolapsas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi metas la kodon, kiu povas malsukcesi, en blokon <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eble la kodo ĵetas escepton ene de la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la bloko haltas en tiu loko.<\/span> <span class=\"sg\" data-s=\"3\">Sed la programo daŭras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La <code>try<\/code> kaptas la <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do la programo ne kolapsas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi iras rekte al la sekva instrukcio.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi presas:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la bloko malsukcesas.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi donas nedifinitan valoron.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$result<\/code> estas nedifinita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tenas la kaptitan escepton en la speciala variablo <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas legi la mesaĝon de la escepto el tie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Do <code>try<\/code> helpas kun fatala eraro.<\/span> <span class=\"sg\" data-s=\"1\">Sen <code>try<\/code>, tia eraro haltigas la programon.<\/span> <span class=\"sg\" data-s=\"2\">Kun <code>try<\/code>, via programo povas rigardi la eraron.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi povas reagi al ĝi.<\/span> <span class=\"sg\" data-s=\"4\">Kaj se la bloko ruliĝas sen escepto?<\/span> <span class=\"sg\" data-s=\"5\">Tiam <code>$result<\/code> tenas la valoron de la bloko.<\/span> <span class=\"sg\" data-s=\"6\">En ĉi tiu kazo, <code>$!<\/code> estas nedifinita.<\/span><\/p>"]]},"la":{"t":"Exceptiones per <code>try<\/code> capere","b":[["p",10,"<p><span class=\"sg\" data-s=\"0\">Interdum aliquid in programmate Raku male cedit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, archivum deest, aut codex <code>die<\/code> vocat.<\/span> <span class=\"sg\" data-s=\"2\">Tum programma errorem iacit.<\/span> <span class=\"sg\" data-s=\"3\">Talem errorem <em>exceptionem<\/em> vocamus.<\/span> <span class=\"sg\" data-s=\"4\">Si nullus codex exceptionem tractat, programma sistit.<\/span> <span class=\"sg\" data-s=\"5\">Hoc ex more fit.<\/span> <span class=\"sg\" data-s=\"6\">Clausula <code>try<\/code> hic adiuvat.<\/span> <span class=\"sg\" data-s=\"7\">Est clausula codicis cum verbo <code>try<\/code> ante eam.<\/span> <span class=\"sg\" data-s=\"8\">Codex in hac clausula deficere potest.<\/span> <span class=\"sg\" data-s=\"9\">Sed programma non ruit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Codicem qui deficere potest in clausulam <code>try<\/code> ponis.<\/span> <span class=\"sg\" data-s=\"1\">Fortasse codex intra clausulam exceptionem iacit.<\/span> <span class=\"sg\" data-s=\"2\">Tum clausula eo loco desinit.<\/span> <span class=\"sg\" data-s=\"3\">Sed programma pergit:<\/span><\/p>"],["code",0,"<pre cl
