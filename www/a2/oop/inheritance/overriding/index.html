<script type="application/json" id="page-data">{"u":"oop/inheritance/overriding","n":819,"k":"topic","pv":"oop/inheritance","nx":"oop/inheritance/overriding/quiz","tr":["oop","oop/inheritance"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Overriding methods","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A child class inherits methods from its parent class.<\/span> <span class=\"sg\" data-s=\"1\">But it can also have its own version of such a method.<\/span> <span class=\"sg\" data-s=\"2\">This is called <em>overriding<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">You call the method on an object of the child class.<\/span> <span class=\"sg\" data-s=\"4\">Then the version of the child runs.<\/span> <span class=\"sg\" data-s=\"5\">The version of the parent does not run.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> and <code>Cat<\/code> both override <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They inherit the method <code>intro<\/code> from <code>Animal<\/code> and do not change it.<\/span> <span class=\"sg\" data-s=\"2\">This method calls <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This call uses the object’s own <code>speak<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">So the same inherited <code>intro<\/code> gives different results.<\/span> <span class=\"sg\" data-s=\"1\">This is because each object has its own <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This is one of the main ideas of object-oriented programming.<\/span> <span class=\"sg\" data-s=\"3\">The code is shared.<\/span> <span class=\"sg\" data-s=\"4\">But it works in a different way for each kind of object.<\/span><\/p>"]]},"de":{"t":"Methoden überschreiben","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine Kindklasse erbt Methoden von ihrer Elternklasse.<\/span> <span class=\"sg\" data-s=\"1\">Aber sie kann auch ihre eigene Version so einer Methode haben.<\/span> <span class=\"sg\" data-s=\"2\">Das nennt man <em>Überschreiben<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sie rufen die Methode auf einem Objekt der Kindklasse auf.<\/span> <span class=\"sg\" data-s=\"4\">Dann läuft die Version des Kindes.<\/span> <span class=\"sg\" data-s=\"5\">Die Version der Elternklasse läuft nicht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> und <code>Cat<\/code> überschreiben beide <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie erben die Methode <code>intro<\/code> von <code>Animal<\/code> und ändern sie nicht.<\/span> <span class=\"sg\" data-s=\"2\">Diese Methode ruft <code>self.speak<\/code> auf.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Aufruf benutzt das eigene <code>speak<\/code> des Objekts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dasselbe geerbte <code>intro<\/code> gibt also verschiedene Ergebnisse.<\/span> <span class=\"sg\" data-s=\"1\">Der Grund ist: Jedes Objekt hat sein eigenes <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das ist eine der wichtigsten Ideen der objektorientierten Programmierung.<\/span> <span class=\"sg\" data-s=\"3\">Der Code ist gemeinsam.<\/span> <span class=\"sg\" data-s=\"4\">Aber er arbeitet für jede Art von Objekt anders.<\/span><\/p>"]]},"nl":{"t":"Methoden overschrijven","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een kindklasse erft methoden van haar ouderklasse.<\/span> <span class=\"sg\" data-s=\"1\">Maar ze kan ook een eigen versie van zo'n methode hebben.<\/span> <span class=\"sg\" data-s=\"2\">Dat heet <em>overschrijven<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Je roept de methode aan op een object van de kindklasse.<\/span> <span class=\"sg\" data-s=\"4\">Dan draait de versie van het kind.<\/span> <span class=\"sg\" data-s=\"5\">De versie van de ouder draait niet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> en <code>Cat<\/code> overschrijven allebei <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze erven de methode <code>intro<\/code> van <code>Animal<\/code> en veranderen haar niet.<\/span> <span class=\"sg\" data-s=\"2\">Deze methode roept <code>self.speak<\/code> aan.<\/span> <span class=\"sg\" data-s=\"3\">Deze aanroep gebruikt de eigen <code>speak<\/code> van het object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dezelfde geërfde <code>intro<\/code> geeft dus verschillende resultaten.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat elk object zijn eigen <code>speak<\/code> heeft.<\/span> <span class=\"sg\" data-s=\"2\">Dit is een van de belangrijkste ideeën van objectgeoriënteerd programmeren.<\/span> <span class=\"sg\" data-s=\"3\">De code is gedeeld.<\/span> <span class=\"sg\" data-s=\"4\">Maar ze werkt anders voor elke soort object.<\/span><\/p>"]]},"es":{"t":"Sobrescribir métodos","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una clase hija hereda métodos de su clase padre.<\/span> <span class=\"sg\" data-s=\"1\">Pero también puede tener su propia versión de un método así.<\/span> <span class=\"sg\" data-s=\"2\">Esto se llama <em>sobrescribir<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Llamas al método sobre un objeto de la clase hija.<\/span> <span class=\"sg\" data-s=\"4\">Entonces se ejecuta la versión de la hija.<\/span> <span class=\"sg\" data-s=\"5\">La versión del padre no se ejecuta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> y <code>Cat<\/code> sobrescriben los dos <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Heredan el método <code>intro<\/code> de <code>Animal<\/code> y no lo cambian.<\/span> <span class=\"sg\" data-s=\"2\">Este método llama a <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Esta llamada usa el <code>speak<\/code> del propio objeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Así que el mismo <code>intro<\/code> heredado da resultados distintos.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa porque cada objeto tiene su propio <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esta es una de las ideas principales de la programación orientada a objetos.<\/span> <span class=\"sg\" data-s=\"3\">El código es compartido.<\/span> <span class=\"sg\" data-s=\"4\">Pero funciona de otra manera para cada clase de objeto.<\/span><\/p>"]]},"it":{"t":"Sovrascrivere i metodi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una classe figlia eredita i metodi dalla sua classe genitrice.<\/span> <span class=\"sg\" data-s=\"1\">Ma può anche avere una sua versione di uno di questi metodi.<\/span> <span class=\"sg\" data-s=\"2\">Questo si chiama <em>sovrascrittura<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Chiami il metodo su un oggetto della classe figlia.<\/span> <span class=\"sg\" data-s=\"4\">Allora gira la versione della figlia.<\/span> <span class=\"sg\" data-s=\"5\">La versione della genitrice non gira.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> e <code>Cat<\/code> sovrascrivono entrambi <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ereditano il metodo <code>intro<\/code> da <code>Animal<\/code> e non lo cambiano.<\/span> <span class=\"sg\" data-s=\"2\">Questo metodo chiama <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questa chiamata usa lo <code>speak<\/code> dell'oggetto stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Così lo stesso <code>intro<\/code> ereditato dà risultati diversi.<\/span> <span class=\"sg\" data-s=\"1\">Questo succede perché ogni oggetto ha il suo <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questa è una delle idee principali della programmazione a oggetti.<\/span> <span class=\"sg\" data-s=\"3\">Il codice è condiviso.<\/span> <span class=\"sg\" data-s=\"4\">Ma funziona in modo diverso per ogni tipo di oggetto.<\/span><\/p>"]]},"lv":{"t":"Metožu pārrakstīšana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Bērnklase manto metodes no savas vecākklases.<\/span> <span class=\"sg\" data-s=\"1\">Bet tai var būt arī sava šādas metodes versija.<\/span> <span class=\"sg\" data-s=\"2\">To sauc par <em>pārrakstīšanu<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs izsaucat metodi uz bērnklases objekta.<\/span> <span class=\"sg\" data-s=\"4\">Tad izpildās bērnklases versija.<\/span> <span class=\"sg\" data-s=\"5\">Vecākklases versija neizpildās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> un <code>Cat<\/code> abas pārraksta <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās manto metodi <code>intro<\/code> no <code>Animal<\/code> un to nemaina.<\/span> <span class=\"sg\" data-s=\"2\">Šī metode izsauc <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šis izsaukums izmanto paša objekta <code>speak<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tātad viena un tā pati mantotā <code>intro<\/code> dod dažādus rezultātus.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka katram objektam ir savs <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šī ir viena no objektorientētās programmēšanas galvenajām idejām.<\/span> <span class=\"sg\" data-s=\"3\">Kods ir kopīgs.<\/span> <span class=\"sg\" data-s=\"4\">Bet katram objekta veidam tas strādā citādi.<\/span><\/p>"]]},"ru":{"t":"Переопределение методов","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Дочерний класс наследует методы от родительского класса.<\/span> <span class=\"sg\" data-s=\"1\">Но у него может быть и своя версия такого метода.<\/span> <span class=\"sg\" data-s=\"2\">Это называется <em>переопределением<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вы вызываете метод у объекта дочернего класса.<\/span> <span class=\"sg\" data-s=\"4\">Тогда выполняется версия дочернего класса.<\/span> <span class=\"sg\" data-s=\"5\">Версия родителя не выполняется.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> и <code>Cat<\/code> оба переопределяют <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code> они наследуют от <code>Animal<\/code> и не меняют его.<\/span> <span class=\"sg\" data-s=\"2\">Этот метод вызывает <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Этот вызов использует собственный <code>speak<\/code> объекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Итак, один и тот же унаследованный <code>intro<\/code> даёт разные результаты.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что у каждого объекта свой <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это одна из главных идей объектно-ориентированного программирования.<\/span> <span class=\"sg\" data-s=\"3\">Код общий.<\/span> <span class=\"sg\" data-s=\"4\">Но для каждого вида объекта он работает по-своему.<\/span><\/p>"]]},"uk":{"t":"Перевизначення методів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Дочірній клас успадковує методи від батьківського класу.<\/span> <span class=\"sg\" data-s=\"1\">Але він може мати й власну версію такого методу.<\/span> <span class=\"sg\" data-s=\"2\">Це називають <em>перевизначенням<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ви викликаєте метод для об'єкта дочірнього класу.<\/span> <span class=\"sg\" data-s=\"4\">Тоді виконується версія дочірнього класу.<\/span> <span class=\"sg\" data-s=\"5\">Версія батьківського класу не виконується.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> і <code>Cat<\/code> обидва перевизначають <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code> вони успадковують від <code>Animal<\/code> і не змінюють його.<\/span> <span class=\"sg\" data-s=\"2\">Цей метод викликає <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Цей виклик використовує власний <code>speak<\/code> об'єкта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тож той самий успадкований <code>intro<\/code> дає різні результати.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що кожен об'єкт має власний <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це одна з головних ідей об'єктно-орієнтованого програмування.<\/span> <span class=\"sg\" data-s=\"3\">Код спільний.<\/span> <span class=\"sg\" data-s=\"4\">Але для кожного виду об'єкта він працює по-різному.<\/span><\/p>"]]},"bg":{"t":"Предефиниране на методи","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Дъщерният клас наследява методи от родителския си клас.<\/span> <span class=\"sg\" data-s=\"1\">Но той може да има и своя версия на такъв метод.<\/span> <span class=\"sg\" data-s=\"2\">Това се нарича <em>предефиниране<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Извиквате метода върху обект от дъщерния клас.<\/span> <span class=\"sg\" data-s=\"4\">Тогава се изпълнява версията на дъщерния клас.<\/span> <span class=\"sg\" data-s=\"5\">Версията на родителя не се изпълнява.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И <code>Dog<\/code>, и <code>Cat<\/code> предефинират <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те наследяват метода <code>intro<\/code> от <code>Animal<\/code> и не го променят.<\/span> <span class=\"sg\" data-s=\"2\">Този метод извиква <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това извикване използва собствения <code>speak<\/code> на обекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Така един и същ наследен <code>intro<\/code> дава различни резултати.<\/span> <span class=\"sg\" data-s=\"1\">Причината е, че всеки обект има свой <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е една от главните идеи на обектно-ориентираното програмиране.<\/span> <span class=\"sg\" data-s=\"3\">Кодът е общ.<\/span> <span class=\"sg\" data-s=\"4\">Но той работи по различен начин за всеки вид обект.<\/span><\/p>"]]},"eo":{"t":"Superregi metodojn","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ida klaso heredas metodojn de sia patra klaso.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi ankaŭ povas havi sian propran version de tia metodo.<\/span> <span class=\"sg\" data-s=\"2\">Tio nomiĝas <em>superregi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi vokas la metodon sur objekto de la ida klaso.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la versio de la ido ruliĝas.<\/span> <span class=\"sg\" data-s=\"5\">La versio de la patro ne ruliĝas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> kaj <code>Cat<\/code> ambaŭ superregas <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili heredas la metodon <code>intro<\/code> de <code>Animal<\/code> kaj ne ŝanĝas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu metodo vokas <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu voko uzas la propran <code>speak<\/code> de la objekto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Do la sama heredita <code>intro<\/code> donas malsamajn rezultojn.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar ĉiu objekto havas sian propran <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tio estas unu el la ĉefaj ideoj de objekt-orientita programado.<\/span> <span class=\"sg\" data-s=\"3\">La kodo estas komuna.<\/span> <span class=\"sg\" data-s=\"4\">Sed ĝi funkcias alimaniere por ĉiu speco de objekto.<\/span><\/p>"]]},"la":{"t":"Methodos superscribere","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Classis filia methodos ex classe parente heredat.<\/span> <span class=\"sg\" data-s=\"1\">Sed etiam propriam versionem talis methodi habere potest.<\/span> <span class=\"sg\" data-s=\"2\">Hoc <em>superscribere<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"3\">Methodum in obiecto classis filiae vocas.<\/span> <span class=\"sg\" data-s=\"4\">Tum versio filiae currit.<\/span> <span class=\"sg\" data-s=\"5\">Versio parentis non currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> et <code>Cat<\/code> ambo <code>speak<\/code> superscribunt.<\/span> <span class=\"sg\" data-s=\"1\">Methodum <code>intro<\/code> ex <code>Animal<\/code> heredant et eam non mutant.<\/span> <span class=\"sg\" data-s=\"2\">Haec methodus vocat <code>self.speak<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Haec vocatio propriam obiecti <code>speak<\/code> adhibet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Itaque eadem <code>intro<\/code> hereditata diversos effectus dat.<\/span> <span class=\"sg\" data-s=\"1\">Nam quodque obiectum propriam <code>speak<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Haec est una ex ideis principalibus programmationis ad obiecta directae.<\/span> <span class=\"sg\" data-s=\"3\">Codex communis est.<\/span> <span class=\"sg\" data-s=\"4\">Sed pro quoque genere obiecti aliter operatur.<\/span><\/p>"]]}}}</script>
