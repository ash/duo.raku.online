<script type="application/json" id="page-data">{"u":"oop/inheritance/exercises/inherited-attribute/solution","n":827,"k":"solution","pv":"oop/inheritance/exercises/inherited-attribute","nx":"oop/roles","tr":["oop","oop/inheritance"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’An inherited attribute‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> and <code>Car<\/code> both inherit the attribute <code>wheels<\/code> from <code>Vehicle<\/code>. They also inherit its accessor. They do not make a new attribute. They only give the inherited attribute a default value. For <code>Bike<\/code>, it is <code>2<\/code>. For <code>Car<\/code>, it is <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Each class has its default value inside it. So you can create the objects with just <code>Bike.new<\/code> and <code>Car.new<\/code>. The inherited accessor then returns the right number of wheels.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">You can still pass a value yourself, for example, <code>Car.new(wheels =&gt; 3)<\/code>. Then this value replaces the default. But bikes and cars usually have their normal number of wheels. So the defaults make the usual case simple. And you can still make an exception sometimes.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein geerbtes Attribut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> und <code>Car<\/code> erben beide das Attribut <code>wheels<\/code> von <code>Vehicle<\/code>. Sie erben auch seinen Accessor. Sie erstellen kein neues Attribut. Sie geben dem geerbten Attribut nur einen Standardwert. Für <code>Bike<\/code> ist er <code>2<\/code>. Für <code>Car<\/code> ist er <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jede Klasse hat ihren Standardwert in sich. Also können Sie die Objekte einfach mit <code>Bike.new<\/code> und <code>Car.new<\/code> erstellen. Der geerbte Accessor gibt dann die richtige Anzahl Räder zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sie können trotzdem selbst einen Wert übergeben, zum Beispiel <code>Car.new(wheels =&gt; 3)<\/code>. Dann ersetzt dieser Wert den Standardwert. Aber Fahrräder und Autos haben meistens ihre normale Anzahl Räder. Also machen die Standardwerte den normalen Fall einfach. Und manchmal können Sie trotzdem eine Ausnahme machen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een geërfd attribuut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> en <code>Car<\/code> erven allebei het attribuut <code>wheels<\/code> van <code>Vehicle<\/code>. Ze erven ook zijn accessor. Ze maken geen nieuw attribuut. Ze geven het geërfde attribuut alleen een standaardwaarde. Voor <code>Bike<\/code> is dat <code>2<\/code>. Voor <code>Car<\/code> is dat <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Elke klasse heeft haar standaardwaarde in zich. Dus kun je de objecten maken met alleen <code>Bike.new<\/code> en <code>Car.new<\/code>. De geërfde accessor geeft dan het juiste aantal wielen terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Je kunt nog steeds zelf een waarde meegeven, bijvoorbeeld <code>Car.new(wheels =&gt; 3)<\/code>. Dan vervangt deze waarde de standaardwaarde. Maar fietsen en auto's hebben meestal hun normale aantal wielen. Dus maken de standaardwaarden het gewone geval eenvoudig. En soms kun je toch een uitzondering maken.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un atributo heredado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> y <code>Car<\/code> heredan las dos el atributo <code>wheels<\/code> de <code>Vehicle<\/code>. También heredan su accesor. No crean un atributo nuevo. Solo dan al atributo heredado un valor por defecto. Para <code>Bike<\/code>, es <code>2<\/code>. Para <code>Car<\/code>, es <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cada clase tiene dentro su valor por defecto. Así que puedes crear los objetos solo con <code>Bike.new<\/code> y <code>Car.new<\/code>. Después el accesor heredado devuelve el número correcto de ruedas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aun así, puedes pasar tú mismo un valor, por ejemplo, <code>Car.new(wheels =&gt; 3)<\/code>. Entonces este valor sustituye al valor por defecto. Pero las bicicletas y los coches suelen tener su número normal de ruedas. Así que los valores por defecto hacen simple el caso normal. Y a veces todavía puedes hacer una excepción.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un attributo ereditato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> e <code>Car<\/code> ereditano tutte e due l'attributo <code>wheels<\/code> da <code>Vehicle<\/code>. Ereditano anche il suo accessore. Non creano un nuovo attributo. Danno solo un valore predefinito all'attributo ereditato. Per <code>Bike<\/code> è <code>2<\/code>. Per <code>Car<\/code> è <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ogni classe ha dentro di sé il suo valore predefinito. Quindi puoi creare gli oggetti solo con <code>Bike.new<\/code> e <code>Car.new<\/code>. Poi l'accessore ereditato restituisce il numero giusto di ruote.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Puoi comunque passare tu un valore, per esempio <code>Car.new(wheels =&gt; 3)<\/code>. Allora questo valore sostituisce quello predefinito. Ma bici e auto di solito hanno il loro numero normale di ruote. Quindi i valori predefiniti rendono semplice il caso normale. E a volte puoi ancora fare un'eccezione.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Mantots atribūts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> un <code>Car<\/code> abas manto no <code>Vehicle<\/code> atribūtu <code>wheels<\/code>. Tās manto arī tā piekļuves metodi. Tās neveido jaunu atribūtu. Tās tikai dod mantotajam atribūtam noklusēto vērtību. Klasei <code>Bike<\/code> tā ir <code>2<\/code>. Klasei <code>Car<\/code> tā ir <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Katrā klasē iekšā ir sava noklusētā vērtība. Tāpēc jūs varat izveidot objektus vienkārši ar <code>Bike.new<\/code> un <code>Car.new<\/code>. Mantotā piekļuves metode tad atgriež pareizo riteņu skaitu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jūs joprojām varat padot vērtību paši, piemēram, <code>Car.new(wheels =&gt; 3)<\/code>. Tad šī vērtība aizstāj noklusējumu. Bet velosipēdam un automašīnai parasti ir normāls riteņu skaits. Tāpēc noklusējumi padara parasto gadījumu vienkāršu. Un dažreiz jūs tomēr varat izdarīt izņēmumu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Унаследованный атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследуют от <code>Vehicle<\/code> атрибут <code>wheels<\/code>. Ещё они наследуют его аксессор. Они не создают новый атрибут. Они только дают унаследованному атрибуту значение по умолчанию. Для <code>Bike<\/code> это <code>2<\/code>. Для <code>Car<\/code> это <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У каждого класса внутри есть своё значение по умолчанию. Поэтому объекты можно создать просто через <code>Bike.new<\/code> и <code>Car.new<\/code>. Потом унаследованный аксессор возвращает нужное число колёс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вы всё равно можете сами передать значение, например <code>Car.new(wheels =&gt; 3)<\/code>. Тогда это значение заменяет значение по умолчанию. Но у велосипедов и машин обычно привычное число колёс. Поэтому значения по умолчанию делают обычный случай простым. А иногда всё равно можно сделать исключение.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Успадкований атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І <code>Bike<\/code>, і <code>Car<\/code> успадковують атрибут <code>wheels<\/code> від <code>Vehicle<\/code>. Вони також успадковують його аксесор. Вони не створюють нового атрибута. Вони лише дають успадкованому атрибуту типове значення. Для <code>Bike<\/code> це <code>2<\/code>. Для <code>Car<\/code> це <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кожен клас має своє типове значення всередині. Тож об'єкти можна створити просто через <code>Bike.new<\/code> та <code>Car.new<\/code>. Потім успадкований аксесор повертає правильну кількість коліс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ви все одно можете передати значення самі, наприклад, <code>Car.new(wheels =&gt; 3)<\/code>. Тоді це значення замінює типове. Але велосипеди й автомобілі зазвичай мають звичну кількість коліс. Тож типові значення роблять звичайний випадок простим. А іноді ви все одно можете зробити виняток.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Наследен атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследяват атрибута <code>wheels<\/code> от <code>Vehicle<\/code>. Те наследяват и неговия аксесор. Те не създават нов атрибут. Те само дават на наследения атрибут стойност по подразбиране. За <code>Bike<\/code> тя е <code>2<\/code>. За <code>Car<\/code> тя е <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всеки клас има стойността си по подразбиране вътре в себе си. Затова можете да създадете обектите само с <code>Bike.new<\/code> и <code>Car.new<\/code>. После наследеният аксесор връща правилния брой колела.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пак можете сами да подадете стойност, например <code>Car.new(wheels =&gt; 3)<\/code>. Тогава тази стойност заменя стойността по подразбиране. Но велосипедите и колите обикновено имат нормалния си брой колела. Затова стойностите по подразбиране правят обичайния случай прост. А понякога пак можете да направите изключение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Heredita atributo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> kaj <code>Car<\/code> ambaŭ heredas la atributon <code>wheels<\/code> el <code>Vehicle<\/code>. Ili ankaŭ heredas ĝian atingilon. Ili ne faras novan atributon. Ili nur donas al la heredita atributo defaŭltan valoron. Por <code>Bike<\/code>, ĝi estas <code>2<\/code>. Por <code>Car<\/code>, ĝi estas <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiu klaso havas sian defaŭltan valoron en si. Do vi povas krei la objektojn per nur <code>Bike.new<\/code> kaj <code>Car.new<\/code>. La heredita atingilo tiam redonas la ĝustan nombron de radoj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi ankoraŭ povas mem transdoni valoron, ekzemple <code>Car.new(wheels =&gt; 3)<\/code>. Tiam ĉi tiu valoro anstataŭas la defaŭlton. Sed bicikloj kaj aŭtoj kutime havas sian normalan nombron de radoj. Do la defaŭltoj faras la kutiman kazon simpla. Kaj vi ankoraŭ povas fari escepton foje.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Attributum hereditatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> et <code>Car<\/code> ambae attributum <code>wheels<\/code> ex <code>Vehicle<\/code> heredant. Etiam accessorem eius heredant. Novum attributum non faciunt. Solum attributo hereditato valorem praedefinitum dant. Pro <code>Bike<\/code> est <code>2<\/code>. Pro <code>Car<\/code> est <code>4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quaeque classis valorem praedefinitum in se habet. Itaque obiecta solum per <code>Bike.new<\/code> et <code>Car.new<\/code> creare potes. Accessor hereditatus tum rectum numerum rotarum reddit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tamen ipse valorem tradere potes, exempli gratia <code>Car.new(wheels =&gt; 3)<\/code>. Tum hic valor valorem praedefinitum superat. Sed birotae et autocineta plerumque solitum numerum rotarum habent. Itaque valores praedefiniti casum solitum simplicem faciunt. Et tamen interdum exceptionem facere potes.<\/span><\/li><\/ol>"]]}}}</script>
