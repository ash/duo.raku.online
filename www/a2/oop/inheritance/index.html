da nuevo en <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero <code>Dog<\/code> ya tiene el atributo <code>name<\/code> de <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">También tiene el método <code>speak<\/code> de <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto <code>Dog<\/code> también es un <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Con el smart-match <code>~~<\/code>, puedes comparar un objeto con un tipo.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es verdadero cuando el objeto tiene este tipo.<\/span> <span class=\"sg\" data-s=\"2\">También es verdadero cuando el objeto hereda de este tipo.<\/span> <span class=\"sg\" data-s=\"3\">El tema siguiente trata de una clase hija.<\/span> <span class=\"sg\" data-s=\"4\">Una clase hija hereda de una clase padre.<\/span> <span class=\"sg\" data-s=\"5\">Puede sustituir un método de su padre por su propia versión.<\/span><\/p>"]]},"it":{"t":"Ereditarietà","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">L'<em>ereditarietà<\/em> permette a una classe di costruire su un'altra classe.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, scrivi <code>is<\/code> dopo il nome della nuova classe.<\/span> <span class=\"sg\" data-s=\"2\">Poi scrivi il nome dell'altra classe.<\/span> <span class=\"sg\" data-s=\"3\">La nuova classe eredita dall'altra classe.<\/span> <span class=\"sg\" data-s=\"4\">Prende tutti i suoi attributi e metodi.<\/span> <span class=\"sg\" data-s=\"5\">L'altra classe è la classe <em>genitrice<\/em>, o la classe <em>base<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significa che un <code>Dog<\/code> è un tipo di <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In <code>Dog<\/code> non scriviamo niente di nuovo.<\/span> <span class=\"sg\" data-s=\"2\">Ma <code>Dog<\/code> ha già l'attributo <code>name<\/code> di <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ha anche il metodo <code>speak<\/code> di <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto <code>Dog<\/code> è anche un <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Con <code>~~<\/code> puoi fare lo smart-match di un oggetto con un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è vero quando l'oggetto ha questo tipo.<\/span> <span class=\"sg\" data-s=\"2\">È vero anche quando l'oggetto eredita da questo tipo.<\/span> <span class=\"sg\" data-s=\"3\">Il prossimo argomento parla di una classe figlia.<\/span> <span class=\"sg\" data-s=\"4\">Una classe figlia eredita da una classe genitrice.<\/span> <span class=\"sg\" data-s=\"5\">Può sostituire un metodo della sua genitrice con una sua versione.<\/span><\/p>"]]},"lv":{"t":"Mantošana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Mantošana<\/em> ļauj vienai klasei būvēties uz citas klases.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, rakstiet <code>is<\/code> aiz jaunās klases nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam rakstiet otras klases nosaukumu.<\/span> <span class=\"sg\" data-s=\"3\">Jaunā klase manto no otras klases.<\/span> <span class=\"sg\" data-s=\"4\">Tā iegūst visus otras klases atribūtus un metodes.<\/span> <span class=\"sg\" data-s=\"5\">Otrā klase ir <em>vecākklase<\/em> jeb <em>bāzes klase<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> nozīmē, ka <code>Dog<\/code> ir viens <code>Animal<\/code> veids.<\/span> <span class=\"sg\" data-s=\"1\">Klasē <code>Dog<\/code> mēs neko jaunu nerakstām.<\/span> <span class=\"sg\" data-s=\"2\">Bet <code>Dog<\/code> jau ir atribūts <code>name<\/code> no <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tai ir arī metode <code>speak<\/code> no <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> objekts ir arī <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ar gudro sakritību <code>~~<\/code> jūs varat salīdzināt objektu ar tipu.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir patiess, ja objekts ir šī tipa.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir patiess arī tad, ja objekts manto no šī tipa.<\/span> <span class=\"sg\" data-s=\"3\">Nākamais temats ir par bērnklasi.<\/span> <span class=\"sg\" data-s=\"4\">Bērnklase manto no vecākklases.<\/span> <span class=\"sg\" data-s=\"5\">Tā var aizstāt vecākklases metodi ar savu versiju.<\/span><\/p>"]]},"ru":{"t":"Наследование","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Наследование<\/em> позволяет построить один класс на основе другого класса.<\/span> <span class=\"sg\" data-s=\"1\">Для этого напишите <code>is<\/code> после имени нового класса.<\/span> <span class=\"sg\" data-s=\"2\">Потом напишите имя другого класса.<\/span> <span class=\"sg\" data-s=\"3\">Новый класс наследует от другого класса.<\/span> <span class=\"sg\" data-s=\"4\">Он получает все его атрибуты и методы.<\/span> <span class=\"sg\" data-s=\"5\">Этот другой класс — <em>родительский<\/em> класс, или <em>базовый<\/em> класс.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> значит, что <code>Dog<\/code> — это вид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Мы ничего не пишем в <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но у <code>Dog<\/code> уже есть атрибут <code>name<\/code> из <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ещё у него есть метод <code>speak<\/code> из <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Объект <code>Dog<\/code> — это ещё и <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>~~<\/code> можно сделать умное сопоставление объекта с типом.<\/span> <span class=\"sg\" data-s=\"1\">Результат истинный, когда у объекта этот тип.<\/span> <span class=\"sg\" data-s=\"2\">Он истинный и тогда, когда объект наследует от этого типа.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема — о дочернем классе.<\/span> <span class=\"sg\" data-s=\"4\">Дочерний класс наследует от родительского класса.<\/span> <span class=\"sg\" data-s=\"5\">Он может заменить метод родителя своей версией.<\/span><\/p>"]]},"uk":{"t":"Успадкування","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Успадкування<\/em> дозволяє одному класу будуватися на іншому класі.<\/span> <span class=\"sg\" data-s=\"1\">Для цього напишіть <code>is<\/code> після імені нового класу.<\/span> <span class=\"sg\" data-s=\"2\">Потім напишіть ім'я іншого класу.<\/span> <span class=\"sg\" data-s=\"3\">Новий клас успадковує від іншого класу.<\/span> <span class=\"sg\" data-s=\"4\">Він отримує всі його атрибути й методи.<\/span> <span class=\"sg\" data-s=\"5\">Інший клас — це <em>батьківський<\/em> клас, або <em>базовий<\/em> клас.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означає, що <code>Dog<\/code> — це різновид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ми не пишемо в <code>Dog<\/code> нічого нового.<\/span> <span class=\"sg\" data-s=\"2\">Але <code>Dog<\/code> уже має атрибут <code>name<\/code> від <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він також має метод <code>speak<\/code> від <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об'єкт <code>Dog<\/code> — це також <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Через <code>~~<\/code> ви робите розумне зіставлення об'єкта з типом.<\/span> <span class=\"sg\" data-s=\"1\">Результат істинний, коли об'єкт має цей тип.<\/span> <span class=\"sg\" data-s=\"2\">Він також істинний, коли об'єкт успадковує від цього типу.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема — про дочірній клас.<\/span> <span class=\"sg\" data-s=\"4\">Дочірній клас успадковує від батьківського класу.<\/span> <span class=\"sg\" data-s=\"5\">Він може замінити метод батьківського класу власною версією.<\/span><\/p>"]]},"bg":{"t":"Наследяване","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Наследяването<\/em> позволява един клас да се изгради върху друг клас.<\/span> <span class=\"sg\" data-s=\"1\">За да направите това, напишете <code>is<\/code> след името на новия клас.<\/span> <span class=\"sg\" data-s=\"2\">После напишете името на другия клас.<\/span> <span class=\"sg\" data-s=\"3\">Новият клас наследява другия клас.<\/span> <span class=\"sg\" data-s=\"4\">Той получава всичките му атрибути и методи.<\/span> <span class=\"sg\" data-s=\"5\">Другият клас е <em>родителският<\/em> клас, или <em>базовият<\/em> клас.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означава, че <code>Dog<\/code> е вид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Не пишем нищо ново в <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но <code>Dog<\/code> вече има атрибута <code>name<\/code> от <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той има и метода <code>speak<\/code> от <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обектът <code>Dog<\/code> е също и <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Можете да съпоставите обект с тип чрез интелигентното съпоставяне <code>~~<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е истина, когато обектът има този тип.<\/span> <span class=\"sg\" data-s=\"2\">Той е истина и когато обектът наследява този тип.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема е за дъщерния клас.<\/span> <span class=\"sg\" data-s=\"4\">Дъщерният клас наследява родителски клас.<\/span> <span class=\"sg\" data-s=\"5\">Той може да замени метод на родителя си със своя версия.<\/span><\/p>"]]},"eo":{"t":"Heredo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Heredo<\/em> permesas al unu klaso konstrui sur alia klaso.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, skribu <code>is<\/code> post la nomo de la nova klaso.<\/span> <span class=\"sg\" data-s=\"2\">Poste skribu la nomon de la alia klaso.<\/span> <span class=\"sg\" data-s=\"3\">La nova klaso heredas de la alia klaso.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ricevas ĉiujn ĝiajn atributojn kaj metodojn.<\/span> <span class=\"sg\" data-s=\"5\">La alia klaso estas la <em>patra<\/em> klaso, aŭ la <em>baza<\/em> klaso.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> signifas, ke <code>Dog<\/code> estas speco de <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ni skribas nenion novan en <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>Dog<\/code> jam havas la atributon <code>name<\/code> el <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ havas la metodon <code>speak<\/code> el <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objekto <code>Dog<\/code> ankaŭ estas <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Per <code>~~<\/code> vi povas saĝe kongruigi objekton kun tipo.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas vera, kiam la objekto havas ĉi tiun tipon.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ estas vera, kiam la objekto heredas de ĉi tiu tipo.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo estas pri ida klaso.<\/span> <span class=\"sg\" data-s=\"4\">Ida klaso heredas de patra klaso.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi povas anstataŭigi metodon de sia patro per sia propra versio.<\/span><\/p>"]]},"la":{"t":"Hereditas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Per <em>hereditatem<\/em> una classis super alteram classem aedificare potest.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc, scribe <code>is<\/code> post nomen novae classis.<\/span> <span class=\"sg\" data-s=\"2\">Deinde scribe nomen alterius classis.<\/span> <span class=\"sg\" data-s=\"3\">Nova classis ab altera classe heredat.<\/span> <span class=\"sg\" data-s=\"4\">Omnia eius attributa et methodos accipit.<\/span> <span class=\"sg\" data-s=\"5\">Altera classis est classis <em>parens<\/em>, vel classis <em>basis<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> hoc significat: <code>Dog<\/code> est genus quoddam <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nihil novi in <code>Dog<\/code> scribimus.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>Dog<\/code> iam attributum <code>name<\/code> ex <code>Animal<\/code> habet.<\/span> <span class=\"sg\" data-s=\"3\">Etiam methodum <code>speak<\/code> ex <code>Animal<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obiectum <code>Dog<\/code> etiam est <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Comparatione callida <code>~~<\/code> obiectum cum genere comparare potes.<\/span> <span class=\"sg\" data-s=\"1\">Effectus verus est cum obiectum hoc genus habet.<\/span> <span class=\"sg\" data-s=\"2\">Etiam verus est cum obiectum ab hoc genere heredat.<\/span> <span class=\"sg\" data-s=\"3\">Argumentum sequens classem filiam tractat.<\/span> <span class=\"sg\" data-s=\"4\">Classis filia a classe parente heredat.<\/span> <span class=\"sg\" data-s=\"5\">Methodum parentis sua versione substituere potest.<\/span><\/p>"]]}}}</script>
