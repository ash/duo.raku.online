<script type="application/json" id="page-data">{"u":"oop/files/appending","n":870,"k":"topic","pv":"oop/files","nx":"oop/files/appending/quiz","tr":["oop","oop/files"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Appending to a file","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Normally, <code>spurt<\/code> replaces all the old contents of the file.<\/span> <span class=\"sg\" data-s=\"1\">But you may want to add to the end of a file.<\/span> <span class=\"sg\" data-s=\"2\">For this, pass the named argument <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The second <code>spurt<\/code> keeps the old contents.<\/span> <span class=\"sg\" data-s=\"1\">It adds the new line after them.<\/span> <span class=\"sg\" data-s=\"2\">So in the end, the file has both lines:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Without <code>:append<\/code>, the second call writes over the file.<\/span> <span class=\"sg\" data-s=\"1\">Then the file has only <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Adding to the end of a file is called appending.<\/span> <span class=\"sg\" data-s=\"3\">It is useful for log files, for example.<\/span> <span class=\"sg\" data-s=\"4\">A log file keeps a record of the work of a program.<\/span> <span class=\"sg\" data-s=\"5\">Every run of the program adds to this record.<\/span> <span class=\"sg\" data-s=\"6\">So the record grows.<\/span> <span class=\"sg\" data-s=\"7\">The program does not start again with an empty file.<\/span><\/p>"]]},"de":{"t":"An eine Datei anhängen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Normalerweise ersetzt <code>spurt<\/code> den ganzen alten Inhalt der Datei.<\/span> <span class=\"sg\" data-s=\"1\">Aber vielleicht möchten Sie etwas am Ende einer Datei hinzufügen.<\/span> <span class=\"sg\" data-s=\"2\">Übergeben Sie dafür das benannte Argument <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das zweite <code>spurt<\/code> behält den alten Inhalt.<\/span> <span class=\"sg\" data-s=\"1\">Es setzt die neue Zeile dahinter.<\/span> <span class=\"sg\" data-s=\"2\">Am Ende hat die Datei also beide Zeilen:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ohne <code>:append<\/code> überschreibt der zweite Aufruf die Datei.<\/span> <span class=\"sg\" data-s=\"1\">Dann hat die Datei nur <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das Hinzufügen am Ende einer Datei heißt Anhängen.<\/span> <span class=\"sg\" data-s=\"3\">Das ist zum Beispiel für Protokolldateien nützlich.<\/span> <span class=\"sg\" data-s=\"4\">Eine Protokolldatei notiert die Arbeit eines Programms.<\/span> <span class=\"sg\" data-s=\"5\">Jeder Lauf des Programms fügt etwas zu diesem Protokoll hinzu.<\/span> <span class=\"sg\" data-s=\"6\">So wächst das Protokoll.<\/span> <span class=\"sg\" data-s=\"7\">Das Programm beginnt nicht wieder mit einer leeren Datei.<\/span><\/p>"]]},"nl":{"t":"Aan een bestand toevoegen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Normaal vervangt <code>spurt<\/code> de hele oude inhoud van het bestand.<\/span> <span class=\"sg\" data-s=\"1\">Maar misschien wil je iets aan het eind van een bestand toevoegen.<\/span> <span class=\"sg\" data-s=\"2\">Geef daarvoor het benoemde argument <code>:append<\/code> mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De tweede <code>spurt<\/code> bewaart de oude inhoud.<\/span> <span class=\"sg\" data-s=\"1\">Hij zet de nieuwe regel erachter.<\/span> <span class=\"sg\" data-s=\"2\">Dus heeft het bestand op het eind beide regels:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Zonder <code>:append<\/code> schrijft de tweede aanroep over het bestand heen.<\/span> <span class=\"sg\" data-s=\"1\">Dan heeft het bestand alleen <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Iets aan het eind van een bestand zetten heet toevoegen (append).<\/span> <span class=\"sg\" data-s=\"3\">Het is bijvoorbeeld nuttig voor logbestanden.<\/span> <span class=\"sg\" data-s=\"4\">Een logbestand houdt een verslag bij van het werk van een programma.<\/span> <span class=\"sg\" data-s=\"5\">Bij elke start voegt het programma iets aan dit verslag toe.<\/span> <span class=\"sg\" data-s=\"6\">Zo groeit het verslag.<\/span> <span class=\"sg\" data-s=\"7\">Het programma begint niet opnieuw met een leeg bestand.<\/span><\/p>"]]},"es":{"t":"Añadir a un archivo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Normalmente, <code>spurt<\/code> sustituye todo el contenido anterior del archivo.<\/span> <span class=\"sg\" data-s=\"1\">Pero a veces quieres añadir algo al final de un archivo.<\/span> <span class=\"sg\" data-s=\"2\">Para eso, pasa el argumento con nombre <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El segundo <code>spurt<\/code> conserva el contenido anterior.<\/span> <span class=\"sg\" data-s=\"1\">Añade la línea nueva después de él.<\/span> <span class=\"sg\" data-s=\"2\">Así que, al final, el archivo tiene las dos líneas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Sin <code>:append<\/code>, la segunda llamada escribe encima del archivo.<\/span> <span class=\"sg\" data-s=\"1\">Entonces el archivo solo tiene <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Añadir algo al final de un archivo se llama en inglés «append».<\/span> <span class=\"sg\" data-s=\"3\">Es útil, por ejemplo, para los archivos de registro.<\/span> <span class=\"sg\" data-s=\"4\">Un archivo de registro guarda un historial del trabajo de un programa.<\/span> <span class=\"sg\" data-s=\"5\">Cada ejecución del programa añade algo a este historial.<\/span> <span class=\"sg\" data-s=\"6\">Así que el historial crece.<\/span> <span class=\"sg\" data-s=\"7\">El programa no vuelve a empezar con un archivo vacío.<\/span><\/p>"]]},"it":{"t":"Aggiungere a un file","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Di solito <code>spurt<\/code> sostituisce tutto il vecchio contenuto del file.<\/span> <span class=\"sg\" data-s=\"1\">Ma forse vuoi aggiungere qualcosa alla fine di un file.<\/span> <span class=\"sg\" data-s=\"2\">Per questo, passa l'argomento nominato <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il secondo <code>spurt<\/code> tiene il vecchio contenuto.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge la nuova riga dopo il vecchio contenuto.<\/span> <span class=\"sg\" data-s=\"2\">Così alla fine il file ha tutte e due le righe:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Senza <code>:append<\/code>, la seconda chiamata scrive sopra il file.<\/span> <span class=\"sg\" data-s=\"1\">Allora il file ha solo <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aggiungere qualcosa alla fine di un file si dice aggiungere in coda.<\/span> <span class=\"sg\" data-s=\"3\">È utile per esempio per i file di log.<\/span> <span class=\"sg\" data-s=\"4\">Un file di log è un registro del lavoro di un programma.<\/span> <span class=\"sg\" data-s=\"5\">Ogni esecuzione del programma aggiunge qualcosa a questo registro.<\/span> <span class=\"sg\" data-s=\"6\">Così il registro cresce.<\/span> <span class=\"sg\" data-s=\"7\">Il programma non ricomincia con un file vuoto.<\/span><\/p>"]]},"lv":{"t":"Pievienošana failam","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Parasti <code>spurt<\/code> aizstāj visu veco faila saturu.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varbūt gribat kaut ko pievienot faila beigās.<\/span> <span class=\"sg\" data-s=\"2\">Tam padodiet nosaukto argumentu <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Otrais <code>spurt<\/code> patur veco saturu.<\/span> <span class=\"sg\" data-s=\"1\">Tas pievieno jauno rindu aiz tā.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc beigās failā ir abas rindas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Bez <code>:append<\/code> otrais izsaukums pārraksta failu.<\/span> <span class=\"sg\" data-s=\"1\">Tad failā ir tikai <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Rakstīšanu faila beigās sauc par pievienošanu.<\/span> <span class=\"sg\" data-s=\"3\">Tā noder, piemēram, žurnālfailiem.<\/span> <span class=\"sg\" data-s=\"4\">Žurnālfails glabā pierakstu par programmas darbu.<\/span> <span class=\"sg\" data-s=\"5\">Katra programmas palaišana papildina šo pierakstu.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc pieraksts aug.<\/span> <span class=\"sg\" data-s=\"7\">Programma nesāk no jauna ar tukšu failu.<\/span><\/p>"]]},"ru":{"t":"Добавление в файл","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Обычно <code>spurt<\/code> заменяет всё старое содержимое файла.<\/span> <span class=\"sg\" data-s=\"1\">Но иногда вы хотите добавить что-то в конец файла.<\/span> <span class=\"sg\" data-s=\"2\">Для этого передайте именованный аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Второй <code>spurt<\/code> сохраняет старое содержимое.<\/span> <span class=\"sg\" data-s=\"1\">Он добавляет новую строку после него.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому в конце в файле есть обе строки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второй вызов перезаписывает файл.<\/span> <span class=\"sg\" data-s=\"1\">Тогда в файле есть только <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Добавление в конец файла называется дописыванием.<\/span> <span class=\"sg\" data-s=\"3\">Оно полезно, например, для файлов журнала.<\/span> <span class=\"sg\" data-s=\"4\">Файл журнала хранит историю работы программы.<\/span> <span class=\"sg\" data-s=\"5\">Каждый запуск программы что-то добавляет в эту историю.<\/span> <span class=\"sg\" data-s=\"6\">Так история растёт.<\/span> <span class=\"sg\" data-s=\"7\">Программа не начинает заново с пустым файлом.<\/span><\/p>"]]},"uk":{"t":"Додавання до файлу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Зазвичай <code>spurt<\/code> замінює весь старий вміст файлу.<\/span> <span class=\"sg\" data-s=\"1\">Але іноді ви хочете додати щось у кінець файлу.<\/span> <span class=\"sg\" data-s=\"2\">Для цього передайте іменований аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Другий <code>spurt<\/code> зберігає старий вміст.<\/span> <span class=\"sg\" data-s=\"1\">Він додає новий рядок після нього.<\/span> <span class=\"sg\" data-s=\"2\">Тож наприкінці файл має обидва рядки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> другий виклик перезаписує файл.<\/span> <span class=\"sg\" data-s=\"1\">Тоді у файлі лишається тільки <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Додавання в кінець файлу називають дописуванням.<\/span> <span class=\"sg\" data-s=\"3\">Воно корисне, наприклад, для файлів журналу.<\/span> <span class=\"sg\" data-s=\"4\">Файл журналу зберігає запис про роботу програми.<\/span> <span class=\"sg\" data-s=\"5\">Кожен запуск програми доповнює цей запис.<\/span> <span class=\"sg\" data-s=\"6\">Тож запис росте.<\/span> <span class=\"sg\" data-s=\"7\">Програма не починає знову з порожнього файлу.<\/span><\/p>"]]},"bg":{"t":"Добавяне към файл","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Обикновено <code>spurt<\/code> заменя цялото старо съдържание на файла.<\/span> <span class=\"sg\" data-s=\"1\">Но може да искате да добавите нещо в края на файла.<\/span> <span class=\"sg\" data-s=\"2\">За това подайте именувания аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Второто <code>spurt<\/code> запазва старото съдържание.<\/span> <span class=\"sg\" data-s=\"1\">То добавя новия ред след него.<\/span> <span class=\"sg\" data-s=\"2\">Така накрая файлът има и двата реда:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второто извикване презаписва файла.<\/span> <span class=\"sg\" data-s=\"1\">Тогава във файла има само <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Добавянето в края на файл се нарича „append“.<\/span> <span class=\"sg\" data-s=\"3\">То е полезно например за журнални файлове.<\/span> <span class=\"sg\" data-s=\"4\">Журналният файл пази запис за работата на програмата.<\/span> <span class=\"sg\" data-s=\"5\">Всяко изпълнение на програмата добавя към този запис.<\/span> <span class=\"sg\" data-s=\"6\">Така записът расте.<\/span> <span class=\"sg\" data-s=\"7\">Програмата не започва отново с празен файл.<\/span><\/p>"]]},"eo":{"t":"Aldoni al dosiero","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Normale, <code>spurt<\/code> anstataŭigas la tutan malnovan enhavon de la dosiero.<\/span> <span class=\"sg\" data-s=\"1\">Sed eble vi volas aldoni al la fino de dosiero.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, transdonu la nomitan argumenton <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La dua <code>spurt<\/code> konservas la malnovan enhavon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas la novan linion post ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Do fine la dosiero havas ambaŭ liniojn:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Sen <code>:append<\/code>, la dua voko superskribas la dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la dosiero havas nur <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aldoni al la fino de dosiero nomiĝas aldonado.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas utila, ekzemple, por protokoldosieroj.<\/span> <span class=\"sg\" data-s=\"4\">Protokoldosiero tenas registron de la laboro de programo.<\/span> <span class=\"sg\" data-s=\"5\">Ĉiu rulo de la programo aldonas al ĉi tiu registro.<\/span> <span class=\"sg\" data-s=\"6\">Do la registro kreskas.<\/span> <span class=\"sg\" data-s=\"7\">La programo ne komencas denove kun malplena dosiero.<\/span><\/p>"]]},"la":{"t":"Ad plicam addere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Plerumque <code>spurt<\/code> omnia contenta vetera archivi substituit.<\/span> <span class=\"sg\" data-s=\"1\">Sed fortasse ad finem archivi addere vis.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc argumentum nominatum <code>:append<\/code> trade:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Secundum <code>spurt<\/code> contenta vetera servat.<\/span> <span class=\"sg\" data-s=\"1\">Novam lineam post ea addit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ad finem archivum ambas lineas habet:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Sine <code>:append<\/code> secunda vocatio archivum superscribit.<\/span> <span class=\"sg\" data-s=\"1\">Tum archivum solum <code>line2<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Additio ad finem archivi «apponere» vocatur.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, utilis est ad archiva annalium.<\/span> <span class=\"sg\" data-s=\"4\">Archivum annalium commentarium operis programmatis servat.<\/span> <span class=\"sg\" data-s=\"5\">Quisque cursus programmatis ad hunc commentarium addit.<\/span> <span class=\"sg\" data-s=\"6\">Itaque commentarius crescit.<\/span> <span class=\"sg\" data-s=\"7\">Programma non iterum ab archivo vacuo incipit.<\/span><\/p>"]]}}}</script>
