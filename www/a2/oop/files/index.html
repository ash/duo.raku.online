an class=\"sg\" data-s=\"3\">La razón es que el texto ya termina con un salto de línea.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Estas rutinas trabajan con todo el archivo de una vez.<\/span> <span class=\"sg\" data-s=\"1\">Son buenas para archivos pequeños.<\/span> <span class=\"sg\" data-s=\"2\">Un archivo pequeño cabe fácilmente en la memoria.<\/span> <span class=\"sg\" data-s=\"3\">Para un archivo grande, usas un <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejador de archivo<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">También lo usas para trabajar con un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"5\">Lo vas a ver al final de esta sección.<\/span> <span class=\"sg\" data-s=\"6\">El tema siguiente muestra cómo añadir algo a un archivo.<\/span> <span class=\"sg\" data-s=\"7\">El contenido anterior del archivo se queda ahí.<\/span><\/p>"]]},"it":{"t":"Lavorare con i file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco il modo più facile per lavorare con un file.<\/span> <span class=\"sg\" data-s=\"1\">Leggi o scrivi tutto il file in una volta.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La routine <code>spurt<\/code> scrive una stringa in un file.<\/span> <span class=\"sg\" data-s=\"1\">Crea il file.<\/span> <span class=\"sg\" data-s=\"2\">Oppure, se il file c'è già, sostituisce il vecchio contenuto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>slurp<\/code> legge tutto il file.<\/span> <span class=\"sg\" data-s=\"1\">Ti dà il contenuto come stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con <code>spurt<\/code> e <code>slurp<\/code> salvi dei dati e poi li carichi di nuovo.<\/span> <span class=\ >spurt<\/code> un <code>slurp<\/code> jūs saglabājat datus un atkal tos ielādējat.<\/span> <span class=\"sg\" data-s=\"1\">Jums vajag tikai divus īsus izsaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Šeit mēs lietojam <code>print<\/code>, nevis <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir tāpēc, ka teksts jau beidzas ar jaunas rindas rakstzīmi.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Šīs rutīnas strādā ar visu failu uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir labas maziem failiem.<\/span> <span class=\"sg\" data-s=\"2\">Mazs fails viegli ietilpst atmiņā.<\/span> <span class=\"sg\" data-s=\"3\">Lielam failam jūs lietojat <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">faila turi<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">To jūs lietojat arī, lai strādātu ar failu pa rindai.<\/span> <span class=\"sg\" data-s=\"5\">Par to jūs uzzināsiet šīs sadaļas beigās.<\/span> <span class=\"sg\" data-s=\"6\">Nākamais temats parāda, kā failam kaut ko pievienot.<\/span> <span class=\"sg\" data-s=\"7\">Vecais faila saturs paliek savā vietā.<\/span><\/p>"]]},"ru":{"t":"Работа с файлами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот самый простой способ работать с файлом.<\/span> <span class=\"sg\" data-s=\"1\">Вы читаете или записываете весь файл сразу.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>spurt<\/code> записывает строку в файл.<\/span> <span class=\"sg\" data-s=\"1\">Она создаёт файл.<\/span> <span class=\"sg\" data-s=\"2\">Или, если файл уже есть, она заменяет старое содержимое:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>slurp<\/code> читает весь файл.<\/span> <span class=\"sg\" data-s=\"1\">Она даёт вам содержимое в виде строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>spurt<\/code> и <code>slurp<\/code> вы сохраняете данные и снова загружаете их.<\/span> <span class=\"sg\" data-s=\"1\">Нужно всего два коротких вызова.<\/span> <span class=\"sg\" data-s=\"2\">Здесь мы используем <code>print<\/code>, а не <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Причина в том, что текст уже заканчивается переводом строки.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Эти процедуры работают со всем файлом сразу.<\/span> <span class=\"sg\" data-s=\"1\">Они хороши для маленьких файлов.<\/span> <span class=\"sg\" data-s=\"2\">Маленький файл легко помещается в памяти.<\/span> <span class=\"sg\" data-s=\"3\">Для большого файла вы используете <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловый дескриптор<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Он нужен и для работы с файлом строка за строкой.<\/span> <span class=\"sg\" data-s=\"5\">Вы узнаете о нём в конце этого раздела.<\/span> <span class=\"sg\" data-s=\"6\">Следующая тема показывает, как добавлять данные в файл.<\/span> <span class=\"sg\" data-s=\"7\">Старое содержимое файла при этом остаётся.<\/span><\/p>"]]},"uk":{"t":"Робота з файлами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось найпростіший спосіб працювати з файлом.<\/span> <span class=\"sg\" data-s=\"1\">Ви читаєте або записуєте весь файл за раз.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>spurt<\/code> записує рядок у файл.<\/span> <span class=\"sg\" data-s=\"1\">Вона створює файл.<\/span> <span class=\"sg\" data-s=\"2\">А якщо файл уже є, вона замінює старий вміст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>slurp<\/code> читає весь файл.<\/span> <span class=\"sg\" data-s=\"1\">Вона дає вам вміст як рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За допомогою <code>spurt<\/code> і <code>slurp<\/code> ви зберігаєте дані й знову їх завантажуєте.<\/span> <span class=\"sg\" data-s=\"1\">Вам потрібні лише два короткі виклики.<\/span> <span class=\"sg\" data-s=\"2\">Тут ми використовуємо <code>print<\/code>, а не <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Причина в тому, що текст уже закінчується символом нового рядка.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ці підпрограми працюють з усім файлом за раз.<\/span> <span class=\"sg\" data-s=\"1\">Вони підходять для малих файлів.<\/span> <span class=\"sg\" data-s=\"2\">Малий файл легко вміщається в пам'ять.<\/span> <span class=\"sg\" data-s=\"3\">Для великого файлу ви використовуєте <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптор файлу<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Його також використовують, щоб працювати з файлом рядок за рядком.<\/span> <span class=\"sg\" data-s=\"5\">Ви дізнаєтеся про нього наприкінці цього розділу.<\/span> <span class=\"sg\" data-s=\"6\">Наступна тема показує, як додавати щось до файлу.<\/span> <span class=\"sg\" data-s=\"7\">Старий вміст файлу лишається на місці.<\/span><\/p>"]]},"bg":{"t":"Работа с файлове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето най-лесния начин да работите с файл.<\/span> <span class=\"sg\" data-s=\"1\">Прочитате или записвате целия файл наведнъж.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>spurt<\/code> записва низ във файл.<\/span> <span class=\"sg\" data-s=\"1\">Тя създава файла.<\/span> <span class=\"sg\" data-s=\"2\">Или, ако файлът вече е там, заменя старото съдържание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>slurp<\/code> прочита целия файл.<\/span> <span class=\"sg\" data-s=\"1\">Тя ви дава съдържанието като низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Със <code>spurt<\/code> и <code>slurp<\/code> запазвате данни и ги зареждате отново.<\/span> <span class=\"sg\" data-s=\"1\">Трябват ви само две кратки извиквания.<\/span> <span class=\"sg\" data-s=\"2\">Тук използваме <code>print<\/code>, а не <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Причината е, че текстът вече завършва с нов ред.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тези процедури работят с целия файл наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Те са добри за малки файлове.<\/span> <span class=\"sg\" data-s=\"2\">Малкият файл лесно се побира в паметта.<\/span> <span class=\"sg\" data-s=\"3\">За голям файл използвате <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулатор на файл<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Използвате го и за да работите с файл ред по ред.<\/span> <span class=\"sg\" data-s=\"5\">Ще научите за него в края на този раздел.<\/span> <span class=\"sg\" data-s=\"6\">Следващата тема показва как да добавяте към файл.<\/span> <span class=\"sg\" data-s=\"7\">Старото съдържание на файла остава там.<\/span><\/p>"]]},"eo":{"t":"Labori kun dosieroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen la plej facila maniero labori kun dosiero.<\/span> <span class=\"sg\" data-s=\"1\">Vi legas aŭ skribas la tutan dosieron samtempe.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>spurt<\/code> skribas ĉenon en dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kreas la dosieron.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ, se la dosiero jam estas tie, ĝi anstataŭigas la malnovan enhavon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>slurp<\/code> legas la tutan dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi donas al vi la enhavon kiel ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per <code>spurt<\/code> kaj <code>slurp<\/code>, vi konservas datumojn kaj ŝargas ilin denove.<\/span> <span class=\"sg\" data-s=\"1\">Vi bezonas nur du mallongajn vokojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie, ni uzas <code>print<\/code> kaj ne <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La kialo estas, ke la teksto jam finiĝas per linifino.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj rutinoj laboras kun la tuta dosiero samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas bonaj por malgrandaj dosieroj.<\/span> <span class=\"sg\" data-s=\"2\">Malgranda dosiero facile eniras en la memoron.<\/span> <span class=\"sg\" data-s=\"3\">Por granda dosiero, vi uzas <a href=\"https://course.raku.org/eo/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">dosiertenilon<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ uzas ĝin por labori kun dosiero linio post linio.<\/span> <span class=\"sg\" data-s=\"5\">Vi lernas pri ĝi ĉe la fino de ĉi tiu sekcio.<\/span> <span class=\"sg\" data-s=\"6\">La sekva temo montras, kiel aldoni al dosiero.<\/span> <span class=\"sg\" data-s=\"7\">La malnova enhavo de la dosiero restas tie.<\/span><\/p>"]]},"la":{"t":"Cum plicis laborare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecce modus facillimus ut cum archivo labores.<\/span> <span class=\"sg\" data-s=\"1\">Totum archivum simul legis aut scribis.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>spurt<\/code> chordam in archivum scribit.<\/span> <span class=\"sg\" data-s=\"1\">Archivum creat.<\/span> <span class=\"sg\" data-s=\"2\">Aut, si archivum iam adest, contenta vetera substituit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>slurp<\/code> totum archivum legit.<\/span> <span class=\"sg\" data-s=\"1\">Contentum tibi ut chordam dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per <code>spurt<\/code> et <code>slurp<\/code> data servas et iterum oneras.<\/span> <span class=\"sg\" data-s=\"1\">Solum duas breves vocationes requiris.<\/span> <span class=\"sg\" data-s=\"2\">Hic <code>print<\/code> adhibemus, non <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Causa haec est: textus iam nova linea desinit.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Hae procedurae cum toto archivo simul laborant.<\/span> <span class=\"sg\" data-s=\"1\">Bonae sunt pro parvis archivis.<\/span> <span class=\"sg\" data-s=\"2\">Parvum archivum facile in memoriam intrat.<\/span> <span class=\"sg\" data-s=\"3\">Pro magno archivo <a href=\"https://course.raku.org/la/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">tractabulo archivi<\/a> uteris.<\/span> <span class=\"sg\" data-s=\"4\">Eo etiam uteris ut cum archivo linea post lineam labores.<\/span> <span class=\"sg\" data-s=\"5\">De eo in fine huius sectionis disces.<\/span> <span class=\"sg\" data-s=\"6\">Argumentum sequens ostendit quomodo archivo aliquid addas.<\/span> <span class=\"sg\" data-s=\"7\">Contenta vetera archivi ibi manent.<\/span><\/p>"]]}}}</script>
