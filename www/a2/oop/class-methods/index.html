<script type="application/json" id="page-data">{"u":"oop/class-methods","n":804,"k":"section","pv":"oop/methods/exercises/temperature/solution","nx":"oop/class-methods/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Class methods","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">You call most methods on an object.<\/span> <span class=\"sg\" data-s=\"1\">An object is an instance of a class.<\/span> <span class=\"sg\" data-s=\"2\">But you can also call a method on the class itself.<\/span> <span class=\"sg\" data-s=\"3\">This means that you call it on the type object.<\/span> <span class=\"sg\" data-s=\"4\">Such a method is often called a <em>class method<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">It is useful for values and actions of the whole class.<\/span> <span class=\"sg\" data-s=\"6\">They do not belong to just one object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You write a class method like any other method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">But you call it on the class name.<\/span> <span class=\"sg\" data-s=\"1\">You do not call it on an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You already know one class method.<\/span> <span class=\"sg\" data-s=\"1\">But you did not call it that.<\/span> <span class=\"sg\" data-s=\"2\">It is <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">You call <code>new<\/code> on the class, and it makes a new object.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">A class method cannot use the attributes of an instance.<\/span> <span class=\"sg\" data-s=\"1\">There is no object behind it.<\/span> <span class=\"sg\" data-s=\"2\">So it can only work with common information.<\/span> <span class=\"sg\" data-s=\"3\">This information is the same for every object of the class.<\/span> <span class=\"sg\" data-s=\"4\">Sometimes the work needs the data of one object.<\/span> <span class=\"sg\" data-s=\"5\">Then use a normal method, and call it on an instance.<\/span> <span class=\"sg\" data-s=\"6\">Sometimes the work does not need such data.<\/span> <span class=\"sg\" data-s=\"7\">Then a class method is a good choice.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Class methods do not need an instance.<\/span> <span class=\"sg\" data-s=\"1\">But sometimes you have an object.<\/span> <span class=\"sg\" data-s=\"2\">Then you can still use its data in them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints the result that you expect:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here you need an instance of the class.<\/span> <span class=\"sg\" data-s=\"1\">Without it, a call like <code>say Road.info<\/code> gives an error.<\/span><\/p>"]]},"de":{"t":"Klassenmethoden","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Die meisten Methoden rufen Sie auf einem Objekt auf.<\/span> <span class=\"sg\" data-s=\"1\">Ein Objekt ist eine Instanz einer Klasse.<\/span> <span class=\"sg\" data-s=\"2\">Aber Sie können eine Methode auch auf der Klasse selbst aufrufen.<\/span> <span class=\"sg\" data-s=\"3\">Das heißt, Sie rufen sie auf dem Typobjekt auf.<\/span> <span class=\"sg\" data-s=\"4\">So eine Methode heißt oft <em>Klassenmethode<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Sie ist nützlich für Werte und Aktionen der ganzen Klasse.<\/span> <span class=\"sg\" data-s=\"6\">Diese gehören nicht nur zu einem Objekt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine Klassenmethode schreiben Sie wie jede andere Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber Sie rufen sie auf dem Klassennamen auf.<\/span> <span class=\"sg\" data-s=\"1\">Sie rufen sie nicht auf einer Instanz auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie kennen schon eine Klassenmethode.<\/span> <span class=\"sg\" data-s=\"1\">Aber Sie haben sie nicht so genannt.<\/span> <span class=\"sg\" data-s=\"2\">Sie heißt <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sie rufen <code>new<\/code> auf der Klasse auf, und die Methode erstellt ein neues Objekt.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Eine Klassenmethode kann die Attribute einer Instanz nicht benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Hinter ihr steht kein Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Also kann sie nur mit gemeinsamen Informationen arbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Diese Informationen sind für jedes Objekt der Klasse gleich.<\/span> <span class=\"sg\" data-s=\"4\">Manchmal braucht die Arbeit die Daten eines Objekts.<\/span> <span class=\"sg\" data-s=\"5\">Dann nehmen Sie eine normale Methode und rufen sie auf einer Instanz auf.<\/span> <span class=\"sg\" data-s=\"6\">Manchmal braucht die Arbeit solche Daten nicht.<\/span> <span class=\"sg\" data-s=\"7\">Dann ist eine Klassenmethode eine gute Wahl.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Klassenmethoden brauchen keine Instanz.<\/span> <span class=\"sg\" data-s=\"1\">Aber manchmal haben Sie ein Objekt.<\/span> <span class=\"sg\" data-s=\"2\">Dann können Sie seine Daten trotzdem in ihnen benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt das Ergebnis aus, das Sie erwarten:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier brauchen Sie eine Instanz der Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Ohne sie gibt ein Aufruf wie <code>say Road.info<\/code> einen Fehler.<\/span><\/p>"]]},"nl":{"t":"Klassemethoden","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">De meeste methoden roep je aan op een object.<\/span> <span class=\"sg\" data-s=\"1\">Een object is een instantie van een klasse.<\/span> <span class=\"sg\" data-s=\"2\">Maar je kunt een methode ook op de klasse zelf aanroepen.<\/span> <span class=\"sg\" data-s=\"3\">Dat betekent: je roept haar aan op het typeobject.<\/span> <span class=\"sg\" data-s=\"4\">Zo'n methode heet vaak een <em>klassemethode<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ze is handig voor waarden en acties van de hele klasse.<\/span> <span class=\"sg\" data-s=\"6\">Die horen niet bij één enkel object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je schrijft een klassemethode net als elke andere methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar je roept haar aan op de naam van de klasse.<\/span> <span class=\"sg\" data-s=\"1\">Je roept haar niet aan op een instantie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kent al één klassemethode.<\/span> <span class=\"sg\" data-s=\"1\">Maar je noemde haar nog niet zo.<\/span> <span class=\"sg\" data-s=\"2\">Het is <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je roept <code>new<\/code> aan op de klasse, en die maakt een nieuw object.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Een klassemethode kan de attributen van een instantie niet gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Er zit geen object achter.<\/span> <span class=\"sg\" data-s=\"2\">Dus kan ze alleen met algemene informatie werken.<\/span> <span class=\"sg\" data-s=\"3\">Deze informatie is voor elk object van de klasse gelijk.<\/span> <span class=\"sg\" data-s=\"4\">Soms heeft het werk de gegevens van één object nodig.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik dan een gewone methode, en roep die aan op een instantie.<\/span> <span class=\"sg\" data-s=\"6\">Soms heeft het werk zulke gegevens niet nodig.<\/span> <span class=\"sg\" data-s=\"7\">Dan is een klassemethode een goede keuze.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Klassemethoden hebben geen instantie nodig.<\/span> <span class=\"sg\" data-s=\"1\">Maar soms heb je een object.<\/span> <span class=\"sg\" data-s=\"2\">Dan kun je zijn gegevens er toch in gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt het resultaat af dat je verwacht:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier heb je een instantie van de klasse nodig.<\/span> <span class=\"sg\" data-s=\"1\">Zonder die instantie geeft een aanroep als <code>say Road.info<\/code> een fout.<\/span><\/p>"]]},"es":{"t":"Métodos de clase","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Llamas a la mayoría de los métodos sobre un objeto.<\/span> <span class=\"sg\" data-s=\"1\">Un objeto es una instancia de una clase.<\/span> <span class=\"sg\" data-s=\"2\">Pero también puedes llamar a un método sobre la clase misma.<\/span> <span class=\"sg\" data-s=\"3\">Esto significa que lo llamas sobre el objeto de tipo.<\/span> <span class=\"sg\" data-s=\"4\">Un método así se llama a menudo <em>método de clase<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Es útil para valores y acciones de toda la clase.<\/span> <span class=\"sg\" data-s=\"6\">Estos valores y acciones no son de un solo objeto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Escribes un método de clase como cualquier otro método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero lo llamas sobre el nombre de la clase.<\/span> <span class=\"sg\" data-s=\"1\">No lo llamas sobre una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ya conoces un método de clase.<\/span> <span class=\"sg\" data-s=\"1\">Pero no le diste ese nombre.<\/span> <span class=\"sg\" data-s=\"2\">Es <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Llamas a <code>new<\/code> sobre la clase, y crea un objeto nuevo.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Un método de clase no puede usar los atributos de una instancia.<\/span> <span class=\"sg\" data-s=\"1\">No hay ningún objeto detrás.<\/span> <span class=\"sg\" data-s=\"2\">Así que solo puede trabajar con información común.<\/span> <span class=\"sg\" data-s=\"3\">Esta información es igual para todos los objetos de la clase.<\/span> <span class=\"sg\" data-s=\"4\">A veces el trabajo necesita los datos de un objeto.<\/span> <span class=\"sg\" data-s=\"5\">Entonces usa un método normal, y llámalo sobre una instancia.<\/span> <span class=\"sg\" data-s=\"6\">A veces el trabajo no necesita esos datos.<\/span> <span class=\"sg\" data-s=\"7\">Entonces un método de clase es una buena elección.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los métodos de clase no necesitan una instancia.<\/span> <span class=\"sg\" data-s=\"1\">Pero a veces tienes un objeto.<\/span> <span class=\"sg\" data-s=\"2\">Entonces también puedes usar sus datos en ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime el resultado que esperas:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí necesitas una instancia de la clase.<\/span> <span class=\"sg\" data-s=\"1\">Sin ella, una llamada como <code>say Road.info<\/code> da un error.<\/span><\/p>"]]},"it":{"t":"Metodi di classe","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Chiami quasi tutti i metodi su un oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Un oggetto è un'istanza di una classe.<\/span> <span class=\"sg\" data-s=\"2\">Ma puoi anche chiamare un metodo sulla classe stessa.<\/span> <span class=\"sg\" data-s=\"3\">Questo vuol dire che lo chiami sull'oggetto di tipo.<\/span> <span class=\"sg\" data-s=\"4\">Un metodo così spesso si chiama <em>metodo di classe<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">È utile per valori e azioni di tutta la classe.<\/span> <span class=\"sg\" data-s=\"6\">Non appartengono a un solo oggetto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scrivi un metodo di classe come ogni altro metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma lo chiami sul nome della classe.<\/span> <span class=\"sg\" data-s=\"1\">Non lo chiami su un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Conosci già un metodo di classe.<\/span> <span class=\"sg\" data-s=\"1\">Ma non lo hai mai chiamato così.<\/span> <span class=\"sg\" data-s=\"2\">È <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Chiami <code>new<\/code> sulla classe, e questo crea un nuovo oggetto.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Un metodo di classe non può usare gli attributi di un'istanza.<\/span> <span class=\"sg\" data-s=\"1\">Dietro di lui non c'è nessun oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Così può lavorare solo con informazioni comuni.<\/span> <span class=\"sg\" data-s=\"3\">Queste informazioni sono uguali per ogni oggetto della classe.<\/span> <span class=\"sg\" data-s=\"4\">A volte il lavoro ha bisogno dei dati di un oggetto.<\/span> <span class=\"sg\" data-s=\"5\">Allora usa un metodo normale, e chiamalo su un'istanza.<\/span> <span class=\"sg\" data-s=\"6\">A volte il lavoro non ha bisogno di questi dati.<\/span> <span class=\"sg\" data-s=\"7\">Allora un metodo di classe è una buona scelta.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I metodi di classe non hanno bisogno di un'istanza.<\/span> <span class=\"sg\" data-s=\"1\">Ma a volte hai un oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Allora puoi comunque usare i suoi dati in questi metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa il risultato che ti aspetti:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui ti serve un'istanza della classe.<\/span> <span class=\"sg\" data-s=\"1\">Senza di essa, una chiamata come <code>say Road.info<\/code> dà un errore.<\/span><\/p>"]]},"lv":{"t":"Klases metodes","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Lielāko daļu metožu jūs izsaucat uz objekta.<\/span> <span class=\"sg\" data-s=\"1\">Objekts ir klases instance.<\/span> <span class=\"sg\" data-s=\"2\">Bet metodi var izsaukt arī uz pašas klases.<\/span> <span class=\"sg\" data-s=\"3\">Tas nozīmē, ka jūs to izsaucat uz tipa objekta.<\/span> <span class=\"sg\" data-s=\"4\">Tādu metodi bieži sauc par <em>klases metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Tā noder visas klases vērtībām un darbībām.<\/span> <span class=\"sg\" data-s=\"6\">Tās nepieder tikai vienam objektam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klases metodi jūs rakstāt tāpat kā jebkuru citu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet jūs to izsaucat uz klases nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to neizsaucat uz instances:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs jau zināt vienu klases metodi.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs to tā nesaucāt.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs izsaucat <code>new<\/code> uz klases, un tā izveido jaunu objektu.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Klases metode nevar izmantot instances atribūtus.<\/span> <span class=\"sg\" data-s=\"1\">Aiz tās nav neviena objekta.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tā var strādāt tikai ar kopīgu informāciju.<\/span> <span class=\"sg\" data-s=\"3\">Šī informācija ir vienāda katram klases objektam.<\/span> <span class=\"sg\" data-s=\"4\">Dažreiz darbam vajag viena objekta datus.<\/span> <span class=\"sg\" data-s=\"5\">Tad izmantojiet parastu metodi un izsauciet to uz instances.<\/span> <span class=\"sg\" data-s=\"6\">Dažreiz darbam tādi dati nav vajadzīgi.<\/span> <span class=\"sg\" data-s=\"7\">Tad klases metode ir laba izvēle.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Klases metodēm nevajag instanci.<\/span> <span class=\"sg\" data-s=\"1\">Bet dažreiz jums ir objekts.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs tajās tomēr varat izmantot tā datus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā rezultātu, ko jūs gaidāt:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit jums vajag klases instanci.<\/span> <span class=\"sg\" data-s=\"1\">Bez tās tāds izsaukums kā <code>say Road.info<\/code> dod kļūdu.<\/span><\/p>"]]},"ru":{"t":"Методы класса","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Большинство методов вы вызываете у объекта.<\/span> <span class=\"sg\" data-s=\"1\">Объект — это экземпляр класса.<\/span> <span class=\"sg\" data-s=\"2\">Но метод можно вызвать и у самого класса.<\/span> <span class=\"sg\" data-s=\"3\">Это значит, что вы вызываете его у объекта типа.<\/span> <span class=\"sg\" data-s=\"4\">Такой метод часто называют <em>методом класса<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Он полезен для значений и действий всего класса.<\/span> <span class=\"sg\" data-s=\"6\">Они не принадлежат только одному объекту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы пишете метод класса так же, как любой другой метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но вы вызываете его у имени класса.<\/span> <span class=\"sg\" data-s=\"1\">Вы не вызываете его у экземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы уже знаете один метод класса.<\/span> <span class=\"sg\" data-s=\"1\">Но вы не называли его так.<\/span> <span class=\"sg\" data-s=\"2\">Это <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вы вызываете <code>new<\/code> у класса, и он создаёт новый объект.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Метод класса не может использовать атрибуты экземпляра.<\/span> <span class=\"sg\" data-s=\"1\">За ним не стоит никакой объект.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому он может работать только с общей информацией.<\/span> <span class=\"sg\" data-s=\"3\">Эта информация одинакова для всех объектов класса.<\/span> <span class=\"sg\" data-s=\"4\">Иногда для работы нужны данные одного объекта.<\/span> <span class=\"sg\" data-s=\"5\">Тогда используйте обычный метод и вызывайте его у экземпляра.<\/span> <span class=\"sg\" data-s=\"6\">Иногда для работы такие данные не нужны.<\/span> <span class=\"sg\" data-s=\"7\">Тогда метод класса — хороший выбор.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Методам класса не нужен экземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Но иногда у вас есть объект.<\/span> <span class=\"sg\" data-s=\"2\">Тогда вы всё равно можете использовать в них его данные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает тот результат, который вы ждёте:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь нужен экземпляр класса.<\/span> <span class=\"sg\" data-s=\"1\">Без него вызов вроде <code>say Road.info<\/code> даёт ошибку.<\/span><\/p>"]]},"uk":{"t":"Методи класу","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Більшість методів ви викликаєте для об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Об'єкт — це екземпляр класу.<\/span> <span class=\"sg\" data-s=\"2\">Але метод можна викликати й для самого класу.<\/span> <span class=\"sg\" data-s=\"3\">Тобто ви викликаєте його для об'єкта типу.<\/span> <span class=\"sg\" data-s=\"4\">Такий метод часто називають <em>методом класу<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Він корисний для значень і дій усього класу.<\/span> <span class=\"sg\" data-s=\"6\">Вони не належать лише одному об'єкту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод класу ви пишете так само, як будь-який інший метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але ви викликаєте його для імені класу.<\/span> <span class=\"sg\" data-s=\"1\">Ви не викликаєте його для екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви вже знаєте один метод класу.<\/span> <span class=\"sg\" data-s=\"1\">Але ви не називали його так.<\/span> <span class=\"sg\" data-s=\"2\">Це <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ви викликаєте <code>new<\/code> для класу, і він створює новий об'єкт.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Метод класу не може використовувати атрибути екземпляра.<\/span> <span class=\"sg\" data-s=\"1\">За ним немає об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Тож він може працювати лише зі спільною інформацією.<\/span> <span class=\"sg\" data-s=\"3\">Ця інформація однакова для кожного об'єкта класу.<\/span> <span class=\"sg\" data-s=\"4\">Іноді для роботи потрібні дані одного об'єкта.<\/span> <span class=\"sg\" data-s=\"5\">Тоді візьміть звичайний метод і викличте його для екземпляра.<\/span> <span class=\"sg\" data-s=\"6\">Іноді для роботи такі дані не потрібні.<\/span> <span class=\"sg\" data-s=\"7\">Тоді метод класу — добрий вибір.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Методам класу не потрібен екземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Але іноді у вас є об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ви все одно можете використати його дані в них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить результат, який ви чекаєте:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут вам потрібен екземпляр класу.<\/span> <span class=\"sg\" data-s=\"1\">Без нього виклик на зразок <code>say Road.info<\/code> дає помилку.<\/span><\/p>"]]},"bg":{"t":"Методи на класа","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Повечето методи извиквате върху обект.<\/span> <span class=\"sg\" data-s=\"1\">Обектът е екземпляр на клас.<\/span> <span class=\"sg\" data-s=\"2\">Но можете да извикате метод и върху самия клас.<\/span> <span class=\"sg\" data-s=\"3\">Това значи, че го извиквате върху обекта на типа.<\/span> <span class=\"sg\" data-s=\"4\">Такъв метод често се нарича <em>метод на класа<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Той е полезен за стойности и действия на целия клас.<\/span> <span class=\"sg\" data-s=\"6\">Те не принадлежат само на един обект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пишете метод на класа като всеки друг метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но го извиквате върху името на класа.<\/span> <span class=\"sg\" data-s=\"1\">Не го извиквате върху екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вие вече знаете един метод на класа.<\/span> <span class=\"sg\" data-s=\"1\">Но не сте го наричали така.<\/span> <span class=\"sg\" data-s=\"2\">Това е <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Извиквате <code>new<\/code> върху класа и той създава нов обект.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Методът на класа не може да използва атрибутите на екземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Зад него няма обект.<\/span> <span class=\"sg\" data-s=\"2\">Затова той може да работи само с обща информация.<\/span> <span class=\"sg\" data-s=\"3\">Тази информация е една и съща за всеки обект от класа.<\/span> <span class=\"sg\" data-s=\"4\">Понякога работата има нужда от данните на един обект.<\/span> <span class=\"sg\" data-s=\"5\">Тогава използвайте обикновен метод и го извикайте върху екземпляр.<\/span> <span class=\"sg\" data-s=\"6\">Понякога работата няма нужда от такива данни.<\/span> <span class=\"sg\" data-s=\"7\">Тогава методът на класа е добър избор.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Методите на класа нямат нужда от екземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Но понякога имате обект.<\/span> <span class=\"sg\" data-s=\"2\">Тогава пак можете да използвате данните му в тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва резултата, който очаквате:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук ви трябва екземпляр на класа.<\/span> <span class=\"sg\" data-s=\"1\">Без него извикване като <code>say Road.info<\/code> дава грешка.<\/span><\/p>"]]},"eo":{"t":"Klasmetodoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Vi vokas la plej multajn metodojn sur objekto.<\/span> <span class=\"sg\" data-s=\"1\">Objekto estas ekzemplero de klaso.<\/span> <span class=\"sg\" data-s=\"2\">Sed vi ankaŭ povas voki metodon sur la klaso mem.<\/span> <span class=\"sg\" data-s=\"3\">Tio signifas, ke vi vokas ĝin sur la tipobjekto.<\/span> <span class=\"sg\" data-s=\"4\">Tia metodo ofte nomiĝas <em>klasmetodo<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi estas utila por valoroj kaj agoj de la tuta klaso.<\/span> <span class=\"sg\" data-s=\"6\">Ili ne apartenas nur al unu objekto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi skribas klasmetodon kiel ĉiun alian metodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed vi vokas ĝin sur la nomo de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne vokas ĝin sur ekzemplero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi jam konas unu klasmetodon.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ne nomis ĝin tiel.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi vokas <code>new<\/code> sur la klaso, kaj ĝi faras novan objekton.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Klasmetodo ne povas uzi la atributojn de ekzemplero.<\/span> <span class=\"sg\" data-s=\"1\">Ne estas objekto malantaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Do ĝi povas labori nur kun komunaj informoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiuj informoj estas la samaj por ĉiu objekto de la klaso.<\/span> <span class=\"sg\" data-s=\"4\">Foje la laboro bezonas la datumojn de unu objekto.<\/span> <span class=\"sg\" data-s=\"5\">Tiam uzu normalan metodon, kaj voku ĝin sur ekzemplero.<\/span> <span class=\"sg\" data-s=\"6\">Foje la laboro ne bezonas tiajn datumojn.<\/span> <span class=\"sg\" data-s=\"7\">Tiam klasmetodo estas bona elekto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Klasmetodoj ne bezonas ekzempleron.<\/span> <span class=\"sg\" data-s=\"1\">Sed foje vi havas objekton.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi tamen povas uzi ĝiajn datumojn en ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas la rezulton, kiun vi atendas:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie vi bezonas ekzempleron de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">Sen ĝi, voko kiel <code>say Road.info<\/code> donas eraron.<\/span><\/p>"]]},"la":{"t":"Methodi classis","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Plerasque methodos in obiecto vocas.<\/span> <span class=\"sg\" data-s=\"1\">Obiectum est exemplar classis.<\/span> <span class=\"sg\" data-s=\"2\">Sed methodum etiam in ipsa classe vocare potes.<\/span> <span class=\"sg\" data-s=\"3\">Hoc significat: eam in obiecto generis vocas.<\/span> <span class=\"sg\" data-s=\"4\">Talem methodum saepe <em>methodum classis<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"5\">Utilis est pro valoribus et actionibus totius classis.<\/span> <span class=\"sg\" data-s=\"6\">Non ad unum tantum obiectum pertinent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodum classis scribis sicut ceteras methodos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed eam in nomine classis vocas.<\/span> <span class=\"sg\" data-s=\"1\">Eam in exemplari non vocas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Iam unam methodum classis nosti.<\/span> <span class=\"sg\" data-s=\"1\">Sed eam sic non appellavisti.<\/span> <span class=\"sg\" data-s=\"2\">Haec est <code>new<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>new<\/code> in classe vocas, et ea novum obiectum facit.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Methodus classis attributis exemplaris uti non potest.<\/span> <span class=\"sg\" data-s=\"1\">Nullum obiectum post eam est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque solum cum informatione communi operari potest.<\/span> <span class=\"sg\" data-s=\"3\">Haec informatio eadem est pro omni obiecto classis.<\/span> <span class=\"sg\" data-s=\"4\">Interdum opus data unius obiecti requirit.<\/span> <span class=\"sg\" data-s=\"5\">Tum methodo ordinaria utere, et eam in exemplari voca.<\/span> <span class=\"sg\" data-s=\"6\">Interdum opus talia data non requirit.<\/span> <span class=\"sg\" data-s=\"7\">Tum methodus classis bona electio est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Methodi classis exemplar non requirunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed interdum obiectum habes.<\/span> <span class=\"sg\" data-s=\"2\">Tum tamen datis eius in eis uti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma effectum imprimit quem exspectas:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic exemplar classis habere debes.<\/span> <span class=\"sg\" data-s=\"1\">Sine eo, vocatio sicut <code>say Road.info<\/code> errorem dat.<\/span><\/p>"]]}}}</script>
