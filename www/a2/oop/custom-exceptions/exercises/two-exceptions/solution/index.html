<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/two-exceptions/solution","n":968,"k":"solution","pv":"oop/custom-exceptions/exercises/two-exceptions","nx":"oop/custom-exceptions/quiz","tr":["oop","oop/custom-exceptions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Two exception types‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In the first round, the loop throws a <code>TooSmall<\/code>. In the second round, it throws a <code>TooBig<\/code>. Each one is thrown inside its own block. Each block has its own <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser has a <code>when<\/code> branch for each exception type. In each round, only one branch runs. This is the branch for the type of the thrown exception. So the first round prints <code>small<\/code>, and the second prints <code>big<\/code>. Each <code>when<\/code> branch is a handler for one type. So one set of handlers can treat each kind of error differently.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zwei Ausnahmetypen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In der ersten Runde wirft die Schleife eine <code>TooSmall<\/code>. In der zweiten Runde wirft sie eine <code>TooBig<\/code>. Jede Ausnahme entsteht in ihrem eigenen Block. Jeder Block hat sein eigenes <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der <code>CATCH<\/code>-Phaser hat einen <code>when<\/code>-Zweig für jeden Ausnahmetyp. In jeder Runde läuft nur ein Zweig. Das ist der Zweig für den Typ der geworfenen Ausnahme. Also gibt die erste Runde <code>small<\/code> aus, und die zweite gibt <code>big<\/code> aus. Jeder <code>when<\/code>-Zweig ist eine Behandlung für einen Typ. So kann eine Gruppe von Behandlungen auf jede Art von Fehler anders reagieren.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Twee exceptietypen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In de eerste ronde werpt de lus een <code>TooSmall<\/code>. In de tweede ronde werpt hij een <code>TooBig<\/code>. De lus werpt elke exceptie in een eigen blok. Elk blok heeft een eigen <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser heeft een <code>when<\/code>-tak voor elk exceptietype. In elke ronde draait maar één tak. Dat is de tak voor het type van de geworpen exceptie. Dus drukt de eerste ronde <code>small<\/code> af, en de tweede <code>big<\/code>. Elke <code>when<\/code>-tak is een afhandelaar voor één type. Zo kan één groep afhandelaars elke soort fout anders behandelen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Dos tipos de excepción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/ n {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nel primo giro il ciclo solleva una <code>TooSmall<\/code>. Nel secondo giro solleva una <code>TooBig<\/code>. Il ciclo solleva ognuna dentro il suo blocco. Ogni blocco ha il suo <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il phaser <code>CATCH<\/code> ha un ramo <code>when<\/code> per ogni tipo di eccezione. In ogni giro parte un solo ramo. È il ramo per il tipo dell'eccezione sollevata. Quindi il primo giro stampa <code>small<\/code>, e il secondo stampa <code>big<\/code>. Ogni ramo <code>when<\/code> è un gestore per un tipo. Così un solo gruppo di gestori può trattare ogni tipo di errore in modo diverso.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Divi izņēmumu tipi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pirmajā piegājienā cikls izmet <code>TooSmall<\/code>. Otrajā piegājienā tas izmet <code>TooBig<\/code>. Cikls izmet katru no tiem savā blokā. Katram blokam ir savs <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fāzerim <code>CATCH<\/code> ir <code>when<\/code> zars katram izņēmuma tipam. Katrā piegājienā izpildās tikai viens zars. Tas ir zars izmestā izņēmuma tipam. Tāpēc pirmais piegājiens izdrukā <code>small<\/code>, bet otrais — <code>big<\/code>. Katrs <code>when<\/code> zars ir apstrādātājs vienam tipam. Tā viens apstrādātāju kopums var katru kļūdas veidu apstrādāt citādi.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Два типа исключений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\ sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У першому проході цикл кидає <code>TooSmall<\/code>. У другому проході він кидає <code>TooBig<\/code>. Кожен виняток кидається всередині свого блоку. Кожен блок має свій <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> має гілку <code>when<\/code> для кожного типу винятку. У кожному проході виконується лише одна гілка. Це гілка для типу кинутого винятку. Тож перший прохід виводить <code>small<\/code>, а другий — <code>big<\/code>. Кожна гілка <code>when<\/code> — це обробник для одного типу. Тож один набір обробників може по-різному поводитися з кожним видом помилки.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Два типа изключения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В първата обиколка цикълът хвърля <code>TooSmall<\/code>. Във втората обиколка той хвърля <code>TooBig<\/code>. Всяко изключение се хвърля в свой собствен блок. Всеки блок има свой <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазерът <code>CATCH<\/code> има клон <code>when<\/code> за всеки тип изключение. Във всяка обиколка се изпълнява само един клон. Това е клонът за типа на хвърленото изключение. Затова първата обиколка отпечатва <code>small<\/code>, а втората отпечатва <code>big<\/code>. Всеки клон <code>when<\/code> е обработчик за един тип. Така един набор от обработчици може да третира всеки вид грешка различно.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Du esceptotipoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">En la unua rondo, la buklo ĵetas <code>TooSmall<\/code>. En la dua rondo, ĝi ĵetas <code>TooBig<\/code>. Ĉiu estas ĵetata ene de sia propra bloko. Ĉiu bloko havas sian propran <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La fazero <code>CATCH<\/code> havas branĉon <code>when<\/code> por ĉiu esceptotipo. En ĉiu rondo, nur unu branĉo ruliĝas. Tio estas la branĉo por la tipo de la ĵetita escepto. Do la unua rondo presas <code>small<\/code>, kaj la dua presas <code>big<\/code>. Ĉiu branĉo <code>when<\/code> estas traktilo por unu tipo. Do unu aro da traktiloj povas trakti ĉiun specon de eraro malsame.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Duo genera exceptionum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">In primo gyro anulus <code>TooSmall<\/code> iacit. In secundo gyro <code>TooBig<\/code> iacit. Anulus utramque intra suam clausulam iacit. Quaeque clausula suam <code>CATCH<\/code> habet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fasis <code>CATCH<\/code> ramum <code>when<\/code> pro quoque genere exceptionis habet. In quoque gyro solus unus ramus currit. Hic est ramus pro genere exceptionis iactae. Itaque primus gyrus <code>small<\/code> imprimit, et secundus <code>big<\/code>. Quisque ramus <code>when<\/code> est tractator pro uno genere. Itaque una series tractatorum quodque genus erroris aliter tractare potest.<\/span><\/li><\/ol>"]]}}}</script>
