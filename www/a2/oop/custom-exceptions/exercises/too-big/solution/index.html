<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/too-big/solution","n":964,"k":"solution","pv":"oop/custom-exceptions/exercises/too-big","nx":"oop/custom-exceptions/exercises/negative-error","tr":["oop","oop/custom-exceptions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Too big‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> makes the class an exception. You can throw it. It holds two pieces of data, <code>value<\/code> and <code>limit<\/code>. Its method <code>message<\/code> puts both of them into the text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> throws the exception. <code>when TooBig<\/code> matches it by its type. The code in <code>when TooBig<\/code> is the handler. It does more than print the message. It also reads the attribute <code>limit<\/code> from the caught object. With it, the handler gives a useful hint. This is why a custom exception is better than a simple string. The handler gets data in a clear form. It can act on this data.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The exception is thrown <strong>only<\/strong> when <code>$value &gt; $limit<\/code>. For <code>30<\/code>, there is no exception. The body of the loop runs to the end. Its <code>say<\/code> prints that the value is inside the limit. For <code>99<\/code> and <code>60<\/code>, the <code>throw<\/code> happens. So the program skips that <code>say<\/code>. The <code>CATCH<\/code> handles the exception instead. Here, the <code>CATCH<\/code> is right in the body of the <code>for<\/code> loop. So a caught exception ends only the current round. Then the loop simply goes on to the next value.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zu groß","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> macht aus der Klasse eine Ausnahme. Sie können sie werfen. Sie enthält zwei Werte, <code>value<\/code> und <code>limit<\/code>. Ihre Methode <code>message<\/code> setzt beide in den Text ein.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> wirft die Ausnahme. <code>when TooBig<\/code> erkennt sie an ihrem Typ. Der Code in <code>when TooBig<\/code> ist die Behandlung. Die Behandlung gibt nicht nur die Meldung aus. Sie liest auch das Attribut <code>limit<\/code> aus dem gefangenen Objekt. Damit gibt die Behandlung einen nützlichen Hinweis. Darum ist eine eigene Ausnahme besser als eine einfache Zeichenkette. Die Behandlung bekommt Daten in einer klaren Form. Sie kann mit diesen Daten arbeiten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Programm wirft die Ausnahme <strong>nur<\/strong>, wenn <code>$value &gt; $limit<\/code> gilt. Für <code>30<\/code> gibt es keine Ausnahme. Der Rumpf der Schleife läuft bis zum Ende. Sein <code>say<\/code> gibt aus, dass der Wert innerhalb der Grenze liegt. Für <code>99<\/code> und <code>60<\/code> passiert das <code>throw<\/code>. Also überspringt das Programm dieses <code>say<\/code>. Stattdessen behandelt das <code>CATCH<\/code> die Ausnahme. Hier steht das <code>CATCH<\/code> direkt im Rumpf der <code>for<\/code>-Schleife. Also beendet eine gefangene Ausnahme nur die aktuelle Runde. Dann geht die Schleife einfach zum nächsten Wert weiter.<\/span><\/li><\/ol>"]]},"nl": ;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> rende la classe un'eccezione. Puoi sollevarla. Contiene due dati, <code>value<\/code> e <code>limit<\/code>. Il suo metodo <code>message<\/code> li mette tutti e due nel testo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> solleva l'eccezione. <code>when TooBig<\/code> la riconosce dal suo tipo. Il codice in <code>when TooBig<\/code> è il gestore. Fa di più che stampare il messaggio. Legge anche l'attributo <code>limit<\/code> dall'oggetto intercettato. Con questo il gestore dà un consiglio utile. Per questo un'eccezione personalizzata è meglio di una semplice stringa. Il gestore riceve dati in una forma chiara. Può agire su questi dati.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il programma solleva l'eccezione <strong>solo<\/strong> quando <code>$value &gt; $limit<\/code>. Per <code>30<\/code> non c'è nessuna eccezione. Il corpo ās metode <code>message<\/code> ieliek tos abus tekstā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> izmet izņēmumu. <code>when TooBig<\/code> tam atbilst pēc tipa. Kods zarā <code>when TooBig<\/code> ir apstrādātājs. Tas ne tikai izdrukā paziņojumu. Tas arī nolasa atribūtu <code>limit<\/code> no noķertā objekta. Ar to apstrādātājs dod noderīgu padomu. Tāpēc paša definēts izņēmums ir labāks par vienkāršu virkni. Apstrādātājs saņem datus skaidrā formā. Tas var uz šiem datiem reaģēt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Programma izmet izņēmumu <strong>tikai<\/strong> tad, kad <code>$value &gt; $limit<\/code>. Vērtībai <code>30<\/code> izņēmuma nav. Cikla ķermenis izpildās līdz beigām. Tā <code>say<\/code> izdrukā, ka vērtība ir robežās. Vērtībām <code>99<\/code> un <code>60<\/code> notiek <code>throw<\/code>. Tāpēc programma izlaiž šo <code>say<\/code>. Tā vietā izņēmumu apstrādā <code>CATCH<\/code>. Šeit <code>CATCH<\/code> ir tieši cikla <code>for<\/code> ķermenī. Tāpēc noķerts izņēmums beidz tikai pašreizējo piegājienu. Tad cikls vienkārši turpina ar nākamo vērtību.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Слишком большое","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> делает класс исключением. Его можно бросить. Он хранит два значения: <code>value<\/code> и <code>limit<\/code>. Его метод <code>message<\/code> вставляет их оба в текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> бросает исключение. <code>when TooBig<\/code> совпадает с ним по типу. Код в <code>when TooBig<\/code> — это обработчик. Он не только печатает сообщение. Ещё он читает атрибут <code>limit<\/code> у перехваченного объекта. С его помощью обработчик даёт полезную подсказку. Вот почему собственное исключение лучше простой строки. Обработчик получает данные в понятном виде. Он может работать с этими данными.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Исключение бросается <strong>только<\/strong> тогда, когда <code>$value &gt; $limit<\/code>. Для <code>30<\/code> исключения нет. Тело цикла выполняется до конца. Его <code>say<\/code> печатает, что значение не больше предела. Для <code>99<\/code> и <code>60<\/code> срабатывает <code>throw<\/code>. Поэтому программа пропускает этот <code>say<\/code>. Вместо него исключение обрабатывает <code>CATCH<\/code>. Здесь <code>CATCH<\/code> стоит прямо в теле цикла <code>for<\/code>. Поэтому перехваченное исключение завершает только текущий проход. Потом цикл просто переходит к следующему значению.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Завелике","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> робить клас винятком. Його можна кинути. Він зберігає два значення, <code>value<\/code> та <code>limit<\/code>. Його метод <code>message<\/code> вставляє обидва в текст.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> кидає виняток. <code>when TooBig<\/code> зіставляється з ним за типом. Код у <code>when TooBig<\/code> — це обробник. Він робить більше, ніж просто виводить повідомлення. Він також читає атрибут <code>limit<\/code> із перехопленого об'єкта. З ним обробник дає корисну підказку. Ось чому власний виняток кращий за простий рядок. Обробник отримує дані в чіткій формі. Він може працювати з цими даними.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Програма кидає виняток <strong>лише<\/strong> тоді, коли <code>$value &gt; $limit<\/code>. Для <code>30<\/code> винятку немає. Тіло циклу виконується до кінця. Його <code>say<\/code> виводить, що значення не виходить за межу. Для <code>99<\/code> та <code>60<\/code> спрацьовує <code>throw<\/code>. Тож програма пропускає цей <code>say<\/code>. Натомість виняток обробляє <code>CATCH<\/code>. Тут <code>CATCH<\/code> стоїть прямо в тілі циклу <code>for<\/code>. Тож перехоплений виняток завершує лише поточний прохід. Потім цикл просто йде далі до наступного значення.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Твърде голямо","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> прави класа изключение. Можете да го хвърлите. Той пази две парчета данни, <code>value<\/code> и <code>limit<\/code>. Неговият метод <code>message<\/code> слага и двете в текста.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> хвърля изключението. <code>when TooBig<\/code> го съпоставя по неговия тип. Кодът в <code>when TooBig<\/code> е обработчикът. Той не само отпечатва съобщението. Той чете и атрибута <code>limit<\/code> от прихванатия обект. С него обработчикът дава полезна подсказка. Ето защо собственото изключение е по-добро от обикновен низ. Обработчикът получава данни в ясна форма. Той може да действа според тези данни.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изключението се хвърля <strong>само<\/strong> когато <code>$value &gt; $limit<\/code>. За <code>30<\/code> няма изключение. Тялото на цикъла се изпълнява до края. Неговото <code>say<\/code> отпечатва, че стойността не е над границата. За <code>99<\/code> и <code>60<\/code> се случва <code>throw<\/code>. Затова програмата пропуска това <code>say<\/code>. Вместо това <code>CATCH<\/code> обработва изключението. Тук <code>CATCH<\/code> е направо в тялото на цикъла <code>for<\/code>. Затова прихванатото изключение спира само текущата обиколка. После цикълът просто продължава към следващата стойност.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Tro granda","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> faras el la klaso escepton. Vi povas ĵeti ĝin. Ĝi tenas du pecojn da datumoj, <code>value<\/code> kaj <code>limit<\/code>. Ĝia metodo <code>message<\/code> metas ambaŭ en la tekston.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> ĵetas la escepton. <code>when TooBig<\/code> kongruas kun ĝi laŭ ĝia tipo. La kodo en <code>when TooBig<\/code> estas la traktilo. Ĝi faras pli ol presi la mesaĝon. Ĝi ankaŭ legas la atributon <code>limit<\/code> el la kaptita objekto. Per ĝi, la traktilo donas utilan konsilon. Tial propra escepto estas pli bona ol simpla ĉeno. La traktilo ricevas datumojn en klara formo. Ĝi povas agi laŭ ĉi tiuj datumoj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La escepto estas ĵetata <strong>nur<\/strong>, kiam <code>$value &gt; $limit<\/code>. Por <code>30<\/code>, ne estas escepto. La korpo de la buklo ruliĝas ĝis la fino. Ĝia <code>say<\/code> presas, ke la valoro estas ene de la limo. Por <code>99<\/code> kaj <code>60<\/code>, la <code>throw<\/code> okazas. Do la programo preterlasas tiun <code>say<\/code>. La <code>CATCH<\/code> anstataŭe traktas la escepton. Ĉi tie, la <code>CATCH<\/code> estas rekte en la korpo de la buklo <code>for<\/code>. Do kaptita escepto finas nur la nunan rondon. Poste la buklo simple iras al la sekva valoro.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Nimis magnum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> classem exceptionem facit. Eam iacere potes. Duo data tenet, <code>value<\/code> et <code>limit<\/code>. Methodus eius <code>message<\/code> utrumque in textum ponit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> exceptionem iacit. <code>when TooBig<\/code> ei genere suo convenit. Codex in <code>when TooBig<\/code> est tractator. Plus agit quam nuntium imprimere. Etiam attributum <code>limit<\/code> ex obiecto capto legit. Per id tractator consilium utile dat. Ideo exceptio propria melior est quam chorda simplex. Tractator data in forma clara accipit. Secundum haec data agere potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Programma exceptionem <strong>solum<\/strong> iacit cum <code>$value &gt; $limit<\/code>. Pro <code>30<\/code> nulla exceptio est. Corpus anuli usque ad finem currit. <code>say<\/code> eius imprimit valorem intra limitem esse. Pro <code>99<\/code> et <code>60<\/code> fit <code>throw<\/code>. Itaque programma illud <code>say<\/code> praeterit. <code>CATCH<\/code> loco eius exceptionem tractat. Hic <code>CATCH<\/code> in ipso corpore anuli <code>for<\/code> est. Itaque exceptio capta solum gyrum currentem finit. Deinde anulus simpliciter ad valorem sequentem pergit.<\/span><\/li><\/ol>"]]}}}</script>
