учают только плохие числа.<\/span> <span class=\"sg\" data-s=\"1\">Остальные числа проходят без проблем.<\/span> <span class=\"sg\" data-s=\"2\">В обоих случаях цикл идёт дальше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Завелике»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Створіть власний клас винятку <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це клас для ваших власних помилок.<\/span> <span class=\"sg\" data-s=\"2\">Він успадковує від <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він має два атрибути, <code>value<\/code> та <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Його метод <code>message<\/code> має повертати <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Потім напишіть цикл по значеннях <code>30<\/code>, <code>99<\/code> та <code>60<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Межа дорівнює <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Кидайте <code>TooBig<\/code>, лише коли значення більше за межу.<\/span> <span class=\"sg\" data-s=\"3\">Додайте фазер <code>CATCH<\/code> із <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Він виводить повідомлення <strong>і<\/strong> другий рядок.<\/span> <span class=\"sg\" data-s=\"5\">Для цього рядка він читає атрибут <code>limit<\/code> винятку напряму.<\/span> <span class=\"sg\" data-s=\"6\">Другий рядок — це <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Якщо значення не виходить за межу, просто виведіть, що все гаразд.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви бачите, що виняток отримують лише погані числа.<\/span> <span class=\"sg\" data-s=\"1\">Інші числа проходять без проблем.<\/span> <span class=\"sg\" data-s=\"2\">В обох випадках цикл іде далі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Твърде голямо“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Създайте собствен клас изключение <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е клас за вашите собствени грешки.<\/span> <span class=\"sg\" data-s=\"2\">Той наследява <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той има два атрибута, <code>value<\/code> и <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Неговият метод <code>message<\/code> трябва да връща <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">После напишете цикъл по стойностите <code>30<\/code>, <code>99<\/code> и <code>60<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Границата е <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Хвърляйте <code>TooBig<\/code> само когато стойността е по-голяма от границата.<\/span> <span class=\"sg\" data-s=\"3\">Добавете фазер <code>CATCH<\/code> с <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Той отпечатва съобщението <strong>и<\/strong> втори ред.<\/span> <span class=\"sg\" data-s=\"5\">За този ред той чете направо атрибута <code>limit<\/code> на изключението.<\/span> <span class=\"sg\" data-s=\"6\">Вторият ред е <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">За стойност до границата просто отпечатайте, че е наред.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Виждате, че само провалените числа получават изключение.<\/span> <span class=\"sg\" data-s=\"1\">Другите числа минават без проблем.<\/span> <span class=\"sg\" data-s=\"2\">И в двата случая цикълът продължава.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Tro granda","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Faru propran esceptoklason <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas klaso por viaj propraj eraroj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi heredas de <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi havas du atributojn, <code>value<\/code> kaj <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝia metodo <code>message<\/code> devas redoni <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Poste skribu buklon tra la valoroj <code>30<\/code>, <code>99<\/code> kaj <code>60<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La limo estas <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĵetu <code>TooBig<\/code> nur, kiam valoro estas pli granda ol la limo.<\/span> <span class=\"sg\" data-s=\"3\">Aldonu fazeron <code>CATCH<\/code> kun <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi presas la mesaĝon <strong>kaj<\/strong> duan linion.<\/span> <span class=\"sg\" data-s=\"5\">Por ĉi tiu linio, ĝi legas la atributon <code>limit<\/code> de la escepto rekte.<\/span> <span class=\"sg\" data-s=\"6\">La dua linio estas <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Por valoro ene de la limo, simple presu, ke ĝi estas en ordo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi vidas, ke nur la malsukcesantaj nombroj ricevas escepton.<\/span> <span class=\"sg\" data-s=\"1\">La aliaj nombroj pasas sen problemo.<\/span> <span class=\"sg\" data-s=\"2\">En ambaŭ kazoj, la buklo daŭras.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Nimis magnum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Fac classem exceptionis propriae <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Haec est classis pro erroribus tuis.<\/span> <span class=\"sg\" data-s=\"2\">Ab <code>Exception<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"3\">Duo attributa habet, <code>value<\/code> et <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Methodus eius <code>message<\/code> reddere debet <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Deinde scribe anulum per valores <code>30<\/code>, <code>99<\/code> et <code>60<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Limes est <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Iace <code>TooBig<\/code> solum cum valor maior quam limes est.<\/span> <span class=\"sg\" data-s=\"3\">Adde fasim <code>CATCH<\/code> cum <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ea nuntium <strong>et<\/strong> alteram lineam imprimit.<\/span> <span class=\"sg\" data-s=\"5\">Pro hac linea attributum <code>limit<\/code> exceptionis directe legit.<\/span> <span class=\"sg\" data-s=\"6\">Altera linea est <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Pro valore intra limitem tantum imprime valorem bonum esse.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vides: solum numeri deficientes exceptionem accipiunt.<\/span> <span class=\"sg\" data-s=\"1\">Ceteri numeri sine problemate transeunt.<\/span> <span class=\"sg\" data-s=\"2\">Utroque casu anulus pergit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
