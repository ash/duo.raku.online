<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/negative-error/solution","n":966,"k":"solution","pv":"oop/custom-exceptions/exercises/negative-error","nx":"oop/custom-exceptions/exercises/two-exceptions","tr":["oop","oop/custom-exceptions"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A negative error‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one way to solve the task.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> lets you throw this class. Its method <code>message<\/code> builds the text from the attribute <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> tests its input. For a negative number, it throws the custom exception. The exception goes out of <code>check<\/code>. It goes to the <code>CATCH<\/code> in the block that called <code>check<\/code>. There, <code>when Negative<\/code> matches it by its type. Then the <code>CATCH<\/code> prints the message. This is a very common, real use of custom exceptions. A program checks its input. For a bad value, it throws an exception of its own type.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Why is there a <code>{ … }<\/code> around the call? A <code>CATCH<\/code> phaser handles only the exceptions from <strong>its own block<\/strong>. This is the block that has the <code>CATCH<\/code> inside. Here, the block holds the call <code>check(-5)<\/code> together with its <code>CATCH<\/code>. The call may fail, and the <code>CATCH<\/code> is there for it. So the exception is caught right here. Then the program goes on just after the block. What if there is no block? Then the <code>CATCH<\/code> works for the whole program. It catches the exception. But then the program simply ends. There is no good place to go on.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The last line, <code>Negative.new(n =&gt; -10).throw<\/code>, shows the opposite case. This line is <strong>outside<\/strong> the block. So nothing catches the exception. The exception goes all the way up to the top. Then the program dies, or stops with an error. It prints the message to standard error. It also prints a backtrace there. A backtrace shows where in the code the error happened. Then the program ends with an exit code other than <code>0<\/code>. This happens to every exception that you do not catch. And this is why the first throw needed a <code>CATCH<\/code>. Without it, the program cannot go on.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein Fehler bei negativen Zahlen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Weg, die Aufgabe zu lösen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mit <code>Negative is Exception<\/code> können Sie diese Klasse werfen. Ihre Methode <code>message<\/code> baut den Text aus dem Attribut <code>n<\/code> zusammen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> prüft seine Eingabe. Für eine negative Zahl wirft es die eigene Ausnahme. Die Ausnahme geht aus <code>check<\/code> hinaus. Sie geht zum <code>CATCH<\/code> in dem Block, der <code>check<\/code> aufgerufen hat. Dort erkennt <code>when Negative<\/code> sie an ihrem Typ. Dann gibt das <code>CATCH<\/code> die Meldung aus. Das ist eine sehr häufige, echte Verwendung eigener Ausnahmen. Ein Programm prüft seine Eingabe. Für einen schlechten Wert wirft es eine Ausnahme mit eigenem Typ.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Warum steht ein <code>{ … }<\/code> um den Aufruf? Ein <code>CATCH<\/code>-Phaser behandelt nur die Ausnahmen aus <strong>seinem eigenen Block<\/strong>. Das ist der Block, in dem das <code>CATCH<\/code> steht. Hier enthält der Block den Aufruf <code>check(-5)<\/code> zusammen mit seinem <code>CATCH<\/code>. Der Aufruf kann fehlschlagen, und das <code>CATCH<\/code> ist dafür da. Also fängt das <code>CATCH<\/code> die Ausnahme genau hier. Dann läuft das Programm direkt nach dem Block weiter. Was ist, wenn es keinen Block gibt? Dann gilt das <code>CATCH<\/code> für das ganze Programm. Es fängt die Ausnahme. Aber dann endet das Programm einfach. Es gibt keine gute Stelle zum Weitermachen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die letzte Zeile, <code>Negative.new(n =&gt; -10).throw<\/code>, zeigt den anderen Fall. Diese Zeile steht <strong>außerhalb<\/strong> des Blocks. Also fängt nichts die Ausnahme. Die Ausnahme geht ganz nach oben. Dann stirbt das Programm, das heißt, es stoppt mit einem Fehler. Es gibt die Meldung auf der Standardfehlerausgabe aus. Dort gibt es auch eine Rückverfolgung aus. Eine Rückverfolgung zeigt, wo im Code der Fehler passiert ist. Dann endet das Programm mit einem anderen Exit-Code als <code>0<\/code>. Das passiert mit jeder Ausnahme, die Sie nicht fangen. Und darum braucht der erste Wurf ein <code>CATCH<\/code>. Ohne das <code>CATCH<\/code> kann das Programm nicht weitermachen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een negatieve fout","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een manier om de taak op te lossen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\  <strong>buiten<\/strong> het blok. Dus vangt niets de exceptie. De exceptie gaat helemaal naar boven. Dan sterft het programma, of het stopt met een fout. Het drukt de melding af op de standaardfout. Het drukt daar ook een backtrace af. Een backtrace toont waar in de code de fout gebeurde. Daarna eindigt het programma met een exitcode anders dan <code>0<\/code>. Dit gebeurt met elke exceptie die je niet vangt. En daarom had de eerste worp een <code>CATCH<\/code> nodig. Zonder <code>CATCH<\/code> kan het programma niet verder.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un error de número negativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma de resolver la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> te permite lanzar esta clase. Su método <code>message<\/code> crea el texto con el atributo <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> comprueba su entrada. Para un número negativo, lanza la excepción personalizada. La excepción sale de <code>check<\/code>. Va al <code>CATCH<\/code> del bloque que llamó a <code>check<\/code>. Allí, <code>when Negative<\/code> coincide con ella por su tipo. Después el <code>CATCH<\/code> imprime el mensaje. Este es un uso muy común y real de las excepciones personalizadas. Un programa comprueba su entrada. Para un valor malo, lanza una excepción de su propio tipo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">¿Por qué hay unas <code>{ … }<\/code> alrededor de la llamada? Un phaser <code>CATCH<\/code> maneja solo las excepciones de <strong>su propio bloque<\/strong>. Este es el bloque que tiene el <code>CATCH<\/code> dentro. Aquí, el bloque contiene la llamada <code>check(-5)<\/code> junto con su <code>CATCH<\/code>. La llamada puede fallar, y el <code>CATCH<\/code> está ahí para eso. Así que la excepción se captura justo aquí. Luego el programa sigue justo después del bloque. ¿Y si no hay bloque? Entonces el <code>CATCH<\/code> funciona para todo el programa. Captura la excepción. Pero después el programa simplemente termina. No hay un buen lugar para seguir.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La última línea, <code>Negative.new(n =&gt; -10).throw<\/code>, muestra el caso contrario. Esta línea está <strong>fuera<\/strong> del bloque. Así que nada captura la excepción. La excepción sube hasta arriba del todo. Entonces el programa muere, es decir, se detiene con un error. Imprime el mensaje en el error estándar. También imprime ahí una traza. Una traza muestra en qué lugar del código pasó el error. Después el programa termina con un código de salida distinto de <code>0<\/code>. Esto le pasa a cada excepción que no capturas. Y por eso el primer lanzamiento necesitaba un <code>CATCH<\/code>. Sin él, el programa no puede seguir.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un errore per i numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo per risolvere il compito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Con <code>Negative is Exception<\/code> puoi sollevare questa classe. Il suo metodo <code>message<\/code> costruisce il testo dall'attributo <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> controlla il suo input. Per un numero negativo solleva l'eccezione personalizzata. L'eccezione esce da <code>check<\/code>. Va al <code>CATCH<\/code> nel blocco che ha chiamato <code>check<\/code>. Lì <code>when Negative<\/code> la riconosce dal suo tipo. Poi il <code>CATCH<\/code> stampa il messaggio. Questo è un uso molto comune e reale delle eccezioni personalizzate. Un programma controlla il suo input. Per un valore sbagliato solleva un'eccezione di un tipo suo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Perché ci sono le <code>{ … }<\/code> intorno alla chiamata? Un phaser <code>CATCH<\/code> gestisce solo le eccezioni del <strong>suo blocco<\/strong>. È il blocco che ha dentro il <code>CATCH<\/code>. Qui il blocco contiene la chiamata <code>check(-5)<\/code> insieme al suo <code>CATCH<\/code>. La chiamata può fallire, e il <code>CATCH<\/code> è lì per questo. Quindi il <code>CATCH<\/code> intercetta l'eccezione proprio qui. Poi il programma va avanti subito dopo il blocco. E se non c'è nessun blocco? Allora il <code>CATCH<\/code> vale per tutto il programma. Intercetta l'eccezione. Ma poi il programma finisce e basta. Non c'è un buon punto per andare avanti.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'ultima riga, <code>Negative.new(n =&gt; -10).throw<\/code>, mostra il caso opposto. Questa riga sta <strong>fuori<\/strong> dal blocco. Quindi niente intercetta l'eccezione. L'eccezione sale fino in cima. Allora il programma muore, cioè si ferma con un errore. Stampa il messaggio sullo standard error. Lì stampa anche un backtrace. Un backtrace mostra in che punto del codice è successo l'errore. Poi il programma finisce con un codice di uscita diverso da <code>0<\/code>. Questo succede a ogni eccezione che non intercetti. Ed è per questo che il primo lancio aveva bisogno di un <code>CATCH<\/code>. Senza questo, il programma non può andare avanti.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Negatīva skaitļa kļūda","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens veids, kā atrisināt uzdevumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> ļauj jums izmest šo klasi. Tās metode <code>message<\/code> uzbūvē tekstu no atribūta <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> pārbauda savu ievadi. Negatīvam skaitlim tā izmet paša definēto izņēmumu. Izņēmums iziet ārā no <code>check<\/code>. Tas nonāk līdz <code>CATCH<\/code> blokā, kas izsauca <code>check<\/code>. Tur <code>when Negative<\/code> tam atbilst pēc tipa. Tad <code>CATCH<\/code> izdrukā paziņojumu. Tas ir ļoti parasts un īsts paša definētu izņēmumu lietojums. Programma pārbauda savu ievadi. Sliktai vērtībai tā izmet sava tipa izņēmumu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kāpēc ap izsaukumu ir <code>{ … }<\/code>? Fāzeris <code>CATCH<\/code> apstrādā tikai izņēmumus no <strong>sava bloka<\/strong>. Tas ir bloks, kura iekšā ir <code>CATCH<\/code>. Šeit bloks satur izsaukumu <code>check(-5)<\/code> kopā ar tā <code>CATCH<\/code>. Izsaukums var neizdoties, un <code>CATCH<\/code> to sargā. Tāpēc <code>CATCH<\/code> noķer izņēmumu tieši šeit. Tad programma turpina darbu tūlīt aiz bloka. Un ja bloka nav? Tad <code>CATCH<\/code> darbojas visai programmai. Tas noķer izņēmumu. Bet tad programma vienkārši beidzas. Nav labas vietas, kur turpināt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pēdējā rinda, <code>Negative.new(n =&gt; -10).throw<\/code>, parāda pretējo gadījumu. Šī rinda ir <strong>ārpus<\/strong> bloka. Tāpēc izņēmumu nenoķer nekas. Izņēmums paceļas līdz pašai augšai. Tad programma mirst jeb apstājas ar kļūdu. Tā izdrukā paziņojumu standarta kļūdu plūsmā. Tur tā izdrukā arī izsaukumu atskaiti. Izsaukumu atskaite parāda, kurā koda vietā notika kļūda. Tad programma beidzas ar izejas kodu, kas nav <code>0<\/code>. Tā notiek ar katru izņēmumu, ko jūs nenoķerat. Un tieši tāpēc pirmajam izmetienam vajadzēja <code>CATCH<\/code>. Bez tā programma nevar turpināt.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Ошибка отрицательного числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> позволяет бросать этот класс. Его метод <code>message<\/code> строит текст из атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверяет свои входные данные. Для отрицательного числа она бросает собственное исключение. Исключение выходит из <code>check<\/code>. Оно идёт к <code>CATCH<\/code> в блоке, который вызвал <code>check<\/code>. Там <code>when Negative<\/code> совпадает с ним по типу. Потом <code>CATCH<\/code> печатает сообщение. Это очень частое, реальное применение собственных исключений. Программа проверяет свои входные данные. Для плохого значения она бросает исключение своего типа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зачем вокруг вызова стоит <code>{ … }<\/code>? Фазер <code>CATCH<\/code> обрабатывает только исключения из <strong>своего собственного блока<\/strong>. Это блок, внутри которого стоит <code>CATCH<\/code>. Здесь в блоке вместе стоят вызов <code>check(-5)<\/code> и его <code>CATCH<\/code>. Вызов может дать сбой, и <code>CATCH<\/code> стоит здесь ради него. Поэтому исключение перехватывается прямо здесь. Потом программа идёт дальше сразу после блока. А если блока нет? Тогда <code>CATCH<\/code> работает для всей программы. Он перехватывает исключение. Но потом программа просто заканчивается. Программе негде продолжить работу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последняя строка, <code>Negative.new(n =&gt; -10).throw<\/code>, показывает обратный случай. Эта строка стоит <strong>вне<\/strong> блока. Поэтому исключение никто не перехватывает. Исключение поднимается до самого верха. Тогда программа умирает, то есть останавливается с ошибкой. Она печатает сообщение в стандартный поток ошибок. Ещё она печатает туда трассировку. Трассировка показывает, где в коде случилась ошибка. Потом программа завершается, и её код возврата не равен <code>0<\/code>. Так бывает с каждым исключением, которое вы не перехватили. И именно поэтому первому броску был нужен <code>CATCH<\/code>. Без него программа не может продолжить работу.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Помилка від'ємного числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> дозволяє кидати цей клас. Його метод <code>message<\/code> будує текст з атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> перевіряє свої вхідні дані. Для від'ємного числа вона кидає власний виняток. Виняток виходить із <code>check<\/code>. Він іде до <code>CATCH<\/code> у блоці, який викликав <code>check<\/code>. Там <code>when Negative<\/code> зіставляється з ним за типом. Потім <code>CATCH<\/code> виводить повідомлення. Це дуже поширене, справжнє застосування власних винятків. Програма перевіряє свої вхідні дані. Для поганого значення вона кидає виняток власного типу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Навіщо навколо виклику стоїть <code>{ … }<\/code>? Фазер <code>CATCH<\/code> обробляє лише винятки з <strong>власного блоку<\/strong>. Це блок, у якому стоїть цей <code>CATCH<\/code>. Тут блок містить виклик <code>check(-5)<\/code> разом із його <code>CATCH<\/code>. Виклик може не спрацювати, і <code>CATCH<\/code> стоїть там саме для цього. Тож виняток перехоплюється прямо тут. Потім програма йде далі одразу після блоку. А що, як блоку немає? Тоді <code>CATCH<\/code> працює для всієї програми. Він перехоплює виняток. Але потім програма просто завершується. Немає доброго місця, щоб іти далі.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Останній рядок, <code>Negative.new(n =&gt; -10).throw<\/code>, показує протилежний випадок. Цей рядок стоїть <strong>поза<\/strong> блоком. Тож виняток ніхто не перехоплює. Виняток іде аж до самого верху. Тоді програма гине, тобто зупиняється з помилкою. Вона виводить повідомлення в стандартний потік помилок. Також вона виводить туди трасування стека. Трасування стека показує, де в коді сталася помилка. Потім програма завершується, і її код завершення не дорівнює <code>0<\/code>. Так стається з кожним винятком, який ви не перехоплюєте. І тому для першого кидання потрібен був <code>CATCH<\/code>. Без нього програма не може йти далі.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Грешка при отрицателно число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> ви позволява да хвърляте този клас. Неговият метод <code>message<\/code> съставя текста от атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверява входа си. За отрицателно число тя хвърля собственото изключение. Изключението излиза от <code>check<\/code>. То отива до <code>CATCH<\/code> в блока, който е извикал <code>check<\/code>. Там <code>when Negative<\/code> го съпоставя по неговия тип. После <code>CATCH<\/code> отпечатва съобщението. Това е много честа, реална употреба на собствените изключения. Програмата проверява входа си. За лоша стойност тя хвърля изключение от свой собствен тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Защо около извикването има <code>{ … }<\/code>? Фазерът <code>CATCH<\/code> обработва само изключенията от <strong>своя собствен блок<\/strong>. Това е блокът, в който е <code>CATCH<\/code>. Тук блокът държи извикването <code>check(-5)<\/code> заедно с неговия <code>CATCH<\/code>. Извикването може да се провали, а <code>CATCH<\/code> е там за този случай. Затова изключението се прихваща точно тук. После програмата продължава веднага след блока. Ами ако няма блок? Тогава <code>CATCH<\/code> работи за цялата програма. Той прихваща изключението. Но после програмата просто свършва. Няма добро място, откъдето да продължи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последният ред, <code>Negative.new(n =&gt; -10).throw<\/code>, показва обратния случай. Този ред е <strong>извън<\/strong> блока. Затова нищо не прихваща изключението. Изключението стига чак до върха. Тогава програмата умира, тоест спира с грешка. Тя отпечатва съобщението в стандартната грешка. Там тя отпечатва и обратна следа. Обратната следа показва къде в кода е станала грешката. После програмата завършва с код на изход, различен от <code>0<\/code>. Това става с всяко изключение, което не прихванете. И затова първото хвърляне имаше нужда от <code>CATCH<\/code>. Без него програмата не може да продължи.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Eraro pri negativa nombro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> permesas al vi ĵeti ĉi tiun klason. Ĝia metodo <code>message<\/code> konstruas la tekston el la atributo <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> testas sian enigon. Por negativa nombro, ĝi ĵetas la propran escepton. La escepto iras el <code>check<\/code>. Ĝi iras al la <code>CATCH<\/code> en la bloko, kiu vokis <code>check<\/code>. Tie, <code>when Negative<\/code> kongruas kun ĝi laŭ ĝia tipo. Poste la <code>CATCH<\/code> presas la mesaĝon. Tio estas tre ofta, vera uzo de propraj esceptoj. Programo kontrolas sian enigon. Por malbona valoro, ĝi ĵetas escepton de sia propra tipo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kial estas <code>{ … }<\/code> ĉirkaŭ la voko? Fazero <code>CATCH<\/code> traktas nur la esceptojn el <strong>sia propra bloko<\/strong>. Tio estas la bloko, kiu havas la <code>CATCH<\/code> interne. Ĉi tie, la bloko tenas la vokon <code>check(-5)<\/code> kune kun ĝia <code>CATCH<\/code>. La voko povas malsukcesi, kaj la <code>CATCH<\/code> estas tie por ĝi. Do la escepto estas kaptata ĝuste ĉi tie. Poste la programo daŭras tuj post la bloko. Kaj se ne estas bloko? Tiam la <code>CATCH<\/code> funkcias por la tuta programo. Ĝi kaptas la escepton. Sed tiam la programo simple finiĝas. Ne estas bona loko por daŭrigi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La lasta linio, <code>Negative.new(n =&gt; -10).throw<\/code>, montras la malan kazon. Ĉi tiu linio estas <strong>ekster<\/strong> la bloko. Do nenio kaptas la escepton. La escepto iras ĝis la plej supro. Tiam la programo mortas, aŭ haltas kun eraro. Ĝi presas la mesaĝon al la norma erara fluo. Ĝi ankaŭ presas retrospuron tien. Retrospuro montras, kie en la kodo la eraro okazis. Poste la programo finiĝas kun elirkodo alia ol <code>0<\/code>. Tio okazas al ĉiu escepto, kiun vi ne kaptas. Kaj tial la unua ĵeto bezonis <code>CATCH<\/code>. Sen ĝi, la programo ne povas daŭri.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Error numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> tibi permittit hanc classem iacere. Methodus eius <code>message<\/code> textum ex attributo <code>n<\/code> aedificat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> introitum suum probat. Pro numero negativo exceptionem propriam iacit. Exceptio ex <code>check<\/code> exit. Ad <code>CATCH<\/code> venit in clausula quae <code>check<\/code> vocavit. Ibi <code>when Negative<\/code> ei genere suo convenit. Deinde <code>CATCH<\/code> nuntium imprimit. Hic est usus verus et valde frequens exceptionum propriarum. Programma introitum suum probat. Pro valore malo exceptionem sui generis iacit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cur <code>{ … }<\/code> circa vocationem est? Fasis <code>CATCH<\/code> solum exceptiones ex <strong>sua propria clausula<\/strong> tractat. Haec est clausula quae <code>CATCH<\/code> intus habet. Hic clausula vocationem <code>check(-5)<\/code> una cum sua <code>CATCH<\/code> tenet. Vocatio deficere potest, et <code>CATCH<\/code> propter eam adest. Itaque <code>CATCH<\/code> exceptionem hic ipso loco capit. Deinde programma statim post clausulam pergit. Quid si nulla clausula est? Tum <code>CATCH<\/code> pro toto programmate operatur. Exceptionem capit. Sed tum programma simpliciter finit. Nullus bonus locus est ubi pergat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ultima linea, <code>Negative.new(n =&gt; -10).throw<\/code>, casum contrarium ostendit. Haec linea <strong>extra<\/strong> clausulam est. Itaque nihil exceptionem capit. Exceptio usque ad summum ascendit. Tum programma moritur, id est cum errore sistit. Nuntium ad errorem vulgarem imprimit. Ibi etiam vestigium imprimit. Vestigium locum erroris in codice ostendit. Deinde programma finit cum codice exeundi alio quam <code>0<\/code>. Hoc omni exceptioni accidit quam non capis. Et ideo primus iactus <code>CATCH<\/code> egebat. Sine ea programma pergere non potest.<\/span><\/li><\/ol>"]]}}}</script>
