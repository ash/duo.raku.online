<script type="application/json" id="page-data">{"u":"oop/custom-exceptions","n":961,"k":"section","pv":"oop/failures/quiz","nx":"oop/custom-exceptions/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Custom exceptions","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku has built-in exceptions.<\/span> <span class=\"sg\" data-s=\"1\">Their names start with <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can also make your own exceptions.<\/span> <span class=\"sg\" data-s=\"3\">We call them custom exceptions.<\/span> <span class=\"sg\" data-s=\"4\">A custom exception is a class.<\/span> <span class=\"sg\" data-s=\"5\">It inherits from the built-in class <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">So it is a kind of <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">It also has a method <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is a normal class.<\/span> <span class=\"sg\" data-s=\"1\">It can have attributes, like <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But it <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So you can throw it, like an error from <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">To throw it, make an object of the class.<\/span> <span class=\"sg\" data-s=\"5\">Then call <code>.throw<\/code> on this object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Inside the <code>CATCH<\/code>, <code>when TooBig<\/code> matches.<\/span> <span class=\"sg\" data-s=\"1\">This is because the thrown object has the type <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A custom exception holds any data that you give it.<\/span> <span class=\"sg\" data-s=\"3\">Here, this data is the <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">The code that handles the exception is the handler.<\/span> <span class=\"sg\" data-s=\"5\">The handler can use this data.<\/span> <span class=\"sg\" data-s=\"6\">It can build an exact message.<\/span> <span class=\"sg\" data-s=\"7\">Or it can react in a special way.<\/span> <span class=\"sg\" data-s=\"8\">This is much more useful than a simple string for <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Here, everything from this part of the course comes together.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception is a <em>class<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">It has attributes and a method.<\/span> <span class=\"sg\" data-s=\"3\">It also works with the exception tools of Raku.<\/span> <span class=\"sg\" data-s=\"4\">You can throw it and catch it.<\/span> <span class=\"sg\" data-s=\"5\">So it can tell exactly what went wrong.<\/span><\/p>"]]},"de":{"t":"Eigene Ausnahmen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku hat eingebaute Ausnahmen.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Namen beginnen mit <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie können auch selbst Ausnahmen erstellen.<\/span> <span class=\"sg\" data-s=\"3\">Wir nennen sie eigene Ausnahmen.<\/span> <span class=\"sg\" data-s=\"4\">Eine eigene Ausnahme ist eine Klasse.<\/span> <span class=\"sg\" data-s=\"5\">Sie erbt von der eingebauten Klasse <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Also ist sie eine Art <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Sie hat auch eine Methode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ist eine normale Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Sie kann Attribute haben, zum Beispiel <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie ist <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Also können Sie sie werfen, wie einen Fehler von <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Erzeugen Sie dafür ein Objekt der Klasse.<\/span> <span class=\"sg\" data-s=\"5\">Dann rufen Sie <code>.throw<\/code> für dieses Objekt auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Innerhalb des <code>CATCH<\/code> trifft <code>when TooBig<\/code> zu.<\/span> <span class=\"sg\" data-s=\"1\">Denn das geworfene Objekt hat den Typ <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eine eigene Ausnahme enthält alle Daten, die Sie ihr geben.<\/span> <span class=\"sg\" data-s=\"3\">Hier sind diese Daten der <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Der Code, der die Ausnahme behandelt, ist die Behandlung.<\/span> <span class=\"sg\" data-s=\"5\">Die Behandlung kann diese Daten nutzen.<\/span> <span class=\"sg\" data-s=\"6\">Sie kann eine genaue Meldung bauen.<\/span> <span class=\"sg\" data-s=\"7\">Oder sie kann auf eine besondere Weise reagieren.<\/span> <span class=\"sg\" data-s=\"8\">Das ist viel nützlicher als eine einfache Zeichenkette für <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier kommt alles aus diesem Teil des Kurses zusammen.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme ist eine <em>Klasse<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Sie hat Attribute und eine Methode.<\/span> <span class=\"sg\" data-s=\"3\">Sie arbeitet auch mit den Werkzeugen von Raku für Ausnahmen zusammen.<\/span> <span class=\"sg\" data-s=\"4\">Sie können sie werfen und fangen.<\/span> <span class=\"sg\" data-s=\"5\">So kann sie genau sagen, was schiefgegangen ist.<\/span><\/p>"]]},"nl":{"t":"Eigen excepties","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku heeft ingebouwde excepties.<\/span> <span class=\"sg\" data-s=\"1\">Hun namen beginnen met <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ook je eigen excepties maken.<\/span> <span class=\"sg\" data-s=\"3\">We noemen ze eigen excepties.<\/span> <span class=\"sg\" data-s=\"4\">Een eigen exceptie is een klasse.<\/span> <span class=\"sg\" data-s=\"5\">De klasse erft van de ingebouwde klasse <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Dus is het een soort <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">De klasse heeft ook een methode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is een gewone klasse.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan attributen hebben, zoals <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar hij <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dus kun je hem werpen, net als een fout van <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Om hem te werpen, maak je een object van de klasse.<\/span> <span class=\"sg\" data-s=\"5\">Roep dan <code>.throw<\/code> aan op dit object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">In de <code>CATCH<\/code> matcht <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat het geworpen object het type <code>TooBig<\/code> heeft.<\/span> <span class=\"sg\" data-s=\"2\">Een eigen exceptie bewaart alle gegevens die je haar geeft.<\/span> <span class=\"sg\" data-s=\"3\">Hier zijn die gegevens de <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">De code die de exceptie afhandelt, is de afhandelaar.<\/span> <span class=\"sg\" data-s=\"5\">De afhandelaar kan deze gegevens gebruiken.<\/span> <span class=\"sg\" data-s=\"6\">Hij kan een precieze melding maken.<\/span> <span class=\"sg\" data-s=\"7\">Of hij kan op een speciale manier reageren.<\/span> <span class=\"sg\" data-s=\"8\">Dat is veel nuttiger dan een simpele string voor <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier komt alles uit dit deel van de cursus samen.<\/span> <span class=\"sg\" data-s=\"1\">Een eigen exceptie is een <em>klasse<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ze heeft attributen en een methode.<\/span> <span class=\"sg\" data-s=\"3\">Ze werkt ook met de hulpmiddelen van Raku voor excepties.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt haar werpen en vangen.<\/span> <span class=\"sg\" data-s=\"5\">Zo kan ze precies melden wat er misging.<\/span><\/p>"]]},"es":{"t":"Excepciones propias","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku tiene excepciones incorporadas.<\/span> <span class=\"sg\" data-s=\"1\">Sus nombres empiezan por <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">También puedes crear tus propias excepciones.<\/span> <span class=\"sg\" data-s=\"3\">Las llamamos excepciones personalizadas.<\/span> <span class=\"sg\" data-s=\"4\">Una excepción personalizada es una clase.<\/span> <span class=\"sg\" data-s=\"5\">Hereda de la clase incorporada <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Así que es un tipo de <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">También tiene un método <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> es una clase normal.<\/span> <span class=\"sg\" data-s=\"1\">Puede tener atributos, como <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero es <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes lanzarla, como un error de <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Para lanzarla, crea un objeto de la clase.<\/span> <span class=\"sg\" data-s=\"5\">Después llama a <code>.throw<\/code> sobre este objeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dentro del <code>CATCH<\/code>, <code>when TooBig<\/code> coincide.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa porque el objeto lanzado tiene el tipo <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Una excepción personalizada guarda los datos que le das.<\/span> <span class=\"sg\" data-s=\"3\">Aquí, estos datos son el <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">El código que maneja la excepción es el manejador.<\/span> <span class=\"sg\" data-s=\"5\">El manejador puede usar estos datos.<\/span> <span class=\"sg\" data-s=\"6\">Puede crear un mensaje exacto.<\/span> <span class=\"sg\" data-s=\"7\">O puede reaccionar de una forma especial.<\/span> <span class=\"sg\" data-s=\"8\">Esto es mucho más útil que una simple cadena para <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aquí se junta todo lo de esta parte del curso.<\/span> <span class=\"sg\" data-s=\"1\">Una excepción personalizada es una <em>clase<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tiene atributos y un método.<\/span> <span class=\"sg\" data-s=\"3\">También funciona con las herramientas de Raku para excepciones.<\/span> <span class=\"sg\" data-s=\"4\">Puedes lanzarla y capturarla.<\/span> <span class=\"sg\" data-s=\"5\">Así que puede decir exactamente qué salió mal.<\/span><\/p>"]]},"it":{"t":"Eccezioni personalizzate","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku ha eccezioni incorporate.<\/span> <span class=\"sg\" data-s=\"1\">I loro nomi cominciano con <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche creare le tue eccezioni.<\/span> <span class=\"sg\" data-s=\"3\">Le chiamiamo eccezioni personalizzate.<\/span> <span class=\"sg\" data-s=\"4\">Un'eccezione personalizzata è una classe.<\/span> <span class=\"sg\" data-s=\"5\">Eredita dalla classe incorporata <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Quindi è un tipo di <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ha anche un metodo <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> è una classe normale.<\/span> <span class=\"sg\" data-s=\"1\">Può avere attributi, come <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma è <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Quindi puoi sollevarla, come un errore di <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Per sollevarla, crea un oggetto della classe.<\/span> <span class=\"sg\" data-s=\"5\">Poi chiama <code>.throw<\/code> su questo oggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dentro il <code>CATCH<\/code>, <code>when TooBig<\/code> corrisponde.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché l'oggetto sollevato ha il tipo <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un'eccezione personalizzata contiene tutti i dati che le dai.<\/span> <span class=\"sg\" data-s=\"3\">Qui questo dato è il <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Il codice che gestisce l'eccezione è il gestore.<\/span> <span class=\"sg\" data-s=\"5\">Il gestore può usare questi dati.<\/span> <span class=\"sg\" data-s=\"6\">Può costruire un messaggio preciso.<\/span> <span class=\"sg\" data-s=\"7\">Oppure può reagire in un modo speciale.<\/span> <span class=\"sg\" data-s=\"8\">Questo è molto più utile di una semplice stringa per <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Qui mettiamo insieme tutto quello che c'è in questa parte del corso.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata è una <em>classe<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ha attributi e un metodo.<\/span> <span class=\"sg\" data-s=\"3\">Funziona anche con gli strumenti di Raku per le eccezioni.<\/span> <span class=\"sg\" data-s=\"4\">Puoi sollevarla e intercettarla.<\/span> <span class=\"sg\" data-s=\"5\">Così può dire esattamente che cosa è andato storto.<\/span><\/p>"]]},"lv":{"t":"Paša veidoti izņēmumi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir iebūvēti izņēmumi.<\/span> <span class=\"sg\" data-s=\"1\">To nosaukumi sākas ar <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat izveidot arī savus izņēmumus.<\/span> <span class=\"sg\" data-s=\"3\">Tos sauc par paša definētiem izņēmumiem.<\/span> <span class=\"sg\" data-s=\"4\">Paša definēts izņēmums ir klase.<\/span> <span class=\"sg\" data-s=\"5\">Tā manto no iebūvētās klases <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tātad tā ir viens no <code>Exception<\/code> veidiem.<\/span> <span class=\"sg\" data-s=\"7\">Tai ir arī metode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ir parasta klase.<\/span> <span class=\"sg\" data-s=\"1\">Tai var būt atribūti, piemēram, <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet tā <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc to var izmest, tāpat kā kļūdu no <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Lai to izmestu, izveidojiet šīs klases objektu.<\/span> <span class=\"sg\" data-s=\"5\">Tad izsauciet uz šī objekta <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Fāzerī <code>CATCH<\/code> atbilst zars <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka izmestajam objektam ir tips <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Paša definēts izņēmums glabā jebkurus datus, ko jūs tam dodat.<\/span> <span class=\"sg\" data-s=\"3\">Šeit šie dati ir <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Kods, kas apstrādā izņēmumu, ir apstrādātājs.<\/span> <span class=\"sg\" data-s=\"5\">Apstrādātājs var izmantot šos datus.<\/span> <span class=\"sg\" data-s=\"6\">Tas var uzbūvēt precīzu paziņojumu.<\/span> <span class=\"sg\" data-s=\"7\">Vai arī tas var reaģēt īpašā veidā.<\/span> <span class=\"sg\" data-s=\"8\">Tas ir daudz noderīgāk nekā vienkārša virkne ar <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šeit kopā sanāk viss no šīs kursa daļas.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums ir <em>klase<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tai ir atribūti un metode.<\/span> <span class=\"sg\" data-s=\"3\">Tā strādā arī ar Raku izņēmumu rīkiem.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat to izmest un noķert.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc tā var precīzi pateikt, kas nogāja greizi.<\/span><\/p>"]]},"ru":{"t":"Собственные исключения","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенные исключения.<\/span> <span class=\"sg\" data-s=\"1\">Их имена начинаются с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете создавать и свои исключения.<\/span> <span class=\"sg\" data-s=\"3\">Мы называем их собственными исключениями.<\/span> <span class=\"sg\" data-s=\"4\">Собственное исключение — это класс.<\/span> <span class=\"sg\" data-s=\"5\">Он наследует от встроенного класса <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому он — один из видов <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ещё у него есть метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> — обычный класс.<\/span> <span class=\"sg\" data-s=\"1\">У него могут быть атрибуты, например <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но он <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому его можно бросить, как ошибку из <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы бросить его, создайте объект этого класса.<\/span> <span class=\"sg\" data-s=\"5\">Потом вызовите у этого объекта <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>CATCH<\/code> срабатывает <code>when TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что брошенный объект имеет тип <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Собственное исключение хранит любые данные, которые вы ему даёте.<\/span> <span class=\"sg\" data-s=\"3\">Здесь эти данные — <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Код, который обрабатывает исключение, — это обработчик.<\/span> <span class=\"sg\" data-s=\"5\">Обработчик может использовать эти данные.<\/span> <span class=\"sg\" data-s=\"6\">Он может составить точное сообщение.<\/span> <span class=\"sg\" data-s=\"7\">Или он может отреагировать особым образом.<\/span> <span class=\"sg\" data-s=\"8\">Это гораздо полезнее, чем простая строка для <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь собрано всё из этой части курса.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение — это <em>класс<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">У него есть атрибуты и метод.<\/span> <span class=\"sg\" data-s=\"3\">Ещё оно работает с инструментами Raku для исключений.<\/span> <span class=\"sg\" data-s=\"4\">Его можно бросить и перехватить.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому оно может точно сказать, что пошло не так.<\/span><\/p>"]]},"uk":{"t":"Власні винятки","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku має вбудовані винятки.<\/span> <span class=\"sg\" data-s=\"1\">Їхні імена починаються з <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете також створити свої винятки.<\/span> <span class=\"sg\" data-s=\"3\">Ми називаємо їх власними винятками.<\/span> <span class=\"sg\" data-s=\"4\">Власний виняток — це клас.<\/span> <span class=\"sg\" data-s=\"5\">Він успадковує від вбудованого класу <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Тож він — один із видів <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Також він має метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> — звичайний клас.<\/span> <span class=\"sg\" data-s=\"1\">Він може мати атрибути, наприклад <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але він <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тож його можна кинути, як помилку з <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Щоб кинути його, створіть об'єкт цього класу.<\/span> <span class=\"sg\" data-s=\"5\">Потім викличте для цього об'єкта <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>CATCH<\/code> гілка <code>when TooBig<\/code> збігається.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що кинутий об'єкт має тип <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Власний виняток зберігає будь-які дані, які ви йому даєте.<\/span> <span class=\"sg\" data-s=\"3\">Тут ці дані — це <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Код, який обробляє виняток, — це обробник.<\/span> <span class=\"sg\" data-s=\"5\">Обробник може використати ці дані.<\/span> <span class=\"sg\" data-s=\"6\">Він може побудувати точне повідомлення.<\/span> <span class=\"sg\" data-s=\"7\">Або він може відреагувати особливим способом.<\/span> <span class=\"sg\" data-s=\"8\">Це набагато корисніше, ніж простий рядок для <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тут усе з цієї частини курсу сходиться разом.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток — це <em>клас<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Він має атрибути й метод.<\/span> <span class=\"sg\" data-s=\"3\">Також він працює з інструментами винятків у Raku.<\/span> <span class=\"sg\" data-s=\"4\">Його можна кинути й перехопити.<\/span> <span class=\"sg\" data-s=\"5\">Тож він може точно сказати, що пішло не так.<\/span><\/p>"]]},"bg":{"t":"Собствени изключения","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku има вградени изключения.<\/span> <span class=\"sg\" data-s=\"1\">Имената им започват с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да създавате и свои изключения.<\/span> <span class=\"sg\" data-s=\"3\">Наричаме ги собствени изключения.<\/span> <span class=\"sg\" data-s=\"4\">Собственото изключение е клас.<\/span> <span class=\"sg\" data-s=\"5\">Той наследява вградения клас <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Така той е вид <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Той има и метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> е нормален клас.<\/span> <span class=\"sg\" data-s=\"1\">Той може да има атрибути, като <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но той е <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да го хвърлите, като грешка от <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">За да го хвърлите, създайте обект от класа.<\/span> <span class=\"sg\" data-s=\"5\">После извикайте <code>.throw<\/code> върху този обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>CATCH<\/code> клонът <code>when TooBig<\/code> съвпада.<\/span> <span class=\"sg\" data-s=\"1\">Това е така, защото хвърленият обект е от типа <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Собственото изключение пази всякакви данни, които му дадете.<\/span> <span class=\"sg\" data-s=\"3\">Тук тези данни са <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кодът, който обработва изключението, е обработчикът.<\/span> <span class=\"sg\" data-s=\"5\">Обработчикът може да използва тези данни.<\/span> <span class=\"sg\" data-s=\"6\">Той може да състави точно съобщение.<\/span> <span class=\"sg\" data-s=\"7\">Или може да реагира по особен начин.<\/span> <span class=\"sg\" data-s=\"8\">Това е много по-полезно от обикновен низ за <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тук се събира всичко от тази част на курса.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение е <em>клас<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">То има атрибути и метод.<\/span> <span class=\"sg\" data-s=\"3\">То работи и с инструментите на Raku за изключения.<\/span> <span class=\"sg\" data-s=\"4\">Можете да го хвърлите и да го прихванете.<\/span> <span class=\"sg\" data-s=\"5\">Така то може да каже точно какво се е объркало.<\/span><\/p>"]]},"eo":{"t":"Propraj esceptoj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku havas enkonstruitajn esceptojn.<\/span> <span class=\"sg\" data-s=\"1\">Iliaj nomoj komenciĝas per <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas fari viajn proprajn esceptojn.<\/span> <span class=\"sg\" data-s=\"3\">Ni nomas ilin propraj esceptoj.<\/span> <span class=\"sg\" data-s=\"4\">Propra escepto estas klaso.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi heredas de la enkonstruita klaso <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Do ĝi estas speco de <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ĝi ankaŭ havas metodon <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> estas normala klaso.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas havi atributojn, kiel <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas ĵeti ĝin, kiel eraron de <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Por ĵeti ĝin, faru objekton de la klaso.<\/span> <span class=\"sg\" data-s=\"5\">Poste voku <code>.throw<\/code> sur ĉi tiu objekto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ene de la <code>CATCH<\/code>, <code>when TooBig<\/code> kongruas.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, ĉar la ĵetita objekto havas la tipon <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Propra escepto tenas ĉiujn datumojn, kiujn vi donas al ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tie, tiuj datumoj estas la <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La kodo, kiu traktas la escepton, estas la traktilo.<\/span> <span class=\"sg\" data-s=\"5\">La traktilo povas uzi ĉi tiujn datumojn.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi povas konstrui precizan mesaĝon.<\/span> <span class=\"sg\" data-s=\"7\">Aŭ ĝi povas reagi en speciala maniero.<\/span> <span class=\"sg\" data-s=\"8\">Tio estas multe pli utila ol simpla ĉeno por <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie kuniĝas ĉio el ĉi tiu parto de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Propra escepto estas <em>klaso<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi havas atributojn kaj metodon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ funkcias kun la esceptaj iloj de Raku.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas ĵeti ĝin kaj kapti ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Do ĝi povas diri ĝuste, kio misiris.<\/span><\/p>"]]},"la":{"t":"Exceptiones propriae","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku exceptiones inbuiltas habet.<\/span> <span class=\"sg\" data-s=\"1\">Nomina earum ab <code>X::<\/code> incipiunt.<\/span> <span class=\"sg\" data-s=\"2\">Etiam tuas exceptiones facere potes.<\/span> <span class=\"sg\" data-s=\"3\">Eas exceptiones proprias vocamus.<\/span> <span class=\"sg\" data-s=\"4\">Exceptio propria est classis.<\/span> <span class=\"sg\" data-s=\"5\">Ab inbuilta classe <code>Exception<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"6\">Itaque etiam ipsa <code>Exception<\/code> est.<\/span> <span class=\"sg\" data-s=\"7\">Etiam methodum <code>message<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> classis ordinaria est.<\/span> <span class=\"sg\" data-s=\"1\">Attributa habere potest, sicut <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>is Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Itaque eam iacere potes, sicut errorem ex <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ut eam iacias, obiectum classis fac.<\/span> <span class=\"sg\" data-s=\"5\">Deinde <code>.throw<\/code> in hoc obiecto voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Intra <code>CATCH<\/code>, <code>when TooBig<\/code> convenit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit quia obiectum iactum genus <code>TooBig<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Exceptio propria quaelibet data tenet quae ei das.<\/span> <span class=\"sg\" data-s=\"3\">Hic haec data sunt <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Codex qui exceptionem tractat est tractator.<\/span> <span class=\"sg\" data-s=\"5\">Tractator his datis uti potest.<\/span> <span class=\"sg\" data-s=\"6\">Nuntium exactum aedificare potest.<\/span> <span class=\"sg\" data-s=\"7\">Aut modo speciali reagere potest.<\/span> <span class=\"sg\" data-s=\"8\">Hoc multo utilius est quam chorda simplex pro <code>die<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic omnia ex hac parte cursus conveniunt.<\/span> <span class=\"sg\" data-s=\"1\">Exceptio propria est <em>classis<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Attributa et methodum habet.<\/span> <span class=\"sg\" data-s=\"3\">Etiam cum instrumentis exceptionum in Raku operatur.<\/span> <span class=\"sg\" data-s=\"4\">Eam iacere et capere potes.<\/span> <span class=\"sg\" data-s=\"5\">Itaque exacte dicere potest quid male cesserit.<\/span><\/p>"]]}}}</script>
