<script type="application/json" id="page-data">{"u":"oop/file-handles","n":896,"k":"section","pv":"oop/deleting/quiz","nx":"oop/file-handles/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"File handles","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">It is easy to read or write a whole file at once.<\/span> <span class=\"sg\" data-s=\"1\">But sometimes you want to go through a file line by line.<\/span> <span class=\"sg\" data-s=\"2\">Or you want to write to a file many times.<\/span> <span class=\"sg\" data-s=\"3\">The file must stay open all that time.<\/span> <span class=\"sg\" data-s=\"4\">For this, you use a <em>file handle<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">A file handle is an object for an open file.<\/span> <span class=\"sg\" data-s=\"6\">Through it, you read from the file or write to it.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here is the easiest way to read a file line by line.<\/span> <span class=\"sg\" data-s=\"1\">You do not even need to make a handle yourself.<\/span> <span class=\"sg\" data-s=\"2\">Call the <code>lines<\/code> method on a path object.<\/span> <span class=\"sg\" data-s=\"3\">It gives you the lines one by one.<\/span> <span class=\"sg\" data-s=\"4\">They are ready for a <code>for<\/code> loop:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Each <code>$line<\/code> is one line.<\/span> <span class=\"sg\" data-s=\"1\">There is no newline at its end.<\/span> <span class=\"sg\" data-s=\"2\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You can also write to a file through a handle.<\/span> <span class=\"sg\" data-s=\"1\">First, open the file with <code>open<\/code> and the <code>:w<\/code> flag.<\/span> <span class=\"sg\" data-s=\"2\">This flag means write.<\/span> <span class=\"sg\" data-s=\"3\">Then use the <code>say<\/code> or <code>print<\/code> methods of the handle.<\/span> <span class=\"sg\" data-s=\"4\">At the end, <code>close<\/code> it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Close the handle at the end.<\/span> <span class=\"sg\" data-s=\"1\">Then all your data really goes to the disk.<\/span> <span class=\"sg\" data-s=\"2\">Some files are too large for memory.<\/span> <span class=\"sg\" data-s=\"3\">You cannot read them all at once.<\/span> <span class=\"sg\" data-s=\"4\">For such files, you usually read line by line, as above.<\/span><\/p>"]]},"de":{"t":"Dateihandles","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Es ist leicht, eine ganze Datei auf einmal zu lesen oder zu schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Aber manchmal möchten Sie eine Datei Zeile für Zeile durchgehen.<\/span> <span class=\"sg\" data-s=\"2\">Oder Sie möchten viele Male in eine Datei schreiben.<\/span> <span class=\"sg\" data-s=\"3\">Die Datei muss die ganze Zeit offen bleiben.<\/span> <span class=\"sg\" data-s=\"4\">Dafür verwenden Sie einen <em>Dateihandle<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ein Dateihandle ist ein Objekt für eine offene Datei.<\/span> <span class=\"sg\" data-s=\"6\">Damit lesen Sie aus der Datei oder schreiben hinein.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier ist der einfachste Weg, eine Datei Zeile für Zeile zu lesen.<\/span> <span class=\"sg\" data-s=\"1\">Sie müssen nicht einmal selbst einen Handle erstellen.<\/span> <span class=\"sg\" data-s=\"2\">Rufen Sie die Methode <code>lines<\/code> auf einem Pfadobjekt auf.<\/span> <span class=\"sg\" data-s=\"3\">Die Methode gibt Ihnen die Zeilen eine nach der anderen.<\/span> <span class=\"sg\" data-s=\"4\">Die Zeilen sind bereit für eine <code>for<\/code>-Schleife:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jede <code>$line<\/code> ist eine Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Am Ende steht kein Zeilenumbruch.<\/span> <span class=\"sg\" data-s=\"2\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sie können auch über einen Handle in eine Datei schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Öffnen Sie die Datei zuerst mit <code>open<\/code> und dem Schalter <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der Schalter bedeutet <em>write<\/em>, also schreiben.<\/span> <span class=\"sg\" data-s=\"3\">Verwenden Sie dann die Methoden <code>say<\/code> oder <code>print<\/code> des Handles.<\/span> <span class=\"sg\" data-s=\"4\">Am Ende schließen Sie ihn mit <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Schließen Sie den Handle am Ende.<\/span> <span class=\"sg\" data-s=\"1\">Dann kommen alle Ihre Daten wirklich auf die Festplatte.<\/span> <span class=\"sg\" data-s=\"2\">Manche Dateien sind zu groß für den Speicher.<\/span> <span class=\"sg\" data-s=\"3\">Sie können sie nicht auf einmal lesen.<\/span> <span class=\"sg\" data-s=\"4\">Solche Dateien lesen Sie meistens Zeile für Zeile, wie oben.<\/span><\/p>"]]},"nl":{"t":"Bestandshandles","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Het is makkelijk om een heel bestand in één keer te lezen of te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Maar soms wil je een bestand regel voor regel doorlopen.<\/span> <span class=\"sg\" data-s=\"2\">Of je wilt vaak naar een bestand schrijven.<\/span> <span class=\"sg\" data-s=\"3\">Het bestand moet dan de hele tijd open blijven.<\/span> <span class=\"sg\" data-s=\"4\">Daarvoor gebruik je een <em>bestandshandle<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Een bestandshandle is een object voor een open bestand.<\/span> <span class=\"sg\" data-s=\"6\">Daarmee lees je uit het bestand of schrijf je ernaar.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit is de makkelijkste manier om een bestand regel voor regel te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft niet eens zelf een handle te maken.<\/span> <span class=\"sg\" data-s=\"2\">Roep de methode <code>lines<\/code> aan op een padobject.<\/span> <span class=\"sg\" data-s=\"3\">Die geeft je de regels een voor een.<\/span> <span class=\"sg\" data-s=\"4\">Ze zijn klaar voor een <code>for<\/code>-lus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elke <code>$line<\/code> is één regel.<\/span> <span class=\"sg\" data-s=\"1\">Aan het eind staat geen newline.<\/span> <span class=\"sg\" data-s=\"2\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook via een handle naar een bestand schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Open eerst het bestand met <code>open<\/code> en de vlag <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deze vlag betekent schrijven (write).<\/span> <span class=\"sg\" data-s=\"3\">Gebruik daarna de methoden <code>say<\/code> of <code>print<\/code> van de handle.<\/span> <span class=\"sg\" data-s=\"4\">Aan het eind <code>close<\/code> je hem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sluit de handle aan het eind.<\/span> <span class=\"sg\" data-s=\"1\">Dan gaan al je gegevens echt naar de schijf.<\/span> <span class=\"sg\" data-s=\"2\">Sommige bestanden zijn te groot voor het geheugen.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze niet in één keer lezen.<\/span> <span class=\"sg\" data-s=\"4\">Zulke bestanden lees je meestal regel voor regel, zoals hierboven.<\/span><\/p>"]]},"es":{"t":"Manejadores de archivo","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Es fácil leer o escribir un archivo entero de una vez.<\/span> <span class=\"sg\" data-s=\"1\">Pero a veces quieres recorrer un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"2\">O quieres escribir muchas veces en un archivo.<\/span> <span class=\"sg\" data-s=\"3\">El archivo debe seguir abierto todo ese tiempo.<\/span> <span class=\"sg\" data-s=\"4\">Para eso, usas un <em>manejador de archivo<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Un manejador de archivo es un objeto para un archivo abierto.<\/span> <span class=\"sg\" data-s=\"6\">Con él, lees del archivo o escribes en él.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta es la forma más fácil de leer un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"1\">Ni siquiera necesitas crear tú un manejador.<\/span> <span class=\"sg\" data-s=\"2\">Llama al método <code>lines<\/code> sobre un objeto de ruta.<\/span> <span class=\"sg\" data-s=\"3\">Te da las líneas una a una.<\/span> <span class=\"sg\" data-s=\"4\">Están listas para un bucle <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada <code>$line<\/code> es una línea.<\/span> <span class=\"sg\" data-s=\"1\">No hay salto de línea al final.<\/span> <span class=\"sg\" data-s=\"2\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir en un archivo con un manejador.<\/span> <span class=\"sg\" data-s=\"1\">Primero, abre el archivo con <code>open<\/code> y la bandera <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esta bandera significa escribir (write).<\/span> <span class=\"sg\" data-s=\"3\">Después usa los métodos <code>say<\/code> o <code>print<\/code> del manejador.<\/span> <span class=\"sg\" data-s=\"4\">Al final, ciérralo con <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cierra el manejador al final.<\/span> <span class=\"sg\" data-s=\"1\">Así todos tus datos llegan de verdad al disco.<\/span> <span class=\"sg\" data-s=\"2\">Algunos archivos son demasiado grandes para la memoria.<\/span> <span class=\"sg\" data-s=\"3\">No puedes leerlos enteros de una vez.<\/span> <span class=\"sg\" data-s=\"4\">Con estos archivos, normalmente lees línea a línea, como arriba.<\/span><\/p>"]]},"it":{"t":"Handle di file","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">È facile leggere o scrivere un file intero in una volta.<\/span> <span class=\"sg\" data-s=\"1\">Ma a volte vuoi scorrere un file riga per riga.<\/span> <span class=\"sg\" data-s=\"2\">Oppure vuoi scrivere in un file molte volte.<\/span> <span class=\"sg\" data-s=\"3\">Il file deve restare aperto per tutto quel tempo.<\/span> <span class=\"sg\" data-s=\"4\">Per questo usi un <em>handle di file<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Un handle di file è un oggetto per un file aperto.<\/span> <span class=\"sg\" data-s=\"6\">Attraverso questo handle leggi dal file o scrivi nel file.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ecco il modo più facile per leggere un file riga per riga.<\/span> <span class=\"sg\" data-s=\"1\">Non devi neanche creare tu un handle.<\/span> <span class=\"sg\" data-s=\"2\">Chiama il metodo <code>lines<\/code> su un oggetto percorso.<\/span> <span class=\"sg\" data-s=\"3\">Ti dà le righe una per una.<\/span> <span class=\"sg\" data-s=\"4\">Sono pronte per un ciclo <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>$line<\/code> è una riga.<\/span> <span class=\"sg\" data-s=\"1\">Alla fine della riga non c'è il ritorno a capo.<\/span> <span class=\"sg\" data-s=\"2\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Puoi anche scrivere in un file attraverso un handle.<\/span> <span class=\"sg\" data-s=\"1\">Prima apri il file con <code>open<\/code> e il flag <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo flag vuol dire write, cioè scrivere.<\/span> <span class=\"sg\" data-s=\"3\">Poi usa i metodi <code>say<\/code> o <code>print<\/code> dell'handle.<\/span> <span class=\"sg\" data-s=\"4\">Alla fine chiudilo con <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Alla fine chiudi l'handle.<\/span> <span class=\"sg\" data-s=\"1\">Così tutti i tuoi dati vanno davvero sul disco.<\/span> <span class=\"sg\" data-s=\"2\">Alcuni file sono troppo grandi per la memoria.<\/span> <span class=\"sg\" data-s=\"3\">Non puoi leggerli tutti in una volta.<\/span> <span class=\"sg\" data-s=\"4\">Per questi file di solito leggi riga per riga, come sopra.<\/span><\/p>"]]},"lv":{"t":"Failu deskriptori","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Visu failu ir viegli nolasīt vai ierakstīt uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Bet dažreiz jūs gribat iet cauri failam pa rindai.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī jūs gribat rakstīt failā daudz reižu.<\/span> <span class=\"sg\" data-s=\"3\">Visu šo laiku failam jāpaliek atvērtam.<\/span> <span class=\"sg\" data-s=\"4\">Tam jūs lietojat <em>faila turi<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Faila turis ir objekts atvērtam failam.<\/span> <span class=\"sg\" data-s=\"6\">Caur to jūs lasāt no faila vai rakstāt tajā.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vieglākais veids, kā lasīt failu pa rindai.<\/span> <span class=\"sg\" data-s=\"1\">Jums pat nav pašiem jāizveido turis.<\/span> <span class=\"sg\" data-s=\"2\">Izsauciet metodi <code>lines<\/code> uz ceļa objekta.<\/span> <span class=\"sg\" data-s=\"3\">Tā dod jums rindas pa vienai.<\/span> <span class=\"sg\" data-s=\"4\">Tās ir gatavas ciklam <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>$line<\/code> ir viena rinda.<\/span> <span class=\"sg\" data-s=\"1\">Tās beigās nav jaunas rindas rakstzīmes.<\/span> <span class=\"sg\" data-s=\"2\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Caur turi jūs varat arī rakstīt failā.<\/span> <span class=\"sg\" data-s=\"1\">Vispirms atveriet failu ar <code>open<\/code> un karodziņu <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šis karodziņš nozīmē rakstīšanu.<\/span> <span class=\"sg\" data-s=\"3\">Tad lietojiet tura metodes <code>say<\/code> vai <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Beigās aizveriet to ar <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beigās aizveriet turi.<\/span> <span class=\"sg\" data-s=\"1\">Tad visi jūsu dati tiešām nonāk diskā.<\/span> <span class=\"sg\" data-s=\"2\">Daži faili ir par lielu atmiņai.<\/span> <span class=\"sg\" data-s=\"3\">Jūs nevarat tos nolasīt visus uzreiz.<\/span> <span class=\"sg\" data-s=\"4\">Tādus failus jūs parasti lasāt pa rindai, kā augstāk.<\/span><\/p>"]]},"ru":{"t":"Файловые дескрипторы","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Читать или записывать весь файл сразу легко.<\/span> <span class=\"sg\" data-s=\"1\">Но иногда вы хотите пройти по файлу строка за строкой.<\/span> <span class=\"sg\" data-s=\"2\">Или вы хотите много раз писать в файл.<\/span> <span class=\"sg\" data-s=\"3\">Всё это время файл должен быть открыт.<\/span> <span class=\"sg\" data-s=\"4\">Для этого вы используете <em>файловый дескриптор<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Файловый дескриптор — это объект для открытого файла.<\/span> <span class=\"sg\" data-s=\"6\">Через него вы читаете из файла или пишете в него.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вот самый простой способ читать файл строка за строкой.<\/span> <span class=\"sg\" data-s=\"1\">Вам даже не нужно самим создавать дескриптор.<\/span> <span class=\"sg\" data-s=\"2\">Вызовите метод <code>lines<\/code> у объекта пути.<\/span> <span class=\"sg\" data-s=\"3\">Он даёт вам строки по одной.<\/span> <span class=\"sg\" data-s=\"4\">Они готовы для цикла <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>$line<\/code> — это одна строка.<\/span> <span class=\"sg\" data-s=\"1\">В её конце нет перевода строки.<\/span> <span class=\"sg\" data-s=\"2\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Через дескриптор можно и писать в файл.<\/span> <span class=\"sg\" data-s=\"1\">Сначала откройте файл с помощью <code>open<\/code> и флага <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Этот флаг значит «запись».<\/span> <span class=\"sg\" data-s=\"3\">Потом используйте методы <code>say<\/code> или <code>print<\/code> у дескриптора.<\/span> <span class=\"sg\" data-s=\"4\">В конце закройте его с помощью <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В конце закройте дескриптор.<\/span> <span class=\"sg\" data-s=\"1\">Тогда все ваши данные действительно попадают на диск.<\/span> <span class=\"sg\" data-s=\"2\">Некоторые файлы слишком большие для памяти.<\/span> <span class=\"sg\" data-s=\"3\">Вы не можете прочитать их целиком сразу.<\/span> <span class=\"sg\" data-s=\"4\">Такие файлы вы обычно читаете строка за строкой, как выше.<\/span><\/p>"]]},"uk":{"t":"Дескриптори файлів","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Читати чи записувати весь файл за раз легко.<\/span> <span class=\"sg\" data-s=\"1\">Але іноді ви хочете пройти файл рядок за рядком.<\/span> <span class=\"sg\" data-s=\"2\">Або ви хочете писати у файл багато разів.<\/span> <span class=\"sg\" data-s=\"3\">Увесь цей час файл має бути відкритим.<\/span> <span class=\"sg\" data-s=\"4\">Для цього ви використовуєте <em>дескриптор файлу<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Дескриптор файлу — це об'єкт для відкритого файлу.<\/span> <span class=\"sg\" data-s=\"6\">Через нього ви читаєте з файлу або пишете в нього.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ось найпростіший спосіб читати файл рядок за рядком.<\/span> <span class=\"sg\" data-s=\"1\">Вам навіть не треба самим створювати дескриптор.<\/span> <span class=\"sg\" data-s=\"2\">Викличте метод <code>lines<\/code> для об'єкта шляху.<\/span> <span class=\"sg\" data-s=\"3\">Він дає вам рядки один за одним.<\/span> <span class=\"sg\" data-s=\"4\">Вони готові для циклу <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>$line<\/code> — це один рядок.<\/span> <span class=\"sg\" data-s=\"1\">У його кінці немає символу нового рядка.<\/span> <span class=\"sg\" data-s=\"2\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Через дескриптор можна також писати у файл.<\/span> <span class=\"sg\" data-s=\"1\">Спочатку відкрийте файл за допомогою <code>open<\/code> із прапорцем <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Цей прапорець означає запис.<\/span> <span class=\"sg\" data-s=\"3\">Потім використовуйте методи <code>say<\/code> або <code>print<\/code> дескриптора.<\/span> <span class=\"sg\" data-s=\"4\">Наприкінці закрийте його через <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Наприкінці закрийте дескриптор.<\/span> <span class=\"sg\" data-s=\"1\">Тоді всі ваші дані справді потраплять на диск.<\/span> <span class=\"sg\" data-s=\"2\">Деякі файли завеликі для пам'яті.<\/span> <span class=\"sg\" data-s=\"3\">Їх не можна прочитати цілком за раз.<\/span> <span class=\"sg\" data-s=\"4\">Такі файли зазвичай читають рядок за рядком, як вище.<\/span><\/p>"]]},"bg":{"t":"Манипулатори на файлове","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Лесно е да прочетете или запишете цял файл наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Но понякога искате да минете през файла ред по ред.<\/span> <span class=\"sg\" data-s=\"2\">Или искате да пишете във файл много пъти.<\/span> <span class=\"sg\" data-s=\"3\">Тогава файлът трябва да остане отворен през цялото време.<\/span> <span class=\"sg\" data-s=\"4\">За това използвате <em>манипулатор на файл<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Манипулаторът на файл е обект за отворен файл.<\/span> <span class=\"sg\" data-s=\"6\">Чрез него четете от файла или пишете в него.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ето най-лесния начин да четете файл ред по ред.<\/span> <span class=\"sg\" data-s=\"1\">Дори не е нужно сами да правите манипулатор.<\/span> <span class=\"sg\" data-s=\"2\">Извикайте метода <code>lines<\/code> върху обект-път.<\/span> <span class=\"sg\" data-s=\"3\">Той ви дава редовете един по един.<\/span> <span class=\"sg\" data-s=\"4\">Те са готови за цикъл <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>$line<\/code> е един ред.<\/span> <span class=\"sg\" data-s=\"1\">В края му няма нов ред.<\/span> <span class=\"sg\" data-s=\"2\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете и да пишете във файл чрез манипулатор.<\/span> <span class=\"sg\" data-s=\"1\">Първо отворете файла с <code>open<\/code> и флага <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Този флаг означава „write“, тоест писане.<\/span> <span class=\"sg\" data-s=\"3\">След това използвайте методите <code>say<\/code> или <code>print<\/code> на манипулатора.<\/span> <span class=\"sg\" data-s=\"4\">Накрая го затворете с <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Накрая затворете манипулатора.<\/span> <span class=\"sg\" data-s=\"1\">Тогава всичките ви данни наистина отиват на диска.<\/span> <span class=\"sg\" data-s=\"2\">Някои файлове са твърде големи за паметта.<\/span> <span class=\"sg\" data-s=\"3\">Не можете да ги прочетете целите наведнъж.<\/span> <span class=\"sg\" data-s=\"4\">Такива файлове обикновено четете ред по ред, както по-горе.<\/span><\/p>"]]},"eo":{"t":"Dosierteniloj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Estas facile legi aŭ skribi tutan dosieron samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Sed foje vi volas trairi dosieron linio post linio.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ vi volas skribi al dosiero multajn fojojn.<\/span> <span class=\"sg\" data-s=\"3\">La dosiero devas resti malfermita dum la tuta tempo.<\/span> <span class=\"sg\" data-s=\"4\">Por tio, vi uzas <em>dosiertenilon<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Dosiertenilo estas objekto por malfermita dosiero.<\/span> <span class=\"sg\" data-s=\"6\">Per ĝi, vi legas el la dosiero aŭ skribas al ĝi.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jen la plej facila maniero legi dosieron linio post linio.<\/span> <span class=\"sg\" data-s=\"1\">Vi eĉ ne bezonas mem fari tenilon.<\/span> <span class=\"sg\" data-s=\"2\">Voku la metodon <code>lines<\/code> sur vojobjekto.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi donas al vi la liniojn unu post la alia.<\/span> <span class=\"sg\" data-s=\"4\">Ili estas pretaj por buklo <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>$line<\/code> estas unu linio.<\/span> <span class=\"sg\" data-s=\"1\">Ĉe ĝia fino ne estas linifino.<\/span> <span class=\"sg\" data-s=\"2\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas skribi al dosiero per tenilo.<\/span> <span class=\"sg\" data-s=\"1\">Unue, malfermu la dosieron per <code>open<\/code> kaj la flago <code>:w<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu flago signifas skribi.<\/span> <span class=\"sg\" data-s=\"3\">Poste uzu la metodojn <code>say<\/code> aŭ <code>print<\/code> de la tenilo.<\/span> <span class=\"sg\" data-s=\"4\">Fine, fermu ĝin per <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Fermu la tenilon ĉe la fino.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĉiuj viaj datumoj vere iras al la disko.<\/span> <span class=\"sg\" data-s=\"2\">Kelkaj dosieroj estas tro grandaj por la memoro.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne povas legi ilin tutajn samtempe.<\/span> <span class=\"sg\" data-s=\"4\">Por tiaj dosieroj, vi kutime legas linio post linio, kiel supre.<\/span><\/p>"]]},"la":{"t":"Ansae plicarum","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">Facile est totum archivum simul legere aut scribere.<\/span> <span class=\"sg\" data-s=\"1\">Sed interdum per archivum linea post lineam ire vis.<\/span> <span class=\"sg\" data-s=\"2\">Aut saepe in archivum scribere vis.<\/span> <span class=\"sg\" data-s=\"3\">Archivum toto illo tempore apertum manere debet.<\/span> <span class=\"sg\" data-s=\"4\">Ad hoc <em>tractabulo archivi<\/em> uteris.<\/span> <span class=\"sg\" data-s=\"5\">Tractabulum archivi est obiectum pro archivo aperto.<\/span> <span class=\"sg\" data-s=\"6\">Per id ex archivo legis aut in id scribis.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ecce modus facillimus ut archivum linea post lineam legas.<\/span> <span class=\"sg\" data-s=\"1\">Ne tractabulum quidem ipse facere debes.<\/span> <span class=\"sg\" data-s=\"2\">Methodum <code>lines<\/code> in obiecto semitae voca.<\/span> <span class=\"sg\" data-s=\"3\">Lineas tibi unam post alteram dat.<\/span> <span class=\"sg\" data-s=\"4\">Paratae sunt ad anulum <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quaeque <code>$line<\/code> una linea est.<\/span> <span class=\"sg\" data-s=\"1\">In fine eius nulla nova linea est.<\/span> <span class=\"sg\" data-s=\"2\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Etiam per tractabulum in archivum scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Primum archivum per <code>open<\/code> cum vexillo <code>:w<\/code> aperi.<\/span> <span class=\"sg\" data-s=\"2\">Hoc vexillum scribendi est.<\/span> <span class=\"sg\" data-s=\"3\">Deinde methodis <code>say<\/code> aut <code>print<\/code> tractabuli utere.<\/span> <span class=\"sg\" data-s=\"4\">Ad finem id per <code>close<\/code> claude:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ad finem tractabulum claude.<\/span> <span class=\"sg\" data-s=\"1\">Tum omnia data tua vere in discum eunt.<\/span> <span class=\"sg\" data-s=\"2\">Quaedam archiva nimis magna sunt pro memoria.<\/span> <span class=\"sg\" data-s=\"3\">Ea tota simul legere non potes.<\/span> <span class=\"sg\" data-s=\"4\">Talia archiva plerumque linea post lineam legis, ut supra.<\/span><\/p>"]]}}}</script>
