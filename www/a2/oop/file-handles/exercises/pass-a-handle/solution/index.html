ailu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Передайте дескриптор в функцию","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот один способ решить задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>open<\/code> возвращает дескриптор. Этот дескриптор — просто значение в <code>$fh<\/code>. Поэтому вы можете передать его в <code>log-line<\/code> как аргумент. Так же вы передаёте строку или число. Внутри подпрограммы <code>$fh.say<\/code> пишет через этот же открытый дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор остаётся открытым во время всех трёх вызовов. Поэтому каждый <code>log-line<\/code> добавляет строку в конец того же файла. Потом <code>close<\/code> записывает всё на диск. <code>slurp<\/code> читает три строки обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Поэтому дескрипторы легко сочетать с функциями. Функция может принять дескриптор. Она может писать в него или читать из него. Ей всё равно, для какого файла этот дескриптор. Файл выбирает код, который вызывает функцию. Он делает это, когда открывает файл.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Передайте дескриптор функції","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один спосіб розв'язати задачу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>open<\/code> повертає дескриптор. Цей дескриптор — просто значення в <code>$fh<\/code>. Тож його можна передати до <code>log-line<\/code> як аргумент. Так само ви робите з рядком чи числом. Усередині підпрограми <code>$fh.say<\/code> пише через цей самий відкритий дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор лишається відкритим під час усіх трьох викликів. Тож кожен <code>log-line<\/code> додає рядок у кінець того самого файлу. Потім <code>close<\/code> записує все на диск. <code>slurp<\/code> читає три рядки назад.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тому дескриптори легко поєднувати з функціями. Функція може приймати дескриптор. Вона може писати в нього або читати з нього. Їй байдуже, для якого файлу цей дескриптор. Код, який викликає функцію, вибирає файл. Він робить це, коли відкриває файл.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Подайте манипулатор на функция","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един начин да решите задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>open<\/code> връща манипулатор. Този манипулатор е просто стойност в <code>$fh<\/code>. Затова можете да го подадете на <code>log-line<\/code> като аргумент. Същото правите с низ или число. Вътре в подпрограмата <code>$fh.say<\/code> пише чрез същия отворен манипулатор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Манипулаторът остава отворен през трите извиквания. Затова всяко <code>log-line<\/code> добавя ред в края на същия файл. След това <code>close<\/code> записва всичко на диска. <code>slurp<\/code> прочита трите реда обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Така манипулаторите лесно се съчетават с функции. Функцията може да приеме манипулатор. Тя може да пише в него или да чете от него. За нея няма значение за кой файл е манипулаторът. Кодът, който извиква функцията, избира файла. Той прави това, когато отваря файла.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Transdonu tenilon al funkcio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu maniero solvi la taskon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>open<\/code> redonas tenilon. Ĉi tiu tenilo estas nur valoro en <code>$fh<\/code>. Do vi povas transdoni ĝin al <code>log-line<\/code> kiel argumenton. Vi faras la samon kun ĉeno aŭ nombro. En la subrutino, <code>$fh.say<\/code> skribas per ĉi tiu sama malfermita tenilo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tenilo restas malfermita dum ĉiuj tri vokoj. Do ĉiu <code>log-line<\/code> aldonas linion al la fino de la sama dosiero. Poste <code>close<\/code> skribas ĉion al la disko. <code>slurp<\/code> relegas la tri liniojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tial oni facile kombinas tenilojn kun funkcioj. Funkcio povas preni tenilon. Ĝi povas skribi al ĝi aŭ legi el ĝi. Ĝi ne zorgas, por kiu dosiero la tenilo estas. La kodo, kiu vokas la funkcion, elektas la dosieron. Ĝi faras tion, kiam ĝi malfermas la dosieron.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Ansam functioni trade","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc modo exercitationem solvere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>open<\/code> tractabulum reddit. Hoc tractabulum solum valor in <code>$fh<\/code> est. Itaque id ad <code>log-line<\/code> ut argumentum tradere potes. Idem cum chorda aut numero facis. Intra subprogramma <code>$fh.say<\/code> per hoc idem tractabulum apertum scribit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tractabulum per omnes tres vocationes apertum manet. Itaque quodque <code>log-line<\/code> lineam ad finem eiusdem archivi addit. Deinde <code>close<\/code> omnia in discum scribit. <code>slurp<\/code> tres lineas retro legit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ideo tractabula facile cum functionibus coniungere potes. Functio tractabulum accipere potest. In id scribere aut ex eo legere potest. Non curat cuius archivi tractabulum sit. Codex qui functionem vocat archivum eligit. Hoc facit cum archivum aperit.<\/span><\/li><\/ol>"]]}}}</script>
