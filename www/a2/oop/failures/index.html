<script type="application/json" id="page-data">{"u":"oop/failures","n":952,"k":"section","pv":"oop/exception-objects/quiz","nx":"oop/failures/exercises","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Soft failures","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">An exception from <code>die<\/code> stops everything at once.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes this is too much.<\/span> <span class=\"sg\" data-s=\"2\">Maybe a subroutine cannot give a result.<\/span> <span class=\"sg\" data-s=\"3\">It must report this problem.<\/span> <span class=\"sg\" data-s=\"4\">But the caller must decide if the program stops.<\/span> <span class=\"sg\" data-s=\"5\">The caller is the code that called the subroutine.<\/span> <span class=\"sg\" data-s=\"6\">For this case, Raku has <em>soft failures<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">You make them with <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">A subroutine can call <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then it does not throw an exception at once.<\/span> <span class=\"sg\" data-s=\"2\">Instead, it returns a special <code>Failure<\/code> object to the caller.<\/span> <span class=\"sg\" data-s=\"3\">A <code>Failure<\/code> is a value with an error inside.<\/span> <span class=\"sg\" data-s=\"4\">It is undefined.<\/span> <span class=\"sg\" data-s=\"5\">So the caller can quietly check for it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The first call works and returns <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The second call fails.<\/span> <span class=\"sg\" data-s=\"2\">It returns a <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">For this object, <code>defined<\/code> gives <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">So the caller can test the result before it uses it.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Why is a <code>Failure<\/code> called <em>soft<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">It becomes a real, thrown exception only in one case.<\/span> <span class=\"sg\" data-s=\"2\">This is when you use it as a value without a check.<\/span> <span class=\"sg\" data-s=\"3\">But you can handle it, for example, with a test for <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Then it stays quiet.<\/span> <span class=\"sg\" data-s=\"5\">So a subroutine can report a problem.<\/span> <span class=\"sg\" data-s=\"6\">The whole program does not have to stop.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">You know this already<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This kind of failure is put off until later.<\/span> <span class=\"sg\" data-s=\"1\">Not only <code>fail<\/code> works in this way.<\/span> <span class=\"sg\" data-s=\"2\">Earlier in this part, you saw the same idea two times.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <strong>division by zero<\/strong> quietly makes a value.<\/span> <span class=\"sg\" data-s=\"1\">It throws an exception only when you really use the value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A <strong>failing external program<\/strong> returns a <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It throws an exception only in one case.<\/span> <span class=\"sg\" data-s=\"2\">That is when you throw the <code>Proc<\/code> away without handling it.<\/span> <span class=\"sg\" data-s=\"3\">Keep the <code>Proc<\/code> and look at it.<\/span> <span class=\"sg\" data-s=\"4\">Then it stays a quiet value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In each case, a problem does not stop the program right away.<\/span> <span class=\"sg\" data-s=\"1\">It becomes a value.<\/span> <span class=\"sg\" data-s=\"2\">You can check this value.<\/span> <span class=\"sg\" data-s=\"3\">It turns into a thrown exception only in two cases.<\/span> <span class=\"sg\" data-s=\"4\">You use it without a check, or you ignore it.<\/span> <span class=\"sg\" data-s=\"5\">The topic <a href=\"/oop/try/deferred-errors/\">Not every error is immediate<\/a> shows both examples together.<\/span><\/p>"]]},"de":{"t":"Weiche Fehlschläge","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme von <code>die<\/code> hält sofort alles an.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal ist das zu viel.<\/span> <span class=\"sg\" data-s=\"2\">Vielleicht kann eine Subroutine kein Ergebnis liefern.<\/span> <span class=\"sg\" data-s=\"3\">Sie muss dieses Problem melden.<\/span> <span class=\"sg\" data-s=\"4\">Aber der Aufrufer muss entscheiden, ob das Programm anhält.<\/span> <span class=\"sg\" data-s=\"5\">Der Aufrufer ist der Code, der die Subroutine aufgerufen hat.<\/span> <span class=\"sg\" data-s=\"6\">Für diesen Fall hat Raku <em>weiche Fehlschläge<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Sie erzeugen sie mit <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine kann <code>fail<\/code> aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Dann wirft sie nicht sofort eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen gibt sie dem Aufrufer ein besonderes <code>Failure<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"3\">Ein <code>Failure<\/code> ist ein Wert mit einem Fehler darin.<\/span> <span class=\"sg\" data-s=\"4\">Es ist undefiniert.<\/span> <span class=\"sg\" data-s=\"5\">Also kann der Aufrufer in Ruhe darauf prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf funktioniert und gibt <code>5<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Der zweite Aufruf schlägt fehl.<\/span> <span class=\"sg\" data-s=\"2\">Er gibt ein <code>Failure<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"3\">Für dieses Objekt ergibt <code>defined<\/code> den Wert <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Also kann der Aufrufer das Ergebnis prüfen, bevor er es benutzt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Warum heißt ein <code>Failure<\/code> <em>weich<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Es wird nur in einem Fall zu einer echten, geworfenen Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Das ist der Fall, wenn Sie es ohne Prüfung als Wert benutzen.<\/span> <span class=\"sg\" data-s=\"3\">Aber Sie können es behandeln, zum Beispiel mit einem Test auf <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Dann bleibt es still.<\/span> <span class=\"sg\" data-s=\"5\">Also kann eine Subroutine ein Problem melden.<\/span> <span class=\"sg\" data-s=\"6\">Das ganze Programm muss nicht anhalten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das kennen Sie schon<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bei dieser Art von Fehlschlag kommt der Fehler erst später.<\/span> <span class=\"sg\" data-s=\"1\">Nicht nur <code>fail<\/code> arbeitet so.<\/span> <span class=\"sg\" data-s=\"2\">Früher in diesem Teil haben Sie dieselbe Idee zweimal gesehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <strong>Division durch null<\/strong> erzeugt still einen Wert.<\/span> <span class=\"sg\" data-s=\"1\">Die Division wirft erst dann eine Ausnahme, wenn Sie den Wert wirklich benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <strong>fehlschlagendes externes Programm<\/strong> gibt ein <code>Proc<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es wirft nur in einem Fall eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Nämlich dann, wenn Sie das <code>Proc<\/code> ohne Behandlung wegwerfen.<\/span> <span class=\"sg\" data-s=\"3\">Behalten Sie das <code>Proc<\/code> und sehen Sie es sich an.<\/span> <span class=\"sg\" data-s=\"4\">Dann bleibt es ein stiller Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In jedem dieser Fälle hält ein Problem das Programm nicht sofort an.<\/span> <span class=\"sg\" data-s=\"1\">Es wird zu einem Wert.<\/span> <span class=\"sg\" data-s=\"2\">Sie können diesen Wert prüfen.<\/span> <span class=\"sg\" data-s=\"3\">Er wird nur in zwei Fällen zu einer geworfenen Ausnahme.<\/span> <span class=\"sg\" data-s=\"4\">Sie benutzen ihn ohne Prüfung, oder Sie ignorieren ihn.<\/span> <span class=\"sg\" data-s=\"5\">Das Thema <a href=\"https://course.raku.org/de/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Nicht jeder Fehler tritt sofort auf<\/a> zeigt beide Beispiele zusammen.<\/span><\/p>"]]},"nl":{"t":"Zachte mislukkingen","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Een exceptie van <code>die<\/code> stopt alles meteen.<\/span> <span class=\"sg\" data-s=\"1\">Soms is dat te veel.<\/span> <span class=\"sg\" data-s=\"2\">Misschien kan een subroutine geen resultaat geven.<\/span> <span class=\"sg\" data-s=\"3\">Ze moet dit probleem melden.<\/span> <span class=\"sg\" data-s=\"4\">Maar de aanroeper moet beslissen of het programma stopt.<\/span> <span class=\"sg\" data-s=\"5\">De aanroeper is de code die de subroutine aanriep.<\/span> <span class=\"sg\" data-s=\"6\">Voor dit geval heeft Raku <em>zachte mislukkingen<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Je maakt ze met <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een subroutine kan <code>fail<\/code> aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">Dan werpt ze niet meteen een exceptie.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan geeft ze een bijzonder <code>Failure<\/code>-object terug aan de aanroeper.<\/span> <span class=\"sg\" data-s=\"3\">Een <code>Failure<\/code> is een waarde met een fout erin.<\/span> <span class=\"sg\" data-s=\"4\">Hij is ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"5\">Dus kan de aanroeper er rustig op controleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep werkt en geeft <code>5<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">De tweede aanroep mislukt.<\/span> <span class=\"sg\" data-s=\"2\">Hij geeft een <code>Failure<\/code> terug.<\/span> <span class=\"sg\" data-s=\"3\">Voor dit object geeft <code>defined<\/code> de waarde <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Dus kan de aanroeper het resultaat testen voordat hij het gebruikt.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Waarom heet een <code>Failure<\/code> <em>zacht<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Hij wordt maar in één geval een echte, geworpen exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Dat is als je hem als waarde gebruikt zonder controle.<\/span> <span class=\"sg\" data-s=\"3\">Maar je kunt hem afhandelen, bijvoorbeeld met een test op <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Dan blijft hij stil.<\/span> <span class=\"sg\" data-s=\"5\">Zo kan een subroutine een probleem melden.<\/span> <span class=\"sg\" data-s=\"6\">Het hele programma hoeft niet te stoppen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dit ken je al<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit soort mislukking wacht tot later.<\/span> <span class=\"sg\" data-s=\"1\">Niet alleen <code>fail<\/code> werkt zo.<\/span> <span class=\"sg\" data-s=\"2\">Eerder in dit deel zag je hetzelfde idee al twee keer.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <strong>deling door nul<\/strong> maakt stil een waarde.<\/span> <span class=\"sg\" data-s=\"1\">Ze werpt pas een exceptie als je de waarde echt gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <strong>mislukkend extern programma<\/strong> geeft een <code>Proc<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Die werpt maar in één geval een exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Dat is als je de <code>Proc<\/code> weggooit zonder hem af te handelen.<\/span> <span class=\"sg\" data-s=\"3\">Bewaar de <code>Proc<\/code> en kijk ernaar.<\/span> <span class=\"sg\" data-s=\"4\">Dan blijft hij een stille waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In elk geval stopt een probleem het programma niet meteen.<\/span> <span class=\"sg\" data-s=\"1\">Het wordt een waarde.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt deze waarde controleren.<\/span> <span class=\"sg\" data-s=\"3\">Ze wordt maar in twee gevallen een geworpen exceptie.<\/span> <span class=\"sg\" data-s=\"4\">Je gebruikt haar zonder controle, of je negeert haar.<\/span> <span class=\"sg\" data-s=\"5\">Het onderwerp <a href=\"https://course.raku.org/nl/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Niet elke fout is onmiddellijk<\/a> toont beide voorbeelden samen.<\/span><\/p>"]]},"es":{"t":"Fallos suaves","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Una excepción de <code>die<\/code> lo detiene todo enseguida.<\/span> <span class=\"sg\" data-s=\"1\">A veces esto es demasiado.<\/span> <span class=\"sg\" data-s=\"2\">Quizás una subrutina no puede dar un resultado.<\/span> <span class=\"sg\" data-s=\"3\">Debe informar de este problema.<\/span> <span class=\"sg\" data-s=\"4\">Pero quien llama debe decidir si el programa se detiene.<\/span> <span class=\"sg\" data-s=\"5\">Quien llama es el código que llamó a la subrutina.<\/span> <span class=\"sg\" data-s=\"6\">Para este caso, Raku tiene los <em>fallos blandos<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Los creas con <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Una subrutina puede llamar a <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces no lanza una excepción enseguida.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, devuelve un objeto especial <code>Failure<\/code> a quien llama.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>Failure<\/code> es un valor con un error dentro.<\/span> <span class=\"sg\" data-s=\"4\">No está definido.<\/span> <span class=\"sg\" data-s=\"5\">Así que quien llama puede comprobarlo en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La primera llamada funciona y devuelve <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La segunda llamada falla.<\/span> <span class=\"sg\" data-s=\"2\">Devuelve un <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Para este objeto, <code>defined<\/code> da <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Así que quien llama puede comprobar el resultado antes de usarlo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">¿Por qué se llama <em>blando<\/em> un <code>Failure<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Se convierte en una excepción real y lanzada solo en un caso.<\/span> <span class=\"sg\" data-s=\"2\">Esto pasa cuando lo usas como valor sin comprobarlo.<\/span> <span class=\"sg\" data-s=\"3\">Pero puedes manejarlo, por ejemplo, comprobando <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Entonces se queda callado.<\/span> <span class=\"sg\" data-s=\"5\">Así una subrutina puede informar de un problema.<\/span> <span class=\"sg\" data-s=\"6\">El programa entero no tiene que detenerse.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esto ya lo conoces<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este tipo de fallo se deja para más tarde.<\/span> <span class=\"sg\" data-s=\"1\">No solo <code>fail<\/code> funciona así.<\/span> <span class=\"sg\" data-s=\"2\">Antes en esta parte, viste la misma idea dos veces.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <strong>división por cero<\/strong> crea un valor en silencio.<\/span> <span class=\"sg\" data-s=\"1\">Lanza una excepción solo cuando de verdad usas el valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programa externo que falla<\/strong> devuelve un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lanza una excepción solo en un caso.<\/span> <span class=\"sg\" data-s=\"2\">Es cuando tiras el <code>Proc<\/code> sin manejarlo.<\/span> <span class=\"sg\" data-s=\"3\">Guarda el <code>Proc<\/code> y míralo.<\/span> <span class=\"sg\" data-s=\"4\">Entonces sigue siendo un valor callado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">En cada caso, un problema no detiene el programa enseguida.<\/span> <span class=\"sg\" data-s=\"1\">Se convierte en un valor.<\/span> <span class=\"sg\" data-s=\"2\">Puedes comprobar este valor.<\/span> <span class=\"sg\" data-s=\"3\">Se convierte en una excepción lanzada solo en dos casos.<\/span> <span class=\"sg\" data-s=\"4\">Lo usas sin comprobarlo, o lo ignoras.<\/span> <span class=\"sg\" data-s=\"5\">El tema <a href=\"https://course.raku.org/es/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">No todo error es inmediato<\/a> muestra los dos ejemplos juntos.<\/span><\/p>"]]},"it":{"t":"Guasti morbidi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Un'eccezione di <code>die<\/code> ferma tutto subito.<\/span> <span class=\"sg\" data-s=\"1\">A volte questo è troppo.<\/span> <span class=\"sg\" data-s=\"2\">Forse una subroutine non può dare un risultato.<\/span> <span class=\"sg\" data-s=\"3\">Deve segnalare questo problema.<\/span> <span class=\"sg\" data-s=\"4\">Ma il chiamante deve decidere se il programma si ferma.<\/span> <span class=\"sg\" data-s=\"5\">Il chiamante è il codice che ha chiamato la subroutine.<\/span> <span class=\"sg\" data-s=\"6\">Per questo caso Raku ha i <em>fallimenti morbidi<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Li crei con <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Una subroutine può chiamare <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora non solleva subito un'eccezione.<\/span> <span class=\"sg\" data-s=\"2\">Invece restituisce al chiamante un oggetto speciale <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>Failure<\/code> è un valore con dentro un errore.<\/span> <span class=\"sg\" data-s=\"4\">Non è definito.<\/span> <span class=\"sg\" data-s=\"5\">Quindi il chiamante può controllarlo in silenzio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata funziona e restituisce <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La seconda chiamata fallisce.<\/span> <span class=\"sg\" data-s=\"2\">Restituisce un <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Per questo oggetto <code>defined<\/code> dà <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Quindi il chiamante può controllare il risultato prima di usarlo.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Perché un <code>Failure<\/code> si chiama <em>morbido<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Diventa una vera eccezione sollevata solo in un caso.<\/span> <span class=\"sg\" data-s=\"2\">È quando lo usi come valore senza un controllo.<\/span> <span class=\"sg\" data-s=\"3\">Ma puoi gestirlo, per esempio con un test su <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Allora resta silenzioso.<\/span> <span class=\"sg\" data-s=\"5\">Così una subroutine può segnalare un problema.<\/span> <span class=\"sg\" data-s=\"6\">Il programma intero non deve per forza fermarsi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Questo lo conosci già<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo tipo di fallimento è rimandato a dopo.<\/span> <span class=\"sg\" data-s=\"1\">Non solo <code>fail<\/code> funziona così.<\/span> <span class=\"sg\" data-s=\"2\">Prima, in questa parte, hai visto la stessa idea due volte.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <strong>divisione per zero<\/strong> crea un valore in silenzio.<\/span> <span class=\"sg\" data-s=\"1\">Solleva un'eccezione solo quando usi davvero il valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programma esterno che fallisce<\/strong> restituisce un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Solleva un'eccezione solo in un caso.<\/span> <span class=\"sg\" data-s=\"2\">Succede quando butti via il <code>Proc<\/code> senza gestirlo.<\/span> <span class=\"sg\" data-s=\"3\">Conserva il <code>Proc<\/code> e guardalo.<\/span> <span class=\"sg\" data-s=\"4\">Allora resta un valore silenzioso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">In ogni caso un problema non ferma subito il programma.<\/span> <span class=\"sg\" data-s=\"1\">Diventa un valore.<\/span> <span class=\"sg\" data-s=\"2\">Puoi controllare questo valore.<\/span> <span class=\"sg\" data-s=\"3\">Diventa un'eccezione sollevata solo in due casi.<\/span> <span class=\"sg\" data-s=\"4\">Lo usi senza un controllo, oppure lo ignori.<\/span> <span class=\"sg\" data-s=\"5\">L'argomento <a href=\"https://course.raku.org/it/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Non ogni errore è immediato<\/a> mostra i due esempi insieme.<\/span><\/p>"]]},"lv":{"t":"Mīkstās kļūmes","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Izņēmums no <code>die<\/code> uzreiz aptur visu.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz tas ir par daudz.<\/span> <span class=\"sg\" data-s=\"2\">Varbūt apakšprogramma nevar dot rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Tai jāziņo par šo problēmu.<\/span> <span class=\"sg\" data-s=\"4\">Bet izsaucējam jāizlemj, vai programma apstājas.<\/span> <span class=\"sg\" data-s=\"5\">Izsaucējs ir kods, kas izsauca apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"6\">Šim gadījumam Raku valodā ir <em>mīkstās neveiksmes<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Jūs tās veidojat ar <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma var izsaukt <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā neizmet izņēmumu uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tā atgriež izsaucējam īpašu <code>Failure<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> ir vērtība ar kļūdu iekšā.<\/span> <span class=\"sg\" data-s=\"4\">Tas ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc izsaucējs var to klusi pārbaudīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pirmais izsaukums izdodas un atgriež <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Otrais izsaukums neizdodas.<\/span> <span class=\"sg\" data-s=\"2\">Tas atgriež <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šim objektam <code>defined<\/code> dod <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc izsaucējs var pārbaudīt rezultātu, pirms to izmanto.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kāpēc <code>Failure<\/code> sauc par <em>mīkstu<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Tas kļūst par īstu, izmestu izņēmumu tikai vienā gadījumā.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tad, kad jūs to izmantojat kā vērtību bez pārbaudes.<\/span> <span class=\"sg\" data-s=\"3\">Bet jūs varat to apstrādāt, piemēram, ar <code>defined<\/code> pārbaudi.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas paliek kluss.<\/span> <span class=\"sg\" data-s=\"5\">Tā apakšprogramma var ziņot par problēmu.<\/span> <span class=\"sg\" data-s=\"6\">Visai programmai nav jāapstājas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">To jūs jau zināt<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šo neveiksmes veidu atliek uz vēlāku laiku.<\/span> <span class=\"sg\" data-s=\"1\">Ne tikai <code>fail<\/code> darbojas šādi.<\/span> <span class=\"sg\" data-s=\"2\">Agrāk šajā daļā jūs to pašu ideju redzējāt divas reizes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli<\/strong> klusi izveido vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tā izmet izņēmumu tikai tad, kad jūs vērtību tiešām izmantojat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma<\/strong> atgriež <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas izmet izņēmumu tikai vienā gadījumā.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tad, kad jūs izmetat <code>Proc<\/code> bez apstrādes.<\/span> <span class=\"sg\" data-s=\"3\">Paturiet <code>Proc<\/code> un apskatiet to.<\/span> <span class=\"sg\" data-s=\"4\">Tad tas paliek klusa vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Katrā gadījumā problēma neaptur programmu uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tā kļūst par vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat šo vērtību pārbaudīt.<\/span> <span class=\"sg\" data-s=\"3\">Tā pārvēršas izmestā izņēmumā tikai divos gadījumos.<\/span> <span class=\"sg\" data-s=\"4\">Jūs to izmantojat bez pārbaudes, vai arī jūs to ignorējat.<\/span> <span class=\"sg\" data-s=\"5\">Temats <a href=\"https://course.raku.org/lv/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Ne katra kļūda parādās uzreiz<\/a> parāda abus piemērus kopā.<\/span><\/p>"]]},"ru":{"t":"Мягкие сбои","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Исключение из <code>die<\/code> сразу всё останавливает.<\/span> <span class=\"sg\" data-s=\"1\">Иногда это слишком.<\/span> <span class=\"sg\" data-s=\"2\">Может быть, подпрограмма не может дать результат.<\/span> <span class=\"sg\" data-s=\"3\">Она должна сообщить об этой проблеме.<\/span> <span class=\"sg\" data-s=\"4\">Но вызывающий код должен решить, остановить ли программу.<\/span> <span class=\"sg\" data-s=\"5\">Вызывающий код — это код, который вызвал подпрограмму.<\/span> <span class=\"sg\" data-s=\"6\">Для такого случая в Raku есть <em>мягкие сбои<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Их создают с помощью <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма может вызвать <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда она не бросает исключение сразу.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого она возвращает вызывающему коду особый объект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> — это значение с ошибкой внутри.<\/span> <span class=\"sg\" data-s=\"4\">Он не определён.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому вызывающий код может тихо его проверить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Первый вызов работает и возвращает <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второй вызов даёт сбой.<\/span> <span class=\"sg\" data-s=\"2\">Он возвращает <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Для этого объекта <code>defined<\/code> даёт <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому вызывающий код может проверить результат, прежде чем его использовать.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Почему <code>Failure<\/code> называют <em>мягким<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Он становится настоящим брошенным исключением только в одном случае.<\/span> <span class=\"sg\" data-s=\"2\">Это когда вы используете его как значение без проверки.<\/span> <span class=\"sg\" data-s=\"3\">Но вы можете обработать его, например, проверить <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тогда он остаётся тихим.<\/span> <span class=\"sg\" data-s=\"5\">Так подпрограмма может сообщить о проблеме.<\/span> <span class=\"sg\" data-s=\"6\">Всей программе не нужно останавливаться.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вы это уже знаете<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Такой сбой срабатывает не сразу, а позже.<\/span> <span class=\"sg\" data-s=\"1\">Так работает не только <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Раньше в этой части вы два раза видели ту же идею.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль<\/strong> тихо создаёт значение.<\/span> <span class=\"sg\" data-s=\"1\">Оно бросает исключение, только когда вы на самом деле используете это значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # ошибки пока нет\nsay $x;           # бросает только здесь, когда значение используется<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Внешняя программа, которая дала сбой<\/strong>, возвращает <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он бросает исключение только в одном случае.<\/span> <span class=\"sg\" data-s=\"2\">Это когда вы выбрасываете <code>Proc<\/code> и не обрабатываете его.<\/span> <span class=\"sg\" data-s=\"3\">Сохраните <code>Proc<\/code> и посмотрите на него.<\/span> <span class=\"sg\" data-s=\"4\">Тогда он остаётся тихим значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # неудачный Proc отброшен, поэтому здесь бросается исключение<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">В каждом случае проблема не останавливает программу сразу.<\/span> <span class=\"sg\" data-s=\"1\">Она становится значением.<\/span> <span class=\"sg\" data-s=\"2\">Это значение можно проверить.<\/span> <span class=\"sg\" data-s=\"3\">Оно превращается в брошенное исключение только в двух случаях.<\/span> <span class=\"sg\" data-s=\"4\">Вы используете его без проверки или не обращаете на него внимания.<\/span> <span class=\"sg\" data-s=\"5\">Тема <a href=\"https://course.raku.org/ru/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всякая ошибка возникает сразу<\/a> показывает оба примера вместе.<\/span><\/p>"]]},"uk":{"t":"М'які збої","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Виняток від <code>die<\/code> одразу зупиняє все.<\/span> <span class=\"sg\" data-s=\"1\">Іноді це занадто.<\/span> <span class=\"sg\" data-s=\"2\">Можливо, підпрограма не може дати результат.<\/span> <span class=\"sg\" data-s=\"3\">Вона має повідомити про цю проблему.<\/span> <span class=\"sg\" data-s=\"4\">Але викликач має вирішити, чи зупиняється програма.<\/span> <span class=\"sg\" data-s=\"5\">Викликач — це код, який викликав підпрограму.<\/span> <span class=\"sg\" data-s=\"6\">Для такого випадку в Raku є <em>м'які збої<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Ви створюєте їх через <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Підпрограма може викликати <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вона не кидає виняток одразу.<\/span> <span class=\"sg\" data-s=\"2\">Натомість вона повертає викликачеві особливий об'єкт <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> — це значення з помилкою всередині.<\/span> <span class=\"sg\" data-s=\"4\">Він невизначений.<\/span> <span class=\"sg\" data-s=\"5\">Тож викликач може тихо його перевірити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Перший виклик спрацьовує й повертає <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Другий виклик не спрацьовує.<\/span> <span class=\"sg\" data-s=\"2\">Він повертає <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Для цього об'єкта <code>defined<\/code> дає <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тож викликач може перевірити результат, перш ніж його використати.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Чому <code>Failure<\/code> називають <em>м'яким<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Він стає справжнім, кинутим винятком лише в одному випадку.<\/span> <span class=\"sg\" data-s=\"2\">Це коли ви використовуєте його як значення без перевірки.<\/span> <span class=\"sg\" data-s=\"3\">Але ви можете його обробити, наприклад, перевіркою <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тоді він лишається тихим.<\/span> <span class=\"sg\" data-s=\"5\">Тож підпрограма може повідомити про проблему.<\/span> <span class=\"sg\" data-s=\"6\">Уся програма не мусить зупинятися.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ви це вже знаєте<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Такий збій відкладається на потім.<\/span> <span class=\"sg\" data-s=\"1\">Так працює не лише <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Раніше в цій частині ви двічі бачили ту саму ідею.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль<\/strong> тихо створює значення.<\/span> <span class=\"sg\" data-s=\"1\">Значення кидає виняток, лише коли ви справді його використовуєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # помилки ще немає\nsay $x;           # кидає лише тут, коли значення використано<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, яка не спрацювала,<\/strong> повертає <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він кидає виняток лише в одному випадку.<\/span> <span class=\"sg\" data-s=\"2\">Це коли ви викидаєте <code>Proc<\/code> і не обробляєте його.<\/span> <span class=\"sg\" data-s=\"3\">Збережіть <code>Proc<\/code> і подивіться на нього.<\/span> <span class=\"sg\" data-s=\"4\">Тоді він лишається тихим значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # невдалий Proc відкинуто, тож це кидає виняток<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">У кожному випадку проблема не зупиняє програму одразу.<\/span> <span class=\"sg\" data-s=\"1\">Вона стає значенням.<\/span> <span class=\"sg\" data-s=\"2\">Це значення можна перевірити.<\/span> <span class=\"sg\" data-s=\"3\">Воно стає кинутим винятком лише у двох випадках.<\/span> <span class=\"sg\" data-s=\"4\">Ви використовуєте його без перевірки, або ви його ігноруєте.<\/span> <span class=\"sg\" data-s=\"5\">Тема <a href=\"https://course.raku.org/uk/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не кожна помилка негайна<\/a> показує обидва приклади разом.<\/span><\/p>"]]},"bg":{"t":"Меки провали","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Изключение от <code>die<\/code> спира всичко веднага.<\/span> <span class=\"sg\" data-s=\"1\">Понякога това е твърде много.<\/span> <span class=\"sg\" data-s=\"2\">Може би подпрограмата не може да даде резултат.<\/span> <span class=\"sg\" data-s=\"3\">Тя трябва да съобщи за този проблем.<\/span> <span class=\"sg\" data-s=\"4\">Но извикващият трябва да реши дали програмата спира.<\/span> <span class=\"sg\" data-s=\"5\">Извикващият е кодът, който е извикал подпрограмата.<\/span> <span class=\"sg\" data-s=\"6\">За този случай Raku има <em>меки провали<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Създавате ги с <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата може да извика <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя не хвърля изключение веднага.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това тя връща на извикващия специален обект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> е стойност с грешка вътре.<\/span> <span class=\"sg\" data-s=\"4\">Той е недефиниран.<\/span> <span class=\"sg\" data-s=\"5\">Затова извикващият може тихо да провери за него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Първото извикване работи и връща <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второто извикване се проваля.<\/span> <span class=\"sg\" data-s=\"2\">То връща <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">За този обект <code>defined<\/code> дава <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Затова извикващият може да провери резултата, преди да го използва.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Защо <code>Failure<\/code> се нарича <em>мек<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Той става истинско, хвърлено изключение само в един случай.<\/span> <span class=\"sg\" data-s=\"2\">Това е, когато го използвате като стойност без проверка.<\/span> <span class=\"sg\" data-s=\"3\">Но можете да го обработите, например с проверка за <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тогава той остава тих.<\/span> <span class=\"sg\" data-s=\"5\">Така подпрограмата може да съобщи за проблем.<\/span> <span class=\"sg\" data-s=\"6\">Не е нужно цялата програма да спира.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вече познавате това<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този вид провал се отлага за по-късно.<\/span> <span class=\"sg\" data-s=\"1\">Не само <code>fail<\/code> работи по този начин.<\/span> <span class=\"sg\" data-s=\"2\">По-рано в тази част видяхте същата идея два пъти.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Делението на нула<\/strong> тихо създава стойност.<\/span> <span class=\"sg\" data-s=\"1\">То хвърля изключение едва когато наистина използвате стойността:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # още няма грешка\nsay $x;           # хвърля едва тук, когато стойността се използва<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма<\/strong> връща <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той хвърля изключение само в един случай.<\/span> <span class=\"sg\" data-s=\"2\">Това е, когато изхвърлите <code>Proc<\/code>, без да го обработите.<\/span> <span class=\"sg\" data-s=\"3\">Запазете <code>Proc<\/code> и го разгледайте.<\/span> <span class=\"sg\" data-s=\"4\">Тогава той остава тиха стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # провалилият се Proc е изхвърлен, затова това хвърля<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">И в двата случая проблемът не спира програмата веднага.<\/span> <span class=\"sg\" data-s=\"1\">Той става стойност.<\/span> <span class=\"sg\" data-s=\"2\">Можете да проверите тази стойност.<\/span> <span class=\"sg\" data-s=\"3\">Тя става хвърлено изключение само в два случая.<\/span> <span class=\"sg\" data-s=\"4\">Използвате я без проверка или не ѝ обръщате внимание.<\/span> <span class=\"sg\" data-s=\"5\">Темата <a href=\"https://course.raku.org/bg/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всяка грешка е незабавна<\/a> показва двата примера заедно.<\/span><\/p>"]]},"eo":{"t":"Molaj misfunkcioj","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Escepto de <code>die<\/code> haltigas ĉion tuj.<\/span> <span class=\"sg\" data-s=\"1\">Foje tio estas tro multe.<\/span> <span class=\"sg\" data-s=\"2\">Eble subrutino ne povas doni rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi devas raporti ĉi tiun problemon.<\/span> <span class=\"sg\" data-s=\"4\">Sed la vokanto devas decidi, ĉu la programo haltas.<\/span> <span class=\"sg\" data-s=\"5\">La vokanto estas la kodo, kiu vokis la subrutinon.<\/span> <span class=\"sg\" data-s=\"6\">Por ĉi tiu kazo, Raku havas <em>molajn misfunkciojn<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Vi faras ilin per <code>fail<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Subrutino povas voki <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi ne ĵetas escepton tuj.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĝi redonas specialan objekton <code>Failure<\/code> al la vokanto.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> estas valoro kun eraro interne.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas nedifinita.<\/span> <span class=\"sg\" data-s=\"5\">Do la vokanto povas kviete kontroli ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La unua voko funkcias kaj redonas <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La dua voko malsukcesas.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi redonas <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Por ĉi tiu objekto, <code>defined<\/code> donas <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Do la vokanto povas testi la rezulton, antaŭ ol ĝi uzas ĝin.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Kial <code>Failure<\/code> nomiĝas <em>mola<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Ĝi fariĝas vera, ĵetita escepto nur en unu kazo.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam vi uzas ĝin kiel valoron sen kontrolo.<\/span> <span class=\"sg\" data-s=\"3\">Sed vi povas trakti ĝin, ekzemple, per testo de <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĝi restas kvieta.<\/span> <span class=\"sg\" data-s=\"5\">Do subrutino povas raporti problemon.<\/span> <span class=\"sg\" data-s=\"6\">La tuta programo ne devas halti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vi jam konas tion<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu speco de misfunkcio estas prokrastita ĝis poste.<\/span> <span class=\"sg\" data-s=\"1\">Ne nur <code>fail<\/code> funkcias tiel.<\/span> <span class=\"sg\" data-s=\"2\">Pli frue en ĉi tiu parto, vi vidis la saman ideon du fojojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Divido per nulo<\/strong> kviete faras valoron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĵetas escepton nur, kiam vi vere uzas la valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # ankoraŭ neniu eraro\nsay $x;           # ĵetas nur ĉi tie, kiam la valoro estas uzata<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Malsukcesanta ekstera programo<\/strong> redonas <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĵetas escepton nur en unu kazo.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam vi forĵetas la <code>Proc<\/code> sen trakti ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Tenu la <code>Proc<\/code> kaj rigardu ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĝi restas kvieta valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # la malsukcesanta Proc estas forĵetita, do ĉi tio ĵetas<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">En ĉiu kazo, problemo ne haltigas la programon tuj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi fariĝas valoro.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas kontroli ĉi tiun valoron.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi fariĝas ĵetita escepto nur en du kazoj.<\/span> <span class=\"sg\" data-s=\"4\">Vi uzas ĝin sen kontrolo, aŭ vi ignoras ĝin.<\/span> <span class=\"sg\" data-s=\"5\">La temo <a href=\"https://course.raku.org/eo/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Ne ĉiu eraro estas tuja<\/a> montras ambaŭ ekzemplojn kune.<\/span><\/p>"]]},"la":{"t":"Defectus molles","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Exceptio ex <code>die<\/code> omnia statim sistit.<\/span> <span class=\"sg\" data-s=\"1\">Interdum hoc nimium est.<\/span> <span class=\"sg\" data-s=\"2\">Fortasse subprogramma effectum dare non potest.<\/span> <span class=\"sg\" data-s=\"3\">Hoc problema nuntiare debet.<\/span> <span class=\"sg\" data-s=\"4\">Sed vocans decernere debet an programma sistat.<\/span> <span class=\"sg\" data-s=\"5\">Vocans est codex qui subprogramma vocavit.<\/span> <span class=\"sg\" data-s=\"6\">Ad hunc casum Raku <em>defectus molles<\/em> habet.<\/span> <span class=\"sg\" data-s=\"7\">Eos per <code>fail<\/code> facis.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>fail<\/code> vocare potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum exceptionem statim non iacit.<\/span> <span class=\"sg\" data-s=\"2\">Loco eius obiectum speciale <code>Failure<\/code> vocanti reddit.<\/span> <span class=\"sg\" data-s=\"3\"><code>Failure<\/code> est valor cum errore intus.<\/span> <span class=\"sg\" data-s=\"4\">Indefinitum est.<\/span> <span class=\"sg\" data-s=\"5\">Itaque vocans id tacite inspicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio operatur et <code>5<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vocatio deficit.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"3\">Pro hoc obiecto <code>defined<\/code> dat <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Itaque vocans effectum probare potest antequam eo utatur.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Cur <code>Failure<\/code> <em>mollis<\/em> vocatur?<\/span> <span class=\"sg\" data-s=\"1\">Vera exceptio iacta fit solum uno casu.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit cum eo ut valore sine probatione uteris.<\/span> <span class=\"sg\" data-s=\"3\">Sed id tractare potes, exempli gratia probatione <code>defined<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tum tacitum manet.<\/span> <span class=\"sg\" data-s=\"5\">Itaque subprogramma problema nuntiare potest.<\/span> <span class=\"sg\" data-s=\"6\">Non necesse est totum programma sistere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hoc iam scis<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hoc genus defectus in tempus posterius movet.<\/span> <span class=\"sg\" data-s=\"1\">Non solum <code>fail<\/code> hoc modo operatur.<\/span> <span class=\"sg\" data-s=\"2\">Prius in hac parte eandem ideam bis vidisti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Divisio per nihil<\/strong> valorem tacite facit.<\/span> <span class=\"sg\" data-s=\"1\">Exceptionem solum iacit cum valore revera uteris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # nullus adhuc error\nsay $x;           # solum hic iacit, cum valor adhibetur<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Programma externum deficiens<\/strong> <code>Proc<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Exceptionem solum uno casu iacit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit cum <code>Proc<\/code> sine tractatione abicis.<\/span> <span class=\"sg\" data-s=\"3\">Serva <code>Proc<\/code> et inspice id.<\/span> <span class=\"sg\" data-s=\"4\">Tum valor tacitus manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # Proc deficiens abicitur, itaque hoc iacit<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Utroque casu problema programma non statim sistit.<\/span> <span class=\"sg\" data-s=\"1\">Valor fit.<\/span> <span class=\"sg\" data-s=\"2\">Hunc valorem inspicere potes.<\/span> <span class=\"sg\" data-s=\"3\">In exceptionem iactam solum duobus casibus vertitur.<\/span> <span class=\"sg\" data-s=\"4\">Eo sine probatione uteris, aut eum neglegis.<\/span> <span class=\"sg\" data-s=\"5\">Argumentum <a href=\"https://course.raku.org/la/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Non omnis error statim apparet<\/a> ambo exempla simul ostendit.<\/span><\/p>"]]}}}</script>
