<script type="application/json" id="page-data">{"u":"oop/methods/private-attributes","n":791,"k":"topic","pv":"oop/methods","nx":"oop/methods/parameters","tr":["oop","oop/methods"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Private attributes","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/oop/attributes/\">section about attributes<\/a>, each attribute had <code>$.<\/code> in its name.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> creates a public accessor.<\/span> <span class=\"sg\" data-s=\"2\">Everyone outside the object can use it.<\/span> <span class=\"sg\" data-s=\"3\">But you can also write <code>$!<\/code> instead.<\/span> <span class=\"sg\" data-s=\"4\">Then the attribute is <em>private<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">It has no accessor.<\/span> <span class=\"sg\" data-s=\"6\">Code outside the object cannot see it.<\/span> <span class=\"sg\" data-s=\"7\">Only the methods of the class can use it.<\/span> <span class=\"sg\" data-s=\"8\">There, you write it as <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The secret <code>$!code<\/code> is inside the object.<\/span> <span class=\"sg\" data-s=\"1\">But nobody outside can see it.<\/span> <span class=\"sg\" data-s=\"2\">There is no accessor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The only way to use the code is the method <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">The class gives you this method on purpose.<\/span> <span class=\"sg\" data-s=\"5\">Reading <code>$safe.code<\/code> or <code>$safe!code<\/code> simply fails.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private attributes are good for details inside the object.<\/span> <span class=\"sg\" data-s=\"1\">The rest of the program should not touch them directly.<\/span><\/p>"]]},"de":{"t":"Private Attribute","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Attribute<\/a> hatte jedes Attribut <code>$.<\/code> im Namen.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> erstellt einen öffentlichen Accessor.<\/span> <span class=\"sg\" data-s=\"2\">Alle außerhalb des Objekts können ihn benutzen.<\/span> <span class=\"sg\" data-s=\"3\">Aber Sie können stattdessen auch <code>$!<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"4\">Dann ist das Attribut <em>privat<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Es hat keinen Accessor.<\/span> <span class=\"sg\" data-s=\"6\">Code außerhalb des Objekts kann es nicht sehen.<\/span> <span class=\"sg\" data-s=\"7\">Nur die Methoden der Klasse können es benutzen.<\/span> <span class=\"sg\" data-s=\"8\">Dort schreiben Sie es als <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Der geheime <code>$!code<\/code> ist im Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Aber niemand außerhalb kann ihn sehen.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt keinen Accessor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sie können den Code nur über die Methode <code>unlocks<\/code> benutzen.<\/span> <span class=\"sg\" data-s=\"4\">Die Klasse gibt Ihnen diese Methode mit Absicht.<\/span> <span class=\"sg\" data-s=\"5\">Das Lesen von <code>$safe.code<\/code> oder <code>$safe!code<\/code> funktioniert einfach nicht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private Attribute sind gut für Details im Inneren des Objekts.<\/span> <span class=\"sg\" data-s=\"1\">Der Rest des Programms soll sie nicht direkt anfassen.<\/span><\/p>"]]},"nl":{"t":"Private attributen","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectie over attributen<\/a> had elk attribuut <code>$.<\/code> in zijn naam.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> maakt een publieke accessor.<\/span> <span class=\"sg\" data-s=\"2\">Iedereen buiten het object kan die gebruiken.<\/span> <span class=\"sg\" data-s=\"3\">Maar je kunt in plaats daarvan ook <code>$!<\/code> schrijven.<\/span> <span class=\"sg\" data-s=\"4\">Dan is het attribuut <em>private<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Het heeft geen accessor.<\/span> <span class=\"sg\" data-s=\"6\">Code buiten het object kan het niet zien.<\/span> <span class=\"sg\" data-s=\"7\">Alleen de methoden van de klasse kunnen het gebruiken.<\/span> <span class=\"sg\" data-s=\"8\">Daar schrijf je het als <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De geheime <code>$!code<\/code> zit in het object.<\/span> <span class=\"sg\" data-s=\"1\">Maar niemand buiten het object kan hem zien.<\/span> <span class=\"sg\" data-s=\"2\">Er is geen accessor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De enige manier om de code te gebruiken is de methode <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">De klasse geeft je deze methode met opzet.<\/span> <span class=\"sg\" data-s=\"5\">Lezen met <code>$safe.code<\/code> of <code>$safe!code<\/code> lukt gewoon niet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private attributen zijn goed voor details binnen het object.<\/span> <span class=\"sg\" data-s=\"1\">De rest van het programma moet er niet direct aan komen.<\/span><\/p>"]]},"es":{"t":"Atributos privados","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sección sobre atributos<\/a>, cada atributo tenía <code>$.<\/code> en su nombre.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> crea un accesor público.<\/span> <span class=\"sg\" data-s=\"2\">Cualquiera fuera del objeto puede usarlo.<\/span> <span class=\"sg\" data-s=\"3\">Pero también puedes escribir <code>$!<\/code> en su lugar.<\/span> <span class=\"sg\" data-s=\"4\">Entonces el atributo es <em>privado<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">No tiene accesor.<\/span> <span class=\"sg\" data-s=\"6\">El código de fuera del objeto no puede verlo.<\/span> <span class=\"sg\" data-s=\"7\">Solo los métodos de la clase pueden usarlo.<\/span> <span class=\"sg\" data-s=\"8\">Allí, lo escribes como <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El secreto <code>$!code<\/code> está dentro del objeto.<\/span> <span class=\"sg\" data-s=\"1\">Pero nadie de fuera puede verlo.<\/span> <span class=\"sg\" data-s=\"2\">No hay ningún accesor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La única forma de usar el código es el método <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La clase te da este método a propósito.<\/span> <span class=\"sg\" data-s=\"5\">Leer <code>$safe.code<\/code> o <code>$safe!code<\/code> simplemente falla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los atributos privados son buenos para detalles dentro del objeto.<\/span> <span class=\"sg\" data-s=\"1\">El resto del programa no debe tocarlos directamente.<\/span><\/p>"]]},"it":{"t":"Attributi privati","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sezione sugli attributi<\/a>, ogni attributo aveva <code>$.<\/code> nel nome.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> crea un accessore pubblico.<\/span> <span class=\"sg\" data-s=\"2\">Chiunque fuori dall'oggetto lo può usare.<\/span> <span class=\"sg\" data-s=\"3\">Ma puoi anche scrivere <code>$!<\/code> al suo posto.<\/span> <span class=\"sg\" data-s=\"4\">Allora l'attributo è <em>privato<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Non ha accessore.<\/span> <span class=\"sg\" data-s=\"6\">Il codice fuori dall'oggetto non lo vede.<\/span> <span class=\"sg\" data-s=\"7\">Solo i metodi della classe lo possono usare.<\/span> <span class=\"sg\" data-s=\"8\">Lì lo scrivi come <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il segreto <code>$!code<\/code> è dentro l'oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Ma nessuno fuori lo può vedere.<\/span> <span class=\"sg\" data-s=\"2\">Non c'è un accessore <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'unico modo per usare il codice è il metodo <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La classe ti dà questo metodo apposta.<\/span> <span class=\"sg\" data-s=\"5\">Leggere <code>$safe.code<\/code> o <code>$safe!code<\/code> semplicemente non funziona.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli attributi privati vanno bene per i dettagli dentro l'oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Il resto del programma non deve toccarli direttamente.<\/span><\/p>"]]},"lv":{"t":"Privāti atribūti","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Sadaļā par atribūtiem<\/a> katram atribūtam nosaukumā bija <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> izveido publisku piekļuves metodi.<\/span> <span class=\"sg\" data-s=\"2\">Visi ārpus objekta var to lietot.<\/span> <span class=\"sg\" data-s=\"3\">Bet tā vietā jūs varat rakstīt arī <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tad atribūts ir <em>privāts<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Tam nav piekļuves metodes.<\/span> <span class=\"sg\" data-s=\"6\">Kods ārpus objekta to neredz.<\/span> <span class=\"sg\" data-s=\"7\">Tikai klases metodes var to lietot.<\/span> <span class=\"sg\" data-s=\"8\">Tur jūs to rakstāt kā <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Slepenais <code>$!code<\/code> ir objekta iekšā.<\/span> <span class=\"sg\" data-s=\"1\">Bet neviens ārpusē to neredz.<\/span> <span class=\"sg\" data-s=\"2\">Piekļuves metodes <code>.code<\/code> nav.<\/span> <span class=\"sg\" data-s=\"3\">Vienīgais veids, kā lietot kodu, ir metode <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Klase dod jums šo metodi speciāli.<\/span> <span class=\"sg\" data-s=\"5\">Nolasīt <code>$safe.code<\/code> vai <code>$safe!code<\/code> vienkārši neizdodas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Privāti atribūti ir labi detaļām objekta iekšā.<\/span> <span class=\"sg\" data-s=\"1\">Pārējai programmai nevajadzētu tām pieskarties tieši.<\/span><\/p>"]]},"ru":{"t":"Приватные атрибуты","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/oop/attributes/\" target=\"_blank\" rel=\"noopener\">разделе об атрибутах<\/a> у каждого атрибута в имени было <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> создаёт публичный аксессор.<\/span> <span class=\"sg\" data-s=\"2\">Им может пользоваться любой код снаружи объекта.<\/span> <span class=\"sg\" data-s=\"3\">Но вместо этого можно написать <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тогда атрибут <em>приватный<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">У него нет аксессора.<\/span> <span class=\"sg\" data-s=\"6\">Код снаружи объекта его не видит.<\/span> <span class=\"sg\" data-s=\"7\">Его могут использовать только методы класса.<\/span> <span class=\"sg\" data-s=\"8\">Там вы пишете его как <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Секретный <code>$!code<\/code> лежит внутри объекта.<\/span> <span class=\"sg\" data-s=\"1\">Но снаружи его никто не видит.<\/span> <span class=\"sg\" data-s=\"2\">Аксессора <code>.code<\/code> нет.<\/span> <span class=\"sg\" data-s=\"3\">Использовать код можно только через метод <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Класс даёт вам этот метод специально.<\/span> <span class=\"sg\" data-s=\"5\">Прочитать <code>$safe.code<\/code> или <code>$safe!code<\/code> просто не получится.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приватные атрибуты хороши для деталей внутри объекта.<\/span> <span class=\"sg\" data-s=\"1\">Остальная программа не должна трогать их напрямую.<\/span><\/p>"]]},"uk":{"t":"Приватні атрибути","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/oop/attributes/\" target=\"_blank\" rel=\"noopener\">розділі про атрибути<\/a> кожен атрибут мав <code>$.<\/code> в імені.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> створює публічний аксесор.<\/span> <span class=\"sg\" data-s=\"2\">Будь-хто поза об'єктом може ним користуватися.<\/span> <span class=\"sg\" data-s=\"3\">Але замість цього можна написати <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тоді атрибут <em>приватний<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Він не має аксесора.<\/span> <span class=\"sg\" data-s=\"6\">Код поза об'єктом його не бачить.<\/span> <span class=\"sg\" data-s=\"7\">Лише методи класу можуть ним користуватися.<\/span> <span class=\"sg\" data-s=\"8\">Там ви пишете його як <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Таємний <code>$!code<\/code> лежить усередині об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Але ніхто ззовні його не бачить.<\/span> <span class=\"sg\" data-s=\"2\">Аксесора <code>.code<\/code> немає.<\/span> <span class=\"sg\" data-s=\"3\">Єдиний спосіб використати код — метод <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Клас дає вам цей метод навмисно.<\/span> <span class=\"sg\" data-s=\"5\">Прочитати <code>$safe.code<\/code> чи <code>$safe!code<\/code> просто не вийде.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приватні атрибути добрі для деталей усередині об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Решта програми не має чіпати їх напряму.<\/span><\/p>"]]},"bg":{"t":"Частни атрибути","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/oop/attributes/\" target=\"_blank\" rel=\"noopener\">раздела за атрибутите<\/a> всеки атрибут имаше <code>$.<\/code> в името си.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> създава публичен аксесор.<\/span> <span class=\"sg\" data-s=\"2\">Всеки извън обекта може да го използва.<\/span> <span class=\"sg\" data-s=\"3\">Но можете да напишете и <code>$!<\/code> вместо това.<\/span> <span class=\"sg\" data-s=\"4\">Тогава атрибутът е <em>частен<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Той няма аксесор.<\/span> <span class=\"sg\" data-s=\"6\">Кодът извън обекта не може да го види.<\/span> <span class=\"sg\" data-s=\"7\">Само методите на класа могат да го използват.<\/span> <span class=\"sg\" data-s=\"8\">Там го пишете като <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тайният <code>$!code<\/code> е вътре в обекта.<\/span> <span class=\"sg\" data-s=\"1\">Но никой отвън не може да го види.<\/span> <span class=\"sg\" data-s=\"2\">Няма аксесор <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Единственият начин да използвате кода е методът <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Класът ви дава този метод нарочно.<\/span> <span class=\"sg\" data-s=\"5\">Четенето на <code>$safe.code<\/code> или <code>$safe!code<\/code> просто не работи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Частните атрибути са добри за подробности вътре в обекта.<\/span> <span class=\"sg\" data-s=\"1\">Останалата част от програмата не бива да ги пипа направо.<\/span><\/p>"]]},"eo":{"t":"Privataj atributoj","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sekcio pri atributoj<\/a>, ĉiu atributo havis <code>$.<\/code> en sia nomo.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> kreas publikan atingilon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu ekster la objekto povas uzi ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Sed vi ankaŭ povas skribi <code>$!<\/code> anstataŭe.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la atributo estas <em>privata<\/em>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ne havas atingilon.<\/span> <span class=\"sg\" data-s=\"6\">Kodo ekster la objekto ne povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"7\">Nur la metodoj de la klaso povas uzi ĝin.<\/span> <span class=\"sg\" data-s=\"8\">Tie vi skribas ĝin kiel <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La sekreta <code>$!code<\/code> estas en la objekto.<\/span> <span class=\"sg\" data-s=\"1\">Sed neniu ekstere povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ne estas atingilo <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La sola maniero uzi la kodon estas la metodo <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La klaso donas al vi ĉi tiun metodon intence.<\/span> <span class=\"sg\" data-s=\"5\">Legi <code>$safe.code<\/code> aŭ <code>$safe!code<\/code> simple malsukcesas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Privataj atributoj estas bonaj por detaloj en la objekto.<\/span> <span class=\"sg\" data-s=\"1\">La resto de la programo ne tuŝu ilin rekte.<\/span><\/p>"]]},"la":{"t":"Attributa privata","b":[["p",9,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectione de attributis<\/a> quodque attributum <code>$.<\/code> in nomine habebat.<\/span> <span class=\"sg\" data-s=\"1\"><code>$.<\/code> accessorem publicum creat.<\/span> <span class=\"sg\" data-s=\"2\">Omnes extra obiectum eo uti possunt.<\/span> <span class=\"sg\" data-s=\"3\">Sed etiam <code>$!<\/code> loco eius scribere potes.<\/span> <span class=\"sg\" data-s=\"4\">Tum attributum <em>privatum<\/em> est.<\/span> <span class=\"sg\" data-s=\"5\">Accessorem non habet.<\/span> <span class=\"sg\" data-s=\"6\">Codex extra obiectum id videre non potest.<\/span> <span class=\"sg\" data-s=\"7\">Solum methodi classis eo uti possunt.<\/span> <span class=\"sg\" data-s=\"8\">Ibi id ut <code>$!name<\/code> scribis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Secretum <code>$!code<\/code> intra obiectum est.<\/span> <span class=\"sg\" data-s=\"1\">Sed nemo extra id videre potest.<\/span> <span class=\"sg\" data-s=\"2\">Nullus accessor <code>.code<\/code> est.<\/span> <span class=\"sg\" data-s=\"3\">Codicem solum per methodum <code>unlocks<\/code> adhibere potes.<\/span> <span class=\"sg\" data-s=\"4\">Classis tibi hanc methodum consulto dat.<\/span> <span class=\"sg\" data-s=\"5\">Lectio <code>$safe.code<\/code> vel <code>$safe!code<\/code> simpliciter deficit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Attributa privata bona sunt pro particulis intra obiectum.<\/span> <span class=\"sg\" data-s=\"1\">Cetera pars programmatis eas directe tangere non debet.<\/span><\/p>"]]}}}</script>
