<script type="application/json" id="page-data">{"u":"oop/methods/calling-methods","n":793,"k":"topic","pv":"oop/methods/parameters","nx":"oop/methods/calling-methods/quiz","tr":["oop","oop/methods"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Methods calling methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A method can call another method on the same object.<\/span> <span class=\"sg\" data-s=\"1\">For this, it uses <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Look inside <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">There, <code>self.area<\/code> runs the method <code>area<\/code> on the same circle.<\/span> <span class=\"sg\" data-s=\"2\">The result goes into the description.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">To call a method, you write <code>self.area<\/code>, with a dot.<\/span> <span class=\"sg\" data-s=\"1\">Code outside the object does the same with an instance.<\/span> <span class=\"sg\" data-s=\"2\">For example, it calls <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So you can build bigger behaviour from small methods.<\/span> <span class=\"sg\" data-s=\"4\">Each small method does one job.<\/span><\/p>"]]},"de":{"t":"Methoden, die Methoden aufrufen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Methode kann eine andere Methode auf demselben Objekt aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Dafür benutzt sie <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie in <code>describe<\/code> hinein.<\/span> <span class=\"sg\" data-s=\"1\">Dort führt <code>self.area<\/code> die Methode <code>area<\/code> auf demselben Kreis aus.<\/span> <span class=\"sg\" data-s=\"2\">Das Ergebnis kommt in die Beschreibung.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Für den Aufruf einer Methode schreiben Sie <code>self.area<\/code>, mit einem Punkt.<\/span> <span class=\"sg\" data-s=\"1\">Code außerhalb des Objekts macht das Gleiche mit einer Instanz.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel ruft er <code>$c.describe<\/code> auf.<\/span> <span class=\"sg\" data-s=\"3\">So können Sie größeres Verhalten aus kleinen Methoden bauen.<\/span> <span class=\"sg\" data-s=\"4\">Jede kleine Methode erledigt eine Aufgabe.<\/span><\/p>"]]},"nl":{"t":"Methoden die methoden aanroepen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een methode kan een andere methode op hetzelfde object aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor gebruikt ze <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kijk in <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daar voert <code>self.area<\/code> de methode <code>area<\/code> uit op dezelfde cirkel.<\/span> <span class=\"sg\" data-s=\"2\">Het resultaat gaat in de beschrijving.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Voor de aanroep van een methode schrijf je <code>self.area<\/code>, met een punt.<\/span> <span class=\"sg\" data-s=\"1\">Code buiten het object doet hetzelfde met een instantie.<\/span> <span class=\"sg\" data-s=\"2\">Die roept bijvoorbeeld <code>$c.describe<\/code> aan.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je groter gedrag bouwen uit kleine methoden.<\/span> <span class=\"sg\" data-s=\"4\">Elke kleine methode doet één taak.<\/span><\/p>"]]},"es":{"t":"Métodos que llaman a métodos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un método puede llamar a otro método sobre el mismo objeto.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, usa <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mira dentro de <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allí, <code>self.area<\/code> ejecuta el método <code>area<\/code> sobre el mismo círculo.<\/span> <span class=\"sg\" data-s=\"2\">El resultado entra en la descripción.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Para llamar a un método, escribes <code>self.area<\/code>, con un punto.<\/span> <span class=\"sg\" data-s=\"1\">El código de fuera del objeto hace lo mismo con una instancia.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, llama a <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes construir un comportamiento más grande con métodos pequeños.<\/span> <span class=\"sg\" data-s=\"4\">Cada método pequeño hace una sola tarea.<\/span><\/p>"]]},"it":{"t":"Metodi che chiamano metodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metodo può chiamare un altro metodo sullo stesso oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, usa <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Guarda dentro <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lì <code>self.area<\/code> esegue il metodo <code>area<\/code> sullo stesso cerchio.<\/span> <span class=\"sg\" data-s=\"2\">Il risultato va nella descrizione.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per chiamare un metodo, scrivi <code>self.area<\/code>, con un punto.<\/span> <span class=\"sg\" data-s=\"1\">Il codice fuori dall'oggetto fa lo stesso con un'istanza.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, chiama <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi costruire un comportamento più grande con metodi piccoli.<\/span> <span class=\"sg\" data-s=\"4\">Ogni metodo piccolo fa un solo lavoro.<\/span><\/p>"]]},"lv":{"t":"Metodes, kas izsauc metodes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode var izsaukt citu metodi uz tā paša objekta.<\/span> <span class=\"sg\" data-s=\"1\">Tā to dara ar <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Apskatiet <code>describe<\/code> iekšpusi.<\/span> <span class=\"sg\" data-s=\"1\">Tur <code>self.area<\/code> izpilda metodi <code>area<\/code> uz tā paša apļa.<\/span> <span class=\"sg\" data-s=\"2\">Rezultāts nonāk aprakstā.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lai izsauktu metodi, jūs rakstāt <code>self.area<\/code>, ar punktu.<\/span> <span class=\"sg\" data-s=\"1\">Kods ārpus objekta dara to pašu ar instanci.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, tas izsauc <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā jūs varat būvēt lielāku uzvedību no mazām metodēm.<\/span> <span class=\"sg\" data-s=\"4\">Katra mazā metode dara vienu darbu.<\/span><\/p>"]]},"ru":{"t":"Методы, вызывающие методы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод может вызвать другой метод того же объекта.<\/span> <span class=\"sg\" data-s=\"1\">Для этого он использует <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Посмотрите внутрь <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>self.area<\/code> запускает метод <code>area<\/code> у той же окружности.<\/span> <span class=\"sg\" data-s=\"2\">Результат попадает в описание.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать метод, вы пишете <code>self.area<\/code>, с точкой.<\/span> <span class=\"sg\" data-s=\"1\">Код снаружи объекта делает то же самое с экземпляром.<\/span> <span class=\"sg\" data-s=\"2\">Например, он вызывает <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Так можно строить сложное поведение из маленьких методов.<\/span> <span class=\"sg\" data-s=\"4\">Каждый маленький метод делает одну работу.<\/span><\/p>"]]},"uk":{"t":"Методи, що викликають методи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод може викликати інший метод того самого об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Для цього він використовує <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Подивіться всередину <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>self.area<\/code> виконує метод <code>area<\/code> для того самого кола.<\/span> <span class=\"sg\" data-s=\"2\">Результат потрапляє в опис.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Щоб викликати метод, ви пишете <code>self.area<\/code>, з крапкою.<\/span> <span class=\"sg\" data-s=\"1\">Код поза об'єктом робить те саме з екземпляром.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, він викликає <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Так ви можете будувати більшу поведінку з малих методів.<\/span> <span class=\"sg\" data-s=\"4\">Кожен малий метод робить одну справу.<\/span><\/p>"]]},"bg":{"t":"Методи, извикващи методи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът може да извика друг метод върху същия обект.<\/span> <span class=\"sg\" data-s=\"1\">За това той използва <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Погледнете вътре в <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>self.area<\/code> изпълнява метода <code>area<\/code> върху същата окръжност.<\/span> <span class=\"sg\" data-s=\"2\">Резултатът влиза в описанието.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За да извикате метода, пишете <code>self.area<\/code>, с точка.<\/span> <span class=\"sg\" data-s=\"1\">Кодът извън обекта прави същото с екземпляр.<\/span> <span class=\"sg\" data-s=\"2\">Например той извиква <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да изградите по-голямо поведение от малки методи.<\/span> <span class=\"sg\" data-s=\"4\">Всеки малък метод върши една работа.<\/span><\/p>"]]},"eo":{"t":"Metodoj kiuj vokas metodojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metodo povas voki alian metodon sur la sama objekto.<\/span> <span class=\"sg\" data-s=\"1\">Por tio ĝi uzas <code>self<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rigardu en <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie <code>self.area<\/code> rulas la metodon <code>area<\/code> sur la sama cirklo.<\/span> <span class=\"sg\" data-s=\"2\">La rezulto iras en la priskribon.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Por voki metodon, vi skribas <code>self.area<\/code>, kun punkto.<\/span> <span class=\"sg\" data-s=\"1\">Kodo ekster la objekto faras la samon kun ekzemplero.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, ĝi vokas <code>$c.describe<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas konstrui pli grandan konduton el malgrandaj metodoj.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu malgranda metodo faras unu laboron.<\/span><\/p>"]]},"la":{"t":"Methodi methodos vocantes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus aliam methodum in eodem obiecto vocare potest.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <code>self<\/code> adhibet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        3.14 * $.radius * $.radius;\n    }\n\n    method describe {\n        'The area is ' ~ self.area;\n    }\n}\n\nmy $c = Circle.new(radius =&gt; 2);\nsay $c.describe; # The area is 12.56<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Specta intra <code>describe<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ibi <code>self.area<\/code> methodum <code>area<\/code> in eodem circulo exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Effectus in descriptionem venit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ut methodum voces, <code>self.area<\/code> scribis, cum puncto.<\/span> <span class=\"sg\" data-s=\"1\">Codex extra obiectum idem cum exemplari facit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, <code>$c.describe<\/code> vocat.<\/span> <span class=\"sg\" data-s=\"3\">Sic agendi rationem maiorem ex parvis methodis aedificare potes.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque parva methodus unum munus agit.<\/span><\/p>"]]}}}</script>
