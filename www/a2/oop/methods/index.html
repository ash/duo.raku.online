<script type="application/json" id="page-data">{"u":"oop/methods","n":790,"k":"section","pv":"oop/attributes/exercises/changeable-label/solution","nx":"oop/methods/private-attributes","tr":["oop"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Methods","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Attributes give an object its data.<\/span> <span class=\"sg\" data-s=\"1\">With <em>methods<\/em>, an object can also do things.<\/span> <span class=\"sg\" data-s=\"2\">A method is a subroutine in a class.<\/span> <span class=\"sg\" data-s=\"3\">You call a method on an object.<\/span> <span class=\"sg\" data-s=\"4\">To create a method, write the keyword <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To call a method on an object, use a dot.<\/span> <span class=\"sg\" data-s=\"1\">It is the same as with an accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Inside a method, <code>self<\/code> is the object.<\/span> <span class=\"sg\" data-s=\"1\">It is the object that you called the method on.<\/span> <span class=\"sg\" data-s=\"2\">You get the attributes through their accessors.<\/span> <span class=\"sg\" data-s=\"3\">You write them as <code>$.name<\/code>, <code>$.age<\/code>, and so on.<\/span> <span class=\"sg\" data-s=\"4\">You can also use them inside a string with double quotes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The next topics cover three things.<\/span> <span class=\"sg\" data-s=\"1\">The first is private attributes.<\/span> <span class=\"sg\" data-s=\"2\">You need methods for them, and now you have methods.<\/span> <span class=\"sg\" data-s=\"3\">The second is methods with parameters.<\/span> <span class=\"sg\" data-s=\"4\">The third is methods that call other methods.<\/span><\/p>"]]},"de":{"t":"Methoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Attribute geben einem Objekt seine Daten.<\/span> <span class=\"sg\" data-s=\"1\">Mit <em>Methoden<\/em> kann ein Objekt auch etwas tun.<\/span> <span class=\"sg\" data-s=\"2\">Eine Methode ist eine Subroutine in einer Klasse.<\/span> <span class=\"sg\" data-s=\"3\">Sie rufen eine Methode auf einem Objekt auf.<\/span> <span class=\"sg\" data-s=\"4\">Für eine neue Methode schreiben Sie das Schlüsselwort <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Methode auf einem Objekt rufen Sie mit einem Punkt auf.<\/span> <span class=\"sg\" data-s=\"1\">Das ist genauso wie bei einem Accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">In einer Methode ist <code>self<\/code> das Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Es ist das Objekt, auf dem Sie die Methode aufgerufen haben.<\/span> <span class=\"sg\" data-s=\"2\">Die Attribute bekommen Sie über ihre Accessoren.<\/span> <span class=\"sg\" data-s=\"3\">Sie schreiben sie als <code>$.name<\/code>, <code>$.age<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"4\">Sie können sie auch in einer Zeichenkette mit doppelten Anführungszeichen benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen behandeln drei Dinge.<\/span> <span class=\"sg\" data-s=\"1\">Das erste sind private Attribute.<\/span> <span class=\"sg\" data-s=\"2\">Für sie brauchen Sie Methoden, und jetzt haben Sie Methoden.<\/span> <span class=\"sg\" data-s=\"3\">Das zweite sind Methoden mit Parametern.<\/span> <span class=\"sg\" data-s=\"4\">Das dritte sind Methoden, die andere Methoden aufrufen.<\/span><\/p>"]]},"nl":{"t":"Methoden","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Attributen geven een object zijn gegevens.<\/span> <span class=\"sg\" data-s=\"1\">Met <em>methoden<\/em> kan een object ook dingen doen.<\/span> <span class=\"sg\" data-s=\"2\">Een methode is een subroutine in een klasse.<\/span> <span class=\"sg\" data-s=\"3\">Je roept een methode aan op een object.<\/span> <span class=\"sg\" data-s=\"4\">Voor een nieuwe methode schrijf je het sleutelwoord <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gebruik een punt om een methode op een object aan te roepen.<\/span> <span class=\"sg\" data-s=\"1\">Het is hetzelfde als bij een accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Binnen een methode is <code>self<\/code> het object.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het object waarop je de methode aanroept.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt de attributen via hun accessors.<\/span> <span class=\"sg\" data-s=\"3\">Je schrijft ze als <code>$.name<\/code>, <code>$.age<\/code> enzovoort.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt ze ook in een string met dubbele aanhalingstekens gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen gaan over drie dingen.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste zijn private attributen.<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor heb je methoden nodig, en nu heb je methoden.<\/span> <span class=\"sg\" data-s=\"3\">Het tweede zijn methoden met parameters.<\/span> <span class=\"sg\" data-s=\"4\">Het derde zijn methoden die andere methoden aanroepen.<\/span><\/p>"]]},"es":{"t":"Métodos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Los atributos dan a un objeto sus datos.<\/span> <span class=\"sg\" data-s=\"1\">Con los <em>métodos<\/em>, un objeto también puede hacer cosas.<\/span> <span class=\"sg\" data-s=\"2\">Un método es una subrutina dentro de una clase.<\/span> <span class=\"sg\" data-s=\"3\">Llamas a un método sobre un objeto.<\/span> <span class=\"sg\" data-s=\"4\">Para crear un método, escribe la palabra clave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para llamar a un método sobre un objeto, usa un punto.<\/span> <span class=\"sg\" data-s=\"1\">Es igual que con un accesor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dentro de un método, <code>self<\/code> es el objeto.<\/span> <span class=\"sg\" data-s=\"1\">Es el objeto sobre el que llamaste al método.<\/span> <span class=\"sg\" data-s=\"2\">Llegas a los atributos con sus accesores.<\/span> <span class=\"sg\" data-s=\"3\">Los escribes como <code>$.name<\/code>, <code>$.age<\/code> y otros.<\/span> <span class=\"sg\" data-s=\"4\">También puedes usarlos dentro de una cadena entre comillas dobles:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes tratan tres cosas.<\/span> <span class=\"sg\" data-s=\"1\">La primera son los atributos privados.<\/span> <span class=\"sg\" data-s=\"2\">Para ellos necesitas métodos, y ahora ya tienes métodos.<\/span> <span class=\"sg\" data-s=\"3\">La segunda son los métodos con parámetros.<\/span> <span class=\"sg\" data-s=\"4\">La tercera son los métodos que llaman a otros métodos.<\/span><\/p>"]]},"it":{"t":"Metodi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Gli attributi danno a un oggetto i suoi dati.<\/span> <span class=\"sg\" data-s=\"1\">Con i <em>metodi<\/em>, un oggetto può anche fare delle cose.<\/span> <span class=\"sg\" data-s=\"2\">Un metodo è una subroutine dentro una classe.<\/span> <span class=\"sg\" data-s=\"3\">Chiami un metodo su un oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Per creare un metodo, scrivi la parola chiave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per chiamare un metodo su un oggetto, usa un punto.<\/span> <span class=\"sg\" data-s=\"1\">È come con un accessore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dentro un metodo, <code>self<\/code> è l'oggetto.<\/span> <span class=\"sg\" data-s=\"1\">È l'oggetto su cui hai chiamato il metodo.<\/span> <span class=\"sg\" data-s=\"2\">Arrivi agli attributi con i loro accessori.<\/span> <span class=\"sg\" data-s=\"3\">Li scrivi come <code>$.name<\/code>, <code>$.age<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"4\">Puoi usarli anche dentro una stringa tra virgolette doppie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti parlano di tre cose.<\/span> <span class=\"sg\" data-s=\"1\">La prima sono gli attributi privati.<\/span> <span class=\"sg\" data-s=\"2\">Per loro ti servono i metodi, e ora hai i metodi.<\/span> <span class=\"sg\" data-s=\"3\">La seconda sono i metodi con parametri.<\/span> <span class=\"sg\" data-s=\"4\">La terza sono i metodi che chiamano altri metodi.<\/span><\/p>"]]},"lv":{"t":"Metodes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Atribūti dod objektam tā datus.<\/span> <span class=\"sg\" data-s=\"1\">Ar <em>metodēm<\/em> objekts var arī kaut ko darīt.<\/span> <span class=\"sg\" data-s=\"2\">Metode ir apakšprogramma klasē.<\/span> <span class=\"sg\" data-s=\"3\">Metodi jūs izsaucat uz objekta.<\/span> <span class=\"sg\" data-s=\"4\">Lai izveidotu metodi, rakstiet atslēgvārdu <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai izsauktu metodi uz objekta, lietojiet punktu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpat kā ar piekļuves metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Metodes iekšā <code>self<\/code> ir objekts.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir objekts, uz kura jūs izsaucāt metodi.<\/span> <span class=\"sg\" data-s=\"2\">Atribūtus jūs iegūstat caur to piekļuves metodēm.<\/span> <span class=\"sg\" data-s=\"3\">Jūs tās rakstāt kā <code>$.name<\/code>, <code>$.age<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat tās lietot arī virknē ar dubultpēdiņām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati aplūko trīs lietas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā ir privāti atribūti.<\/span> <span class=\"sg\" data-s=\"2\">Tiem jums vajag metodes, un tagad jums metodes ir.<\/span> <span class=\"sg\" data-s=\"3\">Otrā ir metodes ar parametriem.<\/span> <span class=\"sg\" data-s=\"4\">Trešā ir metodes, kas izsauc citas metodes.<\/span><\/p>"]]},"ru":{"t":"Методы","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Атрибуты дают объекту данные.<\/span> <span class=\"sg\" data-s=\"1\">С <em>методами<\/em> объект может ещё и что-то делать.<\/span> <span class=\"sg\" data-s=\"2\">Метод — это подпрограмма внутри класса.<\/span> <span class=\"sg\" data-s=\"3\">Вы вызываете метод у объекта.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы создать метод, напишите ключевое слово <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать метод у объекта, используйте точку.<\/span> <span class=\"sg\" data-s=\"1\">С аксессором всё точно так же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Внутри метода <code>self<\/code> — это объект.<\/span> <span class=\"sg\" data-s=\"1\">Это тот объект, у которого вы вызвали метод.<\/span> <span class=\"sg\" data-s=\"2\">Атрибуты вы получаете через их аксессоры.<\/span> <span class=\"sg\" data-s=\"3\">Вы пишете их так: <code>$.name<\/code>, <code>$.age<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"4\">Их можно использовать и внутри строки в двойных кавычках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Следующие темы рассказывают о трёх вещах.<\/span> <span class=\"sg\" data-s=\"1\">Первая — приватные атрибуты.<\/span> <span class=\"sg\" data-s=\"2\">Для них нужны методы, и теперь методы у вас есть.<\/span> <span class=\"sg\" data-s=\"3\">Вторая — методы с параметрами.<\/span> <span class=\"sg\" data-s=\"4\">Третья — методы, которые вызывают другие методы.<\/span><\/p>"]]},"uk":{"t":"Методи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Атрибути дають об'єкту дані.<\/span> <span class=\"sg\" data-s=\"1\">З <em>методами<\/em> об'єкт може ще й щось робити.<\/span> <span class=\"sg\" data-s=\"2\">Метод — це підпрограма в класі.<\/span> <span class=\"sg\" data-s=\"3\">Ви викликаєте метод для об'єкта.<\/span> <span class=\"sg\" data-s=\"4\">Щоб створити метод, напишіть ключове слово <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб викликати метод для об'єкта, поставте крапку.<\/span> <span class=\"sg\" data-s=\"1\">Це так само, як з аксесором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Усередині методу <code>self<\/code> — це об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Це той об'єкт, для якого ви викликали метод.<\/span> <span class=\"sg\" data-s=\"2\">До атрибутів ви дістаєтеся через їхні аксесори.<\/span> <span class=\"sg\" data-s=\"3\">Ви пишете їх як <code>$.name<\/code>, <code>$.age<\/code> тощо.<\/span> <span class=\"sg\" data-s=\"4\">Їх також можна вживати всередині рядка з подвійними лапками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Наступні теми розповідають про три речі.<\/span> <span class=\"sg\" data-s=\"1\">Перша — приватні атрибути.<\/span> <span class=\"sg\" data-s=\"2\">Для них потрібні методи, і тепер у вас є методи.<\/span> <span class=\"sg\" data-s=\"3\">Друга — методи з параметрами.<\/span> <span class=\"sg\" data-s=\"4\">Третя — методи, які викликають інші методи.<\/span><\/p>"]]},"bg":{"t":"Методи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Атрибутите дават на обекта неговите данни.<\/span> <span class=\"sg\" data-s=\"1\">С <em>методите<\/em> обектът може и да прави неща.<\/span> <span class=\"sg\" data-s=\"2\">Методът е подпрограма в клас.<\/span> <span class=\"sg\" data-s=\"3\">Извиквате метода върху обект.<\/span> <span class=\"sg\" data-s=\"4\">За да създадете метод, напишете ключовата дума <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да извикате метод върху обект, използвайте точка.<\/span> <span class=\"sg\" data-s=\"1\">Това е същото като при аксесор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вътре в метода <code>self<\/code> е обектът.<\/span> <span class=\"sg\" data-s=\"1\">Това е обектът, върху който сте извикали метода.<\/span> <span class=\"sg\" data-s=\"2\">Стигате до атрибутите през техните аксесори.<\/span> <span class=\"sg\" data-s=\"3\">Пишете ги като <code>$.name<\/code>, <code>$.age<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"4\">Можете да ги използвате и в низ с двойни кавички:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Следващите теми разглеждат три неща.<\/span> <span class=\"sg\" data-s=\"1\">Първото са частните атрибути.<\/span> <span class=\"sg\" data-s=\"2\">За тях ви трябват методи, а сега вече имате методи.<\/span> <span class=\"sg\" data-s=\"3\">Второто са методите с параметри.<\/span> <span class=\"sg\" data-s=\"4\">Третото са методите, които извикват други методи.<\/span><\/p>"]]},"eo":{"t":"Metodoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Atributoj donas al objekto ĝiajn datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Per <em>metodoj<\/em> objekto ankaŭ povas fari aferojn.<\/span> <span class=\"sg\" data-s=\"2\">Metodo estas subrutino en klaso.<\/span> <span class=\"sg\" data-s=\"3\">Vi vokas metodon sur objekto.<\/span> <span class=\"sg\" data-s=\"4\">Por krei metodon, skribu la ŝlosilvorton <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por voki metodon sur objekto, uzu punkton.<\/span> <span class=\"sg\" data-s=\"1\">Estas same kiel kun atingilo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ene de metodo, <code>self<\/code> estas la objekto.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la objekto, sur kiu vi vokis la metodon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ricevas la atributojn tra iliaj atingiloj.<\/span> <span class=\"sg\" data-s=\"3\">Vi skribas ilin kiel <code>$.name<\/code>, <code>$.age<\/code> kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas uzi ilin en ĉeno kun duoblaj citiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj traktas tri aferojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas privataj atributoj.<\/span> <span class=\"sg\" data-s=\"2\">Vi bezonas metodojn por ili, kaj nun vi havas metodojn.<\/span> <span class=\"sg\" data-s=\"3\">La dua estas metodoj kun parametroj.<\/span> <span class=\"sg\" data-s=\"4\">La tria estas metodoj, kiuj vokas aliajn metodojn.<\/span><\/p>"]]},"la":{"t":"Methodi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Attributa obiecto data sua dant.<\/span> <span class=\"sg\" data-s=\"1\">Per <em>methodos<\/em> obiectum etiam res agere potest.<\/span> <span class=\"sg\" data-s=\"2\">Methodus est subprogramma in classe.<\/span> <span class=\"sg\" data-s=\"3\">Methodum in obiecto vocas.<\/span> <span class=\"sg\" data-s=\"4\">Ut methodum facias, scribe verbum <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut methodum in obiecto voces, punctum adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Idem fit cum accessore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Intra methodum, <code>self<\/code> est obiectum.<\/span> <span class=\"sg\" data-s=\"1\">Est obiectum in quo methodum vocavisti.<\/span> <span class=\"sg\" data-s=\"2\">Attributa per accessores eorum accipis.<\/span> <span class=\"sg\" data-s=\"3\">Eos ut <code>$.name<\/code>, <code>$.age<\/code> et cetera scribis.<\/span> <span class=\"sg\" data-s=\"4\">Eos etiam intra chordam cum virgulis duplicibus adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia tres res tractant.<\/span> <span class=\"sg\" data-s=\"1\">Prima res sunt attributa privata.<\/span> <span class=\"sg\" data-s=\"2\">Ad ea methodos habere debes, et nunc methodos habes.<\/span> <span class=\"sg\" data-s=\"3\">Secunda res sunt methodi cum parametris.<\/span> <span class=\"sg\" data-s=\"4\">Tertia res sunt methodi quae alias methodos vocant.<\/span><\/p>"]]}}}</script>
