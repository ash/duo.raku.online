<script type="application/json" id="page-data">{"u":"oop/methods/parameters","n":792,"k":"topic","pv":"oop/methods/private-attributes","nx":"oop/methods/calling-methods","tr":["oop","oop/methods"],"lv":"a2","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Methods with parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">A method can have parameters, like a subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Write them in round brackets after the name of the method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The method <code>deposit<\/code> has one parameter, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It adds this amount to the balance of the object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Each call works on one object.<\/span> <span class=\"sg\" data-s=\"1\">It is the object that you call the method on.<\/span> <span class=\"sg\" data-s=\"2\">So one method can change different objects.<\/span> <span class=\"sg\" data-s=\"3\">One object does not change the others.<\/span> <span class=\"sg\" data-s=\"4\">Methods can have positional and named parameters.<\/span> <span class=\"sg\" data-s=\"5\">They can have default values too.<\/span> <span class=\"sg\" data-s=\"6\">Everything else from subroutine signatures also works here.<\/span><\/p>"]]},"de":{"t":"Methoden mit Parametern","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Methode kann Parameter haben, wie eine Subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Schreiben Sie sie in runden Klammern hinter den Namen der Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>deposit<\/code> hat einen Parameter, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie addiert diesen Betrag zum Kontostand des Objekts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf wirkt auf ein Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Es ist das Objekt, auf dem Sie die Methode aufrufen.<\/span> <span class=\"sg\" data-s=\"2\">So kann eine Methode verschiedene Objekte ändern.<\/span> <span class=\"sg\" data-s=\"3\">Ein Objekt ändert die anderen nicht.<\/span> <span class=\"sg\" data-s=\"4\">Methoden können positionale und benannte Parameter haben.<\/span> <span class=\"sg\" data-s=\"5\">Sie können auch Standardwerte haben.<\/span> <span class=\"sg\" data-s=\"6\">Alles andere aus Subroutinen-Signaturen funktioniert hier auch.<\/span><\/p>"]]},"nl":{"t":"Methoden met parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een methode kan parameters hebben, net als een subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Schrijf ze tussen ronde haakjes na de naam van de methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De methode <code>deposit<\/code> heeft één parameter, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze telt dit bedrag op bij het saldo van het object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep werkt op één object.<\/span> <span class=\"sg\" data-s=\"1\">Dat is het object waarop je de methode aanroept.<\/span> <span class=\"sg\" data-s=\"2\">Dus kan één methode verschillende objecten veranderen.<\/span> <span class=\"sg\" data-s=\"3\">Het ene object verandert de andere niet.<\/span> <span class=\"sg\" data-s=\"4\">Methoden kunnen positionele en benoemde parameters hebben.<\/span> <span class=\"sg\" data-s=\"5\">Ze kunnen ook standaardwaarden hebben.<\/span> <span class=\"sg\" data-s=\"6\">Al het andere uit de signaturen van subroutines werkt hier ook.<\/span><\/p>"]]},"es":{"t":"Métodos con parámetros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un método puede tener parámetros, como una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Escríbelos entre paréntesis después del nombre del método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>deposit<\/code> tiene un parámetro, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Suma esta cantidad al saldo del objeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Cada llamada trabaja con un objeto.<\/span> <span class=\"sg\" data-s=\"1\">Es el objeto sobre el que llamas al método.<\/span> <span class=\"sg\" data-s=\"2\">Así un método puede cambiar objetos distintos.<\/span> <span class=\"sg\" data-s=\"3\">Un objeto no cambia a los otros.<\/span> <span class=\"sg\" data-s=\"4\">Los métodos pueden tener parámetros posicionales y con nombre.<\/span> <span class=\"sg\" data-s=\"5\">También pueden tener valores por defecto.<\/span> <span class=\"sg\" data-s=\"6\">Todo lo demás de las firmas de las subrutinas también funciona aquí.<\/span><\/p>"]]},"it":{"t":"Metodi con parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un metodo può avere parametri, come una subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Scrivili tra parentesi tonde dopo il nome del metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>deposit<\/code> ha un parametro, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge questa somma al saldo dell'oggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata lavora su un oggetto.<\/span> <span class=\"sg\" data-s=\"1\">È l'oggetto su cui chiami il metodo.<\/span> <span class=\"sg\" data-s=\"2\">Così un metodo può cambiare oggetti diversi.<\/span> <span class=\"sg\" data-s=\"3\">Un oggetto non cambia gli altri.<\/span> <span class=\"sg\" data-s=\"4\">I metodi possono avere parametri posizionali e nominati.<\/span> <span class=\"sg\" data-s=\"5\">Possono avere anche valori predefiniti.<\/span> <span class=\"sg\" data-s=\"6\">Anche tutto il resto delle firme delle subroutine funziona qui.<\/span><\/p>"]]},"lv":{"t":"Metodes ar parametriem","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metodei var būt parametri, tāpat kā apakšprogrammai.<\/span> <span class=\"sg\" data-s=\"1\">Rakstiet tos apaļās iekavās aiz metodes nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metodei <code>deposit<\/code> ir viens parametrs, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā pieskaita šo summu objekta bilancei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums strādā ar vienu objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir objekts, uz kura jūs izsaucat metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc viena metode var mainīt dažādus objektus.<\/span> <span class=\"sg\" data-s=\"3\">Viens objekts nemaina citus.<\/span> <span class=\"sg\" data-s=\"4\">Metodēm var būt pozicionāli un nosaukti parametri.<\/span> <span class=\"sg\" data-s=\"5\">Tām var būt arī noklusētās vērtības.<\/span> <span class=\"sg\" data-s=\"6\">Šeit darbojas arī viss pārējais no apakšprogrammu parakstiem.<\/span><\/p>"]]},"ru":{"t":"Методы с параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У метода могут быть параметры, как у подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Напишите их в круглых скобках после имени метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У метода <code>deposit<\/code> один параметр, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод прибавляет эту сумму к балансу объекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов работает с одним объектом.<\/span> <span class=\"sg\" data-s=\"1\">Это тот объект, у которого вы вызываете метод.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому один метод может менять разные объекты.<\/span> <span class=\"sg\" data-s=\"3\">Один объект не меняет другие.<\/span> <span class=\"sg\" data-s=\"4\">У методов могут быть позиционные и именованные параметры.<\/span> <span class=\"sg\" data-s=\"5\">Ещё у них могут быть значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"6\">Всё остальное из сигнатур подпрограмм тоже здесь работает.<\/span><\/p>"]]},"uk":{"t":"Методи з параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод може мати параметри, як підпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть їх у круглих дужках після імені методу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>deposit<\/code> має один параметр, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він додає цю суму до балансу об'єкта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик працює з одним об'єктом.<\/span> <span class=\"sg\" data-s=\"1\">Це той об'єкт, для якого ви викликаєте метод.<\/span> <span class=\"sg\" data-s=\"2\">Тож один метод може змінювати різні об'єкти.<\/span> <span class=\"sg\" data-s=\"3\">Один об'єкт не змінює інших.<\/span> <span class=\"sg\" data-s=\"4\">Методи можуть мати позиційні та іменовані параметри.<\/span> <span class=\"sg\" data-s=\"5\">Вони також можуть мати типові значення.<\/span> <span class=\"sg\" data-s=\"6\">Усе інше із сигнатур підпрограм тут теж працює.<\/span><\/p>"]]},"bg":{"t":"Методи с параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът може да има параметри, като подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Напишете ги в кръгли скоби след името на метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>deposit<\/code> има един параметър, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той добавя тази сума към баланса на обекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване работи върху един обект.<\/span> <span class=\"sg\" data-s=\"1\">Това е обектът, върху който извиквате метода.<\/span> <span class=\"sg\" data-s=\"2\">Затова един метод може да променя различни обекти.<\/span> <span class=\"sg\" data-s=\"3\">Един обект не променя другите.<\/span> <span class=\"sg\" data-s=\"4\">Методите могат да имат позиционни и именувани параметри.<\/span> <span class=\"sg\" data-s=\"5\">Те могат да имат и стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"6\">Всичко друго от сигнатурите на подпрограмите също работи тук.<\/span><\/p>"]]},"eo":{"t":"Metodoj kun parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Metodo povas havi parametrojn, kiel subrutino.<\/span> <span class=\"sg\" data-s=\"1\">Skribu ilin en rondaj krampoj post la nomo de la metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>deposit<\/code> havas unu parametron, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas ĉi tiun sumon al la saldo de la objekto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko laboras sur unu objekto.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la objekto, sur kiu vi vokas la metodon.<\/span> <span class=\"sg\" data-s=\"2\">Do unu metodo povas ŝanĝi malsamajn objektojn.<\/span> <span class=\"sg\" data-s=\"3\">Unu objekto ne ŝanĝas la aliajn.<\/span> <span class=\"sg\" data-s=\"4\">Metodoj povas havi poziciajn kaj nomitajn parametrojn.<\/span> <span class=\"sg\" data-s=\"5\">Ili povas havi ankaŭ defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"6\">Ĉio alia el la subskriboj de subrutinoj ankaŭ funkcias ĉi tie.<\/span><\/p>"]]},"la":{"t":"Methodi cum parametris","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus parametros habere potest, sicut subprogramma.<\/span> <span class=\"sg\" data-s=\"1\">Scribe eos in parenthesibus post nomen methodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>deposit<\/code> unum parametrum habet, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hanc summam ad rationem obiecti addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio in uno obiecto operatur.<\/span> <span class=\"sg\" data-s=\"1\">Est obiectum in quo methodum vocas.<\/span> <span class=\"sg\" data-s=\"2\">Itaque una methodus diversa obiecta mutare potest.<\/span> <span class=\"sg\" data-s=\"3\">Unum obiectum alia non mutat.<\/span> <span class=\"sg\" data-s=\"4\">Methodi parametros positionales et nominatos habere possunt.<\/span> <span class=\"sg\" data-s=\"5\">Etiam valores praedefinitos habere possunt.<\/span> <span class=\"sg\" data-s=\"6\">Omnia cetera ex signaturis subprogrammatum hic quoque operantur.<\/span><\/p>"]]}}}</script>
