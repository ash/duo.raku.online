an><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изходните файлове са достъпни в GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Не се колебайте да изпратите pull request с поправка на евентуални грешки и печатни грешки или да създадете issue в GitHub, ако искате да обсъдите нещо по-широко.<\/span> <span class=\"sg\" data-s=\"2\">С автора можете да се свържете и по <a href=\"mailto:mail@andreyshitov.com\">електронна поща<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Навигация в курса<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/bg/\" target=\"_blank\" rel=\"noopener\">Начало<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/bg/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Какво е Raku<\/a> →<\/span><\/p>"]]},"eo":{"t":"Pri ĉi tiu kurso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/eo/\" target=\"_blank\" rel=\"noopener\">{{course_title}}<\/a><\/span><\/p>"],["h",1,"<h2><span class=\"sg\" data-s=\"0\">Pri ĉi tiu kurso<\/span><\/h2>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bonvenon al la kurso de la Raku-programlingvo!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu kurso kovras ĉiujn ĉefajn aspektojn de la lingvo, kiujn vi bezonas uzi en via ĉiutaga praktiko.<\/span> <span class=\"sg\" data-s=\"1\">La kurso konsistas el kvin partoj, kiuj klarigas la teorion kaj ofertas multajn praktikajn taskojn.<\/span> <span class=\"sg\" data-s=\"2\">Estas supozite, ke vi provos solvi la taskojn mem antaŭ ol rigardi la solvon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi nur komencas lerni Raku, vi estas konsilata trairi ĉiujn partojn laŭ la ordo, kiel ili estas listigitaj en la enhavtabelo.<\/span> <span class=\"sg\" data-s=\"1\">Se vi havas iom da praktiko kaj volas havi specifan trejnadon, vi estas bonvena komenci kun la dezirata sekcio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Strukturo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kurso estas dividita en kvin partojn, ĉiu el kiuj inkluzivas plurajn sekciojn, kiuj siavice inkluzivas kelkajn temojn (aŭ, simple dirite, malsamajn paĝojn kun sia unika URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kurso inkluzivas materialojn de la jenaj kvar tipoj:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Teorio, kiu kovras la aktualan temon<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Kvizoj, kiuj testas vian komprenon de la teorio de la temo kaj/aŭ la sekcio<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Ekzercoj por la materialo de la tuta sekcio<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Respondoj al la ekzercoj<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Foje, praktikaj taskoj (kaj kvizoj kaj ekzercoj) donas pliajn informojn pri la temo, do por fari la plej bonan uzon de la kurso, estas rekomendite ne preterlasi ilin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sub ĉiu paĝo, estas navigada bloko, kiun vi povas uzi por trairi la tutan kurson.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ ĉiam povas salti al la dezirata sekcio uzante la panerojn menuon ĉe la supro de la paĝo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dum la navigado gvidas vin tra la taskoj en specifa ordo, vi povas solvi ilin en pli-malpli hazarda ordo ene de la aktuala sekcio aŭ temo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enhavo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kurso inkluzivas kvin partojn:<\/span><\/p>"],["table",6,"<table><tr><span class=\"sg\" data-s=\"0\"><td>N<\/td><td>Nomo<\/td><td>Stato<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td>1<\/td><td><a href=\"https://course.raku.org/eo/essentials/\" target=\"_blank\" rel=\"noopener\">Raku bazaj scioj<\/a><\/td><td>Eldonita<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td>2<\/td><td><a href=\"https://course.raku.org/eo/advanced/\" target=\"_blank\" rel=\"noopener\">Altnivelaj Raku-temoj<\/a><\/td><td>En progreso&lt;span id=\"ProgressBar\"&gt;...&lt;/span&gt;<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td>3<\/td><td>Objekt-orientita programado en Raku<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td>4<\/td><td>Regularaj esprimoj kaj gramatikoj<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td>5<\/td><td>Funkcia, samtempa, kaj reaktiva programado<\/td><\/span><\/tr><\/table>"],["raw",0,"<script>\n    let ProgressBar = document.getElementById('ProgressBar');\n    let current_progress = 0;\n    setInterval(function() {\n        current_progress++;\n        current_progress %= 6;"],["p",1,"<p><span class=\"sg\" data-s=\"0\">let bar = '';         for (let c = 0; c &lt; current_progress; c++) {             bar += ',';         }         bar += '...';         for (let c = current_progress; c &lt; 6; c++) {             bar += ',';         }<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">bar = bar.substr(3, 3);         bar = bar.replace(/,/g, '&lt;span style=\"color: lightgray\"&gt;.&lt;/span&gt;');         ProgressBar.innerHTML = bar;     }, 200); &lt;/script&gt;<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nuntempe, la unua parto estas tute verkita kaj eldonita.<\/span> <span class=\"sg\" data-s=\"1\">La aliaj partoj estas en progreso.<\/span> <span class=\"sg\" data-s=\"2\">Notu, ke ĉar la kurso ankoraŭ estas en disvolviĝo, la URL-oj de ĝiaj diversaj partoj povus iomete ŝanĝiĝi en la estonteco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La unua parto, ‘Raku bazaj scioj’, enhavas:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">91 temojn<\/span><\/li><li><span class=\"sg\" data-s=\"1\">73 kvizojn<\/span><\/li><li><span class=\"sg\" data-s=\"2\">65 ekzercojn<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Novaj ekzercoj kaj kvizoj povus aperi en la jam eldonitaj temoj, same kiel la teoriaj partoj povus esti iomete modifitaj por atingi la plej bonan fluon de la kurso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Antaŭkondiĉoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por sekvi la kurson kaj ruli ekzercojn, vi bezonas havi funkciantan kompililon.<\/span> <span class=\"sg\" data-s=\"1\">Estas kelkaj opcioj:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">— Instali la Rakudo-kompililon aŭ la Rakudo Star-pakaĵon aŭ<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Uzi retajn servojn aŭ<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Uzi docker-kontenerojn<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La diversaj instalaj opcioj estas priskribitaj ĉe la komenco de la unua parto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pri la aŭtoro<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La kurso estas verkita de <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, kiu sekvas la disvolviĝon de Raku ekde ĉirkaŭ 2000 (kiam ĝi estis konata kiel Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Li estas la aŭtoro de kelkaj <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">libroj pri programado en Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La kursa materialo baziĝas sur ĉiutaga sperto, precipe kontribuante al <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">La Semajna Defio<\/a> kaj reviziante la solvojn de aliaj partoprenantoj, same kiel sur la sperto akirita uzante Raku kiel la ĉefan lingvon por la <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a> retejo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kontribuado, uzokondiĉoj, kaj reagoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La kreado de la kurso estas subtenata de la subvencio de <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">La Perl Fondaĵo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi la kurson por memstudo aŭ kiel aron de pretaj materialoj por instrui aliajn.<\/span> <span class=\"sg\" data-s=\"2\">La komerca uzo en klasoj estas permesita sen permeso.<\/span> <span class=\"sg\" data-s=\"3\">Eldoni la kurson kiel apartan produkton devas esti unue negocita kun la aŭtoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La fontdosieroj estas disponeblaj en GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bonvolu sendi tirpeton por korekti la eblajn erarojn aŭ tajperarojn aŭ krei temon en GitHub se vi volas diskuti pli larĝan temon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas kontakti la aŭtoron per <a href=\"mailto:mail@andreyshitov.com\">retpoŝto<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kursa navigado<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/eo/\" target=\"_blank\" rel=\"noopener\">Komenco<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/eo/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Kio estas Raku<\/a> →<\/span><\/p>"]]},"la":{"t":"De hoc curriculo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/la/\" target=\"_blank\" rel=\"noopener\">{{course_title}}<\/a><\/span><\/p>"],["h",1,"<h2><span class=\"sg\" data-s=\"0\">De hoc cursu<\/span><\/h2>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gratum ad cursum linguae programmandi Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic cursus omnes aspectus principales linguae comprehendit quos in usu cotidiano tibi necessarios sunt.<\/span> <span class=\"sg\" data-s=\"1\">Cursus quinque partes continet quae theoriam explicant et multas exercitationes practicas offerunt.<\/span> <span class=\"sg\" data-s=\"2\">Supponitur te conari solvere problemata ipse antequam solutionem inspicias.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si Raku discere modo incipis, suadetur ut per omnes partes ordine in indice contentorum enumeratas pergas.<\/span> <span class=\"sg\" data-s=\"1\">Si aliquam praxim habes et specificam exercitationem vis, licet tibi cum desiderata sectione incipere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Structura<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cursus in quinque partes divisus est, quarum unaquaeque plures sectiones includit, quae vicissim plures argumenta (vel, simpliciter dicendo, diversas paginas cum suis URL univocis) continent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cursus materias quattuor generum includit:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Theoriam quae argumentum praesens tractat<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Quaestiones quae tuam comprehensionem theoriae argumenti et/vel sectionis probant<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Exercitationes pro materia totius sectionis<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Responsa ad exercitationes<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Interdum, exercitationes practicae (et quaestiones et exercitationes) informationem additicium de re praebent, ita ut maximum ex cursu capias, suadetur ne eas praetermittas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sub singulis paginis, est navigatio quae te per totum cursum ducere potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam semper ad desideratam sectionem per menu breadcrumb in summo paginae salire potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dum navigatio te per problemata in ordine particulari ducit, licet tibi ea solvere in ordine magis minusve casuali intra sectionem vel argumentum praesens.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contentum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cursus quinque partes includit:<\/span><\/p>"],["table",6,"<table><tr><span class=\"sg\" data-s=\"0\"><td>N<\/td><td>Nomen<\/td><td>Status<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td>1<\/td><td><a href=\"https://course.raku.org/la/essentials/\" target=\"_blank\" rel=\"noopener\">Raku essentialia<\/a><\/td><td>Editum<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td>2<\/td><td><a href=\"https://course.raku.org/la/advanced/\" target=\"_blank\" rel=\"noopener\">Argumenta Raku provecta<\/a><\/td><td>In progressu&lt;span id=\"ProgressBar\"&gt;...&lt;/span&gt;<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td>3<\/td><td>Programmatio objecto-orientata in Raku<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td>4<\/td><td>Regexes et grammaticae<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td>5<\/td><td>Programmatio functionalis, concurrentis, et reactiva<\/td><\/span><\/tr><\/table>"],["raw",0,"<script>\n    let ProgressBar = document.getElementById('ProgressBar');\n    let current_progress = 0;\n    setInterval(function() {\n        current_progress++;\n        current_progress %= 6;"],["p",1,"<p><span class=\"sg\" data-s=\"0\">let bar = '';         for (let c = 0; c &lt; current_progress; c++) {             bar += ',';         }         bar += '...';         for (let c = current_progress; c &lt; 6; c++) {             bar += ',';         }<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">bar = bar.substr(3, 3);         bar = bar.replace(/,/g, '&lt;span style=\"color: lightgray\"&gt;.&lt;/span&gt;');         ProgressBar.innerHTML = bar;     }, 200); &lt;/script&gt;<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc momento, prima pars omnino scripta et edita est.<\/span> <span class=\"sg\" data-s=\"1\">Aliae partes in progressu sunt.<\/span> <span class=\"sg\" data-s=\"2\">Nota quod, cum cursus adhuc in evolutione sit, URL diversarum partium eius in futuro leviter mutari possunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prima pars, 'Raku essentialia', continet:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">91 argumenta<\/span><\/li><li><span class=\"sg\" data-s=\"1\">73 quaestiones<\/span><\/li><li><span class=\"sg\" data-s=\"2\">65 exercitationes<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Novas exercitationes et quaestiones in argumentis iam editis apparere possunt, sicut partes theoricae leviter mutari possunt ut optimum cursum fluere faciant.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Praerequisita<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut cursum sequi et exercitationes agere possis, opus est compilatore operante.<\/span> <span class=\"sg\" data-s=\"1\">Plures optiones sunt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\">— Compilatorem Rakudo vel Rakudo Star fasciculum installare vel<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Uti servitiis online vel<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Uti docker continentibus<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diversae optiones installationis in initio primae partis describuntur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De auctore<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cursus scriptus est ab <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, qui evolutionem Raku sequitur ab anno circiter 2000 (cum Perl 6 notus erat).<\/span> <span class=\"sg\" data-s=\"1\">Is est auctor plurium <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">librorum de programmandi in Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Materia cursus fundatur in experientia cotidiana, praesertim in contribuendo ad <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> et recensendo solutiones aliorum participantium, sicut etiam in experientia ex usu Raku ut lingua principalis pro <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a> website.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contribuens, usus termini, et feedback<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Creatio cursus sustentatur per donum <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Cursum uti potes ad auto-studium vel ut materiam paratam ad alios docendos.<\/span> <span class=\"sg\" data-s=\"2\">Usus commercialis in classibus sine permissione permittitur.<\/span> <span class=\"sg\" data-s=\"3\">Editio cursus ut productum separatum primum cum auctore tractanda est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fontes files in GitHub praesto sunt: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Libenter submitte pull request ad errores vel typos corrigendos vel crea issue in GitHub si vis latius argumentum discutere.<\/span> <span class=\"sg\" data-s=\"2\">Potes etiam auctorem per <a href=\"mailto:mail@andreyshitov.com\">e-mail<\/a> contingere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Navigatio cursus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/la/\" target=\"_blank\" rel=\"noopener\">Initium<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/la/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Quid est Raku<\/a> →<\/span><\/p>"]]}}}</script>
