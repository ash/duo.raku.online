<script type="application/json" id="page-data">{"u":"about-this-course","n":0,"k":"part","pv":"","nx":"essentials","tr":[],"L":{"en":{"t":"About this course","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welcome to the course of the Raku programming language!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This course covers all the main aspects of the language that you need to use in your daily practice.<\/span> <span class=\"sg\" data-s=\"1\">The course consists of five parts that explain the theory and offer many practical assignments.<\/span> <span class=\"sg\" data-s=\"2\">It is assumed that you try solving the tasks yourself before looking to the solution.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you’re only starting to learn Raku, you are advised to go through all the parts in the order they are listed in the table of contents.<\/span> <span class=\"sg\" data-s=\"1\">If you have some practice and you want to have some specific training, you are welcome to start with the desired section.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Structure<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The course is divided into five parts, each of which includes several sections, which in turn include a number of topics (or, merely saying, different pages with their unique URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The course includes materials of the following four types:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Theory that covers the current topic<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Quizzes that test your understanding of the theory of the topic and/or the section<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Exercises for the material of the whole section<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Answers to the exercises<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sometimes, practical assignments (both quizzes and exercises) give additional information on the subject, so to make the most of the course, it is recommended you do not skip them.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Below each page, there is a navigation block that you can use to traverse the entire course.<\/span> <span class=\"sg\" data-s=\"1\">You can also always jump to the desired section using the breadcrumbs menu at the top of the page.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">While the navigation guides you through the assignments in a particular order, you can solve them in more or less random order within the current section or topic.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contents<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The course includes five parts, all completely written and published:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Part<\/td><td>Topics<\/td><td>Quizzes<\/td><td>Exercises<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"/essentials/\">Raku essentials<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"/advanced/\">Advanced Raku subjects<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"/oop/\">Objects, I/O, and exceptions<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"/regexes/\">Regexes and grammars<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"/paradigms/\">Functional, concurrent, reactive, and web programming<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"/final-test/\">The Final Test<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"/addendum/\">Addendum: comprehensive exercises<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">After the five parts comes <strong>The Final Test<\/strong> — a single sitting of a hundred questions spanning the whole course, in roughly the order you learnt the material.<\/span> <span class=\"sg\" data-s=\"1\">Each answer is checked the moment you give it, and at the end you get your score and a link you can keep to share or review your result.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The sixth part, the <strong>Addendum<\/strong>, is a separate collection of tougher, more substantial exercises that draw on the whole course at once — the kind of practice you reach for once the core material is behind you.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Note that the course is still being refined, so the URLs of its different parts may slightly change in the future.<\/span> <span class=\"sg\" data-s=\"1\">New exercises and quizzes may appear in the already published topics, as well as the theoretical parts can be slightly modified to achieve the best flow of the course.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Prerequisites<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To follow the course and run exercises, you need to have a working compiler.<\/span> <span class=\"sg\" data-s=\"1\">There are a number of options:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Try the built-in &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Raku Playground&lt;/a&gt; right in your browser, with nothing to install, or<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Install the Rakudo compiler or<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Use online services or<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Use docker containers<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The different installation options are described at the beginning of the first part.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">About the author<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The course is written by <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, who has been following the development of Raku since about 2000 (when it was known as Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">He is the author of a number of <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">books about programming in Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">The course material is based on daily experience, particularly on contributing to <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> and reviewing the solutions of other participants, as well as on the experience obtained from using Raku as the main language for the <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a> website.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contributing, terms of use, and feedback<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The creation of the course is supported by the grant of <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You can use the course for self-study or as a set of ready-to-use materials for teaching others.<\/span> <span class=\"sg\" data-s=\"2\">The commercial usage in classes is allowed without permission.<\/span> <span class=\"sg\" data-s=\"3\">Releasing the course as a separate product must be first negotiated with the author.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The source files are available on GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Feel free to submit a pull request to correct the potential mistakes or typos or create an issue on GitHub if you want to discuss a broader subject.<\/span> <span class=\"sg\" data-s=\"2\">You can also contact the author by <a href=\"mailto:mail@andreyshitov.com\">e-mail<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Course navigation<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"/\">Start<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"/essentials/what-is-raku/\">What is Raku<\/a> →<\/span><\/p>"]]},"de":{"t":"Über den Kurs","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Willkommen zum Kurs der Programmiersprache Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieser Kurs behandelt alle wichtigen Seiten der Sprache, die Sie in der täglichen Praxis brauchen.<\/span> <span class=\"sg\" data-s=\"1\">Er besteht aus fünf Teilen, die die Theorie erklären und viele praktische Aufgaben bieten.<\/span> <span class=\"sg\" data-s=\"2\">Gedacht ist er so, dass Sie die Aufgaben zuerst selbst zu lösen versuchen, bevor Sie sich die Lösung ansehen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie gerade erst mit Raku anfangen, gehen Sie am besten alle Teile in der Reihenfolge des Inhaltsverzeichnisses durch.<\/span> <span class=\"sg\" data-s=\"1\">Haben Sie schon etwas Erfahrung und möchten gezielt etwas üben, können Sie ohne Weiteres direkt beim gewünschten Abschnitt einsteigen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufbau<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Kurs ist in fünf Teile gegliedert, die jeweils mehrere Abschnitte enthalten, welche ihrerseits aus einer Reihe von Themen bestehen (oder, schlicht gesagt, aus einzelnen Seiten mit eigener URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Kurs enthält Material von vier Arten:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Theorie zum jeweiligen Thema<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Quizfragen, die prüfen, wie gut Sie die Theorie des Themas und des Abschnitts verstanden haben<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Übungen zum Stoff des gesamten Abschnitts<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Lösungen zu den Übungen<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die praktischen Aufgaben — sowohl die Quizfragen als auch die Übungen — liefern mitunter zusätzliche Informationen zum Thema; um den größten Nutzen aus dem Kurs zu ziehen, sollten Sie sie also besser nicht überspringen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Unter jeder Seite steht ein Navigationsblock, mit dem Sie den gesamten Kurs durchlaufen können.<\/span> <span class=\"sg\" data-s=\"1\">Außerdem gelangen Sie über den Pfad am Seitenanfang jederzeit zum gewünschten Abschnitt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Navigation führt Sie in einer bestimmten Reihenfolge durch die Aufgaben, innerhalb des aktuellen Abschnitts oder Themas können Sie sie aber weitgehend in beliebiger Reihenfolge bearbeiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Inhalt<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Kurs besteht aus fünf Teilen, die alle vollständig geschrieben und veröffentlicht sind:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Teil<\/td><td>Themen<\/td><td>Quiz<\/td><td>Übungen<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/de/essentials/\" target=\"_blank\" rel=\"noopener\">Raku-Grundlagen<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/de/advanced/\" target=\"_blank\" rel=\"noopener\">Fortgeschrittene Raku-Themen<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">Objekte, E/A und Ausnahmen<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/de/regexes/\" target=\"_blank\" rel=\"noopener\">Reguläre Ausdrücke und Grammatiken<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/de/paradigms/\" target=\"_blank\" rel=\"noopener\">Funktionale, nebenläufige, reaktive und Webprogrammierung<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/de/final-test/\" target=\"_blank\" rel=\"noopener\">Der Abschlusstest<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/de/addendum/\" target=\"_blank\" rel=\"noopener\">Anhang: erweiterte Übungen<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nach den fünf Teilen folgt <strong>der Abschlusstest<\/strong> — hundert Fragen aus dem gesamten Kurs in einer Sitzung, ungefähr in der Reihenfolge, in der Sie den Stoff gelernt haben.<\/span> <span class=\"sg\" data-s=\"1\">Jede Antwort wird sofort geprüft, und am Ende erhalten Sie Ihr Ergebnis und einen Link, den Sie aufbewahren können, um Ihr Resultat zu teilen oder nachzuvollziehen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der sechste Teil, der <strong>Anhang<\/strong>, ist eine eigene Sammlung anspruchsvollerer, umfangreicherer Übungen, die sich auf den gesamten Kurs zugleich stützen — genau die Art von Übung, zu der man greift, sobald der Kernstoff durchgearbeitet ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bedenken Sie, dass der Kurs noch verfeinert wird, die URLs der einzelnen Teile können sich also künftig leicht ändern.<\/span> <span class=\"sg\" data-s=\"1\">In den bereits veröffentlichten Themen können neue Übungen und Quizfragen erscheinen, und die theoretischen Teile können für einen besseren Aufbau des Kurses leicht angepasst werden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Was Sie brauchen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um dem Kurs zu folgen und die Übungen zu lösen, brauchen Sie einen funktionierenden Compiler.<\/span> <span class=\"sg\" data-s=\"1\">Dafür gibt es mehrere Möglichkeiten:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Probieren Sie den eingebauten &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Raku-Spielplatz&lt;/a&gt; direkt im Browser aus, ganz ohne Installation, oder<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Installieren Sie den Rakudo-Compiler, oder<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Nutzen Sie Onlinedienste, oder<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Nutzen Sie Docker-Container<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die verschiedenen Installationsmöglichkeiten werden zu Beginn des ersten Teils beschrieben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Über den Autor<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Kurs stammt von <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, der die Entwicklung von Raku seit etwa dem Jahr 2000 verfolgt (damals hieß die Sprache noch Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Er ist Autor mehrerer <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">Bücher über das Programmieren in Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Das Kursmaterial beruht auf täglicher Erfahrung, insbesondere auf der Teilnahme an <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> und dem Durchsehen der Lösungen anderer Teilnehmer, sowie auf der Erfahrung mit Raku als Hauptsprache für die Website <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mitwirken, Nutzungsbedingungen und Rückmeldungen<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Entstehung des Kurses wird durch ein Stipendium der <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">Perl &amp; Raku Foundation<\/a> unterstützt.<\/span> <span class=\"sg\" data-s=\"1\">Sie dürfen den Kurs zum Selbststudium nutzen oder als fertiges Material, um andere zu unterrichten.<\/span> <span class=\"sg\" data-s=\"2\">Die kommerzielle Nutzung im Unterricht ist ohne gesonderte Erlaubnis gestattet.<\/span> <span class=\"sg\" data-s=\"3\">Eine Veröffentlichung des Kurses als eigenständiges Produkt ist vorab mit dem Autor abzustimmen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Quelldateien liegen auf GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Schicken Sie gern einen Pull Request, um Fehler oder Tippfehler zu beheben, oder legen Sie ein Issue auf GitHub an, wenn Sie etwas Grundsätzlicheres besprechen möchten.<\/span> <span class=\"sg\" data-s=\"2\">Sie erreichen den Autor auch per <a href=\"mailto:mail@andreyshitov.com\">E-Mail<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kursnavigation<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/de/\" target=\"_blank\" rel=\"noopener\">Start<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/de/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Was ist Raku<\/a> →<\/span><\/p>"]]},"nl":{"t":"Over de cursus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welkom bij de cursus van de programmeertaal Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze cursus behandelt alle belangrijke kanten van de taal die je in je dagelijkse praktijk nodig hebt.<\/span> <span class=\"sg\" data-s=\"1\">Hij bestaat uit vijf delen die de theorie uitleggen en veel praktische opdrachten bieden.<\/span> <span class=\"sg\" data-s=\"2\">De bedoeling is dat je de taken zelf probeert op te lossen voordat je naar de oplossing kijkt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je net begint met Raku, doe je er goed aan alle delen te doorlopen in de volgorde waarin ze in de inhoudsopgave staan.<\/span> <span class=\"sg\" data-s=\"1\">Heb je al wat ervaring en wil je iets specifieks oefenen, begin dan gerust meteen bij de gewenste sectie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Structuur<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De cursus is verdeeld in vijf delen, elk met verschillende secties, die op hun beurt een aantal onderwerpen bevatten (of, simpel gezegd, losse pagina's met hun eigen URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De cursus bevat materiaal van vier soorten:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Theorie over het huidige onderwerp<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Quizzen die toetsen hoe goed je de theorie van het onderwerp en de sectie begrijpt<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Oefeningen over het materiaal van de hele sectie<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Antwoorden op de oefeningen<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De praktische opdrachten — zowel de quizzen als de oefeningen — geven soms extra informatie over het onderwerp, dus om het meeste uit de cursus te halen, kun je ze beter niet overslaan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Onder elke pagina staat een navigatieblok waarmee je de hele cursus kunt doorlopen.<\/span> <span class=\"sg\" data-s=\"1\">Bovendien kun je altijd naar de gewenste sectie springen via het kruimelpad bovenaan de pagina.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De navigatie leidt je in een bepaalde volgorde door de opdrachten, maar binnen de huidige sectie of het huidige onderwerp kun je ze min of meer in willekeurige volgorde maken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Inhoud<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De cursus bestaat uit vijf delen, die allemaal volledig geschreven en gepubliceerd zijn:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Deel<\/td><td>Onderwerpen<\/td><td>Quizzen<\/td><td>Oefeningen<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/nl/essentials/\" target=\"_blank\" rel=\"noopener\">Raku essentiëlen<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/nl/advanced/\" target=\"_blank\" rel=\"noopener\">Gevorderde Raku-onderwerpen<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/nl/oop/\" target=\"_blank\" rel=\"noopener\">Objecten, I/O en excepties<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/nl/regexes/\" target=\"_blank\" rel=\"noopener\">Reguliere expressies en grammatica's<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/nl/paradigms/\" target=\"_blank\" rel=\"noopener\">Functioneel, concurrent, reactief en webprogrammeren<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/nl/final-test/\" target=\"_blank\" rel=\"noopener\">De eindtoets<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/nl/addendum/\" target=\"_blank\" rel=\"noopener\">Aanhangsel: uitgebreide oefeningen<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Na de vijf delen komt <strong>de eindtoets<\/strong> — honderd vragen uit de hele cursus in één zitting, ongeveer in de volgorde waarin je de stof geleerd hebt.<\/span> <span class=\"sg\" data-s=\"1\">Elk antwoord wordt meteen nagekeken, en aan het eind krijg je je score en een link die je kunt bewaren om je resultaat te delen of na te lopen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het zesde deel, het <strong>Aanhangsel<\/strong>, is een aparte verzameling van pittigere, omvangrijkere oefeningen die op de hele cursus tegelijk leunen — precies het soort oefening waar je naar grijpt zodra de kernstof achter de rug is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Houd er rekening mee dat de cursus nog verfijnd wordt, dus de URL's van de verschillende delen kunnen in de toekomst iets veranderen.<\/span> <span class=\"sg\" data-s=\"1\">In de al gepubliceerde onderwerpen kunnen nieuwe oefeningen en quizzen verschijnen, en de theoretische delen kunnen licht aangepast worden voor een betere opbouw van de cursus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wat je nodig hebt<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de cursus te volgen en de oefeningen te maken, heb je een werkende compiler nodig.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn verschillende mogelijkheden:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Probeer de ingebouwde &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Raku-speeltuin&lt;/a&gt; direct in je browser, zonder iets te installeren, of<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Installeer de Rakudo-compiler, of<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Gebruik onlinediensten, of<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Gebruik dockercontainers<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De verschillende installatiemogelijkheden worden aan het begin van het eerste deel beschreven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Over de auteur<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De cursus is geschreven door <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, die de ontwikkeling van Raku al sinds ongeveer 2000 volgt (toen de taal nog Perl 6 heette).<\/span> <span class=\"sg\" data-s=\"1\">Hij is de auteur van een aantal <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">boeken over programmeren in Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Het cursusmateriaal is gebaseerd op dagelijkse ervaring, in het bijzonder op deelname aan <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> en het doornemen van de oplossingen van andere deelnemers, en op de ervaring met Raku als hoofdtaal voor de website <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bijdragen, gebruiksvoorwaarden en feedback<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De totstandkoming van de cursus wordt ondersteund door een subsidie van <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je mag de cursus gebruiken voor zelfstudie of als kant-en-klaar materiaal om anderen les te geven.<\/span> <span class=\"sg\" data-s=\"2\">Commercieel gebruik in lessen is toegestaan zonder aparte toestemming.<\/span> <span class=\"sg\" data-s=\"3\">Het uitbrengen van de cursus als afzonderlijk product moet eerst met de auteur overlegd worden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De bronbestanden staan op GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Stuur gerust een pull request om eventuele fouten of typefouten te verbeteren, of maak een issue aan op GitHub als je iets breders wilt bespreken.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt de auteur ook per <a href=\"mailto:mail@andreyshitov.com\">e-mail<\/a> bereiken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cursusnavigatie<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/nl/\" target=\"_blank\" rel=\"noopener\">Begin<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/nl/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Wat is Raku<\/a> →<\/span><\/p>"]]},"es":{"t":"Sobre el curso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¡Bienvenido al curso del lenguaje de programación Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este curso cubre todos los aspectos principales del lenguaje que necesitas en la práctica diaria.<\/span> <span class=\"sg\" data-s=\"1\">Consta de cinco partes que explican la teoría y ofrecen muchas tareas prácticas.<\/span> <span class=\"sg\" data-s=\"2\">La idea es que intentes resolverlas por tu cuenta antes de mirar la solución.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si estás empezando a aprender Raku, conviene recorrer todas las partes en el orden en que aparecen en el índice.<\/span> <span class=\"sg\" data-s=\"1\">Si ya tienes algo de práctica y buscas un entrenamiento concreto, eres libre de empezar por la sección que te interese.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Estructura<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El curso está dividido en cinco partes, cada una de las cuales incluye varias secciones, que a su vez incluyen cierto número de temas (o, dicho llanamente, páginas sueltas con su propia URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El curso incluye materiales de cuatro tipos:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Teoría sobre el tema actual<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Cuestionarios que comprueban qué tan bien has entendido la teoría del tema y de la sección<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Ejercicios sobre el material de toda la sección<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Soluciones de los ejercicios<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las tareas prácticas — tanto los cuestionarios como los ejercicios — a veces aportan información adicional sobre el tema: para sacar el máximo del curso, más vale no saltárselas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Debajo de cada página hay un bloque de navegación con el que puedes recorrer el curso entero.<\/span> <span class=\"sg\" data-s=\"1\">Además, puedes saltar en cualquier momento a la sección que quieras usando la ruta de la parte superior de la página.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La navegación te guía por las tareas en un orden concreto, pero dentro de la sección o el tema actual puedes resolverlas más o menos en el orden que prefieras.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contenido<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El curso consta de cinco partes, todas escritas y publicadas por completo:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Parte<\/td><td>Temas<\/td><td>Cuestionarios<\/td><td>Ejercicios<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/es/essentials/\" target=\"_blank\" rel=\"noopener\">Esenciales de Raku<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/es/advanced/\" target=\"_blank\" rel=\"noopener\">Temas avanzados de Raku<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/es/oop/\" target=\"_blank\" rel=\"noopener\">Objetos, entrada/salida y excepciones<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/es/regexes/\" target=\"_blank\" rel=\"noopener\">Expresiones regulares y gramáticas<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/es/paradigms/\" target=\"_blank\" rel=\"noopener\">Programación funcional, concurrente, reactiva y web<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/es/final-test/\" target=\"_blank\" rel=\"noopener\">La prueba final<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/es/addendum/\" target=\"_blank\" rel=\"noopener\">Apéndice: ejercicios ampliados<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después de las cinco partes viene <strong>la prueba final<\/strong>: cien preguntas sobre todo el curso en una sola sesión, aproximadamente en el orden en que aprendiste la materia.<\/span> <span class=\"sg\" data-s=\"1\">Cada respuesta se comprueba al instante y al terminar obtienes tu puntuación y un enlace que puedes guardar para compartir el resultado o repasarlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sexta parte, el <strong>apéndice<\/strong>, es una colección aparte de ejercicios más exigentes y más amplios, que se apoyan a la vez en todo el curso: justo el tipo de ejercicio al que se recurre una vez digerido el material principal.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ten en cuenta que el curso se sigue puliendo, así que las URL de sus distintas partes podrían cambiar levemente en el futuro.<\/span> <span class=\"sg\" data-s=\"1\">En los temas ya publicados pueden aparecer nuevos ejercicios y cuestionarios, y las partes teóricas pueden retocarse para lograr un mejor recorrido.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Qué necesitas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para seguir el curso y hacer los ejercicios necesitas un compilador que funcione.<\/span> <span class=\"sg\" data-s=\"1\">Hay varias opciones:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Probar el &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;campo de pruebas de Raku&lt;/a&gt; directamente en el navegador, sin instalar nada, o<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Instalar el compilador Rakudo, o<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Usar servicios en línea, o<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Usar contenedores Docker<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Las distintas opciones de instalación se describen al comienzo de la primera parte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sobre el autor<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El curso está escrito por <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, que sigue el desarrollo de Raku desde alrededor del año 2000 (cuando el lenguaje aún se llamaba Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Es autor de varios <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">libros sobre programación en Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">El material del curso se basa en la experiencia diaria, en particular en participar en <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> y en revisar las soluciones de otros participantes, así como en la experiencia de usar Raku como lenguaje principal del sitio <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contribuciones, condiciones de uso y comentarios<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La creación del curso cuenta con el apoyo de una beca de la <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes usar el curso para estudiar por tu cuenta o como material ya preparado para enseñar a otros.<\/span> <span class=\"sg\" data-s=\"2\">El uso comercial en clase está permitido sin autorización.<\/span> <span class=\"sg\" data-s=\"3\">La publicación del curso como producto independiente debe acordarse antes con el autor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los archivos fuente están en GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">No dudes en enviar una pull request para corregir errores o erratas, o en abrir una issue en GitHub si quieres tratar algo más amplio.<\/span> <span class=\"sg\" data-s=\"2\">También puedes escribir al autor por <a href=\"mailto:mail@andreyshitov.com\">correo electrónico<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Navegación del curso<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/es/\" target=\"_blank\" rel=\"noopener\">Inicio<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/es/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Qué es Raku<\/a> →<\/span><\/p>"]]},"it":{"t":"Informazioni sul corso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Benvenuto al corso sul linguaggio di programmazione Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo corso copre tutti gli aspetti principali del linguaggio che servono nella pratica quotidiana.<\/span> <span class=\"sg\" data-s=\"1\">È composto da cinque parti che spiegano la teoria e propongono molti compiti pratici.<\/span> <span class=\"sg\" data-s=\"2\">L'idea è che tu provi a risolverli da solo prima di guardare la soluzione.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se stai appena iniziando a imparare Raku, conviene seguire tutte le parti nell'ordine in cui compaiono nell'indice.<\/span> <span class=\"sg\" data-s=\"1\">Se hai già un po' di pratica e cerchi un allenamento mirato, sei libero di partire dalla sezione che ti interessa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Struttura<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il corso è diviso in cinque parti, ciascuna delle quali comprende diverse sezioni, che a loro volta comprendono un certo numero di argomenti (o, più semplicemente, singole pagine con il proprio URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il corso comprende materiali di quattro tipi:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Teoria sull'argomento corrente<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Quiz che verificano quanto hai capito della teoria dell'argomento e della sezione<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Esercizi sul materiale dell'intera sezione<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Soluzioni degli esercizi<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I compiti pratici — sia i quiz sia gli esercizi — a volte forniscono informazioni aggiuntive sull'argomento: per trarre il massimo dal corso, è meglio non saltarli.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sotto ogni pagina c'è un blocco di navigazione che permette di percorrere l'intero corso.<\/span> <span class=\"sg\" data-s=\"1\">Puoi inoltre saltare in qualsiasi momento alla sezione desiderata usando il percorso in cima alla pagina.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La navigazione ti guida attraverso i compiti in un ordine preciso, ma all'interno della sezione o dell'argomento corrente puoi affrontarli più o meno nell'ordine che preferisci.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contenuti<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il corso è composto da cinque parti, tutte interamente scritte e pubblicate:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Parte<\/td><td>Argomenti<\/td><td>Quiz<\/td><td>Esercizi<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/it/essentials/\" target=\"_blank\" rel=\"noopener\">Fondamenti di Raku<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/it/advanced/\" target=\"_blank\" rel=\"noopener\">Argomenti avanzati di Raku<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">Oggetti, I/O ed eccezioni<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/it/regexes/\" target=\"_blank\" rel=\"noopener\">Espressioni regolari e grammatiche<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/it/paradigms/\" target=\"_blank\" rel=\"noopener\">Programmazione funzionale, concorrente, reattiva e web<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/it/final-test/\" target=\"_blank\" rel=\"noopener\">La prova finale<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/it/addendum/\" target=\"_blank\" rel=\"noopener\">Appendice: esercizi estesi<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dopo le cinque parti viene <strong>la prova finale<\/strong>: cento domande su tutto il corso in un'unica sessione, all'incirca nell'ordine in cui hai imparato la materia.<\/span> <span class=\"sg\" data-s=\"1\">Ogni risposta viene verificata subito e alla fine ottieni il tuo punteggio e un link da conservare per condividere il risultato o per rivederlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sesta parte, l'<strong>appendice<\/strong>, è una raccolta a sé di esercizi più impegnativi e più ampi, che si appoggiano contemporaneamente a tutto il corso — proprio il tipo di esercizio a cui si ricorre una volta digerito il materiale principale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tieni presente che il corso è ancora in fase di rifinitura, quindi gli URL delle sue diverse parti potrebbero cambiare leggermente in futuro.<\/span> <span class=\"sg\" data-s=\"1\">Negli argomenti già pubblicati possono comparire nuovi esercizi e quiz, e le parti teoriche possono essere ritoccate per ottenere un flusso migliore.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cosa serve<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per seguire il corso e svolgere gli esercizi serve un compilatore funzionante.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono diverse possibilità:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Provare il &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;campo da gioco di Raku&lt;/a&gt; direttamente nel browser, senza installare nulla, oppure<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Installare il compilatore Rakudo, oppure<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Usare servizi online, oppure<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Usare container Docker<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Le diverse opzioni di installazione sono descritte all'inizio della prima parte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Informazioni sull'autore<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il corso è scritto da <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, che segue lo sviluppo di Raku dal 2000 circa (quando il linguaggio si chiamava ancora Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">È autore di diversi <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">libri sulla programmazione in Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Il materiale del corso si basa sull'esperienza quotidiana, in particolare sulla partecipazione a <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> e sulla lettura delle soluzioni degli altri partecipanti, oltre che sull'esperienza maturata usando Raku come linguaggio principale per il sito <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Contributi, condizioni d'uso e commenti<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La creazione del corso è sostenuta da una borsa della <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi usare il corso per lo studio individuale o come materiale già pronto per insegnare ad altri.<\/span> <span class=\"sg\" data-s=\"2\">L'uso commerciale in aula è consentito senza autorizzazione.<\/span> <span class=\"sg\" data-s=\"3\">La pubblicazione del corso come prodotto autonomo va concordata prima con l'autore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I file sorgente sono su GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Manda pure una pull request per correggere errori o refusi, oppure apri una issue su GitHub se vuoi discutere qualcosa di più ampio.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche scrivere all'autore per <a href=\"mailto:mail@andreyshitov.com\">e-mail<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Navigazione del corso<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/it/\" target=\"_blank\" rel=\"noopener\">Inizio<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/it/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Cos'è Raku<\/a> →<\/span><\/p>"]]},"lv":{"t":"Par šo kursu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Laipni lūdzam Raku programmēšanas valodas kursā!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šis kurss aptver visus valodas galvenos aspektus, kas nepieciešami ikdienas darbā.<\/span> <span class=\"sg\" data-s=\"1\">Kurss sastāv no piecām daļām, kurās izklāstīta teorija un piedāvāti daudzi praktiski uzdevumi.<\/span> <span class=\"sg\" data-s=\"2\">Tiek pieņemts, ka uzdevumus mēģināt atrisināt pats, pirms ieskatāties risinājumā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja Raku tikai sākat apgūt, ieteicams iziet visas daļas tādā secībā, kādā tās uzskaitītas satura rādītājā.<\/span> <span class=\"sg\" data-s=\"1\">Ja jums jau ir zināma pieredze un vēlaties apgūt ko konkrētu, droši sāciet ar vajadzīgo sadaļu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Struktūra<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurss ir sadalīts piecās daļās, katra no tām ietver vairākas sadaļas, kas savukārt ietver virkni tematu (vienkārši sakot, dažādas lappuses ar savu unikālu URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kursā ir šādu četru veidu materiāli:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Teorija par attiecīgo tematu<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Testi, kas pārbauda, kā esat izpratis temata un/vai sadaļas teoriju<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Vingrinājumi par visas sadaļas vielu<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Vingrinājumu atbildes<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Reizēm praktiskie uzdevumi (gan testi, gan vingrinājumi) sniedz papildu informāciju par tematu, tāpēc, lai gūtu no kursa vislielāko labumu, tos ieteicams neizlaist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zem katras lappuses ir navigācijas bloks, ar kuru varat pārvietoties pa visu kursu.<\/span> <span class=\"sg\" data-s=\"1\">Vajadzīgajā sadaļā varat nokļūt arī jebkurā brīdī, izmantojot lappuses augšpusē esošo maizes drupatu izvēlni.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai gan navigācija ved cauri uzdevumiem noteiktā secībā, pašreizējās sadaļas vai temata ietvaros tos varat risināt vairāk vai mazāk brīvā secībā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Saturs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kursā ir piecas daļas, un visas ir pilnībā uzrakstītas un publicētas:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Daļa<\/td><td>Temati<\/td><td>Testi<\/td><td>Vingrinājumi<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/lv/essentials/\" target=\"_blank\" rel=\"noopener\">Raku pamati<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/lv/advanced/\" target=\"_blank\" rel=\"noopener\">Padziļinātas Raku tēmas<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">Objekti, ievade/izvade un izņēmumi<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/lv/regexes/\" target=\"_blank\" rel=\"noopener\">Regulārās izteiksmes un gramatikas<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/lv/paradigms/\" target=\"_blank\" rel=\"noopener\">Funkcionālā, konkurentā, reaktīvā un tīmekļa programmēšana<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/lv/final-test/\" target=\"_blank\" rel=\"noopener\">Noslēguma tests<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/lv/addendum/\" target=\"_blank\" rel=\"noopener\">Pielikums: apjomīgi vingrinājumi<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc piecām daļām seko <strong>Noslēguma tests<\/strong> — vienā piegājienā simt jautājumu par visu kursu, aptuveni tādā secībā, kādā vielu esat apguvis.<\/span> <span class=\"sg\" data-s=\"1\">Katra atbilde tiek pārbaudīta uzreiz, un beigās jūs saņemat savu rezultātu un saiti, ko varat paturēt, lai to parādītu citiem vai pārskatītu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sestā daļa — <strong>Pielikums<\/strong> — ir atsevišķa grūtāku un apjomīgāku vingrinājumu kolekcija, kas balstās uz visu kursu vienlaikus; tāda prakse, pie kuras ķerties, kad pamatviela jau ir aiz muguras.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka kurss joprojām tiek pilnveidots, tāpēc tā dažādo daļu URL nākotnē var nedaudz mainīties.<\/span> <span class=\"sg\" data-s=\"1\">Jau publicētajos tematos var parādīties jauni vingrinājumi un testi, kā arī teorētiskās daļas var tikt nedaudz pārveidotas, lai kursa plūdums būtu pēc iespējas labāks.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Priekšnosacījumi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai sekotu kursam un izpildītu vingrinājumus, jums nepieciešams strādājošs kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Ir vairākas iespējas:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Izmēģiniet iebūvēto &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Raku spēļu laukumu&lt;/a&gt; tieši pārlūkprogrammā, neko neinstalējot, vai<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Instalējiet Rakudo kompilatoru, vai<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Izmantojiet tiešsaistes pakalpojumus, vai<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Izmantojiet docker konteinerus<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dažādās instalēšanas iespējas ir aprakstītas pirmās daļas sākumā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Par autoru<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kursu ir sarakstījis <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Andrew Shitov<\/a>, kurš Raku attīstībai seko līdzi kopš aptuveni 2000. gada (kad valoda bija pazīstama kā Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Viņš ir vairāku <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">grāmatu par programmēšanu Raku valodā<\/a> autors.<\/span> <span class=\"sg\" data-s=\"2\">Kursa viela balstās uz ikdienas pieredzi, jo īpaši uz dalību <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> un citu dalībnieku risinājumu izskatīšanu, kā arī uz pieredzi, kas gūta, izmantojot Raku kā galveno valodu vietnei <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ieguldījums, lietošanas noteikumi un atsauksmes<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kursa tapšanu atbalsta <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a> piešķirtais grants.<\/span> <span class=\"sg\" data-s=\"1\">Kursu varat izmantot pašmācībai vai kā gatavu materiālu kopumu citu apmācīšanai.<\/span> <span class=\"sg\" data-s=\"2\">Komerciāla izmantošana nodarbībās ir atļauta bez atsevišķas atļaujas.<\/span> <span class=\"sg\" data-s=\"3\">Kursa izdošana kā atsevišķa produkta vispirms jāsaskaņo ar autoru.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmkoda faili ir pieejami GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Droši iesniedziet izmaiņu pieprasījumu (pull request), lai izlabotu iespējamās kļūdas vai drukas kļūdas, vai izveidojiet problēmziņojumu (issue) GitHub, ja vēlaties apspriest ko plašāku.<\/span> <span class=\"sg\" data-s=\"2\">Ar autoru varat sazināties arī pa <a href=\"mailto:mail@andreyshitov.com\">e-pastu<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kursa navigācija<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/lv/\" target=\"_blank\" rel=\"noopener\">Sākums<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/lv/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Kas ir Raku<\/a> →<\/span><\/p>"]]},"ru":{"t":"О курсе","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Добро пожаловать на курс языка программирования Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот курс охватывает все основные стороны языка, которые понадобятся вам в повседневной практике.<\/span> <span class=\"sg\" data-s=\"1\">Он состоит из пяти частей, объясняющих теорию и предлагающих множество практических заданий.<\/span> <span class=\"sg\" data-s=\"2\">Предполагается, что вы пробуете решить задачи самостоятельно, прежде чем заглянуть в решение.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы только начинаете изучать Raku, вам стоит пройти все части в том порядке, в каком они перечислены в оглавлении.<\/span> <span class=\"sg\" data-s=\"1\">Если же у вас уже есть практика и вы хотите потренироваться в чём-то конкретном, начинайте прямо с нужного раздела.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Структура<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Курс разделён на пять частей, каждая из которых включает несколько разделов, а те, в свою очередь, — ряд тем (проще говоря, отдельных страниц со своими URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В курс входят материалы четырёх видов:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Теория по текущей теме<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Тесты, проверяющие, как вы поняли теорию темы и раздела<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Упражнения по материалу всего раздела<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Ответы к упражнениям<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Практические задания — и тесты, и упражнения — порой сообщают дополнительные сведения по предмету, поэтому, чтобы взять от курса максимум, пропускать их не рекомендуется.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Под каждой страницей находится навигационный блок, с помощью которого можно пройти весь курс.<\/span> <span class=\"sg\" data-s=\"1\">Кроме того, к нужному разделу всегда можно перейти по «хлебным крошкам» в верхней части страницы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Навигация ведёт вас по заданиям в определённом порядке, но внутри текущего раздела или темы решать их можно более или менее произвольно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Содержание<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В курс входят пять частей, и все они полностью написаны и опубликованы:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Часть<\/td><td>Темы<\/td><td>Тесты<\/td><td>Упражнения<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/ru/essentials/\" target=\"_blank\" rel=\"noopener\">Основы Raku<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/ru/advanced/\" target=\"_blank\" rel=\"noopener\">Продвинутые темы Raku<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">Объекты, ввод-вывод и исключения<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/ru/regexes/\" target=\"_blank\" rel=\"noopener\">Регулярные выражения и грамматики<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/ru/paradigms/\" target=\"_blank\" rel=\"noopener\">Функциональное, конкурентное, реактивное и веб-программирование<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/ru/final-test/\" target=\"_blank\" rel=\"noopener\">Финальный тест<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/ru/addendum/\" target=\"_blank\" rel=\"noopener\">Приложение: комплексные упражнения<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">После пяти частей идёт <strong>Финальный тест<\/strong> — сто вопросов по всему курсу за один присест, примерно в том порядке, в каком вы изучали материал.<\/span> <span class=\"sg\" data-s=\"1\">Каждый ответ проверяется сразу, а в конце вы получаете свой результат и ссылку, которую можно сохранить, чтобы поделиться им или разобрать его.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шестая часть, <strong>Приложение<\/strong>, — это отдельная подборка более трудных и объёмных упражнений, опирающихся сразу на весь курс: та самая практика, к которой обращаются, когда основной материал уже позади.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Учтите, что курс всё ещё дорабатывается, поэтому URL его частей в будущем могут немного измениться.<\/span> <span class=\"sg\" data-s=\"1\">В уже опубликованных темах могут появляться новые упражнения и тесты, а теоретические части могут слегка меняться ради лучшего течения курса.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Что понадобится<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы проходить курс и выполнять упражнения, вам нужен работающий компилятор.<\/span> <span class=\"sg\" data-s=\"1\">Вариантов несколько:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Попробовать встроенную &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Песочницу Raku&lt;/a&gt; прямо в браузере, ничего не устанавливая, или<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Установить компилятор Rakudo, или<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Воспользоваться онлайн-сервисами, или<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Воспользоваться docker-контейнерами<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разные варианты установки описаны в начале первой части.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Об авторе<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Курс написан <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Андреем Шитовым<\/a>, который следит за развитием Raku примерно с 2000 года (когда язык был известен как Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Он автор нескольких <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">книг о программировании на Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Материал курса основан на повседневном опыте, в частности на участии в <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> и разборе решений других участников, а также на опыте использования Raku как основного языка для сайта <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Участие, условия использования и обратная связь<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Создание курса поддержано грантом <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Курс можно использовать для самообучения или как набор готовых материалов для обучения других.<\/span> <span class=\"sg\" data-s=\"2\">Коммерческое использование на занятиях разрешено без отдельного разрешения.<\/span> <span class=\"sg\" data-s=\"3\">Выпуск курса как отдельного продукта нужно предварительно согласовать с автором.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Исходные файлы доступны на GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Не стесняйтесь присылать pull request с исправлением возможных ошибок и опечаток или заводить issue на GitHub, если хотите обсудить что-то более широкое.<\/span> <span class=\"sg\" data-s=\"2\">С автором также можно связаться по <a href=\"mailto:mail@andreyshitov.com\">электронной почте<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Навигация по курсу<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/ru/\" target=\"_blank\" rel=\"noopener\">Начало<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/ru/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Что такое Raku<\/a> →<\/span><\/p>"]]},"uk":{"t":"Про курс","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ласкаво просимо на курс мови програмування Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей курс охоплює всі основні сторони мови, які знадобляться вам у щоденній практиці.<\/span> <span class=\"sg\" data-s=\"1\">Він складається з п'яти частин, що пояснюють теорію та пропонують багато практичних завдань.<\/span> <span class=\"sg\" data-s=\"2\">Передбачається, що ви пробуєте розв'язати задачі самостійно, перш ніж зазирнути до розв'язання.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви тільки починаєте вивчати Raku, варто пройти всі частини в тому порядку, в якому вони перелічені у змісті.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ж у вас уже є практика і ви хочете потренуватися в чомусь конкретному, починайте одразу з потрібного розділу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Структура<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Курс поділено на п'ять частин, кожна з яких включає кілька розділів, а ті, своєю чергою, — низку тем (простіше кажучи, окремих сторінок зі своїми URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">До курсу входять матеріали чотирьох видів:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Теорія з поточної теми<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Тести, що перевіряють, як ви зрозуміли теорію теми та розділу<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Вправи за матеріалом усього розділу<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Відповіді до вправ<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Практичні завдання — і тести, і вправи — інколи повідомляють додаткові відомості з предмета, тож, щоб узяти від курсу максимум, пропускати їх не рекомендується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Під кожною сторінкою розташований навігаційний блок, за допомогою якого можна пройти весь курс.<\/span> <span class=\"sg\" data-s=\"1\">Крім того, до потрібного розділу завжди можна перейти «хлібними крихтами» у верхній частині сторінки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Навігація веде вас завданнями в певному порядку, але в межах поточного розділу чи теми розв'язувати їх можна більш-менш довільно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зміст<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">До курсу входять п'ять частин, і всі вони повністю написані та опубліковані:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Частина<\/td><td>Теми<\/td><td>Тести<\/td><td>Вправи<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/uk/essentials/\" target=\"_blank\" rel=\"noopener\">Основи Raku<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/uk/advanced/\" target=\"_blank\" rel=\"noopener\">Розширені теми Raku<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">Об'єкти, введення-виведення та винятки<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/uk/regexes/\" target=\"_blank\" rel=\"noopener\">Регулярні вирази та граматики<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/uk/paradigms/\" target=\"_blank\" rel=\"noopener\">Функційне, конкурентне, реактивне та веб-програмування<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/uk/final-test/\" target=\"_blank\" rel=\"noopener\">Фінальний тест<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/uk/addendum/\" target=\"_blank\" rel=\"noopener\">Додаток: комплексні вправи<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після п'яти частин іде <strong>Фінальний тест<\/strong> — сто запитань з усього курсу за один присід, приблизно в тому порядку, в якому ви вивчали матеріал.<\/span> <span class=\"sg\" data-s=\"1\">Кожну відповідь перевіряють одразу, а наприкінці ви отримуєте свій результат і посилання, яке можна зберегти, щоб поділитися ним або розібрати його.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шоста частина, <strong>Додаток<\/strong>, — це окрема добірка складніших та об'ємніших вправ, що спираються одразу на весь курс: та сама практика, до якої вдаються, коли основний матеріал уже позаду.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зауважте, що курс усе ще допрацьовується, тому URL його частин у майбутньому можуть трохи змінитися.<\/span> <span class=\"sg\" data-s=\"1\">У вже опублікованих темах можуть з'являтися нові вправи й тести, а теоретичні частини можуть трохи змінюватися заради кращого плину курсу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Що знадобиться<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб проходити курс і виконувати вправи, вам потрібен робочий компілятор.<\/span> <span class=\"sg\" data-s=\"1\">Варіантів кілька:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Спробувати вбудований &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Майданчик Raku&lt;/a&gt; просто у браузері, нічого не встановлюючи, або<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Встановити компілятор Rakudo, або<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Скористатися онлайн-сервісами, або<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Скористатися docker-контейнерами<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Різні варіанти встановлення описані на початку першої частини.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Про автора<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Курс написав <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Андрій Шитов<\/a>, який стежить за розвитком Raku приблизно з 2000 року (коли мова була відома як Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Він автор кількох <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">книг про програмування мовою Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Матеріал курсу засновано на щоденному досвіді, зокрема на участі в <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> та розборі розв'язань інших учасників, а також на досвіді використання Raku як основної мови для сайту <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Участь, умови використання та зворотний зв'язок<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Створення курсу підтримано грантом <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Курс можна використовувати для самонавчання або як набір готових матеріалів для навчання інших.<\/span> <span class=\"sg\" data-s=\"2\">Комерційне використання на заняттях дозволене без окремого дозволу.<\/span> <span class=\"sg\" data-s=\"3\">Випуск курсу як окремого продукту потрібно попередньо узгодити з автором.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вихідні файли доступні на GitHub: <a href=\"https://github.com/ash/raku-course\" target=\"_blank\" rel=\"noopener\">github.com/ash/raku-course<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Не соромтеся надсилати pull request із виправленням можливих помилок і одруків або створювати issue на GitHub, якщо хочете обговорити щось ширше.<\/span> <span class=\"sg\" data-s=\"2\">З автором також можна зв'язатися <a href=\"mailto:mail@andreyshitov.com\">електронною поштою<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Навігація курсом<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">← <a href=\"https://course.raku.org/uk/\" target=\"_blank\" rel=\"noopener\">Початок<\/a>  &nbsp;&nbsp;|&nbsp;&nbsp; <a href=\"https://course.raku.org/uk/essentials/what-is-raku/\" target=\"_blank\" rel=\"noopener\">Що таке Raku<\/a> →<\/span><\/p>"]]},"bg":{"t":"За курса","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Добре дошли в курса по програмния език Raku!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този курс обхваща всички основни страни на езика, които ще ви трябват в ежедневната практика.<\/span> <span class=\"sg\" data-s=\"1\">Състои се от пет части, които обясняват теорията и предлагат много практически задачи.<\/span> <span class=\"sg\" data-s=\"2\">Предполага се, че ще опитате да решите задачите сами, преди да надникнете в решението.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако тепърва започвате да учите Raku, добре е да преминете през всички части в реда, в който са изброени в съдържанието.<\/span> <span class=\"sg\" data-s=\"1\">Ако вече имате практика и искате да потренирате нещо конкретно, започнете направо от желания раздел.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Структура<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Курсът е разделен на пет части, всяка от които включва няколко раздела, а те на свой ред — редица теми (или, най-просто казано, отделни страници със свой URL).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Курсът включва материали от четири вида:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Теория по текущата тема<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Тестове, които проверяват как сте разбрали теорията на темата и раздела<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Упражнения върху материала на целия раздел<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Отговори на упражненията<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Практическите задачи — и тестовете, и упражненията — понякога съобщават допълнителни сведения по предмета, така че за да извлечете максимума от курса, не се препоръчва да ги пропускате.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Под всяка страница има навигационен блок, с който можете да преминете през целия курс.<\/span> <span class=\"sg\" data-s=\"1\">Освен това винаги можете да скочите до желания раздел чрез „хлебните трохи“ в горната част на страницата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Навигацията ви води през задачите в определен ред, но в рамките на текущия раздел или тема можете да ги решавате в повече или по-малко произволен ред.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Съдържание<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Курсът включва пет части и всички те са напълно написани и публикувани:<\/span><\/p>"],["raw",0,"<style>\ntable td:first-child, table th:first-child { width: 99%; }\ntable td:not(:first-child), table th:not(:first-child) { white-space: nowrap; padding-left: 1.5em; }\n<\/style>"],["table",8,"<table><tr><span class=\"sg\" data-s=\"0\"><td>Част<\/td><td>Теми<\/td><td>Тестове<\/td><td>Упражнения<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"1\"><td><a href=\"https://course.raku.org/bg/essentials/\" target=\"_blank\" rel=\"noopener\">Основи на Raku<\/a><\/td><td>91<\/td><td>73<\/td><td>65<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"2\"><td><a href=\"https://course.raku.org/bg/advanced/\" target=\"_blank\" rel=\"noopener\">Разширени теми в Raku<\/a><\/td><td>86<\/td><td>48<\/td><td>115<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"3\"><td><a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">Обекти, вход-изход и изключения<\/a><\/td><td>33<\/td><td>20<\/td><td>55<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"4\"><td><a href=\"https://course.raku.org/bg/regexes/\" target=\"_blank\" rel=\"noopener\">Регулярни изрази и граматики<\/a><\/td><td>34<\/td><td>29<\/td><td>49<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"5\"><td><a href=\"https://course.raku.org/bg/paradigms/\" target=\"_blank\" rel=\"noopener\">Функционално, конкурентно, реактивно и уеб програмиране<\/a><\/td><td>40<\/td><td>31<\/td><td>56<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"6\"><td>★ <a href=\"https://course.raku.org/bg/final-test/\" target=\"_blank\" rel=\"noopener\">Финален тест<\/a><\/td><td>—<\/td><td>100<\/td><td>—<\/td><\/span><\/tr><tr><span class=\"sg\" data-s=\"7\"><td><a href=\"https://course.raku.org/bg/addendum/\" target=\"_blank\" rel=\"noopener\">Приложение: комплексни упражнения<\/a><\/td><td>8<\/td><td>—<\/td><td>50<\/td><\/span><\/tr><\/table>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След петте части следва <strong>Финалният тест<\/strong> — сто въпроса от целия курс на един път, приблизително в реда, в който сте учили материала.<\/span> <span class=\"sg\" data-s=\"1\">Всеки отговор се проверява веднага, а накрая получавате своя резултат и връзка, която можете да запазите, за да я споделите или да прегледате какво сте пропуснали.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Шестата част, <strong>Приложението<\/strong>, е отделна сбирка от по-трудни и по-обемни упражнения, които се опират наведнъж на целия курс — практиката, към която посягате, когато основният материал е вече зад гърба ви.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Имайте предвид, че курсът все още се доизглажда, така че URL адресите на частите му може леко да се променят в бъдеще.<\/span> <span class=\"sg\" data-s=\"1\">В вече публикуваните теми може да се появят нови упражнения и тестове, а теоретичните части може да бъдат леко променени в името на по-добър ход на курса.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Какво ви трябва<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да следвате курса и да изпълнявате упражненията, ви е нужен работещ компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Има няколко възможности:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">— Опитайте вградената &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;Площадка на Raku&lt;/a&gt; направо в браузъра, без да инсталирате нищо, или<\/span><\/li><li><span class=\"sg\" data-s=\"1\">— Инсталирайте компилатора Rakudo, или<\/span><\/li><li><span class=\"sg\" data-s=\"2\">— Използвайте онлайн услуги, или<\/span><\/li><li><span class=\"sg\" data-s=\"3\">— Използвайте docker контейнери<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Различните начини за инсталиране са описани в началото на първата част.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За автора<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Курсът е написан от <a href=\"https://andrewshitov.com\" target=\"_blank\" rel=\"noopener\">Андрю Шитов<\/a>, който следи развитието на Raku приблизително от 2000 г. (когато езикът е бил известен като Perl 6).<\/span> <span class=\"sg\" data-s=\"1\">Той е автор на няколко <a href=\"https://andrewshitov.com/books\" target=\"_blank\" rel=\"noopener\">книги за програмиране на Raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Материалът на курса се опира на ежедневен опит, по-специално на участието в <a href=\"https://perlweeklychallenge.org\" target=\"_blank\" rel=\"noopener\">The Weekly Challenge<\/a> и прегледа на решенията на други участници, както и на опита от използването на Raku като основен език за сайта <a href=\"https://covid.observer\" target=\"_blank\" rel=\"noopener\">Covid Observer<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Участие, условия за ползване и обратна връзка<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Създаването на курса е подкрепено с грант от <a href=\"https://www.perlfoundation.org\" target=\"_blank\" rel=\"noopener\">The Perl &amp; Raku Foundation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Курсът може да се използва за самообучение или като готов набор от материали за обучение на други.<\/span> <span class=\"sg\" data-s=\"2\">Търговското използване в занятия е разрешено без отделно позволение.<\/span> <span class=\"sg\" data-s=\"3\">Издаването на курса като отделен продукт трябва предварително да се съгласува с автора.<\/sp
