vorm een oneindig aantal cijfers nodig zou hebben.<\/span><\/p>"]]},"es":{"t":"Números racionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los números racionales son una característica única de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tienen su propio tipo de dato, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por dentro, un número racional es una fracción.<\/span> <span class=\"sg\" data-s=\"1\">Tiene dos partes enteras, el numerador y el denominador.<\/span> <span class=\"sg\" data-s=\"2\">Esto significa que números como 1/3 se pueden guardar de forma exacta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hay varias formas de escribir un número <code>Rat<\/code> en un programa de Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Observa que aquí la barra es parte de la forma en que se escribe el número.<\/span> <span class=\"sg\" data-s=\"1\">No es un operador de división.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>1/2<\/code> no significa que divides 1 entre 2.<\/span> <span class=\"sg\" data-s=\"3\">Sin embargo, cuando imprimes números racionales, se ven como números decimales o enteros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Todo lo que va después del símbolo <code>#<\/code> en una línea es un comentario, que el compilador ignora.<\/span> <span class=\"sg\" data-s=\"1\">En este curso, usaremos estos comentarios para mostrar lo que imprime el programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimal<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Es importante entender esto.<\/span> <span class=\"sg\" data-s=\"1\">Si escribes un número en forma decimal, como <code>0.5<\/code>, Raku crea un número <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No es un entero, y tampoco es un número de punto flotante.<\/span> <span class=\"sg\" data-s=\"3\">En otros lenguajes, estos números se llaman <code>float<\/code> o <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">¡Sigue siendo un número racional!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mira el siguiente ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si un lenguaje usa aritmética de punto flotante aquí, el resultado no será 0.<\/span> <span class=\"sg\" data-s=\"1\">El sitio web <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> tiene una lista completa de ejemplos.<\/span> <span class=\"sg\" data-s=\"2\">En todos ellos, la aritmética de punto flotante no da el resultado esperado.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pero Raku imprime un <code>0<\/code> exacto.<\/span> <span class=\"sg\" data-s=\"1\">Esto es porque trata <code>0.1<\/code>, <code>0.2<\/code> y <code>0.3<\/code> como números racionales.<\/span> <span class=\"sg\" data-s=\"2\">Por dentro, los guarda como <code>1/10<\/code>, <code>2/10<\/code> y <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ejecútalo desde la línea de comandos para comprobarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Formas Unicode<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">También puedes usar caracteres Unicode para las fracciones, como <code>½<\/code>, <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probablemente no siempre son fáciles de escribir con el teclado.<\/span> <span class=\"sg\" data-s=\"2\">Pero estas fracciones son exactamente los mismos valores que sus versiones ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Esas versiones se pueden escribir como fracción o como número decimal:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para algunas fracciones, como <code>1/3<\/code>, tienes menos opciones: <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es porque la forma decimal necesitaría un número infinito de dígitos.<\/span><\/p>"]]},"it":{"t":"Numeri razionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I numeri razionali sono una caratteristica unica di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Hanno un loro tipo di dato, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Internamente, un numero razionale è una frazione.<\/span> <span class=\"sg\" data-s=\"1\">Ha due parti intere, il numeratore e il denominatore.<\/span> <span class=\"sg\" data-s=\"2\">Questo vuol dire che numeri come 1/3 si possono salvare in modo esatto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ci sono diversi modi per scrivere un numero <code>Rat<\/code> in un programma Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota che qui la barra fa parte del modo in cui si scrive il numero.<\/span> <span class=\"sg\" data-s=\"1\">Non è un operatore di divisione.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>1/2<\/code> non significa che dividi 1 per 2.<\/span> <span class=\"sg\" data-s=\"3\">Però, quando stampi i numeri razionali, sembrano numeri decimali o interi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tutto quello che c'è dopo il simbolo <code>#<\/code> su una riga è un commento, che il compilatore ignora.<\/span> <span class=\"sg\" data-s=\"1\">In questo corso, useremo questi commenti per mostrare che cosa stampa il programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">È importante capire questo.<\/span> <span class=\"sg\" data-s=\"1\">Se scrivi un numero in forma decimale, come <code>0.5<\/code>, Raku crea un numero <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Non è un intero, e non è nemmeno un numero a virgola mobile.<\/span> <span class=\"sg\" data-s=\"3\">In altri linguaggi, questi numeri si chiamano <code>float<\/code> o <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">È comunque un numero razionale!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dai un'occhiata al seguente esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se un linguaggio usa qui l'aritmetica a virgola mobile, il risultato non sarà 0.<\/span> <span class=\"sg\" data-s=\"1\">Il sito <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> ha una lista completa di esempi.<\/span> <span class=\"sg\" data-s=\"2\">In tutti questi esempi, l'aritmetica a virgola mobile non dà il risultato atteso.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ma Raku stampa uno <code>0<\/code> esatto.<\/span> <span class=\"sg\" data-s=\"1\">Questo succede perché tratta <code>0.1<\/code>, <code>0.2<\/code> e <code>0.3<\/code> come numeri razionali.<\/span> <span class=\"sg\" data-s=\"2\">Internamente, li tiene come <code>1/10<\/code>, <code>2/10<\/code> e <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Eseguilo dalla riga di comando per controllare:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forme Unicode<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi anche usare i caratteri Unicode per le frazioni, come <code>½<\/code>, <code>¼<\/code> o <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probabilmente non sono sempre facili da digitare con la tastiera.<\/span> <span class=\"sg\" data-s=\"2\">Ma queste frazioni hanno esattamente gli stessi valori delle loro versioni ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Queste si possono scrivere come frazione o come numero decimale:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per alcune frazioni, come <code>1/3<\/code>, hai meno scelte: <code>⅓<\/code> o <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché la forma decimale avrebbe bisogno di un numero infinito di cifre.<\/span><\/p>"]]},"lv":{"t":"Racionālie skaitļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Racionālie skaitļi ir unikāla Raku iezīme.<\/span> <span class=\"sg\" data-s=\"1\">Tiem ir savs datu tips — <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iekšēji racionāls skaitlis ir daļskaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir divas veselu skaitļu daļas — skaitītājs un saucējs.<\/span> <span class=\"sg\" data-s=\"2\">Tas nozīmē, ka tādus skaitļus kā 1/3 var saglabāt precīzi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ir vairāki veidi, kā Raku programmā uzrakstīt <code>Rat<\/code> skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka slīpsvītra šeit ir daļa no tā, kā skaitlis ir uzrakstīts.<\/span> <span class=\"sg\" data-s=\"1\">Tā nav dalīšanas operators.<\/span> <span class=\"sg\" data-s=\"2\">Tātad <code>1/2<\/code> nenozīmē, ka jūs dalāt 1 ar 2.<\/span> <span class=\"sg\" data-s=\"3\">Tomēr, kad jūs izdrukājat racionālus skaitļus, tie izskatās kā decimālskaitļi vai veseli skaitļi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Viss, kas rindā ir pēc simbola <code>#<\/code>, ir komentārs, ko kompilators ignorē.<\/span> <span class=\"sg\" data-s=\"1\">Šajā kursā mēs izmantosim šādus komentārus, lai parādītu, ko programma izdrukā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimāldaļas forma<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ir svarīgi to saprast.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs rakstāt skaitli decimāldaļas formā, piemēram, <code>0.5<\/code>, Raku izveido <code>Rat<\/code> skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav vesels skaitlis, un tas nav arī peldošā punkta skaitlis.<\/span> <span class=\"sg\" data-s=\"3\">Citās valodās tādus skaitļus sauc par <code>float<\/code> vai <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas joprojām ir racionāls skaitlis!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aplūkojiet šādu piemēru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja valoda šeit izmanto peldošā punkta aritmētiku, rezultāts nebūs 0.<\/span> <span class=\"sg\" data-s=\"1\">Vietnē <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> ir pilns piemēru saraksts.<\/span> <span class=\"sg\" data-s=\"2\">Visos tajos peldošā punkta aritmētika nedod gaidīto rezultātu.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bet Raku izdrukā precīzu <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka tas uztver <code>0.1<\/code>, <code>0.2<\/code> un <code>0.3<\/code> kā racionālus skaitļus.<\/span> <span class=\"sg\" data-s=\"2\">Iekšēji tas tos glabā kā <code>1/10<\/code>, <code>2/10<\/code> un <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Palaidiet to no komandrindas, lai to pārbaudītu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikoda formas<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot arī Unikoda rakstzīmes daļskaitļiem, piemēram, <code>½<\/code>, <code>¼<\/code> vai <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās droši vien ne vienmēr ir viegli ierakstīt ar tastatūru.<\/span> <span class=\"sg\" data-s=\"2\">Bet šie daļskaitļi ir tieši tādas pašas vērtības kā to ASCII versijas.<\/span> <span class=\"sg\" data-s=\"3\">Tās var uzrakstīt kā daļskaitli vai kā decimālskaitli:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažiem daļskaitļiem, piemēram, <code>1/3<\/code>, jums ir mazāk iespēju: <code>⅓<\/code> vai <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka decimāldaļas formai vajadzētu bezgalīgi daudz ciparu.<\/span><\/p>"]]},"ru":{"t":"Рациональные числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рациональные числа — это уникальная особенность Raku.<\/span> <span class=\"sg\" data-s=\"1\">У них есть свой собственный тип данных — <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри рациональное число — это дробь.<\/span> <span class=\"sg\" data-s=\"1\">У неё две целые части: числитель и знаменатель.<\/span> <span class=\"sg\" data-s=\"2\">Это значит, что числа вроде 1/3 можно хранить точно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Есть несколько способов записать число <code>Rat<\/code> в программе на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что косая черта здесь — это часть того, как записано число.<\/span> <span class=\"sg\" data-s=\"1\">Это не оператор деления.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>1/2<\/code> не означает, что вы делите 1 на 2.<\/span> <span class=\"sg\" data-s=\"3\">Однако когда вы печатаете рациональные числа, они выглядят как десятичные или целые числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всё, что стоит в строке после знака <code>#<\/code>, — это комментарий, и компилятор его игнорирует.<\/span> <span class=\"sg\" data-s=\"1\">В этом курсе мы будем использовать такие комментарии, чтобы показать, что выводит программа.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десятичная форма<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Это важно понимать.<\/span> <span class=\"sg\" data-s=\"1\">Если вы записываете число в десятичной форме, например <code>0.5<\/code>, Raku создаёт число <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это не целое число, но и не число с плавающей точкой.<\/span> <span class=\"sg\" data-s=\"3\">В других языках такие числа называются <code>float<\/code> или <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Это всё ещё рациональное число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на следующий пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если язык использует здесь арифметику с плавающей точкой, результат не будет равен 0.<\/span> <span class=\"sg\" data-s=\"1\">На сайте <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> есть полный список примеров.<\/span> <span class=\"sg\" data-s=\"2\">Во всех этих примерах арифметика с плавающей точкой не даёт ожидаемого результата.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Но Raku выводит ровно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что он считает <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> рациональными числами.<\/span> <span class=\"sg\" data-s=\"2\">Внутри он хранит их как <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Запустите это из командной строки, чтобы проверить:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для дробей можно также использовать символы Юникода, такие как <code>½<\/code>, <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наверное, их не всегда легко набрать на клавиатуре.<\/span> <span class=\"sg\" data-s=\"2\">Но эти дроби — точно такие же значения, как их версии в ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Версии в ASCII можно записать как дробь или как десятичное число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для некоторых дробей, таких как <code>1/3<\/code>, у вас меньше вариантов: <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что десятичной форме понадобилось бы бесконечное количество цифр.<\/span><\/p>"]]},"uk":{"t":"Раціональні числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Раціональні числа — унікальна особливість Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вони мають власний тип даних, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всередині раціональне число — це дріб.<\/span> <span class=\"sg\" data-s=\"1\">Він має дві цілі частини: чисельник і знаменник.<\/span> <span class=\"sg\" data-s=\"2\">Це означає, що числа на зразок 1/3 можна зберігати точно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Існує кілька способів записати число типу <code>Rat<\/code> у програмі на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що слеш тут є частиною того, як записано число.<\/span> <span class=\"sg\" data-s=\"1\">Це не оператор ділення.<\/span> <span class=\"sg\" data-s=\"2\">Тому <code>1/2<\/code> не означає, що ви ділите 1 на 2.<\/span> <span class=\"sg\" data-s=\"3\">Однак коли ви виводите раціональні числа, вони виглядають як десяткові або цілі числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усе, що стоїть у рядку після символу <code>#<\/code>, — це коментар, який компілятор ігнорує.<\/span> <span class=\"sg\" data-s=\"1\">У цьому курсі ми будемо використовувати такі коментарі, щоб показати, що виводить програма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десяткова форма<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Важливо це розуміти.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви записуєте число в десятковій формі, наприклад <code>0.5<\/code>, Raku створює число типу <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це не ціле число, але й не число з плаваючою комою.<\/span> <span class=\"sg\" data-s=\"3\">В інших мовах такі числа називаються <code>float<\/code> або <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це все одно раціональне число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Погляньте на наступний приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо мова використовує тут арифметику з плаваючою комою, результат не буде дорівнювати 0.<\/span> <span class=\"sg\" data-s=\"1\">На вебсайті <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> є повний список прикладів.<\/span> <span class=\"sg\" data-s=\"2\">У всіх них арифметика з плаваючою комою не дає очікуваного результату.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Але Raku виводить точний <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що він вважає <code>0.1<\/code>, <code>0.2<\/code> і <code>0.3<\/code> раціональними числами.<\/span> <span class=\"sg\" data-s=\"2\">Всередині він зберігає їх як <code>1/10<\/code>, <code>2/10<\/code> і <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Запустіть це з командного рядка, щоб перевірити:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні форми<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Також можна використовувати символи Unicode для дробів, такі як <code>½<\/code>, <code>¼<\/code> або <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Їх, мабуть, не завжди легко набрати на клавіатурі.<\/span> <span class=\"sg\" data-s=\"2\">Але ці дроби — точно такі самі значення, як їхні ASCII версії.<\/span> <span class=\"sg\" data-s=\"3\">Ці версії можна записати як дріб або як десяткове число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для деяких дробів, таких як <code>1/3<\/code>, у вас менше варіантів: <code>⅓<\/code> або <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що десяткова форма потребувала б нескінченної кількості цифр.<\/span><\/p>"]]},"bg":{"t":"Рационални числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рационалните числа са уникална особеност на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Те имат свой собствен тип данни, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вътрешно рационалното число е дроб.<\/span> <span class=\"sg\" data-s=\"1\">Тя има две цели части, числител и знаменател.<\/span> <span class=\"sg\" data-s=\"2\">Това означава, че числа като 1/3 могат да се пазят точно.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Има няколко начина да запишете число <code>Rat<\/code> в програма на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Забележете, че наклонената черта тук е част от начина, по който се записва числото.<\/span> <span class=\"sg\" data-s=\"1\">Тя не е оператор за деление.<\/span> <span class=\"sg\" data-s=\"2\">Така че <code>1/2<\/code> не означава, че делите 1 на 2.<\/span> <span class=\"sg\" data-s=\"3\">Когато обаче отпечатвате рационални числа, те изглеждат като десетични или цели числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всичко след символа <code>#<\/code> на реда е коментар, който компилаторът пропуска.<\/span> <span class=\"sg\" data-s=\"1\">В този курс ще използваме такива коментари, за да показваме какво отпечатва програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Десетична форма<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Важно е да разберете следното.<\/span> <span class=\"sg\" data-s=\"1\">Ако запишете число в десетична форма, като <code>0.5<\/code>, Raku създава число <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">То не е цяло число, но не е и число с плаваща запетая.<\/span> <span class=\"sg\" data-s=\"3\">В други езици такива числа се наричат <code>float<\/code> или <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">То пак е рационално число!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте следния пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако един език използва тук аритметика с плаваща запетая, резултатът няма да е 0.<\/span> <span class=\"sg\" data-s=\"1\">Сайтът <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> има пълен списък с примери.<\/span> <span class=\"sg\" data-s=\"2\">Във всички тях аритметиката с плаваща запетая не дава очаквания резултат.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Но Raku отпечатва точно <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е така, защото той смята <code>0.1<\/code>, <code>0.2<\/code> и <code>0.3<\/code> за рационални числа.<\/span> <span class=\"sg\" data-s=\"2\">Вътрешно той ги пази като <code>1/10<\/code>, <code>2/10<\/code> и <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Стартирайте го от командния ред, за да проверите това:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode форми<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете също да използвате Unicode символи за дроби, като <code>½<\/code>, <code>¼<\/code> или <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вероятно не винаги е лесно да ги въведете от клавиатурата.<\/span> <span class=\"sg\" data-s=\"2\">Но тези дроби са точно същите стойности като техните ASCII версии.<\/span> <span class=\"sg\" data-s=\"3\">Тях можете да запишете като дроб или като десетично число:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За някои дроби, като <code>1/3<\/code>, имате по-малко възможности: <code>⅓<\/code> или <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е така, защото десетичната форма би изисквала безкраен брой цифри.<\/span><\/p>"]]},"eo":{"t":"Raciaj nombroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raciaj nombroj estas unika trajto de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ili havas sian propran datumtipon, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interne, racia nombro estas frakcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas du entjerajn partojn, la numeratoron kaj la denominatoron.<\/span> <span class=\"sg\" data-s=\"2\">Tio signifas, ke nombroj kiel 1/3 povas esti konservataj ekzakte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas pluraj manieroj skribi <code>Rat<\/code> nombron en Raku-programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la oblikva streko ĉi tie estas parto de la maniero, kiel la nombro estas skribita.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne estas dividoperatoro.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>1/2<\/code> ne signifas, ke vi dividas 1 per 2.<\/span> <span class=\"sg\" data-s=\"3\">Tamen, kiam vi presas raciajn nombrojn, ili aspektas kiel decimalaj nombroj aŭ entjeroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉio post la simbolo <code>#<\/code> en linio estas komento, kiun la kompililo ignoras.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kurso, ni uzos tiajn komentojn por montri, kion la programo presas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Decimala formo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Estas grave kompreni tion.<\/span> <span class=\"sg\" data-s=\"1\">Se vi skribas nombron en decimala formo, kiel <code>0.5<\/code>, Raku kreas <code>Rat<\/code> nombron.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne estas entjero, kaj ĝi ankaŭ ne estas glitkoma nombro.<\/span> <span class=\"sg\" data-s=\"3\">En aliaj lingvoj, tiaj nombroj nomiĝas <code>float<\/code> aŭ <code>double<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi tamen estas racia nombro!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rigardu la sekvan ekzemplon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se lingvo uzas glitkoman aritmetikon ĉi tie, la rezulto ne estos 0.<\/span> <span class=\"sg\" data-s=\"1\">La retejo <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> havas plenan liston de ekzemploj.<\/span> <span class=\"sg\" data-s=\"2\">En ĉiuj el ili, glitkoma aritmetiko ne donas la atendatan rezulton.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sed Raku presas ekzaktan <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar ĝi traktas <code>0.1<\/code>, <code>0.2<\/code> kaj <code>0.3<\/code> kiel raciajn nombrojn.<\/span> <span class=\"sg\" data-s=\"2\">Interne, ĝi tenas ilin kiel <code>1/10<\/code>, <code>2/10<\/code> kaj <code>3/10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Rulu ĝin de la komandlinio por kontroli tion:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj formoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas uzi Unikodajn karakterojn por frakcioj, kiel <code>½<\/code>, <code>¼<\/code> aŭ <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Verŝajne ne ĉiam estas facile tajpi ilin per klavaro.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĉi tiuj frakcioj estas ekzakte la samaj valoroj kiel iliaj ASCII-versioj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas skribi tiujn kiel frakcion aŭ kiel decimalan nombron:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por iuj frakcioj, kiel <code>1/3<\/code>, vi havas malpli da elektoj: <code>⅓<\/code> aŭ <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar la decimala formo bezonus senfinan nombron da ciferoj.<\/span><\/p>"]]},"la":{"t":"Numeri rationales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeri rationales sunt proprietas singularis Raku.<\/span> <span class=\"sg\" data-s=\"1\">Proprium typum datae habent, <code>Rat<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intus numerus rationalis est fractio.<\/span> <span class=\"sg\" data-s=\"1\">Duas partes integras habet, numeratorem et denominatorem.<\/span> <span class=\"sg\" data-s=\"2\">Hoc significat numeros ut 1/3 exacte servari posse.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sunt aliquot modi ad numerum <code>Rat<\/code> in programmate Raku scribendum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1/2;\nmy $y = &lt;2/3&gt;;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota virgulam hic esse partem modi quo numerus scribitur.<\/span> <span class=\"sg\" data-s=\"1\">Non est operator divisionis.<\/span> <span class=\"sg\" data-s=\"2\">Ita <code>1/2<\/code> non significat te 1 per 2 dividere.<\/span> <span class=\"sg\" data-s=\"3\">Tamen, cum numeros rationales imprimis, ut numeri decimales vel integri videntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1/2; # 0.5\nsay 3/4; # 0.75<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quidquid in linea post symbolum <code>#<\/code> est, commentarium est, quod compilator ignorat.<\/span> <span class=\"sg\" data-s=\"1\">In hoc cursu talibus commentariis utemur, ut ostendamus quid programma imprimat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma decimale<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc intellegere gravissimum est.<\/span> <span class=\"sg\" data-s=\"1\">Si numerum in forma decimali scribis, ut <code>0.5<\/code>, Raku numerum <code>Rat<\/code> creat.<\/span> <span class=\"sg\" data-s=\"2\">Non est integer, nec est numerus puncti fluitantis.<\/span> <span class=\"sg\" data-s=\"3\">In aliis linguis tales numeri <code>float<\/code> vel <code>double<\/code> vocantur.<\/span> <span class=\"sg\" data-s=\"4\">Adhuc est numerus rationalis!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Considera sequens exemplum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 0.1 + 0.2 - 0.3;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si lingua hic arithmeticam puncti fluitantis adhibet, eventus non erit 0.<\/span> <span class=\"sg\" data-s=\"1\">Situs interretialis <a href=\"https://0.30000000000000004.com\" target=\"_blank\" rel=\"noopener\">0.30000000000000004.com<\/a> plenum indicem exemplorum habet.<\/span> <span class=\"sg\" data-s=\"2\">In omnibus eis arithmetica puncti fluitantis eventum exspectatum non dat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sed Raku exactum <code>0<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit quia <code>0.1<\/code>, <code>0.2<\/code> et <code>0.3<\/code> ut numeros rationales tractat.<\/span> <span class=\"sg\" data-s=\"2\">Intus eos ut <code>1/10<\/code>, <code>2/10<\/code> et <code>3/10<\/code> servat.<\/span> <span class=\"sg\" data-s=\"3\">Id ex linea mandatorum exsequere, ut hoc probes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -e 'say 0.1 + 0.2 - 0.3'\n0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Forma Unicode<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Etiam characteribus Unicode pro fractionibus uti potes, ut <code>½<\/code>, <code>¼<\/code> vel <code>¾<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probabiliter non semper facile est eos in claviatura scribere.<\/span> <span class=\"sg\" data-s=\"2\">Sed hae fractiones prorsus idem valent ac versiones earum ASCII.<\/span> <span class=\"sg\" data-s=\"3\">Has ut fractionem vel ut numerum decimalem scribere potes:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>½<\/code> | <code>1/2<\/code> | <code>&lt;1/2&gt;<\/code> | <code>0.5<\/code> <code>¼<\/code> | <code>1/4<\/code> | <code>&lt;1/4&gt;<\/code> | <code>0.25<\/code> <code>¾<\/code> | <code>3/4<\/code> | <code>&lt;3/4&gt;<\/code> | <code>0.75<\/code><\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro quibusdam fractionibus, ut <code>1/3<\/code>, pauciores optiones habes: <code>⅓<\/code> vel <code>&lt;1/3&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Causa est quod forma decimalis infinitum numerum digitorum requireret.<\/span><\/p>"]]}}}</script>
