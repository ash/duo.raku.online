roj preter la limoj de 32 aŭ 64 bitoj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sekva programo estas ĝusta.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi multiplikas du grandajn entjerojn kaj presas la ĝustan rezulton.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_234_456_789_012_345_678_901 * 987_654_321_098_765_432_100;<\/code><\/pre>"]]},"la":{"t":"Numeri integri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Typus datorum <code>Int<\/code> est pro numeris integris, id est numeris sine fractionibus.<\/span> <span class=\"sg\" data-s=\"1\">Positivi vel negativi esse possunt.<\/span> <span class=\"sg\" data-s=\"2\">Signum <code>+<\/code> addere potes, si vis.<\/span> <span class=\"sg\" data-s=\"3\">Hic sunt pauca exempla manifesta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>42\n-42\n100\n-5\n0<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ita, per defaltam Raku simplicem <code>0<\/code> ut integrum tractat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Greges digitorum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku venustam proprietatem habet quae te adiuvat numeros magnos scribere.<\/span> <span class=\"sg\" data-s=\"1\">Digitos in greges milium dividere potes, ut facilius legantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1_000_000\n-3_141_592<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Numerum ut <code>34_56<\/code> facere potes, sed melius est id vitare.<\/span> <span class=\"sg\" data-s=\"1\">Hoc alios qui codicem tuum legunt confundere potest.<\/span> <span class=\"sg\" data-s=\"2\">Sed duos underscores iuxta ponere non potes.<\/span> <span class=\"sg\" data-s=\"3\">Etiam numerus cum underscore incipere vel finire non potest.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri integri omnis longitudinis<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku nullum problema habet cum numeris ultra limites 32-bitarum vel 6
