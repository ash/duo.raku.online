a cosa di:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"lv":{"t":"Operācijas ar skaitļiem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs noteikti jau zināt dažas operācijas ar skaitļiem Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tikai pieminēsim, ka <em>operācijas<\/em> simbolu sauc par <em>operatoru<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Objektus, ar kuriem operācija strādā, sauc par <em>operandiem<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aritmētika<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operators<\/strong> | <strong>Operācija<\/strong> <code>+<\/code> | Saskaitīšana <code>-<\/code> | Atņemšana <code>*<\/code> | Reizināšana <code>/<\/code> | Dalīšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā Raku <a href=\"https://course.raku.org/lv/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">ļoti labi atbalsta Unicode<\/a>, dažiem no šiem operatoriem ir arī ne-ASCII versijas:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Reizināšana <code>÷<\/code> | Dalīšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai mainītu secību, kādā tiek veiktas operācijas, izmantojiet iekavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā daudzās citās valodās, moduļa operators ir <code>%<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulis<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tas atgriež divu skaitļu veselā dalījuma atlikumu, tāpēc <code>10 % 3<\/code> ir <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet vērā, ka <code>-10 % 3<\/code> ir <code>2<\/code>, jo šī operācija ir definēta tieši tā.<\/span> <span class=\"sg\" data-s=\"2\">Dalījuma rezultātu noapaļo uz leju un sareizina ar otro skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Tad šo vērtību atņem no pirmā skaitļa.<\/span> <span class=\"sg\" data-s=\"4\">Tātad <code>$a % $b<\/code> nozīmē to pašu, ko <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dalāmība<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku pievieno vēl vienu noderīgu operatoru.<\/span> <span class=\"sg\" data-s=\"1\">Tas pārbauda, vai viens skaitlis ir dalāms ar citu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Dalāmība<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas ir infiksu operators: tas atrodas starp saviem diviem operandiem, kā <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja pirmais operands ir dalāms ar otro, jūs saņemat Būla <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pretējā gadījumā jūs saņemat <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Veselo skaitļu operācijas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažas īpašas operācijas atgriež veselus skaitļus kā rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">To operatori ir vārdi, nevis simboli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Veselo skaitļu dalīšana <code>mod<\/code> | Veselo skaitļu modulis<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operators <code>div<\/code> noapaļo rezultātu uz leju.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>10 div 3<\/code> ir <code>3<\/code>, un <code>-10 div 3<\/code> ir <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gan <code>div<\/code>, gan <code>mod<\/code> sagaida veselu skaitļu operandus.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc programma zemāk nedarbosies, ja jūs atkomentēsiet rindas, kas atzīmētas kā <code>Kļūda<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Kļūda\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Kļūda<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pakāpe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat iegūt <em>x<\/em> pakāpē <em>y<\/em> divos veidos.<\/span> <span class=\"sg\" data-s=\"1\">Pirmkārt, jūs varat izmantot operatoru <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otrkārt, jūs varat izmantot augšraksta ciparus, tas ir, mazus paceltus ciparus.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot vairāk nekā vienu augšraksta ciparu, lai iegūtu pakāpi, kas lielāka par 9.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arī negatīvas pakāpes nav problēma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka pēdējās divās izteiksmēs rezultāts ir <code>Rat<\/code> skaitlis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operācijas ar piešķiršanu<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jums vajag atjaunināt mainīgo, visām operācijām ir īsa forma.<\/span> <span class=\"sg\" data-s=\"1\">Parādīsim to ar <code>+<\/code> piemēru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pilnā forma<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">nozīmē to pašu, ko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"uk":{"t":"Операції з числами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви, напевно, вже знаєте деякі операції з числами в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Просто зазначимо, що символ <em>операції<\/em> називається <em>оператором<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Об'єкти, з якими працює операція, називаються <em>операндами<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операція<\/strong> <code>+<\/code> | Додавання <code>-<\/code> | Віднімання <code>*<\/code> | Множення <code>/<\/code> | Ділення<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки Raku дуже добре <a href=\"https://course.raku.org/uk/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">підтримує Unicode<\/a>, деякі з цих операторів мають також не-ASCII версії:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Множення <code>÷<\/code> | Ділення<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб змінити порядок, у якому виконуються операції, використовуйте дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модуль<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і в багатьох інших мовах, оператор модуля — це <code>%<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Модуль<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Він повертає залишок від цілочисельного ділення двох чисел, тому <code>10 % 3<\/code> дорівнює <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що <code>-10 % 3<\/code> дорівнює <code>2<\/code> через те, як визначена ця операція.<\/span> <span class=\"sg\" data-s=\"2\">Результат ділення округлюється вниз і множиться на друге число.<\/span> <span class=\"sg\" data-s=\"3\">Потім це значення віднімається від першого числа.<\/span> <span class=\"sg\" data-s=\"4\">Тож <code>$a % $b<\/code> означає те саме, що <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кратність<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku додає ще один корисний оператор.<\/span> <span class=\"sg\" data-s=\"1\">Він перевіряє, чи ділиться одне число на інше.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Кратність<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це інфіксний оператор: він стоїть між двома операндами, як у <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо перший операнд ділиться на другий, ви отримуєте булеве <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Інакше ви отримуєте <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цілі операції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі спеціальні операції повертають цілі числа як результат.<\/span> <span class=\"sg\" data-s=\"1\">Їхні оператори — це слова, а не символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Ціле ділення <code>mod<\/code> | Цілий модуль<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>div<\/code> округлює результат вниз.<\/span> <span class=\"sg\" data-s=\"1\">Тому <code>10 div 3<\/code> дорівнює <code>3<\/code>, а <code>-10 div 3<\/code> дорівнює <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">І <code>div<\/code>, і <code>mod<\/code> очікують цілих операндів.<\/span> <span class=\"sg\" data-s=\"1\">Тому програма нижче не працюватиме, якщо розкоментувати рядки з позначкою <code>Error<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Степінь<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Піднести <em>x<\/em> до степеня <em>y<\/em> можна двома способами.<\/span> <span class=\"sg\" data-s=\"1\">По-перше, можна використати оператор <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По-друге, можна використати надрядкові цифри, тобто маленькі підняті цифри.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна використати більше однієї надрядкової цифри, щоб отримати степінь, більший за 9.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Від'ємні степені теж не проблема:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що в останніх двох виразах результат — число типу <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Операції з присвоєнням<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли потрібно оновити змінну, усі операції мають коротку форму.<\/span> <span class=\"sg\" data-s=\"1\">Покажемо це на прикладі <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повна форма<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">означає те саме, що:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"bg":{"t":"Операции с числа","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Със сигурност вече знаете някои от операциите с числа в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Нека само споменем, че символът на <em>операцията<\/em> се нарича <em>оператор<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Обектите, с които работи една операция, се наричат <em>операнди<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Арифметика<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Оператор<\/strong> | <strong>Операция<\/strong> <code>+<\/code> | Събиране <code>-<\/code> | Изваждане <code>*<\/code> | Умножение <code>/<\/code> | Деление<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като Raku <a href=\"https://course.raku.org/bg/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">поддържа Unicode<\/a> много добре, някои от тези оператори имат и не-ASCII версии:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Умножение <code>÷<\/code> | Деление<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да промените реда, в който се изпълняват операциите, използвайте скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модуло<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както в много други езици, операторът за модуло е <code>%<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Модуло<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Той връща остатъка от целочисленото деление на две числа, така че <code>10 % 3<\/code> е <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че <code>-10 % 3<\/code> е <code>2<\/code> заради начина, по който е определена операцията.<\/span> <span class=\"sg\" data-s=\"2\">Резултатът от делението се закръгля надолу и се умножава по второто число.<\/span> <span class=\"sg\" data-s=\"3\">След това тази стойност се изважда от първото число.<\/span> <span class=\"sg\" data-s=\"4\">Така <code>$a % $b<\/code> означава същото като <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Делимост<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Dividebleco<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas infiksa operaciilo: ĝi staras inter siaj du operandoj, kiel en <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se la unua operando estas dividebla per la dua, vi ricevas la Boolean valoron <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Alie, vi ricevas <code>False<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entjeraj operacioj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iuj specialaj operacioj redonas entjerojn kiel rezultojn.<\/span> <span class=\"sg\" data-s=\"1\">Iliaj operaciiloj estas vortoj anstataŭ simboloj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Entjera divido <code>mod<\/code> | Entjera modulo<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La operaciilo <code>div<\/code> rondigas la rezulton malsupren.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>10 div 3<\/code> estas <code>3<\/code>, kaj <code>-10 div 3<\/code> estas <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>div<\/code> kaj <code>mod<\/code> atendas entjerajn operandojn.<\/span> <span class=\"sg\" data-s=\"1\">Do la programo sube ne funkcios, se vi malkomentas la liniojn markitajn <code>Eraro<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# say 10.3 mod 3; # Eraro\n\nsay 10.3 / 3.3;     # OK\n# say 10.3 div 3.3; # Eraro<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Potenco<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas ricevi <em>x<\/em> al la potenco de <em>y<\/em> en du manieroj.<\/span> <span class=\"sg\" data-s=\"1\">Unue, vi povas uzi la operaciilon <code>**<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Due, vi povas uzi superskribitajn ciferojn, tio estas, malgrandajn levitajn ciferojn.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi pli ol unu superskribitan ciferon por ricevi potencon pli grandan ol 9.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ankaŭ negativaj potencoj ne estas problemo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke en la lastaj du esprimoj, la rezulto estas <code>Rat<\/code> nombro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operacioj kun asigno<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi bezonas ĝisdatigi variablon, ĉiuj operacioj havas mallongan formon.<\/span> <span class=\"sg\" data-s=\"1\">Ni montru ĝin per la ekzemplo de <code>+<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plena formo<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">signifas la samon kiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]},"la":{"t":"Operationes cum numeris","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Certe iam quasdam operationes cum numeris in Raku scis.<\/span> <span class=\"sg\" data-s=\"1\">Modo dicamus symbolum <em>operationis<\/em> <em>operator<\/em> vocari.<\/span> <span class=\"sg\" data-s=\"2\">Obiecta in quibus operatio agit <em>operandi<\/em> vocantur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Arithmetic<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><strong>Operator<\/strong> | <strong>Operatio<\/strong> <code>+<\/code> | Additio <code>-<\/code> | Subtractio <code>*<\/code> | Multiplicatio <code>/<\/code> | Divisio<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia Raku <a href=\"https://course.raku.org/la/essentials/on-unicode/\" target=\"_blank\" rel=\"noopener\">Unicode optime sustinet<\/a>, quidam ex his operatoribus etiam versiones non-ASCII habent:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>×<\/code> | Multiplicatio <code>÷<\/code> | Divisio<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut ordinem mutes quo operationes fiunt, parenthesibus utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 * 4 + 5;   # 17\nsay 3 * (4 + 5); # 27<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modulo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut in multis aliis linguis, operator modulo est <code>%<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%<\/code> | Modulo<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Reddit reliquum divisionis integrae duorum numerorum, ita <code>10 % 3<\/code> est <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota <code>-10 % 3<\/code> esse <code>2<\/code>, propter modum quo operatio definitur.<\/span> <span class=\"sg\" data-s=\"2\">Eventus divisionis deorsum rotundatur et per secundum numerum multiplicatur.<\/span> <span class=\"sg\" data-s=\"3\">Deinde hic valor a primo numero subtrahitur.<\/span> <span class=\"sg\" data-s=\"4\">Ita <code>$a % $b<\/code> idem significat ac <code>$a - $b * floor($a / $b)<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Divisibilitas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku unum alium operatorem utilem addit.<\/span> <span class=\"sg\" data-s=\"1\">Probat an unus numerus per alium divisibilis sit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>%%<\/code> | Divisibilitas<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic est operator infixus: inter duos operandos stat, ut in <code>10 %% 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si primus operandus per secundum divisibilis est, Booleanum <code>True<\/code> accipis.<\/span> <span class=\"sg\" data-s=\"2\">Alioquin, <code>False<\/code> accipis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operationes Integrae<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaedam operationes speciales numeros integros ut exitus reddunt.<\/span> <span class=\"sg\" data-s=\"1\">Operatores earum sunt verba potius quam symbola.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>div<\/code> | Divisio integra <code>mod<\/code> | Modulo integer<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator <code>div<\/code> eventum deorsum rotundat.<\/span> <span class=\"sg\" data-s=\"1\">Ita <code>10 div 3<\/code> est <code>3<\/code>, et <code>-10 div 3<\/code> est <code>-4<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Et <code>div<\/code> et <code>mod<\/code> operandos integros exspectant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque programma infra non operabitur, si lineas notatas <code>Error<\/code> uncommentaveris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10.3 % 3;     # OK\n# dic 10.3 mod 3; # Error\n\nsay 10.3 / 3.3;     # OK\n# dic 10.3 div 3.3; # Error<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Potentia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>x<\/em> ad potentiam <em>y<\/em> duobus modis obtinere potes.<\/span> <span class=\"sg\" data-s=\"1\">Primum, operatore <code>**<\/code> uti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 ** 4; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secundum, digitis superscriptis uti potes, id est parvis digitis elatis.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3⁴; # 81<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plures quam unum digitum superscriptum adhibere potes, ut potentiam maiorem quam 9 obtineas.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2¹⁵; # 32768<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nec potentiae negativae problema sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** (-2); ## 0.25\nsay 2⁻²; # 0.25<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota: in duabus ultimis expressionibus eventus est numerus <code>Rat<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Operationes cum assignatione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum variabilem renovare debes, omnes operationes formam brevem habent.<\/span> <span class=\"sg\" data-s=\"1\">Eam exemplo <code>+<\/code> demonstremus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Forma plena<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a = $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">idem significat ac:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a += $b;<\/code><\/pre>"]]}}}</script>
