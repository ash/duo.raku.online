sg\" data-s=\"4\">Non hai bisogno di spiegazioni o istruzioni per queste cose.<\/span> <span class=\"sg\" data-s=\"5\">Quindi concentriamoci su ciò che rende speciali i numeri in Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esplora i seguenti argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano le differenze più importanti nel modo in cui Raku tratta i numeri rispetto ad altri linguaggi.<\/span><\/p>"]]},"lv":{"t":"Skaitļi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Parunāsim par skaitļiem.<\/span> <span class=\"sg\" data-s=\"1\">Mēs jau nedaudz tos izmantojām iepriekšējās sadaļās un uzdevumos.<\/span> <span class=\"sg\" data-s=\"2\">Bet vēl ir ko teikt.<\/span> <span class=\"sg\" data-s=\"3\">Protams, dažas lietas par skaitļiem Raku valodā ir acīmredzamas.<\/span> <span class=\"sg\" data-s=\"4\">Tām jums nav vajadzīgi nekādi paskaidrojumi vai instrukcijas.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc pievērsīsimies tam, kas padara skaitļus īpašus Raku valodā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izpētiet šīs tēmas.<\/span> <span class=\"sg\" data-s=\"1\">Tās parāda svarīgākās atšķirības, kā Raku apstrādā skaitļus salīdzinājumā ar citām valodām.<\/span><\/p>"]]},"ru":{"t":"Числа","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Давайте поговорим о числах.<\/span> <span class=\"sg\" data-s=\"1\">Мы уже немного использовали их в предыдущих главах и упражнениях.<\/span> <span class=\"sg\" data-s=\"2\">Но о них ещё есть что сказать.<\/span> <span class=\"sg\" data-s=\"3\">Конечно, некоторые вещи о числах в Raku очевидны.<\/span> <span class=\"sg\" data-s=\"4\">Для них вам не нужны никакие объяснения или указания.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому давайте сосредоточимся на том, что делает числа в Raku особенными.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изучите следующие темы.<\/span> <span class=\"sg\" data-s=\"1\">Они показывают самые важные отличия в том, как Raku работает с числами, по сравнению с другими языками.<\/span><\/p>"]]},"uk":{"t":"Числа","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Давайте поговоримо про числа.<\/span> <span class=\"sg\" data-s=\"1\">Ми вже трохи використовували їх у попередніх розділах і вправах.<\/span> <span class=\"sg\" data-s=\"2\">Але про них ще є що сказати.<\/span> <span class=\"sg\" data-s=\"3\">Звісно, деякі речі про числа в Raku очевидні.<\/span> <span class=\"sg\" data-s=\"4\">Для них не потрібні жодні пояснення чи інструкції.<\/span> <span class=\"sg\" data-s=\"5\">Тож давайте зосередимося на тому, що робить числа в Raku особливими.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перегляньте наступні теми.<\/span> <span class=\"sg\" data-s=\"1\">Вони показують найважливіші відмінності в тому, як Raku працює з числами порівняно з іншими мовами.<\/span><\/p>"]]},"bg":{"t":"Числа","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Нека поговорим за числата.<\/span> <span class=\"sg\" data-s=\"1\">Вече ги използвахме малко в предишните секции и упражнения.<\/span> <span class=\"sg\" data-s=\"2\">Но все още има какво да се каже.<\/span> <span class=\"sg\" data-s=\"3\">Разбира се, някои неща за числата в Raku са очевидни.<\/span> <span class=\"sg\" data-s=\"4\">За тях не ви трябват никакви обяснения или инструкции.<\/span> <span class=\"sg\" data-s=\"5\">Така че нека се фокусираме върху това, което прави числата специални в Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разгледайте следните теми.<\/span> <span class=\"sg\" data-s=\"1\">Те показват най-важните разлики в това как Raku работи с числата в сравнение с други езици.<\/span><\/p>"]]},"eo":{"t":"Nombroj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ni parolu pri nombroj.<\/span> <span class=\"sg\" data-s=\"1\">Ni jam iom uzis ilin en la antaŭaj sekcioj kaj ekzercoj.<\/span> <span class=\"sg\" data-s=\"2\">Sed ankoraŭ estas pli por diri.<\/span> <span class=\"sg\" data-s=\"3\">Kompreneble, iuj aferoj pri nombroj en Raku estas evidentaj.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne bezonas klarigojn aŭ instrukciojn por ili.<\/span> <span class=\"sg\" data-s=\"5\">Do ni koncentriĝu pri tio, kio faras nombrojn specialaj en Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esploru la jenajn temojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili montras la plej gravajn diferencojn en tio, kiel Raku traktas nombrojn kompare kun aliaj lingvoj.<\/span><\/p>"]]},"la":{"t":"Numeri","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De numeris loquamur.<\/span> <span class=\"sg\" data-s=\"1\">Iam eos paulum in sectionibus et exercitationibus praecedentibus adhibuimus.<\/span> <span class=\"sg\" data-s=\"2\">Sed adhuc plura dicenda sunt.<\/span> <span class=\"sg\" data-s=\"3\">Scilicet, quaedam de numeris in Raku manifesta sunt.<\/span> <span class=\"sg\" data-s=\"4\">Pro eis nullas explicationes vel instructiones requiris.<\/span> <span class=\"sg\" data-s=\"5\">Itaque de eo cogitemus quod numeros in Raku speciales facit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Explora sequentia argumenta.<\/span> <span class=\"sg\" data-s=\"1\">Ostendunt maximas differentias inter Raku et alias linguas in modo quo numeros tractant.<\/span><\/p>"]]}}}</script>
