aku пишуть як звичайний текст.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай їх зберігають у текстових файлах.<\/span> <span class=\"sg\" data-s=\"2\">Винятки — це програми, які ви запускаєте онлайн або в командному рядку.<\/span> <span class=\"sg\" data-s=\"3\">Ще один виняток — код, який ви готуєте до запуску через <code>EVAL<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Є також кілька інших рідкісних випадків.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вихідний код програми має бути текстом у кодуванні UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">Тож підійде будь-який текстовий редактор, якщо він не зберігає форматування.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете спокійно користуватися <code>vim<\/code>, <code>nano<\/code>, <code>emacs<\/code> або <code>mcedit<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Але, можливо, ви захочете спробувати кілька популярних нових програм.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось посилання на популярні IDE.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a> — доступний для Windows, Mac OS та Linux<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://commaide.com\" target=\"_blank\" rel=\"noopener\">Comma<\/a> — IDE для Raku, створений спеціально для програмування на Raku. Він доступний для Windows, Mac OS та Linux.<\/span><\/li><\/ul>"]]},"bg":{"t":"Редактори и IDE","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Програмите на Raku се пишат като обикновен текст.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено се пазят в текстови файлове.<\/span> <span class=\"sg\" data-s=\"2\">Изключение са програмите, които изпълнявате онлайн или в командния ред.<\/span> <span class=\"sg\" data-s=\"3\">Друго изключение е код, който подготвяте за изпълнение с <code>EVAL<\/code>.<\/s
