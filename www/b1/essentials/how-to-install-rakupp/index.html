<script type="application/json" id="page-data">{"u":"essentials/how-to-install-rakupp","n":7,"k":"section","pv":"essentials/the-rakupp-compiler","nx":"essentials/the-mutsu-interpreter","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"How to install Raku++","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ is available on its website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You can also get it from its GitHub repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">When you install it, you get a single executable file called <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nothing else needs to be set up, as Raku++ has no separate virtual machine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The installer<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">On macOS, Linux and the BSDs, one command does everything.<\/span> <span class=\"sg\" data-s=\"1\">It downloads the build for your machine and checks it.<\/span> <span class=\"sg\" data-s=\"2\">Then it puts <code>rakupp<\/code> on your <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">You do not need administrator rights for it:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">On Windows, use a PowerShell window instead.<\/span> <span class=\"sg\" data-s=\"1\">You can also use the setup wizard, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is on the releases page of the repository.<\/span> <span class=\"sg\" data-s=\"3\">In PowerShell, run this:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The installer asks whether you also want Raku++ under the name <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Afterwards, open a new terminal so that the new <code>PATH<\/code> starts working.<\/span> <span class=\"sg\" data-s=\"2\">Later, <code>rakupp upgrade<\/code> replaces it with the newest release.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other ways to install<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">On macOS, with Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">With Docker, you do not have to install anything: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> starts the interactive REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Ready-made archives for each platform are on the releases page of the repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ is written in C++. So you can also build it yourself from the source code. The repository explains which tools you need.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Version numbers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>--version<\/code> option shows which version you have:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The line shows the release of Raku++ itself, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It also shows the build date and the platform for the binary.<\/span> <span class=\"sg\" data-s=\"2\">The version of the Raku language is a separate thing.<\/span> <span class=\"sg\" data-s=\"3\">You can ask the language itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Compare this with the Rakudo version message on the <a href=\"/essentials/how-to-install-rakudo/\">Rakudo installation page<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Then you can see how the two compilers report themselves.<\/span><\/p>"]]},"de":{"t":"Wie man Raku++ installiert","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ gibt es auf seiner Website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können ihn auch aus seinem GitHub-Repository holen, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie ihn installieren, bekommen Sie eine einzige ausführbare Datei namens <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sonst müssen Sie nichts einrichten, denn Raku++ hat keine eigene virtuelle Maschine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das Installationsprogramm<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unter macOS, Linux und den BSD-Systemen erledigt ein einziger Befehl alles.<\/span> <span class=\"sg\" data-s=\"1\">Er lädt den Build für Ihren Rechner herunter und prüft ihn.<\/span> <span class=\"sg\" data-s=\"2\">Dann fügt er <code>rakupp<\/code> zu Ihrem <code>PATH<\/code> hinzu.<\/span> <span class=\"sg\" data-s=\"3\">Sie brauchen dafür keine Administratorrechte:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unter Windows verwenden Sie stattdessen ein PowerShell-Fenster.<\/span> <span class=\"sg\" data-s=\"1\">Sie können auch den Installationsassistenten verwenden, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er liegt auf der Releases-Seite des Repositorys.<\/span> <span class=\"sg\" data-s=\"3\">Führen Sie in PowerShell Folgendes aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Installationsprogramm fragt, ob Sie Raku++ auch unter dem Namen <code>raku<\/code> haben möchten.<\/span> <span class=\"sg\" data-s=\"1\">Öffnen Sie danach ein neues Terminal, damit der neue <code>PATH<\/code> funktioniert.<\/span> <span class=\"sg\" data-s=\"2\">Später ersetzt <code>rakupp upgrade<\/code> ihn durch die neueste Veröffentlichung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere Installationswege<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Unter macOS mit Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Mit Docker müssen Sie gar nichts installieren: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> startet die interaktive REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Fertige Archive für jede Plattform liegen auf der Releases-Seite des Repositorys.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ ist in C++ geschrieben. Deshalb können Sie ihn auch selbst aus dem Quellcode bauen. Das Repository erklärt, welche Werkzeuge Sie brauchen.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versionsnummern<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Option <code>--version<\/code> zeigt, welche Version Sie haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Zeile zeigt die Veröffentlichung von Raku++ selbst, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigt auch das Datum des Builds und die Plattform der Binärdatei.<\/span> <span class=\"sg\" data-s=\"2\">Die Version der Sprache Raku ist eine andere Sache.<\/span> <span class=\"sg\" data-s=\"3\">Sie können die Sprache selbst fragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vergleichen Sie das mit der Versionsmeldung von Rakudo auf der <a href=\"https://course.raku.org/de/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Seite zur Rakudo-Installation<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Dann sehen Sie, wie sich die beiden Compiler melden.<\/span><\/p>"]]},"nl":{"t":"Raku++ installeren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ is beschikbaar op zijn website, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het ook krijgen via zijn GitHub-repository, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Als je het installeert, krijg je één uitvoerbaar bestand met de naam <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Verder hoef je niets in te stellen, want Raku++ heeft geen aparte virtuele machine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het installatieprogramma<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Op macOS, Linux en de BSD's doet één opdracht alles.<\/span> <span class=\"sg\" data-s=\"1\">Hij downloadt de build voor jouw machine en controleert die.<\/span> <span class=\"sg\" data-s=\"2\">Daarna zet hij <code>rakupp<\/code> in je <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je hebt daar geen beheerdersrechten voor nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Gebruik op Windows in plaats daarvan een PowerShell-venster.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ook de installatiewizard gebruiken, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die staat op de releasespagina van de repository.<\/span> <span class=\"sg\" data-s=\"3\">Voer in PowerShell dit uit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het installatieprogramma vraagt of je Raku++ ook onder de naam <code>raku<\/code> wilt hebben.<\/span> <span class=\"sg\" data-s=\"1\">Open daarna een nieuwe terminal, zodat het nieuwe <code>PATH<\/code> gaat werken.<\/span> <span class=\"sg\" data-s=\"2\">Later vervangt <code>rakupp upgrade<\/code> het door de nieuwste uitgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere manieren om te installeren<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Op macOS, met Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Met Docker hoef je niets te installeren: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> start de interactieve REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Kant-en-klare archieven voor elk platform staan op de releasespagina van de repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ is in C++ geschreven. Je kunt het dus ook zelf bouwen vanaf de broncode. De repository legt uit welke hulpmiddelen je nodig hebt.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versienummers<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De optie <code>--version<\/code> laat zien welke versie je hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De regel toont de uitgave van Raku++ zelf, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij toont ook de datum van de build en het platform van het binaire bestand.<\/span> <span class=\"sg\" data-s=\"2\">De versie van de taal Raku is iets anders.<\/span> <span class=\"sg\" data-s=\"3\">Die kun je aan de taal zelf vragen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vergelijk dit met de versieregel van Rakudo op de <a href=\"https://course.raku.org/nl/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">installatiepagina van Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Dan zie je hoe de twee compilers zichzelf melden.<\/span><\/p>"]]},"es":{"t":"Cómo instalar Raku++","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ está disponible en su sitio web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">También puedes obtenerlo de su repositorio de GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Cuando lo instalas, obtienes un único archivo ejecutable llamado <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">No hace falta configurar nada más, porque Raku++ no tiene una máquina virtual aparte.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El instalador<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En macOS, Linux y los sistemas BSD, un solo comando lo hace todo.<\/span> <span class=\"sg\" data-s=\"1\">Descarga la versión para tu máquina y la verifica.<\/span> <span class=\"sg\" data-s=\"2\">Después pone <code>rakupp<\/code> en tu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Para esto no necesitas permisos de administrador:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En Windows, usa en cambio una ventana de PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">También puedes usar el asistente de instalación, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Está en la página de versiones del repositorio.<\/span> <span class=\"sg\" data-s=\"3\">En PowerShell, ejecuta esto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El instalador te pregunta si también quieres tener Raku++ con el nombre <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después, abre una terminal nueva para que el nuevo <code>PATH<\/code> empiece a funcionar.<\/span> <span class=\"sg\" data-s=\"2\">Más adelante, <code>rakupp upgrade<\/code> lo cambia por la versión más reciente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otras formas de instalarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">En macOS, con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, no tienes que instalar nada: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> inicia el REPL interactivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">En la página de versiones del repositorio hay archivos comprimidos ya preparados para cada plataforma.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ está escrito en C++. Así que también puedes compilarlo tú mismo a partir del código fuente. El repositorio explica qué herramientas necesitas.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Números de versión<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La opción <code>--version<\/code> muestra qué versión tienes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La línea muestra la versión del propio Raku++, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También muestra la fecha de compilación y la plataforma del binario.<\/span> <span class=\"sg\" data-s=\"2\">La versión del lenguaje Raku es otra cosa.<\/span> <span class=\"sg\" data-s=\"3\">Puedes preguntarle al propio lenguaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Compara esto con el mensaje de versión de Rakudo en la <a href=\"https://course.raku.org/es/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">página de instalación de Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes ver cómo se presenta cada compilador.<\/span><\/p>"]]},"it":{"t":"Come installare Raku++","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ è disponibile sul suo sito web, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche prenderlo dal suo repository GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Quando lo installi, ricevi un unico file eseguibile chiamato <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Non c'è altro da configurare, perché Raku++ non ha una macchina virtuale separata.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma di installazione<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Su macOS, Linux e i sistemi BSD, un solo comando fa tutto.<\/span> <span class=\"sg\" data-s=\"1\">Scarica la build per la tua macchina e la controlla.<\/span> <span class=\"sg\" data-s=\"2\">Poi mette <code>rakupp<\/code> nel tuo <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Non ti servono i diritti di amministratore:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Su Windows, usa invece una finestra di PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche usare la procedura guidata di installazione, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si trova nella pagina delle release del repository.<\/span> <span class=\"sg\" data-s=\"3\">In PowerShell, esegui questo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il programma di installazione chiede se vuoi avere Raku++ anche con il nome <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dopo, apri un nuovo terminale, così il nuovo <code>PATH<\/code> inizia a funzionare.<\/span> <span class=\"sg\" data-s=\"2\">In seguito, <code>rakupp upgrade<\/code> lo sostituisce con la release più recente.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri modi per installarlo<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Su macOS, con Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Con Docker, non devi installare nulla: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> avvia il REPL interattivo.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Gli archivi già pronti per ogni piattaforma sono nella pagina delle release del repository.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ è scritto in C++. Quindi puoi anche compilarlo tu stesso dal codice sorgente. Il repository spiega quali strumenti ti servono.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'opzione <code>--version<\/code> mostra quale versione hai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La riga mostra la release di Raku++ stesso, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche la data della build e la piattaforma del binario.<\/span> <span class=\"sg\" data-s=\"2\">La versione del linguaggio Raku è un'altra cosa.<\/span> <span class=\"sg\" data-s=\"3\">Puoi chiederla al linguaggio stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Confronta questo con il messaggio di versione di Rakudo nella <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina di installazione di Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi vedere come i due compilatori si presentano.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt Raku++ 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ ir pieejams tā tīmekļa vietnē, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">To var dabūt arī no tā GitHub repozitorija, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Kad to instalējat, jūs iegūstat vienu izpildāmo failu ar nosaukumu <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nekas cits nav jāiestata, jo Raku++ nav atsevišķas virtuālās mašīnas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzstādītājs<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">macOS, Linux un BSD sistēmās viena komanda izdara visu.<\/span> <span class=\"sg\" data-s=\"1\">Tā lejupielādē jūsu datoram atbilstošo būvējumu un pārbauda to.<\/span> <span class=\"sg\" data-s=\"2\">Tad tā padara <code>rakupp<\/code> pieejamu caur jūsu <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Administratora tiesības jums tam nav vajadzīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Windows sistēmā tā vietā izmantojiet PowerShell logu.<\/span> <span class=\"sg\" data-s=\"1\">Varat arī izmantot instalēšanas vedni <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir repozitorija izlaidumu lappusē.<\/span> <span class=\"sg\" data-s=\"3\">PowerShell logā izpildiet šo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzstādītājs pajautā, vai vēlaties Raku++ arī ar nosaukumu <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam atveriet jaunu termināli, lai jaunais <code>PATH<\/code> sāktu darboties.<\/span> <span class=\"sg\" data-s=\"2\">Vēlāk <code>rakupp upgrade<\/code> to aizstāj ar jaunāko izlaidumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi instalēšanas veidi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">macOS sistēmā, ar Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ar Docker jums nekas nav jāinstalē: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> palaiž interaktīvo REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Gatavi arhīvi katrai platformai ir repozitorija izlaidumu lappusē.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ ir uzrakstīts C++ valodā. Tāpēc jūs varat arī paši to uzbūvēt no pirmkoda. Repozitorijā ir paskaidrots, kādi rīki jums vajadzīgi.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Opcija <code>--version<\/code> parāda, kāda versija jums ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rinda parāda paša Raku++ izlaidumu, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā parāda arī būvēšanas datumu un platformu, kurai binārais fails paredzēts.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodas versija ir cita lieta.<\/span> <span class=\"sg\" data-s=\"3\">To varat pajautāt pašai valodai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar Rakudo versijas paziņojumu <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo instalēšanas lappusē<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs redzēsiet, kā abi kompilatori sevi piesaka.<\/span><\/p>"]]},"ru":{"t":"Как установить Raku++ 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ доступен на своём сайте, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Его также можно взять из репозитория на GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">После установки у вас будет один исполняемый файл под названием <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Больше ничего настраивать не нужно, потому что у Raku++ нет отдельной виртуальной машины.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установщик<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В macOS, Linux и системах BSD всё делает одна команда.<\/span> <span class=\"sg\" data-s=\"1\">Она скачивает сборку для вашего компьютера и проверяет её.<\/span> <span class=\"sg\" data-s=\"2\">Затем она добавляет <code>rakupp<\/code> в ваш <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Права администратора для этого не нужны:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В Windows вместо этого используйте окно PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Можно также взять мастер установки, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он лежит на странице релизов репозитория.<\/span> <span class=\"sg\" data-s=\"3\">В PowerShell выполните вот это:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Установщик спрашивает, нужен ли вам Raku++ ещё и под именем <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После этого откройте новый терминал, чтобы новый <code>PATH<\/code> начал работать.<\/span> <span class=\"sg\" data-s=\"2\">Позже <code>rakupp upgrade<\/code> заменит его самым новым выпуском.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие способы установки<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">В macOS, через Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">С Docker вам не нужно ничего устанавливать: команда <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускает интерактивную оболочку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готовые архивы для каждой платформы лежат на странице релизов репозитория.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ написан на C++. Поэтому его можно собрать и самому из исходного кода. В репозитории объясняется, какие инструменты для этого нужны.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опция <code>--version<\/code> показывает, какая у вас версия:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Эта строка показывает выпуск самого Raku++, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё она показывает дату сборки и платформу исполняемого файла.<\/span> <span class=\"sg\" data-s=\"2\">Версия языка Raku — это отдельная вещь.<\/span> <span class=\"sg\" data-s=\"3\">Её можно узнать у самого языка:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сравните это с сообщением о версии Rakudo на <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">странице установки Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы увидите, как каждый из двух компиляторов представляется.<\/span><\/p>"]]},"uk":{"t":"Як встановити Raku++","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ доступний на своєму сайті, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Також його можна отримати з репозиторію на GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Після встановлення ви отримуєте один виконуваний файл під назвою <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Більше нічого налаштовувати не треба, бо в Raku++ немає окремої віртуальної машини.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлювач<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У macOS, Linux і системах BSD усе робить одна команда.<\/span> <span class=\"sg\" data-s=\"1\">Вона завантажує збірку для вашого комп'ютера і перевіряє її.<\/span> <span class=\"sg\" data-s=\"2\">Потім вона додає <code>rakupp<\/code> до вашого <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Права адміністратора для цього не потрібні:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У Windows натомість використайте вікно PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Також можна скористатися майстром встановлення, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він є на сторінці випусків репозиторію.<\/span> <span class=\"sg\" data-s=\"3\">У PowerShell виконайте таку команду:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Встановлювач запитає, чи потрібен вам Raku++ також під назвою <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім відкрийте новий термінал, щоб новий <code>PATH<\/code> запрацював.<\/span> <span class=\"sg\" data-s=\"2\">Пізніше <code>rakupp upgrade<\/code> замінить його найновішим випуском.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші способи встановлення<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">У macOS, з Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">З Docker нічого не треба встановлювати: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> запускає інтерактивну оболонку REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готові архіви для кожної платформи є на сторінці випусків репозиторію.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ написано мовою C++. Тож ви можете зібрати його й самостійно з вихідного коду. Репозиторій пояснює, які інструменти для цього потрібні.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опція <code>--version<\/code> показує, яка у вас версія:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Рядок показує випуск самого Raku++, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він також показує дату збірки і платформу для виконуваного файлу.<\/span> <span class=\"sg\" data-s=\"2\">Версія мови Raku — окрема річ.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете запитати саму мову:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це з повідомленням про версію Rakudo на <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">сторінці встановлення Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви побачите, як два компілятори представляють себе.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Raku++","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ се предлага на сайта си, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го вземете и от хранилището му в GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Когато го инсталирате, получавате един изпълним файл на име <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Нищо друго не трябва да се настройва, защото Raku++ няма отделна виртуална машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Инсталаторът<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В macOS, Linux и BSD системите една команда прави всичко.<\/span> <span class=\"sg\" data-s=\"1\">Тя изтегля и проверява компилацията за вашата машина.<\/span> <span class=\"sg\" data-s=\"2\">След това поставя <code>rakupp<\/code> във вашия <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">За това не ви трябват администраторски права:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В Windows вместо това използвайте прозорец на PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Можете да използвате и съветника за инсталиране, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той е на страницата с издания на хранилището.<\/span> <span class=\"sg\" data-s=\"3\">В PowerShell изпълнете следното:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Инсталаторът пита дали искате Raku++ и под името <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това отворете нов терминал, за да започне да работи новият <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По-късно <code>rakupp upgrade<\/code> го заменя с най-новото издание.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други начини за инсталиране<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">В macOS, с Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">С Docker не трябва да инсталирате нищо: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> стартира интерактивната обвивка REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Готови архиви за всяка платформа има на страницата с издания на хранилището.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ е написан на C++. Затова можете и сами да го изградите от изходния код. Хранилището обяснява какви инструменти ви трябват.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опцията <code>--version<\/code> показва коя версия имате:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Редът показва изданието на самия Raku++, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той показва също датата на изграждане и платформата на двоичния файл.<\/span> <span class=\"sg\" data-s=\"2\">Версията на езика Raku е отделно нещо.<\/span> <span class=\"sg\" data-s=\"3\">Можете да попитате самия език:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сравнете това със съобщението за версията на Rakudo на <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">страницата за инсталиране на Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Така ще видите как се представят двата компилатора.<\/span><\/p>"]]},"eo":{"t":"Kiel instali Raku++ 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ disponeblas en sia retejo, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas ricevi ĝin el ĝia deponejo en GitHub, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi instalas ĝin, vi ricevas unu solan ruleblan dosieron nomatan <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nenion alian vi devas agordi, ĉar Raku++ ne havas apartan virtualan maŝinon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La instalilo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sur macOS, Linukso kaj la BSD-sistemoj, unu komando faras ĉion.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi elŝutas la binaraĵon por via maŝino kaj kontrolas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi metas <code>rakupp<\/code> en vian <code>PATH<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne bezonas administrantajn rajtojn por tio:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sur Vindozo, uzu anstataŭe fenestron de PowerShell.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas uzi la instalan asistanton, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi troviĝas en la eldona paĝo de la deponejo.<\/span> <span class=\"sg\" data-s=\"3\">En PowerShell, rulu ĉi tion:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La instalilo demandas, ĉu vi volas havi Raku++ ankaŭ sub la nomo <code>raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste malfermu novan terminalon, por ke la nova <code>PATH<\/code> ekfunkciu.<\/span> <span class=\"sg\" data-s=\"2\">Pli malfrue, <code>rakupp upgrade<\/code> anstataŭigas ĝin per la plej nova eldono.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj manieroj instali<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">Sur macOS, per Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Per Docker, vi ne devas instali ion ajn: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> lanĉas la interagan ŝelon REPL.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Pretaj arkivoj por ĉiu platformo troviĝas en la eldona paĝo de la deponejo.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ estas skribita en C++. Do vi ankaŭ povas mem konstrui ĝin el la fontkodo. La deponejo klarigas, kiujn ilojn vi bezonas.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La opcio <code>--version<\/code> montras, kiun version vi havas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La linio montras la eldonon de Raku++ mem, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras la daton de la konstruo kaj la platformon por la binaraĵo.<\/span> <span class=\"sg\" data-s=\"2\">La versio de la lingvo Raku estas aparta afero.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas demandi la lingvon mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komparu tion kun la versia mesaĝo de Rakudo en la <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">paĝo pri instalado de Rakudo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas vidi, kiel la du kompililoj raportas pri si.<\/span><\/p>"]]},"la":{"t":"Quomodo Raku++ installare 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku++ in situ suo interretiali praesto est, <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Id etiam ex repositorio eius GitHub accipere potes, <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Cum id installas, unum programma exsecutabile accipis, nomine <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nihil aliud parandum est, quia Raku++ nullam machinam virtualem separatam habet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma installationis<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In macOS, Linux et systematibus BSD unum imperatum omnia facit.<\/span> <span class=\"sg\" data-s=\"1\">Versionem machinae tuae aptam deprimit et examinat.<\/span> <span class=\"sg\" data-s=\"2\">Deinde <code>rakupp<\/code> in <code>PATH<\/code> tuum ponit.<\/span> <span class=\"sg\" data-s=\"3\">Iura administratoris ad hoc non requiris:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ curl -fsSL https://raku.online/install.sh | sh<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In Windows potius fenestram PowerShell adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ducem installationis adhibere potes, <code>rakupp-setup-windows-x64.exe<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Est in pagina emissionum repositorii.<\/span> <span class=\"sg\" data-s=\"3\">In PowerShell hoc exsequere:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>&gt; irm https://raku.online/install-windows.ps1 | iex<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma installationis rogat num Raku++ etiam sub nomine <code>raku<\/code> habere velis.<\/span> <span class=\"sg\" data-s=\"1\">Deinde terminalem novum aperi, ut novum <code>PATH<\/code> operari incipiat.<\/span> <span class=\"sg\" data-s=\"2\">Postea <code>rakupp upgrade<\/code> emissionem novissimam in eius locum ponit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alii modi installandi<\/span><\/h3>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\">In macOS, cum Homebrew: <code>brew tap ash/rakupp &amp;&amp; brew install rakupp<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Cum Docker nihil installare debes: <code>docker run --rm -it ghcr.io/ash/rakupp<\/code> corticem REPL interactivum incipit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Archiva parata pro quoque systemate in pagina emissionum repositorii sunt.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Raku++ in C++ scriptum est. Itaque id etiam ipse ex codice fonte aedificare potes. Repositorium explicat quae instrumenta requiras.<\/span><\/li><\/ul>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Optio <code>--version<\/code> ostendit quam versionem habeas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --version\nRaku++ 5.4.1 (2026-10-13) arm64-darwin<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Linea emissionem ipsius Raku++ ostendit, <code>5.4.1<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam diem aedificationis et systema binarii ostendit.<\/span> <span class=\"sg\" data-s=\"2\">Versio linguae Raku res separata est.<\/span> <span class=\"sg\" data-s=\"3\">Ab ipsa lingua eam quaerere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc cum nuntio versionis Rakudo in <a href=\"https://course.raku.org/la/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">pagina installationis Rakudo<\/a> confer.<\/span> <span class=\"sg\" data-s=\"1\">Tum videre potes quomodo duo compilatores se ipsos nuntient.<\/span><\/p>"]]}}}</script>
