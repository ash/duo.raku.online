class=\"sg\" data-s=\"3\">Ogni build contiene due file eseguibili: <code>mutsu<\/code> stesso e <code>mzef<\/code>, il suo gestore di pacchetti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il modo più semplice per installare una release è <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">È uno strumento che installa e aggiorna gli strumenti per sviluppatori.<\/span> <span class=\"sg\" data-s=\"2\">Un solo comando scarica la build per la tua macchina.<\/span> <span class=\"sg\" data-s=\"3\">Mette anche sia <code>mutsu<\/code> sia <code>mzef<\/code> nel tuo <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Con Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se sul tuo sistema gira Docker, puoi usare mutsu senza installarlo.<\/span> <span class=\"sg\" data-s=\"1\">Funziona anche su Windows.<\/span> <span class=\"sg\" data-s=\"2\">Questo comando avvia il REPL interattivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E questo esegue un programma dalla directory corrente:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Compilazione dal codice sorgente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu è scritto in Rust.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi anche compilarlo tu stesso con Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Il codice sorgente è nel suo repository, che spiega anche i dettagli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri di versione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'opzione <code>--version<\/code> mostra quale versione hai:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa è la release di mutsu stesso.<\/span> <span class=\"sg\" data-s=\"1\">Come per gli altri compilatori, il linguaggio ti può dire la sua versione:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Confronta queste informazioni con il modo in cui si presentano <a href=\"https://course.raku.org/it/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> e <a href=\"https://course.raku.org/it/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"lv":{"t":"Kā uzstādīt mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu piedāvā gatavus būvējumus macOS un Linux sistēmām.<\/span> <span class=\"sg\" data-s=\"1\">Ir būvējumi gan Intel/AMD, gan ARM procesoriem.<\/span> <span class=\"sg\" data-s=\"2\">Tie atrodas izlaidumu lappusē tā GitHub repozitorijā, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Katrā būvējumā ir divi izpildāmie faili: pats <code>mutsu<\/code> un <code>mzef<\/code>, tā pakotņu pārvaldnieks.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais veids, kā instalēt izlaidumu, ir <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir rīks, kas instalē un atjaunina izstrādātāju rīkus.<\/span> <span class=\"sg\" data-s=\"2\">Viena komanda lejupielādē jūsu datoram atbilstošo būvējumu.<\/span> <span class=\"sg\" data-s=\"3\">Tā arī padara gan <code>mutsu<\/code>, gan <code>mzef<\/code> pieejamus caur jūsu <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ar Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja jūsu sistēmā darbojas Docker, jūs varat lietot mutsu, to neinstalējot.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas arī Windows sistēmā.<\/span> <span class=\"sg\" data-s=\"2\">Šī komanda palaiž interaktīvo REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bet šī izpilda programmu no pašreizējā direktorija:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Būvēšana no pirmkoda<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu ir uzrakstīts Rust valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat arī paši to uzbūvēt ar Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Pirmkods ir tā repozitorijā, kur ir paskaidrotas arī detaļas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiju numuri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Opcija <code>--version<\/code> parāda, kāda versija jums ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir paša mutsu izlaidums.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā ar pārējiem kompilatoriem, valoda pati var pateikt savu versiju:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Salīdziniet to ar to, kā sevi piesaka <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> un <a href=\"https://course.raku.org/lv/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"ru":{"t":"Как установить mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu предлагает готовые сборки для macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Есть сборки и для процессоров Intel/AMD, и для ARM.<\/span> <span class=\"sg\" data-s=\"2\">Они лежат на странице релизов его репозитория на GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Каждая сборка содержит два исполняемых файла: сам <code>mutsu<\/code> и <code>mzef<\/code>, его менеджер пакетов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С помощью mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Самый простой способ установить выпуск — <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это программа, которая устанавливает и обновляет инструменты разработчика.<\/span> <span class=\"sg\" data-s=\"2\">Одна команда скачивает сборку для вашего компьютера.<\/span> <span class=\"sg\" data-s=\"3\">Она также добавляет в ваш <code>PATH<\/code> и <code>mutsu<\/code>, и <code>mzef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С помощью Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если в вашей системе работает Docker, вы можете пользоваться mutsu, не устанавливая его.<\/span> <span class=\"sg\" data-s=\"1\">Это работает и в Windows.<\/span> <span class=\"sg\" data-s=\"2\">Эта команда запускает интерактивную оболочку REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А эта запускает программу из текущего каталога:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сборка из исходного кода<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu написан на Rust.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому его можно собрать и самому с помощью Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Исходный код лежит в его репозитории, где также описаны подробности.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опция <code>--version<\/code> показывает, какая у вас версия:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это выпуск самого mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Как и в случае с другими компиляторами, язык сам может сказать вам свою версию:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравните это с тем, как представляются <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/ru/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"uk":{"t":"Як встановити mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu пропонує готові збірки для macOS і Linux.<\/span> <span class=\"sg\" data-s=\"1\">Є збірки як для процесорів Intel/AMD, так і для ARM.<\/span> <span class=\"sg\" data-s=\"2\">Вони лежать на сторінці випусків його репозиторію на GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Кожна збірка містить два виконувані файли: сам <code>mutsu<\/code> і <code>mzef<\/code>, його менеджер пакетів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Найпростіший спосіб встановити випуск — <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це програма, яка встановлює й оновлює інструменти розробника.<\/span> <span class=\"sg\" data-s=\"2\">Одна команда завантажує збірку для вашого комп'ютера.<\/span> <span class=\"sg\" data-s=\"3\">Вона також додає до вашого <code>PATH<\/code> і <code>mutsu<\/code>, і <code>mzef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">За допомогою Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо у вашій системі працює Docker, ви можете використовувати mutsu, не встановлюючи його.<\/span> <span class=\"sg\" data-s=\"1\">Це працює і в Windows.<\/span> <span class=\"sg\" data-s=\"2\">Ця команда запускає інтерактивну оболонку REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А ця запускає програму з поточного каталогу:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Збирання з вихідного коду<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu написано мовою Rust.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви можете зібрати його й самостійно за допомогою Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Вихідний код лежить у його репозиторії, де також пояснено подробиці.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опція <code>--version<\/code> показує, яка у вас версія:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це випуск самого mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Як і з іншими компіляторами, мова може сама сказати вам свою версію:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порівняйте це з тим, як представляють себе <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> і <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu предлага готови компилации за macOS и Linux.<\/span> <span class=\"sg\" data-s=\"1\">Има компилации както за процесори Intel/AMD, така и за ARM.<\/span> <span class=\"sg\" data-s=\"2\">Те са на страницата с издания на хранилището му в GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Всяка компилация съдържа два изпълними файла: самия <code>mutsu<\/code> и <code>mzef<\/code>, неговия мениджър на пакети.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Най-лесният начин да инсталирате издание е <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Това е програма, която инсталира и обновява инструменти за разработчици.<\/span> <span class=\"sg\" data-s=\"2\">Една команда изтегля компилацията за вашата машина.<\/span> <span class=\"sg\" data-s=\"3\">Освен това тя поставя и <code>mutsu<\/code>, и <code>mzef<\/code> във вашия <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">С Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако на системата ви работи Docker, можете да използвате mutsu, без да го инсталирате.<\/span> <span class=\"sg\" data-s=\"1\">Това работи и на Windows.<\/span> <span class=\"sg\" data-s=\"2\">Тази команда стартира интерактивната обвивка REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А това изпълнява програма от текущата директория:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изграждане от изходния код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu е написан на Rust.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете и сами да го изградите с Cargo.<\/span> <span class=\"sg\" data-s=\"2\">Изходният код е в хранилището му, което обяснява и подробностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Опцията <code>--version<\/code> показва коя версия имате:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е изданието на самия mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Както и при другите компилатори, езикът може да ви каже версията си:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравнете това с начина, по който се представят <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> и <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span><\/p>"]]},"eo":{"t":"Kiel instali mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu proponas pretajn binaraĵojn por macOS kaj Linukso.<\/span> <span class=\"sg\" data-s=\"1\">Estas binaraĵoj por procesoroj kaj Intel/AMD kaj ARM.<\/span> <span class=\"sg\" data-s=\"2\">Ili troviĝas en la eldona paĝo de ĝia deponejo en GitHub, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu binaraĵo enhavas du ruleblajn dosierojn: <code>mutsu<\/code> mem kaj <code>mzef<\/code>, ĝian pakaĵadministrilon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La plej simpla maniero instali eldonon estas <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ilo, kiu instalas kaj ĝisdatigas programistajn ilojn.<\/span> <span class=\"sg\" data-s=\"2\">Unu komando elŝutas la binaraĵon por via maŝino.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ metas kaj <code>mutsu<\/code> kaj <code>mzef<\/code> en vian <code>PATH<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Per Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se via sistemo rulas Docker, vi povas uzi mutsu sen instali ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias ankaŭ sur Vindozo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu komando lanĉas la interagan ŝelon REPL:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tio rulas programon el la nuna dosierujo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konstrui el la fontkodo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu estas skribita en Rust.<\/span> <span class=\"sg\" data-s=\"1\">Do vi ankaŭ povas mem konstrui ĝin per Cargo.<\/span> <span class=\"sg\" data-s=\"2\">La fontkodo estas en ĝia deponejo, kiu ankaŭ klarigas la detalojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiaj numeroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La opcio <code>--version<\/code> montras, kiun version vi havas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la eldono de mutsu mem.<\/span> <span class=\"sg\" data-s=\"1\">Same kiel ĉe la aliaj kompililoj, la lingvo povas diri al vi sian version:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Komparu tion kun tio, kiel <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> raportas sin.<\/span><\/p>"]]},"la":{"t":"Quomodo mutsu installare","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu versiones paratas pro macOS et Linux praebet.<\/span> <span class=\"sg\" data-s=\"1\">Sunt versiones tam pro processoriis Intel/AMD quam pro ARM.<\/span> <span class=\"sg\" data-s=\"2\">In pagina emissionum repositorii eius GitHub sunt, <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Quaeque versio duo programmata exsecutabilia continet: ipsum <code>mutsu<\/code> et <code>mzef<\/code>, instrumentum eius moderandi modulos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum mise<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Via simplicissima emissionem installandi est <a href=\"https://mise.jdx.dev/\" target=\"_blank\" rel=\"noopener\">mise<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Est instrumentum quod instrumenta programmatorum installat et renovat.<\/span> <span class=\"sg\" data-s=\"2\">Unum imperatum versionem machinae tuae aptam deprimit.<\/span> <span class=\"sg\" data-s=\"3\">Etiam <code>mutsu<\/code> et <code>mzef<\/code> ambo in <code>PATH<\/code> tuum ponit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mise use -g github:tokuhirom/mutsu<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cum Docker<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si in systemate tuo Docker currit, mutsu uti potes sine installatione.<\/span> <span class=\"sg\" data-s=\"1\">Hoc etiam in Windows valet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc imperatum corticem REPL interactivum incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -it ghcr.io/tokuhirom/mutsu<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et hoc programma ex directoria currenti exsequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run --rm -v \"$PWD:/work:ro\" ghcr.io/tokuhirom/mutsu mutsu hello.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ex codice fonte aedificare<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu in Rust scriptus est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eum etiam ipse cum Cargo aedificare potes.<\/span> <span class=\"sg\" data-s=\"2\">Codex fons in repositorio eius est, quod etiam singula explicat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Optio <code>--version<\/code> ostendit quam versionem habeas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu --version\nmutsu 0.24.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec est emissio ipsius mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ut apud alios compilatores, lingua ipsa versionem suam tibi dicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ mutsu -e 'say $*RAKU.version'\nv6.d<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc confer cum modo quo <a href=\"https://course.raku.org/la/essentials/how-to-install-rakudo/\" target=\"_blank\" rel=\"noopener\">Rakudo<\/a> et <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> se ipsos nuntiant.<\/span><\/p>"]]}}}</script>
