<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pievērsiet uzmanību: šoreiz mēs izmantojam līkās iekavas.<\/span><\/p>"]]},"ru":{"t":"Пары","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара — это структура данных, которая хранит вместе имя и значение.<\/span> <span class=\"sg\" data-s=\"1\">Они составляют один объект, который можно хранить в скалярной переменной.<\/span> <span class=\"sg\" data-s=\"2\">Вот как создать пару:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тип переменной <code>$pair<\/code> — <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Имя и значение можно получить по отдельности с помощью методов <code>key<\/code> и <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важная особенность пар — они неизменяемые.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что вы не можете дать существующей паре новое значение или новое имя.<\/span> <span class=\"sg\" data-s=\"2\">Но, конечно, вы можете присвоить совсем новую пару той же переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексация<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Есть другой способ прочитать значение пары.<\/span> <span class=\"sg\" data-s=\"1\">Её можно индексировать именем ключа в угловых скобках.<\/span> <span class=\"sg\" data-s=\"2\">Вот как это сделать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что кавычки вокруг ключа не нужны, если в нём нет пробелов.<\/span> <span class=\"sg\" data-s=\"1\">Если пробелы есть, правила немного строже:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Будьте внимательны: на этот раз мы используем фигурные скобки.<\/span><\/p>"]]},"uk":{"t":"Пари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара — це структура даних, яка зберігає разом ім'я та значення.<\/span> <span class=\"sg\" data-s=\"1\">Вони утворюють один об'єкт, який ви можете зберігати в скалярній змінній.<\/span> <span class=\"sg\" data-s=\"2\">Ось як створити пару:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тип змінної <code>$pair<\/code> — <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете отримати ім'я та значення окремо за допомогою методів <code>key<\/code> і <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важлива особливість пар у тому, що вони незмінні.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що ви не можете дати наявній парі нове значення чи нове ім'я.<\/span> <span class=\"sg\" data-s=\"2\">Але, звичайно, ви можете присвоїти зовсім нову пару тій самій змінній:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Індексування<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Є ще один спосіб прочитати значення пари.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете індексувати її іменем ключа в кутових дужках.<\/span> <span class=\"sg\" data-s=\"2\">Ось як це зробити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що лапки навколо ключа не потрібні, якщо в ньому немає пробілів.<\/span> <span class=\"sg\" data-s=\"1\">Якщо пробіли є, правила трохи суворіші:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Будьте уважні: цього разу ми використовуємо фігурні дужки.<\/span><\/p>"]]},"bg":{"t":"Двойки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Двойката е структура от данни, която пази заедно име и стойност.<\/span> <span class=\"sg\" data-s=\"1\">Те образуват един обект, който можете да съхраните в скаларна променлива.<\/span> <span class=\"sg\" data-s=\"2\">Ето как създавате двойка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Типът на променливата <code>$pair<\/code> е <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да вземете името и стойността поотделно с методите <code>key<\/code> и <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важна черта на двойките е, че те са неизменяеми.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че не можете да дадете нова стойност или ново име на съществуваща двойка.<\/span> <span class=\"sg\" data-s=\"2\">Но, разбира се, можете да присвоите съвсем нова двойка на същата променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има и друг начин да прочетете стойността на двойка.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я индексирате с името на нейния ключ в ъглови скоби.<\/span> <span class=\"sg\" data-s=\"2\">Ето как:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че не ви трябват кавички около ключа, ако в него няма интервали.<\/span> <span class=\"sg\" data-s=\"1\">Ако има интервали, правилата са малко по-строги:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание: този път използваме къдрави скоби.<\/span><\/p>"]]},"eo":{"t":"Paroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Paro estas datumstrukturo, kiu tenas nomon kaj valoron kune.<\/span> <span class=\"sg\" data-s=\"1\">Ili faras unu solan objekton, kiun vi povas konservi en skalara variablo.<\/span> <span class=\"sg\" data-s=\"2\">Jen kiel vi kreas paron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La tipo de la variablo <code>$pair<\/code> estas <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas preni la nomon kaj la valoron aparte per la metodoj <code>key<\/code> kaj <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Grava eco de paroj estas, ke ili estas neŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi ne povas doni al ekzistanta paro novan valoron aŭ novan nomon.<\/span> <span class=\"sg\" data-s=\"2\">Sed kompreneble vi povas asigni tute novan paron al la sama variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas alia maniero legi la valoron de paro.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas subskribi ĝin per la nomo de ĝia ŝlosilo inter angulaj krampoj.<\/span> <span class=\"sg\" data-s=\"2\">Jen kiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke vi ne bezonas citilojn ĉirkaŭ la ŝlosilo, se ĝi ne havas spacojn.<\/span> <span class=\"sg\" data-s=\"1\">Se ĝi havas spacojn, la reguloj estas iom pli striktaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atentu: ĉi-foje ni uzas kurbajn krampojn.<\/span><\/p>"]]},"la":{"t":"Paria","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Par est structura datae quae nomen et valorem simul continet.<\/span> <span class=\"sg\" data-s=\"1\">Unum solum obiectum faciunt, quod in variabili scalari servare potes.<\/span> <span class=\"sg\" data-s=\"2\">Sic par creas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Typus variabilis <code>$pair<\/code> est <code>Pair<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.WHAT; # (Pair)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nomen et valorem seorsum accipere potes per methodos <code>key<\/code> et <code>value<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair.key; # name\nsay $pair.value; # Anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Proprietas gravis parium est quod immutabilia sunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: pari exstanti novum valorem aut novum nomen dare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Sed certe omnino novum par eidem variabili assignare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = name =&gt; 'Anna';\n$pair = name =&gt; 'John';\nsay $pair.value; # John<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscripting<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Est alius modus quo valorem paris legere potes.<\/span> <span class=\"sg\" data-s=\"1\">Id subscribere potes cum nomine clavis eius in uncis angularibus.<\/span> <span class=\"sg\" data-s=\"2\">Sic facis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $pair&lt;name&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod quotationes circa clavem non requiris, si nulla spatia habet.<\/span> <span class=\"sg\" data-s=\"1\">Si spatia habet, regulae paulo strictiores sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pair = 'employee name' =&gt; 'Julie Madelon';\nsay $pair{'employee name'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Attende: hoc tempore uncos curvos adhibemus.<\/span><\/p>"]]}}}</script>
