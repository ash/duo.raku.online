\" data-s=\"0\">Асоциативните типове данни са агрегатни типове, което означава, че съдържат повече от един елемент.<\/span> <span class=\"sg\" data-s=\"1\">Можете да вземете всеки елемент по неговото име.<\/span> <span class=\"sg\" data-s=\"2\">Два такива типа в Raku са двойките и хешовете.<\/span> <span class=\"sg\" data-s=\"3\">Тази част от курса разглежда техните основи.<\/span><\/p>"]]},"eo":{"t":"Asociaj datentipoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Asociativaj datumtipoj estas agregitaj tipoj, kio signifas, ke ili tenas pli ol unu elementon.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas preni ĉiun elementon per ĝia nomo.<\/span> <span class=\"sg\" data-s=\"2\">Du tiaj tipoj en Raku estas paroj kaj haketoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu parto de la kurso klarigas iliajn bazojn.<\/span><\/p>"]]},"la":{"t":"Associativa data genera","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Typi data associativi sunt typi aggregati, id est plus quam unum elementum continent.<\/span> <span class=\"sg\" data-s=\"1\">Quodque elementum per nomen eius accipere potes.<\/span> <span class=\"sg\" data-s=\"2\">Duo tales typi in Raku sunt paria et hashes.<\/span> <span class=\"sg\" data-s=\"3\">Haec pars cursus fundamenta eorum tractat.<\/span><\/p>"]]}}}</script>
