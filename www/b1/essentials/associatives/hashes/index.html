s/pairs/\">pāriem<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ielieciet virkni leņķa iekavās vai figūriekavās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jaukteņi ir maināmi, tāpēc jūs varat mainīt esošās vērtības un pievienot jaunas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Atslēgas un vērtības<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jauktenim ir divas iebūvētas metodes, <code>keys<\/code> un <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās atgriež tā atslēgu sarakstu un tā vērtību sarakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, piemērs tam, ko šī programma izdrukā:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka jaukteņa elementi nav sakārtoti nekādā secībā.<\/span> <span class=\"sg\" data-s=\"1\">Bet augstāk minētās metodes atgriež atslēgas un vērtības vienā un tajā pašā secībā.<\/span><\/p>"]]},"ru":{"t":"Словари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хэш<\/em> — это ещё один ассоциативный тип данных в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это агрегированный тип, который связывает имя каждого элемента с его значением.<\/span> <span class=\"sg\" data-s=\"2\">Переменные-хэши используют новый сигил: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь вы можете использовать хэш и дать ему начальные значения.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Как и с другими типами данных, оба действия можно сделать за один шаг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Доступ к элементам<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Индексация работает примерно так же, как мы видели для <a href=\"/essentials/associatives/pairs/\">пар<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Напишите строку в угловых или фигурных скобках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хэши изменяемы, поэтому вы можете менять существующие значения и добавлять новые:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключи и значения<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У хэша есть два встроенных метода, <code>keys<\/code> и <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они возвращают список его ключей и список его значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример того, что выводит эта программа:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что у элементов хэша нет определённого порядка.<\/span> <span class=\"sg\" data-s=\"1\">Но методы выше возвращают ключи и значения в одном и том же порядке.<\/span><\/p>"]]},"uk":{"t":"Хеші","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хеш<\/em> — це ще один асоціативний тип даних у Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це агрегатний тип, який пов'язує ім'я кожного елемента з його значенням.<\/span> <span class=\"sg\" data-s=\"2\">Змінні-хеші використовують новий сигіл: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер ви можете використовувати хеш і дати йому кілька початкових значень.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Як і з іншими типами даних, ви можете зробити обидві дії за один крок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Доступ до елементів<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Індексація тут схожа на те, що ми бачили для <a href=\"/essentials/associatives/pairs/\">пар<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Напишіть рядок у кутових або у фігурних дужках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хеші є змінними, тому ви можете змінювати наявні значення і додавати нові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключі та значення<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хеш має два вбудовані методи: <code>keys<\/code> і <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони повертають список його ключів і список його значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад того, що виводить ця програма:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що елементи хешу не мають жодного порядку.<\/span> <span class=\"sg\" data-s=\"1\">Але методи вище повертають ключі та значення в однаковому порядку.<\/span><\/p>"]]},"bg":{"t":"Хешове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Хеш<\/em> е друг асоциативен тип данни в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Това е агрегатен тип, който свързва името на всеки елемент с неговата стойност.<\/span> <span class=\"sg\" data-s=\"2\">Хеш променливите използват нов сигил: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега можете да използвате хеша и да му дадете някои начални стойности.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Както при другите типове данни, можете да направите двете неща с една стъпка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Достъп до елементите<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Индексирането работи подобно на това, което видяхме при <a href=\"/essentials/associatives/pairs/\">двойките<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Сложете низ в ъглови скоби или в къдрави скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Хешовете са изменяеми, така че можете да променяте съществуващите стойности и да добавяте нови:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ключове и стойности<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хешът има два вградени метода, <code>keys<\/code> и <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те връщат списък с ключовете му и списък със стойностите му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за това, което отпечатва тази програма:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че елементите на хеша не са подредени.<\/span> <span class=\"sg\" data-s=\"1\">Но методите по-горе връщат ключовете и стойностите в един и същ ред.<\/span><\/p>"]]},"eo":{"t":"Haketmapoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Haketo<\/em> estas alia asociativa datumtipo en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas agregita tipo, kiu ligas la nomon de ĉiu ero al ĝia valoro.<\/span> <span class=\"sg\" data-s=\"2\">Haketaj variabloj uzas novan siglon: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun vi povas uzi la haketon kaj doni al ĝi kelkajn komencajn valorojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiel kun aliaj datumtipoj, vi povas fari ambaŭ aferojn per unu paŝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = France =&gt; 'Paris', Italy =&gt; 'Rome';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alirante la elementojn<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subskribado funkcias simile al tio, kion ni vidis ĉe <a href=\"/essentials/associatives/pairs/\">paroj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Metu ŝnuron en angulajn krampojn aŭ en kurbajn krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;France&gt;;\nsay %capitals{'Italy'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haketoj estas ŝanĝeblaj, do vi povas ŝanĝi ekzistantajn valorojn kaj aldoni novajn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germany&gt; = 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ŝlosiloj kaj valoroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haketo havas du enkonstruajn metodojn, <code>keys<\/code> kaj <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili redonas liston de ĝiaj ŝlosiloj kaj liston de ĝiaj valoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de tio, kion ĉi tiu programo presas:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germany Italy France)     (Berlin Rome Paris)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la elementoj de haketo ne estas en ia ordo.<\/span> <span class=\"sg\" data-s=\"1\">Sed la supraj metodoj redonas la ŝlosilojn kaj la valorojn en la sama ordo.<\/span><\/p>"]]},"la":{"t":"Hashes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Hash<\/em> est alius typus datorum associativus in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Est typus aggregatus qui nomen cuiusque elementi cum valore eius iungit.<\/span> <span class=\"sg\" data-s=\"2\">Variabiles hash novum sigillum adhibent: <code>%<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc hash uti potes et ei aliquos valores primos dare.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut cum aliis typis datorum, ambas res uno gradu facere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %capitals = Gallia =&gt; 'Lutetia', Italia =&gt; 'Roma';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elementa accedere<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subscribere simili modo operatur atque in <a href=\"/essentials/associatives/pairs/\">paribus<\/a> vidimus.<\/span> <span class=\"sg\" data-s=\"1\">Chordam in uncis angularibus vel in uncis curvis pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals&lt;Gallia&gt;;\nsay %capitals{'Italia'};<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hashes sunt mutabiles, ita valores exstantes mutare et novos addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%capitals&lt;Germania&gt; = 'Berolinum';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Claves et valores<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hash duas methodos inbuilt habet, <code>keys<\/code> et <code>values<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Listam clavium eius et listam valorum eius reddunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %capitals.keys;\nsay %capitals.values;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum eorum quae hoc programma imprimit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">(Germania Italia Gallia)     (Berolinum Roma Lutetia)<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod elementa hash in nullo ordine sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed methodi supra claves et valores eodem ordine reddunt.<\/span><\/p>"]]}}}</script>
