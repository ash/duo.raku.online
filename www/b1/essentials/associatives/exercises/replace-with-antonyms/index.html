грамата.<\/span> <span class=\"sg\" data-s=\"1\">За да ви е по-лесно, ето готов списък с около 200 двойки: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да го копирате и поставите направо във вашата програма.<\/span> <span class=\"sg\" data-s=\"3\">Всички двойки са там в двете посоки, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Направете програмата възможно най-проста и отпечатайте думите по една на ред.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата с няколко думи като аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Проверете дали поне някои от тях са в речника.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Anstataŭigi per antonimoj","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Skribu programon, kiu anstataŭigas ĉiujn vortojn el la komanda linio per iliaj antonimoj.<\/span> <span class=\"sg\" data-s=\"1\">Antonimoj estas vortoj kun la mala signifo.<\/span> <span class=\"sg\" data-s=\"2\">Se vorto ne estas en la vortaro, presu ĝin sen ŝanĝoj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tenu la vortaron de antonimoj en haketo, rekte en la programkodo.<\/span> <span class=\"sg\" data-s=\"1\">Por faciligi la laboron, jen preta listo de ĉirkaŭ 200 paroj: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas kopii kaj alglui ĝin rekte en vian programon.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiuj paroj estas tie en ambaŭ direktoj, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Faru la programon kiel eble plej simpla, kaj presu la vortojn unu en ĉiu linio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kun kelkaj vortoj kiel argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Kontrolu, ke almenaŭ kelkaj el ili estas en la vortaro.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Reponere cum antonyma","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scribe programma quod omnia verba ex linea mandati in antonyma sua mutat.<\/span> <span class=\"sg\" data-s=\"1\">Antonyma sunt verba cum sensu contrario.<\/span> <span class=\"sg\" data-s=\"2\">Si verbum in dictionario non est, id sine mutatione imprime.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dictionarium antonymorum in hash serva, directe in codice programmatis.<\/span> <span class=\"sg\" data-s=\"1\">Ut res facilior sit, hic est index paratus circiter 200 parium: <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Eum directe in programma tuum effingere et inserere potes.<\/span> <span class=\"sg\" data-s=\"3\">Omnia paria ibi in utraque directione sunt, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    # . . .\n    'below' =&gt; 'above',\n    # . . .\n    'present' =&gt; 'absent',\n    # . . .\n;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fac programma quam simplicissimum, et verba unum per lineam imprime.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Curre programma cum paucis verbis ut argumentis.<\/span> <span class=\"sg\" data-s=\"1\">Cura ut saltem quaedam ex eis in dictionario sint.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku replace-with-antonyms.raku a quiet teacher wants to buy some salt\na\nnoisy\nstudent\nwants\nto\nsell\nsome\nsugar<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/associatives/exercises/replace-with-antonyms/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
