-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>, починається з копії <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Після цього цикл проходить по вхідних аргументах.<\/span> <span class=\"sg\" data-s=\"2\">Він намагається знайти кожне слово в словнику.<\/span> <span class=\"sg\" data-s=\"3\">Якщо це вдається, він бере антонім.<\/span> <span class=\"sg\" data-s=\"4\">Якщо такого слова в словнику немає, використовується початкове слово.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рішення — нижче, але тут показано лише частину словника.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    'achieve' =&gt; 'fail',\n    # . . .\n    'wrong' =&gt; 'right',\n    'young' =&gt; 'old'    \n;\n\nfor @*ARGS -&gt; $word {\n    say %dictionary{$word} // $word;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">Оператор <code>//<\/code> — це <a href=\"https://course.raku.org/uk/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">оператор defined-or<\/a>. Він повертає перший операнд, який визначений.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Усі ключі в хеші — це слова, схожі на ідентифікатори. Тому вам не потрібно брати їх у лапки. Це означає, що ви можете створити хеш і так:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&gt; 'below',\n    absent =&gt; 'present',\n    achieve =&gt; 'fail',\n    # . . .\n    wrong =&gt; 'right',\n    young =&gt; 'old'    \n;<\/code><\/pre>"]]},"bg":{"t":"Solution: Замяна с антоними","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Файлът с решението, <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>, започва с копие на <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">След това един цикъл минава през входните аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Той се опитва да намери всяка дума в речника.<\/span> <span class=\"sg\" data-s=\"3\">Ако успее, взема антонима.<\/span> <span class=\"sg\" data-s=\"4\">Ако такава дума няма в речника, програмата използва оригиналната дума.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Решението е по-долу, но тук е показана само част от речника.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    'achieve' =&gt; 'fail',\n    # . . .\n    'wrong' =&gt; 'right',\n    'young' =&gt; 'old'    \n;\n\nfor @*ARGS -&gt; $word {\n    say %dictionary{$word} // $word;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">Операторът <code>//<\/code> е <a href=\"https://course.raku.org/bg/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">операторът defined-or<\/a>. Той връща първия операнд, който е дефиниран.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Всички ключове в хеша са думи, които изглеждат като идентификатори. Затова не е нужно да ги слагате в кавички. Това означава, че можете да създадете хеша и така:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&gt; 'below',\n    absent =&gt; 'present',\n    achieve =&gt; 'fail',\n    # . . .\n    wrong =&gt; 'right',\n    young =&gt; 'old'    \n;<\/code><\/pre>"]]},"eo":{"t":"Solvo: Anstataŭigi per antonimoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La solva dosiero, <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>, komenciĝas per kopio de <a href=\"https://github.com/ash/raku-course/blob/master/essentials/associatives/exercises/replace-with-antonyms/dictionary.raku\" target=\"_blank\" rel=\"noopener\">dictionary.raku<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, buklo iras tra la eniraj argumentoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi provas trovi ĉiun vorton en la vortaro.<\/span> <span class=\"sg\" data-s=\"3\">Se ĝi povas, ĝi prenas la antonimon.<\/span> <span class=\"sg\" data-s=\"4\">Se ne ekzistas tia vorto en la vortaro, la originala vorto estas uzata.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La solvo estas sube, sed ĉi tie estas montrita nur parto de la vortaro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    'above' =&gt; 'below',\n    'absent' =&gt; 'present',\n    'achieve' =&gt; 'fail',\n    # . . .\n    'wrong' =&gt; 'right',\n    'young' =&gt; 'old'    \n;\n\nfor @*ARGS -&gt; $word {\n    say %dictionary{$word} // $word;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/associatives/replace-with-antonyms.raku\" target=\"_blank\" rel=\"noopener\">replace-with-antonyms.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/associatives/replace-with-antonyms.raku early morning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">La operatoro <code>//<\/code> estas la <a href=\"https://course.raku.org/eo/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">difinita-aŭ operatoro<\/a>. Ĝi redonas la unuan operandon, kiu estas difinita.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ĉiuj ŝlosiloj en la haketo estas vortoj, kiuj aspektas kiel identigiloj. Do vi ne bezonas meti ilin inter citiloj. Tio signifas, ke vi ankaŭ povas krei la haketon tiel:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&g rning\nlate\nevening\n\n$ raku exercises/associatives/replace-with-antonyms.raku big soft drive\nsmall\nhard\ndrive<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",2,"<ol><li><span class=\"sg\" data-s=\"0\">Operator <code>//<\/code> est <a href=\"https://course.raku.org/la/essentials/scalar-variables/defined-or-operator/\" target=\"_blank\" rel=\"noopener\">operator definitus-vel<\/a>. Primum operandum definitum reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Omnes claves in hash sunt verba quae identificatoribus similia sunt. Itaque eas in quotationibus ponere non debes. Ergo hash etiam hoc modo creare potes:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my %dictionary =\n    above =&gt; 'below',\n    absent =&gt; 'present',\n    achieve =&gt; 'fail',\n    # . . .\n    wrong =&gt; 'right',\n    young =&gt; 'old'    \n;<\/code><\/pre>"]]}}}</script>
