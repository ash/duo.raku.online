lass=\"sg\" data-s=\"0\">Зверніть увагу: з <code>print<\/code> ви маєте самі додати символ нового рядка.<\/span> <span class=\"sg\" data-s=\"1\">Він стоїть у кінці повідомлення.<\/span> <span class=\"sg\" data-s=\"2\">Але не хвилюйтеся, ми розглянемо всі ці деталі пізніше.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перш ніж ми продовжимо, ось ще один цікавий варіант.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете викликати функцію як метод, прямо на рядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Hello, World!'.say;<\/code><\/pre>"]]},"bg":{"t":"Здравей, свят!","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чудесно, научихме основите.<\/span> <span class=\"sg\" data-s=\"1\">Сега можем да говорим с Raku и да виждаме отговора му.<\/span> <span class=\"sg\" data-s=\"2\">Така че нека преминем направо към първата истинска програма, „Hello, World!“.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скоро ще научим основите на функциите.<\/span> <span class=\"sg\" data-s=\"1\">Но първо нека видим няколко различни опции за тази програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Първо, можете да поставите аргумента на функцията в скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Hello, World!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второ, можете да използвате две други функции, <code>put<\/code> и <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Отново можете да ги пишете със или без скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Hello, World!';\n\nprint(\"Hello, World!\\n\");<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че с <code>print<\/code> трябва сами да добавите символа за нов ред.<\/span> <span class=\"sg\" data-s=\"1\">Той стои в края на съобщението.<\/span> <span class=\"sg\" data-s=\"2\">Но не се притеснявайте, ще разгледаме всички тези детайли по-късно.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Преди да продължим, ето още една вълнуваща опция.<\/span> <span class=\"sg\" data-s=\"1\">Можете да извикате функция като метод, директно върху низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Hello, World!'.say;<\/code><\/pre>"]]},"eo":{"t":"Saluton, Mondo!","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bonege, ni lernis la bazojn.<\/span> <span class=\"sg\" data-s=\"1\">Nun ni povas paroli al Raku kaj vidi ĝian respondon.<\/span> <span class=\"sg\" data-s=\"2\">Do ni iru rekte al la unua vera programo, ‘Saluton, Mondo!’.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Saluton, Mondo!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Baldaŭ ni lernos la bazojn de funkcioj.<\/span> <span class=\"sg\" data-s=\"1\">Sed unue ni rigardu kelkajn malsamajn opciojn por ĉi tiu programo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ĉio, vi povas meti la argumenton de la funkcio en krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Saluton, Mondo!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Due, vi povas uzi du aliajn funkciojn, <code>put<\/code> kaj <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Denove, vi povas skribi ilin kun aŭ sen krampoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Saluton, Mondo!';\n\nprint(\"Saluton, Mondo!\\n\");<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke kun <code>print<\/code> vi devas mem aldoni la novlinian karakteron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi venas ĉe la fino de la mesaĝo.<\/span> <span class=\"sg\" data-s=\"2\">Sed ne zorgu, ni rigardos ĉiujn ĉi tiujn detalojn poste.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni daŭrigas, jen unu plia ekscita opcio.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas voki funkcion kiel metodon, rekte sur la ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Saluton, Mondo!'.say;<\/code><\/pre>"]]},"la":{"t":"Salve, Mundi!","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Optime, elementa didicimus.<\/span> <span class=\"sg\" data-s=\"1\">Nunc cum Raku loqui et responsum eius videre possumus.<\/span> <span class=\"sg\" data-s=\"2\">Ergo directe ad primum verum programma eamus, ‘Salve, Mundi!’.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Salve, Mundi!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mox elementa functionum discemus.<\/span> <span class=\"sg\" data-s=\"1\">Sed primum paucas optiones diversas pro hoc programmate videamus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Primum omnium, argumentum functionis in parenthesibus ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say('Salve, Mundi!');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secundum, duabus aliis functionibus uti potes, <code>put<\/code> et <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Iterum, eas cum parenthesibus vel sine eis scribere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>put 'Salve, Mundi!';\n\nprint(\"Salve, Mundi!\\n\");<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod cum <code>print<\/code> characterem novae lineae ipse addere debes.<\/span> <span class=\"sg\" data-s=\"1\">In fine nuntii ponitur.<\/span> <span class=\"sg\" data-s=\"2\">Sed noli curare, omnia haec singula postea tractabimus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Antequam pergimus, hic est etiam una optio mirabilis.<\/span> <span class=\"sg\" data-s=\"1\">Functionem ut methodum vocare potes, directe in chorda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>'Salve, Mundi!'.say;<\/code><\/pre>"]]}}}</script>
