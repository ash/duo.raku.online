<script type="application/json" id="page-data">{"u":"essentials/scalar-variables","n":31,"k":"section","pv":"essentials/comments/embedded","nx":"essentials/scalar-variables/declaring-a-variable","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Scalar variables","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">So far, the text strings in our programs were written directly in the code.<\/span> <span class=\"sg\" data-s=\"1\">Let us add a bit of freedom now and let the program use variables.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku has a few types of variables.<\/span> <span class=\"sg\" data-s=\"1\">A variable is a container that can keep some data.<\/span> <span class=\"sg\" data-s=\"2\">We will start with the simplest containers, which keep only one value.<\/span> <span class=\"sg\" data-s=\"3\">They are called <em>scalars<\/em>, or scalar variables.<\/span> <span class=\"sg\" data-s=\"4\">The name of a variable starts with a special character.<\/span> <span class=\"sg\" data-s=\"5\">It shows what kind of container the variable is.<\/span> <span class=\"sg\" data-s=\"6\">This character is called a <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">For scalar containers, the sigil is the dollar sign <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are two examples of scalar variables:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"de":{"t":"Skalare Variablen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bisher standen die Textzeichenfolgen in unseren Programmen direkt im Code.<\/span> <span class=\"sg\" data-s=\"1\">Lassen Sie uns jetzt etwas Freiheit einführen und das Programm Variablen verwenden lassen.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku hat einige Arten von Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable ist ein Behälter, der Daten speichern kann.<\/span> <span class=\"sg\" data-s=\"2\">Wir beginnen mit den einfachsten Behältern, die nur einen Wert speichern.<\/span> <span class=\"sg\" data-s=\"3\">Man nennt sie <em>Skalare<\/em> oder skalare Variablen.<\/span> <span class=\"sg\" data-s=\"4\">Der Name einer Variablen beginnt mit einem besonderen Zeichen.<\/span> <span class=\"sg\" data-s=\"5\">Es zeigt, welche Art von Behälter die Variable ist.<\/span> <span class=\"sg\" data-s=\"6\">Dieses Zeichen heißt <em>Sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Für skalare Behälter ist das Sigil das Dollarzeichen <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind zwei Beispiele für skalare Variablen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"nl":{"t":"Scalare variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe stonden de tekststrings in onze programma's direct in de code.<\/span> <span class=\"sg\" data-s=\"1\">Laten we nu wat vrijheid toevoegen en het programma variabelen laten gebruiken.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een paar soorten variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele is een container die wat gegevens kan bewaren.<\/span> <span class=\"sg\" data-s=\"2\">We beginnen met de eenvoudigste containers, die maar één waarde bewaren.<\/span> <span class=\"sg\" data-s=\"3\">Ze heten <em>scalars<\/em>, of scalaire variabelen.<\/span> <span class=\"sg\" data-s=\"4\">De naam van een variabele begint met een speciaal teken.<\/span> <span class=\"sg\" data-s=\"5\">Het laat zien wat voor container de variabele is.<\/span> <span class=\"sg\" data-s=\"6\">Dit teken heet een <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Voor scalaire containers is de sigil het dollarteken <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn twee voorbeelden van scalaire variabelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"es":{"t":"Variables escalares","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, las cadenas de texto de nuestros programas estaban escritas directamente en el código.<\/span> <span class=\"sg\" data-s=\"1\">Vamos a añadir ahora un poco de libertad y dejar que el programa use variables.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku tiene algunos tipos de variables.<\/span> <span class=\"sg\" data-s=\"1\">Una variable es un contenedor que puede guardar algunos datos.<\/span> <span class=\"sg\" data-s=\"2\">Empezaremos con los contenedores más simples, que solo guardan un valor.<\/span> <span class=\"sg\" data-s=\"3\">Se llaman <em>escalares<\/em>, o variables escalares.<\/span> <span class=\"sg\" data-s=\"4\">El nombre de una variable empieza con un carácter especial.<\/span> <span class=\"sg\" data-s=\"5\">Indica qué tipo de contenedor es la variable.<\/span> <span class=\"sg\" data-s=\"6\">Este carácter se llama <em>sigil<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Para los contenedores escalares, el sigil es el signo de dólar <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay dos ejemplos de variables escalares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"it":{"t":"Variabili scalari","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Finora, le stringhe di testo nei nostri programmi erano scritte direttamente nel codice.<\/span> <span class=\"sg\" data-s=\"1\">Ora aggiungiamo un po' di libertà e lasciamo che il programma usi le variabili.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku ha alcuni tipi di variabili.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile è un contenitore che può contenere dei dati.<\/span> <span class=\"sg\" data-s=\"2\">Inizieremo con i contenitori più semplici, che contengono un solo valore.<\/span> <span class=\"sg\" data-s=\"3\">Si chiamano <em>scalari<\/em>, o variabili scalari.<\/span> <span class=\"sg\" data-s=\"4\">Il nome di una variabile inizia con un carattere speciale.<\/span> <span class=\"sg\" data-s=\"5\">Mostra che tipo di contenitore è la variabile.<\/span> <span class=\"sg\" data-s=\"6\">Questo carattere si chiama <em>sigillo<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Per i contenitori scalari, il sigillo è il segno del dollaro <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco due esempi di variabili scalari:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"lv":{"t":"Skalarie mainīgie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdz šim teksta virknes mūsu programmās bija ierakstītas tieši kodā.<\/span> <span class=\"sg\" data-s=\"1\">Tagad pievienosim nedaudz brīvības un ļausim programmai izmantot mainīgos.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir daži mainīgo tipi.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais ir konteiners, kas var glabāt datus.<\/span> <span class=\"sg\" data-s=\"2\">Mēs sāksim ar vienkāršākajiem konteineriem, kas glabā tikai vienu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tos sauc par <em>skalāriem<\/em> jeb skalārajiem mainīgajiem.<\/span> <span class=\"sg\" data-s=\"4\">Mainīgā nosaukums sākas ar īpašu rakstzīmi.<\/span> <span class=\"sg\" data-s=\"5\">Tā parāda, kāda veida konteiners ir šis mainīgais.<\/span> <span class=\"sg\" data-s=\"6\">Šo rakstzīmi sauc par <em>sigilu<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Skalārajiem konteineriem sigils ir dolāra zīme <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir divi skalāro mainīgo piemēri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"ru":{"t":"Скалярные переменные","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Пока что текстовые строки в наших программах были записаны прямо в коде.<\/span> <span class=\"sg\" data-s=\"1\">Давайте теперь добавим немного свободы и дадим программе использовать переменные.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько типов переменных.<\/span> <span class=\"sg\" data-s=\"1\">Переменная — это контейнер, который может хранить данные.<\/span> <span class=\"sg\" data-s=\"2\">Мы начнём с самых простых контейнеров, которые хранят только одно значение.<\/span> <span class=\"sg\" data-s=\"3\">Они называются <em>скалярами<\/em>, или скалярными переменными.<\/span> <span class=\"sg\" data-s=\"4\">Имя переменной начинается с особого символа.<\/span> <span class=\"sg\" data-s=\"5\">Он показывает, какой это вид контейнера.<\/span> <span class=\"sg\" data-s=\"6\">Этот символ называется <em>сигил<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Для скалярных контейнеров сигил — это знак доллара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот два примера скалярных переменных:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"uk":{"t":"Скалярні змінні","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досі текстові рядки в наших програмах були записані прямо в коді.<\/span> <span class=\"sg\" data-s=\"1\">Давайте тепер додамо трохи свободи і дозволимо програмі використовувати змінні.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">У Raku є кілька типів змінних.<\/span> <span class=\"sg\" data-s=\"1\">Змінна — це контейнер, який може зберігати дані.<\/span> <span class=\"sg\" data-s=\"2\">Почнемо з найпростіших контейнерів, які зберігають лише одне значення.<\/span> <span class=\"sg\" data-s=\"3\">Їх називають <em>скалярами<\/em>, або скалярними змінними.<\/span> <span class=\"sg\" data-s=\"4\">Ім'я змінної починається зі спеціального символу.<\/span> <span class=\"sg\" data-s=\"5\">Він показує, яким контейнером є змінна.<\/span> <span class=\"sg\" data-s=\"6\">Цей символ називається <em>сигіл<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Для скалярних контейнерів сигіл — це знак долара <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось два приклади скалярних змінних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"bg":{"t":"Скаларни променливи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Досега текстовите низове в нашите програми бяха написани директно в кода.<\/span> <span class=\"sg\" data-s=\"1\">Нека сега добавим малко свобода и позволим на програмата да използва променливи.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku има няколко типа променливи.<\/span> <span class=\"sg\" data-s=\"1\">Променливата е контейнер, който може да пази някакви данни.<\/span> <span class=\"sg\" data-s=\"2\">Ще започнем с най-простите контейнери, които пазят само една стойност.<\/span> <span class=\"sg\" data-s=\"3\">Те се наричат <em>скалари<\/em>, или скаларни променливи.<\/span> <span class=\"sg\" data-s=\"4\">Името на променливата започва със специален символ.<\/span> <span class=\"sg\" data-s=\"5\">Той показва какъв вид контейнер е променливата.<\/span> <span class=\"sg\" data-s=\"6\">Този символ се нарича <em>сигил<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">За скаларните контейнери сигилът е знакът за долар <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето два примера за скаларни променливи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"eo":{"t":"Skalaraj variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, la tekstaj ĉenoj en niaj programoj estis skribitaj rekte en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">Ni aldonu nun iom da libereco kaj lasu la programon uzi variablojn.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku havas kelkajn specojn de variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Variablo estas ujo, kiu povas teni iujn datumojn.<\/span> <span class=\"sg\" data-s=\"2\">Ni komencos per la plej simplaj ujoj, kiuj tenas nur unu valoron.<\/span> <span class=\"sg\" data-s=\"3\">Ili nomiĝas <em>skalaroj<\/em>, aŭ skalaraj variabloj.<\/span> <span class=\"sg\" data-s=\"4\">La nomo de variablo komenciĝas per speciala signo.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi montras, kia ujo estas la variablo.<\/span> <span class=\"sg\" data-s=\"6\">Tiu signo nomiĝas <em>sigelo<\/em>.<\/span> <span class=\"sg\" data-s=\"7\">Por skalaraj ujoj, la sigelo estas la dolara signo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen du ekzemploj de skalaraj variabloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]},"la":{"t":"Scalari variabiles","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hactenus chordae textus in programmatis nostris directe in codice scriptae erant.<\/span> <span class=\"sg\" data-s=\"1\">Nunc paulum libertatis addamus et programmati variabilibus uti permittamus.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku pauca genera variabilium habet.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis est continens quod aliqua data tenere potest.<\/span> <span class=\"sg\" data-s=\"2\">Incipiemus a continentibus simplicissimis, quae unum tantum valorem tenent.<\/span> <span class=\"sg\" data-s=\"3\">Ea <em>scalars<\/em> vel variabiles scalares vocantur.<\/span> <span class=\"sg\" data-s=\"4\">Nomen variabilis a charactere speciali incipit.<\/span> <span class=\"sg\" data-s=\"5\">Is monstrat quale continens variabilis sit.<\/span> <span class=\"sg\" data-s=\"6\">Hic character <em>sigil<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"7\">Pro continentibus scalaribus, sigil est signum dollari <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt duo exempla variabilium scalarium:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$name\n\n$age<\/code><\/pre>"]]}}}</script>
