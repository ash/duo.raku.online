<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/identifiers","n":42,"k":"topic","pv":"essentials/scalar-variables/defined-or-operator","nx":"essentials/scalar-variables/identifiers/quiz","tr":["essentials","essentials/scalar-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Variable names","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Before we go on, here is an interesting topic: which names can variables have?<\/span> <span class=\"sg\" data-s=\"1\">So far, we have seen simple names like <code>$name<\/code> or <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">They had only lowercase letters of the English alphabet.<\/span> <span class=\"sg\" data-s=\"3\">But there are more possibilities.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Upper case and lower case<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Variable names, or <em>identifiers<\/em>, are case sensitive.<\/span> <span class=\"sg\" data-s=\"1\">This means that upper case and lower case letters are different.<\/span> <span class=\"sg\" data-s=\"2\">So all the names below refer to different scalar containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Which naming style to follow is up to you.<\/span> <span class=\"sg\" data-s=\"1\">But you may want to keep all-capital names for constants.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other characters<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Some other ASCII characters are allowed too.<\/span> <span class=\"sg\" data-s=\"1\">These are digits, the underscore <code>_<\/code>, the hyphen <code>-<\/code> and the single quote <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The single quote stands for an apostrophe.<\/span> <span class=\"sg\" data-s=\"3\">Note that an identifier must start with a letter or an underscore.<\/span> <span class=\"sg\" data-s=\"4\">Both <code>-<\/code> and <code>'<\/code> must have a letter right after them.<\/span> <span class=\"sg\" data-s=\"5\">Here are a few more valid identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Again, the choice of names is yours.<\/span> <span class=\"sg\" data-s=\"1\">But it is probably bad practice to make names hard to understand on purpose.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode characters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In fact, the idea of letters and digits is wider.<\/span> <span class=\"sg\" data-s=\"1\">It includes all characters which are letters or decimal digits according to their Unicode properties.<\/span> <span class=\"sg\" data-s=\"2\">For example, the following variables are valid in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # where ۲ is a digit<\/code><\/pre>"]]},"de":{"t":"Namen der Variablen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bevor wir weitergehen, hier ein interessantes Thema: Welche Namen können Variablen haben?<\/span> <span class=\"sg\" data-s=\"1\">Bisher haben wir einfache Namen wie <code>$name<\/code> oder <code>$age<\/code> gesehen.<\/span> <span class=\"sg\" data-s=\"2\">Sie bestanden nur aus Kleinbuchstaben des englischen Alphabets.<\/span> <span class=\"sg\" data-s=\"3\">Aber es gibt noch mehr Möglichkeiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Groß- und Kleinschreibung<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Variablennamen, oder <em>Bezeichner<\/em>, unterscheiden zwischen Groß- und Kleinschreibung.<\/span> <span class=\"sg\" data-s=\"1\">Das bedeutet, dass Großbuchstaben und Kleinbuchstaben verschieden sind.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb verweisen alle Namen unten auf verschiedene skalare Container:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Welchem Namensstil Sie folgen, entscheiden Sie selbst.<\/span> <span class=\"sg\" data-s=\"1\">Aber vielleicht möchten Sie Namen aus lauter Großbuchstaben nur für Konstanten verwenden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere Zeichen<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Auch einige andere ASCII-Zeichen sind erlaubt.<\/span> <span class=\"sg\" data-s=\"1\">Das sind Ziffern, der Unterstrich <code>_<\/code>, der Bindestrich <code>-<\/code> und das einfache Anführungszeichen <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das einfache Anführungszeichen steht für einen Apostroph.<\/span> <span class=\"sg\" data-s=\"3\">Beachten Sie, dass ein Bezeichner mit einem Buchstaben oder einem Unterstrich beginnen muss.<\/span> <span class=\"sg\" data-s=\"4\">Nach <code>-<\/code> und nach <code>'<\/code> muss direkt ein Buchstabe folgen.<\/span> <span class=\"sg\" data-s=\"5\">Hier sind ein paar weitere gültige Bezeichner:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Auch hier liegt die Wahl der Namen bei Ihnen.<\/span> <span class=\"sg\" data-s=\"1\">Aber es ist wahrscheinlich kein guter Stil, Namen absichtlich schwer verständlich zu machen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Zeichen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich zählen mehr Zeichen als Buchstaben und Ziffern.<\/span> <span class=\"sg\" data-s=\"1\">Dazu gehören alle Zeichen, die nach ihren Unicode-Eigenschaften Buchstaben oder Dezimalziffern sind.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel sind die folgenden Variablen in Raku gültig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # wobei ۲ eine Ziffer ist<\/code><\/pre>"]]},"nl":{"t":"Namen van de variabelen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Voordat we verder gaan, eerst een interessant onderwerp: welke namen kunnen variabelen hebben?<\/span> <span class=\"sg\" data-s=\"1\">Tot nu toe hebben we eenvoudige namen gezien, zoals <code>$name<\/code> of <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ze hadden alleen kleine letters van het Engelse alfabet.<\/span> <span class=\"sg\" data-s=\"3\">Maar er zijn meer mogelijkheden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hoofdletters en kleine letters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Namen van variabelen, of <em>identifiers<\/em>, zijn hoofdlettergevoelig.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat hoofdletters en kleine letters verschillend zijn.<\/span> <span class=\"sg\" data-s=\"2\">Daarom verwijzen alle namen hieronder naar verschillende scalaire containers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Welke stijl je voor namen kiest, is aan jou.<\/span> <span class=\"sg\" data-s=\"1\">Maar misschien wil je namen met alleen hoofdletters bewaren voor constanten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere tekens<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ook een paar andere ASCII-tekens zijn toegestaan.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn cijfers, het onderstrepingsteken <code>_<\/code>, het koppelteken <code>-<\/code> en het enkele aanhalingsteken <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het enkele aanhalingsteken staat voor een apostrof.<\/span> <span class=\"sg\" data-s=\"3\">Let op dat een identifier moet beginnen met een letter of een onderstrepingsteken.<\/span> <span class=\"sg\" data-s=\"4\">Na zowel <code>-<\/code> als <code>'<\/code> moet direct een letter komen.<\/span> <span class=\"sg\" data-s=\"5\">Hier zijn nog een paar geldige identifiers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nogmaals, de keuze van de namen is aan jou.<\/span> <span class=\"sg\" data-s=\"1\">Maar het is waarschijnlijk geen goede gewoonte om expres namen te kiezen die moeilijk te begrijpen zijn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode tekens<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eigenlijk is het begrip letters en cijfers breder.<\/span> <span class=\"sg\" data-s=\"1\">Daarbij horen alle tekens die volgens hun Unicode-eigenschappen letters of decimale cijfers zijn.<\/span> <span class=\"sg\" data-s=\"2\">De volgende variabelen zijn bijvoorbeeld geldig in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # waarbij ۲ een cijfer is<\/code><\/pre>"]]},"es":{"t":"Nombres de las variables","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Antes de seguir, aquí hay un tema interesante: ¿qué nombres pueden tener las variables?<\/span> <span class=\"sg\" data-s=\"1\">Hasta ahora, hemos visto nombres simples como <code>$name<\/code> o <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Solo tenían letras minúsculas del alfabeto inglés.<\/span> <span class=\"sg\" data-s=\"3\">Pero hay más posibilidades.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Letras mayúsculas y minúsculas<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los nombres de variables, o <em>identificadores<\/em>, distinguen entre mayúsculas y minúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que las letras mayúsculas y minúsculas son diferentes.<\/span> <span class=\"sg\" data-s=\"2\">Así que todos los nombres de abajo se refieren a contenedores escalares diferentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tú eliges qué estilo de nombres seguir.<\/span> <span class=\"sg\" data-s=\"1\">Pero quizás quieras reservar los nombres en mayúsculas para las constantes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otros caracteres<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">También se permiten otros caracteres ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Son los dígitos, el guion bajo <code>_<\/code>, el guion <code>-<\/code> y la comilla simple <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La comilla simple representa un apóstrofe.<\/span> <span class=\"sg\" data-s=\"3\">Ten en cuenta que un identificador debe empezar con una letra o un guion bajo.<\/span> <span class=\"sg\" data-s=\"4\">Tanto <code>-<\/code> como <code>'<\/code> deben tener una letra justo después.<\/span> <span class=\"sg\" data-s=\"5\">Aquí hay algunos identificadores válidos más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otra vez, la elección de los nombres es tuya.<\/span> <span class=\"sg\" data-s=\"1\">Pero probablemente es una mala práctica hacer nombres difíciles de entender a propósito.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caracteres Unicode<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En realidad, la idea de letras y dígitos es más amplia.<\/span> <span class=\"sg\" data-s=\"1\">Incluye todos los caracteres que son letras o dígitos decimales según sus propiedades Unicode.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, las siguientes variables son válidas en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # donde ۲ es un dígito<\/code><\/pre>"]]},"it":{"t":"Nomi delle variabili","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Prima di andare avanti, ecco un argomento interessante: quali nomi possono avere le variabili?<\/span> <span class=\"sg\" data-s=\"1\">Finora abbiamo visto nomi semplici come <code>$name<\/code> o <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Avevano solo lettere minuscole dell'alfabeto inglese.<\/span> <span class=\"sg\" data-s=\"3\">Ma ci sono più possibilità.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Maiuscole e minuscole<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I nomi delle variabili, o <em>identificatori<\/em>, sono sensibili alle maiuscole.<\/span> <span class=\"sg\" data-s=\"1\">Questo vuol dire che le lettere maiuscole e minuscole sono diverse.<\/span> <span class=\"sg\" data-s=\"2\">Quindi tutti i nomi qui sotto si riferiscono a contenitori scalari diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sta a te scegliere uno stile per i nomi.<\/span> <span class=\"sg\" data-s=\"1\">Ma potresti tenere i nomi tutti in maiuscolo per le costanti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri caratteri<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Sono ammessi anche alcuni altri caratteri ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Sono le cifre, il trattino basso <code>_<\/code>, il trattino <code>-<\/code> e l'apice singolo <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'apice singolo sta per un apostrofo.<\/span> <span class=\"sg\" data-s=\"3\">Nota che un identificatore deve iniziare con una lettera o con un trattino basso.<\/span> <span class=\"sg\" data-s=\"4\">Sia <code>-<\/code> che <code>'<\/code> devono avere una lettera subito dopo.<\/span> <span class=\"sg\" data-s=\"5\">Ecco alcuni altri identificatori validi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ancora una volta, la scelta dei nomi è tua.<\/span> <span class=\"sg\" data-s=\"1\">Ma probabilmente non è una buona abitudine rendere apposta i nomi difficili da capire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caratteri Unicode<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In realtà, l'idea di lettere e cifre è più ampia.<\/span> <span class=\"sg\" data-s=\"1\">Comprende tutti i caratteri che sono lettere o cifre decimali secondo le loro proprietà Unicode.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, le variabili seguenti sono valide in Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # dove ۲ è una cifra<\/code><\/pre>"]]},"lv":{"t":"Mainīgo nosaukumi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Pirms ejam tālāk, lūk, interesanta tēma: kādi nosaukumi var būt mainīgajiem?<\/span> <span class=\"sg\" data-s=\"1\">Līdz šim esam redzējuši vienkāršus nosaukumus, piemēram, <code>$name<\/code> vai <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tajos bija tikai mazie angļu alfabēta burti.<\/span> <span class=\"sg\" data-s=\"3\">Bet ir arī citas iespējas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lielie burti un mazie burti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mainīgo nosaukumi jeb <em>identifikatori<\/em> ir reģistrjutīgi.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka lielie un mazie burti ir atšķirīgi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc visi zemāk esošie nosaukumi apzīmē dažādus skalāros konteinerus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kādu nosaukumu stilu izmantot, tas ir jūsu ziņā.<\/span> <span class=\"sg\" data-s=\"1\">Bet varbūt jūs gribēsiet nosaukumus tikai ar lielajiem burtiem atstāt konstantēm.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citi rakstzīmes<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ir atļautas arī dažas citas ASCII rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir cipari, apakšsvītra <code>_<\/code>, defise <code>-<\/code> un vienpēdiņa <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vienpēdiņa apzīmē apostrofu.<\/span> <span class=\"sg\" data-s=\"3\">Ņemiet vērā, ka identifikatoram jāsākas ar burtu vai apakšsvītru.<\/span> <span class=\"sg\" data-s=\"4\">Gan pēc <code>-<\/code>, gan pēc <code>'<\/code> uzreiz jābūt burtam.<\/span> <span class=\"sg\" data-s=\"5\">Šeit ir vēl daži derīgi identifikatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atkal, nosaukumu izvēle ir jūsu ziņā.<\/span> <span class=\"sg\" data-s=\"1\">Bet droši vien nav laba prakse tīšām veidot grūti saprotamus nosaukumus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode rakstzīmes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Patiesībā burtu un ciparu jēdziens ir plašāks.<\/span> <span class=\"sg\" data-s=\"1\">Tas ietver visas rakstzīmes, kas pēc savām Unicode īpašībām ir burti vai decimālie cipari.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, šie mainīgie Raku valodā ir derīgi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kur ۲ ir cipars<\/code><\/pre>"]]},"ru":{"t":"Имена переменных","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Прежде чем идти дальше, вот интересная тема: какие имена могут быть у переменных?<\/span> <span class=\"sg\" data-s=\"1\">Пока что мы видели простые имена вроде <code>$name<\/code> или <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В них были только строчные буквы английского алфавита.<\/span> <span class=\"sg\" data-s=\"3\">Но возможностей больше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Верхний и нижний регистр<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Имена переменных, или <em>идентификаторы<\/em>, чувствительны к регистру.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что заглавные и строчные буквы различаются.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому все имена ниже относятся к разным скалярным контейнерам:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Какой стиль имён выбрать, решать вам.<\/span> <span class=\"sg\" data-s=\"1\">Но имена из одних заглавных букв, возможно, стоит оставить для констант.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие символы<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Некоторые другие символы ASCII тоже разрешены.<\/span> <span class=\"sg\" data-s=\"1\">Это цифры, нижнее подчёркивание <code>_<\/code>, дефис <code>-<\/code> и одинарная кавычка <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Одинарная кавычка означает апостроф.<\/span> <span class=\"sg\" data-s=\"3\">Обратите внимание, что идентификатор должен начинаться с буквы или нижнего подчёркивания.<\/span> <span class=\"sg\" data-s=\"4\">Сразу после <code>-<\/code> и <code>'<\/code> должна идти буква.<\/span> <span class=\"sg\" data-s=\"5\">Вот ещё несколько допустимых идентификаторов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Опять же, имена выбираете вы сами.<\/span> <span class=\"sg\" data-s=\"1\">Но специально делать имена трудными для понимания — наверное, плохая практика.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На самом деле понятие букв и цифр шире.<\/span> <span class=\"sg\" data-s=\"1\">Оно включает все символы, которые по своим свойствам в Юникоде являются буквами или десятичными цифрами.<\/span> <span class=\"sg\" data-s=\"2\">Например, в Raku допустимы такие переменные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # где ۲ это число<\/code><\/pre>"]]},"uk":{"t":"Імена змінних","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Перш ніж іти далі, ось цікава тема: які імена можуть мати змінні?<\/span> <span class=\"sg\" data-s=\"1\">Досі ми бачили прості імена, як-от <code>$name<\/code> або <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вони складалися лише з малих літер англійського алфавіту.<\/span> <span class=\"sg\" data-s=\"3\">Але є й інші можливості.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Верхній і нижній регістр<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Імена змінних, або <em>ідентифікатори<\/em>, чутливі до регістру.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що великі й малі літери відрізняються.<\/span> <span class=\"sg\" data-s=\"2\">Тому всі імена нижче позначають різні скалярні контейнери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якого стилю імен дотримуватися — вирішувати вам.<\/span> <span class=\"sg\" data-s=\"1\">Але, можливо, варто залишити імена з одних великих літер для констант.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші символи<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Деякі інші символи ASCII теж дозволені.<\/span> <span class=\"sg\" data-s=\"1\">Це цифри, підкреслення <code>_<\/code>, дефіс <code>-<\/code> та одинарна лапка <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Одинарна лапка означає апостроф.<\/span> <span class=\"sg\" data-s=\"3\">Зверніть увагу, що ідентифікатор має починатися з літери або підкреслення.<\/span> <span class=\"sg\" data-s=\"4\">Одразу після <code>-<\/code> і <code>'<\/code> має стояти літера.<\/span> <span class=\"sg\" data-s=\"5\">Ось ще кілька допустимих ідентифікаторів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Знову ж таки, вибір імен за вами.<\/span> <span class=\"sg\" data-s=\"1\">Але навмисно робити імена незрозумілими — мабуть, погана практика.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікодні символи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Насправді поняття літер і цифр ширше.<\/span> <span class=\"sg\" data-s=\"1\">Воно включає всі символи, які є літерами або десятковими цифрами за своїми властивостями Unicode.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, такі змінні допустимі в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # де ۲ є цифрою<\/code><\/pre>"]]},"bg":{"t":"Имена на променливите","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Преди да продължим, ето една интересна тема: какви имена могат да имат променливите?<\/span> <span class=\"sg\" data-s=\"1\">Досега видяхме прости имена като <code>$name<\/code> или <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Те съдържаха само малки букви от английската азбука.<\/span> <span class=\"sg\" data-s=\"3\">Но има и повече възможности.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Големи и малки букви<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Имената на променливите, или <em>идентификаторите<\/em>, са чувствителни към големи и малки букви.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че големите и малките букви са различни.<\/span> <span class=\"sg\" data-s=\"2\">Затова всички имена по-долу сочат към различни скаларни контейнери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">От вас зависи какъв стил на имената да следвате.<\/span> <span class=\"sg\" data-s=\"1\">Но може би ще искате да запазите имената само с главни букви за константи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други символи<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Позволени са и някои други ASCII символи.<\/span> <span class=\"sg\" data-s=\"1\">Това са цифрите, долната черта <code>_<\/code>, тирето <code>-<\/code> и единичната кавичка <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Единичната кавичка означава апостроф.<\/span> <span class=\"sg\" data-s=\"3\">Имайте предвид, че идентификаторът трябва да започва с буква или с долна черта.<\/span> <span class=\"sg\" data-s=\"4\">И след <code>-<\/code>, и след <code>'<\/code> трябва веднага да има буква.<\/span> <span class=\"sg\" data-s=\"5\">Ето още няколко валидни идентификатора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отново, изборът на имена е ваш.<\/span> <span class=\"sg\" data-s=\"1\">Но вероятно е лоша практика нарочно да правите имената трудни за разбиране.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode символи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всъщност понятието за букви и цифри е по-широко.<\/span> <span class=\"sg\" data-s=\"1\">То включва всички символи, които са букви или десетични цифри според своите Unicode свойства.<\/span> <span class=\"sg\" data-s=\"2\">Например, следните променливи са валидни в Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # където ۲ е цифра<\/code><\/pre>"]]},"eo":{"t":"Nomoj de la variabloj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni daŭrigas, jen interesa temo: kiajn nomojn povas havi variabloj?<\/span> <span class=\"sg\" data-s=\"1\">Ĝis nun, ni vidis simplajn nomojn kiel <code>$name<\/code> aŭ <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ili havis nur minusklojn de la angla alfabeto.<\/span> <span class=\"sg\" data-s=\"3\">Sed estas pli da eblecoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Majuskloj kaj minuskloj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomoj de variabloj, aŭ <em>identigiloj<\/em>, estas sentemaj al majuskloj kaj minuskloj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke majuskloj kaj minuskloj estas malsamaj.<\/span> <span class=\"sg\" data-s=\"2\">Do ĉiuj nomoj sube rilatas al malsamaj skalaj ujoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi mem decidas, kiun stilon de nomoj sekvi.<\/span> <span class=\"sg\" data-s=\"1\">Sed eble vi volos rezervi nomojn el nur majuskloj por konstantoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj signoj<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Kelkaj aliaj ASCII-signoj ankaŭ estas permesitaj.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estas ciferoj, la substreko <code>_<\/code>, la streko <code>-<\/code> kaj la unuopa citilo <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La unuopa citilo signifas apostrofon.<\/span> <span class=\"sg\" data-s=\"3\">Notu, ke identigilo devas komenciĝi per litero aŭ substreko.<\/span> <span class=\"sg\" data-s=\"4\">Ambaŭ <code>-<\/code> kaj <code>'<\/code> devas havi literon tuj post si.<\/span> <span class=\"sg\" data-s=\"5\">Jen kelkaj pliaj validaj identigiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Denove, la elekto de nomoj estas via.<\/span> <span class=\"sg\" data-s=\"1\">Sed verŝajne estas malbona kutimo intence fari nomojn malfacile kompreneblaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj signoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fakte, la ideo de literoj kaj ciferoj estas pli larĝa.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi inkluzivas ĉiujn signojn, kiuj estas literoj aŭ decimalaj ciferoj laŭ siaj Unikodaj ecoj.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la jenaj variabloj estas validaj en Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # kie ۲ estas cifero<\/code><\/pre>"]]},"la":{"t":"Nomina variabilium","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Antequam pergimus, ecce res iucunda: quae nomina variabiles habere possunt?<\/span> <span class=\"sg\" data-s=\"1\">Hactenus nomina simplicia vidimus, ut <code>$name<\/code> vel <code>$age<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ea solum litteras minusculas alphabeti Anglici habebant.<\/span> <span class=\"sg\" data-s=\"3\">Sed plures possibilitates sunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Maiusculae et minusculae<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomina variabilium, vel <em>identificatores<\/em>, sunt sensitiva ad litteras.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat litteras maiusculas et minusculas differre.<\/span> <span class=\"sg\" data-s=\"2\">Itaque omnia nomina infra ad diversa continentia scalaria referunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$myname\n\n$MyName\n\n$myName\n\n$MYNAME<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quam rationem nominandi sequaris, tua res est.<\/span> <span class=\"sg\" data-s=\"1\">Sed fortasse nomina tota maiuscula pro constantibus servare vis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliae litterae<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Etiam alii characteres ASCII permittuntur.<\/span> <span class=\"sg\" data-s=\"1\">Sunt digiti, underscore <code>_<\/code>, hyphen <code>-<\/code> et apex singulus <code>'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Apex singulus pro apostropho stat.<\/span> <span class=\"sg\" data-s=\"3\">Nota identificatorem a littera vel ab underscore incipere debere.<\/span> <span class=\"sg\" data-s=\"4\">Et <code>-<\/code> et <code>'<\/code> litteram statim post se habere debent.<\/span> <span class=\"sg\" data-s=\"5\">Ecce aliquot alii identificatores validi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$___\n\n$a'b'c\n\n$my-name\n\n$address2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iterum, electio nominum tua est.<\/span> <span class=\"sg\" data-s=\"1\">Sed fortasse mala consuetudo est nomina consulto obscura facere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Characteres Unicode<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Re vera notio litterarum et digitorum latior est.<\/span> <span class=\"sg\" data-s=\"1\">Omnes characteres includit qui secundum proprietates Unicode litterae vel digiti decimales sunt.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, variabiles sequentes in Raku validae sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$привет\n\n$駱駝道\n\n$αβγ\n\n$Δ۲ # ubi ۲ est digitus<\/code><\/pre>"]]}}}</script>
