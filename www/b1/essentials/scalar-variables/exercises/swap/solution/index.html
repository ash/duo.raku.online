e>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi vederlo facilmente se cambi i valori a destra, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa volta ci sono ancora più avvisi.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi anche vedere che solo <code>$b<\/code> ha cambiato il suo valore:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"lv":{"t":"Risinājums: Vērtību apmaiņa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šajā programmā mēs izmantojam Raku sintakses daļas no sadaļas par <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu un pārbaudiet, vai tā izdrukā vērtības citā secībā.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šai programmai ir trīs soļi.<\/span> <span class=\"sg\" data-s=\"1\">Tā izveido mainīgos un piešķir tiem vērtības, samaina vērtības vietām un izdrukā tās.<\/span> <span class=\"sg\" data-s=\"2\">Katrs solis izmanto abus mainīgos vienā un tajā pašā paziņojumā.<\/span> <span class=\"sg\" data-s=\"3\">Visinteresantākais ir tas, kā mainīgie apmainās ar vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iekavas kreisajā pusē ir nepieciešamas.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varat tās pievienot arī labajā pusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kas notiek, ja jūs izlaižat iekavas?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šajā gadījumā Raku jūs brīdina, ka <code>$a<\/code> labajā pusē netiek izmantots:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda, 2. rinda)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Patiesībā šī rinda dara to pašu, ko bezjēdzīgā piešķiršana <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To var viegli redzēt, ja jūs nomaināt vērtības labajā pusē, piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šoreiz brīdinājumu ir vēl vairāk.<\/span> <span class=\"sg\" data-s=\"1\">Bet jūs varat arī redzēt, ka tikai <code>$b<\/code> mainīja savu vērtību:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nBRĪDINĀJUMI par /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nBezjēdzīga \"*\" izmantošana izteiksmē \"3 * $a\" sink kontekstā (2. rinda)\nBezjēdzīga $a izmantošana sink kontekstā (2. rinda)\n10, 40<\/code><\/pre>"]]},"ru":{"t":"Решение: Замена значений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В этой программе мы используем элементы синтаксиса Raku из раздела о <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных переменных<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите программу и проверьте, что она печатает значения в другом порядке.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этой программе три шага.<\/span> <span class=\"sg\" data-s=\"1\">Она создаёт переменные и присваивает им значения, меняет значения местами и печатает их.<\/span> <span class=\"sg\" data-s=\"2\">Каждый шаг использует обе переменные в одной инструкции.<\/span> <span class=\"sg\" data-s=\"3\">Самое интересное — то, как переменные обмениваются значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скобки с левой стороны обязательны.<\/span> <span class=\"sg\" data-s=\"1\">Но их также можно добавить с правой стороны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что будет, если убрать скобки?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В этом случае Raku предупредит вас, что <code>$a<\/code> с правой стороны не используется:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На самом деле эта строка делает то же, что и бесполезное присваивание <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это легко увидеть, если изменить значения справа, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этот раз предупреждений ещё больше.<\/span> <span class=\"sg\" data-s=\"1\">Но также видно, что значение изменилось только у <code>$b<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"uk":{"t":"Розв'язання: Обмін значеннями","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">У цій програмі ми використовуємо частини синтаксису Raku з розділу про <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярні змінні<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму і перевірте, що вона виводить значення в іншому порядку.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ця програма має три кроки.<\/span> <span class=\"sg\" data-s=\"1\">Вона створює змінні та присвоює їм значення, міняє значення місцями і виводить їх.<\/span> <span class=\"sg\" data-s=\"2\">Кожен крок використовує обидві змінні в одному виразі.<\/span> <span class=\"sg\" data-s=\"3\">Найцікавіше — це те, як змінні обмінюються значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дужки з лівого боку обов'язкові.<\/span> <span class=\"sg\" data-s=\"1\">Але ви можете додати їх і з правого боку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що станеться, якщо пропустити дужки?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У цьому разі Raku попереджає вас, що <code>$a<\/code> праворуч не використовується:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Насправді цей рядок робить те саме, що й непотрібне присвоєння <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це легко побачити, якщо змінити значення праворуч, наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цього разу попереджень ще більше.<\/span> <span class=\"sg\" data-s=\"1\">Але ви також бачите, що змінилося значення лише <code>$b<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"bg":{"t":"Solution: Размяна на стойности","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В тази програма използваме части от синтаксиса на Raku от секцията за <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларни променливи<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата и проверете, че тя отпечатва стойностите в различен ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази програма има три стъпки.<\/span> <span class=\"sg\" data-s=\"1\">Тя създава променливите и им присвоява стойности, разменя стойностите им и ги отпечатва.<\/span> <span class=\"sg\" data-s=\"2\">Всяка стъпка използва двете променливи в едно и също изречение.<\/span> <span class=\"sg\" data-s=\"3\">Най-интересното е как променливите си разменят стойностите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Скобите от лявата страна са задължителни.<\/span> <span class=\"sg\" data-s=\"1\">Но можете да ги добавите и от дясната страна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво става, ако пропуснете скобите?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В този случай Raku ви предупреждава, че <code>$a<\/code> от дясната страна не се използва:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of $a in sink context (lines 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всъщност този ред прави същото като безполезното присвояване <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Лесно можете да видите това, ако промените стойностите отдясно, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този път има още повече предупреждения.<\/span> <span class=\"sg\" data-s=\"1\">Но също така можете да видите, че само <code>$b<\/code> промени своята стойност:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nWARNINGS for /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nUseless use of \"*\" in expression \"3 * $a\" in sink context (line 2)\nUseless use of $a in sink context (line 2)\n10, 40<\/code><\/pre>"]]},"eo":{"t":"Solvo: Interŝanĝi valorojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu programo, ni uzas partojn de Raku-sintakso el la sekcio pri <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj variabloj<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontokodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj kontrolu, ke ĝi presas la valorojn en malsama ordo.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo havas tri paŝojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kreas kaj asignas la variablojn, interŝanĝas iliajn valorojn kaj presas ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu paŝo uzas ambaŭ variablojn en la sama deklaro.<\/span> <span class=\"sg\" data-s=\"3\">La plej interesa parto estas, kiel la variabloj interŝanĝas siajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La krampoj ĉe la maldekstra flanko estas necesaj.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas aldoni ilin ĉe la dekstra flanko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas, se vi forlasas la krampojn?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu kazo, Raku avertas vin, ke <code>$a<\/code> ĉe la dekstra flanko ne estas uzata:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de $a en sink-kunteksto (linioj 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fakte, ĉi tiu linio faras la samon kiel la senutila asigno <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas facile vidi tion, se vi ŝanĝas la valorojn dekstre, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, estas eĉ pli da avertoj.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas vidi, ke nur <code>$b<\/code> ŝanĝis sian valoron:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nAVERTOJ por /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nSenzaŭza uzo de \"*\" en esprimo \"3 * $a\" en sink-kunteksto (linio 2)\nSenzaŭza uzo de $a en sink-kunteksto (linio 2)\n10, 40<\/code><\/pre>"]]},"la":{"t":"Solutio: Commutatio valorum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In hoc programmate partibus syntaxis Raku ex sectione de <a href=\"https://course.raku.org/la/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">variabilibus scalaribus<\/a> utimur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my ($a, $b) = 10, 20;\n($a, $b) = $b, $a;\nsay \"$a, $b\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/swap.raku\" target=\"_blank\" rel=\"noopener\">swap.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma currite et confirmate id valores in alio ordine imprimere.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/swap.raku\n20, 10<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc programma tres gradus habet.<\/span> <span class=\"sg\" data-s=\"1\">Variabiles creat et assignat, valores earum permutat et eas imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Omnis gradus ambas variabiles in eadem enuntiatione adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Pars maxime iucunda est modus quo variabiles valores suos commutant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = $b, $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parentheses in latere sinistro necessariae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed eas etiam in latere dextro addere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>($a, $b) = ($b, $a);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid fit si parentheses omittis?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = $b, $a;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc casu Raku te monet <code>$a<\/code> in latere dextro non adhiberi:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus $a in contextu sink (lineae 2, 2)\n10, 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Re vera haec linea idem facit atque inutilis assignatio <code>$b = $b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc facile videre potes si valores in latere dextro mutas, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$a, $b = 2 * $b, 3 * $a;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore etiam plures monitiones sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed etiam videre potes solum <code>$b<\/code> valorem suum mutavisse:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/scalar-variables/swap.raku\nMONITIONES pro /Users/ash/raku-course/exercises/scalar-variables/swap.raku:\nInutilis usus \"*\" in expressione \"3 * $a\" in contextu sink (linea 2)\nInutilis usus $a in contextu sink (linea 2)\n10, 40<\/code><\/pre>"]]}}}</script>
