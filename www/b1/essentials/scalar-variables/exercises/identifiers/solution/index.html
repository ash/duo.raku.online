 Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Имя не может начинаться с апострофа, а точнее, с одинарной кавычки: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Имя не может начинаться и с цифры: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Два дефиса не могут идти друг за другом: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Solution: Виправлення ідентифікаторів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Є кілька способів виправити ідентифікатори.<\/span> <span class=\"sg\" data-s=\"1\">Ось деякі з них:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усі ідентифікатори дійсні.<\/span> <span class=\"sg\" data-s=\"1\">Але краще уникати апострофів в іменах, якщо у вас <code>$немає<\/code> вагомих причин.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця програма нічого не виводить.<\/span> <span class=\"sg\" data-s=\"1\">Але коли Rakudo компілює і запускає її, ви не повинні отримати жодних помилок:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте подивимося, що було не так з оригінальними іменами:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Пробіли в іменах не дозволені: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Змінній потрібен сигіл: <code>Name<\/code>. У Raku можуть бути змінні без сигіла, але навіть їх не можна оголосити як <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Ім'я не може починатися з апострофа, а точніше, з одинарної лапки: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Ім'я не може починатися і з цифри: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Два дефіси не можуть стояти один за одним: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Поправете идентификаторите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има няколко начина да поправите идентификаторите.<\/span> <span class=\"sg\" data-s=\"1\">Ето някои от тях:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Втора улица, 12';\nmy $from-to = 'Лондон до Париж';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всички идентификатори са валидни.<\/span> <span class=\"sg\" data-s=\"1\">Но е по-добре да избягвате апострофи в имената, ако нямате (<code>$don't<\/code>) силни причини.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази програма не отпечатва нищо.<\/span> <span class=\"sg\" data-s=\"1\">Но когато Rakudo я компилира и изпълни, не трябва да получите никакви грешки:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека видим какво не беше наред с първоначалните имена:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Интервалите не са позволени в имената: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Променливата има нужда от сигил: <code>Name<\/code>. В Raku може да има променливи без сигил, но дори те не могат да се декларират като <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Името не може да започва с апостроф, или, по-точно, с единична кавичка: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Името не може да започва и с цифра: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Две тирета не могат да стоят едно след друго: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Korekti la identigilojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Estas pluraj manieroj korekti la identigilojn.<\/span> <span class=\"sg\" data-s=\"1\">Jen kelkaj el ili:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj identigiloj estas validaj.<\/span> <span class=\"sg\" data-s=\"1\">Sed estas pli bone eviti apostrofojn en nomoj, se vi <code>$don't<\/code> havas fortajn kialojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas nenion.<\/span> <span class=\"sg\" data-s=\"1\">Sed kiam Rakudo kompilas kaj rulas ĝin, vi ne devus ricevi erarojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni rigardu, kio estis malĝusta en la originalaj nomoj:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Spacoj ne estas permesitaj en nomoj: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variablo bezonas sigilon: <code>Name<\/code>. Raku povas havi variablojn sen sigilo, sed eĉ ili ne povas esti deklaritaj kiel <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Nomo ne povas komenciĝi per apostrofo, aŭ, por esti preciza, per unuopa citilo: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nomo ankaŭ ne povas komenciĝi per cifero: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Du streketoj ne povas veni unu post la alia: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Corrigere identifiers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Plures modi sunt ad identificatores corrigendos.<\/span> <span class=\"sg\" data-s=\"1\">Hic sunt aliqui ex eis:<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $AGE = 30;\nmy $Name = 'Valdis';\nmy $Middle'Name = 'C.';\nmy $address2 = 'Second street, 12';\nmy $from-to = 'London to Paris';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes identificatores validi sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed melius est apostrophos in nominibus vitare, si <code>$non<\/code> habes causas graves.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/scalar-variables/identifiers.raku\" target=\"_blank\" rel=\"noopener\">identifiers.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc programma nihil imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Sed cum Rakudo id compilat et exsequitur, errores accipere non debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/scalar-variables/identifiers.raku<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Videamus quae vitia nomina originalia habebant:<\/span><\/p>"],["list",5,"<ol><li><span class=\"sg\" data-s=\"0\">Spatia in nominibus non permittuntur: <code>$ A G E<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Variabilis sigillum requirit: <code>Name<\/code>. Raku variabiles sine sigillo habere potest, sed etiam eae declarari non possunt ut <code>my Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Nomen ab apostropho incipere non potest, vel potius ab apice singulo: <code>$'Middle'Name<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nomen etiam a digito incipere non potest: <code>$2address<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"4\">Duo hyphena alterum post alterum stare non possunt: <code>$from--to<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
