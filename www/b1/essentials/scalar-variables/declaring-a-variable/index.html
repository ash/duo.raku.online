<script type="application/json" id="page-data">{"u":"essentials/scalar-variables/declaring-a-variable","n":32,"k":"topic","pv":"essentials/scalar-variables","nx":"essentials/scalar-variables/declaring-a-variable/quiz1","tr":["essentials","essentials/scalar-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Scalar variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Before you use a variable, you have to announce it.<\/span> <span class=\"sg\" data-s=\"1\">Raku has special words for this, called <em>declarators<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">To declare a variable, write <code>my<\/code> like this:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">With this line, you have created a new variable, which has no value yet.<\/span> <span class=\"sg\" data-s=\"1\">But the compiler already knows about it.<\/span> <span class=\"sg\" data-s=\"2\">When the same name appears later in the program, the compiler recognises it.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More than one variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can declare two or more variables with one <code>my<\/code> declarator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"de":{"t":"Deklarieren einer Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bevor Sie eine Variable verwenden, müssen Sie sie ankündigen.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat dafür besondere Wörter, die <em>Deklaratoren<\/em> heißen.<\/span> <span class=\"sg\" data-s=\"2\">Um eine Variable zu deklarieren, schreiben Sie <code>my<\/code> wie hier:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit dieser Zeile haben Sie eine neue Variable erstellt, die noch keinen Wert hat.<\/span> <span class=\"sg\" data-s=\"1\">Aber der Compiler kennt sie schon.<\/span> <span class=\"sg\" data-s=\"2\">Wenn derselbe Name später im Programm vorkommt, erkennt der Compiler die Variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als eine Variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können zwei oder mehr Variablen mit einem <code>my<\/code> Deklarator deklarieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"nl":{"t":"Declareren van een variabele","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Voordat je een variabele gebruikt, moet je hem aankondigen.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft hier speciale woorden voor, de <em>declarators<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Om een variabele te declareren, schrijf je <code>my<\/code>, zoals hier:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Met deze regel heb je een nieuwe variabele gemaakt, die nog geen waarde heeft.<\/span> <span class=\"sg\" data-s=\"1\">Maar de compiler kent hem al.<\/span> <span class=\"sg\" data-s=\"2\">Als dezelfde naam later in het programma staat, herkent de compiler hem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één variabele<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt twee of meer variabelen declareren met één <code>my<\/code> declarator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"es":{"t":"Declaración de una variable","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antes de usar una variable, tienes que anunciarla.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene palabras especiales para esto, llamadas <em>declaradores<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Para declarar una variable, escribe <code>my<\/code> así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con esta línea, has creado una nueva variable, que todavía no tiene valor.<\/span> <span class=\"sg\" data-s=\"1\">Pero el compilador ya sabe que existe.<\/span> <span class=\"sg\" data-s=\"2\">Cuando el mismo nombre aparece más adelante en el programa, el compilador lo reconoce.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una variable<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes declarar dos o más variables con un solo declarador <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"it":{"t":"Dichiarazione di una variabile","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima di usare una variabile, devi annunciarla.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha parole speciali per questo, chiamate <em>dichiaratori<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per dichiarare una variabile, scrivi <code>my<\/code> così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con questa riga, hai creato una nuova variabile, che non ha ancora un valore.<\/span> <span class=\"sg\" data-s=\"1\">Ma il compilatore la conosce già.<\/span> <span class=\"sg\" data-s=\"2\">Quando lo stesso nome appare più avanti nel programma, il compilatore la riconosce.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di una variabile<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi dichiarare due o più variabili con un solo dichiaratore <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"lv":{"t":"Mainīgā deklarēšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirms izmantojat mainīgo, jums tas ir jāpiesaka.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā tam ir īpaši vārdi, ko sauc par <em>deklaratoriem<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Lai deklarētu mainīgo, rakstiet <code>my<\/code> šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ar šo rindu jūs esat izveidojis jaunu mainīgo, kuram vēl nav vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Bet kompilators par to jau zina.<\/span> <span class=\"sg\" data-s=\"2\">Kad tas pats nosaukums parādās vēlāk programmā, kompilators to atpazīst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens mainīgais<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat deklarēt divus vai vairākus mainīgos ar vienu <code>my<\/code> deklaratoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"ru":{"t":"Объявление переменной","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Прежде чем использовать переменную, её нужно объявить.<\/span> <span class=\"sg\" data-s=\"1\">В Raku для этого есть специальные слова — <em>объявители<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы объявить переменную, напишите <code>my<\/code> вот так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этой строкой вы создали новую переменную, у которой пока нет значения.<\/span> <span class=\"sg\" data-s=\"1\">Но компилятор уже знает о ней.<\/span> <span class=\"sg\" data-s=\"2\">Когда это же имя появится дальше в программе, компилятор его узнает.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Больше, чем одна переменная<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете объявить две или больше переменных одним объявителем <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"uk":{"t":"Оголошення змінної","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Перш ніж використовувати змінну, її треба оголосити.<\/span> <span class=\"sg\" data-s=\"1\">У Raku для цього є спеціальні слова — <em>декларатори<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб оголосити змінну, напишіть <code>my<\/code> ось так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цим рядком ви створили нову змінну, яка поки що не має значення.<\/span> <span class=\"sg\" data-s=\"1\">Але компілятор уже знає про неї.<\/span> <span class=\"sg\" data-s=\"2\">Коли те саме ім'я з'явиться далі в програмі, компілятор її впізнає.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше ніж одна змінна<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете оголосити дві або більше змінних одним декларатором <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"bg":{"t":"Деклариране на променлива","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Преди да използвате променлива, трябва да я обявите.<\/span> <span class=\"sg\" data-s=\"1\">Raku има специални думи за това, наречени <em>декларатори<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">За да декларирате променлива, напишете <code>my<\/code> ето така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С този ред създадохте нова променлива, която още няма стойност.<\/span> <span class=\"sg\" data-s=\"1\">Но компилаторът вече знае за нея.<\/span> <span class=\"sg\" data-s=\"2\">Когато същото име се появи по-късно в програмата, компилаторът го разпознава.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една променлива<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да декларирате две или повече променливи с един декларатор <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"eo":{"t":"Deklarado de variablo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol vi uzas variablon, vi devas anonci ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas specialajn vortojn por tio, nomatajn <em>deklariloj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Por deklari variablon, skribu <code>my<\/code> jene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per ĉi tiu linio, vi kreis novan variablon, kiu ankoraŭ ne havas valoron.<\/span> <span class=\"sg\" data-s=\"1\">Sed la kompililo jam scias pri ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Kiam la sama nomo aperas poste en la programo, la kompililo rekonas ĝin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu variablo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas deklari du aŭ pli da variabloj per unu deklarilo <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]},"la":{"t":"Declarando variabilem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Antequam variabili uteris, eam annuntiare debes.<\/span> <span class=\"sg\" data-s=\"1\">Raku ad hoc verba specialia habet, quae <em>declaratores<\/em> vocantur.<\/span> <span class=\"sg\" data-s=\"2\">Ut variabilem declares, scribe <code>my<\/code> hoc modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hac linea novam variabilem creavisti, quae nondum valorem habet.<\/span> <span class=\"sg\" data-s=\"1\">Sed compilator iam de ea scit.<\/span> <span class=\"sg\" data-s=\"2\">Cum idem nomen postea in programmate apparet, compilator eam agnoscit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam una variabilis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duas vel plures variabiles uno declaratore <code>my<\/code> declarare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my ($x, $y);<\/code><\/pre>"]]}}}</script>
