oren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine weitere Möglichkeit, den Typ eines Objekts zu ändern, sind Präfixoperatoren.<\/span> <span class=\"sg\" data-s=\"1\">Das sind Operatoren aus nur einem Zeichen.<\/span> <span class=\"sg\" data-s=\"2\">Sie setzen sie direkt vor den Wert (oder eine Variable).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>~<\/code> | String-Koerzierung <code>+<\/code> | Numerische Koerzierung <code>?<\/code> | Boolesche Koerzierung<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel, das aus einer ganzen Zahl einen Booleschen Wert erstellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ?42; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Konvertierung in einen String ist ähnlich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, da \"-30\" 3 Zeichen hat<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass bei der Umwandlung in eine Zahl der Typ des Ergebnisses von der Zahl abhängt.<\/span> <span class=\"sg\" data-s=\"1\">Vergleichen Sie die folgenden Umwandlungen von Strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (+'100').WHAT;   # (Int)\nsay (+'3.14').WHAT;  # (Rat)\nsay (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um in einen Booleschen Wert umzuwandeln, können Sie auch eine Routine namens <code>so<\/code> verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktioniert als Präfixoperator oder als Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay so $value; # True\nsay $value.so; # True<\/code><\/pre>"]]},"nl":{"t":"Typen converteren met prefix operatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een andere manier om het type van een object te veranderen, is om voorvoegseloperatoren te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Dit zijn operatoren van maar één teken.<\/span> <span class=\"sg\" data-s=\"2\">Je zet ze direct voor de waarde (of een variabele).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>~<\/code> | String-coërcie <code>+<\/code> | Numerieke coërcie <code>?<\/code> | Booleaanse coërcie<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld dat een Booleaanse waarde maakt van een geheel getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ?42; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Converteren naar een string is vergelijkbaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, aangezien \"-30\" 3 tekens heeft<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Let op: bij een omzetting naar een getal hangt het type van het resultaat af van het getal.<\/span> <span class=\"sg\" data-s=\"1\">Vergelijk de volgende conversies van strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (+'100').WHAT;   # (Int)\nsay (+'3.14').WHAT;  # (Rat)\nsay (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om naar een Booleaanse waarde om te zetten, kun je ook een routine gebruiken die <code>so<\/code> heet.<\/span> <span class=\"sg\" data-s=\"1\">Die werkt als voorvoegseloperator of als methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay so $value; # True\nsay $value.so; # True<\/code><\/pre>"]]},"es":{"t":"Conversión de tipos con operadores prefijo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Otra forma de cambiar el tipo de un objeto es usar operadores prefijos.<\/span> <span class=\"sg\" data-s=\"1\">Son operadores de un solo carácter.<\/span> <span class=\"sg\" data-s=\"2\">Los pones justo antes del valor (o de una variable).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>~<\/code> | Coerción a cadena <code>+<\/code> | Coerción numérica <code>?<\/code> | Coerción  stringa è simile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, poiché \"-30\" ha 3 caratteri<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che con la conversione numerica il tipo del risultato dipende dal numero.<\/span> <span class=\"sg\" data-s=\"1\">Confronta le seguenti conversioni da stringhe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (+'100').WHAT;   # (Int)\nsay (+'3.14').WHAT;  # (Rat)\nsay (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per convertire in un valore Booleano, puoi usare anche una routine chiamata <code>so<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Funziona come operatore prefisso o come metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay so $value; # True\nsay $value.so; # True<\/code><\/pre>"]]},"lv":{"t":"Tipu konvertēšana ar prefiksu operatoriem","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vēl viens veids, kā mainīt objekta tipu, ir izmantot prefiksa operatorus.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir operatori, kas sastāv tikai no vienas rakstzīmes.<\/span> <span class=\"sg\" data-s=\"2\">Jūs tos liekat tieši pirms vērtības (vai mainīgā).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>~<\/code> | Virknes piespiedu konvertēšana <code>+<\/code> | Skaitliskā piespiedu konvertēšana <code>?<\/code> | Loģiskā piespiedu konvertēšana<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir piemērs, kas no vesela skaitļa izveido loģisko vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ?42; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Konvertēšana uz virkni ir līdzīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, jo \"-30\" ir 3 rakstzīmes<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka skaitliskajā konvertēšanā r \"><code>my $value = 42;\nsay so $value; # True\nsay $value.so; # True<\/code><\/pre>"]]},"bg":{"t":"Преобразуване на типове с префиксни оператори","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Друг начин да промените типа на обект е да използвате префиксни оператори.<\/span> <span class=\"sg\" data-s=\"1\">Това са оператори само от един символ.<\/span> <span class=\"sg\" data-s=\"2\">Поставяте ги точно преди стойността (или променливата).<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>~<\/code> | Принудително преобразуване към низ <code>+<\/code> | Принудително преобразуване към число <code>?<\/code> | Принудително преобразуване към булева стойност<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример, който създава булева стойност от цяло число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ?42; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Преобразуването към низ е подобно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, тъй като \"-30\" има 3 символа<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че при преобразуване в число типът на резултата зависи от числото.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете следните преобразувания от низове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (+'100').WHAT;   # (Int)\nsay (+'3.14').WHAT;  # (Rat)\nsay (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да преобразувате в булева стойност, можете да използвате и рутината <code>so<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя работи като префиксен оператор или като метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\nsay so $value; # True\nsay $value.so; # True<\/code><\/pre>"]]},"eo":{"t":"Konvertante tipojn kun prefiksaj operatoroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Alia maniero ŝanĝi la tipon de objekto estas uzi prefik io ad Booleanum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce exemplum quod valorem Booleanum ex integro creat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ?42; # Verum<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Converto ad stringam simile est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = -30;\nmy $s = ~$n;\nsay $s.chars; # 3, ut \"-30\" habet 3 characteres<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod in conversione numerica genus eventus a numero pendet.<\/span> <span class=\"sg\" data-s=\"1\">Compara conversiones sequentes ex stringis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (+'100').WHAT;   # (Int)\nsay (+'3.14').WHAT;  # (Rat)\nsay (+'27E-1').WHAT; # (Num)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut ad valorem Booleanum convertas, etiam rationem nomine <code>so<\/code> adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ut operator praefixus vel ut methodus operatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $valor = 42;\nsay so $valor; # Verum\nsay $valor.so; # Verum<\/code><\/pre>"]]}}}</script>
