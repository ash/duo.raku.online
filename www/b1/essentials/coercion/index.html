> <span class=\"sg\" data-s=\"2\">Mēs redzējām arī <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">virknes<\/a> un <a href=\"https://course.raku.org/lv/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">loģisko<\/a> tipu.<\/span> <span class=\"sg\" data-s=\"3\">Katram datu tipam Raku tipu sistēmā ir savs nosaukums.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Rakstzīmju virkne <code>Int<\/code> | Vesels skaitlis <code>Rat<\/code> | Racionāls skaitlis <code>Num<\/code> | Peldošā punkta skaitlis <code>Bool<\/code> | Loģiskais Būla tips<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku saprot vēl vairāk datu tipu nekā šie.<\/span> <span class=\"sg\" data-s=\"1\">Mēs tos redzēsim šī kursa nākamajās sadaļās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevumi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lūdzu, nepalaidiet garām uzdevumus pēc šīs sadaļas.<\/span> <span class=\"sg\" data-s=\"1\">Tie pastāsta vēl dažas lietas par Raku datu tipiem.<\/span><\/p>"]]},"ru":{"t":"Приведение типов данных","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Мы уже видели несколько типов данных в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это были разные виды <a href=\"https://course.raku.org/ru/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">чисел<\/a>: целые числа, рациональные числа и числа с плавающей запятой.<\/span> <span class=\"sg\" data-s=\"2\">Ещё мы видели <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">строки<\/a> и <a href=\"https://course.raku.org/ru/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">логический<\/a> тип.<\/span> <span class=\"sg\" data-s=\"3\">У каждого типа данных есть своё имя в системе типов Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Строка символов <code>Int<\/code> | Целое число <code>Rat<\/code> | Рациональное число <c "]]},"bg":{"t":"Преобразуване на типове данни","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досега видяхме няколко типа данни в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Това бяха различни видове <a href=\"https://course.raku.org/bg/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">числа<\/a>: цели числа, рационални числа и числа с плаваща запетая.<\/span> <span class=\"sg\" data-s=\"2\">Видяхме също <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">низове<\/a> и <a href=\"https://course.raku.org/bg/essentials/booleans/\" target=\"_blank\" rel=\"noopener\">булевия<\/a> тип.<\/span> <span class=\"sg\" data-s=\"3\">Всеки тип данни има свое име в системата от типове на Raku.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Str<\/code> | Низ от символи <code>Int<\/code> | Цяло число <code>Rat<\/code> | Рационално число <code>Num<\/code> | Число с плаваща запетая <code>Bool<\/code> | Логически булев<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku разбира и повече типове данни от тези.<\/span> <span class=\"sg\" data-s=\"1\">Ще ги видим в следващите секции на този курс.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упражнения<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Моля, не пропускайте упражненията след тази секция.<\/span> <span class=\"sg\" data-s=\"1\">Те ще ви разкажат още някои неща за типовете данни на Raku.<\/span><\/p>"]]},"eo":{"t":"Datentipa konvertado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, ni vidis kelkajn datumtipojn en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estis diversaj specoj de <a href=\"https://course.raku.org/eo/essentials/numbers/\" target=\"_blank\" rel=\"noopener\">nombroj<\/a>: entjeroj, raciaj nombroj kaj glitkomaj nombroj.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ vidis <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">ĉenojn<\/a> kaj la <a href=\"h
