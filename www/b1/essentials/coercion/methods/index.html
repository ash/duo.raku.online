<script type="application/json" id="page-data">{"u":"essentials/coercion/methods","n":183,"k":"topic","pv":"essentials/coercion/what/quiz","nx":"essentials/coercion/new","tr":["essentials","essentials/coercion"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Converting types using type coercion methods","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To convert, or <em>coerce<\/em>, a value to another type, call a method.<\/span> <span class=\"sg\" data-s=\"1\">The method has the same name as the data type.<\/span> <span class=\"sg\" data-s=\"2\">For example, convert a string into an integer number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In many cases, you do not need to convert values yourself.<\/span> <span class=\"sg\" data-s=\"1\">Raku does that job for you.<\/span> <span class=\"sg\" data-s=\"2\">The following code works correctly and as you would expect:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The variables <code>$a<\/code> and <code>$b<\/code> contain strings.<\/span> <span class=\"sg\" data-s=\"1\">But they are used in a calculation with <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">At this point, both strings are converted to integers, so <code>$c<\/code> also gets an integer.<\/span> <span class=\"sg\" data-s=\"3\">In the last line, the variable with the integer is interpolated in a string.<\/span> <span class=\"sg\" data-s=\"4\">Raku does what is needed to show the number as digit characters.<\/span><\/p>"]]},"de":{"t":"Typumwandlung mit Typumwandlungsmethoden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Um einen Wert in einen anderen Typ zu konvertieren oder zu <em>erzwingen<\/em>, rufen Sie eine Methode auf.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode hat denselben Namen wie der Datentyp.<\/span> <span class=\"sg\" data-s=\"2\">Wandeln Sie zum Beispiel einen String in eine ganze Zahl um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In vielen Fällen müssen Sie Werte nicht selbst konvertieren.<\/span> <span class=\"sg\" data-s=\"1\">Raku übernimmt diese Arbeit für Sie.<\/span> <span class=\"sg\" data-s=\"2\">Der folgende Code funktioniert richtig und so, wie Sie es erwarten würden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Das Ergebnis ist $c.\"; # Das Ergebnis ist 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die Variablen <code>$a<\/code> und <code>$b<\/code> enthalten Strings.<\/span> <span class=\"sg\" data-s=\"1\">Aber sie werden in einer Rechnung mit <code>+<\/code> verwendet.<\/span> <span class=\"sg\" data-s=\"2\">An dieser Stelle werden beide Strings in ganze Zahlen umgewandelt, also bekommt auch <code>$c<\/code> eine ganze Zahl.<\/span> <span class=\"sg\" data-s=\"3\">In der letzten Zeile wird die Variable mit der ganzen Zahl in einen String interpoliert.<\/span> <span class=\"sg\" data-s=\"4\">Raku tut das Nötige, um die Zahl als Ziffernzeichen darzustellen.<\/span><\/p>"]]},"nl":{"t":"Typen converteren met type coercie methoden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een waarde naar een ander type om te zetten, of te <em>forceren<\/em>, roep je een methode aan.<\/span> <span class=\"sg\" data-s=\"1\">Die methode heeft dezelfde naam als het datatype.<\/span> <span class=\"sg\" data-s=\"2\">Zet bijvoorbeeld een string om naar een integer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In veel gevallen hoef je waarden niet zelf om te zetten.<\/span> <span class=\"sg\" data-s=\"1\">Raku doet dat werk voor je.<\/span> <span class=\"sg\" data-s=\"2\">De volgende code werkt correct en zoals je zou verwachten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De variabelen <code>$a<\/code> en <code>$b<\/code> bevatten strings.<\/span> <span class=\"sg\" data-s=\"1\">Maar ze worden gebruikt in een berekening met <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Op dat moment worden beide strings omgezet naar integers, dus krijgt <code>$c<\/code> ook een integer.<\/span> <span class=\"sg\" data-s=\"3\">In de laatste regel wordt de variabele met de integer geïnterpoleerd in een string.<\/span> <span class=\"sg\" data-s=\"4\">Raku doet wat nodig is om het getal als cijfertekens te tonen.<\/span><\/p>"]]},"es":{"t":"Conversión de tipos usando métodos de coerción de tipos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para convertir, o <em>coaccionar<\/em>, un valor a otro tipo, llama a un método.<\/span> <span class=\"sg\" data-s=\"1\">El método tiene el mismo nombre que el tipo de dato.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, convierte una cadena en un número entero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En muchos casos, no necesitas convertir valores tú mismo.<\/span> <span class=\"sg\" data-s=\"1\">Raku hace ese trabajo por ti.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente código funciona correctamente y como esperarías:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Las variables <code>$a<\/code> y <code>$b<\/code> contienen cadenas.<\/span> <span class=\"sg\" data-s=\"1\">Pero se usan en un cálculo con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En este punto, las dos cadenas se convierten en enteros, así que <code>$c<\/code> también recibe un entero.<\/span> <span class=\"sg\" data-s=\"3\">En la última línea, la variable con el entero se interpola en una cadena.<\/span> <span class=\"sg\" data-s=\"4\">Raku hace lo necesario para mostrar el número como caracteres de dígitos.<\/span><\/p>"]]},"it":{"t":"Conversione dei tipi usando i metodi di coercizione del tipo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per convertire, o <em>coercere<\/em>, un valore in un altro tipo, chiama un metodo.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo ha lo stesso nome del tipo di dato.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, converti una stringa in un numero intero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In molti casi non devi convertire i valori da solo.<\/span> <span class=\"sg\" data-s=\"1\">Raku fa questo lavoro per te.<\/span> <span class=\"sg\" data-s=\"2\">Il codice seguente funziona in modo corretto, proprio come ti aspetteresti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Le variabili <code>$a<\/code> e <code>$b<\/code> contengono stringhe.<\/span> <span class=\"sg\" data-s=\"1\">Ma sono usate in un calcolo con <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A questo punto, tutte e due le stringhe vengono convertite in interi, quindi anche <code>$c<\/code> riceve un intero.<\/span> <span class=\"sg\" data-s=\"3\">Nell'ultima riga, la variabile con l'intero viene interpolata in una stringa.<\/span> <span class=\"sg\" data-s=\"4\">Raku fa quello che serve per mostrare il numero come una serie di cifre.<\/span><\/p>"]]},"lv":{"t":"Tipu konvertēšana, izmantojot tipu piespiedu metodes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai konvertētu jeb <em>piespiestu<\/em> vērtību uz citu tipu, izsauciet metodi.<\/span> <span class=\"sg\" data-s=\"1\">Metodei ir tāds pats nosaukums kā datu tipam.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, konvertējiet virkni par veselu skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Daudzos gadījumos jums nav pašiem jākonvertē vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Raku izdara šo darbu jūsu vietā.<\/span> <span class=\"sg\" data-s=\"2\">Šis kods strādā pareizi un tā, kā jūs to gaidītu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Rezultāts ir $c.\"; # Rezultāts ir 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Mainīgie <code>$a<\/code> un <code>$b<\/code> satur virknes.<\/span> <span class=\"sg\" data-s=\"1\">Bet tie tiek izmantoti aprēķinā ar <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šajā brīdī abas virknes tiek pārveidotas par veseliem skaitļiem, tāpēc arī <code>$c<\/code> saņem veselu skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Pēdējā rindā mainīgais ar veselo skaitli tiek interpolēts virknē.<\/span> <span class=\"sg\" data-s=\"4\">Raku izdara visu vajadzīgo, lai parādītu skaitli kā ciparu rakstzīmes.<\/span><\/p>"]]},"ru":{"t":"Приведение типов с помощью методов приведения типов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы преобразовать, или <em>привести<\/em>, значение к другому типу, вызовите метод.<\/span> <span class=\"sg\" data-s=\"1\">У метода такое же имя, как у типа данных.<\/span> <span class=\"sg\" data-s=\"2\">Например, преобразуйте строку в целое число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Во многих случаях вам не нужно преобразовывать значения самим.<\/span> <span class=\"sg\" data-s=\"1\">Raku делает эту работу за вас.<\/span> <span class=\"sg\" data-s=\"2\">Следующий код работает правильно и так, как вы и ожидаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Переменные <code>$a<\/code> и <code>$b<\/code> содержат строки.<\/span> <span class=\"sg\" data-s=\"1\">Но они используются в вычислении с <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В этот момент обе строки преобразуются в целые числа, поэтому <code>$c<\/code> тоже получает целое число.<\/span> <span class=\"sg\" data-s=\"3\">В последней строке переменная с целым числом интерполируется в строку.<\/span> <span class=\"sg\" data-s=\"4\">Raku делает всё, что нужно, чтобы показать число как символы цифр.<\/span><\/p>"]]},"uk":{"t":"Перетворення типів за допомогою методів примусу типів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб перетворити, або <em>примусово привести<\/em>, значення до іншого типу, викличте метод.<\/span> <span class=\"sg\" data-s=\"1\">Метод має таку саму назву, як тип даних.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, перетворіть рядок на ціле число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У багатьох випадках вам не потрібно перетворювати значення самостійно.<\/span> <span class=\"sg\" data-s=\"1\">Raku робить цю роботу за вас.<\/span> <span class=\"sg\" data-s=\"2\">Наступний код працює правильно і так, як ви й очікуєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Змінні <code>$a<\/code> і <code>$b<\/code> містять рядки.<\/span> <span class=\"sg\" data-s=\"1\">Але вони використовуються в обчисленні з <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">У цей момент обидва рядки перетворюються на цілі числа, тому <code>$c<\/code> теж отримує ціле число.<\/span> <span class=\"sg\" data-s=\"3\">В останньому рядку змінна з цілим числом інтерполюється в рядок.<\/span> <span class=\"sg\" data-s=\"4\">Raku робить усе потрібне, щоб показати число як символи цифр.<\/span><\/p>"]]},"bg":{"t":"Преобразуване на типове с методи за преобразуване на типове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За да преобразувате, или <em>принудително преобразувате<\/em>, стойност в друг тип, извикайте метод.<\/span> <span class=\"sg\" data-s=\"1\">Методът има същото име като типа данни.<\/span> <span class=\"sg\" data-s=\"2\">Например, преобразувайте низ в цяло число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В много случаи не е нужно сами да преобразувате стойностите.<\/span> <span class=\"sg\" data-s=\"1\">Raku върши тази работа вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Следният код работи правилно и така, както бихте очаквали:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"Резултатът е $c.\"; # Резултатът е 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Променливите <code>$a<\/code> и <code>$b<\/code> съдържат низове.<\/span> <span class=\"sg\" data-s=\"1\">Но те се използват в пресмятане с <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В този момент двата низа се преобразуват в цели числа, така че <code>$c<\/code> също получава цяло число.<\/span> <span class=\"sg\" data-s=\"3\">На последния ред променливата с цялото число се интерполира в низ.<\/span> <span class=\"sg\" data-s=\"4\">Raku прави нужното, за да покаже числото като цифрови символи.<\/span><\/p>"]]},"eo":{"t":"Konvertante tipojn uzante tipajn devigmetodojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por konverti, aŭ <em>devigi<\/em>, valoron al alia tipo, voku metodon.<\/span> <span class=\"sg\" data-s=\"1\">La metodo havas la saman nomon kiel la datumtipo.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, konvertu ŝnuron al entjera nombro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En multaj kazoj, vi ne bezonas mem konverti valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Raku faras tiun laboron por vi.<\/span> <span class=\"sg\" data-s=\"2\">La sekva kodo funkcias ĝuste kaj tiel, kiel vi atendus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"La rezulto estas $c.\"; # La rezulto estas 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La variabloj <code>$a<\/code> kaj <code>$b<\/code> enhavas ŝnurojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed ili estas uzataj en kalkulo kun <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En tiu momento, ambaŭ ŝnuroj estas konvertitaj al entjeroj, do <code>$c<\/code> ankaŭ ricevas entjeron.<\/span> <span class=\"sg\" data-s=\"3\">En la lasta linio, la variablo kun la entjero estas interpolita en ŝnuron.<\/span> <span class=\"sg\" data-s=\"4\">Raku faras tion, kio necesas por montri la nombron kiel ciferajn karakterojn.<\/span><\/p>"]]},"la":{"t":"Convertendo generibus utendo coercitionis methodis","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut valorem ad alium typum convertas, vel <em>coerceas<\/em>, methodum voca.<\/span> <span class=\"sg\" data-s=\"1\">Methodus idem nomen habet ac genus datorum.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, converte stringam in numerum integrum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $howmany = '42';\nmy $n = $howmany.Int;\nsay $n;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In multis casibus non opus est valores ipse convertere.<\/span> <span class=\"sg\" data-s=\"1\">Raku id opus pro te facit.<\/span> <span class=\"sg\" data-s=\"2\">Codex sequens recte operatur, sicut exspectes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '10';\nmy $b = '20';\nmy $c = $a + $b;\nsay \"The result is $c.\"; # The result is 30.<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Variabiles <code>$a<\/code> et <code>$b<\/code> stringas continent.<\/span> <span class=\"sg\" data-s=\"1\">Sed in calculo cum <code>+<\/code> adhibentur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc loco ambae stringae in integros convertuntur, itaque <code>$c<\/code> quoque integrum accipit.<\/span> <span class=\"sg\" data-s=\"3\">In ultima linea, variabilis cum integro in stringa interpolatur.<\/span> <span class=\"sg\" data-s=\"4\">Raku facit quod necesse est, ut numerum ut characteres digitorum ostendat.<\/span><\/p>"]]}}}</script>
