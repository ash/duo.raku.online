<script type="application/json" id="page-data">{"u":"essentials/coercion/what","n":181,"k":"topic","pv":"essentials/coercion","nx":"essentials/coercion/what/quiz","tr":["essentials","essentials/coercion"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Introspection with <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">To see the data type in a variable, call the <code>WHAT<\/code> method on it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">As you can see in the comments, the type is printed in parentheses.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>(Int)<\/code> or <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It is no problem to call a method on a literal itself.<\/span> <span class=\"sg\" data-s=\"1\">For example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Note that we put <code>-1<\/code> in parentheses.<\/span> <span class=\"sg\" data-s=\"1\">Without them, <code>say -1.WHAT<\/code> would try to put a minus before the result of <code>1.WHAT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This leads to an exception.<\/span><\/p>"]]},"de":{"t":"Introspektion mit <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Um den Datentyp in einer Variablen zu sehen, rufen Sie die Methode <code>WHAT<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie Sie in den Kommentaren sehen, wird der Typ in Klammern ausgegeben.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel <code>(Int)<\/code> oder <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Es ist kein Problem, eine Methode direkt auf einem Literal aufzurufen.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass wir <code>-1<\/code> in Klammern setzen.<\/span> <span class=\"sg\" data-s=\"1\">Ohne sie würde <code>say -1.WHAT<\/code> versuchen, ein Minus vor das Ergebnis von <code>1.WHAT<\/code> zu setzen.<\/span> <span class=\"sg\" data-s=\"2\">Das führt zu einer Ausnahme.<\/span><\/p>"]]},"nl":{"t":"Introspectie met <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Om het gegevenstype in een variabele te zien, roep je de <code>WHAT<\/code>-methode erop aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zoals je in de opmerkingen ziet, wordt het type tussen haakjes afgedrukt.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld <code>(Int)<\/code> of <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het is geen probleem om een methode op een letterlijke waarde zelf aan te roepen.<\/span> <span class=\"sg\" data-s=\"1\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let op dat we <code>-1<\/code> tussen haakjes zetten.<\/span> <span class=\"sg\" data-s=\"1\">Zonder haakjes zou <code>say -1.WHAT<\/code> proberen een minteken te zetten voor het resultaat van <code>1.WHAT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat leidt tot een uitzondering.<\/span><\/p> \/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke ni metas <code>-1<\/code> en krampojn.<\/span> <span class=\"sg\" data-s=\"1\">Sen ili, <code>say -1.WHAT<\/code> provus meti minuson antaŭ la rezulton de <code>1.WHAT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio kondukas al escepto.<\/span><\/p>"]]},"la":{"t":"Introspectio cum <code>WHAT<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut genus datorum in variabili videas, methodum <code>WHAT<\/code> in ea voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 42;\nmy $s = '42';\nsay $n.WHAT; # (Int)\nsay $s.WHAT; # (Str)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut in commentariis videre potes, genus in parenthesibus imprimitur.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>(Int)<\/code> vel <code>(Str)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodum in litterali ipso vocare nullum problema est.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.WHAT;      # (Int)\nsay (-1).WHAT;    # (Int)\nsay 'Hello'.WHAT; # (Str)\nsay True.WHAT;    # (Bool)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod <code>-1<\/code> in parenthesibus ponimus.<\/span> <span class=\"sg\" data-s=\"1\">Sine eis, <code>say -1.WHAT<\/code> signum minus ante eventum <code>1.WHAT<\/code> ponere conaretur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc ad exceptionem ducit.<\/span><\/p>"]]}}}</script>
