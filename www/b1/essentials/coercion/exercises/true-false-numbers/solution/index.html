<script type="application/json" id="page-data">{"u":"essentials/coercion/exercises/true-false-numbers/solution","n":188,"k":"solution","pv":"essentials/coercion/exercises/true-false-numbers","nx":"essentials/coercion/exercises/true-false-strings","tr":["essentials","essentials/coercion"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Solution of ‘True and False integers’","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The fastest way to answer the question is to test a few numbers at once.<\/span> <span class=\"sg\" data-s=\"1\">Use the <code>?<\/code> operator on all of them and compare the results:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for -2, -0.5, -1/3, 0, 1/3, 0.5, 2 -&gt; $n {\n    say \"$n -&gt; {?$n}\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">From the output, the pattern is clear.<\/span> <span class=\"sg\" data-s=\"1\">Every value prints <code>True<\/code>, except the one in the middle:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">-2 -&gt; True     -0.5 -&gt; True     -0.333333 -&gt; True     0 -&gt; False     0.333333 -&gt; True     0.5 -&gt; True     2 -&gt; True<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So the sign and the size of the number do not matter at all.<\/span> <span class=\"sg\" data-s=\"1\">Only zero counts as <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The next question is whether this is true for every numeric type.<\/span> <span class=\"sg\" data-s=\"3\">Note that <code>0<\/code> is an <code>Int<\/code>, <code>0.0<\/code> is a <code>Rat<\/code>, and <code>0e0<\/code> is a <code>Num<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, nothing changes if you first change the sign of the number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the full program with the above example in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Veraj kaj falsaj nombroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La plej rapida maniero respondi la demandon estas testi kelkajn nombrojn samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Uzu la operatoron <code>?<\/code> sur ĉiuj kaj komparu la rezultojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for -2, -0.5, -1/3, 0, 1/3, 0.5, 2 -&gt; $n {\n    say \"$n -&gt; {?$n}\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El la eligo, la ŝablono estas klara.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu valoro presas <code>True<\/code>, krom tiu en la mezo:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">-2 -&gt; True     -0.5 -&gt; True     -0.333333 -&gt; True     0 -&gt; False     0.333333 -&gt; True     0.5 -&gt; True     2 -&gt; True<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do la signo kaj la grandeco de la nombro tute ne gravas.<\/span> <span class=\"sg\" data-s=\"1\">Nur nulo validas kiel <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sekva demando estas, ĉu tio veras por ĉiu nombra tipo.<\/span> <span class=\"sg\" data-s=\"3\">Notu, ke <code>0<\/code> estas <code>Int<\/code>, <code>0.0<\/code> estas <code>Rat<\/code>, kaj <code>0e0<\/code> estas <code>Num<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $int-zero = 0;\nsay ?$int-zero; # False\n\nmy Rat $rat-zero = 0.0;\nsay ?$rat-zero; # False\n\nmy Num $num-zero = 0e0;\nsay ?$num-zero; # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, nenio ŝanĝiĝas, se vi unue ŝanĝas la signon de la nombro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay ?(-$int); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la plenan programon kun la supra ekzemplo en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/coercion/true-false-numbers.raku\" target=\"_blank\" rel=\"noopener\">true-false-numbers.raku<\/a>.<\/span><\/p>"]]}}}</script>
