g\" data-s=\"1\">Un <strong>compilatore<\/strong> è il programma che legge il vostro codice e lo esegue.<\/span> <span class=\"sg\" data-s=\"2\">Raku non è legato a un solo compilatore.<\/span> <span class=\"sg\" data-s=\"3\">Questo corso usa <strong>Rakudo<\/strong>, che esiste da molti anni.<\/span> <span class=\"sg\" data-s=\"4\">Ce ne sono anche di più nuovi: <strong>Raku++<\/strong> e <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Più di un compilatore<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il progetto di Raku non dice quale compilatore dovete usare.<\/span> <span class=\"sg\" data-s=\"1\">I suoi documenti di progetto hanno una serie di test chiamata Roast.<\/span> <span class=\"sg\" data-s=\"2\">Chiunque può scrivere un compilatore.<\/span> <span class=\"sg\" data-s=\"3\">Se supera quei test, è un compilatore Raku.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Per molto tempo, Rakudo è stato l'unico compilatore completo e stabile.<\/span> <span class=\"sg\" data-s=\"1\">Ora non è più così.<\/span> <span class=\"sg\" data-s=\"2\">Nel luglio 2026 è comparso un secondo compilatore: <strong>Raku++<\/strong>, scritto in C++.<\/span> <span class=\"sg\" data-s=\"3\">Il suo file eseguibile si chiama <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La versione 5.4.1 supera tutta la suite di test Roast.<\/span> <span class=\"sg\" data-s=\"5\">Inoltre si avvia con una velocità sorprendente.<\/span> <span class=\"sg\" data-s=\"6\">Questo corso usa Rakudo per i suoi esempi.<\/span> <span class=\"sg\" data-s=\"7\">Ma quello che imparate è il linguaggio Raku stesso.<\/span> <span class=\"sg\" data-s=\"8\">Quasi tutto gira anche su Raku++ senza cambiamenti.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">C'è anche una terza implementazione, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">È un interprete, scritto in Rust da Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"2\">Compila Raku in bytecode per la sua macchina virtuale.<\/span> <span class=\"sg\" data-s=\"3\">Grazie a WebAssembly, gira anche dentro un browser web.<\/span> <span class=\"sg\" data-s=\"4\">Il suo sito ha un tutorial di Raku e un campo da gioco basati su di esso.<\/span> <span class=\"sg\" data-s=\"5\">Il progetto è ancora in fase di sviluppo attivo.<\/span> <span class=\"sg\" data-s=\"6\">Il suo autore dice che non è ancora pronto per progetti reali.<\/span> <span class=\"sg\" data-s=\"7\">Ma supera già quasi tutti i file di test di Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le pagine seguenti esaminano i tre uno alla volta: Rakudo, Raku++ e mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Spiegano anche come installarli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Collegamenti esterni<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Raku, Rakudo, Raku++ un mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> ir programmēšanas valodas nosaukums.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Kompilators<\/strong> ir programma, kas nolasa jūsu kodu un izpilda to.<\/span> <span class=\"sg\" data-s=\"2\">Raku nav piesaistīts tikai vienam kompilatoram.<\/span> <span class=\"sg\" data-s=\"3\">Šajā kursā lieto <strong>Rakudo<\/strong>, kas pastāv jau daudzus gadus.<\/span> <span class=\"sg\" data-s=\"4\">Ir arī jaunāki: <strong>Raku++<\/strong> un <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viens kompilators<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku uzbūve nenosaka, kurš kompilators jums jālieto.<\/span> <span class=\"sg\" data-s=\"1\">Tās uzbūves dokumentiem līdzi nāk testu kopa, ko sauc Roast.<\/span> <span class=\"sg\" data-s=\"2\">Kompilatoru var uzrakstīt jebkurš.<\/span> <span class=\"sg\" data-s=\"3\">Ja tas iztur šos testus, tas ir Raku kompilators.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ilgu laiku Rakudo bija vienīgais pilnīgais un stabilais kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Tagad tā vairs nav.<\/span> <span class=\"sg\" data-s=\"2\">2026. gada jūlijā parādījās otrs kompilators: <strong>Raku++<\/strong>, kas uzrakstīts C++ valodā.<\/span> <span class=\"sg\" data-s=\"3\">Tā izpildāmais fails saucas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Versija 5.4.1 iztur visu Roast testu kopu.<\/span> <span class=\"sg\" data-s=\"5\">Tas arī startē pārsteidzoši ātri.<\/span> <span class=\"sg\" data-s=\"6\">Šis kurss piemēros lieto Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Bet tas, ko jūs mācāties, ir pati Raku valoda.<\/span> <span class=\"sg\" data-s=\"8\">Gandrīz viss no tās bez izmaiņām darbojas arī uz Raku++.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ir arī trešā īstenošana, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir interpretators, ko Rust valodā uzrakstījis Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"2\">Tas kompilē Raku baitkodā savai virtuālajai mašīnai.<\/span> <span class=\"sg\" data-s=\"3\">Ar WebAssembly palīdzību tas darbojas arī tīmekļa pārlūkprogrammā.<\/span> <span class=\"sg\" data-s=\"4\">Tā vietnē ir Raku pamācība un spēļu laukums, kas balstīti uz to.<\/span> <span class=\"sg\" data-s=\"5\">Projekts joprojām tiek aktīvi izstrādāts.<\/span> <span class=\"sg\" data-s=\"6\">Tā autors saka, ka tas vēl nav gatavs īstiem projektiem.<\/span> <span class=\"sg\" data-s=\"7\">Bet tas jau iztur gandrīz visus Roast testu failus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamās lappuses aplūko visus trīs pēc kārtas: Rakudo, Raku++ un mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Tās arī paskaidro, kā tos uzstādīt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ārējās saites<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — это название языка программирования.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компилятор<\/strong> — это программа, которая читает ваш код и выполняет его.<\/span> <span class=\"sg\" data-s=\"2\">Raku не привязан только к одному компилятору.<\/span> <span class=\"sg\" data-s=\"3\">В этом курсе используется <strong>Rakudo<\/strong>, который существует уже много лет.<\/span> <span class=\"sg\" data-s=\"4\">Есть и более новые: <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компиляторов может быть несколько<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не говорит, каким компилятором вы должны пользоваться.<\/span> <span class=\"sg\" data-s=\"1\">Вместе с его документами идёт набор тестов под названием Roast.<\/span> <span class=\"sg\" data-s=\"2\">Написать компилятор может кто угодно.<\/span> <span class=\"sg\" data-s=\"3\">Если он проходит эти тесты, то это компилятор Raku.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Долгое время Rakudo был единственным полным и стабильным компилятором.<\/span> <span class=\"sg\" data-s=\"1\">Теперь это уже не так.<\/span> <span class=\"sg\" data-s=\"2\">В июле 2026 года появился второй компилятор: <strong>Raku++<\/strong>, написанный на C++.<\/span> <span class=\"sg\" data-s=\"3\">Его исполняемый файл называется <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Версия 5.4.1 проходит весь набор тестов Roast.<\/span> <span class=\"sg\" data-s=\"5\">Кроме того, он запускается на удивление быстро.<\/span> <span class=\"sg\" data-s=\"6\">Для примеров в этом курсе используется Rakudo.<\/span> <span class=\"sg\" data-s=\"7\">Но то, что вы изучаете, — это сам язык Raku.<\/span> <span class=\"sg\" data-s=\"8\">Почти всё из этого работает и на Raku++ без изменений.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Есть и третья реализация, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Это интерпретатор, который написал на Rust Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"2\">Он компилирует Raku в байт-код для своей собственной виртуальной машины.<\/span> <span class=\"sg\" data-s=\"3\">Ещё он работает прямо в веб-браузере через WebAssembly.<\/span> <span class=\"sg\" data-s=\"4\">На его сайте есть учебник по Raku и песочница, которые работают на нём.<\/span> <span class=\"sg\" data-s=\"5\">Проект всё ещё активно развивается.<\/span> <span class=\"sg\" data-s=\"6\">Его автор говорит, что mutsu пока не готов для реальных проектов.<\/span> <span class=\"sg\" data-s=\"7\">Но он уже проходит почти все тестовые файлы Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие страницы по очереди рассказывают обо всех трёх: Rakudo, Raku++ и mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Они также объясняют, как их установить.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Внешние ссылки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Raku, Rakudo, Raku++ та mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> — це назва мови програмування.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компілятор<\/strong> — це програма, яка читає ваш код і виконує його.<\/span> <span class=\"sg\" data-s=\"2\">Raku не прив'язаний лише до одного компілятора.<\/span> <span class=\"sg\" data-s=\"3\">Цей курс використовує <strong>Rakudo<\/strong>, який існує вже багато років.<\/span> <span class=\"sg\" data-s=\"4\">Є й новіші: <strong>Raku++<\/strong> і <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Компіляторів може бути кілька<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дизайн Raku не каже, яким компілятором ви маєте користуватися.<\/span> <span class=\"sg\" data-s=\"1\">До його дизайн-документів додається набір тестів під назвою Roast.<\/span> <span class=\"sg\" data-s=\"2\">Написати компілятор може будь-хто.<\/span> <span class=\"sg\" data-s=\"3\">Якщо він проходить ці тести, то це компілятор Raku.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Довгий час Rakudo був єдиним повним і стабільним компілятором.<\/span> <span class=\"sg\" data-s=\"1\">Тепер це вже не так.<\/span> <span class=\"sg\" data-s=\"2\">У липні 2026 року з'явився другий компілятор: <strong>Raku++<\/strong>, написаний на C++.<\/span> <span class=\"sg\" data-s=\"3\">Його виконуваний файл називається <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Версія 5.4.1 проходить увесь набір тестів Roast.<\/span> <span class=\"sg\" data-s=\"5\">До того ж він запускається дивовижно швидко.<\/span> <span class=\"sg\" data-s=\"6\">Цей курс використовує Rakudo для своїх прикладів.<\/span> <span class=\"sg\" data-s=\"7\">Але вивчаєте ви саму мову Raku.<\/span> <span class=\"sg\" data-s=\"8\">Майже все з неї також працює на Raku++ без змін.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Є й третя реалізація, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Це інтерпретатор, який мовою Rust написав Токухіро Мацуно.<\/span> <span class=\"sg\" data-s=\"2\">Він компілює Raku в байткод для власної віртуальної машини.<\/span> <span class=\"sg\" data-s=\"3\">Він також працює у веб-браузері завдяки WebAssembly.<\/span> <span class=\"sg\" data-s=\"4\">На його сайті є підручник з Raku і майданчик, які працюють на ньому.<\/span> <span class=\"sg\" data-s=\"5\">Проєкт досі активно розробляється.<\/span> <span class=\"sg\" data-s=\"6\">Його автор каже, що mutsu ще не готовий для справжніх проєктів.<\/span> <span class=\"sg\" data-s=\"7\">Але він уже проходить майже всі тестові файли Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні сторінки розглядають усі три по черзі: Rakudo, Raku++ і mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Вони також пояснюють, як їх встановити.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зовнішні посилання<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Raku, Rakudo, Raku++ и mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> е името на езика за програмиране.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Компилатор<\/strong> е програмата, която чете вашия код и го изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Raku не е обвързан само с един компилатор.<\/span> <span class=\"sg\" data-s=\"3\">Този курс използва <strong>Rakudo<\/strong>, който съществува от години.<\/span> <span class=\"sg\" data-s=\"4\">Има и по-нови: <strong>Raku++<\/strong> и <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от един компилатор<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дизайнът на Raku не казва кой компилатор трябва да използвате.<\/span> <span class=\"sg\" data-s=\"1\">Към документите за дизайна върви набор от тестове, наречен Roast.<\/span> <span class=\"sg\" data-s=\"2\">Всеки може да напише компилатор.<\/span> <span class=\"sg\" data-s=\"3\">Ако той минава тези тестове, това е компилатор на Raku.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Дълго време Rakudo беше единственият пълен и стабилен компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Сега това вече не е така.<\/span> <span class=\"sg\" data-s=\"2\">През юли 2026 се появи втори компилатор: <strong>Raku++<\/strong>, написан на C++.<\/span> <span class=\"sg\" data-s=\"3\">Изпълнимият му файл се казва <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Версия 5.4.1 минава целия набор от тестове Roast.<\/span> <span class=\"sg\" data-s=\"5\">Освен това стартира изненадващо бързо.<\/span> <span class=\"sg\" data-s=\"6\">Този курс използва Rakudo за примерите си.<\/span> <span class=\"sg\" data-s=\"7\">Но това, което учите, е самият език Raku.<\/span> <span class=\"sg\" data-s=\"8\">Почти всичко от него работи и на Raku++ без промени.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Има и трета реализация, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Това е интерпретатор, написан на Rust от Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"2\">Той компилира Raku до байткод за собствената си виртуална машина.<\/span> <span class=\"sg\" data-s=\"3\">Освен това работи и в уеб браузър чрез WebAssembly.<\/span> <span class=\"sg\" data-s=\"4\">Сайтът му има ръководство по Raku и площадка, изградени върху него.<\/span> <span class=\"sg\" data-s=\"5\">Проектът все още се разработва активно.<\/span> <span class=\"sg\" data-s=\"6\">Авторът му казва, че той още не е готов за истински проекти.<\/span> <span class=\"sg\" data-s=\"7\">Но вече минава почти всички тестови файлове на Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите страници разглеждат трите една по една: Rakudo, Raku++ и mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Те обясняват и как да ги инсталирате.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Raku, Rakudo, Raku++ kaj mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> estas la nomo de la programlingvo.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Kompililo<\/strong> estas la programo, kiu legas vian kodon kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Raku ne estas ligita al nur unu kompililo.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu kurso uzas <strong>Rakudo<\/strong>, kiu ekzistas jam de multaj jaroj.<\/span> <span class=\"sg\" data-s=\"4\">Ekzistas ankaŭ pli novaj: <strong>Raku++<\/strong> kaj <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu kompililo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La dezajno de Raku ne diras, kiun kompililon vi devas uzi.<\/span> <span class=\"sg\" data-s=\"1\">Ĝiaj dezajnaj dokumentoj venas kun aro da testoj nomata Roast.<\/span> <span class=\"sg\" data-s=\"2\">Iu ajn povas verki kompililon.<\/span> <span class=\"sg\" data-s=\"3\">Se ĝi trapasas tiujn testojn, ĝi estas kompililo de Raku.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Longan tempon, Rakudo estis la sola kompleta kaj stabila kompililo.<\/span> <span class=\"sg\" data-s=\"1\">Nun tio ne plu estas vera.<\/span> <span class=\"sg\" data-s=\"2\">En julio 2026 aperis dua kompililo: <strong>Raku++<\/strong>, verkita en C++.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia rulebla dosiero nomiĝas <code>rakupp<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Versio 5.4.1 trapasas la tutan testaron Roast.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ankaŭ ekfunkcias surprize rapide.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tiu kurso uzas Rakudo por siaj ekzemploj.<\/span> <span class=\"sg\" data-s=\"7\">Sed tio, kion vi lernas, estas la lingvo Raku mem.<\/span> <span class=\"sg\" data-s=\"8\">Preskaŭ ĉio el ĝi rulas ankaŭ sur Raku++ sen ŝanĝoj.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ tria realigo, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas interpretilo, verkita en Rust de Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi kompilas Raku al bajtkodo por sia propra virtuala maŝino.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ rulas ene de retumilo per WebAssembly.<\/span> <span class=\"sg\" data-s=\"4\">Ĝia retejo havas lernilon pri Raku kaj provejon, konstruitajn sur ĝi.<\/span> <span class=\"sg\" data-s=\"5\">La projekto ankoraŭ aktive evoluas.<\/span> <span class=\"sg\" data-s=\"6\">Ĝia aŭtoro diras, ke ĝi ankoraŭ ne estas preta por veraj projektoj.<\/span> <span class=\"sg\" data-s=\"7\">Sed ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj paĝoj rigardas la tri unu post la alia: Rakudo, Raku++ kaj mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ klarigas, kiel instali ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ ĉe GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Raku, Rakudo, Raku++ et mutsu","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku<\/strong> est nomen linguae programmandi.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Compilator<\/strong> est programma quod codicem tuum legit et exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Raku uni tantum compilatori non alligatur.<\/span> <span class=\"sg\" data-s=\"3\">Hic cursus <strong>Rakudo<\/strong> adhibet, quod iam multos annos exstat.<\/span> <span class=\"sg\" data-s=\"4\">Sunt etiam recentiores: <strong>Raku++<\/strong> et <strong>mutsu<\/strong>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam unus compilator<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ratio linguae Raku non dicit quo compilatore uti debeas.<\/span> <span class=\"sg\" data-s=\"1\">Cum documentis rationis venit series probationum, nomine Roast.<\/span> <span class=\"sg\" data-s=\"2\">Quisque compilatorem scribere potest.<\/span> <span class=\"sg\" data-s=\"3\">Si eas probationes transit, compilator Raku est.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Diu Rakudo solus compilator plenus et stabilis erat.<\/span> <span class=\"sg\" data-s=\"1\">Nunc hoc iam verum non est.<\/span> <span class=\"sg\" data-s=\"2\">Mense Iulio anni 2026 alter compilator apparuit: <strong>Raku++<\/strong>, in C++ scriptus.<\/span> <span class=\"sg\" data-s=\"3\">Programma eius exsecutabile <code>rakupp<\/code> nominatur.<\/span> <span class=\"sg\" data-s=\"4\">Versio 5.4.1 totam seriem probationum Roast transit.<\/span> <span class=\"sg\" data-s=\"5\">Etiam mirabiliter celeriter incipit.<\/span> <span class=\"sg\" data-s=\"6\">Hic cursus in exemplis suis Rakudo adhibet.<\/span> <span class=\"sg\" data-s=\"7\">Sed quod discis ipsa lingua Raku est.<\/span> <span class=\"sg\" data-s=\"8\">Paene tota etiam in Raku++ sine mutationibus currit.<\/span><\/p>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Est etiam tertia implementatio, <strong>mutsu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Interpres est, in Rust a Tokuhiro Matsuno scriptus.<\/span> <span class=\"sg\" data-s=\"2\">Raku in bytecode pro machina virtuali propria compilat.<\/span> <span class=\"sg\" data-s=\"3\">Etiam intra navigatrum interretiale per WebAssembly currit.<\/span> <span class=\"sg\" data-s=\"4\">Situs eius interretialis institutionem Raku et palaestram habet, quae in eo aedificatae sunt.<\/span> <span class=\"sg\" data-s=\"5\">Propositum adhuc strenue evolvitur.<\/span> <span class=\"sg\" data-s=\"6\">Auctor eius dicit eum nondum ad vera incepta paratum esse.<\/span> <span class=\"sg\" data-s=\"7\">Sed iam paene omnia archiva probationum Roast transit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Paginae sequentes tres spectant, unum post alterum: Rakudo, Raku++ et mutsu.<\/span> <span class=\"sg\" data-s=\"1\">Etiam explicant quomodo eos installes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",6,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://raku.org\" target=\"_blank\" rel=\"noopener\">raku.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">Raku++ in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"4\"><a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"5\"><a href=\"https://github.com/Raku/roast\" target=\"_blank\" rel=\"noopener\">Roast<\/a><\/span><\/li><\/ul>"]]}}}</script>
