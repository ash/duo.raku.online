<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/comparing-strings/quiz2","n":138,"k":"quiz","pv":"essentials/conditional-checks/comparing-strings/quiz1","nx":"essentials/conditional-checks/ternary-operator","tr":["essentials","essentials/conditional-checks","essentials/conditional-checks/comparing-strings"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz 2 — the condition in if","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Fix the program first, and then answer the question.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Enter your password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Correct&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Incorrect&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">What does this program do when the test uses <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Your answer:&nbsp; (: Always prints ‘Correct’, Always prints ’Incorrect’, Prints ’Correct’ for correct passwords and ‘Incorrect’ for incorrect ones, Prints ’Incorrect’ for correct passwords and ’Correct’ for incorrect ones :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">The program always prints ‘Correct’, because <code>$password = '*&(#&$#Y'<\/code> is an assignment. It gives the <code>$password<\/code> variable a new value. This value is neither zero nor an empty string, so it counts as <code>True<\/code>. In this case, the user’s password is never checked.<br/><br/>If you type <code>==<\/code>, the program will break. It tries to convert both strings to numbers, and this fails. The two strings are the user’s password and the correct password.<\/div>"]]},"de":{"t":"Quiz 2 — die Bedingung in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Korrigieren Sie zuerst das Programm, und beantworten Sie dann die Frage.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Geben Sie Ihr Passwort ein: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Richtig';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Falsch';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Was macht dieses Programm, wenn im Test <code>=<\/code> steht?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ihre Antwort:&nbsp; (: Druckt immer „Richtig“, Druckt immer „Falsch“, Druckt „Richtig“ für richtige Passwörter und „Falsch“ für falsche, Druckt „Falsch“ für richtige Passwörter und „Richtig“ für falsche :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Das Programm gibt immer „Richtig“ aus, weil <code>$password = '*&(#&$#Y'<\/code> eine Zuweisung ist. Die Zuweisung gibt der Variablen <code>$password<\/code> einen neuen Wert. Dieser Wert ist weder null noch eine leere Zeichenkette, also zählt er als <code>True<\/code>. In diesem Fall wird das Passwort des Benutzers nie geprüft.<br/><br/>Wenn Sie <code>==<\/code> eingeben, bricht das Programm ab. Es versucht, beide Zeichenketten in Zahlen umzuwandeln, und das schlägt fehl. Die beiden Zeichenketten sind das Passwort des Benutzers und das richtige Passwort.<\/div>"]]},"nl":{"t":"Quiz 2 — de voorwaarde in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Verbeter eerst het programma, en beantwoord dan de vraag.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Voer je wachtwoord in: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wat doet dit programma als de test <code>=<\/code> gebruikt?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Jouw antwoord:&nbsp; (: Print altijd ‘Correct’, Print altijd ‘Incorrect’, Print ‘Correct’ voor correcte wachtwoorden en ‘Incorrect’ voor onjuiste wachtwoorden, Print ‘Incorrect’ voor correcte wachtwoorden en ‘Correct’ voor onjuiste wachtwoorden :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Het programma print altijd ‘Correct’, omdat <code>$password = '*&(#&$#Y'<\/code> een toewijzing is. Die geeft de variabele <code>$password<\/code> een nieuwe waarde. Deze waarde is geen nul en ook geen lege string, dus telt die als <code>True<\/code>. In dit geval wordt het wachtwoord van de gebruiker nooit gecontroleerd.<br/><br/>Als je <code>==<\/code> typt, gaat het programma fout. Het probeert beide strings om te zetten naar getallen, en dat mislukt. De twee strings zijn het wachtwoord van de gebruiker en het juiste wachtwoord.<\/div>"]]},"es":{"t":"Quiz 2 — la condición en <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Primero corrige el programa, y luego responde la pregunta.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Introduce tu contraseña: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correcto';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrecto';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué hace este programa cuando la prueba usa <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Tu respuesta:&nbsp; (: Siempre imprime ‘Correcto’, Siempre imprime ‘Incorrecto’, Imprime ‘Correcto’ para contraseñas correctas e ‘Incorrecto’ para incorrectas, Imprime ‘Incorrecto’ para contraseñas correctas y ‘Correcto’ para incorrectas :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">El programa siempre imprime ‘Correcto’, porque <code>$password = '*&(#&$#Y'<\/code> es una asignación. Da a la variable <code>$password<\/code> un nuevo valor. Este valor no es ni cero ni una cadena vacía, así que cuenta como <code>True<\/code>. En este caso, la contraseña del usuario nunca se comprueba.<br/><br/>Si escribes <code>==<\/code>, el programa se romperá. Intenta convertir las dos cadenas a números, y esto falla. Las dos cadenas son la contraseña del usuario y la contraseña correcta.<\/div>"]]},"it":{"t":"Quiz 2 — la condizione in <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Prima correggi il programma, e poi rispondi alla domanda.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Inserisci la tua password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Corretto&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Errato&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Che cosa fa questo programma quando il test usa <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">La tua risposta:&nbsp; (: Stampa sempre ‘Corretto’, Stampa sempre ‘Errato’, Stampa ‘Corretto’ per password corrette e ‘Errato’ per password errate, Stampa ‘Errato’ per password corrette e ‘Corretto’ per password errate :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Il programma stampa sempre ‘Corretto’, perché <code>$password = '*&(#&$#Y'<\/code> è un'assegnazione. Dà alla variabile <code>$password<\/code> un nuovo valore. Questo valore non è né zero né una stringa vuota, quindi vale come <code>True<\/code>. In questo caso, la password dell'utente non viene mai controllata.<br/><br/>Se scrivi <code>==<\/code>, il programma si interromperà. Prova a convertire tutte e due le stringhe in numeri, e questo fallisce. Le due stringhe sono la password dell'utente e la password corretta.<\/div>"]]},"lv":{"t":"Tests 2 — nosacījums <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vispirms izlabojiet programmu un tad atbildiet uz jautājumu.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Enter your password: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ko šī programma dara, kad pārbaude izmanto <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Jūsu atbilde:&nbsp; (: Vienmēr izdrukā ‘Correct’, Vienmēr izdrukā ’Incorrect’, Izdrukā ’Correct’ pareizām parolēm un ‘Incorrect’ nepareizām, Izdrukā ’Incorrect’ pareizām parolēm un ’Correct’ nepareizām :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Programma vienmēr izdrukā ‘Correct’, jo <code>$password = '*&(#&$#Y'<\/code> ir piešķīrums. Tas dod mainīgajam <code>$password<\/code> jaunu vērtību. Šī vērtība nav ne nulle, ne tukša virkne, tāpēc tā tiek uzskatīta par <code>True<\/code>. Šajā gadījumā lietotāja parole nekad netiek pārbaudīta.<br/><br/>Ja jūs ierakstīsiet <code>==<\/code>, programma salūzīs. Tā mēģina abas virknes pārvērst skaitļos, un tas neizdodas. Šīs divas virknes ir lietotāja parole un pareizā parole.<\/div>"]]},"ru":{"t":"Тест 2: Условие в <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Сначала исправьте программу, а потом ответьте на вопрос.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Enter your password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Correct&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Incorrect&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Что делает эта программа, если в проверке стоит <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ваш ответ:&nbsp; (: Всегда выводит ‘Correct’, Всегда выводит ’Incorrect’, Выводит ’Correct’ для правильных паролей и ‘Incorrect’ для неправильных, Выводит ’Incorrect’ для правильных паролей ’Correct’ для неправильных :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Программа всегда выводит ‘Correct’, потому что <code>$password = '*&(#&$#Y'<\/code> — это присваивание. Оно даёт переменной <code>$password<\/code> новое значение. Это значение не ноль и не пустая строка, поэтому оно считается <code>True<\/code>. В этом случае пароль пользователя никогда не проверяется.<br/><br/>Если вы напишете <code>==<\/code>, программа сломается. Она пытается привести обе строки к числам, и это не получается. Эти две строки — пароль пользователя и правильный пароль.<\/div>"]]},"uk":{"t":"Тест 2 — умова в <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Спочатку виправте програму, а потім дайте відповідь на запитання.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Enter your password: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Correct';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Incorrect';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що робить ця програма, коли в перевірці стоїть <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Ваша відповідь:&nbsp; (: Завжди виводить ‘Correct’, Завжди виводить ’Incorrect’, Виводить ’Correct’ для правильних паролів і ‘Incorrect’ для неправильних, Виводить ’Incorrect’ для правильних паролів і ’Correct’ для неправильних :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Програма завжди виводить ‘Correct’, тому що <code>$password = '*&(#&$#Y'<\/code> — це присвоєння. Воно дає змінній <code>$password<\/code> нове значення. Це значення не є ні нулем, ні порожнім рядком, тому воно вважається <code>True<\/code>. У цьому випадку пароль користувача ніколи не перевіряється.<br/><br/>Якщо ви наберете <code>==<\/code>, програма зламається. Вона пробує перетворити обидва рядки на числа, і це не вдається. Ці два рядки — пароль користувача і правильний пароль.<\/div>"]]},"bg":{"t":"Тест 2 — условието в <code>if<\/code>*","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Първо поправете програмата, а после отговорете на въпроса.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt 'Въведете вашата парола: ';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ '*&amp;(#&amp;$#Y' {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Вярно';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say 'Невярно';<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво прави тази програма, когато тестът използва <code>=<\/code>?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Вашият отговор:&nbsp; (: Винаги отпечатва ‘Вярно’, Винаги отпечатва ‘Невярно’, Отпечатва ‘Вярно’ за правилни пароли и ‘Невярно’ за неправилни, Отпечатва ‘Невярно’ за правилни пароли и ‘Вярно’ за неправилни :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Програмата винаги отпечатва ‘Вярно’, защото <code>$password = '*&(#&$#Y'<\/code> е присвояване. То дава нова стойност на променливата <code>$password<\/code>. Тази стойност не е нито нула, нито празен низ, затова се счита за <code>True<\/code>. В този случай паролата на потребителя никога не се проверява.<br/><br/>Ако напишете <code>==<\/code>, програмата ще се счупи. Тя се опитва да превърне двата низа в числа и тов "la":{"t":"Quiz 2 — condicio in <code>if<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Primum programma corrige, et deinde ad quaestionem responde.<\/span><\/p>"],["quiz",8,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">my $password = prompt &apos;Enter your password: &apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">if $password ␣␣ &apos;*&amp;(#&amp;$#Y&apos; {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Correct&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">}<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">else {<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">&nbsp;&nbsp;&nbsp;&nbsp;say &apos;Incorrect&apos;;<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"7\">}<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid hoc programma facit cum probatio <code>=<\/code> adhibet?<\/span><\/p>"],["quiz",1,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">Your answer:&nbsp; (: Always prints ‘Correct’, Always prints ’Incorrect’, Prints ’Correct’ for correct passwords and ‘Incorrect’ for incorrect ones, Prints ’Incorrect’ for correct passwords and ’Correct’ for incorrect ones :)<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">Programma semper ‘Correct’ imprimit, quia <code>$password = '*&(#&$#Y'<\/code> est assignatio. Variabili <code>$password<\/code> novum valorem dat. Hic valor neque zero neque filum vacuum est, itaque ut <code>True<\/code> valet. In hoc casu tessera usoris numquam probatur.<br/><br/>Si <code>==<\/code> scribis, programma frangetur. Ambo fila in numeros convertere temptat, et hoc deficit. Duo fila sunt tessera usoris et tessera recta.<\/div>"]]}}}</script>
