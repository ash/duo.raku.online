aute Wert <code>$*TOLERANCE<\/code> sein.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Wert ist <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-Versionen<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige der Operatoren von oben haben auch Unicode-Versionen:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code> <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiele<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind ein paar Beispiele, die Zahlen mit diesen Operatoren vergleichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass <code>1.000000000000000000000001<\/code> eine <code>Rat<\/code>-Zahl ist.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb behält der Vergleich mit der nahen Zahl <code>1.000000000000000000000002<\/code> die volle Genauigkeit.<\/span> <span class=\"sg\" data-s=\"2\">Das letzte Beispiel, mit <code>2e17<\/code>, arbeitet mit <code>Num<\/code>-Zahlen.<\/span> <span class=\"sg\" data-s=\"3\">Ihre Genauigkeit ist begrenzt.<\/span><\/p>"]]},"nl":{"t":"Getallen vergelijken","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Om twee getallen te vergelijken, gebruik je de volgende operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Als je andere programmeertalen kent, zijn ze allemaal vrij duidelijk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Gelijk <code>!=<\/code> | Niet gelijk <code>&lt;<\/code> | Minder dan <code>&lt;=<\/code> | Minder dan of gelijk aan <code>&gt;<\/code> | Groter dan <code>&gt;=<\/code> | Groter dan of gelijk aan<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ongeveer-gelijk<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Naast de standaardoperatoren voegt Raku er nog één toe: de ongeveer-gelijk operator <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die kijkt of twee getallen bijna gelijk zijn.<\/span> <span class=\"sg\" data-s=\"2\">Het resultaat is <code>True<\/code> als de twee getallen relatief dicht bij elkaar liggen.<\/span> <span class=\"sg\" data-s=\"3\">Het relatieve verschil mag niet groter zijn dan de ingebouwde waarde <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Deze waarde is <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode-versies<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sommige operatoren hierboven hebben ook Unicode-versies:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeelden<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar voorbeelden van het vergelijken van getallen met deze operatoren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Merk op dat <code>1.000000000000000000000001<\/code> een <code>Rat<\/code>-getal is.<\/span> <span class=\"sg\" data-s=\"1\">Daardoor blijft de volledige precisie behouden bij de vergelijking met <code>1.000000000000000000000002<\/code>, een getal dat er dicht bij ligt.<\/span> <span class=\"sg\" data-s=\"2\">Het laatste voorbeeld, met <code>2e17<\/code>, werkt met <code>Num<\/code>-getallen.<\/span> <span class=\"sg\" data-s=\"3\">Hun precisie is beperkt.<\/span><\/p>"]]},"es":{"t":"Comparación de números","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Para comparar dos números, usa los siguientes operadores.<\/span> <span class=\"sg\" data-s=\"1\">Si conoces otros lenguajes de programación, todos son bastante claros.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Igual <code>!=<\/code> | No igual <code>&lt;<\/code> | Menor que <code>&lt;=<\/code> | Menor o igual que <code>&gt;<\/code> | Mayor que <code>&gt;=<\/code> | Mayor o igual que<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aproximadamente igual<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Además de los operadores estándar, Raku añade uno más: el operador de aproximadamente igual <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Comprueba si dos números son casi iguales.<\/span> <span class=\"sg\" data-s=\"2\">El resultado es <code>True<\/code> si los dos números están relativamente cerca uno del otro.<\/span> <span class=\"sg\" data-s=\"3\">La diferencia relativa no debe ser mayor que el valor incorporado <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Este valor es <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiones Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos de los operadores de arriba también tienen versiones en Unicode:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplos<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunos ejemplos de cómo comparar números con estos operadores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ten en cuenta que <code>1.000000000000000000000001<\/code> es un número <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por eso, la comparación con el número cercano <code>1.000000000000000000000002<\/code> mantiene toda la precisión.<\/span> <span class=\"sg\" data-s=\"2\">El último ejemplo, con <code>2e17<\/code>, trabaja con números <code>Num<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Su precisión es limitada.<\/span><\/p>"]]},"it":{"t":"Confronto dei numeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Per confrontare due numeri, usa i seguenti operatori.<\/span> <span class=\"sg\" data-s=\"1\">Se conosci altri linguaggi di programmazione, sono tutti abbastanza chiari.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Uguale <code>!=<\/code> | Diverso <code>&lt;<\/code> | Minore di <code>&lt;=<\/code> | Minore o uguale <code>&gt;<\/code> | Maggiore di <code>&gt;=<\/code> | Maggiore o uguale<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Approssimativamente uguale<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Oltre agli operatori standard, Raku ne aggiunge un altro: l'operatore approssimativamente uguale <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Controlla se due numeri sono quasi uguali.<\/span> <span class=\"sg\" data-s=\"2\">Il risultato è <code>True<\/code> se i due numeri sono relativamente vicini tra loro.<\/span> <span class=\"sg\" data-s=\"3\">La differenza relativa non deve essere più grande del valore integrato <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Questo valore è <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versioni Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni degli operatori qui sopra hanno anche versioni Unicode:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni esempi di confronto tra numeri con questi operatori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota che <code>1.000000000000000000000001<\/code> è un numero <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per questo, il confronto con il numero vicino <code>1.000000000000000000000002<\/code> mantiene tutta la precisione.<\/span> <span class=\"sg\" data-s=\"2\">L'ultimo esempio, con <code>2e17<\/code>, lavora con numeri <code>Num<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La loro precisione è limitata.<\/span><\/p>"]]},"lv":{"t":"Skaitļu salīdzināšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai salīdzinātu divus skaitļus, izmantojiet šādus operatorus.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs zināt citas programmēšanas valodas, tie visi ir diezgan skaidri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Vienāds <code>!=<\/code> | Nav vienāds <code>&lt;<\/code> | Mazāks par <code>&lt;=<\/code> | Mazāks vai vienāds <code>&gt;<\/code> | Lielāks par <code>&gt;=<\/code> | Lielāks vai vienāds<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aptuveni vienāds<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Bez standarta operatoriem Raku pievieno vēl vienu: aptuveni vienādo operatoru <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas pārbauda, vai divi skaitļi ir gandrīz vienādi.<\/span> <span class=\"sg\" data-s=\"2\">Rezultāts ir <code>True<\/code>, ja abi skaitļi ir relatīvi tuvu viens otram.<\/span> <span class=\"sg\" data-s=\"3\">Relatīvā atšķirība nedrīkst būt lielāka par iebūvēto vērtību <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Šī vērtība ir <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unicode versijas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dažiem no iepriekš minētajiem operatoriem ir arī Unicode versijas:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemēri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir daži piemēri, kā salīdzināt skaitļus ar šiem operatoriem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka <code>1.000000000000000000000001<\/code> ir <code>Rat<\/code> skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc salīdzinājums ar tuvo skaitli <code>1.000000000000000000000002<\/code> saglabā pilnu precizitāti.<\/span> <span class=\"sg\" data-s=\"2\">Pēdējais piemērs ar <code>2e17<\/code> strādā ar <code>Num<\/code> skaitļiem.<\/span> <span class=\"sg\" data-s=\"3\">To precizitāte ir ierobežota.<\/span><\/p>"]]},"ru":{"t":"Сравнение чисел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы сравнить два числа, используйте следующие операторы.<\/span> <span class=\"sg\" data-s=\"1\">Если вы знаете другие языки программирования, они все будут вам вполне понятны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Равно <code>!=<\/code> | Не равно <code>&lt;<\/code> | Меньше <code>&lt;=<\/code> | Меньше или равно <code>&gt;<\/code> | Больше <code>&gt;=<\/code> | Больше или равно<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизительно равно<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кроме стандартных операторов, Raku добавляет ещё один: оператор \"приблизительно равно\" <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он проверяет, что два числа почти равны.<\/span> <span class=\"sg\" data-s=\"2\">Результат равен <code>True<\/code>, если два числа относительно близки друг к другу.<\/span> <span class=\"sg\" data-s=\"3\">Относительная разница не должна быть больше встроенного значения <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Это значение равно <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Символы Юникода<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У некоторых операторов выше есть также версии в Юникоде:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Примеры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот несколько примеров, где эти операторы сравнивают числа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что <code>1.000000000000000000000001<\/code> — это число типа <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому сравнение с близким числом <code>1.000000000000000000000002<\/code> сохраняет полную точность.<\/span> <span class=\"sg\" data-s=\"2\">Последний пример, с <code>2e17<\/code>, работает с числами типа <code>Num<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Их точность ограничена.<\/span><\/p>"]]},"uk":{"t":"Порівняння чисел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб порівняти два числа, використовуйте такі оператори.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви знаєте інші мови програмування, вони всі досить зрозумілі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Рівне <code>!=<\/code> | Не рівне <code>&lt;<\/code> | Менше ніж <code>&lt;=<\/code> | Менше або рівне <code>&gt;<\/code> | Більше ніж <code>&gt;=<\/code> | Більше або рівне<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приблизно рівне<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Крім стандартних операторів, Raku додає ще один: оператор приблизної рівності <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він перевіряє, чи два числа майже рівні.<\/span> <span class=\"sg\" data-s=\"2\">Результат — <code>True<\/code>, якщо два числа відносно близькі одне до одного.<\/span> <span class=\"sg\" data-s=\"3\">Відносна різниця не повинна бути більшою за вбудоване значення <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це значення дорівнює <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Юнікод-версії<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Деякі з операторів вище мають також Юнікод-версії:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/c !=<\/code> | Ne egala <code>&lt;<\/code> | Malpli ol <code>&lt;=<\/code> | Malpli ol aŭ egala <code>&gt;<\/code> | Pli granda ol <code>&gt;=<\/code> | Pli granda ol aŭ egala<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Proksimume-egala<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Krom la normaj operatoroj, Raku aldonas unu plian: la proksimume-egalan operatoron <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kontrolas, ĉu du nombroj estas preskaŭ egalaj.<\/span> <span class=\"sg\" data-s=\"2\">La rezulto estas <code>True<\/code>, se la du nombroj estas relative proksimaj unu al la alia.<\/span> <span class=\"sg\" data-s=\"3\">La relativa diferenco ne rajtas esti pli granda ol la enkonstruita valoro <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu valoro estas <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unikodaj versioj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj el la supraj operatoroj havas ankaŭ Unikodajn versiojn:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemploj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj ekzemploj, kiuj komparas nombrojn per ĉi tiuj operatoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # True\nsay 10 != 10; # False\n\nsay 15 &lt; 10;  # False\nsay 10 &lt;= 10; # True\nsay 16 &gt; 10;  # True\nsay 10 &gt;= 14; # False\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # True\nsay 2e17 + 1 =~= 2e17 + 100; # True<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>1.000000000000000000000001<\/code> estas <code>Rat<\/code> nombro.<\/span> <span class=\"sg\" data-s=\"1\">Pro tio, la komparo kun la proksima nombro <code>1.000000000000000000000002<\/code> konservas plenan precizecon.<\/span> <span class=\"sg\" data-s=\"2\">La lasta ekzemplo, kun <code>2e17<\/code>, laboras kun <code>Num<\/code> nombroj.<\/span> <span class=\"sg\" data-s=\"3\">Ilia precizeco estas limigita.<\/span><\/p>"]]},"la":{"t":"Comparando numeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad duos numeros comparandos, utere operatoribus sequentibus.<\/span> <span class=\"sg\" data-s=\"1\">Si alias linguas programmandi novisti, omnes satis clari sunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> | Aequalis <code>!=<\/code> | Non aequalis <code>&lt;<\/code> | Minor quam <code>&lt;=<\/code> | Minor aut aequalis <code>&gt;<\/code> | Maior quam <code>&gt;=<\/code> | Maior aut aequalis<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fere-aequalis<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Praeter operatores usitatos, Raku unum alium addit: operatorem fere-aequalem <code>=~=<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Probat num duo numeri fere aequales sint.<\/span> <span class=\"sg\" data-s=\"2\">Eventus est <code>True<\/code> si duo numeri relative propinqui inter se sunt.<\/span> <span class=\"sg\" data-s=\"3\">Differentia relativa non debet maior esse quam valor in-builtus <code>$*TOLERANCE<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Hic valor est <code>1e-15<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versiones Unicode<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quidam ex operatoribus supra etiam versiones Unicode habent:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>!=<\/code> | <code>≠<\/code> <code>&lt;=<\/code> | <code>≤<\/code>  <code>&gt;=<\/code> | <code>≥<\/code> <code>=~=<\/code> | <code>≅<\/code><\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exempla<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic sunt pauca exempla quae numeros his operatoribus comparant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 10 == 10; # Verum\nsay 10 != 10; # Falsum\n\nsay 15 &lt; 10;  # Falsum\nsay 10 &lt;= 10; # Verum\nsay 16 &gt; 10;  # Verum\nsay 10 &gt;= 14; # Falsum\n\nsay 1.000000000000000000000001 =~= 1.000000000000000000000002; # Verum\nsay 2e17 + 1 =~= 2e17 + 100; # Verum<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota quod <code>1.000000000000000000000001<\/code> est numerus <code>Rat<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Propter hoc, comparatio cum numero propinquo <code>1.000000000000000000000002<\/code> plenam praecisionem servat.<\/span> <span class=\"sg\" data-s=\"2\">Ultimum exemplum, cum <code>2e17<\/code>, numeris <code>Num<\/code> utitur.<\/span> <span class=\"sg\" data-s=\"3\">Praecisio eorum restricta est.<\/span><\/p>"]]}}}</script>
