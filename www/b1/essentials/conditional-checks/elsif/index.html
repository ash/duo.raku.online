<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/elsif","n":130,"k":"topic","pv":"essentials/conditional-checks/else","nx":"essentials/conditional-checks/elsif/quiz","tr":["essentials","essentials/conditional-checks"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using elsif","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">So far, we have learned <code>if<\/code> and <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But what if you want to make a chain of tests?<\/span> <span class=\"sg\" data-s=\"2\">Raku has at least two ways to do that.<\/span> <span class=\"sg\" data-s=\"3\">Actually, there are even more.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One way is to use a chain of <code>if<\/code>, <code>elsif<\/code>, and <code>else<\/code> blocks.<\/span> <span class=\"sg\" data-s=\"1\">Note how <code>elsif<\/code> is spelled.<\/span> <span class=\"sg\" data-s=\"2\">It is not <code>elseif<\/code>, and it is not <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This program has three branches and three tests, one after another.<\/span> <span class=\"sg\" data-s=\"1\">As soon as one of the conditions is <code>True<\/code>, the matching code block runs.<\/span> <span class=\"sg\" data-s=\"2\">If none of the checks is <code>True<\/code>, the <code>else<\/code> block runs.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here are a few test runs of the program.<\/span> <span class=\"sg\" data-s=\"1\">Each block runs in one of them:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Another way is to use the pair <a href=\"/advanced/given-when/\"><code>given<\/code> and <code>when<\/code><\/a>, which we will learn later.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bisher haben wir <code>if<\/code> und <code>else<\/code> gelernt.<\/span> <span class=\"sg\" data-s=\"1\">Aber was ist, wenn Sie eine Kette von Tests bauen möchten?<\/span> <span class=\"sg\" data-s=\"2\">Raku hat mindestens zwei Wege dafür.<\/span> <span class=\"sg\" data-s=\"3\">Eigentlich gibt es sogar noch mehr.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Weg ist, eine Kette von <code>if<\/code>-, <code>elsif<\/code>- und <code>else<\/code>-Blöcken zu benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie, wie man <code>elsif<\/code> schreibt.<\/span> <span class=\"sg\" data-s=\"2\">Es ist nicht <code>elseif<\/code>, und es ist nicht <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Geben Sie die Zahl ein: ';\nif $x &gt; 100 {\n    say \"$x ist größer als 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x ist größer als 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x ist größer als 25.\";\n}\nelse {\n    say \"$x ist 25 oder kleiner.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm hat drei Zweige und drei Tests nacheinander.<\/span> <span class=\"sg\" data-s=\"1\">Sobald eine der Bedingungen <code>True<\/code> ist, läuft der passende Codeblock.<\/span> <span class=\"sg\" data-s=\"2\">Wenn keine der Prüfungen <code>True<\/code> ist, läuft der <code>else<\/code>-Block.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier sind ein paar Testläufe des Programms.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Block läuft in einem davon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nGeben Sie die Zahl ein: 120\n120 ist größer als 100.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 75      \n75 ist größer als 50.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 30\n30 ist größer als 25.\n\n$ raku t.raku\nGeben Sie die Zahl ein: 10\n10 ist 25 oder kleiner.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein anderer Weg ist das Paar <a href=\"https://course.raku.org/de/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> und <code>when<\/code><\/a>, das wir später lernen werden.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe hebben we <code>if<\/code> en <code>else<\/code> geleerd.<\/span> <span class=\"sg\" data-s=\"1\">Maar wat als je een keten van tests wilt maken?<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft minstens twee manieren om dat te doen.<\/span> <span class=\"sg\" data-s=\"3\">Eigenlijk zijn er nog meer.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén manier is om een keten van <code>if<\/code>-, <code>elsif<\/code>- en <code>else<\/code>-blokken te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Let op hoe je <code>elsif<\/code> spelt.<\/span> <span class=\"sg\" data-s=\"2\">Het is niet <code>elseif<\/code>, en ook niet <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Voer het nummer in: ';\nif $x &gt; 100 {\n    say \"$x is groter dan 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is groter dan 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is groter dan 25.\";\n}\nelse {\n    say \"$x is 25 of kleiner.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit programma heeft drie takken en drie tests, na elkaar.<\/span> <span class=\"sg\" data-s=\"1\">Zodra een van de voorwaarden <code>True<\/code> is, draait het bijbehorende codeblok.<\/span> <span class=\"sg\" data-s=\"2\">Als geen van de controles <code>True<\/code> is, draait het <code>else<\/code>-blok.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar testruns van het programma.<\/span> <span class=\"sg\" data-s=\"1\">Elk blok draait in een van die runs:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer het nummer in: 120\n120 is groter dan 100.\n\n$ raku t.raku\nVoer het nummer in: 75      \n75 is groter dan 50.\n\n$ raku t.raku\nVoer het nummer in: 30\n30 is groter dan 25.\n\n$ raku t.raku\nVoer het nummer in: 10\n10 is 25 of kleiner.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een andere manier is om het paar <a href=\"https://course.raku.org/nl/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> en <code>when<\/code><\/a> te gebruiken, dat we later zullen leren.<\/span><\/p>"]]},"es":{"t":"Uso de <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, hemos aprendido <code>if<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero, ¿qué pasa si quieres hacer una cadena de pruebas?<\/span> <span class=\"sg\" data-s=\"2\">Raku tiene al menos dos formas de hacerlo.<\/span> <span class=\"sg\" data-s=\"3\">De hecho, hay incluso más.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una forma es usar una cadena de bloques <code>if<\/code>, <code>elsif<\/code> y <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Fíjate en cómo se escribe <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No es <code>elseif<\/code>, y tampoco es <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Introduce el número: ';\nif $x &gt; 100 {\n    say \"$x es mayor que 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x es mayor que 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x es mayor que 25.\";\n}\nelse {\n    say \"$x es 25 o menor.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este programa tiene tres ramas y tres pruebas, una tras otra.<\/span> <span class=\"sg\" data-s=\"1\">En cuanto una de las condiciones es <code>True<\/code>, se ejecuta el bloque de código correspondiente.<\/span> <span class=\"sg\" data-s=\"2\">Si ninguna de las verificaciones es <code>True<\/code>, se ejecuta el bloque <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunas ejecuciones de prueba del programa.<\/span> <span class=\"sg\" data-s=\"1\">Cada bloque se ejecuta en una de ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntroduce el número: 120\n120 es mayor que 100.\n\n$ raku t.raku\nIntroduce el número: 75      \n75 es mayor que 50.\n\n$ raku t.raku\nIntroduce el número: 30\n30 es mayor que 25.\n\n$ raku t.raku\nIntroduce el número: 10\n10 es 25 o menor.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otra forma es usar el par <a href=\"https://course.raku.org/es/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> y <code>when<\/code><\/a>, que aprenderemos más tarde.<\/span><\/p>"]]},"it":{"t":"Uso di <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Finora abbiamo imparato <code>if<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma se vuoi fare una catena di test?<\/span> <span class=\"sg\" data-s=\"2\">Raku ha almeno due modi per farlo.<\/span> <span class=\"sg\" data-s=\"3\">In realtà, ce ne sono anche di più.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un modo è usare una catena di blocchi <code>if<\/code>, <code>elsif<\/code> e <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota come si scrive <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Non è <code>elseif<\/code> e non è <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Inserisci il numero: ';\nif $x &gt; 100 {\n    say \"$x è maggiore di 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x è maggiore di 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x è maggiore di 25.\";\n}\nelse {\n    say \"$x è 25 o minore.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo programma ha tre rami e tre test, uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"1\">Non appena una delle condizioni è <code>True<\/code>, viene eseguito il blocco di codice corrispondente.<\/span> <span class=\"sg\" data-s=\"2\">Se nessun controllo è <code>True<\/code>, viene eseguito il blocco <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ecco alcune esecuzioni di prova del programma.<\/span> <span class=\"sg\" data-s=\"1\">Ogni blocco viene eseguito in una di esse:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nInserisci il numero: 120\n120 è maggiore di 100.\n\n$ raku t.raku\nInserisci il numero: 75      \n75 è maggiore di 50.\n\n$ raku t.raku\nInserisci il numero: 30\n30 è maggiore di 25.\n\n$ raku t.raku\nInserisci il numero: 10\n10 è 25 o minore.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un altro modo è usare la coppia <a href=\"https://course.raku.org/it/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> e <code>when<\/code><\/a>, che impareremo più avanti.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Līdz šim mēs esam iemācījušies <code>if<\/code> un <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet ko darīt, ja vēlaties izveidot testu ķēdi?<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā ir vismaz divi veidi, kā to izdarīt.<\/span> <span class=\"sg\" data-s=\"3\">Patiesībā to ir vēl vairāk.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Viens veids ir izmantot <code>if<\/code>, <code>elsif<\/code> un <code>else<\/code> bloku ķēdi.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, kā raksta <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav <code>elseif<\/code>, un tas nav arī <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā programmā ir trīs zari un trīs testi, viens pēc otra.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz kāds no nosacījumiem ir <code>True<\/code>, izpildās atbilstošais koda bloks.<\/span> <span class=\"sg\" data-s=\"2\">Ja neviena pārbaude nav <code>True<\/code>, izpildās <code>else<\/code> bloks.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit ir dažas programmas testa izpildes.<\/span> <span class=\"sg\" data-s=\"1\">Katrs bloks izpildās vienā no tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cits veids ir izmantot pāri <a href=\"https://course.raku.org/lv/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> un <code>when<\/code><\/a>, ko mēs apgūsim vēlāk.<\/span><\/p>"]]},"ru":{"t":"Использование <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Пока мы познакомились с <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но что, если вы хотите сделать цепочку проверок?<\/span> <span class=\"sg\" data-s=\"2\">В Raku есть как минимум два способа это сделать.<\/span> <span class=\"sg\" data-s=\"3\">На самом деле их даже больше.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Один из способов — использовать цепочку блоков <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, как пишется <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это не <code>elseif<\/code> и не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этой программе три ветки и три проверки, одна за другой.<\/span> <span class=\"sg\" data-s=\"1\">Как только одно из условий равно <code>True<\/code>, выполняется блок кода этого условия.<\/span> <span class=\"sg\" data-s=\"2\">Если ни одна проверка не равна <code>True<\/code>, выполняется блок <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот несколько тестовых запусков программы.<\/span> <span class=\"sg\" data-s=\"1\">Каждый блок выполняется в одном из них:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75\n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другой способ — использовать пару <a href=\"https://course.raku.org/ru/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> и <code>when<\/code><\/a>, которую мы изучим позже.<\/span><\/p>"]]},"uk":{"t":"Використання <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досі ми вивчили <code>if<\/code> та <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але що, якщо ви хочете зробити ланцюг тестів?<\/span> <span class=\"sg\" data-s=\"2\">У Raku є принаймні два способи це зробити.<\/span> <span class=\"sg\" data-s=\"3\">Насправді їх навіть більше.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Один зі способів — використати ланцюг блоків <code>if<\/code>, <code>elsif<\/code> та <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, як пишеться <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це не <code>elseif<\/code> і не <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Введіть число: ';\nif $x &gt; 100 {\n    say \"$x більше за 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x більше за 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x більше за 25.\";\n}\nelse {\n    say \"$x дорівнює 25 або менше.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цій програмі є три гілки і три тести, один за одним.<\/span> <span class=\"sg\" data-s=\"1\">Щойно одна з умов стає <code>True<\/code>, виконується відповідний блок коду.<\/span> <span class=\"sg\" data-s=\"2\">Якщо жодна з перевірок не є <code>True<\/code>, виконується блок <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось кілька тестових запусків програми.<\/span> <span class=\"sg\" data-s=\"1\">Кожен блок виконується в одному з них:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведіть число: 120\n120 більше за 100.\n\n$ raku t.raku\nВведіть число: 75      \n75 більше за 50.\n\n$ raku t.raku\nВведіть число: 30\n30 більше за 25.\n\n$ raku t.raku\nВведіть число: 10\n10 дорівнює 25 або менше.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Інший спосіб — використати пару <a href=\"https://course.raku.org/uk/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> та <code>when<\/code><\/a>, яку ми вивчимо пізніше.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досега научихме <code>if<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но какво да направите, ако искате верига от тестове?<\/span> <span class=\"sg\" data-s=\"2\">Raku има поне два начина да направите това.<\/span> <span class=\"sg\" data-s=\"3\">Всъщност има дори повече.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Един начин е да използвате верига от блокове <code>if<\/code>, <code>elsif<\/code> и <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание как се пише <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това не е <code>elseif<\/code> и не е <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази програма има три клона и три теста, един след друг.<\/span> <span class=\"sg\" data-s=\"1\">Щом едно от условията е <code>True<\/code>, съответният блок код се изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Ако нито една проверка не е <code>True<\/code>, се изпълнява блокът <code>else<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето няколко тестови изпълнения на програмата.<\/span> <span class=\"sg\" data-s=\"1\">Всеки блок се изпълнява в едно от тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друг начин е да използвате двойката <a href=\"https://course.raku.org/bg/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> и <code>when<\/code><\/a>, която ще научим по-късно.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun ni lernis <code>if<\/code> kaj <code>else<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed kion fari, se vi volas fari ĉenon de testoj?<\/span> <span class=\"sg\" data-s=\"2\">Raku havas almenaŭ du manierojn por tio.<\/span> <span class=\"sg\" data-s=\"3\">Fakte, estas eĉ pli.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu maniero estas uzi ĉenon de <code>if<\/code>, <code>elsif<\/code> kaj <code>else<\/code> blokoj.<\/span> <span class=\"sg\" data-s=\"1\">Notu, kiel oni skribas <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne estas <code>elseif<\/code>, kaj ĝi ne estas <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Enter the number: ';\nif $x &gt; 100 {\n    say \"$x is bigger than 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x is bigger than 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x is bigger than 25.\";\n}\nelse {\n    say \"$x is 25 or smaller.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo havas tri branĉojn kaj tri testojn, unu post la alia.<\/span> <span class=\"sg\" data-s=\"1\">Tuj kiam unu el la kondiĉoj estas <code>True<\/code>, la responda bloko de kodo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">Se neniu el la kontroloj estas <code>True<\/code>, la <code>else<\/code> bloko ruliĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj provaj ruloj de la programo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu bloko ruliĝas en unu el ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter the number: 120\n120 is bigger than 100.\n\n$ raku t.raku\nEnter the number: 75      \n75 is bigger than 50.\n\n$ raku t.raku\nEnter the number: 30\n30 is bigger than 25.\n\n$ raku t.raku\nEnter the number: 10\n10 is 25 or smaller.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alia maniero estas uzi la paron <a href=\"https://course.raku.org/eo/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> kaj <code>when<\/code><\/a>, kiun ni lernos poste.<\/span><\/p>"]]},"la":{"t":"Utendo <code>elsif<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Adhuc <code>if<\/code> et <code>else<\/code> didicimus.<\/span> <span class=\"sg\" data-s=\"1\">Sed quid si catenam probationum facere vis?<\/span> <span class=\"sg\" data-s=\"2\">Raku saltem duos modos habet ad hoc faciendum.<\/span> <span class=\"sg\" data-s=\"3\">Re vera etiam plures sunt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unus modus est catenam clausularum <code>if<\/code>, <code>elsif<\/code>, et <code>else<\/code> adhibere.<\/span> <span class=\"sg\" data-s=\"1\">Nota quomodo <code>elsif<\/code> scribitur.<\/span> <span class=\"sg\" data-s=\"2\">Non est <code>elseif<\/code>, neque est <code>else if<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = prompt 'Intra numerum: ';\nif $x &gt; 100 {\n    say \"$x maior est quam 100.\";\n}\nelsif $x &gt; 50 {\n    say \"$x maior est quam 50.\";\n}\nelsif $x &gt; 25 {\n    say \"$x maior est quam 25.\";\n}\nelse {\n    say \"$x est 25 vel minor.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma tres ramos et tres probationes habet, unam post alteram.<\/span> <span class=\"sg\" data-s=\"1\">Simul ac una ex condicionibus <code>True<\/code> est, clausula codicis respondens currit.<\/span> <span class=\"sg\" data-s=\"2\">Si nulla probatio <code>True<\/code> est, clausula <code>else<\/code> currit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic sunt pauci cursus programmatis ad probandum.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque clausula in uno ex eis currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 120\n120 maior est quam 100.\n\n$ raku t.raku\nIntra numerum: 75      \n75 maior est quam 50.\n\n$ raku t.raku\nIntra numerum: 30\n30 maior est quam 25.\n\n$ raku t.raku\nIntra numerum: 10\n10 est 25 vel minor.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alius modus est par <a href=\"https://course.raku.org/la/advanced/given-when/\" target=\"_blank\" rel=\"noopener\"><code>given<\/code> et <code>when<\/code><\/a> adhibere, quod postea discemus.<\/span><\/p>"]]}}}</script>
