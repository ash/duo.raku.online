pre class=\"lang-raku\"><code>unless $broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У вас є обидва варіанти, тому ви завжди можете вибрати те, що краще підходить у кожній ситуації.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що після <code>unless<\/code> не можна поставити блок <code>else<\/code> або <code>elsif<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо він вам потрібен, єдиний спосіб — використати <code>if<\/code>.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>unless<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">С <a href=\"https://course.raku.org/bg/essentials/booleans/operations/#negation\" target=\"_blank\" rel=\"noopener\">оператора <code>!<\/code><\/a> можете лесно да превърнете всяко булево условие в обратното.<\/span> <span class=\"sg\" data-s=\"1\">Но понякога допълнителният <code>!<\/code> прави израза по-тежък и по-труден за четене.<\/span> <span class=\"sg\" data-s=\"2\">В такива случаи <code>unless<\/code> може да ви бъде приятел.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku изпълнява блока <code>unless<\/code>, когато условието му е <code>False<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $broken = False;\n\n# ...Нещо може да направи $broken True тук...\n    \nunless $broken {\n    say \"Не се притеснявай!\";\n    say \"Бъди щастлив!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сравнете две версии на една и съща програма:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>if<\/code> и отрицание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if !$broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С <code>unless<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unless $broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Имате и двата варианта, така че винаги можете да изберете това, което ви се струва по-добро във всяка ситуация.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че не можете да поставите блок <code>else<\/code> или <code>elsif<\/code> след <code>unless<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако ви трябва такъв блок, единственият начин е да използвате <code>if<\/code>.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>unless<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per la <a href=\"https://course.raku.org/eo/essentials/booleans/operations/#negation\" target=\"_blank\" rel=\"noopener\"><code>!<\/code> operatoro<\/a>, vi povas facile ŝanĝi ĉiun Boolean kondiĉon al ĝia malo.<\/span> <span class=\"sg\" data-s=\"1\">Sed kelkfoje la plia <code>!<\/code> faras la esprimon pli peza kaj malpli facile legebla.<\/span> <span class=\"sg\" data-s=\"2\">En tiaj kazoj, <code>unless<\/code> povas esti via amiko.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku rulas la <code>unless<\/code> blokon, kiam ĝia kondiĉo estas <code>False<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $broken = False;\n\n# ...Io povas agordi $broken al True ĉi tie...\n    \nunless $broken {\n    say \"Ne zorgu!\";\n    say \"Estu feliĉa!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Komparu du versiojn de la sama programo:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun <code>if<\/code> kaj neado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if !$broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun <code>unless<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unless $broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi havas ambaŭ eblojn, do vi ĉiam povas elekti tion, kio ŝajnas pli bona en ĉiu situacio.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke vi ne povas meti <code>else<\/code> aŭ <code>elsif<\/code> blokon post <code>unless<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se vi bezonas tian blokon, la sola maniero estas uzi <code>if<\/code>.<\/span><\/p>"]]},"la":{"t":"Utendo <code>unless<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum <a href=\"https://course.raku.org/la/essentials/booleans/operations/#negation\" target=\"_blank\" rel=\"noopener\">operatore <code>!<\/code><\/a> quamlibet condicionem Booleanam facile in contrarium vertere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed interdum <code>!<\/code> additum expressionem graviorem et difficiliorem ad legendum facit.<\/span> <span class=\"sg\" data-s=\"2\">In talibus casibus <code>unless<\/code> amicus tuus esse potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Raku clausulam <code>unless<\/code> exsequitur cum condicio eius <code>False<\/code> est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $broken = False;\n\n# ...Aliquid potest $broken ad Verum hic ponere...\n    \nunless $broken {\n    say \"Noli sollicitari!\";\n    say \"Esto laetus!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compara duas versiones eiusdem programmatis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>if<\/code> et negatione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if !$broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>unless<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unless $broken { . . . }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambas optiones habes, itaque semper eligere potes quod in quoque casu melius videtur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod clausulam <code>else<\/code> aut <code>elsif<\/code> post <code>unless<\/code> ponere non potes.<\/span> <span class=\"sg\" data-s=\"1\">Si una tibi opus est, sola via est <code>if<\/code> adhibere.<\/span><\/p>"]]}}}</script>
