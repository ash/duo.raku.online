<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/modifiers","n":133,"k":"topic","pv":"essentials/conditional-checks/unless","nx":"essentials/conditional-checks/comparing-numbers","tr":["essentials","essentials/conditional-checks"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Postfix forms of if and unless","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sometimes you want a simple statement to run only under a certain condition.<\/span> <span class=\"sg\" data-s=\"1\">For this, Raku has a very handy solution.<\/span> <span class=\"sg\" data-s=\"2\">You do not need to create a separate block of code.<\/span> <span class=\"sg\" data-s=\"3\">Just put <code>if<\/code> or <code>unless<\/code> right after the statement.<\/span> <span class=\"sg\" data-s=\"4\">In Raku, these constructs are called <em>statement modifiers<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Good afternoon' if $hours &gt; 12;\n\nsay 'All systems work' unless $broken;<\/code><\/pre>"]]},"de":{"t":"<code>if<\/code> und <code>unless<\/code> als Anweisungsmodifikatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Manchmal soll eine einfache Anweisung nur unter einer bestimmten Bedingung laufen.<\/span> <span class=\"sg\" data-s=\"1\">Dafür hat Raku eine sehr praktische Lösung.<\/span> <span class=\"sg\" data-s=\"2\">Sie müssen keinen eigenen Codeblock erstellen.<\/span> <span class=\"sg\" data-s=\"3\">Setzen Sie einfach <code>if<\/code> oder <code>unless<\/code> direkt hinter die Anweisung.<\/span> <span class=\"sg\" data-s=\"4\">In Raku heißen solche Konstrukte <em>statement modifiers<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Guten Nachmittag' if $hours &gt; 12;\n\nsay 'Alle Systeme funktionieren' unless $broken;<\/code><\/pre>"]]},"nl":{"t":"<code>if<\/code> en <code>unless<\/code> als zinsmodificatoren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Soms wil je dat een eenvoudige instructie alleen onder een bepaalde voorwaarde draait.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor heeft Raku een heel handige oplossing.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft geen apart codeblok te maken.<\/span> <span class=\"sg\" data-s=\"3\">Zet gewoon <code>if<\/code> of <code>unless<\/code> direct na de instructie.<\/span> <span class=\"sg\" data-s=\"4\">In Raku heten zulke constructies <em>statement modifiers<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Good afternoon' if $hours &gt; 12;\n\nsay 'All systems work' unless $broken;<\/code><\/pre>"]]},"es":{"t":"<code>if<\/code> y <code>unless<\/code> como modificadores de sentencia","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A veces quieres que una declaración simple se ejecute solo si se cumple una condición.<\/span> <span class=\"sg\" data-s=\"1\">Para esto, Raku tiene una solución muy práctica.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas crear un bloque de código aparte.<\/span> <span class=\"sg\" data-s=\"3\">Simplemente pon <code>if<\/code> o <code>unless<\/code> justo después de la declaración.<\/span> <span class=\"sg\" data-s=\"4\">En Raku, estas construcciones se llaman <em>modificadores de declaración<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Buenas tardes' if $hours &gt; 12;\n\nsay 'Todos los sistemas funcionan' unless $broken;<\/code><\/pre>"]]},"it":{"t":"<code>if<\/code> e <code>unless<\/code> come modificatori di istruzioni","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi che un'istruzione semplice venga eseguita solo a una certa condizione.<\/span> <span class=\"sg\" data-s=\"1\">Per questo, Raku ha una soluzione molto pratica.<\/span> <span class=\"sg\" data-s=\"2\">Non serve creare un blocco di codice separato.<\/span> <span class=\"sg\" data-s=\"3\">Basta mettere <code>if<\/code> o <code>unless<\/code> subito dopo l'istruzione.<\/span> <span class=\"sg\" data-s=\"4\">In Raku, questi costrutti si chiamano <em>modificatori di istruzione<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Buon pomeriggio' if $hours &gt; 12;\n\nsay 'Tutti i sistemi funzionano' unless $broken;<\/code><\/pre>"]]},"lv":{"t":"<code>if<\/code> un <code>unless<\/code> kā izteiksmes modifikatori","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūs vēlaties, lai vienkāršs paziņojums izpildītos tikai tad, ja ir izpildīts noteikts nosacījums.<\/span> <span class=\"sg\" data-s=\"1\">Tam Raku piedāvā ļoti ērtu risinājumu.<\/span> <span class=\"sg\" data-s=\"2\">Jums nav jāveido atsevišķs koda bloks.<\/span> <span class=\"sg\" data-s=\"3\">Vienkārši ielieciet <code>if<\/code> vai <code>unless<\/code> tūlīt aiz paziņojuma.<\/span> <span class=\"sg\" data-s=\"4\">Raku valodā šādas konstrukcijas sauc par <em>paziņojumu modifikatoriem<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Labdien' if $hours &gt; 12;\n\nsay 'Visas sistēmas darbojas' unless $broken;<\/code><\/pre>"]]},"ru":{"t":"<code>if<\/code> и <code>unless<\/code> как модификаторы инструкций","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда вы хотите, чтобы простая инструкция выполнялась только при каком-то условии.<\/span> <span class=\"sg\" data-s=\"1\">Для этого в Raku есть очень удобное решение.<\/span> <span class=\"sg\" data-s=\"2\">Не нужно создавать отдельный блок кода.<\/span> <span class=\"sg\" data-s=\"3\">Просто поставьте <code>if<\/code> или <code>unless<\/code> сразу после инструкции.<\/span> <span class=\"sg\" data-s=\"4\">В Raku такие конструкции называются <em>модификаторы инструкций<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Good afternoon' if $hours &gt; 12;\n\nsay 'All systems work' unless $broken;<\/code><\/pre>"]]},"uk":{"t":"<code>if<\/code> та <code>unless<\/code> як модифікатори операторів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді ви хочете, щоб простий вираз виконувався лише за певної умови.<\/span> <span class=\"sg\" data-s=\"1\">Для цього в Raku є дуже зручне рішення.<\/span> <span class=\"sg\" data-s=\"2\">Вам не потрібно створювати окремий блок коду.<\/span> <span class=\"sg\" data-s=\"3\">Просто поставте <code>if<\/code> або <code>unless<\/code> одразу після виразу.<\/span> <span class=\"sg\" data-s=\"4\">У Raku такі конструкції називаються <em>модифікаторами виразів<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Добрий день' if $hours &gt; 12;\n\nsay 'Усі системи працюють' unless $broken;<\/code><\/pre>"]]},"bg":{"t":"<code>if<\/code> и <code>unless<\/code> като модификатори на изречения","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога искате едно просто изречение да се изпълни само при определено условие.<\/span> <span class=\"sg\" data-s=\"1\">За това Raku има много удобно решение.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да създавате отделен блок от код.<\/span> <span class=\"sg\" data-s=\"3\">Просто поставете <code>if<\/code> или <code>unless<\/code> веднага след изречението.<\/span> <span class=\"sg\" data-s=\"4\">В Raku такива конструкции се наричат <em>модификатори на изречения<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Добър следобед' if $hours &gt; 12;\n\nsay 'Всички системи работят' unless $broken;<\/code><\/pre>"]]},"eo":{"t":"<code>if<\/code> kaj <code>unless<\/code> kiel modifiloj de deklaroj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje vi volas, ke simpla deklaro ruliĝu nur kun certa kondiĉo.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, Raku havas tre praktikan solvon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas krei apartan blokon de kodo.<\/span> <span class=\"sg\" data-s=\"3\">Simple metu <code>if<\/code> aŭ <code>unless<\/code> tuj post la deklaro.<\/span> <span class=\"sg\" data-s=\"4\">En Raku, tiaj konstruoj nomiĝas <em>deklaraj modifiloj<\/em>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Bonan posttagmezon' if $hours &gt; 12;\n\nsay 'Ĉiuj sistemoj funkcias' unless $broken;<\/code><\/pre>"]]},"la":{"t":"<code>if<\/code> et <code>unless<\/code> ut statement modificatores","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum vis simplicem sententiam tantum sub certa condicione currere.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc Raku solutionem valde utilem praebet.<\/span> <span class=\"sg\" data-s=\"2\">Non necesse est separatam clausulam codicis creare.<\/span> <span class=\"sg\" data-s=\"3\">Tantum pone <code>if<\/code> vel <code>unless<\/code> statim post sententiam.<\/span> <span class=\"sg\" data-s=\"4\">In Raku tales structurae <em>modificatores sententiae<\/em> vocantur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Bonum postmeridianum' if $horae &gt; 12;\n\nsay 'Omnia systemata operantur' unless $fractum;<\/code><\/pre>"]]}}}</script>
