<script type="application/json" id="page-data">{"u":"essentials/conditional-checks/ternary-operator","n":139,"k":"topic","pv":"essentials/conditional-checks/comparing-strings/quiz2","nx":"essentials/conditional-checks/ternary-operator/quiz","tr":["essentials","essentials/conditional-checks"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Ternary operator","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, the ternary operator has two parts: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A Boolean test comes first, and two expressions follow it.<\/span> <span class=\"sg\" data-s=\"3\">Only one of them runs, depending on the result of the test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With the value that <code>$shines<\/code> has now, the program prints <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">If you change it to <code>Moon<\/code>, the program prints <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can chain ternary expressions.<\/span> <span class=\"sg\" data-s=\"1\">Just make sure that the code does not get too complicated.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, the program prints a different part of the day for different values of <code>$hours<\/code>.<\/span><\/p>"]]},"de":{"t":"Ternärer Operator","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku hat der ternäre Operator zwei Teile: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Zuerst kommt ein boolescher Test, und danach folgen zwei Ausdrücke.<\/span> <span class=\"sg\" data-s=\"3\">Nur einer von ihnen läuft, je nach dem Ergebnis des Tests.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit dem Wert, den <code>$shines<\/code> jetzt hat, gibt das Programm <code>day<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie ihn in <code>Moon<\/code> ändern, gibt das Programm <code>night<\/code> aus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können ternäre Ausdrücke verketten.<\/span> <span class=\"sg\" data-s=\"1\">Achten Sie nur darauf, dass der Code nicht zu kompliziert wird.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier gibt das Programm für verschiedene Werte von <code>$hours<\/code> eine andere Tageszeit aus.<\/span><\/p>"]]},"nl":{"t":"Ternaire operator","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku heeft de ternary operator twee delen: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eerst komt een Booleaanse test, en daarna volgen twee expressies.<\/span> <span class=\"sg\" data-s=\"3\">Er draait maar één van de twee, afhankelijk van het resultaat van de test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met de waarde die <code>$shines<\/code> nu heeft, print het programma <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als je die verandert in <code>Moon<\/code>, print het programma <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ternary expressies aan elkaar koppelen.<\/span> <span class=\"sg\" data-s=\"1\">Zorg er alleen voor dat de code niet te ingewikkeld wordt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier print het programma een ander deel van de dag voor verschillende waarden van <code>$hours<\/code>.<\/span><\/p>"]]},"es":{"t":"Operador ternario","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, el operador ternario tiene dos partes: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Primero viene una prueba booleana, y después vienen dos expresiones.<\/span> <span class=\"sg\" data-s=\"3\">Solo se ejecuta una de ellas, según el resultado de la prueba.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con el valor que <code>$shines<\/code> tiene ahora, el programa imprime <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si lo cambias a <code>Moon<\/code>, el programa imprime <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes encadenar expresiones ternarias.<\/span> <span class=\"sg\" data-s=\"1\">Solo asegúrate de que el código no se vuelva demasiado complicado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, el programa imprime una parte diferente del día para diferentes valores de <code>$hours<\/code>.<\/span><\/p>"]]},"it":{"t":"Operatore ternario","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, l'operatore ternario ha due parti: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Prima c'è un test booleano, e poi vengono due espressioni.<\/span> <span class=\"sg\" data-s=\"3\">Solo una di loro viene eseguita, a seconda del risultato del test.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con il valore che <code>$shines<\/code> ha ora, il programma stampa <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se lo cambi in <code>Moon<\/code>, il programma stampa <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi concatenare le espressioni ternarie.<\/span> <span class=\"sg\" data-s=\"1\">Fai solo attenzione che il codice non diventi troppo complicato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui il programma stampa una parte diversa della giornata per valori diversi di <code>$hours<\/code>.<\/span><\/p>"]]},"lv":{"t":"Trīsvērtīgais operators","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ternārajam operatoram ir divas daļas: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vispirms nāk Būla tests, un tam seko divas izteiksmes.<\/span> <span class=\"sg\" data-s=\"3\">Izpildās tikai viena no tām, atkarībā no testa rezultāta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar vērtību, kāda tagad ir mainīgajā <code>$shines<\/code>, programma izdrukā <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs to nomaināt uz <code>Moon<\/code>, programma izdrukā <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ternārās izteiksmes var savienot ķēdē.<\/span> <span class=\"sg\" data-s=\"1\">Tikai pārliecinieties, ka kods nekļūst pārāk sarežģīts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit programma izdrukā dažādas dienas daļas dažādām <code>$hours<\/code> vērtībām.<\/span><\/p>"]]},"ru":{"t":"Тернарный оператор","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku у тернарного оператора две части: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сначала идёт булева проверка, а за ней следуют два выражения.<\/span> <span class=\"sg\" data-s=\"3\">Выполняется только одно из них, в зависимости от результата проверки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С тем значением, которое сейчас есть у <code>$shines<\/code>, программа выводит <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если поменять его на <code>Moon<\/code>, программа выведет <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тернарные выражения можно объединять в цепочки.<\/span> <span class=\"sg\" data-s=\"1\">Только следите, чтобы код не стал слишком сложным.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь программа выводит разную часть дня для разных значений <code>$hours<\/code>.<\/span><\/p>"]]},"uk":{"t":"Тернарний оператор","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У Raku тернарний оператор має дві частини: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Спочатку йде логічний тест, а за ним — два вирази.<\/span> <span class=\"sg\" data-s=\"3\">Виконується лише один з них, залежно від результату тесту.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З тим значенням, яке <code>$shines<\/code> має зараз, програма виводить <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо змінити його на <code>Moon<\/code>, програма виведе <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тернарні вирази можна з'єднувати в ланцюжок.<\/span> <span class=\"sg\" data-s=\"1\">Тільки стежте, щоб код не став надто складним.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут програма виводить різну частину дня для різних значень <code>$hours<\/code>.<\/span><\/p>"]]},"bg":{"t":"Теренарен оператор","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В Raku тернарният оператор има две части: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Първо идва булев тест, а след него идват два израза.<\/span> <span class=\"sg\" data-s=\"3\">Само един от тях се изпълнява, в зависимост от резултата от теста.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Със стойността, която <code>$shines<\/code> има сега, програмата отпечатва <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако я смените на <code>Moon<\/code>, програмата отпечатва <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да свързвате тернарни изрази във верига.<\/span> <span class=\"sg\" data-s=\"1\">Само внимавайте кодът да не стане твърде сложен.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук програмата отпечатва различна част от деня за различни стойности на <code>$hours<\/code>.<\/span><\/p>"]]},"eo":{"t":"Ternara operatoro","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En Raku, la ternara operatoro havas du partojn: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Boolea testo venas unue, kaj du esprimoj sekvas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Nur unu el ili ruliĝas, depende de la rezulto de la testo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sun';\nmy $day-time = $shines eq 'Sun' ?? 'day' !! 'night';\nsay $day-time;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun la valoro, kiun <code>$shines<\/code> havas nun, la programo presas <code>day<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se vi ŝanĝas ĝin al <code>Moon<\/code>, la programo presas <code>night<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas ĉeni ternarajn esprimojn.<\/span> <span class=\"sg\" data-s=\"1\">Nur certigu, ke la kodo ne fariĝu tro komplika.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hours = 20;\nmy $day-time =\n    $hours &lt;= 6 ?? 'Night' !!\n    $hours &lt;= 12 ?? 'Morning' !! \n    $hours &lt;= 18 ?? 'Afternoon' !! 'Evening';\nsay $day-time;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la programo presas malsaman parton de la tago por malsamaj valoroj de <code>$hours<\/code>.<\/span><\/p>"]]},"la":{"t":"Ternarius operator","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku operator ternarius duas partes habet: <code>??<\/code> ...<\/span> <span class=\"sg\" data-s=\"1\"><code>!!<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Probatio Booleana primum venit, et duae expressiones eam sequuntur.<\/span> <span class=\"sg\" data-s=\"3\">Tantum una ex eis currit, secundum eventum probationis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $shines = 'Sol';\nmy $tempus-diei = $shines eq 'Sol' ?? 'dies' !! 'nox';\nsay $tempus-diei;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum valore quem <code>$shines<\/code> nunc habet, programma <code>dies<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Si eum in <code>Luna<\/code> mutas, programma <code>nox<\/code> imprimit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Expressiones ternarias concatenare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tantum cura ut codex non nimis implicatus fiat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $horae = 20;\nmy $tempus-diei =\n    $horae &lt;= 6 ?? 'Nox' !!\n    $horae &lt;= 12 ?? 'Mane' !! \n    $horae &lt;= 18 ?? 'Postmeridianum' !! 'Vespera';\nsay $tempus-diei;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic programma pro diversis valoribus <code>$horae<\/code> diversam partem diei imprimit.<\/span><\/p>"]]}}}</script>
