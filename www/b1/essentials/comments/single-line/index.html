<script type="application/json" id="page-data">{"u":"essentials/comments/single-line","n":27,"k":"topic","pv":"essentials/comments","nx":"essentials/comments/single-line/quiz","tr":["essentials","essentials/comments"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Single-line comments","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The simplest kind of comment is a one-line comment.<\/span> <span class=\"sg\" data-s=\"1\">It starts with the <code>#<\/code> character.<\/span> <span class=\"sg\" data-s=\"2\">It goes on until the end of the current line.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # This variable is used to keep user’s name\n$name = prompt 'What is your name? ';\nsay $name; # We see the name now<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Look at a shebang such as <code>#!/usr/bin/env raku<\/code> in the first line of code.<\/span> <span class=\"sg\" data-s=\"1\">For Raku, it is also a comment.<\/span> <span class=\"sg\" data-s=\"2\">But the shell can read and execute it.<\/span><\/p>"]]},"de":{"t":"Einzeilige Kommentare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die einfachste Art von Kommentar ist ein einzeiliger Kommentar.<\/span> <span class=\"sg\" data-s=\"1\">Er beginnt mit dem Zeichen <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er reicht bis zum Ende der aktuellen Zeile.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Diese Variable wird verwendet, um den Namen des Benutzers zu speichern\n$name = prompt 'Wie heißt du? ';\nsay $name; # Jetzt sehen wir den Namen<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich einen Shebang wie <code>#!/usr/bin/env raku<\/code> in der ersten Codezeile an.<\/span> <span class=\"sg\" data-s=\"1\">Für Raku ist er auch ein Kommentar.<\/span> <span class=\"sg\" data-s=\"2\">Aber die Shell kann ihn lesen und ausführen.<\/span><\/p>"]]},"nl":{"t":"Eenzijnige opmerkingen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste soort opmerking is een eenregelige opmerking.<\/span> <span class=\"sg\" data-s=\"1\">Ze begint met het <code>#<\/code>-teken.<\/span> <span class=\"sg\" data-s=\"2\">Ze gaat door tot het einde van de huidige regel.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Deze variabele wordt gebruikt om de naam van de gebruiker te bewaren\n$name = prompt 'Wat is je naam? ';\nsay $name; # We zien nu de naam<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kijk naar een shebang zoals <code>#!/usr/bin/env raku<\/code> in de eerste regel van de code.<\/span> <span class=\"sg\" data-s=\"1\">Voor Raku is dat ook een opmerking.<\/span> <span class=\"sg\" data-s=\"2\">Maar de shell kan hem lezen en uitvoeren.<\/span><\/p>"]]},"es":{"t":"Comentarios de una línea","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El tipo de comentario más simple es el comentario de una sola línea.<\/span> <span class=\"sg\" data-s=\"1\">Empieza con el carácter <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Continúa hasta el final de la línea actual.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Esta variable se usa para guardar el nombre del usuario\n$name = prompt '¿Cuál es tu nombre? ';\nsay $name; # Ahora vemos el nombre<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fíjate en un shebang como <code>#!/usr/bin/env raku<\/code> en la primera línea de código.<\/span> <span class=\"sg\" data-s=\"1\">Para Raku, también es un comentario.<\/span> <span class=\"sg\" data-s=\"2\">Pero el shell puede leerlo y ejecutarlo.<\/span><\/p>"]]},"it":{"t":"Commenti su una sola linea","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il tipo di commento più semplice è il commento su una riga.<\/span> <span class=\"sg\" data-s=\"1\">Inizia con il carattere <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Continua fino alla fine della riga corrente.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Questa variabile viene utilizzata per memorizzare il nome dell'utente\n$name = prompt 'Qual è il tuo nome? ';\nsay $name; # Ora vediamo il nome<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Guarda uno shebang come <code>#!/usr/bin/env raku<\/code> nella prima riga di codice.<\/span> <span class=\"sg\" data-s=\"1\">Per Raku, anche questo è un commento.<\/span> <span class=\"sg\" data-s=\"2\">Ma la shell lo può leggere ed eseguire.<\/span><\/p>"]]},"lv":{"t":"Vienrindas komentāri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākais komentāra veids ir vienrindas komentārs.<\/span> <span class=\"sg\" data-s=\"1\">Tas sākas ar <code>#<\/code> rakstzīmi.<\/span> <span class=\"sg\" data-s=\"2\">Tas turpinās līdz pašreizējās rindas beigām.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Šis mainīgais tiek izmantots lietotāja vārda glabāšanai\n$name = prompt 'Kā tevi sauc? ';\nsay $name; # Tagad redzam vārdu<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Apskatiet shebang, piemēram, <code>#!/usr/bin/env raku<\/code> koda pirmajā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodai tas arī ir komentārs.<\/span> <span class=\"sg\" data-s=\"2\">Bet čaula to var nolasīt un izpildīt.<\/span><\/p>"]]},"ru":{"t":"Однострочные комментарии","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Самый простой вид комментария — это однострочный комментарий.<\/span> <span class=\"sg\" data-s=\"1\">Он начинается с символа <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он продолжается до конца текущей строки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # This variable is used to keep user’s name\n$name = prompt 'What is your name? ';\nsay $name; # We see the name now<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на shebang, например <code>#!/usr/bin/env raku<\/code>, в первой строке кода.<\/span> <span class=\"sg\" data-s=\"1\">Для Raku это тоже комментарий.<\/span> <span class=\"sg\" data-s=\"2\">Но командная оболочка может его прочитать и выполнить.<\/span><\/p>"]]},"uk":{"t":"Однорядкові коментарі","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Найпростіший вид коментаря — однорядковий коментар.<\/span> <span class=\"sg\" data-s=\"1\">Він починається з символу <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він триває до кінця поточного рядка.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Ця змінна використовується для зберігання імені користувача\n$name = prompt 'Як вас звати? ';\nsay $name; # Тепер ми бачимо ім'я<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Подивіться на shebang, наприклад <code>#!/usr/bin/env raku<\/code>, у першому рядку коду.<\/span> <span class=\"sg\" data-s=\"1\">Для Raku це теж коментар.<\/span> <span class=\"sg\" data-s=\"2\">Але оболонка може його прочитати і виконати.<\/span><\/p>"]]},"bg":{"t":"Едноредови коментари","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Най-простият вид коментар е едноредовият коментар.<\/span> <span class=\"sg\" data-s=\"1\">Той започва със символа <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Продължава до края на текущия ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Тази променлива се използва за съхранение на името на потребителя\n$name = prompt 'Как се казваш? ';\nsay $name; # Сега виждаме името<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вижте shebang като <code>#!/usr/bin/env raku<\/code> в първия ред на кода.<\/span> <span class=\"sg\" data-s=\"1\">За Raku той също е коментар.<\/span> <span class=\"sg\" data-s=\"2\">Но черупката може да го прочете и изпълни.<\/span><\/p>"]]},"eo":{"t":"Unuliniaj komentoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La plej simpla speco de komento estas unulinia komento.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komenciĝas per la signo <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi daŭras ĝis la fino de la aktuala linio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Ĉi tiu variablo estas uzata por konservi la nomon de la uzanto\n$name = prompt 'Kio estas via nomo? ';\nsay $name; # Ni vidas la nomon nun<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rigardu shebang-on kiel <code>#!/usr/bin/env raku<\/code> en la unua linio de kodo.<\/span> <span class=\"sg\" data-s=\"1\">Por Raku, ĝi ankaŭ estas komento.<\/span> <span class=\"sg\" data-s=\"2\">Sed la ŝelo povas legi kaj plenumi ĝin.<\/span><\/p>"]]},"la":{"t":"Commentarii unius lineae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Simplicissimum genus commentarii est commentarius unius lineae.<\/span> <span class=\"sg\" data-s=\"1\">Incipit a charactere <code>#<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pergit usque ad finem lineae currentis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name; # Haec variabilis ad nomen usoris servandum adhibetur\n$name = prompt 'Quod est nomen tuum? ';\nsay $name; # Nunc nomen videmus<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Specta shebang sicut <code>#!/usr/bin/env raku<\/code> in prima linea codicis.<\/span> <span class=\"sg\" data-s=\"1\">Pro Raku, id etiam commentarius est.<\/span> <span class=\"sg\" data-s=\"2\">Sed testudo id legere et exsequi potest.<\/span><\/p>"]]}}}</script>
