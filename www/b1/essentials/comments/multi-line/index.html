<script type="application/json" id="page-data">{"u":"essentials/comments/multi-line","n":29,"k":"topic","pv":"essentials/comments/single-line/quiz","nx":"essentials/comments/embedded","tr":["essentials","essentials/comments"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multi-line comments","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">If your comment is longer than one line, you have a choice.<\/span> <span class=\"sg\" data-s=\"1\">You can write a few single-line comments or one multi-line comment.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Multi-line comments start with two characters: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">After them comes a pair of opening and closing characters: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> or <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can also repeat them, for example, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> and so on.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We are going to ask the user\nto enter their name first and then\nsave the input in a variable. )\n\n$name = prompt 'What is your name? ';\n#`{ The program now waits\nuntil the user enters the name\nand presses Enter. }\n\nsay $name; #`( And now we can print it )<\/code><\/pre>"]]},"de":{"t":"Mehrzeilige Kommentare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Ihr Kommentar länger als eine Zeile ist, haben Sie die Wahl.<\/span> <span class=\"sg\" data-s=\"1\">Sie können ein paar einzeilige Kommentare oder einen mehrzeiligen Kommentar schreiben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mehrzeilige Kommentare beginnen mit zwei Zeichen: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Danach folgt ein Paar aus einem öffnenden und einem schließenden Zeichen: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> oder <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie können sie auch wiederholen, zum Beispiel <code>(( ))<\/code>, <code>[[[ ]]]<\/code> und so weiter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Wir werden den Benutzer fragen,\nseinen Namen einzugeben, und dann\ndie Eingabe in einer Variablen speichern. )\n\n$name = prompt 'Wie heißt du? ';\n#`{ Das Programm wartet jetzt,\nbis der Benutzer den Namen eingibt\nund Enter drückt. }\n\nsay $name; #`( Und jetzt können wir es ausdrucken )<\/code><\/pre>"]]},"nl":{"t":"Meerzijdige opmerkingen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je opmerking langer is dan één regel, heb je een keuze.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een paar eenregelige opmerkingen schrijven of één meerregelige opmerking.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Meerregelige opmerkingen beginnen met twee tekens: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Daarna komen een openend en een sluitend teken: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> of <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze ook herhalen, bijvoorbeeld <code>(( ))<\/code>, <code>[[[ ]]]<\/code> enzovoort.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We gaan de gebruiker vragen\nom eerst hun naam in te voeren en vervolgens\nde invoer in een variabele op te slaan. )\n\n$name = prompt 'Wat is je naam? ';\n#`{ Het programma wacht nu\ntotdat de gebruiker de naam invoert\nen op Enter drukt. }\n\nsay $name; #`( En nu kunnen we het afdrukken )<\/code><\/pre>"]]},"es":{"t":"Comentarios de varias líneas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Si tu comentario ocupa más de una línea, puedes elegir.<\/span> <span class=\"sg\" data-s=\"1\">Puedes escribir varios comentarios de una sola línea o un solo comentario de varias líneas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los comentarios de varias líneas empiezan con dos caracteres: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Después viene un par de caracteres de apertura y cierre: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> o <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">También puedes repetirlos, por ejemplo, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> y así sucesivamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Vamos a pedirle al usuario\nque ingrese su nombre primero y luego\nguardaremos la entrada en una variable. )\n\n$name = prompt '¿Cuál es tu nombre? ';\n#`{ El programa ahora espera\nhasta que el usuario ingrese el nombre\ny presione Enter. }\n\nsay $name; #`( Y ahora podemos imprimirlo )<\/code><\/pre>"]]},"it":{"t":"Commenti su più linee","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Se il tuo commento è più lungo di una riga, puoi scegliere.<\/span> <span class=\"sg\" data-s=\"1\">Puoi scrivere alcuni commenti su una singola riga o un solo commento multi-linea.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I commenti multi-linea iniziano con due caratteri: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Dopo di loro viene una coppia di caratteri di apertura e di chiusura: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> o <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche ripeterli, per esempio, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> e così via.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Chiederemo all'utente\ndi inserire il proprio nome prima e poi\nsalveremo l'input in una variabile. )\n\n$name = prompt 'Qual è il tuo nome? ';\n#`{ Il programma ora aspetta\nfino a quando l'utente inserisce il nome\ne preme Invio. }\n\nsay $name; #`( E ora possiamo stamparlo )<\/code><\/pre>"]]},"lv":{"t":"Daudzrindu komentāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūsu komentārs ir garāks par vienu rindu, jums ir izvēle.<\/span> <span class=\"sg\" data-s=\"1\">Varat uzrakstīt dažus vienrindu komentārus vai vienu vairākrindu komentāru.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vairākrindu komentāri sākas ar divām rakstzīmēm: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Pēc tām seko atverošās un aizverošās rakstzīmes pāris: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> vai <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tās var arī atkārtot, piemēram, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> un tā tālāk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Mēs lūgsim lietotājam\nvispirms ievadīt savu vārdu un tad\nsaglabāt ievadi mainīgajā. )\n\n$name = prompt 'Kāds ir tavs vārds? ';\n#`{ Programma tagad gaida,\nlīdz lietotājs ievadīs vārdu\nun nospiedīs Enter. }\n\nsay $name; #`( Un tagad mēs to varam izdrukāt )<\/code><\/pre>"]]},"ru":{"t":"Многострочные комментарии","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Если ваш комментарий длиннее одной строки, у вас есть выбор.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете написать несколько однострочных комментариев или один многострочный.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Многострочные комментарии начинаются с двух символов: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">После них идёт пара из открывающего и закрывающего символов: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> или <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Их также можно повторить, например, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> и так далее.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( We are going to ask the user\nto enter their name first and then\nsave the input in a variable. )\n\n$name = prompt 'What is your name? ';\n#`{ The program now waits\nuntil the user enters the name\nand presses Enter. }\n\nsay $name; #`( And now we can print it )<\/code><\/pre>"]]},"uk":{"t":"Багаторядкові коментарі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ваш коментар довший за один рядок, у вас є вибір.<\/span> <span class=\"sg\" data-s=\"1\">Можна написати кілька однорядкових коментарів або один багаторядковий.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Багаторядкові коментарі починаються з двох символів: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Після них іде пара символів, які відкривають і закривають коментар: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> або <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Їх також можна повторити, наприклад, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> і так далі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ми збираємося попросити користувача\nввести своє ім'я спочатку, а потім\nзберегти введення в змінну. )\n\n$name = prompt 'Як вас звати? ';\n#`{ Програма тепер чекає,\nпоки користувач введе ім'я\nі натисне Enter. }\n\nsay $name; #`( А тепер ми можемо його надрукувати )<\/code><\/pre>"]]},"bg":{"t":"Многоредови коментари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако коментарът ви е по-дълъг от един ред, имате избор.<\/span> <span class=\"sg\" data-s=\"1\">Можете да напишете няколко едноредови коментара или един многострочен коментар.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Многострочните коментари започват с два символа: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">След тях идва двойка от отварящ и затварящ символ: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> или <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете също да ги повторите, например <code>(( ))<\/code>, <code>[[[ ]]]<\/code> и така нататък.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ще помолим потребителя\nда въведе своето име първо и след това\nще запазим въведеното в променлива. )\n\n$name = prompt 'Как се казвате? ';\n#`{ Програмата сега чака\nдокато потребителят въведе името\nи натисне Enter. }\n\nsay $name; #`( И сега можем да го отпечатаме )<\/code><\/pre>"]]},"eo":{"t":"Plurliniaj komentoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Se via komento estas pli longa ol unu linio, vi havas elekton.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas skribi kelkajn unuliniajn komentojn aŭ unu plurlinian komenton.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Plurliniaj komentoj komenciĝas per du karakteroj: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Post ili venas paro de malfermaj kaj fermaj karakteroj: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> aŭ <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas ripeti ilin, ekzemple, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> kaj tiel plu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Ni petos la uzanton\nenmeti sian nomon unue kaj poste\nkonservi la enigon en variablo. )\n\n$name = prompt 'Kio estas via nomo? ';\n#`{ La programo nun atendas\nĝis la uzanto enmetas la nomon\nkaj premas Enter. }\n\nsay $name; #`( Kaj nun ni povas presi ĝin )<\/code><\/pre>"]]},"la":{"t":"Commentarii multi-lineae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Si commentarius tuus longior est quam una linea, eligere potes.<\/span> <span class=\"sg\" data-s=\"1\">Paucos commentarios unius lineae aut unum commentarium multi-lineae scribere potes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Commentarii multi-lineae a duobus characteribus incipiunt: <code><\/code>#<code> <\/code><code>.<\/code><\/span> <span class=\"sg\" data-s=\"1\">Post eos venit par characterum, unus aperiens et alter claudens: <code>( )<\/code>, <code>{ }<\/code>, <code>[ ]<\/code> aut <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eos etiam repetere potes, exempli gratia, <code>(( ))<\/code>, <code>[[[ ]]]<\/code> et cetera.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n#`( Rogaturi sumus utentem\nut nomen suum primum inserat et deinde\ninput in variabili servet. )\n\n$name = prompt 'Quod est nomen tuum? ';\n#`{ Programma nunc exspectat\nuntil utens nomen inserat\net premet Enter. }\n\nsay $name; #`( Et nunc possumus illud imprimere )<\/code><\/pre>"]]}}}</script>
