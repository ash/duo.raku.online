<script type="application/json" id="page-data">{"u":"essentials/typed-variables/allomorphs","n":200,"k":"topic","pv":"essentials/typed-variables/coercion/quiz","nx":"essentials/typed-variables/exercises","tr":["essentials","essentials/typed-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Allomorphs","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Look at the following program.<\/span> <span class=\"sg\" data-s=\"1\">Before you run it, try to guess.<\/span> <span class=\"sg\" data-s=\"2\">Which input values would break it, and at which line?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The program creates three scalar variables here.<\/span> <span class=\"sg\" data-s=\"1\">Two of them, <code>$i<\/code> and <code>$s<\/code>, are typed variables.<\/span> <span class=\"sg\" data-s=\"2\">This means that <code>$i<\/code> can only store integers, and <code>$s<\/code> can only store strings.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The type that <code>prompt<\/code> returns depends on the characters we typed.<\/span> <span class=\"sg\" data-s=\"1\">If the input string can be an integer, the result has the <code>IntStr<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\">This type is <em>both<\/em> <code>Int<\/code> and <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So you can assign it to an <code>Int<\/code> variable or to a <code>Str<\/code> variable.<\/span> <span class=\"sg\" data-s=\"4\">For example, if you enter <code>1234<\/code>, the program does not break.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>IntStr<\/code> type is an example of what is called an <em>allomorph<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is a data type that combines two other types.<\/span> <span class=\"sg\" data-s=\"2\">Here are a few more examples.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you enter a string that cannot be an integer, the program breaks.<\/span> <span class=\"sg\" data-s=\"1\">This happens when we assign <code>$input<\/code> to <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Note that you also get an error for a number that is not an integer.<\/span> <span class=\"sg\" data-s=\"1\">An integer container cannot store a floating-point or a rational number.<\/span> <span class=\"sg\" data-s=\"2\">So Raku throws an exception:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The second assignment, <code>$s = $input<\/code>, will never break, because a string can take any input.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code of this program in the file <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"de":{"t":"Allomorphe","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich das folgende Programm an.<\/span> <span class=\"sg\" data-s=\"1\">Bevor Sie es ausführen, versuchen Sie zu raten.<\/span> <span class=\"sg\" data-s=\"2\">Bei welchen Eingabewerten würde es abbrechen, und in welcher Zeile?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Programm erstellt hier drei skalare Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Zwei davon, <code>$i<\/code> und <code>$s<\/code>, sind typisierte Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Das bedeutet, dass <code>$i<\/code> nur ganze Zahlen speichern kann und <code>$s<\/code> nur Zeichenketten.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der Typ, den <code>prompt<\/code> zurückgibt, hängt von den eingegebenen Zeichen ab.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Eingabezeichenkette eine ganze Zahl sein kann, hat das Ergebnis den Typ <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Typ ist <em>sowohl<\/em> <code>Int<\/code> als auch <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sie können ihn also einer <code>Int<\/code>-Variable oder einer <code>Str<\/code>-Variable zuweisen.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Sie zum Beispiel <code>1234<\/code> eingeben, bricht das Programm nicht ab.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Typ <code>IntStr<\/code> ist ein Beispiel für einen sogenannten <em>Allomorph<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein Datentyp, der zwei andere Typen kombiniert.<\/span> <span class=\"sg\" data-s=\"2\">Hier sind einige weitere Beispiele.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie eine Zeichenkette eingeben, die keine ganze Zahl sein kann, bricht das Programm ab.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, wenn wir <code>$input<\/code> der Variable <code>$i<\/code> zuweisen:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Sie auch bei einer Zahl, die keine ganze Zahl ist, einen Fehler bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Ein Ganzzahl-Container kann keine Gleitkommazahl und keine rationale Zahl speichern.<\/span> <span class=\"sg\" data-s=\"2\">Darum löst Raku eine Ausnahme aus:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die zweite Zuweisung, <code>$s = $input<\/code>, wird nie scheitern, weil eine Zeichenkette jede Eingabe annehmen kann.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Sie können den Quellcode dieses Programms in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a> finden.<\/span><\/p>"]]},"nl":{"t":"Allomorfen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kijk naar het volgende programma.<\/span> <span class=\"sg\" data-s=\"1\">Probeer te raden, voordat je het uitvoert.<\/span> <span class=\"sg\" data-s=\"2\">Welke invoerwaarden zouden het breken, en op welke regel?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het programma maakt hier drie scalaire variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Twee daarvan, <code>$i<\/code> en <code>$s<\/code>, zijn getypeerde variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Dat betekent dat <code>$i<\/code> alleen gehele getallen kan opslaan, en <code>$s<\/code> alleen strings.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het type dat <code>prompt<\/code> teruggeeft, hangt af van de tekens die we hebben getypt.<\/span> <span class=\"sg\" data-s=\"1\">Als de invoerstring een geheel getal kan zijn, heeft het resultaat het type <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dit type is <em>zowel<\/em> <code>Int<\/code> als <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dus kun je het toewijzen aan een <code>Int<\/code>-variabele of aan een <code>Str<\/code>-variabele.<\/span> <span class=\"sg\" data-s=\"4\">Als je bijvoorbeeld <code>1234<\/code> invoert, breekt het programma niet.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het type <code>IntStr<\/code> is een voorbeeld van een zogenaamde <em>allomorf<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is een gegevenstype dat twee andere typen combineert.<\/span> <span class=\"sg\" data-s=\"2\">Hier zijn nog een paar voorbeelden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een string invoert die geen geheel getal kan zijn, breekt het programma.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt op het moment dat we <code>$input<\/code> aan <code>$i<\/code> toewijzen:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let op dat je ook een foutmelding krijgt voor een getal dat geen geheel getal is.<\/span> <span class=\"sg\" data-s=\"1\">Een container voor gehele getallen kan geen drijvende-kommagetal of rationaal getal opslaan.<\/span> <span class=\"sg\" data-s=\"2\">Daarom geeft Raku een uitzondering:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De tweede toewijzing, <code>$s = $input<\/code>, zal nooit breken, omdat een string elke invoer kan accepteren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode van dit programma vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"es":{"t":"Alomorfos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Mira el siguiente programa.<\/span> <span class=\"sg\" data-s=\"1\">Antes de ejecutarlo, intenta adivinar.<\/span> <span class=\"sg\" data-s=\"2\">¿Qué valores de entrada lo romperían, y en qué línea?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí el programa crea tres variables escalares.<\/span> <span class=\"sg\" data-s=\"1\">Dos de ellas, <code>$i<\/code> y <code>$s<\/code>, son variables tipadas.<\/span> <span class=\"sg\" data-s=\"2\">Esto significa que <code>$i<\/code> solo puede almacenar enteros, y <code>$s<\/code> solo puede almacenar cadenas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El tipo que devuelve <code>prompt<\/code> depende de los caracteres que escribimos.<\/span> <span class=\"sg\" data-s=\"1\">Si la cadena de entrada puede ser un entero, el resultado es del tipo <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Este tipo es <em>tanto<\/em> <code>Int<\/code> como <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes asignarlo a una variable <code>Int<\/code> o a una variable <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, si escribes <code>1234<\/code>, el programa no se rompe.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El tipo <code>IntStr<\/code> es un ejemplo de lo que se llama un <em>alomorfo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es un tipo de dato que combina otros dos tipos.<\/span> <span class=\"sg\" data-s=\"2\">Aquí hay algunos ejemplos más.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si escribes una cadena que no puede ser un entero, el programa se rompe.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa cuando asignamos <code>$input<\/code> a <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que también obtienes un error con un número que no es entero.<\/span> <span class=\"sg\" data-s=\"1\">Un contenedor entero no puede almacenar un número de punto flotante ni uno racional.<\/span> <span class=\"sg\" data-s=\"2\">Así que Raku lanza una excepción:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La segunda asignación, <code>$s = $input<\/code>, nunca se romperá, porque una cadena puede tomar cualquier entrada.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente de este programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"it":{"t":"Allomorfi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Guarda il seguente programma.<\/span> <span class=\"sg\" data-s=\"1\">Prima di eseguirlo, prova a indovinare.<\/span> <span class=\"sg\" data-s=\"2\">Quali valori in input lo romperebbero, e a quale riga?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui il programma crea tre variabili scalari.<\/span> <span class=\"sg\" data-s=\"1\">Due di esse, <code>$i<\/code> e <code>$s<\/code>, sono variabili tipizzate.<\/span> <span class=\"sg\" data-s=\"2\">Questo vuol dire che <code>$i<\/code> può contenere solo interi, e <code>$s<\/code> può contenere solo stringhe.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il tipo che <code>prompt<\/code> restituisce dipende dai caratteri che abbiamo scritto.<\/span> <span class=\"sg\" data-s=\"1\">Se la stringa in input può essere un intero, il risultato ha il tipo <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo tipo è <em>sia<\/em> <code>Int<\/code> che <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi assegnarlo a una variabile <code>Int<\/code> o a una variabile <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, se inserisci <code>1234<\/code>, il programma non si rompe.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il tipo <code>IntStr<\/code> è un esempio di quello che si chiama <em>allomorfo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È un tipo di dato che unisce due altri tipi.<\/span> <span class=\"sg\" data-s=\"2\">Ecco alcuni altri esempi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se inserisci una stringa che non può essere un intero, il programma si rompe.<\/span> <span class=\"sg\" data-s=\"1\">Questo succede quando assegniamo <code>$input<\/code> a <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che ottieni un errore anche per un numero che non è un intero.<\/span> <span class=\"sg\" data-s=\"1\">Un contenitore intero non può contenere un numero in virgola mobile o un numero razionale.<\/span> <span class=\"sg\" data-s=\"2\">Così Raku lancia un'eccezione:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il secondo assegnamento, <code>$s = $input<\/code>, non si romperà mai, perché una stringa può accettare qualsiasi input.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente di questo programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"lv":{"t":"Allomorfi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šādu programmu.<\/span> <span class=\"sg\" data-s=\"1\">Pirms to palaižat, mēģiniet uzminēt.<\/span> <span class=\"sg\" data-s=\"2\">Kuras ievades vērtības to salauztu, un kurā rindā?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma šeit izveido trīs skalāros mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Divi no tiem, <code>$i<\/code> un <code>$s<\/code>, ir tipizēti mainīgie.<\/span> <span class=\"sg\" data-s=\"2\">Tas nozīmē, ka <code>$i<\/code> var glabāt tikai veselus skaitļus, un <code>$s<\/code> var glabāt tikai virknes.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tips, ko atgriež <code>prompt<\/code>, ir atkarīgs no rakstzīmēm, ko mēs ievadījām.<\/span> <span class=\"sg\" data-s=\"1\">Ja ievades virkne var būt vesels skaitlis, rezultātam ir <code>IntStr<\/code> tips.<\/span> <span class=\"sg\" data-s=\"2\">Šis tips ir <em>gan<\/em> <code>Int<\/code>, gan <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tātad jūs varat to piešķirt <code>Int<\/code> mainīgajam vai <code>Str<\/code> mainīgajam.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, ja jūs ievadāt <code>1234<\/code>, programma nesalūst.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>IntStr<\/code> tips ir tā saucamā <em>allomorfa<\/em> piemērs.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir datu tips, kas apvieno divus citus tipus.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir vēl daži piemēri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūs ievadāt virkni, kas nevar būt vesels skaitlis, programma salūst.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek brīdī, kad mēs piešķiram <code>$input<\/code> mainīgajam <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka jūs saņemat kļūdu arī tad, ja skaitlis nav vesels.<\/span> <span class=\"sg\" data-s=\"1\">Vesela skaitļa konteiners nevar glabāt peldošā punkta vai racionālu skaitli.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc Raku izmet izņēmumu:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otrā piešķiršana, <code>$s = $input<\/code>, nekad nesalūzīs, jo virkne var pieņemt jebkuru ievadi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast šīs programmas avota kodu failā <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"ru":{"t":"Алломорфы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на следующую программу.<\/span> <span class=\"sg\" data-s=\"1\">Прежде чем запустить её, попробуйте угадать.<\/span> <span class=\"sg\" data-s=\"2\">Какие входные значения её сломают и на какой строке?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь программа создаёт три скалярные переменные.<\/span> <span class=\"sg\" data-s=\"1\">Две из них, <code>$i<\/code> и <code>$s<\/code>, — типизированные переменные.<\/span> <span class=\"sg\" data-s=\"2\">Это значит, что <code>$i<\/code> может хранить только целые числа, а <code>$s<\/code> — только строки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тип, который возвращает <code>prompt<\/code>, зависит от символов, которые мы ввели.<\/span> <span class=\"sg\" data-s=\"1\">Если входная строка может быть целым числом, результат будет типа <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Этот тип — <em>одновременно<\/em> <code>Int<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому его можно присвоить переменной типа <code>Int<\/code> или переменной типа <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Например, если вы введёте <code>1234<\/code>, программа не сломается.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> — это пример так называемого <em>алломорфа<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это тип данных, который объединяет два других типа.<\/span> <span class=\"sg\" data-s=\"2\">Вот ещё несколько примеров.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы введёте строку, которая не может быть целым числом, программа сломается.<\/span> <span class=\"sg\" data-s=\"1\">Это происходит, когда мы присваиваем <code>$input<\/code> переменной <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что ошибка будет и для числа, которое не является целым.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер для целых чисел не может хранить число с плавающей запятой или рациональное число.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому Raku выдаёт исключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второе присваивание, <code>$s = $input<\/code>, никогда не сломается, потому что строка может принять любой ввод.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код этой программы можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"uk":{"t":"Аломорфи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подивіться на таку програму.<\/span> <span class=\"sg\" data-s=\"1\">Перш ніж запустити її, спробуйте вгадати.<\/span> <span class=\"sg\" data-s=\"2\">Які вхідні значення її зламають і на якому рядку?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут програма створює три скалярні змінні.<\/span> <span class=\"sg\" data-s=\"1\">Дві з них, <code>$i<\/code> і <code>$s<\/code>, є типізованими змінними.<\/span> <span class=\"sg\" data-s=\"2\">Це означає, що <code>$i<\/code> може зберігати лише цілі числа, а <code>$s<\/code> може зберігати лише рядки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тип, який повертає <code>prompt<\/code>, залежить від символів, які ми ввели.<\/span> <span class=\"sg\" data-s=\"1\">Якщо вхідний рядок може бути цілим числом, результат має тип <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Цей тип є <em>одночасно<\/em> <code>Int<\/code> і <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тож його можна присвоїти змінній <code>Int<\/code> або змінній <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, якщо ви введете <code>1234<\/code>, програма не зламається.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тип <code>IntStr<\/code> — це приклад так званого <em>аломорфа<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це тип даних, який поєднує два інші типи.<\/span> <span class=\"sg\" data-s=\"2\">Ось ще кілька прикладів.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви введете рядок, який не може бути цілим числом, програма зламається.<\/span> <span class=\"sg\" data-s=\"1\">Це стається, коли ми присвоюємо <code>$input<\/code> змінній <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що ви також отримаєте помилку для числа, яке не є цілим.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер для цілих чисел не може зберігати число з плаваючою комою або раціональне число.<\/span> <span class=\"sg\" data-s=\"2\">Тож Raku видає виняток:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друге присвоєння, <code>$s = $input<\/code>, ніколи не зламається, тому що рядок може прийняти будь-які вхідні дані.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код цієї програми у файлі <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"bg":{"t":"Аломорфи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вижте следната програма.<\/span> <span class=\"sg\" data-s=\"1\">Преди да я стартирате, опитайте да познаете.<\/span> <span class=\"sg\" data-s=\"2\">Кои входни стойности биха я счупили и на кой ред?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук програмата създава три скаларни променливи.<\/span> <span class=\"sg\" data-s=\"1\">Две от тях, <code>$i<\/code> и <code>$s<\/code>, са типизирани променливи.<\/span> <span class=\"sg\" data-s=\"2\">Това означава, че <code>$i<\/code> може да съхранява само цели числа, а <code>$s<\/code> може да съхранява само низове.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Типът, който <code>prompt<\/code> връща, зависи от символите, които сме въвели.<\/span> <span class=\"sg\" data-s=\"1\">Ако входният низ може да е цяло число, резултатът е от тип <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Този тип е <em>едновременно<\/em> <code>Int<\/code> и <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да го присвоите на променлива от тип <code>Int<\/code> или на променлива от тип <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Например, ако въведете <code>1234<\/code>, програмата не се чупи.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типът <code>IntStr<\/code> е пример за така наречения <em>аломорф<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това е тип данни, който съчетава два други типа.<\/span> <span class=\"sg\" data-s=\"2\">Ето още няколко примера.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако въведете низ, който не може да е цяло число, програмата се чупи.<\/span> <span class=\"sg\" data-s=\"1\">Това става в момента, когато присвояваме <code>$input<\/code> на <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че получавате грешка и за число, което не е цяло.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер за цели числа не може да съхранява число с плаваща запетая или рационално число.<\/span> <span class=\"sg\" data-s=\"2\">Затова Raku хвърля изключение:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Второто присвояване, <code>$s = $input<\/code>, никога няма да се счупи, защото низът може да приеме всякакъв вход.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код на тази програма във файла <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"eo":{"t":"Alomorfoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Rigardu la sekvan programon.<\/span> <span class=\"sg\" data-s=\"1\">Antaŭ ol ruli ĝin, provu diveni.<\/span> <span class=\"sg\" data-s=\"2\">Kiuj enigaj valoroj rompus ĝin, kaj ĉe kiu linio?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La programo kreas ĉi tie tri skalarajn variablojn.<\/span> <span class=\"sg\" data-s=\"1\">Du el ili, <code>$i<\/code> kaj <code>$s<\/code>, estas tipitaj variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Tio signifas, ke <code>$i<\/code> povas konservi nur entjerojn, kaj <code>$s<\/code> povas konservi nur ĉenojn.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La tipo, kiun <code>prompt<\/code> redonas, dependas de la karakteroj, kiujn ni tajpis.<\/span> <span class=\"sg\" data-s=\"1\">Se la eniga ĉeno povas esti entjero, la rezulto havas la tipon <code>IntStr<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu tipo estas <em>ambaŭ<\/em> <code>Int<\/code> kaj <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas asigni ĝin al <code>Int<\/code> variablo aŭ al <code>Str<\/code> variablo.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, se vi enigas <code>1234<\/code>, la programo ne rompiĝas.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La tipo <code>IntStr<\/code> estas ekzemplo de tio, kion oni nomas <em>alomorfo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas datumtipo, kiu kombinas du aliajn tipojn.<\/span> <span class=\"sg\" data-s=\"2\">Jen kelkaj pliaj ekzemploj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi enigas ĉenon, kiu ne povas esti entjero, la programo rompiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, kiam ni asignas <code>$input<\/code> al <code>$i<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke vi ankaŭ ricevas eraron por nombro, kiu ne estas entjero.<\/span> <span class=\"sg\" data-s=\"1\">Entjera ujo ne povas konservi glitkoman aŭ racian nombron.<\/span> <span class=\"sg\" data-s=\"2\">Do Raku ĵetas escepton:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La dua asigno, <code>$s = $input<\/code>, neniam rompiĝos, ĉar ĉeno povas preni ajnan enigon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon de ĉi tiu programo en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]},"la":{"t":"Allomorphes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Specta programma sequens.<\/span> <span class=\"sg\" data-s=\"1\">Antequam id curris, conare conicere.<\/span> <span class=\"sg\" data-s=\"2\">Qui valores inputi id frangerent, et in qua linea?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $input = prompt 'Enter something: ';\nmy Int $i = $input;\nmy Str $s = $input;\n\nsay $i;\nsay $s;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma hic tres variabiles scalares creat.<\/span> <span class=\"sg\" data-s=\"1\">Duae earum, <code>$i<\/code> et <code>$s<\/code>, sunt variabiles typatae.<\/span> <span class=\"sg\" data-s=\"2\">Hoc significat: <code>$i<\/code> solum integros servare potest, et <code>$s<\/code> solum chordas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Typus quem <code>prompt<\/code> reddit a characteribus pendet quos scripsimus.<\/span> <span class=\"sg\" data-s=\"1\">Si chorda inputi integer esse potest, eventus typum <code>IntStr<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Hic typus est <em>et<\/em> <code>Int<\/code> et <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Itaque eum variabili <code>Int<\/code> vel variabili <code>Str<\/code> assignare potes.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, si <code>1234<\/code> inseris, programma non frangitur.<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 1234\n1234\n1234<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Typus <code>IntStr<\/code> est exemplum sic dicti <em>allomorphi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Est typus datorum qui duos alios typos coniungit.<\/span> <span class=\"sg\" data-s=\"2\">Hic sunt pauca alia exempla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si chordam inseris quae integer esse non potest, programma frangitur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc accidit cum <code>$input<\/code> ad <code>$i<\/code> assignamus:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: Hello, World!\nType check failed in assignment to $i; expected Int but got Str (\"Hello, World!\")\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota: errorem etiam accipis pro numero qui integer non est.<\/span> <span class=\"sg\" data-s=\"1\">Continens integrum numerum puncti fluctuantis vel rationalem servare non potest.<\/span> <span class=\"sg\" data-s=\"2\">Itaque Raku exceptionem emittit:<\/span><\/p>"],["code",0,"<pre><code>$ raku allomorphs.raku\nEnter something: 3.14\nType check failed in assignment to $i; expected Int but got RatStr (RatStr.new(3.14, \"3....)\n  in block &lt;unit&gt; at allomorphs.raku line 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Secunda assignatio, <code>$s = $input<\/code>, numquam frangetur, quia chorda quodlibet inputum accipere potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis huius programmatis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/essentials/typed-variables/allomorphs/allomorphs.raku\" target=\"_blank\" rel=\"noopener\">allomorphs.raku<\/a>.<\/span><\/p>"]]}}}</script>
