<script type="application/json" id="page-data">{"u":"essentials/typed-variables","n":194,"k":"section","pv":"essentials/coercion/quiz","nx":"essentials/typed-variables/type-constraints","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Typed variables","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, a scalar variable (or a scalar container) keeps a single object.<\/span> <span class=\"sg\" data-s=\"1\">This object can be of different types.<\/span> <span class=\"sg\" data-s=\"2\">For example, the same variable can first contain a number and then a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is another example, which mixes different data types in one expression:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This is probably not the best coding practice.<\/span> <span class=\"sg\" data-s=\"1\">But it is a perfectly correct Raku program.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">However, Raku lets you choose what a variable may keep.<\/span> <span class=\"sg\" data-s=\"1\">You will find more details in the topics below.<\/span><\/p>"]]},"de":{"t":"Typisierte Variablen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku enthält eine skalare Variable (oder ein skalarer Container) ein einzelnes Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Objekt kann von verschiedenen Typen sein.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann dieselbe Variable zuerst eine Zahl und dann einen String enthalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hallo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein weiteres Beispiel, das verschiedene Datentypen in einem Ausdruck mischt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das ist wahrscheinlich nicht die beste Programmierpraxis.<\/span> <span class=\"sg\" data-s=\"1\">Aber es ist ein völlig korrektes Raku-Programm.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku lässt Sie jedoch festlegen, was eine Variable enthalten darf.<\/span> <span class=\"sg\" data-s=\"1\">Mehr Details finden Sie in den Themen unten.<\/span><\/p>"]]},"nl":{"t":"Getypte variabelen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku bevat een scalaire variabele (of een scalaire container) één object.<\/span> <span class=\"sg\" data-s=\"1\">Dit object kan van verschillende typen zijn.<\/span> <span class=\"sg\" data-s=\"2\">Dezelfde variabele kan bijvoorbeeld eerst een getal bevatten en daarna een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hallo';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is nog een voorbeeld, dat verschillende datatypen in één expressie mengt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit is waarschijnlijk niet de beste manier van programmeren.<\/span> <span class=\"sg\" data-s=\"1\">Maar het is een volkomen correct Raku-programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Toch laat Raku je kiezen wat een variabele mag bevatten.<\/span> <span class=\"sg\" data-s=\"1\">Meer details vind je in de onderwerpen hieronder.<\/span><\/p>"]]},"es":{"t":"Variables tipadas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, una variable escalar (o un contenedor escalar) guarda un solo objeto.<\/span> <span class=\"sg\" data-s=\"1\">Este objeto puede ser de diferentes tipos.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, la misma variable puede contener primero un número y luego una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hola';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay otro ejemplo, que mezcla diferentes tipos de datos en una expresión:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto probablemente no es la mejor práctica de programación.<\/span> <span class=\"sg\" data-s=\"1\">Pero es un programa Raku perfectamente correcto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin embargo, Raku te permite elegir qué puede guardar una variable.<\/span> <span class=\"sg\" data-s=\"1\">Encontrarás más detalles en los temas de abajo.<\/span><\/p>"]]},"it":{"t":"Variabili tipizzate","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, una variabile scalare (o un contenitore scalare) contiene un singolo oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Questo oggetto può essere di tipi diversi.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, la stessa variabile può contenere prima un numero e poi una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un altro esempio, che mescola tipi di dati diversi in un'espressione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo probabilmente non è il modo migliore di scrivere codice.<\/span> <span class=\"sg\" data-s=\"1\">Ma è un programma Raku perfettamente corretto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Però Raku ti permette di scegliere cosa può contenere una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Troverai più dettagli negli argomenti qui sotto.<\/span><\/p>"]]},"lv":{"t":"Tipizētie mainīgie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā skalārs mainīgais (jeb skalāra konteiners) glabā vienu objektu.<\/span> <span class=\"sg\" data-s=\"1\">Šis objekts var būt dažādu tipu.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, tas pats mainīgais vispirms var saturēt skaitli un pēc tam virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl viens piemērs, kas vienā izteiksmē sajauc dažādus datu tipus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā, iespējams, nav labākā programmēšanas prakse.<\/span> <span class=\"sg\" data-s=\"1\">Bet tā ir pilnīgi pareiza Raku programma.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tomēr Raku ļauj jums izvēlēties, ko mainīgais drīkst glabāt.<\/span> <span class=\"sg\" data-s=\"1\">Vairāk detaļu jūs atradīsiet zemāk esošajās tēmās.<\/span><\/p>"]]},"ru":{"t":"Типизированные переменные","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku скалярная переменная (или скалярный контейнер) хранит один объект.<\/span> <span class=\"sg\" data-s=\"1\">Этот объект может быть разных типов.<\/span> <span class=\"sg\" data-s=\"2\">Например, одна и та же переменная может сначала содержать число, а затем строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот ещё один пример, в котором разные типы данных смешаны в одном выражении:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наверное, это не лучший способ писать код.<\/span> <span class=\"sg\" data-s=\"1\">Но это совершенно правильная программа на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Однако Raku позволяет вам выбрать, что может хранить переменная.<\/span> <span class=\"sg\" data-s=\"1\">Больше подробностей вы найдёте в темах ниже.<\/span><\/p>"]]},"uk":{"t":"Типізовані змінні","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku скалярна змінна (або скалярний контейнер) зберігає один об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Цей об'єкт може бути різних типів.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, та сама змінна може спочатку містити число, а потім рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось ще один приклад, який змішує різні типи даних в одному виразі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мабуть, це не найкраща практика написання коду.<\/span> <span class=\"sg\" data-s=\"1\">Але це цілком правильна програма на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Однак Raku дозволяє вам вибрати, що може зберігати змінна.<\/span> <span class=\"sg\" data-s=\"1\">Більше подробиць ви знайдете в темах нижче.<\/span><\/p>"]]},"bg":{"t":"Типизирани променливи","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku скаларната променлива (или скаларният контейнер) съдържа един обект.<\/span> <span class=\"sg\" data-s=\"1\">Този обект може да е от различни типове.<\/span> <span class=\"sg\" data-s=\"2\">Например, една и съща променлива може първо да съдържа число, а след това низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето още един пример, който смесва различни типове данни в един израз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това вероятно не е най-добрата практика за писане на код.<\/span> <span class=\"sg\" data-s=\"1\">Но това е съвсем правилна програма на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Въпреки това, Raku ви позволява да изберете какво може да съдържа една променлива.<\/span> <span class=\"sg\" data-s=\"1\">Повече подробности ще намерите в темите по-долу.<\/span><\/p>"]]},"eo":{"t":"Tipitaj variabloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, skalara variablo (aŭ skalara ujo) tenas unu solan objekton.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu objekto povas esti de malsamaj tipoj.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la sama variablo povas unue enhavi nombron kaj poste ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Hello';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen alia ekzemplo, kiu miksas malsamajn datumtipojn en unu esprimo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio verŝajne ne estas la plej bona kodpraktiko.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi estas perfekte ĝusta Raku-programo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tamen, Raku lasas vin elekti, kion variablo rajtas teni.<\/span> <span class=\"sg\" data-s=\"1\">Vi trovos pli da detaloj en la temoj sube.<\/span><\/p>"]]},"la":{"t":"Typis variabiles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, variabilis scalaris (vel continens scalare) unum obiectum continet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc obiectum diversorum generum esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, eadem variabilis primo numerum, deinde stringam continere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n$var = 'Salve';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est aliud exemplum, quod diversa genera datorum in una expressione miscet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = '100';\nmy $b = 200;\nsay $a + $b; # 300<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec fortasse non optima praxis codicis est.<\/span> <span class=\"sg\" data-s=\"1\">Sed est programma Raku omnino rectum.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tamen Raku te sinit eligere quid variabilis continere possit.<\/span> <span class=\"sg\" data-s=\"1\">Plura in argumentis infra invenies.<\/span><\/p>"]]}}}</script>
