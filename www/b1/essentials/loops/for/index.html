\" data-s=\"0\">Jen interesa trajto de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Buklo povas preni pli ol unu elementon samtempe.<\/span> <span class=\"sg\" data-s=\"2\">La sekva programo presas du nombrojn ĉiufoje, kiam la buklo ruliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..6 -&gt; $n, $m {\n    say \"$n and $m\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la eligo de la programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1 and 2\n3 and 4\n5 and 6<\/code><\/pre>"]]},"la":{"t":"<code>for<\/code> ansae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ansa <code>for<\/code> instrumentum potens est.<\/span> <span class=\"sg\" data-s=\"1\">Multa elementa percurrit, unum post alterum.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, intervallum sumamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..5 -&gt; $n {\n    say $n;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quotiens ansa currit, variabilis <code>$n<\/code> proximum valorem ex intervallo accipit.<\/span> <span class=\"sg\" data-s=\"1\">Nota: non necesse est variabilem cum <code>my<\/code> declarare.<\/span> <span class=\"sg\" data-s=\"2\">Clausula codicis semel pro quoque elemento fontis datorum currit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque programma numeros imprimit, unum in quaque linea:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \n1\n2\n3\n4\n5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma omnes valores percurrit quos <a href=\"https://course.raku.org/la/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervallum<\/a> <code>1..5<\/code> dat.<\/span> <span class=\"sg\" data-s=\"1\">Hi sunt <code>1<\/code>, <code>2<\/code>, <code>3<\/code>, <code>4<\/code>, et <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus quam unum valorem sumere<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec est proprietas iucunda Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ansa plus quam unum elementum simul sumere potest.<\/span> <span class=\"sg\" data-s=\"2\">Programma sequens duos numeros imprimit quotiens ansa currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..6 -&gt; $n, $m {\n    say \"$n and $m\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exitus programmatis:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1 and 2\n3 and 4\n5 and 6<\/code><\/pre>"]]}}}</script>
