а разів і спробуйте різні значення <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма використовує оператор <code>*=<\/code>, коротку форму для множення з присвоєнням: <code>$x *= $y<\/code> — те саме, що <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також можете використати «повний» цикл замість постфіксної форми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше на цю тему<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми ще кілька разів повернемося до цього завдання.<\/span> <span class=\"sg\" data-s=\"1\">У цій частині курсу ми також розв'яжемо його рекурсивно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У другій частині курсу ми дізнаємося про так звані оператори редукції, які роблять розв'язання дуже простим.<\/span> <span class=\"sg\" data-s=\"1\">Ми також побачимо, як визначити власний оператор <code>!<\/code>, щоб можна було написати <code>$n!<\/code> для обчислення факторіалу.<\/span> <span class=\"sg\" data-s=\"2\">Нарешті, ми побачимо ще одне цікаве розв'язання, коли говоритимемо про клаузу <code>where<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Факториелът на <code>N<\/code> е произведението на всички цели числа от 1 до <code>N<\/code> включително.<\/span> <span class=\"sg\" data-s=\"1\">Например, факториелът на 4 е 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата няколко пъти и опитайте различни стойности на <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма използва оператора <code>*=<\/code>, кратка форма за умножение с присвояване: <code>$x *= $y<\/code> е същото като <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да използвате ‘пълен’ цикъл вместо постфиксната форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Още по темата<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще се върнем към тази задача няколко пъти.<\/span> <span class=\"sg\" data-s=\"1\">В тази част на курса ще я решим и рекурсивно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Във втората част на курса ще научим за така наречените оператори за редукция, които правят решението много просто.<\/span> <span class=\"sg\" data-s=\"1\">Ще видим също как да дефинирате свой собствен оператор <code>!<\/code>, така че да можете да пишете <code>$n!<\/code> за изчисляване на факториел.<\/span> <span class=\"sg\" data-s=\"2\">Накрая ще видим още едно интересно решение, когато говорим за клаузата <code>where<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Faktorialo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La faktorialo de <code>N<\/code> estas la produkto de ĉiuj entjeroj de 1 ĝis kaj inkluzive <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la faktorialo de 4 estas 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kelkajn fojojn kaj provu malsamajn valorojn de <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo uzas la operatoron <code>*=<\/code>, mallongan formon por multipliko kun asigno: <code>$x *= $y<\/code> estas la sama kiel <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas uzi ‘plenan’ buklon anstataŭ la postfiksa formo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli pri ĉi tiu temo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni revenos al ĉi tiu tasko plurajn fojojn.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu parto de la kurso, ni ankaŭ solvos ĝin rekursive.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En la dua parto de la kurso, ni lernos pri la tiel nomataj reduktaj operatoroj, kiuj faras la solvon tre simpla.<\/span> <span class=\"sg\" data-s=\"1\">Ni ankaŭ vidos, kiel difini vian propran operatoron <code>!<\/code>, por ke vi povu skribi <code>$n!<\/code> por kalkuli faktorialon.<\/span> <span class=\"sg\" data-s=\"2\">Fine, ni vidos alian interesan solvon, kiam ni parolos pri la <code>where<\/code> klaŭzo.<\/span><\/p>"]]},"la":{"t":"Solutio: Factorial","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Factorialis <code>N<\/code> est productum omnium numerorum integrorum ab 1 usque ad <code>N<\/code> inclusum.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, factorialis 4 est 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programmatum aliquoties et tenta valores diversos <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma utitur operatore <code>*=<\/code>, forma brevi multiplicationis cum assignatione: <code>$x *= $y<\/code> idem est ac <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes etiam ‘plenum’ circulum adhibere pro forma postfixa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus de hoc argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad hoc problema aliquoties redibimus.<\/span> <span class=\"sg\" data-s=\"1\">In hac parte cursus, id etiam recursive solvemus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In secunda parte cursus, de sic dictis operatoribus reductionis discemus, qui solutionem simplicissimam faciunt.<\/span> <span class=\"sg\" data-s=\"1\">Videbimus etiam quomodo operatorem tuum <code>!<\/code> definias, ut <code>$n!<\/code> scribere possis ad factorialem computandum.<\/span> <span class=\"sg\" data-s=\"2\">Denique aliam solutionem iucundam videbimus, cum de clausula <code>where<\/code> loquemur.<\/span><\/p>"]]}}}</script>
