0\">Коментарі<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма використовує оператор <code>*=<\/code>, який множить і присвоює за один крок: <code>$x *= $y<\/code> означає те саме, що <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Замість постфіксної форми ви також можете використати «повний» цикл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше на цю тему<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми ще кілька разів повернемося до цього завдання.<\/span> <span class=\"sg\" data-s=\"1\">Пізніше в цій частині курсу ми також розв'яжемо його за допомогою рекурсії.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У другій частині курсу ми дізнаємося про оператори редукції.<\/span> <span class=\"sg\" data-s=\"1\">Вони роблять розв'язання дуже простим.<\/span> <span class=\"sg\" data-s=\"2\">Ми також створимо власний оператор <code>!<\/code>, щоб <code>$n!<\/code> давав факторіал.<\/span> <span class=\"sg\" data-s=\"3\">Нарешті, ще одне цікаве розв'язання буде тоді, коли ми говоритимемо про клаузу <code>where<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Факториелът на <code>N<\/code> е произведението на всички цели числа от 1 до <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Например, факториелът на 4 е 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата няколко пъти с различни стойности на <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма използва оператора <code>*=<\/code>, който умножава и присвоява в една стъпка: <code>$x *= $y<\/code> означава същото като <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместо постфиксната форма, можете да използвате и ‘пълен’ цикъл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Още по темата<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще се върнем към тази задача няколко пъти.<\/span> <span class=\"sg\" data-s=\"1\">По-късно в тази част на курса ще я решим и с рекурсия.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Във втората част на курса ще научим за операторите за редукция.<\/span> <span class=\"sg\" data-s=\"1\">Те правят решението много просто.<\/span> <span class=\"sg\" data-s=\"2\">Ще създадем и свой собствен оператор <code>!<\/code>, така че <code>$n!<\/code> да дава факториел.<\/span> <span class=\"sg\" data-s=\"3\">Накрая има още едно интересно решение, когато говорим за клаузата <code>where<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Faktorialo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La faktorialo de <code>N<\/code> estas la produkto de ĉiuj tutaj nombroj de 1 ĝis <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la faktorialo de 4 estas 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kelkajn fojojn kun malsamaj valoroj de <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo uzas la operatoron <code>*=<\/code>, kiu multiplikas kaj asignas per unu paŝo: <code>$x *= $y<\/code> signifas la samon kiel <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anstataŭ la postfiksa formo, vi ankaŭ povas uzi ‘plenan’ buklon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli pri ĉi tiu temo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni revenos al ĉi tiu tasko plurajn fojojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste en ĉi tiu parto de la kurso, ni ankaŭ solvos ĝin per rekursio.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En la dua parto de la kurso, ni lernos pri reduktaj operatoroj.<\/span> <span class=\"sg\" data-s=\"1\">Ili faras la solvon tre simpla.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ kreos nian propran operatoron <code>!<\/code>, por ke <code>$n!<\/code> donu faktorialon.<\/span> <span class=\"sg\" data-s=\"3\">Fine, estas alia interesa solvo, kiam ni parolas pri la <code>where<\/code> klaŭzo.<\/span><\/p>"]]},"la":{"t":"Solutio: Factorial","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Factorialis <code>N<\/code> est productum omnium numerorum integrorum ab 1 ad <code>N<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, factorialis 4 est 1 <em> 2 <\/em> 3 * 4 = 24.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\n$f *= $_ for 2..$n;\n\nsay $f;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/loops/factorial.raku\" target=\"_blank\" rel=\"noopener\">factorial.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programma aliquoties cum valoribus diversis <code>$n<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/loops/factorial.raku\n40320<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma operatore <code>*=<\/code> utitur, qui uno gradu multiplicat et assignat: <code>$x *= $y<\/code> idem significat ac <code>$x = $x * $y<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro forma postfixa, potes etiam ‘plenum’ circulum adhibere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 8;\n\nmy $f = 1;\nfor 2..$n -&gt; $x {\n    $f *= $x;\n}\n\nsay $f;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plus de hoc argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad hoc problema aliquoties redibimus.<\/span> <span class=\"sg\" data-s=\"1\">Postea in hac parte cursus, id etiam recursione solvemus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In secunda parte cursus, de operatoribus reductionis discemus.<\/span> <span class=\"sg\" data-s=\"1\">Hi solutionem simplicissimam faciunt.<\/span> <span class=\"sg\" data-s=\"2\">Etiam operatorem nostrum <code>!<\/code> creabimus, ut <code>$n!<\/code> factorialem det.<\/span> <span class=\"sg\" data-s=\"3\">Denique alia solutio iucunda erit, cum de clausula <code>where<\/code> loquemur.<\/span><\/p>"]]}}}</script>
