ile<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi rulas la blokon de kodo, ĝis la kondiĉo fariĝas <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per aliaj vortoj, ĝi ruliĝas, dum la kondiĉo estas <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la <a href=\"/essentials/loops/while/\">programo de la antaŭa paĝo<\/a>, sed nun kun <code>until<\/code> kaj nova kondiĉo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nuntil $x &gt; 10 {\n    $x = prompt 'Enigu numeron, kiu ne estas pli granda ol 10: ';\n    say \"Vi enigis $x.\";\n}\nsay \"$x estas pli granda ol 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj rigardu la eligon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nEnigu numeron, kiu ne estas pli granda ol 10: 10\nVi enigis 10.\nEnigu numeron, kiu ne estas pli granda ol 10: 4\nVi enigis 4.\nEnigu numeron, kiu ne estas pli granda ol 10: 1\nVi enigis 1.\nEnigu numeron, kiu ne estas pli granda ol 10: 20\nVi enigis 20.\n20 estas pli granda ol 10.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>until<\/code> vs. <code>while<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Komparu du programojn, kiuj faras la samon, unu per <code>while<\/code> kaj la alia per <code>until<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>while $x &lt;= 10 { . . . }\n\nuntil $x &gt; 10 { . . . }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel vi vidas, ĉiu kondiĉo estas la malo de la alia.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>while<\/code> kaj <code>until<\/code> estas paro same kiel <code>if<\/code> kaj <code>unless<\/code>.<\/span><\/p>"]]},"la":{"t":"Utendo <code>until<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ansa <code>until<\/code> contrarium facit atque <code>while<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Clausulam codicis exsequitur donec condicio fit <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aliis verbis, currit dum condicio est <code>False<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc est <a href=\"/essentials/loops/while/\">programma ex pagina priore<\/a>, sed nunc cum <code>until<\/code> et nova condicione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nuntil $x &gt; 10 {\n    $x = prompt 'Intra numerum, qui non est maior quam 10: ';\n    say \"Intrasti $x.\";\n}\nsay \"$x est maior quam 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programma et exitum specta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nIntra numerum, qui non est maior quam 10: 10\nIntrasti 10.\nIntra numerum, qui non est maior quam 10: 4\nIntrasti 4.\nIntra numerum, qui non est maior quam 10: 1\nIntrasti 1.\nIntra numerum, qui non est maior quam 10: 20\nIntrasti 20.\n20 est maior quam 10.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>until<\/code> vs. <code>while<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compara duo programmata quae idem faciunt, unum cum <code>while<\/code>, alterum cum <code>until<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>while $x &lt;= 10 { . . . }\n\nuntil $x &gt; 10 { . . . }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut vides, utraque condicio contraria est alteri.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>while<\/code> et <code>until<\/code> par sunt eodem modo atque <code>if<\/code> et <code>unless<\/code>.<\/span><\/p>"]]}}}</script>
