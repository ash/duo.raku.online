<script type="application/json" id="page-data">{"u":"essentials/loops/repeat","n":155,"k":"topic","pv":"essentials/loops/until/quiz","nx":"essentials/loops/repeat/quiz","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using repeat","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <code>while<\/code> or <code>until<\/code> block may never run if the condition is <code>False<\/code> from the start.<\/span> <span class=\"sg\" data-s=\"1\">A <code>repeat<\/code> block, on the other hand, always runs at least once.<\/span> <span class=\"sg\" data-s=\"2\">Its condition is checked after the block.<\/span> <span class=\"sg\" data-s=\"3\">For the check, you use the same words, <code>while<\/code> or <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Take a look at this program.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$x<\/code> starts at <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>while<\/code> condition checks whether <code>$x<\/code> is less than or equal to <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">With this value, the condition is already <code>False<\/code>, but the block still runs once first.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now let us change the program to use <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run it to check that it works the way you expect:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"de":{"t":"Verwendung von <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <code>while<\/code>- oder <code>until<\/code>-Block läuft vielleicht nie, wenn die Bedingung von Anfang an <code>False<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>repeat<\/code>-Block dagegen läuft immer mindestens einmal.<\/span> <span class=\"sg\" data-s=\"2\">Seine Bedingung wird nach dem Block geprüft.<\/span> <span class=\"sg\" data-s=\"3\">Für die Prüfung verwenden Sie die gleichen Wörter, <code>while<\/code> oder <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Schauen Sie sich dieses Programm an.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$x<\/code> beginnt bei <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>while<\/code>-Bedingung prüft, ob <code>$x<\/code> kleiner oder gleich <code>10<\/code> ist.<\/span> <span class=\"sg\" data-s=\"2\">Mit diesem Wert ist die Bedingung schon <code>False<\/code>, aber der Block läuft trotzdem zuerst einmal.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt ändern wir das Programm so, dass es <code>until<\/code> verwendet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until  programa para usar <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ejecútalo para comprobar que funciona como esperas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"it":{"t":"Uso di <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>while<\/code> o <code>until<\/code> può non essere mai eseguito se la condizione è <code>False<\/code> fin dall'inizio.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco <code>repeat<\/code>, invece, viene sempre eseguito almeno una volta.<\/span> <span class=\"sg\" data-s=\"2\">La sua condizione viene controllata dopo il blocco.<\/span> <span class=\"sg\" data-s=\"3\">Per il controllo usi le stesse parole, <code>while<\/code> o <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dai un'occhiata a questo programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$x<\/code> parte da <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La condizione <code>while<\/code> controlla se <code>$x<\/code> è minore o uguale a <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con questo valore la condizione è già <code>False<\/code>, ma il blocco viene comunque eseguito prima, una volta.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1 : 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер змінімо програму, щоб вона використовувала <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть її, щоб перевірити, що вона працює так, як ви очікуєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"bg":{"t":"Използване на <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>while<\/code> или <code>until<\/code> може никога да не се изпълни, ако условието е <code>False<\/code> още в началото.<\/span> <span class=\"sg\" data-s=\"1\">Блокът <code>repeat<\/code>, от друга страна, винаги се изпълнява поне веднъж.<\/span> <span class=\"sg\" data-s=\"2\">Неговото условие се проверява след блока.<\/span> <span class=\"sg\" data-s=\"3\">За проверката използвате същите думи, <code>while<\/code> или <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Погледнете тази програма.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$x<\/code> започва от <code>100<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Условието <code>while<\/code> проверява дали <code>$x<\/code> е по-малко или равно на <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С тази стойност условието вече е <code>False<\/code>, но блокът все пак първо се изпълнява веднъж.<\/span><\/p>"],["code",0,"<pre class=\
