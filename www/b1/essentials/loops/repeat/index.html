<script type="application/json" id="page-data">{"u":"essentials/loops/repeat","n":155,"k":"topic","pv":"essentials/loops/until/quiz","nx":"essentials/loops/repeat/quiz","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using repeat","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>while<\/code> and <code>until<\/code> blocks may never run if the condition is <code>False<\/code> at the start.<\/span> <span class=\"sg\" data-s=\"1\">The <code>repeat<\/code> block, on the other hand, always runs at least once.<\/span> <span class=\"sg\" data-s=\"2\">The condition is checked after the code block.<\/span> <span class=\"sg\" data-s=\"3\">For the check, you use the same words <code>while<\/code> or <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Look at this program.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$x<\/code> starts with the value <code>100<\/code>, and the <code>while<\/code> condition checks whether <code>$x<\/code> is less than or equal to <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">With this value, the condition is already <code>False<\/code>, but the code block still runs once first.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let us change the program to use <code>until<\/code> instead.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Run it to check that it works as expected:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"de":{"t":"Verwendung von <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Die <code>while<\/code>- und <code>until<\/code>-Blöcke laufen möglicherweise nie, wenn die Bedingung am Anfang <code>False<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Der <code>repeat<\/code>-Block dagegen läuft immer mindestens einmal.<\/span> <span class=\"sg\" data-s=\"2\">Die Bedingung wird nach dem Codeblock geprüft.<\/span> <span class=\"sg\" data-s=\"3\">Für die Prüfung verwenden Sie die gleichen Wörter <code>while<\/code> oder <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sehen Sie sich dieses Programm an.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$x<\/code> beginnt mit dem Wert <code>100<\/code>, und die <code>while<\/code>-Bedingung prüft, ob <code>$x<\/code> kleiner oder gleich <code>10<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Mit diesem Wert ist die Bedingung bereits <code>False<\/code>, aber der Codeblock läuft trotzdem zuerst einmal.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ändern wir das Programm so, dass es stattdessen <code>until<\/code> verwendet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Führen Sie es aus, um zu prüfen, ob es wie erwartet funktioniert:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"nl":{"t":"Gebruik van <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De <code>while<\/code>- en <code>until<\/code>-blokken draaien misschien nooit als de conditie aan het begin <code>False<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Het <code>repeat<\/code>-blok draait daarentegen altijd minstens één keer.<\/span> <span class=\"sg\" data-s=\"2\">De conditie wordt na het codeblok gecontroleerd.<\/span> <span class=\"sg\" data-s=\"3\">Voor de controle gebruik je dezelfde woorden <code>while<\/code> of <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bekijk dit programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Voer een getal in: ';\n    say \"Je hebt $x ingevoerd.\";\n} while $x &lt;= 10;\nsay \"$x is groter dan 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$x<\/code> begint met de waarde <code>100<\/code>, en de <code>while<\/code>-conditie controleert of <code>$x<\/code> kleiner dan of gelijk aan <code>10<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Met deze waarde is de conditie al <code>False<\/code>, maar het codeblok draait toch eerst één keer.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer een getal in: 10\nJe hebt 10 ingevoerd.\nVoer een getal in: 20\nJe hebt 20 ingevoerd.\n20 is groter dan 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we het programma aanpassen zodat het <code>until<\/code> gebruikt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Voer een getal in: ';\n    say \"Je hebt $x ingevoerd.\";\n} until $x &gt; 10;\nsay \"$x is groter dan 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voer het uit om te controleren of het werkt zoals verwacht:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer een getal in: 5\nJe hebt 5 ingevoerd.\nVoer een getal in: 15\nJe hebt 15 ingevoerd.\n15 is groter dan 10.<\/code><\/pre>"]]},"es":{"t":"Uso de <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Los bloques <code>while<\/code> y <code>until<\/code> pueden no ejecutarse nunca si la condición es <code>False<\/code> al principio.<\/span> <span class=\"sg\" data-s=\"1\">El bloque <code>repeat<\/code>, en cambio, siempre se ejecuta al menos una vez.<\/span> <span class=\"sg\" data-s=\"2\">La condición se comprueba después del bloque de código.<\/span> <span class=\"sg\" data-s=\"3\">Para la comprobación, usas las mismas palabras <code>while<\/code> o <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mira este programa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$x<\/code> empieza con el valor <code>100<\/code>, y la condición <code>while<\/code> comprueba si <code>$x<\/code> es menor o igual a <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con este valor, la condición ya es <code>False<\/code>, pero el bloque de código igualmente se ejecuta una vez primero.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vamos a cambiar el programa para usar <code>until<\/code> en su lugar.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ejecútalo para comprobar que funciona como se espera:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"it":{"t":"Uso di <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">I blocchi <code>while<\/code> e <code>until<\/code> potrebbero non essere mai eseguiti se la condizione è <code>False<\/code> all'inizio.<\/span> <span class=\"sg\" data-s=\"1\">Il blocco <code>repeat<\/code>, invece, viene sempre eseguito almeno una volta.<\/span> <span class=\"sg\" data-s=\"2\">La condizione viene controllata dopo il blocco di codice.<\/span> <span class=\"sg\" data-s=\"3\">Per il controllo, usi le stesse parole <code>while<\/code> o <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Guarda questo programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$x<\/code> parte con il valore <code>100<\/code>, e la condizione <code>while<\/code> controlla se <code>$x<\/code> è minore o uguale a <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con questo valore la condizione è già <code>False<\/code>, ma il blocco di codice viene comunque eseguito prima, una volta.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Modifichiamo il programma per usare invece <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eseguilo per verificare che funzioni come previsto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"lv":{"t":"Izmantojot <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> un <code>until<\/code> bloki var neizpildīties nekad, ja nosacījums sākumā ir <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Savukārt <code>repeat<\/code> bloks vienmēr izpildās vismaz vienu reizi.<\/span> <span class=\"sg\" data-s=\"2\">Nosacījums tiek pārbaudīts pēc koda bloka.<\/span> <span class=\"sg\" data-s=\"3\">Pārbaudei jūs izmantojat tos pašus vārdus <code>while<\/code> vai <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatiet šo programmu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Ievadiet skaitli: ';\n    say \"Jūs ievadījāt $x.\";\n} while $x &lt;= 10;\nsay \"$x ir lielāks par 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam <code>$x<\/code> sākumā ir vērtība <code>100<\/code>, un <code>while<\/code> nosacījums pārbauda, vai <code>$x<\/code> ir mazāks par <code>10<\/code> vai vienāds ar to.<\/span> <span class=\"sg\" data-s=\"1\">Ar šo vērtību nosacījums jau ir <code>False<\/code>, bet koda bloks tomēr vispirms izpildās vienu reizi.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIevadiet skaitli: 10\nJūs ievadījāt 10.\nIevadiet skaitli: 20\nJūs ievadījāt 20.\n20 ir lielāks par 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīsim programmu, lai tā vietā izmantotu <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Ievadiet skaitli: ';\n    say \"Jūs ievadījāt $x.\";\n} until $x &gt; 10;\nsay \"$x ir lielāks par 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet to, lai pārbaudītu, vai tā darbojas, kā paredzēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIevadiet skaitli: 5\nJūs ievadījāt 5.\nIevadiet skaitli: 15\nJūs ievadījāt 15.\n15 ir lielāks par 10.<\/code><\/pre>"]]},"ru":{"t":"Использование <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блоки <code>while<\/code> и <code>until<\/code> могут ни разу не выполниться, если условие с самого начала равно <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>repeat<\/code>, наоборот, всегда выполняется хотя бы один раз.<\/span> <span class=\"sg\" data-s=\"2\">Условие проверяется после блока кода.<\/span> <span class=\"sg\" data-s=\"3\">Для проверки вы используете те же слова <code>while<\/code> или <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Посмотрите на эту программу.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Введите число: ';\n    say \"Вы ввели $x.\";\n} while $x &lt;= 10;\nsay \"$x больше 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В начале переменная <code>$x<\/code> равна <code>100<\/code>, а условие <code>while<\/code> проверяет, меньше или равно ли <code>$x<\/code> числу <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">При таком значении условие уже равно <code>False<\/code>, но блок кода всё равно сначала выполняется один раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число: 10\nВы ввели 10.\nВведите число: 20\nВы ввели 20.\n20 больше 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте изменим программу, чтобы вместо этого использовать <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Введите число: ';\n    say \"Вы ввели $x.\";\n} until $x &gt; 10;\nsay \"$x больше 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите её, чтобы проверить, что она работает как ожидалось:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число: 5\nВы ввели 5.\nВведите число: 15\nВы ввели 15.\n15 больше 10.<\/code><\/pre>"]]},"uk":{"t":"Використання <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блоки <code>while<\/code> та <code>until<\/code> можуть ніколи не виконатися, якщо умова на початку є <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>repeat<\/code>, навпаки, завжди виконується хоча б один раз.<\/span> <span class=\"sg\" data-s=\"2\">Умова перевіряється після блоку коду.<\/span> <span class=\"sg\" data-s=\"3\">Для перевірки ви використовуєте ті самі слова <code>while<\/code> або <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подивіться на цю програму.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$x<\/code> починає зі значення <code>100<\/code>, а умова <code>while<\/code> перевіряє, чи <code>$x<\/code> менше або дорівнює <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">З таким значенням умова вже є <code>False<\/code>, але блок коду все одно спершу виконується один раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте змінимо програму, щоб натомість використати <code>until<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть її, щоб перевірити, що вона працює як очікується:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"bg":{"t":"Използване на <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блоковете <code>while<\/code> и <code>until<\/code> може никога да не се изпълнят, ако условието е <code>False<\/code> в началото.<\/span> <span class=\"sg\" data-s=\"1\">Блокът <code>repeat<\/code>, от друга страна, винаги се изпълнява поне веднъж.<\/span> <span class=\"sg\" data-s=\"2\">Условието се проверява след блока с код.<\/span> <span class=\"sg\" data-s=\"3\">За проверката използвате същите думи <code>while<\/code> или <code>until<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте тази програма.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} while $x &lt;= 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$x<\/code> започва със стойност <code>100<\/code>, а условието <code>while<\/code> проверява дали <code>$x<\/code> е по-малко или равно на <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С тази стойност условието вече е <code>False<\/code>, но блокът с код все пак първо се изпълнява веднъж.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 10\nYou entered 10.\nEnter a number: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека променим програмата, за да използва <code>until<\/code> вместо т until<\/code> anstataŭe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nrepeat {\n    $x = prompt 'Enter a number: ';\n    say \"You entered $x.\";\n} until $x &gt; 10;\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu ĝin por kontroli, ke ĝi funkcias kiel atendite:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number: 5\nYou entered 5.\nEnter a number: 15\nYou entered 15.\n15 is bigger than 10.<\/code><\/pre>"]]},"la":{"t":"Utendo <code>repeat<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Clausulae <code>while<\/code> et <code>until<\/code> fortasse numquam currunt si condicio initio <code>False<\/code> est.<\/span> <span class=\"sg\" data-s=\"1\">Clausula <code>repeat<\/code> contra semper saltem semel currit.<\/span> <span class=\"sg\" data-s=\"2\">Condicio post clausulam codicis inspicitur.<\/span> <span class=\"sg\" data-s=\"3\">Ad probationem eadem verba <code>while<\/code> vel <code>until<\/code> adhibes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Specta hoc programma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 100;\nrepeat {\n    $x = prompt 'Intra numerum: ';\n    say \"Intrasti $x.\";\n} while $x &lt;= 10;\nsay \"$x maior est quam 10.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$x<\/code> a valore <code>100<\/code> incipit, et condicio <code>while<\/code> inspicit utrum <code>$x<\/code> minor quam <code>10<\/code> an ei aequalis sit.<\/span> <span class=\"sg\" data-s=\"1\">Cum hoc valore, condicio iam <code>False<\/code> est, sed clausula codicis tamen primum semel currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum: 10\nIntrasti 10.\nIntra numerum: 20\nIntrasti 20.\n20 maior est quam 10.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mutemus programma ut potius <code>until<\/code> adhibeat.<\/span><\/p>"],["code
