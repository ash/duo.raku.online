 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>-=<\/code> es un operador que hace la resta y la asignación a la vez.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, <code>$x -= 3<\/code> es lo mismo que <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El modificador <code>while<\/code> repite la declaración <code>$x -= 3<\/code> mientras la condición <code>$x &gt; 2<\/code> siga siendo <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tan pronto como la condición se vuelve <code>False<\/code>, el bucle se detiene.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que si la condición es <code>False<\/code> desde el principio, la declaración no se ejecuta en absoluto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El mismo programa se puede escribir con <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para ello, debes invertir la condición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"it":{"t":"<code>while<\/code> e <code>until<\/code> come modificatori di istruzioni","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Sia <code>while<\/code> che <code>until<\/code> possono essere usati come modificatori di istruzione, <a href=\"https://course.raku.org/it/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">allo stesso modo<\/a> di <code>if<\/code> e <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Guarda un esempio che imita la divisione modulo, cioè il calcolo del resto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>-=<\/code> è un operatore che fa insieme la sottrazione e l'assegnazione.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, <code>$x -= 3<\/code> è uguale a <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il modificatore <code>while<\/code> ripete l'istruzione <code>$x -= 3<\/code> finché la condizione <code>$x &gt; 2<\/code> rimane <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Non appena la condizione diventa <code>False<\/code>, il ciclo si interrompe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che se la condizione è <code>False<\/code> fin dall'inizio, l'istruzione non viene eseguita affatto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso programma può essere scritto con <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, devi invertire la condizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"lv":{"t":"<code>while<\/code> un <code>until<\/code> kā izteiksmes modifikatori","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Gan <code>while<\/code>, gan <code>until<\/code> var izmantot kā teikuma modifikatorus, <a href=\"https://course.raku.org/lv/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">tāpat<\/a> kā <code>if<\/code> un <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatiet piemēru, kas imitē dalīšanu pēc moduļa, tas ir, atlikuma atrašanu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-=<\/code> ir operators, kas veic atņemšanu un piešķiršanu kopā.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā <code>$x -= 3<\/code> ir tas pats, kas <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> modifikators atkārto teikumu <code>$x -= 3<\/code>, kamēr nosacījums <code>$x &gt; 2<\/code> paliek <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz nosacījums kļūst <code>False<\/code>, cilpa apstājas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pamaniet, ka, ja nosacījums jau no sākuma ir <code>False<\/code>, teikums neizpildās nemaz.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To pašu programmu var uzrakstīt ar <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, jums ir jāapgriež nosacījums:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"ru":{"t":"<code>while<\/code> и <code>until<\/code> как модификаторы инструкций","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">И <code>while<\/code>, и <code>until<\/code> можно использовать как модификаторы выражений, <a href=\"https://course.raku.org/ru/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">точно так же<\/a>, как <code>if<\/code> и <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Рассмотрим пример, который имитирует деление по модулю, то есть поиск остатка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-=<\/code> — это оператор, который выполняет вычитание и присваивание вместе.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае <code>$x -= 3<\/code> — то же самое, что <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модификатор <code>while<\/code> повторяет выражение <code>$x -= 3<\/code>, пока условие <code>$x &gt; 2<\/code> остаётся <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Как только условие становится <code>False<\/code>, цикл останавливается.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что если условие с самого начала равно <code>False<\/code>, выражение не выполняется вообще.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ту же программу можно написать с помощью <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для этого условие нужно поменять на обратное:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"uk":{"t":"<code>while<\/code> та <code>until<\/code> як модифікатори операторів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва <code>while<\/code> і <code>until<\/code> можна використовувати як модифікатори виразів, <a href=\"https://course.raku.org/uk/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">так само<\/a>, як <code>if<\/code> і <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Подивіться на приклад, який імітує модульне ділення, тобто знаходження остачі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>-=<\/code> — це оператор, який виконує віднімання і присвоєння разом.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку <code>$x -= 3<\/code> — те саме, що <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модифікатор <code>while<\/code> повторює вираз <code>$x -= 3<\/code>, поки умова <code>$x &gt; 2<\/code> залишається <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щойно умова стає <code>False<\/code>, цикл зупиняється.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що якщо умова від самого початку є <code>False<\/code>, вираз узагалі не виконується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ту саму програму можна написати з <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для цього умову треба змінити на протилежну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"bg":{"t":"<code>while<\/code> и <code>until<\/code> като модификатори на изречения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">И <code>while<\/code>, и <code>until<\/code> могат да се използват като модификатори на изрази, <a href=\"https://course.raku.org/bg/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">по същия начин<\/a> като <code>if<\/code> и <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте пример, който имитира модулно деление, тоест намиране на остатъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-=<\/code> е оператор, който извършва изваждане и присвояване заедно.<\/span> <span class=\"sg\" data-s=\"1\">В този случай <code>$x -= 3<\/code> е същото като <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модификаторът <code>while<\/code> повтаря израза <code>$x -= 3<\/code>, докато условието <code>$x &gt; 2<\/code> остава <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щом условието стане <code>False<\/code>, цикълът спира.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че ако условието е <code>False<\/code> още в началото, изразът изобщо не се изпълнява.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същата програма може да се напише с <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За целта трябва да обърнете условието:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"eo":{"t":"<code>while<\/code> kaj <code>until<\/code> kiel modifiloj de deklaroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>while<\/code> kaj <code>until<\/code> povas esti uzataj kiel deklaraj modifiloj, <a href=\"https://course.raku.org/eo/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">en la sama maniero<\/a> kiel <code>if<\/code> kaj <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rigardu ekzemplon, kiu imitas modulan dividon, tio estas, trovi la reston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>-=<\/code> estas operatoro, kiu faras subtrahon kaj asignon kune.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, <code>$x -= 3<\/code> estas la sama kiel <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> modifilo ripetas la deklaron <code>$x -= 3<\/code>, dum la kondiĉo <code>$x &gt; 2<\/code> restas <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tuj kiam la kondiĉo fariĝas <code>False<\/code>, la buklo haltas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke se la kondiĉo estas <code>False<\/code> de la komenco, la deklaro tute ne ruliĝas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sama programo povas esti skribita per <code>until<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por fari tion, vi devas inversigi la kondiĉon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"la":{"t":"<code>while<\/code> et <code>until<\/code> ut statement modificatores","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>while<\/code> et <code>until<\/code> ut modificatores sententiae adhiberi possunt, <a href=\"https://course.raku.org/la/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">eodem modo<\/a> ac <code>if<\/code> et <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Specta exemplum quod divisionem modulo imitatur, id est, residuum divisionis invenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>-=<\/code> est operator qui subtractionem et assignationem simul facit.<\/span> <span class=\"sg\" data-s=\"1\">In hoc casu, <code>$x -= 3<\/code> idem est ac <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modificator <code>while<\/code> sententiam <code>$x -= 3<\/code> repetit dum condicio <code>$x &gt; 2<\/code> manet <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Simul ac condicio fit <code>False<\/code>, ansa desinit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod, si condicio ab initio <code>False<\/code> est, sententia omnino non currit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem programma cum <code>until<\/code> scribi potest.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc faciendum, condicionem invertere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]}}}</script>
