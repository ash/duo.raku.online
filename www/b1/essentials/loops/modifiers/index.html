<script type="application/json" id="page-data">{"u":"essentials/loops/modifiers","n":157,"k":"topic","pv":"essentials/loops/repeat/quiz","nx":"essentials/loops/loop","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"while and until as statement modifiers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also use <code>while<\/code> and <code>until<\/code> as statement modifiers, that is, after a statement.<\/span> <span class=\"sg\" data-s=\"1\">This works <a href=\"/essentials/conditional-checks/modifiers/\">in the same way<\/a> as with <code>if<\/code> and <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is an example that works like modulo division, that is, it finds the remainder:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, <code>-=<\/code> is an operator that subtracts and assigns in one step.<\/span> <span class=\"sg\" data-s=\"1\">So <code>$x -= 3<\/code> means the same as <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>while<\/code> modifier repeats <code>$x -= 3<\/code> as long as the condition <code>$x &gt; 2<\/code> is <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">When it becomes <code>False<\/code>, the loop stops.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Note that if the condition is <code>False<\/code> from the start, the statement never runs.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The same program can use <code>until<\/code>, but then the condition must be reversed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"de":{"t":"<code>while<\/code> und <code>until<\/code> als Anweisungsmodifikatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können <code>while<\/code> und <code>until<\/code> auch als Anweisungsmodifikatoren verwenden, also hinter einer Anweisung.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert <a href=\"https://course.raku.org/de/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">genauso<\/a> wie bei <code>if<\/code> und <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel, das wie die Modulo-Division funktioniert, also den Rest berechnet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>-=<\/code> ein Operator, der in einem Schritt subtrahiert und zuweist.<\/span> <span class=\"sg\" data-s=\"1\">Also bedeutet <code>$x -= 3<\/code> dasselbe wie <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der <code>while<\/code>-Modifikator wiederholt <code>$x -= 3<\/code>, solange die Bedingung <code>$x &gt; 2<\/code> <code>True<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Wenn sie <code>False<\/code> wird, stoppt die Schleife.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie: Wenn die Bedingung von Anfang an <code>False<\/code> ist, läuft die Anweisung nie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dasselbe Programm kann auch <code>until<\/code> verwenden, aber dann muss die Bedingung umgekehrt werden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"nl":{"t":"<code>while<\/code> en <code>until<\/code> als zinsmodificatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt <code>while<\/code> en <code>until<\/code> ook als statement modifiers gebruiken, dus na een statement.<\/span> <span class=\"sg\" data-s=\"1\">Dit werkt <a href=\"https://course.raku.org/nl/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">op dezelfde manier<\/a> als bij <code>if<\/code> en <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld dat werkt zoals modulo-deling, dus het berekent de rest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>-=<\/code> een operator die in één stap aftrekt en toewijst.<\/span> <span class=\"sg\" data-s=\"1\"><code>$x -= 3<\/code> betekent dus hetzelfde als <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>while<\/code>-modifier herhaalt <code>$x -= 3<\/code> zolang de conditie <code>$x &gt; 2<\/code> <code>True<\/code> is.<\/span> <span class=\"sg\" data-s=\"1\">Als die <code>False<\/code> wordt, stopt de lus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat als de conditie vanaf het begin <code>False<\/code> is, de statement nooit draait.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde programma kan ook <code>until<\/code> gebruiken, maar dan moet je de conditie omkeren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"es":{"t":"<code>while<\/code> y <code>until<\/code> como modificadores de sentencia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes usar <code>while<\/code> y <code>until<\/code> como modificadores de declaración, es decir, después de una declaración.<\/span> <span class=\"sg\" data-s=\"1\">Esto funciona <a href=\"https://course.raku.org/es/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">de la misma manera<\/a> que con <code>if<\/code> y <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un ejemplo que funciona como la división de módulo, es decir, calcula el resto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>-=<\/code> es un operador que resta y asigna en un solo paso.<\/span> <span class=\"sg\" data-s=\"1\">Así, <code>$x -= 3<\/code> significa lo mismo que <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El modificador <code>while<\/code> repite <code>$x -= 3<\/code> mientras la condición <code>$x &gt; 2<\/code> sea <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cuando se vuelve <code>False<\/code>, el bucle se detiene.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que si la condición es <code>False<\/code> desde el principio, la declaración nunca se ejecuta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El mismo programa puede usar <code>until<\/code>, pero entonces hay que invertir la condición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"it":{"t":"<code>while<\/code> e <code>until<\/code> come modificatori di istruzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi usare <code>while<\/code> e <code>until<\/code> anche come modificatori di istruzione, cioè dopo un'istruzione.<\/span> <span class=\"sg\" data-s=\"1\">Funziona <a href=\"https://course.raku.org/it/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">allo stesso modo<\/a> che con <code>if<\/code> e <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio che funziona come la divisione modulo, cioè trova il resto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>-=<\/code> è un operatore che sottrae e assegna in un solo passo.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>$x -= 3<\/code> significa la stessa cosa di <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il modificatore <code>while<\/code> ripete <code>$x -= 3<\/code> finché la condizione <code>$x &gt; 2<\/code> è <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quando diventa <code>False<\/code>, il ciclo si ferma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che se la condizione è <code>False<\/code> fin dall'inizio, l'istruzione non viene mai eseguita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo stesso programma può usare <code>until<\/code>, ma allora la condizione deve essere invertita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"lv":{"t":"<code>while<\/code> un <code>until<\/code> kā izteiksmes modifikatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot <code>while<\/code> un <code>until<\/code> arī kā teikuma modifikatorus, tas ir, aiz teikuma.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas <a href=\"https://course.raku.org/lv/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">tāpat<\/a> kā ar <code>if<\/code> un <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir piemērs, kas darbojas kā dalīšana pēc moduļa, tas ir, tas atrod atlikumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-=<\/code> ir operators, kas atņem un piešķir vienā solī.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>$x -= 3<\/code> nozīmē to pašu, ko <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> modifikators atkārto <code>$x -= 3<\/code>, kamēr nosacījums <code>$x &gt; 2<\/code> ir <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas kļūst <code>False<\/code>, cilpa apstājas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet: ja nosacījums jau no sākuma ir <code>False<\/code>, teikums nekad neizpildās.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā pati programma var izmantot <code>until<\/code>, bet tad nosacījums ir jāapgriež:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"ru":{"t":"<code>while<\/code> и <code>until<\/code> как модификаторы инструкций","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы также можете использовать <code>while<\/code> и <code>until<\/code> как модификаторы выражений, то есть после выражения.<\/span> <span class=\"sg\" data-s=\"1\">Это работает <a href=\"https://course.raku.org/ru/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">точно так же<\/a>, как с <code>if<\/code> и <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример, который работает как деление по модулю, то есть находит остаток:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-=<\/code> — это оператор, который вычитает и присваивает за один шаг.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>$x -= 3<\/code> значит то же самое, что <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модификатор <code>while<\/code> повторяет <code>$x -= 3<\/code>, пока условие <code>$x &gt; 2<\/code> равно <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Когда оно становится <code>False<\/code>, цикл останавливается.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание: если условие с самого начала равно <code>False<\/code>, выражение не выполняется ни разу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В той же программе можно использовать <code>until<\/ да използвате <code>while<\/code> и <code>until<\/code> и като модификатори на изрази, тоест след израз.<\/span> <span class=\"sg\" data-s=\"1\">Това работи <a href=\"https://course.raku.org/bg/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">по същия начин<\/a> като при <code>if<\/code> и <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример, който работи като модулно деление, тоест намира остатъка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-=<\/code> е оператор, който изважда и присвоява в една стъпка.<\/span> <span class=\"sg\" data-s=\"1\">Значи <code>$x -= 3<\/code> означава същото като <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Модификаторът <code>while<\/code> повтаря <code>$x -= 3<\/code>, докато условието <code>$x &gt; 2<\/code> е <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Когато то стане <code>False<\/code>, цикълът спира.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че ако условието е <code>False<\/code> още в началото, изразът никога не се изпълнява.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Същата програма може да използва <code>until<\/code>, но тогава условието трябва да се обърне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"eo":{"t":"<code>while<\/code> kaj <code>until<\/code> kiel modifiloj de deklaroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas uzi <code>while<\/code> kaj <code>until<\/code> kiel deklarajn modifilojn, tio estas, post deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias <a href=\"https://course.raku.org/eo/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">en la sama maniero<\/a> kiel ĉe <code>if<\/code> kaj <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo, kiu funkcias kiel modula divido, tio estas, ĝi trovas la reston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>-=<\/code> estas operatoro, kiu subtrahas kaj asignas per unu paŝo.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>$x -= 3<\/code> signifas la samon kiel <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> modifilo ripetas <code>$x -= 3<\/code>, dum la kondiĉo <code>$x &gt; 2<\/code> estas <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kiam ĝi fariĝas <code>False<\/code>, la buklo haltas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke se la kondiĉo estas <code>False<\/code> de la komenco, la deklaro neniam ruliĝas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sama programo povas uzi <code>until<\/code>, sed tiam la kondiĉo devas esti inversigita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]},"la":{"t":"<code>while<\/code> et <code>until<\/code> ut statement modificatores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Potes etiam <code>while<\/code> et <code>until<\/code> ut modificatores sententiae adhibere, id est, post sententiam.<\/span> <span class=\"sg\" data-s=\"1\">Hoc <a href=\"https://course.raku.org/la/essentials/conditional-checks/modifiers/\" target=\"_blank\" rel=\"noopener\">eodem modo<\/a> operatur ac cum <code>if<\/code> et <code>unless<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum quod sicut divisio modulo operatur, id est, residuum invenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 while $x &gt; 2;\nsay $x; # 1<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>-=<\/code> est operator qui uno gradu subtrahit et assignat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>$x -= 3<\/code> idem significat ac <code>$x = $x - 3<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Modificator <code>while<\/code> sententiam <code>$x -= 3<\/code> repetit dum condicio <code>$x &gt; 2<\/code> est <code>True<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cum fit <code>False<\/code>, ansa desinit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota quod, si condicio ab initio <code>False<\/code> est, sententia numquam currit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Idem programma <code>until<\/code> adhibere potest, sed tum condicio inverti debet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\n$x -= 3 until $x &lt;= 2;\nsay $x; # 1<\/code><\/pre>"]]}}}</script>
