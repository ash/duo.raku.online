<script type="application/json" id="page-data">{"u":"essentials/loops/while","n":151,"k":"topic","pv":"essentials/loops","nx":"essentials/loops/while/quiz","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"while","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>while<\/code> loop has a Boolean condition (<code>True<\/code> or <code>False<\/code>) and a block of code.<\/span> <span class=\"sg\" data-s=\"1\">Raku repeats the block <em>while<\/em> the condition is <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enter a number, which is not bigger than 10: ';\n    say \"You entered $x.\";\n}\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The program asks you to enter a number.<\/span> <span class=\"sg\" data-s=\"1\">If the number is not bigger than 10, the body of the loop runs again.<\/span> <span class=\"sg\" data-s=\"2\">When a number does not meet the condition <code>$x &lt;= 10<\/code>, the loop ends.<\/span> <span class=\"sg\" data-s=\"3\">Then the program goes on to the next line.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number, which is not bigger than 10: 10\nYou entered 10.\nEnter a number, which is not bigger than 10: 4\nYou entered 4.\nEnter a number, which is not bigger than 10: 1\nYou entered 1.\nEnter a number, which is not bigger than 10: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"]]},"de":{"t":"Verwendung von <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die <code>while<\/code>-Schleife hat eine boolesche Bedingung (<code>True<\/code> oder <code>False<\/code>) und einen Codeblock.<\/span> <span class=\"sg\" data-s=\"1\">Raku wiederholt den Block, <em>während<\/em> die Bedingung <code>True<\/code> ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Geben Sie eine Zahl ein, die nicht größer als 10 ist: ';\n    say \"Sie haben $x eingegeben.\";\n}\nsay \"$x ist größer als 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Programm bittet Sie, eine Zahl einzugeben.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Zahl nicht größer als 10 ist, läuft der Schleifenkörper noch einmal.<\/span> <span class=\"sg\" data-s=\"2\">Wenn eine Zahl die Bedingung <code>$x &lt;= 10<\/code> nicht erfüllt, endet die Schleife.<\/span> <span class=\"sg\" data-s=\"3\">Dann macht das Programm mit der nächsten Zeile weiter.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 10\nSie haben 10 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 4\nSie haben 4 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 1\nSie haben 1 eingegeben.\nGeben Sie eine Zahl ein, die nicht größer als 10 ist: 20\nSie haben 20 eingegeben.\n20 ist größer als 10.<\/code><\/pre>"]]},"nl":{"t":"Gebruik van <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>while<\/code>-lus heeft een Booleaanse voorwaarde (<code>True<\/code> of <code>False<\/code>) en een codeblok.<\/span> <span class=\"sg\" data-s=\"1\">Raku herhaalt het blok <em>zolang<\/em> de voorwaarde <code>True<\/code> is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Voer een getal in dat niet groter is dan 10: ';\n    say \"Je hebt $x ingevoerd.\";\n}\nsay \"$x is groter dan 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het programma vraagt je om een getal in te voeren.<\/span> <span class=\"sg\" data-s=\"1\">Als het getal niet groter is dan 10, draait het lichaam van de lus opnieuw.<\/span> <span class=\"sg\" data-s=\"2\">Als een getal niet aan de voorwaarde <code>$x &lt;= 10<\/code> voldoet, eindigt de lus.<\/span> <span class=\"sg\" data-s=\"3\">Dan gaat het programma verder met de volgende regel.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nVoer een getal in dat niet groter is dan 10: 10\nJe hebt 10 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 4\nJe hebt 4 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 1\nJe hebt 1 ingevoerd.\nVoer een getal in dat niet groter is dan 10: 20\nJe hebt 20 ingevoerd.\n20 is groter dan 10.<\/code><\/pre>"]]},"es":{"t":"Uso de <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El bucle <code>while<\/code> tiene una condición booleana (<code>True<\/code> o <code>False<\/code>) y un bloque de código.<\/span> <span class=\"sg\" data-s=\"1\">Raku repite el bloque <em>mientras<\/em> la condición sea <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Introduce un número, que no sea mayor que 10: ';\n    say \"Has introducido $x.\";\n}\nsay \"$x es mayor que 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El programa te pide introducir un número.<\/span> <span class=\"sg\" data-s=\"1\">Si el número no es mayor que 10, el cuerpo del bucle se ejecuta otra vez.<\/span> <span class=\"sg\" data-s=\"2\">Cuando un número no cumple la condición <code>$x &lt;= 10<\/code>, el bucle termina.<\/span> <span class=\"sg\" data-s=\"3\">Luego el programa continúa con la línea siguiente.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntroduce un número, que no sea mayor que 10: 10\nHas introducido 10.\nIntroduce un número, que no sea mayor que 10: 4\nHas introducido 4.\nIntroduce un número, que no sea mayor que 10: 1\nHas introducido 1.\nIntroduce un número, que no sea mayor que 10: 20\nHas introducido 20.\n20 es mayor que 10.<\/code><\/pre>"]]},"it":{"t":"Uso di <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il ciclo <code>while<\/code> ha una condizione booleana (<code>True<\/code> o <code>False<\/code>) e un blocco di codice.<\/span> <span class=\"sg\" data-s=\"1\">Raku ripete il blocco <em>mentre<\/em> la condizione è <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Inserisci un numero, che non sia maggiore di 10: ';\n    say \"Hai inserito $x.\";\n}\nsay \"$x è maggiore di 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il programma ti chiede di inserire un numero.<\/span> <span class=\"sg\" data-s=\"1\">Se il numero non è più grande di 10, il corpo del ciclo si ripete.<\/span> <span class=\"sg\" data-s=\"2\">Quando un numero non rispetta la condizione <code>$x &lt;= 10<\/code>, il ciclo finisce.<\/span> <span class=\"sg\" data-s=\"3\">Poi il programma continua con la riga successiva.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nInserisci un numero, che non sia maggiore di 10: 10\nHai inserito 10.\nInserisci un numero, che non sia maggiore di 10: 4\nHai inserito 4.\nInserisci un numero, che non sia maggiore di 10: 1\nHai inserito 1.\nInserisci un numero, che non sia maggiore di 10: 20\nHai inserito 20.\n20 è maggiore di 10.<\/code><\/pre>"]]},"lv":{"t":"Izmantojot <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>while<\/code> ciklam ir Būla nosacījums (<code>True<\/code> vai <code>False<\/code>) un koda bloks.<\/span> <span class=\"sg\" data-s=\"1\">Raku atkārto bloku, <em>kamēr<\/em> nosacījums ir <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Ievadiet skaitli, kas nav lielāks par 10: ';\n    say \"Jūs ievadījāt $x.\";\n}\nsay \"$x ir lielāks par 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma lūdz jūs ievadīt skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Ja skaitlis nav lielāks par 10, cilpas ķermenis izpildās vēlreiz.<\/span> <span class=\"sg\" data-s=\"2\">Kad skaitlis neatbilst nosacījumam <code>$x &lt;= 10<\/code>, cilpa beidzas.<\/span> <span class=\"sg\" data-s=\"3\">Tad programma turpina ar nākamo rindu.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIevadiet skaitli, kas nav lielāks par 10: 10\nJūs ievadījāt 10.\nIevadiet skaitli, kas nav lielāks par 10: 4\nJūs ievadījāt 4.\nIevadiet skaitli, kas nav lielāks par 10: 1\nJūs ievadījāt 1.\nIevadiet skaitli, kas nav lielāks par 10: 20\nJūs ievadījāt 20.\n20 ir lielāks par 10.<\/code><\/pre>"]]},"ru":{"t":"Использование <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У цикла <code>while<\/code> есть логическое условие (<code>True<\/code> или <code>False<\/code>) и блок кода.<\/span> <span class=\"sg\" data-s=\"1\">Raku повторяет блок, <em>пока<\/em> условие равно <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Введите число, которое не больше 10: ';\n    say \"Вы ввели $x.\";\n}\nsay \"$x больше 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Программа просит вас ввести число.<\/span> <span class=\"sg\" data-s=\"1\">Если число не больше 10, тело цикла выполняется снова.<\/span> <span class=\"sg\" data-s=\"2\">Когда число не подходит под условие <code>$x &lt;= 10<\/code>, цикл заканчивается.<\/span> <span class=\"sg\" data-s=\"3\">Затем программа переходит к следующей строке.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВведите число, которое не больше 10: 10\nВы ввели 10.\nВведите число, которое не больше 10: 4\nВы ввели 4.\nВведите число, которое не больше 10: 1\nВы ввели 1.\nВведите число, которое не больше 10: 20\nВы ввели 20.\n20 больше 10.<\/code><\/pre>"]]},"uk":{"t":"Використання <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Цикл <code>while<\/code> має булеву умову (<code>True<\/code> або <code>False<\/code>) і блок коду.<\/span> <span class=\"sg\" data-s=\"1\">Raku повторює блок, <em>поки<\/em> умова є <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enter a number, which is not bigger than 10: ';\n    say \"You entered $x.\";\n}\nsay \"$x is bigger than 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програма просить вас ввести число.<\/span> <span class=\"sg\" data-s=\"1\">Якщо число не більше 10, тіло циклу виконується знову.<\/span> <span class=\"sg\" data-s=\"2\">Коли число не відповідає умові <code>$x &lt;= 10<\/code>, цикл закінчується.<\/span> <span class=\"sg\" data-s=\"3\">Тоді програма переходить до наступного рядка.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnter a number, which is not bigger than 10: 10\nYou entered 10.\nEnter a number, which is not bigger than 10: 4\nYou entered 4.\nEnter a number, which is not bigger than 10: 1\nYou entered 1.\nEnter a number, which is not bigger than 10: 20\nYou entered 20.\n20 is bigger than 10.<\/code><\/pre>"]]},"bg":{"t":"Използване на <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Цикълът <code>while<\/code> има булево условие (<code>True<\/code> или <code>False<\/code>) и блок от код.<\/span> <span class=\"sg\" data-s=\"1\">Raku повтаря блока, <em>докато<\/em> условието е <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Въведете число, което не е по-голямо от 10: ';\n    say \"Въведохте $x.\";\n}\nsay \"$x е по-голямо от 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмата ви моли да въведете число.<\/span> <span class=\"sg\" data-s=\"1\">Ако числото не е по-голямо от 10, тялото на цикъла се изпълнява отново.<\/span> <span class=\"sg\" data-s=\"2\">Когато едно число не отговаря на условието <code>$x &lt;= 10<\/code>, цикълът приключва.<\/span> <span class=\"sg\" data-s=\"3\">Тогава програмата продължава със следващия ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nВъведете число, което не е по-голямо от 10: 10\nВъведохте 10.\nВъведете число, което не е по-голямо от 10: 4\nВъведохте 4.\nВъведете число, което не е по-голямо от 10: 1\nВъведохте 1.\nВъведете число, което не е по-голямо от 10: 20\nВъведохте 20.\n20 е по-голямо от 10.<\/code><\/pre>"]]},"eo":{"t":"Uzante <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>while<\/code> buklo havas Boole-an kondiĉon (<code>True<\/code> aŭ <code>False<\/code>) kaj blokon de kodo.<\/span> <span class=\"sg\" data-s=\"1\">Raku ripetas la blokon <em>dum<\/em> la kondiĉo estas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Enigu numeron, kiu ne estas pli granda ol 10: ';\n    say \"Vi enigis $x.\";\n}\nsay \"$x estas pli granda ol 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La programo petas vin enigi nombron.<\/span> <span class=\"sg\" data-s=\"1\">Se la nombro ne estas pli granda ol 10, la korpo de la buklo ruliĝas denove.<\/span> <span class=\"sg\" data-s=\"2\">Kiam nombro ne plenumas la kondiĉon <code>$x &lt;= 10<\/code>, la buklo finiĝas.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la programo daŭrigas per la sekva linio.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEnigu numeron, kiu ne estas pli granda ol 10: 10\nVi enigis 10.\nEnigu numeron, kiu ne estas pli granda ol 10: 4\nVi enigis 4.\nEnigu numeron, kiu ne estas pli granda ol 10: 1\nVi enigis 1.\nEnigu numeron, kiu ne estas pli granda ol 10: 20\nVi enigis 20.\n20 estas pli granda ol 10.<\/code><\/pre>"]]},"la":{"t":"Utendo <code>while<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Anulus <code>while<\/code> condicionem Booleanam (<code>True<\/code> aut <code>False<\/code>) et clausulam codicis habet.<\/span> <span class=\"sg\" data-s=\"1\">Raku clausulam repetit <em>dum<\/em> condicio est <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 0;\nwhile $x &lt;= 10 {\n    $x = prompt 'Intra numerum, qui non maior est quam 10: ';\n    say \"Intrasti $x.\";\n}\nsay \"$x maior est quam 10.\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma te rogat ut numerum intres.<\/span> <span class=\"sg\" data-s=\"1\">Si numerus non maior est quam 10, corpus anuli iterum currit.<\/span> <span class=\"sg\" data-s=\"2\">Cum numerus condicionem <code>$x &lt;= 10<\/code> non servat, anulus desinit.<\/span> <span class=\"sg\" data-s=\"3\">Tum programma ad lineam sequentem pergit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIntra numerum, qui non maior est quam 10: 10\nIntrasti 10.\nIntra numerum, qui non maior est quam 10: 4\nIntrasti 4.\nIntra numerum, qui non maior est quam 10: 1\nIntrasti 1.\nIntra numerum, qui non maior est quam 10: 20\nIntrasti 20.\n20 maior est quam 10.<\/code><\/pre>"]]}}}</script>
