<script type="application/json" id="page-data">{"u":"essentials/loops/loop","n":158,"k":"topic","pv":"essentials/loops/modifiers","nx":"essentials/loops/infinite-loops","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"loop","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> statement in Raku is very similar to traditional loops in C and languages like it.<\/span> <span class=\"sg\" data-s=\"1\">It takes three statements.<\/span> <span class=\"sg\" data-s=\"2\">The first sets a start value, and the second is the test.<\/span> <span class=\"sg\" data-s=\"3\">The third changes the loop variable.<\/span> <span class=\"sg\" data-s=\"4\">The body of the loop runs again and again while the test is <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, <code>++<\/code> is a postfix operator, which means that it comes after its argument.<\/span> <span class=\"sg\" data-s=\"1\">It adds 1 to the argument.<\/span> <span class=\"sg\" data-s=\"2\">There are more operators in the second part of the course.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program runs the body of the loop five times.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Some of the statements in the <code>loop<\/code> header, or even all of them, are optional.<\/span> <span class=\"sg\" data-s=\"1\">For example, here is the same program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku programmers probably use <code>loop<\/code> less than any other loop.<\/span> <span class=\"sg\" data-s=\"1\">You may find it, for example, in code that a tool converted from C to Raku.<\/span> <span class=\"sg\" data-s=\"2\">But Raku has more convenient loops, such as <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">We will look at it very soon.<\/span><\/p>"]]},"de":{"t":"Drei-Anweisungs-Schleife <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Anweisung in Raku ist den traditionellen Schleifen in C und ähnlichen Sprachen sehr ähnlich.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt drei Anweisungen.<\/span> <span class=\"sg\" data-s=\"2\">Die erste setzt einen Startwert, und die zweite ist der Test.<\/span> <span class=\"sg\" data-s=\"3\">Die dritte ändert die Schleifenvariable.<\/span> <span class=\"sg\" data-s=\"4\">Der Schleifenkörper läuft immer wieder, solange der Test <code>True<\/code> ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>++<\/code> ein Postfix-Operator, das heißt, er steht hinter seinem Argument.<\/span> <span class=\"sg\" data-s=\"1\">Er addiert 1 zum Argument.<\/span> <span class=\"sg\" data-s=\"2\">Im zweiten Teil des Kurses gibt es weitere Operatoren.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm führt den Schleifenkörper fünfmal aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDer aktuelle Wert des Zählers ist 0.\nDer aktuelle Wert des Zählers ist 1.\nDer aktuelle Wert des Zählers ist 2.\nDer aktuelle Wert des Zählers ist 3.\nDer aktuelle Wert des Zählers ist 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Einige Anweisungen im Kopf von <code>loop<\/code>, oder sogar alle, sind optional.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist zum Beispiel dasselbe Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku-Programmierer verwenden <code>loop<\/code> wahrscheinlich seltener als jede andere Schleife.<\/span> <span class=\"sg\" data-s=\"1\">Sie finden <code>loop<\/code> zum Beispiel in Code, den ein Werkzeug von C nach Raku übersetzt hat.<\/span> <span class=\"sg\" data-s=\"2\">Aber Raku hat praktischere Schleifen wie <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Wir sehen sie uns sehr bald an.<\/span><\/p>"]]},"nl":{"t":"Drie-zins <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-instructie in Raku lijkt erg op de traditionele lussen in C en talen die erop lijken.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt drie instructies.<\/span> <span class=\"sg\" data-s=\"2\">De eerste geeft een startwaarde, en de tweede is de test.<\/span> <span class=\"sg\" data-s=\"3\">De derde verandert de lusvariabele.<\/span> <span class=\"sg\" data-s=\"4\">Het lichaam van de lus draait steeds opnieuw zolang de test <code>True<\/code> is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"De huidige waarde van de teller is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>++<\/code> een postfix-operator, wat betekent dat hij na zijn argument komt.<\/span> <span class=\"sg\" data-s=\"1\">Hij telt 1 op bij het argument.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn meer operators in het tweede deel van de cursus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma voert het lichaam van de lus vijf keer uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDe huidige waarde van de teller is 0.\nDe huidige waarde van de teller is 1.\nDe huidige waarde van de teller is 2.\nDe huidige waarde van de teller is 3.\nDe huidige waarde van de teller is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommige instructies in de kop van <code>loop<\/code>, of zelfs alle, zijn niet verplicht.<\/span> <span class=\"sg\" data-s=\"1\">Hier is bijvoorbeeld hetzelfde programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"De huidige waarde van de teller is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku-programmeurs gebruiken <code>loop<\/code> waarschijnlijk minder dan alle andere lussen.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt hem bijvoorbeeld in code die een tool van C naar Raku heeft omgezet.<\/span> <span class=\"sg\" data-s=\"2\">Maar Raku heeft handigere lussen, zoals <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Die bekijken we heel binnenkort.<\/span><\/p>"]]},"es":{"t":"Bucle de tres sentencias <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La declaración <code>loop<\/code> en Raku es muy parecida a los bucles tradicionales de C y de lenguajes similares.<\/span> <span class=\"sg\" data-s=\"1\">Toma tres declaraciones.<\/span> <span class=\"sg\" data-s=\"2\">La primera da un valor inicial, y la segunda es la prueba.<\/span> <span class=\"sg\" data-s=\"3\">La tercera cambia la variable del bucle.<\/span> <span class=\"sg\" data-s=\"4\">El cuerpo del bucle se ejecuta una y otra vez mientras la prueba sea <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"El valor actual del contador es $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>++<\/code> es un operador postfijo, lo que significa que va después de su argumento.<\/span> <span class=\"sg\" data-s=\"1\">Suma 1 al argumento.<\/span> <span class=\"sg\" data-s=\"2\">Hay más operadores en la segunda parte del curso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa ejecuta el cuerpo del bucle cinco veces.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEl valor actual del contador es 0.\nEl valor actual del contador es 1.\nEl valor actual del contador es 2.\nEl valor actual del contador es 3.\nEl valor actual del contador es 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Algunas de las declaraciones del encabezado de <code>loop<\/code>, o incluso todas, son opcionales.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, aquí está el mismo programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"El valor actual del contador es $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los programadores de Raku probablemente usan <code>loop<\/code> menos que cualquier otro bucle.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlo, por ejemplo, en código que una herramienta convirtió de C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Pero Raku tiene bucles más cómodos, como <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lo veremos muy pronto.<\/span><\/p>"]]},"it":{"t":"Ciclo <code>loop<\/code> a tre istruzioni","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">L'istruzione <code>loop<\/code> in Raku è molto simile ai cicli tradizionali del C e di linguaggi simili.<\/span> <span class=\"sg\" data-s=\"1\">Prende tre istruzioni.<\/span> <span class=\"sg\" data-s=\"2\">La prima imposta un valore iniziale, e la seconda è il test.<\/span> <span class=\"sg\" data-s=\"3\">La terza cambia la variabile del ciclo.<\/span> <span class=\"sg\" data-s=\"4\">Il corpo del ciclo si ripete più volte finché il test è <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Il valore attuale del contatore è $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui <code>++<\/code> è un operatore postfisso, cioè viene dopo il suo argomento.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge 1 all'argomento.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono altri operatori nella seconda parte del corso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma esegue il corpo del ciclo cinque volte.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIl valore attuale del contatore è 0.\nIl valore attuale del contatore è 1.\nIl valore attuale del contatore è 2.\nIl valore attuale del contatore è 3.\nIl valore attuale del contatore è 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcune istruzioni nell'intestazione di <code>loop<\/code>, o anche tutte, sono facoltative.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, ecco lo stesso programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Il valore attuale del contatore è $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I programmatori Raku probabilmente usano <code>loop<\/code> meno di tutti gli altri cicli.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarlo, per esempio, nel codice che uno strumento ha convertito da C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ma Raku ha cicli più comodi, come <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Lo vedremo molto presto.<\/span><\/p>"]]},"lv":{"t":"Trīs izteiksmju cikls","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> paziņojums Raku valodā ir ļoti līdzīgs tradicionālajiem cikliem C valodā un tai līdzīgās valodās.<\/span> <span class=\"sg\" data-s=\"1\">Tas pieņem trīs paziņojumus.<\/span> <span class=\"sg\" data-s=\"2\">Pirmais iestata sākuma vērtību, un otrais ir pārbaude.<\/span> <span class=\"sg\" data-s=\"3\">Trešais maina cikla mainīgo.<\/span> <span class=\"sg\" data-s=\"4\">Cikla ķermenis izpildās atkal un atkal, kamēr pārbaude ir <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>++<\/code> ir postfix operators, kas nozīmē, ka tas atrodas aiz sava argumenta.<\/span> <span class=\"sg\" data-s=\"1\">Tas pieskaita argumentam 1.<\/span> <span class=\"sg\" data-s=\"2\">Kursa otrajā daļā ir vairāk operatoru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izpilda cikla ķermeni piecas reizes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Daži paziņojumi <code>loop<\/code> galvenē, vai pat visi, nav obligāti.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šeit ir tā pati programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku programmētāji <code>loop<\/code>, iespējams, izmanto retāk nekā jebkuru citu ciklu.<\/span> <span class=\"sg\" data-s=\"1\">To var atrast, piemēram, kodā, ko kāds rīks pārveidoja no C uz Raku.<\/span> <span class=\"sg\" data-s=\"2\">Taču Raku valodā ir ērtāki cikli, piemēram, <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Mēs to apskatīsim pavisam drīz.<\/span><\/p>"]]},"ru":{"t":"<code>loop<\/code> с тремя инструкциями","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> в Raku очень похож на традиционные циклы в C и похожих на него языках.<\/span> <span class=\"sg\" data-s=\"1\">Он принимает три выражения.<\/span> <span class=\"sg\" data-s=\"2\">Первое задаёт начальное значение, а второе — это проверка.<\/span> <span class=\"sg\" data-s=\"3\">Третье изменяет переменную цикла.<\/span> <span class=\"sg\" data-s=\"4\">Тело цикла выполняется снова и снова, пока проверка равна <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущее значение счетчика: $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>++<\/code> — это постфиксный оператор, то есть он стоит после своего аргумента.<\/span> <span class=\"sg\" data-s=\"1\">Он прибавляет 1 к аргументу.<\/span> <span class=\"sg\" data-s=\"2\">Во второй части курса есть и другие операторы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выполняет тело цикла пять раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущее значение счетчика: 0.\nТекущее значение счетчика: 1.\nТекущее значение счетчика: 2.\nТекущее значение счетчика: 3.\nТекущее значение счетчика: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Некоторые выражения в заголовке <code>loop<\/code>, или даже все они, необязательны.<\/span> <span class=\"sg\" data-s=\"1\">Например, вот та же программа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущее значение счетчика: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Программисты на Raku, наверное, используют <code>loop<\/code> реже любого другого цикла.<\/span> <span class=\"sg\" data-s=\"1\">Его можно встретить, например, в коде, который инструмент перевёл с C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но в Raku есть более удобные циклы, такие как <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Мы рассмотрим его очень скоро.<\/span><\/p>"]]},"uk":{"t":"Триопераційний цикл <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> у Raku дуже схожий на традиційні цикли в C та подібних мовах.<\/span> <span class=\"sg\" data-s=\"1\">Він приймає три вирази.<\/span> <span class=\"sg\" data-s=\"2\">Перший задає початкове значення, а другий — це тест.<\/span> <span class=\"sg\" data-s=\"3\">Третій змінює змінну циклу.<\/span> <span class=\"sg\" data-s=\"4\">Тіло циклу виконується знову і знову, поки тест є <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Поточне значення лічильника: $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>++<\/code> — це постфіксний оператор, тобто він стоїть після свого аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Він додає 1 до аргументу.<\/span> <span class=\"sg\" data-s=\"2\">Більше операторів є в другій частині курсу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виконує тіло циклу п'ять разів.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nПоточне значення лічильника: 0.\nПоточне значення лічильника: 1.\nПоточне значення лічильника: 2.\nПоточне значення лічильника: 3.\nПоточне значення лічильника: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі вирази в заголовку <code>loop<\/code> або навіть усі вони — необов'язкові.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ось та сама програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Поточне значення лічильника: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмісти на Raku, мабуть, використовують <code>loop<\/code> рідше, ніж будь-який інший цикл.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете знайти його, наприклад, у коді, який інструмент переклав з C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Але в Raku є зручніші цикли, такі як <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ми розглянемо його дуже скоро.<\/span><\/p>"]]},"bg":{"t":"Тристатъментен цикъл <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>loop<\/code> в Raku много прилича на традиционните цикли в C и подобните му езици.<\/span> <span class=\"sg\" data-s=\"1\">Той приема три израза.<\/span> <span class=\"sg\" data-s=\"2\">Първият задава начална стойност, а вторият е тестът.<\/span> <span class=\"sg\" data-s=\"3\">Третият променя променливата на цикъла.<\/span> <span class=\"sg\" data-s=\"4\">Тялото на цикъла се изпълнява отново и отново, докато тестът е <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущата стойност на брояча е $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>++<\/code> е постфикс оператор, което означава, че стои след аргумента си.<\/span> <span class=\"sg\" data-s=\"1\">Той добавя 1 към аргумента.<\/span> <span class=\"sg\" data-s=\"2\">Във втората част на курса има още оператори.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата изпълнява тялото на цикъла пет пъти.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущата стойност на брояча е 0.\nТекущата стойност на брояча е 1.\nТекущата стойност на брояча е 2.\nТекущата стойност на брояча е 3.\nТекущата стойност на брояча е 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои от изразите в заглавието на <code>loop<\/code>, или дори всички, не са задължителни.<\/span> <span class=\"sg\" data-s=\"1\">Например, ето същата програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущата стойност на брояча е $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмистите на Raku вероятно използват <code>loop<\/code> по-рядко от всеки друг цикъл.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го срещнете, например, в код, който някой инструмент е превърнал от C в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но Raku има по-удобни цикли, като <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ще го разгледаме много скоро.<\/span><\/p>"]]},"eo":{"t":"Trideklaro <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> deklaro en Raku tre similas al la tradiciaj bukloj en C kaj similaj lingvoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas tri deklarojn.<\/span> <span class=\"sg\" data-s=\"2\">La unua donas komencan valoron, kaj la dua estas la testo.<\/span> <span class=\"sg\" data-s=\"3\">La tria ŝanĝas la buklan variablon.<\/span> <span class=\"sg\" data-s=\"4\">La korpo de la buklo ruliĝas denove kaj denove, dum la testo estas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>++<\/code> estas postfiksa operatoro, kio signifas, ke ĝi venas post sia argumento.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas 1 al la argumento.<\/span> <span class=\"sg\" data-s=\"2\">Estas pli da operatoroj en la dua parto de la kurso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo rulas la korpon de la buklo kvin fojojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nLa nuna valoro de la kalkulilo estas 0.\nLa nuna valoro de la kalkulilo estas 1.\nLa nuna valoro de la kalkulilo estas 2.\nLa nuna valoro de la kalkulilo estas 3.\nLa nuna valoro de la kalkulilo estas 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkaj el la deklaroj en la kapo de <code>loop<\/code>, aŭ eĉ ĉiuj, estas nedevigaj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, jen la sama programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku-programistoj verŝajne uzas <code>loop<\/code> malpli ofte ol ĉiujn aliajn buklojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin, ekzemple, en kodo, kiun ilo tradukis de C al Raku.<\/span> <span class=\"sg\" data-s=\"2\">Sed Raku havas pli oportunajn buklojn, kiel <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ni rigardos ĝin tre baldaŭ.<\/span><\/p>"]]},"la":{"t":"Tribus partibus <code>loop<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Enuntiatum <code>loop<\/code> in Raku valde simile est ansis traditis in lingua C et in linguis similibus.<\/span> <span class=\"sg\" data-s=\"1\">Tria enuntiata accipit.<\/span> <span class=\"sg\" data-s=\"2\">Primum valorem initialem ponit, et secundum est probatio.<\/span> <span class=\"sg\" data-s=\"3\">Tertium variabilem ansae mutat.<\/span> <span class=\"sg\" data-s=\"4\">Corpus ansae iterum atque iterum currit dum probatio <code>True<\/code> est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>++<\/code> est operator postfixus, id est, post argumentum suum venit.<\/span> <span class=\"sg\" data-s=\"1\">Ad argumentum 1 addit.<\/span> <span class=\"sg\" data-s=\"2\">Plures operatores sunt in secunda parte cursus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma corpus ansae quinquies exsequitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliqua enuntiata in capite <code>loop<\/code>, vel etiam omnia, non necessaria sunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, hic est idem programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programmatores Raku <code>loop<\/code> fortasse rarius quam ullam aliam ansam adhibent.<\/span> <span class=\"sg\" data-s=\"1\">Eam invenire potes, exempli gratia, in codice quem instrumentum a C ad Raku convertit.<\/span> <span class=\"sg\" data-s=\"2\">Sed Raku commodiores ansas habet, sicut <code>for<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Eam mox spectabimus.<\/span><\/p>"]]}}}</script>
