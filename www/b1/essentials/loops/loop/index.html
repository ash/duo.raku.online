<script type="application/json" id="page-data">{"u":"essentials/loops/loop","n":158,"k":"topic","pv":"essentials/loops/modifiers","nx":"essentials/loops/infinite-loops","tr":["essentials","essentials/loops"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"loop","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> statement in Raku has a lot in common with the traditional loops of the C programming language and its relatives.<\/span> <span class=\"sg\" data-s=\"1\">It takes three statements: the initialiser, the test, and the statement that changes the loop variable.<\/span> <span class=\"sg\" data-s=\"2\">The body of the loop runs again and again while the test stays <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, <code>++<\/code> is a postfix operator that increases its argument by 1.<\/span> <span class=\"sg\" data-s=\"1\">We will look at more operators in the second part of the course.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program runs the body of the loop five times.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Some, or even all, of the statements in the header of <code>loop<\/code> can be left out.<\/span> <span class=\"sg\" data-s=\"1\">For example, here is the same program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>loop<\/code> loops are probably the least used loops in Raku.<\/span> <span class=\"sg\" data-s=\"1\">You may find them, for example, in code that a tool translated automatically from C to Raku.<\/span> <span class=\"sg\" data-s=\"2\">But Raku has more convenient loops, such as <code>for<\/code>, which we will look at very soon.<\/span><\/p>"]]},"de":{"t":"Drei-Anweisungs-Schleife <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Anweisung in Raku hat viel mit den traditionellen Schleifen der Programmiersprache C und ihrer Verwandten gemeinsam.<\/span> <span class=\"sg\" data-s=\"1\">Sie nimmt drei Anweisungen: den Initialisierer, den Test und die Anweisung, die die Schleifenvariable ändert.<\/span> <span class=\"sg\" data-s=\"2\">Der Schleifenkörper läuft immer wieder, solange der Test <code>True<\/code> bleibt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>++<\/code> ein Postfix-Operator, der sein Argument um 1 erhöht.<\/span> <span class=\"sg\" data-s=\"1\">Im zweiten Teil des Kurses sehen wir uns weitere Operatoren an.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm führt den Schleifenkörper fünfmal aus.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDer aktuelle Wert des Zählers ist 0.\nDer aktuelle Wert des Zählers ist 1.\nDer aktuelle Wert des Zählers ist 2.\nDer aktuelle Wert des Zählers ist 3.\nDer aktuelle Wert des Zählers ist 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Einige oder sogar alle Anweisungen im Kopf von <code>loop<\/code> können weggelassen werden.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist zum Beispiel dasselbe Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Der aktuelle Wert des Zählers ist $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die <code>loop<\/code>-Schleifen sind wahrscheinlich die am wenigsten genutzten Schleifen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Sie können sie zum Beispiel in Code finden, den ein Werkzeug automatisch von C nach Raku übersetzt hat.<\/span> <span class=\"sg\" data-s=\"2\">Aber Raku hat praktischere Schleifen wie <code>for<\/code>, die wir uns sehr bald ansehen werden.<\/span><\/p>"]]},"nl":{"t":"Drie-zins <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-instructie in Raku heeft veel gemeen met de traditionele lussen van de programmeertaal C en zijn verwanten.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt drie instructies: de initialisator, de test en de instructie die de lusvariabele verandert.<\/span> <span class=\"sg\" data-s=\"2\">Het lichaam van de lus wordt steeds opnieuw uitgevoerd zolang de test <code>True<\/code> blijft.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"De huidige waarde van de teller is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>++<\/code> een postfix-operator die zijn argument met 1 verhoogt.<\/span> <span class=\"sg\" data-s=\"1\">In het tweede deel van de cursus bekijken we meer operators.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma voert het lichaam van de lus vijf keer uit.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nDe huidige waarde van de teller is 0.\nDe huidige waarde van de teller is 1.\nDe huidige waarde van de teller is 2.\nDe huidige waarde van de teller is 3.\nDe huidige waarde van de teller is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sommige, of zelfs alle, instructies in de kop van <code>loop<\/code> kunnen worden weggelaten.<\/span> <span class=\"sg\" data-s=\"1\">Hier is bijvoorbeeld hetzelfde programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"De huidige waarde van de teller is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>loop<\/code>-lussen zijn waarschijnlijk de minst gebruikte lussen in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt ze bijvoorbeeld in code die een tool automatisch van C naar Raku heeft vertaald.<\/span> <span class=\"sg\" data-s=\"2\">Maar Raku heeft handigere lussen, zoals <code>for<\/code>, die we heel binnenkort zullen bekijken.<\/span><\/p>"]]},"es":{"t":"Bucle de tres sentencias <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La declaración <code>loop<\/code> en Raku tiene mucho en común con los bucles tradicionales del lenguaje de programación C y sus parientes.<\/span> <span class=\"sg\" data-s=\"1\">Toma tres declaraciones: el inicializador, la prueba y la declaración que cambia la variable del bucle.<\/span> <span class=\"sg\" data-s=\"2\">El cuerpo del bucle se ejecuta una y otra vez mientras la prueba siga siendo <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"El valor actual del contador es $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>++<\/code> es un operador postfijo que aumenta su argumento en 1.<\/span> <span class=\"sg\" data-s=\"1\">Veremos más operadores en la segunda parte del curso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa ejecuta el cuerpo del bucle cinco veces.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nEl valor actual del contador es 0.\nEl valor actual del contador es 1.\nEl valor actual del contador es 2.\nEl valor actual del contador es 3.\nEl valor actual del contador es 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Algunas, o incluso todas, las declaraciones del encabezado de <code>loop<\/code> se pueden omitir.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, aquí está el mismo programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"El valor actual del contador es $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los bucles <code>loop<\/code> son probablemente los bucles menos usados en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlos, por ejemplo, en código que una herramienta tradujo automáticamente de C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Pero Raku tiene bucles más cómodos, como <code>for<\/code>, que veremos muy pronto.<\/span><\/p>"]]},"it":{"t":"Ciclo <code>loop<\/code> a tre istruzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'istruzione <code>loop<\/code> in Raku ha molto in comune con i cicli tradizionali del linguaggio di programmazione C e dei suoi parenti.<\/span> <span class=\"sg\" data-s=\"1\">Prende tre istruzioni: l'inizializzatore, il test e l'istruzione che cambia la variabile del ciclo.<\/span> <span class=\"sg\" data-s=\"2\">Il corpo del ciclo viene eseguito ripetutamente finché il test rimane <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Il valore attuale del contatore è $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui, <code>++<\/code> è un operatore postfisso che aumenta il suo argomento di 1.<\/span> <span class=\"sg\" data-s=\"1\">Vedremo altri operatori nella seconda parte del corso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma esegue il corpo del ciclo cinque volte.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nIl valore attuale del contatore è 0.\nIl valore attuale del contatore è 1.\nIl valore attuale del contatore è 2.\nIl valore attuale del contatore è 3.\nIl valore attuale del contatore è 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alcune, o anche tutte, le istruzioni nell'intestazione di <code>loop<\/code> possono essere omesse.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, ecco lo stesso programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Il valore attuale del contatore è $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I cicli <code>loop<\/code> sono probabilmente i cicli meno usati in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarli, per esempio, nel codice che uno strumento ha tradotto automaticamente da C a Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ma Raku ha cicli più comodi, come <code>for<\/code>, che vedremo molto presto.<\/span><\/p>"]]},"lv":{"t":"Trīs izteiksmju cikls","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> paziņojumam Raku valodā ir daudz kopīga ar tradicionālajiem cikliem C programmēšanas valodā un tās radiniekos.<\/span> <span class=\"sg\" data-s=\"1\">Tas pieņem trīs paziņojumus: inicializētāju, pārbaudi un paziņojumu, kas maina cikla mainīgo.<\/span> <span class=\"sg\" data-s=\"2\">Cikla ķermenis izpildās atkal un atkal, kamēr pārbaude paliek <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>++<\/code> ir postfix operators, kas palielina savu argumentu par 1.<\/span> <span class=\"sg\" data-s=\"1\">Kursa otrajā daļā mēs apskatīsim vairāk operatoru.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izpilda cikla ķermeni piecas reizes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažus vai pat visus paziņojumus <code>loop<\/code> galvenē var izlaist.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šeit ir tā pati programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>loop<\/code> cikli, iespējams, ir vismazāk izmantotie cikli Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tos var atrast, piemēram, kodā, ko kāds rīks automātiski pārtulkojis no C uz Raku.<\/span> <span class=\"sg\" data-s=\"2\">Taču Raku valodā ir ērtāki cikli, piemēram, <code>for<\/code>, ko mēs apskatīsim pavisam drīz.<\/span><\/p>"]]},"ru":{"t":"<code>loop<\/code> с тремя инструкциями","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> в Raku имеет много общего с традиционными циклами языка программирования C и его родственников.<\/span> <span class=\"sg\" data-s=\"1\">Он принимает три выражения: инициализатор, проверку и выражение, которое изменяет переменную цикла.<\/span> <span class=\"sg\" data-s=\"2\">Тело цикла выполняется снова и снова, пока проверка остаётся <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущее значение счетчика: $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>++<\/code> — это постфиксный оператор, который увеличивает свой аргумент на 1.<\/span> <span class=\"sg\" data-s=\"1\">Во второй части курса мы рассмотрим больше операторов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выполняет тело цикла пять раз.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущее значение счетчика: 0.\nТекущее значение счетчика: 1.\nТекущее значение счетчика: 2.\nТекущее значение счетчика: 3.\nТекущее значение счетчика: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Некоторые или даже все выражения в заголовке <code>loop<\/code> можно опустить.<\/span> <span class=\"sg\" data-s=\"1\">Например, вот та же программа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущее значение счетчика: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Циклы <code>loop<\/code> — это, вероятно, самые редко используемые циклы в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Их можно встретить, например, в коде, который инструмент автоматически перевёл с C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но в Raku есть более удобные циклы, такие как <code>for<\/code>, который мы рассмотрим очень скоро.<\/span><\/p>"]]},"uk":{"t":"Триопераційний цикл <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>loop<\/code> у Raku має багато спільного з традиційними циклами мови програмування C та її родичів.<\/span> <span class=\"sg\" data-s=\"1\">Він приймає три вирази: ініціалізатор, тест і вираз, який змінює змінну циклу.<\/span> <span class=\"sg\" data-s=\"2\">Тіло циклу виконується знову і знову, поки тест залишається <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Поточне значення лічильника: $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>++<\/code> — це постфіксний оператор, який збільшує свій аргумент на 1.<\/span> <span class=\"sg\" data-s=\"1\">Більше операторів ми розглянемо в другій частині курсу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виконує тіло циклу п'ять разів.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nПоточне значення лічильника: 0.\nПоточне значення лічильника: 1.\nПоточне значення лічильника: 2.\nПоточне значення лічильника: 3.\nПоточне значення лічильника: 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Деякі або навіть усі вирази в заголовку <code>loop<\/code> можна пропустити.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ось та сама програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Поточне значення лічильника: $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цикли <code>loop<\/code> — мабуть, найрідше вживані цикли в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Їх можна знайти, наприклад, у коді, який інструмент автоматично переклав з C на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Але в Raku є зручніші цикли, такі як <code>for<\/code>, які ми розглянемо дуже скоро.<\/span><\/p>"]]},"bg":{"t":"Тристатъментен цикъл <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>loop<\/code> в Raku има много общо с традиционните цикли на програмния език C и неговите родственици.<\/span> <span class=\"sg\" data-s=\"1\">Той приема три израза: инициализатор, тест и израз, който променя променливата на цикъла.<\/span> <span class=\"sg\" data-s=\"2\">Тялото на цикъла се изпълнява отново и отново, докато тестът остава <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"Текущата стойност на брояча е $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>++<\/code> е постфикс оператор, който увеличава аргумента си с 1.<\/span> <span class=\"sg\" data-s=\"1\">Ще разгледаме още оператори във втората част на курса.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата изпълнява тялото на цикъла пет пъти.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТекущата стойност на брояча е 0.\nТекущата стойност на брояча е 1.\nТекущата стойност на брояча е 2.\nТекущата стойност на брояча е 3.\nТекущата стойност на брояча е 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Някои или дори всички изрази в заглавието на <code>loop<\/code> могат да бъдат пропуснати.<\/span> <span class=\"sg\" data-s=\"1\">Например, ето същата програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"Текущата стойност на брояча е $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Циклите <code>loop<\/code> вероятно са най-рядко използваните цикли в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Можете да ги срещнете, например, в код, който някой инструмент е превел автоматично от C към Raku.<\/span> <span class=\"sg\" data-s=\"2\">Но Raku има по-удобни цикли, като <code>for<\/code>, които ще разгледаме много скоро.<\/span><\/p>"]]},"eo":{"t":"Trideklaro <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> deklaro en Raku havas multon komunan kun la tradiciaj bukloj de la programlingvo C kaj ĝiaj parencoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas tri deklarojn: la inicialigilon, la teston kaj la deklaron, kiu ŝanĝas la buklan variablon.<\/span> <span class=\"sg\" data-s=\"2\">La korpo de la buklo ruliĝas denove kaj denove, dum la testo restas <code>True<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>++<\/code> estas postfiksa operatoro, kiu pliigas sian argumenton je 1.<\/span> <span class=\"sg\" data-s=\"1\">Ni rigardos pli da operatoroj en la dua parto de la kurso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo rulas la korpon de la buklo kvin fojojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nLa nuna valoro de la kalkulilo estas 0.\nLa nuna valoro de la kalkulilo estas 1.\nLa nuna valoro de la kalkulilo estas 2.\nLa nuna valoro de la kalkulilo estas 3.\nLa nuna valoro de la kalkulilo estas 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iuj, aŭ eĉ ĉiuj, el la deklaroj en la kapo de <code>loop<\/code> povas esti preterlasitaj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, jen la sama programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"La nuna valoro de la kalkulilo estas $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>loop<\/code> bukloj estas probable la malplej uzataj bukloj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ilin, ekzemple, en kodo, kiun ilo aŭtomate tradukis de C al Raku.<\/span> <span class=\"sg\" data-s=\"2\">Sed Raku havas pli oportunajn buklojn, kiel <code>for<\/code>, kiun ni rigardos tre baldaŭ.<\/span><\/p>"]]},"la":{"t":"Tribus partibus <code>loop<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Enuntiatum <code>loop<\/code> in Raku multum commune habet cum ansis traditis linguae programmandi C et eius cognatarum.<\/span> <span class=\"sg\" data-s=\"1\">Tria enuntiata accipit: initiatorem, probationem, et enuntiatum quod variabilem ansae mutat.<\/span> <span class=\"sg\" data-s=\"2\">Corpus ansae iterum atque iterum currit dum probatio <code>True<\/code> manet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop (my $c = 0; $c &lt; 5; $c++) {\n    say \"The current value of the counter is $c.\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic, <code>++<\/code> est operator postfixus qui argumentum suum per 1 auget.<\/span> <span class=\"sg\" data-s=\"1\">Plures operatores in secunda parte cursus spectabimus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma corpus ansae quinquies exsequitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThe current value of the counter is 0.\nThe current value of the counter is 1.\nThe current value of the counter is 2.\nThe current value of the counter is 3.\nThe current value of the counter is 4.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliqua, vel etiam omnia, enuntiata in capite <code>loop<\/code> omitti possunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, hic est idem programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $c = 0;\nloop (; $c &lt; 5;) {\n    say \"The current value of the counter is $c.\";\n    $c++;\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><em> <\/em> *<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ansae <code>loop<\/code> sunt fortasse ansae minime usitatae in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Eas invenire potes, exempli gratia, in codice quem instrumentum automatice a C ad Raku convertit.<\/span> <span class=\"sg\" data-s=\"2\">Sed Raku commodiores ansas habet, sicut <code>for<\/code>, quam brevi spectabimus.<\/span><\/p>"]]}}}</script>
