<script type="application/json" id="page-data">{"u":"essentials/simple-input-output/say","n":24,"k":"topic","pv":"essentials/simple-input-output","nx":"essentials/simple-input-output/prompt","tr":["essentials","essentials/simple-input-output"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Output with say","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>say<\/code> function prints values to the standard output stream, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is also called a subroutine, or just a routine.<\/span> <span class=\"sg\" data-s=\"2\">If you run the program from a terminal, the output appears there.<\/span> <span class=\"sg\" data-s=\"3\">With online services, it goes to a special area of the web page.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is an example of using <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This line can be part of a bigger program or the whole program.<\/span> <span class=\"sg\" data-s=\"1\">Of course, it prints <code>42<\/code> to the output.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let us work with strings now:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And there it is: <code>Hello, World!<\/code> on the screen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> can take several arguments, so we can print more values at once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Just note that the parts are joined into one string: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So it is better to add a space between them.<\/span> <span class=\"sg\" data-s=\"2\">You should be able to solve this problem by now.<\/span> <span class=\"sg\" data-s=\"3\">For example, like this:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">After all the arguments, <code>say<\/code> adds a newline character to the output.<\/span><\/p>"]]},"de":{"t":"Ausgabe mit <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Die <code>say<\/code>-Funktion druckt Werte in den Standardausgabestream, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie heißt auch Subroutine oder einfach Routine.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie das Programm in einem Terminal ausführen, erscheint die Ausgabe dort.<\/span> <span class=\"sg\" data-s=\"3\">Bei Online-Diensten kommt sie in einen speziellen Bereich der Webseite.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel für die Verwendung von <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Zeile kann Teil eines größeren Programms oder das ganze Programm sein.<\/span> <span class=\"sg\" data-s=\"1\">Natürlich druckt sie <code>42<\/code> in die Ausgabe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Arbeiten wir nun mit Zeichenketten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und da ist es: <code>Hello, World!<\/code> auf dem Bildschirm.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> kann mehrere Argumente nehmen, sodass wir mehr Werte auf einmal drucken können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie nur, dass die Teile zu einer Zeichenkette verbunden werden: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb ist es besser, ein Leerzeichen dazwischen zu setzen.<\/span> <span class=\"sg\" data-s=\"2\">Sie sollten dieses Problem jetzt schon lösen können.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel so:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nach allen Argumenten fügt <code>say<\/code> ein Zeilenumbruchzeichen zur Ausgabe hinzu.<\/span><\/p>"]]},"nl":{"t":"Uitvoer met <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De functie <code>say<\/code> drukt waarden af naar de standaard uitvoerstream, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit heet ook een subroutine, of gewoon een routine.<\/span> <span class=\"sg\" data-s=\"2\">Als je het programma vanuit een terminal uitvoert, verschijnt de uitvoer daar.<\/span> <span class=\"sg\" data-s=\"3\">Bij online diensten gaat die naar een speciaal deel van de webpagina.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld van het gebruik van <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze regel kan deel zijn van een groter programma of het hele programma.<\/span> <span class=\"sg\" data-s=\"1\">Natuurlijk drukt hij <code>42<\/code> af naar de uitvoer.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we nu met strings werken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En daar is het: <code>Hello, World!<\/code> op het scherm.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> kan meerdere argumenten krijgen, dus we kunnen meer waarden tegelijk afdrukken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Let er wel op dat de delen worden samengevoegd tot "0\">Solo ten en cuenta que las partes se unen en una sola cadena: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que es mejor agregar un espacio entre ellas.<\/span> <span class=\"sg\" data-s=\"2\">Ya deberías poder resolver este problema.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Después de todos los argumentos, <code>say<\/code> agrega un carácter de nueva línea a la salida.<\/span><\/p>"]]},"it":{"t":"Output con <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>say<\/code> stampa valori sul flusso di output standard, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si chiama anche subroutine, o semplicemente routine.<\/span> <span class=\"sg\" data-s=\"2\">Se esegui il programma da un terminale, l'output appare lì.<\/span> <span class=\"sg\" data-s=\"3\">Con i servizi online, va in un'area speciale della pagina web.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio di utilizzo di <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa riga può essere parte di un programma più grande o l'intero programma.<\/span> <span class=\"sg\" data-s=\"1\">Naturalmente, stampa <code>42<\/code> sull'output.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lavoriamo ora con le stringhe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ed eccolo: <code>Hello, World!<\/code> sullo schermo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> può prendere più argomenti, quindi possiamo stampare più valori in una volta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota solo che le parti sono unite in una sola stringa: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi è meglio aggiungere uno spazio tra loro.<\/span> <span class=\"sg\" data-s=\"2\">Ormai dovresti saper risolvere questo problema.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, così:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dopo tutti gli argomenti, <code>say<\/code> aggiunge un carattere di nuova riga all'output.<\/span><\/p>"]]},"lv":{"t":"Izvade ar <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>say<\/code> izdrukā vērtības uz standarta izvades straumi, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">To sauc arī par apakšprogrammu jeb vienkārši rutīnu.<\/span> <span class=\"sg\" data-s=\"2\">Ja jūs palaižat programmu no termināļa, izvade parādās tur.<\/span> <span class=\"sg\" data-s=\"3\">Tiešsaistes pakalpojumos tā nonāk īpašā tīmekļa lapas apgabalā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir piemērs, kā izmantot <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī rinda var būt daļa no lielākas programmas vai visa programma.<\/span> <span class=\"sg\" data-s=\"1\">Protams, tā izdrukā <code>42<\/code> izvadē.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad strādāsim ar virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un te tas ir: <code>Hello, World!<\/code> uz ekrāna.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> var pieņemt vairākus argumentus, tāpēc mēs varam izdrukāt vairāk vērtību vienā reizē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tikai ņemiet vērā, ka daļas tiek apvienotas vienā virknē: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc labāk starp tām pievienot atstarpi.<\/span> <span class=\"sg\" data-s=\"2\">Jums jau vajadzētu prast atrisināt šo problēmu.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, šādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc visiem argumentiem <code>say<\/code> pievieno izvadei jaunas rindas rakstzīmi.<\/span><\/p>"]]},"ru":{"t":"Вывод с использованием <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функция <code>say<\/code> печатает значения в стандартный поток вывода, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Её также называют подпрограммой, или просто программой.<\/span> <span class=\"sg\" data-s=\"2\">Если вы запускаете программу из терминала, вывод появится там же.<\/span> <span class=\"sg\" data-s=\"3\">В онлайн-сервисах он попадает в особую часть веб-страницы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример использования <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта строка может быть как частью большей программы, так и целой программой.<\/span> <span class=\"sg\" data-s=\"1\">Конечно, она выводит <code>42<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь давайте попробуем поработать со строками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот и готово: <code>Hello, World!<\/code> на экране.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> может принимать несколько аргументов, так что мы можем вывести больше значений за один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Только заметьте, что части соединены в одну строку: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому лучше добавить между ними пробел.<\/span> <span class=\"sg\" data-s=\"2\">Сейчас вы уже должны уметь решить эту проблему.<\/span> <span class=\"sg\" data-s=\"3\">Например, вот так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После всех аргументов <code>say<\/code> добавляет в вывод символ новой строки.<\/span><\/p>"]]},"uk":{"t":"Вивід з <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функція <code>say<\/code> виводить значення в стандартний потік виводу, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Її також називають підпрограмою або просто рутиною.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ви запускаєте програму з терміналу, вивід з'являється там.<\/span> <span class=\"sg\" data-s=\"3\">В онлайн-сервісах він потрапляє в спеціальну область веб-сторінки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад використання <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей рядок може бути частиною більшої програми або всією програмою.<\/span> <span class=\"sg\" data-s=\"1\">Звісно, він виводить <code>42<\/code> на екран.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Працюємо зі рядками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">І ось результат: <code>Hello, World!<\/code> на екрані.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> може приймати кілька аргументів, тож ми можемо виводити більше значень за раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Просто зверніть увагу, що частини об'єднуються в один рядок: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому краще додати між ними пробіл.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже повинні вміти розв'язати цю проблему.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, ось так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Після всіх аргументів <code>say<\/code> додає до виводу символ нового рядка.<\/span><\/p>"]]},"bg":{"t":"Извеждане с <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>say<\/code> отпечатва стойности на стандартния изходен поток, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Наричат я също подпрограма, или просто рутина.<\/span> <span class=\"sg\" data-s=\"2\">Ако изпълнявате програмата от терминал, изходът се появява там.<\/span> <span class=\"sg\" data-s=\"3\">При онлайн услугите той отива в специална област на уеб страницата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за използване на <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този ред може да бъде част от по-голяма програма или цялата програма.<\/span> <span class=\"sg\" data-s=\"1\">Разбира се, той отпечатва <code>42<\/code> на изхода.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека сега работим със стрингове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И ето го: <code>Hello, World!<\/code> е на екрана.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> може да приеме няколко аргумента, така че можем да отпечатаме повече стойности наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Просто забележете, че частите са свързани в един стринг: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова е по-добре да добавите интервал между тях.<\/span> <span class=\"sg\" data-s=\"2\">Вече би трябвало да можете да решите този проблем.<\/span> <span class=\"sg\" data-s=\"3\">Например, по този начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">След всички аргументи <code>say<\/code> добавя символ за нов ред към изхода.<\/span><\/p>"]]},"eo":{"t":"Eligo per <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>say<\/code> presas valorojn al la norma eliga fluo, <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ nomiĝas subrutino, aŭ simple rutino.<\/span> <span class=\"sg\" data-s=\"2\">Se vi rulas la programon el terminalo, la eligo aperas tie.<\/span> <span class=\"sg\" data-s=\"3\">Kun retaj servoj, ĝi iras al speciala areo de la retpaĝo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de uzado de <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu linio povas esti parto de pli granda programo aŭ la tuta programo.<\/span> <span class=\"sg\" data-s=\"1\">Kompreneble, ĝi presas <code>42<\/code> al la eligo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni laboru kun ŝnuroj nun:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj jen ĝi: <code>Hello, World!<\/code> sur la ekrano.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> povas preni plurajn argumentojn, do ni povas presi pli da valoroj samtempe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Hello, World!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nur notu, ke la partoj estas kunigitaj en unu ŝnuron: <code>42Hello, World!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do estas pli bone aldoni spacon inter ili.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam devus povi solvi ĉi tiun problemon.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, tiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Hello, World!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post ĉiuj argumentoj, <code>say<\/code> aldonas novlinian signon al la eligo.<\/span><\/p>"]]},"la":{"t":"Output cum <code>say<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Functio <code>say<\/code> valores ad fluxum output standardum, <code>STDOUT<\/code>, imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Etiam subrutina vocatur, vel simpliciter rutina.<\/span> <span class=\"sg\" data-s=\"2\">Si programma e terminali curris, output ibi apparet.<\/span> <span class=\"sg\" data-s=\"3\">Cum officiis online, ad aream specialem paginae interretialis it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est exemplum utendi <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec linea pars maioris programmatis vel totum programma esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Certe <code>42<\/code> ad output imprimit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc cum stringis laboramus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Salve, Munde!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et ecce: <code>Salve, Munde!<\/code> in scrinio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>say<\/code> plura argumenta accipere potest, itaque plures valores simul imprimere possumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, 'Salve, Munde!';<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota tantum quod partes in unam stringam iunguntur: <code>42Salve, Munde!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque melius est spatium inter eas addere.<\/span> <span class=\"sg\" data-s=\"2\">Hanc quaestionem iam solvere posse debes.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, hoc modo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42, ' ', 'Salve, Munde!';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Post omnia argumenta, <code>say<\/code> characterem novae lineae ad output addit.<\/span><\/p>"]]}}}</script>
