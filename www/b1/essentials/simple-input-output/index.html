portanti.<\/span><\/p>"]]},"lv":{"t":"Vienkārša ievade un izvade","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Šis kurss sākas ar pašiem Raku pamatiem.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas pāriet pie arvien sarežģītākiem tematiem.<\/span> <span class=\"sg\" data-s=\"2\">Bet pat visvienkāršākajām programmām ir vajadzīga kāda ievade un izvade.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pirms mēs uzzinām Raku detaļas, iepazīsimies ar diviem pamatelementiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie izdrukā un nolasa datus.<\/span> <span class=\"sg\" data-s=\"2\">Iebūvētās funkcijas mēs apskatīsim vēlāk kursā.<\/span> <span class=\"sg\" data-s=\"3\">Bet pagaidām šeit ir divas vissvarīgākās no tām.<\/span><\/p>"]]},"ru":{"t":"Простой ввод и вывод","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот курс начинается с самых основ Raku.<\/span> <span class=\"sg\" data-s=\"1\">Затем он переходит ко всё более продвинутым темам.<\/span> <span class=\"sg\" data-s=\"2\">Но даже самым простым программам нужен какой-то ввод и вывод.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прежде чем мы узнаем подробности о Raku, давайте познакомимся с двумя базовыми элементами.<\/span> <span class=\"sg\" data-s=\"1\">Они печатают и читают данные.<\/span> <span class=\"sg\" data-s=\"2\">Встроенные функции мы рассмотрим позже в этом курсе.<\/span> <span class=\"sg\" data-s=\"3\">Но пока вот две самые важные из них.<\/span><\/p>"]]},"uk":{"t":"Простий ввід та вивід","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей курс починається з самих основ Raku.<\/span> <span class=\"sg\" data-s=\"1\">Потім він переходить до дедалі складніших тем.<\/span> <span class=\"sg\" data-s=\"2\">Але навіть найпростіші програми потребують певного вводу та виводу.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перш ніж ми вивчимо деталі Raku, давайте познайомимося з двома базовими елементами.<\/span> <span class=\"sg\" data-s=\"1\">Вони друкують і читають дані.<\/span> <span class=\"sg\" data-s=\"2\">Вбудовані функції ми розглянемо пізніше в курсі.<\/span> <span class=\"sg\" data-s=\"3\">Але поки що ось дві найважливіші з них.<\/span><\/p>"]]},"bg":{"t":"Просто въвеждане и извеждане","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Този курс започва от самите основи на Raku.<\/span> <span class=\"sg\" data-s=\"1\">След това преминава към все по-напреднали теми.<\/span> <span class=\"sg\" data-s=\"2\">Но дори най-простите програми изискват някакъв вход и изход.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Преди да научим подробностите за Raku, нека се запознаем с два основни елемента.<\/span> <span class=\"sg\" data-s=\"1\">Те отпечатват и четат данни.<\/span> <span class=\"sg\" data-s=\"2\">Ще разгледаме вградените функции по-късно в курса.<\/span> <span class=\"sg\" data-s=\"3\">Но засега ето двете най-важни от тях.<\/span><\/p>"]]},"eo":{"t":"Simpla enigo kaj eligo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu kurso komenciĝas per la plej bazaj aferoj de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi iras al pli kaj pli progresintaj temoj.<\/span> <span class=\"sg\" data-s=\"2\">Sed eĉ la plej simplaj programoj bezonas iom da enigo kaj eligo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni lernos la detalojn de Raku, ni konatiĝu kun du bazaj elementoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili presas kaj legas datumojn.<\/span> <span class=\"sg\" data-s=\"2\">Ni rigardos la enkonstruitajn funkciojn poste en la kurso.<\/span> <span class=\"sg\" data-s=\"3\">Sed por nun, jen la du plej gravaj.<\/span><\/p>"]]},"la":{"t":"Simplex initus et output","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic cursus a primis elementis Raku incipit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde ad argumenta magis magisque provecta progreditur.<\/span> <span class=\"sg\" data-s=\"2\">Sed etiam simplicissima programmata aliquem input et output requirunt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Antequam singula Raku discamus, duo elementa fundamentalia cognoscamus.<\/span> <span class=\"sg\" data-s=\"1\">Data imprimunt et legunt.<\/span> <span class=\"sg\" data-s=\"2\">Functiones in-builtas postea in cursu spectabimus.<\/span> <span class=\"sg\" data-s=\"3\">Sed nunc hic sunt duae praecipuae.<\/span><\/p>"]]}}}</script>
