<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Let op: <code>say<\/code> moet de strings kennen voordat het ze afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Daarom voert Raku eerst <code>prompt<\/code> uit.<\/span> <span class=\"sg\" data-s=\"2\">Zo blijft de dialoog in de juiste volgorde:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nWelke taal ga je leren? Raku\nJe gaat Raku leren<\/code><\/pre>"]]},"es":{"t":"Entrada con <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Lo contrario de <code>say<\/code> es <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Espera a que el usuario escriba algo y presione Enter.<\/span> <span class=\"sg\" data-s=\"2\">Luego envía la entrada al programa como una cadena.<\/span> <span class=\"sg\" data-s=\"3\">Puedes tomar el resultado de <code>prompt<\/code> y pasarlo a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Entonces el programa vuelve a imprimir lo que escribe el usuario.<\/span> <span class=\"sg\" data-s=\"5\">Vamos a escribir un programa así:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Si ejecutas este programa, quizás te confunda.<\/span> <span class=\"sg\" data-s=\"1\">El programa solo espera alguna entrada.<\/span> <span class=\"sg\" data-s=\"2\">Por eso es bueno imprimir un mensaje de prompt para el usuario.<\/span> <span class=\"sg\" data-s=\"3\">Esto hace que el programa sea más fácil de usar.<\/span> <span class=\"sg\" data-s=\"4\">No necesitas un <code>say<\/code> aparte para esto.<\/span> <span class=\"sg\" data-s=\"5\">Solo pasa el mensaje a <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt '¿Qué idioma vas a aprender? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Antes de terminar esta sección, vamos a juntar todas las piezas.<\/span> <span class=\"sg\" data-s=\"1\">Crearemos un programa qu pan class=\"sg\" data-s=\"2\">Quindi è bene stampare un messaggio di prompt per l'utente.<\/span> <span class=\"sg\" data-s=\"3\">Questo rende il programma più comodo per l'utente.<\/span> <span class=\"sg\" data-s=\"4\">Per questo non serve un <code>say<\/code> separato.<\/span> <span class=\"sg\" data-s=\"5\">Basta passare il messaggio a <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Quale lingua hai intenzione di imparare? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima di finire questa sezione, mettiamo insieme tutti i pezzi.<\/span> <span class=\"sg\" data-s=\"1\">Creeremo un programma che chiede che cosa vuole l'utente.<\/span> <span class=\"sg\" data-s=\"2\">Poi stampa una frase con il testo che l'utente ha inserito.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hai intenzione di imparare ', prompt 'Quale lingua hai intenzione di imparare? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se hai inserito <code>Raku<\/code>, il programma stampa la frase seguente:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai intenzione di imparare Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">OK, ora possiamo parlare con il programma.<\/span> <span class=\"sg\" data-s=\"1\">E possiamo farlo parlare con noi!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che <code>say<\/code> ha bisogno di conoscere le stringhe prima di stamparle.<\/span> <span class=\"sg\" data-s=\"1\">Quindi Raku esegue prima <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Così il dialogo resta nell'ordine corretto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nQuale lingua hai intenzione di imparare? Raku\nHai intenzione di imparare Raku<\/code><\/pre>"]]},"lv":{"t":"Ievade ar <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Pretstats <code>say<\/code> ir <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas gaida, līdz lietotājs kaut ko ievada un nospiež Enter.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam tas nosūta ievadi programmai kā virkni.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat ņemt <code>prompt<\/code> rezultātu un nodot to <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tad programma izdrukā atpakaļ to, ko lietotājs ievada.<\/span> <span class=\"sg\" data-s=\"5\">Uzrakstīsim šādu programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ja palaidīsiet šo programmu, tā jūs var samulsināt.<\/span> <span class=\"sg\" data-s=\"1\">Programma tikai gaida kādu ievadi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc ir labi izdrukāt lietotājam uzvednes ziņojumu.<\/span> <span class=\"sg\" data-s=\"3\">Tas padara programmu lietotājam draudzīgāku.<\/span> <span class=\"sg\" data-s=\"4\">Tam jums nav vajadzīgs atsevišķs <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vienkārši nododiet ziņojumu <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Kādu valodu jūs plānojat mācīties? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirms noslēdzam šo sadaļu, saliksim visas daļas kopā.<\/span> <span class=\"sg\" data-s=\"1\">Mēs izveidosim programmu, kas jautā, ko lietotājs vēlas.<\/span> <span class=\"sg\" data-s=\"2\">Tad tā izdrukā frāzi ar tekstu, ko lietotājs ievadīja.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Jūs plānojat mācīties ', prompt 'Kādu valodu jūs plānojat mācīties? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jūs ievadījāt <code>Raku<\/code>, programma izdrukā šādu frāzi:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs plānojat mācīties Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Labi, tagad mēs varam sarunāties ar programmu.<\/span> <span class=\"sg\" data-s=\"1\">Un mēs varam likt tai sarunāties ar mums!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ņemiet vērā, ka <code>say<\/code> ir jāzina virknes, pirms tas tās izdrukā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku vispirms izpilda <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tādējādi dialogs notiek pareizā secībā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nKādu valodu jūs plānojat mācīties? Raku\nJūs plānojat mācīties Raku<\/code><\/pre>"]]},"ru":{"t":"Ввод с использованием <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Противоположность <code>say<\/code> — это <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он ждёт, пока пользователь что-нибудь введёт и нажмёт Enter.<\/span> <span class=\"sg\" data-s=\"2\">Затем он передаёт ввод в программу в виде строки.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете взять результат <code>prompt<\/code> и передать его в <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тогда программа выводит обратно то, что вводит пользователь.<\/span> <span class=\"sg\" data-s=\"5\">Давайте напишем такую программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Если вы запустите эту программу, она может вас запутать.<\/span> <span class=\"sg\" data-s=\"1\">Программа просто ждёт какого-то ввода.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому хорошо напечатать для пользователя подсказку.<\/span> <span class=\"sg\" data-s=\"3\">Так программой удобнее пользоваться.<\/span> <span class=\"sg\" data-s=\"4\">Для этого не нужен отдельный <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Просто передайте сообщение в <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'What language are you going to learn? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Прежде чем закончить эту главу, давайте соберём все части вместе.<\/span> <span class=\"sg\" data-s=\"1\">Мы напишем программу, которая спрашивает, чего хочет пользователь.<\/span> <span class=\"sg\" data-s=\"2\">Затем она печатает фразу с текстом, который ввёл пользователь.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'You are going to learn ', prompt 'What language are you going to learn? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы ввели <code>Raku<\/code>, программа напечатает следующую фразу:<\/span><\/p>"],["code",0,"<pre><code>You are going to learn Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отлично, теперь мы можем говорить с программой.<\/span> <span class=\"sg\" data-s=\"1\">И можем заставить её говорить с нами!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что функции <code>say<\/code> нужно знать строки до того, как она их напечатает.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku сначала выполняет <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Благодаря этому диалог идёт в правильном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nWhat language are you going to learn? Raku\nYou are going to learn Raku<\/code><\/pre>"]]},"uk":{"t":"Ввід з <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Протилежністю до <code>say<\/code> є <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він чекає, поки користувач щось введе і натисне Enter.<\/span> <span class=\"sg\" data-s=\"2\">Потім він передає введені дані програмі у вигляді рядка.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете взяти результат <code>prompt<\/code> і передати його в <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тоді програма повторює на екрані те, що вводить користувач.<\/span> <span class=\"sg\" data-s=\"5\">Давайте напишемо таку програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Якщо ви запустите цю програму, вона може вас заплутати.<\/span> <span class=\"sg\" data-s=\"1\">Програма лише чекає на якийсь ввід.<\/span> <span class=\"sg\" data-s=\"2\">Тому добре вивести для користувача повідомлення-підказку.<\/span> <span class=\"sg\" data-s=\"3\">Це робить програму зручнішою для користувача.<\/span> <span class=\"sg\" data-s=\"4\">Вам не потрібен окремий <code>say<\/code> для цього.<\/span> <span class=\"sg\" data-s=\"5\">Просто передайте повідомлення в <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Яку мову ви збираєтеся вивчати? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перш ніж закінчити цей розділ, давайте з'єднаємо всі частини.<\/span> <span class=\"sg\" data-s=\"1\">Ми створимо програму, яка питає, чого хоче користувач.<\/span> <span class=\"sg\" data-s=\"2\">Потім вона виводить фразу з текстом, який ввів користувач.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Ви збираєтеся вивчати ', prompt 'Яку мову ви збираєтеся вивчати? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви ввели <code>Raku<\/code>, програма виводить таку фразу:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви збираєтеся вивчати Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добре, тепер ми можемо спілкуватися з програмою.<\/span> <span class=\"sg\" data-s=\"1\">І можемо зробити так, щоб вона спілкувалася з нами!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що <code>say<\/code> має знати рядки, перш ніж їх надрукувати.<\/span> <span class=\"sg\" data-s=\"1\">Тому Raku спочатку виконує <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так діалог іде в правильному порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nЯку мову ви збираєтеся вивчати? Raku\nВи збираєтеся вивчати Raku<\/code><\/pre>"]]},"bg":{"t":"Въвеждане с <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Обратното на <code>say<\/code> е <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То чака, докато потребителят въведе нещо и натисне Enter.<\/span> <span class=\"sg\" data-s=\"2\">След това изпраща входа към програмата като низ.<\/span> <span class=\"sg\" data-s=\"3\">Можете да вземете резултата от <code>prompt<\/code> и да го предадете на <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тогава програмата отпечатва обратно това, което потребителят пише.<\/span> <span class=\"sg\" data-s=\"5\">Нека напишем такава програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ако изпълните тази програма, тя може да ви обърка.<\/span> <span class=\"sg\" data-s=\"1\">Програмата само чака някакъв вход.<\/span> <span class=\"sg\" data-s=\"2\">Затова е добре да отпечатате съобщение за подкана за потребителя.<\/span> <span class=\"sg\" data-s=\"3\">Така програмата става по-удобна за потребителя.<\/span> <span class=\"sg\" data-s=\"4\">Не ви трябва отделно <code>say<\/code> за това.<\/span> <span class=\"sg\" data-s=\"5\">Просто предайте съобщението на <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Какъв език ще учите? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Преди да завършим този раздел, нека съберем всички части заедно.<\/span> <span class=\"sg\" data-s=\"1\">Ще създадем програма, която пита какво иска потребителят.<\/span> <span class=\"sg\" data-s=\"2\">След това тя отпечатва фраза с текста, който потребителят е въвел.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Ще учите ', prompt 'Какъв език ще учите? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако сте въвели <code>Raku<\/code>, програмата отпечатва следната фраза:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще учите Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добре, сега можем да говорим с програмата.<\/span> <span class=\"sg\" data-s=\"1\">И можем да я накараме да говори с нас!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че <code>say<\/code> трябва да знае низовете, преди да ги отпечата.<\/span> <span class=\"sg\" data-s=\"1\">Затова Raku първо изпълнява <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така диалогът остава в правилния ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nКакъв език ще учите? Raku\nЩе учите Raku<\/code><\/pre>"]]},"eo":{"t":"Enigo per <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La malo de <code>say<\/code> estas <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi atendas, ĝis la uzanto tajpas ion kaj premas Enter.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi sendas la enigon al la programo kiel ĉenon.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas preni la rezulton de <code>prompt<\/code> kaj transdoni ĝin al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la programo presas reen tion, kion la uzanto tajpas.<\/span> <span class=\"sg\" data-s=\"5\">Ni skribu tian programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Se vi rulas ĉi tiun programon, ĝi eble konfuzos vin.<\/span> <span class=\"sg\" data-s=\"1\">La programo nur atendas iun enigon.<\/span> <span class=\"sg\" data-s=\"2\">Do estas bone presi promptan mesaĝon por la uzanto.<\/span> <span class=\"sg\" data-s=\"3\">Tio faras la programon pli oportuna por la uzanto.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne bezonas apartan <code>say<\/code> por tio.<\/span> <span class=\"sg\" data-s=\"5\">Simple transdonu la mesaĝon al <code>prompt<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Kiun lingvon vi intencas lerni? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Antaŭ ol ni finos ĉi tiun sekcion, ni kunmetu ĉiujn partojn.<\/span> <span class=\"sg\" data-s=\"1\">Ni kreos programon, kiu demandas, kion la uzanto volas.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi presas frazon kun la teksto, kiun la uzanto enigis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Vi intencas lerni ', prompt 'Kiun lingvon vi intencas lerni? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi enigis <code>Raku<\/code>, la programo presas la jenan frazon:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi intencas lerni Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bone, ni povas paroli al la programo nun.<\/span> <span class=\"sg\" data-s=\"1\">Kaj ni povas igi ĝin paroli al ni!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>say<\/code> bezonas koni la ĉenojn antaŭ ol presi ilin.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku unue rulas <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio tenas la dialogon en la ĝusta ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nKiun lingvon vi intencas lerni? Raku\nVi intencas lerni Raku<\/code><\/pre>"]]},"la":{"t":"Initus cum <code>prompt<\/code>","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Contrarium verbi <code>say<\/code> est <code>prompt<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exspectat donec usor aliquid scribit et Enter premit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde input ad programma ut stringam mittit.<\/span> <span class=\"sg\" data-s=\"3\">Eventum <code>prompt<\/code> capere et verbo <code>say<\/code> tradere potes.<\/span> <span class=\"sg\" data-s=\"4\">Tum programma rursus imprimit quod usor scribit.<\/span> <span class=\"sg\" data-s=\"5\">Tale programma scribamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say prompt;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Si hoc programma curris, te confundere potest.<\/span> <span class=\"sg\" data-s=\"1\">Programma solum aliquod input exspectat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque bonum est nuntium rogationis pro usore imprimere.<\/span> <span class=\"sg\" data-s=\"3\">Hoc programma usori amicius facit.<\/span> <span class=\"sg\" data-s=\"4\">Ad hoc separatam <code>say<\/code> non requiris.<\/span> <span class=\"sg\" data-s=\"5\">Nuntium tantum verbo <code>prompt<\/code> trade:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>prompt 'Quam linguam discere vis? '<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Antequam hanc sectionem finiamus, omnes partes componamus.<\/span> <span class=\"sg\" data-s=\"1\">Programma creabimus quod rogat quid usor velit.<\/span> <span class=\"sg\" data-s=\"2\">Deinde locutionem cum textu quem usor inseruit imprimit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Discere vis ', prompt 'Quam linguam discere vis? ';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si <code>Raku<\/code> inseruisti, programma locutionem sequentem imprimit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Discere vis Raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bene, nunc cum programmate loqui possumus.<\/span> <span class=\"sg\" data-s=\"1\">Et id nobiscum loqui iubere possumus!<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod <code>say<\/code> stringas scire debet antequam eas imprimat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku primum <code>prompt<\/code> exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Sic colloquium in ordine recto manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nQuam linguam discere vis? Raku\nDiscere vis Raku<\/code><\/pre>"]]}}}</script>
