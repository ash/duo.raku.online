<script type="application/json" id="page-data">{"u":"essentials/on-unicode","n":13,"k":"section","pv":"essentials/hello-world","nx":"essentials/running-programs","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Notes on using Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku assumes that all your program files are saved in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">In practice, you don’t have to worry about non-ASCII characters.<\/span> <span class=\"sg\" data-s=\"2\">For example, you can use them in string literals.<\/span> <span class=\"sg\" data-s=\"3\">But that is not all.<\/span> <span class=\"sg\" data-s=\"4\">Reading a UTF-8 text file is most likely no problem either.<\/span> <span class=\"sg\" data-s=\"5\">It also means that Raku gets the length of a string right.<\/span> <span class=\"sg\" data-s=\"6\">It counts characters, not bytes.<\/span> <span class=\"sg\" data-s=\"7\">We will look at this in more detail later.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is the next thing you should know.<\/span> <span class=\"sg\" data-s=\"1\">Identifiers, or names, can have non-Latin or non-English letters.<\/span> <span class=\"sg\" data-s=\"2\">If you like, you can name your variable <code>$ι<\/code> instead of <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The compiler will read it correctly.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku is quite strict about the Unicode properties of characters.<\/span> <span class=\"sg\" data-s=\"1\">For example, it knows if a character is a letter or a digit.<\/span> <span class=\"sg\" data-s=\"2\">It also knows which characters form pairs, like parentheses and other brackets.<\/span> <span class=\"sg\" data-s=\"3\">Often, different parts of the program can use different types of brackets.<\/span> <span class=\"sg\" data-s=\"4\">For example, let us change our ‘Hello, World!’ program.<\/span> <span class=\"sg\" data-s=\"5\">We can use these non-Latin quotes in it.<\/span> <span class=\"sg\" data-s=\"6\">You will see them again when we work with Raku grammars:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Some built-in operators have two forms: Unicode and ASCII.<\/span> <span class=\"sg\" data-s=\"1\">For example, you can type ‘not equal’ as <code>!=<\/code> or as <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The same is true for set operations.<\/span> <span class=\"sg\" data-s=\"3\">For example, <code>∈<\/code> has a pure ASCII version, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Also, you can refer to a built-in constant as <code>pi<\/code> or <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With numbers, you can use fractions such as <code>½<\/code> instead of <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can also get the square of <code>$x<\/code> with a superscript character: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">See the full list of such pairs in the documentation: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"de":{"t":"Hinweise zur Verwendung von Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku geht davon aus, dass alle Ihre Programmdateien in UTF-8 gespeichert sind.<\/span> <span class=\"sg\" data-s=\"1\">In der Praxis müssen Sie sich keine Sorgen um Nicht-ASCII-Zeichen machen.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel können Sie sie in Zeichenkettenliteralen verwenden.<\/span> <span class=\"sg\" data-s=\"3\">Aber das ist nicht alles.<\/span> <span class=\"sg\" data-s=\"4\">Auch das Lesen einer UTF-8-Textdatei ist höchstwahrscheinlich kein Problem.<\/span> <span class=\"sg\" data-s=\"5\">Es bedeutet auch, dass Raku die Länge einer Zeichenkette richtig erkennt.<\/span> <span class=\"sg\" data-s=\"6\">Es zählt Zeichen, nicht Bytes.<\/span> <span class=\"sg\" data-s=\"7\">Wir werden uns das später genauer ansehen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist das Nächste, was Sie wissen sollten.<\/span> <span class=\"sg\" data-s=\"1\">Bezeichner, also Namen, können nicht-lateinische oder nicht-englische Buchstaben enthalten.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie möchten, können Sie Ihre Variable <code>$ι<\/code> statt <code>$i<\/code> nennen.<\/span> <span class=\"sg\" data-s=\"3\">Der Compiler wird sie richtig lesen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ist bei den Unicode-Eigenschaften von Zeichen ziemlich streng.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel weiß es, ob ein Zeichen ein Buchstabe oder eine Ziffer ist.<\/span> <span class=\"sg\" data-s=\"2\">Es weiß auch, welche Zeichen Paare bilden, wie runde und andere Klammern.<\/span> <span class=\"sg\" data-s=\"3\">Oft können verschiedene Teile des Programms verschiedene Arten von Klammern benutzen.<\/span> <span class=\"sg\" data-s=\"4\">Ändern wir zum Beispiel unser „Hello, World!“-Programm.<\/span> <span class=\"sg\" data-s=\"5\">Wir können darin diese nicht-lateinischen Anführungszeichen verwenden.<\/span> <span class=\"sg\" data-s=\"6\">Sie werden sie wiedersehen, wenn wir mit Raku-Grammatiken arbeiten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Einige eingebaute Operatoren haben zwei Formen: Unicode und ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel können Sie „ungleich“ als <code>!=<\/code> oder als <code>≠<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Dasselbe gilt für Mengenoperationen.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel hat <code>∈<\/code> eine reine ASCII-Version, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Außerdem können Sie eine eingebaute Konstante als <code>pi<\/code> oder <code>π<\/code> schreiben.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei Zahlen können Sie Brüche wie <code>½<\/code> statt <code>0.5<\/code> verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Das Quadrat von <code>$x<\/code> bekommen Sie auch mit einem hochgestellten Zeichen: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die vollständige Liste solcher Paare finden Sie in der Dokumentation: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII-Symbole<\/a>.<\/span><\/p>"]]},"nl":{"t":"Opmerkingen over het gebruik van Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku gaat ervan uit dat al je programmabestanden in UTF-8 zijn opgeslagen.<\/span> <span class=\"sg\" data-s=\"1\">In de praktijk hoef je je geen zorgen te maken over niet-ASCII-tekens.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze bijvoorbeeld in string-literals gebruiken.<\/span> <span class=\"sg\" data-s=\"3\">Maar dat is niet alles.<\/span> <span class=\"sg\" data-s=\"4\">Een UTF-8-tekstbestand lezen is waarschijnlijk ook geen probleem.<\/span> <span class=\"sg\" data-s=\"5\">Het betekent ook dat Raku de lengte van een string goed bepaalt.<\/span> <span class=\"sg\" data-s=\"6\">Het telt tekens, geen bytes.<\/span> <span class=\"sg\" data-s=\"7\">We bekijken dit later in meer detail.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is het volgende wat je moet weten.<\/span> <span class=\"sg\" data-s=\"1\">Identificatoren, of namen, kunnen niet-Latijnse of niet-Engelse letters hebben.<\/span> <span class=\"sg\" data-s=\"2\">Als je wilt, kun je je variabele <code>$ι<\/code> noemen in plaats van <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De compiler zal dat goed lezen.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku is vrij streng met de Unicode-eigenschappen van tekens.<\/span> <span class=\"sg\" data-s=\"1\">Het weet bijvoorbeeld of een teken een letter of een cijfer is.<\/span> <span class=\"sg\" data-s=\"2\">Het weet ook welke tekens paren vormen, zoals haakjes en andere haken.<\/span> <span class=\"sg\" data-s=\"3\">Vaak kunnen verschillende delen van het programma verschillende soorten haakjes gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Laten we bijvoorbeeld ons 'Hello, World!'-programma aanpassen.<\/span> <span class=\"sg\" data-s=\"5\">We kunnen er deze niet-Latijnse aanhalingstekens in gebruiken.<\/span> <span class=\"sg\" data-s=\"6\">Je ziet ze terug als we met Raku-grammatica's werken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sommige ingebouwde operators hebben twee vormen: Unicode en ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ‘niet gelijk’ bijvoorbeeld typen als <code>!=<\/code> of als <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde geldt voor setbewerkingen.<\/span> <span class=\"sg\" data-s=\"3\"><code>∈<\/code> heeft bijvoorbeeld een pure ASCII-versie, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ook kun je een ingebouwde constante aanduiden als <code>pi<\/code> of <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bij getallen kun je breuken zoals <code>½<\/code> gebruiken in plaats van <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ook het kwadraat van <code>$x<\/code> krijgen met een superscript-teken: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bekijk de volledige lijst van zulke paren in de documentatie: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbolen<\/a>.<\/span><\/p>"]]},"es":{"t":"Notas sobre el uso de Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku asume que todos tus archivos de programa están guardados en UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">En la práctica, no tienes que preocuparte por los caracteres que no son ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, puedes usarlos en literales de cadena.<\/span> <span class=\"sg\" data-s=\"3\">Pero eso no es todo.<\/span> <span class=\"sg\" data-s=\"4\">Leer un archivo de texto UTF-8 seguramente tampoco será un problema.<\/span> <span class=\"sg\" data-s=\"5\">También significa que Raku calcula bien la longitud de una cadena.<\/span> <span class=\"sg\" data-s=\"6\">Cuenta caracteres, no bytes.<\/span> <span class=\"sg\" data-s=\"7\">Lo veremos con más detalle más adelante.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esto es lo siguiente que debes saber.<\/span> <span class=\"sg\" data-s=\"1\">Los identificadores, o nombres, pueden tener letras no latinas o no inglesas.<\/span> <span class=\"sg\" data-s=\"2\">Si quieres, puedes llamar a tu variable <code>$ι<\/code> en lugar de <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El compilador la leerá correctamente.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku es bastante estricto con las propiedades Unicode de los caracteres.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, sabe si un carácter es una letra o un dígito.<\/span> <span class=\"sg\" data-s=\"2\">También sabe qué caracteres forman pares, como los paréntesis y otros tipos de corchetes.<\/span> <span class=\"sg\" data-s=\"3\">A menudo, partes diferentes del programa pueden usar tipos diferentes de corchetes.<\/span> <span class=\"sg\" data-s=\"4\">Por ejemplo, vamos a cambiar nuestro programa ‘¡Hola, Mundo!’.<\/span> <span class=\"sg\" data-s=\"5\">Podemos usar en él estas comillas no latinas.<\/span> <span class=\"sg\" data-s=\"6\">Las verás de nuevo cuando trabajemos con gramáticas de Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Algunos operadores integrados tienen dos formas: Unicode y ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, puedes escribir ‘distinto’ como <code>!=<\/code> o como <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo mismo pasa con las operaciones de conjuntos.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, <code>∈<\/code> tiene una versión solo ASCII, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Además, puedes referirte a una constante integrada como <code>pi<\/code> o <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con números, puedes usar fracciones como <code>½<\/code> en lugar de <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También puedes obtener el cuadrado de <code>$x<\/code> con un carácter en superíndice: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mira la lista completa de estos pares en la documentación: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Símbolos Unicode versus ASCII<\/a>.<\/span><\/p>"]]},"it":{"t":"Note sull'uso di Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku presume che tutti i file del tuo programma siano salvati in UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">In pratica, non devi preoccuparti dei caratteri non ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, puoi usarli nei letterali di stringa.<\/span> <span class=\"sg\" data-s=\"3\">Ma non è tutto.<\/span> <span class=\"sg\" data-s=\"4\">Molto probabilmente, anche leggere un file di testo UTF-8 non è un problema.<\/span> <span class=\"sg\" data-s=\"5\">Significa anche che Raku calcola bene la lunghezza di una stringa.<\/span> <span class=\"sg\" data-s=\"6\">Conta i caratteri, non i byte.<\/span> <span class=\"sg\" data-s=\"7\">Ne parleremo più in dettaglio in seguito.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco la prossima cosa che dovresti sapere.<\/span> <span class=\"sg\" data-s=\"1\">Gli identificatori, o nomi, possono avere lettere non latine o non inglesi.<\/span> <span class=\"sg\" data-s=\"2\">Se vuoi, puoi chiamare la tua variabile <code>$ι<\/code> invece di <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il compilatore la leggerà correttamente.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku è piuttosto rigoroso con le proprietà Unicode dei caratteri.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, sa se un carattere è una lettera o una cifra.<\/span> <span class=\"sg\" data-s=\"2\">Sa anche quali caratteri formano coppie, come le parentesi tonde e gli altri tipi di parentesi.<\/span> <span class=\"sg\" data-s=\"3\">Spesso parti diverse del programma possono usare tipi diversi di parentesi.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, cambiamo il nostro programma ‘Hello, World!’.<\/span> <span class=\"sg\" data-s=\"5\">Nel programma possiamo usare queste virgolette non latine.<\/span> <span class=\"sg\" data-s=\"6\">Le vedrai di nuovo quando lavoreremo con le grammatiche Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Alcuni operatori integrati hanno due forme: Unicode e ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, puoi digitare ‘non uguale’ come <code>!=<\/code> o come <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso vale per le operazioni sugli insiemi.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, <code>∈<\/code> ha una versione solo ASCII, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Inoltre, puoi indicare una costante integrata come <code>pi<\/code> o <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con i numeri, puoi usare frazioni come <code>½<\/code> invece di <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche ottenere il quadrato di <code>$x<\/code> con un carattere apice: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vedi l'elenco completo di queste coppie nella documentazione: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Simboli Unicode contro ASCII<\/a>.<\/span><\/p>"]]},"lv":{"t":"Piezīmes par Unicode izmantošanu","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku pieņem, ka visi jūsu programmu faili ir saglabāti UTF-8 kodējumā.<\/span> <span class=\"sg\" data-s=\"1\">Praksē jums nav jāuztraucas par ne-ASCII rakstzīmēm.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, jūs varat tās lietot virknes literāļos.<\/span> <span class=\"sg\" data-s=\"3\">Bet tas nav viss.<\/span> <span class=\"sg\" data-s=\"4\">Arī UTF-8 teksta faila lasīšana, visticamāk, nesagādās problēmas.<\/span> <span class=\"sg\" data-s=\"5\">Tas arī nozīmē, ka Raku pareizi nosaka virknes garumu.<\/span> <span class=\"sg\" data-s=\"6\">Tas skaita rakstzīmes, nevis baitus.<\/span> <span class=\"sg\" data-s=\"7\">Sīkāk mēs to apskatīsim vēlāk.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir nākamā lieta, kas jums būtu jāzina.<\/span> <span class=\"sg\" data-s=\"1\">Identifikatoros jeb nosaukumos var būt ne-latīņu vai ne-angļu burti.<\/span> <span class=\"sg\" data-s=\"2\">Ja vēlaties, varat nosaukt savu mainīgo <code>$ι<\/code>, nevis <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Kompilators to pareizi nolasīs.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku ir diezgan stingrs attiecībā uz rakstzīmju Unicode īpašībām.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tas zina, vai rakstzīme ir burts vai cipars.<\/span> <span class=\"sg\" data-s=\"2\">Tas arī zina, kuras rakstzīmes veido pārus, piemēram, apaļās un citas iekavas.<\/span> <span class=\"sg\" data-s=\"3\">Bieži dažādās programmas daļās var lietot dažāda veida iekavas.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, pārveidosim mūsu \"Hello, World!\" programmu.<\/span> <span class=\"sg\" data-s=\"5\">Tajā varam lietot šīs ne-latīņu pēdiņas.<\/span> <span class=\"sg\" data-s=\"6\">Jūs tās redzēsiet atkal, kad strādāsim ar Raku gramatikām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažiem iebūvētiem operatoriem ir divas formas: Unicode un ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, ‘nav vienāds’ var rakstīt kā <code>!=<\/code> vai kā <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats attiecas uz kopu operācijām.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, operatoram <code>∈<\/code> ir tīra ASCII versija, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Arī iebūvēto konstanti var saukt gan par <code>pi<\/code>, gan par <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar skaitļiem jūs varat lietot daļskaitļus, piemēram, <code>½<\/code>, nevis <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat arī iegūt <code>$x<\/code> kvadrātu ar augšraksta rakstzīmi: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pilnu šādu pāru sarakstu skatiet dokumentācijā: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"ru":{"t":"Заметки по использованию Юникода","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku предполагает, что все файлы вашей программы сохранены в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">На практике вам не нужно волноваться о символах не из ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Например, вы можете использовать их в строках.<\/span> <span class=\"sg\" data-s=\"3\">Но это не всё.<\/span> <span class=\"sg\" data-s=\"4\">Если программа читает текстовый файл в UTF-8, это, скорее всего, тоже не проблема.<\/span> <span class=\"sg\" data-s=\"5\">Это также значит, что Raku правильно определяет длину строки.<\/span> <span class=\"sg\" data-s=\"6\">Он считает символы, а не байты.<\/span> <span class=\"sg\" data-s=\"7\">Позже мы рассмотрим это подробнее.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот следующее, что вам стоит знать.<\/span> <span class=\"sg\" data-s=\"1\">В идентификаторах, то есть именах, могут быть нелатинские или неанглийские буквы.<\/span> <span class=\"sg\" data-s=\"2\">Если хотите, вы можете назвать свою переменную <code>$и<\/code> вместо <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилятор правильно её прочитает.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku довольно строго относится к свойствам символов в Юникоде.<\/span> <span class=\"sg\" data-s=\"1\">Например, он знает, является ли символ буквой или цифрой.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он знает, какие символы образуют пары, например круглые и другие скобки.<\/span> <span class=\"sg\" data-s=\"3\">Часто в разных частях программы можно использовать разные виды скобок.<\/span> <span class=\"sg\" data-s=\"4\">Например, давайте изменим нашу программу \"Привет, Мир!\".<\/span> <span class=\"sg\" data-s=\"5\">Мы можем использовать в ней эти нелатинские кавычки.<\/span> <span class=\"sg\" data-s=\"6\">Вы снова увидите их, когда мы будем работать с грамматиками Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У некоторых встроенных операторов есть две формы: Юникод и ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Например, «не равно» можно набрать как <code>!=<\/code> или как <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">То же самое верно для операций над множествами.<\/span> <span class=\"sg\" data-s=\"3\">Например, у <code>∈<\/code> есть вариант только из ASCII — <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">А ещё к встроенной константе можно обращаться как <code>pi<\/code> или <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С числами вы можете использовать дроби, например <code>½<\/code> вместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Также можно получить квадрат <code>$x<\/code> с помощью символа в верхнем индексе: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Полный список таких пар смотрите в документации: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Юникод и ASCII символы<\/a>.<\/span><\/p>"]]},"uk":{"t":"Примітки щодо використання Юнікоду","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku вважає, що всі файли ваших програм збережені в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">На практиці вам не треба хвилюватися про символи поза ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, ви можете використовувати їх у рядкових літералах.<\/span> <span class=\"sg\" data-s=\"3\">Але це не все.<\/span> <span class=\"sg\" data-s=\"4\">Читання текстового файлу в UTF-8, найімовірніше, теж не буде проблемою.<\/span> <span class=\"sg\" data-s=\"5\">Це також означає, що Raku правильно визначає довжину рядка.<\/span> <span class=\"sg\" data-s=\"6\">Він рахує символи, а не байти.<\/span> <span class=\"sg\" data-s=\"7\">Ми розглянемо це детальніше пізніше.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось наступне, що вам варто знати.<\/span> <span class=\"sg\" data-s=\"1\">Ідентифікатори, тобто імена, можуть містити нелатинські або неанглійські літери.<\/span> <span class=\"sg\" data-s=\"2\">Якщо хочете, можете назвати свою змінну <code>$ι<\/code> замість <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компілятор правильно її прочитає.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku досить суворо ставиться до властивостей символів Unicode.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, він знає, чи є символ літерою або цифрою.<\/span> <span class=\"sg\" data-s=\"2\">Він також знає, які символи утворюють пари, як круглі та інші дужки.<\/span> <span class=\"sg\" data-s=\"3\">Часто різні частини програми можуть використовувати різні види дужок.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, давайте змінимо нашу програму «Hello, World!».<\/span> <span class=\"sg\" data-s=\"5\">Ми можемо використати в ній ці нелатинські лапки.<\/span> <span class=\"sg\" data-s=\"6\">Ви побачите їх знову, коли ми працюватимемо з граматиками Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Деякі вбудовані оператори мають дві форми: Unicode і ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, «не дорівнює» можна набрати як <code>!=<\/code> або як <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Те саме стосується операцій з множинами.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, <code>∈<\/code> має чисту ASCII-версію, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Також до вбудованої константи можна звертатися як <code>pi<\/code> або <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З числами можна використовувати дроби, наприклад <code>½<\/code> замість <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Також можна отримати квадрат <code>$x<\/code> за допомогою символу надрядкового індексу: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повний список таких пар дивіться в документації: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode versus ASCII symbols<\/a>.<\/span><\/p>"]]},"bg":{"t":"Бележки относно използването на Unicode","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku приема, че всичките ви програмни файлове са запазени в UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">На практика не трябва да се притеснявате за не-ASCII символи.<\/span> <span class=\"sg\" data-s=\"2\">Например можете да ги използвате в низови литерали.<\/span> <span class=\"sg\" data-s=\"3\">Но това не е всичко.<\/span> <span class=\"sg\" data-s=\"4\">Четенето на текстов файл в UTF-8 най-вероятно също не е проблем.<\/span> <span class=\"sg\" data-s=\"5\">Това означава също, че Raku намира правилно дължината на низа.<\/span> <span class=\"sg\" data-s=\"6\">Той брои символи, а не байтове.<\/span> <span class=\"sg\" data-s=\"7\">Ще разгледаме това по-подробно по-късно.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето следващото нещо, което трябва да знаете.<\/span> <span class=\"sg\" data-s=\"1\">Идентификаторите, или имената, могат да имат не-латински или не-английски букви.<\/span> <span class=\"sg\" data-s=\"2\">Ако искате, можете да наречете вашата променлива <code>$ι<\/code> вместо <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилаторът ще я прочете правилно.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku е доста строг към Unicode свойствата на символите.<\/span> <span class=\"sg\" data-s=\"1\">Например той знае дали един символ е буква или цифра.<\/span> <span class=\"sg\" data-s=\"2\">Знае също кои символи образуват двойки, като кръглите и другите видове скоби.<\/span> <span class=\"sg\" data-s=\"3\">Често различни части на програмата могат да използват различни видове скоби.<\/span> <span class=\"sg\" data-s=\"4\">Например нека променим нашата програма „Hello, World!“.<\/span> <span class=\"sg\" data-s=\"5\">Можем да използваме в нея тези не-латински кавички.<\/span> <span class=\"sg\" data-s=\"6\">Ще ги видите отново, когато работим с граматиките на Raku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Някои вградени оператори имат две форми: Unicode и ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Например можете да напишете „не е равно“ като <code>!=<\/code> или като <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Същото важи и за операциите с множества.<\/span> <span class=\"sg\" data-s=\"3\">Например <code>∈<\/code> има чисто ASCII версия, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Освен това можете да наричате една вградена константа <code>pi<\/code> или <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При числата можете да използвате дроби като <code>½<\/code> вместо <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете също да получите квадрата на <code>$x<\/code> с надписан символ: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вижте пълния списък на такива двойки в документацията: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unicode срещу ASCII символи<\/a>.<\/span><\/p>"]]},"eo":{"t":"Notoj pri uzado de Unikodo","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku supozas, ke ĉiuj viaj programdosieroj estas konservitaj en UTF-8.<\/span> <span class=\"sg\" data-s=\"1\">En praktiko, vi ne devas zorgi pri ne-ASCII-karakteroj.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, vi povas uzi ilin en ŝnurliteraloj.<\/span> <span class=\"sg\" data-s=\"3\">Sed tio ne estas ĉio.<\/span> <span class=\"sg\" data-s=\"4\">Legi UTF-8-tekstdosieron plej verŝajne ankaŭ ne estas problemo.<\/span> <span class=\"sg\" data-s=\"5\">Tio ankaŭ signifas, ke Raku ĝuste trovas la longecon de ŝnuro.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi kalkulas karakterojn, ne bajtojn.<\/span> <span class=\"sg\" data-s=\"7\">Ni rigardos tion pli detale poste.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen la sekva afero, kiun vi devus scii.<\/span> <span class=\"sg\" data-s=\"1\">Identigiloj, aŭ nomoj, povas havi ne-latinajn aŭ ne-anglajn literojn.<\/span> <span class=\"sg\" data-s=\"2\">Se vi volas, vi povas nomi vian variablon <code>$ι<\/code> anstataŭ <code>$i<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La kompililo ĝuste legos ĝin.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku estas sufiĉe strikta pri la Unikodaj ecoj de karakteroj.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ĝi scias, ĉu karaktero estas litero aŭ cifero.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ scias, kiuj karakteroj formas parojn, kiel rondaj krampoj kaj aliaj krampoj.<\/span> <span class=\"sg\" data-s=\"3\">Ofte, malsamaj partoj de la programo povas uzi malsamajn specojn de krampoj.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, ni ŝanĝu nian programon ‘Saluton, Mondo!’.<\/span> <span class=\"sg\" data-s=\"5\">Ni povas uzi ĉi tiujn ne-latinajn citilojn en ĝi.<\/span> <span class=\"sg\" data-s=\"6\">Vi vidos ilin denove, kiam ni laboros kun Raku-gramatikoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Saluton, Mondo!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Iuj enkonstruitaj operatoroj havas du formojn: Unikodan kaj ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, vi povas tajpi ‘ne egala’ kiel <code>!=<\/code> aŭ kiel <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La samo validas por operacioj kun aroj.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, <code>∈<\/code> havas puran ASCII-version, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Krome, vi povas nomi enkonstruitan konstanton <code>pi<\/code> aŭ <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun nombroj, vi povas uzi frakciojn kiel <code>½<\/code> anstataŭ <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas ricevi la kvadraton de <code>$x<\/code> per superskriba karaktero: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vidu la plenan liston de tiaj paroj en la dokumentaro: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Unikodo kontraŭ ASCII simboloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Notae de usu Unicodi","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Raku putat omnes fasciculos programmatis tui in UTF-8 servatos esse.<\/span> <span class=\"sg\" data-s=\"1\">In usu, de characteribus non-ASCII curare non debes.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, eos in literalibus stringae adhibere potes.<\/span> <span class=\"sg\" data-s=\"3\">Sed hoc non est totum.<\/span> <span class=\"sg\" data-s=\"4\">Verisimiliter etiam legere fasciculum textus UTF-8 nulla difficultas est.<\/span> <span class=\"sg\" data-s=\"5\">Hoc etiam significat Raku longitudinem stringae recte invenire.<\/span> <span class=\"sg\" data-s=\"6\">Characteres numerat, non bytes.<\/span> <span class=\"sg\" data-s=\"7\">Hoc postea accuratius spectabimus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec est res proxima quam scire debes.<\/span> <span class=\"sg\" data-s=\"1\">Identificatores, id est nomina, litteras non-Latinas vel non-Anglicas habere possunt.<\/span> <span class=\"sg\" data-s=\"2\">Si vis, variabile tuum <code>$ι<\/code> loco <code>$i<\/code> nominare potes.<\/span> <span class=\"sg\" data-s=\"3\">Compilator id recte leget.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Raku de proprietatibus Unicodi characterum satis severus est.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, scit num character littera vel digitus sit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam scit qui characteres paria faciant, ut parentheses et alii unci.<\/span> <span class=\"sg\" data-s=\"3\">Saepe diversae partes programmatis diversa genera uncorum adhibere possunt.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, programma nostrum ‘Hello, World!’ mutemus.<\/span> <span class=\"sg\" data-s=\"5\">In eo hos characteres citationis non-Latinos adhibere possumus.<\/span> <span class=\"sg\" data-s=\"6\">Eos iterum videbis ubi cum grammaticis Raku laborabimus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say ｢Hello, World!｣;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Quidam operatores in-builti duas formas habent: versionem Unicodi et versionem ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, ‘non aequale’ scribere potes ut <code>!=<\/code> vel ut <code>≠<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Idem valet pro operationibus set.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, <code>∈<\/code> versionem pure ASCII habet, <code>(elem)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Etiam constantem in-builtam appellare potes ut <code>pi<\/code> vel <code>π<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum numeris, fractionibus uti potes, ut <code>½<\/code> loco <code>0.5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam quadratum <code>$x<\/code> charactere superscripto obtinere potes: <code>$x²<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Plenum indicem talium parium in documentis vide: 📖 <a href=\"https://docs.raku.org/language/unicode_ascii\" target=\"_blank\" rel=\"noopener\">Symbola Unicode versus ASCII<\/a>.<\/span><\/p>"]]}}}</script>
