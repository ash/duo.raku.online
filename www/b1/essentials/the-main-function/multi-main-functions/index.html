<script type="application/json" id="page-data">{"u":"essentials/the-main-function/multi-main-functions","n":325,"k":"topic","pv":"essentials/the-main-function/reading-command-line-arguments/quiz2","nx":"essentials/the-main-function/multi-main-functions/quiz","tr":["essentials","essentials/the-main-function"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multi MAIN functions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Like any other function in Raku, the <code>MAIN<\/code> function can have <code>multi<\/code> variants.<\/span> <span class=\"sg\" data-s=\"1\">With them, the program can react to each case in its own way.<\/span> <span class=\"sg\" data-s=\"2\">The cases can differ in the number of input parameters or in their types.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If there is only one argument, this program doubles it.<\/span> <span class=\"sg\" data-s=\"1\">If there is a second argument, the program adds the two together:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"de":{"t":"Mehrere <code>MAIN<\/code>-Funktionen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wie jede andere Funktion in Raku kann auch die Funktion <code>MAIN<\/code> <code>multi<\/code>-Varianten haben.<\/span> <span class=\"sg\" data-s=\"1\">Damit kann das Programm jeden Fall auf seine eigene Weise behandeln.<\/span> <span class=\"sg\" data-s=\"2\">Die Fälle können sich in der Anzahl der Eingabeparameter oder in ihren Typen unterscheiden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn es nur ein Argument gibt, verdoppelt das Programm seinen Wert.<\/span> <span class=\"sg\" data-s=\"1\">Wenn es ein zweites Argument gibt, addiert das Programm die beiden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"nl":{"t":"Meerdere <code>MAIN<\/code> functies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Net als elke andere functie in Raku kan de <code>MAIN<\/code>-functie <code>multi<\/code>-varianten hebben.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kan het programma op elk geval op een eigen manier reageren.<\/span> <span class=\"sg\" data-s=\"2\">De gevallen kunnen verschillen in het aantal invoerparameters of in hun types.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als er maar één argument is, verdubbelt dit programma het.<\/span> <span class=\"sg\" data-s=\"1\">Als er een tweede argument is, telt het programma de twee bij elkaar op:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"es":{"t":"Múltiples funciones <code>MAIN<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Como cualquier otra función en Raku, la función <code>MAIN<\/code> puede tener variantes <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con ellas, el programa puede reaccionar a cada caso a su manera.<\/span> <span class=\"sg\" data-s=\"2\">Los casos pueden ser diferentes en el número de parámetros de entrada o en sus tipos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si hay un solo argumento, este programa lo duplica.<\/span> <span class=\"sg\" data-s=\"1\">Si hay un segundo argumento, el programa suma los dos:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"it":{"t":"Più funzioni <code>MAIN<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Come qualsiasi altra funzione in Raku, la funzione <code>MAIN<\/code> può avere varianti <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Con queste, il programma può reagire a ogni caso in modo specifico.<\/span> <span class=\"sg\" data-s=\"2\">I casi possono essere diversi per il numero dei parametri di input o per i loro tipi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se c'è un solo argomento, questo programma lo raddoppia.<\/span> <span class=\"sg\" data-s=\"1\">Se c'è un secondo argomento, il programma somma i due argomenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"lv":{"t":"Vairākas <code>MAIN<\/code> funkcijas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā jebkurai citai funkcijai Raku valodā, <code>MAIN<\/code> funkcijai var būt <code>multi<\/code> varianti.<\/span> <span class=\"sg\" data-s=\"1\">Ar tiem programma var reaģēt uz katru gadījumu savā veidā.<\/span> <span class=\"sg\" data-s=\"2\">Gadījumi var atšķirties ar ievades parametru skaitu vai to tipiem.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja ir tikai viens arguments, šī programma to dubulto.<\/span> <span class=\"sg\" data-s=\"1\">Ja ir arī otrs arguments, programma abus saskaita:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"ru":{"t":"Несколько функций <code>MAIN<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Как и любая другая функция в Raku, функция <code>MAIN<\/code> может иметь варианты <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С ними программа может реагировать на каждый случай по-своему.<\/span> <span class=\"sg\" data-s=\"2\">Случаи могут отличаться количеством входных параметров или их типами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если аргумент только один, эта программа удваивает его.<\/span> <span class=\"sg\" data-s=\"1\">Если есть второй аргумент, программа складывает оба аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"uk":{"t":"Кілька функцій <code>MAIN<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Як і будь-яка інша функція в Raku, функція <code>MAIN<\/code> може мати варіанти <code>multi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">З ними програма може реагувати на кожен випадок по-своєму.<\/span> <span class=\"sg\" data-s=\"2\">Випадки можуть відрізнятися кількістю вхідних параметрів або їхніми типами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо аргумент лише один, ця програма його подвоює.<\/span> <span class=\"sg\" data-s=\"1\">Якщо є другий аргумент, програма складає обидва аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"bg":{"t":"Множество функции <code>MAIN<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Като всяка друга функция в Raku, функцията <code>MAIN<\/code> може да има <code>multi<\/code> варианти.<\/span> <span class=\"sg\" data-s=\"1\">С тях програмата може да реагира на всеки случай по свой начин.<\/span> <span class=\"sg\" data-s=\"2\">Случаите могат да се различават по броя на входните параметри или по техните типове.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако има само един аргумент, тази програма го удвоява.<\/span> <span class=\"sg\" data-s=\"1\">Ако има и втори аргумент, програмата събира двата аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"eo":{"t":"Multoblaj <code>MAIN<\/code> funkcioj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiel ĉiu alia funkcio en Raku, la funkcio <code>MAIN<\/code> povas havi <code>multi<\/code> variantojn.<\/span> <span class=\"sg\" data-s=\"1\">Per ili, la programo povas reagi al ĉiu kazo laŭ propra maniero.<\/span> <span class=\"sg\" data-s=\"2\">La kazoj povas diferenci laŭ la nombro de eniraj parametroj aŭ laŭ iliaj tipoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se estas nur unu argumento, ĉi tiu programo duobligas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Se estas dua argumento, la programo adicias ilin ambaŭ:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]},"la":{"t":"Multiplicem <code>MAIN<\/code> functiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sicut quaevis alia functio in Raku, functio <code>MAIN<\/code> variantes <code>multi<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Cum eis, programma ad quemque casum suo modo respondere potest.<\/span> <span class=\"sg\" data-s=\"2\">Casus differre possunt numero parametrorum input aut typis eorum.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub MAIN($a) {\n    say 2 * $a;\n}\n\nmulti sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si solum unum argumentum est, hoc programma id duplicat.<\/span> <span class=\"sg\" data-s=\"1\">Si secundum argumentum adest, programma ambo argumenta addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 21\n42\n\n$ raku t.raku 21 33\n54<\/code><\/pre>"]]}}}</script>
