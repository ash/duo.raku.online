<code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось як можна запустити програму.<\/span> <span class=\"sg\" data-s=\"1\">Вона виводить суму двох своїх аргументів:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Як і будь-яка інша функція, <code>MAIN<\/code> може мати значення за замовчуванням для своїх аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Це можливо для деяких із них або навіть для всіх.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви не передаєте другий аргумент, програма використовує значення за замовчуванням:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"bg":{"t":"Четене на аргументите на командния ред","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>MAIN<\/code> ясно отбелязва началото на програмата, което е полезно.<\/span> <span class=\"sg\" data-s=\"1\">Но тя е полезна и защото нейните аргументи получават стойностите от командния ред.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да четете аргументи от командния ред по два начина.<\/span> <span class=\"sg\" data-s=\"1\">Първият е масивът <a href=\"https://course.raku.org/bg/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code><\/a>, който вече използвахме.<\/span> <span class=\"sg\" data-s=\"2\">Сега нека разгледаме втория начин.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето програма, която събира две числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето как можете да стартирате програмата.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва сумата на двата си аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Като всяка друга функция, <code>MAIN<\/code> може да има стойности по подразбиране за аргументите си.<\/span> <span class=\"sg\" data-s=\"1\">Това е възможно за някои от тях или дори за всички.<\/span> <span class=\"sg\" data-s=\"2\">Например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако не подадете втория аргумент, програмата използва стойността по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"eo":{"t":"Legante komando-linio argumentojn","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>MAIN<\/code> klare markas la komencon de la programo, kio estas utila.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi estas utila ankaŭ ĉar ĝiaj argumentoj ricevas la valorojn el la komando-linio.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas legi komando-liniajn argumentojn laŭ du manieroj.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la <a href=\"https://course.raku.org/eo/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> tabelo<\/a>, kiun ni jam uzis.<\/span> <span class=\"sg\" data-s=\"2\">Nun ni rigardu la duan manieron.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen programo, kiu adicias du nombrojn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen kiel vi povas ruli la programon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas la sumon de siaj du argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiel ĉiu alia funkcio, <code>MAIN<\/code> povas havi defaŭltajn valorojn por siaj argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio eblas por kelkaj el ili, aŭ eĉ por ĉiuj el ili.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi ne donas la duan argumenton, la programo uzas la defaŭltan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]},"la":{"t":"Legere linea mandati argumenta","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio <code>MAIN<\/code> initium programmatis clare signat, quod utile est.<\/span> <span class=\"sg\" data-s=\"1\">Sed etiam utilis est quia argumenta eius valores ex linea mandati accipiunt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Argumenta lineae mandati duobus modis legere potes.<\/span> <span class=\"sg\" data-s=\"1\">Primus est <a href=\"https://course.raku.org/la/essentials/positionals/args-array/\" target=\"_blank\" rel=\"noopener\"><code>@*ARGS<\/code> array<\/a>, quo iam usi sumus.<\/span> <span class=\"sg\" data-s=\"2\">Nunc secundum modum spectemus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce programma quod duos numeros addit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sic programma currere potes.<\/span> <span class=\"sg\" data-s=\"1\">Summam duorum argumentorum suorum imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 123 45\n168<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sicut quaevis alia functio, <code>MAIN<\/code> valores praedefinitos pro argumentis suis habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc pro quibusdam eorum possibile est, vel etiam pro omnibus.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($a, $b = 100) {\n    say $a + $b;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si secundum argumentum non das, programma valorem praedefinitum adhibet:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku 15\n115<\/code><\/pre>"]]}}}</script>
