<script type="application/json" id="page-data">{"u":"essentials/the-main-function/using-unit-sub","n":327,"k":"topic","pv":"essentials/the-main-function/multi-main-functions/quiz","nx":"essentials/the-main-function/using-unit-sub/quiz","tr":["essentials","essentials/the-main-function"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using unit sub","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>unit sub<\/code> construct is very handy.<\/span> <span class=\"sg\" data-s=\"1\">It makes the rest of the file the body of the function!<\/span> <span class=\"sg\" data-s=\"2\">With <code>MAIN<\/code>, it lets you remove the curly braces around almost the whole file.<\/span> <span class=\"sg\" data-s=\"3\">You also do not need the extra indentation.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The following example program shows how to use <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In this file, <code>MAIN<\/code> is the only function.<\/span> <span class=\"sg\" data-s=\"1\">If the same is true for your program, think about using <code>unit sub MAIN<\/code> as shown above.<\/span><\/p>"]]},"de":{"t":"Verwendung von <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Konstrukt <code>unit sub<\/code> ist sehr praktisch.<\/span> <span class=\"sg\" data-s=\"1\">Es macht den Rest der Datei zum Körper der Funktion!<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>MAIN<\/code> können Sie damit die geschweiften Klammern um fast die ganze Datei weglassen.<\/span> <span class=\"sg\" data-s=\"3\">Auch die zusätzliche Einrückung brauchen Sie nicht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das folgende Beispielprogramm zeigt, wie Sie <code>unit sub<\/code> verwenden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Die Summe von $a und $b ist $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In dieser Datei ist <code>MAIN<\/code> die einzige Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Wenn das auch für Ihr Programm gilt, denken Sie darüber nach, <code>unit sub MAIN<\/code> wie oben gezeigt zu verwenden.<\/span><\/p>"]]},"nl":{"t":"Gebruik van <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De constructie <code>unit sub<\/code> is erg handig.<\/span> <span class=\"sg\" data-s=\"1\">Die maakt van de rest van het bestand het lichaam van de functie!<\/span> <span class=\"sg\" data-s=\"2\">Met <code>MAIN<\/code> kun je zo de accolades rond bijna het hele bestand weglaten.<\/span> <span class=\"sg\" data-s=\"3\">Je hebt ook de extra inspringing niet nodig.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het volgende voorbeeldprogramma laat zien hoe je <code>unit sub<\/code> gebruikt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"De som van $a en $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In dit bestand is <code>MAIN<\/code> de enige functie.<\/span> <span class=\"sg\" data-s=\"1\">Als dat ook voor jouw programma geldt, denk er dan over na om <code>unit sub MAIN<\/code> te gebruiken, zoals hierboven.<\/span><\/p>"]]},"es":{"t":"Uso de <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La construcción <code>unit sub<\/code> es muy práctica.<\/span> <span class=\"sg\" data-s=\"1\">¡Hace que el resto del archivo sea el cuerpo de la función!<\/span> <span class=\"sg\" data-s=\"2\">Con <code>MAIN<\/code>, te permite quitar las llaves alrededor de casi todo el archivo.<\/span> <span class=\"sg\" data-s=\"3\">Tampoco necesitas la indentación extra.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El siguiente programa de ejemplo muestra cómo usar <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La suma de $a y $b es $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En este archivo, <code>MAIN<\/code> es la única función.<\/span> <span class=\"sg\" data-s=\"1\">Si pasa lo mismo en tu programa, piensa en usar <code>unit sub MAIN<\/code> como se muestra arriba.<\/span><\/p>"]]},"it":{"t":"Uso di <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il costrutto <code>unit sub<\/code> è molto pratico.<\/span> <span class=\"sg\" data-s=\"1\">Rende il resto del file il corpo della funzione!<\/span> <span class=\"sg\" data-s=\"2\">Con <code>MAIN<\/code>, ti permette di togliere le parentesi graffe intorno a quasi tutto il file.<\/span> <span class=\"sg\" data-s=\"3\">Non ti serve neanche l'indentazione in più.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma di esempio qui sotto mostra come usare <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La somma di $a e $b è $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In questo file, <code>MAIN<\/code> è l'unica funzione.<\/span> <span class=\"sg\" data-s=\"1\">Se vale lo stesso per il tuo programma, pensa di usare <code>unit sub MAIN<\/code> come mostrato sopra.<\/span><\/p>"]]},"lv":{"t":"Izmantojot <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>unit sub<\/code> konstrukcija ir ļoti ērta.<\/span> <span class=\"sg\" data-s=\"1\">Tā padara pārējo failu par funkcijas ķermeni!<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>MAIN<\/code> tā ļauj noņemt figūriekavas, kas aptver gandrīz visu failu.<\/span> <span class=\"sg\" data-s=\"3\">Jums arī nav vajadzīga liekā atkāpe.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šis programmas piemērs parāda, kā izmantot <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Summa no $a un $b ir $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šajā failā <code>MAIN<\/code> ir vienīgā funkcija.<\/span> <span class=\"sg\" data-s=\"1\">Ja tā ir arī jūsu programmā, padomājiet par <code>unit sub MAIN<\/code> izmantošanu, kā parādīts augstāk.<\/span><\/p>"]]},"ru":{"t":"Использование <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Конструкция <code>unit sub<\/code> очень удобна.<\/span> <span class=\"sg\" data-s=\"1\">Она делает остальную часть файла телом функции!<\/span> <span class=\"sg\" data-s=\"2\">С <code>MAIN<\/code> она позволяет убрать фигурные скобки вокруг почти всего файла.<\/span> <span class=\"sg\" data-s=\"3\">Лишние отступы вам тоже не нужны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следующий пример программы показывает, как использовать <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумма $a и $b равна $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом файле <code>MAIN<\/code> — единственная функция.<\/span> <span class=\"sg\" data-s=\"1\">Если в вашей программе так же, подумайте о том, чтобы использовать <code>unit sub MAIN<\/code>, как показано выше.<\/span><\/p>"]]},"uk":{"t":"Використання <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Конструкція <code>unit sub<\/code> дуже зручна.<\/span> <span class=\"sg\" data-s=\"1\">Вона робить решту файлу тілом функції!<\/span> <span class=\"sg\" data-s=\"2\">З <code>MAIN<\/code> вона дозволяє прибрати фігурні дужки навколо майже всього файлу.<\/span> <span class=\"sg\" data-s=\"3\">Також вам не потрібні зайві відступи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наступний приклад програми показує, як використовувати <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сума $a та $b дорівнює $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цьому файлі <code>MAIN<\/code> — єдина функція.<\/span> <span class=\"sg\" data-s=\"1\">Якщо у вашій програмі так само, подумайте про використання <code>unit sub MAIN<\/code>, як показано вище.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Конструктът <code>unit sub<\/code> е много удобен.<\/span> <span class=\"sg\" data-s=\"1\">Той прави останалата част от файла тяло на функцията!<\/span> <span class=\"sg\" data-s=\"2\">С <code>MAIN<\/code> той ви позволява да махнете къдравите скоби около почти целия файл.<\/span> <span class=\"sg\" data-s=\"3\">Също така не ви трябва допълнителното отстъпване.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Следващата примерна програма показва как да използвате <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"Сумата на $a и $b е $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В този файл <code>MAIN<\/code> е единствената функция.<\/span> <span class=\"sg\" data-s=\"1\">Ако същото важи и за вашата програма, помислете дали да използвате <code>unit sub MAIN<\/code>, както е показано по-горе.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La konstruo <code>unit sub<\/code> estas tre oportuna.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi igas la reston de la dosiero la korpo de la funkcio!<\/span> <span class=\"sg\" data-s=\"2\">Kun <code>MAIN<\/code>, ĝi permesas al vi forigi la kurbajn krampojn ĉirkaŭ preskaŭ la tuta dosiero.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ ne bezonas la kroman enŝovon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sekva ekzempla programo montras, kiel uzi <code>unit sub<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"La sumo de $a kaj $b estas $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu dosiero, <code>MAIN<\/code> estas la sola funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Se la samo veras por via programo, pensu pri uzado de <code>unit sub MAIN<\/code>, kiel montrite supre.<\/span><\/p>"]]},"la":{"t":"Utendo <code>unit sub<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Constructum <code>unit sub<\/code> valde utile est.<\/span> <span class=\"sg\" data-s=\"1\">Reliquam partem fasciculi corpus functionis facit!<\/span> <span class=\"sg\" data-s=\"2\">Cum <code>MAIN<\/code>, tibi licet uncos curvos circa fere totum fasciculum tollere.<\/span> <span class=\"sg\" data-s=\"3\">Nec indentationem additam requiris.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sequens exemplum programmatis ostendit quomodo <code>unit sub<\/code> adhibeas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit sub MAIN($a, $b);\n\nmy $sum = $a + $b;\nsay \"The sum of $a and $b is $sum.\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In hoc fasciculo, <code>MAIN<\/code> sola functio est.<\/span> <span class=\"sg\" data-s=\"1\">Si idem in programmate tuo verum est, cogita de usu <code>unit sub MAIN<\/code>, sicut supra ostenditur.<\/span><\/p>"]]}}}</script>
