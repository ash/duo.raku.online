<script type="application/json" id="page-data">{"u":"essentials/the-main-function","n":321,"k":"section","pv":"essentials/built-in-functions-for-printing/exercises/print-the-warning/solution","nx":"essentials/the-main-function/reading-command-line-arguments","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The MAIN function","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A Raku program does not need any standard code that you must always write.<\/span> <span class=\"sg\" data-s=\"1\">So you can start writing useful instructions right away.<\/span> <span class=\"sg\" data-s=\"2\">This part of the program lies outside all <a href=\"/essentials/code-blocks/\">code blocks<\/a>, including <a href=\"/essentials/functions/\">functions<\/a>, for example.<\/span> <span class=\"sg\" data-s=\"3\">It is called the <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If a program has a function with the special name <code>MAIN<\/code>, Raku runs it last.<\/span> <span class=\"sg\" data-s=\"1\">This happens after Raku compiles everything and after it runs the mainline code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program first runs the <code>say<\/code>s at the top level and then calls <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of course, a program can also have the <code>MAIN<\/code> function and no other mainline code.<\/span><\/p>"]]},"de":{"t":"Die <code>MAIN<\/code>-Funktion","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Raku-Programm braucht keinen Standardcode, den Sie immer schreiben müssen.<\/span> <span class=\"sg\" data-s=\"1\">Sie können also sofort nützliche Anweisungen schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Teil des Programms liegt außerhalb aller <a href=\"https://course.raku.org/de/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">Codeblöcke<\/a>, zum Beispiel auch außerhalb von <a href=\"https://course.raku.org/de/essentials/functions/\" target=\"_blank\" rel=\"noopener\">Funktionen<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Er heißt <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Programm eine Funktion mit dem speziellen Namen <code>MAIN<\/code> hat, führt Raku sie zuletzt aus.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, nachdem Raku alles kompiliert und den mainline-Code ausgeführt hat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline-Code';\n\nsub MAIN {\n    say '3. MAIN aufgerufen';\n}\n\nsay '2. Auch mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm führt zuerst die <code>say<\/code>s auf der obersten Ebene aus und ruft dann <code>MAIN<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline-Code\n2. Auch mainline\n3. MAIN aufgerufen<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich kann ein Programm auch die Funktion <code>MAIN<\/code> und keinen anderen mainline-Code haben.<\/span><\/p>"]]},"nl":{"t":"De <code>MAIN<\/code> functie","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een Raku-programma heeft geen standaardcode nodig die je altijd moet schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt dus meteen beginnen met het schrijven van nuttige instructies.<\/span> <span class=\"sg\" data-s=\"2\">Dit deel van het programma staat buiten alle <a href=\"https://course.raku.org/nl/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">codeblokken<\/a>, bijvoorbeeld ook buiten <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functies<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Het heet de <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als een programma een functie met de speciale naam <code>MAIN<\/code> heeft, voert Raku die als laatste uit.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt nadat Raku alles heeft gecompileerd en de mainline-code heeft uitgevoerd.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma voert eerst de <code>say<\/code>s op het hoogste niveau uit en roept daarna <code>MAIN<\/code> aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natuurlijk kan een programma ook de <code>MAIN<\/code>-functie hebben en geen andere mainline-code.<\/span><\/p>"]]},"es":{"t":"La función <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un programa en Raku no necesita ningún código estándar que tengas que escribir siempre.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes empezar a escribir instrucciones útiles enseguida.<\/span> <span class=\"sg\" data-s=\"2\">Esta parte del programa está fuera de todos los <a href=\"https://course.raku.org/es/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">bloques de código<\/a>, incluidas las <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funciones<\/a>, por ejemplo.<\/span> <span class=\"sg\" data-s=\"3\">Se llama <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si un programa tiene una función con el nombre especial <code>MAIN<\/code>, Raku la ejecuta al final.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa después de compilar todo y de ejecutar el código mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Código mainline';\n\nsub MAIN {\n    say '3. MAIN llamado';\n}\n\nsay '2. También mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa primero ejecuta los <code>say<\/code> del nivel superior y luego llama a <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Código mainline\n2. También mainline\n3. MAIN llamado<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por supuesto, un programa también puede tener la función <code>MAIN<\/code> y ningún otro código mainline.<\/span><\/p>"]]},"it":{"t":"La funzione <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un programma Raku non ha bisogno di codice standard che devi sempre scrivere.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi iniziare subito a scrivere istruzioni utili.<\/span> <span class=\"sg\" data-s=\"2\">Questa parte del programma sta fuori da tutti i <a href=\"https://course.raku.org/it/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">blocchi di codice<\/a>, comprese, per esempio, le <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funzioni<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Si chiama <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se un programma ha una funzione con il nome speciale <code>MAIN<\/code>, Raku la esegue per ultima.<\/span> <span class=\"sg\" data-s=\"1\">Questo succede dopo che Raku ha compilato tutto e dopo che ha eseguito il codice mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Codice mainline';\n\nsub MAIN {\n    say '3. MAIN chiamato';\n}\n\nsay '2. Anche mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma prima esegue i <code>say<\/code> di livello superiore e poi chiama <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codice mainline\n2. Anche mainline\n3. MAIN chiamato<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, un programma può anche avere la funzione <code>MAIN<\/code> e nessun altro codice mainline.<\/span><\/p>"]]},"lv":{"t":"<code>MAIN<\/code> funkcija","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku programmai nav vajadzīgs nekāds standarta kods, kas jums vienmēr jāraksta.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat uzreiz sākt rakstīt noderīgas instrukcijas.<\/span> <span class=\"sg\" data-s=\"2\">Šī programmas daļa atrodas ārpus visiem <a href=\"https://course.raku.org/lv/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">koda blokiem<\/a>, piemēram, arī ārpus <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcijām<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">To sauc par <em>galveno līniju<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja programmā ir funkcija ar īpašu nosaukumu <code>MAIN<\/code>, Raku to izpilda pašās beigās.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek pēc tam, kad Raku visu nokompilē un izpilda galvenās līnijas kodu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Galvenās līnijas kods';\n\nsub MAIN {\n    say '3. MAIN izsaukts';\n}\n\nsay '2. Arī galvenā līnija';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma vispirms izpilda augstākā līmeņa <code>say<\/code> komandas un pēc tam izsauc <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Galvenās līnijas kods\n2. Arī galvenā līnija\n3. MAIN izsaukts<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, programmā var būt arī <code>MAIN<\/code> funkcija bez cita galvenās līnijas koda.<\/span><\/p>"]]},"ru":{"t":"Функция <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Программе на Raku не нужен стандартный код, который надо писать всегда.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы можете сразу начать писать полезные инструкции.<\/span> <span class=\"sg\" data-s=\"2\">Эта часть программы находится вне всех <a href=\"https://course.raku.org/ru/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блоков кода<\/a>, включая, например, <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функции<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Она называется <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если в программе есть функция со специальным именем <code>MAIN<\/code>, Raku выполняет её последней.<\/span> <span class=\"sg\" data-s=\"1\">Это происходит после того, как Raku всё скомпилирует и выполнит код mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа сначала выполняет <code>say<\/code> на верхнем уровне, а затем вызывает <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, в программе может быть функция <code>MAIN<\/code> и никакого другого кода mainline.<\/span><\/p>"]]},"uk":{"t":"Функція <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмі на Raku не потрібен стандартний код, який треба писати щоразу.<\/span> <span class=\"sg\" data-s=\"1\">Тому ви можете одразу почати писати корисні інструкції.<\/span> <span class=\"sg\" data-s=\"2\">Ця частина програми знаходиться поза всіма <a href=\"https://course.raku.org/uk/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">блоками коду<\/a>, наприклад поза <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функціями<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Вона називається <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо в програмі є функція зі спеціальною назвою <code>MAIN<\/code>, Raku виконує її останньою.<\/span> <span class=\"sg\" data-s=\"1\">Це відбувається після того, як Raku скомпілює весь код і виконає код mainline.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Mainline code';\n\nsub MAIN {\n    say '3. MAIN called';\n}\n\nsay '2. Also mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма спочатку виконує <code>say<\/code> на верхньому рівні, а потім викликає <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Mainline code\n2. Also mainline\n3. MAIN called<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, програма також може мати функцію <code>MAIN<\/code> і не мати іншого коду mainline.<\/span><\/p>"]]},"bg":{"t":"Функцията <code>MAIN<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмата на Raku няма нужда от стандартен код, който винаги трябва да пишете.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете веднага да започнете да пишете полезни инструкции.<\/span> <span class=\"sg\" data-s=\"2\">Тази част от програмата е извън всички <a href=\"https://course.raku.org/bg/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">код блокове<\/a>, включително например <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">функциите<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Тя се нарича <em>основна линия<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако програмата има функция със специалното име <code>MAIN<\/code>, Raku я изпълнява последна.<\/span> <span class=\"sg\" data-s=\"1\">Това става, след като Raku компилира всичко и след като изпълни основния код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Основен код';\n\nsub MAIN {\n    say '3. MAIN извикана';\n}\n\nsay '2. Също основен код';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма първо изпълнява <code>say<\/code> на най-високо ниво и след това извиква <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Основен код\n2. Също основен код\n3. MAIN извикана<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, програмата може също да има функцията <code>MAIN<\/code> без друг основен код.<\/span><\/p>"]]},"eo":{"t":"La <code>MAIN<\/code> funkcio","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku-programo ne bezonas kutiman kodon, kiun vi ĉiam devas skribi.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas tuj komenci skribi utilajn instrukciojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu parto de la programo troviĝas ekster ĉiuj <a href=\"https://course.raku.org/eo/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">kodaj blokoj<\/a>, ekzemple ankaŭ ekster <a href=\"https://course.raku.org/eo/essentials/functions/\" target=\"_blank\" rel=\"noopener\">funkcioj<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi nomiĝas <em>ĉeflinio<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se programo havas funkcion kun la speciala nomo <code>MAIN<\/code>, Raku rulas ĝin laste.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas post kiam Raku kompilas ĉion kaj post kiam ĝi rulas la ĉeflinian kodon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Ĉeflinia kodo';\n\nsub MAIN {\n    say '3. MAIN vokita';\n}\n\nsay '2. Ankaŭ ĉeflinio';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo unue rulas la <code>say<\/code>-ojn sur la supra nivelo kaj poste vokas <code>MAIN<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Ĉeflinia kodo\n2. Ankaŭ ĉeflinio\n3. MAIN vokita<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, programo ankaŭ povas havi la funkcion <code>MAIN<\/code> kaj neniun alian ĉeflinian kodon.<\/span><\/p>"]]},"la":{"t":"<code>MAIN<\/code> functio","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma Raku nullum codicem solitum requirit quem semper scribere debes.<\/span> <span class=\"sg\" data-s=\"1\">Itaque statim instructiones utiles scribere incipere potes.<\/span> <span class=\"sg\" data-s=\"2\">Haec pars programmatis extra omnia <a href=\"https://course.raku.org/la/essentials/code-blocks/\" target=\"_blank\" rel=\"noopener\">claustra codicis<\/a> iacet, etiam extra <a href=\"https://course.raku.org/la/essentials/functions/\" target=\"_blank\" rel=\"noopener\">functiones<\/a>, exempli gratia.<\/span> <span class=\"sg\" data-s=\"3\">Vocatur <em>mainline<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si programma functionem cum nomine speciali <code>MAIN<\/code> habet, Raku eam ultimam currit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit postquam Raku omnia compilavit et postquam codicem mainline cucurrit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '1. Codex mainline';\n\nsub MAIN {\n    say '3. MAIN vocata';\n}\n\nsay '2. Etiam mainline';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma primum instructiones <code>say<\/code> in summo gradu currit et deinde <code>MAIN<\/code> vocat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n1. Codex mainline\n2. Etiam mainline\n3. MAIN vocata<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Certe programma etiam functionem <code>MAIN<\/code> et nullum alium codicem mainline habere potest.<\/span><\/p>"]]}}}</script>
