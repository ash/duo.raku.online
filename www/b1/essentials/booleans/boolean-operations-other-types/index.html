<script type="application/json" id="page-data">{"u":"essentials/booleans/boolean-operations-other-types","n":101,"k":"topic","pv":"essentials/booleans/operations/quiz","nx":"essentials/booleans/boolean-operations-other-types/quiz","tr":["essentials","essentials/booleans"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Boolean operations with other types","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In the next section, we will talk about <a href=\"/essentials/coercion/\">converting data from one type to another<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">But before that, it is important to point out one feature of Raku.<\/span> <span class=\"sg\" data-s=\"2\">You can use Boolean operations with strings or integers.<\/span> <span class=\"sg\" data-s=\"3\">In this case, the values are not converted to Booleans.<\/span> <span class=\"sg\" data-s=\"4\">The result is not a Boolean value either.<\/span> <span class=\"sg\" data-s=\"5\">Look at these examples:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let us read the rules 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">from the documentation<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> returns the first argument that is False as a Boolean. If there is none, it returns the last argument.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> returns the first argument that is True as a Boolean. If there is none, it returns the last argument.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> returns the True argument if there is exactly one. If all arguments are False, it returns the last one. If more than one argument is True, it returns <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Note that we have just met <code>Nil<\/code>, which is a ‘null’ value.<\/span><\/p>"]]},"de":{"t":"Boolesche Operationen mit anderen Typen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Im nächsten Abschnitt sprechen wir darüber, wie man <a href=\"https://course.raku.org/de/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">Daten von einem Typ in einen anderen umwandelt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Aber vorher ist es wichtig, auf eine Eigenschaft von Raku hinzuweisen.<\/span> <span class=\"sg\" data-s=\"2\">Sie können boolesche Operationen mit Zeichenketten oder Ganzzahlen verwenden.<\/span> <span class=\"sg\" data-s=\"3\">In diesem Fall werden die Werte nicht in Boolesche Werte umgewandelt.<\/span> <span class=\"sg\" data-s=\"4\">Auch das Ergebnis ist kein Boolescher Wert.<\/span> <span class=\"sg\" data-s=\"5\">Sehen Sie sich diese Beispiele an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lassen Sie uns die Regeln 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">aus der Dokumentation<\/a> lesen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> gibt das erste Argument zurück, das als Boolescher Wert False ist. Wenn es keines gibt, gibt es das letzte Argument zurück.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> gibt das erste Argument zurück, das als Boolescher Wert True ist. Wenn es keines gibt, gibt es das letzte Argument zurück.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> gibt das True-Argument zurück, wenn es genau eines gibt. Wenn alle Argumente False sind, gibt es das letzte zurück. Wenn mehr als ein Argument True ist, gibt es <code>Nil<\/code> zurück.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass wir gerade <code>Nil<\/code> kennengelernt haben, einen ‘Null’-Wert.<\/span><\/p>"]]},"nl":{"t":"Boolean bewerkingen met andere typen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In de volgende sectie praten we over <a href=\"https://course.raku.org/nl/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">het omzetten van gegevens van het ene type naar het andere<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Maar eerst is het belangrijk om op één eigenschap van Raku te wijzen.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt Booleaanse operaties gebruiken met strings of gehele getallen.<\/span> <span class=\"sg\" data-s=\"3\">In dat geval worden de waarden niet omgezet naar Booleans.<\/span> <span class=\"sg\" data-s=\"4\">Het resultaat is ook geen Booleaanse waarde.<\/span> <span class=\"sg\" data-s=\"5\">Bekijk deze voorbeelden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we de regels lezen 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">uit de documentatie<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> geeft het eerste argument terug dat als Boolean False is. Als er geen is, geeft het het laatste argument terug.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> geeft het eerste argument terug dat als Boolean True is. Als er geen is, geeft het het laatste argument terug.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> geeft het True-argument terug als er precies één is. Als alle argumenten False zijn, geeft het het laatste terug. Als meer dan één argument True is, geeft het <code>Nil<\/code> terug.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Let op: we zijn net <code>Nil<\/code> tegengekomen, en dat is een ‘null’-waarde.<\/span><\/p>"]]},"es":{"t":"Operaciones booleanas con otros tipos","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la siguiente sección, hablaremos sobre <a href=\"https://course.raku.org/es/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">convertir datos de un tipo a otro<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Pero antes de eso, es importante señalar una característica de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar operaciones booleanas con cadenas o enteros.<\/span> <span class=\"sg\" data-s=\"3\">En este caso, los valores no se convierten en booleanos.<\/span> <span class=\"sg\" data-s=\"4\">El resultado tampoco es un valor booleano.<\/span> <span class=\"sg\" data-s=\"5\">Mira estos ejemplos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Leamos las reglas 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">de la documentación<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> devuelve el primer argumento que es Falso como booleano. Si no hay ninguno, devuelve el último argumento.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> devuelve el primer argumento que es Verdadero como booleano. Si no hay ninguno, devuelve el último argumento.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> devuelve el argumento Verdadero si hay exactamente uno. Si todos los argumentos son Falsos, devuelve el último. Si más de un argumento es Verdadero, devuelve <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Observa que acabamos de encontrarnos con <code>Nil<\/code>, que es un valor ‘nulo’.<\/span><\/p>"]]},"it":{"t":"Operazioni booleane con altri tipi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nella prossima sezione parleremo di <a href=\"https://course.raku.org/it/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">come convertire i dati da un tipo a un altro<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ma prima è importante notare una caratteristica di Raku.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare le operazioni booleane con stringhe o interi.<\/span> <span class=\"sg\" data-s=\"3\">In questo caso, i valori non vengono convertiti in booleani.<\/span> <span class=\"sg\" data-s=\"4\">Neanche il risultato è un valore booleano.<\/span> <span class=\"sg\" data-s=\"5\">Guarda questi esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Leggiamo le regole 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">dalla documentazione<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> restituisce il primo argomento che è Falso come booleano. Se non ce n'è nessuno, restituisce l'ultimo argomento.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> restituisce il primo argomento che è Vero come booleano. Se non ce n'è nessuno, restituisce l'ultimo argomento.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> restituisce l'argomento Vero se ce n'è esattamente uno. Se tutti gli argomenti sono Falsi, restituisce l'ultimo. Se più di un argomento è Vero, restituisce <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che abbiamo appena incontrato <code>Nil<\/code>, che è un valore ‘null’.<\/span><\/p>"]]},"lv":{"t":"Loģiskās operācijas ar citiem tipiem","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nākamajā sadaļā mēs runāsim par <a href=\"https://course.raku.org/lv/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">datu konvertēšanu no viena tipa uz citu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bet pirms tam ir svarīgi norādīt uz vienu Raku īpatnību.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat lietot booleānas operācijas ar virknēm vai integeriem.<\/span> <span class=\"sg\" data-s=\"3\">Šajā gadījumā vērtības netiek konvertētas uz booleāniem.<\/span> <span class=\"sg\" data-s=\"4\">Arī rezultāts nav booleāna vērtība.<\/span> <span class=\"sg\" data-s=\"5\">Apskatiet šos piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Izlasīsim noteikumus 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">no dokumentācijas<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> atgriež pirmo argumentu, kas kā booleāna vērtība ir False. Ja tāda nav, tas atgriež pēdējo argumentu.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> atgriež pirmo argumentu, kas kā booleāna vērtība ir True. Ja tāda nav, tas atgriež pēdējo argumentu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> atgriež True argumentu, ja tāds ir tieši viens. Ja visi argumenti ir False, tas atgriež pēdējo. Ja vairāk nekā viens arguments ir True, tas atgriež <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pievērsiet uzmanību, ka mēs tikko sastapāmies ar <code>Nil<\/code>, kas ir ‘null’ vērtība.<\/span><\/p>"]]},"ru":{"t":"Логические операции с другими типами","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В следующей главе мы поговорим о <a href=\"https://course.raku.org/ru/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">преобразовании данных из одного типа в другой<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но перед этим важно отметить одну особенность Raku.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете применять логические операции к строкам или целым числам.<\/span> <span class=\"sg\" data-s=\"3\">В этом случае значения не превращаются в булевы.<\/span> <span class=\"sg\" data-s=\"4\">Результат тоже не является булевым значением.<\/span> <span class=\"sg\" data-s=\"5\">Посмотрите на эти примеры:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте прочтем правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">из документации<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> возвращает первый аргумент, который как булево значение равен False. Если такого нет, он возвращает последний аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> возвращает первый аргумент, который как булево значение равен True. Если такого нет, он возвращает последний аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> возвращает аргумент со значением True, если такой аргумент ровно один. Если все аргументы равны False, он возвращает последний из них. Если больше одного аргумента равно True, он возвращает <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заметьте, что мы только что познакомились с <code>Nil<\/code> — это «нулевое» значение.<\/span><\/p>"]]},"uk":{"t":"Логічні операції з іншими типами","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">У наступному розділі ми поговоримо про <a href=\"https://course.raku.org/uk/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">перетворення даних з одного типу в інший<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Але перед цим важливо звернути увагу на одну особливість Raku.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете застосовувати булеві операції до рядків або цілих чисел.<\/span> <span class=\"sg\" data-s=\"3\">У цьому випадку значення не перетворюються на булеві.<\/span> <span class=\"sg\" data-s=\"4\">Результат теж не є булевим значенням.<\/span> <span class=\"sg\" data-s=\"5\">Подивіться на ці приклади:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Давайте прочитаємо правила 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">з документації<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> повертає перший аргумент, який як булеве значення є False. Якщо такого немає, він повертає останній аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> повертає перший аргумент, який як булеве значення є True. Якщо такого немає, він повертає останній аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> повертає аргумент, що є True, якщо такий аргумент рівно один. Якщо всі аргументи False, він повертає останній. Якщо більше одного аргументу є True, він повертає <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що ми щойно зустріли <code>Nil<\/code>, тобто значення «null».<\/span><\/p>"]]},"bg":{"t":"Булеви операции с други типове","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В следващата секция ще говорим за <a href=\"https://course.raku.org/bg/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">преобразуване на данни от един тип в друг<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но преди това е важно да посочим една особеност на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате булеви операции с низове или цели числа.<\/span> <span class=\"sg\" data-s=\"3\">В този случай стойностите не се преобразуват в булеви.<\/span> <span class=\"sg\" data-s=\"4\">Резултатът също не е булева стойност.<\/span> <span class=\"sg\" data-s=\"5\">Вижте тези примери:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека прочетем правилата 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">от документацията<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> връща първия аргумент, който е False като булева стойност. Ако няма такъв, връща последния аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> връща първия аргумент, който е True като булева стойност. Ако няма такъв, връща последния аргумент.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> връща True аргумента, ако има точно един такъв. Ако всички аргументи са False, връща последния. Ако повече от един аргумент е True, връща <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че току-що срещнахме <code>Nil<\/code>, което е ‘null’ стойност.<\/span><\/p>"]]},"eo":{"t":"Booleaj operacioj kun aliaj tipoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la sekva sekcio, ni parolos pri <a href=\"https://course.raku.org/eo/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">konvertado de datumoj el unu tipo al alia<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sed antaŭ tio, gravas montri unu trajton de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi Booleajn operaciojn kun ĉenoj aŭ entjeroj.<\/span> <span class=\"sg\" data-s=\"3\">En tiu kazo, la valoroj ne estas konvertataj al Booleaj.<\/span> <span class=\"sg\" data-s=\"4\">Ankaŭ la rezulto ne estas Boolea valoro.<\/span> <span class=\"sg\" data-s=\"5\">Rigardu ĉi tiujn ekzemplojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni legu la regulojn 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">el la dokumentaro<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> redonas la unuan argumenton, kiu estas Falsa kiel Boolea valoro. Se ne ekzistas tia, ĝi redonas la lastan argumenton.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> redonas la unuan argumenton, kiu estas Vera kiel Boolea valoro. Se ne ekzistas tia, ĝi redonas la lastan argumenton.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> redonas la Veran argumenton, se estas ekzakte unu. Se ĉiuj argumentoj estas Falsaj, ĝi redonas la lastan. Se pli ol unu argumento estas Vera, ĝi redonas <code>Nil<\/code>.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke ni ĵus renkontis <code>Nil<\/code>, kiu estas ‘nul’ valoro.<\/span><\/p>"]]},"la":{"t":"Booleana operationes cum aliis typis","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In sectione proxima de <a href=\"https://course.raku.org/la/essentials/coercion/\" target=\"_blank\" rel=\"noopener\">conversione datorum ex uno typo in alium<\/a> loquemur.<\/span> <span class=\"sg\" data-s=\"1\">Sed antea unam proprietatem Raku notare oportet.<\/span> <span class=\"sg\" data-s=\"2\">Operationes Booleanas ad chordas vel integros applicare potes.<\/span> <span class=\"sg\" data-s=\"3\">In hoc casu valores in Booleanos non convertuntur.<\/span> <span class=\"sg\" data-s=\"4\">Nec eventus est valor Booleanus.<\/span> <span class=\"sg\" data-s=\"5\">Specta haec exempla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello' &amp;&amp; 'World'; # World\nsay 'Alpha' || 'Beta';  # Alpha\nsay 0 ^^ 42;            # 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Legamus regulas 📖 <a href=\"https://docs.raku.org/language/operators#Tight_AND_precedence\" target=\"_blank\" rel=\"noopener\">ex documentis<\/a>:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&amp;&amp;<\/code> reddit primum argumentum quod ut Booleanum Falsum est. Si nullum tale est, ultimum argumentum reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>||<\/code> reddit primum argumentum quod ut Booleanum Verum est. Si nullum tale est, ultimum argumentum reddit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>^^<\/code> reddit argumentum Verum, si unum tantum est. Si omnia argumenta Falsa sunt, ultimum reddit. Si plus quam unum argumentum Verum est, <code>Nil<\/code> reddit.<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota: modo <code>Nil<\/code> invenimus, qui est valor ‘nullum’.<\/span><\/p>"]]}}}</script>
