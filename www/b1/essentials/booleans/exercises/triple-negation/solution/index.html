 !!!⏏$value;\n    expecting any of:\n        infix\n        infix stopper\n        postfix\n        statement end\n        statement modifier\n        statement modifier loop<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unum spatium additum hanc quaestionem solvit.<\/span> <span class=\"sg\" data-s=\"1\">Sed noli in alias insidias incidere.<\/span> <span class=\"sg\" data-s=\"2\">Specta sequens programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = False;\nsay !!! $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma compilatur, sed cum sequenti nuntio desinit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku triple-negation.raku\nFalse\n    in block &lt;unit&gt; at exercises/booleans/triple-negation.raku line 2<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hoc fit quia <code>!!!<\/code> est operator specialis.<\/span> <span class=\"sg\" data-s=\"1\">Partem codicis ut codicem stub notat, id est codicem nondum perfectum.<\/span> <span class=\"sg\" data-s=\"2\">Si programma ad hunc locum pervenit, desinit et nuntium imprimit.<\/span> <span class=\"sg\" data-s=\"3\">In nostro casu nuntius erat valor praesens variabilis <code>$value<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Vide 📖 <a href=\"https://docs.raku.org/routine/!!!\" target=\"_blank\" rel=\"noopener\">documenta<\/a>, ut plura cognoscas.<\/span><\/p>"]]}}}</script>
