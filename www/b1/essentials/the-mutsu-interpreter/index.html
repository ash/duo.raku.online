<script type="application/json" id="page-data">{"u":"essentials/the-mutsu-interpreter","n":8,"k":"section","pv":"essentials/how-to-install-rakupp","nx":"essentials/how-to-install-mutsu","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The mutsu interpreter","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> is a third implementation of Raku, written in <strong>Rust<\/strong> by Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Like Rakudo, it compiles your program to bytecode and runs it on a virtual machine.<\/span> <span class=\"sg\" data-s=\"2\">But this virtual machine is not MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">It is mutsu’s own, built into the <code>mutsu<\/code> executable.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu supports Raku 6.d and is still in active development.<\/span> <span class=\"sg\" data-s=\"1\">Its author openly says it is not yet ready for real projects.<\/span> <span class=\"sg\" data-s=\"2\">But it already passes nearly all of the Roast test files.<\/span> <span class=\"sg\" data-s=\"3\">So almost all the programs in this course run on it without changes.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">One gap matters while you learn: some compile-time checks are still missing.<\/span> <span class=\"sg\" data-s=\"1\">The most visible one, as of version 0.24.0, is this.<\/span> <span class=\"sg\" data-s=\"2\">Imagine that you forget to declare a variable.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo and Raku++ report it before the program runs.<\/span> <span class=\"sg\" data-s=\"4\">But mutsu does not.<\/span> <span class=\"sg\" data-s=\"5\">When the course shows such an error, try that example with Rakudo or Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in the browser<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu can also be compiled to WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Then it runs inside a web page.<\/span> <span class=\"sg\" data-s=\"2\">Its website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, uses this in several ways.<\/span> <span class=\"sg\" data-s=\"3\">It has an introduction to Raku in English and Japanese.<\/span> <span class=\"sg\" data-s=\"4\">There is also a hands-on tutorial.<\/span> <span class=\"sg\" data-s=\"5\">And there is a playground where you can run Raku without installing anything.<\/span> <span class=\"sg\" data-s=\"6\">Everything on those pages runs mutsu itself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modules<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu comes with its own copy of the zef package manager, called <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So you can install Raku modules for it in the usual way.<\/span> <span class=\"sg\" data-s=\"2\">Just type <code>mzef install<\/code> and the name of the module.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu is open source.<\/span> <span class=\"sg\" data-s=\"1\">You can find it at <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Release builds and build instructions are there too.<\/span><\/p>"]]},"de":{"t":"Der mutsu-Interpreter","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> ist eine dritte Implementierung von Raku, von Tokuhiro Matsuno in <strong>Rust<\/strong> geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Wie Rakudo übersetzt er Ihr Programm in Bytecode und führt es auf einer virtuellen Maschine aus.<\/span> <span class=\"sg\" data-s=\"2\">Aber diese virtuelle Maschine ist nicht MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Es ist die eigene Maschine von mutsu, eingebaut in die ausführbare Datei <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu unterstützt Raku 6.d und wird noch aktiv entwickelt.<\/span> <span class=\"sg\" data-s=\"1\">Sein Autor sagt offen, dass mutsu noch nicht für echte Projekte bereit ist.<\/span> <span class=\"sg\" data-s=\"2\">Aber mutsu besteht schon fast alle Roast-Testdateien.<\/span> <span class=\"sg\" data-s=\"3\">Deshalb laufen fast alle Programme dieses Kurses ohne Änderungen darauf.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine Lücke ist beim Lernen wichtig: Einige Prüfungen zur Kompilierzeit fehlen noch.<\/span> <span class=\"sg\" data-s=\"1\">Die auffälligste in Version 0.24.0 ist diese.<\/span> <span class=\"sg\" data-s=\"2\">Stellen Sie sich vor, Sie vergessen, eine Variable zu deklarieren.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo und Raku++ melden das, bevor das Programm läuft.<\/span> <span class=\"sg\" data-s=\"4\">Aber mutsu tut das nicht.<\/span> <span class=\"sg\" data-s=\"5\">Wenn der Kurs so einen Fehler zeigt, probieren Sie das Beispiel mit Rakudo oder Raku++ aus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku im Browser<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu lässt sich auch nach WebAssembly kompilieren.<\/span> <span class=\"sg\" data-s=\"1\">Dann läuft er in einer Webseite.<\/span> <span class=\"sg\" data-s=\"2\">Seine Website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, nutzt das auf mehrere Arten.<\/span> <span class=\"sg\" data-s=\"3\">Sie hat eine Einführung in Raku auf Englisch und Japanisch.<\/span> <span class=\"sg\" data-s=\"4\">Es gibt auch ein Tutorial zum Mitmachen.<\/span> <span class=\"sg\" data-s=\"5\">Und es gibt einen Spielplatz, auf dem Sie Raku ausführen können, ohne etwas zu installieren.<\/span> <span class=\"sg\" data-s=\"6\">Alles auf diesen Seiten läuft mit mutsu selbst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Module<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu bringt eine eigene Kopie des Paketmanagers zef mit, die <code>mzef<\/code> heißt.<\/span> <span class=\"sg\" data-s=\"1\">So können Sie Raku-Module dafür auf die übliche Weise installieren.<\/span> <span class=\"sg\" data-s=\"2\">Tippen Sie einfach <code>mzef install<\/code> und den Namen des Moduls.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu ist quelloffen.<\/span> <span class=\"sg\" data-s=\"1\">Sie finden ihn unter <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Dort gibt es auch Release-Builds und eine Bauanleitung.<\/span><\/p>"]]},"nl":{"t":"De mutsu-interpreter","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> is een derde implementatie van Raku, in <strong>Rust<\/strong> geschreven door Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Net als Rakudo compileert hij je programma naar bytecode en voert hij het uit op een virtuele machine.<\/span> <span class=\"sg\" data-s=\"2\">Maar die virtuele machine is niet MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Het is een eigen machine van mutsu, ingebouwd in het uitvoerbare bestand <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu ondersteunt Raku 6.d en wordt nog actief ontwikkeld.<\/span> <span class=\"sg\" data-s=\"1\">De auteur zegt openlijk dat mutsu nog niet klaar is voor echte projecten.<\/span> <span class=\"sg\" data-s=\"2\">Maar hij slaagt nu al voor bijna alle testbestanden van Roast.<\/span> <span class=\"sg\" data-s=\"3\">Daarom draaien bijna alle programma's in deze cursus er zonder veranderingen op.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Eén probleem is belangrijk zolang je leert: sommige controles tijdens het compileren ontbreken nog.<\/span> <span class=\"sg\" data-s=\"1\">De duidelijkste, in versie 0.24.0, is deze.<\/span> <span class=\"sg\" data-s=\"2\">Stel dat je vergeet een variabele te declareren.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo en Raku++ melden dat voordat het programma draait.<\/span> <span class=\"sg\" data-s=\"4\">Maar mutsu doet dat niet.<\/span> <span class=\"sg\" data-s=\"5\">Als de cursus zo'n fout laat zien, probeer dat voorbeeld dan met Rakudo of Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in de browser<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu kan ook naar WebAssembly worden gecompileerd.<\/span> <span class=\"sg\" data-s=\"1\">Dan draait hij in een webpagina.<\/span> <span class=\"sg\" data-s=\"2\">Zijn website, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, gebruikt dit op verschillende manieren.<\/span> <span class=\"sg\" data-s=\"3\">Die heeft een inleiding tot Raku in het Engels en het Japans.<\/span> <span class=\"sg\" data-s=\"4\">Er is ook een praktische tutorial.<\/span> <span class=\"sg\" data-s=\"5\">En er is een speeltuin waar je Raku kunt uitvoeren zonder iets te installeren.<\/span> <span class=\"sg\" data-s=\"6\">Op al die pagina's draait mutsu zelf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modules<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu heeft een eigen kopie van de pakketbeheerder zef, die <code>mzef<\/code> heet.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er dus op de gewone manier Raku-modules voor installeren.<\/span> <span class=\"sg\" data-s=\"2\">Typ gewoon <code>mzef install<\/code> en de naam van de module.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu is open source.<\/span> <span class=\"sg\" data-s=\"1\">Je vindt hem op <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Daar staan ook kant-en-klare builds en bouwinstructies.<\/span><\/p>"]]},"es":{"t":"El intérprete mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> es una tercera implementación de Raku, escrita en <strong>Rust<\/strong> por Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Igual que Rakudo, compila tu programa a bytecode y lo ejecuta en una máquina virtual.<\/span> <span class=\"sg\" data-s=\"2\">Pero esta máquina virtual no es MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Es la propia de mutsu, integrada en el ejecutable <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu admite Raku 6.d y todavía está en desarrollo activo.<\/span> <span class=\"sg\" data-s=\"1\">Su autor dice abiertamente que aún no está listo para proyectos reales.<\/span> <span class=\"sg\" data-s=\"2\">Pero ya pasa casi todos los archivos de pruebas de Roast.<\/span> <span class=\"sg\" data-s=\"3\">Así que casi todos los programas de este curso funcionan en él sin cambios.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hay un punto débil que importa mientras aprendes: todavía faltan algunas comprobaciones en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">La más visible, en la versión 0.24.0, es esta.<\/span> <span class=\"sg\" data-s=\"2\">Imagina que olvidas declarar una variable.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo y Raku++ te avisan antes de ejecutar el programa.<\/span> <span class=\"sg\" data-s=\"4\">Pero mutsu no lo hace.<\/span> <span class=\"sg\" data-s=\"5\">Cuando el curso muestre un error así, prueba ese ejemplo con Rakudo o Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en el navegador<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu también se puede compilar a WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Entonces funciona dentro de una página web.<\/span> <span class=\"sg\" data-s=\"2\">Su sitio web, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, lo usa de varias formas.<\/span> <span class=\"sg\" data-s=\"3\">Tiene una introducción a Raku en inglés y en japonés.<\/span> <span class=\"sg\" data-s=\"4\">También hay un tutorial práctico.<\/span> <span class=\"sg\" data-s=\"5\">Y hay un campo de pruebas donde puedes ejecutar Raku sin instalar nada.<\/span> <span class=\"sg\" data-s=\"6\">Todo lo que hay en esas páginas lo ejecuta el propio mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Módulos<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu trae su propia copia del gestor de paquetes zef, llamada <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes instalarle módulos de Raku de la manera habitual.<\/span> <span class=\"sg\" data-s=\"2\">Solo escribe <code>mzef install<\/code> y el nombre del módulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu es de código abierto.<\/span> <span class=\"sg\" data-s=\"1\">Puedes encontrarlo en <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Allí también están los binarios de las versiones y las instrucciones de compilación.<\/span><\/p>"]]},"it":{"t":"L'interprete mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> è una terza implementazione di Raku, scritta in <strong>Rust<\/strong> da Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Come Rakudo, compila il tuo programma in bytecode e lo esegue su una macchina virtuale.<\/span> <span class=\"sg\" data-s=\"2\">Ma questa macchina virtuale non è MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">È la macchina di mutsu stesso, integrata nell'eseguibile <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu supporta Raku 6.d ed è ancora in fase di sviluppo attivo.<\/span> <span class=\"sg\" data-s=\"1\">Il suo autore dice apertamente che non è ancora pronto per progetti reali.<\/span> <span class=\"sg\" data-s=\"2\">Ma supera già quasi tutti i file di test di Roast.<\/span> <span class=\"sg\" data-s=\"3\">Quindi quasi tutti i programmi di questo corso girano su mutsu senza cambiamenti.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">C'è un limite che conta mentre impari: mancano ancora alcuni controlli in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Il caso più visibile, nella versione 0.24.0, è questo.<\/span> <span class=\"sg\" data-s=\"2\">Immagina di dimenticare di dichiarare una variabile.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo e Raku++ lo segnalano prima di eseguire il programma.<\/span> <span class=\"sg\" data-s=\"4\">Ma mutsu non lo fa.<\/span> <span class=\"sg\" data-s=\"5\">Quando il corso mostra un errore di questo tipo, prova quell'esempio con Rakudo o Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku nel browser<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu si può anche compilare in WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Allora gira dentro una pagina web.<\/span> <span class=\"sg\" data-s=\"2\">Il suo sito, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, lo usa in diversi modi.<\/span> <span class=\"sg\" data-s=\"3\">Ha un'introduzione a Raku in inglese e in giapponese.<\/span> <span class=\"sg\" data-s=\"4\">C'è anche un tutorial pratico.<\/span> <span class=\"sg\" data-s=\"5\">E c'è un campo da gioco dove puoi eseguire Raku senza installare nulla.<\/span> <span class=\"sg\" data-s=\"6\">Tutto in quelle pagine gira con mutsu stesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu ha una propria copia del gestore di pacchetti zef, chiamata <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi installare i moduli Raku per mutsu nel solito modo.<\/span> <span class=\"sg\" data-s=\"2\">Basta scrivere <code>mzef install<\/code> e il nome del modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu è open source.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarlo su <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Lì ci sono anche le build delle release e le istruzioni di compilazione.<\/span><\/p>"]]},"lv":{"t":"Interpretators mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> ir trešā Raku īstenošana, ko <strong>Rust<\/strong> valodā uzrakstījis Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā Rakudo, tas kompilē jūsu programmu baitkodā un izpilda to uz virtuālās mašīnas.<\/span> <span class=\"sg\" data-s=\"2\">Bet šī virtuālā mašīna nav MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir paša mutsu mašīna, iebūvēta izpildāmajā failā <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu atbalsta Raku 6.d, un to joprojām aktīvi izstrādā.<\/span> <span class=\"sg\" data-s=\"1\">Tā autors atklāti saka, ka tas vēl nav gatavs īstiem projektiem.<\/span> <span class=\"sg\" data-s=\"2\">Bet tas jau iztur gandrīz visus Roast testu failus.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc gandrīz visas šī kursa programmas uz tā darbojas bez izmaiņām.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Mācoties ir svarīgs viens trūkums: dažu kompilēšanas laika pārbaužu vēl nav.<\/span> <span class=\"sg\" data-s=\"1\">Visredzamākais gadījums versijā 0.24.0 ir šāds.<\/span> <span class=\"sg\" data-s=\"2\">Iedomājieties, ka jūs aizmirstat deklarēt mainīgo.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo un Raku++ par to ziņo, pirms programma tiek palaista.<\/span> <span class=\"sg\" data-s=\"4\">Bet mutsu to nedara.<\/span> <span class=\"sg\" data-s=\"5\">Kad kurss rāda šādu kļūdu, izmēģiniet šo piemēru ar Rakudo vai Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku pārlūkprogrammā<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu var arī kompilēt uz WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas darbojas tīmekļa lappusē.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietne, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, to izmanto vairākos veidos.<\/span> <span class=\"sg\" data-s=\"3\">Tajā ir Raku ievads angļu un japāņu valodā.<\/span> <span class=\"sg\" data-s=\"4\">Ir arī praktiska pamācība.<\/span> <span class=\"sg\" data-s=\"5\">Un ir spēļu laukums, kurā varat palaist Raku, neko neinstalējot.<\/span> <span class=\"sg\" data-s=\"6\">Visu šajās lappusēs darbina pats mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļi<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu nāk ar savu zef pakotņu pārvaldnieka kopiju, ko sauc <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku moduļus tam var instalēt ierastajā veidā.<\/span> <span class=\"sg\" data-s=\"2\">Vienkārši ierakstiet <code>mzef install<\/code> un moduļa nosaukumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To var atrast vietnē <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tur ir arī izlaidumu būvējumi un būvēšanas norādes.<\/span><\/p>"]]},"ru":{"t":"Интерпретатор mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — это третья реализация Raku, которую написал на <strong>Rust<\/strong> Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Как и Rakudo, он компилирует вашу программу в байт-код и выполняет её на виртуальной машине.<\/span> <span class=\"sg\" data-s=\"2\">Но эта виртуальная машина — не MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Это собственная машина mutsu, встроенная в исполняемый файл <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu поддерживает Raku 6.d и всё ещё активно развивается.<\/span> <span class=\"sg\" data-s=\"1\">Его автор открыто говорит, что mutsu пока не готов для реальных проектов.<\/span> <span class=\"sg\" data-s=\"2\">Но он уже проходит почти все тестовые файлы Roast.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому почти все программы этого курса работают на нём без изменений.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Пока вы учитесь, важен один недостаток: некоторых проверок во время компиляции всё ещё нет.<\/span> <span class=\"sg\" data-s=\"1\">Самая заметная из них, в версии 0.24.0, — вот эта.<\/span> <span class=\"sg\" data-s=\"2\">Представьте, что вы забыли объявить переменную.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo и Raku++ сообщат об этом ещё до запуска программы.<\/span> <span class=\"sg\" data-s=\"4\">Но mutsu этого не делает.<\/span> <span class=\"sg\" data-s=\"5\">Когда в курсе показана такая ошибка, попробуйте этот пример с Rakudo или Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузере<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu можно также скомпилировать в WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тогда он работает прямо на веб-странице.<\/span> <span class=\"sg\" data-s=\"2\">Его сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, использует это несколькими способами.<\/span> <span class=\"sg\" data-s=\"3\">На нём есть введение в Raku на английском и японском языках.<\/span> <span class=\"sg\" data-s=\"4\">Там есть и практический учебник.<\/span> <span class=\"sg\" data-s=\"5\">А ещё есть песочница, где можно запускать Raku, ничего не устанавливая.<\/span> <span class=\"sg\" data-s=\"6\">Всё на этих страницах работает на самом mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вместе с mutsu идёт собственная копия менеджера пакетов zef под названием <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому модули Raku для него можно устанавливать обычным способом.<\/span> <span class=\"sg\" data-s=\"2\">Просто напишите <code>mzef install<\/code> и название модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Его можно найти на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там же есть готовые сборки и инструкции по сборке.<\/span><\/p>"]]},"uk":{"t":"Інтерпретатор mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> — це третя реалізація Raku, яку мовою <strong>Rust<\/strong> написав Токухіро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Як і Rakudo, він компілює вашу програму в байткод і виконує її на віртуальній машині.<\/span> <span class=\"sg\" data-s=\"2\">Але ця віртуальна машина — не MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Це власна машина mutsu, вбудована у виконуваний файл <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu підтримує Raku 6.d і досі активно розробляється.<\/span> <span class=\"sg\" data-s=\"1\">Його автор відверто каже, що mutsu ще не готовий для справжніх проєктів.<\/span> <span class=\"sg\" data-s=\"2\">Але він уже проходить майже всі тестові файли Roast.<\/span> <span class=\"sg\" data-s=\"3\">Тож майже всі програми з цього курсу працюють на ньому без змін.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Під час навчання важлива одна прогалина: деяких перевірок під час компіляції ще немає.<\/span> <span class=\"sg\" data-s=\"1\">Ось найпомітніша з них у версії 0.24.0.<\/span> <span class=\"sg\" data-s=\"2\">Уявіть, що ви забули оголосити змінну.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo і Raku++ повідомляють про це ще до запуску програми.<\/span> <span class=\"sg\" data-s=\"4\">Але mutsu цього не робить.<\/span> <span class=\"sg\" data-s=\"5\">Коли курс показує таку помилку, спробуйте цей приклад з Rakudo або Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku у браузері<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu можна також скомпілювати у WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тоді він працює всередині веб-сторінки.<\/span> <span class=\"sg\" data-s=\"2\">Його сайт, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, використовує це по-різному.<\/span> <span class=\"sg\" data-s=\"3\">На ньому є вступ до Raku англійською та японською мовами.<\/span> <span class=\"sg\" data-s=\"4\">Є також практичний підручник.<\/span> <span class=\"sg\" data-s=\"5\">А ще є майданчик, де можна запускати Raku, нічого не встановлюючи.<\/span> <span class=\"sg\" data-s=\"6\">Усе на цих сторінках працює на самому mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модулі<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu має власну копію менеджера пакетів zef під назвою <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож модулі Raku для нього можна встановлювати звичайним способом.<\/span> <span class=\"sg\" data-s=\"2\">Просто введіть <code>mzef install<\/code> і назву модуля.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Його можна знайти на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там також є готові збірки випусків та інструкції зі збирання.<\/span><\/p>"]]},"bg":{"t":"Интерпретаторът mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> е трета реализация на Raku, написана на <strong>Rust<\/strong> от Токухиро Мацуно.<\/span> <span class=\"sg\" data-s=\"1\">Подобно на Rakudo, той компилира програмата ви до байткод и я изпълнява на виртуална машина.<\/span> <span class=\"sg\" data-s=\"2\">Но тази виртуална машина не е MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Тя е собствена на mutsu и е вградена в изпълнимия файл <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu поддържа Raku 6.d и все още се разработва активно.<\/span> <span class=\"sg\" data-s=\"1\">Авторът му открито казва, че той още не е готов за истински проекти.<\/span> <span class=\"sg\" data-s=\"2\">Но вече минава почти всички тестови файлове на Roast.<\/span> <span class=\"sg\" data-s=\"3\">Затова почти всички програми от този курс работят на него без промени.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Докато учите, един пропуск има значение: някои проверки по време на компилация все още липсват.<\/span> <span class=\"sg\" data-s=\"1\">Към версия 0.24.0 най-видимият от тях е следният.<\/span> <span class=\"sg\" data-s=\"2\">Представете си, че сте забравили да декларирате променлива.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo и Raku++ съобщават за това, преди програмата да се изпълни.<\/span> <span class=\"sg\" data-s=\"4\">Но mutsu не го прави.<\/span> <span class=\"sg\" data-s=\"5\">Когато курсът показва такава грешка, пробвайте този пример с Rakudo или Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku в браузъра<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu може да бъде компилиран и до WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Тогава той работи вътре в уеб страница.<\/span> <span class=\"sg\" data-s=\"2\">Сайтът му, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, използва това по няколко начина.<\/span> <span class=\"sg\" data-s=\"3\">На него има въведение в Raku на английски и японски.<\/span> <span class=\"sg\" data-s=\"4\">Има и практическо ръководство.<\/span> <span class=\"sg\" data-s=\"5\">Има и площадка, където можете да изпълнявате Raku, без да инсталирате нищо.<\/span> <span class=\"sg\" data-s=\"6\">Всичко на тези страници се изпълнява от самия mutsu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Модули<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu идва със собствено копие на мениджъра на пакети zef, наречено <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да инсталирате модули на Raku за него по обичайния начин.<\/span> <span class=\"sg\" data-s=\"2\">Просто напишете <code>mzef install<\/code> и името на модула.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го намерите на <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там има и компилации на изданията, и указания за изграждане.<\/span><\/p>"]]},"eo":{"t":"La interpretilo mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> estas tria realigo de Raku, verkita en <strong>Rust<\/strong> de Tokuhiro Matsuno.<\/span> <span class=\"sg\" data-s=\"1\">Same kiel Rakudo, ĝi kompilas vian programon al bajtkodo kaj rulas ĝin sur virtuala maŝino.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĉi tiu virtuala maŝino ne estas MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas la propra maŝino de mutsu, enkonstruita en la ruleblan dosieron <code>mutsu<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu subtenas Raku 6.d kaj ankoraŭ aktive evoluas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia aŭtoro malferme diras, ke ĝi ankoraŭ ne estas preta por veraj projektoj.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi jam trapasas preskaŭ ĉiujn testodosierojn de Roast.<\/span> <span class=\"sg\" data-s=\"3\">Do preskaŭ ĉiuj programoj de ĉi tiu kurso rulas sur ĝi sen ŝanĝoj.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unu breĉo gravas, dum vi lernas: kelkaj kompiltempaj kontroloj ankoraŭ mankas.<\/span> <span class=\"sg\" data-s=\"1\">La plej videbla, ĉe versio 0.24.0, estas ĉi tiu.<\/span> <span class=\"sg\" data-s=\"2\">Imagu, ke vi forgesas deklari variablon.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo kaj Raku++ raportas ĝin antaŭ ol la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"4\">Sed mutsu ne faras tion.<\/span> <span class=\"sg\" data-s=\"5\">Kiam la kurso montras tian eraron, provu tiun ekzemplon per Rakudo aŭ Raku++.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku en la retumilo<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu povas ankaŭ esti kompilita al WebAssembly.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi rulas ene de retpaĝo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia retejo, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, uzas tion en pluraj manieroj.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi havas enkondukon al Raku en la angla kaj la japana.<\/span> <span class=\"sg\" data-s=\"4\">Estas ankaŭ praktika lernilo.<\/span> <span class=\"sg\" data-s=\"5\">Kaj estas provejo, kie vi povas ruli Raku sen instali ion ajn.<\/span> <span class=\"sg\" data-s=\"6\">Ĉio en tiuj paĝoj rulas mutsu mem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduloj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu venas kun sia propra kopio de la pakaĵadministrilo zef, nomata <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas instali Raku-modulojn por ĝi laŭ la kutima maniero.<\/span> <span class=\"sg\" data-s=\"2\">Simple tajpu <code>mzef install<\/code> kaj la nomon de la modulo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin ĉe <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Eldonaj binaraĵoj kaj konstruinstrukcioj ankaŭ estas tie.<\/span><\/p>"]]},"la":{"t":"Interpres mutsu","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>mutsu<\/strong> est tertia implementatio Raku, in <strong>Rust<\/strong> a Tokuhiro Matsuno scripta.<\/span> <span class=\"sg\" data-s=\"1\">Sicut Rakudo, programma tuum in bytecode compilat et in machina virtuali exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Sed haec machina virtualis non est MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Est propria mutsu, in programmate exsecutabili <code>mutsu<\/code> inclusa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">mutsu Raku 6.d sustinet et adhuc strenue evolvitur.<\/span> <span class=\"sg\" data-s=\"1\">Auctor eius aperte dicit eum nondum ad vera incepta paratum esse.<\/span> <span class=\"sg\" data-s=\"2\">Sed iam paene omnia archiva probationum Roast transit.<\/span> <span class=\"sg\" data-s=\"3\">Itaque paene omnia programmata huius cursus sine mutationibus in eo currunt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Unus defectus, dum discis, momenti est: quaedam examinationes tempore compilationis adhuc desunt.<\/span> <span class=\"sg\" data-s=\"1\">Defectus maxime conspicuus, in versione 0.24.0, hic est.<\/span> <span class=\"sg\" data-s=\"2\">Finge te oblivisci variabilem declarare.<\/span> <span class=\"sg\" data-s=\"3\">Rakudo et Raku++ id nuntiant antequam programma currit.<\/span> <span class=\"sg\" data-s=\"4\">Sed mutsu hoc non facit.<\/span> <span class=\"sg\" data-s=\"5\">Cum cursus talem errorem ostendit, illud exemplum cum Rakudo aut Raku++ experire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Raku in navigatro interretiali<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">mutsu etiam in WebAssembly compilari potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum intra paginam interretialem currit.<\/span> <span class=\"sg\" data-s=\"2\">Situs eius interretialis, <a href=\"https://tokuhirom.github.io/mutsu/\" target=\"_blank\" rel=\"noopener\">tokuhirom.github.io/mutsu<\/a>, hoc pluribus modis adhibet.<\/span> <span class=\"sg\" data-s=\"3\">Introductionem in Raku Anglice et Iaponice habet.<\/span> <span class=\"sg\" data-s=\"4\">Est etiam institutio practica.<\/span> <span class=\"sg\" data-s=\"5\">Et est palaestra ubi Raku currere potes nihil installans.<\/span> <span class=\"sg\" data-s=\"6\">Omnia in illis paginis ipso mutsu currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu suum exemplar instrumenti moderandi modulos zef secum affert, nomine <code>mzef<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque modulos Raku pro eo more solito installare potes.<\/span> <span class=\"sg\" data-s=\"2\">Scribe tantum <code>mzef install<\/code> et nomen moduli.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">mutsu fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Eum apud <a href=\"https://github.com/tokuhirom/mutsu\" target=\"_blank\" rel=\"noopener\">github.com/tokuhirom/mutsu<\/a> invenire potes.<\/span> <span class=\"sg\" data-s=\"2\">Versiones emissae et praecepta aedificandi etiam ibi sunt.<\/span><\/p>"]]}}}</script>
