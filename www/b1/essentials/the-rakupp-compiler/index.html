p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> è un secondo compilatore Raku.<\/span> <span class=\"sg\" data-s=\"1\">Il suo file eseguibile si chiama <code>rakupp<\/code>, e la prima release è uscita nel luglio 2026.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo gira sulla macchina virtuale MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Raku++, invece, è scritto in <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Non ha bisogno di una sua macchina virtuale.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">È sia un <strong>interprete<\/strong> sia un <strong>compilatore<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Può eseguire un programma direttamente.<\/span> <span class=\"sg\" data-s=\"2\">Oppure può tradurlo in codice nativo per avere più velocità.<\/span> <span class=\"sg\" data-s=\"3\">Non c'è un runtime pesante da avviare.<\/span> <span class=\"sg\" data-s=\"4\">Quindi <code>rakupp<\/code> parte in pochi millisecondi.<\/span> <span class=\"sg\" data-s=\"5\">Questo lo rende piacevole per gli script brevi e per il lavoro di ogni giorno nel terminale.<\/span> <span class=\"sg\" data-s=\"6\">Il suo autore lo chiama il compilatore Raku più veloce.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalmente, Raku++ supporta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Supporta 6.e quando un programma lo chiede con <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La versione 5.4.1 è uscita nell'ottobre 2026.<\/span> <span class=\"sg\" data-s=\"3\">Supera tutti i 1.425 file di test della suite Roast.<\/span> <span class=\"sg\" data-s=\"4\">Roast è l'insieme ufficiale dei test di Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ gira anche in un browser web.<\/span> <span class=\"sg\" data-s=\"1\">È compilato in WebAssembly ed è il motore del campo da gioco su <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Lì puoi provare Raku senza installare nulla.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modalità interprete e compilatore<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi eseguire un programma subito, proprio come con Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Oppure chiedi a Raku++ di creare da un programma un eseguibile nativo separato.<\/span> <span class=\"sg\" data-s=\"1\">Gira ancora più in fretta:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per imparare ogni giorno, la semplice modalità interprete è tutto ciò che ti serve.<\/span> <span class=\"sg\" data-s=\"1\">Le modalità di compilazione ci sono per quando vuoi più velocità.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ è open source.<\/span> <span class=\"sg\" data-s=\"1\">Puoi trovarlo su <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Lì ci sono anche i file delle release già pronti e le istruzioni di compilazione.<\/span><\/p>"]]},"lv":{"t":"Kompilators Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> ir otrs Raku kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Tā izpildāmais fails saucas <code>rakupp<\/code>, un tas pirmoreiz tika izlaists 2026. gada jūlijā.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo darbojas uz MoarVM virtuālās mašīnas.<\/span> <span class=\"sg\" data-s=\"3\">Savukārt Raku++ ir uzrakstīts <strong>C++<\/strong> valodā.<\/span> <span class=\"sg\" data-s=\"4\">Tam nav vajadzīga sava virtuālā mašīna.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tas ir gan <strong>interpretators<\/strong>, gan <strong>kompilators<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tas var izpildīt programmu tieši.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī tas var pārtulkot to mašīnkodā, lai iegūtu papildu ātrumu.<\/span> <span class=\"sg\" data-s=\"3\">Nav smagas izpildlaika vides, kas jāpalaiž.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc <code>rakupp<\/code> startē tikai dažās milisekundēs.<\/span> <span class=\"sg\" data-s=\"5\">Tas padara to patīkamu īsiem skriptiem un ikdienas darbam terminālī.<\/span> <span class=\"sg\" data-s=\"6\">Tā autors to sauc par ātrāko Raku kompilatoru.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma Raku++ atbalsta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Tas atbalsta 6.e, ja programma to pieprasa ar <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Versija 5.4.1 tika izlaista 2026. gada oktobrī.<\/span> <span class=\"sg\" data-s=\"3\">Tā iztur visus 1425 Roast testu kopas failus.<\/span> <span class=\"sg\" data-s=\"4\">Roast ir oficiālā Raku testu kopa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ darbojas arī tīmekļa pārlūkprogrammā.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir kompilēts uz WebAssembly un darbina spēļu laukumu vietnē <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tur varat izmēģināt Raku, neko neinstalējot.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Interpretatora un kompilatora režīmi<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat uzreiz palaist programmu, tieši tāpat kā ar Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai arī lieciet Raku++ izveidot no programmas atsevišķu mašīnkoda izpildāmo failu.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas vēl ātrāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ikdienas mācībām pietiek ar parasto interpretatora režīmu.<\/span> <span class=\"sg\" data-s=\"1\">Kompilēšanas režīmi ir domāti tad, kad vēlaties papildu ātrumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ ir atvērtā koda projekts.<\/span> <span class=\"sg\" data-s=\"1\">To var atrast vietnē <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tur ir arī gatavi izlaidumu faili un būvēšanas norādes.<\/span><\/p>"]]},"ru":{"t":"Компилятор Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — это второй компилятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Его исполняемый файл называется <code>rakupp<\/code>, а впервые он вышел в июле 2026 года.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo работает на виртуальной машине MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">А Raku++ написан на <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Ему не нужна собственная виртуальная машина.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Он одновременно и <strong>интерпретатор<\/strong>, и <strong>компилятор<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Он может выполнить программу напрямую.<\/span> <span class=\"sg\" data-s=\"2\">Или он может перевести её в машинный код для большей скорости.<\/span> <span class=\"sg\" data-s=\"3\">Ему не нужно запускать тяжёлую среду выполнения.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому <code>rakupp<\/code> стартует всего за несколько миллисекунд.<\/span> <span class=\"sg\" data-s=\"5\">Это делает его удобным для коротких скриптов и повседневной работы в терминале.<\/span> <span class=\"sg\" data-s=\"6\">Автор называет его самым быстрым компилятором Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По умолчанию Raku++ поддерживает Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">А 6.e он поддерживает, когда программа просит об этом строкой <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Версия 5.4.1 вышла в октябре 2026 года.<\/span> <span class=\"sg\" data-s=\"3\">Она проходит все 1425 тестовых файлов набора Roast.<\/span> <span class=\"sg\" data-s=\"4\">Roast — это официальный набор тестов Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ работает и в веб-браузере.<\/span> <span class=\"sg\" data-s=\"1\">Он скомпилирован в WebAssembly, и на нём работает песочница на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там можно попробовать Raku, ничего не устанавливая.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режимы интерпретатора и компилятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программу можно запустить сразу, так же как с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Или попросите Raku++ сделать из программы отдельный исполняемый файл в машинном коде.<\/span> <span class=\"sg\" data-s=\"1\">Он работает ещё быстрее:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для повседневной учёбы вам хватит обычного режима интерпретатора.<\/span> <span class=\"sg\" data-s=\"1\">Режимы компиляции нужны тогда, когда вы хотите большей скорости.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ — открытое программное обеспечение.<\/span> <span class=\"sg\" data-s=\"1\">Его можно найти на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там же есть готовые файлы выпусков и инструкции по сборке.<\/span><\/p>"]]},"uk":{"t":"Компілятор Raku++","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> — це другий компілятор Raku.<\/span> <span class=\"sg\" data-s=\"1\">Його виконуваний файл називається <code>rakupp<\/code>, а перший випуск вийшов у липні 2026 року.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo працює на віртуальній машині MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">А от Raku++ написано мовою <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Власна віртуальна машина йому не потрібна.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Він є і <strong>інтерпретатором<\/strong>, і <strong>компілятором<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Він може виконати програму напряму.<\/span> <span class=\"sg\" data-s=\"2\">Або може перекласти її в машинний код, щоб вона працювала швидше.<\/span> <span class=\"sg\" data-s=\"3\">Йому не треба запускати важке середовище виконання.<\/span> <span class=\"sg\" data-s=\"4\">Тому <code>rakupp<\/code> стартує лише за кілька мілісекунд.<\/span> <span class=\"sg\" data-s=\"5\">Через це ним приємно користуватися для коротких скриптів і щоденної роботи в терміналі.<\/span> <span class=\"sg\" data-s=\"6\">Автор називає його найшвидшим компілятором Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням Raku++ підтримує Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">А 6.e він підтримує, коли програма просить про це рядком <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Версія 5.4.1 вийшла в жовтні 2026 року.<\/span> <span class=\"sg\" data-s=\"3\">Вона проходить усі 1425 тестових файлів набору Roast.<\/span> <span class=\"sg\" data-s=\"4\">Roast — це офіційний набір тестів Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ також працює у веб-браузері.<\/span> <span class=\"sg\" data-s=\"1\">Його компілюють у WebAssembly, і на ньому працює майданчик на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там можна спробувати Raku, нічого не встановлюючи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими інтерпретатора й компілятора<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете одразу виконати програму, так само як з Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Або попросіть Raku++ зробити з програми окремий машинний виконуваний файл.<\/span> <span class=\"sg\" data-s=\"1\">Він працює ще швидше:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для щоденного навчання вам вистачить звичайного режиму інтерпретатора.<\/span> <span class=\"sg\" data-s=\"1\">Режими компіляції потрібні тоді, коли ви хочете більшої швидкості.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ має відкритий код.<\/span> <span class=\"sg\" data-s=\"1\">Його можна знайти на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там також є готові файли випусків та інструкції зі збирання.<\/span><\/p>"]]},"bg":{"t":"Компилаторът Raku++","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> е втори компилатор на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Изпълнимият му файл се казва <code>rakupp<\/code>, а първото му издание излезе през юли 2026.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo работи върху виртуалната машина MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Raku++, от друга страна, е написан на <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Той няма нужда от собствена виртуална машина.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Той е едновременно <strong>интерпретатор<\/strong> и <strong>компилатор<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Може да изпълни програма направо.<\/span> <span class=\"sg\" data-s=\"2\">Или може да я преведе до машинен код за допълнителна скорост.<\/span> <span class=\"sg\" data-s=\"3\">Няма тежка среда за изпълнение, която да се стартира.<\/span> <span class=\"sg\" data-s=\"4\">Затова <code>rakupp<\/code> тръгва само за няколко милисекунди.<\/span> <span class=\"sg\" data-s=\"5\">Това го прави приятен за кратки скриптове и ежедневна работа в терминала.<\/span> <span class=\"sg\" data-s=\"6\">Авторът му го нарича най-бързия компилатор на Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По подразбиране Raku++ поддържа Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Той поддържа 6.e, когато програмата го поиска с <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Версия 5.4.1 беше издадена през октомври 2026.<\/span> <span class=\"sg\" data-s=\"3\">Тя минава всички 1425 тестови файла от набора Roast.<\/span> <span class=\"sg\" data-s=\"4\">Roast е официалният набор от тестове на Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ работи и в уеб браузър.<\/span> <span class=\"sg\" data-s=\"1\">Той е компилиран до WebAssembly и задвижва площадката на <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там можете да изпробвате Raku, без да инсталирате нищо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Режими на интерпретатор и компилатор<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да изпълните програма веднага, точно както с Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Или помолете Raku++ да направи от програмата отделен машинен изпълним файл.<\/span> <span class=\"sg\" data-s=\"1\">Той работи още по-бързо:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За ежедневно учене обикновеният режим на интерпретатор е всичко, което ви трябва.<\/span> <span class=\"sg\" data-s=\"1\">Компилиращите режими са за случаите, когато искате допълнителна скорост.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ е с отворен код.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го намерите на <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там има и готови файлове на изданията, и указания за изграждане.<\/span><\/p>"]]},"eo":{"t":"La kompililo Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> estas dua kompililo de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia rulebla dosiero nomiĝas <code>rakupp<\/code>, kaj ĝi unue aperis en julio 2026.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo rulas sur la virtuala maŝino MoarVM.<\/span> <span class=\"sg\" data-s=\"3\">Raku++, aliflanke, estas skribita en <strong>C++<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi bezonas neniun propran virtualan maŝinon.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ĝi estas kaj <strong>interpretilo<\/strong> kaj <strong>kompililo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas ruli programon rekte.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ ĝi povas traduki ĝin al maŝina kodo por plia rapideco.<\/span> <span class=\"sg\" data-s=\"3\">Ne estas peza rultempo por startigi.<\/span> <span class=\"sg\" data-s=\"4\">Do <code>rakupp<\/code> ekfunkcias en nur kelkaj milisekundoj.<\/span> <span class=\"sg\" data-s=\"5\">Tio faras ĝin agrabla por mallongaj skriptoj kaj ĉiutaga laboro en la terminalo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝia aŭtoro nomas ĝin la plej rapida kompililo de Raku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, Raku++ subtenas Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi subtenas 6.e, kiam programo petas tion per <code>use v6.e.PREVIEW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Versio 5.4.1 aperis en oktobro 2026.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi trapasas ĉiujn 1425 testodosierojn de la testaro Roast.<\/span> <span class=\"sg\" data-s=\"4\">Roast estas la oficiala aro de testoj de Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ ankaŭ rulas en retumilo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas kompilita al WebAssembly kaj funkciigas la provejon ĉe <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tie vi povas provi Raku sen instali ion ajn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reĝimoj de interpretilo kaj kompililo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas tuj ruli programon, same kiel per Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aŭ petu al Raku++ fari apartan maŝinkodan ruleblan dosieron el programo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi rulas eĉ pli rapide:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por ĉiutaga lernado, la simpla interpretila reĝimo estas ĉio, kion vi bezonas.<\/span> <span class=\"sg\" data-s=\"1\">La kompilaj reĝimoj estas tie por kiam vi volas plian rapidecon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ estas malfermitkoda.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trovi ĝin ĉe <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Pretaj eldonaj dosieroj kaj konstruinstrukcioj ankaŭ estas tie.<\/span><\/p>"]]},"la":{"t":"Compilator Raku++ 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Raku++<\/strong> est alter compilator Raku.<\/span> <span class=\"sg\" data-s=\"1\">Programma eius exsecutabile <code>rakupp<\/code> nominatur, et primum mense Iulio anni 2026 emissum est.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo in machina virtuali MoarVM currit.<\/span> <span class=\"sg\" data-s=\"3\">Raku++ autem in <strong>C++<\/strong> scriptum est.<\/span> <span class=\"sg\" data-s=\"4\">Nullam machinam virtualem propriam requirit.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Est simul <strong>interpres<\/strong> et <strong>compilator<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Programma directe exsequi potest.<\/span> <span class=\"sg\" data-s=\"2\">Aut id in codicem nativum transferre potest, ad maiorem celeritatem.<\/span> <span class=\"sg\" data-s=\"3\">Nullum grave systema exsecutionis incipiendum est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque <code>rakupp<\/code> intra pauca millisecunda incipit.<\/span> <span class=\"sg\" data-s=\"5\">Ideo iucundum est ad brevia scripta et cotidianum laborem in terminali.<\/span> <span class=\"sg\" data-s=\"6\">Auctor eius id compilatorem Raku celerrimum vocat.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ex more Raku++ Raku 6.d sustinet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam 6.e sustinet, cum programma id per <code>use v6.e.PREVIEW<\/code> petit.<\/span> <span class=\"sg\" data-s=\"2\">Versio 5.4.1 mense Octobri anni 2026 emissa est.<\/span> <span class=\"sg\" data-s=\"3\">Omnia 1425 archiva probationum seriei Roast transit.<\/span> <span class=\"sg\" data-s=\"4\">Roast est series officialis probationum Raku.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ etiam in navigatro interretiali currit.<\/span> <span class=\"sg\" data-s=\"1\">In WebAssembly compilatur et palaestram apud <a href=\"https://raku.online\" target=\"_blank\" rel=\"noopener\">raku.online<\/a> movet.<\/span> <span class=\"sg\" data-s=\"2\">Ibi Raku experiri potes nihil installans.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Modi interpretis et compilatoris<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma statim exsequi potes, sicut cum Rakudo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp hello.raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aut Raku++ iube ex programmate exsecutabile nativum separatum facere.<\/span> <span class=\"sg\" data-s=\"1\">Etiam celerius currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ rakupp --exe hello.raku -o hello\n$ ./hello<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ad cotidianum discendum, modus interpretis simplex omnino sufficit.<\/span> <span class=\"sg\" data-s=\"1\">Modi compilandi adsunt cum maiorem celeritatem vis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku++ fontis aperti est.<\/span> <span class=\"sg\" data-s=\"1\">Id apud <a href=\"https://github.com/ash/rakupp\" target=\"_blank\" rel=\"noopener\">github.com/ash/rakupp<\/a> invenire potes.<\/span> <span class=\"sg\" data-s=\"2\">Fasciculi emissi parati et praecepta aedificandi etiam ibi sunt.<\/span><\/p>"]]}}}</script>
