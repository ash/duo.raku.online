<script type="application/json" id="page-data">{"u":"essentials/strings/string-concatenation","n":54,"k":"topic","pv":"essentials/strings","nx":"essentials/strings/string-concatenation/quiz1","tr":["essentials","essentials/strings"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"String concatenation in Raku","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">If you have two strings, you can join them and get a new, longer string.<\/span> <span class=\"sg\" data-s=\"1\">This is called string concatenation.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, you concatenate strings with—guess what?—the concatenation operator.<\/span> <span class=\"sg\" data-s=\"3\">This operator is a tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">To concatenate two strings, put <code>~<\/code> between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If our strings are kept in variables, we can ‘concatenate variables’.<\/span> <span class=\"sg\" data-s=\"1\">Well, to be exact, we concatenate the strings that those variables keep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Or you can create a new variable that keeps the result of the concatenation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenation with assignment<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To add a new string to the end of a variable, use this form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"de":{"t":"Zeichenkettenverkettung","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie zwei Zeichenketten haben, können Sie sie zusammenfügen und eine neue, längere Zeichenkette bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Das nennt man Zeichenkettenverkettung.<\/span> <span class=\"sg\" data-s=\"2\">In Raku verketten Sie Zeichenketten mit—raten Sie mal?—dem Verkettungsoperator.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Operator ist eine Tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Um zwei Zeichenketten zu verketten, setzen Sie <code>~<\/code> zwischen sie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn unsere Zeichenketten in Variablen gespeichert sind, können wir ‚Variablen verketten‘.<\/span> <span class=\"sg\" data-s=\"1\">Na ja, genauer gesagt verketten wir die Zeichenketten, die diese Variablen enthalten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oder Sie erstellen eine neue Variable, die das Ergebnis der Verkettung speichert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Verkettung mit Zuweisung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine neue Zeichenkette am Ende einer Variablen hinzuzufügen, verwenden Sie diese Form:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstatt von \n$str = $str ~ $another-str;\n\n# verwenden Sie:\n$str ~= $another-str;<\/code><\/pre>"]]},"nl":{"t":"String concatenatie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Als je twee strings hebt, kun je ze samenvoegen en een nieuwe, langere string krijgen.<\/span> <span class=\"sg\" data-s=\"1\">Dit heet stringconcatenatie.<\/span> <span class=\"sg\" data-s=\"2\">In Raku concateneer je strings met—raad eens?—de concatenatie-operator.<\/span> <span class=\"sg\" data-s=\"3\">Deze operator is een tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Om twee strings te concateneren, zet je <code>~<\/code> ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als onze strings in variabelen staan, kunnen we ‘variabelen concateneren’.<\/span> <span class=\"sg\" data-s=\"1\">Nou ja, om precies te zijn, concateneren we de strings die in die variabelen staan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Of je kunt een nieuwe variabele maken die het resultaat van de concatenatie bewaart:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatie met toewijzing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een nieuwe string aan het eind van een variabele toe te voegen, gebruik je deze vorm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># In plaats van \n$str = $str ~ $another-str;\n\n# gebruik:\n$str ~= $another-str;<\/code><\/pre>"]]},"es":{"t":"Concatenación de cadenas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Si tienes dos cadenas, puedes unirlas y obtener una cadena nueva y más larga.<\/span> <span class=\"sg\" data-s=\"1\">Esto se llama concatenación de cadenas.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, concatenas cadenas con—¿adivinas qué?—el operador de concatenación.<\/span> <span class=\"sg\" data-s=\"3\">Este operador es una tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Para concatenar dos cadenas, pon <code>~<\/code> entre ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si nuestras cadenas están guardadas en variables, podemos ‘concatenar variables’.<\/span> <span class=\"sg\" data-s=\"1\">Bueno, para ser exactos, concatenamos las cadenas que esas variables guardan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">O puedes crear una nueva variable que guarde el resultado de la concatenación:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenación con asignación<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para añadir una nueva cadena al final de una variable, usa esta forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># En lugar de \n$str = $str ~ $another-str;\n\n# usa:\n$str ~= $another-str;<\/code><\/pre>"]]},"it":{"t":"Concatenazione di stringhe","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Se hai due stringhe, puoi unirle e ottenere una nuova stringa, più lunga.<\/span> <span class=\"sg\" data-s=\"1\">Questo si chiama concatenazione di stringhe.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, concateni le stringhe con—indovina un po'?—l'operatore di concatenazione.<\/span> <span class=\"sg\" data-s=\"3\">Questo operatore è una tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Per concatenare due stringhe, metti <code>~<\/code> tra di loro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se le nostre stringhe sono in variabili, possiamo ‘concatenare variabili’.<\/span> <span class=\"sg\" data-s=\"1\">Beh, per essere precisi, concateniamo le stringhe che quelle variabili contengono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oppure puoi creare una nuova variabile che contiene il risultato della concatenazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenazione con assegnazione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per aggiungere una nuova stringa alla fine di una variabile, usa questa forma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Invece di \n$str = $str ~ $another-str;\n\n# usa:\n$str ~= $another-str;<\/code><\/pre>"]]},"lv":{"t":"Virkņu savienošana","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ja jums ir divas virknes, jūs varat tās savienot un iegūt jaunu, garāku virkni.<\/span> <span class=\"sg\" data-s=\"1\">To sauc par virkņu savienošanu.<\/span> <span class=\"sg\" data-s=\"2\">Raku valodā jūs savienojat virknes ar—uzminiet, ko?—savienošanas operatoru.<\/span> <span class=\"sg\" data-s=\"3\">Šis operators ir tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Lai savienotu divas virknes, ielieciet <code>~<\/code> starp tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja mūsu virknes glabājas mainīgajos, mēs varam ‘savienot mainīgos’.<\/span> <span class=\"sg\" data-s=\"1\">Nu, precīzāk sakot, mēs savienojam virknes, kuras šie mainīgie glabā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vai arī jūs varat izveidot jaunu mainīgo, kas glabā savienošanas rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"la форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Instead of \n$str = $str ~ $another-str;\n\n# use:\n$str ~= $another-str;<\/code><\/pre>"]]},"uk":{"t":"Конкатенація рядків","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Якщо у вас є два рядки, ви можете з'єднати їх і отримати новий, довший рядок.<\/span> <span class=\"sg\" data-s=\"1\">Це називається конкатенацією рядків.<\/span> <span class=\"sg\" data-s=\"2\">У Raku ви конкатенуєте рядки за допомогою—вгадайте чого?—оператора конкатенації.<\/span> <span class=\"sg\" data-s=\"3\">Цей оператор — тильда, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Щоб конкатенувати два рядки, поставте <code>~<\/code> між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо наші рядки зберігаються у змінних, ми можемо ‘конкатенувати змінні’.<\/span> <span class=\"sg\" data-s=\"1\">Ну, точніше, ми конкатенуємо рядки, які зберігаються в цих змінних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Або ви можете створити нову змінну, яка зберігає результат конкатенації:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенація з присвоєнням<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб додати новий рядок у кінець змінної, використовуйте таку форму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Замість \n$str = $str ~ $another-str;\n\n# використовуйте:\n$str ~= $another-str;<\/code><\/pre>"]]},"bg":{"t":"Конкатенация на стрингове","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ако имате два низа, можете да ги съедините и да получите нов, по-дълъг низ.<\/span> <span class=\"sg\" data-s=\"1\">Това се нарича конкатенация на низове.<\/span> <span class=\"sg\" data-s=\"2\">В Raku конкатенирате низове с—познайте какво?—оператора за конкатенация.<\/span> <span class=\"sg\" data-s=\"3\">Този оператор е тилда, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">За да конкатенирате два низа, сложете <code>~<\/code> между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако нашите низове се пазят в променливи, можем да „конкатенираме променливи“.<\/span> <span class=\"sg\" data-s=\"1\">Е, по-точно, конкатенираме низовете, които тези променливи пазят:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Или можете да създадете нова променлива, която пази резултата от конкатенацията:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Конкатенация с присвояване<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да добавите нов низ в края на променлива, използвайте тази форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Вместо \n$str = $str ~ $another-str;\n\n# използвайте:\n$str ~= $another-str;<\/code><\/pre>"]]},"eo":{"t":"Ĉena konkatenado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Se vi havas du ĉenojn, vi povas kunigi ilin kaj ricevi novan, pli longan ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Tio nomiĝas konkatenado de ĉenoj.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, vi kunigas ĉenojn per—divenu kion?—la konkatenada operatoro.<\/span> <span class=\"sg\" data-s=\"3\">Tiu operatoro estas tildo, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Por kunigi du ĉenojn, metu <code>~<\/code> inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se niaj ĉenoj estas konservitaj en variabloj, ni povas ‘kunigi variablojn’.<\/span> <span class=\"sg\" data-s=\"1\">Nu, por esti preciza, ni kunigas la ĉenojn, kiujn tiuj variabloj tenas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aŭ vi povas krei novan variablon, kiu tenas la rezulton de la kunigo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkatenado kun asigno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por aldoni novan ĉenon al la fino de variablo, uzu ĉi tiun formon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Anstataŭ \n$str = $str ~ $another-str;\n\n# uzu:\n$str ~= $another-str;<\/code><\/pre>"]]},"la":{"t":"Catena concatenatio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Si duas chordas habes, eas coniungere et novam chordam longiorem accipere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc concatenatio chordarum appellatur.<\/span> <span class=\"sg\" data-s=\"2\">In Raku chordas concatenas—quid putas?—operatore concatenationis.<\/span> <span class=\"sg\" data-s=\"3\">Hic operator est tilde, <code>~<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ut duas chordas concatenes, <code>~<\/code> inter eas pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello, ' ~ 'World!';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si chordae nostrae in variabilibus tenentur, ‘variabiles concatenare’ possumus.<\/span> <span class=\"sg\" data-s=\"1\">Sed, ut accurate dicam, chordas concatenamus quas illae variabiles tenent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\n\nsay $greeting ~ $who;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vel novam variabilem creare potes quae eventum concatenationis tenet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $greeting = 'Hello, ';\nmy $who = 'World!';\nmy $message = $greeting ~ $who;\n\nsay $message;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Concatenatio cum assignatione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut novam chordam ad finem variabilis addas, hac forma utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># Pro\n$str = $str ~ $another-str;\n\n# utere:\n$str ~= $another-str;<\/code><\/pre>"]]}}}</script>
