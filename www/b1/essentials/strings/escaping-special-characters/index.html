 dollaro indica che c'è una variabile da interpolare.<\/span> <span class=\"sg\" data-s=\"3\">Per stampare il carattere <code>$<\/code> stesso, devi farne l'escape:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, puoi anche evitare l'escape di <code>$<\/code> con la concatenazione di stringhe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questa versione stampa esattamente la stessa stringa.<\/span> <span class=\"sg\" data-s=\"1\">Ma l'interpolazione sembra più naturale ed è più facile da leggere.<\/span> <span class=\"sg\" data-s=\"2\">Nota la stringa tra apici singoli <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Qui il carattere <code>$<\/code> non viene né interpolato né escapato.<\/span> <span class=\"sg\" data-s=\"4\">Questa è la differenza principale.<\/span> <span class=\"sg\" data-s=\"5\">I caratteri speciali tra apici singoli appaiono così come sono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nelle stringhe tra doppi apici, alcuni altri caratteri hanno un significato speciale:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Segno di dollaro <code>\\n<\/code> | Nuova riga <code>\\r<\/code> | Ritorno a capo <code>\\t<\/code> | Tabulazione orizzontale <code>\\\"<\/code> | Doppio apice <code>\\\\<\/code> | Barra rovesciata<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tipo di virgolette intorno a una stringa decide come Raku tratta i caratteri speciali.<\/span> <span class=\"sg\" data-s=\"1\">Guarda questi due esempi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se esegui questo programma, la prima stringa appare senza cambiamenti, su una sola riga.<\/span> <span class=\"sg\" data-s=\"1\">Ma la seconda stringa è divisa in due parti:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tra doppi apici, Raku tratta la sequenza speciale <code>\\n<\/code> come un carattere di nuova riga.<\/span> <span class=\"sg\" data-s=\"1\">Tra apici singoli, sono solo due caratteri normali: <code>\\<\/code> e <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">C'è un'eccezione interessante per <code>'<\/code> e <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tra apici singoli, puoi fare l'escape di un apice singolo con un <code>\\<\/code> davanti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se un apice singolo segue una barra rovesciata, devi fare l'escape anche della barra rovesciata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"lv":{"t":"Speciālo rakstzīmju izbēgšana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Iedomājieties, ka vēlaties izdrukāt cenu zīmi.<\/span> <span class=\"sg\" data-s=\"1\">Produkta nosaukumu un tā cenu jūs glabājat divos skalārajos mainīgajos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kā izdrukāt zīmi, ja cena ir dolāros?<\/span> <span class=\"sg\" data-s=\"1\">Izvadei jābūt <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet dubultpēdiņu virknēs dolāra zīme rāda, ka mainīgais ir jāinterpolē.<\/span> <span class=\"sg\" data-s=\"3\">Lai izdrukātu pašu <code>$<\/code> rakstzīmi, jums tā ir jāaizbēg:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, ar virkņu savienošanu jūs varat arī iztikt bez <code>$<\/code> aizbēgšanas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šis variants izdrukā tieši tādu pašu virkni.<\/span> <span class=\"sg\" data-s=\"1\">Bet interpolācija izskatās dabiskāk, un to ir vieglāk lasīt.<\/span> <span class=\"sg\" data-s=\"2\">Ievērojiet virkni vienkāršajās pēdiņās <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tajā <code>$<\/code> rakstzīme netiek ne interpolēta, ne aizbēgta.<\/span> <span class=\"sg\" data-s=\"4\">Tā ir galvenā atšķirība.<\/span> <span class=\"sg\" data-s=\"5\">Speciālās rakstzīmes vienkāršajās pēdiņās parādās tādas, kādas tās ir.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dubultpēdiņu virknēs īpaša nozīme ir vēl dažām rakstzīmēm:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Dolāra zīme <code>\\n<\/code> | Jauna rinda <code>\\r<\/code> | Karietes atgriešana <code>\\t<\/code> | Horizontāla tabulācija <code>\\\"<\/code> | Dubultā pēdiņa <code>\\\\<\/code> | Atpakaļslīpsvītra<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēdiņu veids ap virkni nosaka, kā Raku apstrādā speciālās rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet šos divus piemērus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūs palaižat šo programmu, pirmā virkne parādās nemainīta, vienā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Bet otrā virkne ir sadalīta divās daļās:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">One\\nTwo     Three     Four<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dubultajās pēdiņās Raku apstrādā speciālo secību <code>\\n<\/code> kā jaunas rindas rakstzīmi.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršajās pēdiņās tās ir tikai divas parastas rakstzīmes: <code>\\<\/code> un <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir interesants izņēmums ar <code>'<\/code> un <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršajās pēdiņās jūs varat aizbēgt vienpēdiņu, ieliekot tās priekšā <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja atpakaļslīpsvītrai seko vienpēdiņa, jums jāaizbēg arī atpakaļslīpsvītra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"ru":{"t":"Экранирование специальных символов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Представьте, что вы хотите напечатать ценник.<\/span> <span class=\"sg\" data-s=\"1\">Название товара и его цену вы храните в двух скалярных переменных.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Как напечатать ценник, если цена в долларах?<\/span> <span class=\"sg\" data-s=\"1\">Вывод должен быть таким: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но в строках в двойных кавычках знак доллара показывает, что нужно интерполировать переменную.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы напечатать сам символ <code>$<\/code>, его нужно экранировать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, можно обойтись без экранирования <code>$<\/code>, если использовать конкатенацию строк:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Этот вариант печатает точно такую же строку.<\/span> <span class=\"sg\" data-s=\"1\">Но интерполяция выглядит естественнее, и её легче читать.<\/span> <span class=\"sg\" data-s=\"2\">Обратите внимание на строку в одинарных кавычках <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В ней символ <code>$<\/code> не интерполируется и не экранируется.<\/span> <span class=\"sg\" data-s=\"4\">В этом и есть главная разница.<\/span> <span class=\"sg\" data-s=\"5\">Специальные символы в одинарных кавычках выводятся как есть.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В строках в двойных кавычках ещё несколько символов имеют особое значение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Знак доллара <code>\\n<\/code> | Новая строка <code>\\r<\/code> | Возврат каретки <code>\\t<\/code> | Горизонтальный таб <code>\\\"<\/code> | Двойная кавычка <code>\\\\<\/code> | Обратный слэш<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вид кавычек вокруг строки определяет, как Raku обращается со специальными символами.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на эти два примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'One\\nTwo';\nsay \"Three\\nFour\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если запустить эту программу, первая строка появится без изменений, на одной строчке.<\/span> <span class=\"sg\" data-s=\"1\">Но вторая строка разбита на две части:<\/span><\/p>"],["code",0,"<pre><code>One\\nTwo\nThree\nFour<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В двойных кавычках Raku понимает специальную последовательность <code>\\n<\/code> как символ новой строки.<\/span> <span class=\"sg\" data-s=\"1\">В одинарных кавычках это просто два обычных символа: <code>\\<\/code> и <code>n<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть интересное исключение для <code>'<\/code> и <code>\\<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В одинарных кавычках можно экранировать одинарную кавычку, если поставить перед ней <code>\\<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say '\\''; # '<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если за обратным слэшем идёт одинарная кавычка, обратный слэш тоже нужно экранировать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a\\b\\c\\\\'; # a\\b\\c\\<\/code><\/pre>"]]},"uk":{"t":"Екранування спеціальних символів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Уявіть, що ви хочете надрукувати цінник.<\/span> <span class=\"sg\" data-s=\"1\">Назву продукту і його ціну ви зберігаєте у двох скалярних змінних.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Як надрукувати цінник, якщо ціна в доларах?<\/span> <span class=\"sg\" data-s=\"1\">Результат має бути таким: <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але в рядках з подвійними лапками знак долара показує, що змінну треба інтерполювати.<\/span> <span class=\"sg\" data-s=\"3\">Щоб надрукувати сам символ <code>$<\/code>, його потрібно екранувати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, ви також можете уникнути екранування <code>$<\/code> за допомогою конкатенації рядків:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Цей варіант друкує точно такий самий рядок.<\/span> <span class=\"sg\" data-s=\"1\">Але інтерполяція виглядає природніше, і її легше читати.<\/span> <span class=\"sg\" data-s=\"2\">Зверніть увагу на рядок з одинарними лапками <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">У ньому символ <code>$<\/code> не інтерполюється і не екранується.<\/span> <span class=\"sg\" data-s=\"4\">Це головна відмінність.<\/span> <span class=\"sg\" data-s=\"5\">Спеціальні символи в одинарних лапках з'являються такими, як є.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"> \"sg\" data-s=\"1\">Пазите името на продукта и неговата цена в две скаларни променливи.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $product = 'Electricity';\nmy $price = 3.14;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Как да отпечатате етикета, ако цената е в долари?<\/span> <span class=\"sg\" data-s=\"1\">Изходът трябва да бъде <code>Electricity costs $3.14<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но в низове с двойни кавички знакът за долар показва, че трябва да се интерполира променлива.<\/span> <span class=\"sg\" data-s=\"3\">За да отпечатате самия символ <code>$<\/code>, трябва да го избягате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"$product costs \\$$price\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, с конкатенация на низове няма нужда да избягвате <code>$<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $product ~ ' costs $' ~ $price;<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Този вариант отпечатва точно същия низ.<\/span> <span class=\"sg\" data-s=\"1\">Но интерполацията изглежда по-естествено и се чете по-лесно.<\/span> <span class=\"sg\" data-s=\"2\">Обърнете внимание на низа в единични кавички <code>' costs $'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В него символът <code>$<\/code> нито се интерполира, нито се избягва.<\/span> <span class=\"sg\" data-s=\"4\">Това е основната разлика.<\/span> <span class=\"sg\" data-s=\"5\">Специалните символи в единични кавички се появяват такива, каквито са.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В низове с двойни кавички още няколко символа имат специално значение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>\\$<\/code> | Знак за долар <code>\\n<\/code> | Нов ред <code>\\r<\/code> | Връщане на каретката <code>\\t<\/code> | Хоризонтален табулатор <code>\\\"<\/code> | Двойни кавички <code>\\\\<\/code> | Обратна наклонена черта<\/span><\/p>"],[
