<script type="application/json" id="page-data">{"u":"essentials/strings/code-interpolation","n":60,"k":"topic","pv":"essentials/strings/variable-interpolation/quiz","nx":"essentials/strings/escaping-special-characters","tr":["essentials","essentials/strings"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Code interpolation in Raku strings","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Code interpolation is the next level of interpolation.<\/span> <span class=\"sg\" data-s=\"1\">It lets you put code directly inside a double-quoted string.<\/span> <span class=\"sg\" data-s=\"2\">The code can be simple, or even complex!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The code to interpolate goes between curly braces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variables again<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One use of this method is when a variable must be followed by some text.<\/span> <span class=\"sg\" data-s=\"1\">That text could be wrongly read as the rest of the variable's name.<\/span> <span class=\"sg\" data-s=\"2\">To prevent this, put the variable inside curly braces:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without curly braces, Raku would try to interpolate <code>$whats<\/code>, a variable that does not exist.<\/span><\/p>"]]},"de":{"t":"Code-Interpolation","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Code-Interpolation ist das nächste Level der Interpolation.<\/span> <span class=\"sg\" data-s=\"1\">Damit können Sie Code direkt in einen String in doppelten Anführungszeichen setzen.<\/span> <span class=\"sg\" data-s=\"2\">Der Code kann einfach oder sogar komplex sein!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Code, den Sie interpolieren möchten, steht zwischen geschweiften Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nochmals Variablen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Anwendung dieser Methode ist der Fall, wenn nach einer Variablen ein Text folgen muss.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Text könnte falsch als Rest des Variablennamens gelesen werden.<\/span> <span class=\"sg\" data-s=\"2\">Um das zu verhindern, setzen Sie die Variable in geschweifte Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne geschweifte Klammern würde Raku versuchen, <code>$whats<\/code> zu interpolieren, eine Variable, die es nicht gibt.<\/span><\/p>"]]},"nl":{"t":"Code interpolatie","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Code interpolatie is het volgende niveau van interpolatie.<\/span> <span class=\"sg\" data-s=\"1\">Hiermee kunt u code direct in een string met dubbele aanhalingstekens plaatsen.<\/span> <span class=\"sg\" data-s=\"2\">De code kan eenvoudig zijn, of zelfs complex!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De code die u wilt interpoleren, komt tussen accolades:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"De som van $a en $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nDe som van 10 en 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opnieuw variabelen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén toepassing van deze methode is wanneer er tekst na een variabele moet komen.<\/span> <span class=\"sg\" data-s=\"1\">Die tekst kan per ongeluk gelezen worden als de rest van de naam van de variabele.<\/span> <span class=\"sg\" data-s=\"2\">Om dat te voorkomen, zet u de variabele tussen accolades:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $hoeveel = 5;\nmy $wat = 'pak';\nsay \"Er zijn $hoeveel {$wat}ken.\"; # Er zijn 5 pakken.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder accolades zou Raku proberen <code>$watken<\/code> te interpoleren, een variabele die niet bestaat.<\/span><\/p>"]]},"es":{"t":"Interpolación de código","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La interpolación de código es el siguiente nivel de interpolación.<\/span> <span class=\"sg\" data-s=\"1\">Te permite poner código directamente dentro de una cadena entre comillas dobles.<\/span> <span class=\"sg\" data-s=\"2\">¡El código puede ser simple, o incluso complejo!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El código que quieres interpolar va entre llaves:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La suma de $a y $b es {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa suma de 10 y 20 es 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variables de nuevo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un uso de este método es cuando una variable debe ir seguida de un texto.<\/span> <span class=\"sg\" data-s=\"1\">Ese texto se podría leer por error como el resto del nombre de la variable.<\/span> <span class=\"sg\" data-s=\"2\">Para evitarlo, pon la variable entre llaves:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'traje';\nsay \"Hay $how-many {$what}s.\"; # Hay 5 trajes.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin llaves, Raku intentaría interpolar <code>$whats<\/code>, una variable que no existe.<\/span><\/p>"]]},"it":{"t":"Interpolazione del codice","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'interpolazione di codice è il livello successivo di interpolazione.<\/span> <span class=\"sg\" data-s=\"1\">Ti permette di mettere del codice direttamente dentro una stringa tra doppi apici.<\/span> <span class=\"sg\" data-s=\"2\">Il codice può essere semplice, o anche complesso!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il codice da interpolare va tra parentesi graffe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La somma di $a e $b è {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa somma di 10 e 20 è 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ancora variabili<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un uso di questo metodo è quando dopo una variabile deve esserci del testo.<\/span> <span class=\"sg\" data-s=\"1\">Quel testo potrebbe essere letto per errore come il resto del nome della variabile.<\/span> <span class=\"sg\" data-s=\"2\">Per evitarlo, metti la variabile tra parentesi graffe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Ci sono $how-many {$what}s.\"; # Ci sono 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza parentesi graffe, Raku cercherebbe di interpolare <code>$whats<\/code>, una variabile che non esiste.<\/span><\/p>"]]},"lv":{"t":"Koda interpolācija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Koda interpolācija ir nākamais interpolācijas līmenis.<\/span> <span class=\"sg\" data-s=\"1\">Tā ļauj ielikt kodu tieši dubultpēdiņu virknes iekšpusē.<\/span> <span class=\"sg\" data-s=\"2\">Kods var būt vienkāršs vai pat sarežģīts!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kodu, kuru vajag interpolēt, raksta starp cirtainajām iekavām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Summa no $a un $b ir {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nSumma no 10 un 20 ir 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vēlreiz par mainīgajiem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Viens šīs metodes lietojums ir tad, kad aiz mainīgā jābūt kādam tekstam.<\/span> <span class=\"sg\" data-s=\"1\">Šo tekstu varētu kļūdaini nolasīt kā mainīgā nosaukuma turpinājumu.<\/span> <span class=\"sg\" data-s=\"2\">Lai to novērstu, ielieciet mainīgo cirtainajās iekavās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Tur ir $how-many {$what}s.\"; # Tur ir 5 uzvalki.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez cirtainajām iekavām Raku mēģinātu interpolēt <code>$whats<\/code>, mainīgo, kas neeksistē.<\/span><\/p>"]]},"ru":{"t":"Интерполяция кода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Интерполяция кода — это следующий уровень интерполяции.<\/span> <span class=\"sg\" data-s=\"1\">Она позволяет вставить код прямо в строку в двойных кавычках.<\/span> <span class=\"sg\" data-s=\"2\">Код может быть простым или даже сложным!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Код для интерполяции ставится в фигурные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">И снова переменные<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот способ нужен, например, когда за переменной должен идти какой-то текст.<\/span> <span class=\"sg\" data-s=\"1\">Этот текст можно по ошибке принять за продолжение имени переменной.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы этого избежать, заключите переменную в фигурные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без фигурных скобок Raku попытался бы интерполировать <code>$whats<\/code>, переменную, которой не существует.<\/span><\/p>"]]},"uk":{"t":"Інтерполяція коду","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Інтерполяція коду — це наступний рівень інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\">Вона дозволяє вставити код прямо всередину рядка з подвійними лапками.<\/span> <span class=\"sg\" data-s=\"2\">Код може бути простим або навіть складним!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Код для інтерполяції ставлять між фігурними дужками:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"The sum of $a and $b is {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nThe sum of 10 and 20 is 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Знову про змінні<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одне із застосувань цього методу — коли після змінної має стояти якийсь текст.<\/span> <span class=\"sg\" data-s=\"1\">Цей текст можна помилково прочитати як продовження імені змінної.<\/span> <span class=\"sg\" data-s=\"2\">Щоб запобігти цьому, візьміть змінну у фігурні дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"There are $how-many {$what}s.\"; # There are 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без фігурних дужок Raku спробував би інтерполювати <code>$whats<\/code> — змінну, якої не існує.<\/span><\/p>"]]},"bg":{"t":"Кодова интерполация","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Интерполацията на код е следващото ниво на интерполацията.<\/span> <span class=\"sg\" data-s=\"1\">Тя ви позволява да сложите код директно в низ с двойни кавички.<\/span> <span class=\"sg\" data-s=\"2\">Кодът може да е прост или дори сложен!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кодът за интерполиране се слага между къдрави скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Сумата на $a и $b е {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nСумата на 10 и 20 е 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отново променливи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една употреба на този метод е, когато след променлива трябва да има текст.<\/span> <span class=\"sg\" data-s=\"1\">Този текст може погрешно да се прочете като продължение на името на променливата.<\/span> <span class=\"sg\" data-s=\"2\">За да предотвратите това, сложете променливата в къдрави скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Има $how-many {$what}s.\"; # Има 5 костюма.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без къдрави скоби Raku би се опитал да интерполира <code>$whats<\/code>, променлива, която не съществува.<\/span><\/p>"]]},"eo":{"t":"Koda interpolado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Koda interpolado estas la sekva nivelo de interpolado.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi permesas al vi meti kodon rekte en duoble-cititan ŝnuron.<\/span> <span class=\"sg\" data-s=\"2\">La kodo povas esti simpla, aŭ eĉ kompleksa!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kodo por interpolado staras inter krampoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"La sumo de $a kaj $b estas {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nLa sumo de 10 kaj 20 estas 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabloj denove<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu uzo de ĉi tiu metodo estas, kiam iu teksto devas sekvi variablon.<\/span> <span class=\"sg\" data-s=\"1\">Tiun tekston oni povus erare legi kiel la reston de la nomo de la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Por eviti tion, metu la variablon inter krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Estas $how-many {$what}s.\"; # Estas 5 vestoj.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sen krampoj, Raku provus interpoli <code>$whats<\/code>, variablon, kiu ne ekzistas.<\/span><\/p>"]]},"la":{"t":"Codice interpolatio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Interpolatio codicis est proximus gradus interpolationis.<\/span> <span class=\"sg\" data-s=\"1\">Tibi permittit codicem directe intra stringam duplici-quotatam ponere.<\/span> <span class=\"sg\" data-s=\"2\">Codex simplex esse potest, vel etiam complexus!<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Codex quem interpolas inter uncos curvos ponitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 10;\nmy $b = 20;\nsay \"Summa $a et $b est {$a + $b}.\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku \nSumma 10 et 20 est 30.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles iterum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unus usus huius methodi est cum variabilem textus sequi debet.<\/span> <span class=\"sg\" data-s=\"1\">Ille textus falso ut reliqua pars nominis variabilis legi potest.<\/span> <span class=\"sg\" data-s=\"2\">Ut hoc vites, variabilem intra uncos curvos pone:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $how-many = 5;\nmy $what = 'suit';\nsay \"Sunt $how-many {$what}s.\"; # Sunt 5 suits.<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine uncis curvis, Raku <code>$whats<\/code> interpolare conaretur, variabilem quae non exstat.<\/span><\/p>"]]}}}</script>
