io, la lunghezza di una stringa.<\/span> <span class=\"sg\" data-s=\"3\">È il numero di caratteri o il numero di byte?<\/span> <span class=\"sg\" data-s=\"4\">E se lo stesso carattere è fatto di parti diverse in stringhe diverse?<\/span> <span class=\"sg\" data-s=\"5\">È ancora un solo carattere?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in caratteri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per sapere quanti caratteri ha una stringa, usa il <em>metodo<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parleremo dei metodi più avanti, ma dovremmo già saperli usare.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, puoi chiamare metodi su quasi ogni oggetto, comprese le stringhe e le variabili scalari.<\/span> <span class=\"sg\" data-s=\"2\">Per chiamare un metodo, usa un punto.<\/span> <span class=\"sg\" data-s=\"3\">Quindi qui chiamiamo il metodo su una variabile che contiene una stringa: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il saluto cinese 你好世界 ha quattro caratteri.<\/span> <span class=\"sg\" data-s=\"1\">E <code>$str.chars<\/code> restituisce esattamente <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in byte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Solo come riferimento, ecco come trovare la lunghezza di una stringa in byte.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, devi sapere quale codifica si usa per la stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa volta, il programma stampa <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che la seconda riga ha due chiamate di metodo in catena.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lunghezza in punti di codice<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Per completare il quadro, ecco un altro metodo utile legato alla lunghezza delle stringhe: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce il numero di punti di codice nella stringa, dopo che la stringa è stata normalizzata.<\/span> <span class=\"sg\" data-s=\"2\">In molti casi, <code>codes<\/code> e <code>chars<\/code> restituiscono lo stesso numero.<\/span> <span class=\"sg\" data-s=\"3\">Ma in alcuni casi rari, i due metodi danno risultati diversi.<\/span> <span class=\"sg\" data-s=\"4\">Per esempio, puoi costruire ‘un carattere impossibile’.<\/span> <span class=\"sg\" data-s=\"5\">Per questo carattere non c'è un singolo punto di codice in tutto lo spazio Unicode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questo carattere, <code>x̨<\/code>, non ha un suo punto di codice.<\/span> <span class=\"sg\" data-s=\"1\">Si può costruire solo da due parti.<\/span> <span class=\"sg\" data-s=\"2\">Sono la lettera minuscola <code>x<\/code> e il carattere combinante <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Quindi, c'è sempre un solo carattere, ma ci sono due punti di codice.<\/span> <span class=\"sg\" data-s=\"4\">Ecco perché il programma stampa:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"lv":{"t":"Virknes garums","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Tā kā Raku virknes ir Unicode, dažas vienkāršas lietas kļūst nedaudz grūtākas.<\/span> <span class=\"sg\" data-s=\"1\">Vai vismaz jums par tām jādomā rūpīgāk.<\/span> <span class=\"sg\" data-s=\"2\">Ņemiet, piemēram, virknes garumu.<\/span> <span class=\"sg\" data-s=\"3\">Vai tas ir rakstzīmju skaits vai baitu skaits?<\/span> <span class=\"sg\" data-s=\"4\">Un ja nu viena un tā pati rakstzīme dažādās virknēs sastāv no dažādām daļām?<\/span> <span class=\"sg\" data-s=\"5\">Vai tā joprojām ir viena rakstzīme?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums rakstzīmēs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai uzzinātu, cik rakstzīmju ir virknē, izmantojiet <em>metodi<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Par metodēm mēs runāsim vēlāk, bet mums jau vajadzētu prast tās izmantot.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā jūs varat izsaukt metodes gandrīz jebkuram objektam, arī virknēm un skalārajiem mainīgajiem.<\/span> <span class=\"sg\" data-s=\"2\">Lai izsauktu metodi, izmantojiet punktu.<\/span> <span class=\"sg\" data-s=\"3\">Tātad šeit mēs izsaucam metodi mainīgajam, kas glabā virkni: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ķīniešu sveicienā 你好世界 ir četras rakstzīmes.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>$str.chars<\/code> atgriež tieši <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums baitos<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tikai uzziņai: lūk, kā noskaidrot virknes garumu baitos.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā jums jāzina, kāds kodējums ir izmantots virknei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šoreiz programma izdrukā <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka otrajā rindā ir divi metožu izsaukumi ķēdē.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garums koda punktos<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pilnības labad, lūk, vēl viena noderīga metode, kas saistīta ar virknes garumu: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež koda punktu skaitu virknē pēc tam, kad virkne ir normalizēta.<\/span> <span class=\"sg\" data-s=\"2\">Daudzos gadījumos <code>codes<\/code> un <code>chars<\/code> atgriež vienu un to pašu skaitli.<\/span> <span class=\"sg\" data-s=\"3\">Bet dažos retos gadījumos abas metodes dod dažādus rezultātus.<\/span> <span class=\"sg\" data-s=\"4\">Piemēram, jūs varat izveidot ‘neiespējamu’ rakstzīmi.<\/span> <span class=\"sg\" data-s=\"5\">Visā Unicode telpā tai nav viena koda punkta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šai rakstzīmei, <code>x̨<\/code>, nav sava koda punkta.<\/span> <span class=\"sg\" data-s=\"1\">To var izveidot tikai no divām daļām.<\/span> <span class=\"sg\" data-s=\"2\">Tās ir mazais burts <code>x<\/code> un kombinējošā rakstzīme <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tātad joprojām ir viena rakstzīme, bet divi koda punkti.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc programma izdrukā:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"ru":{"t":"Длина строки","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Так как строки в Raku — это Юникод, некоторые простые вещи становятся немного сложнее.<\/span> <span class=\"sg\" data-s=\"1\">Или, по крайней мере, о них нужно думать внимательнее.<\/span> <span class=\"sg\" data-s=\"2\">Возьмём, например, длину строки.<\/span> <span class=\"sg\" data-s=\"3\">Это количество символов или количество байтов?<\/span> <span class=\"sg\" data-s=\"4\">А что, если один и тот же символ состоит из разных частей в разных строках?<\/span> <span class=\"sg\" data-s=\"5\">Это всё ещё один символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы узнать, сколько символов в строке, используйте <em>метод<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">О методах мы поговорим позже, но пользоваться ими мы уже должны уметь.<\/span> <span class=\"sg\" data-s=\"1\">В Raku можно вызывать методы почти для любого объекта, включая строки и скалярные переменные.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы вызвать метод, используйте точку.<\/span> <span class=\"sg\" data-s=\"3\">Итак, здесь мы вызываем метод для переменной, которая хранит строку: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В китайском приветствии 你好世界 четыре символа.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> возвращает ровно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в байтах<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Просто для справки: вот как узнать длину строки в байтах.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае нужно знать, какая кодировка используется для строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этот раз программа печатает <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что во второй строке два вызова методов в цепочке.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длина в кодовых позициях<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Для полноты картины вот ещё один полезный метод, связанный с длиной строки: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает количество кодовых позиций в строке после того, как строка нормализована.<\/span> <span class=\"sg\" data-s=\"2\">Во многих случаях <code>codes<\/code> и <code>chars<\/code> возвращают одно и то же число.<\/span> <span class=\"sg\" data-s=\"3\">Но в некоторых редких случаях эти два метода дают разные результаты.<\/span> <span class=\"sg\" data-s=\"4\">Например, вы можете собрать «невозможный» символ.<\/span> <span class=\"sg\" data-s=\"5\">Во всём пространстве Юникода для него нет ни одной кодовой позиции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У этого символа, <code>x̨<\/code>, нет своей кодовой позиции.<\/span> <span class=\"sg\" data-s=\"1\">Его можно собрать только из двух частей.<\/span> <span class=\"sg\" data-s=\"2\">Это строчная буква <code>x<\/code> и комбинирующий символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Значит, символ по-прежнему один, но кодовых позиций две.<\/span> <span class=\"sg\" data-s=\"4\">Вот почему программа печатает:<\/span><\/p>"],["code",0,"<pre><code>1\n2<\/code><\/pre>"]]},"uk":{"t":"Довжина рядка","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Оскільки рядки в Raku — це Юнікод, деякі прості речі стають трохи складнішими.<\/span> <span class=\"sg\" data-s=\"1\">Або, принаймні, про них треба думати уважніше.<\/span> <span class=\"sg\" data-s=\"2\">Візьмемо, наприклад, довжину рядка.<\/span> <span class=\"sg\" data-s=\"3\">Це кількість символів чи кількість байтів?<\/span> <span class=\"sg\" data-s=\"4\">А що, якщо той самий символ складається з різних частин у різних рядках?<\/span> <span class=\"sg\" data-s=\"5\">Чи це все ще один символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в символах<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб дізнатися, скільки символів у рядку, використовуйте <em>метод<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Про методи ми поговоримо пізніше, але вже зараз ми повинні вміти їх використовувати.<\/span> <span class=\"sg\" data-s=\"1\">У Raku ви можете викликати методи майже на будь-якому об'єкті, зокрема на рядках і скалярних змінних.<\/span> <span class=\"sg\" data-s=\"2\">Щоб викликати метод, використовуйте крапку.<\/span> <span class=\"sg\" data-s=\"3\">Тож тут ми викликаємо метод на змінній, яка зберігає рядок: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Китайське привітання 你好世界 має чотири символи.<\/span> <span class=\"sg\" data-s=\"1\">І <code>$str.chars<\/code> повертає саме <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в байтах<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для довідки, ось як дізнатися довжину рядка в байтах.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку треба знати, яке кодування використовується для рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цього разу програма виводить <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що в другому рядку є два виклики методів ланцюжком.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Довжина в кодових точках<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Для повноти картини ось ще один корисний метод, пов'язаний з довжиною рядка: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає кількість кодових точок у рядку після того, як рядок нормалізовано.<\/span> <span class=\"sg\" data-s=\"2\">У багатьох випадках <code>codes<\/code> і <code>chars<\/code> повертають однакове число.<\/span> <span class=\"sg\" data-s=\"3\">Але в деяких рідкісних випадках ці два методи дають різні результати.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, ви можете створити ‘неможливий’ символ.<\/span> <span class=\"sg\" data-s=\"5\">Для нього немає єдиної кодової точки у всьому просторі Юнікоду.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цей символ, <code>x̨<\/code>, не має власної кодової точки.<\/span> <span class=\"sg\" data-s=\"1\">Його можна створити лише з двох частин.<\/span> <span class=\"sg\" data-s=\"2\">Це мала літера <code>x<\/code> і комбінований символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Отже, символ усе ще один, але кодових точок дві.<\/span> <span class=\"sg\" data-s=\"4\">Тому програма виводить:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"bg":{"t":"Дължина на стринг","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Понеже низовете в Raku са Юникод, някои прости неща стават малко по-трудни.<\/span> <span class=\"sg\" data-s=\"1\">Или поне трябва да мислите за тях по-внимателно.<\/span> <span class=\"sg\" data-s=\"2\">Вземете, например, дължината на низ.<\/span> <span class=\"sg\" data-s=\"3\">Дали е броят на символите, или броят на байтовете?<\/span> <span class=\"sg\" data-s=\"4\">А какво става, ако един и същ символ е съставен от различни части в различни низове?<\/span> <span class=\"sg\" data-s=\"5\">Дали той пак е един символ?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в символи<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да разберете колко символа има един низ, използвайте <em>метода<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ще говорим за методите по-късно, но вече трябва да можем да ги използваме.<\/span> <span class=\"sg\" data-s=\"1\">В Raku можете да извиквате методи на почти всеки обект, включително низове и скаларни променливи.<\/span> <span class=\"sg\" data-s=\"2\">За да извикате метод, използвайте точка.<\/span> <span class=\"sg\" data-s=\"3\">Така че тук извикваме метода на променлива, която пази низ: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Китайският поздрав 你好世界 има четири символа.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$str.chars<\/code> връща точно <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в байтове<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Само за справка, ето как да намерите дължината на низ в байтове.<\/span> <span class=\"sg\" data-s=\"1\">В този случай трябва да знаете коя кодировка се използва за низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този път програмата отпечатва <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че вторият ред има две извиквания на методи във верига.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дължина в кодови точки<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">За да е пълна картината, ето още един полезен метод, свързан с дължината на низ: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща броя на кодовите точки в низа, след като низът бъде нормализиран.<\/span> <span class=\"sg\" data-s=\"2\">В много случаи <code>codes<\/code> и <code>chars<\/code> връщат едно и също число.<\/span> <span class=\"sg\" data-s=\"3\">Но в някои редки случаи двата метода дават различни резултати.<\/span> <span class=\"sg\" data-s=\"4\">Например, може да създадете „невъзможен“ символ.<\/span> <span class=\"sg\" data-s=\"5\">За него няма отделна кодова точка в цялото Юникод пространство.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този символ, <code>x̨<\/code>, няма собствена кодова точка.<\/span> <span class=\"sg\" data-s=\"1\">Той може да се създаде само от две части.<\/span> <span class=\"sg\" data-s=\"2\">Това са малката буква <code>x<\/code> и комбиниращият символ <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Така че символът все още е един, но кодовите точки са две.<\/span> <span class=\"sg\" data-s=\"4\">Затова програмата отпечатва:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"eo":{"t":"Ĉena longo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉar ŝnuroj en Raku estas Unikodaj, kelkaj simplaj aferoj fariĝas iom pli malfacilaj.<\/span> <span class=\"sg\" data-s=\"1\">Aŭ, almenaŭ, vi devas pensi pri ili pli zorge.<\/span> <span class=\"sg\" data-s=\"2\">Prenu, ekzemple, la longecon de ŝnuro.<\/span> <span class=\"sg\" data-s=\"3\">Ĉu ĝi estas la nombro de karakteroj aŭ la nombro de bajtoj?<\/span> <span class=\"sg\" data-s=\"4\">Kaj kio, se la sama karaktero konsistas el malsamaj partoj en malsamaj ŝnuroj?<\/span> <span class=\"sg\" data-s=\"5\">Ĉu ĝi ankoraŭ estas unu karaktero?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en karakteroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por ekscii, kiom da karakteroj ŝnuro havas, uzu la <em>metodon<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ni parolos pri metodoj poste, sed ni jam devus povi uzi ilin.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, vi povas voki metodojn sur preskaŭ ĉiu objekto, inkluzive de ŝnuroj kaj skalaj variabloj.<\/span> <span class=\"sg\" data-s=\"2\">Por voki metodon, uzu punkton.<\/span> <span class=\"sg\" data-s=\"3\">Do ĉi tie, ni vokas la metodon sur variablo, kiu tenas ŝnuron: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ĉina saluto 你好世界 havas kvar karakterojn.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>$str.chars<\/code> redonas ekzakte <code>4<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en bajtoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nur por referenco, jen kiel trovi la longecon de ŝnuro en bajtoj.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, vi devas scii, kiu kodado estas uzata por la ŝnuro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, la programo presas <code>12<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke la dua linio havas du metodvokojn en ĉeno.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longeco en kodpunktoj<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Por kompletigi la bildon, jen ankoraŭ unu utila metodo, kiu rilatas al la longeco de ŝnuro: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas la nombron de kodpunktoj en la ŝnuro, post kiam la ŝnuro estas normaligita.<\/span> <span class=\"sg\" data-s=\"2\">En multaj kazoj, <code>codes<\/code> kaj <code>chars<\/code> redonas la saman nombron.<\/span> <span class=\"sg\" data-s=\"3\">Sed en kelkaj maloftaj kazoj, la du metodoj donas malsamajn rezultojn.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, vi povas konstrui ‘neeblan’ karakteron.<\/span> <span class=\"sg\" data-s=\"5\">Ne ekzistas unu sola kodpunkto por ĝi en la tuta Unikoda spaco.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu karaktero, <code>x̨<\/code>, ne havas propran kodpunkton.<\/span> <span class=\"sg\" data-s=\"1\">Oni povas konstrui ĝin nur el du partoj.<\/span> <span class=\"sg\" data-s=\"2\">Ili estas la minuskla litero <code>x<\/code> kaj la kombina karaktero <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do, estas ankoraŭ unu karaktero, sed estas du kodpunktoj.<\/span> <span class=\"sg\" data-s=\"4\">Tial la programo presas:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]},"la":{"t":"Catena longitudo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Quia fila in Raku Unicode sunt, quaedam res simplices paulo difficiliores fiunt.<\/span> <span class=\"sg\" data-s=\"1\">Vel saltem de eis diligentius cogitare debes.<\/span> <span class=\"sg\" data-s=\"2\">Sume, exempli gratia, longitudinem fili.<\/span> <span class=\"sg\" data-s=\"3\">Estne numerus characterum an numerus byteorum?<\/span> <span class=\"sg\" data-s=\"4\">Et quid si idem character in diversis filis ex diversis partibus constat?<\/span> <span class=\"sg\" data-s=\"5\">Estne adhuc unus character?<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in characteribus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut scias quot characteres filum habeat, utere <em>methodo<\/em> <code>chars<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.chars;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De methodis postea loquemur, sed iam eis uti posse debemus.<\/span> <span class=\"sg\" data-s=\"1\">In Raku methodos in fere omni obiecto vocare potes, etiam in filis et variabilibus scalaribus.<\/span> <span class=\"sg\" data-s=\"2\">Ut methodum voces, puncto utere.<\/span> <span class=\"sg\" data-s=\"3\">Itaque hic methodum in variabili vocamus quae filum tenet: <code>$str.chars<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salutatio Sinensis 你好世界 quattuor characteres habet.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>$str.chars<\/code> exacte <code>4<\/code> reddit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in byteis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tantum ad notitiam, sic longitudinem fili in byteis invenis.<\/span> <span class=\"sg\" data-s=\"1\">Hoc casu scire debes quae codificatio pro filo adhibeatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $str = '你好世界';\nsay $str.encode('UTF-8').bytes;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore programma <code>12<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Nota secundam lineam duas vocationes methodorum in catena habere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longitudo in punctis codicis<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ut rem compleamus, ecce alia methodus utilis quae ad longitudinem fili pertinet: <code>codes<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Numerum punctorum codicis in filo reddit, postquam filum normalizatum est.<\/span> <span class=\"sg\" data-s=\"2\">In multis casibus <code>codes<\/code> et <code>chars<\/code> eundem numerum reddunt.<\/span> <span class=\"sg\" data-s=\"3\">Sed in quibusdam casibus raris duae methodi diversos eventus dant.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, characterem ‘impossibilem’ aedificare potes.<\/span> <span class=\"sg\" data-s=\"5\">Nullum unum punctum codicis pro eo in toto spatio Unicode est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'x̨'.chars;\nsay 'x̨'.codes;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic character, <code>x̨<\/code>, nullum punctum codicis proprium habet.<\/span> <span class=\"sg\" data-s=\"1\">Solum ex duabus partibus construi potest.<\/span> <span class=\"sg\" data-s=\"2\">Eae sunt littera minuscula <code>x<\/code> et character combinans <code>0x0328<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ita adhuc unus character est, sed duo puncta codicis sunt.<\/span> <span class=\"sg\" data-s=\"4\">Ideo programma imprimit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">1     2<\/span><\/p>"]]}}}</script>
