zzināsim nākamajās kursa sadaļās.<\/span> <span class=\"sg\" data-s=\"3\">Bet jau tagad tādam kodam kā <code>$chair-price * $chairs<\/code> nevajadzētu radīt jautājumus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Trīs koda rindas izdrukā trīs tabulas rindas, ieskaitot galveni.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, kā tabulācijas rakstzīmes <code>\\t<\/code> atdala kolonnas.<\/span> <span class=\"sg\" data-s=\"2\">Datu rindās jūs varat redzēt arī aizbēgtu dolāra zīmi: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tur ir arī dažādi mainīgie, kurus mēs gribam interpolēt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Palaidiet programmu un redziet, kā tā izdrukā tabulu:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai pamanījāt defises mainīgo nosaukumos, piemēram, <code>$chair-price<\/code> vai <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā tas ir pilnīgi normāls veids, kā nosaukt mainīgos.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai jūs nemulsina divas dolāra zīmes blakus.<\/span> <span class=\"sg\" data-s=\"1\">Raku tās lasa atsevišķi.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, virknē <code>\\$$price<\/code> pirmā dolāra zīme ir aizbēgta, tāpēc tā apzīmē pati sevi.<\/span> <span class=\"sg\" data-s=\"3\">Otrā ir daļa no mainīgā nosaukuma <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visas virknes mēs ieliekam dubultajās pēdiņās.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj interpolēt mainīgos un speciālās rakstzīmes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pie šī uzdevuma mēs atgriezīsimies, kad zināsim par masīviem un hešiem.<\/span><\/p>"]]},"ru":{"t":"Решение: Таблица покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Все числа записаны прямо в коде и хранятся в нескольких переменных.<\/span> <span class=\"sg\" data-s=\"1\">Мы также используем оператор умножения <code>*<\/code>, чтобы посчитать результат.<\/span> <span class=\"sg\" data-s=\"2\">Об операторах мы узнаем больше в следующих разделах курса.<\/span> <span class=\"sg\" data-s=\"3\">Но уже сейчас код вроде <code>$chair-price * $chairs<\/code> не должен вызывать вопросов.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Три строки кода печатают три строки таблицы, вместе с заголовком.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что колонки разделяются символами таба <code>\\t<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">В строках с данными также виден экранированный знак доллара: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Там есть и разные переменные, которые мы хотим интерполировать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вы можете найти исходный код в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустите программу, и она выведет таблицу:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы заметили дефисы в именах переменных, например <code>$chair-price<\/code> или <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">В Raku это совершенно нормальный способ называть переменные.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Пусть вас не смущают два знака доллара рядом.<\/span> <span class=\"sg\" data-s=\"1\">Raku читает их по отдельности.<\/span> <span class=\"sg\" data-s=\"2\">Например, в <code>\\$$price<\/code> первый знак доллара экранирован, поэтому он означает сам себя.<\/span> <span class=\"sg\" data-s=\"3\">Второй — это часть имени переменной <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мы поставили все строки в двойные кавычки.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет интерполировать переменные и специальные символы.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Мы вернёмся к этой задаче, когда узнаем о массивах и словарях.<\/span><\/p>"]]},"uk":{"t":"Solution: Таблиця покупок","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось одне можливе рішення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Усі числа записані прямо в коді та збережені в кількох змінних.<\/span> <span class=\"sg\" data-s=\"1\">Ми також використовуємо оператор множення <code>*<\/code>, щоб обчислити результат.<\/span> <span class=\"sg\" data-s=\"2\">Більше про оператори ми дізнаємося в наступних розділах курсу.<\/span> <span class=\"sg\" data-s=\"3\">Але вже зараз код на зразок <code>$chair-price * $chairs<\/code> не повинен викликати питань.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Три рядки коду друкують три рядки таблиці, разом із заголовком.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, як символи табуляції <code>\\t<\/code> розділяють стовпці.<\/span> <span class=\"sg\" data-s=\"2\">У рядках з даними також видно екранований знак долара: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Там є й різні змінні, які ми хочемо інтерполювати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідні дані<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Запустіть програму та подивіться, як вона друкує таблицю:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чи помітили ви дефіси в іменах змінних, таких як <code>$chair-price<\/code> або <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">У Raku це цілком нормальний спосіб називати змінні.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Нехай вас не плутають два знаки долара поруч.<\/span> <span class=\"sg\" data-s=\"1\">Raku читає їх окремо.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, у <code>\\$$price<\/code> перший знак долара екранований, тому він означає сам себе.<\/span> <span class=\"sg\" data-s=\"3\">Другий — частина імені змінної <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми беремо всі рядки в подвійні лапки.<\/span> <span class=\"sg\" data-s=\"1\">Це дозволяє інтерполювати змінні і спеціальні символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ми повернемося до цього завдання, коли знатимемо про масиви та хеші.<\/span><\/p>"]]},"bg":{"t":"Solution: Таблица за покупки","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всички числа са написани директно в кода и съхранени в няколко променливи.<\/span> <span class=\"sg\" data-s=\"1\">Използваме и оператора за умножение <code>*<\/code>, за да изчислим резултата.<\/span> <span class=\"sg\" data-s=\"2\">Ще научим повече за операторите в следващите секции на курса.<\/span> <span class=\"sg\" data-s=\"3\">Но още сега код като <code>$chair-price * $chairs<\/code> не би трябвало да предизвиква въпроси.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Три реда код отпечатват трите реда на таблицата, включително заглавието.<\/span> <span class=\"sg\" data-s=\"1\">Обърнете внимание как табулационните символи <code>\\t<\/code> разделят колоните.<\/span> <span class=\"sg\" data-s=\"2\">В редовете с данни виждате и избягал знак за долар: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Има и различни променливи, които искаме да интерполираме.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте програмата и вижте как отпечатва таблицата:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забелязахте ли тиретата в имена на променливи като <code>$chair-price<\/code> или <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">В Raku това е напълно нормален начин да наричате променливите.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Не се бъркайте от двата знака за долар един до друг.<\/span> <span class=\"sg\" data-s=\"1\">Raku ги чете поотделно.<\/span> <span class=\"sg\" data-s=\"2\">Например, в <code>\\$$price<\/code> първият знак за долар е избягал, затова означава самия себе си.<\/span> <span class=\"sg\" data-s=\"3\">Вторият е част от името на променливата <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поставяме всички низове в двойни кавички.<\/span> <span class=\"sg\" data-s=\"1\">Това позволява интерполация на променливите и специалните символи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще се върнем към тази задача, когато научим за масиви и хешове.<\/span><\/p>"]]},"eo":{"t":"Solvo: Aĉettabelo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $chair-price = 20.57;\nmy $chairs = 4;\nmy $chairs-total = $chair-price * $chairs;\n\nmy $table-price = 50.18;\nmy $tables = 1;\nmy $tables-total = $table-price * $tables;\n\nsay \"Item\\tPrice\\tN\\tTotal\";\nsay \"Chairs\\t\\$$chair-price\\t$chairs\\t\\$$chairs-total\";\nsay \"Tables\\t\\$$table-price\\t$tables\\t\\$$tables-total\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj nombroj estas skribitaj rekte en la kodo kaj konservitaj en kelkaj variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Ni ankaŭ uzas la multiplikan operatoron <code>*<\/code> por kalkuli la rezulton.<\/span> <span class=\"sg\" data-s=\"2\">Ni lernos pli pri operatoroj en la sekvaj sekcioj de la kurso.<\/span> <span class=\"sg\" data-s=\"3\">Sed jam nun, kodo kiel <code>$chair-price * $chairs<\/code> ne devus kaŭzi demandojn.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tri linioj de kodo presas la tri liniojn de la tabelo, inkluzive de la kaplinio.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, kiel tabokarakteroj <code>\\t<\/code> apartigas la kolumnojn.<\/span> <span class=\"sg\" data-s=\"2\">En la datumaj vicoj, vi ankaŭ povas vidi eskapitan dolarsignon: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Estas ankaŭ malsamaj variabloj, kiujn ni volas interpoli.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kaj vidu kiel ĝi presas la tabelon:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Price   N      Total\nChairs  $20.57  4      $82.28\nTables  $50.18  1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi rimarkis la streketojn en nomoj de variabloj kiel <code>$chair-price<\/code> aŭ <code>$tables-total<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">En Raku, tio estas tute normala maniero nomi variablojn.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ne konfuziĝu pro la du dolarsignoj unu apud la alia.<\/span> <span class=\"sg\" data-s=\"1\">Raku legas ilin aparte.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, en <code>\\$$price<\/code>, la unua dolarsigno estas eskapita, do ĝi signifas sin mem.<\/span> <span class=\"sg\" data-s=\"3\">La dua estas parto de la nomo de variablo <code>$price<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni metis ĉiujn ŝnurojn en duoblajn citilojn.<\/span> <span class=\"sg\" data-s=\"1\">Tio permesas interpoli la variablojn kaj specialajn karakterojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ni revenos al ĉi tiu tasko, kiam ni scios pri tabeloj kaj haketoj.<\/span><\/p>"]]},"la":{"t":"Solutio: Tabula emptio","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sella-pretium = 20.57;\nmy $sellae = 4;\nmy $sellae-totalis = $sella-pretium * $sellae;\n\nmy $mensa-pretium = 50.18;\nmy $mensae = 1;\nmy $mensae-totalis = $mensa-pretium * $mensae;\n\nsay \"Item\\tPretium\\tN\\tTotalis\";\nsay \"Sellae\\t\\$$sella-pretium\\t$sellae\\t\\$$sellae-totalis\";\nsay \"Mensae\\t\\$$mensa-pretium\\t$mensae\\t\\$$mensae-totalis\";<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Omnes numeri directe in codice scripti et in variis variabilibus servati sunt.<\/span> <span class=\"sg\" data-s=\"1\">Etiam operatore multiplicationis <code>*<\/code> utimur ut eventum computemus.<\/span> <span class=\"sg\" data-s=\"2\">Plura de operatoribus in proximis sectionibus cursus discemus.<\/span> <span class=\"sg\" data-s=\"3\">Sed iam nunc codex ut <code>$sella-pretium * $sellae<\/code> nullas quaestiones movere debet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tres lineae codicis tres lineas tabulae imprimunt, una cum capite.<\/span> <span class=\"sg\" data-s=\"1\">Nota quomodo characteres tabulationis <code>\\t<\/code> columnas separant.<\/span> <span class=\"sg\" data-s=\"2\">In lineis datorum etiam signum dollari effugitum videre potes: <code>\\$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Sunt etiam variae variabiles quas interpolare volumus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontis invenire potes in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/strings/purchase-table.raku\" target=\"_blank\" rel=\"noopener\">purchase-table.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Curre programmatum et vide quomodo tabulam imprimit:<\/span><\/p>"],["code",0,"<pre><code>$ raku exercises/strings/purchase-table.raku\nItem    Pretium   N      Totalis\nSellae  $20.57    4      $82.28\nMensae  $50.18    1      $50.18<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Animadvertistine hyphena in nominibus variabilium ut <code>$sella-pretium<\/code> vel <code>$mensae-totalis<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">In Raku hic est modus prorsus usitatus variabiles nominandi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Noli turbari duobus signis dollari iuxta se positis.<\/span> <span class=\"sg\" data-s=\"1\">Raku ea separatim legit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, in <code>\\$$pretium<\/code> primum signum dollari effugitum est, itaque se ipsum significat.<\/span> <span class=\"sg\" data-s=\"3\">Secundum est pars nominis variabilis <code>$pretium<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnes chordas in quotationibus duplicibus ponimus.<\/span> <span class=\"sg\" data-s=\"1\">Hoc interpolationem variabilium et characterum specialium permittit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad hoc munus redibimus cum de arrayis et hashis sciemus.<\/span><\/p>"]]}}}</script>
