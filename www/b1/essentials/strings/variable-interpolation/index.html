olation.<\/span> <span class=\"sg\" data-s=\"1\">So if you change <code>$name<\/code> and interpolate it again, the new value is used.<\/span> <span class=\"sg\" data-s=\"2\">Let us test it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This time, the same string produces different messages:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"de":{"t":"Variableninterpolation","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In den vorherigen Abschnitten standen manche Strings in einfachen und manche in doppelten Anführungszeichen.<\/span> <span class=\"sg\" data-s=\"1\">Haben Sie das bemerkt?<\/span> <span class=\"sg\" data-s=\"2\">Dieser Unterschied ist sehr wichtig.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Natürlich ist es mit doppelten Anführungszeichen leicht, ein einfaches Anführungszeichen in einen String zu setzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Übrigens ist ein richtiger Apostroph trotzdem besser als ein einfaches Anführungszeichen.<\/span> <span class=\"sg\" data-s=\"1\">Schließlich <a href=\"/essentials/on-unicode/\">kann Raku gut mit Unicode umgehen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aber die wahre Stärke der doppelten Anführungszeichen ist, dass sie Variablen <em>interpolieren<\/em> können.<\/span> <span class=\"sg\" data-s=\"1\">Wie wir bald sehen werden, können sie sogar Code ausführen!<\/span> <span class=\"sg\" data-s=\"2\">Sehen Sie sich dieses Programm an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hallo, $name!\";<\/code><\/pre>"],["p",2,"<p><span n apóstrofe correcto sigue siendo mejor que una comilla simple.<\/span> <span class=\"sg\" data-s=\"1\">Al fin y al cabo, <a href=\"/essentials/on-unicode/\">Raku es bueno con Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pero el verdadero poder de las comillas dobles es que pueden <em>interpolar<\/em> variables.<\/span> <span class=\"sg\" data-s=\"1\">¡Como veremos pronto, incluso pueden ejecutar código!<\/span> <span class=\"sg\" data-s=\"2\">Echa un vistazo a este programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como probablemente esperas, el programa imprime <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El valor de la variable reemplazó el nombre <code>$name<\/code>, junto con su sigil <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El valor interpolado es el valor que tiene la variable en el momento de la interpolación.<\/span> <span class=\"sg\" data-s=\"1\">Así que si cambias <code>$name<\/code> y la interpolas otra vez, se usa el nuevo valor.<\/span> <span class=\"sg\" data-s=\"2\">Vamos a probarlo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta vez, la misma cadena produce mensajes diferentes:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"it":{"t":"Interpolazione delle variabili","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nelle sezioni precedenti, alcune stringhe erano tra virgolette singole e altre tra virgolette doppie.<\/span> <span class=\"sg\" data-s=\"1\">Lo hai notato?<\/span> <span class=\"sg\" data-s=\"2\">Questa differenza è molto importante.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ovviamente, con le virgolette doppie è facile mettere una virgoletta singola dentro una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A proposito, un apostrofo corretto è comunque meglio di una virgoletta singola.<\/span> <span class=\"sg\" data-s=\"1\">Dopotutto, <a href=\"/essentials/on-unicode/\">Raku è bravo con Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ma il vero potere delle virgolette doppie è che possono <em>interpolare<\/em> le variabili.<\/span> <span class=\"sg\" data-s=\"1\">Come vedremo presto, possono anche eseguire codice!<\/span> <span class=\"sg\" data-s=\"2\">Dai un'occhiata a questo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come probabilmente ti aspetti, il programma stampa <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il valore della variabile ha sostituito il nome <code>$name<\/code>, insieme al suo sigillo <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il valore interpolato è il valore che la variabile ha al momento dell'interpolazione.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, se cambi <code>$name<\/code> e la interpoli di nuovo, viene usato il nuovo valore.<\/span> <span class=\"sg\" data-s=\"2\">Facciamo una prova:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa volta, la stessa stringa produce messaggi diversi:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"lv":{"t":"Mainīgo interpolācija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējās sadaļās dažas virknes bija vienkāršajās pēdiņās, bet dažas dubultajās pēdiņās.<\/span> <span class=\"sg\" data-s=\"1\">Vai jūs to pamanījāt?<\/span> <span class=\"sg\" data-s=\"2\">Šī atšķirība ir ļoti svarīga.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Protams, ar dubultajām pēdiņām ir viegli ielikt vienpēdiņu virknes iekšpusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Starp citu, pareizs apostrofs tomēr ir labāks par vienpēdiņu.<\/span> <span class=\"sg\" data-s=\"1\">Galu galā, <a href=\"/essentials/on-unicode/\">Raku labi strādā ar Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bet dubulto pēdiņu īstais spēks ir tas, ka tās var <em>interpolēt<\/em> mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Kā mēs drīz redzēsim, tās var pat izpildīt kodu!<\/span> <span class=\"sg\" data-s=\"2\">Apskatiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā jūs droši vien gaidāt, programma izdrukā <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgā vērtība aizstāja nosaukumu <code>$name<\/code> kopā ar tā sigilu <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interpolētā vērtība ir tā vērtība, kas mainīgajam ir interpolācijas brīdī.<\/span> <span class=\"sg\" data-s=\"1\">Tātad, ja jūs maināt <code>$name<\/code> un to interpolējat vēlreiz, tiek izmantota jaunā vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Pārbaudīsim to:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šoreiz tā pati virkne rada dažādus ziņojumus:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"ru":{"t":"Интерполяция переменных","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В предыдущих разделах одни строки были в одинарных кавычках, а другие — в двойных.<\/span> <span class=\"sg\" data-s=\"1\">Вы это уже заметили?<\/span> <span class=\"sg\" data-s=\"2\">Эта разница очень важна.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Конечно, с двойными кавычками легко поставить одинарную кавычку внутрь строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кстати, настоящий апостроф всё же лучше одинарной кавычки.<\/span> <span class=\"sg\" data-s=\"1\">Ведь <a href=\"/essentials/on-unicode/\">Raku хорошо работает с Юникодом<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Но настоящая сила двойных кавычек в том, что они умеют <em>интерполировать<\/em> переменные.<\/span> <span class=\"sg\" data-s=\"1\">Как мы скоро увидим, они могут даже выполнять код!<\/span> <span class=\"sg\" data-s=\"2\">Посмотрите на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как вы, наверное, и ожидаете, программа печатает <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значение переменной заменило имя <code>$name<\/code> вместе с его сигилом <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Интерполируется то значение, которое есть у переменной в момент интерполяции.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому если вы измените <code>$name<\/code> и снова её интерполируете, будет взято новое значение.<\/span> <span class=\"sg\" data-s=\"2\">Давайте проверим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На этот раз одна и та же строка выдаёт разные сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>Hello, Karl!\nHello, Anna!<\/code><\/pre>"]]},"uk":{"t":"Інтерполяція змінних","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У попередніх розділах одні рядки були в одинарних лапках, а інші — в подвійних.<\/span> <span class=\"sg\" data-s=\"1\">Ви це помітили?<\/span> <span class=\"sg\" data-s=\"2\">Ця різниця дуже важлива.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайно, з подвійними лапками легко вставити одинарну лапку всередину рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">До речі, правильний апостроф усе ж кращий за одинарну лапку.<\/span> <span class=\"sg\" data-s=\"1\">Зрештою, <a href=\"/essentials/on-unicode/\">Raku добре працює з Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Але справжня сила подвійних лапок у тому, що вони можуть <em>інтерполювати<\/em> змінні.<\/span> <span class=\"sg\" data-s=\"1\">Як ми скоро побачимо, вони можуть навіть виконувати код!<\/span> <span class=\"sg\" data-s=\"2\">Подивіться на цю програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як ви, мабуть, очікуєте, програма виводить <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значення змінної замінило ім'я <code>$name<\/code> разом з його сигілом <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Інтерпольоване значення — це значення, яке змінна має на момент інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\">Тож якщо ви зміните <code>$name<\/code> і знову її інтерполюєте, використовується нове значення.<\/span> <span class=\"sg\" data-s=\"2\">Давайте перевіримо це:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цього разу той самий рядок дає різні повідомлення:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"bg":{"t":"Променлива интерполация","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В предишните раздели някои низове бяха в единични кавички, а други в двойни.<\/span> <span class=\"sg\" data-s=\"1\">Забелязахте ли това?<\/span> <span class=\"sg\" data-s=\"2\">Тази разлика е много важна.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разбира се, с двойни кавички е лесно да сложите единична кавичка в низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Между другото, правилният апостроф все пак е по-добър от единичната кавичка.<\/span> <span class=\"sg\" data-s=\"1\">В крайна сметка, <a href=\"/essentials/on-unicode/\">Raku е добър с Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Но истинската сила на двойните кавички е, че могат да <em>интерполират<\/em> променливи.<\/span> <span class=\"sg\" data-s=\"1\">Както ще видим скоро, те могат дори да изпълняват код!<\/span> <span class=\"sg\" data-s=\"2\">Разгледайте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както вероятно очаквате, програмата отпечатва <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Стойността на променливата замени името <code>$name<\/code>, заедно с неговия сигил <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Интерполираната стойност е стойността, която променливата има в момента на интерполацията.<\/span> <span class=\"sg\" data-s=\"1\">Така че, ако промените <code>$name<\/code> и я интерполирате отново, се използва новата стойност.<\/span> <span class=\"sg\" data-s=\"2\">Нека го проверим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този път същият низ създава различни съобщения:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"eo":{"t":"Variabla interpolado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la antaŭaj sekcioj, kelkaj ŝnuroj estis en unuopaj citiloj kaj kelkaj en duoblaj citiloj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu vi rimarkis tion?<\/span> <span class=\"sg\" data-s=\"2\">Tiu diferenco estas tre grava.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompreneble, duoblaj citiloj faciligas meti unuopan citilon en ŝnuron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cetere, ĝusta apostrofo estas ankoraŭ pli bona ol unuopa citilo.<\/span> <span class=\"sg\" data-s=\"1\">Finfine, <a href=\"/essentials/on-unicode/\">Raku estas bona pri Unikodo<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sed la vera forto de duoblaj citiloj estas, ke ili povas <em>interpoli<\/em> variablojn.<\/span> <span class=\"sg\" data-s=\"1\">Kiel ni baldaŭ vidos, ili eĉ povas ruli kodon!<\/span> <span class=\"sg\" data-s=\"2\">Rigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel vi verŝajne atendas, la programo presas <code>Hello, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La valoro de la variablo anstataŭis la nomon <code>$name<\/code>, kune kun ĝia sigelo <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La interpolita valoro estas la valoro, kiun la variablo havas en la momento de interpolado.<\/span> <span class=\"sg\" data-s=\"1\">Do se vi ŝanĝas <code>$name<\/code> kaj interpolas ĝin denove, la nova valoro estas uzata.<\/span> <span class=\"sg\" data-s=\"2\">Ni testu ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Karl';\nsay \"Hello, $name!\";\n\n$name = 'Anna';\nsay \"Hello, $name!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje, la sama ŝnuro produktas malsamajn mesaĝojn:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hello, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Hello, Anna!<\/span><\/p>"]]},"la":{"t":"Variabile interpolatio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In sectionibus praecedentibus quaedam stringae in quotationibus singulis erant, quaedam in duplicibus.<\/span> <span class=\"sg\" data-s=\"1\">Iamne hoc animadvertisti?<\/span> <span class=\"sg\" data-s=\"2\">Haec differentia valde gravis est.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Scilicet, cum quotationibus duplicibus singulam quotationem intra stringam facile ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"O'Henry\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ceterum, apostrophus proprius adhuc melior est quam singula quotatio.<\/span> <span class=\"sg\" data-s=\"1\">Nam <a href=\"/essentials/on-unicode/\">Raku bonum est in Unicode<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'O’Henry';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sed vera vis quotationum duplicium est quod variabiles <em>interpolare<\/em> possunt.<\/span> <span class=\"sg\" data-s=\"1\">Ut mox videbimus, etiam codicem exsequi possunt!<\/span> <span class=\"sg\" data-s=\"2\">Specta hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut fortasse exspectas, programma imprimit <code>Salve, Karl!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Valor variabilis locum nominis <code>$nomen<\/code> cepit, una cum sigillo eius <code>$<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Valor interpolatus est valor quem variabilis momento interpolationis habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque si <code>$nomen<\/code> mutas et iterum interpolas, novus valor adhibetur.<\/span> <span class=\"sg\" data-s=\"2\">Experiamur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $nomen = 'Karl';\nsay \"Salve, $nomen!\";\n\n$nomen = 'Anna';\nsay \"Salve, $nomen!\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc tempore eadem stringa diversos nuntios generat:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salve, Karl!<\/span> <span class=\"sg\" data-s=\"1\">Salve, Anna!<\/span><\/p>"]]}}}</script>
