ля запуска программ.<\/span> <span class=\"sg\" data-s=\"2\">Он также удобен, чтобы проверять небольшие скрипты в оболочке REPL.<\/span> <span class=\"sg\" data-s=\"3\">Все инструкции вы найдёте на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера версий<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Номер версии Rakudo состоит из двух частей: года и месяца выпуска.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы легко можете увидеть, насколько свежий у вас компилятор.<\/span> <span class=\"sg\" data-s=\"2\">Выполните эту команду, чтобы увидеть номер его версии:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь видно три номера версий.<\/span> <span class=\"sg\" data-s=\"1\">Первый — это версия самого Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затем идёт версия языка Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Пока обновления получают следующую букву как младшую часть версии.<\/span> <span class=\"sg\" data-s=\"4\">Например, следующей будет <code>v6.e<\/code>, и так далее.<\/span> <span class=\"sg\" data-s=\"5\">Наконец, вы видите название виртуальной машины в этом компиляторе: MoarVM версии <code>2026.06<\/code>.<\/span><\/p>"]]},"uk":{"t":"Як встановити Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Щоб запустити програму на Raku, вам потрібно встановити компілятор.<\/span> <span class=\"sg\" data-s=\"1\">У цьому курсі використовується Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Два інші, <a href=\"https://course.raku.org/uk/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> і <a href=\"https://course.raku.org/uk/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>, встановлюються окремо.<\/span> <span class=\"sg\" data-s=\"3\">Дивіться <a href=\"https://course.raku.org/uk/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Як встановити Raku++<\/a> і <a href=\"https://course.raku.org/uk/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Як встановити mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Зайдіть на <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">сайт Rakudo<\/a> і завантажте версію для вашої операційної системи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Джерела<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Встановлювач для вашої системи можна завантажити на сторінці <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Є версії для всіх основних операційних систем: Windows, Mac OS та Linux.<\/span> <span class=\"sg\" data-s=\"2\">Також можна взяти вихідний код і скомпілювати його самостійно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-образи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo доступний і як docker-образ.<\/span> <span class=\"sg\" data-s=\"1\">Його можна використовувати для запуску програм.<\/span> <span class=\"sg\" data-s=\"2\">Він також добре підходить для перевірки невеликих скриптів в оболонці REPL.<\/span> <span class=\"sg\" data-s=\"3\">Усі інструкції ви знайдете на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номери версій<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Номер версії Rakudo має дві частини: рік і місяць випуску.<\/span> <span class=\"sg\" data-s=\"1\">Тож ви легко бачите, наскільки свіжий ваш компілятор.<\/span> <span class=\"sg\" data-s=\"2\">Виконайте цю команду, щоб побачити номер його версії:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тут ви бачите три номери версій.<\/span> <span class=\"sg\" data-s=\"1\">Перший — це версія самого Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Далі йде версія мови Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поки що оновлення отримують наступну літеру як молодшу частину версії.<\/span> <span class=\"sg\" data-s=\"4\">Наприклад, наступна — <code>v6.e<\/code>, і так далі.<\/span> <span class=\"sg\" data-s=\"5\">Нарешті, ви бачите назву віртуальної машини в цьому компіляторі: MoarVM версії <code>2026.06<\/code>.<\/span><\/p>"]]},"bg":{"t":"Как да инсталирате Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">За да изпълните програма на Raku, трябва да инсталирате компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Този курс използва Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Другите два, <a href=\"https://course.raku.org/bg/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> и <a href=\"https://course.raku.org/bg/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>, се инсталират отделно.<\/span> <span class=\"sg\" data-s=\"3\">Вижте <a href=\"https://course.raku.org/bg/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Как да инсталирате Raku++<\/a> и <a href=\"https://course.raku.org/bg/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Как да инсталирате mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Посетете <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">сайта на Rakudo<\/a> и изтеглете версията за вашата операционна система.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Източници<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да изтеглите инсталатор за вашата система от <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Има версии за всички основни операционни системи: Windows, Mac OS и Linux.<\/span> <span class=\"sg\" data-s=\"2\">Можете също да вземете изходния код и да го компилирате сами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker образи<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo се предлага и като docker образ.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го използвате, за да изпълнявате програми.<\/span> <span class=\"sg\" data-s=\"2\">Той е удобен и за изпробване на малки скриптове в обвивката REPL.<\/span> <span class=\"sg\" data-s=\"3\">Всички указания ще намерите на <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Номера на версиите<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Номерът на версията на Rakudo има две части: годината и месеца на изданието.<\/span> <span class=\"sg\" data-s=\"1\">Така лесно виждате колко нов е вашият компилатор.<\/span> <span class=\"sg\" data-s=\"2\">Изпълнете тази команда, за да видите номера на версията му:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тук можете да видите три номера на версии.<\/span> <span class=\"sg\" data-s=\"1\">Първият е версията на самия Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това идва версията на езика Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Засега обновленията получават следващата буква като минорна версия.<\/span> <span class=\"sg\" data-s=\"4\">Например следващата е <code>v6.e<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"5\">Накрая виждате името на виртуалната машина в този компилатор: MoarVM версия <code>2026.06<\/code>.<\/span><\/p>"]]},"eo":{"t":"Kiel instali Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Por ruli programon en Raku, vi devas instali kompililon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu kurso uzas Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">La aliaj du, <a href=\"https://course.raku.org/eo/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>, estas instalataj aparte.<\/span> <span class=\"sg\" data-s=\"3\">Vidu <a href=\"https://course.raku.org/eo/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Kiel instali Raku++<\/a> kaj <a href=\"https://course.raku.org/eo/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Kiel instali mutsu<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Vizitu <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">la retejon de Rakudo<\/a> kaj elŝutu la version por via mastruma sistemo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas elŝuti instalilon por via sistemo ĉe <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Estas versioj por ĉiuj ĉefaj mastrumaj sistemoj: Windows, Mac OS kaj Linux.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas ricevi la fontkodon kaj mem kompili ĝin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Docker-bildoj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo disponeblas ankaŭ kiel docker-bildo.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin por ruli programojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ taŭgas por provi malgrandajn skriptojn en ŝelo REPL.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiujn instrukciojn vi trovos ĉe <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Versinumeroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Versinumero de Rakudo havas du partojn: la jaron kaj la monaton de la eldono.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas facile vidi, kiom nova estas via kompililo.<\/span> <span class=\"sg\" data-s=\"2\">Rulu ĉi tiun komandon por vidi ĝian versinumeron:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie vi povas vidi tri versinumerojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la versio de Rakudo mem: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste venas la versio de la lingvo Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Nuntempe la ĝisdatigoj ricevas la sekvan literon kiel malĉefan version.<\/span> <span class=\"sg\" data-s=\"4\">Ekzemple, la sekva estas <code>v6.e<\/code>, kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"5\">Fine vi vidas la nomon de la virtuala maŝino en ĉi tiu kompililo: MoarVM versio <code>2026.06<\/code>.<\/span><\/p>"]]},"la":{"t":"Quomodo Rakudo installare","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ut programma in Raku curras, compilatorem installare debes.<\/span> <span class=\"sg\" data-s=\"1\">Hic cursus Rakudo adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Alii duo, <a href=\"https://course.raku.org/la/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a> et <a href=\"https://course.raku.org/la/essentials/the-mutsu-interpreter/\" target=\"_blank\" rel=\"noopener\">mutsu<\/a>, seorsum installantur.<\/span> <span class=\"sg\" data-s=\"3\">Vide <a href=\"https://course.raku.org/la/essentials/how-to-install-rakupp/\" target=\"_blank\" rel=\"noopener\">Quomodo Raku++ installare<\/a> et <a href=\"https://course.raku.org/la/essentials/how-to-install-mutsu/\" target=\"_blank\" rel=\"noopener\">Quomodo mutsu installare<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Adi <a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">sedem interretialem Rakudo<\/a> et versionem pro systemate tuo deprime.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma installationis pro systemate tuo apud <a href=\"https://rakudo.org/downloads\" target=\"_blank\" rel=\"noopener\">rakudo.org/downloads<\/a> deprimere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sunt versiones pro omnibus systematibus praecipuis: Windows, Mac OS et Linux.<\/span> <span class=\"sg\" data-s=\"2\">Potes etiam codicem fontalem accipere et ipse compilare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Imagines Docker<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rakudo etiam ut imago docker praesto est.<\/span> <span class=\"sg\" data-s=\"1\">Ea uti potes ad programmata currenda.<\/span> <span class=\"sg\" data-s=\"2\">Etiam bona est ad brevia scripta in cortice REPL probanda.<\/span> <span class=\"sg\" data-s=\"3\">Omnia praecepta apud <a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">github.com/Raku/docker<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Numeri versionum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Numerus versionis Rakudo duas partes habet: annum et mensem emissionis.<\/span> <span class=\"sg\" data-s=\"1\">Itaque facile vides quam novus compilator tuus sit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc imperatum exsequere ut numerum versionis eius videas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -v\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2026.06.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2026.06.<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic tres numeros versionum videre potes.<\/span> <span class=\"sg\" data-s=\"1\">Primus est versio ipsius Rakudo: <code>v2026.06<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deinde venit versio linguae Raku: <code>v6.d<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">In praesenti renovationes litteram sequentem ut versionem minorem accipiunt.<\/span> <span class=\"sg\" data-s=\"4\">Exempli gratia, proxima est <code>v6.e<\/code>, et cetera.<\/span> <span class=\"sg\" data-s=\"5\">Denique nomen machinae virtualis in hoc compilatore vides: MoarVM versio <code>2026.06<\/code>.<\/span><\/p>"]]}}}</script>
