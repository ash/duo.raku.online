<script type="application/json" id="page-data">{"u":"essentials/ranges/excluding-endpoints","n":112,"k":"topic","pv":"essentials/ranges","nx":"essentials/ranges/excluding-endpoints/quiz","tr":["essentials","essentials/ranges"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Excluding the endpoints of a range","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">You can exclude one end of a range, or both ends.<\/span> <span class=\"sg\" data-s=\"1\">To do this, add the <code>^<\/code> character to the range operator.<\/span> <span class=\"sg\" data-s=\"2\">In this way, you can build three more operators.<\/span> <span class=\"sg\" data-s=\"3\">The comments list the numbers that each range generates.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In simple cases like these, you can leave out the spaces around the operator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For a range that starts with 0, such as <code>0..^5<\/code>, there is a short form: <code>^5<\/code>.<\/span><\/p>"]]},"de":{"t":"Endpunkte ausschließen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie können ein Ende eines Bereichs ausschließen oder beide Enden.<\/span> <span class=\"sg\" data-s=\"1\">Fügen Sie dazu das Zeichen <code>^<\/code> zum Bereichsoperator hinzu.<\/span> <span class=\"sg\" data-s=\"2\">Auf diese Weise können Sie drei weitere Operatoren bilden.<\/span> <span class=\"sg\" data-s=\"3\">Die Kommentare listen die Zahlen auf, die jeder Bereich erzeugt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In einfachen Fällen wie diesen können Sie die Leerzeichen um den Operator weglassen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Für einen Bereich, der mit 0 beginnt, wie <code>0..^5<\/code>, gibt es eine Kurzform: <code>^5<\/code>.<\/span><\/p>"]]},"nl":{"t":"Uitsluiting van eindpunten","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt één uiteinde van een bereik uitsluiten, of beide uiteinden.<\/span> <span class=\"sg\" data-s=\"1\">Voeg daarvoor het teken <code>^<\/code> toe aan de bereikoperator.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je nog drie operators maken.<\/span> <span class=\"sg\" data-s=\"3\">De opmerkingen tonen de getallen die elk bereik maakt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In eenvoudige gevallen zoals deze kun je de spaties rond de operator weglaten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een bereik dat met 0 begint, zoals <code>0..^5<\/code>, is er een korte vorm: <code>^5<\/code>.<\/span><\/p>"]]},"es":{"t":"Excluir extremos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes excluir un extremo de un rango, o los dos.<\/span> <span class=\"sg\" data-s=\"1\">Para hacerlo, añade el carácter <code>^<\/code> al operador de rango.<\/span> <span class=\"sg\" data-s=\"2\">De esta manera, puedes construir tres operadores más.<\/span> <span class=\"sg\" data-s=\"3\">Los comentarios enumeran los números que genera cada rango.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En casos simples como estos, puedes omitir los espacios alrededor del operador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un rango que empieza con 0, como <code>0..^5<\/code>, hay una forma corta: <code>^5<\/code>.<\/span><\/p>"]]},"it":{"t":"Escludere gli endpoint","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi escludere un estremo di un intervallo, o entrambi.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, aggiungi il carattere <code>^<\/code> all'operatore di intervallo.<\/span> <span class=\"sg\" data-s=\"2\">In questo modo, puoi costruire altri tre operatori.<\/span> <span class=\"sg\" data-s=\"3\">I commenti elencano i numeri che genera ogni intervallo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In casi semplici come questi, puoi togliere gli spazi intorno all'operatore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un intervallo che inizia da 0, come <code>0..^5<\/code>, esiste una forma breve: <code>^5<\/code>.<\/span><\/p>"]]},"lv":{"t":"Galapunktu izslēgšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izslēgt vienu diapazona galu vai abus galus.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, pievienojiet diapazona operatoram rakstzīmi <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šādā veidā jūs varat izveidot vēl trīs operatorus.<\/span> <span class=\"sg\" data-s=\"3\">Komentāros ir uzskaitīti skaitļi, ko ģenerē katrs diapazons.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tādos vienkāršos gadījumos kā šie jūs varat izlaist atstarpes ap operatoru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diapazonam, kas sākas ar 0, piemēram, <code>0..^5<\/code>, ir īsa forma: <code>^5<\/code>.<\/span><\/p>"]]},"ru":{"t":"Исключение концов интервала","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы можете исключить один конец интервала или оба конца.<\/span> <span class=\"sg\" data-s=\"1\">Для этого добавьте символ <code>^<\/code> к оператору интервала.<\/span> <span class=\"sg\" data-s=\"2\">Так можно построить ещё три оператора.<\/span> <span class=\"sg\" data-s=\"3\">Комментарии перечисляют числа, которые создаёт каждый интервал.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В простых случаях, как эти, можно не ставить пробелы вокруг оператора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для интервала, который начинается с 0, например <code>0..^5<\/code>, есть короткая форма: <code>^5<\/code>.<\/span><\/p>"]]},"uk":{"t":"Виключаючи кінцеві точки","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можна виключити один кінець діапазону або обидва.<\/span> <span class=\"sg\" data-s=\"1\">Для цього додайте до оператора діапазону символ <code>^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так можна побудувати ще три оператори.<\/span> <span class=\"sg\" data-s=\"3\">Коментарі перелічують числа, які генерує кожен діапазон.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У таких простих випадках пробіли навколо оператора можна опустити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для діапазону, який починається з 0, як-от <code>0..^5<\/code>, є коротка форма: <code>^5<\/code>.<\/span><\/p>"]]},"bg":{"t":"Изключване на крайните точки","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да изключите единия край на диапазона или и двата края.<\/span> <span class=\"sg\" data-s=\"1\">За да направите това, добавете символа <code>^<\/code> към оператора за диапазон.<\/span> <span class=\"sg\" data-s=\"2\">Така можете да построите още три оператора.<\/span> <span class=\"sg\" data-s=\"3\">Коментарите изброяват числата, които създава всеки диапазон.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В прости случаи като тези можете да пропуснете интервалите около оператора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За диапазон, който започва с 0, като <code>0..^5<\/code>, има кратка форма: <code>^5<\/code>.<\/span><\/p>"]]},"eo":{"t":"Ekskludante finojn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas ekskludi unu finon de intervalo, aŭ ambaŭ finojn.<\/span> <span class=\"sg\" data-s=\"1\">Por fari tion, aldonu la karakteron <code>^<\/code> al la intervala operatoro.<\/span> <span class=\"sg\" data-s=\"2\">Tiel vi povas konstrui tri pliajn operatorojn.<\/span> <span class=\"sg\" data-s=\"3\">La komentoj listigas la nombrojn, kiujn ĉiu intervalo generas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En simplaj kazoj kiel ĉi tiuj, vi povas preterlasi la spacojn ĉirkaŭ la operatoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por intervalo, kiu komenciĝas per 0, kiel <code>0..^5<\/code>, estas mallonga formo: <code>^5<\/code>.<\/span><\/p>"]]},"la":{"t":"Exclusis extremitatibus","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Unum finem intervalli excludere potes, vel ambos.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc faciendum, characterem <code>^<\/code> ad operatorem intervalli adde.<\/span> <span class=\"sg\" data-s=\"2\">Sic tres alios operatores construere potes.<\/span> <span class=\"sg\" data-s=\"3\">Commentaria numeros enumerant quos quodque intervallum generat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1 ..^ 5;  # 1, 2, 3, 4\n1 ^.. 5;  #    2, 3, 4, 5\n1 ^..^ 5; #    2, 3, 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In casibus simplicibus ut his, spatia circa operatorem omittere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r1 = 1..5;\nmy $r2 = 1..^5;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro intervallo quod a 0 incipit, ut <code>0..^5<\/code>, est forma brevis: <code>^5<\/code>.<\/span><\/p>"]]}}}</script>
