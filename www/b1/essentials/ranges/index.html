ku\"><code>1 .. 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Spatia circa operatorem optativa sunt.<\/span> <span class=\"sg\" data-s=\"1\">Itaque idem intervallum sic scribere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>1..5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intervallum est modus ad indices creandos, sed tamen est unum obiectum.<\/span> <span class=\"sg\" data-s=\"1\">Itaque id in variabili scalari servare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = 1 .. 5;<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Non solum numeri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intervalla etiam alia genera datorum adhibere possunt, si Raku valores eorum incrementare scit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $letters = 'a' .. 'z';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku intervalla sunt obiecta sui generis datorum.<\/span> <span class=\"sg\" data-s=\"1\">Genus variabilis <code>$r<\/code> est <code>Range<\/code>.<\/span><\/p>"]]}}}</script>
