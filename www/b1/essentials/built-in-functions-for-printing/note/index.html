>-Methode auf ihren Argumenten auf.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Fügt ein Zeilenumbruchzeichen hinzu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertiert das Ergebnis in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendet es an den <code>STDERR<\/code>-Strom.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Der aktuelle Wert von \\$x ist $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prüfen Sie, dass dieses Programm die Nachricht nicht an <code>STDOUT<\/code> sendet:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nDer aktuelle Wert von $x ist 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>note<\/code> ohne Argumente aufrufen, druckt die Routine die Standardnachricht <code>Noted<\/code>.<\/span><\/p>"]]},"nl":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>note<\/code> print zijn argumenten naar de standaard foutstroom.<\/span> <span class=\"sg\" data-s=\"1\">Verder werkt hij precies zoals <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Roept de <code>gist<\/code> methode aan op zijn argumenten.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Voegt een nieuwe regelkarakter toe.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converteert het resultaat naar UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Stuurt het naar de <code>STDERR<\/code> stroom.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Huidige waarde van \\$x is $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Controleer dat dit programma het bericht niet naar <code>STDOUT<\/code> stuurt:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nHuidige waarde van $x is 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je <code>note<\/code> zonder argumenten aanroept, print hij het standaardbericht, <code>Noted<\/code>.<\/span><\/p>"]]},"es":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>note<\/code> imprime sus argumentos en el flujo de errores estándar.<\/span> <span class=\"sg\" data-s=\"1\">Aparte de eso, funciona igual que <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Llama al método <code>gist<\/code> en sus argumentos.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Añade un carácter de nueva línea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convierte el resultado a UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo envía al flujo <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"El valor actual de \\$x es $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Comprueba que este programa no envía el mensaje a <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nEl valor actual de $x es 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si llamas a <code>note<\/code> sin argumentos, imprime el mensaje predeterminado, <code>Noted<\/code>.<\/span><\/p>"]]},"it":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>note<\/code> stampa i suoi argomenti sul flusso di errori standard.<\/span> <span class=\"sg\" data-s=\"1\">A parte questo, funziona proprio come <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Chiama il metodo <code>gist<\/code> sui suoi argomenti.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aggiunge un carattere di nuova riga.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converte il risultato in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo invia al flusso <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Il valore corrente di \\$x è $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Controlla che questo programma non invii il messaggio a <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nIl valore corrente di $x è 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se chiami <code>note<\/code> senza argomenti, stampa il messaggio predefinito, <code>Noted<\/code>.<\/span><\/p>"]]},"lv":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>note<\/code> rutīna izdrukā savus argumentus uz standarta kļūdu plūsmu.<\/span> <span class=\"sg\" data-s=\"1\">Citādi tā darbojas tieši tāpat kā <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Izsauc <code>gist<\/code> metodi uz saviem argumentiem.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Pievieno jaunas rindas rakstzīmi.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertē rezultātu uz UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nosūta to uz <code>STDERR<\/code> plūsmu.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Pašreizējā \\$x vērtība ir $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pārbaudiet, ka šī programma nesūta ziņojumu uz <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nPašreizējā $x vērtība ir 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jūs izsaucat <code>note<\/code> bez argumentiem, tā izdrukā noklusējuma ziņojumu, <code>Noted<\/code>.<\/span><\/p>"]]},"ru":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутина <code>note<\/code> выводит свои аргументы в поток стандартных ошибок.<\/span> <span class=\"sg\" data-s=\"1\">В остальном она работает так же, как <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Вызывает метод <code>gist<\/code> для своих аргументов.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавляет символ новой строки.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразует результат в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Отправляет его в поток <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Текущее значение \\$x равно $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Проверьте, что эта программа не отправляет сообщение в <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nТекущее значение $x равно 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы вызываете <code>note<\/code> без аргументов, она выводит сообщение по умолчанию, <code>Noted<\/code>.<\/span><\/p>"]]},"uk":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутинна функція <code>note<\/code> виводить свої аргументи в стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"1\">Крім цього, вона працює так само, як <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Викликає метод <code>gist<\/code> на своїх аргументах.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Додає символ нового рядка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Конвертує результат в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Відправляє його в потік <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Current value of \\$x is $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Перевірте, що ця програма не відправляє повідомлення в <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nCurrent value of $x is 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви викликаєте <code>note<\/code> без аргументів, вона виводить повідомлення за замовчуванням, <code>Noted<\/code>.<\/span><\/p>"]]},"bg":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Рутината <code>note<\/code> отпечатва своите аргументи на стандартния поток за грешки.<\/span> <span class=\"sg\" data-s=\"1\">Иначе тя работи точно като <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Извиква метода <code>gist<\/code> на своите аргументи.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавя символ за нов ред.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразува резултата в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Изпраща го на потока <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Текущата стойност на \\$x е $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Проверете, че тази програма не изпраща съобщението към <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nТекущата стойност на $x е 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако извикате <code>note<\/code> без аргументи, тя отпечатва съобщението по подразбиране, <code>Noted<\/code>.<\/span><\/p>"]]},"eo":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>note<\/code> presas siajn argumentojn al la norma erara fluo.<\/span> <span class=\"sg\" data-s=\"1\">Krom tio, ĝi funkcias same kiel <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a>.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vokas la <code>gist<\/code> metodon sur siaj argumentoj.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aldonas novlinian karakteron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertas la rezulton al UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendas ĝin al la <code>STDERR<\/code> fluo.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Aktuala valoro de \\$x estas $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kontrolu, ke ĉi tiu programo ne sendas la mesaĝon al <code>STDOUT<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nAktuala valoro de $x estas 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi vokas <code>note<\/code> sen argumentoj, ĝi presas la defaŭltan mesaĝon, <code>Noted<\/code>.<\/span><\/p>"]]},"la":{"t":"<code>note<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutina <code>note<\/code> argumenta sua ad rivum standardum errorum imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Praeter hoc, prorsus sicut <a href=\"/essentials/built-in-functions-for-printing/say/\"><code>say<\/code><\/a> operatur.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vocatur methodum <code>gist<\/code> in argumentis suis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Addit characterem novae lineae.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convertit eventum ad UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mittit ad rivum <code>STDERR<\/code>.<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nnote \"Valor currentis \\$x est $x\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Proba hoc programma nuntium ad <code>STDOUT<\/code> non mittere:<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku &gt; /dev/null\nValor currentis $x est 42<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si <code>note<\/code> sine argumentis vocas, nuntium praedefinitum imprimit, <code>Notatum<\/code>.<\/span><\/p>"]]}}}</script>
