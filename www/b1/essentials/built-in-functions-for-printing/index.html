<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing","n":311,"k":"section","pv":"essentials/more-on-functions/exercises/factorial-with-multi-functions/solution","nx":"essentials/built-in-functions-for-printing/say","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in functions for printing","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">We have often used the built-in routine <code>say<\/code> to print data to the console.<\/span> <span class=\"sg\" data-s=\"1\">To be more exact, it prints to the <code>STDOUT<\/code> stream.<\/span> <span class=\"sg\" data-s=\"2\">There are a few more functions that print.<\/span> <span class=\"sg\" data-s=\"3\">We briefly saw most of them in the <a href=\"/essentials/hello-world/\">‘Hello, World!’ examples<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">This section gives more details about them.<\/span><\/p>"]]},"de":{"t":"Eingebaute Funktionen zum Drucken","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wir haben oft die eingebaute Routine <code>say<\/code> verwendet, um Daten auf die Konsole zu drucken.<\/span> <span class=\"sg\" data-s=\"1\">Genauer gesagt druckt sie in den <code>STDOUT<\/code>-Stream.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt noch ein paar weitere Funktionen, die drucken.<\/span> <span class=\"sg\" data-s=\"3\">Die meisten davon haben wir schon kurz in den <a href=\"https://course.raku.org/de/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">Beispielen zu ‚Hallo, Welt!‘<\/a> gesehen.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Abschnitt gibt mehr Details dazu.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde functies voor het afdrukken","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">We hebben vaak de ingebouwde routine <code>say<\/code> gebruikt om gegevens naar de console te printen.<\/span> <span class=\"sg\" data-s=\"1\">Om precies te zijn, print hij naar de <code>STDOUT<\/code>-stroom.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn nog een paar andere functies die printen.<\/span> <span class=\"sg\" data-s=\"3\">De meeste hebben we al kort gezien in de <a href=\"https://course.raku.org/nl/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">voorbeelden van ‘Hallo, Wereld!’<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Deze sectie geeft er meer details over.<\/span><\/p>"]]},"es":{"t":"Funciones integradas para imprimir","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Hemos usado mucho la rutina incorporada <code>say<\/code> para imprimir datos en la consola.<\/span> <span class=\"sg\" data-s=\"1\">Para ser más exactos, imprime en el flujo <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hay algunas funciones más que imprimen.<\/span> <span class=\"sg\" data-s=\"3\">Ya vimos brevemente la mayoría de ellas en los <a href=\"https://course.raku.org/es/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ejemplos de '¡Hola, Mundo!'<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Esta sección da más detalles sobre ellas.<\/span><\/p>"]]},"it":{"t":"Funzioni integrate per la stampa","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Abbiamo usato spesso la routine integrata <code>say<\/code> per stampare dati sulla console.<\/span> <span class=\"sg\" data-s=\"1\">Più precisamente, stampa sul flusso <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono alcune altre funzioni che stampano.<\/span> <span class=\"sg\" data-s=\"3\">Quasi tutte le abbiamo già viste brevemente negli <a href=\"https://course.raku.org/it/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">esempi di 'Hello, World!'<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione dà più dettagli su queste funzioni.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās drukāšanas funkcijas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Mēs bieži esam izmantojuši iebūvēto rutīnu <code>say<\/code>, lai izdrukātu datus konsolē.<\/span> <span class=\"sg\" data-s=\"1\">Precīzāk sakot, tā drukā uz <code>STDOUT<\/code> plūsmu.<\/span> <span class=\"sg\" data-s=\"2\">Ir vēl dažas funkcijas, kas drukā.<\/span> <span class=\"sg\" data-s=\"3\">Lielāko daļu no tām mēs īsi redzējām <a href=\"https://course.raku.org/lv/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">piemēros ar ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Šajā sadaļā ir vairāk informācijas par tām.<\/span><\/p>"]]},"ru":{"t":"Встроенные функции для вывода","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Мы часто использовали встроенную процедуру <code>say<\/code>, чтобы выводить данные на консоль.<\/span> <span class=\"sg\" data-s=\"1\">Точнее, она выводит их в поток <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Есть ещё несколько функций, которые выводят данные.<\/span> <span class=\"sg\" data-s=\"3\">Большинство из них мы уже кратко видели в <a href=\"https://course.raku.org/ru/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерах ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">В этом разделе о них рассказано подробнее.<\/span><\/p>"]]},"uk":{"t":"Вбудовані функції для друку","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ми часто використовували вбудовану процедуру <code>say<\/code>, щоб виводити дані на консоль.<\/span> <span class=\"sg\" data-s=\"1\">Точніше, вона виводить їх у потік <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Є ще кілька функцій, які друкують.<\/span> <span class=\"sg\" data-s=\"3\">Більшість із них ми вже коротко бачили в <a href=\"https://course.raku.org/uk/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">прикладах «Привіт, Світ!»<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ розповідає про них докладніше.<\/span><\/p>"]]},"bg":{"t":"Вградени функции за принтиране","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Често използвахме вградената рутина <code>say<\/code>, за да отпечатваме данни на конзолата.<\/span> <span class=\"sg\" data-s=\"1\">По-точно, тя отпечатва на потока <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Има още няколко функции, които отпечатват.<\/span> <span class=\"sg\" data-s=\"3\">Вече видяхме накратко повечето от тях в <a href=\"https://course.raku.org/bg/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">примерите за ‘Hello, World!’<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Този раздел дава повече подробности за тях.<\/span><\/p>"]]},"eo":{"t":"Enkonstruataj funkcioj por presado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ni ofte uzis la enkonstruitan rutinon <code>say<\/code> por presi datumojn al la konzolo.<\/span> <span class=\"sg\" data-s=\"1\">Pli precize, ĝi presas al la fluo <code>STDOUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Estas kelkaj pliaj funkcioj, kiuj presas.<\/span> <span class=\"sg\" data-s=\"3\">Ni mallonge vidis la plej multajn el ili en la <a href=\"https://course.raku.org/eo/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">ekzemploj de ‘Saluton, Mondo!’<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio donas pli da detaloj pri ili.<\/span><\/p>"]]},"la":{"t":"In aedificavit functiones ad print","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Saepe rutinam aedificatam <code>say<\/code> adhibuimus ut data ad consolam imprimeremus.<\/span> <span class=\"sg\" data-s=\"1\">Ut accuratius dicam, ad rivum <code>STDOUT<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Sunt paucae aliae functiones quae imprimunt.<\/span> <span class=\"sg\" data-s=\"3\">Plurimas earum breviter in <a href=\"https://course.raku.org/la/essentials/hello-world/\" target=\"_blank\" rel=\"noopener\">exemplis ‘Salve, Mundi!’<\/a> vidimus.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio plura singula de eis dat.<\/span><\/p>"]]}}}</script>
