<script type="application/json" id="page-data">{"u":"essentials/built-in-functions-for-printing/say","n":312,"k":"topic","pv":"essentials/built-in-functions-for-printing","nx":"essentials/built-in-functions-for-printing/print","tr":["essentials","essentials/built-in-functions-for-printing"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The say routine","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is what the built-in routine <code>say<\/code> does:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Calls the <code>gist<\/code> method on its arguments.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Adds a newline character.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converts the result to UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sends it to the <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For the user, it looks simple.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> just prints the contents of a variable to the terminal and adds a newline.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The first step needs some explanation.<\/span> <span class=\"sg\" data-s=\"1\">Every built-in data type, such as integers or strings, has a <code>gist<\/code> method.<\/span> <span class=\"sg\" data-s=\"2\">For such simple types, it returns a value that represents the item.<\/span> <span class=\"sg\" data-s=\"3\">People can easily read this value.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays and hashes are examples of more complex data.<\/span> <span class=\"sg\" data-s=\"1\">For them, the <code>gist<\/code> method adds some formatting.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can call <code>say<\/code> both as a function and as a method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can pass several arguments to <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It joins the parts of the output without any spaces between them.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"de":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Das macht die eingebaute Routine <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Ruft die Methode <code>gist<\/code> auf ihren Argumenten auf.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Fügt ein Zeilenumbruchzeichen hinzu.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertiert das Ergebnis in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendet es an den <code>STDOUT<\/code>-Stream.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Für den Benutzer sieht das einfach aus.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> druckt nur den Inhalt einer Variablen auf das Terminal und fügt einen Zeilenumbruch hinzu.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der erste Schritt braucht etwas Erklärung.<\/span> <span class=\"sg\" data-s=\"1\">Jeder eingebaute Datentyp, zum Beispiel Ganzzahlen oder Zeichenketten, hat eine Methode <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bei solchen einfachen Typen gibt sie einen Wert zurück, der das Element darstellt.<\/span> <span class=\"sg\" data-s=\"3\">Menschen können diesen Wert leicht lesen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays und Hashes sind Beispiele für komplexere Daten.<\/span> <span class=\"sg\" data-s=\"1\">Bei ihnen fügt die Methode <code>gist<\/code> etwas Formatierung hinzu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Man kann <code>say<\/code> sowohl als Funktion als auch als Methode aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Man kann mehrere Argumente an <code>say<\/code> übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Die Routine verbindet die Teile der Ausgabe ohne Leerzeichen dazwischen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"nl":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is wat de ingebouwde routine <code>say<\/code> doet:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Roept de <code>gist<\/code> methode aan op zijn argumenten.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Voegt een nieuwe regel teken toe.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converteert het resultaat naar UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Stuurt het naar de <code>STDOUT<\/code> stream.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voor de gebruiker lijkt het eenvoudig.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> print gewoon de inhoud van een variabele naar de terminal en voegt een nieuwe regel toe.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De eerste stap vraagt wat uitleg.<\/span> <span class=\"sg\" data-s=\"1\">Elk ingebouwd datatype, zoals gehele getallen of strings, heeft een <code>gist<\/code>-methode.<\/span> <span class=\"sg\" data-s=\"2\">Voor zulke eenvoudige types geeft die een waarde terug die het item voorstelt.<\/span> <span class=\"sg\" data-s=\"3\">Mensen kunnen deze waarde makkelijk lezen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays en hashes zijn voorbeelden van complexere gegevens.<\/span> <span class=\"sg\" data-s=\"1\">Daarbij voegt de <code>gist<\/code>-methode wat opmaak toe.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt <code>say<\/code> aanroepen als functie, maar ook als methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt meerdere argumenten aan <code>say<\/code> doorgeven.<\/span> <span class=\"sg\" data-s=\"1\">Hij voegt de delen van de uitvoer samen, zonder spaties ertussen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"es":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto es lo que hace la rutina incorporada <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Llama al método <code>gist<\/code> en sus argumentos.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Añade un carácter de nueva línea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convierte el resultado a UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo envía al flujo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para el usuario, parece simple.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> solo imprime el contenido de una variable en la terminal y añade una nueva línea.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El primer paso necesita alguna explicación.<\/span> <span class=\"sg\" data-s=\"1\">Cada tipo de dato incorporado, como los enteros o las cadenas, tiene un método <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Para estos tipos simples, devuelve un valor que representa el elemento.<\/span> <span class=\"sg\" data-s=\"3\">Las personas pueden leer este valor fácilmente.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los arreglos y los hashes son ejemplos de datos más complejos.<\/span> <span class=\"sg\" data-s=\"1\">Para ellos, el método <code>gist<\/code> añade algo de formato.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puedes llamar a <code>say<\/code> como una función y también como un método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes pasar varios argumentos a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Une las partes de la salida sin ningún espacio entre ellas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"it":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco cosa fa la routine incorporata <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Chiama il metodo <code>gist<\/code> sui suoi argomenti.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aggiunge un carattere di nuova linea.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Converte il risultato in UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Lo invia al flusso <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per l'utente, sembra semplice.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> stampa semplicemente il contenuto di una variabile sul terminale e aggiunge una nuova linea.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il primo passo ha bisogno di qualche spiegazione.<\/span> <span class=\"sg\" data-s=\"1\">Ogni tipo di dato incorporato, come gli interi o le stringhe, ha un metodo <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per questi tipi semplici, restituisce un valore che rappresenta l'elemento.<\/span> <span class=\"sg\" data-s=\"3\">Le persone possono leggere facilmente questo valore.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Array e hash sono esempi di dati più complessi.<\/span> <span class=\"sg\" data-s=\"1\">Per questi dati, il metodo <code>gist<\/code> aggiunge un po' di formattazione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi chiamare <code>say<\/code> sia come funzione sia come metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi passare diversi argomenti a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unisce le parti dell'output senza nessuno spazio tra loro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"lv":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, ko dara iebūvētā rutīna <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Izsauc <code>gist<\/code> metodi uz tās argumentiem.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Pievieno jaunas rindas rakstzīmi.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Pārvērš rezultātu uz UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Nosūta to uz <code>STDOUT<\/code> plūsmu.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lietotājam tas izskatās vienkārši.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> tikai izdrukā mainīgā saturu terminālā un pievieno jaunu rindu.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pirmais solis prasa nelielu paskaidrojumu.<\/span> <span class=\"sg\" data-s=\"1\">Katram iebūvētajam datu tipam, piemēram, veseliem skaitļiem vai virknēm, ir <code>gist<\/code> metode.<\/span> <span class=\"sg\" data-s=\"2\">Šādiem vienkāršiem tipiem tā atgriež vērtību, kas attēlo objektu.<\/span> <span class=\"sg\" data-s=\"3\">Cilvēki šo vērtību var viegli izlasīt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīvi un vārdnīcas ir sarežģītāku datu piemēri.<\/span> <span class=\"sg\" data-s=\"1\">Tiem <code>gist<\/code> metode pievieno nedaudz formatējuma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izsaukt <code>say<\/code> gan kā funkciju, gan kā metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat nodot <code>say<\/code> vairākus argumentus.<\/span> <span class=\"sg\" data-s=\"1\">Tā savieno izvades daļas bez atstarpēm starp tām.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"ru":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот что делает встроенная операция <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Вызывает метод <code>gist<\/code> для своих аргументов.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавляет символ новой строки.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразует результат в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Отправляет его в поток <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для пользователя это выглядит просто.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> лишь выводит содержимое переменной в терминал и добавляет новую строку.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Первый шаг нужно немного объяснить.<\/span> <span class=\"sg\" data-s=\"1\">У каждого встроенного типа данных, например у целых чисел или строк, есть метод <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Для таких простых типов он возвращает значение, которое представляет элемент.<\/span> <span class=\"sg\" data-s=\"3\">Люди могут легко прочитать это значение.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Массивы и хэши — примеры более сложных данных.<\/span> <span class=\"sg\" data-s=\"1\">Для них метод <code>gist<\/code> добавляет некоторое форматирование.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы можете вызвать <code>say<\/code> и как функцию, и как метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете передать в <code>say<\/code> несколько аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Она соединяет части вывода без пробелов между ними.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"uk":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось що робить вбудована рутинна функція <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Викликає метод <code>gist<\/code> на своїх аргументах.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Додає символ нового рядка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Перетворює результат у UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Відправляє його до потоку <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для користувача це виглядає просто.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> лише виводить вміст змінної на термінал і додає новий рядок.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Перший крок потребує деяких пояснень.<\/span> <span class=\"sg\" data-s=\"1\">Кожен вбудований тип даних, наприклад цілі числа або рядки, має метод <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Для таких простих типів він повертає значення, яке представляє елемент.<\/span> <span class=\"sg\" data-s=\"3\">Люди можуть легко прочитати це значення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масиви та хеші — приклади складніших даних.<\/span> <span class=\"sg\" data-s=\"1\">Для них метод <code>gist<\/code> додає певне форматування.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви можете викликати <code>say<\/code> і як функцію, і як метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете передати <code>say<\/code> кілька аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Вона з'єднує частини виводу без жодних пробілів між ними.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"bg":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето какво прави вградената рутина <code>say<\/code>:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Извиква метода <code>gist<\/code> върху своите аргументи.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Добавя нов ред.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Преобразува резултата в UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Изпраща го към потока <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За потребителя това изглежда просто.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> само отпечатва съдържанието на променлива в терминала и добавя нов ред.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първата стъпка изисква малко обяснение.<\/span> <span class=\"sg\" data-s=\"1\">Всеки вграден тип данни, като цели числа или низове, има метод <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За такива прости типове той връща стойност, която представя елемента.<\/span> <span class=\"sg\" data-s=\"3\">Хората могат лесно да четат тази стойност.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивите и хешовете са примери за по-сложни данни.<\/span> <span class=\"sg\" data-s=\"1\">За тях методът <code>gist<\/code> добавя малко форматиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете да извикате <code>say<\/code> както като функция, така и като метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да подадете няколко аргумента на <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя съединява частите на изхода без никакви интервали между тях.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"eo":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kion la enkonstruita rutino <code>say<\/code> faras:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vokas la metodon <code>gist<\/code> sur siaj argumentoj.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Aldonas novlinian karakteron.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Konvertas la rezulton al UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Sendas ĝin al la fluo <code>STDOUT<\/code>.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por la uzanto, ĝi aspektas simpla.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> nur presas la enhavon de variablo al la terminalo kaj aldonas novlinion.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La unua paŝo bezonas iom da klarigo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu enkonstruita datentipo, kiel entjeroj aŭ ĉenoj, havas metodon <code>gist<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por tiaj simplaj tipoj, ĝi redonas valoron, kiu reprezentas la objekton.<\/span> <span class=\"sg\" data-s=\"3\">Homoj povas facile legi ĉi tiun valoron.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vektoroj kaj asociaj tabeloj estas ekzemploj de pli kompleksaj datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Por ili, la metodo <code>gist<\/code> aldonas iom da formatado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi povas voki <code>say<\/code> kaj kiel funkcion, kaj kiel metodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas pasi plurajn argumentojn al <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kunigas la partojn de la eligo sen iuj ajn spacoj inter ili.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]},"la":{"t":"<code>say<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc est quod rutina aedificata <code>say<\/code> facit:<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Vocavit methodum <code>gist<\/code> in argumentis suis.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Addit novam lineam characterem.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Convertit eventum ad UTF-8.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mittit ad <code>STDOUT<\/code> rivum.<\/span><\/li><\/ol>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usori res simplex videtur.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> solum contenta variabilis ad terminalem imprimit et novam lineam addit.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Primus gradus aliquam explicationem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Omne genus aedificatum datorum, ut integri vel chordae, methodum <code>gist<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Pro talibus generibus simplicibus, valorem reddit qui rem repraesentat.<\/span> <span class=\"sg\" data-s=\"3\">Homines hunc valorem facile legere possunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42; # 42\nsay 'Raku'; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordines et tabulae sunt exempla datorum magis complexorum.<\/span> <span class=\"sg\" data-s=\"1\">Pro eis, methodus <code>gist<\/code> aliquam formam addit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 'alpha', 'beta', 'gamma';\nsay @data; # [alpha beta gamma]\n\nmy %data = alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3;\nsay %data; # {alpha =&gt; 1, beta =&gt; 2, gamma =&gt; 3}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Potes <code>say<\/code> et ut functionem et ut methodum vocare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42;\nsay(42);\n42.say;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plura argumenta ad <code>say<\/code> dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Partes output sine ullis spatiis inter eas iungit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say(100, 500); # 100500<\/code><\/pre>"]]}}}</script>
