 exercises/built-in-functions-for-printing/print-the-warning.raku &gt; /dev/null \n-1\nYou entered a negative number!<\/code><\/pre>"]]},"la":{"t":"Solutio: Print admonitionem","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $aetas = prompt 'Quot annos habes? ';\n\nif $aetas &lt; 0 {\n    note 'Numerum negativum inseruisti!';\n}\nelse {\n    say \"Aetas tua est $aetas\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenias programmatum in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/built-in-functions-for-printing/print-the-warning.raku\" target=\"_blank\" rel=\"noopener\">print-the-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce duo casus possibiles:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/built-in-functions-for-printing/print-the-warning.raku \nQuot annos habes? 20\nAetas tua est 20\n\n$ raku exercises/built-in-functions-for-printing/print-the-warning.raku \nQuot annos habes? -1\nNumerum negativum inseruisti!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut probes nuntium erroris ad <code>STDERR<\/code> ire, output redirige.<\/span> <span class=\"sg\" data-s=\"1\">Rogatio de aetate tua non apparebit, sed numerum adhuc inserere potes.<\/span> <span class=\"sg\" data-s=\"2\">Monitio adhuc apparet.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/built-in-functions-for-printing/print-the-warning.raku &gt; /dev/null\n20\n\n$ raku exercises/built-in-functions-for-printing/print-the-warning.raku &gt; /dev/null \n-1\nNumerum negativum inseruisti!<\/code><\/pre>"]]}}}</script>
