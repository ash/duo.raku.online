<script type="application/json" id="page-data">{"u":"essentials/the-rakudo-compiler","n":4,"k":"section","pv":"essentials/raku-vs-rakudo","nx":"essentials/how-to-install-rakudo","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Rakudo compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is the reference implementation of Raku: the main, standard compiler.<\/span> <span class=\"sg\" data-s=\"1\">This course uses it.<\/span> <span class=\"sg\" data-s=\"2\">Today it is the most complete way to run Raku.<\/span> <span class=\"sg\" data-s=\"3\">It is also well tested in real work.<\/span> <span class=\"sg\" data-s=\"4\">So when people say “the Raku compiler”, they usually mean Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo itself is mostly written in Raku.<\/span> <span class=\"sg\" data-s=\"1\">A smaller language, NQP (“Not Quite Perl”), helps to build it.<\/span> <span class=\"sg\" data-s=\"2\">Your program is compiled to bytecode and runs on a virtual machine called <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">You get MoarVM automatically when you install Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo tries to cover the whole language.<\/span> <span class=\"sg\" data-s=\"5\">So it is the safest choice if every part of Raku must work.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo supports Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">New releases come out often, so fixes and new features reach you quickly.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The virtual machine<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">By default, Rakudo runs on MoarVM, a virtual machine made especially for Raku.<\/span> <span class=\"sg\" data-s=\"1\">The design does not tie Rakudo to one machine.<\/span> <span class=\"sg\" data-s=\"2\">It can also be built on top of other virtual machines.<\/span> <span class=\"sg\" data-s=\"3\">But MoarVM is the standard, well-supported choice.<\/span> <span class=\"sg\" data-s=\"4\">This course assumes you use it.<\/span> <span class=\"sg\" data-s=\"5\">This is the main difference from <a href=\"/essentials/the-rakupp-compiler/\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ is written in C++ and needs no virtual machine of its own.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Source code and links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source, and anyone can follow its development:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo on GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"de":{"t":"Der Rakudo-Compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ist die Referenzimplementierung von Raku: der wichtigste Standard-Compiler.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Kurs verwendet ihn.<\/span> <span class=\"sg\" data-s=\"2\">Heute ist er der vollständigste Weg, Raku auszuführen.<\/span> <span class=\"sg\" data-s=\"3\">Er ist auch in der Praxis gut erprobt.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Leute also „den Raku-Compiler“ sagen, meinen sie meistens Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo selbst ist größtenteils in Raku geschrieben.<\/span> <span class=\"sg\" data-s=\"1\">Eine kleinere Sprache, NQP („Not Quite Perl“), hilft dabei, ihn zu bauen.<\/span> <span class=\"sg\" data-s=\"2\">Ihr Programm wird in Bytecode übersetzt und läuft auf einer virtuellen Maschine namens <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">MoarVM bekommen Sie automatisch, wenn Sie Rakudo installieren.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo will die ganze Sprache abdecken.<\/span> <span class=\"sg\" data-s=\"5\">Deshalb ist er die sicherste Wahl, wenn jeder Teil von Raku funktionieren muss.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo unterstützt Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Neue Veröffentlichungen erscheinen oft, sodass Korrekturen und neue Funktionen Sie schnell erreichen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die virtuelle Maschine<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig läuft Rakudo auf MoarVM, einer virtuellen Maschine, die speziell für Raku gemacht ist.<\/span> <span class=\"sg\" data-s=\"1\">Der Entwurf bindet Rakudo nicht an eine einzige Maschine.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo kann auch auf anderen virtuellen Maschinen aufgebaut werden.<\/span> <span class=\"sg\" data-s=\"3\">Aber MoarVM ist die übliche, gut unterstützte Wahl.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Kurs geht davon aus, dass Sie sie verwenden.<\/span> <span class=\"sg\" data-s=\"5\">Das ist der wichtigste Unterschied zu <a href=\"https://course.raku.org/de/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ ist in C++ geschrieben und braucht keine eigene virtuelle Maschine.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quellcode und Links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo ist quelloffen, und jeder kann seine Entwicklung verfolgen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo auf GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"nl":{"t":"De Rakudo-compiler","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> is de referentie-implementatie van Raku: de belangrijkste, standaard compiler.<\/span> <span class=\"sg\" data-s=\"1\">Deze cursus gebruikt het.<\/span> <span class=\"sg\" data-s=\"2\">Vandaag is het de meest complete manier om Raku uit te voeren.<\/span> <span class=\"sg\" data-s=\"3\">Het is ook goed getest in echt werk.<\/span> <span class=\"sg\" data-s=\"4\">Als mensen het over “de Raku-compiler” hebben, bedoelen ze dus meestal Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo zelf is vooral in Raku geschreven.<\/span> <span class=\"sg\" data-s=\"1\">Een kleinere taal, NQP (“Not Quite Perl”), helpt om het te bouwen.<\/span> <span class=\"sg\" data-s=\"2\">Je programma wordt naar bytecode gecompileerd en draait op een virtuele machine die <strong>MoarVM<\/strong> heet.<\/span> <span class=\"sg\" data-s=\"3\">Je krijgt MoarVM automatisch als je Rakudo installeert.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo probeert de hele taal te dekken.<\/span> <span class=\"sg\" data-s=\"5\">Daarom is het de veiligste keuze als elk deel van Raku moet werken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo ondersteunt Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Nieuwe uitgaven komen vaak uit, zodat verbeteringen en nieuwe mogelijkheden je snel bereiken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De virtuele machine<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Standaard draait Rakudo op MoarVM, een virtuele machine die speciaal voor Raku gemaakt is.<\/span> <span class=\"sg\" data-s=\"1\">Het ontwerp bindt Rakudo niet aan één machine.<\/span> <span class=\"sg\" data-s=\"2\">Rakudo kan ook op andere virtuele machines gebouwd worden.<\/span> <span class=\"sg\" data-s=\"3\">Maar MoarVM is de standaard, goed ondersteunde keuze.<\/span> <span class=\"sg\" data-s=\"4\">Deze cursus gaat ervan uit dat je die gebruikt.<\/span> <span class=\"sg\" data-s=\"5\">Dat is het belangrijkste verschil met <a href=\"https://course.raku.org/nl/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ is in C++ geschreven en heeft geen eigen virtuele machine nodig.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Broncode en links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo is open source, en iedereen kan de ontwikkeling volgen:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo op GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"es":{"t":"El compilador Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> es la implementación de referencia de Raku: el compilador principal y estándar.<\/span> <span class=\"sg\" data-s=\"1\">Este curso lo usa.<\/span> <span class=\"sg\" data-s=\"2\">Hoy es la forma más completa de ejecutar Raku.<\/span> <span class=\"sg\" data-s=\"3\">También está bien probado en el trabajo real.<\/span> <span class=\"sg\" data-s=\"4\">Así que cuando alguien dice «el compilador de Raku», normalmente se refiere a Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo está escrito sobre todo en el propio Raku.<\/span> <span class=\"sg\" data-s=\"1\">Un lenguaje más pequeño, NQP («Not Quite Perl»), ayuda a construirlo.<\/span> <span class=\"sg\" data-s=\"2\">Tu programa se compila a bytecode y se ejecuta en una máquina virtual llamada <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Recibes MoarVM automáticamente cuando instalas Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo intenta cubrir todo el lenguaje.<\/span> <span class=\"sg\" data-s=\"5\">Por eso es la opción más segura si cada parte de Raku tiene que funcionar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo admite Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Salen versiones nuevas a menudo, así que las correcciones y las novedades te llegan pronto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La máquina virtual<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Por defecto, Rakudo funciona sobre MoarVM, una máquina virtual hecha especialmente para Raku.<\/span> <span class=\"sg\" data-s=\"1\">El diseño no ata Rakudo a una sola máquina.<\/span> <span class=\"sg\" data-s=\"2\">También se puede construir sobre otras máquinas virtuales.<\/span> <span class=\"sg\" data-s=\"3\">Pero MoarVM es la opción estándar y con buen soporte.<\/span> <span class=\"sg\" data-s=\"4\">Este curso supone que la usas.<\/span> <span class=\"sg\" data-s=\"5\">Esta es la diferencia principal con <a href=\"https://course.raku.org/es/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ está escrito en C++ y no necesita una máquina virtual propia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código fuente y enlaces<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo es de código abierto, y cualquiera puede seguir su desarrollo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"it":{"t":"Il compilatore Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> è l'implementazione di riferimento di Raku: il compilatore principale e standard.<\/span> <span class=\"sg\" data-s=\"1\">Questo corso lo usa.<\/span> <span class=\"sg\" data-s=\"2\">Oggi è il modo più completo per eseguire Raku.<\/span> <span class=\"sg\" data-s=\"3\">È anche ben testato nel lavoro reale.<\/span> <span class=\"sg\" data-s=\"4\">Quindi, quando si dice «il compilatore Raku», di solito si intende Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo stesso è scritto soprattutto in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Un linguaggio più piccolo, NQP («Not Quite Perl»), aiuta a costruirlo.<\/span> <span class=\"sg\" data-s=\"2\">Il tuo programma viene compilato in bytecode e gira su una macchina virtuale chiamata <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Ricevi MoarVM automaticamente quando installi Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo cerca di coprire tutto il linguaggio.<\/span> <span class=\"sg\" data-s=\"5\">Quindi è la scelta più sicura se ogni parte di Raku deve funzionare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo supporta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Nuove release escono spesso, quindi correzioni e nuove funzionalità ti arrivano in fretta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La macchina virtuale<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Normalmente, Rakudo gira su MoarVM, una macchina virtuale fatta apposta per Raku.<\/span> <span class=\"sg\" data-s=\"1\">Il progetto non lega Rakudo a una sola macchina.<\/span> <span class=\"sg\" data-s=\"2\">Può anche essere costruito sopra altre macchine virtuali.<\/span> <span class=\"sg\" data-s=\"3\">Ma MoarVM è la scelta standard e ben supportata.<\/span> <span class=\"sg\" data-s=\"4\">Questo corso presume che tu la usi.<\/span> <span class=\"sg\" data-s=\"5\">Questa è la differenza principale rispetto a <a href=\"https://course.raku.org/it/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ è scritto in C++ e non ha bisogno di una sua macchina virtuale.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice sorgente e collegamenti<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo è open source, e chiunque può seguire il suo sviluppo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo su GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"lv":{"t":"Kompilators Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> ir Raku atsauces implementācija: galvenais, standarta kompilators.<\/span> <span class=\"sg\" data-s=\"1\">Šis kurss to izmanto.<\/span> <span class=\"sg\" data-s=\"2\">Šodien tas ir vispilnīgākais veids, kā palaist Raku.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir arī labi pārbaudīts praksē.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc, kad cilvēki saka «Raku kompilators», viņi parasti domā Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo pats lielākoties ir uzrakstīts Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tā uzbūvei palīdz mazāka valoda, NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"2\">Jūsu programma tiek kompilēta baitkodā un darbojas virtuālajā mašīnā, ko sauc <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">MoarVM jūs saņemat automātiski, kad instalējat Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo cenšas aptvert visu valodu.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc tā ir drošākā izvēle, ja jādarbojas katrai Raku daļai.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo atbalsta Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Jauni izlaidumi iznāk bieži, tāpēc labojumi un jaunas iespējas jūs sasniedz ātri.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Virtuālā mašīna<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma Rakudo darbojas uz MoarVM, virtuālās mašīnas, kas īpaši veidota Raku valodai.<\/span> <span class=\"sg\" data-s=\"1\">Uzbūve nepiesaista Rakudo vienai mašīnai.<\/span> <span class=\"sg\" data-s=\"2\">To var būvēt arī uz citām virtuālajām mašīnām.<\/span> <span class=\"sg\" data-s=\"3\">Bet MoarVM ir standarta izvēle ar labu atbalstu.<\/span> <span class=\"sg\" data-s=\"4\">Šis kurss pieņem, ka jūs to lietojat.<\/span> <span class=\"sg\" data-s=\"5\">Tā ir galvenā atšķirība no <a href=\"https://course.raku.org/lv/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ ir uzrakstīts C++ valodā, un tam nav vajadzīga sava virtuālā mašīna.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pirmkods un saites<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo ir atvērtā koda projekts, un ikviens var sekot tā izstrādei:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"ru":{"t":"Компилятор Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — это эталонная реализация Raku, то есть главный, стандартный компилятор.<\/span> <span class=\"sg\" data-s=\"1\">Этот курс использует именно его.<\/span> <span class=\"sg\" data-s=\"2\">Сегодня это самый полный способ запускать Raku.<\/span> <span class=\"sg\" data-s=\"3\">Кроме того, он хорошо проверен в реальной работе.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому, когда говорят «компилятор Raku», обычно имеют в виду Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написан в основном на Raku.<\/span> <span class=\"sg\" data-s=\"1\">В его сборке помогает небольшой язык NQP («Not Quite Perl»).<\/span> <span class=\"sg\" data-s=\"2\">Ваша программа компилируется в байт-код и работает на виртуальной машине <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Вы получаете MoarVM автоматически, когда устанавливаете Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo старается охватить весь язык.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому это самый надёжный выбор, если вам нужно, чтобы работала каждая часть Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo поддерживает Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Новые выпуски выходят часто, так что исправления и новые возможности быстро доходят до вас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуальная машина<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">По умолчанию Rakudo работает на MoarVM — виртуальной машине, созданной специально для Raku.<\/span> <span class=\"sg\" data-s=\"1\">Устройство Rakudo не привязывает его к одной машине.<\/span> <span class=\"sg\" data-s=\"2\">Его можно собрать и поверх других виртуальных машин.<\/span> <span class=\"sg\" data-s=\"3\">Но MoarVM — это стандартный выбор с хорошей поддержкой.<\/span> <span class=\"sg\" data-s=\"4\">Этот курс предполагает, что вы используете именно её.<\/span> <span class=\"sg\" data-s=\"5\">В этом главное отличие от <a href=\"https://course.raku.org/ru/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ написан на C++, и ему не нужна собственная виртуальная машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Исходный код и ссылки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo — открытое программное обеспечение, и любой может следить за его разработкой:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"uk":{"t":"Компілятор Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> — це еталонна реалізація Raku: головний, стандартний компілятор.<\/span> <span class=\"sg\" data-s=\"1\">Цей курс використовує саме його.<\/span> <span class=\"sg\" data-s=\"2\">Сьогодні це найповніший спосіб виконувати Raku.<\/span> <span class=\"sg\" data-s=\"3\">Його також добре перевірено в реальній роботі.<\/span> <span class=\"sg\" data-s=\"4\">Тож коли кажуть «компілятор Raku», зазвичай мають на увазі Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Сам Rakudo написано здебільшого мовою Raku.<\/span> <span class=\"sg\" data-s=\"1\">Менша мова, NQP («Not Quite Perl»), допомагає його зібрати.<\/span> <span class=\"sg\" data-s=\"2\">Ваша програма компілюється в байткод і виконується на віртуальній машині <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">MoarVM ви отримуєте автоматично, коли встановлюєте Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo намагається охопити всю мову.<\/span> <span class=\"sg\" data-s=\"5\">Тому це найбезпечніший вибір, якщо має працювати кожна частина Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo підтримує Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Нові випуски виходять часто, тож виправлення та нові можливості швидко потрапляють до вас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Віртуальна машина<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням Rakudo працює на MoarVM — віртуальній машині, створеній спеціально для Raku.<\/span> <span class=\"sg\" data-s=\"1\">Задум не прив'язує Rakudo до однієї машини.<\/span> <span class=\"sg\" data-s=\"2\">Його можна зібрати й поверх інших віртуальних машин.<\/span> <span class=\"sg\" data-s=\"3\">Але MoarVM — стандартний вибір із доброю підтримкою.<\/span> <span class=\"sg\" data-s=\"4\">Цей курс розраховує, що ви використовуєте саме її.<\/span> <span class=\"sg\" data-s=\"5\">Це головна відмінність від <a href=\"https://course.raku.org/uk/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ написано мовою C++, і власна віртуальна машина йому не потрібна.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вихідний код і посилання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo має відкритий код, і будь-хто може стежити за його розробкою:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo на GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"bg":{"t":"Компилаторът Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> е еталонната реализация на Raku: основният, стандартен компилатор.<\/span> <span class=\"sg\" data-s=\"1\">Този курс го използва.<\/span> <span class=\"sg\" data-s=\"2\">Днес това е най-пълният начин да изпълнявате Raku.<\/span> <span class=\"sg\" data-s=\"3\">Той е и добре изпитан в реална работа.<\/span> <span class=\"sg\" data-s=\"4\">Затова, когато хората кажат „компилаторът на Raku“, обикновено имат предвид Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Самият Rakudo е написан главно на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Един по-малък език, NQP („Not Quite Perl“), помага при изграждането му.<\/span> <span class=\"sg\" data-s=\"2\">Програмата ви се компилира до байткод и се изпълнява във виртуална машина на име <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Получавате MoarVM автоматично, когато инсталирате Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo се стреми да покрие целия език.<\/span> <span class=\"sg\" data-s=\"5\">Затова той е най-сигурният избор, ако всяка част на Raku трябва да работи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo поддържа Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Нови издания излизат често, така че поправките и новите възможности стигат до вас бързо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виртуалната машина<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">По подразбиране Rakudo работи върху MoarVM, виртуална машина, направена специално за Raku.<\/span> <span class=\"sg\" data-s=\"1\">Дизайнът му не го обвързва с една машина.<\/span> <span class=\"sg\" data-s=\"2\">Той може да бъде изграден и върху други виртуални машини.<\/span> <span class=\"sg\" data-s=\"3\">Но MoarVM е стандартният и добре поддържан избор.<\/span> <span class=\"sg\" data-s=\"4\">Този курс приема, че използвате нея.<\/span> <span class=\"sg\" data-s=\"5\">Това е основната разлика с <a href=\"https://course.raku.org/bg/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ е написан на C++ и няма нужда от собствена виртуална машина.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изходен код и връзки<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo е с отворен код и всеки може да следи разработката му:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo в GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"La kompililo Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> estas la referenca realigo de Raku: la ĉefa, norma kompililo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu kurso uzas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Hodiaŭ ĝi estas la plej kompleta maniero ruli Raku.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas ankaŭ bone provita en vera laboro.<\/span> <span class=\"sg\" data-s=\"4\">Do kiam oni diras «la kompililo de Raku», oni kutime celas Rakudo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo mem estas plejparte skribita en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Pli malgranda lingvo, NQP («Not Quite Perl»), helpas konstrui ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Via programo estas kompilita al bajtkodo kaj rulas sur virtuala maŝino nomata <strong>MoarVM<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ricevas MoarVM aŭtomate, kiam vi instalas Rakudo.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo provas kovri la tutan lingvon.<\/span> <span class=\"sg\" data-s=\"5\">Do ĝi estas la plej sekura elekto, se ĉiu parto de Raku devas funkcii.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo subtenas Raku 6.d.<\/span> <span class=\"sg\" data-s=\"1\">Novaj eldonoj aperas ofte, do korektoj kaj novaj funkcioj atingas vin rapide.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La virtuala maŝino<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, Rakudo rulas sur MoarVM, virtuala maŝino farita speciale por Raku.<\/span> <span class=\"sg\" data-s=\"1\">La dezajno ne ligas Rakudo al unu maŝino.<\/span> <span class=\"sg\" data-s=\"2\">Oni ankaŭ povas konstrui ĝin super aliaj virtualaj maŝinoj.<\/span> <span class=\"sg\" data-s=\"3\">Sed MoarVM estas la norma, bone subtenata elekto.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu kurso supozas, ke vi uzas ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Jen la ĉefa diferenco kompare kun <a href=\"https://course.raku.org/eo/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ estas skribita en C++ kaj ne bezonas propran virtualan maŝinon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fontkodo kaj ligiloj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo estas malfermitkoda, kaj ĉiu povas sekvi ĝian disvolvadon:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo en GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Compilator Rakudo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><strong>Rakudo<\/strong> est implementatio principalis linguae Raku: compilator praecipuus et vulgaris.<\/span> <span class=\"sg\" data-s=\"1\">Hic cursus eo utitur.<\/span> <span class=\"sg\" data-s=\"2\">Hodie est ratio plenissima ad Raku currendum.<\/span> <span class=\"sg\" data-s=\"3\">Etiam in vero labore bene probatum est.<\/span> <span class=\"sg\" data-s=\"4\">Itaque cum homines «compilatorem Raku» dicunt, plerumque Rakudo significant.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rakudo ipsum maxima ex parte in Raku scriptum est.<\/span> <span class=\"sg\" data-s=\"1\">Lingua minor, NQP («Not Quite Perl»), id aedificare adiuvat.<\/span> <span class=\"sg\" data-s=\"2\">Programma tuum in bytecode compilatur et in machina virtuali nomine <strong>MoarVM<\/strong> currit.<\/span> <span class=\"sg\" data-s=\"3\">MoarVM sponte accipis cum Rakudo installas.<\/span> <span class=\"sg\" data-s=\"4\">Rakudo totam linguam comprehendere conatur.<\/span> <span class=\"sg\" data-s=\"5\">Itaque electio tutissima est, si omnes partes Raku operari debent.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rakudo Raku 6.d sustinet.<\/span> <span class=\"sg\" data-s=\"1\">Novae emissiones saepe apparent, itaque correctiones et novae facultates celeriter ad te perveniunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Machina virtualis<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Ex more Rakudo in MoarVM currit, machina virtuali proprie pro Raku facta.<\/span> <span class=\"sg\" data-s=\"1\">Consilium Rakudo ad unam machinam non alligat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam super alias machinas virtuales aedificari potest.<\/span> <span class=\"sg\" data-s=\"3\">Sed MoarVM est electio vulgaris et bene sustentata.<\/span> <span class=\"sg\" data-s=\"4\">Hic cursus putat te ea uti.<\/span> <span class=\"sg\" data-s=\"5\">Haec est praecipua differentia a <a href=\"https://course.raku.org/la/essentials/the-rakupp-compiler/\" target=\"_blank\" rel=\"noopener\">Raku++<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Raku++ in C++ scriptum est et nullam machinam virtualem propriam requirit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex fons et nexus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rakudo fontis aperti est, et quisque progressum eius sequi potest:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://rakudo.org\" target=\"_blank\" rel=\"noopener\">rakudo.org<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/rakudo/rakudo\" target=\"_blank\" rel=\"noopener\">Rakudo in GitHub<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://moarvm.org\" target=\"_blank\" rel=\"noopener\">moarvm.org<\/a><\/span><\/li><\/ul>"]]}}}</script>
