an> <span class=\"sg\" data-s=\"3\">Сюди входить стан змінних і вивід вашої програми.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб запустити оболонку Rakudo, просто введіть:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вивід може залежати від версії компілятора, яка у вас встановлена.<\/span> <span class=\"sg\" data-s=\"1\">Тут оболонка рекомендує встановити деякі модулі, щоб нею було зручніше користуватися.<\/span> <span class=\"sg\" data-s=\"2\">Тому ви бачите це повідомлення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У кінці є символ запиту, <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тут можна вводити свою програму або її частини.<\/span> <span class=\"sg\" data-s=\"2\">Оболонка компілює її рядок за рядком, щойно ви натискаєте Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"bg":{"t":"Изпълнение от REPL","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">REPL означава <em>Read–eval–print loop<\/em> (Чети-изпълнявай-печатай цикъл).<\/span> <span class=\"sg\" data-s=\"1\">Това е вграден режим на обвивката.<\/span> <span class=\"sg\" data-s=\"2\">Вие въвеждате инструкции, а екранът показва резултата от всяка стъпка.<\/span> <span class=\"sg\" data-s=\"3\">Това включва състоянието на променливите и изхода на вашата програма.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да стартирате Rakudo обвивката, просто въведете:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изходът може да зависи от версията на компилатора, която имате.<\/span> <span class=\"sg\" data-s=\"1\">Тук обвивката препоръчва да инсталирате някои модули за по-удобна работа.<\/span> <span class=\"sg\" data-s=\"2\">Затова виждате това съобщение.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Накрая има символ за подканяне, <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тук можете да въведете вашата програма или части от нея.<\/span> <span class=\"sg\" data-s=\"2\">Обвивката я компилира ред по ред веднага щом натиснете Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"eo":{"t":"Lanĉado de REPL","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">REPL signifas <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas enkonstruita ŝelreĝimo.<\/span> <span class=\"sg\" data-s=\"2\">Vi tajpas instrukciojn, kaj la ekrano montras la rezulton de ĉiu paŝo.<\/span> <span class=\"sg\" data-s=\"3\">Tio inkluzivas la staton de la variabloj kaj la eligon de via programo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por starti Rakudo-ŝelon, simple tajpu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La eligo povas dependi de la versio de la kompililo, kiun vi havas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, la ŝelo rekomendas instali kelkajn modulojn por pli bona uzanta sperto.<\/span> <span class=\"sg\" data-s=\"2\">Tial vi vidas ĉi tiun mesaĝon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fine, estas prompta signo, <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie vi povas tajpi vian programon aŭ partojn de ĝi.<\/span> <span class=\"sg\" data-s=\"2\">La ŝelo kompilas ĝin linion post linio, tuj kiam vi premas Enter.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; say 'Hello, World';     Hello, World     &gt;<\/span><\/p>"]]},"la":{"t":"Currendo ex REPL","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">REPL significat <em>Read–eval–print loop<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Est modus testudinis in-aedificatus.<\/span> <span class=\"sg\" data-s=\"2\">Instructiones scribis, et scrinium eventum cuiusque gradus ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc statum variabilium et output programmatis tui includit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ad initium Rakudo testudinis, simpliciter scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku\nWelcome to 𝐑𝐚𝐤𝐮𝐝𝐨™ v2020.10.\nImplementing the 𝐑𝐚𝐤𝐮™ programming language v6.d.\nBuilt on MoarVM version 2020.10.\n\nYou may want to `zef install Readline` or `zef install Linenoise` or use rlwrap for a line editor\n\nTo exit type 'exit' or '^D'\n&gt; <\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Output ex versione compilatoris quam habes pendere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hic testudo installationem aliquorum modulorum commendat, pro meliore usu.<\/span> <span class=\"sg\" data-s=\"2\">Ideo hunc nuntium vides.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In fine est character promptus, <code>&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hic programma tuum vel partes eius scribere potes.<\/span> <span class=\"sg\" data-s=\"2\">Testudo id lineam per lineam compilat, simul ac Enter premis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">&gt; dic 'Salve, Munde';
