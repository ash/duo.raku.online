<span class=\"sg\" data-s=\"5\">Ein anderer Weg ist ein Online-Dienst wie <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Sie können auch einen Docker-Container verwenden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt hat fünf Themen.<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich alle an, oder lesen Sie nur die, die Sie brauchen.<\/span> <span class=\"sg\" data-s=\"2\">Nach den Themen gibt es eine Aufgabe.<\/span><\/p>"]]},"nl":{"t":"Programma's uitvoeren","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">een van de vorige secties<\/a> hebben we een eenvoudig programma gemaakt.<\/span> <span class=\"sg\" data-s=\"1\">Maar we hebben het nog niet uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\">Er zijn veel manieren om een programma uit te voeren.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt een geïnstalleerd opdrachtregelprogramma of een REPL-shell gebruiken.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt het ook direct vanuit een <a href=\"/essentials/editors-and-ides/\">IDE<\/a> uitvoeren.<\/span> <span class=\"sg\" data-s=\"5\">Een andere manier is een online dienst, zoals <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt ook een docker-container gebruiken.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze sectie heeft vijf onderwerpen.<\/span> <span class=\"sg\" data-s=\"1\">Blader door alle onderwerpen, of bestudeer alleen de onderwerpen die je nodig hebt.<\/span> <span class=\"sg\" data-s=\"2\">Na de onderwerpen is er een opdracht.<\/span><\/p>"]]},"es":{"t":"Ejecución de programas","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">una de las secciones anteriores<\/a>, creamos un programa simple.<\/span> <span class=\"sg\" data-s=\"1\">Pero todavía no lo ejecutamos.<\/span> <span class=\"sg\" data-s=\"2\">Hay muchas formas de ejecutar un programa.<\/span> <span class=\"sg\" data-s=\"3\">Puedes usar una herramienta de línea de comandos instalada o un shell REPL.<\/span> <span class=\"sg\" data-s=\"4\">También puedes ejecutarlo directamente desde un <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Otra forma es un servicio en línea, como <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">También puedes usar un contenedor de Docker.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta sección tiene cinco temas.<\/span> <span class=\"sg\" data-s=\"1\">Revísalos todos, o estudia solo los que necesites.<\/span> <span class=\"sg\" data-s=\"2\">Después de los temas, hay una tarea.<\/span><\/p>"]]},"it":{"t":"Esecuzione dei programmi","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una delle sezioni precedenti<\/a> abbiamo creato un semplice programma.<\/span> <span class=\"sg\" data-s=\"1\">Ma non l'abbiamo ancora eseguito.<\/span> <span class=\"sg\" data-s=\"2\">Ci sono molti modi per eseguire un programma.<\/span> <span class=\"sg\" data-s=\"3\">Puoi usare uno strumento da riga di comando installato o una shell REPL.<\/span> <span class=\"sg\" data-s=\"4\">Puoi anche eseguirlo direttamente da un <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Un altro modo è un servizio online, come <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Puoi anche usare un container docker.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa sezione ha cinque argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Guardali tutti, oppure studia solo quelli che ti servono.<\/span> <span class=\"sg\" data-s=\"2\">Dopo gli argomenti, c'è un compito.<\/span><\/p>"]]},"lv":{"t":"Programmu palaišana","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\"><a href=\"/essentials/hello-world/\">Vienā no iepriekšējām sadaļām<\/a> mēs izveidojām vienkāršu programmu.<\/span> <span class=\"sg\" data-s=\"1\">Bet mēs to vēl nepalaidām.<\/span> <span class=\"sg\" data-s=\"2\">Ir daudz veidu, kā palaist programmu.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat izmantot instalētu komandrindas rīku vai REPL čaulu.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat to arī palaist tieši no <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Vēl viens veids ir tiešsaistes pakalpojums, piemēram, <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Jūs varat arī izmantot docker konteineru.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā ir pieci temati.<\/span> <span class=\"sg\" data-s=\"1\">Pārlūkojiet tos visus vai izpētiet tikai tos, kas jums vajadzīgi.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tematiem ir uzdevums.<\/span><\/p>"]]},"ru":{"t":"Запуск программ","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одной из предыдущих глав<\/a> мы создали простую программу.<\/span> <span class=\"sg\" data-s=\"1\">Но мы её ещё не запускали.<\/span> <span class=\"sg\" data-s=\"2\">Есть много способов запустить программу.<\/span> <span class=\"sg\" data-s=\"3\">Можно использовать установленный инструмент командной строки или оболочку REPL.<\/span> <span class=\"sg\" data-s=\"4\">Ещё её можно запустить прямо из <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Другой способ — онлайн-сервис, например <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Также можно использовать docker-контейнер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этой теме пять глав.<\/span> <span class=\"sg\" data-s=\"1\">Просмотрите их все или изучите только те, которые вам нужны.<\/span> <span class=\"sg\" data-s=\"2\">После глав идёт упражнение.<\/span><\/p>"]]},"uk":{"t":"Запуск програм","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">одному з попередніх розділів<\/a> ми створили просту програму.<\/span> <span class=\"sg\" data-s=\"1\">Але ми ще не запускали її.<\/span> <span class=\"sg\" data-s=\"2\">Існує багато способів запустити програму.<\/span> <span class=\"sg\" data-s=\"3\">Можна використати встановлений інструмент командного рядка або оболонку REPL.<\/span> <span class=\"sg\" data-s=\"4\">Також її можна запустити прямо з <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Інший спосіб — онлайн-сервіс, такий як <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Ще можна використати docker-контейнер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі п'ять тем.<\/span> <span class=\"sg\" data-s=\"1\">Перегляньте всі або вивчіть лише ті, які вам потрібні.<\/span> <span class=\"sg\" data-s=\"2\">Після тем є завдання.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на програми","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"/essentials/hello-world/\">една от предишните секции<\/a> създадохме проста програма.<\/span> <span class=\"sg\" data-s=\"1\">Но още не я стартирахме.<\/span> <span class=\"sg\" data-s=\"2\">Има много начини да стартирате програма.<\/span> <span class=\"sg\" data-s=\"3\">Можете да използвате инсталиран команден инструмент или REPL shell.<\/span> <span class=\"sg\" data-s=\"4\">Можете и да я стартирате директно от <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Друг начин е онлайн услуга, например <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Можете също да използвате docker контейнер.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тази секция има пет теми.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте всички или само тези, които ви трябват.<\/span> <span class=\"sg\" data-s=\"2\">След темите има задача.<\/span><\/p>"]]},"eo":{"t":"Lanĉado de programoj","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">En <a href=\"/essentials/hello-world/\">unu el la antaŭaj sekcioj<\/a>, ni kreis simplan programon.<\/span> <span class=\"sg\" data-s=\"1\">Sed ni ankoraŭ ne rulis ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Estas multaj manieroj ruli programon.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas uzi instalitan komandlinian ilon aŭ REPL-ŝelon.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas ruli ĝin rekte el <a href=\"/essentials/editors-and-ides/\">IDE<\/a>.<\/span> <span class=\"sg\" data-s=\"5\">Alia maniero estas reta servo, kiel <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Vi ankaŭ povas uzi docker-ujon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio havas kvin temojn.<\/span> <span class=\"sg\" data-s=\"1\">Trarigardu ĉiujn, aŭ studu nur tiujn, kiujn vi bezonas.<\/span> <span class=\"sg\" data-s=\"2\">Post la temoj, estas tasko.<\/span><\/p>"]]},"la":{"t":"Currendo programmata","b":[["p",7,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"/essentials/hello-world/\">una ex sectionibus praecedentibus<\/a> programma simplex creavimus.<\/span> <span class=\"sg\" data-s=\"1\">Sed id nondum cucurrimus.<\/span> <span class=\"sg\" data-s=\"2\">Multae viae sunt ad programma currendum.<\/span> <span class=\"sg\" data-s=\"3\">Instrumentum lineae mandati installatum aut REPL concham adhibere potes.<\/span> <span class=\"sg\" data-s=\"4\">Id etiam directe ex <a href=\"/essentials/editors-and-ides/\">IDE<\/a> currere potes.<\/span> <span class=\"sg\" data-s=\"5\">Alia via est servitium online, ut <a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a>.<\/span> <span class=\"sg\" data-s=\"6\">Etiam continens docker adhibere potes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec sectio quinque argumenta habet.<\/span> <span class=\"sg\" data-s=\"1\">Omnia perlustra, aut ea sola examina quae requiris.<\/span> <span class=\"sg\" data-s=\"2\">Post argumenta est assignatio.<\/span><\/p>"]]}}}</script>
