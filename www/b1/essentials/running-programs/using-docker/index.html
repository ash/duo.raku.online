е shell.<\/span> <span class=\"sg\" data-s=\"1\">Ако е необходимо, тя ще изтегли последното изображение <code>rakudo-star<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nЗа да изпълните програма, използвайте следната команда:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да почистите контейнера, когато той излезе, добавете флага <code>--rm<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава се премахва и файловата му система.<\/span> <span class=\"sg\" data-s=\"2\">Можете да намерите повече инструкции на страницата на проекта.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Външни връзки<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker изображение<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker проект в GitHub<\/a><\/span><\/li><\/ul>"]]},"eo":{"t":"Uzado de docker","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ekzistas docker-bildo de Rakudo, nomata <code>rakudo-star<\/code> pro historiaj kialoj.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin por funkciigi REPL-ŝelon.<\/span> <span class=\"sg\" data-s=\"2\">Per ĝi vi ankaŭ povas plenumi programon el dosiero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la jenan komandon por starti la ŝelon.<\/span> <span class=\"sg\" data-s=\"1\">Se necese, ĝi elŝutos la plej lastan bildon de <code>rakudo-star<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nPor funkciigi programon, uzu la jenan komandon:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por purigi la ujon, kiam ĝi finiĝas, aldonu la flagon <code>--rm<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ankaŭ ĝia dosiersistemo estas forigita.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas trovi pli da instrukcioj sur la projekta paĝo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eksteraj ligiloj<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://hub.docker.com/_/rakudo-star/\" target=\"_blank\" rel=\"noopener\">Docker-bildo<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://github.com/Raku/docker\" target=\"_blank\" rel=\"noopener\">Raku docker-projekto en GitHub<\/a><\/span><\/li><\/ul>"]]},"la":{"t":"Utendo docker","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Est imago docker Rakudo, nomine <code>rakudo-star<\/code> propter causas historicas.<\/span> <span class=\"sg\" data-s=\"1\">Ea uti potes ad REPL concham currendam.<\/span> <span class=\"sg\" data-s=\"2\">Etiam programma ex archivo cum ea exsequi potes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Curre praeceptum sequens ad concham incipiendam.<\/span> <span class=\"sg\" data-s=\"1\">Si opus est, novissimam imaginem <code>rakudo-star<\/code> deprimet.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -it rakudo-star\nAd currendum programma, utere sequenti praecepto:<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ docker run -v \"$(pwd):/script\" rakudo-star raku /script/hello.raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut continens purges cum exit, vexillum <code>--rm<\/code> adde.<\/span> <span class=\"sg\" data-s=\"1\">Tum etiam systema fasciculorum eius removetur.<\/span> <span class=\"sg\" data-s=\"2\">Plura mandata in pagina propositi invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nexus externi<\/span><\/h3>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0
