 programon kaj kion ĝi presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello-me.raku\nSaluton, Andreo!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Provu mem solvi ĉi tiun taskon.<\/span> <span class=\"sg\" data-s=\"1\">Konservu la kodon en dosiero.<\/span> <span class=\"sg\" data-s=\"2\">Poste transdonu ĝin al la komandlinia interpretilo.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ rulu ĝin en alia maniero, kiun ni rigardis pli frue.<\/span> <span class=\"sg\" data-s=\"4\">Ĉu vi volas vidi la ekzemplon?<\/span> <span class=\"sg\" data-s=\"5\">Aŭ ĉu via programo ne funkcias pro iu kialo?<\/span> <span class=\"sg\" data-s=\"6\">Tiam vi estas bonvena malfermi la funkciantan solvon sube.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/running-programs/exercises/hello-me/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Salve, me!","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scribe et exsequere programma quod salutationem cum nomine tuo imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Serva id in fasciculo et exsequere ex linea mandati.<\/span> <span class=\"sg\" data-s=\"2\">Si mavis, <a href=\"https://course.raku.org/la/essentials/running-programs/\" target=\"_blank\" rel=\"noopener\">programma exsequere<\/a> online vel directe ex IDE.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc exemplum ostendit quomodo programma exsequaris et quid imprimat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello-me.raku\nSalve, Andreas!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Conare hoc opus ipse solvere.<\/span> <span class=\"sg\" data-s=\"1\">Serva codicem in fasciculo.<\/span> <span class=\"sg\" data-s=\"2\">Deinde eum interpreti lineae mandati trade.<\/span> <span class=\"sg\" data-s=\"3\">Aut eum alio modo exsequere, quem antea tractavimus.<\/span> <span class=\"sg\" data-s=\"4\">Visne exemplum videre?<\/span> <span class=\"sg\" data-s=\"5\">An programma tuum aliqua de causa non operatur?<\/span> <span class=\"sg\" data-s=\"6\">Tum tibi licet solutionem operantem infra aperire.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/running-programs/exercises/hello-me/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
