<script type="application/json" id="page-data">{"u":"essentials/running-programs/using-online-services","n":19,"k":"topic","pv":"essentials/running-programs/using-docker","nx":"essentials/running-programs/exercises","tr":["essentials","essentials/running-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using online services to run Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Online services do not need much explanation.<\/span> <span class=\"sg\" data-s=\"1\">Paste the program text into an online editor and press the <code>Run<\/code> button.<\/span> <span class=\"sg\" data-s=\"2\">You will see the output of the program in a separate area.<\/span> <span class=\"sg\" data-s=\"3\">If there are any errors, you will see them too.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">These services often have a separate text area.<\/span> <span class=\"sg\" data-s=\"1\">From there, they can send data to your program’s input stream, STDIN.<\/span> <span class=\"sg\" data-s=\"2\">Sometimes, the output is also split into <code>STDOUT<\/code> and <code>STDERR<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The built-in Raku Playground<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This course comes with its own &lt;a href=\"https://raku.online/play\" target=\"_blank\" rel=\"noopener noreferrer\"&gt;&lt;strong&gt;Raku Playground&lt;/strong&gt;&lt;/a&gt;.<\/span> <span class=\"sg\" data-s=\"1\">It runs Raku right in your browser.<\/span> <span class=\"sg\" data-s=\"2\">You do not need to install anything or sign up.<\/span> <span class=\"sg\" data-s=\"3\">Type a program, press run, and see the output straight away.<\/span> <span class=\"sg\" data-s=\"4\">It is the quickest way to try the course’s examples while you read.<\/span> <span class=\"sg\" data-s=\"5\">You can also use it for your own experiments.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Keep in mind that the playground has some natural limits.<\/span> <span class=\"sg\" data-s=\"1\">It runs a young compiler that is still in development.<\/span> <span class=\"sg\" data-s=\"2\">Everything happens inside your browser, with no server behind it.<\/span> <span class=\"sg\" data-s=\"3\">Because of that, a few language features may not work yet.<\/span> <span class=\"sg\" data-s=\"4\">Also, anything that reaches the outside world will not work there.<\/span> <span class=\"sg\" data-s=\"5\">This includes reading or writing files, network access, running other programs and installing modules.<\/span> <span class=\"sg\" data-s=\"6\">For those, use a locally installed compiler or one of the services below.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">External links<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a list of some other services that support Raku:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"https://glot.io/new/raku\" target=\"_blank\" rel=\"noopener\">glot.io<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"https://tio.run/#perl6\" target=\"_blank\" rel=\"noopener\">TIO<\/a><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"https://repl.it/new/raku\" target=\"_blank\" rel=\"noopener\">Repl.it<\/a> (you must log in first)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><a href=\"https://fco.github.io/Raku-Playground/\" target=\"_blank\" rel=\"noopener\">Raku Playground<\/a> (runs your code on a server)<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For more links and comments about different online services, see <a href=\"https://www.reddit.com/r/rakulang/comments/kj63dq/glotio_now_supports_raku/ggxow6n/\" target=\"_blank\" rel=\"noopener\">the discussion on Reddit<\/a>.<\/span><\/p>"]]}}}</script>
