ie Idee des <em>Scopes<\/em> an.<\/span><\/p>"]]},"nl":{"t":"Code blokken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Codeblokken zijn delen van je programma tussen een paar accolades: <code>{<\/code> en <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Een blok zet meerdere instructies bij elkaar, die samenwerken als één grote instructie.<\/span> <span class=\"sg\" data-s=\"2\">In de volgende secties zien we veel manieren om blokken te gebruiken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hallo, Wereld!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het codeblok in dit programma heeft niet echt zin.<\/span> <span class=\"sg\" data-s=\"1\">Maar codeblokken zijn heel nuttig in andere situaties, die we heel binnenkort zullen zien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maar laten we eerst kijken naar het idee van <em>scope<\/em>.<\/span><\/p>"]]},"es":{"t":"Bloques de código","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los bloques de código son partes de tu programa dentro de un par de llaves: <code>{<\/code> y <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque agrupa varias declaraciones, que funcionan juntas como una gran declaración.<\/span> <span class=\"sg\" data-s=\"2\">Veremos muchas formas de usar bloques en las siguientes secciones.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say '¡Hola, Mundo!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El bloque de código en este programa no tiene mucho sentido.<\/span> <span class=\"sg\" data-s=\"1\">Pero los bloques de código son muy útiles en otras situaciones, que veremos muy pronto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pero primero, veamos la idea de <em>alcance<\/em>.<\/span><\/p>"]]},"it":{"t":"Blocchi di codice","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I blocchi di codice sono parti del tuo programma dentro una coppia di parentesi graffe: <code>{<\/code> e <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco raggruppa diverse istruzioni, che lavorano insieme come una grande istruzione.<\/span> <span class=\"sg\" data-s=\"2\">Nelle prossime sezioni vedremo molti modi di usare i blocchi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il blocco di codice in questo programma non ha molto senso.<\/span> <span class=\"sg\" data-s=\"1\">Ma i blocchi di codice sono molto utili in altre situazioni, che vedremo molto presto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ma prima, vediamo l'idea di <em>ambito<\/em>.<\/span><\/p>"]]},"lv":{"t":"Koda bloki","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Koda bloki ir jūsu programmas daļas cirtainajās iekavās: <code>{<\/code> un <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bloks apvieno vairākus paziņojumus, kas darbojas kopā kā viens liels paziņojums.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajās sadaļās mēs redzēsim daudzus veidus, kā izmantot blokus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Koda blokam šajā programmā nav īstas jēgas.<\/span> <span class=\"sg\" data-s=\"1\">Bet koda bloki ir ļoti noderīgi citās situācijās, kuras mēs redzēsim pavisam drīz.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bet vispirms apskatīsim <em>apjoma<\/em> ideju.<\/span><\/p>"]]},"ru":{"t":"Блоки кода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блоки кода — это части вашей программы внутри пары фигурных скобок: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Блок объединяет несколько инструкций, которые работают вместе как одна большая инструкция.<\/span> <span class=\"sg\" data-s=\"2\">В следующих главах мы увидим много способов использовать блоки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок кода в этой программе не имеет большого смысла.<\/span> <span class=\"sg\" data-s=\"1\">Но блоки кода очень полезны в других ситуациях, которые мы увидим очень скоро.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но сначала давайте посмотрим, что такое <em>область видимости<\/em>.<\/span><\/p>"]]},"uk":{"t":"Блоки коду","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Блоки коду — це частини вашої програми в парі фігурних дужок: <code>{<\/code> і <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Блок об'єднує кілька операторів, які працюють разом як один великий оператор.<\/span> <span class=\"sg\" data-s=\"2\">У наступних розділах ми побачимо багато способів використати блоки.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цій програмі блок коду не має великого сенсу.<\/span> <span class=\"sg\" data-s=\"1\">Але блоки коду дуже корисні в інших ситуаціях, які ми дуже скоро побачимо.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Але спочатку давайте розглянемо ідею <em>області видимості<\/em>.<\/span><\/p>"]]},"bg":{"t":"Кодови блокове","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кодовите блокове са части от вашата програма, които стоят в чифт къдрави скоби: <code>{<\/code> и <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Блокът групира няколко израза, които работят заедно като един голям израз.<\/span> <span class=\"sg\" data-s=\"2\">В следващите раздели ще видим много начини да използваме блоковете.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кодовият блок в тази програма всъщност няма голям смисъл.<\/span> <span class=\"sg\" data-s=\"1\">Но кодовите блокове са много полезни в други ситуации, които ще видим много скоро.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но първо, нека разгледаме идеята за <em>обхват<\/em>.<\/span><\/p>"]]},"eo":{"t":"Kodoblokoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kodoblokoj estas partoj de via programo ene de paro de kurbaj krampoj: <code>{<\/code> kaj <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bloko grupigas plurajn deklarojn, kiuj laboras kune kiel unu granda deklaro.<\/span> <span class=\"sg\" data-s=\"2\">Ni vidos multajn manierojn uzi blokojn en la sekvaj sekcioj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La kodobloko en ĉi tiu programo ne vere havas sencon.<\/span> <span class=\"sg\" data-s=\"1\">Sed kodoblokoj estas tre utilaj en aliaj situacioj, kiujn ni vidos tre baldaŭ.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed unue, ni rigardu la ideon de <em>amplekso<\/em>.<\/span><\/p>"]]},"la":{"t":"Codicis sectiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Claustra codicis sunt partes programmatis tui intra par uncinorum curvorum: <code>{<\/code> et <code>}<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Claustrum plures enuntiationes coniungit, quae simul operantur quasi una magna enuntiatio.<\/span> <span class=\"sg\" data-s=\"2\">In sectionibus sequentibus multos usus claustrorum videbimus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    say 'Salve, Munde!';\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Claustrum codicis in hoc programmate non vere sensum habet.<\/span> <span class=\"sg\" data-s=\"1\">Sed claustra codicis in aliis casibus valde utilia sunt, quos mox videbimus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed primum notionem <em>ambitus<\/em> spectemus.<\/span><\/p>"]]}}}</script>
