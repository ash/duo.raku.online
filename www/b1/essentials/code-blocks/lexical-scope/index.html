\"3\">Ось приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$x<\/code> створюється в блоці коду.<\/span> <span class=\"sg\" data-s=\"1\">Перший <code>say $x<\/code> виводить її значення, тому що змінна видима всередині блоку.<\/span> <span class=\"sg\" data-s=\"2\">Другий <code>say $x<\/code> не спрацьовує, тому що імені <code>$x<\/code> поза блоком не існує.<\/span> <span class=\"sg\" data-s=\"3\">Коли блок закінчився, це ім'я вже невідоме.<\/span> <span class=\"sg\" data-s=\"4\">Програма не компілюється, і ви отримуєте помилку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variable '$x' is not declared     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]},"bg":{"t":"Лексикален обхват","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блокът от код създава така наречения лексикален обхват.<\/span> <span class=\"sg\" data-s=\"1\">Ако декларирате променлива в блок, тя е видима вътре в блока.<\/span> <span class=\"sg\" data-s=\"2\">Но тя не е видима, след като програмата излезе от блока.<\/span> <span class=\"sg\" data-s=\"3\">Ето един пример:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$x<\/code> се създава в блока от код.<\/span> <span class=\"sg\" data-s=\"1\">Първото <code>say $x<\/code> отпечатва нейната стойност, защото променливата е видима вътре в блока.<\/span> <span class=\"sg\" data-s=\"2\">Второто <code>say $x<\/code> не успява, защото името <code>$x<\/code> не съществува извън блока.<\/span> <span class=\"sg\" data-s=\"3\">След края на блока името не е известно.<\/span> <span class=\"sg\" data-s=\"4\">Програмата не се компилира и получавате грешка:<\/span><\/p>"],["p",1,"<p><span clas  say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$x<\/code> in clausula codicis creatur.<\/span> <span class=\"sg\" data-s=\"1\">Prima vocatio <code>say $x<\/code> valorem eius imprimit, quia variabilis intra clausulam visibilis est.<\/span> <span class=\"sg\" data-s=\"2\">Secunda vocatio <code>say $x<\/code> deficit, quia nomen <code>$x<\/code> extra clausulam non exstat.<\/span> <span class=\"sg\" data-s=\"3\">Postquam clausula finita est, nomen non cognoscitur.<\/span> <span class=\"sg\" data-s=\"4\">Programma non compilatur, et errorem accipis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">===SORRY!=== Error while compiling /Users/ash/raku-course/t.raku     Variabilis '$x' non declarata est     at /Users/ash/raku-course/t.raku:6     ------&gt; say ⏏$x;<\/span><\/p>"]]}}}</script>
