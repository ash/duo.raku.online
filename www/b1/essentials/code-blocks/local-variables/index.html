 lokale Variable.<\/span> <span class=\"sg\" data-s=\"4\">Das Programm gibt zwei verschiedene Werte aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"nl":{"t":"Lokale variabelen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Laten we een variabele in de globale scope declareren.<\/span> <span class=\"sg\" data-s=\"1\">Wat gebeurt er als we hem ook lokaal in het blok declareren?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nu zijn er twee aparte variabelen in het programma.<\/span> <span class=\"sg\" data-s=\"1\">Ze heten allebei <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In de globale scope betekent <code>$x<\/code> altijd de globale variabele.<\/span> <span class=\"sg\" data-s=\"3\">Maar binnen het blok is <code>$x<\/code> een andere, lokale variabele.<\/span> <span class=\"sg\" data-s=\"4\">Het programma print twee verschillende waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"es":{"t":"Variables locales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vamos a declarar una variable en el ámbito global.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué pasa si también la declaramos localmente en el bloque?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ahora hay dos variables separadas en el programa.<\/span> <span class=\"sg\" data-s=\"1\">Las dos se llaman <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En el ámbito global, <code>$x<\/code> siempre se refiere a la variable global.<\/span> <span class=\"sg\" data-s=\"3\">Pero dentro del bloque, <code>$x<\/code> es una variable diferente y local.<\/span> <span class=\"sg\" data-s=\"4\">El programa imprime dos valores diferentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"it":{"t":"Variabili locali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dichiariamo una variabile nello scope globale.<\/span> <span class=\"sg\" data-s=\"1\">Che cosa succede se la dichiariamo anche localmente nel blocco?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ora nel programma ci sono due variabili separate.<\/span> <span class=\"sg\" data-s=\"1\">Tutte e due si chiamano <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Nello scope globale, <code>$x<\/code> indica sempre la variabile globale.<\/span> <span class=\"sg\" data-s=\"3\">Ma dentro il blocco, <code>$x<\/code> è una variabile diversa, locale.<\/span> <span class=\"sg\" data-s=\"4\">Il programma stampa due valori diversi:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"lv":{"t":"Vietējie mainīgie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Deklarēsim mainīgo globālajā apjomā.<\/span> <span class=\"sg\" data-s=\"1\">Kas notiek, ja mēs to deklarējam arī lokāli blokā?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1;\n\n{\n    my $x = 42;\n    say $x;\n}\n\nsay $x;<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tagad programmā ir divi atsevišķi mainīgie.<\/span> <span class=\"sg\" data-s=\"1\">Abus sauc par <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Globālajā apjomā <code>$x<\/code> vienmēr nozīmē globālo mainīgo.<\/span> <span class=\"sg\" data-s=\"3\">Bet bloka iekšpusē <code>$x<\/code> ir cits, lokāls mainīgais.<\/span> <span class=\"sg\" data-s=\"4\">Programma izdrukā divas dažādas vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n42\n1<\/code><\/pre>"]]},"ru":{"t":"Локальные переменные","b":[["p",2,"<p><span class
