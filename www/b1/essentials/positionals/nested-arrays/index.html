<script type="application/json" id="page-data">{"u":"essentials/positionals/nested-arrays","n":213,"k":"topic","pv":"essentials/positionals/arrays/quiz","nx":"essentials/positionals/nested-arrays/quiz","tr":["essentials","essentials/positionals"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Nested arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays can contain any other data, and this includes other arrays.<\/span> <span class=\"sg\" data-s=\"1\">To mark where each nested array begins and ends, use square brackets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also put one more pair of brackets around the top-level array.<\/span> <span class=\"sg\" data-s=\"1\">This example shows the same data structure as the one before.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To get the inner items, add as many indices as you need.<\/span> <span class=\"sg\" data-s=\"1\">Each pair of square brackets takes you one level deeper into the structure:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Prints 4\nsay @table[2][1]; # Prints 200 <\/code><\/pre>"]]},"de":{"t":"Verschachtelte Arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays können beliebige andere Daten enthalten, auch andere Arrays.<\/span> <span class=\"sg\" data-s=\"1\">Um zu zeigen, wo jedes verschachtelte Array beginnt und endet, verwenden Sie eckige Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können auch ein weiteres Paar Klammern um das oberste Array setzen.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Beispiel zeigt dieselbe Datenstruktur wie das vorherige.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Um die inneren Elemente zu bekommen, fügen Sie so viele Indizes hinzu, wie Sie brauchen.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Paar eckiger Klammern bringt Sie eine Ebene tiefer in die Struktur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Gibt 4 aus\nsay @table[2][1]; # Gibt 200 aus<\/code><\/pre>"]]},"nl":{"t":"Geneste arrays","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrays kunnen elke andere data bevatten, ook andere arrays.<\/span> <span class=\"sg\" data-s=\"1\">Om aan te geven waar elke geneste array begint en eindigt, gebruik je vierkante haken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook nog een paar haken rond de array op het hoogste niveau zetten.<\/span> <span class=\"sg\" data-s=\"1\">Dit voorbeeld toont dezelfde datastructuur als het vorige.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Om de items binnenin te krijgen, voeg je zoveel indices toe als je nodig hebt.<\/span> <span class=\"sg\" data-s=\"1\">Elk paar vierkante haken brengt je een niveau dieper in de structuur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Print 4\nsay @table[2][1]; # Print 200 <\/code><\/pre>"]]},"es":{"t":"Arrays anidados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los arreglos pueden contener cualquier otro dato, y esto incluye otros arreglos.<\/span> <span class=\"sg\" data-s=\"1\">Para marcar dónde empieza y termina cada arreglo anidado, usa corchetes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes poner un par más de corchetes alrededor del arreglo de nivel superior.<\/span> <span class=\"sg\" data-s=\"1\">Este ejemplo muestra la misma estructura de datos que el anterior.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para obtener los elementos internos, añade tantos índices como necesites.<\/span> <span class=\"sg\" data-s=\"1\">Cada par de corchetes te lleva un nivel más abajo en la estructura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprime 4\nsay @table[2][1]; # Imprime 200 <\/code><\/pre>"]]},"it":{"t":"Array annidati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli array possono contenere qualsiasi altro dato, e anche altri array.<\/span> <span class=\"sg\" data-s=\"1\">Per segnare dove ogni array annidato inizia e finisce, usa le parentesi quadre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche mettere un'altra coppia di parentesi quadre intorno all'array di livello superiore.<\/span> <span class=\"sg\" data-s=\"1\">Questo esempio mostra la stessa struttura dati di quello prima.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per ottenere gli elementi interni, aggiungi tutti gli indici che ti servono.<\/span> <span class=\"sg\" data-s=\"1\">Ogni coppia di parentesi quadre ti porta un livello più in profondità nella struttura:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Stampa 4\nsay @table[2][1]; # Stampa 200 <\/code><\/pre>"]]},"lv":{"t":"Ligzdoti masīvi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīvi var saturēt jebkurus citus datus, arī citus masīvus.<\/span> <span class=\"sg\" data-s=\"1\">Lai atzīmētu, kur katrs ligzdotais masīvs sākas un beidzas, izmantojiet kvadrātiekavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī likt vēl vienu iekavu pāri ap augstākā līmeņa masīvu.<\/span> <span class=\"sg\" data-s=\"1\">Šis piemērs parāda to pašu datu struktūru kā iepriekšējais.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu iekšējos elementus, pievienojiet tik daudz indeksu, cik jums vajag.<\/span> <span class=\"sg\" data-s=\"1\">Katrs kvadrātiekavu pāris jūs aizved vienu līmeni dziļāk struktūrā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Izdrukā 4\nsay @table[2][1]; # Izdrukā 200 <\/code><\/pre>"]]},"ru":{"t":"Вложенные массивы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Массивы могут содержать любые другие данные, в том числе другие массивы.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы отметить, где начинается и заканчивается каждый вложенный массив, используйте квадратные скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно также поставить ещё одну пару скобок вокруг массива верхнего уровня.<\/span> <span class=\"sg\" data-s=\"1\">Этот пример показывает ту же структуру данных, что и предыдущий.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить внутренние элементы, добавьте столько индексов, сколько нужно.<\/span> <span class=\"sg\" data-s=\"1\">Каждая пара квадратных скобок ведёт вас на один уровень глубже в структуру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Выводит 4\nsay @table[2][1]; # Выводит 200 <\/code><\/pre>"]]},"uk":{"t":"Вкладені масиви","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Масиви можуть містити будь-які інші дані, і серед них можуть бути інші масиви.<\/span> <span class=\"sg\" data-s=\"1\">Щоб позначити, де починається і закінчується кожен вкладений масив, використовуйте квадратні дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви також можете поставити ще одну пару дужок навколо масиву верхнього рівня.<\/span> <span class=\"sg\" data-s=\"1\">Цей приклад показує ту саму структуру даних, що й попередній.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати внутрішні елементи, додайте стільки індексів, скільки потрібно.<\/span> <span class=\"sg\" data-s=\"1\">Кожна пара квадратних дужок веде вас на один рівень глибше в структуру:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Виведе 4\nsay @table[2][1]; # Виведе 200 <\/code><\/pre>"]]},"bg":{"t":"Вложени масиви","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивите могат да съдържат всякакви други данни, като това включва и други масиви.<\/span> <span class=\"sg\" data-s=\"1\">За да отбележите къде започва и къде свършва всеки вложен масив, използвайте квадратни скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете също да поставите още една двойка скоби около масива на най-високо ниво.<\/span> <span class=\"sg\" data-s=\"1\">Този пример показва същата структура от данни като предишния.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да вземете вътрешните елементи, добавете толкова индекси, колкото ви трябват.<\/span> <span class=\"sg\" data-s=\"1\">Всяка двойка квадратни скоби ви води едно ниво по-дълбоко в структурата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Извежда 4\nsay @table[2][1]; # Извежда 200 <\/code><\/pre>"]]},"eo":{"t":"Nestitaj tabeloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabeloj povas enhavi ajnajn aliajn datumojn, kaj tio inkluzivas aliajn tabelojn.<\/span> <span class=\"sg\" data-s=\"1\">Por marki, kie ĉiu nestita tabelo komenciĝas kaj finiĝas, uzu kvadratajn krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas meti unu plian paron de krampoj ĉirkaŭ la supra-nivela tabelo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu ekzemplo montras la saman datumstrukturon kiel la antaŭa.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por preni la internajn erojn, aldonu tiom da indeksoj, kiom vi bezonas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu paro de kvadrataj krampoj portas vin unu nivelon pli profunden en la strukturon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Presas 4\nsay @table[2][1]; # Presas 200 <\/code><\/pre>"]]},"la":{"t":"Nidificata array","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tabulae quaelibet alia data continere possunt, etiam alias tabulas.<\/span> <span class=\"sg\" data-s=\"1\">Ut notes ubi quaeque tabula nidificata incipiat et desinat, claudibus quadratis utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = \n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam aliud par claudium circa tabulam summi gradus ponere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc exemplum eandem structuram datorum ostendit ac prius.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @table = [\n    [1, 2, 3, 4],\n    [10, 20, 30, 40],\n    [100, 200, 300, 400]\n];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut res interiores obtineas, tot indices adde quot requiris.<\/span> <span class=\"sg\" data-s=\"1\">Quodque par claudium quadratorum te uno gradu profundius in structuram ducit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @table[0][3]; # Imprimit 4\nsay @table[2][1]; # Imprimit 200 <\/code><\/pre>"]]}}}</script>
