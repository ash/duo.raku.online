AT; # (List)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tamen, si eum seriei assignas, series eadem elementa accipit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = &lt;a b c&gt;;\nsay @a.WHAT; # (Array)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]}}}</script>
