ode> dà <code>3<\/code>.<\/span><\/p>"]]},"lv":{"t":"Masīvi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir agregātu datu tipi, kas nozīmē, ka tie var glabāt vairāk nekā vienu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Ar to tie atšķiras no <a href=\"https://course.raku.org/lv/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalārajiem elementiem<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Masīva elementus var indeksēt (jeb <em>apzīmēt ar apakšindeksiem<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Citiem vārdiem sakot, katram elementam ir pozīcija.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc šāda veida datiem ir vispārējs nosaukums: pozicionālie dati.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīvu mainīgajiem ir cits sigils: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Noteikumi mainīgā nosaukumam ir tādi paši kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">skalārajiem mainīgajiem<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad mēs esam izveidojuši masīvu ar nosaukumu <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to aizpildīt ar dažām vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī iestatīt vērtības uzreiz, kad izveidojat masīvu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Parīze', 'Roma', 'Berlīne';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksēšana<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu vienu masīva elementu, pievienojiet iekavu pāri aiz tā nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka sigils vienmēr paliek tāds pats.<\/span> <span class=\"sg\" data-s=\"1\">Elementus skaita no nulles, tāpēc mūsu piemērā elements <code>@cities[1]<\/code> ir <code>'Roma'<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīvi ir maināmi, kas nozīmē, ka jūs varat tos mainīt.<\/span> <span class=\"sg\" data-s=\"1\">Lai mainītu elementu, vienkārši piešķiriet tam jaunu vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Roma';\n@cities[1] = 'Parīze';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad izteiksme <code>say @cities[1]<\/code> izdrukā jauno vērtību <code>'Parīze'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izmērs<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Masīva garums ir tā elementu skaits.<\/span> <span class=\"sg\" data-s=\"1\">Lai iegūtu pašreizējo garumu, izmantojiet metodi <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja masīvs parādās tur, kur gaida skaitli, jūs saņemat tā izmēru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <a href=\"https://course.raku.org/lv/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> prefiksa operatoram<\/a> ir vajadzīga skaitliska vērtība no tā argumenta.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tāpēc <code>+@cities<\/code> dod <code>3<\/code>.<\/span><\/p>"]]},"ru":{"t":"Массивы","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Массивы — это агрегированные типы данных, то есть они могут хранить больше одного значения.<\/span> <span class=\"sg\" data-s=\"1\">Этим они отличаются от <a href=\"https://course.raku.org/ru/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярных элементов<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Элементы массива можно индексировать (или <em>субскриптировать<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Другими словами, у каждого элемента есть позиция.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому у данных такого вида общее название — позиционные.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для переменных-массивов есть другой сигил: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для имени переменной такие же, как <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скаляров<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сейчас мы создали массив с именем <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете заполнить его несколькими значениями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значения можно задать и сразу, когда вы создаёте массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексация<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить один элемент массива, добавьте пару скобок после его имени:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что сигил всегда остаётся тем же.<\/span> <span class=\"sg\" data-s=\"1\">Элементы считаются с нуля, поэтому в нашем примере элемент <code>@cities[1]<\/code> — это <code>'Rome'<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Массивы изменяемы, то есть их можно менять.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы изменить элемент, просто присвойте ему новое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь оператор <code>say @cities[1]<\/code> выводит новое значение, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Длина массива — это количество его элементов.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы получить текущую длину, используйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если массив стоит там, где ожидается число, вы получаете его размер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <a href=\"https://course.raku.org/ru/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">префиксный оператор <code>+<\/code><\/a> требует от своего аргумента число.<\/span> <span class=\"sg\" data-s=\"1\">Вот почему <code>+@cities<\/code> даёт <code>3<\/code>.<\/span><\/p>"]]},"uk":{"t":"Масиви","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Масиви — це агрегатні типи даних, тобто вони можуть зберігати більше одного значення.<\/span> <span class=\"sg\" data-s=\"1\">Цим вони відрізняються від <a href=\"https://course.raku.org/uk/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скалярних елементів<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Елементи масиву можна індексувати (або <em>підписувати<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Іншими словами, кожен елемент має позицію.<\/span> <span class=\"sg\" data-s=\"4\">Тому дані такого виду мають загальну назву «позиційні».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для змінних-масивів є інший сигіл: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правила для імені змінної такі самі, як <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">для скалярів<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер ми створили масив з назвою <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете заповнити його кількома значеннями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви також можете задати значення одразу, коли створюєте масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Індексація<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати один елемент масиву, додайте пару дужок після його імені:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що сигіл завжди залишається тим самим.<\/span> <span class=\"sg\" data-s=\"1\">Елементи рахуються з нуля, тому в нашому прикладі елемент <code>@cities[1]<\/code> — це <code>'Rome'<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масиви є змінними, тобто ви можете їх змінювати.<\/span> <span class=\"sg\" data-s=\"1\">Щоб змінити елемент, просто присвойте йому нове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер оператор <code>say @cities[1]<\/code> виводить нове значення, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Розмір<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Довжина масиву — це кількість його елементів.<\/span> <span class=\"sg\" data-s=\"1\">Щоб отримати поточну довжину, використовуйте метод <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо масив стоїть там, де очікується число, ви отримуєте його розмір:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <a href=\"https://course.raku.org/uk/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> префіксний оператор<\/a> потребує числового значення від свого аргументу.<\/span> <span class=\"sg\" data-s=\"1\">Ось чому <code>+@cities<\/code> дає <code>3<\/code>.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Масивите са агрегатни типове данни, което означава, че могат да съдържат повече от една стойност.<\/span> <span class=\"sg\" data-s=\"1\">Това ги отличава от <a href=\"https://course.raku.org/bg/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">скаларните елементи<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Елементите на масива могат да се индексират (или <em>подписват<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">С други думи, всеки елемент има позиция.<\/span> <span class=\"sg\" data-s=\"4\">Затова данните от този вид имат общото име позиционни.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За масивните променливи има друг сигил: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Правилата за името на променливата са същите като <a href=\"https://course.raku.org/bg/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">за скаларите<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дотук създадохме масив с име <code>@cities<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го запълните с някои стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да зададете стойностите веднага, когато създавате масива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да вземете един елемент от масив, добавете чифт скоби след името му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че сигилът винаги остава същият.<\/span> <span class=\"sg\" data-s=\"1\">Елементите се броят от нула, така че в нашия пример елементът <code>@cities[1]<\/code> е <code>'Rome'<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Масивите са изменяеми, което означава, че можете да ги променяте.<\/span> <span class=\"sg\" data-s=\"1\">За да промените елемент, просто му присвоете нова стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега изразът <code>say @cities[1]<\/code> отпечатва новата стойност, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Размер<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дължината на масива е броят на неговите елементи.<\/span> <span class=\"sg\" data-s=\"1\">За да получите текущата дължина, използвайте метода <code>elems<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако масив се появи там, където се очаква число, получавате неговия размер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <a href=\"https://course.raku.org/bg/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\">префиксният оператор <code>+<\/code><\/a> иска число от своя аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>+@cities<\/code> дава <code>3<\/code>.<\/span><\/p>"]]},"eo":{"t":"Tabeloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tabeloj estas agregitaj datumtipoj, kio signifas, ke ili povas teni pli ol unu valoron.<\/span> <span class=\"sg\" data-s=\"1\">Per tio ili diferencas de <a href=\"https://course.raku.org/eo/essentials/scalar-variables/\" target=\"_blank\" rel=\"noopener\">skalaj elementoj<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">La elementoj de tabelo povas esti indeksitaj (aŭ <em>subskribitaj<\/em>).<\/span> <span class=\"sg\" data-s=\"3\">Alivorte, ĉiu elemento havas pozicion.<\/span> <span class=\"sg\" data-s=\"4\">Tial datumoj de ĉi tiu speco havas la ĝeneralan nomon poziciaj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por tabelaj variabloj, estas alia sigelo: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La reguloj por la nomo de la variablo estas la samaj kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">por skaloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun ni kreis tabelon nomatan <code>@urboj<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas plenigi ĝin per kelkaj valoroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas doni la valorojn tuj, kiam vi kreas la tabelon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @urboj = 'Parizo', 'Romo', 'Berlino';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indeksado<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por preni unu eron de tabelo, aldonu paron de krampoj post ĝia nomo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @urboj[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la sigelo ĉiam restas la sama.<\/span> <span class=\"sg\" ata-s=\"3\">Aliis verbis, quodque elementum positionem habet.<\/span> <span class=\"sg\" data-s=\"4\">Ideo data huius generis nomen generale positionalia habent.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro variabilibus array est aliud sigillum: <code>@<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Regulae pro nomine variabilis eaedem sunt ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">pro scalaribus<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc array nomine <code>@cities<\/code> creavimus.<\/span> <span class=\"sg\" data-s=\"1\">Id aliquot valoribus implere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valores etiam statim ponere potes, cum array creas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @cities = 'Paris', 'Rome', 'Berlin';<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Indexatio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut unum elementum array obtineas, par bracketorum post nomen eius adde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities[1];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota quod sigillum semper idem manet.<\/span> <span class=\"sg\" data-s=\"1\">Elementa a zero numerantur, itaque in nostro exemplo elementum <code>@cities[1]<\/code> est <code>'Rome'<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Arrayes sunt mutabiles, id est ea mutare potes.<\/span> <span class=\"sg\" data-s=\"1\">Ut elementum mutes, simpliciter novum valorem ei assigna:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>@cities[0] = 'Rome';\n@cities[1] = 'Paris';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc sententia <code>say @cities[1]<\/code> novum valorem imprimit, <code>'Paris'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Magnitudo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Longitudo array est numerus elementorum eius.<\/span> <span class=\"sg\" data-s=\"1\">Ut longitudinem praesentem obtineas, methodo <code>elems<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @cities.elems; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si array apparet ubi numerus exspectatur, magnitudinem eius accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say +@cities; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <a href=\"https://course.raku.org/la/essentials/coercion/prefixes/\" target=\"_blank\" rel=\"noopener\"><code>+<\/code> praefixus operator<\/a> numerum ex argumento suo requirit.<\/span> <span class=\"sg\" data-s=\"1\">Ideo <code>+@cities<\/code> dat <code>3<\/code>.<\/span><\/p>"]]}}}</script>
