"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Однак ви не можете задати нове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Не ОК<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви спробуєте це зробити, ви отримаєте виняток:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Неможливо змінити незмінний список ((1 3 5 7 9))       в блоці &lt;unit&gt; на t.raku рядок 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Призначення списку масиву<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Що відбувається, якщо зберегти список у змінній, яка має сигіл <code>@<\/code>?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У цьому випадку змінна <code>@data<\/code> зберігає масив, тому ви можете змінювати його елементи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Змінна проти списку<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що списки незмінні.<\/span> <span class=\"sg\" data-s=\"1\">Але ви все одно можете повторно використати змінну, яка зберігає список.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"bg":{"t":"Списъци","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Списъците са подобни на масиви, но са неизменяеми.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че не можете да променяте размера или елементите на списък.<\/span> <span class=\"sg\" data-s=\"2\">За да създадете списък, използвайте скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Индексиране на списъци<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да вземете отделен елемент от списък, използвайте квадратни скоби с индекса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обаче не можете да зададете нова стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Не е ОК<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако опитате да направите това, получавате изключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Не може да се модифицира неизменяем списък ((1 3 5 7 9))       в блок &lt;unit&gt; на t.raku, ред 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Присвояване на списък на масив<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво става, ако запазите списък в променлива, която има сигил <code>@<\/code>?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В този случай променливата <code>@data<\/code> съдържа масив, така че можете да променяте неговите елементи.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Променлива срещу списък<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Забележете, че списъците са неизменяеми.<\/span> <span class=\"sg\" data-s=\"1\">Но все пак можете да използвате отново променливата, която съдържа списъка.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"eo":{"t":"Listoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Listoj estas similaj al tabeloj, sed ili estas neŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi ne povas ŝanĝi la grandecon aŭ la elementojn de listo.<\/span> <span class=\"sg\" data-s=\"2\">Por krei liston, uzu krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribi listojn<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por preni unuopan elementon de listo, uzu kvadratajn krampojn kun la indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tamen vi ne povas doni novan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Ne OK<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi provas fari tion, vi ricevas escepton:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ne eblas modifi nemodifikeblan Liston ((1 3 5 7 9))       en bloko &lt;unit&gt; ĉe t.raku linio 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asigni liston al tabelo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kio okazas, se vi konservas liston en variablo, kiu havas la sigelon <code>@<\/code>?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu kazo, la variablo <code>@data<\/code> tenas tabelon, do vi povas ŝanĝi ĝiajn elementojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Variablo vs listo<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke listoj estas neŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankoraŭ povas reuzi la variablon, kiu tenas la liston.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]},"la":{"t":"Listae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Indices similes sunt arrayibus, sed immutabiles sunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: magnitudinem aut elementa indicis mutare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Ut indicem crees, parenthesibus utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $odd = (1, 3, 5, 7, 9);<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subscriptio indicum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut singulum elementum indicis obtineas, bracketis quadratis cum indice utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $odd[3]; # 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tamen novum valorem ponere non potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$odd[3] = 8; # Non OK<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si hoc facere temptas, exceptionem accipis:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Non potest immutabilem Indicem ((1 3 5 7 9)) mutare       in block &lt;unit&gt; at t.raku linea 4<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Assignatio indicis ad array<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid accidit si indicem in variabili servas quae sigillum <code>@<\/code> habet?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = (40, 42, 44);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc in casu, variabilis <code>@data<\/code> array continet, itaque elementa eius mutare potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Variabilis vs index<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota: indices immutabiles sunt.<\/span> <span class=\"sg\" data-s=\"1\">Sed variabilem quae indicem continet iterum adhibere potes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $elements = (1, 2);\nsay $elements[0]; # 1\n\n$elements = (3, 4);\nsay $elements[0]; # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"]]}}}</script>
