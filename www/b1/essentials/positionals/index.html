<script type="application/json" id="page-data">{"u":"essentials/positionals","n":210,"k":"section","pv":"essentials/typed-variables/exercises/input-number/solution","nx":"essentials/positionals/arrays","tr":["essentials"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Positional data types","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Now it is time to talk about more complex data types.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, positional data types are the ones that can be indexed (or <em>subscripted<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">We have already met one data type of this kind: <a href=\"/essentials/ranges/\">ranges<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In this section, we show two more positional data types: <code>Array<\/code> and <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You will find more details in the second part of the course.<\/span> <span class=\"sg\" data-s=\"2\">We also look at ranges again, now as a positional data type.<\/span><\/p>"]]},"de":{"t":"Positionale Datentypen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jetzt ist es Zeit, über komplexere Datentypen zu sprechen.<\/span> <span class=\"sg\" data-s=\"1\">In Raku sind Positionsdaten-Typen solche, die man indizieren (oder <em>subskriptieren<\/em>) kann.<\/span> <span class=\"sg\" data-s=\"2\">Wir haben schon einen Datentyp dieser Art kennengelernt: <a href=\"https://course.raku.org/de/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">Ranges<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt zeigen wir zwei weitere Positionsdaten-Typen: <code>Array<\/code> und <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mehr Details finden Sie im zweiten Teil des Kurses.<\/span> <span class=\"sg\" data-s=\"2\">Wir sehen uns auch Ranges noch einmal an, diesmal als Positionsdaten-Typ.<\/span><\/p>"]]},"nl":{"t":"Positionele datentypen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nu is het tijd om over complexere gegevenstypen te praten.<\/span> <span class=\"sg\" data-s=\"1\">In Raku zijn positionele gegevenstypen de typen die je kunt indexeren (of <em>subscripten<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">We hebben al één gegevenstype van deze soort gezien: <a href=\"https://course.raku.org/nl/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">reeksen<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In deze sectie laten we nog twee positionele gegevenstypen zien: <code>Array<\/code> en <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Meer details vind je in het tweede deel van de cursus.<\/span> <span class=\"sg\" data-s=\"2\">We kijken ook nog eens naar reeksen, nu als positioneel gegevenstype.<\/span><\/p>"]]},"es":{"t":"Tipos de datos posicionales","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ahora es hora de hablar de tipos de datos más complejos.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, los tipos de datos posicionales son los que se pueden indexar (o <em>subscriptar<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ya hemos conocido un tipo de dato de esta clase: los <a href=\"https://course.raku.org/es/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">rangos<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En esta sección, mostramos dos tipos de datos posicionales más: <code>Array<\/code> y <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Encontrarás más detalles en la segunda parte del curso.<\/span> <span class=\"sg\" data-s=\"2\">También volvemos a ver los rangos, ahora como un tipo de dato posicional.<\/span><\/p>"]]},"it":{"t":"Tipi di dati posizionali","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora è il momento di parlare di tipi di dati più complessi.<\/span> <span class=\"sg\" data-s=\"1\">In Raku, i tipi di dati posizionali sono quelli che si possono indicizzare (o <em>sottoscrivere<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Abbiamo già incontrato un tipo di dato di questo genere: gli <a href=\"https://course.raku.org/it/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalli<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In questa sezione mostriamo altri due tipi di dati posizionali: <code>Array<\/code> e <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Troverai più dettagli nella seconda parte del corso.<\/span> <span class=\"sg\" data-s=\"2\">Guardiamo anche di nuovo gli intervalli, questa volta come tipo di dato posizionale.<\/span><\/p>"]]},"lv":{"t":"Pozicionālie datu tipi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad ir laiks runāt par sarežģītākiem datu tipiem.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā pozicionālie datu tipi ir tie, kurus var indeksēt (jeb <em>subscriptēt<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Mēs jau esam satikuši vienu šāda veida datu tipu: <a href=\"https://course.raku.org/lv/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">diapazoni<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā mēs parādām vēl divus pozicionālos datu tipus: <code>Array<\/code> un <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vairāk detaļu jūs atradīsiet kursa otrajā daļā.<\/span> <span class=\"sg\" data-s=\"2\">Mēs arī vēlreiz aplūkojam diapazonus, šoreiz kā pozicionālu datu tipu.<\/span><\/p>"]]},"ru":{"t":"Позиционные типы данных","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь пора поговорить о более сложных типах данных.<\/span> <span class=\"sg\" data-s=\"1\">В Raku позиционные типы данных — это те, которые можно индексировать (или <em>субскриптировать<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Один тип данных такого вида мы уже встречали: <a href=\"https://course.raku.org/ru/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазоны<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы покажем ещё два позиционных типа данных: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Больше подробностей вы найдёте во второй части курса.<\/span> <span class=\"sg\" data-s=\"2\">Мы также снова посмотрим на диапазоны, теперь как на позиционный тип данных.<\/span><\/p>"]]},"uk":{"t":"Позиційні типи даних","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер час поговорити про складніші типи даних.<\/span> <span class=\"sg\" data-s=\"1\">У Raku позиційні типи даних — це ті, які можна індексувати (або <em>субскриптувати<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ми вже зустрічали один тип даних такого виду: <a href=\"https://course.raku.org/uk/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">діапазони<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ми покажемо ще два позиційні типи даних: <code>Array<\/code> і <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Більше подробиць ви знайдете в другій частині курсу.<\/span> <span class=\"sg\" data-s=\"2\">Ми також ще раз подивимося на діапазони, тепер як на позиційний тип даних.<\/span><\/p>"]]},"bg":{"t":"Позиционни типове данни","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега е време да поговорим за по-сложни типове данни.<\/span> <span class=\"sg\" data-s=\"1\">В Raku позиционните типове данни са тези, които могат да се индексират (или <em>подписват<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Вече срещнахме един тип данни от този вид: <a href=\"https://course.raku.org/bg/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">диапазоните<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този раздел показваме още два позиционни типа данни: <code>Array<\/code> и <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повече подробности ще намерите във втората част на курса.<\/span> <span class=\"sg\" data-s=\"2\">Също така пак разглеждаме диапазоните, този път като позиционен тип данни.<\/span><\/p>"]]},"eo":{"t":"Poziciaj datentipoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun estas tempo paroli pri pli kompleksaj datumtipoj.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, poziciaj datumtipoj estas tiuj, kiujn oni povas indeksi (aŭ <em>subskribi<\/em>).<\/span> <span class=\"sg\" data-s=\"2\">Ni jam renkontis unu datumtipon de ĉi tiu speco: <a href=\"https://course.raku.org/eo/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervaloj<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio, ni montras du pliajn poziciajn datumtipojn: <code>Array<\/code> kaj <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi trovos pli da detaloj en la dua parto de la kurso.<\/span> <span class=\"sg\" data-s=\"2\">Ni ankaŭ denove rigardas intervalojn, nun kiel pozician datumtipon.<\/span><\/p>"]]},"la":{"t":"Positionalia data genera","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc tempus est de typis datorum magis complexis loqui.<\/span> <span class=\"sg\" data-s=\"1\">In Raku typi datorum positionis sunt ei qui indicari (vel <em>subscribi<\/em>) possunt.<\/span> <span class=\"sg\" data-s=\"2\">Iam unum typum datorum huius generis cognovimus: <a href=\"https://course.raku.org/la/essentials/ranges/\" target=\"_blank\" rel=\"noopener\">intervalla<\/a>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In hac sectione duos alios typos datorum positionis ostendimus: <code>Array<\/code> et <code>List<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Plura in secunda parte cursus invenies.<\/span> <span class=\"sg\" data-s=\"2\">Etiam intervalla iterum spectamus, nunc ut typum datorum positionis.<\/span><\/p>"]]}}}</script>
