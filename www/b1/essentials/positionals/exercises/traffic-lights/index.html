h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il semaforo cambia colore ogni secondo.<\/span> <span class=\"sg\" data-s=\"1\">Quando viene acceso, parte con il giallo.<\/span> <span class=\"sg\" data-s=\"2\">Poi il colore cambia ogni secondo in questo ordine: giallo — rosso — giallo — verde.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, il ciclo ricomincia.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scrivi un programma che stampa lo stato del semaforo.<\/span> <span class=\"sg\" data-s=\"1\">Stampalo per il 51&lt;sup&gt;esimo&lt;/sup&gt;, il 102&lt;sup&gt;esimo&lt;/sup&gt; e il 305&lt;sup&gt;esimo&lt;/sup&gt; secondo.<\/span> <span class=\"sg\" data-s=\"2\">Supponi che al 1&lt;sup&gt;esimo&lt;/sup&gt; secondo il colore sia rosso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma dovrebbe stampare tre colori su righe separate:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Satiksmes luksofori","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problēma<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Luksofors maina savu krāsu katru sekundi.<\/span> <span class=\"sg\" data-s=\"1\">Kad to ieslēdz, tas sāk ar dzeltenu krāsu.<\/span> <span class=\"sg\" data-s=\"2\">Tad krāsa mainās katru sekundi šādā secībā: dzeltena — sarkana — dzeltena — zaļa.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam cikls sākas no jauna.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet programmu, kas izdrukā luksofora stāvokli.<\/span> <span class=\"sg\" data-s=\"1\">Izdrukājiet to 51&lt;sup&gt;ajā&lt;/sup&gt;, 102&lt;sup&gt;ajā&lt;/sup&gt; un 305&lt;sup&gt;ajā&lt;/sup&gt; sekundē.<\/span> <span class=\"sg\" data-s=\"2\">Pieņemiet, ka 1&lt;sup&gt;ajā&lt;/sup&gt; sekundē krāsa ir sarkana.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmai vajadzētu izdrukāt trīs krāsas atsevišķās rindās:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Светофор","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Светофор меняет свой цвет каждую секунду.<\/span> <span class=\"sg\" data-s=\"1\">Когда его включают, он начинает с жёлтого цвета.<\/span> <span class=\"sg\" data-s=\"2\">Затем цвет меняется каждую секунду в таком порядке: жёлтый — красный — жёлтый — зелёный.<\/span> <span class=\"sg\" data-s=\"3\">После этого цикл начинается заново.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Напишите программу, которая выводит состояние светофора.<\/span> <span class=\"sg\" data-s=\"1\">Выведите его для 51&lt;sup&gt;ой&lt;/sup&gt;, 102&lt;sup&gt;ой&lt;/sup&gt; и 305&lt;sup&gt;ой&lt;/sup&gt; секунды.<\/span> <span class=\"sg\" data-s=\"2\">Считайте, что на 1&lt;sup&gt;ой&lt;/sup&gt; секунде цвет красный.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа должна вывести три цвета на отдельных строках:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/ ето на светофара.<\/span> <span class=\"sg\" data-s=\"1\">Отпечатайте го за 51&lt;sup&gt;вата&lt;/sup&gt;, 102&lt;sup&gt;рата&lt;/sup&gt; и 305&lt;sup&gt;тата&lt;/sup&gt; секунда.<\/span> <span class=\"sg\" data-s=\"2\">Приемете, че на 1&lt;sup&gt;вата&lt;/sup&gt; секунда цветът е червен.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата трябва да отпечата три цвята на отделни редове:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/essentials/positionals/exercises/traffic-lights/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Trafiklumo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La trafiklumo ŝanĝas sian koloron ĉiun sekundon.<\/span> <span class=\"sg\" data-s=\"1\">Kiam oni ŝaltas ĝin, ĝi komence estas flava.<\/span> <span class=\"sg\" data-s=\"2\">Poste la koloro ŝanĝiĝas ĉiun sekundon en ĉi tiu ordo: flava — ruĝa — flava — verda.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, la ciklo rekomenciĝas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Skribu programon por presi la staton de la trafiklumoj.<\/span> <span class=\"sg\" data-s=\"1\">Presu ĝin por la 51&lt;sup&gt;a&lt;/sup&gt;, 102&lt;sup&gt;a&lt;/sup&gt; kaj 305&lt;sup&gt;a&lt;/sup&gt; sekundo.<\/span> <span class=\"sg\" data-s=\"2\">Supozu, ke la koloro en la 1&lt;sup&gt;a&lt;/sup&gt; sekundo estas ruĝa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo devus presi tri kolorojn en apartaj linioj:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku traffic-lights.raku\n...\n...\n...<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\"
