p><span class=\"sg\" data-s=\"0\">La programo sube havas sian propran tabelon de nomoj de nombroj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas la nomojn de la nombroj de 0 ĝis 20.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ havas la nomojn de la dekoj: 20, 30 kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"3\">Ĉeno de kondiĉaj kontroloj poste sendas la nombron al unu el la reguloj de literumado.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = @*ARGS[0];\n\nmy @names = &lt;\n    zero one two three four five six seven eight nine ten\n    eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty\n    thirty fourty fifty sixty seventy eighty ninety &gt;;\n\nif $n &lt; 20 {\n    say @names[$n];\n}\nelsif $n % 10 { # Du-ciferaj ne-rondaj nombroj, ekz., 34\n    say @names[$n / 10 + 18] ~ '-' ~ @names[$n % 10];\n}\nelse { # Multobloj de 10, ekz., 50\n    say @names[$n / 10 + 18];\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/spell-a-number.raku\" target=\"_blank\" rel=\"noopener\">spell-a-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rulu la programon kelkajn fojojn.<\/span> <span class=\"sg\" data-s=\"1\">Certigu, ke vi testas ĉiujn tri branĉojn de la konstruo <code>if<\/code>—<code>elsif<\/code>—<code>else<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/spell-a-number.raku 5\nfive\n\n$ raku exercises/positionals/spell-a-number.raku 12\ntwelve\n\n$ raku exercises/positionals/spell-a-number.raku 67\nsixty-seven\n\n$ raku exercises/positionals/spell-a-number.raku 80\neighty<\/code><\/pre>"]]},"la":{"t":"Solutio: Litterare numerum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma infra suum array nominum numerorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Nomina numerorum a 0 ad 20 habet.<\/span> <span class=\"sg\" data-s=\"2\">Etiam nomina decadum habet: 20, 30, et cetera.<\/span> <span class=\"sg\" data-s=\"3\">Catena inspectionum condicionalium deinde numerum ad unam ex regulis scribendi mittit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = @*ARGS[0];\n\nmy @nomina = &lt;\n    zero unus duo tres quattuor quinque sex septem octo novem decem\n    undecim duodecim tredecim quattuordecim quindecim sedecim septendecim duodeviginti undeviginti viginti\n    triginta quadraginta quinquaginta sexaginta septuaginta octoginta nonaginta &gt;;\n\nif $n &lt; 20 {\n    say @nomina[$n];\n}\nelsif $n % 10 { # Numeri duo-digiti non-rotundi, e.g., 34\n    say @nomina[$n / 10 + 18] ~ '-' ~ @nomina[$n % 10];\n}\nelse { # Multipla 10, e.g., 50\n    say @nomina[$n / 10 + 18];\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/positionals/spell-a-number.raku\" target=\"_blank\" rel=\"noopener\">spell-a-number.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Curre programma aliquoties.<\/span> <span class=\"sg\" data-s=\"1\">Cura ut omnes tres ramos constructionis <code>if<\/code>—<code>elsif<\/code>—<code>else<\/code> probes.<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/positionals/spell-a-number.raku 5\nquinque\n\n$ raku exercises/positionals/spell-a-number.raku 12\nduodecim\n\n$ raku exercises/positionals/spell-a-number.raku 67\nsexaginta-septem\n\n$ raku exercises/positionals/spell-a-number.raku 80\noctoginta<\/code><\/pre>"]]}}}</script>
