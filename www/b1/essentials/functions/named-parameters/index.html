inen Fehler.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel verursacht der Aufruf <code>distance(30, 10)<\/code> einen Fehler:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zu viele positionsbasierte Argumente übergeben; erwartete 0 Argumente, aber 2 erhalten         in sub distance bei t.raku Zeile 1         in Block &lt;unit&gt; bei t.raku Zeile 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Gute ist, dass Sie benannte Argumente in beliebiger Reihenfolge angeben können.<\/span> <span class=\"sg\" data-s=\"1\">Die folgenden zwei Aufrufe sind genau gleich:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variablen übergeben<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal steht der Wert, den Sie übergeben wollen, in einer Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Die Variable hat vielleicht auch denselben Namen wie der Parameter.<\/span> <span class=\"sg\" data-s=\"2\">Dann können Sie eine besondere Syntax nutzen, die Ihnen Tipparbeit spart:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist ähnlich wie ein längerer Aufruf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auch hier spielt die Reihenfolge keine Rolle:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn die Variable und der Parameter verschiedene Namen haben, übergeben Sie ein Paar.<\/span> <span class=\"sg\" data-s=\"1\">Verwenden Sie dafür eine dieser Möglichkeiten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code> $from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo è simile a una chiamata più lunga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Anche in questo caso, l'ordine non importa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la variabile e il parametro hanno nomi diversi, passa una coppia.<\/span> <span class=\"sg\" data-s=\"1\">Usa uno di questi modi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# oppure:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"lv":{"t":"Nosauktie parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <a href=\"/essentials/functions/positional-parameters/\">pozicionālajiem parametriem<\/a>, <em>nosauktos<\/em> parametrus atpazīst pēc to nosaukumiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šai funkcijai ir divi parametri, kurus sauc <code>$from<\/code> un <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izsauktu šo funkciju, jums jāraksta argumentu nosaukumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūs nododat argumentus tā, it kā tie būtu pozicionāli, jūs saņemat kļūdu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, izsaukums <code>distance(30, 10)<\/code> izraisa kļūdu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pārāk daudz pozicionālo argumentu; tika gaidīti 0 argumenti, bet tika saņemti 2         sub distance pie t.raku 1. rindas         blokā &lt;unit&gt; pie t.raku 2. rindas<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Labā ziņa ir tā, ka jūs varat uzskaitīt nosauktos argumentus jebkurā secībā.<\/span> <span class=\"sg\" data-s=\"1\">Šie divi izsaukumi ir tieši vienādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mainīgo nodošana<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz vērtība, ko jūs gribat nodot, ir saglabāta mainīgajā.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgajam var būt arī tāds pats nosaukums kā parametram.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs varat izmantot īpašu sintaksi, kas ļauj rakstīt mazāk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas ir līdzīgi garākam izsaukumam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Atkal, secība šeit nav svarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja mainīgā un parametra nosaukumi ir dažādi, nododiet pāri.<\/span> <span class=\"sg\" data-s=\"1\">Izmantojiet vienu no šiem veidiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vai:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"ru":{"t":"Именованные параметры","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В отличие от <a href=\"/essentials/functions/positional-parameters/\">позиционных параметров<\/a>, <em>именованные<\/em> параметры указываются по их именам.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У этой функции два параметра с именами <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать эту функцию, нужно написать имена аргументов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если передать аргументы так, будто они позиционные, будет ошибка.<\/span> <span class=\"sg\" data-s=\"1\">Например, вызов <code>distance(30, 10)<\/code> приводит к ошибке:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Слишком много позиционных аргументов; ожидалось 0 аргументов, но получено 2         в подпрограмме distance на строке 1 в t.raku         в блоке &lt;unit&gt; на строке 2 в t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хорошо то, что именованные аргументы можно перечислять в любом порядке.<\/span> <span class=\"sg\" data-s=\"1\">Следующие два вызова совершенно одинаковы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача переменных<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда значение, которое вы хотите передать, хранится в переменной.<\/span> <span class=\"sg\" data-s=\"1\">Имя этой переменной может совпадать с именем параметра.<\/span> <span class=\"sg\" data-s=\"2\">Тогда вам поможет особый синтаксис, с которым нужно писать меньше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это похоже на более длинный вызов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И снова порядок здесь не важен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если имена переменной и параметра разные, передайте пару.<\/span> <span class=\"sg\" data-s=\"1\">Используйте один из этих способов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"uk":{"t":"Іменовані параметри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">На відміну від <a href=\"/essentials/functions/positional-parameters/\">позиційних параметрів<\/a>, <em>іменовані<\/em> параметри розрізняють за їхніми іменами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця функція має два параметри з іменами <code>$from<\/code> і <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб викликати цю функцію, ви маєте написати імена аргументів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви передасте аргументи так, ніби вони позиційні, ви отримаєте помилку.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, виклик <code>distance(30, 10)<\/code> спричиняє помилку:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Занадто багато позиційних аргументів; очікувалося 0 аргументів, але отримано 2         в підпрограмі distance на рядку 1 у файлі t.raku         в блоці &lt;unit&gt; на рядку 2 у файлі t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добре те, що іменовані аргументи можна перелічувати в будь-якому порядку.<\/span> <span class=\"sg\" data-s=\"1\">Наступні два виклики абсолютно однакові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача змінних<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді значення, яке ви хочете передати, зберігається у змінній.<\/span> <span class=\"sg\" data-s=\"1\">Ця змінна може ще й мати те саме ім'я, що й параметр.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ви можете скористатися спеціальним синтаксисом, з яким треба менше друкувати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це схоже на довший виклик:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">І знову, порядок тут не має значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо імена змінної і параметра різні, передайте пару.<\/span> <span class=\"sg\" data-s=\"1\">Використайте один із цих способів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# або:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"bg":{"t":"Именувани параметри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За разлика от <a href=\"/essentials/functions/positional-parameters/\">позиционните параметри<\/a>, <em>именуваните<\/em> параметри се разпознават по техните имена.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази функция има два параметъра, наречени <code>$from<\/code> и <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да извикате тази функция, трябва да напишете имената на аргументите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако предадете аргументите, сякаш са позиционни, получавате грешка.<\/span> <span class=\"sg\" data-s=\"1\">Например извикването <code>distance(30, 10)<\/code> предизвиква грешка:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Прекалено много позиционни аргументи; очаквани 0 аргумента, но получени 2         в sub distance на ред 1 в t.raku         в блок &lt;unit&gt; на ред 2 в t.raku<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хубавото е, че можете да изброявате именуваните аргументи в произволен ред.<\/span> <span class=\"sg\" data-s=\"1\">Следните две извиквания са напълно еднакви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Предаване на променливи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога стойността, която искате да предадете, се пази в променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тази променлива може да има и същото име като параметъра.<\/span> <span class=\"sg\" data-s=\"2\">Тогава можете да се възползвате от специален синтаксис, който спестява писане:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е подобно на по-дълго извикване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Отново, тук редът няма значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако имената на променливата и параметъра са различни, предайте двойка.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте един от тези начини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# или:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"eo":{"t":"Nomitaj parametroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Male al <a href=\"/essentials/functions/positional-parameters/\">poziciaj parametroj<\/a>, <em>nomitaj<\/em> parametroj estas identigataj per siaj nomoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu funkcio havas du parametrojn nomatajn <code>$from<\/code> kaj <code>$to<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por voki ĉi tiun funkcion, vi devas skribi la nomojn de la argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi pasas la argumentojn kvazaŭ ili estus poziciaj, vi ricevas eraron.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la voko <code>distance(30, 10)<\/code> kaŭzas eraron:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro multaj poziciaj pasis; atendis 0 argumentojn sed ricevis 2         en sub distance ĉe t.raku linio 1         en bloko &lt;unit&gt; ĉe t.raku linio 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La bona afero estas, ke vi povas listigi nomitajn argumentojn en ajna ordo.<\/span> <span class=\"sg\" data-s=\"1\">La sekvaj du vokoj estas tute samaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasante variablojn<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje la valoro, kiun vi volas pasi, estas konservata en variablo.<\/span> <span class=\"sg\" data-s=\"1\">La variablo eble ankaŭ havas la saman nomon kiel la parametro.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi povas ĝui specialan sintakson, kiu ŝparas tajpadon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas simila al pli longa voko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Denove, la ordo ne gravas ĉi tie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la nomoj de la variablo kaj de la parametro estas malsamaj, pasu paron.<\/span> <span class=\"sg\" data-s=\"1\">Uzu unu el ĉi tiuj manieroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# aŭ:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]},"la":{"t":"Nominate parametra","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Contra <a href=\"/essentials/functions/positional-parameters/\">parametros positionales<\/a>, parametri <em>nominati<\/em> per nomina sua cognoscuntur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec functio duos parametros habet, qui <code>$from<\/code> et <code>$to<\/code> vocantur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub distance(:$from, :$to) { $from - $to }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut hanc functionem voces, nomina argumentorum scribere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si argumenta quasi positionalia transmittis, errorem accipis.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, vocatio <code>distance(30, 10)<\/code> errorem facit:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Troppi positionale transmissi; expectati 0 argumenti sed accepti 2         in sub distance ad t.raku linea 1         in block &lt;unit&gt; ad t.raku linea 2<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bona res est quod argumenta nominata quolibet ordine enumerare potes.<\/span> <span class=\"sg\" data-s=\"1\">Duae vocationes sequentes prorsus eaedem sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; 30, to =&gt; 10); # 20\n\nsay distance(to =&gt; 10, from =&gt; 30); # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Variabiles transmittentes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum valor quem transmittere vis in variabili servatur.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis etiam idem nomen ac parameter habere potest.<\/span> <span class=\"sg\" data-s=\"2\">Tum syntaxi speciali frui potes, quae laborem scribendi minuit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $from = 30;\nmy $to = 10;\nsay distance(:$from, :$to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc simile est vocationi longiori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(from =&gt; $from, to =&gt; $to); # 20<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iterum, ordo hic non refert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say distance(:$to, :$from); # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si nomina variabilis et parametri diversa sunt, par transmitte.<\/span> <span class=\"sg\" data-s=\"1\">Utere uno ex his modis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 20;\nmy $b = 10;\n\nsay distance(from =&gt; $a, to =&gt; $b);\n\n# vel:\n\nsay distance(:from($a), :to($b));<\/code><\/pre>"]]}}}</script>
