<script type="application/json" id="page-data">{"u":"essentials/functions/named-parameters/quiz2","n":280,"k":"quiz","pv":"essentials/functions/named-parameters/quiz1","nx":"essentials/functions/default-values","tr":["essentials","essentials/functions","essentials/functions/named-parameters"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Variables as named parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is the same function as in the previous quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You also have three variables in the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You need to call the function and pass it two of the three variables.<\/span> <span class=\"sg\" data-s=\"1\">Mark all the correct ways to do it.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positional arguments are passed here instead of the named ones.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Not a valid Raku syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No named parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Same as above.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Also fine, while a bit redundant.<\/span><\/span><\/li><\/ul>"]]},"de":{"t":"Quiz 2 — Variablen als benannte Parameter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist die gleiche Funktion wie im vorherigen Quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du hast auch drei Variablen im Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du sollst die Funktion aufrufen und ihr zwei der drei Variablen übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Markiere alle richtigen Wege dafür.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionsargumente werden hier anstelle der benannten übergeben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Keine gültige Raku-Syntax.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Kein benannter Parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Dasselbe wie oben.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Auch in Ordnung, wenn auch etwas redundant.<\/span><\/span><\/li><\/ul>"]]},"nl":{"t":"Quiz 2 — Variabelen als benoemde parameters","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is dezelfde functie als in de vorige quiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je hebt ook drie variabelen in het programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je moet de functie aanroepen en er twee van de drie variabelen aan doorgeven.<\/span> <span class=\"sg\" data-s=\"1\">Markeer alle juiste manieren om dat te doen.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Positionele argumenten worden hier doorgegeven in plaats van de benoemde.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Geen geldige Raku-syntaxis.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Geen benoemde parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Geen benoemde parameter <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Zelfde als hierboven.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Ook goed, hoewel een beetje overbodig.<\/span><\/span><\/li><\/ul>"]]},"es":{"t":"Quiz 2 — Variables como parámetros nombrados","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí está la misma función que en el cuestionario anterior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También tienes tres variables en el programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Necesitas llamar a la función y pasarle dos de las tres variables.<\/span> <span class=\"sg\" data-s=\"1\">Marca todas las formas correctas de hacerlo.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Aquí se pasan argumentos posicionales en lugar de los nombrados.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Sintaxis no válida en Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">No hay un parámetro nombrado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">No hay un parámetro nombrado <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Igual que el anterior.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">También está bien, aunque un poco redundante.<\/span><\/span><\/li><\/ul>"]]},"it":{"t":"Quiz 2 — Variabili come parametri nominati","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco la stessa funzione del quiz precedente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai anche tre variabili nel programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Devi chiamare la funzione e passarle due delle tre variabili.<\/span> <span class=\"sg\" data-s=\"1\">Segna tutti i modi corretti per farlo.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Qui vengono passati argomenti posizionali invece di quelli nominati.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Sintassi Raku non valida.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Nessun parametro nominato <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Uguale a sopra.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Anche questo va bene, sebbene un po' ridondante.<\/span><\/span><\/li><\/ul>"]]},"lv":{"t":"Tests 2 — Mainīgie kā nosauktie parametri","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir tā pati funkcija kā iepriekšējā viktorīnā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programmā ir arī trīs mainīgie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jums jāizsauc funkcija un jānodod tai divi no trim mainīgajiem.<\/span> <span class=\"sg\" data-s=\"1\">Atzīmējiet visus pareizos veidus, kā to izdarīt.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Šeit tiek nodoti pozicionālie argumenti, nevis nosauktie.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Nav derīga Raku sintakse.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Nav nosauktā parametra <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Nav nosauktā parametra <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">Tas pats kā iepriekš.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Arī derīgi, lai gan nedaudz lieki.<\/span><\/span><\/li><\/ul>"]]},"ru":{"t":"Тест 2: Переменные как именованные параметры","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот та же функция, что и в предыдущей викторине:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У вас также есть три переменные в программе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Нужно вызвать функцию и передать ей две из трёх переменных.<\/span> <span class=\"sg\" data-s=\"1\">Отметьте все правильные способы это сделать.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Здесь передаются позиционные аргументы вместо именованных.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Неверный синтаксис Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f(:$b, :$c)<span class=\"quiz-note\">Нет именованного параметра <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"6\">f(:$a, c =&gt; $c)<span class=\"quiz-note\">Нет именованного параметра <code>c<\/code>.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"7\">f(:$a, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"8\">f(:$a, :b($c))<span class=\"quiz-note\">То же самое, что и выше.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"9\">f(:a($a), :b($c))<span class=\"quiz-note\">Тоже допустимо, хотя немного избыточно.<\/span><\/span><\/li><\/ul>"]]},"uk":{"t":"Тест 2 — Змінні як іменовані параметри","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось та сама функція, що і в попередній вікторині:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f(:$a, :$b) {\n    $a - $b\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У програмі також є три змінні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 1;\nmy $b = 2;\nmy $c = 3;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам треба викликати функцію і передати їй дві з трьох змінних.<\/span> <span class=\"sg\" data-s=\"1\">Позначте всі правильні способи це зробити.<\/span><\/p>"],["quiz",10,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">f(a =&gt; $a, b =&gt; $b)<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">f(a =&gt; $c, b =&gt; $c)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">f($a, $b)<span class=\"quiz-note\">Тут передаються позиційні аргументи замість іменованих.<\/span><\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"3\">f(:$a, :$b)<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">f($:a, $:b)<span class=\"quiz-note\">Неприпустимий синтаксис Raku.<\/span><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"5\">f
