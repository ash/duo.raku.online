<script type="application/json" id="page-data">{"u":"essentials/functions/identifiers","n":269,"k":"topic","pv":"essentials/functions","nx":"essentials/functions/identifiers/quiz","tr":["essentials","essentials/functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Function names","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The name of a function is an identifier.<\/span> <span class=\"sg\" data-s=\"1\">It follows the same rules as <a href=\"/essentials/scalar-variables/identifiers/\">variable names<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">It must start with a letter or an underscore.<\/span> <span class=\"sg\" data-s=\"3\">After that, it can contain any letters, digits, underscores, single quotes (apostrophes) and hyphens.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">An apostrophe or a hyphen must be followed by a letter.<\/span> <span class=\"sg\" data-s=\"1\">Apostrophes are rare in identifiers.<\/span> <span class=\"sg\" data-s=\"2\">Hyphens, however, are used a lot, because they make names more expressive.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are a few examples of valid function names.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"de":{"t":"Funktionsnamen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Der Name einer Funktion ist ein Bezeichner.<\/span> <span class=\"sg\" data-s=\"1\">Er folgt denselben Regeln wie <a href=\"https://course.raku.org/de/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">Variablennamen<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Er muss mit einem Buchstaben oder einem Unterstrich beginnen.<\/span> <span class=\"sg\" data-s=\"3\">Danach kann er beliebige Buchstaben, Ziffern, Unterstriche, einfache Anführungszeichen (Apostrophe) und Bindestriche enthalten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nach einem Apostroph oder einem Bindestrich muss ein Buchstabe folgen.<\/span> <span class=\"sg\" data-s=\"1\">Apostrophe sind in Bezeichnern selten.<\/span> <span class=\"sg\" data-s=\"2\">Bindestriche verwendet man dagegen oft, weil Namen damit mehr aussagen können.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind ein paar Beispiele für gültige Funktionsnamen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"nl":{"t":"Functienamen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De naam van een functie is een identificator.<\/span> <span class=\"sg\" data-s=\"1\">Er gelden dezelfde regels als voor <a href=\"https://course.raku.org/nl/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">namen van variabelen<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">De naam moet beginnen met een letter of een underscore.<\/span> <span class=\"sg\" data-s=\"3\">Daarna mag hij alle letters, cijfers, underscores, enkele aanhalingstekens (apostrofs) en koppeltekens bevatten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Na een apostrof of een koppelteken moet een letter staan.<\/span> <span class=\"sg\" data-s=\"1\">Apostrofs zie je weinig in identificatoren.<\/span> <span class=\"sg\" data-s=\"2\">Koppeltekens worden echter veel gebruikt, omdat een naam er meer mee kan zeggen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn een paar voorbeelden van geldige functienamen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"es":{"t":"Nombres de funciones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El nombre de una función es un identificador.<\/span> <span class=\"sg\" data-s=\"1\">Sigue las mismas reglas que los <a href=\"https://course.raku.org/es/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nombres de variables<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Debe empezar con una letra o un guion bajo.<\/span> <span class=\"sg\" data-s=\"3\">Después puede contener cualquier letra, dígito, guion bajo, comilla simple (apóstrofe) y guion.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Después de un apóstrofe o un guion debe ir una letra.<\/span> <span class=\"sg\" data-s=\"1\">Los apóstrofes son raros en los identificadores.<\/span> <span class=\"sg\" data-s=\"2\">Los guiones, en cambio, se usan mucho, porque hacen los nombres más expresivos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes unos ejemplos de nombres de funciones válidos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"it":{"t":"Nomi delle funzioni","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il nome di una funzione è un identificatore.<\/span> <span class=\"sg\" data-s=\"1\">Segue le stesse regole dei <a href=\"https://course.raku.org/it/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomi delle variabili<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Deve iniziare con una lettera o un trattino basso.<\/span> <span class=\"sg\" data-s=\"3\">Dopo, può contenere lettere, cifre, trattini bassi, virgolette singole (apostrofi) e trattini.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dopo un apostrofo o un trattino deve esserci una lettera.<\/span> <span class=\"sg\" data-s=\"1\">Negli identificatori gli apostrofi sono rari.<\/span> <span class=\"sg\" data-s=\"2\">I trattini, invece, si usano molto, perché rendono i nomi più espressivi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni esempi di nomi di funzioni validi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"lv":{"t":"Funkciju nosaukumi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Funkcijas nosaukums ir identifikators.<\/span> <span class=\"sg\" data-s=\"1\">Tas ievēro tos pašus noteikumus kā <a href=\"https://course.raku.org/lv/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">mainīgo nosaukumi<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tam jāsākas ar burtu vai pasvītrojuma zīmi.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam tajā var būt jebkuri burti, cipari, pasvītrojuma zīmes, vienpēdiņas (apostrofi) un domuzīmes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc apostrofa vai domuzīmes jābūt burtam.<\/span> <span class=\"sg\" data-s=\"1\">Identifikatoros apostrofi ir reti.<\/span> <span class=\"sg\" data-s=\"2\">Taču domuzīmes lieto bieži, jo tās padara nosaukumus izteiksmīgākus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, daži derīgu funkciju nosaukumu piemēri.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"ru":{"t":"Имена функций","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Имя функции — это идентификатор.<\/span> <span class=\"sg\" data-s=\"1\">Оно следует тем же правилам, что и <a href=\"https://course.raku.org/ru/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имена переменных<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Оно должно начинаться с буквы или символа подчёркивания.<\/span> <span class=\"sg\" data-s=\"3\">После этого в нём могут быть любые буквы, цифры, подчёркивания, одиночные кавычки (апострофы) и дефисы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За апострофом или дефисом должна идти буква.<\/span> <span class=\"sg\" data-s=\"1\">Апострофы в идентификаторах встречаются редко.<\/span> <span class=\"sg\" data-s=\"2\">А вот дефисы используются часто, потому что они делают имена выразительнее.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот несколько примеров допустимых имён функций.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"uk":{"t":"Імена функцій","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ім'я функції — це ідентифікатор.<\/span> <span class=\"sg\" data-s=\"1\">Для нього діють ті самі правила, що й для <a href=\"https://course.raku.org/uk/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">імен змінних<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Воно має починатися з літери або підкреслення.<\/span> <span class=\"sg\" data-s=\"3\">Після цього в ньому можуть бути будь-які літери, цифри, підкреслення, одинарні лапки (апострофи) і дефіси.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Після апострофа або дефіса має йти літера.<\/span> <span class=\"sg\" data-s=\"1\">В ідентифікаторах апострофи трапляються рідко.<\/span> <span class=\"sg\" data-s=\"2\">А от дефіси вживають часто, бо вони роблять імена виразнішими.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось кілька прикладів допустимих імен функцій.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"bg":{"t":"Имена на функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Името на функцията е идентификатор.<\/span> <span class=\"sg\" data-s=\"1\">То следва същите правила като <a href=\"https://course.raku.org/bg/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">имената на променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">То трябва да започва с буква или долна черта.<\/span> <span class=\"sg\" data-s=\"3\">След това може да съдържа всякакви букви, цифри, долни черти, единични кавички (апострофи) и тирета.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">След апостроф или тире трябва да следва буква.<\/span> <span class=\"sg\" data-s=\"1\">Апострофите са рядкост в идентификаторите.<\/span> <span class=\"sg\" data-s=\"2\">Тиретата обаче се използват много, защото правят имената по-изразителни.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето няколко примера за валидни имена на функции.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">greet-them<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">hello-world<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumberOfItems<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">is-valid<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">to_be-or-not_to_be<\/span><\/p>"]]},"eo":{"t":"Funkciaj nomoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La nomo de funkcio estas identigilo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi sekvas la samajn regulojn kiel <a href=\"https://course.raku.org/eo/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomoj de variabloj<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi devas komenciĝi per litero aŭ substreko.<\/span> <span class=\"sg\" data-s=\"3\">Post tio, ĝi povas enhavi ajnajn literojn, ciferojn, substrekojn, unuopajn citilojn (apostrofojn) kaj streketojn.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Post apostrofo aŭ streketo devas sekvi litero.<\/span> <span class=\"sg\" data-s=\"1\">Apostrofoj estas maloftaj en identigiloj.<\/span> <span class=\"sg\" data-s=\"2\">Streketoj tamen estas multe uzataj, ĉar ili faras nomojn pli esprimplenaj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj ekzemploj de validaj funkciaj nomoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salutu-ilin<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluton-mondo<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NombroDeElementoj<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">estas-valida<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esti_aŭ_ne_esti<\/span><\/p>"]]},"la":{"t":"Nomina functionum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomen functionis est identificator.<\/span> <span class=\"sg\" data-s=\"1\">Easdem regulas sequitur ac <a href=\"https://course.raku.org/la/essentials/scalar-variables/identifiers/\" target=\"_blank\" rel=\"noopener\">nomina variabilium<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">A littera vel ab underscore incipere debet.<\/span> <span class=\"sg\" data-s=\"3\">Postea quaslibet litteras, digitos, underscores, apices singulos (apostrophos) et hyphenas continere potest.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Post apostrophum vel hyphenam littera sequi debet.<\/span> <span class=\"sg\" data-s=\"1\">Apostrophi in identificatoribus rari sunt.<\/span> <span class=\"sg\" data-s=\"2\">Hyphenae autem saepe adhibentur, quia nomina plus dicere sinunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce pauca exempla validorum nominum functionum.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">saluta-illos<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">salve-mundum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">NumerusRerum<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">est-validus<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">esse-vel-non_esse<\/span><\/p>"]]}}}</script>
