<script type="application/json" id="page-data">{"u":"essentials/functions/return-result","n":274,"k":"topic","pv":"essentials/functions/function-parameters/quiz2","nx":"essentials/functions/return-result/quiz","tr":["essentials","essentials/functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Returning the result","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Functions often do something and also return a result.<\/span> <span class=\"sg\" data-s=\"1\">For example, in functional programming, functions should not have side effects.<\/span> <span class=\"sg\" data-s=\"2\">Printing to the console is such a side effect.<\/span> <span class=\"sg\" data-s=\"3\">But Raku does not stop you from doing this.<\/span> <span class=\"sg\" data-s=\"4\">Let us see how a function returns a value.<\/span> <span class=\"sg\" data-s=\"5\">We will also see how the calling code gets it.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the function <code>add<\/code> takes two numbers and returns their sum.<\/span> <span class=\"sg\" data-s=\"1\">It uses an explicit <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The calling code can use the returned value like any other value.<\/span> <span class=\"sg\" data-s=\"3\">In the program above, it is assigned to a variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The last calculated value<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, an explicit <code>return<\/code> is not always required.<\/span> <span class=\"sg\" data-s=\"1\">You can skip it when the result is the last value that the function calculates.<\/span> <span class=\"sg\" data-s=\"2\">So our <code>add<\/code> function can be simpler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You may have noticed that the line has no semicolon at the end.<\/span> <span class=\"sg\" data-s=\"1\">It is not needed, because this line ends the code block.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Small and simple functions like this are often written on a single line.<\/span> <span class=\"sg\" data-s=\"1\">This makes the code more compact:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No return data<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need to return from a function before the end of its body.<\/span> <span class=\"sg\" data-s=\"1\">If the function does not return any result, use <code>return<\/code> on its own.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"de":{"t":"Das Ergebnis zurückgeben","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Funktionen tun oft etwas und geben auch ein Ergebnis zurück.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel sollen Funktionen in der funktionalen Programmierung keine Nebeneffekte haben.<\/span> <span class=\"sg\" data-s=\"2\">Das Drucken auf die Konsole ist so ein Nebeneffekt.<\/span> <span class=\"sg\" data-s=\"3\">Aber Raku hindert dich nicht daran, das zu tun.<\/span> <span class=\"sg\" data-s=\"4\">Schauen wir uns an, wie eine Funktion einen Wert zurückgibt.<\/span> <span class=\"sg\" data-s=\"5\">Wir sehen auch, wie der aufrufende Code ihn bekommt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier nimmt die Funktion <code>add<\/code> zwei Zahlen und gibt ihre Summe zurück.<\/span> <span class=\"sg\" data-s=\"1\">Sie verwendet ein explizites <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der aufrufende Code kann den zurückgegebenen Wert wie jeden anderen Wert verwenden.<\/span> <span class=\"sg\" data-s=\"3\">Im Programm oben wird er einer Variablen zugewiesen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der zuletzt berechnete Wert<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku ist ein explizites <code>return<\/code> nicht immer nötig.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst es weglassen, wenn das Ergebnis der letzte Wert ist, den die Funktion berechnet.<\/span> <span class=\"sg\" data-s=\"2\">So kann unsere <code>add<\/code>-Funktion einfacher sein:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast vielleicht bemerkt, dass die Zeile am Ende kein Semikolon hat.<\/span> <span class=\"sg\" data-s=\"1\">Es ist nicht nötig, weil diese Zeile den Codeblock beendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kleine und einfache Funktionen wie diese schreibt man oft in eine einzige Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Das macht den Code kompakter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Keine Rückgabedaten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Manchmal musst du vor dem Ende des Körpers aus einer Funktion zurückkehren.<\/span> <span class=\"sg\" data-s=\"1\">Wenn die Funktion kein Ergebnis zurückgibt, verwende <code>return<\/code> allein.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"nl":{"t":"Het resultaat teruggeven","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Functies doen vaak iets en geven ook een resultaat terug.<\/span> <span class=\"sg\" data-s=\"1\">In functionele programmering horen functies bijvoorbeeld geen bijwerkingen te hebben.<\/span> <span class=\"sg\" data-s=\"2\">Printen naar de console is zo'n bijwerking.<\/span> <span class=\"sg\" data-s=\"3\">Maar Raku houdt je niet tegen als je dat wilt doen.<\/span> <span class=\"sg\" data-s=\"4\">Laten we kijken hoe een functie een waarde teruggeeft.<\/span> <span class=\"sg\" data-s=\"5\">We zien ook hoe de aanroepende code die waarde krijgt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier krijgt de functie <code>add<\/code> twee getallen en geeft hun som terug.<\/span> <span class=\"sg\" data-s=\"1\">De functie gebruikt een expliciete <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De aanroepende code kan de teruggegeven waarde gebruiken zoals elke andere waarde.<\/span> <span class=\"sg\" data-s=\"3\">In het programma hierboven wordt die waarde aan een variabele toegewezen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De laatst berekende waarde<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku is een expliciete <code>return<\/code> niet altijd nodig.<\/span> <span class=\"sg\" data-s=\"1\">Je mag die weglaten als het resultaat de laatste waarde is die de functie berekent.<\/span> <span class=\"sg\" data-s=\"2\">Onze functie <code>add<\/code> kan dus eenvoudiger:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Misschien heb je gezien dat de regel geen puntkomma aan het einde heeft.<\/span> <span class=\"sg\" data-s=\"1\">Die is niet nodig, omdat deze regel het codeblok afsluit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kleine en eenvoudige functies zoals deze worden vaak op één regel geschreven.<\/span> <span class=\"sg\" data-s=\"1\">Zo wordt de code compacter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geen retourgegevens<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Soms moet je uit een functie terugkeren voordat het einde van het lichaam bereikt is.<\/span> <span class=\"sg\" data-s=\"1\">Als de functie geen resultaat teruggeeft, gebruik dan alleen <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is boven de limiet\";\n}<\/code><\/pre>"]]},"es":{"t":"Devolver el resultado","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Las funciones a menudo hacen algo y también devuelven un resultado.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, en la programación funcional, las funciones no deben tener efectos secundarios.<\/span> <span class=\"sg\" data-s=\"2\">Imprimir en la consola es uno de esos efectos secundarios.<\/span> <span class=\"sg\" data-s=\"3\">Pero Raku no te impide hacerlo.<\/span> <span class=\"sg\" data-s=\"4\">Veamos cómo una función devuelve un valor.<\/span> <span class=\"sg\" data-s=\"5\">También veremos cómo lo recibe el código que llama.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, la función <code>add<\/code> toma dos números y devuelve su suma.<\/span> <span class=\"sg\" data-s=\"1\">Usa un <code>return<\/code> explícito.<\/span> <span class=\"sg\" data-s=\"2\">El código que llama puede usar el valor devuelto como cualquier otro valor.<\/span> <span class=\"sg\" data-s=\"3\">En el programa de arriba, el valor se asigna a una variable.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El último valor calculado<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, un <code>return<\/code> explícito no siempre es necesario.<\/span> <span class=\"sg\" data-s=\"1\">Puedes omitirlo cuando el resultado es el último valor que calcula la función.<\/span> <span class=\"sg\" data-s=\"2\">Así nuestra función <code>add<\/code> puede ser más simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quizás has notado que la línea no tiene punto y coma al final.<\/span> <span class=\"sg\" data-s=\"1\">No hace falta, porque esta línea termina el bloque de código.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las funciones pequeñas y simples como esta a menudo se escriben en una sola línea.<\/span> <span class=\"sg\" data-s=\"1\">Esto hace el código más compacto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sin datos de retorno<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas retornar de una función antes del final de su cuerpo.<\/span> <span class=\"sg\" data-s=\"1\">Si la función no devuelve ningún resultado, usa <code>return<\/code> sin nada más.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x está por encima del límite\";\n}<\/code><\/pre>"]]},"it":{"t":"Restituzione del risultato","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Spesso le funzioni fanno qualcosa e restituiscono anche un risultato.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, nella programmazione funzionale, le funzioni non dovrebbero avere effetti collaterali.<\/span> <span class=\"sg\" data-s=\"2\">Stampare sulla console è un effetto collaterale di questo tipo.<\/span> <span class=\"sg\" data-s=\"3\">Ma Raku non ti impedisce di farlo.<\/span> <span class=\"sg\" data-s=\"4\">Vediamo come una funzione restituisce un valore.<\/span> <span class=\"sg\" data-s=\"5\">Vedremo anche come il codice chiamante lo riceve.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui, la funzione <code>add<\/code> prende due numeri e restituisce la loro somma.<\/span> <span class=\"sg\" data-s=\"1\">Usa un <code>return<\/code> esplicito.<\/span> <span class=\"sg\" data-s=\"2\">Il codice chiamante può usare il valore restituito come qualsiasi altro valore.<\/span> <span class=\"sg\" data-s=\"3\">Nel programma sopra, il valore viene assegnato a una variabile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">L'ultimo valore calcolato<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, un <code>return<\/code> esplicito non è sempre necessario.<\/span> <span class=\"sg\" data-s=\"1\">Puoi non scriverlo quando il risultato è l'ultimo valore che la funzione calcola.<\/span> <span class=\"sg\" data-s=\"2\">Così la nostra funzione <code>add<\/code> può essere più semplice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Forse hai notato che la riga non ha il punto e virgola alla fine.<\/span> <span class=\"sg\" data-s=\"1\">Non serve, perché questa riga chiude il blocco di codice.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funzioni piccole e semplici come questa sono spesso scritte su una sola riga.<\/span> <span class=\"sg\" data-s=\"1\">Questo rende il codice più compatto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nessun dato di ritorno<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A volte devi uscire da una funzione prima della fine del suo corpo.<\/span> <span class=\"sg\" data-s=\"1\">Se la funzione non restituisce nessun risultato, usa <code>return<\/code> da solo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"lv":{"t":"Rezultāta atgriešana","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Funkcijas bieži kaut ko dara un arī atgriež rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, funkcionālajā programmēšanā funkcijām nevajadzētu būt blakusparādībām.<\/span> <span class=\"sg\" data-s=\"2\">Drukāšana uz konsoles ir šāda blakusparādība.<\/span> <span class=\"sg\" data-s=\"3\">Bet Raku jums netraucē to darīt.<\/span> <span class=\"sg\" data-s=\"4\">Apskatīsim, kā funkcija atgriež vērtību.<\/span> <span class=\"sg\" data-s=\"5\">Mēs arī redzēsim, kā izsaucošais kods to saņem.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit funkcija <code>add<\/code> pieņem divus skaitļus un atgriež to summu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izmanto skaidru <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Izsaucošais kods var izmantot atgriezto vērtību kā jebkuru citu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Programmā augstāk tā tiek piešķirta mainīgajam.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pēdējā aprēķinātā vērtība<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā skaidrs <code>return<\/code> ne vienmēr ir vajadzīgs.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to izlaist, ja rezultāts ir pēdējā vērtība, ko funkcija aprēķina.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc mūsu <code>add<\/code> funkcija var būt vienkāršāka:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varbūt pamanījāt, ka rindas beigās nav semikola.<\/span> <span class=\"sg\" data-s=\"1\">Tas nav vajadzīgs, jo šī rinda beidz koda bloku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šādas mazas un vienkāršas funkcijas bieži raksta vienā rindā.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara kodu kompaktāku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nav atgriežamo datu<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums jāatgriežas no funkcijas pirms tās ķermeņa beigām.<\/span> <span class=\"sg\" data-s=\"1\">Ja funkcija neatgriež nekādu rezultātu, izmantojiet <code>return<\/code> vienu pašu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x ir virs limita\";\n}<\/code><\/pre>"]]},"ru":{"t":"Возврат результата","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функции часто что-то делают и ещё возвращают результат.<\/span> <span class=\"sg\" data-s=\"1\">Например, в функциональном программировании у функций не должно быть побочных эффектов.<\/span> <span class=\"sg\" data-s=\"2\">Вывод на консоль — как раз такой побочный эффект.<\/span> <span class=\"sg\" data-s=\"3\">Но Raku не запрещает вам так делать.<\/span> <span class=\"sg\" data-s=\"4\">Давайте посмотрим, как функция возвращает значение.<\/span> <span class=\"sg\" data-s=\"5\">Мы также увидим, как вызывающий код его получает.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь функция <code>add<\/code> принимает два числа и возвращает их сумму.<\/span> <span class=\"sg\" data-s=\"1\">Она использует явный <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вызывающий код может использовать возвращённое значение как любое другое.<\/span> <span class=\"sg\" data-s=\"3\">В программе выше оно присваивается переменной.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последнее вычисленное значение<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku явный <code>return<\/code> нужен не всегда.<\/span> <span class=\"sg\" data-s=\"1\">Его можно не писать, когда результат — это последнее значение, которое вычисляет функция.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому нашу функцию <code>add<\/code> можно упростить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы, наверное, заметили, что в конце строки нет точки с запятой.<\/span> <span class=\"sg\" data-s=\"1\">Она не нужна, потому что эта строка заканчивает блок кода.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такие маленькие и простые функции часто записывают в одну строку.<\/span> <span class=\"sg\" data-s=\"1\">Так код становится компактнее:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отсутствие возвращаемых данных<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно выйти из функции до конца её тела.<\/span> <span class=\"sg\" data-s=\"1\">Если функция не возвращает никакого результата, используйте просто <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x is above the limit\";\n}<\/code><\/pre>"]]},"uk":{"t":"Повернення результату","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функції часто щось роблять і також повертають результат.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, у функціональному програмуванні функції не повинні мати побічних ефектів.<\/span> <span class=\"sg\" data-s=\"2\">Виведення на консоль — саме такий побічний ефект.<\/span> <span class=\"sg\" data-s=\"3\">Але Raku не забороняє вам це робити.<\/span> <span class=\"sg\" data-s=\"4\">Давайте подивимося, як функція повертає значення.<\/span> <span class=\"sg\" data-s=\"5\">Ми також побачимо, як його отримує код, що викликає функцію.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут функція <code>add<\/code> приймає два числа і повертає їхню суму.<\/span> <span class=\"sg\" data-s=\"1\">Вона використовує явне <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Код, що викликає функцію, може використовувати повернене значення як будь-яке інше.<\/span> <span class=\"sg\" data-s=\"3\">У програмі вище його присвоюють змінній.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Останнє обчислене значення<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku явне <code>return<\/code> потрібне не завжди.<\/span> <span class=\"sg\" data-s=\"1\">Його можна пропустити, коли результат — це останнє значення, яке обчислює функція.<\/span> <span class=\"sg\" data-s=\"2\">Тож наша функція <code>add<\/code> може бути простішою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви могли помітити, що в кінці рядка немає крапки з комою.<\/span> <span class=\"sg\" data-s=\"1\">Вона не потрібна, бо цей рядок завершує блок коду.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такі маленькі й прості функції часто записують в один рядок.<\/span> <span class=\"sg\" data-s=\"1\">Так код стає компактнішим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Відсутність даних для повернення<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іноді вам потрібно повернутися з функції до кінця її тіла.<\/span> <span class=\"sg\" data-s=\"1\">Якщо функція не повертає жодного результату, використовуйте <code>return<\/code> саме по собі.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x перевищує ліміт\";\n}<\/code><\/pre>"]]},"bg":{"t":"Връщане на резултат","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Функциите често правят нещо и също така връщат резултат.<\/span> <span class=\"sg\" data-s=\"1\">Например във функционалното програмиране функциите не трябва да имат странични ефекти.<\/span> <span class=\"sg\" data-s=\"2\">Печатането на конзолата е такъв страничен ефект.<\/span> <span class=\"sg\" data-s=\"3\">Но Raku не ви спира да го правите.<\/span> <span class=\"sg\" data-s=\"4\">Нека видим как функцията връща стойност.<\/span> <span class=\"sg\" data-s=\"5\">Ще видим също как извикващият код я получава.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук функцията <code>add<\/code> приема две числа и връща тяхната сума.<\/span> <span class=\"sg\" data-s=\"1\">Тя използва явен <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Извикващият код може да използва върнатата стойност като всяка друга стойност.<\/span> <span class=\"sg\" data-s=\"3\">В програмата по-горе тя се присвоява на променлива.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Последната изчислена стойност<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku явен <code>return<\/code> не винаги е необходим.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го пропуснете, когато резултатът е последната стойност, която функцията изчислява.<\/span> <span class=\"sg\" data-s=\"2\">Затова нашата функция <code>add<\/code> може да бъде по-проста:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Може би сте забелязали, че редът няма точка и запетая в края.<\/span> <span class=\"sg\" data-s=\"1\">Тя не е нужна, защото този ред завършва блока код.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Малки и прости функции като тази често се пишат на един-единствен ред.<\/span> <span class=\"sg\" data-s=\"1\">Това прави кода по-компактен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Няма данни за връщане<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Понякога трябва да излезете от функцията преди края на нейното тяло.<\/span> <span class=\"sg\" data-s=\"1\">Ако функцията не връща никакъв резултат, използвайте само <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x е над лимита\";\n}<\/code><\/pre>"]]},"eo":{"t":"Redonante la rezulton","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Funkcioj ofte faras ion kaj ankaŭ redonas rezulton.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, en funkcia programado, funkcioj ne devus havi flankajn efikojn.<\/span> <span class=\"sg\" data-s=\"2\">Presi al la konzolo estas tia flanka efiko.<\/span> <span class=\"sg\" data-s=\"3\">Sed Raku ne malhelpas vin fari tion.<\/span> <span class=\"sg\" data-s=\"4\">Ni vidu, kiel funkcio redonas valoron.<\/span> <span class=\"sg\" data-s=\"5\">Ni ankaŭ vidos, kiel la vokanta kodo ricevas ĝin.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la funkcio <code>add<\/code> prenas du nombrojn kaj redonas ilian sumon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi uzas eksplicitan <code>return<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La vokanta kodo povas uzi la redonitan valoron kiel ajnan alian valoron.<\/span> <span class=\"sg\" data-s=\"3\">En la supra programo, ĝi estas asignita al variablo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La laste kalkulita valoro<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, eksplicita <code>return<\/code> ne ĉiam estas necesa.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas preterlasi ĝin, kiam la rezulto estas la lasta valoro, kiun la funkcio kalkulas.<\/span> <span class=\"sg\" data-s=\"2\">Do nia funkcio <code>add<\/code> povas esti pli simpla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eble vi rimarkis, ke la linio ne havas punkto-komon ĉe la fino.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne estas necesa, ĉar ĉi tiu linio finas la kodoblokon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tiajn malgrandajn kaj simplajn funkciojn oni ofte skribas en unu sola linio.<\/span> <span class=\"sg\" data-s=\"1\">Tio faras la kodon pli kompakta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neniu redona datumoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje vi devas reveni el funkcio antaŭ la fino de ĝia korpo.<\/span> <span class=\"sg\" data-s=\"1\">Se la funkcio ne redonas ian rezulton, uzu nur <code>return<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x estas super la limo\";\n}<\/code><\/pre>"]]},"la":{"t":"Redonando resultatum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Functiones saepe aliquid faciunt et etiam eventum reddunt.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, in programmate functionali functiones effectus laterales habere non debent.<\/span> <span class=\"sg\" data-s=\"2\">Imprimere ad consolam est talis effectus lateralis.<\/span> <span class=\"sg\" data-s=\"3\">Sed Raku te hoc facere non prohibet.<\/span> <span class=\"sg\" data-s=\"4\">Videamus quomodo functio valorem reddit.<\/span> <span class=\"sg\" data-s=\"5\">Etiam videbimus quomodo codex vocans eum accipit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    return $x + $y;\n}\n\nmy $sum = add(10, 20);\nsay $sum; # 30<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic functio <code>add<\/code> duos numeros accipit et summam eorum reddit.<\/span> <span class=\"sg\" data-s=\"1\">Ea <code>return<\/code> explicitum adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Codex vocans valorem redditum sicut quemlibet alium valorem adhibere potest.<\/span> <span class=\"sg\" data-s=\"3\">In programmate supra variabili assignatur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ultimus valor computatus<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku <code>return<\/code> explicitum non semper requiritur.<\/span> <span class=\"sg\" data-s=\"1\">Id omittere potes, cum eventus est ultimus valor quem functio computat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque functio nostra <code>add<\/code> simplicior esse potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    $x + $y\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fortasse vidisti lineam in fine punctum-commatum non habere.<\/span> <span class=\"sg\" data-s=\"1\">Non necessarium est, quia haec linea clausulam codicis finit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tales parvae et simplices functiones saepe in una sola linea scribuntur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc codicem breviorem facit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) { $x + $y }<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nullus reditus data<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interdum ex functione redire debes ante finem corporis eius.<\/span> <span class=\"sg\" data-s=\"1\">Si functio nullum eventum reddit, utere <code>return<\/code> solo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub test($x) {\n    return if $x &lt;= 10;\n    say \"$x est supra limitem\";\n}<\/code><\/pre>"]]}}}</script>
