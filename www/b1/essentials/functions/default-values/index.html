<script type="application/json" id="page-data">{"u":"essentials/functions/default-values","n":281,"k":"topic","pv":"essentials/functions/named-parameters/quiz2","nx":"essentials/functions/default-values/quiz1","tr":["essentials","essentials/functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Default values","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Both positional and named parameters can have default values.<\/span> <span class=\"sg\" data-s=\"1\">If a parameter has a default value, you may skip it in a function call.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positional parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is an example of a default value for a positional parameter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In the first call, the name is the only argument, so the result is <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The second call uses the default value and prints <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If a function has several parameters, only the last ones can have default values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # WRONG<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Named parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You set default values for named parameters with the same syntax:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The order of named parameters does not matter.<\/span> <span class=\"sg\" data-s=\"1\">So any of them can have a default value, even the first one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"de":{"t":"Standardwerte","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sowohl Positionsparameter als auch benannte Parameter können Standardwerte haben.<\/span> <span class=\"sg\" data-s=\"1\">Wenn ein Parameter einen Standardwert hat, dürfen Sie ihn beim Aufruf der Funktion weglassen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionsparameter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Beispiel für einen Standardwert bei einem Positionsparameter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beim ersten Aufruf ist der Name das einzige Argument, deshalb ist das Ergebnis <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der zweite Aufruf verwendet den Standardwert und druckt <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Funktion mehrere Parameter hat, können nur die letzten Parameter Standardwerte haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # korrekt\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSCH<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benannte Parameter<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Standardwerte für benannte Parameter setzen Sie mit der gleichen Syntax:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Reihenfolge der benannten Parameter spielt keine Rolle.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb kann jeder von ihnen einen Standardwert haben, sogar der erste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"nl":{"t":"Standaardwaarden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zowel positionele als benoemde parameters kunnen standaardwaarden hebben.<\/span> <span class=\"sg\" data-s=\"1\">Als een parameter een standaardwaarde heeft, mag je hem weglaten in een functieaanroep.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Positionele parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een voorbeeld van een standaardwaarde voor een positionele parameter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In de eerste aanroep is de naam het enige argument, dus het resultaat is <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De tweede aanroep gebruikt de standaardwaarde en print <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als een functie meerdere parameters heeft, kunnen alleen de laatste parameters standaardwaarden hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correct\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FOUT<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benoemde parameters<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je geeft benoemde parameters standaardwaarden met dezelfde syntaxis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgorde van benoemde parameters maakt niet uit.<\/span> <span class=\"sg\" data-s=\"1\">Dus elke parameter kan een standaardwaarde hebben, zelfs de eerste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"es":{"t":"Valores predeterminados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tanto los parámetros posicionales como los nombrados pueden tener valores predeterminados.<\/span> <span class=\"sg\" data-s=\"1\">Si un parámetro tiene un valor predeterminado, puedes omitirlo en la llamada a la función.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros posicionales<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un ejemplo de un valor predeterminado para un parámetro posicional:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En la primera llamada, el nombre es el único argumento, así que el resultado es <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La segunda llamada usa el valor predeterminado e imprime <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si una función tiene varios parámetros, solo los últimos pueden tener valores predeterminados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # correcto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # INCORRECTO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros nombrados<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Usas la misma sintaxis para dar valores predeterminados a los parámetros nombrados:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El orden de los parámetros nombrados no importa.<\/span> <span class=\"sg\" data-s=\"1\">Así que cualquiera de ellos puede tener un valor predeterminado, incluso el primero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"it":{"t":"Valori predefiniti","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sia i parametri posizionali che quelli nominati possono avere valori predefiniti.<\/span> <span class=\"sg\" data-s=\"1\">Se un parametro ha un valore predefinito, puoi saltarlo nella chiamata della funzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri posizionali<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un esempio di valore predefinito per un parametro posizionale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella prima chiamata, il nome è l'unico argomento, quindi il risultato è <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La seconda chiamata usa il valore predefinito e stampa <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se una funzione ha più parametri, solo gli ultimi possono avere valori predefiniti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # corretto\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # SBAGLIATO<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Imposti i valori predefiniti dei parametri nominati con la stessa sintassi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'ordine dei parametri nominati non importa.<\/span> <span class=\"sg\" data-s=\"1\">Quindi ognuno di essi può avere un valore predefinito, anche il primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"lv":{"t":"Noklusējuma vērtības","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gan pozicionālajiem, gan nosauktajiem parametriem var būt noklusējuma vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Ja parametram ir noklusējuma vērtība, jūs varat to izlaist funkcijas izsaukumā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pozicionālie parametri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, noklusējuma vērtības piemērs pozicionālam parametram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pirmajā izsaukumā vārds ir vienīgais arguments, tāpēc rezultāts ir <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Otrais izsaukums izmanto noklusējuma vērtību un izdrukā <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja funkcijai ir vairāki parametri, noklusējuma vērtības var būt tikai pēdējiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # pareizi\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # NEPAREIZI<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosauktie parametri<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nosauktajiem parametriem jūs iestatāt noklusējuma vērtības ar to pašu sintaksi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nosaukto parametru secība nav svarīga.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jebkuram no tiem var būt noklusējuma vērtība, pat pirmajam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"ru":{"t":"Значения по умолчанию","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И позиционные, и именованные параметры могут иметь значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">Если у параметра есть значение по умолчанию, его можно пропустить при вызове функции.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционные параметры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот пример значения по умолчанию для позиционного параметра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В первом вызове имя — единственный аргумент, поэтому результат — <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второй вызов использует значение по умолчанию и выводит <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если у функции несколько параметров, значения по умолчанию могут быть только у последних:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные параметры<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значения по умолчанию для именованных параметров вы задаёте тем же синтаксисом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порядок именованных параметров не важен.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому значение по умолчанию может быть у любого из них, даже у первого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"uk":{"t":"Значення за замовчуванням","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">І позиційні, і іменовані параметри можуть мати значення за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Якщо параметр має значення за замовчуванням, його можна пропустити у виклику функції.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиційні параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приклад значення за замовчуванням для позиційного параметра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У першому виклику ім'я — єдиний аргумент, тому результат — <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Другий виклик використовує значення за замовчуванням і виводить <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо функція має кілька параметрів, значення за замовчуванням можуть мати лише останні з них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правильно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # НЕПРАВИЛЬНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви задаєте значення за замовчуванням для іменованих параметрів тим самим синтаксисом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Порядок іменованих параметрів не має значення.<\/span> <span class=\"sg\" data-s=\"1\">Тому будь-який з них може мати значення за замовчуванням, навіть перший:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"bg":{"t":"Стойности по подразбиране","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">И позиционните, и именуваните параметри могат да имат стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Ако даден параметър има стойност по подразбиране, можете да го пропуснете при извикване на функцията.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Позиционни параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето пример за стойност по подразбиране на позиционен параметър:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В първото извикване името е единственият аргумент, затова резултатът е <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Второто извикване използва стойността по подразбиране и отпечатва <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако функцията има няколко параметъра, само последните от тях могат да имат стойности по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # правилно\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # ГРЕШНО<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани параметри<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стойностите по подразбиране за именувани параметри задавате със същия синтаксис:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Редът на именуваните параметри няма значение.<\/span> <span class=\"sg\" data-s=\"1\">Затова всеки от тях може да има стойност по подразбиране, дори първият:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"eo":{"t":"Defaŭltaj valoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kaj poziciaj kaj nomitaj parametroj povas havi defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Se parametro havas defaŭltan valoron, vi povas preterlasi ĝin en funkcia voko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Poziciaj parametroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen ekzemplo de defaŭlta valoro por pozicia parametro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet('Merinda');\ngreet();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En la unua voko, la nomo estas la sola argumento, do la rezulto estas <code>Hello, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La dua voko uzas la defaŭltan valoron kaj presas <code>Hello, World!<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se funkcio havas plurajn parametrojn, nur la lastaj povas havi defaŭltajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # ĝuste\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # MALĜUSTE<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj parametroj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi donas defaŭltajn valorojn al nomitaj parametroj per la sama sintakso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$name = 'World') {\n    say \"Hello, $name!\";\n}\n\ngreet(name =&gt; 'Merinda'); # Hello, Merinda!\ngreet(); # Hello, World!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ordo de nomitaj parametroj ne gravas.<\/span> <span class=\"sg\" data-s=\"1\">Do iu ajn el ili povas havi defaŭltan valoron, eĉ la unua:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet(:$greeting = 'Hello', :$name) {\n    say \"$greeting, $name!\";\n}\n\ngreet(name =&gt; 'Alla'); # Hello, Alla!<\/code><\/pre>"]]},"la":{"t":"Defaulte valores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Et parametri positionis et nominati valores praedefinitos habere possunt.<\/span> <span class=\"sg\" data-s=\"1\">Si parameter valorem praedefinitum habet, eum in vocatione functionis omittere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri positionis<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce exemplum valoris praedefiniti pro parametro positionis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta($nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta('Merinda');\nsaluta();<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In prima vocatione nomen est solum argumentum, itaque eventus est <code>Salve, Merinda!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vocatio valorem praedefinitum adhibet et <code>Salve, Mundus!<\/code> imprimit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si functio plures parametros habet, solum ultimi valores praedefinitos habere possunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($a, $b, $c = 42, $d = 50) { . . . } # rectum\n# sub f($a = 10, $b = 20, $c, $d) { . . . } # FALSUM<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri nominati<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valores praedefinitos pro parametris nominatis eadem syntaxi statuis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$nomen = 'Mundus') {\n    say \"Salve, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Merinda'); # Salve, Merinda!\nsaluta(); # Salve, Mundus!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordo parametrorum nominatorum non refert.<\/span> <span class=\"sg\" data-s=\"1\">Itaque quilibet eorum valorem praedefinitum habere potest, etiam primus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta(:$salutatio = 'Salve', :$nomen) {\n    say \"$salutatio, $nomen!\";\n}\n\nsaluta(nomen =&gt; 'Alla'); # Salve, Alla!<\/code><\/pre>"]]}}}</script>
