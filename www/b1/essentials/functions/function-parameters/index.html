<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">More parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A function can take more than one parameter.<\/span> <span class=\"sg\" data-s=\"1\">In this case, list them all with commas between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No parameters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">It is fine for a function to take no parameters at all.<\/span> <span class=\"sg\" data-s=\"1\">Then you can either add an empty pair of parentheses or leave them out completely.<\/span> <span class=\"sg\" data-s=\"2\">We left them out at <a href=\"/essentials/functions/\">the beginning of this section<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signature<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The list of parameters of a function is called a <em>signature<\/em>.<\/span><\/p>"]]},"de":{"t":"Funktionsparameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt ist es Zeit, einer Funktion einige Daten zu übergeben.<\/span> <span class=\"sg\" data-s=\"1\">Eine Funktion kann Parameter nehmen, die du in Klammern direkt nach ihrem Namen aufschreibst.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hallo, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt kannst du die Funktion verwenden und ihr verschiedene Argumente übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt liefern die zwei Aufrufe derselben Funktion verschiedene Ergebnisse:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHallo, Alla!\nHallo, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parameter oder Argument<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Man verwendet diese zwei Begriffe oft so, als ob sie dasselbe bedeuten.<\/span> <span class=\"sg\" data-s=\"1\">Beide beziehen sich auf „dasselbe“, aber aus verschiedenen Blickwinkeln.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Ein Parameter ist das, was die Funktion erwartet.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Ein Argument ist das, was du ihr übergibst.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Beispiel oben ist <code>$name<\/code> der Parameter der Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Argumente sind <code>'Alla'<\/code> und <code>'Karl'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehrere Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Funktion kann mehr als einen Parameter nehmen.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall liste sie alle auf, mit Kommas dazwischen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Keine Parameter<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Funktion darf auch gar keine Parameter nehmen.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du entweder ein leeres Paar Klammern hinzufügen oder sie ganz weglassen.<\/span> <span class=\"sg\" data-s=\"2\">Am <a href=\"/essentials/functions/\">Anfang dieses Abschnitts<\/a> haben wir sie weggelassen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hallo, Welt!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signatur<\/span><\/h3>"],["p",1,"<p><span class=  functie kan meer dan één parameter aannemen.<\/span> <span class=\"sg\" data-s=\"1\">Zet ze in dat geval allemaal op een rij, met komma's ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Geen parameters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het is prima als een functie helemaal geen parameters aanneemt.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je een leeg paar haakjes toevoegen of de haakjes helemaal weglaten.<\/span> <span class=\"sg\" data-s=\"2\">We lieten ze weg aan <a href=\"/essentials/functions/\">het begin van deze sectie<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hallo, Wereld!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Handtekening<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De lijst van parameters van een functie wordt een <em>handtekening<\/em> genoemd.<\/span><\/p>"]]},"es":{"t":"Parámetros de funciones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora es hora de pasar algunos datos a una función.<\/span> <span class=\"sg\" data-s=\"1\">Una función puede tomar parámetros, que escribes entre paréntesis justo después de su nombre.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"¡Hola, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora puedes usar la función y pasarle diferentes argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora las dos llamadas a la misma función dan resultados diferentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\n¡Hola, Alla!\n¡Hola, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetro o argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La gente a menudo usa estos dos términos como si significaran lo mismo.<\/span> <span class=\"sg\" data-s=\"1\">Los dos se refieren a 'lo mismo', pero desde diferentes puntos de vista.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Un parámetro es lo que la función espera.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Un argumento es lo que le pasas.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En el ejemplo de arriba, <code>$name<\/code> es el parámetro de la función.<\/span> <span class=\"sg\" data-s=\"1\">Sus argumentos son <code>'Alla'<\/code> y <code>'Karl'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más parámetros<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una función puede tomar más de un parámetro.<\/span> <span class=\"sg\" data-s=\"1\">En este caso, escríbelos todos con comas entre ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sin parámetros<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Está bien que una función no tome ningún parámetro.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes agregar un par de paréntesis vacío u omitirlos por completo.<\/span> <span class=\"sg\" data-s=\"2\">Los omitimos al <a href=\"/essentials/functions/\">principio de esta sección<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say '¡Hola, Mundo!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Firma<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La lista de parámetros de una función se llama <em>firma<\/em>.<\/span><\/p>"]]},"it":{"t":"Parametri delle funzioni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora è ; # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nessun parametro<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Va bene anche se una funzione non prende nessun parametro.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi aggiungere una coppia di parentesi vuote oppure non metterle per niente.<\/span> <span class=\"sg\" data-s=\"2\">Non le abbiamo messe <a href=\"/essentials/functions/\">all'inizio di questa sezione<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Firma<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'elenco dei parametri di una funzione è chiamato <em>firma<\/em>.<\/span><\/p>"]]},"lv":{"t":"Funkciju parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad ir laiks nodot funkcijai datus.<\/span> <span class=\"sg\" data-s=\"1\">Funkcija var pieņemt parametrus, kurus jūs uzskaitāt iekavās uzreiz pēc tās nosaukuma.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Sveiki, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad jūs varat izmantot funkciju un nodot tai dažādus argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karlis');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad divi vienas funkcijas izsaukumi dod dažādus rezultātus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nSveiki, Alla!\nSveiki, Karlis!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametrs vai arguments<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cilvēki bieži lieto šos divus terminus tā, it kā tie nozīmētu to pašu.<\/span> <span class=\"sg\" data-s=\"1\">Abi attiecas uz 'to pašu lietu', bet no dažādiem skatpunktiem.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametrs ir tas, ko funkcija sagaida.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Arguments ir tas, ko jūs tai nododat.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējā piemērā <code>$name<\/code> ir funkcijas parametrs.<\/span> <span class=\"sg\" data-s=\"1\">Tās argumenti ir <code>'Alla'<\/code> un <code>'Karlis'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk parametru<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcija var pieņemt vairāk nekā vienu parametru.<\/span> <span class=\"sg\" data-s=\"1\">Šajā gadījumā uzskaitiet tos visus ar komatiem starp tiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bez parametriem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir normāli, ja funkcija nepieņem nevienu parametru.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat vai nu pievienot tukšu iekavu pāri, vai arī tās pilnībā izlaist.<\/span> <span class=\"sg\" data-s=\"2\">Mēs tās izlaidām <a href=\"/essentials/functions/\">šīs sadaļas sākumā<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Sveiki, Pasaule!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Paraksts<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Funkcijas parametru sarakstu sauc par <em>parakstu<\/em>.<\/span><\/p>"]]},"ru":{"t":"Параметры функций","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь пора передать данные в функцию.<\/span> <span class=\"sg\" data-s=\"1\">Функция может принимать параметры, которые вы перечисляете в скобках сразу после её имени.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь вы можете использовать функцию и передавать ей разные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь два вызова одной и той же функции дают разные результаты:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Алла!\nHello, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметр или аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти два термина часто используют так, будто они значат одно и то же.<\/span> <span class=\"sg\" data-s=\"1\">Оба относятся к «одному и тому же», но с разных точек зрения.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметр — это то, что ожидает функция.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент — это то, что вы передаете функции.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В примере выше <code>$name<\/code> — это параметр функции.<\/span> <span class=\"sg\" data-s=\"1\">Её аргументы — <code>'Алла'<\/code> и <code>'Карл'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Больше параметров<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функция может принимать больше одного параметра.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае перечислите их все через запятую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметров<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Функция может вообще не принимать параметров, и это нормально.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы можете либо добавить пустые скобки, либо совсем их не писать.<\/span> <span class=\"sg\" data-s=\"2\">Мы их не писали в <a href=\"/essentials/functions/\">начале этого раздела<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигнатура<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Список параметров функции называется <em>сигнатурой<\/em>.<\/span><\/p>"]]},"uk":{"t":"Параметри функцій","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер час передати функції деякі дані.<\/span> <span class=\"sg\" data-s=\"1\">Функція може приймати параметри, які ви перелічуєте в дужках одразу після її назви.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер ви можете використовувати функцію і передавати їй різні аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер два виклики тієї самої функції дають різні результати:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Алла!\nHello, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметр чи аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Люди часто вживають ці два терміни так, ніби вони означають одне й те саме.<\/span> <span class=\"sg\" data-s=\"1\">Обидва стосуються «одного й того самого», але з різних точок зору.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметр — це те, що очікує функція.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент — це те, що ви передаєте їй.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У прикладі вище <code>$name<\/code> — це параметр функції.<\/span> <span class=\"sg\" data-s=\"1\">Її аргументи — <code>'Алла'<\/code> і <code>'Карл'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше параметрів<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція може приймати більше ніж один параметр.<\/span> <span class=\"sg\" data-s=\"1\">У цьому випадку перелічіть їх усі через кому:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметрів<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Функція може зовсім не приймати параметрів, і це нормально.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви можете або додати порожню пару дужок, або зовсім їх пропустити.<\/span> <span class=\"sg\" data-s=\"2\">Ми пропустили їх на <a href=\"/essentials/functions/\">початку цього розділу<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Підпис<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Список параметрів функції називається <em>підписом<\/em>.<\/span><\/p>"]]},"bg":{"t":"Параметри на функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега е време да предадем някакви данни на функция.<\/span> <span class=\"sg\" data-s=\"1\">Функцията може да приема параметри, които изброявате в скоби веднага след нейното име.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Здравей, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега можете да използвате функцията и да ѝ предавате различни аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Алла');\ngreet('Карл');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега двете извиквания на една и съща функция дават различни резултати:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nЗдравей, Алла!\nЗдравей, Карл!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Параметър или аргумент<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хората често използват тези два термина, сякаш означават едно и също.<\/span> <span class=\"sg\" data-s=\"1\">И двата се отнасят до ‘едно и също нещо’, но от различни гледни точки.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Параметър е това, което функцията очаква.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Аргумент е това, което предавате на нея.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В горния пример <code>$name<\/code> е параметърът на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Нейните аргументи са <code>'Алла'<\/code> и <code>'Карл'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията може да приема повече от един параметър.<\/span> <span class=\"sg\" data-s=\"1\">В този случай ги изброете всичките, със запетаи между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Без параметри<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Нормално е функцията да не приема никакви параметри.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете или да добавите празни скоби, или да ги пропуснете напълно.<\/span> <span class=\"sg\" data-s=\"2\">Ние ги пропуснахме в <a href=\"/essentials/functions/\">началото на тази секция<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Здравей, свят!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Подпис<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Списъкът с параметри на функцията се нарича <em>подпис<\/em>.<\/span><\/p>"]]},"eo":{"t":"Funkciaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun estas tempo transdoni iom da datumoj al funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Funkcio povas preni parametrojn, kiujn vi listigas en krampoj tuj post ĝia nomo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Saluton, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun vi povas uzi la funkcion kaj transdoni al ĝi malsamajn argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la du vokoj de la sama funkcio donas malsamajn rezultojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nSaluton, Alla!\nSaluton, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametro aŭ argumento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Homoj ofte uzas ĉi tiujn du terminojn, kvazaŭ ili signifus la samon.<\/span> <span class=\"sg\" data-s=\"1\">Ambaŭ rilatas al ‘la sama afero’, sed el malsamaj vidpunktoj.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametro estas tio, kion la funkcio atendas.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Argumento estas tio, kion vi transdonas al ĝi.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En la supra ekzemplo, <code>$name<\/code> estas la parametro de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">Ĝiaj argumentoj estas <code>'Alla'<\/code> kaj <code>'Karl'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli da parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcio povas preni pli ol unu parametron.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu kazo, listigu ĉiujn, kun komoj inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sen parametroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas en ordo, se funkcio tute ne prenas parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas aŭ aldoni malplenan paron de krampoj, aŭ tute preterlasi ilin.<\/span> <span class=\"sg\" data-s=\"2\">Ni preterlasis ilin ĉe <a href=\"/essentials/functions/\">la komenco de ĉi tiu sekcio<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Saluton, Mondo!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subskribo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La listo de parametroj de funkcio nomiĝas <em>subskribo<\/em>.<\/span><\/p>"]]},"la":{"t":"Parametra functionum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc tempus est aliqua data ad functionem transmittere.<\/span> <span class=\"sg\" data-s=\"1\">Functio parametra accipere potest, quae in parenthesibus statim post nomen eius enumeras.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc functione uti potes et ei diversa argumenta transmittere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>greet('Alla');\ngreet('Karl');<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc duae vocationes eiusdem functionis diversos eventus dant:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHello, Alla!\nHello, Karl!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametrum vel argumentum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Homines hos duos terminos saepe adhibent quasi idem significent.<\/span> <span class=\"sg\" data-s=\"1\">Ambo ad ‘eandem rem’ spectant, sed ex diversis prospectibus.<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\">Parametrum est quod functio expectat.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Argumentum est quod ei transmittis.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In exemplo supra <code>$name<\/code> est parametrum functionis.<\/span> <span class=\"sg\" data-s=\"1\">Eius argumenta sunt <code>'Alla'<\/code> et <code>'Karl'<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%/tipblock<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plura parametra<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio plus quam unum parametrum accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">In hoc casu omnia enumera, cum commatibus inter ea:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add($x, $y) {\n    say $x + $y;\n}\n\nadd(10, 20); # 30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nulla parametra<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bene est si functio omnino nulla parametra accipit.<\/span> <span class=\"sg\" data-s=\"1\">Tum vel par parenthesium vacuum addere potes vel eas omnino omittere.<\/span> <span class=\"sg\" data-s=\"2\">Eas in <a href=\"/essentials/functions/\">initio huius sectionis<\/a> omisimus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet() {\n    say 'Hello, World!';\n}\n\ngreet();<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Signatura<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Index parametrorum functionis vocatur <em>signatura<\/em>.<\/span><\/p>"]]}}}</script>
