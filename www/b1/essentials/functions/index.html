ать функцию, просто напишите её имя там, где вы хотите её вызвать.<\/span> <span class=\"sg\" data-s=\"1\">В Raku определение функции может стоять до вызова или после него.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит оба сообщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь мы подробнее посмотрим, как создавать и использовать функции.<\/span><\/p>"]]},"uk":{"t":"Створення та виклик функцій","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Тепер ви в останньому розділі першої частини курсу.<\/span> <span class=\"sg\" data-s=\"1\">Після нього ви знатимете достатньо, щоб написати майже <em>будь-яку<\/em> програму на Raku.<\/span> <span class=\"sg\" data-s=\"2\">Тема цього розділу — <em>функції<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Їх також називають <em>підпрограмами<\/em> або просто <em>рутинами<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функція — це частина коду з ім'ям, яку можна використовувати багато разів.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете <em>викликати<\/em> функцію з різних місць програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Створення функції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб створити функцію, напишіть ключове слово <code>sub<\/code>, а потім ім'я функції.<\/span> <span class=\"sg\" data-s=\"1\">Тіло функції стоїть усередині пари фігурних дужок.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Використання функції<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щоб використати функцію, просто напишіть її ім'я там, де хочете її викликати.<\/span> <span class=\"sg\" data-s=\"1\">У Raku визначення функції може стояти перед викликом або після нього.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'This is what the first program usually prints:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виведе обидва повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nThis is what the first program usually prints:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер ми розглянемо більше деталей про те, як створювати та використовувати функції.<\/span><\/p>"]]},"bg":{"t":"Създаване и извикване на функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Сега сте в последната секция на първата част от курса.<\/span> <span class=\"sg\" data-s=\"1\">След нея ще знаете достатъчно, за да напишете почти <em>всяка<\/em> програма в Raku.<\/span> <span class=\"sg\" data-s=\"2\">Темата на тази секция са <em>функциите<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Те се наричат още <em>подпрограми<\/em> или просто <em>рутини<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Функцията е част от кода със собствено име, която можете да използвате много пъти.<\/span> <span class=\"sg\" data-s=\"1\">Можете да <em>извиквате<\/em> функцията от различни места в програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Създаване на функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да създадете функция, напишете ключовата дума <code>sub<\/code> и след нея името на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Тялото на функцията стои в чифт къдрави скоби.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Използване на функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За да използвате функцията, просто напишете нейното име там, където искате да я извикате.<\/span> <span class=\"sg\" data-s=\"1\">В Raku дефиницията на функцията може да стои преди извикването или след него.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Това е, което първата програма обикновено отпечатва:';\ngreet;    \n\nsub greet {\n    say 'Hello, World!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва и двете съобщения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nТова е, което първата програма обикновено отпечатва:\nHello, World!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега ще разгледаме още подробности за това как да създаваме и използваме функции.<\/span><\/p>"]]},"eo":{"t":"Kreado kaj vokado de funkcioj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nun vi estas en la lasta sekcio de la unua parto de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Post ĝi, vi scios sufiĉe por skribi preskaŭ <em>ĉiun<\/em> programon en Raku.<\/span> <span class=\"sg\" data-s=\"2\">La temo de ĉi tiu sekcio estas <em>funkcioj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Oni ankaŭ nomas ilin <em>subrutinoj<\/em>, aŭ simple <em>rutinoj<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Funkcio estas nomita parto de kodo, kiun vi povas uzi multajn fojojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas <em>voki<\/em> funkcion el diversaj lokoj en la programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreado de funkcio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por krei funkcion, skribu la ŝlosilvorton <code>sub<\/code> kaj poste la nomon de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La korpo de la funkcio estas inter paro de kurbaj krampoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzado de funkcio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por uzi la funkcion, simple skribu ĝian nomon tie, kie vi volas voki ĝin.<\/span> <span class=\"sg\" data-s=\"1\">En Raku, la difino de la funkcio povas veni antaŭ la voko aŭ post ĝi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Jen kion la unua programo kutime presas:';\nsaluton;    \n\nsub saluton {\n    say 'Saluton, Mondo!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas ambaŭ mesaĝojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nJen kion la unua programo kutime presas:\nSaluton, Mondo!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun ni rigardos pliajn detalojn pri tio, kiel krei kaj uzi funkciojn.<\/span><\/p>"]]},"la":{"t":"Creando et vocando functiones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nunc ad ultimam sectionem primae partis cursus pervenisti.<\/span> <span class=\"sg\" data-s=\"1\">Post eam satis scies ut fere <em>quodlibet<\/em> programma in Raku scribas.<\/span> <span class=\"sg\" data-s=\"2\">Argumentum huius sectionis sunt <em>functiones<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Etiam <em>subroutinae<\/em> vocantur, vel simpliciter <em>routinae<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Functio est pars codicis cum nomine, quam multis vicibus adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Functionem ex diversis locis in programmate <em>vocare<\/em> potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare functionem<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut functionem crees, scribe verbum <code>sub<\/code> et deinde nomen functionis.<\/span> <span class=\"sg\" data-s=\"1\">Corpus functionis intra par uncorum curvorum ponitur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Utendo functione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut functionem adhibeas, simpliciter nomen eius scribe ubi eam vocare vis.<\/span> <span class=\"sg\" data-s=\"1\">In Raku definitio functionis ante vocationem vel post eam esse potest.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hoc est quod primum programma plerumque imprimit:';\nsaluta;    \n\nsub saluta {\n    say 'Salve, Mundi!';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma utrumque nuntium imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku t.raku\nHoc est quod primum programma plerumque imprimit:\nSalve, Mundi!<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc plura singula videbimus de functionibus creandis et adhibendis.<\/span><\/p>"]]}}}</script>
