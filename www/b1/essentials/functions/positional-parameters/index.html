<script type="application/json" id="page-data">{"u":"essentials/functions/positional-parameters","n":276,"k":"topic","pv":"essentials/functions/return-result/quiz","nx":"essentials/functions/positional-parameters/quiz","tr":["essentials","essentials/functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Positional parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The order of function parameters matters.<\/span> <span class=\"sg\" data-s=\"1\">For example, let us create a function that calculates the difference between two numbers:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is clear that calling <code>diff(10, 20)<\/code> gives a different result from <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters in a list with commas, like in the function above, are called <em>positional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Their meaning depends on the order of the arguments when you call the function.<\/span><\/p>"]]},"de":{"t":"Positionsparameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Reihenfolge der Funktionsparameter spielt eine Rolle.<\/span> <span class=\"sg\" data-s=\"1\">Erstellen wir zum Beispiel eine Funktion, die die Differenz zwischen zwei Zahlen berechnet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es ist klar, dass der Aufruf <code>diff(10, 20)<\/code> ein anderes Ergebnis liefert als <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameter in einer Liste mit Kommas, wie in der Funktion oben, heißen <em>positionsabhängig<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Bedeutung hängt von der Reihenfolge der Argumente ab, wenn Sie die Funktion aufrufen.<\/span><\/p>"]]},"nl":{"t":"Positionele parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgorde van functieparameters doet ertoe.<\/span> <span class=\"sg\" data-s=\"1\">Laten we bijvoorbeeld een functie maken die het verschil tussen twee getallen berekent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is duidelijk dat de aanroep <code>diff(10, 20)<\/code> een ander resultaat geeft dan <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parameters in een lijst met komma's, zoals in de functie hierboven, heten <em>positioneel<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hun betekenis hangt af van de volgorde van de argumenten als je de functie aanroept.<\/span><\/p>"]]},"es":{"t":"Parámetros posicionales","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El orden de los parámetros de una función importa.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, vamos a crear una función que calcule la diferencia entre dos números:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Está claro que llamar a <code>diff(10, 20)<\/code> da un resultado diferente de <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los parámetros en una lista con comas, como en la función de arriba, se llaman <em>posicionales<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Su significado depende del orden de los argumentos cuando llamas a la función.<\/span><\/p>"]]},"it":{"t":"Parametri posizionali","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">L'ordine dei parametri di una funzione conta.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, creiamo una funzione che calcola la differenza tra due numeri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">È chiaro che la rametrojn en listo kun komoj, kiel en la supra funkcio, oni nomas <em>poziciaj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ilia signifo dependas de la ordo de la argumentoj, kiam vi vokas la funkcion.<\/span><\/p>"]]},"la":{"t":"Positional parametra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ordo parametrorum functionis refert.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, functionem creemus quae differentiam inter duos numeros computat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub diff($a, $b) { $a - $b }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Clarum est vocationem <code>diff(10, 20)<\/code> alium eventum dare quam <code>diff(20, 10)<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Parametri in indice cum commatibus, sicut in functione supra, <em>positionales<\/em> vocantur.<\/span> <span class=\"sg\" data-s=\"1\">Sensus eorum ex ordine argumentorum pendet, cum functionem vocas.<\/span><\/p>"]]}}}</script>
