 class=\"sg\" data-s=\"0\">The error message explains the problem:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">With <code>if<\/code>, you do not need parentheses at all.<\/span> <span class=\"sg\" data-s=\"1\">So if you do not use them, the problem cannot appear.<\/span> <span class=\"sg\" data-s=\"2\">But in some cases you need them, for example, with <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Then the space is required:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The same thing happens in this code: the compiler takes <code>loop(...)<\/code> as a function call.<\/span> <span class=\"sg\" data-s=\"1\">Add a space to fix the problem.<\/span> <span class=\"sg\" data-s=\"2\">Or, even better, rewrite this part of the code with <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusion<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In short, to avoid such problems, follow two rules.<\/span> <span class=\"sg\" data-s=\"1\">Do not put a space between the function name and the parentheses with its arguments.<\/span> <span class=\"sg\" data-s=\"2\">Also, try to avoid parentheses in other parts of the language, such as control flow.<\/span><\/p>"]]},"de":{"t":"Achte auf den Abstand","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku ist die Verwendung von Funktionen meist einfach und macht keine Probleme.<\/span> <span class=\"sg\" data-s=\"1\">Aber vor einer Sa her Code verursacht eine Ausnahme:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zu wenige Positionsparameter übergeben; erwartet wurden 2 Argumente, aber es wurde 1 übergeben       sub f bei t.raku Zeile 1       in Block &lt;unit&gt; bei t.raku Zeile 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku versteht den Aufruf mit Leerzeichen, <code>f (5, 6)<\/code>, anders.<\/span> <span class=\"sg\" data-s=\"1\">Raku denkt, dass Sie der Funktion ein einziges Argument übergeben wollen, nämlich <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Den Typ dieses Arguments kann man leicht prüfen.<\/span> <span class=\"sg\" data-s=\"3\">Ändern Sie einfach die Funktion so, dass sie nur ein Argument nimmt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie also <code>f (5, 6)<\/code> aufrufen, übergeben Sie eine <a href=\"https://course.raku.org/de/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">Liste<\/a> an die Funktion.<\/span> <span class=\"sg\" data-s=\"1\">Die Liste wird als ein einziges Element übergeben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wann ein Leerzeichen benötigt wird<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In manchen Fällen brauchen Sie doch ein Leerzeichen.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, wenn Sie Klammern mit einem Schlüsselwort wie <code>if<\/code>, <code>for<\/code> oder <code>loop<\/code> verwenden.<\/span> <span class=\"sg\" data-s=\"2\">Der folgende Code ist falsch:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Fehlermeldung erklärt das Problem:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     Das Wort 'if' wird als Funktionsaufruf 'if()' interpretiert.<\/span> <span \">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zet geen spatie tussen de naam van de functie en de haakjes met de argumenten.<\/span> <span class=\"sg\" data-s=\"1\">Maar gebruik wel een spatie na <code>for<\/code> en <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lang verhaal<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Laten we een eenvoudige functie nemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Let eerst op dat er geen spatie na de naam van de functie staat.<\/span> <span class=\"sg\" data-s=\"1\">Het openingshaakje met de parameters komt direct na de naam.<\/span> <span class=\"sg\" data-s=\"2\">Sommige codestijlen in andere talen vragen daar om een spatie.<\/span> <span class=\"sg\" data-s=\"3\">Raku accepteert dat, maar het is geen goede gewoonte om te volgen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je de functie aanroept, is de ontbrekende spatie belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Als je de functie zonder haakjes aanroept, moet er een spatie na de naam staan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar als je haakjes gebruikt, mag er geen spatie voor staan.<\/span> <span class=\"sg\" data-s=\"1\">Deze aanroep is correct:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En deze aanroep is fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dergelijke code veroorzaakt een uitzondering:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ziet de aanroep met een spatie, <code>f (5, 6)<\/code>, op een andere manier.<\/span> <span class=\"sg\" data-s=\"1\">Raku denkt dat je één argument, <code>(5, 6)<\/code>, aan de functie wilt doorgeven.<\/span> <span class=\"sg\" data-s=\"2\">Het is makkelijk om het type van dit argument te controleren.<\/span> <span class=\"sg\" data-s=\"3\">Verander de functie gewoon zodat die maar één argument aanneemt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dus als je <code>f (5, 6)<\/code> aanroept, geef je een <a href=\"https://course.raku.org/nl/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lijst<\/a> aan de functie door.<\/span> <span class=\"sg\" data-s=\"1\">De lijst wordt als één geheel doorgegeven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Wanneer spatie nodig is<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In sommige gevallen heb je wel een spatie nodig.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt als je haakjes gebruikt met een sleutelwoord zoals <code>if<\/code>, <code>for<\/code> of <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De volgende code is fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het foutbericht legt het probleem uit:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bij <code>if<\/code> heb je helemaal geen haakjes nodig.<\/span> <span class=\"sg\" data-s=\"1\">Dus als je ze niet gebruikt, kan het probleem niet ontstaan.<\/span> <span class=\"sg\" data-s=\"2\">Maar in sommige gevallen heb je ze wel nodig, bijvoorbeeld bij <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dan is de spatie verplicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In deze code gebeurt hetzelfde: de compiler ziet <code>loop(...)<\/code> als een functieaanroep.<\/span> <span class=\"sg\" data-s=\"1\">Voeg een spatie toe om het probleem op te lossen.<\/span> <span class=\"sg\" data-s=\"2\">Of, nog beter, herschrijf dit deel van de code met <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusie<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kortom, volg twee regels om zulke problemen te voorkomen.<\/span> <span class=\"sg\" data-s=\"1\">Zet geen spatie tussen de naam van de functie en de haakjes met de argumenten.<\/span> <span class=\"sg\" data-s=\"2\">Probeer ook haakjes te vermijden in andere delen van de taal, zoals bij controleflow.<\/span><\/p>"]]},"es":{"t":"Atención al espacio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, usar funciones es casi siempre fácil y no causa problemas.<\/span> <span class=\"sg\" data-s=\"1\">Pero debemos advertirte sobre una cosa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No pongas un espacio entre el nombre de la función y los paréntesis con sus argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Pero sí usa un espacio después de <code>for<\/code> y <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Historia larga<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tomemos una función simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Primero, nota que no hay espacio después del nombre de la función.<\/span> <span class=\"sg\" data-s=\"1\">El paréntesis de apertura con los parámetros va justo después del nombre.<\/span> <span class=\"sg\" data-s=\"2\">Algunos estilos de código en otros lenguajes pueden pedir un espacio allí.<\/span> <span class=\"sg\" data-s=\"3\">Raku lo acepta, pero no es una buena práctica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando llamas a la función, la falta de espacio es importante.<\/span> <span class=\"sg\" data-s=\"1\">Si llamas a la función sin paréntesis, debe haber un espacio después de su nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero si usas paréntesis, no puede haber un espacio antes de ellos.<\/span> <span class=\"sg\" data-s=\"1\">Esta llamada es correcta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y esta llamada es incorrecta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dicho código causa una excepción:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku ve la llamada con un espacio, <code>f (5, 6)<\/code>, de otra forma.<\/span> <span class=\"sg\" data-s=\"1\">Piensa que quieres pasar un solo argumento, <code>(5, 6)<\/code>, a la función.<\/span> <span class=\"sg\" data-s=\"2\">Es fácil comprobar el tipo de este argumento.<\/span> <span class=\"sg\" data-s=\"3\">Solo cambia la función para que tome un solo argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que, cuando llamas a <code>f (5, 6)<\/code>, pasas una <a href=\"https://course.raku.org/es/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lista<\/a> a la función.<\/span> <span class=\"sg\" data-s=\"1\">La lista se pasa como un solo elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuando se necesita espacio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En algunos casos, sí necesitas un espacio.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa cuando usas paréntesis con una palabra clave como <code>if<\/code>, <code>for<\/code> o <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente código es incorrecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El mensaje de error explica el problema:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con <code>if<\/code>, no necesitas paréntesis para nada.<\/span> <span class=\"sg\" data-s=\"1\">Así que, si no los usas, el problema no puede aparecer.<\/span> <span class=\"sg\" data-s=\"2\">Pero en algunos casos los necesitas, por ejemplo, con <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Entonces el espacio es obligatorio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En este código pasa lo mismo: el compilador toma <code>loop(...)<\/code> como una llamada a función.<\/span> <span class=\"sg\" data-s=\"1\">Agrega un espacio para arreglar el problema.<\/span> <span class=\"sg\" data-s=\"2\">O, todavía mejor, reescribe esta parte del código con <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusión<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En resumen, para evitar estos problemas, sigue dos reglas.<\/span> <span class=\"sg\" data-s=\"1\">No pongas un espacio entre el nombre de la función y los paréntesis con sus argumentos.<\/span> <span class=\"sg\" data-s=\"2\">Además, intenta evitar los paréntesis en otras partes del lenguaje, como el control de flujo.<\/span><\/p>"]]},"it":{"t":"Attenzione agli spazi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, usare le funzioni è quasi sempre facile e non causa problemi.<\/span> <span class=\"sg\" data-s=\"1\">Ma dobbiamo avvisarti di una cosa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non mettere uno spazio tra il nome della funzione e le parentesi con i suoi argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Ma usa uno spazio dopo <code>for<\/code> e <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Storia lunga<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prendiamo una semplice funzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prima di tutto, nota che non c'è uno spazio dopo il nome della funzione.<\/span> <span class=\"sg\" data-s=\"1\">La parentesi aperta con i parametri viene subito dopo il nome.<\/span> <span class=\"sg\" data-s=\"2\">Alcuni stili di codice in altri linguaggi possono richiedere uno spazio lì.<\/span> <span class=\"sg\" data-s=\"3\">Raku lo accetta, ma non è una buona abitudine da seguire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando chiami la funzione, l'assenza dello spazio è importante.<\/span> <span class=\"sg\" data-s=\"1\">Se chiami la funzione senza parentesi, devi avere uno spazio dopo il suo nome:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma se usi le parentesi, non ci può essere uno spazio prima di esse.<\/span> <span class=\"sg\" data-s=\"1\">Questa chiamata è corretta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E questa chiamata è sbagliata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tale codice causa un'eccezione:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku vede la chiamata con uno spazio, <code>f (5, 6)<\/code>, in modo diverso.<\/span> <span class=\"sg\" data-s=\"1\">Pensa che tu voglia passare un solo argomento, <code>(5, 6)<\/code>, alla funzione.<\/span> <span class=\"sg\" data-s=\"2\">È facile controllare il tipo di questo argomento.<\/span> <span class=\"sg\" data-s=\"3\">Basta cambiare la funzione in modo che prenda un solo argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi, quando chiami <code>f (5, 6)<\/code>, passi una <a href=\"https://course.raku.org/it/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">lista<\/a> alla funzione.<\/span> <span class=\"sg\" data-s=\"1\">La lista viene passata come un unico elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando è necessario lo spazio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In alcuni casi, lo spazio serve davvero.<\/span> <span class=\"sg\" data-s=\"1\">Succede quando usi le parentesi con una parola chiave come <code>if<\/code>, <code>for<\/code> o <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il seguente codice è sbagliato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il messaggio di errore spiega il problema:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Con <code>if<\/code>, le parentesi non sono affatto necessarie.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, se non le usi, il problema non può apparire.<\/span> <span class=\"sg\" data-s=\"2\">Ma in alcuni casi ti servono, per esempio con <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora lo spazio è obbligatorio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In questo codice succede la stessa cosa: il compilatore prende <code>loop(...)<\/code> per una chiamata di funzione.<\/span> <span class=\"sg\" data-s=\"1\">Aggiungi uno spazio per risolvere il problema.<\/span> <span class=\"sg\" data-s=\"2\">Oppure, ancora meglio, riscrivi questa parte del codice con <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In breve, per evitare questi problemi, segui due regole.<\/span> <span class=\"sg\" data-s=\"1\">Non mettere uno spazio tra il nome della funzione e le parentesi con i suoi argomenti.<\/span> <span class=\"sg\" data-s=\"2\">Inoltre, cerca di evitare le parentesi in altre parti del linguaggio, come il controllo del flusso.<\/span><\/p>"]]},"lv":{"t":"Pievērsiet uzmanību atstarpēm","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā funkciju lietošana pārsvarā ir vienkārša un nerada problēmas.<\/span> <span class=\"sg\" data-s=\"1\">Bet mums jūs jābrīdina par vienu lietu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Īsumā<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nelieciet atstarpi starp funkcijas nosaukumu un iekavām ar tās argumentiem.<\/span> <span class=\"sg\" data-s=\"1\">Bet pēc <code>for<\/code> un <code>if<\/code> gan izmantojiet atstarpi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Garā versija<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apskatīsim vienkāršu funkciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vispirms ievērojiet, ka pēc funkcijas nosaukuma nav atstarpes.<\/span> <span class=\"sg\" data-s=\"1\">Atverošā iekava ar parametriem ir uzreiz pēc nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Daži koda stili citās valodās var prasīt tur atstarpi.<\/span> <span class=\"sg\" data-s=\"3\">Raku to pieņem, bet tā nav laba prakse, ko ievērot:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jūs izsaucat funkciju, atstarpes trūkums ir svarīgs.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs izsaucat funkciju bez iekavām, pēc tās nosaukuma jābūt atstarpei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet, ja jūs izmantojat iekavas, pirms tām nevar būt atstarpes.<\/span> <span class=\"sg\" data-s=\"1\">Šis izsaukums ir pareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un šis izsaukums ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šāds kods izraisa izņēmumu:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku izsaukumu ar atstarpi, <code>f (5, 6)<\/code>, redz citādi.<\/span> <span class=\"sg\" data-s=\"1\">Tas domā, ka jūs gribat nodot funkcijai vienu argumentu, <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šī argumenta tipu ir viegli pārbaudīt.<\/span> <span class=\"sg\" data-s=\"3\">Vienkārši mainiet funkciju, lai tā pieņemtu tikai vienu argumentu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad, kad jūs izsaucat <code>f (5, 6)<\/code>, jūs nododat funkcijai <a href=\"https://course.raku.org/lv/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">sarakstu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Saraksts tiek nodots kā viens vienums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kad atstarpe ir nepieciešama<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažos gadījumos atstarpe gan ir vajadzīga.<\/span> <span class=\"sg\" data-s=\"1\">Tā notiek, kad jūs izmantojat iekavas ar atslēgvārdu, piemēram, <code>if<\/code>, <code>for<\/code> vai <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šāds kods ir nepareizs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kļūdas ziņojums izskaidro problēmu:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ar <code>if<\/code> jums iekavas nemaz nav vajadzīgas.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc, ja jūs tās neizmantojat, problēma nevar rasties.<\/span> <span class=\"sg\" data-s=\"2\">Bet dažos gadījumos tās ir vajadzīgas, piemēram, ar <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad atstarpe ir obligāta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā kodā notiek tas pats: kompilators uztver <code>loop(...)<\/code> kā funkcijas izsaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojiet atstarpi, lai novērstu problēmu.<\/span> <span class=\"sg\" data-s=\"2\">Vai, vēl labāk, pārrakstiet šo koda daļu ar <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Secinājums<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Īsumā, lai izvairītos no šādām problēmām, ievērojiet divus noteikumus.<\/span> <span class=\"sg\" data-s=\"1\">Nelieciet atstarpi starp funkcijas nosaukumu un iekavām ar tās argumentiem.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat mēģiniet izvairīties no iekavām citās valodas daļās, piemēram, vadības plūsmā.<\/span><\/p>"]]},"ru":{"t":"Внимание к пробелам","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku использовать функции в основном легко, и проблем это не вызывает.<\/span> <span class=\"sg\" data-s=\"1\">Но мы должны предупредить вас об одной вещи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не ставьте пробел между именем функции и скобками с её аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Но после <code>for<\/code> и <code>if<\/code> пробел ставить нужно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Длинная история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Возьмем простую функцию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Прежде всего обратите внимание, что после имени функции нет пробела.<\/span> <span class=\"sg\" data-s=\"1\">Открывающая скобка с параметрами идёт сразу после имени.<\/span> <span class=\"sg\" data-s=\"2\">Некоторые стили кода в других языках могут требовать там пробел.<\/span> <span class=\"sg\" data-s=\"3\">Raku это принимает, но так делать не стоит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы вызываете функцию, отсутствие пробела важно.<\/span> <span class=\"sg\" data-s=\"1\">Если вы вызываете функцию без скобок, после её имени обязательно нужен пробел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но если вы используете скобки, перед ними не может быть пробела.<\/span> <span class=\"sg\" data-s=\"1\">Этот вызов правильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А этот вызов неправильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такой код вызывает исключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вызов с пробелом, <code>f (5, 6)<\/code>, Raku понимает по-другому.<\/span> <span class=\"sg\" data-s=\"1\">Он думает, что вы хотите передать функции один аргумент — <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тип этого аргумента легко проверить.<\/span> <span class=\"sg\" data-s=\"3\">Просто измените функцию, чтобы она принимала только один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, когда вы вызываете <code>f (5, 6)<\/code>, вы передаёте функции <a href=\"https://course.raku.org/ru/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Список передаётся как одно целое.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Когда пробел необходим<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В некоторых случаях пробел всё-таки нужен.<\/span> <span class=\"sg\" data-s=\"1\">Это бывает, когда вы используете скобки с ключевым словом, таким как <code>if<\/code>, <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следующий код неправильный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сообщение об ошибке объясняет проблему:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С <code>if<\/code> скобки вообще не нужны.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому если вы их не используете, проблема не может появиться.<\/span> <span class=\"sg\" data-s=\"2\">Но в некоторых случаях они нужны, например, с <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда пробел обязателен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом коде происходит то же самое: компилятор принимает <code>loop(...)<\/code> за вызов функции.<\/span> <span class=\"sg\" data-s=\"1\">Добавьте пробел, чтобы исправить проблему.<\/span> <span class=\"sg\" data-s=\"2\">Или, ещё лучше, перепишите эту часть кода с <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коротко говоря, чтобы избежать таких проблем, следуйте двум правилам.<\/span> <span class=\"sg\" data-s=\"1\">Не ставьте пробел между именем функции и скобками с её аргументами.<\/span> <span class=\"sg\" data-s=\"2\">Также старайтесь не использовать скобки в других частях языка, например, в управляющих конструкциях.<\/span><\/p>"]]},"uk":{"t":"Зверніть увагу на пробіли","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku використовувати функції здебільшого легко, і проблем це не створює.<\/span> <span class=\"sg\" data-s=\"1\">Але ми маємо попередити вас про одну річ.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коротко<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не ставте пробіл між назвою функції та дужками з її аргументами.<\/span> <span class=\"sg\" data-s=\"1\">Але після <code>for<\/code> та <code>if<\/code> пробіл ставити треба.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Детально<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Візьмемо просту функцію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Спершу зверніть увагу, що після назви функції немає пробілу.<\/span> <span class=\"sg\" data-s=\"1\">Відкривна дужка з параметрами йде одразу після назви.<\/span> <span class=\"sg\" data-s=\"2\">Деякі стилі коду в інших мовах можуть вимагати там пробіл.<\/span> <span class=\"sg\" data-s=\"3\">Raku це приймає, але так робити не варто:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви викликаєте функцію, відсутність пробілу важлива.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви викликаєте функцію без дужок, після її назви має бути пробіл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але якщо ви використовуєте дужки, перед ними не може бути пробілу.<\/span> <span class=\"sg\" data-s=\"1\">Цей виклик правильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А цей виклик неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такий код викликає виняток:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku бачить виклик із пробілом, <code>f (5, 6)<\/code>, інакше.<\/span> <span class=\"sg\" data-s=\"1\">Він думає, що ви хочете передати функції один аргумент, <code>(5, 6)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тип цього аргументу легко перевірити.<\/span> <span class=\"sg\" data-s=\"3\">Просто змініть функцію, щоб вона приймала лише один аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, коли ви викликаєте <code>f (5, 6)<\/code>, ви передаєте функції <a href=\"https://course.raku.org/uk/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">список<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Список передається як одне ціле.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коли потрібен пробіл<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У деяких випадках пробіл таки потрібен.<\/span> <span class=\"sg\" data-s=\"1\">Це буває, коли ви використовуєте дужки з ключовим словом, таким як <code>if<\/code>, <code>for<\/code> або <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Наступний код неправильний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Повідомлення про помилку пояснює проблему:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">З <code>if<\/code> дужки взагалі не потрібні.<\/span> <span class=\"sg\" data-s=\"1\">Тож якщо ви їх не використовуєте, проблема не може з'явитися.<\/span> <span class=\"sg\" data-s=\"2\">Але в деяких випадках вони потрібні, наприклад, з <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді пробіл обов'язковий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У цьому коді відбувається те саме: компілятор сприймає <code>loop(...)<\/code> як виклик функції.<\/span> <span class=\"sg\" data-s=\"1\">Додайте пробіл, щоб виправити проблему.<\/span> <span class=\"sg\" data-s=\"2\">Або, ще краще, перепишіть цю частину коду з <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Висновок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коротко: щоб уникнути таких проблем, дотримуйтеся двох правил.<\/span> <span class=\"sg\" data-s=\"1\">Не ставте пробіл між назвою функції та дужками з її аргументами.<\/span> <span class=\"sg\" data-s=\"2\">Також намагайтеся уникати дужок в інших частинах мови, таких як керування потоком.<\/span><\/p>"]]},"bg":{"t":"Внимание към пространството","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku използването на функции е предимно лесно и не създава проблеми.<\/span> <span class=\"sg\" data-s=\"1\">Но трябва да ви предупредим за едно нещо.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не слагайте интервал между името на функцията и скобите с нейните аргументи.<\/span> <span class=\"sg\" data-s=\"1\">Но след <code>for<\/code> и <code>if<\/code> използвайте интервал.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Дълга история<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Нека вземем една проста функция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Първо, обърнете внимание, че след името на функцията няма интервал.<\/span> <span class=\"sg\" data-s=\"1\">Отварящата скоба с параметрите идва веднага след името.<\/span> <span class=\"sg\" data-s=\"2\">Някои стилове на кодиране в други езици може да изискват интервал там.<\/span> <span class=\"sg\" data-s=\"3\">Raku го приема, но това не е добра практика, която да следвате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато извиквате функцията, липсата на интервал е важна.<\/span> <span class=\"sg\" data-s=\"1\">Ако извиквате функцията без скоби, след нейното име трябва да има интервал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но ако използвате скоби, преди тях не може да има интервал.<\/span> <span class=\"sg\" data-s=\"1\">Това извикване е правилно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А това извикване е грешно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Такъв код предизвиква изключение:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku вижда извикването с интервал, <code>f (5, 6)<\/code>, по различен начин.<\/span> <span class=\"sg\" data-s=\"1\">Raku смята, че искате да предадете един-единствен аргумент, <code>(5, 6)<\/code>, на функцията.<\/span> <span class=\"sg\" data-s=\"2\">Лесно е да проверите типа на този аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Просто променете функцията така, че да приема само един аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така че, когато извиквате <code>f (5, 6)<\/code>, предавате <a href=\"https://course.raku.org/bg/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">списък<\/a> на функцията.<\/span> <span class=\"sg\" data-s=\"1\">Списъкът се предава като един елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Кога е нужен интервал<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В някои случаи интервалът наистина е нужен.<\/span> <span class=\"sg\" data-s=\"1\">Това се случва, когато използвате скоби с ключова дума като <code>if<\/code>, <code>for<\/code> или <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Следният код е грешен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Съобщението за грешка обяснява проблема:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">С <code>if<\/code> изобщо не са ви нужни скоби.<\/span> <span class=\"sg\" data-s=\"1\">Така че, ако не ги използвате, проблемът не може да се появи.<\/span> <span class=\"sg\" data-s=\"2\">Но в някои случаи те са нужни, например с <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава интервалът е задължителен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този код се случва същото: компилаторът приема <code>loop(...)<\/code> за извикване на функция.<\/span> <span class=\"sg\" data-s=\"1\">Добавете интервал, за да решите проблема.<\/span> <span class=\"sg\" data-s=\"2\">Или, още по-добре, пренапишете тази част от кода с <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заключение<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Накратко, за да избегнете такива проблеми, спазвайте две правила.<\/span> <span class=\"sg\" data-s=\"1\">Не слагайте интервал между името на функцията и скобите с нейните аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Също така, опитайте да избягвате скобите в други части на езика, например в контролния поток.<\/span><\/p>"]]},"eo":{"t":"Atentu la spacon","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, uzi funkciojn estas plejparte facile kaj ne kaŭzas problemojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed ni devas averti vin pri unu afero.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne metu spacon inter la nomo de la funkcio kaj la parentezoj kun ĝiaj argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Sed ja uzu spacon post <code>for<\/code> kaj <code>if<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa rakonto<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prenu simplan funkcion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unue, rimarku, ke ne estas spaco post la nomo de la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La malferma parentezo kun la parametroj venas tuj post la nomo.<\/span> <span class=\"sg\" data-s=\"2\">Iuj kodstiloj en aliaj lingvoj eble postulas spacon tie.<\/span> <span class=\"sg\" data-s=\"3\">Raku akceptas ĝin, sed tio ne estas bona kutimo por sekvi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi vokas la funkcion, la manko de spaco estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Se vi vokas la funkcion sen parentezoj, vi devas havi spacon post ĝia nomo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed se vi uzas parentezojn, ne povas esti spaco antaŭ ili.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu voko estas ĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj ĉi tiu voko estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tia kodo kaŭzas escepton:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tro malmultaj poziciaj pasis; atendis 2 argumentojn sed ricevis 1       sub f ĉe t.raku linio 1       en bloko &lt;unit&gt; ĉe t.raku linio 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku vidas la vokon kun spaco, <code>f (5, 6)<\/code>, alimaniere.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi pensas, ke vi volas pasi unu solan argumenton, <code>(5, 6)<\/code>, al la funkcio.<\/span> <span class=\"sg\" data-s=\"2\">Estas facile kontroli la tipon de ĉi tiu argumento.<\/span> <span class=\"sg\" data-s=\"3\">Simple ŝanĝu la funkcion, por ke ĝi prenu nur unu argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do, kiam vi vokas <code>f (5, 6)<\/code>, vi pasas <a href=\"https://course.raku.org/eo/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">liston<\/a> al la funkcio.<\/span> <span class=\"sg\" data-s=\"1\">La listo estas pasata kiel unu sola ero.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kiam spaco estas bezonata<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En iuj kazoj, vi ja bezonas spacon.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, kiam vi uzas parentezojn kun ŝlosilvorto kiel <code>if<\/code>, <code>for<\/code> aŭ <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La sekva kodo estas malĝusta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La erarmesaĝo klarigas la problemon:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===PARDONU!===     La vorto 'if' estas interpretita kiel 'if()' funkciovoko.<\/span> <span class=\"sg\" data-s=\"1\">Bonvolu uzi     blankspacon anstataŭ parentezoj.     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Neatendita bloko en infiksa pozicio (du terminoj en vico)     ĉe /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kun <code>if<\/code>, vi tute ne bezonas parentezojn.<\/span> <span class=\"sg\" data-s=\"1\">Do se vi ne uzas ilin, la problemo ne povas aperi.<\/span> <span class=\"sg\" data-s=\"2\">Sed en iuj kazoj vi bezonas ilin, ekzemple, kun <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la spaco estas deviga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sama afero okazas en ĉi tiu kodo: la kompililo komprenas <code>loop(...)<\/code> kiel funkcian vokon.<\/span> <span class=\"sg\" data-s=\"1\">Aldonu spacon por solvi la problemon.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ, eĉ pli bone, reskribu ĉi tiun parton de la kodo per <code>for<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Konkludo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mallonge, por eviti tiajn problemojn, sekvu du regulojn.<\/span> <span class=\"sg\" data-s=\"1\">Ne metu spacon inter la nomo de la funkcio kaj la parentezoj kun ĝiaj argumentoj.<\/span> <span class=\"sg\" data-s=\"2\">Ankaŭ provu eviti parentezojn en aliaj partoj de la lingvo, kiel la kontrolfluo.<\/span><\/p>"]]},"la":{"t":"Cave spatium","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku usus functionum plerumque facilis est et nullas difficultates affert.<\/span> <span class=\"sg\" data-s=\"1\">Sed de una re te monere debemus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">TL;DR<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nullum spatium pone inter nomen functionis et parentheses cum argumentis eius.<\/span> <span class=\"sg\" data-s=\"1\">Sed post <code>for<\/code> et <code>if<\/code> spatio utere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Longa fabula<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simplicem functionem accipiamus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Primum, nota: post nomen functionis nullum spatium est.<\/span> <span class=\"sg\" data-s=\"1\">Parenthesis aperiens cum parametris statim post nomen venit.<\/span> <span class=\"sg\" data-s=\"2\">Quidam styli codicis in aliis linguis ibi spatium requirere possunt.<\/span> <span class=\"sg\" data-s=\"3\">Raku id accipit, sed hic non est bonus mos sequendus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f ($x, $y) {\n    return $x + $y;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum functionem vocas, absentia spatii magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\">Si functionem sine parenthesibus vocas, spatium post nomen eius habere debes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f 5, 6;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed si parenthesibus uteris, spatium ante eas esse non potest.<\/span> <span class=\"sg\" data-s=\"1\">Haec vocatio recta est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et haec vocatio est falsa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f (5, 6);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Talis codex exceptionem causat:<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Too few positionals passed; expected 2 arguments but got 1       sub f at t.raku line 1       in block &lt;unit&gt; at t.raku line 5<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku vocationem cum spatio, <code>f (5, 6)<\/code>, alio modo videt.<\/span> <span class=\"sg\" data-s=\"1\">Putat te unum argumentum, <code>(5, 6)<\/code>, functioni transmittere velle.<\/span> <span class=\"sg\" data-s=\"2\">Facile est typum huius argumenti probare.<\/span> <span class=\"sg\" data-s=\"3\">Solum muta functionem, ut unum tantum argumentum accipiat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f($param) {\n    say $param.WHAT;\n}\n\nf (5, 6); # (List)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque, cum <code>f (5, 6)<\/code> vocas, <a href=\"https://course.raku.org/la/essentials/positionals/lists/\" target=\"_blank\" rel=\"noopener\">indicem<\/a> functioni transmittis.<\/span> <span class=\"sg\" data-s=\"1\">Index ut una res transmittitur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Quando spatium necessarium est<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In aliquibus casibus spatium vere requiris.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit cum parentheses cum verbo clavis adhibes, ut <code>if<\/code>, <code>for<\/code> vel <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Codex sequens falsus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>if(True != False) {\n    say 'OK';\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nuntius erroris problema explicat:<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">===SORRY!===     The word 'if' is interpreted as a 'if()' function call.<\/span> <span class=\"sg\" data-s=\"1\">Please use     whitespace instead of parentheses.     at /Users/ash/raku-course/t.raku:1     ------&gt; if⏏(True != False) {     Unexpected block in infix position (two terms in a row)     at /Users/ash/raku-course/t.raku:1     ------&gt; if(True != False)⏏ {<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum <code>if<\/code> parentheses omnino non requiris.<\/span> <span class=\"sg\" data-s=\"1\">Itaque si eis non uteris, problema apparere non potest.<\/span> <span class=\"sg\" data-s=\"2\">Sed in aliquibus casibus eas requiris, exempli gratia cum <code>loop<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tum spatium necessarium est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>loop(my $c = 0; $c != 10; $c++) { say $c }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Idem in hoc codice fit: compilator <code>loop(...)<\/code> ut vocationem functionis accipit.<\/span> <span class=\"sg\" data-s=\"1\">Adde spatium ut problema solvas.<\/span> <span class=\"sg\" data-s=\"2\">Aut, etiam melius, hanc partem codicis cum <code>for<\/code> rescribe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Conclusio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Breviter, ut talia problemata vites, duas regulas sequere.<\/span> <span class=\"sg\" data-s=\"1\">Noli spatium ponere inter nomen functionis et parentheses cum argumentis eius.<\/span> <span class=\"sg\" data-s=\"2\">Etiam conare parentheses vitare in aliis partibus linguae, ut in fluxu imperii.<\/span><\/p>"]]}}}</script>
