<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/multi-functions","n":304,"k":"topic","pv":"essentials/more-on-functions/return-type/quiz","nx":"essentials/more-on-functions/multi-functions/quiz1","tr":["essentials","essentials/more-on-functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multi-functions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku has <em>multiple dispatch<\/em> based on the function signature.<\/span> <span class=\"sg\" data-s=\"1\">It lets you create functions with the same name but different types of input data.<\/span> <span class=\"sg\" data-s=\"2\">Use the <code>multi<\/code> declarator for each variant of the function.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">It is fine to leave out <code>sub<\/code> after <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">When there are two variants of the same function, the compiler performs multiple dispatch.<\/span> <span class=\"sg\" data-s=\"1\">Its choice depends on which arguments it sees in the function call.<\/span> <span class=\"sg\" data-s=\"2\">Compare these two calls:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The first call runs the variant with integer parameters.<\/span> <span class=\"sg\" data-s=\"1\">The second call runs the other variant, which expects two strings.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literal parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An interesting use of multi-functions is variants with literal values as parameters.<\/span> <span class=\"sg\" data-s=\"1\">Look at the following two variants:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'This is the answer'}\nmulti sub f($x) {say \"$x is not the answer\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The first variant runs only when you call the function with exactly 42.<\/span> <span class=\"sg\" data-s=\"1\">In all other cases, Raku uses the second variant.<\/span> <span class=\"sg\" data-s=\"2\">It does not matter in which order these functions are defined.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is not the answer\nf(42); # This is the answer<\/code><\/pre>"]]},"de":{"t":"Multi-Funktionen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hat <em>Multiple Dispatch<\/em>, das auf der Funktionssignatur basiert.<\/span> <span class=\"sg\" data-s=\"1\">Damit können Sie Funktionen mit demselben Namen, aber verschiedenen Typen von Eingabedaten erstellen.<\/span> <span class=\"sg\" data-s=\"2\">Verwenden Sie den Deklarator <code>multi<\/code> für jede Variante der Funktion.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Es ist in Ordnung, <code>sub<\/code> nach <code>multi<\/code> wegzulassen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn es zwei Varianten derselben Funktion gibt, führt der Compiler Multiple Dispatch durch.<\/span> <span class=\"sg\" data-s=\"1\">Seine Wahl hängt davon ab, welche Argumente er im Funktionsaufruf sieht.<\/span> <span class=\"sg\" data-s=\"2\">Vergleichen Sie diese zwei Aufrufe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der erste Aufruf führt die Variante mit ganzzahligen Parametern aus.<\/span> <span class=\"sg\" data-s=\"1\">Der zweite Aufruf führt die andere Variante aus, die zwei Zeichenketten erwartet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literale Parameter<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine interessante Verwendung von Multi-Funktionen sind Varianten mit literalen Werten als Parametern.<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich die folgenden zwei Varianten an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Das ist die Antwort'}\nmulti sub f($x) {say \"$x ist nicht die Antwort\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die erste Variante läuft nur, wenn Sie die Funktion mit genau 42 aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">In allen anderen Fällen verwendet Raku die zweite Variante.<\/span> <span class=\"sg\" data-s=\"2\">Es spielt keine Rolle, in welcher Reihenfolge diese Funktionen definiert sind.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ist nicht die Antwort\nf(42); # Das ist die Antwort<\/code><\/pre>"]]},"nl":{"t":"Multi-functies","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku heeft <em>meervoudige dispatch<\/em> op basis van de functiesignatuur.<\/span> <span class=\"sg\" data-s=\"1\">Daarmee kun je functies maken met dezelfde naam, maar met verschillende soorten invoergegevens.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik de declarator <code>multi<\/code> voor elke variant van de functie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het is prima om <code>sub<\/code> na <code>multi<\/code> weg te laten.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als er twee varianten van dezelfde functie zijn, voert de compiler meervoudige dispatch uit.<\/span> <span class=\"sg\" data-s=\"1\">Zijn keuze hangt af van de argumenten die hij in de functieaanroep ziet.<\/span> <span class=\"sg\" data-s=\"2\">Vergelijk deze twee aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De eerste aanroep voert de variant met integer-parameters uit.<\/span> <span class=\"sg\" data-s=\"1\">De tweede aanroep voert de andere variant uit, die twee strings verwacht.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Letterlijke parameters<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een interessant gebruik van multi-functies zijn varianten met letterlijke waarden als parameters.<\/span> <span class=\"sg\" data-s=\"1\">Kijk naar de volgende twee varianten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Dit is het antwoord'}\nmulti sub f($x) {say \"$x is niet het antwoord\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De eerste variant wordt alleen uitgevoerd als je de functie met precies 42 aanroept.<\/span> <span class=\"sg\" data-s=\"1\">In alle andere gevallen gebruikt Raku de tweede variant.<\/span> <span class=\"sg\" data-s=\"2\">Het maakt niet uit in welke volgorde deze functies gedefinieerd zijn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 is niet het antwoord\nf(42); # Dit is het antwoord<\/code><\/pre>"]]},"es":{"t":"Multi-funciones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku tiene <em>despacho múltiple<\/em> basado en la firma de la función.<\/span> <span class=\"sg\" data-s=\"1\">Te permite crear funciones con el mismo nombre pero con diferentes tipos de datos de entrada.<\/span> <span class=\"sg\" data-s=\"2\">Usa el declarador <code>multi<\/code> para cada variante de la función.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Está bien omitir <code>sub<\/code> después de <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando hay dos variantes de la misma función, el compilador hace un despacho múltiple.<\/span> <span class=\"sg\" data-s=\"1\">Su elección depende de los argumentos que ve en la llamada a la función.<\/span> <span class=\"sg\" data-s=\"2\">Compara estas dos llamadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La primera llamada ejecuta la variante con parámetros enteros.<\/span> <span class=\"sg\" data-s=\"1\">La segunda llamada ejecuta la otra variante, que espera dos cadenas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros literales<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un uso interesante de las multi-funciones son las variantes con valores literales como parámetros.<\/span> <span class=\"sg\" data-s=\"1\">Mira las siguientes dos variantes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Esta es la respuesta'}\nmulti sub f($x) {say \"$x no es la respuesta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La primera variante se ejecuta solo cuando llamas a la función con exactamente 42.<\/span> <span class=\"sg\" data-s=\"1\">En todos los otros casos, Raku usa la segunda variante.<\/span> <span class=\"sg\" data-s=\"2\">No importa en qué orden se definen estas funciones.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 no es la respuesta\nf(42); # Esta es la respuesta<\/code><\/pre>"]]},"it":{"t":"Multi-funzioni","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ha il <em>multiple dispatch<\/em> basato sulla firma della funzione.<\/span> <span class=\"sg\" data-s=\"1\">Ti permette di creare funzioni con lo stesso nome ma con tipi diversi di dati di input.<\/span> <span class=\"sg\" data-s=\"2\">Usa il dichiaratore <code>multi<\/code> per ogni variante della funzione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Va bene non scrivere <code>sub<\/code> dopo <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando ci sono due varianti della stessa funzione, il compilatore esegue il multiple dispatch.<\/span> <span class=\"sg\" data-s=\"1\">La sua scelta dipende dagli argomenti che vede nella chiamata della funzione.<\/span> <span class=\"sg\" data-s=\"2\">Confronta queste due chiamate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prima chiamata esegue la variante con parametri interi.<\/span> <span class=\"sg\" data-s=\"1\">La seconda chiamata esegue l'altra variante, che si aspetta due stringhe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri letterali<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un uso interessante delle multi-funzioni sono le varianti con valori letterali come parametri.<\/span> <span class=\"sg\" data-s=\"1\">Guarda le seguenti due varianti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Questa è la risposta'}\nmulti sub f($x) {say \"$x non è la risposta\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La prima variante viene eseguita solo quando chiami la funzione proprio con 42.<\/span> <span class=\"sg\" data-s=\"1\">In tutti gli altri casi, Raku usa la seconda variante.<\/span> <span class=\"sg\" data-s=\"2\">Non importa in quale ordine sono definite queste funzioni.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non è la risposta\nf(42); # Questa è la risposta<\/code><\/pre>"]]},"lv":{"t":"Daudzfunkcijas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir <em>vairākkārtējs izsaukums<\/em>, kas balstās uz funkcijas parakstu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj izveidot funkcijas ar vienādu nosaukumu, bet ar dažādiem ievaddatu tipiem.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet <code>multi<\/code> deklaratoru katram funkcijas variantam.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēc <code>multi<\/code> drīkst izlaist <code>sub<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja vienai funkcijai ir divi varianti, kompilators veic vairākkārtēju izsaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izvēle ir atkarīga no tā, kādus argumentus tas redz funkcijas izsaukumā.<\/span> <span class=\"sg\" data-s=\"2\">Salīdziniet šos divus izsaukumus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pirmais izsaukums palaiž variantu ar veselu skaitļu parametriem.<\/span> <span class=\"sg\" data-s=\"1\">Otrais izsaukums palaiž otru variantu, kas gaida divas virknes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literālie parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interesants daudzfunkciju lietojums ir varianti ar literālām vērtībām kā parametriem.<\/span> <span class=\"sg\" data-s=\"1\">Apskatiet šādus divus variantus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Šī ir atbilde'}\nmulti sub f($x) {say \"$x nav atbilde\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pirmais variants izpildās tikai tad, ja jūs izsaucat funkciju tieši ar 42.<\/span> <span class=\"sg\" data-s=\"1\">Visos citos gadījumos Raku izmanto otro variantu.<\/span> <span class=\"sg\" data-s=\"2\">Nav svarīgi, kādā secībā šīs funkcijas ir definētas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 nav atbilde\nf(42); # Šī ir atbilde<\/code><\/pre>"]]},"ru":{"t":"Мульти-функции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku есть <em>множественная диспетчеризация<\/em> на основе сигнатуры функции.<\/span> <span class=\"sg\" data-s=\"1\">Она позволяет создавать функции с одним именем, но с разными типами входных данных.<\/span> <span class=\"sg\" data-s=\"2\">Используйте декларатор <code>multi<\/code> для каждого варианта функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">После <code>multi<\/code> вполне можно не писать <code>sub<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда у одной и той же функции два варианта, компилятор выполняет множественную диспетчеризацию.<\/span> <span class=\"sg\" data-s=\"1\">Его выбор зависит от того, какие аргументы он видит в вызове функции.<\/span> <span class=\"sg\" data-s=\"2\">Сравните эти два вызова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Первый вызов запускает вариант с целочисленными параметрами.<\/span> <span class=\"sg\" data-s=\"1\">Второй вызов запускает другой вариант, который ожидает две строки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литеральные параметры<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интересное применение многофункций — варианты с литеральными значениями в качестве параметров.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на следующие два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Это ответ'}\nmulti sub f($x) {say \"$x не является ответом\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Первый вариант выполняется, только когда вы вызываете функцию ровно с 42.<\/span> <span class=\"sg\" data-s=\"1\">Во всех других случаях Raku использует второй вариант.<\/span> <span class=\"sg\" data-s=\"2\">Не важно, в каком порядке определены эти функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не является ответом\nf(42); # Это ответ<\/code><\/pre>"]]},"uk":{"t":"Мульти-функції","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku є <em>множинна диспетчеризація<\/em> на основі сигнатури функції.<\/span> <span class=\"sg\" data-s=\"1\">Вона дає змогу створювати функції з однаковою назвою, але з різними типами вхідних даних.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте декларацію <code>multi<\/code> для кожного варіанта функції.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цілком нормально опустити <code>sub<\/code> після <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли є два варіанти однієї функції, компілятор виконує множинну диспетчеризацію.<\/span> <span class=\"sg\" data-s=\"1\">Його вибір залежить від того, які аргументи він бачить у виклику функції.<\/span> <span class=\"sg\" data-s=\"2\">Порівняйте ці два виклики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перший виклик запускає варіант із цілими параметрами.<\/span> <span class=\"sg\" data-s=\"1\">Другий виклик запускає інший варіант, який очікує два рядки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Літеральні параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цікаве застосування багатофункцій — варіанти з літеральними значеннями як параметрами.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на наступні два варіанти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Це відповідь'}\nmulti sub f($x) {say \"$x не є відповіддю\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перший варіант працює, лише коли ви викликаєте функцію саме з 42.<\/span> <span class=\"sg\" data-s=\"1\">В усіх інших випадках Raku використовує другий варіант.<\/span> <span class=\"sg\" data-s=\"2\">Не має значення, в якому порядку визначені ці функції.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не є відповіддю\nf(42); # Це відповідь<\/code><\/pre>"]]},"bg":{"t":"Мулти-функции","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има <em>многократно разпределение<\/em> според подписа на функцията.<\/span> <span class=\"sg\" data-s=\"1\">То ви позволява да създавате функции с едно и също име, но с различни типове входни данни.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте декларатора <code>multi<\/code> за всеки вариант на функцията.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Не е проблем да пропуснете <code>sub<\/code> след <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато има два варианта на една и съща функция, компилаторът извършва многократно разпределение.<\/span> <span class=\"sg\" data-s=\"1\">Неговият избор зависи от това какви аргументи вижда в извикването на функцията.<\/span> <span class=\"sg\" data-s=\"2\">Сравнете тези две извиквания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Първото извикване изпълнява варианта с целочислени параметри.<\/span> <span class=\"sg\" data-s=\"1\">Второто извикване изпълнява другия вариант, който очаква два низа.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Литерални параметри<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Интересно използване на мулти-функциите са варианти с литерални стойности като параметри.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте следните два варианта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Това е отговорът'}\nmulti sub f($x) {say \"$x не е отговорът\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Първият вариант се изпълнява само когато извикате функцията с точно 42.<\/span> <span class=\"sg\" data-s=\"1\">Във всички други случаи Raku използва втория вариант.<\/span> <span class=\"sg\" data-s=\"2\">Няма значение в какъв ред са дефинирани тези функции.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 не е отговорът\nf(42); # Това е отговорът<\/code><\/pre>"]]},"eo":{"t":"Multi-funkcioj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku havas <em>multoblan sendon<\/em> bazitan sur la funkcia subskribo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi permesas al vi krei funkciojn kun la sama nomo, sed kun malsamaj tipoj de eniraj datumoj.<\/span> <span class=\"sg\" data-s=\"2\">Uzu la deklarilon <code>multi<\/code> por ĉiu varianto de la funkcio.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Estas bone preterlasi <code>sub<\/code> post <code>multi<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam estas du variantoj de la sama funkcio, la kompililo faras multoblan sendon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia elekto dependas de tio, kiujn argumentojn ĝi vidas en la funkcia voko.<\/span> <span class=\"sg\" data-s=\"2\">Komparu ĉi tiujn du vokojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La unua voko rulas la varianton kun entjeraj parametroj.<\/span> <span class=\"sg\" data-s=\"1\">La dua voko rulas la alian varianton, kiu atendas du ĉenojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literalaj parametroj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Interesa uzo de multi-funkcioj estas variantoj kun literalaj valoroj kiel parametroj.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu la jenajn du variantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Ĉi tio estas la respondo'}\nmulti sub f($x) {say \"$x ne estas la respondo\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La unua varianto ruliĝas nur, kiam vi vokas la funkcion kun ĝuste 42.<\/span> <span class=\"sg\" data-s=\"1\">En ĉiuj aliaj kazoj, Raku uzas la duan varianton.<\/span> <span class=\"sg\" data-s=\"2\">Ne gravas, en kiu ordo ĉi tiuj funkcioj estas difinitaj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 ne estas la respondo\nf(42); # Ĉi tio estas la respondo<\/code><\/pre>"]]},"la":{"t":"Multi-functiones","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku <em>multiplicem distributionem<\/em> secundum signaturam functionis habet.<\/span> <span class=\"sg\" data-s=\"1\">Ea tibi permittit functiones creare cum eodem nomine sed diversis typis datorum inputorum.<\/span> <span class=\"sg\" data-s=\"2\">Utere declaratore <code>multi<\/code> pro quaque variante functionis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub add(Int $x, Int $y) { $x + $y }\nmulti sub add(Str $x, Str $y) { $x ~ $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bene est <code>sub<\/code> post <code>multi<\/code> omittere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum duae variantes eiusdem functionis sunt, compilator multiplicem distributionem facit.<\/span> <span class=\"sg\" data-s=\"1\">Electio eius ex argumentis pendet quae in vocatione functionis videt.<\/span> <span class=\"sg\" data-s=\"2\">Compara has duas vocationes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20); # 30\nsay add('10', '20'); # 1020<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prima vocatio variantem cum parametris integris currit.<\/span> <span class=\"sg\" data-s=\"1\">Secunda vocatio alteram variantem currit, quae duas chordas exspectat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Literales parametri<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Usus iucundus multi-functionum sunt variantes cum valoribus literalibus ut parametris.<\/span> <span class=\"sg\" data-s=\"1\">Specta duas variantes sequentes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub f(42) {say 'Hoc est responsum'}\nmulti sub f($x) {say \"$x non est responsum\"}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prima varians solum currit, si functionem cum valore 42 exacte vocas.<\/span> <span class=\"sg\" data-s=\"1\">In omnibus aliis casibus Raku secundam variantem adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Non refert quo ordine hae functiones definiantur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>f(10); # 10 non est responsum\nf(42); # Hoc est responsum<\/code><\/pre>"]]}}}</script>
