<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/typed-parameters","n":300,"k":"topic","pv":"essentials/more-on-functions/mind-the-space","nx":"essentials/more-on-functions/typed-parameters/quiz","tr":["essentials","essentials/more-on-functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Typed parameters of functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, you can restrict function parameters to a type.<\/span> <span class=\"sg\" data-s=\"1\">This is very similar to <a href=\"/essentials/typed-variables/type-constraints/\">typed variables<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Now the function requires its arguments to be integers.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Passing a value of any type other than <code>Int<\/code> causes a compile-time error.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Note that Raku will not convert the types automatically here.<\/span> <span class=\"sg\" data-s=\"1\">In other cases, it can do such a conversion.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK and is 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## How to know if it is a compile-time error If the error message starts with <code>===SORRY!=== Error while compiling<\/code>, the error happened at compile time. %%/tipblock<\/span><\/p>"]]},"de":{"t":"Typisierte Parameter","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku können Sie Funktionsparameter auf einen Typ beschränken.<\/span> <span class=\"sg\" data-s=\"1\">Das ist sehr ähnlich wie bei <a href=\"https://course.raku.org/de/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">typisierten Variablen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jetzt verlangt die Funktion, dass ihre Argumente ganze Zahlen sind.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fehler<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einen Wert von einem anderen Typ als <code>Int<\/code> übergeben, gibt es einen Kompilierungsfehler.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Fehler beim Kompilieren von t.raku\nDas Aufrufen von add(Num, Num) wird niemals mit der deklarierten Signatur (Int $x, Int $y) funktionieren\nin t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Raku die Typen hier nicht automatisch umwandelt.<\/span> <span class=\"sg\" data-s=\"1\">In anderen Fällen kann Raku so eine Umwandlung machen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fehler\nsay '3' + '4'; # OK und ergibt 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Woran man einen Kompilierungsfehler erkennt Wenn die Fehlermeldung mit <code>===SORRY!=== Fehler beim Kompilieren<\/code> beginnt, ist der Fehler zur Kompilierzeit passiert. %%/tipblock<\/span><\/p>"]]},"nl":{"t":"Getypte parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku kun je functieparameters tot één type beperken.<\/span> <span class=\"sg\" data-s=\"1\">Dit lijkt heel erg op <a href=\"https://course.raku.org/nl/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">getypte variabelen<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nu eist de functie dat de argumenten gehele getallen zijn.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Fout<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je een waarde van een ander type dan <code>Int<\/code> doorgeeft, krijg je een compile-tijd fout.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Let op dat Raku de types hier niet automatisch omzet.<\/span> <span class=\"sg\" data-s=\"1\">In andere gevallen kan Raku zo'n omzetting wel doen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Fout\nsay '3' + '4'; # OK en is 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Hoe weet je of het een compile-tijd fout is Als het foutbericht begint met <code>===SORRY!=== Error while compiling<\/code>, dan gebeurde de fout op compile-tijd. %%/tipblock<\/span><\/p>"]]},"es":{"t":"Parámetros tipados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, puedes limitar los parámetros de una función a un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Esto es muy similar a las <a href=\"https://course.raku.org/es/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variables tipadas<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora la función exige que sus argumentos sean enteros.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pasar un valor de cualquier tipo que no sea <code>Int<\/code> causa un error de compilación.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota que aquí Raku no convertirá los tipos automáticamente.<\/span> <span class=\"sg\" data-s=\"1\">En otros casos, sí puede hacer esta conversión.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK y es 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Cómo saber si es un error de compilación Si el mensaje de error empieza con <code>===SORRY!=== Error while compiling<\/code>, el error ocurrió en tiempo de compilación. %%/tipblock<\/span><\/p>"]]},"it":{"t":"Parametri tipizzati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku, puoi limitare i parametri di una funzione a un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Questo è molto simile alle <a href=\"https://course.raku.org/it/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabili tipizzate<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora la funzione richiede che i suoi argomenti siano numeri interi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Errore<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Passare un valore di un tipo diverso da <code>Int<\/code> causa un errore di compilazione.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota che qui Raku non convertirà i tipi in automatico.<\/span> <span class=\"sg\" data-s=\"1\">In altri casi, può fare questa conversione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Errore\nsay '3' + '4'; # OK ed è 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Come capire se è un errore di compilazione Se il messaggio di errore inizia con <code>===SORRY!=== Error while compiling<\/code>, l'errore è avvenuto durante la compilazione. %%/tipblock<\/span><\/p>"]]},"lv":{"t":"Tipizētie parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā jūs varat ierobežot funkcijas parametrus ar tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir ļoti līdzīgi <a href=\"https://course.raku.org/lv/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tipizētajiem mainīgajiem<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad funkcija prasa, lai tās argumenti būtu veseli skaitļi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Kļūda<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jūs nododat vērtību, kuras tips nav <code>Int<\/code>, rodas kļūda kompilācijas laikā.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Kļūda kompilējot t.raku\nIzsaukums add(Num, Num) nekad nedarbosies ar deklarēto parakstu (Int $x, Int $y)\nt.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka šeit Raku automātiski nekonvertēs tipus.<\/span> <span class=\"sg\" data-s=\"1\">Citos gadījumos tas var veikt šādu konvertēšanu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Kļūda\nsay '3' + '4'; # OK un ir 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Kā zināt, vai tā ir kļūda kompilācijas laikā Ja kļūdas ziņojums sākas ar <code>===SORRY!=== Kļūda kompilējot<\/code>, kļūda notika kompilācijas laikā. %%/tipblock<\/span><\/p>"]]},"ru":{"t":"Типизированные параметры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku параметры функций можно ограничить типом.<\/span> <span class=\"sg\" data-s=\"1\">Это очень похоже на <a href=\"https://course.raku.org/ru/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизированные переменные<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь функция требует, чтобы её аргументы были целыми числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Ошибка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если передать значение любого другого типа, кроме <code>Int<\/code>, будет ошибка времени компиляции.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что здесь Raku не будет автоматически преобразовывать типы.<\/span> <span class=\"sg\" data-s=\"1\">В других случаях он может сделать такое преобразование.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Ошибка\nsay '3' + '4'; # OK и результат 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Как понять, что это ошибка времени компиляции Если сообщение об ошибке начинается с <code>===SORRY!=== Error while compiling<\/code>, значит, ошибка произошла во время компиляции. %%/tipblock<\/span><\/p>"]]},"uk":{"t":"Типізовані параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У Raku ви можете обмежити параметри функції певним типом.<\/span> <span class=\"sg\" data-s=\"1\">Це дуже схоже на <a href=\"https://course.raku.org/uk/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типізовані змінні<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер функція вимагає, щоб її аргументи були цілими числами.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Помилка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо передати значення будь-якого іншого типу, ніж <code>Int<\/code>, буде помилка під час компіляції.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що тут Raku не перетворюватиме типи автоматично.<\/span> <span class=\"sg\" data-s=\"1\">В інших випадках він може зробити таке перетворення.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Помилка\nsay '3' + '4'; # OK і результат 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Як дізнатися, чи це помилка під час компіляції Якщо повідомлення про помилку починається з <code>===SORRY!=== Error while compiling<\/code>, помилка сталася під час компіляції. %%/tipblock<\/span><\/p>"]]},"bg":{"t":"Типизирани параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku можете да ограничите параметрите на функцията до определен тип.<\/span> <span class=\"sg\" data-s=\"1\">Това е много подобно на <a href=\"https://course.raku.org/bg/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">типизираните променливи<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега функцията изисква нейните аргументи да бъдат цели числа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Грешка<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако предадете стойност от тип, различен от <code>Int<\/code>, получавате грешка по време на компилация.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че тук Raku няма автоматично да превърне типовете.<\/span> <span class=\"sg\" data-s=\"1\">В други случаи Raku може да направи такова превръщане.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Грешка\nsay '3' + '4'; # ОК и е 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Как да разберете дали грешката е по време на компилация Ако съобщението за грешка започва с <code>===SORRY!=== Error while compiling<\/code>, грешката е станала по време на компилация. %%/tipblock<\/span><\/p>"]]},"eo":{"t":"Tipitaj parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En Raku, vi povas limigi parametrojn de funkcioj al tipo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas tre simila al <a href=\"https://course.raku.org/eo/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">tipitaj variabloj<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la funkcio postulas, ke ĝiaj argumentoj estu entjeroj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Eraro<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pasi valoron de iu ajn alia tipo ol <code>Int<\/code> kaŭzas kompila-tempan eraron.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Notu, ke Raku ne aŭtomate konvertos la tipojn ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">En aliaj kazoj, ĝi povas fari tian konverton.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Eraro\nsay '3' + '4'; # BONE kaj estas 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Kiel scii, ĉu ĝi estas kompila-tempa eraro Se la erarmesaĝo komenciĝas per <code>===SORRY!=== Error while compiling<\/code>, la eraro okazis dum kompila tempo. %%/tipblock<\/span><\/p>"]]},"la":{"t":"Typis parametra","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In Raku parametros functionis ad typum restringere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc valde simile est <a href=\"https://course.raku.org/la/essentials/typed-variables/type-constraints/\" target=\"_blank\" rel=\"noopener\">variabilibus typatis<\/a>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) { $x + $y }<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc functio postulat ut argumenta sua numeri integri sint.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say add(10, 20);\n# say add(pi, e); # Error<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valor cuiuslibet typi praeter <code>Int<\/code> errorem temporis compilationis facit.<\/span><\/p>"],["code",0,"<pre><code>$ raku t.raku\n===SORRY!=== Error while compiling t.raku\nCalling add(Num, Num) will never work with declared signature (Int $x, Int $y)\nat t.raku:5\n------&gt; say ⏏add(pi, e);<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nota: Raku hic typos automatice non convertet.<\/span> <span class=\"sg\" data-s=\"1\">In aliis casibus talem conversionem facere potest.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code># say add('3', '4'); # Error\nsay '3' + '4'; # OK et est 7<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">%%tipblock ## Quomodo scire an error temporis compilationis sit Si nuntius erroris a <code>===SORRY!=== Error while compiling<\/code> incipit, error tempore compilationis accidit. %%/tipblock<\/span><\/p>"]]}}}</script>
