ku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentārs<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka programma pārvērš ievades argumentu par veselu skaitli: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas novērš bezgalīgu ciklu, kad ievades skaitlis ir <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bez šīs pārvēršanas funkcija <code>factorial<\/code> saņem <a href=\"https://course.raku.org/lv/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a> tipa vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Daudzfunkcijas pirmais variants nevar uztvert šādu izsaukumu.<\/span> <span class=\"sg\" data-s=\"4\">Bet rekursīvajā izsaukumā <code>factorial(2 - 1)<\/code> arguments ir vesels skaitlis.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc Raku var izsaukt pirmo variantu.<\/span><\/p>"]]},"ru":{"t":"Решение: Факториал с мульти-функциями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Это упражнение снова о факториалах.<\/span> <span class=\"sg\" data-s=\"1\">На самом деле эта задача позволяет нам показать больше возможностей Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Факториал можно вычислить, если начать с данного числа и идти вниз.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае нужно остановиться, когда число дойдёт до 1.<\/span> <span class=\"sg\" data-s=\"2\">Multi-функции позволяют это сделать.<\/span> <span class=\"sg\" data-s=\"3\">Перенесите случай <code>$n == 1<\/code> в отдельную multi-функцию.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот решение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Найдите программу в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарий<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что программа преобразует входной аргумент в целое число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это защищает от бесконечного цикла, когда входное число равно <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без преобразования функция <code>factorial<\/code> получает значение типа <a href=\"https://course.raku.org/ru/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Первый вариант multi-функции не может поймать такой вызов.<\/span> <span class=\"sg\" data-s=\"4\">Но в рекурсивном вызове <code>factorial(2 - 1)<\/code> аргумент — целое число.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому Raku может вызвать первый вариант.<\/span><\/p>"]]},"uk":{"t":"Solution: Факторіал з мульти-функціями","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ця вправа знову про факторіали.<\/span> <span class=\"sg\" data-s=\"1\">Насправді це завдання дає нам змогу показати більше можливостей Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Факторіал можна обчислити, якщо почати з даного числа і рухатися вниз.<\/span> <span class=\"sg\" data-s=\"1\">Тоді треба зупинитися, коли число дійде до 1.<\/span> <span class=\"sg\" data-s=\"2\">Multi-функції дозволяють це зробити.<\/span> <span class=\"sg\" data-s=\"3\">Винесіть випадок <code>$n == 1<\/code> в окрему multi-функцію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось розв'язок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Знайдіть програму у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що програма перетворює вхідний аргумент на ціле число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так ви уникаєте нескінченного циклу, коли вхідне число — <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без перетворення функція <code>factorial<\/code> отримує значення типу <a href=\"https://course.raku.org/uk/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Перший варіант multi-функції не може перехопити такий виклик.<\/span> <span class=\"sg\" data-s=\"4\">Але в рекурсивному виклику <code>factorial(2 - 1)<\/code> аргумент — ціле число.<\/span> <span class=\"sg\" data-s=\"5\">Тому Raku може викликати перший варіант.<\/span><\/p>"]]},"bg":{"t":"Solution: Факториел с мулти-функции","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Това упражнение отново е за факториели.<\/span> <span class=\"sg\" data-s=\"1\">Всъщност тази задача ни позволява да покажем още възможности на Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да изчислите факториел, като започнете от даденото число и вървите надолу.<\/span> <span class=\"sg\" data-s=\"1\">В този случай трябва да спрете, когато числото стигне до 1.<\/span> <span class=\"sg\" data-s=\"2\">Мулти-функциите ви позволяват да направите това.<\/span> <span class=\"sg\" data-s=\"3\">Преместете случая <code>$n == 1<\/code> в отделна мулти-функция.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето решението:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментар<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обърнете внимание, че програмата превръща входния аргумент в цяло число: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това предпазва от безкраен цикъл, когато входното число е <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Без това превръщане функцията <code>factorial<\/code> получава стойност от тип <a href=\"https://course.raku.org/bg/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Първият вариант на мулти-функцията не може да хване такова извикване.<\/span> <span class=\"sg\" data-s=\"4\">Но при рекурсивното извикване <code>factorial(2 - 1)<\/code> аргументът е цяло число.<\/span> <span class=\"sg\" data-s=\"5\">Затова Raku може да извика първия вариант.<\/span><\/p>"]]},"eo":{"t":"Solvo: Faktorialo kun multi-funkcioj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzerco denove temas pri faktorioj.<\/span> <span class=\"sg\" data-s=\"1\">Fakte, ĉi tiu tasko permesas al ni montri pli da trajtoj de Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas kalkuli faktorion, komencante de la donita nombro kaj irante malsupren.<\/span> <span class=\"sg\" data-s=\"1\">En tiu kazo, vi devas halti, kiam la nombro atingas 1.<\/span> <span class=\"sg\" data-s=\"2\">Multi-funkcioj permesas al vi fari tion.<\/span> <span class=\"sg\" data-s=\"3\">Movu la kazon <code>$n == 1<\/code> al aparta multi-funkcio.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la solvo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trovu la programon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komento<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke la programo konvertas la enigan argumenton al entjero: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio evitas senfinan buklon, kiam la eniga nombro estas <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sen la konverto, la funkcio <code>factorial<\/code> ricevas valoron de tipo <a href=\"https://course.raku.org/eo/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"3\">La unua variaĵo de la multi-funkcio ne povas kapti tian vokon.<\/span> <span class=\"sg\" data-s=\"4\">Sed en la rekursia voko <code>factorial(2 - 1)<\/code>, la argumento estas entjero.<\/span> <span class=\"sg\" data-s=\"5\">Do Raku povas voki la unuan variaĵon.<\/span><\/p>"]]},"la":{"t":"Solutio: Factorial cum multi-functiones","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc exercitium iterum de factorialibus est.<\/span> <span class=\"sg\" data-s=\"1\">Re vera hoc munus nobis permittit plures proprietates Raku ostendere.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Factorialem computare potes incipiendo a numero dato et descendendo.<\/span> <span class=\"sg\" data-s=\"1\">In eo casu consistere debes cum numerus ad 1 pervenit.<\/span> <span class=\"sg\" data-s=\"2\">Multi-functiones hoc tibi permittunt.<\/span> <span class=\"sg\" data-s=\"3\">Transfer casum <code>$n == 1<\/code> in separatam multi-functionem.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est solutio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub factorial(1)  { 1 }\nmulti sub factorial($n) { $n * factorial($n - 1) }\n\nsay factorial(@*ARGS[0].Int);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Invenias programmatum in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/essentials/more-on-functions/factorial-with-multi-functions.raku\" target=\"_blank\" rel=\"noopener\">factorial-with-multi-functions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku exercises/more-on-functions/factorial-with-multi-functions.raku 5\n120<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarium<\/span><\/h3>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Nota programma argumentum inputum in integrum convertere: <code>@*ARGS[0].Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc circulum infinitum prohibet, cum numerus inputus est <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sine conversione functio <code>factorial<\/code> valorem typi <a href=\"https://course.raku.org/la/essentials/typed-variables/allomorphs/\" target=\"_blank\" rel=\"noopener\"><code>IntStr<\/code><\/a> accipit.<\/span> <span class=\"sg\" data-s=\"3\">Prima varians multi-functionis talem vocationem capere non potest.<\/span> <span class=\"sg\" data-s=\"4\">Sed in vocatione recursiva <code>factorial(2 - 1)<\/code> argumentum est integer.<\/span> <span class=\"sg\" data-s=\"5\">Itaque Raku primam variantem vocare potest.<\/span><\/p>"]]}}}</script>
