<script type="application/json" id="page-data">{"u":"essentials/more-on-functions/return-type","n":302,"k":"topic","pv":"essentials/more-on-functions/typed-parameters/quiz","nx":"essentials/more-on-functions/return-type/quiz","tr":["essentials","essentials/more-on-functions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Return type of functions","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also give an explicit type to the result of a function.<\/span> <span class=\"sg\" data-s=\"1\">There are a few ways to write this in code.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Choose the one that you like best.<\/span> <span class=\"sg\" data-s=\"1\">Note the fourth example.<\/span> <span class=\"sg\" data-s=\"2\">There, the return type is inside the parentheses, together with the function parameters.<\/span><\/p>"]]},"de":{"t":"Rückgabetyp","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können dem Ergebnis einer Funktion auch ausdrücklich einen Typ geben.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt ein paar Wege, das im Code zu schreiben.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wählen Sie den Weg, der Ihnen am besten gefällt.<\/span> <span class=\"sg\" data-s=\"1\">Beachten Sie das vierte Beispiel.<\/span> <span class=\"sg\" data-s=\"2\">Dort steht der Rückgabetyp in den Klammern, zusammen mit den Funktionsparametern.<\/span><\/p>"]]},"nl":{"t":"Return type","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt het resultaat van een functie ook een expliciet type geven.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn een paar manieren om dat in code te schrijven.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kies de manier die je het meest bevalt.<\/span> <span class=\"sg\" data-s=\"1\">Let op het vierde voorbeeld.<\/span> <span class=\"sg\" data-s=\"2\">Daar staat het retourtype tussen de haakjes, samen met de parameters van de functie.<\/span><\/p>"]]},"es":{"t":"Tipo de retorno","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes dar un tipo explícito al resultado de una función.<\/span> <span class=\"sg\" data-s=\"1\">Hay algunas formas de escribir esto en el código.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elige la que más te guste.<\/span> <span class=\"sg\" data-s=\"1\">Fíjate en el cuarto ejemplo.<\/span> <span class=\"sg\" data-s=\"2\">Allí, el tipo de retorno está dentro de los paréntesis, junto con los parámetros de la función.<\/span><\/p>"]]},"it":{"t":"Tipo di ritorno","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche dare un tipo esplicito al risultato di una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono alcuni modi per scriverlo nel codice.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scegli quello che ti piace di più.<\/span> <span class=\"sg\" data-s=\"1\">Nota il quarto esempio.<\/span> <span class=\"sg\" data-s=\"2\">Lì, il tipo di ritorno è dentro le parentesi, insieme ai parametri della funzione.<\/span><\/p>"]]},"lv":{"t":"Atgriešanas tips","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī skaidri norādīt funkcijas rezultāta tipu.<\/span> <span class=\"sg\" data-s=\"1\">Ir daži veidi, kā to uzrakstīt kodā.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Izvēlieties to, kas jums patīk vislabāk.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet ceturto piemēru.<\/span> <span class=\"sg\" data-s=\"2\">Tur atgriešanas tips ir iekavās kopā ar funkcijas parametriem.<\/span><\/p>"]]},"ru":{"t":"Тип возвращаемого значения","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Результату функции также можно явно задать тип.<\/span> <span class=\"sg\" data-s=\"1\">Есть несколько способов записать это в коде.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Выберите тот, который вам нравится больше всего.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание на четвёртый пример.<\/span> <span class=\"sg\" data-s=\"2\">Там тип возвращаемого значения стоит внутри скобок, вместе с параметрами функции.<\/span><\/p>"]]},"uk":{"t":"Тип повернення","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви також можете явно задати тип результату функції.<\/span> <span class=\"sg\" data-s=\"1\">Є кі n> <span class=\"sg\" data-s=\"2\">Tie, la revena tipo estas ene de la krampoj, kune kun la parametroj de la funkcio.<\/span><\/p>"]]},"la":{"t":"Redonare typus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam eventui functionis typum explicitum dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Sunt pauci modi ad hoc in codice scribendum.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub add(Int $x, Int $y) returns Int { $x + $y }\n\nmy Int sub add(Int $x, Int $y) { $x + $y }\n\nsub add(Int $x, Int $y) of Int { $x + $y }\n\nsub add(Int $x, Int $y --&gt; Int) { $x + $y }<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elige modum qui tibi optime placet.<\/span> <span class=\"sg\" data-s=\"1\">Nota quartum exemplum.<\/span> <span class=\"sg\" data-s=\"2\">Ibi typus reditus intra parentheses est, una cum parametris functionis.<\/span><\/p>"]]}}}</script>
