n> <span class=\"sg\" data-s=\"4\">Lies sie hier einfach als dritte Art, dieselbe Funktion mit einem Argument zu schreiben.<\/span> <span class=\"sg\" data-s=\"5\">Für einen einfachen Ausdruck ist der Stern am kürzesten.<\/span> <span class=\"sg\" data-s=\"6\">Deshalb kommt er bei <code>map<\/code>, <code>grep<\/code> und <code>sort<\/code> so oft vor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wähle einen <strong>Block<\/strong>, wenn der Code mehr als einen Ausdruck braucht.<\/span> <span class=\"sg\" data-s=\"1\">Ein Block ist auch gut, wenn ein klarer Parametername hilft.<\/span> <span class=\"sg\" data-s=\"2\">Wähle den <strong>Stern<\/strong>, wenn ein kurzer Ausdruck genügt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Mehr als ein Stern<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes <code>*<\/code> im Ausdruck ist ein eigenes Argument, der Reihe nach.<\/span> <span class=\"sg\" data-s=\"1\">Zwei Sterne ergeben also eine Funktion mit <strong>zwei<\/strong> Argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier ist <code>* + *<\/code> eine Funktion mit zwei Argumenten, und sie addiert die beiden.<\/span> <span class=\"sg\" data-s=\"1\">Sie kann zum Beispiel eine laufende Summe und das nächste Element addieren.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der Whatever für sich allein<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Für sich allein bedeutet <code>*<\/code> „was auch immer“: so viel, wie vorhanden ist, oder ohne Grenze.<\/span> <span class=\"sg\" data-s=\"1\">Hier sind zwei häufige Verwendungen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>m \"1\">Een blok is ook goed als een duidelijke parameternaam helpt.<\/span> <span class=\"sg\" data-s=\"2\">Kies de <strong>ster<\/strong> als een korte uitdrukking genoeg is.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Meer dan één ster<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke <code>*<\/code> in de uitdrukking is een eigen argument, op volgorde.<\/span> <span class=\"sg\" data-s=\"1\">Twee sterren maken dus een functie met <strong>twee<\/strong> argumenten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>* + *<\/code> een functie met twee argumenten, en die telt ze op.<\/span> <span class=\"sg\" data-s=\"1\">Ze kan bijvoorbeeld een lopend totaal en het volgende element optellen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De Whatever op zichzelf<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Op zichzelf betekent <code>*<\/code> “wat dan ook”: zoveel als er is, of geen grens.<\/span> <span class=\"sg\" data-s=\"1\">Hier zijn twee veelgebruikte toepassingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is de lengte van de array, dus *-1 is de laatste index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is een open bereik<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> staat de ster voor het aantal elementen.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code> betekent hij “geen bovengrens”.<\/span> <span class=\"sg\" data-s=\"2\">De ster kan een functie bouwen of “wat je maar wilt” betekenen.<\/span> <span class=\"sg\" data-s=\"3\">Hoe dan ook is hij een van de nuttigste korte vormen in Raku.<\/span><\/p>"]]},"es":{"t":"La estrella Whatever","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Puede que hayas visto <code>*<\/code> en expresiones como <code>* * 2<\/code> o <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aparecen en llamadas a <code>map<\/code> y <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ese <code>*<\/code> es la <em>estrella Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La expresión que la rodea crea una pequeña función con un argumento, ahí mismo.<\/span> <span class=\"sg\" data-s=\"4\">Esta sección explica qué es de verdad la estrella y cómo se relaciona con un bloque.<\/span> <span class=\"sg\" data-s=\"5\">También muestra dónde la estrella sola significa simplemente \"lo que quieras\".<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una estrella crea una función<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando una expresión contiene <code>*<\/code>, Raku convierte toda la expresión en una función, un <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En esta función, la estrella representa el argumento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> es una función que multiplica su único argumento por dos.<\/span> <span class=\"sg\" data-s=\"1\">Por eso funciona <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> recibe exactamente una función así, con un argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever comparado con un bloque<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una expresión Whatever es una forma más corta de escribir una función.<\/span> <span class=\"sg\" data-s=\"1\">También podrías escribir esta función como un bloque.<\/span> <span class=\"sg\" data-s=\"2\">Estas tres son iguales:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever no nombra ningún parámetro.<\/span> <span class=\"sg\" data-s=\"1\">La forma de bloque usa la variable tópica <code>$_<\/code>, y la forma puntiaguda nombra <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La última, <code>-&gt; $x { ... }<\/code>, es una pequeña función por sí misma.<\/span> <span class=\"sg\" data-s=\"3\">La aprenderás bien en <a href=\"https://course.raku.org/es/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subrutinas anónimas<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Aquí, léela solo como una tercera forma de escribir la misma función de un argumento.<\/span> <span class=\"sg\" data-s=\"5\">Para una expresión simple, la estrella es la más corta.<\/span> <span class=\"sg\" data-s=\"6\">Por eso es tan común con <code>map<\/code>, <code>grep<\/code> y <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elige un <strong>bloque<\/strong> cuando el código necesite más de una expresión.<\/span> <span class=\"sg\" data-s=\"1\">Un bloque también es bueno cuando ayude un nombre de parámetro claro.<\/span> <span class=\"sg\" data-s=\"2\">Elige la <strong>estrella<\/strong> cuando baste con una expresión corta.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Más de una estrella<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada <code>*<\/code> en la expresión es un argumento propio, en orden.<\/span> <span class=\"sg\" data-s=\"1\">Así que dos estrellas crean una función con <strong>dos<\/strong> argumentos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>* + *<\/code> es una función con dos argumentos, y los suma.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, puede sumar un total acumulado y el siguiente elemento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La estrella Whatever por sí sola<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por sí sola, <code>*<\/code> significa \"lo que sea\": todo lo que haya, o sin límite.<\/span> <span class=\"sg\" data-s=\"1\">Aquí tienes dos usos comunes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * es la longitud del arreglo, asi que *-1 es el ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* es un rango abierto<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code>, la estrella representa el número de elementos.<\/span> <span class=\"sg\" data-s=\"1\">En <code>1..*<\/code>, significa \"sin límite superior\".<\/span> <span class=\"sg\" data-s=\"2\">La estrella puede crear una función o significar \"lo que quieras\".<\/span> <span class=\"sg\" data-s=\"3\">En cualquier caso, es una de las formas cortas más útiles de Raku.<\/span><\/p>"]]},"it":{"t":"La stella Whatever","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Forse hai visto <code>*<\/code> in espressioni come <code>* * 2<\/code> o <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Compaiono nelle chiamate a <code>map<\/code> e <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quel <code>*<\/code> è la <em>Whatever star<\/em> (stella Whatever).<\/span> <span class=\"sg\" data-s=\"3\">L'espressione intorno alla stella crea una piccola funzione con un argomento, proprio sul posto.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione spiega che cos'è davvero la stella e che rapporto ha con un blocco.<\/span> <span class=\"sg\" data-s=\"5\">Mostra anche dove la stella da sola significa semplicemente “qualsiasi cosa tu voglia”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Una stella crea una funzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando un'espressione contiene <code>*<\/code>, Raku trasforma tutta l'espressione in una funzione, un <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In questa funzione, la stella rappresenta l'argomento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> è una funzione che moltiplica per due il suo unico argomento.<\/span> <span class=\"sg\" data-s=\"1\">Ecco perché <code>(1..5).map(* * 2)<\/code> funziona.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> riceve proprio una funzione così, con un argomento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever a confronto con un blocco<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un'espressione Whatever è un modo più breve per scrivere una funzione.<\/span> <span class=\"sg\" data-s=\"1\">Potresti scrivere questa funzione anche come blocco.<\/span> <span class=\"sg\" data-s=\"2\">Queste tre forme sono uguali:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La forma Whatever non dà un nome al parametro.<\/span> <span class=\"sg\" data-s=\"1\">La forma a blocco usa la variabile topic <code>$_<\/code>, e la forma pointy usa il nome <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'ultima, <code>-&gt; $x { ... }<\/code>, è già da sola una piccola funzione.<\/span> <span class=\"sg\" data-s=\"3\">La studierai bene in <a href=\"https://course.raku.org/it/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subroutine anonime<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Qui leggila solo come un terzo modo di scrivere la stessa funzione a un argomento.<\/span> <span class=\"sg\" data-s=\"5\">Per un'espressione semplice, la stella è la forma più corta.<\/span> <span class=\"sg\" data-s=\"6\">Per questo è così comune con <code>map<\/code>, <code>grep<\/code> e <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scegli un <strong>blocco<\/strong> quando il codice ha bisogno di più di un'espressione.<\/span> <span class=\"sg\" data-s=\"1\">Un blocco va bene anche quando aiuta un nome chiaro per il parametro.<\/span> <span class=\"sg\" data-s=\"2\">Scegli la <strong>stella<\/strong> quando basta un'espressione breve.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piu di una stella<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>*<\/code> nell'espressione è un argomento a sé, in ordine.<\/span> <span class=\"sg\" data-s=\"1\">Quindi due stelle creano una funzione con <strong>due<\/strong> argomenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>* + *<\/code> è una funzione con due argomenti, e li somma.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, può sommare un totale parziale e l'elemento successivo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il Whatever da solo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da sola, <code>*<\/code> significa “qualsiasi cosa”: tutto quello che c'è, o nessun limite.<\/span> <span class=\"sg\" data-s=\"1\">Ecco due usi comuni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * è la lunghezza dell'array, quindi *-1 è l'ultimo indice\n\nsay (1..*).head(3); # (1 2 3)  — 1..* è un intervallo aperto<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code>, la stella rappresenta il numero di elementi.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code>, significa “nessun limite superiore”.<\/span> <span class=\"sg\" data-s=\"2\">La stella può costruire una funzione o significare “qualsiasi cosa tu voglia”.<\/span> <span class=\"sg\" data-s=\"3\">In ogni caso, è una delle forme brevi più utili in Raku.<\/span><\/p>"]]},"lv":{"t":"Whatever zvaigzne 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Jūs, iespējams, esat redzējuši <code>*<\/code> izteiksmēs, piemēram, <code>* * 2<\/code> vai <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās parādās <code>map<\/code> un <code>grep<\/code> izsaukumos.<\/span> <span class=\"sg\" data-s=\"2\">Šī <code>*<\/code> ir <em>Whatever zvaigznīte<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Izteiksme ap to izveido mazu funkciju ar vienu argumentu, turpat uz vietas.<\/span> <span class=\"sg\" data-s=\"4\">Šī sadaļa paskaidro, kas īsti ir zvaigznīte un kā tā saistās ar bloku.<\/span> <span class=\"sg\" data-s=\"5\">Tā arī parāda, kur viena pati zvaigznīte vienkārši nozīmē «cik nu vēlaties».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Zvaigznīte veido funkciju<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad izteiksmē ir <code>*<\/code>, Raku pārvērš visu izteiksmi par funkciju — <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šajā funkcijā zvaigznīte apzīmē argumentu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> ir funkcija, kas savu vienīgo argumentu reizina ar diviem.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tāpēc <code>(1..5).map(* * 2)<\/code> darbojas.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> saņem tieši tādu funkciju ar vienu argumentu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever salīdzinājumā ar bloku<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever izteiksme ir īsāks veids, kā uzrakstīt funkciju.<\/span> <span class=\"sg\" data-s=\"1\">Šo funkciju varētu uzrakstīt arī kā bloku.<\/span> <span class=\"sg\" data-s=\"2\">Šie trīs varianti ir vienādi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Whatever forma nenosauc nevienu parametru.<\/span> <span class=\"sg\" data-s=\"1\">Bloka forma izmanto tēmas mainīgo <code>$_<\/code>, un bultiņas forma nosauc <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēdējā, <code>-&gt; $x { ... }<\/code>, pati par sevi ir maza funkcija.<\/span> <span class=\"sg\" data-s=\"3\">Pienācīgi jūs to apgūsiet sadaļā <a href=\"https://course.raku.org/lv/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonīmas apakšprogrammas<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Šeit vienkārši lasiet to kā trešo veidu, kā uzrakstīt to pašu viena argumenta funkciju.<\/span> <span class=\"sg\" data-s=\"5\">Vienkāršai izteiksmei zvaigznīte ir visīsākā.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc tā ir tik izplatīta ar <code>map<\/code>, <code>grep<\/code> un <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Izvēlieties <strong>bloku<\/strong>, kad kodam vajag vairāk nekā vienu izteiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Bloks ir labs arī tad, kad palīdz skaidrs parametra nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Izvēlieties <strong>zvaigznīti<\/strong>, kad pietiek ar īsu izteiksmi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vairāk nekā viena zvaigznīte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katra <code>*<\/code> izteiksmē ir savs arguments, pēc kārtas.<\/span> <span class=\"sg\" data-s=\"1\">Tātad divas zvaigznītes veido funkciju ar <strong>diviem<\/strong> argumentiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>* + *<\/code> ir funkcija ar diviem argumentiem, un tā tos saskaita.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tā var saskaitīt uzkrāto summu un nākamo elementu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever pati par sevi<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pati par sevi <code>*<\/code> nozīmē «cik nu ir»: cik vien ir vai bez ierobežojuma.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir divi bieži lietojumi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * is the array length, so *-1 is the last index\n\nsay (1..*).head(3); # (1 2 3)  — 1..* is an open-ended range<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izteiksmē <code>@a[*-1]<\/code> zvaigznīte apzīmē elementu skaitu.<\/span> <span class=\"sg\" data-s=\"1\">Izteiksmē <code>1..*<\/code> tā nozīmē «bez augšējās robežas».<\/span> <span class=\"sg\" data-s=\"2\">Zvaigznīte var būvēt funkciju vai nozīmēt «cik nu vēlaties».<\/span> <span class=\"sg\" data-s=\"3\">Jebkurā gadījumā tā ir viens no noderīgākajiem saīsinājumiem Raku valodā.<\/span><\/p>"]]},"ru":{"t":"Звёздочка Whatever","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Возможно, вы уже встречали <code>*<\/code> в выражениях вроде <code>* * 2<\/code> или <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они бывают в вызовах <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эта <code>*<\/code> называется <em>звёздочкой Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Выражение вокруг неё прямо на месте создаёт маленькую функцию с одним аргументом.<\/span> <span class=\"sg\" data-s=\"4\">В этом разделе объясняется, что такое звёздочка на самом деле и как она связана с блоком.<\/span> <span class=\"sg\" data-s=\"5\">Ещё он показывает, где одна звёздочка просто означает «что угодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звёздочка создаёт функцию<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда в выражении есть <code>*<\/code>, Raku превращает всё выражение в функцию — <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этой функции звёздочка обозначает аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — это функция, которая умножает свой единственный аргумент на два.<\/span> <span class=\"sg\" data-s=\"1\">Именно поэтому работает <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> получает как раз такую функцию с одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever в сравнении с блоком<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Выражение Whatever — это более короткий способ записать функцию.<\/span> <span class=\"sg\" data-s=\"1\">Эту функцию можно было бы записать и в виде блока.<\/span> <span class=\"sg\" data-s=\"2\">Эти три записи означают одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Форма Whatever не называет параметр.<\/span> <span class=\"sg\" data-s=\"1\">Форма блока использует топик-переменную <code>$_<\/code>, а стрелочная форма называет параметр <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последняя, <code>-&gt; $x { ... }<\/code>, сама по себе — небольшая функция.<\/span> <span class=\"sg\" data-s=\"3\">Вы как следует познакомитесь с ней в разделе <a href=\"https://course.raku.org/ru/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимные подпрограммы<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Здесь просто читайте её как третий способ записать ту же функцию с одним аргументом.<\/span> <span class=\"sg\" data-s=\"5\">Для простого выражения звёздочка — самая короткая запись.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому её так часто используют с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Выбирайте <strong>блок<\/strong>, когда коду нужно больше одного выражения.<\/span> <span class=\"sg\" data-s=\"1\">Блок хорош и тогда, когда помогает понятное имя параметра.<\/span> <span class=\"sg\" data-s=\"2\">Выбирайте <strong>звёздочку<\/strong>, когда достаточно короткого выражения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Несколько звёздочек<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>*<\/code> в выражении — это свой отдельный аргумент, по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому две звёздочки создают функцию с <strong>двумя<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>* + *<\/code> — функция с двумя аргументами, и она их складывает.<\/span> <span class=\"sg\" data-s=\"1\">Например, она может сложить промежуточную сумму и следующий элемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever сама по себе<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по себе <code>*<\/code> означает «что угодно»: сколько есть или без ограничения.<\/span> <span class=\"sg\" data-s=\"1\">Вот два частых примера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * — это длина массива, поэтому *-1 — последний индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* — это диапазон без верхней границы<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звёздочка обозначает количество элементов.<\/span> <span class=\"sg\" data-s=\"1\">В <code>1..*<\/code> она означает «без верхней границы».<\/span> <span class=\"sg\" data-s=\"2\">Звёздочка может создавать функцию или означать «что угодно».<\/span> <span class=\"sg\" data-s=\"3\">В любом случае это одно из самых полезных сокращений в Raku.<\/span><\/p>"]]},"uk":{"t":"Зірочка Whatever","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви вже бачили <code>*<\/code> у таких виразах, як <code>* * 2<\/code> або <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони трапляються у викликах <code>map<\/code> і <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ця <code>*<\/code> — <em>зірочка Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вираз навколо неї створює невелику функцію з одним аргументом, прямо на місці.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ пояснює, чим насправді є зірочка і як вона пов'язана з блоком.<\/span> <span class=\"sg\" data-s=\"5\">Ще він показує, де сама зірочка просто означає «як завгодно».<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Зірочка створює функцію<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли у виразі є <code>*<\/code>, Raku перетворює весь вираз на функцію — <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У цій функції зірочка позначає аргумент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> — це функція, яка множить свій єдиний аргумент на два.<\/span> <span class=\"sg\" data-s=\"1\">Саме тому працює <code>(1..5).map(* * 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> отримує точно таку функцію з одним аргументом.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever у порівнянні з блоком<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вираз із Whatever — це коротший спосіб записати функцію.<\/span> <span class=\"sg\" data-s=\"1\">Цю функцію можна було б записати й блоком.<\/span> <span class=\"sg\" data-s=\"2\">Ці три записи однакові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Форма з Whatever не називає параметра.<\/span> <span class=\"sg\" data-s=\"1\">Форма з блоком використовує топічну змінну <code>$_<\/code>, а стрілкова форма називає <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Остання, <code>-&gt; $x { ... }<\/code>, сама по собі є невеликою функцією.<\/span> <span class=\"sg\" data-s=\"3\">Ви як слід познайомитеся з нею в розділі <a href=\"https://course.raku.org/uk/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонімні підпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Тут просто читайте її як третій спосіб записати ту саму функцію з одним аргументом.<\/span> <span class=\"sg\" data-s=\"5\">Для простого виразу зірочка найкоротша.<\/span> <span class=\"sg\" data-s=\"6\">Тому вона така поширена з <code>map<\/code>, <code>grep<\/code> і <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вибирайте <strong>блок<\/strong>, коли коду потрібно більше одного виразу.<\/span> <span class=\"sg\" data-s=\"1\">Блок також добрий, коли допомагає зрозуміле ім'я параметра.<\/span> <span class=\"sg\" data-s=\"2\">Вибирайте <strong>зірочку<\/strong>, коли досить короткого виразу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Більше ніж одна зірочка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна <code>*<\/code> у виразі — це свій окремий аргумент, по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Тож дві зірочки створюють функцію з <strong>двома<\/strong> аргументами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>* + *<\/code> — це функція з двома аргументами, і вона їх додає.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, вона може додати накопичену суму й наступний елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever сама по собі<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по собі <code>*<\/code> означає «як завгодно»: скільки є або без обмежень.<\/span> <span class=\"sg\" data-s=\"1\">Ось два поширені застосування:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * це довжина масиву, тож *-1 це останній індекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* це відкритий діапазон<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У <code>@a[*-1]<\/code> зірочка позначає кількість елементів.<\/span> <span class=\"sg\" data-s=\"1\">У <code>1..*<\/code> вона означає «без верхньої межі».<\/span> <span class=\"sg\" data-s=\"2\">Зірочка може будувати функцію або означати «як завгодно».<\/span> <span class=\"sg\" data-s=\"3\">У будь-якому разі це одне з найкорисніших скорочень у Raku.<\/span><\/p>"]]},"bg":{"t":"Звездата Whatever 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Може би сте виждали <code>*<\/code> в изрази като <code>* * 2<\/code> или <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те се срещат при извикване на <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тази <code>*<\/code> е <em>Whatever звездата<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Изразът около нея създава малка функция с един аргумент, точно на място.<\/span> <span class=\"sg\" data-s=\"4\">Този раздел обяснява какво всъщност е звездата и как се отнася към блока.<\/span> <span class=\"sg\" data-s=\"5\">Той показва също къде звездата сама по себе си просто означава „каквото искате“.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звездата създава функция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато един израз съдържа <code>*<\/code>, Raku превръща целия израз във функция, <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В тази функция звездата замества аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> е функция, която умножава единствения си аргумент по две.<\/span> <span class=\"sg\" data-s=\"1\">Ето защо <code>(1..5).map(* * 2)<\/code> работи.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> получава точно такава функция с един аргумент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever в сравнение с блок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever изразът е по-кратък начин да запишете функция.<\/span> <span class=\"sg\" data-s=\"1\">Бихте могли да запишете тази функция и като блок.<\/span> <span class=\"sg\" data-s=\"2\">Тези три са едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Whatever формата не дава име на параметър.<\/span> <span class=\"sg\" data-s=\"1\">Блоковата форма използва тематичната променлива <code>$_<\/code>, а pointy формата дава името <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последната, <code>-&gt; $x { ... }<\/code>, е малка функция сама по себе си.<\/span> <span class=\"sg\" data-s=\"3\">Ще я научите добре в <a href=\"https://course.raku.org/bg/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Анонимни подпрограми<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Тук просто я четете като трети начин да запишете същата функция с един аргумент.<\/span> <span class=\"sg\" data-s=\"5\">За прост израз звездата е най-кратка.<\/span> <span class=\"sg\" data-s=\"6\">Затова тя е толкова честа с <code>map<\/code>, <code>grep<\/code> и <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изберете <strong>блок<\/strong>, когато кодът има нужда от повече от един израз.<\/span> <span class=\"sg\" data-s=\"1\">Блокът е добър избор и когато ясно име на параметър помага.<\/span> <span class=\"sg\" data-s=\"2\">Изберете <strong>звездата<\/strong>, когато кратък израз е достатъчен.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повече от една звезда<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка <code>*<\/code> в израза е свой собствен аргумент, по ред.<\/span> <span class=\"sg\" data-s=\"1\">Така две звезди правят функция с <strong>два<\/strong> аргумента:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>* + *<\/code> е функция с два аргумента и тя ги събира.<\/span> <span class=\"sg\" data-s=\"1\">Например тя може да събере текущата сума и следващия елемент.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever сама по себе си<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сама по себе си <code>*<\/code> означава „каквото и да е“: колкото има, или без ограничение.<\/span> <span class=\"sg\" data-s=\"1\">Ето две често срещани употреби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * е дължината на масива, така че *-1 е последният индекс\n\nsay (1..*).head(3); # (1 2 3)  — 1..* е отворен диапазон<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В <code>@a[*-1]<\/code> звездата замества броя на елементите.<\/span> <span class=\"sg\" data-s=\"1\">В <code>1..*<\/code> тя означава „без горна граница“.<\/span> <span class=\"sg\" data-s=\"2\">Звездата може да създаде функция или да означава „каквото искате“.<\/span> <span class=\"sg\" data-s=\"3\">И в двата случая тя е едно от най-полезните съкращения в Raku.<\/span><\/p>"]]},"eo":{"t":"La Whatever-stelo","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Vi eble vidis <code>*<\/code> en esprimoj kiel <code>* * 2<\/code> aŭ <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili aperas en vokoj de <code>map<\/code> kaj <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiu <code>*<\/code> estas la <em>Whatever-stelo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La esprimo ĉirkaŭ ĝi kreas malgrandan funkcion kun unu argumento, ĝuste surloke.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio klarigas, kio la stelo vere estas kaj kiel ĝi rilatas al bloko.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ankaŭ montras, kie la stelo sola simple signifas “kion ajn vi volas”.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stelo kreas funkcion<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam esprimo enhavas <code>*<\/code>, Raku faras el la tuta esprimo funkcion, <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ĉi tiu funkcio, la stelo reprezentas la argumenton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> estas funkcio, kiu multiplikas sian solan argumenton per du.<\/span> <span class=\"sg\" data-s=\"1\">Tial <code>(1..5).map(* * 2)<\/code> funkcias.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> ricevas ĝuste tian funkcion kun unu argumento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever kompare kun bloko<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Whatever-esprimo estas pli mallonga maniero skribi funkcion.<\/span> <span class=\"sg\" data-s=\"1\">Vi povus skribi ĉi tiun funkcion ankaŭ kiel blokon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj tri estas samaj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La Whatever-formo ne nomas parametron.<\/span> <span class=\"sg\" data-s=\"1\">La blok-formo uzas la teman variablon <code>$_<\/code>, kaj la pinta formo nomas <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La lasta, <code>-&gt; $x { ... }<\/code>, estas mem malgranda funkcio.<\/span> <span class=\"sg\" data-s=\"3\">Vi lernos ĝin ĝuste en <a href=\"https://course.raku.org/eo/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Anonimaj subrutinoj<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tie, simple legu ĝin kiel trian manieron skribi la saman funkcion kun unu argumento.<\/span> <span class=\"sg\" data-s=\"5\">Por simpla esprimo, la stelo estas la plej mallonga.<\/span> <span class=\"sg\" data-s=\"6\">Tial ĝi estas tiel ofta kun <code>map<\/code>, <code>grep<\/code> kaj <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elektu <strong>blokon<\/strong>, kiam la kodo bezonas pli ol unu esprimon.<\/span> <span class=\"sg\" data-s=\"1\">Bloko estas ankaŭ bona, kiam klara nomo de parametro helpas.<\/span> <span class=\"sg\" data-s=\"2\">Elektu la <strong>stelon<\/strong>, kiam mallonga esprimo sufiĉas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pli ol unu stelo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>*<\/code> en la esprimo estas aparta argumento, laŭ ordo.<\/span> <span class=\"sg\" data-s=\"1\">Do du steloj kreas funkcion kun <strong>du<\/strong> argumentoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>* + *<\/code> estas funkcio kun du argumentoj, kaj ĝi adicias ilin.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, ĝi povas adicii kurantan sumon kaj la sekvan elementon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La Whatever sola<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sola, <code>*<\/code> signifas “kion ajn”: tiom, kiom estas, aŭ sen limo.<\/span> <span class=\"sg\" data-s=\"1\">Jen du oftaj uzoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * estas la tabellongo, do *-1 estas la lasta indekso\n\nsay (1..*).head(3); # (1 2 3)  — 1..* estas senfinpunkta amplekso<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En <code>@a[*-1]<\/code>, la stelo reprezentas la nombron de elementoj.<\/span> <span class=\"sg\" data-s=\"1\">En <code>1..*<\/code>, ĝi signifas “sen supra limo”.<\/span> <span class=\"sg\" data-s=\"2\">La stelo povas krei funkcion aŭ signifi “kion ajn vi volas”.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiuokaze, ĝi estas unu el la plej utilaj mallongaj formoj en Raku.<\/span><\/p>"]]},"la":{"t":"Stella Whatever","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Fortasse <code>*<\/code> vidisti in expressionibus ut <code>* * 2<\/code> vel <code>* %% 2<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In vocationibus <code>map<\/code> et <code>grep<\/code> apparent.<\/span> <span class=\"sg\" data-s=\"2\">Illud <code>*<\/code> est <em>stella Whatever<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Expressio circa eam parvam functionem unius argumenti ibi statim creat.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio explicat quid stella vere sit et quomodo ad clausulam se habeat.<\/span> <span class=\"sg\" data-s=\"5\">Etiam ostendit ubi stella sola simpliciter «quidquid vis» significet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stella functionem facit<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum expressio <code>*<\/code> continet, Raku totam expressionem in functionem vertit, in <code>WhateverCode<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In hac functione stella argumentum repraesentat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = * * 2;\n\nsay $double.^name; # WhateverCode\nsay $double(21);   # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>* * 2<\/code> est functio quae unicum argumentum suum per duo multiplicat.<\/span> <span class=\"sg\" data-s=\"1\">Hac de causa <code>(1..5).map(* * 2)<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"2\"><code>map<\/code> prorsus talem functionem unius argumenti accipit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever cum clausula comparatum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Expressio Whatever est modus brevior functionem scribendi.<\/span> <span class=\"sg\" data-s=\"1\">Hanc functionem etiam ut clausulam scribere posses.<\/span> <span class=\"sg\" data-s=\"2\">Haec tria eadem sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>* * 2\n{ $_ * 2 }\n-&gt; $x { $x * 2 }<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Forma Whatever nullum parametrum nominat.<\/span> <span class=\"sg\" data-s=\"1\">Forma clausulae variabilem thematis <code>$_<\/code> adhibet, et forma cuspidata <code>$x<\/code> nominat.<\/span> <span class=\"sg\" data-s=\"2\">Ultima, <code>-&gt; $x { ... }<\/code>, per se parva functio est.<\/span> <span class=\"sg\" data-s=\"3\">Eam proprie in <a href=\"https://course.raku.org/la/advanced/anonymous-subroutines/\" target=\"_blank\" rel=\"noopener\">Subprogrammatis anonymis<\/a> disces.<\/span> <span class=\"sg\" data-s=\"4\">Hic eam tantum lege ut tertium modum quo eadem functio unius argumenti scribitur.<\/span> <span class=\"sg\" data-s=\"5\">Pro expressione simplici stella brevissima est.<\/span> <span class=\"sg\" data-s=\"6\">Ideo tam frequens est cum <code>map<\/code>, <code>grep<\/code> et <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..5).map(* * 2);            # (2 4 6 8 10)\nsay (1..5).map({ $_ * 2 });       # (2 4 6 8 10)\nsay (1..5).map(-&gt; $x { $x * 2 }); # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Clausulam<\/strong> elige cum codex plus quam unam expressionem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Clausula etiam bona est cum clarum nomen parametri adiuvat.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Stellam<\/strong> elige cum brevis expressio satis est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Plures stellae<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaeque <code>*<\/code> in expressione suum argumentum est, ordine.<\/span> <span class=\"sg\" data-s=\"1\">Itaque duae stellae functionem cum <strong>duobus<\/strong> argumentis faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $add = * + *;\n\nsay $add(3, 4); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>* + *<\/code> est functio cum duobus argumentis, et ea addit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, summam adhuc collectam et elementum sequens addere potest.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Whatever per se<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per se <code>*<\/code> «quidquid» significat: quantum est, vel nullum limitem.<\/span> <span class=\"sg\" data-s=\"1\">Ecce duo usus communes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[*-1];        # 30  — * est longitudo ordinis, ergo *-1 est index ultimus\n\nsay (1..*).head(3); # (1 2 3)  — 1..* est intervallum sine fine<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In <code>@a[*-1]<\/code> stella numerum elementorum repraesentat.<\/span> <span class=\"sg\" data-s=\"1\">In <code>1..*<\/code> «nullum terminum superiorem» significat.<\/span> <span class=\"sg\" data-s=\"2\">Stella functionem aedificare potest vel «quidquid vis» significare.<\/span> <span class=\"sg\" data-s=\"3\">Utroque modo, una ex formis brevibus utilissimis in Raku est.<\/span><\/p>"]]}}}</script>
