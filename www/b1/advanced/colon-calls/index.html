<script type="application/json" id="page-data">{"u":"advanced/colon-calls","n":647,"k":"section","pv":"advanced/whatever/quiz","nx":"advanced/colon-calls/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Calling with a colon","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">When you call a method or a subroutine, you usually put its arguments in parentheses: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku also has a second form.<\/span> <span class=\"sg\" data-s=\"2\">You put a <strong>colon<\/strong> after the name.<\/span> <span class=\"sg\" data-s=\"3\">Then everything after it becomes the list of arguments.<\/span> <span class=\"sg\" data-s=\"4\">You need no parentheses at all:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The colon in <code>grep:<\/code> does the same job as the parentheses.<\/span> <span class=\"sg\" data-s=\"1\">So <code>(1..10).grep: * %% 2<\/code> means exactly <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can always use one form instead of the other:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The colon form is nicest with methods that take a <strong>block<\/strong> or a <a href=\"/advanced/whatever/\">Whatever<\/a> expression.<\/span> <span class=\"sg\" data-s=\"1\">This is because it removes one level of brackets inside brackets.<\/span> <span class=\"sg\" data-s=\"2\">Compare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Both lines print <code>(3 2 1)<\/code>, but the colon version is easier to read.<\/span> <span class=\"sg\" data-s=\"1\">This is especially true when the block is long.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">You already use calls without parentheses with list operators, like <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">There, <code>say<\/code> takes everything after it as its arguments.<\/span> <span class=\"sg\" data-s=\"2\">The colon form is the same thing for method calls.<\/span> <span class=\"sg\" data-s=\"3\">There is one rule to remember.<\/span> <span class=\"sg\" data-s=\"4\">The colon form takes the <strong>rest of the statement<\/strong> as its arguments.<\/span> <span class=\"sg\" data-s=\"5\">So it must come at the <strong>end<\/strong> of a chain of calls.<\/span> <span class=\"sg\" data-s=\"6\">That is why <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> works.<\/span> <span class=\"sg\" data-s=\"7\">Here, <code>grep<\/code> is the last call, and nothing is chained after it.<\/span> <span class=\"sg\" data-s=\"8\">If you need to call more methods, use the form with parentheses instead.<\/span> <span class=\"sg\" data-s=\"9\">Or group the parts of the whole expression to make it clear:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">There is one thing to be careful about.<\/span> <span class=\"sg\" data-s=\"1\">Do not use the colon <strong>and<\/strong> parentheses together, as in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This clashes with <code>:( … )<\/code>, the syntax for a signature literal.<\/span> <span class=\"sg\" data-s=\"3\">So Raku cannot read the code.<\/span> <span class=\"sg\" data-s=\"4\">Use either <code>.grep( … )<\/code> or <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Use one or the other, not both.<\/span><\/p>"]]},"de":{"t":"Aufruf mit Doppelpunkt","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn du eine Methode oder eine Subroutine aufrufst, setzt du ihre Argumente normalerweise in Klammern: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku hat auch eine zweite Form.<\/span> <span class=\"sg\" data-s=\"2\">Du setzt einen <strong>Doppelpunkt<\/strong> nach dem Namen.<\/span> <span class=\"sg\" data-s=\"3\">Dann wird alles danach zur Liste der Argumente.<\/span> <span class=\"sg\" data-s=\"4\">Du brauchst gar keine Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Doppelpunkt in <code>grep:<\/code> hat dieselbe Aufgabe wie die Klammern.<\/span> <span class=\"sg\" data-s=\"1\">Also bedeutet <code>(1..10).grep: * %% 2<\/code> genau <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst immer die eine Form statt der anderen benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Doppelpunkt-Form ist am angenehmsten bei Methoden, die einen <strong>Block<\/strong> oder einen <a href=\"https://course.raku.org/de/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-Ausdruck nehmen.<\/span> <span class=\"sg\" data-s=\"1\">Das liegt daran, dass sie eine Ebene von Klammern in Klammern spart.<\/span> <span class=\"sg\" data-s=\"2\">Vergleiche:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # Klammern um den Block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # Doppelpunkt — keine schließende Klammer nötig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide Zeilen geben <code>(3 2 1)<\/code> aus, aber die Doppelpunkt-Version ist leichter zu lesen.<\/span> <span class=\"sg\" data-s=\"1\">Das gilt besonders, wenn der Block lang ist.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Aufrufe ohne Klammern benutzt du schon bei Listenoperatoren wie <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dort nimmt <code>say<\/code> alles, was danach kommt, als seine Argumente.<\/span> <span class=\"sg\" data-s=\"2\">Die Doppelpunkt-Form ist dasselbe für Methodenaufrufe.<\/span> <span class=\"sg\" data-s=\"3\">Du musst dir nur eine Regel merken.<\/span> <span class=\"sg\" data-s=\"4\">Die Doppelpunkt-Form nimmt den <strong>Rest der Anweisung<\/strong> als ihre Argumente.<\/span> <span class=\"sg\" data-s=\"5\">Also muss sie am <strong>Ende<\/strong> einer Kette von Aufrufen stehen.<\/span> <span class=\"sg\" data-s=\"6\">Deshalb funktioniert <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Hier ist <code>grep<\/code> der letzte Aufruf, und danach hängt nichts mehr in der Kette.<\/span> <span class=\"sg\" data-s=\"8\">Wenn du noch mehr Methoden aufrufen musst, benutze stattdessen die Form mit Klammern.<\/span> <span class=\"sg\" data-s=\"9\">Oder gruppiere die Teile des ganzen Ausdrucks, damit er klar wird:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Auf eine Sache musst du achten.<\/span> <span class=\"sg\" data-s=\"1\">Benutze den Doppelpunkt <strong>und<\/strong> Klammern nicht zusammen, wie in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das kollidiert mit <code>:( … )<\/code>, der Syntax für ein Signatur-Literal.<\/span> <span class=\"sg\" data-s=\"3\">Also kann Raku den Code nicht lesen.<\/span> <span class=\"sg\" data-s=\"4\">Benutze entweder <code>.grep( … )<\/code> oder <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Benutze das eine oder das andere, nicht beides.<\/span><\/p>"]]},"nl":{"t":"Aanroepen met een dubbele punt","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Als je een methode of een subroutine aanroept, zet je de argumenten meestal tussen haakjes: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku heeft ook een tweede vorm.<\/span> <span class=\"sg\" data-s=\"2\">Je zet een <strong>dubbele punt<\/strong> na de naam.<\/span> <span class=\"sg\" data-s=\"3\">Dan wordt alles erna de lijst van argumenten.<\/span> <span class=\"sg\" data-s=\"4\">Je hebt helemaal geen haakjes nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De dubbele punt in <code>grep:<\/code> doet hetzelfde als de haakjes.<\/span> <span class=\"sg\" data-s=\"1\">Dus betekent <code>(1..10).grep: * %% 2<\/code> precies hetzelfde als <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt altijd de ene vorm gebruiken in plaats van de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De dubbele-puntvorm is het prettigst bij methoden die een <strong>blok<\/strong> of een <a href=\"https://course.raku.org/nl/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-expressie krijgen.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat hij een laag haakjes binnen haakjes weghaalt.<\/span> <span class=\"sg\" data-s=\"2\">Vergelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # haakjes om het blok\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dubbele punt — geen sluithaakje nodig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Beide regels printen <code>(3 2 1)<\/code>, maar de versie met de dubbele punt is makkelijker te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Dat geldt vooral als het blok lang is.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Aanroepen zonder haakjes gebruik je al bij lijstoperatoren, zoals <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daar neemt <code>say<\/code> alles erna als zijn argumenten.<\/span> <span class=\"sg\" data-s=\"2\">De dubbele-puntvorm is hetzelfde voor methode-aanroepen.<\/span> <span class=\"sg\" data-s=\"3\">Er is één regel om te onthouden.<\/span> <span class=\"sg\" data-s=\"4\">De dubbele-puntvorm neemt de <strong>rest van de instructie<\/strong> als zijn argumenten.<\/span> <span class=\"sg\" data-s=\"5\">Dus moet hij aan het <strong>einde<\/strong> van een keten van aanroepen staan.<\/span> <span class=\"sg\" data-s=\"6\">Daarom werkt <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Hier is <code>grep<\/code> de laatste aanroep, en er komt niets meer achter in de keten.<\/span> <span class=\"sg\" data-s=\"8\">Als je meer methoden moet aanroepen, gebruik dan de vorm met haakjes.<\/span> <span class=\"sg\" data-s=\"9\">Of groepeer de delen van de hele expressie om het duidelijk te maken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Op één ding moet je letten.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de dubbele punt <strong>en<\/strong> haakjes niet samen, zoals in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat botst met <code>:( … )<\/code>, de syntaxis voor een signatuur-literaal.<\/span> <span class=\"sg\" data-s=\"3\">Daarom kan Raku de code niet lezen.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik ofwel <code>.grep( … )<\/code> ofwel <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik het een of het ander, niet allebei.<\/span><\/p>"]]},"es":{"t":"Llamadas con dos puntos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cuando llamas a un método o una subrutina, normalmente pones sus argumentos entre paréntesis: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku también tiene una segunda forma.<\/span> <span class=\"sg\" data-s=\"2\">Pones <strong>dos puntos<\/strong> después del nombre.<\/span> <span class=\"sg\" data-s=\"3\">Entonces todo lo que va detrás se convierte en la lista de argumentos.<\/span> <span class=\"sg\" data-s=\"4\">No necesitas ningún paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los dos puntos en <code>grep:<\/code> hacen el mismo trabajo que los paréntesis.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>(1..10).grep: * %% 2<\/code> significa exactamente <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Siempre puedes usar una forma en lugar de la otra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma con dos puntos es más agradable con métodos que reciben un <strong>bloque<\/strong> o una expresión <a href=\"https://course.raku.org/es/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es porque quita un nivel de paréntesis dentro de paréntesis.<\/span> <span class=\"sg\" data-s=\"2\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesis alrededor del bloque\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dos puntos — sin parentesis de cierre que emparejar<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las dos líneas imprimen <code>(3 2 1)<\/code>, pero la versión con dos puntos es más fácil de leer.<\/span> <span class=\"sg\" data-s=\"1\">Esto es así sobre todo cuando el bloque es largo.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ya usas llamadas sin paréntesis con operadores de lista, como <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ahí, <code>say<\/code> toma todo lo que va detrás como sus argumentos.<\/span> <span class=\"sg\" data-s=\"2\">La forma con dos puntos es lo mismo para las llamadas a métodos.<\/span> <span class=\"sg\" data-s=\"3\">Hay una regla que debes recordar.<\/span> <span class=\"sg\" data-s=\"4\">La forma con dos puntos toma el <strong>resto de la sentencia<\/strong> como sus argumentos.<\/span> <span class=\"sg\" data-s=\"5\">Así que debe ir al <strong>final<\/strong> de una cadena de llamadas.<\/span> <span class=\"sg\" data-s=\"6\">Por eso funciona <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Aquí, <code>grep<\/code> es la última llamada, y no hay nada encadenado después.<\/span> <span class=\"sg\" data-s=\"8\">Si necesitas llamar a más métodos, usa en su lugar la forma con paréntesis.<\/span> <span class=\"sg\" data-s=\"9\">O agrupa las partes de toda la expresión para que quede claro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hay una cosa con la que debes tener cuidado.<\/span> <span class=\"sg\" data-s=\"1\">No uses los dos puntos <strong>y<\/strong> paréntesis juntos, como en <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto choca con <code>:( … )<\/code>, la sintaxis de un literal de firma.<\/span> <span class=\"sg\" data-s=\"3\">Así que Raku no puede leer el código.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>.grep( … )<\/code> o <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Usa una forma u otra, pero no las dos.<\/span><\/p>"]]},"it":{"t":"Chiamate con i due punti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Quando chiami un metodo o una subroutine, di solito metti i suoi argomenti tra parentesi: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku ha anche una seconda forma.<\/span> <span class=\"sg\" data-s=\"2\">Metti i <strong>due punti<\/strong> dopo il nome.<\/span> <span class=\"sg\" data-s=\"3\">Allora tutto quello che segue diventa la lista degli argomenti.<\/span> <span class=\"sg\" data-s=\"4\">Non serve nessuna parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I due punti in <code>grep:<\/code> fanno lo stesso lavoro delle parentesi.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>(1..10).grep: * %% 2<\/code> significa esattamente <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi sempre usare una forma al posto dell'altra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma con i due punti è più comoda con i metodi che prendono un <strong>blocco<\/strong> o un'espressione <a href=\"https://course.raku.org/it/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché toglie un livello di parentesi dentro le parentesi.<\/span> <span class=\"sg\" data-s=\"2\">Confronta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentesi attorno al blocco\nsay @a.sort: { $^b &lt;=&gt; $^a }; # due punti — nessuna parentesi di chiusura da abbinare<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Entrambe le righe stampano <code>(3 2 1)<\/code>, ma la versione con i due punti è più facile da leggere.<\/span> <span class=\"sg\" data-s=\"1\">Questo vale soprattutto quando il blocco è lungo.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Usi già le chiamate senza parentesi con gli operatori di lista, come <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lì <code>say<\/code> prende come argomenti tutto quello che lo segue.<\/span> <span class=\"sg\" data-s=\"2\">La forma con i due punti è la stessa cosa per le chiamate ai metodi.<\/span> <span class=\"sg\" data-s=\"3\">C'è una regola da ricordare.<\/span> <span class=\"sg\" data-s=\"4\">La forma con i due punti prende il <strong>resto dell'istruzione<\/strong> come argomenti.<\/span> <span class=\"sg\" data-s=\"5\">Quindi deve venire alla <strong>fine<\/strong> di una catena di chiamate.<\/span> <span class=\"sg\" data-s=\"6\">Ecco perché <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funziona.<\/span> <span class=\"sg\" data-s=\"7\">Qui <code>grep<\/code> è l'ultima chiamata, e dopo di essa non c'è altro nella catena.<\/span> <span class=\"sg\" data-s=\"8\">Se devi chiamare altri metodi, usa invece la forma con le parentesi.<\/span> <span class=\"sg\" data-s=\"9\">Oppure raggruppa le parti di tutta l'espressione per renderla chiara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">C'è una cosa a cui fare attenzione.<\/span> <span class=\"sg\" data-s=\"1\">Non usare insieme i due punti <strong>e<\/strong> le parentesi, come in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questa scrittura entra in conflitto con <code>:( … )<\/code>, la sintassi per un letterale di firma.<\/span> <span class=\"sg\" data-s=\"3\">Quindi Raku non riesce a leggere il codice.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>.grep( … )<\/code> oppure <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Usa l'una o l'altra, non entrambe.<\/span><\/p>"]]},"lv":{"t":"Izsaukšana ar kolu 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kad jūs izsaucat metodi vai apakšprogrammu, tās argumentus parasti liekat iekavās: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku valodā ir arī otra forma.<\/span> <span class=\"sg\" data-s=\"2\">Aiz nosaukuma jūs liekat <strong>kolu<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Tad viss, kas seko aiz tā, kļūst par argumentu sarakstu.<\/span> <span class=\"sg\" data-s=\"4\">Iekavas nemaz nav vajadzīgas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kols <code>grep:<\/code> dara to pašu darbu, ko iekavas.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>(1..10).grep: * %% 2<\/code> nozīmē tieši <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vienu formu vienmēr var lietot otras vietā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kola forma ir visērtākā ar metodēm, kas ņem <strong>bloku<\/strong> vai <a href=\"https://course.raku.org/lv/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> izteiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka tā noņem vienu iekavu līmeni iekavās.<\/span> <span class=\"sg\" data-s=\"2\">Salīdziniet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses around the block\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — no closing paren to match<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abas rindas izdrukā <code>(3 2 1)<\/code>, bet versiju ar kolu ir vieglāk lasīt.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir īpaši jūtams, kad bloks ir garš.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Izsaukumus bez iekavām jūs jau lietojat ar saraksta operatoriem, piemēram, <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tur <code>say<\/code> ņem visu, kas seko aiz tā, kā savus argumentus.<\/span> <span class=\"sg\" data-s=\"2\">Kola forma ir tas pats metožu izsaukumiem.<\/span> <span class=\"sg\" data-s=\"3\">Ir viens likums, kas jāatceras.<\/span> <span class=\"sg\" data-s=\"4\">Kola forma kā savus argumentus ņem <strong>atlikušo instrukcijas daļu<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc tai jābūt izsaukumu ķēdes <strong>beigās<\/strong>.<\/span> <span class=\"sg\" data-s=\"6\">Tieši tāpēc <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> darbojas.<\/span> <span class=\"sg\" data-s=\"7\">Šeit <code>grep<\/code> ir pēdējais izsaukums, un ķēdē aiz tā nekā nav.<\/span> <span class=\"sg\" data-s=\"8\">Ja jums jāizsauc vēl metodes, tā vietā lietojiet formu ar iekavām.<\/span> <span class=\"sg\" data-s=\"9\">Vai arī sagrupējiet visas izteiksmes daļas, lai būtu skaidrs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ir viena lieta, ar ko jāuzmanās.<\/span> <span class=\"sg\" data-s=\"1\">Nelietojiet kolu <strong>un<\/strong> iekavas kopā, kā <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas saduras ar <code>:( … )<\/code>, kas ir paraksta literāļa sintakse.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc Raku nevar nolasīt kodu.<\/span> <span class=\"sg\" data-s=\"4\">Lietojiet vai nu <code>.grep( … )<\/code>, vai <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Lietojiet vienu vai otru, ne abus.<\/span><\/p>"]]},"ru":{"t":"Вызов через двоеточие","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Когда вы вызываете метод или подпрограмму, вы обычно пишете аргументы в скобках: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В Raku есть и вторая форма.<\/span> <span class=\"sg\" data-s=\"2\">Вы ставите <strong>двоеточие<\/strong> после имени.<\/span> <span class=\"sg\" data-s=\"3\">Тогда всё, что идёт после него, становится списком аргументов.<\/span> <span class=\"sg\" data-s=\"4\">Скобки совсем не нужны:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двоеточие в <code>grep:<\/code> выполняет ту же роль, что и скобки.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>(1..10).grep: * %% 2<\/code> означает в точности <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Одну форму всегда можно заменить другой:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Форма с двоеточием удобнее всего с методами, которые принимают <strong>блок<\/strong> или выражение <a href=\"https://course.raku.org/ru/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что она убирает один уровень скобок внутри скобок.<\/span> <span class=\"sg\" data-s=\"2\">Сравните:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скобки вокруг блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие -- нет закрывающей скобки<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обе строки выводят <code>(3 2 1)<\/code>, но версию с двоеточием легче читать.<\/span> <span class=\"sg\" data-s=\"1\">Особенно это заметно, когда блок длинный.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Вы уже используете вызовы без скобок со списковыми операторами, например <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>say<\/code> принимает как свои аргументы всё, что идёт после него.<\/span> <span class=\"sg\" data-s=\"2\">Форма с двоеточием — то же самое для вызова методов.<\/span> <span class=\"sg\" data-s=\"3\">Нужно запомнить одно правило.<\/span> <span class=\"sg\" data-s=\"4\">Форма с двоеточием принимает как аргументы <strong>остаток выражения<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому она должна стоять в <strong>конце<\/strong> цепочки вызовов.<\/span> <span class=\"sg\" data-s=\"6\">Именно поэтому работает <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Здесь <code>grep<\/code> — последний вызов, и после него в цепочке ничего нет.<\/span> <span class=\"sg\" data-s=\"8\">Если нужно вызвать ещё методы, используйте вместо этого форму со скобками.<\/span> <span class=\"sg\" data-s=\"9\">Или сгруппируйте части всего выражения, чтобы код был понятным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь нужно быть внимательным.<\/span> <span class=\"sg\" data-s=\"1\">Не используйте двоеточие <strong>и<\/strong> скобки вместе, как в <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Такая запись конфликтует с <code>:( … )<\/code>, синтаксисом литерала сигнатуры.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому Raku не может разобрать этот код.<\/span> <span class=\"sg\" data-s=\"4\">Используйте либо <code>.grep( … )<\/code>, либо <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Что-то одно, но не оба варианта сразу.<\/span><\/p>"]]},"uk":{"t":"Виклик із двокрапкою","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Коли ви викликаєте метод чи підпрограму, ви зазвичай берете аргументи в дужки: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У Raku є й друга форма.<\/span> <span class=\"sg\" data-s=\"2\">Ви ставите після імені <strong>двокрапку<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді все, що йде після неї, стає списком аргументів.<\/span> <span class=\"sg\" data-s=\"4\">Дужки зовсім не потрібні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двокрапка в <code>grep:<\/code> виконує ту саму роботу, що й дужки.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>(1..10).grep: * %% 2<\/code> означає точно <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Одну форму завжди можна замінити іншою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Форма з двокрапкою найкраще підходить для методів, які приймають <strong>блок<\/strong> або вираз <a href=\"https://course.raku.org/uk/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що вона прибирає один рівень дужок у дужках.<\/span> <span class=\"sg\" data-s=\"2\">Порівняйте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # дужки навколо блоку\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двокрапка — закривальну дужку шукати не треба<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва рядки виводять <code>(3 2 1)<\/code>, але версію з двокрапкою легше читати.<\/span> <span class=\"sg\" data-s=\"1\">Особливо це помітно, коли блок довгий.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Ви вже використовуєте виклики без дужок зі списковими операторами, як-от <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>say<\/code> бере все, що йде після нього, як свої аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Форма з двокрапкою — те саме для викликів методів.<\/span> <span class=\"sg\" data-s=\"3\">Є одне правило, яке варто запам'ятати.<\/span> <span class=\"sg\" data-s=\"4\">Форма з двокрапкою бере <strong>решту оператора<\/strong> як свої аргументи.<\/span> <span class=\"sg\" data-s=\"5\">Тож вона має стояти в <strong>кінці<\/strong> ланцюжка викликів.<\/span> <span class=\"sg\" data-s=\"6\">Саме тому працює <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Тут <code>grep<\/code> — останній виклик, і після нього в ланцюжку нічого немає.<\/span> <span class=\"sg\" data-s=\"8\">Якщо потрібно викликати ще методи, використайте натомість форму з дужками.<\/span> <span class=\"sg\" data-s=\"9\">Або згрупуйте частини всього виразу, щоб було зрозуміло:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Є одна річ, з якою варто бути обережним.<\/span> <span class=\"sg\" data-s=\"1\">Не поєднуйте двокрапку <strong>й<\/strong> дужки, як у <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Такий запис конфліктує з <code>:( … )<\/code> — синтаксисом літерала сигнатури.<\/span> <span class=\"sg\" data-s=\"3\">Тож Raku не може прочитати цей код.<\/span> <span class=\"sg\" data-s=\"4\">Використовуйте або <code>.grep( … )<\/code>, або <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Беріть щось одне, а не обидва разом.<\/span><\/p>"]]},"bg":{"t":"Извикване с двоеточие 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Когато извиквате метод или подпрограма, обикновено поставяте аргументите в скоби: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku има и втора форма.<\/span> <span class=\"sg\" data-s=\"2\">Поставяте <strong>двоеточие<\/strong> след името.<\/span> <span class=\"sg\" data-s=\"3\">Тогава всичко след него става списъкът с аргументи.<\/span> <span class=\"sg\" data-s=\"4\">Изобщо не ви трябват скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двоеточието в <code>grep:<\/code> върши същата работа като скобите.<\/span> <span class=\"sg\" data-s=\"1\">Така <code>(1..10).grep: * %% 2<\/code> означава точно <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Винаги можете да използвате едната форма вместо другата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Формата с двоеточие е най-удобна при методи, които приемат <strong>блок<\/strong> или <a href=\"https://course.raku.org/bg/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> израз.<\/span> <span class=\"sg\" data-s=\"1\">Причината е, че тя маха едно ниво скоби в скоби.<\/span> <span class=\"sg\" data-s=\"2\">Сравнете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # скоби около блока\nsay @a.sort: { $^b &lt;=&gt; $^a }; # двоеточие — няма затваряща скоба за съвпадение<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата реда отпечатват <code>(3 2 1)<\/code>, но версията с двоеточие се чете по-лесно.<\/span> <span class=\"sg\" data-s=\"1\">Това важи особено когато блокът е дълъг.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Вече използвате извиквания без скоби с операторите за списъци, като <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Там <code>say<\/code> взема всичко след себе си като свои аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Формата с двоеточие е същото нещо, но за извикване на методи.<\/span> <span class=\"sg\" data-s=\"3\">Има едно правило, което трябва да запомните.<\/span> <span class=\"sg\" data-s=\"4\">Формата с двоеточие взема <strong>остатъка от израза<\/strong> като свои аргументи.<\/span> <span class=\"sg\" data-s=\"5\">Затова тя трябва да стои в <strong>края<\/strong> на веригата от извиквания.<\/span> <span class=\"sg\" data-s=\"6\">Ето защо <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> работи.<\/span> <span class=\"sg\" data-s=\"7\">Тук <code>grep<\/code> е последното извикване и след него във веригата няма нищо.<\/span> <span class=\"sg\" data-s=\"8\">Ако трябва да извикате още методи, използвайте вместо това формата със скоби.<\/span> <span class=\"sg\" data-s=\"9\">Или групирайте частите на целия израз, за да стане ясно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Има едно нещо, за което трябва да внимавате.<\/span> <span class=\"sg\" data-s=\"1\">Не използвайте двоеточие <strong>и<\/strong> скоби заедно, както в <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това влиза в конфликт с <code>:( … )<\/code>, синтаксиса за сигнатурен литерал.<\/span> <span class=\"sg\" data-s=\"3\">Затова Raku не може да прочете кода.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте или <code>.grep( … )<\/code>, или <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте едното или другото, а не и двете.<\/span><\/p>"]]},"eo":{"t":"Vokado per dupunkto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kiam vi vokas metodon aŭ subfunkcion, vi kutime metas ĝiajn argumentojn en krampojn: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku havas ankaŭ duan formon.<\/span> <span class=\"sg\" data-s=\"2\">Vi metas <strong>dupunkton<\/strong> post la nomo.<\/span> <span class=\"sg\" data-s=\"3\">Tiam ĉio post ĝi fariĝas la listo de argumentoj.<\/span> <span class=\"sg\" data-s=\"4\">Vi tute ne bezonas krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La dupunkto en <code>grep:<\/code> faras la saman laboron kiel la krampoj.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>(1..10).grep: * %% 2<\/code> signifas ekzakte <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ĉiam povas uzi unu formon anstataŭ la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La dupunkta formo estas plej agrabla kun metodoj, kiuj prenas <strong>blokon<\/strong> aŭ <a href=\"https://course.raku.org/eo/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a>-esprimon.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar ĝi forigas unu nivelon de krampoj en krampoj.<\/span> <span class=\"sg\" data-s=\"2\">Komparu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # krampoj chirkaue de la bloko\nsay @a.sort: { $^b &lt;=&gt; $^a }; # dupunkto — neniu ferma krampo por pari<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ linioj presas <code>(3 2 1)<\/code>, sed la dupunkta versio estas pli facile legebla.<\/span> <span class=\"sg\" data-s=\"1\">Tio validas precipe, kiam la bloko estas longa.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzas vokojn sen krampoj kun listaj operatoroj, kiel <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tie, <code>say<\/code> prenas ĉion post si kiel siajn argumentojn.<\/span> <span class=\"sg\" data-s=\"2\">La dupunkta formo estas la sama afero por metodaj vokoj.<\/span> <span class=\"sg\" data-s=\"3\">Estas unu regulo por memori.<\/span> <span class=\"sg\" data-s=\"4\">La dupunkta formo prenas la <strong>reston de la deklaro<\/strong> kiel siajn argumentojn.<\/span> <span class=\"sg\" data-s=\"5\">Do ĝi devas veni ĉe la <strong>fino<\/strong> de ĉeno de vokoj.<\/span> <span class=\"sg\" data-s=\"6\">Tial <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> funkcias.<\/span> <span class=\"sg\" data-s=\"7\">Ĉi tie, <code>grep<\/code> estas la lasta voko, kaj nenio venas post ĝi en la ĉeno.<\/span> <span class=\"sg\" data-s=\"8\">Se vi bezonas voki pliajn metodojn, uzu anstataŭe la formon kun krampoj.<\/span> <span class=\"sg\" data-s=\"9\">Aŭ grupigu la partojn de la tuta esprimo, por ke ĝi estu klara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Estas unu afero, pri kiu vi devas atenti.<\/span> <span class=\"sg\" data-s=\"1\">Ne uzu la dupunkton <strong>kaj<\/strong> krampojn kune, kiel en <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio kolizias kun <code>:( … )<\/code>, la sintakso por signatura literalo.<\/span> <span class=\"sg\" data-s=\"3\">Do Raku ne povas legi la kodon.<\/span> <span class=\"sg\" data-s=\"4\">Uzu aŭ <code>.grep( … )<\/code>, aŭ <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Uzu unu aŭ la alian, ne ambaŭ.<\/span><\/p>"]]},"la":{"t":"Vocatio cum duplo puncto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum methodum vel subroutinam vocas, argumenta eius plerumque in parenthesibus ponis: <code>@a.grep(* &gt; 5)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku etiam alteram formam habet.<\/span> <span class=\"sg\" data-s=\"2\"><strong>Colonum<\/strong> post nomen ponis.<\/span> <span class=\"sg\" data-s=\"3\">Tum omnia post eum fiunt index argumentorum.<\/span> <span class=\"sg\" data-s=\"4\">Parenthesibus omnino non eges:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).grep: * %% 2; # (2 4 6 8 10)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Colon in <code>grep:<\/code> idem munus praestat quod parentheses.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>(1..10).grep: * %% 2<\/code> prorsus significat <code>(1..10).grep(* %% 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Semper alteram formam pro altera adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c\nsay &lt;a b c&gt;.join: '-'; # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Forma cum colono maxime placet cum methodis quae <strong>codicem clausum<\/strong> vel expressionem <a href=\"https://course.raku.org/la/advanced/whatever/\" target=\"_blank\" rel=\"noopener\">Whatever<\/a> accipiunt.<\/span> <span class=\"sg\" data-s=\"1\">Causa est quod unum gradum parenthesium intra parentheses removet.<\/span> <span class=\"sg\" data-s=\"2\">Compara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 3, 1, 2;\n\nsay @a.sort({ $^b &lt;=&gt; $^a }); # parentheses circa codicem clausum\nsay @a.sort: { $^b &lt;=&gt; $^a }; # colon — nulla parenthesis claudenda<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambae lineae <code>(3 2 1)<\/code> imprimunt, sed versio cum colono facilius legitur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc praecipue verum est cum codex clausus longus est.<\/span><\/p>"],["p",10,"<p><span class=\"sg\" data-s=\"0\">Vocationes sine parenthesibus iam cum operatoribus indicis adhibes, ut <code>say 1, 2, 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ibi <code>say<\/code> omnia post se ut argumenta sua accipit.<\/span> <span class=\"sg\" data-s=\"2\">Forma cum colono eadem res est pro vocationibus methodorum.<\/span> <span class=\"sg\" data-s=\"3\">Una regula memoranda est.<\/span> <span class=\"sg\" data-s=\"4\">Forma cum colono <strong>reliquum enuntiati<\/strong> ut argumenta sua accipit.<\/span> <span class=\"sg\" data-s=\"5\">Itaque in <strong>fine<\/strong> catenae vocationum venire debet.<\/span> <span class=\"sg\" data-s=\"6\">Ideo <code>('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"7\">Hic <code>grep<\/code> ultima vocatio est, et nihil post eam in catenam adiungitur.<\/span> <span class=\"sg\" data-s=\"8\">Si plures methodos vocare debes, formam cum parenthesibus potius adhibe.<\/span> <span class=\"sg\" data-s=\"9\">Aut partes totius expressionis coniunge ut clara sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (('a' .. 'z')».uc».ord.grep: 60 &lt; * &lt; 70)».chr # (A B C D E)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Una res cavenda est.<\/span> <span class=\"sg\" data-s=\"1\">Noli colonum <strong>et<\/strong> parentheses simul adhibere, ut in <code>.grep:( … )<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc cum <code>:( … )<\/code> confligit, quae syntaxis est signaturae literalis.<\/span> <span class=\"sg\" data-s=\"3\">Itaque Raku codicem legere non potest.<\/span> <span class=\"sg\" data-s=\"4\">Adhibe aut <code>.grep( … )<\/code> aut <code>.grep: …<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Alterum adhibe, non utrumque.<\/span><\/p>"]]}}}</script>
