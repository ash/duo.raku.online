<script type="application/json" id="page-data">{"u":"advanced/colon-calls/exercises/colon-map/solution","n":650,"k":"solution","pv":"advanced/colon-calls/exercises/colon-map","nx":"advanced/colon-calls/exercises/colon-join","tr":["advanced","advanced/colon-calls"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A colon map‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The colon form is possible only for <code>grep<\/code>, the last call in the chain. The colon makes <code>* &gt; 10<\/code> its argument, exactly like <code>grep(* &gt; 10)<\/code>. We still need to print the result. So now <code>say<\/code> is used as a function, not as a method.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>map<\/code> call must keep its parentheses. Suppose you wrote <code>.map: * * 2<\/code> instead. The colon would then also take <code>.grep(* &gt; 10)<\/code> as an argument of <code>map<\/code>. So the chain would break.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Doppelpunkt-map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode findest du in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Doppelpunkt-Form geht nur bei <code>grep<\/code>, dem letzten Aufruf in der Kette. Der Doppelpunkt macht <code>* &gt; 10<\/code> zu seinem Argument, genau wie <code>grep(* &gt; 10)<\/code>. Wir müssen das Ergebnis aber noch ausgeben. Also wird <code>say<\/code> jetzt als Funktion benutzt, nicht als Methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Aufruf von <code>map<\/code> muss seine Klammern behalten. Nehmen wir an, du schreibst stattdessen <code>.map: * * 2<\/code>. Dann würde der Doppelpunkt auch <code>.grep(* &gt; 10)<\/code> als Argument von <code>map<\/code> nehmen. Also würde die Kette brechen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een dubbele-punt-map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 De broncode is te vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De dubbele-puntvorm kan alleen bij <code>grep<\/code>, de laatste aanroep in de keten. De dubbele punt maakt <code>* &gt; 10<\/code> het argument, precies zoals <code>grep(* &gt; 10)<\/code>. We moeten het resultaat nog afdrukken. Dus wordt <code>say<\/code> nu als functie gebruikt, niet als methode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>map<\/code>-aanroep moet zijn haakjes houden. Stel dat je in plaats daarvan <code>.map: * * 2<\/code> schreef. De dubbele punt zou dan ook <code>.grep(* &gt; 10)<\/code> als argument van <code>map<\/code> nemen. Daardoor zou de keten breken.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un map con dos puntos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La forma con dos puntos solo es posible para <code>grep<\/code>, la última llamada de la cadena. Los dos puntos hacen de <code>* &gt; 10<\/code> su argumento, exactamente como <code>grep(* &gt; 10)<\/code>. Todavía necesitamos imprimir el resultado. Así que ahora <code>say<\/code> se usa como función, no como método.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La llamada a <code>map<\/code> debe mantener sus paréntesis. Imagina que escribes <code>.map: * * 2<\/code> en su lugar. Entonces los dos puntos tomarían también <code>.grep(* &gt; 10)<\/code> como argumento de <code>map<\/code>. Así que la cadena se rompería.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un map con due punti","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La forma con i due punti è possibile solo per <code>grep<\/code>, l'ultima chiamata della catena. Con i due punti, <code>* &gt; 10<\/code> diventa il suo argomento, esattamente come in <code>grep(* &gt; 10)<\/code>. Dobbiamo ancora stampare il risultato. Quindi ora <code>say<\/code> viene usato come funzione, non come metodo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La chiamata a <code>map<\/code> deve mantenere le sue parentesi. Immagina di scrivere invece <code>.map: * * 2<\/code>. I due punti prenderebbero allora anche <code>.grep(* &gt; 10)<\/code> come argomento di <code>map<\/code>. Così la catena si romperebbe.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Map ar kolu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kola forma ir iespējama tikai <code>grep<\/code>, ķēdes pēdējam izsaukumam. Kols padara <code>* &gt; 10<\/code> par tā argumentu, tieši tāpat kā <code>grep(* &gt; 10)<\/code>. Mums joprojām jāizdrukā rezultāts. Tāpēc tagad <code>say<\/code> tiek lietots kā funkcija, nevis kā metode.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izsaukumam <code>map<\/code> jāpatur savas iekavas. Pieņemsim, ka jūs tā vietā uzrakstītu <code>.map: * * 2<\/code>. Tad kols paņemtu arī <code>.grep(* &gt; 10)<\/code> kā <code>map<\/code> argumentu. Tāpēc ķēde salūztu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: map через двоеточие","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Форма с двоеточием возможна только для <code>grep<\/code>, последнего вызова в цепочке. Двоеточие делает <code>* &gt; 10<\/code> его аргументом, точно так же, как <code>grep(* &gt; 10)<\/code>. Нам всё ещё нужно вывести результат. Поэтому теперь <code>say<\/code> используется как функция, а не как метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вызов <code>map<\/code> должен сохранить свои скобки. Допустим, вы написали вместо этого <code>.map: * * 2<\/code>. Тогда двоеточие забрало бы и <code>.grep(* &gt; 10)<\/code> как аргумент <code>map<\/code>. Поэтому цепочка сломалась бы.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Map із двокрапкою","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Форма з двокрапкою можлива лише для <code>grep<\/code>, останнього виклику в ланцюжку. Двокрапка робить <code>* &gt; 10<\/code> його аргументом, точно як <code>grep(* &gt; 10)<\/code>. Нам усе ще треба вивести результат. Тож тепер <code>say<\/code> використовується як функція, а не як метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виклик <code>map<\/code> мусить зберегти свої дужки. Припустімо, ви написали замість цього <code>.map: * * 2<\/code>. Тоді двокрапка взяла б і <code>.grep(* &gt; 10)<\/code> як аргумент <code>map<\/code>. Тож ланцюжок би зламався.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Map с двоеточие","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(12 14 16 18 20)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Формата с двоеточие е възможна само за <code>grep<\/code>, последното извикване във веригата. Двоеточието прави <code>* &gt; 10<\/code> негов аргумент, точно като <code>grep(* &gt; 10)<\/code>. Все пак трябва да отпечатаме резултата. Затова сега <code>say<\/code> се използва като функция, а не като метод.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Извикването на <code>map<\/code> трябва да запази скобите си. Да кажем, че вместо това сте написали <code>.map: * * 2<\/code>. Тогава двоеточието би взело и <code>.grep(* &gt; 10)<\/code> като аргумент на <code>map<\/code>. Така веригата би се счупила.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Dupunkta map","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1..10).map(* * 2).grep: * &gt; 10;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/colon-calls/colon-map.raku\" target=\"_blank\" rel=\"noopener\">colon-map.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pr vare debet. Finge te <code>.map: * * 2<\/code> pro eo scripsisse. Colon tum etiam <code>.grep(* &gt; 10)<\/code> ut argumentum <code>map<\/code> caperet. Itaque catena frangeretur.<\/span><\/li><\/ol>"]]}}}</script>
