<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes/operations","n":491,"k":"topic","pv":"advanced/sets-bags-mixes","nx":"advanced/sets-bags-mixes/operations/quiz","tr":["advanced","advanced/sets-bags-mixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Set operations","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can combine sets with the usual operations from set theory.<\/span> <span class=\"sg\" data-s=\"1\">Each operator has a Unicode symbol and an ASCII spelling.<\/span> <span class=\"sg\" data-s=\"2\">You can use either one.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <em>union<\/em> <code>∪<\/code>, or <code>(|)<\/code>, collects all the values of both sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Since both sets contain <code>3<\/code>, the union has five distinct elements: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <em>intersection<\/em> <code>∩<\/code>, or <code>(&amp;)<\/code>, keeps only the values that both sets have:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the intersection has <code>2<\/code> and <code>3<\/code>, the values that are in both sets.<\/span> <span class=\"sg\" data-s=\"1\">A set has no order of its own.<\/span> <span class=\"sg\" data-s=\"2\">So when you print it, the two elements may come in either order.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The result of these operations is a set too.<\/span> <span class=\"sg\" data-s=\"1\">So you can ask it the same questions.<\/span> <span class=\"sg\" data-s=\"2\">How many elements does it have, and is a certain value in it?<\/span><\/p>"]]},"de":{"t":"Mengenoperationen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst Sets mit den üblichen Operationen aus der Mengenlehre kombinieren.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Operator hat ein Unicode-Symbol und eine ASCII-Schreibweise.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst jede der beiden benutzen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die <em>Vereinigung<\/em> <code>∪<\/code>, oder <code>(|)<\/code>, sammelt alle Werte beider Sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Da beide Sets <code>3<\/code> enthalten, hat die Vereinigung fünf verschiedene Elemente: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der <em>Durchschnitt<\/em> <code>∩<\/code>, oder <code>(&amp;)<\/code>, behält nur die Werte, die beide Sets haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — beachte, dass Sets ungeordnet sind\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier enthält der Durchschnitt <code>2<\/code> und <code>3<\/code>, also die Werte, die in beiden Sets sind.<\/span> <span class=\"sg\" data-s=\"1\">Ein Set hat keine eigene Reihenfolge.<\/span> <span class=\"sg\" data-s=\"2\">Wenn du es ausgibst, können die zwei Elemente also in beliebiger Reihenfolge kommen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis dieser Operationen ist auch ein Set.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du ihm dieselben Fragen stellen.<\/span> <span class=\"sg\" data-s=\"2\">Wie viele Elemente hat es, und ist ein bestimmter Wert darin?<\/span><\/p>"]]},"nl":{"t":"Set-operaties","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt sets combineren met de gewone bewerkingen uit de verzamelingenleer.<\/span> <span class=\"sg\" data-s=\"1\">Elke operator heeft een Unicode-symbool en een ASCII-notatie.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze allebei gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <em>vereniging<\/em> <code>∪<\/code>, of <code>(|)<\/code>, verzamelt alle waarden van beide sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Omdat beide sets <code>3<\/code> bevatten, heeft de vereniging vijf unieke elementen: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De <em>doorsnede<\/em> <code>∩<\/code>, of <code>(&amp;)<\/code>, houdt alleen de waarden die beide sets hebben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — merk op dat sets ongeordend zijn\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier bevat de doorsnede <code>2<\/code> en <code>3<\/code>, de waarden die in beide sets zitten.<\/span> <span class=\"sg\" data-s=\"1\">Een set heeft geen eigen volgorde.<\/span> <span class=\"sg\" data-s=\"2\">Als je hem afdrukt, kunnen de twee elementen dus in elke volgorde verschijnen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het resultaat van deze bewerkingen is ook een set.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het dus dezelfde vragen stellen.<\/span> <span class=\"sg\" data-s=\"2\">Hoeveel elementen heeft het, en zit een bepaalde waarde erin?<\/span><\/p>"]]},"es":{"t":"Operaciones de conjuntos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes combinar sets con las operaciones habituales de la teoría de conjuntos.<\/span> <span class=\"sg\" data-s=\"1\">Cada operador tiene un símbolo Unicode y una forma ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar cualquiera de las dos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>unión<\/em> <code>∪<\/code>, o <code>(|)<\/code>, reúne todos los valores de los dos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Como los dos sets contienen <code>3<\/code>, la unión tiene cinco elementos distintos: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>intersección<\/em> <code>∩<\/code>, o <code>(&amp;)<\/code>, conserva solo los valores que tienen los dos sets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, la intersección tiene <code>2<\/code> y <code>3<\/code>, los valores que están en los dos sets.<\/span> <span class=\"sg\" data-s=\"1\">Un set no tiene un orden propio.<\/span> <span class=\"sg\" data-s=\"2\">Así que, al imprimirlo, los dos elementos pueden salir en cualquier orden.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El resultado de estas operaciones también es un set.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes hacerle las mismas preguntas.<\/span> <span class=\"sg\" data-s=\"2\">¿Cuántos elementos tiene, y está en él un valor concreto?<\/span><\/p>"]]},"it":{"t":"Operazioni sui set","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi combinare i set con le solite operazioni della teoria degli insiemi.<\/span> <span class=\"sg\" data-s=\"1\">Ogni operatore ha un simbolo Unicode e una grafia ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare quello che vuoi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'<em>unione<\/em> <code>∪<\/code>, o <code>(|)<\/code>, raccoglie tutti i valori dei due set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dato che entrambi i set contengono <code>3<\/code>, l'unione ha cinque elementi distinti: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'<em>intersezione<\/em> <code>∩<\/code>, o <code>(&amp;)<\/code>, tiene solo i valori che hanno entrambi i set:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota che i set non sono ordinati\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui l'intersezione ha <code>2<\/code> e <code>3<\/code>, i valori che sono in entrambi i set.<\/span> <span class=\"sg\" data-s=\"1\">Un set non ha un suo ordine.<\/span> <span class=\"sg\" data-s=\"2\">Così, quando lo stampi, i due elementi possono uscire in un ordine o nell'altro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anche il risultato di queste operazioni è un set.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi fargli le stesse domande.<\/span> <span class=\"sg\" data-s=\"2\">Quanti elementi ha, e un certo valore ne fa parte?<\/span><\/p>"]]},"lv":{"t":"Kopu operācijas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kopas var apvienot ar parastajām kopu teorijas operācijām.<\/span> <span class=\"sg\" data-s=\"1\">Katram operatoram ir Unikoda simbols un ASCII pieraksts.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat lietot jebkuru no tiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Apvienojums<\/em> <code>∪<\/code> jeb <code>(|)<\/code> savāc visas abu kopu vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā kā abās kopās ir <code>3<\/code>, apvienojumā ir pieci atšķirīgi elementi: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Šķēlums<\/em> <code>∩<\/code> jeb <code>(&amp;)<\/code> patur tikai tās vērtības, kas ir abām kopām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit šķēlumā ir <code>2<\/code> un <code>3<\/code>, vērtības, kas ir abās kopās.<\/span> <span class=\"sg\" data-s=\"1\">Kopai nav savas secības.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc, kad jūs to izdrukājat, abi elementi var parādīties jebkurā secībā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Arī šo operāciju rezultāts ir kopa.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tai var uzdot tos pašus jautājumus.<\/span> <span class=\"sg\" data-s=\"2\">Cik tajā ir elementu, un vai tajā ir noteikta vērtība?<\/span><\/p>"]]},"ru":{"t":"Операции над множествами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множества можно комбинировать с помощью обычных операций из теории множеств.<\/span> <span class=\"sg\" data-s=\"1\">У каждого оператора есть символ в Unicode и запись в ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Можно использовать любой из них.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Объединение<\/em> <code>∪<\/code>, или <code>(|)<\/code>, собирает все значения обоих множеств:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Так как <code>3<\/code> есть в обоих множествах, в объединении пять различных элементов: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Пересечение<\/em> <code>∩<\/code>, или <code>(&amp;)<\/code>, оставляет только те значения, которые есть у обоих множеств:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — обратите внимание, что множества неупорядочены\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь в пересечении <code>2<\/code> и <code>3<\/code> — значения, которые есть в обоих множествах.<\/span> <span class=\"sg\" data-s=\"1\">У множества нет своего порядка.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому, когда вы его печатаете, два элемента могут идти в любом порядке.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат этих операций — тоже множество.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому ему можно задавать те же вопросы.<\/span> <span class=\"sg\" data-s=\"2\">Сколько в нём элементов и есть ли в нём определённое значение?<\/span><\/p>"]]},"uk":{"t":"Операції над множинами","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множини можна поєднувати звичайними операціями з теорії множин.<\/span> <span class=\"sg\" data-s=\"1\">Кожен оператор має символ Unicode та запис в ASCII.<\/span> <span class=\"sg\" data-s=\"2\">Можна використовувати будь-який із них.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Об'єднання<\/em> <code>∪<\/code>, або <code>(|)<\/code>, збирає всі значення обох множин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оскільки обидві множини містять <code>3<\/code>, об'єднання має п'ять різних елементів: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Переріз<\/em> <code>∩<\/code>, або <code>(&amp;)<\/code>, залишає лише ті значення, які мають обидві множини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — зверніть увагу, що множини невпорядковані\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут переріз має <code>2<\/code> і <code>3<\/code>, тобто значення, які є в обох множинах.<\/span> <span class=\"sg\" data-s=\"1\">Множина не має власного порядку.<\/span> <span class=\"sg\" data-s=\"2\">Тож коли ви її виводите, два елементи можуть іти в будь-якому порядку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат цих операцій — теж множина.<\/span> <span class=\"sg\" data-s=\"1\">Тож їй можна ставити ті самі запитання.<\/span> <span class=\"sg\" data-s=\"2\">Скільки в ній елементів і чи є в ній певне значення?<\/span><\/p>"]]},"bg":{"t":"Операции с множества","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да комбинирате множества с обичайните операции от теорията на множествата.<\/span> <span class=\"sg\" data-s=\"1\">Всеки оператор има Unicode символ и ASCII изписване.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате кое да е от двете.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Обединението<\/em> <code>∪<\/code>, или <code>(|)<\/code>, събира всички стойности на двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тъй като и двете множества съдържат <code>3<\/code>, обединението има пет различни елемента: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Сечението<\/em> <code>∩<\/code>, или <code>(&amp;)<\/code>, запазва само стойностите, които имат и двете множества:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — note that sets are unordered\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук сечението има <code>2<\/code> и <code>3<\/code>, стойностите, които са и в двете множества.<\/span> <span class=\"sg\" data-s=\"1\">Множеството няма собствен ред.<\/span> <span class=\"sg\" data-s=\"2\">Затова, когато го изведете, двата елемента могат да излязат в който и да е ред.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Резултатът от тези операции също е множество.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да му задавате същите въпроси.<\/span> <span class=\"sg\" data-s=\"2\">Колко елемента има и има ли в него определена стойност?<\/span><\/p>"]]},"eo":{"t":"Araj operacioj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas kombini arojn per la kutimaj operacioj el la aroteorio.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu operatoro havas Unikodan simbolon kaj ASCII-literumon.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi iun ajn el ili.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>kunigo<\/em> <code>∪<\/code>, aŭ <code>(|)<\/code>, kolektas ĉiujn valorojn de ambaŭ aroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉar ambaŭ aroj enhavas <code>3<\/code>, la kunigo havas kvin distingajn elementojn: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La <em>komunaĵo<\/em> <code>∩<\/code>, aŭ <code>(&amp;)<\/code>, konservas nur la valorojn, kiujn ambaŭ aroj havas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — notu, ke aroj estas neordigitaj\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la komunaĵo havas <code>2<\/code> kaj <code>3<\/code>, la valorojn, kiuj estas en ambaŭ aroj.<\/span> <span class=\"sg\" data-s=\"1\">Aro ne havas propran ordon.<\/span> <span class=\"sg\" data-s=\"2\">Do kiam vi presas ĝin, la du elementoj povas veni en ajna ordo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La rezulto de ĉi tiuj operacioj ankaŭ estas aro.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas fari al ĝi la samajn demandojn.<\/span> <span class=\"sg\" data-s=\"2\">Kiom da elementoj ĝi havas, kaj ĉu certa valoro estas en ĝi?<\/span><\/p>"]]},"la":{"t":"Operationes coniunctorum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Coniuncta componere potes operationibus usitatis ex theoria coniunctorum.<\/span> <span class=\"sg\" data-s=\"1\">Quisque operator symbolum Unicode et scripturam ASCII habet.<\/span> <span class=\"sg\" data-s=\"2\">Utrumvis adhibere potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Unio<\/em> <code>∪<\/code>, vel <code>(|)<\/code>, omnes valores amborum coniunctorum colligit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (set(1, 2, 3) ∪ set(3, 4, 5)).elems; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quia ambo coniuncta <code>3<\/code> continent, unio quinque elementa distincta habet: <code>1, 2, 3, 4, 5<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><em>Intersectio<\/em> <code>∩<\/code>, vel <code>(&amp;)<\/code>, solum valores servat quos ambo coniuncta habent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $common = set(1, 2, 3) ∩ set(2, 3, 4);\nsay $common;       # Set(2 3) — nota inopias non ordinatas esse\nsay $common.elems; # 2\nsay 2 ∈ $common;   # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic intersectio <code>2<\/code> et <code>3<\/code> habet, valores qui in ambobus coniunctis sunt.<\/span> <span class=\"sg\" data-s=\"1\">Coniunctum ordinem suum non habet.<\/span> <span class=\"sg\" data-s=\"2\">Itaque cum id imprimis, duo elementa utrovis ordine venire possunt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eventus harum operationum quoque coniunctum est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque easdem quaestiones ei ponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Quot elementa habet, et estne certus valor in eo?<\/span><\/p>"]]}}}</script>
