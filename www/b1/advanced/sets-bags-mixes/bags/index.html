<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes/bags","n":493,"k":"topic","pv":"advanced/sets-bags-mixes/operations/quiz","nx":"advanced/sets-bags-mixes/exercises","tr":["advanced","advanced/sets-bags-mixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Bags and mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A set only tells you <em>whether<\/em> a value is in it.<\/span> <span class=\"sg\" data-s=\"1\">But sometimes you also need to know <em>how many times<\/em> the value is there.<\/span> <span class=\"sg\" data-s=\"2\">For this, there is the <code>Bag<\/code>, which keeps a count for each value.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You create a bag with the <code>bag<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">Repeated values do not become one value.<\/span> <span class=\"sg\" data-s=\"2\">Instead, they are counted:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can ask the bag for a value with the <code>&lt; &gt;<\/code> subscript.<\/span> <span class=\"sg\" data-s=\"1\">Then you get the number of times this value was put in.<\/span> <span class=\"sg\" data-s=\"2\">The <code>total<\/code> method gives the sum of all the counts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A <code>Mix<\/code> is the same idea as a bag.<\/span> <span class=\"sg\" data-s=\"1\">The difference is that the counts, called <em>weights<\/em>, can be fractions, not only whole numbers.<\/span> <span class=\"sg\" data-s=\"2\">To give the weights yourself, pair each value with its weight.<\/span> <span class=\"sg\" data-s=\"3\">Then turn the list into a mix with <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">You look up a weight with <code>&lt; &gt;<\/code> and add up the weights with <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Both work exactly as for a bag.<\/span> <span class=\"sg\" data-s=\"2\">The only difference is that the numbers do not have to be whole.<\/span> <span class=\"sg\" data-s=\"3\">Here, <code>total<\/code> adds the weights <code>2.5<\/code> and <code>0.75<\/code>, which gives <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">It is the sum of the weights, not the number of values.<\/span> <span class=\"sg\" data-s=\"5\">Bags and mixes are useful whenever you need to keep track of amounts.<\/span> <span class=\"sg\" data-s=\"6\">For example, you can count how often each word appears in a text.<\/span> <span class=\"sg\" data-s=\"7\">Or you can give weights to options.<\/span><\/p>"]]},"de":{"t":"Bags und Mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Set sagt dir nur, <em>ob<\/em> ein Wert darin ist.<\/span> <span class=\"sg\" data-s=\"1\">Aber manchmal musst du auch wissen, <em>wie oft<\/em> der Wert vorkommt.<\/span> <span class=\"sg\" data-s=\"2\">Dafür gibt es den <code>Bag<\/code>, der für jeden Wert einen Zähler speichert.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du erstellst einen Bag mit der <code>bag<\/code>-Routine.<\/span> <span class=\"sg\" data-s=\"1\">Wiederholte Werte werden nicht zu einem Wert.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen werden sie gezählt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst den Bag mit dem <code>&lt; &gt;<\/code>-Subscript nach einem Wert fragen.<\/span> <span class=\"sg\" data-s=\"1\">Dann erfährst du, wie oft dieser Wert hineingelegt wurde.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>total<\/code> gibt die Summe aller Zähler zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Mix<\/code> ist dieselbe Idee wie ein Bag.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied ist, dass die Zähler, die <em>Gewichte<\/em> heißen, auch Bruchzahlen sein können, nicht nur ganze Zahlen.<\/span> <span class=\"sg\" data-s=\"2\">Um die Gewichte selbst anzugeben, bilde aus jedem Wert und seinem Gewicht ein Paar.<\/span> <span class=\"sg\" data-s=\"3\">Dann mache aus der Liste mit <code>.Mix<\/code> einen Mix:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Du schlägst ein Gewicht mit <code>&lt; &gt;<\/code> nach und addierst die Gewichte mit <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beides funktioniert genau wie bei einem Bag.<\/span> <span class=\"sg\" data-s=\"2\">Der einzige Unterschied ist, dass die Zahlen keine ganzen Zahlen sein müssen.<\/span> <span class=\"sg\" data-s=\"3\">Hier addiert <code>total<\/code> die Gewichte <code>2.5<\/code> und <code>0.75<\/code>, und das ergibt <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Das ist die Summe der Gewichte, nicht die Anzahl der Werte.<\/span> <span class=\"sg\" data-s=\"5\">Bags und Mixes sind nützlich, wenn du dir Anzahlen merken musst.<\/span> <span class=\"sg\" data-s=\"6\">Zum Beispiel kannst du zählen, wie oft jedes Wort in einem Text vorkommt.<\/span> <span class=\"sg\" data-s=\"7\">Oder du kannst jeder Option ein Gewicht geben.<\/span><\/p>"]]},"nl":{"t":"Bags en mixes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een set vertelt je alleen <em>of<\/em> een waarde erin zit.<\/span> <span class=\"sg\" data-s=\"1\">Maar soms moet je ook weten <em>hoe vaak<\/em> de waarde erin zit.<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor is er de <code>Bag<\/code>, die voor elke waarde een telling bijhoudt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je maakt een bag met de <code>bag<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"1\">Herhaalde waarden worden niet één waarde.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan worden ze geteld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt de bag naar een waarde vragen met de <code>&lt; &gt;<\/code>-subscript.<\/span> <span class=\"sg\" data-s=\"1\">Dan krijg je het aantal keren dat deze waarde erin is gestopt.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>total<\/code> geeft de som van alle tellingen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <code>Mix<\/code> is hetzelfde idee als een bag.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil is dat de tellingen, die <em>gewichten<\/em> heten, breuken kunnen zijn, niet alleen gehele getallen.<\/span> <span class=\"sg\" data-s=\"2\">Om de gewichten zelf te geven, koppel je elke waarde aan zijn gewicht.<\/span> <span class=\"sg\" data-s=\"3\">Maak daarna van de lijst een mix met <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Je zoekt een gewicht op met <code>&lt; &gt;<\/code> en telt de gewichten op met <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beide werken precies zoals bij een bag.<\/span> <span class=\"sg\" data-s=\"2\">Het enige verschil is dat de getallen niet geheel hoeven te zijn.<\/span> <span class=\"sg\" data-s=\"3\">Hier telt <code>total<\/code> de gewichten <code>2.5<\/code> en <code>0.75<\/code> op, en dat geeft <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Het is de som van de gewichten, niet het aantal waarden.<\/span> <span class=\"sg\" data-s=\"5\">Bags en mixes zijn handig als je hoeveelheden wilt bijhouden.<\/span> <span class=\"sg\" data-s=\"6\">Je kunt bijvoorbeeld tellen hoe vaak elk woord in een tekst voorkomt.<\/span> <span class=\"sg\" data-s=\"7\">Of je kunt gewichten aan opties geven.<\/span><\/p>"]]},"es":{"t":"Bolsas y mezclas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un set solo te dice <em>si<\/em> un valor está en él.<\/span> <span class=\"sg\" data-s=\"1\">Pero a veces también necesitas saber <em>cuántas veces<\/em> está ese valor.<\/span> <span class=\"sg\" data-s=\"2\">Para esto existe el <code>Bag<\/code>, que guarda un conteo para cada valor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Creas un bag con la rutina <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los valores repetidos no se convierten en un solo valor.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, se cuentan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes preguntar al bag por un valor con el subíndice <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Entonces obtienes el número de veces que se puso ese valor.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>total<\/code> da la suma de todos los conteos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <code>Mix<\/code> es la misma idea que un bag.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia es que los conteos, llamados <em>pesos<\/em>, pueden ser fracciones, no solo números enteros.<\/span> <span class=\"sg\" data-s=\"2\">Para dar los pesos tú mismo, empareja cada valor con su peso.<\/span> <span class=\"sg\" data-s=\"3\">Luego convierte la lista en un mix con <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Consultas un peso con <code>&lt; &gt;<\/code> y sumas los pesos con <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los dos funcionan exactamente igual que en un bag.<\/span> <span class=\"sg\" data-s=\"2\">La única diferencia es que los números no tienen que ser enteros.<\/span> <span class=\"sg\" data-s=\"3\">Aquí, <code>total<\/code> suma los pesos <code>2.5<\/code> y <code>0.75<\/code>, lo que da <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Es la suma de los pesos, no el número de valores.<\/span> <span class=\"sg\" data-s=\"5\">Los bags y los mixes son útiles siempre que necesites llevar la cuenta de cantidades.<\/span> <span class=\"sg\" data-s=\"6\">Por ejemplo, puedes contar cuántas veces aparece cada palabra en un texto.<\/span> <span class=\"sg\" data-s=\"7\">O puedes dar pesos a opciones.<\/span><\/p>"]]},"it":{"t":"Bag e mix","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un set ti dice solo <em>se<\/em> un valore è presente.<\/span> <span class=\"sg\" data-s=\"1\">Ma a volte ti serve sapere anche <em>quante volte<\/em> il valore c'è.<\/span> <span class=\"sg\" data-s=\"2\">Per questo c'è il <code>Bag<\/code>, che tiene un conteggio per ogni valore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Crei un bag con la routine <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">I valori ripetuti non diventano un solo valore.<\/span> <span class=\"sg\" data-s=\"2\">Invece, vengono contati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi chiedere al bag un valore con il subscript <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Allora ottieni quante volte questo valore è stato inserito.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>total<\/code> dà la somma di tutti i conteggi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <code>Mix<\/code> è la stessa idea di un bag.<\/span> <span class=\"sg\" data-s=\"1\">La differenza è che i conteggi, chiamati <em>pesi<\/em>, possono essere frazioni, non solo numeri interi.<\/span> <span class=\"sg\" data-s=\"2\">Per dare tu i pesi, metti ogni valore in coppia con il suo peso.<\/span> <span class=\"sg\" data-s=\"3\">Poi trasforma la lista in un mix con <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Cerchi un peso con <code>&lt; &gt;<\/code> e sommi i pesi con <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tutti e due funzionano esattamente come per un bag.<\/span> <span class=\"sg\" data-s=\"2\">L'unica differenza è che i numeri non devono essere interi.<\/span> <span class=\"sg\" data-s=\"3\">Qui <code>total<\/code> somma i pesi <code>2.5<\/code> e <code>0.75<\/code>, e il risultato è <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">È la somma dei pesi, non il numero dei valori.<\/span> <span class=\"sg\" data-s=\"5\">I bag e i mix sono utili ogni volta che devi tenere traccia di quantità.<\/span> <span class=\"sg\" data-s=\"6\">Per esempio, puoi contare quante volte compare ogni parola in un testo.<\/span> <span class=\"sg\" data-s=\"7\">Oppure puoi dare dei pesi a delle opzioni.<\/span><\/p>"]]},"lv":{"t":"Somas un maisījumi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kopa jums pasaka tikai to, <em>vai<\/em> vērtība tajā ir.<\/span> <span class=\"sg\" data-s=\"1\">Bet dažreiz jums vajag zināt arī, <em>cik reižu<\/em> vērtība tur ir.<\/span> <span class=\"sg\" data-s=\"2\">Tam ir <code>Bag<\/code>, kas katrai vērtībai glabā skaitu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Maisu izveido ar rutīnu <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Atkārtotas vērtības nekļūst par vienu vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tās tiek saskaitītas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat prasīt maisam vērtību ar indeksu <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs uzzināt, cik reižu šī vērtība tajā ielikta.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>total<\/code> dod visu skaitu summu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> ir tā pati ideja, kas maiss.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir tā, ka skaiti, ko sauc par <em>svariem<\/em>, var būt daļskaitļi, ne tikai veseli skaitļi.<\/span> <span class=\"sg\" data-s=\"2\">Lai svarus norādītu paši, savienojiet katru vērtību pārī ar tās svaru.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam pārvērtiet sarakstu par maisījumu ar <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Svaru jūs uzmeklējat ar <code>&lt; &gt;<\/code>, un svarus saskaitāt ar <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Abi darbojas tieši tāpat kā maisam.<\/span> <span class=\"sg\" data-s=\"2\">Vienīgā atšķirība ir tā, ka skaitļiem nav jābūt veseliem.<\/span> <span class=\"sg\" data-s=\"3\">Šeit <code>total<\/code> saskaita svarus <code>2.5<\/code> un <code>0.75<\/code>, kas dod <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tā ir svaru summa, nevis vērtību skaits.<\/span> <span class=\"sg\" data-s=\"5\">Maisi un maisījumi noder ikreiz, kad jāseko līdzi daudzumiem.<\/span> <span class=\"sg\" data-s=\"6\">Piemēram, jūs varat saskaitīt, cik bieži katrs vārds parādās tekstā.<\/span> <span class=\"sg\" data-s=\"7\">Vai arī jūs varat dot svarus izvēles variantiem.<\/span><\/p>"]]},"ru":{"t":"Мультимножества и смеси","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множество говорит вам только, <em>есть ли<\/em> в нём значение.<\/span> <span class=\"sg\" data-s=\"1\">Но иногда нужно знать ещё, <em>сколько раз<\/em> оно там встречается.<\/span> <span class=\"sg\" data-s=\"2\">Для этого есть <code>Bag<\/code>, который хранит счётчик для каждого значения.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы создаёте мультимножество с помощью подпрограммы <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторяющиеся значения не превращаются в одно.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого они подсчитываются:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можно спросить мультимножество о значении с помощью индекса <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогда вы получите, сколько раз это значение было добавлено.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>total<\/code> даёт сумму всех счётчиков:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> — та же идея, что и мультимножество.<\/span> <span class=\"sg\" data-s=\"1\">Разница в том, что счётчики, которые называются <em>весами<\/em>, могут быть дробями, а не только целыми числами.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы задать веса самим, соедините каждое значение с его весом в пару.<\/span> <span class=\"sg\" data-s=\"3\">Затем превратите список в смесь с помощью <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Вы находите вес с помощью <code>&lt; &gt;<\/code> и складываете веса с помощью <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оба способа работают точно так же, как для мультимножества.<\/span> <span class=\"sg\" data-s=\"2\">Единственная разница в том, что числа не обязаны быть целыми.<\/span> <span class=\"sg\" data-s=\"3\">Здесь <code>total<\/code> складывает веса <code>2.5<\/code> и <code>0.75<\/code>, и получается <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Это сумма весов, а не количество значений.<\/span> <span class=\"sg\" data-s=\"5\">Мультимножества и смеси полезны всегда, когда нужно следить за количествами.<\/span> <span class=\"sg\" data-s=\"6\">Например, можно посчитать, как часто каждое слово встречается в тексте.<\/span> <span class=\"sg\" data-s=\"7\">Или можно задать веса вариантам.<\/span><\/p>"]]},"uk":{"t":"Мультимножини та суміші","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множина каже вам лише, <em>чи<\/em> є в ній значення.<\/span> <span class=\"sg\" data-s=\"1\">Але іноді треба знати ще й <em>скільки разів<\/em> воно там трапляється.<\/span> <span class=\"sg\" data-s=\"2\">Для цього є <code>Bag<\/code>, який зберігає лічильник для кожного значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви створюєте мультимножину підпрограмою <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторені значення не стають одним значенням.<\/span> <span class=\"sg\" data-s=\"2\">Натомість їх рахують:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете запитати мультимножину про значення через індекс <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви отримаєте, скільки разів це значення поклали туди.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>total<\/code> дає суму всіх лічильників:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> — це та сама ідея, що й мультимножина.<\/span> <span class=\"sg\" data-s=\"1\">Різниця в тому, що лічильники, які називають <em>вагами<\/em>, можуть бути дробами, а не лише цілими числами.<\/span> <span class=\"sg\" data-s=\"2\">Щоб задати ваги самостійно, поєднайте кожне значення з його вагою в пару.<\/span> <span class=\"sg\" data-s=\"3\">Потім перетворіть список на суміш через <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Ви знаходите вагу через <code>&lt; &gt;<\/code> і додаєте ваги через <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обидва способи працюють точно так само, як для мультимножини.<\/span> <span class=\"sg\" data-s=\"2\">Єдина різниця в тому, що числа не мусять бути цілими.<\/span> <span class=\"sg\" data-s=\"3\">Тут <code>total<\/code> додає ваги <code>2.5<\/code> і <code>0.75<\/code>, що дає <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Це сума ваг, а не кількість значень.<\/span> <span class=\"sg\" data-s=\"5\">Мультимножини й суміші корисні щоразу, коли треба стежити за кількостями.<\/span> <span class=\"sg\" data-s=\"6\">Наприклад, можна рахувати, як часто кожне слово трапляється в тексті.<\/span> <span class=\"sg\" data-s=\"7\">Або можна давати ваги варіантам.<\/span><\/p>"]]},"bg":{"t":"Торби и смеси","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Множеството ви казва само <em>дали<\/em> една стойност е в него.<\/span> <span class=\"sg\" data-s=\"1\">Но понякога трябва да знаете и <em>колко пъти<\/em> стойността се среща.<\/span> <span class=\"sg\" data-s=\"2\">За това има <code>Bag<\/code>, който пази брояч за всяка стойност.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Създавате торба с подпрограмата <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Повторените стойности не стават една стойност.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това те се броят:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да попитате торбата за стойност с индекса <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава получавате колко пъти тази стойност е била добавена.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>total<\/code> дава сумата на всички броячи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> е същата идея като торбата.<\/span> <span class=\"sg\" data-s=\"1\">Разликата е, че броячите, наречени <em>тегла<\/em>, могат да са дроби, а не само цели числа.<\/span> <span class=\"sg\" data-s=\"2\">За да зададете теглата сами, свържете всяка стойност с нейното тегло.<\/span> <span class=\"sg\" data-s=\"3\">След това превърнете списъка в смес с <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Намирате тегло с <code>&lt; &gt;<\/code> и събирате теглата с <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">И двете работят точно както при торбата.<\/span> <span class=\"sg\" data-s=\"2\">Единствената разлика е, че числата не е задължително да са цели.<\/span> <span class=\"sg\" data-s=\"3\">Тук <code>total<\/code> събира теглата <code>2.5<\/code> и <code>0.75<\/code>, което дава <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Това е сумата на теглата, а не броят на стойностите.<\/span> <span class=\"sg\" data-s=\"5\">Торбите и смесите са полезни винаги, когато трябва да следите количества.<\/span> <span class=\"sg\" data-s=\"6\">Например можете да броите колко често се среща всяка дума в текст.<\/span> <span class=\"sg\" data-s=\"7\">Или можете да давате тегла на опции.<\/span><\/p>"]]},"eo":{"t":"Sakoj kaj miksaĵoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Aro diras al vi nur, <em>ĉu<\/em> valoro estas en ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Sed foje vi ankaŭ bezonas scii, <em>kiom da fojoj<\/em> la valoro estas tie.<\/span> <span class=\"sg\" data-s=\"2\">Por tio ekzistas la <code>Bag<\/code>, kiu tenas kalkulon por ĉiu valoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi kreas sakon per la rutino <code>bag<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ripetitaj valoroj ne fariĝas unu valoro.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ili estas kalkulataj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas peti valoron de la sako per la subskribo <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ricevas, kiom da fojoj ĉi tiu valoro estis enmetita.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>total<\/code> donas la sumon de ĉiuj kalkuloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> estas la sama ideo kiel sako.<\/span> <span class=\"sg\" data-s=\"1\">La diferenco estas, ke la kalkuloj, nomataj <em>pezoj<\/em>, povas esti frakcioj, ne nur tutaj nombroj.<\/span> <span class=\"sg\" data-s=\"2\">Por mem doni la pezojn, parigu ĉiun valoron kun ĝia pezo.<\/span> <span class=\"sg\" data-s=\"3\">Poste faru el la listo miksaĵon per <code>.Mix<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Vi serĉas pezon per <code>&lt; &gt;<\/code> kaj sumigas la pezojn per <code>total<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ambaŭ funkcias ĝuste kiel por sako.<\/span> <span class=\"sg\" data-s=\"2\">La sola diferenco estas, ke la nombroj ne devas esti tutaj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tie, <code>total<\/code> sumigas la pezojn <code>2.5<\/code> kaj <code>0.75<\/code>, kio donas <code>3.25<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas la sumo de la pezoj, ne la nombro de valoroj.<\/span> <span class=\"sg\" data-s=\"5\">Sakoj kaj miksaĵoj estas utilaj ĉiam, kiam vi bezonas sekvi kvantojn.<\/span> <span class=\"sg\" data-s=\"6\">Ekzemple, vi povas kalkuli, kiom ofte ĉiu vorto aperas en teksto.<\/span> <span class=\"sg\" data-s=\"7\">Aŭ vi povas doni pezojn al opcioj.<\/span><\/p>"]]},"la":{"t":"Sacculi et mixturae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Coniunctum tibi solum dicit <em>num<\/em> valor in eo sit.<\/span> <span class=\"sg\" data-s=\"1\">Sed interdum etiam scire debes <em>quotiens<\/em> valor ibi sit.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc est <code>Bag<\/code>, qui numerum pro quoque valore servat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sacculum functione <code>bag<\/code> creas.<\/span> <span class=\"sg\" data-s=\"1\">Valores repetiti non fiunt unus valor.<\/span> <span class=\"sg\" data-s=\"2\">Potius numerantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $b = bag(&lt;a b a c a&gt;);\nsay $b&lt;a&gt;; # 3\nsay $b&lt;b&gt;; # 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sacculum de valore interrogare potes cum subscripto <code>&lt; &gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum accipis quotiens hic valor insertus sit.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>total<\/code> summam omnium numerorum dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say bag(&lt;a b a c a&gt;).total; # 5<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>Mix<\/code> eadem notio est ac sacculus.<\/span> <span class=\"sg\" data-s=\"1\">Differentia est quod numeri, qui <em>pondera<\/em> vocantur, fractiones esse possunt, non solum numeri integri.<\/span> <span class=\"sg\" data-s=\"2\">Ut pondera ipse des, quemque valorem cum pondere suo coniunge.<\/span> <span class=\"sg\" data-s=\"3\">Deinde indicem in mixturam cum <code>.Mix<\/code> converte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $m = (flour =&gt; 2.5, sugar =&gt; 0.75).Mix;\nsay $m&lt;flour&gt;; # 2.5\nsay $m.total;  # 3.25<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Pondus cum <code>&lt; &gt;<\/code> quaeris et pondera cum <code>total<\/code> addis.<\/span> <span class=\"sg\" data-s=\"1\">Ambo exacte ut pro sacculo operantur.<\/span> <span class=\"sg\" data-s=\"2\">Sola differentia est quod numeri non necessario integri sunt.<\/span> <span class=\"sg\" data-s=\"3\">Hic <code>total<\/code> pondera <code>2.5<\/code> et <code>0.75<\/code> addit, quod <code>3.25<\/code> dat.<\/span> <span class=\"sg\" data-s=\"4\">Est summa ponderum, non numerus valorum.<\/span> <span class=\"sg\" data-s=\"5\">Sacculi et mixturae utiles sunt quotiens quantitates custodire debes.<\/span> <span class=\"sg\" data-s=\"6\">Exempli gratia, numerare potes quotiens quodque verbum in textu appareat.<\/span> <span class=\"sg\" data-s=\"7\">Vel optionibus pondera dare potes.<\/span><\/p>"]]}}}</script>
