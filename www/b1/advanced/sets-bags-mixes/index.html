<script type="application/json" id="page-data">{"u":"advanced/sets-bags-mixes","n":490,"k":"section","pv":"advanced/date-and-time/exercises/day-of-week/solution","nx":"advanced/sets-bags-mixes/operations","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sets, bags, and mixes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Besides arrays and hashes, Raku has a few special containers for collections of values.<\/span> <span class=\"sg\" data-s=\"1\">The simplest is the <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It is a collection of <em>distinct<\/em> values in no particular order.<\/span> <span class=\"sg\" data-s=\"3\">Each value is either in the set or not, and repeated values are ignored.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You create a set with the <code>set<\/code> routine.<\/span> <span class=\"sg\" data-s=\"1\">If a value is repeated, the set keeps only one copy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">We passed in five numbers, but the set has only three elements.<\/span> <span class=\"sg\" data-s=\"1\">This is because <code>1<\/code> and <code>2<\/code> appeared more than once.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The main question you ask a set is whether a value is in it.<\/span> <span class=\"sg\" data-s=\"1\">The <code>∈<\/code> operator, which you read as “is an element of”, returns a Boolean:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you want to stay with plain ASCII, write the same operator as <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Next, you will see how to combine sets.<\/span> <span class=\"sg\" data-s=\"1\">You will also meet bags and mixes, which are close relatives of sets.<\/span><\/p>"]]},"de":{"t":"Sets, Bags und Mixes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Neben Arrays und Hashes hat Raku ein paar besondere Container für Sammlungen von Werten.<\/span> <span class=\"sg\" data-s=\"1\">Der einfachste ist das <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es ist eine Sammlung von <em>verschiedenen<\/em> Werten ohne bestimmte Reihenfolge.<\/span> <span class=\"sg\" data-s=\"3\">Jeder Wert ist entweder im Set oder nicht, und wiederholte Werte werden ignoriert.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du erstellst ein Set mit der <code>set<\/code>-Routine.<\/span> <span class=\"sg\" data-s=\"1\">Wenn ein Wert mehrmals vorkommt, behält das Set nur eine Kopie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wir haben fünf Zahlen übergeben, aber das Set hat nur drei Elemente.<\/span> <span class=\"sg\" data-s=\"1\">Das liegt daran, dass <code>1<\/code> und <code>2<\/code> mehr als einmal vorkamen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die wichtigste Frage an ein Set ist, ob ein Wert darin ist.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>∈<\/code>, den du als \"ist Element von\" liest, gibt einen Booleschen Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du bei reinem ASCII bleiben willst, schreib denselben Operator als <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als Nächstes siehst du, wie man Sets kombiniert.<\/span> <span class=\"sg\" data-s=\"1\">Du lernst auch Bags und Mixes kennen, die enge Verwandte von Sets sind.<\/span><\/p>"]]},"nl":{"t":"Sets, bags en mixes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Naast arrays en hashes heeft Raku een paar speciale containers voor verzamelingen van waarden.<\/span> <span class=\"sg\" data-s=\"1\">De eenvoudigste is de <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat is een verzameling van <em>unieke<\/em> waarden zonder vaste volgorde.<\/span> <span class=\"sg\" data-s=\"3\">Elke waarde zit in de set of niet, en herhaalde waarden worden genegeerd.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je maakt een set met de <code>set<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"1\">Als een waarde herhaald wordt, bewaart de set die maar één keer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">We gaven vijf getallen mee, maar de set heeft maar drie elementen.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat <code>1<\/code> en <code>2<\/code> meer dan één keer voorkwamen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De belangrijkste vraag die je aan een set stelt, is of een waarde erin zit.<\/span> <span class=\"sg\" data-s=\"1\">De operator <code>∈<\/code>, die je leest als \"is een element van\", geeft een Boolean terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je bij gewone ASCII wilt blijven, schrijf je dezelfde operator als <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hierna zie je hoe je sets combineert.<\/span> <span class=\"sg\" data-s=\"1\">Je leert ook bags en mixes kennen, die nauwe familie van sets zijn.<\/span><\/p>"]]},"es":{"t":"Conjuntos, bolsas y mezclas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Además de los arrays y los hashes, Raku tiene algunos contenedores especiales para colecciones de valores.<\/span> <span class=\"sg\" data-s=\"1\">El más simple es el <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Es una colección de valores <em>distintos<\/em> sin ningún orden concreto.<\/span> <span class=\"sg\" data-s=\"3\">Cada valor está en el set o no está, y los valores repetidos se ignoran.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Creas un set con la rutina <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si un valor se repite, el set guarda solo una copia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pasamos cinco números, pero el set tiene solo tres elementos.<\/span> <span class=\"sg\" data-s=\"1\">Esto es porque <code>1<\/code> y <code>2<\/code> aparecieron más de una vez.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La pregunta principal que le haces a un set es si un valor está en él.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>∈<\/code>, que lees como \"es un elemento de\", devuelve un Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si quieres quedarte con ASCII simple, escribe el mismo operador como <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A continuación, verás cómo combinar sets.<\/span> <span class=\"sg\" data-s=\"1\">También conocerás los bags y los mixes, que son parientes cercanos de los sets.<\/span><\/p>"]]},"it":{"t":"Set, bag e mix","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Oltre agli array e agli hash, Raku ha alcuni contenitori speciali per collezioni di valori.<\/span> <span class=\"sg\" data-s=\"1\">Il più semplice è il <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">È una collezione di valori <em>distinti<\/em> senza un ordine preciso.<\/span> <span class=\"sg\" data-s=\"3\">Ogni valore è nel set oppure no, e i valori ripetuti vengono ignorati.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Crei un set con la routine <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se un valore è ripetuto, il set ne tiene una sola copia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Abbiamo passato cinque numeri, ma il set ha solo tre elementi.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché <code>1<\/code> e <code>2<\/code> comparivano più di una volta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La domanda principale che fai a un set è se un valore è nel set.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>∈<\/code>, che leggi come “è un elemento di”, restituisce un booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vuoi restare con il semplice ASCII, scrivi lo stesso operatore come <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Più avanti vedrai come combinare i set.<\/span> <span class=\"sg\" data-s=\"1\">Conoscerai anche i bag e i mix, che sono parenti stretti dei set.<\/span><\/p>"]]},"lv":{"t":"Kopas, somas un maisījumi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bez masīviem un jaukteņiem Raku ir daži īpaši konteineri vērtību kolekcijām.<\/span> <span class=\"sg\" data-s=\"1\">Vienkāršākais ir <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir <em>atšķirīgu<\/em> vērtību kolekcija bez noteiktas secības.<\/span> <span class=\"sg\" data-s=\"3\">Katra vērtība vai nu ir kopā, vai nav, un atkārtotas vērtības tiek ignorētas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kopu izveido ar rutīnu <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja vērtība atkārtojas, kopa patur tikai vienu tās kopiju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mēs padevām piecus skaitļus, bet kopā ir tikai trīs elementi.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka <code>1<\/code> un <code>2<\/code> parādījās vairāk nekā vienu reizi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Galvenais jautājums, ko jūs uzdodat kopai, ir, vai vērtība ir tajā.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>∈<\/code>, ko lasa kā «ir elements no», atgriež Būla vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja vēlaties palikt pie vienkārša ASCII, rakstiet to pašu operatoru kā <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tālāk jūs redzēsiet, kā apvienot kopas.<\/span> <span class=\"sg\" data-s=\"1\">Jūs iepazīsiet arī maisus un maisījumus, kas ir kopu tuvi radinieki.<\/span><\/p>"]]},"ru":{"t":"Множества, мультимножества и смеси","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Кроме массивов и хешей, в Raku есть несколько особых контейнеров для коллекций значений.<\/span> <span class=\"sg\" data-s=\"1\">Самый простой из них — <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это коллекция <em>уникальных<\/em> значений без определённого порядка.<\/span> <span class=\"sg\" data-s=\"3\">Каждое значение либо есть в множестве, либо нет, а повторы не учитываются.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы создаёте множество с помощью подпрограммы <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если значение повторяется, множество хранит только одну его копию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Мы передали пять чисел, но в множестве только три элемента.<\/span> <span class=\"sg\" data-s=\"1\">Так получилось потому, что <code>1<\/code> и <code>2<\/code> встречались больше одного раза.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Главный вопрос к множеству — есть ли в нём значение.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>∈<\/code>, который читается как «является элементом», возвращает булево значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы хотите обойтись простым ASCII, запишите тот же оператор как <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дальше вы увидите, как комбинировать множества.<\/span> <span class=\"sg\" data-s=\"1\">Вы также познакомитесь с мультимножествами (bags) и смесями (mixes) — близкими родственниками множеств.<\/span><\/p>"]]},"uk":{"t":"Множини, мультимножини та суміші","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Окрім масивів і хешів, у Raku є кілька особливих контейнерів для наборів значень.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіший — <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це набір <em>різних<\/em> значень без певного порядку.<\/span> <span class=\"sg\" data-s=\"3\">Кожне значення або є в множині, або ні, а повторені значення ігноруються.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви створюєте множину підпрограмою <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо значення повторюється, множина зберігає лише одну його копію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ми передали п'ять чисел, але множина має лише три елементи.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що <code>1<\/code> і <code>2<\/code> траплялися більше ніж один раз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Головне запитання, яке ви ставите множині, — чи є в ній значення.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>∈<\/code>, який читають як «є елементом», повертає булеве значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо ви хочете залишатися в межах простого ASCII, пишіть той самий оператор як <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Далі ви побачите, як поєднувати множини.<\/span> <span class=\"sg\" data-s=\"1\">Ви також познайомитеся з мультимножинами й сумішами, які є близькими родичами множин.<\/span><\/p>"]]},"bg":{"t":"Множества, торби и смеси","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Освен масиви и хешове, Raku има няколко специални контейнера за колекции от стойности.<\/span> <span class=\"sg\" data-s=\"1\">Най-простият е <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е колекция от <em>различни<\/em> стойности без определен ред.<\/span> <span class=\"sg\" data-s=\"3\">Всяка стойност или е в множеството, или не, а повторените стойности се пропускат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Създавате множество с подпрограмата <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако една стойност се повтаря, множеството пази само едно копие:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подадохме пет числа, но множеството има само три елемента.<\/span> <span class=\"sg\" data-s=\"1\">Причината е, че <code>1<\/code> и <code>2<\/code> се появиха повече от веднъж.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Основният въпрос към множеството е дали една стойност е в него.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>∈<\/code>, който се чете като „е елемент на“, връща булева стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако искате да останете само с ASCII, напишете същия оператор като <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">По-нататък ще видите как да комбинирате множества.<\/span> <span class=\"sg\" data-s=\"1\">Ще се запознаете и с торбите и смесите, които са близки роднини на множествата.<\/span><\/p>"]]},"eo":{"t":"Aroj, sakoj kaj miksaĵoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Krom tabeloj kaj hakoj, Raku havas kelkajn specialajn ujojn por kolektoj de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">La plej simpla estas la <code>Set<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas kolekto de <em>distingaj<\/em> valoroj sen aparta ordo.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu valoro estas aŭ en la aro aŭ ne, kaj ripetitaj valoroj estas ignorataj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi kreas aron per la rutino <code>set<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se valoro ripetiĝas, la aro konservas nur unu kopion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ni transdonis kvin nombrojn, sed la aro havas nur tri elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas, ĉar <code>1<\/code> kaj <code>2<\/code> aperis pli ol unufoje.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ĉefa demando, kiun vi faras al aro, estas, ĉu valoro estas en ĝi.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro <code>∈<\/code>, kiun vi legas kiel «estas elemento de», redonas Boolean valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi volas resti ĉe simpla ASCII, skribu la saman operatoron kiel <code>(elem)<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poste, vi vidos, kiel kombini arojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ renkontos sakojn kaj miksaĵojn, kiuj estas proksimaj parencoj de aroj.<\/span><\/p>"]]},"la":{"t":"Coniuncta, sacculi, et mixturae","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Praeter ordines et hashes, Raku aliquot receptacula specialia pro collectionibus valorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Simplicissimum est <code>Set<\/code>, id est coniunctum.<\/span> <span class=\"sg\" data-s=\"2\">Est collectio valorum <em>distinctorum<\/em> sine certo ordine.<\/span> <span class=\"sg\" data-s=\"3\">Quisque valor aut in coniuncto est aut non est, et valores repetiti negleguntur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Coniunctum functione <code>set<\/code> creas.<\/span> <span class=\"sg\" data-s=\"1\">Si valor repetitur, coniunctum solum unum exemplar servat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $s = set(1, 2, 3, 2, 1);\nsay $s.elems; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quinque numeros dedimus, sed coniunctum solum tria elementa habet.<\/span> <span class=\"sg\" data-s=\"1\">Causa est quod <code>1<\/code> et <code>2<\/code> plus quam semel apparuerunt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praecipua quaestio quam coniuncto ponis est num valor in eo sit.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>∈<\/code>, quem ut “est elementum” legis, valorem Booleanum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ∈ set(1, 2, 3); # True\nsay 9 ∈ set(1, 2, 3); # False<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si solum ASCII simplici uti vis, eundem operatorem ut <code>(elem)<\/code> scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 (elem) set(1, 2, 3); # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deinde videbis quomodo coniuncta componas.<\/span> <span class=\"sg\" data-s=\"1\">Etiam sacculos et mixturas cognosces, qui propinqui cognati coniunctorum sunt.<\/span><\/p>"]]}}}</script>
