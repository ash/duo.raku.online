= 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> hace que <code>$*user<\/code> sea dinámica. <code>whoami<\/code> nunca la recibe como parámetro. En cambio, encuentra el valor buscando hacia afuera a través de la pila de llamadas. Así que la primera llamada muestra el valor predeterminado, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque interno declara <code>$*user<\/code> otra vez como <code>admin<\/code>, y esto dura mientras se ejecuta el bloque. La <em>misma<\/em> <code>whoami<\/code> ahora ve <code>admin<\/code>. Esto es porque la búsqueda dinámica sigue a quien está en la pila en ese momento. Anular una variable dinámica en un ámbito da más derechos a todo lo que se llama desde él. Y no necesitas cambiar <code>whoami<\/code> para nada.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Una variabile dinamica","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> rende <code>$*user<\/code> dinamica. <code>whoami<\/code> non la riceve mai come parametro. Invece, trova il valore cercando verso l'esterno nello stack delle chiamate. Quindi la prima chiamata mostra il valore predefinito, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco interno dichiara di nuovo <code>$*user<\/code> come <code>admin<\/code>, e questo dura finché il blocco è in esecuzione. La <em>stessa<\/em> <code>whoami<\/code> ora vede <code>admin<\/code>. Questo perché la ricerca dinamica segue chi c'è nello stack in quel momento. Sovrascrivere una variabile dinamica in uno scope dà più diritti a tutto ciò che viene chiamato da lì. E non devi cambiare per niente <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Dinamisks mainīgais","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span c у первый вызов показывает значение по умолчанию, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внутренний блок снова объявляет <code>$*user<\/code> как <code>admin<\/code>, и это действует, пока работает блок. <em>Та же самая<\/em> <code>whoami<\/code> теперь видит <code>admin<\/code>. Это потому, что динамический поиск идёт за тем, кто сейчас находится на стеке. Если перекрыть динамическую переменную в области видимости, всё, что оттуда вызывается, получает больше прав. И вам совсем не нужно менять <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Динамічна змінна","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Твіґіл <code>*<\/code> робить <code>$*user<\/code> динамічною. <code>whoami<\/code> ніколи не отримує її як параметр. Натомість вона знаходить значення, дивлячись назовні по стеку викликів. Тож перший виклик показує типове значення, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внутрішній блок знову оголошує <code>$*user<\/code> як <code>admin<\/code>, і це триває, поки виконується блок. <em>Та сама<\/em> <code>whoami<\/code> тепер бачить <code>admin<\/code>. Це тому, що динамічний пошук іде за тим, хто зараз є в стеку. Якщо перекрити динамічну змінну в області видимості, усе, що звідти викликається, отримує більше прав. І вам зовсім не треба змінювати <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Динамична променлива","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Туигилът <code>*<\/code> прави <code>$*user<\/code> динамична. <code>whoami<\/code> никога не я получава като параметър. Вместо това тя намира стойността, като търси навън през стека на извикванията. Така първото извикване показва стойността по подразбиране, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вътрешният блок декларира <code>$*user<\/code> отново като <code>admin<\/code> и това трае, докато блокът работи. <em>Същата<\/em> <code>whoami<\/code> сега вижда <code>admin<\/code>. Това е така, защото динамичното търсене следва този, който е на стека в момента. Заменянето на динамична променлива в обхват дава повече права на всичко, което се извиква оттам. И не е нужно изобщо да променяте <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Dinamika variablo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tvigilo <code>*<\/code> igas <code>$*user<\/code> dinamika. <code>whoami<\/code> neniam ricevas ĝin kiel parametron. Anstataŭe, ĝi trovas la valoron, rigardante eksteren tra la voka stako. Do la unua voko montras la defaŭlton, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La interna bloko denove deklaras <code>$*user<\/code> kiel <code>admin<\/code>, kaj tio daŭras, dum la bloko ruliĝas. La <em>sama<\/em> <code>whoami<\/code> nun vidas <code>admin<\/code>. Tio estas ĉar dinamika serĉado sekvas tiun, kiu estas sur la stako en la momento. Anstataŭigi dinamikan variablon en amplekso donas pli da rajtoj al ĉio, kio estas vokita el ĝi. Kaj vi tute ne bezonas ŝanĝi <code>whoami<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Dynamica variabilis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $*user = 'guest';\n\nsub whoami {\n    say \"running as $*user\";\n}\n\nwhoami();\n\n{\n    my $*user = 'admin';\n    whoami();\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/special-variables/a-dynamic-variable.raku\" target=\"_blank\" rel=\"noopener\">a-dynamic-variable.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Twigil <code>*<\/code> <code>$*user<\/code> dynamicam facit. <code>whoami<\/code> eam numquam ut parametrum accipit. Potius valorem invenit foras per acervum vocationum quaerendo. Itaque prima vocatio praedefinitum ostendit, <code>guest<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Clausula interior <code>$*user<\/code> iterum ut <code>admin<\/code> declarat, et hoc manet dum clausula currit. <em>Idem<\/em> <code>whoami<\/code> nunc <code>admin<\/code> videt. Causa est quod quaesitio dynamica eum sequitur quicumque nunc in acervo est. Si variabilem dynamicam in circumscriptione superas, omnibus inde vocatis plura iura das. Et <code>whoami<\/code> omnino mutare non debes.<\/span><\/li><\/ol>"]]}}}</script>
