<script type="application/json" id="page-data">{"u":"advanced/special-variables/exercises/a-dynamic-variable","n":413,"k":"exercise","pv":"advanced/special-variables/exercises","nx":"advanced/special-variables/exercises/a-dynamic-variable/solution","tr":["advanced","advanced/special-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exercise ’A dynamic variable‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A dynamic variable is written with the <code>*<\/code> twigil.<\/span> <span class=\"sg\" data-s=\"1\">Raku finds it by searching outward through the call stack, not by lexical scope.<\/span> <span class=\"sg\" data-s=\"2\">So the value that a subroutine sees depends on who called it.<\/span> <span class=\"sg\" data-s=\"3\">This lets a block run the code that it calls with a different identity.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declare a dynamic variable <code>$*user<\/code> with the value <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Write a subroutine <code>whoami<\/code> that prints <code>running as <\/code> and then the current <code>$*user<\/code> (for example, <code>running as guest<\/code>). It has no parameters, so it must read <code>$*user<\/code> directly.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Call <code>whoami<\/code> once at the top level. It shows <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Then make a block that declares <code>$*user<\/code> again as <code>'admin'<\/code>. Inside it, call the <em>same<\/em> <code>whoami<\/code> again. Now it shows <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Eine dynamische Variable","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aufgabe<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine dynamische Variable schreibt man mit dem Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku findet sie, indem es nach außen durch den Aufrufstapel sucht, nicht über den lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"2\">Also hängt der Wert, den eine Subroutine sieht, davon ab, wer sie aufgerufen hat.<\/span> <span class=\"sg\" data-s=\"3\">So kann ein Block den Code, den er aufruft, mit einer anderen Identität ausführen.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklariere eine dynamische Variable <code>$*user<\/code> mit dem Wert <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schreibe eine Subroutine <code>whoami<\/code>, die <code>running as <\/code> und dann den aktuellen <code>$*user<\/code> ausgibt (zum Beispiel <code>running as guest<\/code>). Sie hat keine Parameter, also muss sie <code>$*user<\/code> direkt lesen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Rufe <code>whoami<\/code> einmal auf der obersten Ebene auf. Sie zeigt <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Mach dann einen Block, der <code>$*user<\/code> noch einmal als <code>'admin'<\/code> deklariert. Rufe darin <em>dieselbe<\/em> <code>whoami<\/code> noch einmal auf. Jetzt zeigt sie <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"Een dynamische variabele","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een dynamische variabele schrijf je met de <code>*<\/code>-twigil.<\/span> <span class=\"sg\" data-s=\"1\">Raku vindt hem door naar buiten te zoeken via de call stack, niet via lexicale scope.<\/span> <span class=\"sg\" data-s=\"2\">Dus hangt de waarde die een subroutine ziet af van wie hem heeft aangeroepen.<\/span> <span class=\"sg\" data-s=\"3\">Zo kan een blok de code die het aanroept met een andere identiteit laten draaien.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declareer een dynamische variabele <code>$*user<\/code> met de waarde <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Schrijf een subroutine <code>whoami<\/code> die <code>running as <\/code> print en daarna de huidige <code>$*user<\/code> (bijvoorbeeld <code>running as guest<\/code>). Hij heeft geen parameters, dus hij moet <code>$*user<\/code> direct lezen.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Roep <code>whoami<\/code> één keer aan op het bovenste niveau. Hij toont <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Maak daarna een blok dat <code>$*user<\/code> opnieuw declareert als <code>'admin'<\/code>. Roep daarbinnen <em>dezelfde<\/em> <code>whoami<\/code> nog een keer aan. Nu toont hij <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma print:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"Una variable dinámica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una variable dinámica se escribe con el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku la encuentra buscando hacia afuera a través de la pila de llamadas, no por ámbito léxico.<\/span> <span class=\"sg\" data-s=\"2\">Así que el valor que ve una subrutina depende de quién la llamó.<\/span> <span class=\"sg\" data-s=\"3\">Esto permite a un bloque ejecutar el código que llama con una identidad diferente.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declara una variable dinámica <code>$*user<\/code> con el valor <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Escribe una subrutina <code>whoami<\/code> que imprima <code>running as <\/code> y luego el valor actual de <code>$*user<\/code> (por ejemplo, <code>running as guest<\/code>). No tiene parámetros, así que debe leer <code>$*user<\/code> directamente.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Llama a <code>whoami<\/code> una vez en el nivel superior. Muestra <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Luego crea un bloque que declare <code>$*user<\/code> otra vez como <code>'admin'<\/code>. Dentro de él, llama otra vez a la <em>misma<\/em> <code>whoami<\/code>. Ahora muestra <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Ver la solución<\/a><\/span><\/p>"]]},"it":{"t":"Una variabile dinamica","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Una variabile dinamica si scrive con il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku la trova cercando verso l'esterno nello stack delle chiamate, non con lo scope lessicale.<\/span> <span class=\"sg\" data-s=\"2\">Quindi il valore che vede una subroutine dipende da chi l'ha chiamata.<\/span> <span class=\"sg\" data-s=\"3\">Questo permette a un blocco di eseguire il codice che chiama con un'identità diversa.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Dichiara una variabile dinamica <code>$*user<\/code> con il valore <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Scrivi una subroutine <code>whoami<\/code> che stampa <code>running as <\/code> e poi il valore attuale di <code>$*user<\/code> (per esempio, <code>running as guest<\/code>). Non ha parametri, quindi deve leggere <code>$*user<\/code> direttamente.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Chiama <code>whoami<\/code> una volta al livello superiore. Mostra <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poi crea un blocco che dichiara di nuovo <code>$*user<\/code> come <code>'admin'<\/code>. Dentro questo blocco, chiama di nuovo la <em>stessa<\/em> <code>whoami<\/code>. Ora mostra <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Dinamisks mainīgais","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dinamisku mainīgo raksta ar tvigilu <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku to atrod, meklējot uz āru pa izsaukumu steku, nevis pēc leksiskā redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc vērtība, ko apakšprogramma redz, ir atkarīga no tā, kas to izsauca.<\/span> <span class=\"sg\" data-s=\"3\">Tas ļauj blokam izpildīt kodu, ko tas izsauc, ar citu identitāti.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklarējiet dinamisku mainīgo <code>$*user<\/code> ar vērtību <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Uzrakstiet apakšprogrammu <code>whoami<\/code>, kas izdrukā <code>running as <\/code> un pēc tam pašreizējo <code>$*user<\/code> (piemēram, <code>running as guest<\/code>). Tai nav parametru, tāpēc tai <code>$*user<\/code> jānolasa tieši.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Izsauciet <code>whoami<\/code> vienreiz augšējā līmenī. Tā parāda <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Pēc tam izveidojiet bloku, kas vēlreiz deklarē <code>$*user<\/code> kā <code>'admin'<\/code>. Tā iekšienē vēlreiz izsauciet <em>to pašu<\/em> <code>whoami<\/code>. Tagad tā parāda <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Динамическая переменная","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Динамическая переменная пишется с твигилом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku находит её, когда ищет вверх по стеку вызовов, а не по лексической области видимости.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому значение, которое видит подпрограмма, зависит от того, кто её вызвал.<\/span> <span class=\"sg\" data-s=\"3\">Так блок может запускать вызываемый им код от имени кого-то другого.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Объявите динамическую переменную <code>$*user<\/code> со значением <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишите подпрограмму <code>whoami<\/code>, которая выводит <code>running as <\/code> и потом текущее значение <code>$*user<\/code> (например, <code>running as guest<\/code>). У неё нет параметров, поэтому она должна читать <code>$*user<\/code> напрямую.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Вызовите <code>whoami<\/code> один раз на верхнем уровне. Она показывает <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Потом создайте блок, который снова объявляет <code>$*user<\/code> как <code>'admin'<\/code>. Внутри него снова вызовите <em>ту же самую<\/em> <code>whoami<\/code>. Теперь она показывает <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Динамічна змінна»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Динамічну змінну записують із твіґілом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku знаходить її, шукаючи назовні по стеку викликів, а не за лексичною областю видимості.<\/span> <span class=\"sg\" data-s=\"2\">Тож значення, яке бачить підпрограма, залежить від того, хто її викликав.<\/span> <span class=\"sg\" data-s=\"3\">Це дозволяє блоку виконувати код, який він викликає, від імені когось іншого.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Оголосіть динамічну змінну <code>$*user<\/code> зі значенням <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишіть підпрограму <code>whoami<\/code>, яка виводить <code>running as <\/code>, а потім поточне значення <code>$*user<\/code> (наприклад, <code>running as guest<\/code>). Вона не має параметрів, тож має читати <code>$*user<\/code> напряму.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Викличте <code>whoami<\/code> один раз на верхньому рівні. Вона показує <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Потім створіть блок, який знову оголошує <code>$*user<\/code> як <code>'admin'<\/code>. Усередині нього знову викличте <em>ту саму<\/em> <code>whoami<\/code>. Тепер вона показує <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Динамична променлива","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Проблем<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Динамичната променлива се пише с туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku я намира, като търси навън през стека на извикванията, а не по лексикален обхват.<\/span> <span class=\"sg\" data-s=\"2\">Така стойността, която подпрограмата вижда, зависи от това кой я е извикал.<\/span> <span class=\"sg\" data-s=\"3\">Това позволява на един блок да изпълни кода, който извиква, с различна идентичност.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Декларирайте динамична променлива <code>$*user<\/code> със стойност <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Напишете подпрограма <code>whoami<\/code>, която отпечатва <code>running as <\/code> и след това текущата <code>$*user<\/code> (например <code>running as guest<\/code>). Тя няма параметри, затова трябва да чете <code>$*user<\/code> директно.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Извикайте <code>whoami<\/code> веднъж на най-горното ниво. Тя показва <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">След това направете блок, който декларира <code>$*user<\/code> отново като <code>'admin'<\/code>. В него извикайте <em>същата<\/em> <code>whoami<\/code> отново. Сега тя показва <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Dinamika variablo","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dinamika variablo estas skribita kun la tvigilo <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku trovas ĝin, serĉante eksteren tra la voka stako, ne per leksika amplekso.<\/span> <span class=\"sg\" data-s=\"2\">Do la valoro, kiun subrutino vidas, dependas de tio, kiu vokis ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Tio permesas al bloko ruli la kodon, kiun ĝi vokas, kun alia identeco.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Deklaru dinamikan variablon <code>$*user<\/code> kun la valoro <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Skribu subrutinon <code>whoami<\/code>, kiu presas <code>running as <\/code> kaj poste la nunan <code>$*user<\/code> (ekzemple, <code>running as guest<\/code>). Ĝi ne havas parametrojn, do ĝi devas legi <code>$*user<\/code> rekte.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Voku <code>whoami<\/code> unufoje ĉe la supra nivelo. Ĝi montras <code>guest<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Poste faru blokon, kiu denove deklaras <code>$*user<\/code> kiel <code>'admin'<\/code>. Ene de ĝi, voku la <em>saman<\/em> <code>whoami<\/code> denove. Nun ĝi montras <code>admin<\/code>.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Dynamica variabilis","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Variabilis dynamica cum twigil <code>*<\/code> scribitur.<\/span> <span class=\"sg\" data-s=\"1\">Raku eam invenit foras per acervum vocationum quaerendo, non per circumscriptionem lexicam.<\/span> <span class=\"sg\" data-s=\"2\">Itaque valor quem subprogramma videt ab eo pendet qui id vocavit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc clausulae permittit codicem quem vocat sub alia persona exsequi.<\/span><\/p>"],["list",4,"<ol><li><span class=\"sg\" data-s=\"0\">Declara variabilem dynamicam <code>$*user<\/code> cum valore <code>'guest'<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\">Scribe subprogramma <code>whoami<\/code> quod imprimit <code>running as <\/code> et deinde <code>$*user<\/code> praesentem (exempli gratia, <code>running as guest<\/code>). Nullos parametros habet, itaque <code>$*user<\/code> directe legere debet.<\/span><\/li><li><span class=\"sg\" data-s=\"2\">Voca <code>whoami<\/code> semel in gradu summo. <code>guest<\/code> ostendit.<\/span><\/li><li><span class=\"sg\" data-s=\"3\">Deinde fac clausulam quae <code>$*user<\/code> iterum ut <code>'admin'<\/code> declarat. Intra eam voca <em>idem<\/em> <code>whoami<\/code> iterum. Nunc <code>admin<\/code> ostendit.<\/span><\/li><\/ol>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>running as guest\nrunning as admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/special-variables/exercises/a-dynamic-variable/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
