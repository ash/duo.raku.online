<script type="application/json" id="page-data">{"u":"advanced/special-variables/built-in","n":410,"k":"topic","pv":"advanced/special-variables/dynamic-variables/quiz","nx":"advanced/special-variables/built-in/quiz","tr":["advanced","advanced/special-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in special variables","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku defines a set of variables for you.<\/span> <span class=\"sg\" data-s=\"1\">Most of them are <em>dynamic<\/em>, with the <code>*<\/code> twigil.<\/span> <span class=\"sg\" data-s=\"2\">So you can read them anywhere, as you saw with <a href=\"/advanced/special-variables/dynamic-variables/\">dynamic variables<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">You can even override them for a scope.<\/span> <span class=\"sg\" data-s=\"4\">Here are the ones you will need most often.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standard streams<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Input and output go through three dynamic variables: <code>$*OUT<\/code> for standard output, <code>$*ERR<\/code> for standard error, and <code>$*IN<\/code> for standard input.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> and <code>print<\/code> write to <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">To send text to standard error instead, call the method on <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Because these variables are dynamic, you can redirect <code>$*OUT<\/code> in a block.<\/span> <span class=\"sg\" data-s=\"1\">Then everything you call inside that block sends its output to the new place.<\/span> <span class=\"sg\" data-s=\"2\">You do not need to change any of that code.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The program and its process<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A few variables give information about the running program itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Their values change each time you run the program.<\/span> <span class=\"sg\" data-s=\"1\">So there is no fixed output to show here.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Command line and environment<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The arguments and the environment come in two containers that are ready to use:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — the list of command-line arguments (a <code>MAIN<\/code> subroutine gets the same ones)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — the environment variables, in a hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">These built-in variables save you from collecting the same information yourself.<\/span> <span class=\"sg\" data-s=\"1\">They are also dynamic, so Raku looks them up through the call stack.<\/span> <span class=\"sg\" data-s=\"2\">So you can override any <code>$*<\/code> built-in for a scope.<\/span> <span class=\"sg\" data-s=\"3\">This works exactly as with a <code>$*<\/code> variable of your own.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides these dynamic variables, Raku also has the compile-time <code>?<\/code> built-ins: <code>$?FILE<\/code> and <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You already saw them on the <a href=\"/advanced/special-variables/twigils/\">twigils<\/a> page.<\/span><\/p>"]]},"de":{"t":"Eingebaute spezielle Variablen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku definiert eine Reihe von Variablen für dich.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten davon sind <em>dynamisch<\/em>, mit dem Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Also kannst du sie überall lesen, wie du bei den <a href=\"https://course.raku.org/de/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamischen Variablen<\/a> gesehen hast.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst sie sogar für einen Geltungsbereich überschreiben.<\/span> <span class=\"sg\" data-s=\"4\">Hier sind die Variablen, die du am häufigsten brauchen wirst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standardströme<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eingabe und Ausgabe gehen durch drei dynamische Variablen: <code>$*OUT<\/code> für die Standardausgabe, <code>$*ERR<\/code> für die Standardfehlerausgabe und <code>$*IN<\/code> für die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> und <code>print<\/code> schreiben nach <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Um Text stattdessen an die Standardfehlerausgabe zu senden, rufe die Methode auf <code>$*ERR<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Weil diese Variablen dynamisch sind, kannst du <code>$*OUT<\/code> in einem Block umleiten.<\/span> <span class=\"sg\" data-s=\"1\">Dann schickt alles, was du in diesem Block aufrufst, seine Ausgabe an den neuen Ort.<\/span> <span class=\"sg\" data-s=\"2\">Du musst nichts an diesem Code ändern.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das Programm und sein Prozess<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige Variablen geben Informationen über das laufende Programm selbst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ihre Werte ändern sich jedes Mal, wenn du das Programm ausführst.<\/span> <span class=\"sg\" data-s=\"1\">Also gibt es hier keine feste Ausgabe zu zeigen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommandozeile und Umgebung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Argumente und die Umgebung kommen in zwei Containern, die du sofort benutzen kannst:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — die Liste der Kommandozeilenargumente (eine <code>MAIN<\/code>-Subroutine bekommt dieselben)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — die Umgebungsvariablen, in einem Hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diese eingebauten Variablen ersparen dir, dieselben Informationen selbst zu sammeln.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind auch dynamisch, also sucht Raku sie über den Aufrufstapel.<\/span> <span class=\"sg\" data-s=\"2\">Also kannst du jede eingebaute <code>$*<\/code>-Variable für einen Geltungsbereich überschreiben.<\/span> <span class=\"sg\" data-s=\"3\">Das funktioniert genau wie bei einer eigenen <code>$*<\/code>-Variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben diesen dynamischen Variablen hat Raku auch die eingebauten <code>?<\/code>-Variablen der Kompilierzeit: <code>$?FILE<\/code> und <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Du hast sie schon auf der Seite über <a href=\"https://course.raku.org/de/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">Twigils<\/a> gesehen.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde speciale variabelen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku definieert een reeks variabelen voor je.<\/span> <span class=\"sg\" data-s=\"1\">De meeste zijn <em>dynamisch<\/em>, met de <code>*<\/code>-twigil.<\/span> <span class=\"sg\" data-s=\"2\">Dus kun je ze overal lezen, zoals je zag bij <a href=\"https://course.raku.org/nl/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische variabelen<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze zelfs voor een scope overschrijven.<\/span> <span class=\"sg\" data-s=\"4\">Hier zijn de variabelen die je het vaakst nodig zult hebben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standaardstreams<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Invoer en uitvoer gaan via drie dynamische variabelen: <code>$*OUT<\/code> voor standaarduitvoer, <code>$*ERR<\/code> voor standaardfout en <code>$*IN<\/code> voor standaardinvoer.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> en <code>print<\/code> schrijven naar <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Om tekst in plaats daarvan naar standaardfout te sturen, roep je de methode aan op <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omdat deze variabelen dynamisch zijn, kun je <code>$*OUT<\/code> in een blok omleiden.<\/span> <span class=\"sg\" data-s=\"1\">Dan stuurt alles wat je in dat blok aanroept zijn uitvoer naar de nieuwe plek.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft niets aan die code te veranderen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het programma en zijn proces<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een paar variabelen geven informatie over het draaiende programma zelf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hun waarden veranderen elke keer dat je het programma draait.<\/span> <span class=\"sg\" data-s=\"1\">Er is hier dus geen vaste uitvoer om te tonen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commandoregel en omgeving<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De argumenten en de omgevingsvariabelen komen in twee containers die klaar zijn voor gebruik:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — de lijst met commandoregelargumenten (een <code>MAIN<\/code>-subroutine krijgt dezelfde)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — de omgevingsvariabelen, in een hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Deze ingebouwde variabelen besparen je het werk om dezelfde informatie zelf te verzamelen.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn ook dynamisch, dus Raku zoekt ze op via de call stack.<\/span> <span class=\"sg\" data-s=\"2\">Dus kun je elke ingebouwde <code>$*<\/code>-variabele voor een scope overschrijven.<\/span> <span class=\"sg\" data-s=\"3\">Dit werkt precies zoals bij een eigen <code>$*<\/code>-variabele.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast deze dynamische variabelen heeft Raku ook de ingebouwde compile-time <code>?<\/code>-variabelen: <code>$?FILE<\/code> en <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je zag ze al op de pagina over <a href=\"https://course.raku.org/nl/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"es":{"t":"Variables especiales integradas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku define un conjunto de variables para ti.<\/span> <span class=\"sg\" data-s=\"1\">La mayoría de ellas son <em>dinámicas<\/em>, con el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que puedes leerlas en cualquier lugar, como viste con las <a href=\"https://course.raku.org/es/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variables dinámicas<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Incluso puedes anularlas para un ámbito.<\/span> <span class=\"sg\" data-s=\"4\">Estas son las que vas a necesitar más a menudo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Flujos estándar<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La entrada y la salida pasan por tres variables dinámicas: <code>$*OUT<\/code> para la salida estándar, <code>$*ERR<\/code> para el error estándar y <code>$*IN<\/code> para la entrada estándar.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> y <code>print<\/code> escriben en <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Para enviar texto al error estándar, llama al método sobre <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como estas variables son dinámicas, puedes redirigir <code>$*OUT<\/code> en un bloque.<\/span> <span class=\"sg\" data-s=\"1\">Entonces todo lo que llamas dentro de ese bloque envía su salida al nuevo lugar.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas cambiar nada de ese código.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El programa y su proceso<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Unas pocas variables dan información sobre el propio programa en ejecución:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sus valores cambian cada vez que ejecutas el programa.<\/span> <span class=\"sg\" data-s=\"1\">Así que aquí no hay una salida fija para mostrar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Línea de comandos y entorno<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los argumentos y el entorno llegan en dos contenedores que están listos para usar:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista de argumentos de línea de comandos (una subrutina <code>MAIN<\/code> recibe los mismos)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — las variables de entorno, en un hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estas variables integradas te ahorran reunir tú mismo la misma información.<\/span> <span class=\"sg\" data-s=\"1\">Además son dinámicas, así que Raku las busca a través de la pila de llamadas.<\/span> <span class=\"sg\" data-s=\"2\">Por eso puedes anular cualquier variable integrada <code>$*<\/code> para un ámbito.<\/span> <span class=\"sg\" data-s=\"3\">Esto funciona exactamente como con una variable <code>$*<\/code> propia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de estas variables dinámicas, Raku también tiene las variables integradas <code>?<\/code> de tiempo de compilación: <code>$?FILE<\/code> y <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ya las viste en la página de <a href=\"https://course.raku.org/es/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigils<\/a>.<\/span><\/p>"]]},"it":{"t":"Variabili speciali integrate","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku definisce un insieme di variabili per te.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte di esse sono <em>dinamiche<\/em>, con il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi puoi leggerle ovunque, come hai visto con le <a href=\"https://course.raku.org/it/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabili dinamiche<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi anche sovrascriverle per uno scope.<\/span> <span class=\"sg\" data-s=\"4\">Ecco quelle che ti serviranno più spesso.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Stream standard<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'input e l'output passano per tre variabili dinamiche: <code>$*OUT<\/code> per lo standard output, <code>$*ERR<\/code> per lo standard error e <code>$*IN<\/code> per lo standard input.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> e <code>print<\/code> scrivono su <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per mandare invece del testo allo standard error, chiama il metodo su <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dato che queste variabili sono dinamiche, puoi reindirizzare <code>$*OUT<\/code> in un blocco.<\/span> <span class=\"sg\" data-s=\"1\">Allora tutto quello che chiami dentro quel blocco manda il suo output al nuovo posto.<\/span> <span class=\"sg\" data-s=\"2\">Non devi cambiare niente di quel codice.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il programma e il suo processo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcune variabili danno informazioni sul programma stesso in esecuzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I loro valori cambiano ogni volta che esegui il programma.<\/span> <span class=\"sg\" data-s=\"1\">Quindi qui non c'è un output fisso da mostrare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riga di comando e ambiente<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli argomenti e l'ambiente arrivano in due contenitori pronti all'uso:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la lista degli argomenti da riga di comando (una subroutine <code>MAIN<\/code> riceve gli stessi)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — le variabili d'ambiente, in un hash<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Queste variabili predefinite ti evitano di raccogliere da solo le stesse informazioni.<\/span> <span class=\"sg\" data-s=\"1\">Sono anche dinamiche, quindi Raku le cerca attraverso lo stack delle chiamate.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi sovrascrivere qualsiasi variabile predefinita <code>$*<\/code> per uno scope.<\/span> <span class=\"sg\" data-s=\"3\">Funziona esattamente come con una tua variabile <code>$*<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre a queste variabili dinamiche, Raku ha anche le variabili predefinite <code>?<\/code> di compilazione: <code>$?FILE<\/code> e <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Le hai già viste nella pagina sui <a href=\"https://course.raku.org/it/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigil<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētie speciālie mainīgie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku jums definē mainīgo kopu.<\/span> <span class=\"sg\" data-s=\"1\">Vairums no tiem ir <em>dinamiski<\/em>, ar tvigilu <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat tos lasīt jebkur, kā jūs redzējāt pie <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskajiem mainīgajiem<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs pat varat tos pārmākt kādam redzamības apgabalam.<\/span> <span class=\"sg\" data-s=\"4\">Lūk, tie, kas jums būs vajadzīgi visbiežāk.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Standarta plūsmas<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievade un izvade iet caur trim dinamiskiem mainīgajiem: <code>$*OUT<\/code> standarta izvadei, <code>$*ERR<\/code> standarta kļūdām un <code>$*IN<\/code> standarta ievadei.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> un <code>print<\/code> raksta uz <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lai tā vietā sūtītu tekstu uz standarta kļūdām, izsauciet metodi uz <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā kā šie mainīgie ir dinamiski, jūs varat novirzīt <code>$*OUT<\/code> blokā.<\/span> <span class=\"sg\" data-s=\"1\">Tad viss, ko jūs izsaucat šajā blokā, sūta savu izvadi uz jauno vietu.<\/span> <span class=\"sg\" data-s=\"2\">Jums nav jāmaina nekas no šī koda.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma un tās process<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži mainīgie sniedz informāciju par pašu darbojošos programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">To vērtības mainās katru reizi, kad jūs palaižat programmu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc šeit nav noteiktas izvades, ko parādīt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandrinda un vide<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenti un vide pienāk divos konteineros, kas ir gatavi lietošanai:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — komandrindas argumentu saraksts (apakšprogramma <code>MAIN<\/code> saņem tos pašus)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — vides mainīgie jauktenī<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šie iebūvētie mainīgie ļauj jums nevākt to pašu informāciju pašiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī ir dinamiski, tāpēc Raku tos meklē caur izsaukumu steku.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat pārmākt jebkuru <code>$*<\/code> iebūvēto mainīgo kādam redzamības apgabalam.<\/span> <span class=\"sg\" data-s=\"3\">Tas darbojas tieši tāpat kā ar jūsu pašu <code>$*<\/code> mainīgo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Līdzās šiem dinamiskajiem mainīgajiem Raku ir arī kompilēšanas laika <code>?<\/code> iebūvētie mainīgie: <code>$?FILE<\/code> un <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tos jau redzējāt <a href=\"https://course.raku.org/lv/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigilu<\/a> lappusē.<\/span><\/p>"]]},"ru":{"t":"Встроенные специальные переменные","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku определяет для вас набор переменных.<\/span> <span class=\"sg\" data-s=\"1\">Большинство из них <em>динамические<\/em>, с твигилом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому их можно читать где угодно, как вы видели на примере <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамических переменных<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Их можно даже перекрыть для области видимости.<\/span> <span class=\"sg\" data-s=\"4\">Вот те, которые вам понадобятся чаще всего.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартные потоки<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ввод и вывод идут через три динамические переменные: <code>$*OUT<\/code> для стандартного вывода, <code>$*ERR<\/code> для стандартного потока ошибок и <code>$*IN<\/code> для стандартного ввода.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> и <code>print<\/code> пишут в <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы отправить текст в стандартный поток ошибок, вызовите метод у <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Так как эти переменные динамические, можно перенаправить <code>$*OUT<\/code> в блоке.<\/span> <span class=\"sg\" data-s=\"1\">Тогда всё, что вы вызываете внутри этого блока, отправляет свой вывод в новое место.<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужно менять этот код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Программа и её процесс<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Несколько переменных дают информацию о самой запущенной программе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Их значения меняются при каждом запуске программы.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому здесь нет постоянного вывода, который можно показать.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командная строка и окружение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументы и окружение приходят в двух контейнерах, которые готовы к работе:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументов командной строки (подпрограмма <code>MAIN<\/code> получает те же самые)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — переменные окружения в хэше<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Благодаря этим встроенным переменным вам не нужно самим собирать ту же информацию.<\/span> <span class=\"sg\" data-s=\"1\">Кроме того, они динамические, поэтому Raku ищет их по стеку вызовов.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому любую встроенную переменную с <code>$*<\/code> можно перекрыть для области видимости.<\/span> <span class=\"sg\" data-s=\"3\">Это работает точно так же, как с вашей собственной переменной с <code>$*<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кроме этих динамических переменных, в Raku есть и встроенные переменные времени компиляции с твигилом <code>?<\/code>: <code>$?FILE<\/code> и <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже видели их на странице о <a href=\"https://course.raku.org/ru/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твигилах<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані спеціальні змінні","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku визначає для вас набір змінних.<\/span> <span class=\"sg\" data-s=\"1\">Більшість із них <em>динамічні<\/em>, з твіґілом <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож їх можна читати будь-де, як ви бачили з <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічними змінними<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Їх можна навіть перекрити в межах області видимості.<\/span> <span class=\"sg\" data-s=\"4\">Ось ті, які вам знадобляться найчастіше.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартні потоки<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Введення й виведення йдуть через три динамічні змінні: <code>$*OUT<\/code> для стандартного виводу, <code>$*ERR<\/code> для стандартного потоку помилок і <code>$*IN<\/code> для стандартного введення.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> і <code>print<\/code> пишуть у <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб натомість надіслати текст у стандартний потік помилок, викличте метод на <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # іде в стандартний вивід\n$*ERR.say('a diagnostic');  # іде в стандартний потік помилок<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оскільки ці змінні динамічні, ви можете перенаправити <code>$*OUT<\/code> у блоці.<\/span> <span class=\"sg\" data-s=\"1\">Тоді все, що ви викликаєте в цьому блоці, надсилає свій вивід у нове місце.<\/span> <span class=\"sg\" data-s=\"2\">Вам не треба змінювати нічого в тому коді.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програма та її процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кілька змінних дають відомості про саму запущену програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # шлях до скрипта, який виконується\nsay $*PID;          # ідентифікатор процесу цієї програми\nsay $*CWD;          # поточний робочий каталог<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Їхні значення змінюються щоразу, коли ви запускаєте програму.<\/span> <span class=\"sg\" data-s=\"1\">Тож тут немає сталого виводу, який можна показати.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Командний рядок і середовище<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументи та середовище надходять у двох контейнерах, готових до використання:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — список аргументів командного рядка (підпрограма <code>MAIN<\/code> отримує ті самі)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — змінні середовища, у хеші<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # скільки аргументів було передано\nsay %*ENV&lt;HOME&gt;;  # значення змінної середовища HOME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Завдяки цим вбудованим змінним вам не треба самим збирати ті самі відомості.<\/span> <span class=\"sg\" data-s=\"1\">Вони також динамічні, тож Raku шукає їх через стек викликів.<\/span> <span class=\"sg\" data-s=\"2\">Тому будь-яку вбудовану змінну з <code>$*<\/code> можна перекрити для області видимості.<\/span> <span class=\"sg\" data-s=\"3\">Це працює точно так само, як із вашою власною змінною з <code>$*<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Крім цих динамічних змінних, Raku має також компіляційні вбудовані змінні з <code>?<\/code>: <code>$?FILE<\/code> та <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже бачили їх на сторінці про <a href=\"https://course.raku.org/uk/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">твіґіли<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени специални променливи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku дефинира набор от променливи за вас.<\/span> <span class=\"sg\" data-s=\"1\">Повечето от тях са <em>динамични<\/em>, с туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да ги четете навсякъде, както видяхте при <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Можете дори да ги замените за даден обхват.<\/span> <span class=\"sg\" data-s=\"4\">Ето тези, които ще ви трябват най-често.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стандартни потоци<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Входът и изходът минават през три динамични променливи: <code>$*OUT<\/code> за стандартния изход, <code>$*ERR<\/code> за стандартната грешка и <code>$*IN<\/code> за стандартния вход.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> и <code>print<\/code> пишат в <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За да изпратите текст към стандартната грешка вместо това, извикайте метода върху <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понеже тези променливи са динамични, можете да пренасочите <code>$*OUT<\/code> в блок.<\/span> <span class=\"sg\" data-s=\"1\">Тогава всичко, което извиквате в този блок, изпраща изхода си на новото място.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да променяте нищо от този код.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Програмата и нейният процес<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Няколко променливи дават информация за самата работеща програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Стойностите им се променят всеки път, когато изпълнявате програмата.<\/span> <span class=\"sg\" data-s=\"1\">Затова тук няма фиксиран изход за показване.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Команден ред и среда<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Аргументите и средата идват в два контейнера, които са готови за използване:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — списъкът с аргументи от командния ред (подпрограмата <code>MAIN<\/code> получава същите)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — променливите на средата, в хеш<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тези вградени променливи ви спестяват да събирате сами същата информация.<\/span> <span class=\"sg\" data-s=\"1\">Те са и динамични, затова Raku ги търси през стека на извикванията.<\/span> <span class=\"sg\" data-s=\"2\">Така можете да замените всяка вградена <code>$*<\/code> променлива за даден обхват.<\/span> <span class=\"sg\" data-s=\"3\">Това работи точно както с ваша собствена <code>$*<\/code> променлива.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен тези динамични променливи, Raku има и вградени <code>?<\/code> променливи, които се задават по време на компилация: <code>$?FILE<\/code> и <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вече ги видяхте на страницата за <a href=\"https://course.raku.org/bg/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">туигилите<\/a>.<\/span><\/p>"]]},"eo":{"t":"Enkonstruitaj specialaj variabloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku difinas aron de variabloj por vi.<\/span> <span class=\"sg\" data-s=\"1\">La plej multaj el ili estas <em>dinamikaj<\/em>, kun la tvigilo <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas legi ilin ĉie, kiel vi vidis ĉe <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikaj variabloj<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Vi eĉ povas anstataŭigi ilin por certa amplekso.<\/span> <span class=\"sg\" data-s=\"4\">Jen tiuj, kiujn vi plej ofte bezonos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Normaj fluoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Enigo kaj eligo iras tra tri dinamikaj variabloj: <code>$*OUT<\/code> por la norma eligo, <code>$*ERR<\/code> por la norma eraro, kaj <code>$*IN<\/code> por la norma enigo.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> kaj <code>print<\/code> skribas al <code>$*OUT<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por sendi tekston anstataŭe al la norma eraro, voku la metodon sur <code>$*ERR<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # goes to standard output\n$*ERR.say('a diagnostic');  # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉar ĉi tiuj variabloj estas dinamikaj, vi povas redirekti <code>$*OUT<\/code> en bloko.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĉio, kion vi vokas ene de tiu bloko, sendas sian eligon al la nova loko.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas ŝanĝi ion ajn en tiu kodo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La programo kaj ĝia procezo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj variabloj donas informojn pri la ruliĝanta programo mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # the path of the script being run\nsay $*PID;          # the process id of this program\nsay $*CWD;          # the current working directory<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Iliaj valoroj ŝanĝiĝas ĉiufoje, kiam vi rulas la programon.<\/span> <span class=\"sg\" data-s=\"1\">Do ĉi tie ne estas fiksa eligo por montri.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komandlinio kaj medio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La argumentoj kaj la medio venas en du ujoj, kiuj estas pretaj por uzo:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — la listo de komandliniaj argumentoj (subrutino <code>MAIN<\/code> ricevas la samajn)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — la mediaj variabloj, en hako<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # how many arguments were passed\nsay %*ENV&lt;HOME&gt;;  # the value of the HOME environment variable<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj enkonstruitaj variabloj ŝparas al vi la laboron mem kolekti la samajn informojn.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ estas dinamikaj, do Raku serĉas ilin tra la voka stako.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas anstataŭigi ĉiun enkonstruitan <code>$*<\/code>-variablon por amplekso.<\/span> <span class=\"sg\" data-s=\"3\">Tio funkcias ĝuste kiel kun via propra <code>$*<\/code>-variablo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom ĉi tiuj dinamikaj variabloj, Raku ankaŭ havas la kompiltempajn enkonstruitajn <code>?<\/code>-variablojn: <code>$?FILE<\/code> kaj <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam vidis ilin sur la paĝo pri <a href=\"https://course.raku.org/eo/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">tvigiloj<\/a>.<\/span><\/p>"]]},"la":{"t":"Incorporatae speciales variabiles","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku seriem variabilium pro te definit.<\/span> <span class=\"sg\" data-s=\"1\">Pleraeque earum <em>dynamicae<\/em> sunt, cum twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque eas ubique legere potes, ut apud <a href=\"https://course.raku.org/la/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabiles dynamicas<\/a> vidisti.<\/span> <span class=\"sg\" data-s=\"3\">Etiam eas pro circumscriptione superare potes.<\/span> <span class=\"sg\" data-s=\"4\">Ecce eae quas saepissime adhibebis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Fluenta vulgaria<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Introitus et exitus per tres variabiles dynamicas eunt: <code>$*OUT<\/code> pro exitu vulgari, <code>$*ERR<\/code> pro errore vulgari, et <code>$*IN<\/code> pro introitu vulgari.<\/span> <span class=\"sg\" data-s=\"1\"><code>say<\/code> et <code>print<\/code> in <code>$*OUT<\/code> scribunt.<\/span> <span class=\"sg\" data-s=\"2\">Ut textum potius ad errorem vulgarem mittas, methodum in <code>$*ERR<\/code> voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('normal output'); # ad exitum vulgarem it\n$*ERR.say('a diagnostic');  # ad errorem vulgarem it<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quia hae variabiles dynamicae sunt, <code>$*OUT<\/code> in clausula redirigere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum omnia quae intra illam clausulam vocas exitum suum ad novum locum mittunt.<\/span> <span class=\"sg\" data-s=\"2\">Nihil illius codicis mutare necesse est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Programma et processus eius<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Paucae variabiles de ipso programmate currenti informationem dant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $*PROGRAM-NAME; # semita scripti quod curritur\nsay $*PID;          # identificator processus huius programmatis\nsay $*CWD;          # directoria laboris currens<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valores earum mutantur quotiens programma incipis.<\/span> <span class=\"sg\" data-s=\"1\">Itaque hic nullum exitum fixum ostendere possumus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Linea imperandi et ambitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Argumenta et ambitus in duobus receptaculis adveniunt quae parata sunt ad usum:<\/span><\/p>"],["list",2,"<ul><li><span class=\"sg\" data-s=\"0\"><code>@*ARGS<\/code> — series argumentorum lineae imperandi (subprogramma <code>MAIN<\/code> eadem accipit)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>%*ENV<\/code> — variabiles ambitus, in mappa<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say @*ARGS.elems; # quot argumenta tradita sint\nsay %*ENV&lt;HOME&gt;;  # valor variabilis ambitus HOME<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Propter has variabiles inbuiltas eandem informationem ipse colligere non debes.<\/span> <span class=\"sg\" data-s=\"1\">Etiam dynamicae sunt, itaque Raku eas per acervum vocationum quaerit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque quodlibet inbuiltum <code>$*<\/code> pro circumscriptione superare potes.<\/span> <span class=\"sg\" data-s=\"3\">Hoc prorsus ut cum variabili <code>$*<\/code> tua propria operatur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter has variabiles dynamicas, Raku etiam inbuilta <code>?<\/code> temporis compilationis habet: <code>$?FILE<\/code> et <code>$?LINE<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ea iam vidisti in pagina de <a href=\"https://course.raku.org/la/advanced/special-variables/twigils/\" target=\"_blank\" rel=\"noopener\">twigiliis<\/a>.<\/span><\/p>"]]}}}</script>
