<script type="application/json" id="page-data">{"u":"advanced/special-variables","n":405,"k":"section","pv":"advanced/subscript-adverbs/exercises/key-and-value/solution","nx":"advanced/special-variables/twigils","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Special and dynamic variables","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A variable name in Raku can have a second mark after the sigil.<\/span> <span class=\"sg\" data-s=\"1\">This mark is called a <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The twigil tells you where the variable lives and how Raku finds it.<\/span> <span class=\"sg\" data-s=\"3\">For example, it shows if the variable has a dynamic scope.<\/span> <span class=\"sg\" data-s=\"4\">Or it shows that the variable comes from the compiler or belongs to an object.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This section explains twigils.<\/span> <span class=\"sg\" data-s=\"1\">Then it looks closely at the most useful kind, <em>dynamic<\/em> variables.<\/span> <span class=\"sg\" data-s=\"2\">Raku looks them up through the call stack, not by the usual lexical scope.<\/span> <span class=\"sg\" data-s=\"3\">Finally, it gives an overview of the special variables that Raku defines for you.<\/span><\/p>"]]},"de":{"t":"Spezielle und dynamische Variablen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Variablenname in Raku kann nach dem Sigil ein zweites Zeichen haben.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Zeichen heißt <em>Twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Das Twigil sagt dir, wo die Variable lebt und wie Raku sie findet.<\/span> <span class=\"sg\" data-s=\"3\">Zum Beispiel zeigt es, ob die Variable einen dynamischen Geltungsbereich hat.<\/span> <span class=\"sg\" data-s=\"4\">Oder es zeigt, dass die Variable vom Compiler kommt oder zu einem Objekt gehört.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt erklärt Twigils.<\/span> <span class=\"sg\" data-s=\"1\">Dann schaut er sich die nützlichste Art genauer an, die <em>dynamischen<\/em> Variablen.<\/span> <span class=\"sg\" data-s=\"2\">Raku sucht sie über den Aufrufstapel, nicht über den üblichen lexikalischen Geltungsbereich.<\/span> <span class=\"sg\" data-s=\"3\">Zum Schluss gibt der Abschnitt einen Überblick über die speziellen Variablen, die Raku für dich definiert.<\/span><\/p>"]]},"nl":{"t":"Speciale en dynamische variabelen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een variabelenaam in Raku kan na de sigil een tweede teken hebben.<\/span> <span class=\"sg\" data-s=\"1\">Dit teken heet een <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De twigil vertelt je waar de variabele leeft en hoe Raku hem vindt.<\/span> <span class=\"sg\" data-s=\"3\">Hij laat bijvoorbeeld zien of de variabele een dynamische scope heeft.<\/span> <span class=\"sg\" data-s=\"4\">Of hij laat zien dat de variabele van de compiler komt of bij een object hoort.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel legt twigils uit.<\/span> <span class=\"sg\" data-s=\"1\">Daarna kijkt het goed naar het nuttigste soort, <em>dynamische<\/em> variabelen.<\/span> <span class=\"sg\" data-s=\"2\">Raku zoekt ze op via de call stack, niet via de gewone lexicale scope.<\/span> <span class=\"sg\" data-s=\"3\">Tot slot geeft het een overzicht van de speciale variabelen die Raku voor je definieert.<\/span><\/p>"]]},"es":{"t":"Variables especiales y dinámicas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un nombre de variable en Raku puede tener una segunda marca después del sigilo.<\/span> <span class=\"sg\" data-s=\"1\">Esta marca se llama <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">El twigil te dice dónde vive la variable y cómo la encuentra Raku.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, muestra si la variable tiene un ámbito dinámico.<\/span> <span class=\"sg\" data-s=\"4\">O muestra que la variable viene del compilador o pertenece a un objeto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta sección explica los twigils.<\/span> <span class=\"sg\" data-s=\"1\">Luego mira de cerca el tipo más útil, las variables <em>dinámicas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku las busca a través de la pila de llamadas, no por el ámbito léxico habitual.<\/span> <span class=\"sg\" data-s=\"3\">Por último, da una vista general de las variables especiales que Raku define para ti.<\/span><\/p>"]]},"it":{"t":"Variabili speciali e dinamiche","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il nome di una variabile in Raku può avere un secondo segno dopo il sigillo.<\/span> <span class=\"sg\" data-s=\"1\">Questo segno si chiama <em>twigil<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Il twigil ti dice dove vive la variabile e come Raku la trova.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, mostra se la variabile ha uno scope dinamico.<\/span> <span class=\"sg\" data-s=\"4\">Oppure mostra che la variabile viene dal compilatore o appartiene a un oggetto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa sezione spiega i twigil.<\/span> <span class=\"sg\" data-s=\"1\">Poi esamina da vicino il tipo più utile, le variabili <em>dinamiche<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku le cerca attraverso lo stack delle chiamate, non con il normale scope lessicale.<\/span> <span class=\"sg\" data-s=\"3\">Infine, dà una panoramica delle variabili speciali che Raku definisce per te.<\/span><\/p>"]]},"lv":{"t":"Speciālie un dinamiskie mainīgie 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Mainīgā nosaukumā Raku valodā aiz sigila var būt otra zīme.<\/span> <span class=\"sg\" data-s=\"1\">Šo zīmi sauc par <em>tvigilu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tvigils pasaka, kur mainīgais dzīvo un kā Raku to atrod.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, tas parāda, vai mainīgajam ir dinamisks redzamības apgabals.<\/span> <span class=\"sg\" data-s=\"4\">Vai arī tas parāda, ka mainīgo dod kompilators vai ka tas pieder objektam.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa izskaidro tvigilus.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tā tuvāk aplūko noderīgāko veidu, <em>dinamiskos<\/em> mainīgos.<\/span> <span class=\"sg\" data-s=\"2\">Raku tos meklē caur izsaukumu steku, nevis pēc parastā leksiskā redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"3\">Visbeidzot tā sniedz pārskatu par speciālajiem mainīgajiem, ko Raku jums definē.<\/span><\/p>"]]},"ru":{"t":"Специальные и динамические переменные","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Имя переменной в Raku может содержать второй знак после сигила.<\/span> <span class=\"sg\" data-s=\"1\">Этот знак называется <em>твигилом<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Твигил говорит, где живёт переменная и как Raku её находит.<\/span> <span class=\"sg\" data-s=\"3\">Например, он показывает, есть ли у переменной динамическая область видимости.<\/span> <span class=\"sg\" data-s=\"4\">Или он показывает, что переменная приходит от компилятора или принадлежит объекту.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этом разделе объясняются твигилы.<\/span> <span class=\"sg\" data-s=\"1\">Затем мы подробно рассмотрим самый полезный их вид, <em>динамические<\/em> переменные.<\/span> <span class=\"sg\" data-s=\"2\">Raku ищет их по стеку вызовов, а не по обычной лексической области видимости.<\/span> <span class=\"sg\" data-s=\"3\">В конце раздел даёт обзор специальных переменных, которые Raku определяет для вас.<\/span><\/p>"]]},"uk":{"t":"Спеціальні та динамічні змінні","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ім'я змінної в Raku може мати другий знак після сигіла.<\/span> <span class=\"sg\" data-s=\"1\">Цей знак називають <em>твіґілом<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Твіґіл каже, де живе змінна і як Raku її знаходить.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, він показує, чи має змінна динамічну область видимості.<\/span> <span class=\"sg\" data-s=\"4\">Або він показує, що змінна походить від компілятора чи належить об'єкту.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Цей розділ пояснює твіґіли.<\/span> <span class=\"sg\" data-s=\"1\">Потім він уважно розглядає найкорисніший їхній вид, <em>динамічні<\/em> змінні.<\/span> <span class=\"sg\" data-s=\"2\">Raku шукає їх через стек викликів, а не за звичайною лексичною областю видимості.<\/span> <span class=\"sg\" data-s=\"3\">Наостанок розділ дає огляд спеціальних змінних, які Raku визначає для вас.<\/span><\/p>"]]},"bg":{"t":"Специални и динамични променливи 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Името на променлива в Raku може да има втори маркер след сигила.<\/span> <span class=\"sg\" data-s=\"1\">Този маркер се нарича <em>туигил<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Туигилът ви казва къде живее променливата и как Raku я намира.<\/span> <span class=\"sg\" data-s=\"3\">Например, той показва дали променливата има динамичен обхват.<\/span> <span class=\"sg\" data-s=\"4\">Или показва, че променливата идва от компилатора или принадлежи на обект.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Този раздел обяснява туигилите.<\/span> <span class=\"sg\" data-s=\"1\">След това разглежда отблизо най-полезния вид, <em>динамичните<\/em> променливи.<\/span> <span class=\"sg\" data-s=\"2\">Raku ги търси през стека на извикванията, а не чрез обичайния лексикален обхват.<\/span> <span class=\"sg\" data-s=\"3\">Накрая разделът дава преглед на специалните променливи, които Raku дефинира за вас.<\/span><\/p>"]]},"eo":{"t":"Specialaj kaj dinamikaj variabloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nomo de variablo en Raku povas havi duan markon post la sigelo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu marko nomiĝas <em>tvigilo<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La tvigilo diras al vi, kie la variablo loĝas kaj kiel Raku trovas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, ĝi montras, ĉu la variablo havas dinamikan amplekson.<\/span> <span class=\"sg\" data-s=\"4\">Aŭ ĝi montras, ke la variablo venas de la kompililo aŭ apartenas al objekto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio klarigas tvigilojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi detale rigardas la plej utilan specon, <em>dinamikajn<\/em> variablojn.<\/span> <span class=\"sg\" data-s=\"2\">Raku serĉas ilin tra la voka stako, ne per la kutima leksika amplekso.<\/span> <span class=\"sg\" data-s=\"3\">Fine, ĝi donas superrigardon de la specialaj variabloj, kiujn Raku difinas por vi.<\/span><\/p>"]]},"la":{"t":"Speciales et dynamicae variabiles","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nomen variabilis in Raku alterum signum post sigillum habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc signum <em>twigil<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"2\">Twigil tibi dicit ubi variabilis habitet et quomodo Raku eam inveniat.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, ostendit an variabilis circumscriptionem dynamicam habeat.<\/span> <span class=\"sg\" data-s=\"4\">Vel ostendit variabilem a compilatore venire vel ad obiectum pertinere.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec sectio twigilia explicat.<\/span> <span class=\"sg\" data-s=\"1\">Deinde genus utilissimum propius inspicit, variabiles <em>dynamicas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Raku eas per acervum vocationum quaerit, non per circumscriptionem lexicam vulgarem.<\/span> <span class=\"sg\" data-s=\"3\">Postremo conspectum variabilium specialium dat quas Raku pro te definit.<\/span><\/p>"]]}}}</script>
