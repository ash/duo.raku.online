<script type="application/json" id="page-data">{"u":"advanced/special-variables/dynamic-variables","n":408,"k":"topic","pv":"advanced/special-variables/twigils/quiz","nx":"advanced/special-variables/dynamic-variables/quiz","tr":["advanced","advanced/special-variables"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Dynamic variables","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A <em>dynamic<\/em> variable has the <code>*<\/code> twigil.<\/span> <span class=\"sg\" data-s=\"1\">A lexical variable is visible only in the block where you declare it.<\/span> <span class=\"sg\" data-s=\"2\">A dynamic variable is different: Raku finds it by looking <strong>outward through the call stack<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">It searches the code that called the current code.<\/span> <span class=\"sg\" data-s=\"4\">It does not matter where that code is defined.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The subroutine <code>greet<\/code> does not declare <code>$*greeting<\/code> or get it as an argument.<\/span> <span class=\"sg\" data-s=\"1\">But it can still see it.<\/span> <span class=\"sg\" data-s=\"2\">This is because the variable is dynamic.<\/span> <span class=\"sg\" data-s=\"3\">Also, <code>greet<\/code> was called from a place where the variable is in scope.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This example would also work with a simple global scalar variable <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But the next example shows what makes dynamic variables special.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The lookup follows the call stack.<\/span> <span class=\"sg\" data-s=\"1\">So a closer declaration <strong>overrides<\/strong> a farther one while its block runs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">The same <code>show<\/code> prints <code>outer<\/code> the first time.<\/span> <span class=\"sg\" data-s=\"1\">It prints <code>inner<\/code> when it is called from inside the block that declared <code>$*level<\/code> again.<\/span> <span class=\"sg\" data-s=\"2\">This is <em>dynamic scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Raku’s built-in <code>$*OUT<\/code>, <code>$*IN<\/code>, and <code>$*ERR<\/code> work in the same way.<\/span> <span class=\"sg\" data-s=\"4\">You can redirect output for a while if you declare <code>$*OUT<\/code> again in a block.<\/span> <span class=\"sg\" data-s=\"5\">Then every routine that you call inside the block sees the new value.<\/span> <span class=\"sg\" data-s=\"6\">Dynamic variables are great for passing context to called code without an explicit argument.<\/span><\/p>"]]},"de":{"t":"Dynamische Variablen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine <em>dynamische<\/em> Variable hat das Twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eine lexikalische Variable ist nur in dem Block sichtbar, in dem du sie deklarierst.<\/span> <span class=\"sg\" data-s=\"2\">Eine dynamische Variable ist anders: Raku findet sie, indem es <strong>nach außen durch den Aufrufstapel<\/strong> schaut.<\/span> <span class=\"sg\" data-s=\"3\">Raku durchsucht den Code, der den aktuellen Code aufgerufen hat.<\/span> <span class=\"sg\" data-s=\"4\">Es ist egal, wo dieser Code definiert ist.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>greet<\/code> deklariert <code>$*greeting<\/code> nicht und bekommt die Variable auch nicht als Argument.<\/span> <span class=\"sg\" data-s=\"1\">Aber sie kann sie trotzdem sehen.<\/span> <span class=\"sg\" data-s=\"2\">Das liegt daran, dass die Variable dynamisch ist.<\/span> <span class=\"sg\" data-s=\"3\">Außerdem wurde <code>greet<\/code> von einer Stelle aufgerufen, an der die Variable im Geltungsbereich liegt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieses Beispiel würde auch mit einer einfachen globalen Skalarvariable <code>$greeting<\/code> funktionieren.<\/span> <span class=\"sg\" data-s=\"1\">Aber das nächste Beispiel zeigt, was dynamische Variablen besonders macht.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Suche folgt dem Aufrufstapel.<\/span> <span class=\"sg\" data-s=\"1\">Also <strong>überschreibt<\/strong> eine nähere Deklaration eine weiter entfernte, solange ihr Block läuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Dieselbe <code>show<\/code>-Funktion gibt beim ersten Mal <code>outer<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt <code>inner<\/code> aus, wenn sie aus dem Block heraus aufgerufen wird, der <code>$*level<\/code> noch einmal deklariert hat.<\/span> <span class=\"sg\" data-s=\"2\">Das ist <em>dynamisches Scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Rakus eingebaute Variablen <code>$*OUT<\/code>, <code>$*IN<\/code> und <code>$*ERR<\/code> funktionieren auf dieselbe Weise.<\/span> <span class=\"sg\" data-s=\"4\">Du kannst die Ausgabe für eine Weile umleiten, wenn du <code>$*OUT<\/code> in einem Block noch einmal deklarierst.<\/span> <span class=\"sg\" data-s=\"5\">Dann sieht jede Routine, die du in diesem Block aufrufst, den neuen Wert.<\/span> <span class=\"sg\" data-s=\"6\">Dynamische Variablen eignen sich sehr gut, um Kontext ohne ausdrückliches Argument an aufgerufenen Code zu geben.<\/span><\/p>"]]},"nl":{"t":"Dynamische variabelen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <em>dynamische<\/em> variabele heeft de <code>*<\/code>-twigil.<\/span> <span class=\"sg\" data-s=\"1\">Een lexicale variabele is alleen zichtbaar in het blok waar je hem declareert.<\/span> <span class=\"sg\" data-s=\"2\">Een dynamische variabele is anders: Raku vindt hem door <strong>naar buiten te zoeken via de call stack<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Het doorzoekt de code die de huidige code heeft aangeroepen.<\/span> <span class=\"sg\" data-s=\"4\">Het maakt niet uit waar die code gedefinieerd is.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>greet<\/code> declareert <code>$*greeting<\/code> niet en krijgt hem ook niet als argument.<\/span> <span class=\"sg\" data-s=\"1\">Maar hij kan hem toch zien.<\/span> <span class=\"sg\" data-s=\"2\">Dat komt doordat de variabele dynamisch is.<\/span> <span class=\"sg\" data-s=\"3\">Ook werd <code>greet<\/code> aangeroepen vanaf een plek waar de variabele in scope is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit voorbeeld zou ook werken met een eenvoudige globale scalar variabele <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar het volgende voorbeeld laat zien wat dynamische variabelen speciaal maakt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het opzoeken volgt de call stack.<\/span> <span class=\"sg\" data-s=\"1\">Dus <strong>overschrijft<\/strong> een declaratie dichterbij een declaratie verder weg, zolang haar blok loopt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Dezelfde <code>show<\/code> print de eerste keer <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij print <code>inner<\/code> als hij wordt aangeroepen vanuit het blok dat <code>$*level<\/code> opnieuw declareerde.<\/span> <span class=\"sg\" data-s=\"2\">Dit is <em>dynamische scoping<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">De ingebouwde <code>$*OUT<\/code>, <code>$*IN<\/code> en <code>$*ERR<\/code> van Raku werken op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt uitvoer een tijdje omleiden als je <code>$*OUT<\/code> opnieuw declareert in een blok.<\/span> <span class=\"sg\" data-s=\"5\">Dan ziet elke routine die je in het blok aanroept de nieuwe waarde.<\/span> <span class=\"sg\" data-s=\"6\">Dynamische variabelen zijn ideaal om context door te geven aan aangeroepen code, zonder een expliciet argument.<\/span><\/p>"]]},"es":{"t":"Variables dinámicas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una variable <em>dinámica<\/em> tiene el twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una variable léxica solo es visible en el bloque donde la declaras.<\/span> <span class=\"sg\" data-s=\"2\">Una variable dinámica es diferente: Raku la encuentra buscando <strong>hacia afuera a través de la pila de llamadas<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Busca en el código que llamó al código actual.<\/span> <span class=\"sg\" data-s=\"4\">No importa dónde está definido ese código.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>greet<\/code> no declara <code>$*greeting<\/code> ni la recibe como argumento.<\/span> <span class=\"sg\" data-s=\"1\">Pero aun así puede verla.<\/span> <span class=\"sg\" data-s=\"2\">Esto es porque la variable es dinámica.<\/span> <span class=\"sg\" data-s=\"3\">Además, <code>greet<\/code> fue llamada desde un lugar donde la variable está en su ámbito.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este ejemplo también funcionaría con una simple variable escalar global <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero el siguiente ejemplo muestra qué hace especiales a las variables dinámicas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La búsqueda sigue la pila de llamadas.<\/span> <span class=\"sg\" data-s=\"1\">Así que una declaración más cercana <strong>anula<\/strong> a una más lejana mientras se ejecuta su bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La misma <code>show<\/code> imprime <code>outer<\/code> la primera vez.<\/span> <span class=\"sg\" data-s=\"1\">Imprime <code>inner<\/code> cuando se llama desde dentro del bloque que declaró <code>$*level<\/code> otra vez.<\/span> <span class=\"sg\" data-s=\"2\">Esto es el <em>ámbito dinámico<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Las variables integradas de Raku <code>$*OUT<\/code>, <code>$*IN<\/code> y <code>$*ERR<\/code> funcionan de la misma manera.<\/span> <span class=\"sg\" data-s=\"4\">Puedes redirigir la salida por un tiempo si declaras <code>$*OUT<\/code> otra vez en un bloque.<\/span> <span class=\"sg\" data-s=\"5\">Entonces cada rutina que llamas dentro del bloque ve el nuevo valor.<\/span> <span class=\"sg\" data-s=\"6\">Las variables dinámicas son muy buenas para pasar contexto al código llamado sin un argumento explícito.<\/span><\/p>"]]},"it":{"t":"Variabili dinamiche","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Una variabile <em>dinamica<\/em> ha il twigil <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile lessicale è visibile solo nel blocco dove la dichiari.<\/span> <span class=\"sg\" data-s=\"2\">Una variabile dinamica è diversa: Raku la trova cercando <strong>verso l'esterno nello stack delle chiamate<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Cerca nel codice che ha chiamato il codice attuale.<\/span> <span class=\"sg\" data-s=\"4\">Non importa dove quel codice è definito.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>greet<\/code> non dichiara <code>$*greeting<\/code> e non la riceve come argomento.<\/span> <span class=\"sg\" data-s=\"1\">Ma può comunque vederla.<\/span> <span class=\"sg\" data-s=\"2\">Questo perché la variabile è dinamica.<\/span> <span class=\"sg\" data-s=\"3\">Inoltre, <code>greet<\/code> è stata chiamata da un punto dove la variabile è nello scope.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo esempio funzionerebbe anche con una semplice variabile scalare globale <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma il prossimo esempio mostra cosa rende speciali le variabili dinamiche.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ricerca segue lo stack delle chiamate.<\/span> <span class=\"sg\" data-s=\"1\">Quindi una dichiarazione più vicina <strong>sovrascrive<\/strong> una più lontana mentre il suo blocco è in esecuzione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La stessa <code>show<\/code> stampa <code>outer<\/code> la prima volta.<\/span> <span class=\"sg\" data-s=\"1\">Stampa <code>inner<\/code> quando viene chiamata dall'interno del blocco che ha dichiarato di nuovo <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo è lo <em>scope dinamico<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Le variabili predefinite di Raku <code>$*OUT<\/code>, <code>$*IN<\/code> e <code>$*ERR<\/code> funzionano allo stesso modo.<\/span> <span class=\"sg\" data-s=\"4\">Puoi reindirizzare l'output per un po' se dichiari di nuovo <code>$*OUT<\/code> in un blocco.<\/span> <span class=\"sg\" data-s=\"5\">Allora ogni routine che chiami dentro il blocco vede il nuovo valore.<\/span> <span class=\"sg\" data-s=\"6\">Le variabili dinamiche sono ottime per passare il contesto al codice chiamato senza un argomento esplicito.<\/span><\/p>"]]},"lv":{"t":"Dinamiskie mainīgie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamiskam<\/em> mainīgajam ir tvigils <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Leksisks mainīgais ir redzams tikai tajā blokā, kur jūs to deklarējat.<\/span> <span class=\"sg\" data-s=\"2\">Dinamisks mainīgais ir citāds: Raku to atrod, skatoties <strong>uz āru pa izsaukumu steku<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Tas meklē kodā, kas izsauca pašreizējo kodu.<\/span> <span class=\"sg\" data-s=\"4\">Nav svarīgi, kur šis kods ir definēts.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma <code>greet<\/code> nedeklarē <code>$*greeting<\/code> un nesaņem to kā argumentu.<\/span> <span class=\"sg\" data-s=\"1\">Bet tā tomēr to redz.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tāpēc, ka mainīgais ir dinamisks.<\/span> <span class=\"sg\" data-s=\"3\">Turklāt <code>greet<\/code> tika izsaukta no vietas, kur mainīgais ir redzams.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šis piemērs strādātu arī ar vienkāršu globālu skalāro mainīgo <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet nākamais piemērs parāda, kas padara dinamiskos mainīgos īpašus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Meklēšana seko izsaukumu stekam.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tuvāka deklarācija <strong>pārmāc<\/strong> tālāku, kamēr darbojas tās bloks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tā pati <code>show<\/code> pirmajā reizē izdrukā <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā izdrukā <code>inner<\/code>, kad to izsauc no bloka, kas vēlreiz deklarēja <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir <em>dinamiskais redzamības apgabals<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Raku iebūvētie <code>$*OUT<\/code>, <code>$*IN<\/code> un <code>$*ERR<\/code> darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat uz laiku novirzīt izvadi, ja vēlreiz deklarējat <code>$*OUT<\/code> blokā.<\/span> <span class=\"sg\" data-s=\"5\">Tad katra rutīna, ko jūs izsaucat bloka iekšienē, redz jauno vērtību.<\/span> <span class=\"sg\" data-s=\"6\">Dinamiskie mainīgie ir lieliski, lai nodotu kontekstu izsauktajam kodam bez skaidra argumenta.<\/span><\/p>"]]},"ru":{"t":"Динамические переменные","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">У <em>динамической<\/em> переменной есть твигил <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Лексическая переменная видна только в блоке, где вы её объявили.<\/span> <span class=\"sg\" data-s=\"2\">Динамическая переменная работает иначе: Raku находит её, когда ищет <strong>вверх по стеку вызовов<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Он ищет в коде, который вызвал текущий код.<\/span> <span class=\"sg\" data-s=\"4\">Неважно, где этот код определён.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма <code>greet<\/code> не объявляет <code>$*greeting<\/code> и не получает её как аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Но она всё равно её видит.<\/span> <span class=\"sg\" data-s=\"2\">Это потому, что переменная динамическая.<\/span> <span class=\"sg\" data-s=\"3\">Кроме того, <code>greet<\/code> вызвали из места, где эта переменная находится в области видимости.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот пример работал бы и с простой глобальной скалярной переменной <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но следующий пример показывает, что делает динамические переменные особенными.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поиск идёт по стеку вызовов.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому более близкое объявление <strong>перекрывает<\/strong> более далёкое, пока работает его блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Одна и та же <code>show<\/code> в первый раз печатает <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она печатает <code>inner<\/code>, когда её вызывают изнутри блока, который снова объявил <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это <em>динамическая область видимости<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Встроенные переменные Raku <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> работают так же.<\/span> <span class=\"sg\" data-s=\"4\">Можно на время перенаправить вывод, если снова объявить <code>$*OUT<\/code> в блоке.<\/span> <span class=\"sg\" data-s=\"5\">Тогда каждая подпрограмма, которую вы вызываете внутри блока, видит новое значение.<\/span> <span class=\"sg\" data-s=\"6\">Динамические переменные отлично подходят, чтобы передавать контекст в вызываемый код без явного аргумента.<\/span><\/p>"]]},"uk":{"t":"Динамічні змінні","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Динамічна<\/em> змінна має твіґіл <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Лексична змінна видима лише в тому блоці, де ви її оголошуєте.<\/span> <span class=\"sg\" data-s=\"2\">Динамічна змінна інша: Raku знаходить її, дивлячись <strong>назовні по стеку викликів<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Він шукає в коді, який викликав поточний код.<\/span> <span class=\"sg\" data-s=\"4\">Неважливо, де цей код визначено.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>greet<\/code> не оголошує <code>$*greeting<\/code> і не отримує її як аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Але вона все одно її бачить.<\/span> <span class=\"sg\" data-s=\"2\">Це тому, що змінна динамічна.<\/span> <span class=\"sg\" data-s=\"3\">Крім того, <code>greet<\/code> викликано з місця, де ця змінна в області видимості.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей приклад працював би і з простою глобальною скалярною змінною <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але наступний приклад показує, чим особливі динамічні змінні.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пошук іде за стеком викликів.<\/span> <span class=\"sg\" data-s=\"1\">Тож ближче оголошення <strong>перекриває<\/strong> дальше, поки виконується його блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Той самий <code>show<\/code> першого разу виводить <code>outer<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він виводить <code>inner<\/code>, коли його викликають зсередини блоку, який знову оголосив <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це <em>динамічна область видимості<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вбудовані <code>$*OUT<\/code>, <code>$*IN<\/code> та <code>$*ERR<\/code> у Raku працюють так само.<\/span> <span class=\"sg\" data-s=\"4\">Ви можете на якийсь час перенаправити вивід, якщо знову оголосите <code>$*OUT<\/code> у блоці.<\/span> <span class=\"sg\" data-s=\"5\">Тоді кожна підпрограма, яку ви викликаєте в цьому блоці, бачить нове значення.<\/span> <span class=\"sg\" data-s=\"6\">Динамічні змінні чудово підходять, щоб передавати контекст у викликаний код без явного аргументу.<\/span><\/p>"]]},"bg":{"t":"Динамични променливи","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Динамичната<\/em> променлива има туигила <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Лексикалната променлива се вижда само в блока, където я декларирате.<\/span> <span class=\"sg\" data-s=\"2\">Динамичната променлива е различна: Raku я намира, като търси <strong>навън през стека на извикванията<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Той търси в кода, който е извикал текущия код.<\/span> <span class=\"sg\" data-s=\"4\">Няма значение къде е дефиниран този код.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>greet<\/code> не декларира <code>$*greeting<\/code> и не я получава като аргумент.<\/span> <span class=\"sg\" data-s=\"1\">Но все пак може да я види.<\/span> <span class=\"sg\" data-s=\"2\">Това е така, защото променливата е динамична.<\/span> <span class=\"sg\" data-s=\"3\">Освен това <code>greet<\/code> е извикана от място, където променливата е в обхват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този пример би работил и с обикновена глобална скаларна променлива <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но следващият пример показва какво прави динамичните променливи специални.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Търсенето следва стека на извикванията.<\/span> <span class=\"sg\" data-s=\"1\">Затова по-близка декларация <strong>заменя<\/strong> по-далечната, докато работи нейният блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Същата <code>show<\/code> отпечатва <code>outer<\/code> първия път.<\/span> <span class=\"sg\" data-s=\"1\">Тя отпечатва <code>inner<\/code>, когато е извикана отвътре на блока, който декларира <code>$*level<\/code> отново.<\/span> <span class=\"sg\" data-s=\"2\">Това е <em>динамично обхващане<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вградените в Raku <code>$*OUT<\/code>, <code>$*IN<\/code> и <code>$*ERR<\/code> работят по същия начин.<\/span> <span class=\"sg\" data-s=\"4\">Можете временно да пренасочите изхода, ако декларирате <code>$*OUT<\/code> отново в блок.<\/span> <span class=\"sg\" data-s=\"5\">Тогава всяка подпрограма, която извиквате в блока, вижда новата стойност.<\/span> <span class=\"sg\" data-s=\"6\">Динамичните променливи са чудесни за предаване на контекст към извикания код без изричен аргумент.<\/span><\/p>"]]},"eo":{"t":"Dinamikaj variabloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Dinamika<\/em> variablo havas la tvigilon <code>*<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Leksika variablo estas videbla nur en la bloko, kie vi deklaras ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Dinamika variablo estas alia: Raku trovas ĝin, serĉante <strong>eksteren tra la voka stako<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi traserĉas la kodon, kiu vokis la nunan kodon.<\/span> <span class=\"sg\" data-s=\"4\">Ne gravas, kie tiu kodo estas difinita.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La subrutino <code>greet<\/code> nek deklaras <code>$*greeting<\/code>, nek ricevas ĝin kiel argumenton.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi tamen povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas ĉar la variablo estas dinamika.<\/span> <span class=\"sg\" data-s=\"3\">Krome, <code>greet<\/code> estis vokita el loko, kie la variablo estas en amplekso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ekzemplo funkcius ankaŭ kun simpla tutmonda skalara variablo <code>$greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed la sekva ekzemplo montras, kio faras dinamikajn variablojn specialaj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La serĉado sekvas la vokan stakon.<\/span> <span class=\"sg\" data-s=\"1\">Do pli proksima deklaro <strong>anstataŭigas<\/strong> pli malproksiman, dum ĝia bloko ruliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La sama <code>show<\/code> presas <code>outer<\/code> la unuan fojon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi presas <code>inner<\/code>, kiam ĝi estas vokita el ene de la bloko, kiu denove deklaris <code>$*level<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas <em>dinamika ampleksado<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La enkonstruitaj <code>$*OUT<\/code>, <code>$*IN<\/code> kaj <code>$*ERR<\/code> de Raku funkcias same.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas provizore redirekti eligon, se vi denove deklaras <code>$*OUT<\/code> en bloko.<\/span> <span class=\"sg\" data-s=\"5\">Tiam ĉiu rutino, kiun vi vokas ene de la bloko, vidas la novan valoron.<\/span> <span class=\"sg\" data-s=\"6\">Dinamikaj variabloj estas bonegaj por doni kuntekston al vokita kodo sen eksplicita argumento.<\/span><\/p>"]]},"la":{"t":"Dynamicae variabiles","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Variabilis <em>dynamica<\/em> twigil <code>*<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis lexica solum in clausula visibilis est ubi eam declaras.<\/span> <span class=\"sg\" data-s=\"2\">Variabilis dynamica aliter se habet: Raku eam invenit quaerendo <strong>foras per acervum vocationum<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">In codice quaerit qui codicem praesentem vocavit.<\/span> <span class=\"sg\" data-s=\"4\">Nihil refert ubi ille codex definitus sit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*greeting = 'Hello';\n\nsub greet {\n    say $*greeting;\n}\n\ngreet(); # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>greet<\/code> variabilem <code>$*greeting<\/code> non declarat neque ut argumentum accipit.<\/span> <span class=\"sg\" data-s=\"1\">Sed tamen eam videre potest.<\/span> <span class=\"sg\" data-s=\"2\">Causa est quod variabilis dynamica est.<\/span> <span class=\"sg\" data-s=\"3\">Praeterea <code>greet<\/code> ex loco vocatum est ubi variabilis in circumscriptione est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc exemplum etiam cum simplici variabili globali scalari <code>$greeting<\/code> operaretur.<\/span> <span class=\"sg\" data-s=\"1\">Sed exemplum sequens ostendit quid variabiles dynamicas speciales faciat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaesitio acervum vocationum sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Itaque declaratio propior remotiorem <strong>superat<\/strong> dum clausula eius currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $*level = 'outer';\n\nsub show {\n    say $*level;\n}\n\nshow(); # outer\n\n{\n    my $*level = 'inner';\n    show(); # inner\n}<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Idem <code>show<\/code> prima vice <code>outer<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\"><code>inner<\/code> imprimit cum ex clausula vocatur quae <code>$*level<\/code> iterum declaravit.<\/span> <span class=\"sg\" data-s=\"2\">Haec est <em>circumscriptio dynamica<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Variabiles inbuiltae Raku <code>$*OUT<\/code>, <code>$*IN<\/code> et <code>$*ERR<\/code> eodem modo operantur.<\/span> <span class=\"sg\" data-s=\"4\">Exitum ad tempus redirigere potes si <code>$*OUT<\/code> in clausula iterum declaras.<\/span> <span class=\"sg\" data-s=\"5\">Tum omnis procedura quam intra clausulam vocas novum valorem videt.<\/span> <span class=\"sg\" data-s=\"6\">Variabiles dynamicae optimae sunt ad contextum codici vocato tradendum sine argumento expresso.<\/span><\/p>"]]}}}</script>
