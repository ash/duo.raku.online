 <a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">Teil über Objekte<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Compiler füllt die <code>?<\/code>-Variablen, während er dein Programm kompiliert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jedes Twigil zeigt sofort eine andere Art von Variable.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du <code>$*foo<\/code> liest, weißt du gleich, dass sie dynamisch ist.<\/span> <span class=\"sg\" data-s=\"2\">Und <code>$?foo<\/code> ist eine Kompilierzeit-Konstante.<\/span> <span class=\"sg\" data-s=\"3\">Das nächste Thema behandelt <a href=\"https://course.raku.org/de/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dynamische Variablen<\/a> im Detail.<\/span> <span class=\"sg\" data-s=\"4\">Sie verhalten sich ganz anders als die lexikalischen Variablen, die du bisher verwendet hast.<\/span><\/p>"]]},"nl":{"t":"Twigils","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>twigil<\/em> is een teken tussen de sigil en de naam van een variabele.<\/span> <span class=\"sg\" data-s=\"1\">Het verandert de naam niet.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan verandert het hoe de variabele zich gedraagt en hoe Raku hem vindt.<\/span> <span class=\"sg\" data-s=\"3\">Dit zijn de meest voorkomende:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — een <strong>dynamische<\/strong> variabele, zoals <code>$*OUT<\/code>, die Raku opzoekt via de call stack<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — een <strong>compile-time<\/strong> waarde die de compiler levert, zoals <code>$?FILE<\/code> of <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — een <strong>privaat<\/strong> attribuut va n><\/p>"]]},"it":{"t":"Twigil","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>twigil<\/em> è un carattere tra il sigillo e il nome di una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Non cambia il nome.<\/span> <span class=\"sg\" data-s=\"2\">Invece, cambia come si comporta la variabile e come Raku la trova.<\/span> <span class=\"sg\" data-s=\"3\">Questi sono i più comuni:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — una variabile <strong>dinamica<\/strong>, come <code>$*OUT<\/code>, che Raku cerca attraverso lo stack delle chiamate<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — un valore <strong>in fase di compilazione<\/strong> che fornisce il compilatore, come <code>$?FILE<\/code> o <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — un attributo <strong>privato<\/strong> di un oggetto, come <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — un attributo che raggiungi tramite il suo metodo accessore, come <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ne hai già visti diversi, ma non li abbiamo chiamati twigil.<\/span> <span class=\"sg\" data-s=\"1\">Sono i dinamici <code>$*OUT<\/code> e <code>$*IN<\/code>, e <code>$!<\/code>/<code>$.<\/code> della <a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">parte sugli oggetti<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il compilatore riempie le variabili <code>?<\/code> mentre compila il tuo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni twigil indica a prima vista un tipo diverso di variabile.<\/span> <span class=\"sg\" data-s=\"1\">Quando leggi <code>$*foo<\/code>, capisci subito che è dinamica.<\/span> <span class=\"sg\" data-s=\"2\">E <code>$?foo<\/code> è una costante in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"3\">Il prossimo argomento esamina in dettaglio le <a href=\"https://course.raku.org/it/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabili dinamiche<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Si comportano in modo abbastanza diverso dalle variabili lessicali che hai usato finora.<\/span><\/p>"]]},"lv":{"t":"Tvigili","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Tvigils<\/em> ir rakstzīme starp sigilu un mainīgā nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā nemaina nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tā maina to, kā mainīgais uzvedas un kā Raku to atrod.<\/span> <span class=\"sg\" data-s=\"3\">Šie ir biežākie:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamisks<\/strong> mainīgais, piemēram, <code>$*OUT<\/code>, ko Raku meklē caur izsaukumu steku<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompilēšanas laika<\/strong> vērtība, ko dod kompilators, piemēram, <code>$?FILE<\/code> vai <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — objekta <strong>privāts<\/strong> atribūts, piemēram, <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atribūts, ko jūs sasniedzat caur tā piekļuves metodi, piemēram, <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat redzējuši vairākus no tiem, bet mēs tos nesaucām par tvigiliem.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir dinamiskie <code>$*OUT<\/code> un <code>$*IN<\/code>, kā arī <code>$!<\/code>/<code>$.<\/code> no <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">daļas par objektiem<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kompilators aizpilda <code>?<\/code> mainīgos, kamēr kompilē jūsu programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Katrs tvigils uzreiz parāda citu mainīgā veidu.<\/span> <span class=\"sg\" data-s=\"1\">Kad jūs lasāt <code>$*foo<\/code>, jūs uzreiz zināt, ka tas ir dinamisks.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>$?foo<\/code> ir kompilēšanas laika konstante.<\/span> <span class=\"sg\" data-s=\"3\">Nākamais temats sīkāk aplūko <a href=\"https://course.raku.org/lv/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamiskos mainīgos<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Tie uzvedas diezgan citādi nekā leksiskie mainīgie, ko jūs līdz šim esat lietojuši.<\/span><\/p>"]]},"ru":{"t":"Твигилы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Твигил<\/em> — это символ между сигилом и именем переменной.<\/span> <span class=\"sg\" data-s=\"1\">Он не меняет имя.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого он меняет то, как ведёт себя переменная и как Raku её находит.<\/span> <span class=\"sg\" data-s=\"3\">Вот самые распространённые из них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамическая<\/strong> переменная, например <code>$*OUT<\/code>, которую Raku ищет по стеку вызовов<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — значение <strong>времени компиляции<\/strong>, которое даёт компилятор, например <code>$?FILE<\/code> или <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватный<\/strong> атрибут объекта, например <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, к которому вы обращаетесь через его метод-аксессор, например <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы уже встречали несколько из них, но мы не называли их твигилами.<\/span> <span class=\"sg\" data-s=\"1\">Это динамические <code>$*OUT<\/code> и <code>$*IN<\/code>, а также <code>$!<\/code>/<code>$.<\/code> из <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">части об объектах<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Компилятор заполняет переменные с <code>?<\/code>, пока компилирует вашу программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждый твигил сразу показывает другой вид переменной.<\/span> <span class=\"sg\" data-s=\"1\">Когда вы читаете <code>$*foo<\/code>, вы сразу знаете, что это динамическая переменная.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$?foo<\/code> — это константа времени компиляции.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема подробно рассматривает <a href=\"https://course.raku.org/ru/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамические переменные<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Они ведут себя совсем иначе, чем лексические переменные, которые вы использовали до сих пор.<\/span><\/p>"]]},"uk":{"t":"Твіґіли","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Твіґіл<\/em> — це символ між сигілом та іменем змінної.<\/span> <span class=\"sg\" data-s=\"1\">Він не змінює імені.<\/span> <span class=\"sg\" data-s=\"2\">Натомість він змінює те, як змінна поводиться і як Raku її знаходить.<\/span> <span class=\"sg\" data-s=\"3\">Ось найпоширеніші з них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамічна<\/strong> змінна, як-от <code>$*OUT<\/code>, яку Raku шукає через стек викликів<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>компіляційне<\/strong> значення, яке дає компілятор, як-от <code>$?FILE<\/code> чи <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>приватний<\/strong> атрибут об'єкта, як-от <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, до якого ви дістаєтеся через його метод доступу, як-от <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кілька з них ви вже бачили, але ми не називали їх твіґілами.<\/span> <span class=\"sg\" data-s=\"1\">Це динамічні <code>$*OUT<\/code> і <code>$*IN<\/code>, а також <code>$!<\/code>/<code>$.<\/code> з <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">частини про об'єкти<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Компілятор заповнює змінні з <code>?<\/code>, коли компілює вашу програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # номер рядка цього оператора\nsay $?FILE; # шлях до цього файлу з вихідним кодом<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожен твіґіл одразу показує інший вид змінної.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви читаєте <code>$*foo<\/code>, ви одразу знаєте, що вона динамічна.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$?foo<\/code> — це компіляційна стала.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема докладно розглядає <a href=\"https://course.raku.org/uk/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамічні змінні<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Вони поводяться зовсім не так, як лексичні змінні, які ви використовували досі.<\/span><\/p>"]]},"bg":{"t":"Twigils","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Туигилът<\/em> е символ между сигила и името на променливата.<\/span> <span class=\"sg\" data-s=\"1\">Той не променя името.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това той променя как се държи променливата и как Raku я намира.<\/span> <span class=\"sg\" data-s=\"3\">Ето най-често срещаните:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>динамична<\/strong> променлива, като <code>$*OUT<\/code>, която Raku търси през стека на извикванията<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — стойност по <strong>време на компилация<\/strong>, която компилаторът предоставя, като <code>$?FILE<\/code> или <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>частен<\/strong> атрибут на обект, като <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — атрибут, до който стигате чрез неговия метод за достъп, като <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече сте виждали няколко от тях, но не ги наричахме туигили.<\/span> <span class=\"sg\" data-s=\"1\">Това са динамичните <code>$*OUT<\/code> и <code>$*IN<\/code>, както и <code>$!<\/code>/<code>$.<\/code> от <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">частта за обектите<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Компилаторът попълва <code>?<\/code> променливите, докато компилира програмата ви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всеки туигил веднага показва различен вид променлива.<\/span> <span class=\"sg\" data-s=\"1\">Когато четете <code>$*foo<\/code>, веднага знаете, че тя е динамична.<\/span> <span class=\"sg\" data-s=\"2\">А <code>$?foo<\/code> е константа по време на компилация.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема разглежда <a href=\"https://course.raku.org/bg/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">динамичните променливи<\/a> подробно.<\/span> <span class=\"sg\" data-s=\"4\">Те се държат доста различно от лексикалните променливи, които сте използвали досега.<\/span><\/p>"]]},"eo":{"t":"Duoblaj sigeloj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Tvigilo<\/em> estas signo inter la sigelo kaj la nomo de variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne ŝanĝas la nomon.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĝi ŝanĝas, kiel la variablo kondutas kaj kiel Raku trovas ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Jen la oftaj:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — <strong>dinamika<\/strong> variablo, kiel <code>$*OUT<\/code>, kiun Raku serĉas tra la voka stako<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — <strong>kompiltempa<\/strong> valoro, kiun la kompililo donas, kiel <code>$?FILE<\/code> aŭ <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — <strong>privata<\/strong> atributo de objekto, kiel <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — atributo, kiun vi atingas per ĝia aliriga metodo, kiel <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi jam vidis plurajn el ili, sed ni ne nomis ilin tvigiloj.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas la dinamikaj <code>$*OUT<\/code> kaj <code>$*IN<\/code>, kaj <code>$!<\/code>/<code>$.<\/code> el <a href=\"https://course.raku.org/eo/oop/\" target=\"_blank\" rel=\"noopener\">la parto pri objektoj<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kompililo plenigas la <code>?<\/code>-variablojn, dum ĝi kompilas vian programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # the line number of this statement\nsay $?FILE; # the path of this source file<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu tvigilo tuj montras alian specon de variablo.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi legas <code>$*foo<\/code>, vi tuj scias, ke ĝi estas dinamika.<\/span> <span class=\"sg\" data-s=\"2\">Kaj <code>$?foo<\/code> estas kompiltempa konstanto.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo detale rigardas <a href=\"https://course.raku.org/eo/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">dinamikajn variablojn<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ili kondutas tre malsame ol la leksikaj variabloj, kiujn vi uzis ĝis nun.<\/span><\/p>"]]},"la":{"t":"Twigili","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Twigil<\/em> est character inter sigillum et nomen variabilis.<\/span> <span class=\"sg\" data-s=\"1\">Nomen non mutat.<\/span> <span class=\"sg\" data-s=\"2\">Potius mutat quomodo variabilis se gerat et quomodo Raku eam inveniat.<\/span> <span class=\"sg\" data-s=\"3\">Haec sunt vulgaria:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>*<\/code> — variabilis <strong>dynamica<\/strong>, ut <code>$*OUT<\/code>, quam Raku per acervum vocationum quaerit<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>?<\/code> — valor <strong>temporis compilationis<\/strong> quem compilator praebet, ut <code>$?FILE<\/code> vel <code>$?LINE<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>!<\/code> — attributum <strong>privatum<\/strong> obiecti, ut <code>$!balance<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>.<\/code> — attributum quod per methodum accessus attingis, ut <code>$.name<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plura ex eis iam vidisti, sed ea twigilia non vocavimus.<\/span> <span class=\"sg\" data-s=\"1\">Haec sunt dynamica <code>$*OUT<\/code> et <code>$*IN<\/code>, et <code>$!<\/code>/<code>$.<\/code> ex <a href=\"https://course.raku.org/la/oop/\" target=\"_blank\" rel=\"noopener\">parte de obiectis<\/a>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Compilator variabiles <code>?<\/code> implet dum programma tuum compilat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $?LINE; # numerus lineae huius enuntiati\nsay $?FILE; # semita huius archivi fontis<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Unumquodque twigil statim aliud genus variabilis ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>$*foo<\/code> legis, statim scis eam dynamicam esse.<\/span> <span class=\"sg\" data-s=\"2\">Et <code>$?foo<\/code> est constans temporis compilationis.<\/span> <span class=\"sg\" data-s=\"3\">Argumentum sequens <a href=\"https://course.raku.org/la/advanced/special-variables/dynamic-variables/\" target=\"_blank\" rel=\"noopener\">variabiles dynamicas<\/a> accurate inspicit.<\/span> <span class=\"sg\" data-s=\"4\">Multum aliter se gerunt quam variabiles lexicae quas adhuc adhibuisti.<\/span><\/p>"]]}}}</script>
