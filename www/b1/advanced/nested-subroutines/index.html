<script type="application/json" id="page-data">{"u":"advanced/nested-subroutines","n":674,"k":"section","pv":"advanced/more-on-main/quiz","nx":"advanced/nested-subroutines/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Nested subroutines","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A subroutine can be defined <em>inside<\/em> another subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Such a nested subroutine is a normal subroutine.<\/span> <span class=\"sg\" data-s=\"2\">But it is visible only inside the subroutine that contains it.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, <code>inner<\/code> is declared inside <code>outer<\/code>, and <code>outer<\/code> calls it.<\/span> <span class=\"sg\" data-s=\"1\">This works because you can use <code>inner<\/code> anywhere in the body of <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">But outside <code>outer<\/code>, there is no name <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So the next program does not compile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nesting is useful when only one subroutine needs a helper routine.<\/span> <span class=\"sg\" data-s=\"1\">If you keep the helper inside, it is clear that it is a private detail.<\/span> <span class=\"sg\" data-s=\"2\">Also, nobody can call it from somewhere else by mistake.<\/span><\/p>"]]},"de":{"t":"Verschachtelte Unterprogramme","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Unterroutine kann <em>innerhalb<\/em> einer anderen Unterroutine definiert werden.<\/span> <span class=\"sg\" data-s=\"1\">So eine verschachtelte Unterroutine ist eine normale Unterroutine.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie ist nur innerhalb der Unterroutine sichtbar, die sie enthält.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wird <code>inner<\/code> innerhalb von <code>outer<\/code> deklariert, und <code>outer<\/code> ruft sie auf.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert, weil Sie <code>inner<\/code> überall im Körper von <code>outer<\/code> benutzen können.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aber außerhalb von <code>outer<\/code> gibt es keinen Namen <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb lässt sich das nächste Programm nicht kompilieren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Verschachtelung ist nützlich, wenn nur eine Unterroutine eine Hilfsroutine braucht.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie den Helfer darin lassen, ist klar, dass er ein privates Detail ist.<\/span> <span class=\"sg\" data-s=\"2\">Außerdem kann ihn niemand aus Versehen von woanders aufrufen.<\/span><\/p>"]]},"nl":{"t":"Geneste subroutines","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een subroutine kan <em>binnen<\/em> een andere subroutine worden gedefinieerd.<\/span> <span class=\"sg\" data-s=\"1\">Zo'n geneste subroutine is een normale subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Maar ze is alleen zichtbaar binnen de subroutine die haar bevat.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier wordt <code>inner<\/code> binnen <code>outer<\/code> gedeclareerd, en <code>outer<\/code> roept haar aan.<\/span> <span class=\"sg\" data-s=\"1\">Dit werkt omdat je <code>inner<\/code> overal in het lichaam van <code>outer<\/code> kunt gebruiken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Maar buiten <code>outer<\/code> is er geen naam <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarom compileert het volgende programma niet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nesten is handig als maar één subroutine een hulproutine nodig heeft.<\/span> <span class=\"sg\" data-s=\"1\">Als je de hulproutine erin houdt, is duidelijk dat het een privédetail is.<\/span> <span class=\"sg\" data-s=\"2\">Ook kan niemand haar per ongeluk van ergens anders aanroepen.<\/span><\/p>"]]},"es":{"t":"Subrutinas anidadas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subrutina puede definirse <em>dentro<\/em> de otra subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina anidada así es una subrutina normal.<\/span> <span class=\"sg\" data-s=\"2\">Pero solo es visible dentro de la subrutina que la contiene.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>inner<\/code> se declara dentro de <code>outer<\/code>, y <code>outer<\/code> la llama.<\/span> <span class=\"sg\" data-s=\"1\">Esto funciona porque puedes usar <code>inner<\/code> en cualquier parte del cuerpo de <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pero fuera de <code>outer<\/code>, no hay ningún nombre <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que el siguiente programa no compila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anidar es útil cuando solo una subrutina necesita una rutina auxiliar.<\/span> <span class=\"sg\" data-s=\"1\">Si la guardas dentro, queda claro que es un detalle privado.<\/span> <span class=\"sg\" data-s=\"2\">Además, nadie puede llamarla desde otro lugar por error.<\/span><\/p>"]]},"it":{"t":"Subroutine annidate","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subroutine può essere definita <em>all'interno<\/em> di un'altra subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine annidata di questo tipo è una subroutine normale.<\/span> <span class=\"sg\" data-s=\"2\">Ma è visibile solo all'interno della subroutine che la contiene.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui <code>inner<\/code> è dichiarata dentro <code>outer<\/code>, e <code>outer<\/code> la chiama.<\/span> <span class=\"sg\" data-s=\"1\">Funziona perché puoi usare <code>inner<\/code> in qualsiasi punto del corpo di <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ma fuori da <code>outer<\/code> non c'è nessun nome <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il programma seguente non si compila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">L'annidamento è utile quando solo una subroutine ha bisogno di una routine di aiuto.<\/span> <span class=\"sg\" data-s=\"1\">Se la tieni dentro, è chiaro che si tratta di un dettaglio privato.<\/span> <span class=\"sg\" data-s=\"2\">Inoltre, nessuno può chiamarla per sbaglio da un'altra parte.<\/span><\/p>"]]},"lv":{"t":"Ligzdotas apakšprogrammas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammu var definēt <em>iekšpus<\/em> citas apakšprogrammas.<\/span> <span class=\"sg\" data-s=\"1\">Šāda ligzdota apakšprogramma ir parasta apakšprogramma.<\/span> <span class=\"sg\" data-s=\"2\">Bet tā ir redzama tikai tās apakšprogrammas iekšpusē, kas to satur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>inner<\/code> ir deklarēta iekšpus <code>outer<\/code>, un <code>outer<\/code> to izsauc.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas, jo <code>inner<\/code> var lietot jebkurā <code>outer<\/code> ķermeņa vietā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bet ārpus <code>outer<\/code> nav nosaukuma <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc nākamā programma nekompilējas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ligzdošana noder, kad palīgrutīna vajadzīga tikai vienai apakšprogrammai.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs turat palīgu iekšpusē, ir skaidrs, ka tā ir privāta detaļa.<\/span> <span class=\"sg\" data-s=\"2\">Turklāt neviens nevar to pa kļūdai izsaukt no citas vietas.<\/span><\/p>"]]},"ru":{"t":"Вложенные подпрограммы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подпрограмму можно определить <em>внутри<\/em> другой подпрограммы.<\/span> <span class=\"sg\" data-s=\"1\">Такая вложенная подпрограмма — обычная подпрограмма.<\/span> <span class=\"sg\" data-s=\"2\">Но она видна только внутри той подпрограммы, в которой находится.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>inner<\/code> объявлена внутри <code>outer<\/code>, и <code>outer<\/code> её вызывает.<\/span> <span class=\"sg\" data-s=\"1\">Это работает, потому что <code>inner<\/code> можно использовать в любом месте тела <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но за пределами <code>outer<\/code> никакого имени <code>inner<\/code> нет.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому следующая программа не компилируется:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вложенность полезна, когда вспомогательная подпрограмма нужна только одной подпрограмме.<\/span> <span class=\"sg\" data-s=\"1\">Если держать её внутри, понятно, что это внутренняя деталь.<\/span> <span class=\"sg\" data-s=\"2\">Кроме того, никто не сможет случайно вызвать её из другого места.<\/span><\/p>"]]},"uk":{"t":"Вкладені підпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Підпрограму можна визначити <em>всередині<\/em> іншої підпрограми.<\/span> <span class=\"sg\" data-s=\"1\">Така вкладена підпрограма — звичайна підпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Але її видно лише всередині тієї підпрограми, яка її містить.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>inner<\/code> оголошено всередині <code>outer<\/code>, і <code>outer<\/code> її викликає.<\/span> <span class=\"sg\" data-s=\"1\">Це працює, бо <code>inner<\/code> можна використовувати будь-де в тілі <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Але за межами <code>outer<\/code> немає імені <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож наступна програма не компілюється:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # помилка: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вкладення корисне, коли допоміжна підпрограма потрібна лише одній підпрограмі.<\/span> <span class=\"sg\" data-s=\"1\">Якщо тримати помічника всередині, видно, що це приватна деталь.<\/span> <span class=\"sg\" data-s=\"2\">Крім того, ніхто не зможе випадково викликати його звідкись іще.<\/span><\/p>"]]},"bg":{"t":"Вложени подпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подпрограма може да бъде дефинирана <em>вътре<\/em> в друга подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Такава вложена подпрограма е обикновена подпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Но тя е видима само в подпрограмата, която я съдържа.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>inner<\/code> е декларирана вътре в <code>outer<\/code>, а <code>outer<\/code> я извиква.<\/span> <span class=\"sg\" data-s=\"1\">Това работи, защото можете да използвате <code>inner<\/code> навсякъде в тялото на <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Но извън <code>outer<\/code> няма име <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова следващата програма не се компилира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Влагането е полезно, когато само една подпрограма има нужда от помощна подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Ако държите помощника вътре, е ясно, че той е частен детайл.<\/span> <span class=\"sg\" data-s=\"2\">Освен това никой не може да го извика по грешка от друго място.<\/span><\/p>"]]},"eo":{"t":"Nestitaj subrutinaj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Subprogramo povas esti difinita <em>ene de<\/em> alia subprogramo.<\/span> <span class=\"sg\" data-s=\"1\">Tia nestita subprogramo estas normala subprogramo.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi estas videbla nur ene de la subprogramo, kiu enhavas ĝin.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>inner<\/code> estas deklarita ene de <code>outer<\/code>, kaj <code>outer<\/code> vokas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias, ĉar vi povas uzi <code>inner<\/code> ie ajn en la korpo de <code>outer<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed ekster <code>outer<\/code>, ne ekzistas nomo <code>inner<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do la sekva programo ne kompiliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nestado estas utila, kiam nur unu subprogramo bezonas helpantan subprogramon.<\/span> <span class=\"sg\" data-s=\"1\">Se vi tenas la helpanton interne, estas klare, ke ĝi estas privata detalo.<\/span> <span class=\"sg\" data-s=\"2\">Krome, neniu povas voki ĝin erare de alia loko.<\/span><\/p>"]]},"la":{"t":"Subprogrammata nidificata","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Subroutina <em>intra<\/em> aliam subroutinam definiri potest.<\/span> <span class=\"sg\" data-s=\"1\">Talis subroutina inclusa est subroutina ordinaria.<\/span> <span class=\"sg\" data-s=\"2\">Sed solum intra subroutinam quae eam continet visibilis est.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner {\n        say 'I am the inner subroutine';\n    }\n\n    inner;\n}\n\nouter;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>I am the inner subroutine<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>inner<\/code> intra <code>outer<\/code> declaratur, et <code>outer<\/code> eam vocat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc operatur, quia <code>inner<\/code> ubique in corpore <code>outer<\/code> adhibere potes.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sed extra <code>outer<\/code> nullum nomen <code>inner<\/code> est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque programma sequens non compilatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub outer {\n    sub inner { 42 }\n}\n\ninner; # error: Undeclared routine: inner<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Inclusio utilis est cum una sola subroutina routinam auxiliarem requirit.<\/span> <span class=\"sg\" data-s=\"1\">Si auxiliarem intus servas, clarum est eam rem privatam esse.<\/span> <span class=\"sg\" data-s=\"2\">Praeterea nemo eam aliunde per errorem vocare potest.<\/span><\/p>"]]}}}</script>
