<script type="application/json" id="page-data">{"u":"advanced/contexts/item-and-list","n":385,"k":"topic","pv":"advanced/contexts/coercion-contexts/quiz","nx":"advanced/contexts/item-and-list/quiz","tr":["advanced","advanced/contexts"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Item and list context","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Two more contexts decide if something is a <strong>list<\/strong> or a single <strong>item<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">A list has several values.<\/span> <span class=\"sg\" data-s=\"2\">The <code>@<\/code> and <code>$<\/code> sigils are based on this difference.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>list context<\/em>, an array spreads out into its elements.<\/span> <span class=\"sg\" data-s=\"1\">A <code>for<\/code> loop puts its argument in list context, so it goes through each element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>item context<\/em>, the same array acts as one single value.<\/span> <span class=\"sg\" data-s=\"1\">The <code>$( … )<\/code> contextualiser sets item context.<\/span> <span class=\"sg\" data-s=\"2\">So now the loop sees only one thing and runs once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This explains what happens when you assign an array to a scalar.<\/span> <span class=\"sg\" data-s=\"1\">The array is packed into a single item, and its elements are not copied.<\/span> <span class=\"sg\" data-s=\"2\">The reason is that <code>my $x = @a<\/code> puts <code>@a<\/code> in item context.<\/span> <span class=\"sg\" data-s=\"3\">Note that this single item can be another container with many items in it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$var<\/code> is a scalar container, so it now holds a single object.<\/span> <span class=\"sg\" data-s=\"1\">This object is an <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can easily prove this.<\/span> <span class=\"sg\" data-s=\"3\">Use <code>$var<\/code> as a kind of array reference, as other languages would call it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Its partner, the <code>@( … )<\/code> contextualiser, does the opposite and sets list context.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">There is also <em>sink context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is the context of a statement whose value is thrown away.<\/span> <span class=\"sg\" data-s=\"2\">For example, a line may be there only for its side effect.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes a value in sink context does nothing useful.<\/span> <span class=\"sg\" data-s=\"4\">Then Raku may warn about a “useless use”.<\/span> <span class=\"sg\" data-s=\"5\">This is a helpful hint that you forgot to use a result.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When you choose a sigil, <code>$<\/code> or <code>@<\/code>, you really choose a context.<\/span> <span class=\"sg\" data-s=\"1\">Where needed, the contextualisers <code>$( )<\/code> and <code>@( )<\/code> let you change it.<\/span><\/p>"]]},"de":{"t":"Item- und Listenkontext","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Zwei weitere Kontexte entscheiden, ob etwas eine <strong>Liste<\/strong> oder ein einzelnes <strong>Element<\/strong> ist.<\/span> <span class=\"sg\" data-s=\"1\">Eine Liste hat mehrere Werte.<\/span> <span class=\"sg\" data-s=\"2\">Die Sigils <code>@<\/code> und <code>$<\/code> beruhen auf diesem Unterschied.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Im <em>Listenkontext<\/em> breitet sich ein Array in seine Elemente aus.<\/span> <span class=\"sg\" data-s=\"1\">Eine <code>for<\/code>-Schleife setzt ihr Argument in den Listenkontext, also geht sie durch jedes Element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Im <em>Elementkontext<\/em> verhält sich dasselbe Array wie ein einzelner Wert.<\/span> <span class=\"sg\" data-s=\"1\">Der Kontextualisierer <code>$( … )<\/code> setzt den Elementkontext.<\/span> <span class=\"sg\" data-s=\"2\">Also sieht die Schleife jetzt nur eine Sache und läuft einmal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das erklärt, was passiert, wenn du einem Skalar ein Array zuweist.<\/span> <span class=\"sg\" data-s=\"1\">Das Array wird in ein einzelnes Element gepackt, und seine Elemente werden nicht kopiert.<\/span> <span class=\"sg\" data-s=\"2\">Der Grund ist, dass <code>my $x = @a<\/code> das Array <code>@a<\/code> in den Elementkontext setzt.<\/span> <span class=\"sg\" data-s=\"3\">Beachte, dass dieses einzelne Element ein weiterer Container mit vielen Elementen darin sein kann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$var<\/code> ist ein Skalar-Container, also enthält sie jetzt ein einzelnes Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Dieses Objekt ist ein <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das kannst du leicht beweisen.<\/span> <span class=\"sg\" data-s=\"3\">Behandle <code>$var<\/code> wie eine Art Array-Referenz, wie man das in anderen Sprachen nennen würde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sein Partner, der Kontextualisierer <code>@( … )<\/code>, macht das Gegenteil und setzt den Listenkontext.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch den <em>Sink-Kontext<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist der Kontext einer Anweisung, deren Wert weggeworfen wird.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann eine Zeile nur wegen ihres Seiteneffekts da sein.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal tut ein Wert im Sink-Kontext nichts Nützliches.<\/span> <span class=\"sg\" data-s=\"4\">Dann kann Raku vor einer \"useless use\" warnen.<\/span> <span class=\"sg\" data-s=\"5\">Das ist ein hilfreicher Hinweis, dass du vergessen hast, ein Ergebnis zu benutzen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Sigil wählst, <code>$<\/code> oder <code>@<\/code>, wählst du eigentlich einen Kontext.<\/span> <span class=\"sg\" data-s=\"1\">Wo nötig, kannst du ihn mit den Kontextualisierern <code>$( )<\/code> und <code>@( )<\/code> ändern.<\/span><\/p>"]]},"nl":{"t":"Item- en lijstcontext","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nog twee contexten bepalen of iets een <strong>lijst<\/strong> of een enkel <strong>item<\/strong> is.<\/span> <span class=\"sg\" data-s=\"1\">Een lijst heeft meerdere waarden.<\/span> <span class=\"sg\" data-s=\"2\">De <code>@<\/code>- en <code>$<\/code>-sigils zijn gebaseerd op dit verschil.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>lijstcontext<\/em> spreidt een array zich uit in zijn elementen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>for<\/code>-lus zet zijn argument in lijstcontext, dus hij gaat langs elk element:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>itemcontext<\/em> gedraagt dezelfde array zich als één enkele waarde.<\/span> <span class=\"sg\" data-s=\"1\">De <code>$( … )<\/code>-contextomzetter stelt itemcontext in.<\/span> <span class=\"sg\" data-s=\"2\">Dus ziet de lus nu maar één ding en loopt hij één keer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit verklaart wat er gebeurt als je een array aan een scalar toewijst.<\/span> <span class=\"sg\" data-s=\"1\">De array wordt verpakt in een enkel item, en zijn elementen worden niet gekopieerd.<\/span> <span class=\"sg\" data-s=\"2\">De reden is dat <code>my $x = @a<\/code> de array <code>@a<\/code> in itemcontext zet.<\/span> <span class=\"sg\" data-s=\"3\">Let op: dit enkele item kan een andere container zijn met veel items erin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$var<\/code> is een scalaire container, dus hij bevat nu een enkel object.<\/span> <span class=\"sg\" data-s=\"1\">Dit object is een <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt dit eenvoudig bewijzen.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik <code>$var<\/code> als een soort array-referentie, zoals andere talen het zouden noemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zijn partner, de <code>@( … )<\/code>-contextomzetter, doet het tegenovergestelde en stelt lijstcontext in.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Er is ook <em>sink-context<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is de context van een statement waarvan de waarde wordt weggegooid.<\/span> <span class=\"sg\" data-s=\"2\">Een regel kan er bijvoorbeeld alleen zijn vanwege zijn neveneffect.<\/span> <span class=\"sg\" data-s=\"3\">Soms doet een waarde in sink-context niets nuttigs.<\/span> <span class=\"sg\" data-s=\"4\">Dan kan Raku waarschuwen voor een \"useless use\".<\/span> <span class=\"sg\" data-s=\"5\">Dat is een handige hint dat je vergeten bent een resultaat te gebruiken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een sigil kiest, <code>$<\/code> of <code>@<\/code>, kies je eigenlijk een context.<\/span> <span class=\"sg\" data-s=\"1\">Waar nodig kun je die veranderen met de contextomzetters <code>$( )<\/code> en <code>@( )<\/code>.<\/span><\/p>"]]},"es":{"t":"Contexto de ítem y de lista","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Otros dos contextos deciden si algo es una <strong>lista<\/strong> o un solo <strong>elemento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Una lista tiene varios valores.<\/span> <span class=\"sg\" data-s=\"2\">Los sigils <code>@<\/code> y <code>$<\/code> se basan en esta diferencia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de lista<\/em>, un array se separa en sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Un bucle <code>for<\/code> pone su argumento en contexto de lista, así que recorre cada elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En <em>contexto de elemento<\/em>, el mismo array actúa como un solo valor.<\/span> <span class=\"sg\" data-s=\"1\">El contextualizador <code>$( … )<\/code> fija el contexto de elemento.<\/span> <span class=\"sg\" data-s=\"2\">Así que ahora el bucle ve solo una cosa y se ejecuta una vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esto explica qué pasa cuando asignas un array a un escalar.<\/span> <span class=\"sg\" data-s=\"1\">El array se empaqueta en un solo elemento, y sus elementos no se copian.<\/span> <span class=\"sg\" data-s=\"2\">La razón es que <code>my $x = @a<\/code> pone <code>@a<\/code> en contexto de elemento.<\/span> <span class=\"sg\" data-s=\"3\">Ten en cuenta que este único elemento puede ser otro contenedor con muchos elementos dentro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$var<\/code> es un contenedor escalar, así que ahora guarda un solo objeto.<\/span> <span class=\"sg\" data-s=\"1\">Este objeto es un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes demostrarlo fácilmente.<\/span> <span class=\"sg\" data-s=\"3\">Usa <code>$var<\/code> como una especie de referencia a array, como lo llamarían otros lenguajes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Su pareja, el contextualizador <code>@( … )<\/code>, hace lo contrario y fija el contexto de lista.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">También existe el <em>contexto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es el contexto de una sentencia cuyo valor se tira.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, una línea puede estar ahí solo por su efecto secundario.<\/span> <span class=\"sg\" data-s=\"3\">A veces un valor en contexto sink no hace nada útil.<\/span> <span class=\"sg\" data-s=\"4\">Entonces Raku puede avisar de un “uso inútil”.<\/span> <span class=\"sg\" data-s=\"5\">Es una pista útil de que olvidaste usar un resultado.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando eliges un sigil, <code>$<\/code> o <code>@<\/code>, en realidad eliges un contexto.<\/span> <span class=\"sg\" data-s=\"1\">Cuando hace falta, los contextualizadores <code>$( )<\/code> y <code>@( )<\/code> te permiten cambiarlo.<\/span><\/p>"]]},"it":{"t":"Contesto elemento e lista","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Altri due contesti decidono se qualcosa è una <strong>lista<\/strong> o un singolo <strong>elemento<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Una lista ha più valori.<\/span> <span class=\"sg\" data-s=\"2\">I sigilli <code>@<\/code> e <code>$<\/code> si basano su questa differenza.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto lista<\/em>, un array si espande nei suoi elementi.<\/span> <span class=\"sg\" data-s=\"1\">Un ciclo <code>for<\/code> mette il suo argomento in contesto lista, quindi passa per ogni elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nel <em>contesto elemento<\/em>, lo stesso array agisce come un singolo valore.<\/span> <span class=\"sg\" data-s=\"1\">Il contestualizzatore <code>$( … )<\/code> imposta il contesto elemento.<\/span> <span class=\"sg\" data-s=\"2\">Quindi ora il ciclo vede una sola cosa e gira una volta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo spiega cosa succede quando assegni un array a uno scalare.<\/span> <span class=\"sg\" data-s=\"1\">L'array viene impacchettato in un singolo elemento, e i suoi elementi non vengono copiati.<\/span> <span class=\"sg\" data-s=\"2\">Il motivo è che <code>my $x = @a<\/code> mette <code>@a<\/code> in contesto elemento.<\/span> <span class=\"sg\" data-s=\"3\">Nota che questo singolo elemento può essere un altro contenitore con molti elementi dentro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$var<\/code> è un contenitore scalare, quindi ora contiene un singolo oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Questo oggetto è un <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi dimostrarlo facilmente.<\/span> <span class=\"sg\" data-s=\"3\">Usa <code>$var<\/code> come una specie di riferimento ad array, come lo chiamerebbero altri linguaggi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il suo compagno, il contestualizzatore <code>@( … )<\/code>, fa il contrario e imposta il contesto lista.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Esiste anche il <em>contesto sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È il contesto di un'istruzione il cui valore viene buttato via.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, una riga può esserci solo per il suo effetto collaterale.<\/span> <span class=\"sg\" data-s=\"3\">A volte un valore in contesto sink non fa niente di utile.<\/span> <span class=\"sg\" data-s=\"4\">Allora Raku può avvisare di un “useless use”.<\/span> <span class=\"sg\" data-s=\"5\">È un suggerimento utile: hai dimenticato di usare un risultato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando scegli un sigillo, <code>$<\/code> o <code>@<\/code>, in realtà scegli un contesto.<\/span> <span class=\"sg\" data-s=\"1\">Dove serve, i contestualizzatori <code>$( )<\/code> e <code>@( )<\/code> ti permettono di cambiarlo.<\/span><\/p>"]]},"lv":{"t":"Vienuma un saraksta konteksts","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vēl divi konteksti nosaka, vai kaut kas ir <strong>saraksts<\/strong> vai viens <strong>elements<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sarakstam ir vairākas vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Sigili <code>@<\/code> un <code>$<\/code> balstās uz šo atšķirību.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><em>Saraksta kontekstā<\/em> masīvs izklājas savos elementos.<\/span> <span class=\"sg\" data-s=\"1\">Cikls <code>for<\/code> ievieto savu argumentu saraksta kontekstā, tāpēc tas iet cauri katram elementam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Elementa kontekstā<\/em> tas pats masīvs darbojas kā viena vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Kontekstualizators <code>$( … )<\/code> uzliek elementa kontekstu.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tagad cikls redz tikai vienu lietu un izpildās vienu reizi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas izskaidro, kas notiek, kad jūs piešķirat masīvu skalāram.<\/span> <span class=\"sg\" data-s=\"1\">Masīvs tiek iepakots vienā elementā, un tā elementi netiek kopēti.<\/span> <span class=\"sg\" data-s=\"2\">Iemesls ir tāds, ka <code>my $x = @a<\/code> ievieto <code>@a<\/code> elementa kontekstā.<\/span> <span class=\"sg\" data-s=\"3\">Ņemiet vērā, ka šis viens elements var būt cits konteineris ar daudziem elementiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$var<\/code> ir skalārs konteineris, tāpēc tagad tas satur vienu objektu.<\/span> <span class=\"sg\" data-s=\"1\">Šis objekts ir <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">To var viegli pierādīt.<\/span> <span class=\"sg\" data-s=\"3\">Izmantojiet <code>$var<\/code> kā sava veida masīva atsauci, kā to sauktu citās valodās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tā pāris, kontekstualizators <code>@( … )<\/code>, dara pretējo un uzliek saraksta kontekstu.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ir arī <em>izlietnes konteksts<\/em> (sink context).<\/span> <span class=\"sg\" data-s=\"1\">Tas ir konteksts izteikumam, kura vērtība tiek izmesta.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, rinda var būt tikai sava blakusefekta dēļ.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz vērtība izlietnes kontekstā nedara neko noderīgu.<\/span> <span class=\"sg\" data-s=\"4\">Tad Raku var brīdināt par \"bezjēdzīgu lietojumu\" (useless use).<\/span> <span class=\"sg\" data-s=\"5\">Tas ir noderīgs padoms, ka jūs aizmirsāt izmantot rezultātu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jūs izvēlaties sigilu, <code>$<\/code> vai <code>@<\/code>, jūs patiesībā izvēlaties kontekstu.<\/span> <span class=\"sg\" data-s=\"1\">Kur vajag, kontekstualizatori <code>$( )<\/code> un <code>@( )<\/code> ļauj to mainīt.<\/span><\/p>"]]},"ru":{"t":"Элементный и списковый контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ещё два контекста решают, будет ли что-то <strong>списком<\/strong> или одним <strong>элементом<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">В списке несколько значений.<\/span> <span class=\"sg\" data-s=\"2\">На этой разнице основаны сигилы <code>@<\/code> и <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте списка<\/em> массив раскладывается на свои элементы.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> помещает свой аргумент в контекст списка, поэтому он проходит по каждому элементу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В <em>контексте элемента<\/em> тот же массив ведёт себя как одно значение.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализатор <code>$( … )<\/code> задаёт контекст элемента.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому теперь цикл видит только одну вещь и выполняется один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Это объясняет, что происходит, когда вы присваиваете массив скаляру.<\/span> <span class=\"sg\" data-s=\"1\">Массив упаковывается в один элемент, и его элементы не копируются.<\/span> <span class=\"sg\" data-s=\"2\">Причина в том, что <code>my $x = @a<\/code> помещает <code>@a<\/code> в контекст элемента.<\/span> <span class=\"sg\" data-s=\"3\">Обратите внимание, что этот один элемент может быть другим контейнером с множеством элементов внутри:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$var<\/code> — это скалярный контейнер, поэтому теперь она содержит один объект.<\/span> <span class=\"sg\" data-s=\"1\">Этот объект — <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это легко доказать.<\/span> <span class=\"sg\" data-s=\"3\">Используйте <code>$var<\/code> как своего рода ссылку на массив, как это назвали бы в других языках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Его пара, контекстуализатор <code>@( … )<\/code>, делает обратное и задаёт контекст списка.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Есть также <em>контекст поглощения (sink context)<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это контекст выражения, значение которого выбрасывается.<\/span> <span class=\"sg\" data-s=\"2\">Например, строка кода может быть нужна только ради побочного эффекта.<\/span> <span class=\"sg\" data-s=\"3\">Иногда значение в контексте поглощения не делает ничего полезного.<\/span> <span class=\"sg\" data-s=\"4\">Тогда Raku может предупредить о «бесполезном использовании» (useless use).<\/span> <span class=\"sg\" data-s=\"5\">Это полезная подсказка, что вы забыли использовать результат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы выбираете сигил, <code>$<\/code> или <code>@<\/code>, вы на самом деле выбираете контекст.<\/span> <span class=\"sg\" data-s=\"1\">Где нужно, контекстуализаторы <code>$( )<\/code> и <code>@( )<\/code> позволяют его изменить.<\/span><\/p>"]]},"uk":{"t":"Штучний та списковий контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ще два контексти вирішують, чи є щось <strong>списком<\/strong>, чи одним <strong>елементом<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Список має кілька значень.<\/span> <span class=\"sg\" data-s=\"2\">На цій різниці побудовані сигіли <code>@<\/code> та <code>$<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <em>списковому контексті<\/em> масив розгортається у свої елементи.<\/span> <span class=\"sg\" data-s=\"1\">Цикл <code>for<\/code> ставить свій аргумент у списковий контекст, тож проходить по кожному елементу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У <em>штучному контексті<\/em> той самий масив поводиться як одне-єдине значення.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуалізатор <code>$( … )<\/code> задає штучний контекст.<\/span> <span class=\"sg\" data-s=\"2\">Тож тепер цикл бачить лише одну річ і виконується один раз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це пояснює, що стається, коли ви присвоюєте масив скаляру.<\/span> <span class=\"sg\" data-s=\"1\">Масив пакується в один елемент, а його елементи не копіюються.<\/span> <span class=\"sg\" data-s=\"2\">Причина в тому, що <code>my $x = @a<\/code> ставить <code>@a<\/code> у штучний контекст.<\/span> <span class=\"sg\" data-s=\"3\">Зверніть увагу, що цей один елемент може бути іншим контейнером із багатьма елементами всередині:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$var<\/code> — це скалярний контейнер, тож тепер вона містить один об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Цей об'єкт — <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це легко довести.<\/span> <span class=\"sg\" data-s=\"3\">Використайте <code>$var<\/code> як своєрідне посилання на масив, як це назвали б в інших мовах:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Його пара, контекстуалізатор <code>@( … )<\/code>, робить протилежне й задає списковий контекст.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Є ще <em>контекст стоку<\/em> (sink context).<\/span> <span class=\"sg\" data-s=\"1\">Це контекст оператора, значення якого викидається.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, рядок коду може існувати лише заради побічного ефекту.<\/span> <span class=\"sg\" data-s=\"3\">Іноді значення в контексті стоку не робить нічого корисного.<\/span> <span class=\"sg\" data-s=\"4\">Тоді Raku може попередити про «useless use».<\/span> <span class=\"sg\" data-s=\"5\">Це корисна підказка, що ви забули використати результат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви обираєте сигіл, <code>$<\/code> чи <code>@<\/code>, ви насправді обираєте контекст.<\/span> <span class=\"sg\" data-s=\"1\">Де потрібно, контекстуалізатори <code>$( )<\/code> та <code>@( )<\/code> дозволяють його змінити.<\/span><\/p>"]]},"bg":{"t":"Елементен и списъчен контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Още два контекста решават дали нещо е <strong>списък<\/strong>, или единичен <strong>елемент<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Списъкът има няколко стойности.<\/span> <span class=\"sg\" data-s=\"2\">Сигилите <code>@<\/code> и <code>$<\/code> се основават на тази разлика.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на списък<\/em> масивът се разгъва в своите елементи.<\/span> <span class=\"sg\" data-s=\"1\">Цикълът <code>for<\/code> поставя аргумента си в контекст на списък, така че минава през всеки елемент:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В <em>контекст на елемент<\/em> същият масив действа като една единична стойност.<\/span> <span class=\"sg\" data-s=\"1\">Контекстуализаторът <code>$( … )<\/code> задава контекст на елемент.<\/span> <span class=\"sg\" data-s=\"2\">Затова сега цикълът вижда само едно нещо и се изпълнява веднъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Това обяснява какво става, когато присвоите масив на скалар.<\/span> <span class=\"sg\" data-s=\"1\">Масивът се опакова в единичен елемент и елементите му не се копират.<\/span> <span class=\"sg\" data-s=\"2\">Причината е, че <code>my $x = @a<\/code> поставя <code>@a<\/code> в контекст на елемент.<\/span> <span class=\"sg\" data-s=\"3\">Забележете, че този единичен елемент може да е друг контейнер с много елементи в него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$var<\/code> е скаларен контейнер, затова сега съдържа единичен обект.<\/span> <span class=\"sg\" data-s=\"1\">Този обект е <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете лесно да докажете това.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте <code>$var<\/code> като вид препратка към масив, както биха я нарекли в други езици:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Неговият партньор, контекстуализаторът <code>@( … )<\/code>, прави обратното и задава контекст на списък.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Има и <em>sink контекст<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това е контекстът на израз, чиято стойност се изхвърля.<\/span> <span class=\"sg\" data-s=\"2\">Например, един ред може да е там само заради страничния си ефект.<\/span> <span class=\"sg\" data-s=\"3\">Понякога стойност в sink контекст не прави нищо полезно.<\/span> <span class=\"sg\" data-s=\"4\">Тогава Raku може да предупреди за „useless use“.<\/span> <span class=\"sg\" data-s=\"5\">Това е полезна подсказка, че сте забравили да използвате резултат.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато избирате сигил, <code>$<\/code> или <code>@<\/code>, всъщност избирате контекст.<\/span> <span class=\"sg\" data-s=\"1\">Когато е нужно, контекстуализаторите <code>$( )<\/code> и <code>@( )<\/code> ви позволяват да го промените.<\/span><\/p>"]]},"eo":{"t":"Era kaj lista kunteksto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du pliaj kuntekstoj decidas, ĉu io estas <strong>listo<\/strong> aŭ unuopa <strong>ero<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Listo havas plurajn valorojn.<\/span> <span class=\"sg\" data-s=\"2\">La sigeloj <code>@<\/code> kaj <code>$<\/code> baziĝas sur ĉi tiu diferenco.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En <em>lista kunteksto<\/em>, tabelo disvastiĝas en siajn elementojn.<\/span> <span class=\"sg\" data-s=\"1\">Buklo <code>for<\/code> metas sian argumenton en listan kuntekston, do ĝi iras tra ĉiu elemento:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En <em>era kunteksto<\/em>, la sama tabelo agas kiel unu sola valoro.<\/span> <span class=\"sg\" data-s=\"1\">La kuntekstigilo <code>$( … )<\/code> agordas eran kuntekston.<\/span> <span class=\"sg\" data-s=\"2\">Do nun la buklo vidas nur unu aferon kaj ruliĝas unufoje:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tio klarigas, kio okazas, kiam vi asignas tabelon al skalaro.<\/span> <span class=\"sg\" data-s=\"1\">La tabelo estas pakita en unuopan eron, kaj ĝiaj elementoj ne estas kopiitaj.<\/span> <span class=\"sg\" data-s=\"2\">La kialo estas, ke <code>my $x = @a<\/code> metas <code>@a<\/code> en eran kuntekston.<\/span> <span class=\"sg\" data-s=\"3\">Notu, ke tiu unuopa ero povas esti alia ujo kun multaj eroj en ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$var<\/code> estas skalara ujo, do ĝi nun tenas unuopan objekton.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu objekto estas <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas facile pruvi tion.<\/span> <span class=\"sg\" data-s=\"3\">Uzu <code>$var<\/code> kiel specon de tabela referenco, kiel aliaj lingvoj nomus ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĝia partnero, la kuntekstigilo <code>@( … )<\/code>, faras la malon kaj agordas listan kuntekston.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ <em>sink-kunteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la kunteksto de deklaro, kies valoro estas forĵetata.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, linio povas esti tie nur pro sia flanka efiko.<\/span> <span class=\"sg\" data-s=\"3\">Foje valoro en sink-kunteksto faras nenion utilan.<\/span> <span class=\"sg\" data-s=\"4\">Tiam Raku povas averti pri «senutila uzo».<\/span> <span class=\"sg\" data-s=\"5\">Tio estas utila sugesto, ke vi forgesis uzi rezulton.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi elektas sigelon, <code>$<\/code> aŭ <code>@<\/code>, vi vere elektas kuntekston.<\/span> <span class=\"sg\" data-s=\"1\">Kie necese, la kuntekstigiloj <code>$( )<\/code> kaj <code>@( )<\/code> permesas al vi ŝanĝi ĝin.<\/span><\/p>"]]},"la":{"t":"Elementalis et listae contextus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Duo alii contextus decernunt utrum aliquid sit <strong>lista<\/strong> an unum <strong>item<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Lista plures valores habet.<\/span> <span class=\"sg\" data-s=\"2\">Sigilla <code>@<\/code> et <code>$<\/code> in hac differentia nituntur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu listae<\/em> ordo in elementa sua expanditur.<\/span> <span class=\"sg\" data-s=\"1\">Ansa <code>for<\/code> argumentum suum in contextum listae ponit, itaque per singula elementa it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for @a;\nsay $count; # 3<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In <em>contextu item<\/em> idem ordo ut unus valor agit.<\/span> <span class=\"sg\" data-s=\"1\">Contextualiser <code>$( … )<\/code> contextum item ponit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque nunc ansa unam tantum rem videt et semel currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $count = 0;\n$count++ for $(@a);\nsay $count; # 1<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc explicat quid fiat cum ordinem scalari assignas.<\/span> <span class=\"sg\" data-s=\"1\">Ordo in unum item componitur, et elementa eius non copiantur.<\/span> <span class=\"sg\" data-s=\"2\">Causa est quod <code>my $x = @a<\/code> ordinem <code>@a<\/code> in contextum item ponit.<\/span> <span class=\"sg\" data-s=\"3\">Nota hoc unum item posse esse alium container cum multis itemis in eo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nmy $var = @a;\nsay $var;      # [1 2 3]\nsay $var.WHAT; # (Array)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$var<\/code> est container scalaris, itaque nunc unum obiectum tenet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc obiectum est <code>Array<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hoc facile probare potes.<\/span> <span class=\"sg\" data-s=\"3\">Adhibe <code>$var<\/code> ut genus referentiae ordinis, ut aliae linguae id vocant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $var[1]; # 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Socius eius, contextualiser <code>@( … )<\/code>, contrarium facit et contextum listae ponit.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Est etiam <em>contextus sink<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Est contextus enuntiati cuius valor abicitur.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, linea ibi esse potest solum propter effectum lateralem.<\/span> <span class=\"sg\" data-s=\"3\">Interdum valor in contextu sink nihil utile facit.<\/span> <span class=\"sg\" data-s=\"4\">Tum Raku monere potest de \"useless use\".<\/span> <span class=\"sg\" data-s=\"5\">Hoc est utile indicium te oblitum esse resultatum adhibere.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum sigillum eligis, <code>$<\/code> vel <code>@<\/code>, revera contextum eligis.<\/span> <span class=\"sg\" data-s=\"1\">Ubi opus est, contextualisers <code>$( )<\/code> et <code>@( )<\/code> tibi permittunt eum mutare.<\/span><\/p>"]]}}}</script>
