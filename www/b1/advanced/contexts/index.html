<script type="application/json" id="page-data">{"u":"advanced/contexts","n":382,"k":"section","pv":"advanced/ordered-containers/exercises/bind-a-scalar/solution","nx":"advanced/contexts/coercion-contexts","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Contexts","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A value in Raku can behave differently, depending on the <em>context<\/em> where you use it.<\/span> <span class=\"sg\" data-s=\"1\">For example, the same array can act as a number, which is its length.<\/span> <span class=\"sg\" data-s=\"2\">It can act as a string, with its elements joined together.<\/span> <span class=\"sg\" data-s=\"3\">Or it can act as a truth value, which shows whether the array is empty.<\/span> <span class=\"sg\" data-s=\"4\">It all depends on what the code around it asks for.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Context explains a lot of Raku that may otherwise look surprising.<\/span> <span class=\"sg\" data-s=\"1\">It explains why <code>+@array<\/code> is a number.<\/span> <span class=\"sg\" data-s=\"2\">It explains why an array in a scalar acts as a single item.<\/span> <span class=\"sg\" data-s=\"3\">And it explains why <code>if @array<\/code> checks whether the array is empty.<\/span> <span class=\"sg\" data-s=\"4\">This section covers the main contexts.<\/span><\/p>"]]},"de":{"t":"Kontexte","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Wert in Raku kann sich unterschiedlich verhalten, je nach dem <em>Kontext<\/em>, in dem du ihn benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kann sich dasselbe Array wie eine Zahl verhalten, und diese Zahl ist seine Länge.<\/span> <span class=\"sg\" data-s=\"2\">Es kann sich wie ein String verhalten, in dem seine Elemente verbunden sind.<\/span> <span class=\"sg\" data-s=\"3\">Oder es kann sich wie ein Wahrheitswert verhalten, der zeigt, ob das Array leer ist.<\/span> <span class=\"sg\" data-s=\"4\">Alles hängt davon ab, was der Code um das Array herum verlangt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der Kontext erklärt vieles in Raku, was sonst vielleicht überraschend aussieht.<\/span> <span class=\"sg\" data-s=\"1\">Er erklärt, warum <code>+@array<\/code> eine Zahl ist.<\/span> <span class=\"sg\" data-s=\"2\">Er erklärt, warum sich ein Array in einem Skalar wie ein einzelnes Element verhält.<\/span> <span class=\"sg\" data-s=\"3\">Und er erklärt, warum <code>if @array<\/code> prüft, ob das Array leer ist.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Abschnitt behandelt die wichtigsten Kontexte.<\/span><\/p>"]]},"nl":{"t":"Contexten","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een waarde in Raku kan zich anders gedragen, afhankelijk van de <em>context<\/em> waarin je hem gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Dezelfde array kan zich bijvoorbeeld gedragen als een getal, en dat getal is zijn lengte.<\/span> <span class=\"sg\" data-s=\"2\">Hij kan zich gedragen als een string, met zijn elementen aan elkaar.<\/span> <span class=\"sg\" data-s=\"3\">Of hij kan zich gedragen als een waarheidswaarde, die laat zien of de array leeg is.<\/span> <span class=\"sg\" data-s=\"4\">Het hangt allemaal af van wat de code eromheen vraagt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Context verklaart veel van Raku dat anders misschien verrassend lijkt.<\/span> <span class=\"sg\" data-s=\"1\">Het verklaart waarom <code>+@array<\/code> een getal is.<\/span> <span class=\"sg\" data-s=\"2\">Het verklaart waarom een array in een scalar zich als een enkel item gedraagt.<\/span> <span class=\"sg\" data-s=\"3\">En het verklaart waarom <code>if @array<\/code> controleert of de array leeg is.<\/span> <span class=\"sg\" data-s=\"4\">Dit gedeelte behandelt de belangrijkste contexten.<\/span><\/p>"]]},"es":{"t":"Contextos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un valor en Raku puede comportarse de forma diferente, según el <em>contexto<\/em> donde lo usas.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, el mismo array puede actuar como un número, que es su longitud.<\/span> <span class=\"sg\" data-s=\"2\">Puede actuar como una cadena, con sus elementos unidos.<\/span> <span class=\"sg\" data-s=\"3\">O puede actuar como un valor de verdad, que muestra si el array está vacío.<\/span> <span class=\"sg\" data-s=\"4\">Todo depende de lo que pide el código que lo rodea.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El contexto explica mucho de Raku que, sin él, puede parecer sorprendente.<\/span> <span class=\"sg\" data-s=\"1\">Explica por qué <code>+@array<\/code> es un número.<\/span> <span class=\"sg\" data-s=\"2\">Explica por qué un array en un escalar actúa como un solo elemento.<\/span> <span class=\"sg\" data-s=\"3\">Y explica por qué <code>if @array<\/code> comprueba si el array está vacío.<\/span> <span class=\"sg\" data-s=\"4\">Esta sección trata los contextos principales.<\/span><\/p>"]]},"it":{"t":"Contesti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un valore in Raku può comportarsi in modo diverso, a seconda del <em>contesto<\/em> in cui lo usi.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, lo stesso array può agire come un numero, che è la sua lunghezza.<\/span> <span class=\"sg\" data-s=\"2\">Può agire come una stringa, con i suoi elementi uniti insieme.<\/span> <span class=\"sg\" data-s=\"3\">Oppure può agire come un valore di verità, che mostra se l'array è vuoto.<\/span> <span class=\"sg\" data-s=\"4\">Tutto dipende da quello che chiede il codice intorno all'array.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il contesto spiega molte cose di Raku che altrimenti potrebbero sembrare sorprendenti.<\/span> <span class=\"sg\" data-s=\"1\">Spiega perché <code>+@array<\/code> è un numero.<\/span> <span class=\"sg\" data-s=\"2\">Spiega perché un array in uno scalare agisce come un singolo elemento.<\/span> <span class=\"sg\" data-s=\"3\">E spiega perché <code>if @array<\/code> controlla se l'array è vuoto.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione tratta i contesti principali.<\/span><\/p>"]]},"lv":{"t":"Konteksti 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vērtība Raku valodā var uzvesties dažādi atkarībā no <em>konteksta<\/em>, kurā jūs to izmantojat.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, tas pats masīvs var darboties kā skaitlis, kas ir tā garums.<\/span> <span class=\"sg\" data-s=\"2\">Tas var darboties kā virkne, kurā tā elementi ir savienoti kopā.<\/span> <span class=\"sg\" data-s=\"3\">Vai arī tas var darboties kā patiesuma vērtība, kas parāda, vai masīvs ir tukšs.<\/span> <span class=\"sg\" data-s=\"4\">Viss ir atkarīgs no tā, ko pieprasa kods ap to.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Konteksts izskaidro daudz ko Raku valodā, kas citādi varētu izskatīties pārsteidzoši.<\/span> <span class=\"sg\" data-s=\"1\">Tas izskaidro, kāpēc <code>+@array<\/code> ir skaitlis.<\/span> <span class=\"sg\" data-s=\"2\">Tas izskaidro, kāpēc masīvs skalārā darbojas kā viens elements.<\/span> <span class=\"sg\" data-s=\"3\">Un tas izskaidro, kāpēc <code>if @array<\/code> pārbauda, vai masīvs ir tukšs.<\/span> <span class=\"sg\" data-s=\"4\">Šī sadaļa aplūko galvenos kontekstus.<\/span><\/p>"]]},"ru":{"t":"Контексты","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Значение в Raku может вести себя по-разному в зависимости от <em>контекста<\/em>, где вы его используете.<\/span> <span class=\"sg\" data-s=\"1\">Например, один и тот же массив может вести себя как число, и это число — его длина.<\/span> <span class=\"sg\" data-s=\"2\">Он может вести себя как строка, в которой его элементы соединены вместе.<\/span> <span class=\"sg\" data-s=\"3\">Или он может вести себя как логическое значение, которое показывает, пуст ли массив.<\/span> <span class=\"sg\" data-s=\"4\">Всё зависит от того, что нужно коду вокруг него.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Контекст объясняет многое в Raku, что иначе может показаться странным.<\/span> <span class=\"sg\" data-s=\"1\">Он объясняет, почему <code>+@array<\/code> — это число.<\/span> <span class=\"sg\" data-s=\"2\">Он объясняет, почему массив в скаляре ведёт себя как один элемент.<\/span> <span class=\"sg\" data-s=\"3\">И он объясняет, почему <code>if @array<\/code> проверяет, пуст ли массив.<\/span> <span class=\"sg\" data-s=\"4\">В этом разделе мы рассмотрим основные контексты.<\/span><\/p>"]]},"uk":{"t":"Контексти","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Значення в Raku може поводитися по-різному, залежно від <em>контексту<\/em>, де ви його використовуєте.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, той самий масив може поводитися як число, тобто як його довжина.<\/span> <span class=\"sg\" data-s=\"2\">Він може поводитися як рядок, де його елементи з'єднано разом.<\/span> <span class=\"sg\" data-s=\"3\">Або він може поводитися як логічне значення, яке показує, чи порожній масив.<\/span> <span class=\"sg\" data-s=\"4\">Усе залежить від того, чого просить код навколо нього.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Контекст пояснює багато речей у Raku, які інакше можуть здивувати.<\/span> <span class=\"sg\" data-s=\"1\">Він пояснює, чому <code>+@array<\/code> є числом.<\/span> <span class=\"sg\" data-s=\"2\">Він пояснює, чому масив у скалярі поводиться як один елемент.<\/span> <span class=\"sg\" data-s=\"3\">І він пояснює, чому <code>if @array<\/code> перевіряє, чи масив порожній.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ розглядає основні контексти.<\/span><\/p>"]]},"bg":{"t":"Контексти 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Стойност в Raku може да се държи различно в зависимост от <em>контекста<\/em>, в който я използвате.<\/span> <span class=\"sg\" data-s=\"1\">Например един и същ масив може да действа като число, което е неговата дължина.<\/span> <span class=\"sg\" data-s=\"2\">Той може да действа като низ, като елементите му са съединени.<\/span> <span class=\"sg\" data-s=\"3\">Или може да действа като истинностна стойност, която показва дали масивът е празен.<\/span> <span class=\"sg\" data-s=\"4\">Всичко зависи от това какво иска кодът около него.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Контекстът обяснява много неща в Raku, които иначе може да изглеждат изненадващо.<\/span> <span class=\"sg\" data-s=\"1\">Той обяснява защо <code>+@array<\/code> е число.<\/span> <span class=\"sg\" data-s=\"2\">Обяснява защо масив в скалар се държи като единичен елемент.<\/span> <span class=\"sg\" data-s=\"3\">Обяснява и защо <code>if @array<\/code> проверява дали масивът е празен.<\/span> <span class=\"sg\" data-s=\"4\">Този раздел разглежда основните контексти.<\/span><\/p>"]]},"eo":{"t":"Kuntekstoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Valoro en Raku povas konduti malsame, depende de la <em>kunteksto<\/em>, kie vi uzas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, la sama tabelo povas agi kiel nombro, kiu estas ĝia longo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas agi kiel ĉeno, kun ĝiaj elementoj kunigitaj.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ ĝi povas agi kiel logika valoro, kiu montras, ĉu la tabelo estas malplena.<\/span> <span class=\"sg\" data-s=\"4\">Ĉio dependas de tio, kion la kodo ĉirkaŭ ĝi petas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kunteksto klarigas multon en Raku, kio alie povus aspekti surpriza.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi klarigas, kial <code>+@array<\/code> estas nombro.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi klarigas, kial tabelo en skalaro agas kiel unuopa ero.<\/span> <span class=\"sg\" data-s=\"3\">Kaj ĝi klarigas, kial <code>if @array<\/code> kontrolas, ĉu la tabelo estas malplena.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio traktas la ĉefajn kuntekstojn.<\/span><\/p>"]]},"la":{"t":"Contextus","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Valor in Raku aliter se gerere potest, pro <em>contextu<\/em> ubi eum adhibes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, idem ordo ut numerus agere potest, qui est longitudo eius.<\/span> <span class=\"sg\" data-s=\"2\">Ut chorda agere potest, cum elementis eius coniunctis.<\/span> <span class=\"sg\" data-s=\"3\">Vel ut valor veritatis agere potest, qui ostendit an ordo vacuus sit.<\/span> <span class=\"sg\" data-s=\"4\">Omnia pendent ex eo quod codex circa eum postulat.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Contextus multa in Raku explicat quae aliter mira videri possunt.<\/span> <span class=\"sg\" data-s=\"1\">Explicat cur <code>+@array<\/code> numerus sit.<\/span> <span class=\"sg\" data-s=\"2\">Explicat cur ordo in scalari ut unum item se gerat.<\/span> <span class=\"sg\" data-s=\"3\">Et explicat cur <code>if @array<\/code> probet an ordo vacuus sit.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio praecipuos contextus tractat.<\/span><\/p>"]]}}}</script>
