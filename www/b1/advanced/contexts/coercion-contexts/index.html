<script type="application/json" id="page-data">{"u":"advanced/contexts/coercion-contexts","n":383,"k":"topic","pv":"advanced/contexts","nx":"advanced/contexts/coercion-contexts/quiz","tr":["advanced","advanced/contexts"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Numeric, string, and Boolean context","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Three contexts are very common.<\/span> <span class=\"sg\" data-s=\"1\">They make a value behave as a number, a string, or a Boolean value.<\/span> <span class=\"sg\" data-s=\"2\">For each of them, there is a prefix operator that sets the context directly:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numeric context<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — string context<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolean context<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With an array, <code>+<\/code> gives its length, and <code>~<\/code> gives its elements joined by spaces.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> shows whether the array has any elements at all:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An empty array gives <code>0<\/code> in numeric context and <code>False<\/code> in Boolean context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You do not always need to write these operators yourself.<\/span> <span class=\"sg\" data-s=\"1\">Raku can set the right context for you.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetic puts its values in numeric context, and joining strings puts them in string context.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code>, and <code>and<\/code>/<code>or<\/code> put their condition in Boolean context:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So <code>if @array { … }<\/code> works just as you would expect.<\/span> <span class=\"sg\" data-s=\"1\">An array that is not empty is true.<\/span> <span class=\"sg\" data-s=\"2\">The prefix operators are a way to ask for the same conversions directly.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Together with a postfix <code>if<\/code>, this lets you write short and clear code:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"de":{"t":"Numerischer, String- und Boolescher Kontext","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Drei Kontexte sind sehr häufig.<\/span> <span class=\"sg\" data-s=\"1\">Durch sie verhält sich ein Wert wie eine Zahl, wie ein String oder wie ein Boolescher Wert.<\/span> <span class=\"sg\" data-s=\"2\">Für jeden von ihnen gibt es einen Präfixoperator, der den Kontext direkt setzt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — numerischer Kontext<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — Stringkontext<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Boolescher Kontext<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei einem Array liefert <code>+<\/code> seine Länge, und <code>~<\/code> liefert seine Elemente, verbunden durch Leerzeichen.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> zeigt, ob das Array überhaupt Elemente hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein leeres Array ergibt im numerischen Kontext <code>0<\/code> und im Booleschen Kontext <code>False<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du musst diese Operatoren nicht immer selbst schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Raku kann den richtigen Kontext für dich setzen.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetik setzt ihre Werte in den numerischen Kontext, und das Verbinden von Strings setzt sie in den Stringkontext.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> und <code>and<\/code>/<code>or<\/code> setzen ihre Bedingung in den Booleschen Kontext:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Also funktioniert <code>if @array { … }<\/code> genau so, wie du es erwarten würdest.<\/span> <span class=\"sg\" data-s=\"1\">Ein Array, das nicht leer ist, ist wahr.<\/span> <span class=\"sg\" data-s=\"2\">Die Präfixoperatoren sind ein Weg, dieselben Umwandlungen direkt zu verlangen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zusammen mit einem nachgestellten <code>if<\/code> kannst du so kurzen und klaren Code schreiben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"nl":{"t":"Numerieke, string- en Booleaanse context","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Drie contexten komen heel vaak voor.<\/span> <span class=\"sg\" data-s=\"1\">Daarin gedraagt een waarde zich als een getal, een string of een Booleaanse waarde.<\/span> <span class=\"sg\" data-s=\"2\">Voor elk ervan is er een prefix-operator die de context direct instelt:<\/span><\/p>"],["lis sto numerico e <code>False<\/code> in contesto Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Non devi sempre scrivere questi operatori tu stesso.<\/span> <span class=\"sg\" data-s=\"1\">Raku può impostare il contesto giusto per te.<\/span> <span class=\"sg\" data-s=\"2\">L'aritmetica mette i suoi valori in contesto numerico, e l'unione di stringhe li mette in contesto stringa.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> e <code>and<\/code>/<code>or<\/code> mettono la loro condizione in contesto Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>if @array { … }<\/code> funziona proprio come ti aspetteresti.<\/span> <span class=\"sg\" data-s=\"1\">Un array che non è vuoto è vero.<\/span> <span class=\"sg\" data-s=\"2\">Gli operatori prefisso sono un modo per chiedere le stesse conversioni direttamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Insieme a un <code>if<\/code> postfisso, questo ti permette di scrivere codice breve e chiaro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"lv":{"t":"Skaitliskais, virkņu un Būla konteksts","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Trīs konteksti ir ļoti bieži.<\/span> <span class=\"sg\" data-s=\"1\">Tie liek vērtībai uzvesties kā skaitlim, virknei vai Būla vērtībai.<\/span> <span class=\"sg\" data-s=\"2\">Katram no tiem ir prefiksa operators, kas tieši uzliek kontekstu:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — skaitliskais konteksts<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — virknes konteksts<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — Būla konteksts<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar masīvu <code>+<\/code> dod tā garumu, bet <code>~<\/code> dod tā elementus, savienotus ar atstarpēm.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> parāda, vai masīvā vispār ir kādi elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tukšs masīvs dod <code>0<\/code> skaitliskajā kontekstā un <code>False<\/code> Būla kontekstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jums ne vienmēr ir jāraksta šie operatori pašiem.<\/span> <span class=\"sg\" data-s=\"1\">Raku var uzlikt pareizo kontekstu jūsu vietā.<\/span> <span class=\"sg\" data-s=\"2\">Aritmētika ievieto savas vērtības skaitliskajā kontekstā, bet virkņu savienošana tās ievieto virknes kontekstā.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> un <code>and<\/code>/<code>or<\/code> ievieto savu nosacījumu Būla kontekstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>if @array { … }<\/code> darbojas tieši tā, kā jūs gaidītu.<\/span> <span class=\"sg\" data-s=\"1\">Masīvs, kas nav tukšs, ir patiess.<\/span> <span class=\"sg\" data-s=\"2\">Prefiksa operatori ir veids, kā tieši prasīt tās pašas pārvēršanas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kopā ar postfiksa <code>if<\/code> tas ļauj rakstīt īsu un skaidru kodu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"ru":{"t":"Числовой, строковый и булев контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Три контекста встречаются очень часто.<\/span> <span class=\"sg\" data-s=\"1\">Они заставляют значение вести себя как число, строка или логическое значение.<\/span> <span class=\"sg\" data-s=\"2\">Для каждого из них есть префиксный оператор, который прямо задаёт контекст:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовой контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — строковый контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — логический контекст<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С массивом <code>+<\/code> даёт его длину, а <code>~<\/code> даёт его элементы, соединённые через пробел.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> показывает, есть ли в массиве хоть какие-то элементы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пустой массив даёт <code>0<\/code> в числовом контексте и <code>False<\/code> в логическом контексте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вам не всегда нужно писать эти операторы самим.<\/span> <span class=\"sg\" data-s=\"1\">Raku может сам задать нужный контекст.<\/span> <span class=\"sg\" data-s=\"2\">Арифметика помещает свои значения в числовой контекст, а соединение строк помещает их в строковый контекст.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> и <code>and<\/code>/<code>or<\/code> помещают своё условие в логический контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поэтому <code>if @array { … }<\/code> работает именно так, как вы ожидаете.<\/span> <span class=\"sg\" data-s=\"1\">Массив, который не пуст, считается истинным.<\/span> <span class=\"sg\" data-s=\"2\">Префиксные операторы — это способ прямо попросить те же преобразования.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вместе с постфиксным <code>if<\/code> это позволяет писать короткий и понятный код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"uk":{"t":"Числовий, рядковий та булевий контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Три контексти трапляються дуже часто.<\/span> <span class=\"sg\" data-s=\"1\">Вони змушують значення поводитися як число, як рядок або як булеве значення.<\/span> <span class=\"sg\" data-s=\"2\">Для кожного з них є префіксний оператор, який прямо задає контекст:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числовий контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — рядковий контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булевий контекст<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З масивом <code>+<\/code> дає його довжину, а <code>~<\/code> дає його елементи, з'єднані пробілами.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> показує, чи є в масиві взагалі якісь елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Порожній масив дає <code>0<\/code> у числовому контексті та <code>False<\/code> у булевому контексті:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вам не завжди потрібно писати ці оператори самостійно.<\/span> <span class=\"sg\" data-s=\"1\">Raku може задати потрібний контекст за вас.<\/span> <span class=\"sg\" data-s=\"2\">Арифметика ставить свої значення в числовий контекст, а з'єднання рядків ставить їх у рядковий.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> та <code>and<\/code>/<code>or<\/code> ставлять свою умову в булевий контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, тут @a це його довжина: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тож <code>if @array { … }<\/code> працює саме так, як ви й очікуєте.<\/span> <span class=\"sg\" data-s=\"1\">Масив, який не порожній, є істинним.<\/span> <span class=\"sg\" data-s=\"2\">Префіксні оператори — це спосіб прямо попросити ті самі перетворення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разом із постфіксним <code>if<\/code> це дозволяє писати короткий і зрозумілий код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"bg":{"t":"Числов, низов и булев контекст","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Три контекста са много чести.<\/span> <span class=\"sg\" data-s=\"1\">Те карат стойността да се държи като число, низ или булева стойност.<\/span> <span class=\"sg\" data-s=\"2\">За всеки от тях има префиксен оператор, който задава контекста направо:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — числов контекст<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — низов контекст<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — булев контекст<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">При масив <code>+<\/code> дава дължината му, а <code>~<\/code> дава елементите му, съединени с интервали.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> показва дали масивът изобщо има елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Празен масив дава <code>0<\/code> в числов контекст и <code>False<\/code> в булев контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Не е нужно винаги сами да пишете тези оператори.<\/span> <span class=\"sg\" data-s=\"1\">Raku може да зададе правилния контекст вместо вас.<\/span> <span class=\"sg\" data-s=\"2\">Аритметиката поставя стойностите си в числов контекст, а съединяването на низове ги поставя в низов контекст.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code> и <code>and<\/code>/<code>or<\/code> поставят условието си в булев контекст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Така <code>if @array { … }<\/code> работи точно както бихте очаквали.<\/span> <span class=\"sg\" data-s=\"1\">Масив, който не е празен, е истина.<\/span> <span class=\"sg\" data-s=\"2\">Префиксните оператори са начин да поискате същите преобразувания направо.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Заедно с постфиксен <code>if<\/code> това ви позволява да пишете кратък и ясен код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"eo":{"t":"Nombra, ĉena kaj Boolea kunteksto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tri kuntekstoj estas tre oftaj.<\/span> <span class=\"sg\" data-s=\"1\">Ili igas valoron konduti kiel nombro, ĉeno aŭ bulea valoro.<\/span> <span class=\"sg\" data-s=\"2\">Por ĉiu el ili, ekzistas prefiksa operatoro, kiu rekte agordas la kuntekston:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — nombra kunteksto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — ĉena kunteksto<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — bulea kunteksto<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kun tabelo, <code>+<\/code> donas ĝian longon, kaj <code>~<\/code> donas ĝiajn elementojn kunigitajn per spacoj.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> montras, ĉu la tabelo entute havas elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Malplena tabelo donas <code>0<\/code> en nombra kunteksto kaj <code>False<\/code> en bulea kunteksto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ne ĉiam bezonas mem skribi ĉi tiujn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Raku povas agordi la ĝustan kuntekston por vi.<\/span> <span class=\"sg\" data-s=\"2\">Aritmetiko metas siajn valorojn en nombran kuntekston, kaj kunigo de ĉenoj metas ilin en ĉenan kuntekston.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code>, kaj <code>and<\/code>/<code>or<\/code> metas sian kondiĉon en bulean kuntekston:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Do <code>if @array { … }<\/code> funkcias ĝuste tiel, kiel vi atendus.<\/span> <span class=\"sg\" data-s=\"1\">Tabelo, kiu ne estas malplena, estas vera.<\/span> <span class=\"sg\" data-s=\"2\">La prefiksaj operatoroj estas maniero rekte peti la samajn konvertojn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kune kun postfiksa <code>if<\/code>, tio ebligas al vi skribi mallongan kaj klaran kodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]},"la":{"t":"Numericus, catenarius, et Booleanus contextus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tres contextus valde frequentes sunt.<\/span> <span class=\"sg\" data-s=\"1\">In eis valor se gerit ut numerus, chorda, vel valor Booleanus.<\/span> <span class=\"sg\" data-s=\"2\">Pro quoque eorum est operator praefixus qui contextum directe ponit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>+<\/code> — contextus numericus<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>~<\/code> — contextus chordae<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>?<\/code> — contextus Booleanus<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum ordine, <code>+<\/code> longitudinem eius dat, et <code>~<\/code> elementa eius spatiis coniuncta dat.<\/span> <span class=\"sg\" data-s=\"1\"><code>?<\/code> ostendit an ordo omnino ulla elementa habeat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay +@a; # 3\nsay ~@a; # 1 2 3\nsay ?@a; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ordo vacuus <code>0<\/code> dat in contextu numerico et <code>False<\/code> in contextu Booleano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @empty;\nsay +@empty; # 0\nsay ?@empty; # False<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Non semper necesse est hos operatores ipse scribere.<\/span> <span class=\"sg\" data-s=\"1\">Raku rectum contextum pro te ponere potest.<\/span> <span class=\"sg\" data-s=\"2\">Arithmetica valores suos in contextum numericum ponit, et coniunctio chordarum eos in contextum chordae ponit.<\/span> <span class=\"sg\" data-s=\"3\"><code>if<\/code>, <code>while<\/code>, et <code>and<\/code>/<code>or<\/code> condicionem suam in contextum Booleanum ponunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\n\nsay 10 + @a;              # 13, here @a is its length: 3\nsay 'items: ' ~ @a;       # items: 1 2 3\nif @a { say 'not empty' } # not empty<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>if @array { … }<\/code> operatur prorsus ut exspectas.<\/span> <span class=\"sg\" data-s=\"1\">Ordo qui non vacuus est verus est.<\/span> <span class=\"sg\" data-s=\"2\">Per operatores praefixos easdem conversiones directe petere potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum postfixo <code>if<\/code>, hoc tibi permittit codicem brevem et clarum scribere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say \"{+@a} items are there\" if @a; # 3 items are there<\/code><\/pre>"]]}}}</script>
