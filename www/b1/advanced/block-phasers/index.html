<script type="application/json" id="page-data">{"u":"advanced/block-phasers","n":588,"k":"section","pv":"advanced/phasers/quiz","nx":"advanced/block-phasers/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Block-related phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku has phasers for the whole program, but it also has other ones.<\/span> <span class=\"sg\" data-s=\"1\">These phasers are linked to the life of a single block or loop.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entering and leaving a block<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>ENTER<\/code> phaser runs each time the program enters a block.<\/span> <span class=\"sg\" data-s=\"1\">The <code>LEAVE<\/code> phaser runs each time it leaves the block.<\/span> <span class=\"sg\" data-s=\"2\">It does not matter on which line you write them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The output shows that <code>ENTER<\/code> runs first and <code>LEAVE<\/code> runs last.<\/span> <span class=\"sg\" data-s=\"1\">The body of the block runs between them:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is especially useful because it runs even if the block ends early.<\/span> <span class=\"sg\" data-s=\"1\">This makes it a reliable place to free a resource.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A phaser can take a full <code>{ }<\/code> block instead of one statement.<\/span> <span class=\"sg\" data-s=\"1\">You can also have several of them.<\/span> <span class=\"sg\" data-s=\"2\">When a block has more than one <code>LEAVE<\/code>, they run in reverse order.<\/span> <span class=\"sg\" data-s=\"3\">The last one that was set up runs first.<\/span> <span class=\"sg\" data-s=\"4\">So the block works like a stack, from the top down:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program opens resource <code>A<\/code> first and closes it last:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This “last in, first out” order is exactly what you need for cleanup.<\/span> <span class=\"sg\" data-s=\"1\">The thing that you set up last is removed first.<\/span> <span class=\"sg\" data-s=\"2\">The <code>END<\/code> phaser of the whole program works in the same way.<\/span> <span class=\"sg\" data-s=\"3\">Several <code>END<\/code> blocks also run in the reverse order of how they were written.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Loop phasers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Inside loops, there are three more phasers for the stages of the loop.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> runs once before the first pass, and <code>LAST<\/code> runs once after the last one.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> runs at the end of each pass:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is the output of the loop:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Like other phasers, <code>FIRST<\/code>, <code>NEXT<\/code> and <code>LAST<\/code> can be anywhere in the code.<\/span> <span class=\"sg\" data-s=\"1\">Each of them runs at its own moment.<\/span><\/p>"]]},"de":{"t":"Block-bezogene Phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku hat Phaser für das ganze Programm, aber auch noch andere.<\/span> <span class=\"sg\" data-s=\"1\">Diese Phaser sind an das Leben eines einzelnen Blocks oder einer Schleife gebunden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Einen Block betreten und verlassen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der <code>ENTER<\/code>-Phaser läuft jedes Mal, wenn das Programm einen Block betritt.<\/span> <span class=\"sg\" data-s=\"1\">Der <code>LEAVE<\/code>-Phaser läuft jedes Mal, wenn es den Block verlässt.<\/span> <span class=\"sg\" data-s=\"2\">Es ist egal, in welche Zeile du sie schreibst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe zeigt, dass <code>ENTER<\/code> zuerst und <code>LEAVE<\/code> zuletzt läuft.<\/span> <span class=\"sg\" data-s=\"1\">Der Rumpf des Blocks läuft dazwischen:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ist besonders nützlich, weil er auch dann läuft, wenn der Block früh endet.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb ist er ein zuverlässiger Ort, um eine Ressource freizugeben.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Phaser kann statt einer Anweisung einen ganzen <code>{ }<\/code>-Block enthalten.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst auch mehrere davon haben.<\/span> <span class=\"sg\" data-s=\"2\">Wenn ein Block mehr als einen <code>LEAVE<\/code> hat, laufen sie in umgekehrter Reihenfolge.<\/span> <span class=\"sg\" data-s=\"3\">Der letzte, den du eingerichtet hast, läuft zuerst.<\/span> <span class=\"sg\" data-s=\"4\">Also funktioniert der Block wie ein Stapel, von oben nach unten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm öffnet Ressource <code>A<\/code> zuerst und schließt sie zuletzt:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diese Reihenfolge nach „last in, first out“ ist genau das, was du zum Aufräumen brauchst.<\/span> <span class=\"sg\" data-s=\"1\">Was du zuletzt eingerichtet hast, wird zuerst entfernt.<\/span> <span class=\"sg\" data-s=\"2\">Der <code>END<\/code>-Phaser des ganzen Programms funktioniert genauso.<\/span> <span class=\"sg\" data-s=\"3\">Auch mehrere <code>END<\/code>-Blöcke laufen umgekehrt zu der Reihenfolge, in der sie im Code stehen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Schleifen-Phaser<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In Schleifen gibt es drei weitere Phaser für die Phasen der Schleife.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> läuft einmal vor dem ersten Durchlauf, und <code>LAST<\/code> läuft einmal nach dem letzten.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> läuft am Ende jedes Durchlaufs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist die Ausgabe der Schleife:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie andere Phaser können <code>FIRST<\/code>, <code>NEXT<\/code> und <code>LAST<\/code> überall im Code stehen.<\/span> <span class=\"sg\" data-s=\"1\">Jeder von ihnen läuft zu seinem eigenen Zeitpunkt.<\/span><\/p>"]]},"nl":{"t":"Blokgerelateerde phasers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku heeft phasers voor het hele programma, maar er zijn ook andere.<\/span> <span class=\"sg\" data-s=\"1\">Deze phasers zijn gekoppeld aan het leven van één blok of één lus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een blok betreden en verlaten<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>ENTER<\/code>-phaser draait elke keer als het programma een blok binnengaat.<\/span> <span class=\"sg\" data-s=\"1\">De <code>LEAVE<\/code>-phaser draait elke keer als het programma het blok weer verlaat.<\/span> <span class=\"sg\" data-s=\"2\">Het maakt niet uit op welke regel je ze schrijft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De uitvoer laat zien dat <code>ENTER<\/code> als eerste draait en <code>LEAVE<\/code> als laatste.<\/span> <span class=\"sg\" data-s=\"1\">De body van het blok draait daartussen:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> is vooral handig, omdat hij ook draait als het blok vroeg eindigt.<\/span> <span class=\"sg\" data-s=\"1\">Daardoor is het een betrouwbare plek om een resource vrij te geven.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een phaser kan een volledig <code>{ }<\/code>-blok hebben in plaats van één instructie.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er ook meerdere hebben.<\/span> <span class=\"sg\" data-s=\"2\">Als een blok meer dan één <code>LEAVE<\/code> heeft, draaien ze in omgekeerde volgorde.<\/span> <span class=\"sg\" data-s=\"3\">De laatste die je hebt ingesteld, draait als eerste.<\/span> <span class=\"sg\" data-s=\"4\">Het blok werkt dus als een stapel, van boven naar beneden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma opent resource <code>A<\/code> als eerste en sluit die als laatste:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Deze \"last in, first out\"-volgorde is precies wat je nodig hebt voor opruimwerk.<\/span> <span class=\"sg\" data-s=\"1\">Wat je het laatst hebt opgezet, wordt als eerste opgeruimd.<\/span> <span class=\"sg\" data-s=\"2\">De <code>END<\/code>-phaser van het hele programma werkt op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"3\">Meerdere <code>END<\/code>-blokken draaien ook in de omgekeerde volgorde van hoe ze geschreven zijn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lus-phasers<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Binnen lussen zijn er nog drie phasers voor de fasen van de lus.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> draait één keer vóór de eerste ronde, en <code>LAST<\/code> draait één keer na de laatste.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> draait aan het einde van elke ronde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is de uitvoer van de lus:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als andere phasers kunnen <code>FIRST<\/code>, <code>NEXT<\/code> en <code>LAST<\/code> overal in de code staan.<\/span> <span class=\"sg\" data-s=\"1\">Elk van hen draait op zijn eigen moment.<\/span><\/p>"]]},"es":{"t":"Phasers de bloque","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku tiene phasers para todo el programa, pero también tiene otros.<\/span> <span class=\"sg\" data-s=\"1\">Estos phasers están unidos a la vida de un solo bloque o bucle.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrada y salida de un bloque<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El phaser <code>ENTER<\/code> se ejecuta cada vez que el programa entra en un bloque.<\/span> <span class=\"sg\" data-s=\"1\">El phaser <code>LEAVE<\/code> se ejecuta cada vez que sale del bloque.<\/span> <span class=\"sg\" data-s=\"2\">No importa en qué línea los escribas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La salida muestra que <code>ENTER<\/code> se ejecuta primero y <code>LEAVE<\/code> se ejecuta al final.<\/span> <span class=\"sg\" data-s=\"1\">El cuerpo del bloque se ejecuta entre los dos:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> es especialmente útil porque se ejecuta incluso si el bloque termina antes de tiempo.<\/span> <span class=\"sg\" data-s=\"1\">Por eso es un lugar confiable para liberar un recurso.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un phaser puede tomar un bloque <code>{ }<\/code> completo en lugar de una sola sentencia.<\/span> <span class=\"sg\" data-s=\"1\">También puedes tener varios.<\/span> <span class=\"sg\" data-s=\"2\">Cuando un bloque tiene más de un <code>LEAVE<\/code>, se ejecutan en orden inverso.<\/span> <span class=\"sg\" data-s=\"3\">El último que se preparó se ejecuta primero.<\/span> <span class=\"sg\" data-s=\"4\">Así, el bloque funciona como una pila, de arriba abajo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa abre primero el recurso <code>A<\/code> y lo cierra al final:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Este orden de «último en entrar, primero en salir» es justo lo que necesitas para la limpieza.<\/span> <span class=\"sg\" data-s=\"1\">Lo que preparaste al final se quita primero.<\/span> <span class=\"sg\" data-s=\"2\">El phaser <code>END<\/code> de todo el programa funciona de la misma manera.<\/span> <span class=\"sg\" data-s=\"3\">Varios bloques <code>END<\/code> también se ejecutan en el orden inverso al que se escribieron.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phasers de bucle<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro de los bucles hay tres phasers más para las etapas del bucle.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> se ejecuta una vez antes de la primera vuelta, y <code>LAST<\/code> se ejecuta una vez después de la última.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> se ejecuta al final de cada vuelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta es la salida del bucle:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como otros phasers, <code>FIRST<\/code>, <code>NEXT<\/code> y <code>LAST<\/code> pueden estar en cualquier lugar del código.<\/span> <span class=\"sg\" data-s=\"1\">Cada uno se ejecuta en su propio momento.<\/span><\/p>"]]},"it":{"t":"Phaser di blocco","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku ha phaser per tutto il programma, ma ne ha anche altri.<\/span> <span class=\"sg\" data-s=\"1\">Questi phaser sono legati alla vita di un singolo blocco o ciclo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Entrare e uscire da un blocco<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il phaser <code>ENTER<\/code> viene eseguito ogni volta che il programma entra in un blocco.<\/span> <span class=\"sg\" data-s=\"1\">Il phaser <code>LEAVE<\/code> viene eseguito ogni volta che ne esce.<\/span> <span class=\"sg\" data-s=\"2\">Non importa su quale riga li scrivi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'output mostra che <code>ENTER<\/code> viene eseguito per primo e <code>LEAVE<\/code> per ultimo.<\/span> <span class=\"sg\" data-s=\"1\">Il corpo del blocco viene eseguito tra i due:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> è particolarmente utile perché viene eseguito anche se il blocco finisce in anticipo.<\/span> <span class=\"sg\" data-s=\"1\">Questo lo rende un posto affidabile per liberare una risorsa.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un phaser può contenere un intero blocco <code>{ }<\/code> invece di una sola istruzione.<\/span> <span class=\"sg\" data-s=\"1\">Puoi anche averne diversi.<\/span> <span class=\"sg\" data-s=\"2\">Quando un blocco ha più di un <code>LEAVE<\/code>, questi vengono eseguiti in ordine inverso.<\/span> <span class=\"sg\" data-s=\"3\">L'ultimo che è stato impostato viene eseguito per primo.<\/span> <span class=\"sg\" data-s=\"4\">Così il blocco funziona come uno stack, dall'alto verso il basso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma apre per prima la risorsa <code>A<\/code> e la chiude per ultima:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo ordine “last in, first out” è proprio quello che serve per la pulizia.<\/span> <span class=\"sg\" data-s=\"1\">La cosa che prepari per ultima viene tolta per prima.<\/span> <span class=\"sg\" data-s=\"2\">Il phaser <code>END<\/code> di tutto il programma funziona allo stesso modo.<\/span> <span class=\"sg\" data-s=\"3\">Anche più blocchi <code>END<\/code> vengono eseguiti nell'ordine inverso a quello in cui sono stati scritti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaser dei cicli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nei cicli ci sono altri tre phaser per le fasi del ciclo.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> viene eseguito una volta prima del primo passaggio, e <code>LAST<\/code> una volta dopo l'ultimo.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> viene eseguito alla fine di ogni passaggio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo è l'output del ciclo:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come gli altri phaser, <code>FIRST<\/code>, <code>NEXT<\/code> e <code>LAST<\/code> possono stare in qualsiasi punto del codice.<\/span> <span class=\"sg\" data-s=\"1\">Ognuno di loro viene eseguito al proprio momento.<\/span><\/p>"]]},"lv":{"t":"Bloku fāzeri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir fāzeri visai programmai, bet ir arī citi.<\/span> <span class=\"sg\" data-s=\"1\">Šie fāzeri ir saistīti ar viena bloka vai cikla dzīvi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ieiešana blokā un iziešana no tā<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fāzeris <code>ENTER<\/code> izpildās katru reizi, kad programma ieiet blokā.<\/span> <span class=\"sg\" data-s=\"1\">Fāzeris <code>LEAVE<\/code> izpildās katru reizi, kad tā atstāj bloku.<\/span> <span class=\"sg\" data-s=\"2\">Nav svarīgi, kurā rindā jūs tos uzrakstāt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvade rāda, ka <code>ENTER<\/code> izpildās pirmais un <code>LEAVE<\/code> — pēdējais.<\/span> <span class=\"sg\" data-s=\"1\">Bloka ķermenis izpildās starp tiem:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> ir īpaši noderīgs, jo tas izpildās pat tad, ja bloks beidzas pirms laika.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tā ir uzticama vieta, kur atbrīvot resursu.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Fāzeris viena teikuma vietā var ņemt pilnu <code>{ }<\/code> bloku.<\/span> <span class=\"sg\" data-s=\"1\">Jums var būt arī vairāki tādi fāzeri.<\/span> <span class=\"sg\" data-s=\"2\">Kad blokam ir vairāk nekā viens <code>LEAVE<\/code>, tie izpildās apgrieztā secībā.<\/span> <span class=\"sg\" data-s=\"3\">Tas, kuru iestatīja pēdējo, izpildās pirmais.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc bloks darbojas kā steks, no augšas uz leju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma resursu <code>A<\/code> atver pirmo un aizver pēdējo:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī secība “pēdējais iekšā, pirmais ārā” ir tieši tas, kas vajadzīgs tīrīšanai.<\/span> <span class=\"sg\" data-s=\"1\">To, ko iestatījāt pēdējo, noņem pirmo.<\/span> <span class=\"sg\" data-s=\"2\">Visas programmas fāzeris <code>END<\/code> darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"3\">Arī vairāki <code>END<\/code> bloki izpildās apgrieztā secībā, nekā tie ir uzrakstīti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cikla fāzeri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ciklos ir vēl trīs fāzeri cikla posmiem.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> izpildās vienreiz pirms pirmā piegājiena, un <code>LAST<\/code> izpildās vienreiz pēc pēdējā.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> izpildās katra piegājiena beigās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī ir cikla izvade:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā citi fāzeri, <code>FIRST<\/code>, <code>NEXT<\/code> un <code>LAST<\/code> var atrasties jebkurā koda vietā.<\/span> <span class=\"sg\" data-s=\"1\">Katrs no tiem izpildās savā brīdī.<\/span><\/p>"]]},"ru":{"t":"Фазеры блоков","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Raku есть фазеры для всей программы, но есть и другие.<\/span> <span class=\"sg\" data-s=\"1\">Эти фазеры связаны с жизнью отдельного блока или цикла.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вход и выход из блока<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> выполняется каждый раз, когда программа входит в блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>LEAVE<\/code> выполняется каждый раз, когда она выходит из блока.<\/span> <span class=\"sg\" data-s=\"2\">Неважно, на какой строке вы их напишете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вывод показывает, что <code>ENTER<\/code> выполняется первым, а <code>LEAVE<\/code> — последним.<\/span> <span class=\"sg\" data-s=\"1\">Тело блока выполняется между ними:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> особенно полезен, потому что он выполняется, даже если блок заканчивается раньше времени.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому это надёжное место, чтобы освободить ресурс.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Фазер может принимать целый блок <code>{ }<\/code> вместо одного выражения.<\/span> <span class=\"sg\" data-s=\"1\">Можно также задать несколько фазеров.<\/span> <span class=\"sg\" data-s=\"2\">Если в блоке больше одного <code>LEAVE<\/code>, они выполняются в обратном порядке.<\/span> <span class=\"sg\" data-s=\"3\">Тот, что был задан последним, выполняется первым.<\/span> <span class=\"sg\" data-s=\"4\">Так блок работает как стек, сверху вниз:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа открывает ресурс <code>A<\/code> первым и закрывает его последним:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Порядок «последним пришёл — первым ушёл» — как раз то, что нужно для очистки.<\/span> <span class=\"sg\" data-s=\"1\">То, что вы настроили последним, убирается первым.<\/span> <span class=\"sg\" data-s=\"2\">Фазер <code>END<\/code> всей программы работает так же.<\/span> <span class=\"sg\" data-s=\"3\">Несколько блоков <code>END<\/code> тоже выполняются в порядке, обратном тому, в котором они написаны.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазеры цикла<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри циклов есть ещё три фазера для этапов цикла.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> выполняется один раз перед первым проходом, а <code>LAST<\/code> — один раз после последнего.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> выполняется в конце каждого прохода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот что выводит цикл:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и другие фазеры, <code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> могут стоять в любом месте кода.<\/span> <span class=\"sg\" data-s=\"1\">Каждый из них выполняется в свой момент.<\/span><\/p>"]]},"uk":{"t":"Блокові фейзери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku має фазери для всієї програми, але має й інші.<\/span> <span class=\"sg\" data-s=\"1\">Ці фазери прив'язані до життя окремого блоку або циклу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Входження та вихід з блоку<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>ENTER<\/code> запускається щоразу, коли програма входить у блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазер <code>LEAVE<\/code> запускається щоразу, коли вона виходить з блоку.<\/span> <span class=\"sg\" data-s=\"2\">Не має значення, на якому рядку ви їх пишете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вивід показує, що <code>ENTER<\/code> запускається першим, а <code>LEAVE<\/code> — останнім.<\/span> <span class=\"sg\" data-s=\"1\">Тіло блоку виконується між ними:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> особливо корисний, бо він запускається, навіть якщо блок закінчується раніше.<\/span> <span class=\"sg\" data-s=\"1\">Тому це надійне місце, щоб звільнити ресурс.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Фазер може приймати повний блок <code>{ }<\/code> замість одного оператора.<\/span> <span class=\"sg\" data-s=\"1\">Ви також можете мати кілька фазерів.<\/span> <span class=\"sg\" data-s=\"2\">Коли блок має більше одного <code>LEAVE<\/code>, вони запускаються у зворотному порядку.<\/span> <span class=\"sg\" data-s=\"3\">Той, який налаштували останнім, запускається першим.<\/span> <span class=\"sg\" data-s=\"4\">Тож блок працює як стек, згори донизу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма відкриває ресурс <code>A<\/code> першим і закриває його останнім:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Порядок «останнім прийшов — першим пішов» — саме те, що потрібно для очищення.<\/span> <span class=\"sg\" data-s=\"1\">Те, що ви налаштували останнім, прибирається першим.<\/span> <span class=\"sg\" data-s=\"2\">Фазер <code>END<\/code> усієї програми працює так само.<\/span> <span class=\"sg\" data-s=\"3\">Кілька блоків <code>END<\/code> теж запускаються в порядку, зворотному до того, у якому їх написано.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Фазери циклу<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усередині циклів є ще три фазери для етапів циклу.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> запускається один раз перед першим проходом, а <code>LAST<\/code> — один раз після останнього.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> запускається наприкінці кожного проходу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось вивід циклу:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і інші фазери, <code>FIRST<\/code>, <code>NEXT<\/code> і <code>LAST<\/code> можуть стояти будь-де в коді.<\/span> <span class=\"sg\" data-s=\"1\">Кожен із них запускається у свій момент.<\/span><\/p>"]]},"bg":{"t":"Фейзъри за блокове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku има фазери за цялата програма, но има и други.<\/span> <span class=\"sg\" data-s=\"1\">Тези фазери са свързани с живота на един блок или цикъл.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Влизане и излизане от блок<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Фазерът <code>ENTER<\/code> се изпълнява всеки път, когато програмата влиза в блок.<\/span> <span class=\"sg\" data-s=\"1\">Фазерът <code>LEAVE<\/code> се изпълнява всеки път, когато тя излиза от блока.<\/span> <span class=\"sg\" data-s=\"2\">Няма значение на кой ред ги пишете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Изходът показва, че <code>ENTER<\/code> се изпълнява първи, а <code>LEAVE<\/code> — последен.<\/span> <span class=\"sg\" data-s=\"1\">Тялото на блока се изпълнява между тях:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> е особено полезен, защото се изпълнява дори ако блокът свърши по-рано.<\/span> <span class=\"sg\" data-s=\"1\">Това го прави надеждно място за освобождаване на ресурс.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Фазерът може да приеме цял блок <code>{ }<\/code> вместо един оператор.<\/span> <span class=\"sg\" data-s=\"1\">Можете да имате и няколко фазера.<\/span> <span class=\"sg\" data-s=\"2\">Когато блокът има повече от един <code>LEAVE<\/code>, те се изпълняват в обратен ред.<\/span> <span class=\"sg\" data-s=\"3\">Последният зададен се изпълнява първи.<\/span> <span class=\"sg\" data-s=\"4\">Така блокът работи като стек, отгоре надолу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата първо отваря ресурс <code>A<\/code> и го затваря най-накрая:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Редът „последен влязъл, първи излязъл“ е точно това, което ви трябва за почистване.<\/span> <span class=\"sg\" data-s=\"1\">Нещото, което сте настроили последно, се премахва първо.<\/span> <span class=\"sg\" data-s=\"2\">Фазерът <code>END<\/code> на цялата програма работи по същия начин.<\/span> <span class=\"sg\" data-s=\"3\">Няколко блока <code>END<\/code> също се изпълняват в обратен ред спрямо реда, в който са написани.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цикъл фазери<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В циклите има още три фазера за етапите на цикъла.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> се изпълнява веднъж преди първото преминаване, а <code>LAST<\/code> — веднъж след последното.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> се изпълнява в края на всяко преминаване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е изходът на цикъла:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както другите фазери, <code>FIRST<\/code>, <code>NEXT<\/code> и <code>LAST<\/code> могат да стоят навсякъде в кода.<\/span> <span class=\"sg\" data-s=\"1\">Всеки от тях се изпълнява в своя момент.<\/span><\/p>"]]},"eo":{"t":"Blok-rilataj faziloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku havas fazilojn por la tuta programo, sed ĝi havas ankaŭ aliajn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj faziloj estas ligitaj al la vivo de unu sola bloko aŭ buklo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eniro kaj eliro de bloko<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La fazilo <code>ENTER<\/code> ruliĝas ĉiufoje, kiam la programo eniras blokon.<\/span> <span class=\"sg\" data-s=\"1\">La fazilo <code>LEAVE<\/code> ruliĝas ĉiufoje, kiam ĝi eliras el la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Ne gravas, sur kiu linio vi skribas ilin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La eligo montras, ke <code>ENTER<\/code> ruliĝas unue kaj <code>LEAVE<\/code> ruliĝas laste.<\/span> <span class=\"sg\" data-s=\"1\">La korpo de la bloko ruliĝas inter ili:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> estas aparte utila, ĉar ĝi ruliĝas eĉ se la bloko finiĝas frue.<\/span> <span class=\"sg\" data-s=\"1\">Tial ĝi estas fidinda loko por liberigi rimedon.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Fazilo povas enhavi plenan <code>{ }<\/code> blokon anstataŭ unu deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas havi plurajn.<\/span> <span class=\"sg\" data-s=\"2\">Kiam bloko havas pli ol unu <code>LEAVE<\/code>, ili ruliĝas en inversa ordo.<\/span> <span class=\"sg\" data-s=\"3\">Tiu, kiu estis difinita laste, ruliĝas unue.<\/span> <span class=\"sg\" data-s=\"4\">Do la bloko funkcias kiel stako, de supre malsupren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo malfermas la rimedon <code>A<\/code> unue kaj fermas ĝin laste:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu ordo «laste en, unue el» estas ĝuste tio, kion vi bezonas por purigado.<\/span> <span class=\"sg\" data-s=\"1\">La afero, kiun vi preparis laste, estas forigata unue.<\/span> <span class=\"sg\" data-s=\"2\">La fazilo <code>END<\/code> de la tuta programo funkcias same.<\/span> <span class=\"sg\" data-s=\"3\">Pluraj <code>END<\/code>-blokoj ankaŭ ruliĝas en ordo inversa al tiu, en kiu vi skribis ilin.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Buklaj faziloj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ene de bukloj estas tri pliaj faziloj por la stadioj de la buklo.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> ruliĝas unufoje antaŭ la unua paŝo, kaj <code>LAST<\/code> ruliĝas unufoje post la lasta.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> ruliĝas ĉe la fino de ĉiu paŝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen la eligo de la buklo:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel aliaj faziloj, <code>FIRST<\/code>, <code>NEXT<\/code> kaj <code>LAST<\/code> povas esti ie ajn en la kodo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu el ili ruliĝas en sia propra momento.<\/span><\/p>"]]},"la":{"t":"Phaseres blocorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku phaseres pro toto programmate habet, sed etiam alios habet.<\/span> <span class=\"sg\" data-s=\"1\">Hi phaseres ad vitam singulae copiae vel ansae pertinent.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Intrare et relinquere copiam<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Phaser <code>ENTER<\/code> currit quotiens programma copiam intrat.<\/span> <span class=\"sg\" data-s=\"1\">Phaser <code>LEAVE<\/code> currit quotiens copiam relinquit.<\/span> <span class=\"sg\" data-s=\"2\">Non refert in qua linea eos scribas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'before block';\n{\n    LEAVE say 'leaving';\n    ENTER say 'entering';\n    say 'inside';\n}\nsay 'after block';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Output ostendit: <code>ENTER<\/code> primus currit, et <code>LEAVE<\/code> ultimus.<\/span> <span class=\"sg\" data-s=\"1\">Corpus copiae inter eos currit:<\/span><\/p>"],["code",0,"<pre><code>before block\nentering\ninside\nleaving\nafter block<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>LEAVE<\/code> praecipue utilis est, quia currit etiam si copia mature finitur.<\/span> <span class=\"sg\" data-s=\"1\">Ideo locus fidus est ad rem liberandam.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Phaser plenam copiam <code>{ }<\/code> loco unius sententiae accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam plures eorum habere potes.<\/span> <span class=\"sg\" data-s=\"2\">Cum copia plus quam unum <code>LEAVE<\/code> habet, ordine inverso currunt.<\/span> <span class=\"sg\" data-s=\"3\">Qui ultimus constitutus est, primus currit.<\/span> <span class=\"sg\" data-s=\"4\">Itaque copia sicut cumulus operatur, a summo deorsum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'open A';\n{\n    LEAVE {\n        say 'close A';\n    }\n    say 'open B';\n    LEAVE {\n        say 'close B';\n    }\n    say 'work';\n}\nsay 'done';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma rem <code>A<\/code> primam aperit et ultimam claudit:<\/span><\/p>"],["code",0,"<pre><code>open A\nopen B\nwork\nclose B\nclose A\ndone<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic ordo “ultimum intrat, primum exit” est exacte quod ad purgationem requiris.<\/span> <span class=\"sg\" data-s=\"1\">Quod ultimum constituis, primum removetur.<\/span> <span class=\"sg\" data-s=\"2\">Phaser <code>END<\/code> totius programmatis eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"3\">Plures copiae <code>END<\/code> etiam ordine inverso scripturae currunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Phaseres ansarum<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intra ansas sunt tres alii phaseres pro stadiis ansae.<\/span> <span class=\"sg\" data-s=\"1\"><code>FIRST<\/code> semel ante primum transitum currit, et <code>LAST<\/code> semel post ultimum currit.<\/span> <span class=\"sg\" data-s=\"2\"><code>NEXT<\/code> in fine cuiusque transitus currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>for 1..3 {\n    FIRST say '-- first';\n    LAST  say '-- last';\n    NEXT  say \"-- next (was $_)\";\n    say \"body $_\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc est output ansae:<\/span><\/p>"],["code",0,"<pre><code>-- first\nbody 1\n-- next (was 1)\nbody 2\n-- next (was 2)\nbody 3\n-- next (was 3)\n-- last<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut alii phaseres, <code>FIRST<\/code>, <code>NEXT<\/code> et <code>LAST<\/code> ubicumque in codice esse possunt.<\/span> <span class=\"sg\" data-s=\"1\">Quisque suo momento currit.<\/span><\/p>"]]}}}</script>
