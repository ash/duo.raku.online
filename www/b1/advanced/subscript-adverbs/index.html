<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs","n":394,"k":"section","pv":"advanced/contexts/exercises/item-or-list/solution","nx":"advanced/subscript-adverbs/exists-and-delete","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Subscript adverbs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subscripts like <code>@a[2]<\/code> or <code>%h&lt;key&gt;<\/code> get values from an array or a hash.<\/span> <span class=\"sg\" data-s=\"1\">You can add an <em>adverb<\/em> to such a subscript.<\/span> <span class=\"sg\" data-s=\"2\">The adverb changes what the subscript does.<\/span> <span class=\"sg\" data-s=\"3\">Instead of just getting the value, you can ask whether a key exists.<\/span> <span class=\"sg\" data-s=\"4\">You can also delete the key, or get the key and the value together.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You write these adverbs after the subscript, with a colon.<\/span> <span class=\"sg\" data-s=\"1\">They work in the same way with arrays and with hashes.<\/span> <span class=\"sg\" data-s=\"2\">This section covers the most useful ones.<\/span><\/p>"]]},"de":{"t":"Subskript-Adverbien","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Indizierungen wie <code>@a[2]<\/code> oder <code>%h&lt;key&gt;<\/code> holen Werte aus einem Array oder einem Hash.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst an so eine Indizierung ein <em>Adverb<\/em> anhängen.<\/span> <span class=\"sg\" data-s=\"2\">Das Adverb ändert, was die Indizierung tut.<\/span> <span class=\"sg\" data-s=\"3\">Statt nur den Wert zu holen, kannst du fragen, ob ein Schlüssel existiert.<\/span> <span class=\"sg\" data-s=\"4\">Du kannst den Schlüssel auch löschen oder den Schlüssel und den Wert zusammen bekommen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du schreibst diese Adverbien mit einem Doppelpunkt nach dem Index.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktionieren bei Arrays und bei Hashes gleich.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt behandelt die nützlichsten davon.<\/span><\/p>"]]},"nl":{"t":"Subscript-adverbia","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subscripts zoals <code>@a[2]<\/code> of <code>%h&lt;key&gt;<\/code> halen waarden op uit een array of een hash.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een <em>adverb<\/em> aan zo'n subscript toevoegen.<\/span> <span class=\"sg\" data-s=\"2\">Het adverb verandert wat de subscript doet.<\/span> <span class=\"sg\" data-s=\"3\">In plaats van alleen de waarde op te halen, kun je vragen of een sleutel bestaat.<\/span> <span class=\"sg\" data-s=\"4\">Je kunt de sleutel ook verwijderen, of de sleutel en de waarde samen opvragen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je schrijft deze adverbs na de subscript, met een dubbele punt.<\/span> <span class=\"sg\" data-s=\"1\">Ze werken op dezelfde manier bij arrays en bij hashes.<\/span> <span class=\"sg\" data-s=\"2\">Dit deel behandelt de nuttigste.<\/span><\/p>"]]},"es":{"t":"Adverbios de subíndice","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Los subíndices como <code>@a[2]<\/code> o <code>%h&lt;key&gt;<\/code> obtienen valores de un array o de un hash.<\/span> <span class=\"sg\" data-s=\"1\">Puedes añadir un <em>adverbio<\/em> a un subíndice así.<\/span> <span class=\"sg\" data-s=\"2\">El adverbio cambia lo que hace el subíndice.<\/span> <span class=\"sg\" data-s=\"3\">En lugar de solo obtener el valor, puedes preguntar si una clave existe.<\/span> <span class=\"sg\" data-s=\"4\">También puedes eliminar la clave, u obtener la clave y el valor juntos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Escribes estos adverbios después del subíndice, con dos puntos.<\/span> <span class=\"sg\" data-s=\"1\">Funcionan de la misma manera con arrays y con hashes.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección trata los más útiles.<\/span><\/p>"]]},"it":{"t":"Avverbi di subscript","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Gli accessi tramite indice come <code>@a[2]<\/code> o <code>%h&lt;key&gt;<\/code> prendono valori da un array o da un hash.<\/span> <span class=\"sg\" data-s=\"1\">Puoi aggiungere un <em>avverbio<\/em> a un accesso di questo tipo.<\/span> <span class=\"sg\" data-s=\"2\">L'avverbio cambia quello che fa l'accesso.<\/span> <span class=\"sg\" data-s=\"3\">Invece di prendere solo il valore, puoi chiedere se una chiave esiste.<\/span> <span class=\"sg\" data-s=\"4\">Puoi anche eliminare la chiave, oppure prendere la chiave e il valore insieme.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Scrivi questi avverbi dopo l'indice, con i due punti.<\/span> <span class=\"sg\" data-s=\"1\">Funzionano allo stesso modo con gli array e con gli hash.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione tratta quelli più utili.<\/span><\/p>"]]},"lv":{"t":"Indeksa apzīmētāji 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Indeksi, piemēram, <code>@a[2]<\/code> vai <code>%h&lt;key&gt;<\/code>, paņem vērtības no masīva vai jaukteņa.<\/span> <span class=\"sg\" data-s=\"1\">Šādam indeksam jūs varat pievienot <em>apstākļvārdu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Apstākļvārds maina to, ko indekss dara.<\/span> <span class=\"sg\" data-s=\"3\">Tā vietā, lai tikai paņemtu vērtību, jūs varat pajautāt, vai atslēga eksistē.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varat arī izdzēst atslēgu vai iegūt atslēgu un vērtību kopā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šos apstākļvārdus jūs rakstāt aiz indeksa ar kolu.<\/span> <span class=\"sg\" data-s=\"1\">Tie darbojas vienādi gan ar masīviem, gan ar jaukteņiem.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa aplūko noderīgākos no tiem.<\/span><\/p>"]]},"ru":{"t":"Наречия индексации","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Обращения по индексу, например <code>@a[2]<\/code> или <code>%h&lt;key&gt;<\/code>, получают значения из массива или хеша.<\/span> <span class=\"sg\" data-s=\"1\">К такому обращению можно добавить <em>наречие<\/em> (adverb).<\/span> <span class=\"sg\" data-s=\"2\">Наречие меняет то, что делает обращение.<\/span> <span class=\"sg\" data-s=\"3\">Вместо того чтобы просто получить значение, можно спросить, существует ли ключ.<\/span> <span class=\"sg\" data-s=\"4\">Можно также удалить ключ или получить ключ и значение вместе.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы пишете эти наречия после индекса через двоеточие.<\/span> <span class=\"sg\" data-s=\"1\">Они одинаково работают с массивами и с хешами.<\/span> <span class=\"sg\" data-s=\"2\">В этом разделе мы рассмотрим самые полезные из них.<\/span><\/p>"]]},"uk":{"t":"Наріччя індексів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Індекси, як-от <code>@a[2]<\/code> чи <code>%h&lt;key&gt;<\/code>, дістають значення з масиву або хеша.<\/span> <span class=\"sg\" data-s=\"1\">До такого індексу можна додати <em>наріччя<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Наріччя змінює те, що робить індекс.<\/span> <span class=\"sg\" data-s=\"3\">Замість того щоб просто дістати значення, можна запитати, чи існує ключ.<\/span> <span class=\"sg\" data-s=\"4\">Також можна видалити ключ або отримати ключ і значення разом.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ці наріччя ви пишете після індексу, через двокрапку.<\/span> <span class=\"sg\" data-s=\"1\">Вони працюють однаково і з масивами, і з хешами.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ розглядає найкорисніші з них.<\/span><\/p>"]]},"bg":{"t":"Наречия за индексиране 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Индекси като <code>@a[2]<\/code> или <code>%h&lt;key&gt;<\/code> взимат стойности от масив или хеш.<\/span> <span class=\"sg\" data-s=\"1\">Можете да добавите <em>наречие<\/em> (adverb) към такъв индекс.<\/span> <span class=\"sg\" data-s=\"2\">Наречието променя какво прави индексирането.<\/span> <span class=\"sg\" data-s=\"3\">Вместо просто да вземете стойността, можете да попитате дали даден ключ съществува.<\/span> <span class=\"sg\" data-s=\"4\">Можете също да изтриете ключа или да получите ключа и стойността заедно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пишете тези наречия след индекса, с двоеточие.<\/span> <span class=\"sg\" data-s=\"1\">Те работят по един и същи начин с масиви и с хешове.<\/span> <span class=\"sg\" data-s=\"2\">Тази секция разглежда най-полезните от тях.<\/span><\/p>"]]},"eo":{"t":"Subskribaj adverboj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subskriboj kiel <code>@a[2]<\/code> aŭ <code>%h&lt;key&gt;<\/code> prenas valorojn el tabelo aŭ hako.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas aldoni <em>adverbon<\/em> al tia subskribo.<\/span> <span class=\"sg\" data-s=\"2\">La adverbo ŝanĝas, kion la subskribo faras.<\/span> <span class=\"sg\" data-s=\"3\">Anstataŭ nur preni la valoron, vi povas demandi, ĉu ŝlosilo ekzistas.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankaŭ povas forigi la ŝlosilon, aŭ ricevi la ŝlosilon kaj la valoron kune.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi skribas ĉi tiujn adverbojn post la subskribo, kun dupunkto.<\/span> <span class=\"sg\" data-s=\"1\">Ili funkcias same kun tabeloj kaj kun hakoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio traktas la plej utilajn.<\/span><\/p>"]]},"la":{"t":"Subscripti adverbia","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Subscripta ut <code>@a[2]<\/code> vel <code>%h&lt;key&gt;<\/code> valores ex ordine vel tabula obtinent.<\/span> <span class=\"sg\" data-s=\"1\">Tali subscripto <em>adverbium<\/em> addere potes.<\/span> <span class=\"sg\" data-s=\"2\">Adverbium mutat id quod subscriptum facit.<\/span> <span class=\"sg\" data-s=\"3\">Non solum valorem obtines, sed etiam quaerere potes num clavis exsistat.<\/span> <span class=\"sg\" data-s=\"4\">Etiam clavem delere potes, vel clavem et valorem simul accipere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec adverbia post subscriptum scribis, cum duobus punctis.<\/span> <span class=\"sg\" data-s=\"1\">Eodem modo cum ordinibus et cum tabulis operantur.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio utilissima tractat.<\/span><\/p>"]]}}}</script>
