<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs/kv-and-pairs","n":397,"k":"topic","pv":"advanced/subscript-adverbs/exists-and-delete/quiz","nx":"advanced/subscript-adverbs/exercises","tr":["advanced","advanced/subscript-adverbs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Keys, values, and pairs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Other adverbs change <strong>what<\/strong> a subscript gives back.<\/span> <span class=\"sg\" data-s=\"1\">Normally, a subscript returns only the value, but these adverbs return more:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — the value (the default)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — the key (or index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — both the key and the value<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — a <code>Pair<\/code> of key and value<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For an array, the “key” is the index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> gives the index and the value together in a list.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> gives them as a pair.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same works for hashes.<\/span> <span class=\"sg\" data-s=\"1\">It is especially useful with a slice of several keys at once:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, a slice of two keys gives back each key followed by its value.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code>, and similar tools often rely on these adverbs.<\/span> <span class=\"sg\" data-s=\"2\">They let you process keys and values side by side, without separate lookups.<\/span><\/p>"]]},"de":{"t":"Schlüssel, Werte und Paare","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere Adverbien ändern, <strong>was<\/strong> eine Indizierung zurückgibt.<\/span> <span class=\"sg\" data-s=\"1\">Normalerweise gibt eine Indizierung nur den Wert zurück, aber diese Adverbien geben mehr zurück:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — den Wert (Standard)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — den Schlüssel (oder Index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — sowohl den Schlüssel als auch den Wert<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — ein <code>Pair<\/code> aus Schlüssel und Wert<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bei einem Array ist der \"Schlüssel\" der Index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> liefert den Index und den Wert zusammen in einer Liste.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> liefert sie als Pair.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Gleiche funktioniert bei Hashes.<\/span> <span class=\"sg\" data-s=\"1\">Besonders nützlich ist es bei einem Slice über mehrere Schlüssel auf einmal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier liefert ein Slice aus zwei Schlüsseln jeden Schlüssel, gefolgt von seinem Wert.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> und ähnliche Werkzeuge verlassen sich oft auf diese Adverbien.<\/span> <span class=\"sg\" data-s=\"2\">Mit ihnen kannst du Schlüssel und Werte nebeneinander verarbeiten, ohne getrennte Abfragen.<\/span><\/p>"]]},"nl":{"t":"Sleutels, waarden en paren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere adverbs veranderen <strong>wat<\/strong> een subscript teruggeeft.<\/span> <span class=\"sg\" data-s=\"1\">Normaal geeft een subscript alleen de waarde terug, maar deze adverbs geven meer:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — de waarde (de standaard)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — de sleutel (of index)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — zowel de sleutel als de waarde<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — een <code>Pair<\/code> van sleutel en waarde<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Voor een array is de \"sleutel\" de index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> geeft de index en de waarde samen in een lijst.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> geeft ze als een paar.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde werkt voor hashes.<\/span> <span class=\"sg\" data-s=\"1\">Het is vooral handig bij een slice van meerdere sleutels tegelijk:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier geeft een slice van twee sleutels elke sleutel terug, gevolgd door zijn waarde.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> en soortgelijke tools vertrouwen vaak op deze adverbs.<\/span> <span class=\"sg\" data-s=\"2\">Daarmee kun je sleutels en waarden naast elkaar verwerken, zonder aparte opzoekingen.<\/span><\/p>"]]},"es":{"t":"Keys, values y pairs","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Otros adverbios cambian <strong>qué<\/strong> devuelve un subíndice.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente, un subíndice devuelve solo el valor, pero estos adverbios devuelven más:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — el valor (lo predeterminado)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la clave (o el índice)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — tanto la clave como el valor<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — un <code>Pair<\/code> de clave y valor<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para un array, la \"clave\" es el índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> da el índice y el valor juntos en una lista.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> los da como un par.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo mismo funciona con hashes.<\/span> <span class=\"sg\" data-s=\"1\">Es especialmente útil con un segmento de varias claves a la vez:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, un segmento de dos claves devuelve cada clave seguida de su valor.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> y herramientas parecidas a menudo se apoyan en estos adverbios.<\/span> <span class=\"sg\" data-s=\"2\">Te permiten procesar claves y valores lado a lado, sin consultas separadas.<\/span><\/p>"]]},"it":{"t":"Chiavi, valori e coppie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri avverbi cambiano <strong>cosa<\/strong> restituisce un accesso tramite indice.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente, l'accesso restituisce solo il valore, ma questi avverbi restituiscono di più:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — il valore (il comportamento predefinito)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la chiave (o l'indice)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — sia la chiave che il valore<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — una <code>Pair<\/code> di chiave e valore<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per un array, la \"chiave\" è l'indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> dà l'indice e il valore insieme in una lista.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> li dà come coppia.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso funziona per gli hash.<\/span> <span class=\"sg\" data-s=\"1\">È particolarmente utile con una fetta di più chiavi insieme:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui una fetta di due chiavi restituisce ogni chiave seguita dal suo valore.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> e strumenti simili si basano spesso su questi avverbi.<\/span> <span class=\"sg\" data-s=\"2\">Ti permettono di elaborare chiavi e valori fianco a fianco, senza ricerche separate.<\/span><\/p>"]]},"lv":{"t":"Atslēgas, vērtības un pāri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Citi apstākļvārdi maina to, <strong>ko<\/strong> indekss atdod.<\/span> <span class=\"sg\" data-s=\"1\">Parasti indekss atgriež tikai vērtību, bet šie apstākļvārdi atgriež vairāk:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — vērtību (noklusējums)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — atslēgu (vai indeksu)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — gan atslēgu, gan vērtību<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — atslēgas un vērtības <code>Pair<\/code><\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvam «atslēga» ir indekss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> dod indeksu un vērtību kopā sarakstā.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> dod tos kā pāri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats darbojas ar jaukteņiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir īpaši noderīgi ar vairāku atslēgu šķēli uzreiz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit divu atslēgu šķēle atdod katru atslēgu, kam seko tās vērtība.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> un līdzīgi rīki bieži paļaujas uz šiem apstākļvārdiem.<\/span> <span class=\"sg\" data-s=\"2\">Tie ļauj apstrādāt atslēgas un vērtības līdzās, bez atsevišķiem meklējumiem.<\/span><\/p>"]]},"ru":{"t":"Ключи, значения и пары","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Другие наречия меняют <strong>то, что<\/strong> возвращает обращение по индексу.<\/span> <span class=\"sg\" data-s=\"1\">Обычно оно возвращает только значение, но эти наречия возвращают больше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значение (по умолчанию)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ (или индекс)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — и ключ, и значение<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — пару (<code>Pair<\/code>) из ключа и значения<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для массива «ключом» является индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> даёт индекс и значение вместе в виде списка.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> даёт их в виде пары.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То же самое работает и для хешей.<\/span> <span class=\"sg\" data-s=\"1\">Это особенно удобно для среза сразу из нескольких ключей:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь срез из двух ключей возвращает каждый ключ, а за ним его значение.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> и похожие инструменты часто используют эти наречия.<\/span> <span class=\"sg\" data-s=\"2\">Они позволяют обрабатывать ключи и значения рядом, без отдельных обращений.<\/span><\/p>"]]},"uk":{"t":"Ключі, значення та пари","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Інші наріччя змінюють те, <strong>що<\/strong> індекс повертає.<\/span> <span class=\"sg\" data-s=\"1\">Зазвичай індекс повертає лише значення, але ці наріччя повертають більше:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — значення (за замовчуванням)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключ (або індекс)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — і ключ, і значення<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> із ключа та значення<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для масиву «ключем» є індекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> дає індекс і значення разом у списку.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> дає їх як пару.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Те саме працює для хешів.<\/span> <span class=\"sg\" data-s=\"1\">Це особливо зручно зі зрізом із кількох ключів одразу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут зріз із двох ключів повертає кожен ключ, а за ним його значення.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> та схожі інструменти часто спираються на ці наріччя.<\/span> <span class=\"sg\" data-s=\"2\">Вони дозволяють обробляти ключі й значення разом, без окремих пошуків.<\/span><\/p>"]]},"bg":{"t":"Ключове, стойности и двойки","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Други наречия променят <strong>какво<\/strong> връща индексирането.<\/span> <span class=\"sg\" data-s=\"1\">Обикновено индексирането връща само стойността, но тези наречия връщат повече:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — стойността (по подразбиране)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — ключа (или индекса)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — както ключа, така и стойността<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> от ключ и стойност<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За масив „ключът\" е индексът:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> дава индекса и стойността заедно в списък.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> ги дава като двойка.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същото работи и за хешове.<\/span> <span class=\"sg\" data-s=\"1\">Особено полезно е при срез на няколко ключа наведнъж:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук срез от два ключа връща всеки ключ, последван от неговата стойност.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> и подобни инструменти често разчитат на тези наречия.<\/span> <span class=\"sg\" data-s=\"2\">Те ви позволяват да обработвате ключове и стойности едно до друго, без отделни търсения.<\/span><\/p>"]]},"eo":{"t":"Ŝlosiloj, valoroj kaj paroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliaj adverboj ŝanĝas, <strong>kion<\/strong> subskribo redonas.<\/span> <span class=\"sg\" data-s=\"1\">Normale subskribo redonas nur la valoron, sed ĉi tiuj adverboj redonas pli:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — la valoron (la defaŭlto)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — la ŝlosilon (aŭ indekson)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — kaj la ŝlosilon kaj la valoron<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> el ŝlosilo kaj valoro<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por tabelo, la «ŝlosilo» estas la indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> donas la indekson kaj la valoron kune en listo.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> donas ilin kiel paron.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La samo funkcias por hakoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas precipe utila kun tranĉaĵo de pluraj ŝlosiloj samtempe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, tranĉaĵo de du ŝlosiloj redonas ĉiun ŝlosilon kaj post ĝi ĝian valoron.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> kaj similaj iloj ofte baziĝas sur ĉi tiuj adverboj.<\/span> <span class=\"sg\" data-s=\"2\">Ili permesas al vi trakti ŝlosilojn kaj valorojn flank-al-flanke, sen apartaj serĉoj.<\/span><\/p>"]]},"la":{"t":"Claves, valores, et paria","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Alia adverbia mutant <strong>quid<\/strong> subscriptum reddat.<\/span> <span class=\"sg\" data-s=\"1\">Plerumque subscriptum solum valorem reddit, sed haec adverbia plus reddunt:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:v<\/code> — valorem (per defaltam)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:k<\/code> — clavem (vel indicem)<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:kv<\/code> — et clavem et valorem<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>:p<\/code> — <code>Pair<\/code> clavis et valoris<\/span><\/li><\/ul>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In ordine, \"clavis\" est index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:kv; # (1 20)\nsay @a[1]:p;  # 1 =&gt; 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>@a[1]:kv<\/code> indicem et valorem simul in lista dat.<\/span> <span class=\"sg\" data-s=\"1\"><code>@a[1]:p<\/code> ea ut par dat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem in tabulis operatur.<\/span> <span class=\"sg\" data-s=\"1\">Praecipue utile est cum segmento plurium clavium simul:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = a =&gt; 1, b =&gt; 2, c =&gt; 3;\n\nsay %h&lt;a c&gt;:kv; # (a 1 c 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic segmentum duarum clavium quamque clavem et post eam valorem eius reddit.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code>, <code>for<\/code> et similia instrumenta saepe his adverbiis nituntur.<\/span> <span class=\"sg\" data-s=\"2\">Tibi permittunt claves et valores pariter tractare, sine quaestionibus separatis.<\/span><\/p>"]]}}}</script>
