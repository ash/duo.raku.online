<script type="application/json" id="page-data">{"u":"advanced/subscript-adverbs/exists-and-delete","n":395,"k":"topic","pv":"advanced/subscript-adverbs","nx":"advanced/subscript-adverbs/exists-and-delete/quiz","tr":["advanced","advanced/subscript-adverbs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exists and delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>:exists<\/code> adverb turns a subscript into a question.<\/span> <span class=\"sg\" data-s=\"1\">Is there a value at this key or index?<\/span> <span class=\"sg\" data-s=\"2\">The adverb returns a Boolean value, but it does not get the value itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This is the right way to check for a key.<\/span> <span class=\"sg\" data-s=\"1\">If you just read <code>%h&lt;plum&gt;<\/code>, you get an undefined value.<\/span> <span class=\"sg\" data-s=\"2\">Depending on the data, this can hide the difference between “missing” and “present but undefined”.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>:delete<\/code> adverb removes the entry and gives you back its value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>apple<\/code> entry is gone.<\/span> <span class=\"sg\" data-s=\"1\">You get back the deleted value <code>1<\/code>, so you can use it.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Both adverbs also work on arrays, with an index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">What does the array look like after an item in the middle is removed?<\/span> <span class=\"sg\" data-s=\"1\">Here is the answer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So one consistent notation lets you check and change containers in place.<\/span> <span class=\"sg\" data-s=\"1\">You do not need separate methods for this.<\/span><\/p>"]]},"de":{"t":"Exists und delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:exists<\/code> verwandelt eine Indizierung in eine Frage.<\/span> <span class=\"sg\" data-s=\"1\">Gibt es einen Wert an diesem Schlüssel oder Index?<\/span> <span class=\"sg\" data-s=\"2\">Das Adverb gibt einen Booleschen Wert zurück, aber es holt nicht den Wert selbst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das ist der richtige Weg, um auf einen Schlüssel zu prüfen.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du einfach <code>%h&lt;plum&gt;<\/code> liest, bekommst du einen undefinierten Wert.<\/span> <span class=\"sg\" data-s=\"2\">Je nach Daten kann das den Unterschied zwischen \"fehlend\" und \"vorhanden, aber undefiniert\" verbergen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Adverb <code>:delete<\/code> entfernt den Eintrag und gibt dir seinen Wert zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Eintrag <code>apple<\/code> ist verschwunden.<\/span> <span class=\"sg\" data-s=\"1\">Du bekommst den gelöschten Wert <code>1<\/code> zurück, also kannst du ihn verwenden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide Adverbien funktionieren auch bei Arrays, mit einem Index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie sieht das Array aus, nachdem ein Element in der Mitte entfernt wurde?<\/span> <span class=\"sg\" data-s=\"1\">Hier ist die Antwort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit einer einheitlichen Schreibweise kannst du also Container direkt prüfen und verändern.<\/span> <span class=\"sg\" data-s=\"1\">Dafür brauchst du keine separaten Methoden.<\/span><\/p>"]]},"nl":{"t":"Exists en delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het <code>:exists<\/code> adverb verandert een subscript in een vraag.<\/span> <span class=\"sg\" data-s=\"1\">Is er een waarde bij deze sleutel of index?<\/span> <span class=\"sg\" data-s=\"2\">Het adverb geeft een Booleaanse waarde terug, maar het haalt de waarde zelf niet op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit is de juiste manier om op een sleutel te controleren.<\/span> <span class=\"sg\" data-s=\"1\">Als je gewoon <code>%h&lt;plum&gt;<\/code> leest, krijg je een ongedefinieerde waarde.<\/span> <span class=\"sg\" data-s=\"2\">Afhankelijk van de data kan dat het verschil verbergen tussen \"afwezig\" en \"aanwezig maar ongedefinieerd\".<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het <code>:delete<\/code> adverb verwijdert het item en geeft je de waarde ervan terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het <code>apple<\/code> item is verdwenen.<\/span> <span class=\"sg\" data-s=\"1\">Je krijgt de verwijderde waarde <code>1<\/code> terug, zodat je hem kunt gebruiken.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beide adverbs werken ook op arrays, met een index:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoe ziet de array eruit nadat een element in het midden is verwijderd?<\/span> <span class=\"sg\" data-s=\"1\">Hier is het antwoord:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zo kun je met één consistente notatie containers ter plekke controleren en veranderen.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt hier geen aparte methoden voor nodig.<\/span><\/p>"]]},"es":{"t":"Exists y delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:exists<\/code> convierte un subíndice en una pregunta.<\/span> <span class=\"sg\" data-s=\"1\">¿Hay un valor en esta clave o índice?<\/span> <span class=\"sg\" data-s=\"2\">El adverbio devuelve un valor booleano, pero no obtiene el valor mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta es la forma correcta de comprobar una clave.<\/span> <span class=\"sg\" data-s=\"1\">Si solo lees <code>%h&lt;plum&gt;<\/code>, obtienes un valor indefinido.<\/span> <span class=\"sg\" data-s=\"2\">Según los datos, esto puede ocultar la diferencia entre “ausente” y “presente pero indefinido”.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El adverbio <code>:delete<\/code> elimina la entrada y te devuelve su valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La entrada <code>apple<\/code> ha desaparecido.<\/span> <span class=\"sg\" data-s=\"1\">Recibes de vuelta el valor eliminado <code>1<\/code>, así que puedes usarlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dos adverbios también funcionan con arrays, con un índice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Cómo queda el array después de eliminar un elemento del medio?<\/span> <span class=\"sg\" data-s=\"1\">Aquí está la respuesta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así, una sola notación coherente te permite consultar y cambiar contenedores en su lugar.<\/span> <span class=\"sg\" data-s=\"1\">No necesitas métodos separados para esto.<\/span><\/p>"]]},"it":{"t":"Exists e delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:exists<\/code> trasforma un accesso tramite indice in una domanda.<\/span> <span class=\"sg\" data-s=\"1\">C'è un valore a questa chiave o indice?<\/span> <span class=\"sg\" data-s=\"2\">L'avverbio restituisce un valore booleano, ma non prende il valore stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo è il modo giusto per controllare una chiave.<\/span> <span class=\"sg\" data-s=\"1\">Se leggi solo <code>%h&lt;plum&gt;<\/code>, ottieni un valore indefinito.<\/span> <span class=\"sg\" data-s=\"2\">A seconda dei dati, questo può nascondere la differenza tra “assente” e “presente ma indefinito”.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'avverbio <code>:delete<\/code> rimuove l'elemento e ti restituisce il suo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'elemento <code>apple<\/code> non c'è più.<\/span> <span class=\"sg\" data-s=\"1\">Ricevi indietro il valore eliminato <code>1<\/code>, così puoi usarlo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Entrambi gli avverbi funzionano anche con gli array, tramite indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come appare l'array dopo che rimuovi un elemento in mezzo?<\/span> <span class=\"sg\" data-s=\"1\">Ecco la risposta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quindi una sola notazione coerente ti permette di controllare e cambiare i contenitori direttamente.<\/span> <span class=\"sg\" data-s=\"1\">Non ti servono metodi separati per questo.<\/span><\/p>"]]},"lv":{"t":"Exists un delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apstākļvārds <code>:exists<\/code> pārvērš indeksu par jautājumu.<\/span> <span class=\"sg\" data-s=\"1\">Vai pie šīs atslēgas vai indeksa ir vērtība?<\/span> <span class=\"sg\" data-s=\"2\">Apstākļvārds atgriež Būla vērtību, bet tas nepaņem pašu vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šis ir pareizais veids, kā pārbaudīt atslēgu.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs vienkārši nolasāt <code>%h&lt;plum&gt;<\/code>, jūs saņemat nedefinētu vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Atkarībā no datiem tas var noslēpt atšķirību starp «nav» un «ir, bet nedefinēta».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Apstākļvārds <code>:delete<\/code> noņem ierakstu un atdod jums tā vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ieraksta <code>apple<\/code> vairs nav.<\/span> <span class=\"sg\" data-s=\"1\">Jūs saņemat atpakaļ dzēsto vērtību <code>1<\/code>, tāpēc jūs varat to izmantot.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi apstākļvārdi darbojas arī ar masīviem, pēc indeksa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā izskatās masīvs pēc tam, kad elements no vidus ir noņemts?<\/span> <span class=\"sg\" data-s=\"1\">Lūk, atbilde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad viens vienots pieraksts ļauj pārbaudīt un mainīt konteinerus uz vietas.<\/span> <span class=\"sg\" data-s=\"1\">Šim nolūkam jums nav vajadzīgas atsevišķas metodes.<\/span><\/p>"]]},"ru":{"t":"Существование и удаление","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:exists<\/code> превращает обращение по индексу в вопрос.<\/span> <span class=\"sg\" data-s=\"1\">Есть ли значение по этому ключу или индексу?<\/span> <span class=\"sg\" data-s=\"2\">Наречие возвращает логическое значение, но не получает само значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это правильный способ проверить ключ.<\/span> <span class=\"sg\" data-s=\"1\">Если просто прочитать <code>%h&lt;plum&gt;<\/code>, вы получите неопределённое значение.<\/span> <span class=\"sg\" data-s=\"2\">В зависимости от данных это может скрыть разницу между «отсутствует» и «есть, но не определён».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наречие <code>:delete<\/code> удаляет запись и возвращает вам её значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Записи <code>apple<\/code> больше нет.<\/span> <span class=\"sg\" data-s=\"1\">Вы получаете обратно удалённое значение <code>1<\/code>, поэтому можете его использовать.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Оба наречия работают и с массивами — по индексу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как выглядит массив, когда из его середины удалён элемент?<\/span> <span class=\"sg\" data-s=\"1\">Вот ответ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, одна единая запись позволяет проверять и менять контейнеры на месте.<\/span> <span class=\"sg\" data-s=\"1\">Отдельные методы для этого не нужны.<\/span><\/p>"]]},"uk":{"t":"Exists та delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:exists<\/code> перетворює індекс на запитання.<\/span> <span class=\"sg\" data-s=\"1\">Чи є значення за цим ключем або індексом?<\/span> <span class=\"sg\" data-s=\"2\">Наріччя повертає булеве значення, але не дістає саме значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це правильний спосіб перевірити ключ.<\/span> <span class=\"sg\" data-s=\"1\">Якщо просто прочитати <code>%h&lt;plum&gt;<\/code>, ви отримаєте невизначене значення.<\/span> <span class=\"sg\" data-s=\"2\">Залежно від даних, це може приховати різницю між «відсутнє» та «є, але невизначене».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наріччя <code>:delete<\/code> вилучає запис і повертає вам його значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Запису <code>apple<\/code> більше немає.<\/span> <span class=\"sg\" data-s=\"1\">Ви отримуєте назад видалене значення <code>1<\/code>, тож можете його використати.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обидва наріччя працюють і з масивами, за індексом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Який вигляд має масив, коли з нього видалено елемент у середині?<\/span> <span class=\"sg\" data-s=\"1\">Ось відповідь:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тож один і той самий запис дозволяє перевіряти й змінювати контейнери на місці.<\/span> <span class=\"sg\" data-s=\"1\">Для цього вам не потрібні окремі методи.<\/span><\/p>"]]},"bg":{"t":"Съществуване и изтриване","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:exists<\/code> превръща индексирането във въпрос.<\/span> <span class=\"sg\" data-s=\"1\">Има ли стойност на този ключ или индекс?<\/span> <span class=\"sg\" data-s=\"2\">Наречието връща булева стойност, но не взима самата стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е правилният начин да проверите за ключ.<\/span> <span class=\"sg\" data-s=\"1\">Ако просто прочетете <code>%h&lt;plum&gt;<\/code>, получавате недефинирана стойност.<\/span> <span class=\"sg\" data-s=\"2\">В зависимост от данните това може да скрие разликата между „липсващ“ и „наличен, но недефиниран“.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наречието <code>:delete<\/code> премахва записа и ви връща неговата стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Записът <code>apple<\/code> вече го няма.<\/span> <span class=\"sg\" data-s=\"1\">Получавате обратно изтритата стойност <code>1<\/code>, така че можете да я използвате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">И двете наречия работят и с масиви, по индекс:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как изглежда масивът, след като премахнете елемент от средата?<\/span> <span class=\"sg\" data-s=\"1\">Ето отговора:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така една единна нотация ви позволява да проверявате и променяте контейнери на място.<\/span> <span class=\"sg\" data-s=\"1\">Не ви трябват отделни методи за това.<\/span><\/p>"]]},"eo":{"t":"Ekzistas kaj forigi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La adverbo <code>:exists<\/code> ŝanĝas subskribon en demandon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉu estas valoro ĉe ĉi tiu ŝlosilo aŭ indekso?<\/span> <span class=\"sg\" data-s=\"2\">La adverbo redonas bulean valoron, sed ĝi ne prenas la valoron mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio estas la ĝusta maniero kontroli ŝlosilon.<\/span> <span class=\"sg\" data-s=\"1\">Se vi simple legas <code>%h&lt;plum&gt;<\/code>, vi ricevas nedifinitan valoron.<\/span> <span class=\"sg\" data-s=\"2\">Depende de la datumoj, tio povas kaŝi la diferencon inter «mankanta» kaj «ĉeestanta sed nedifinita».<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La adverbo <code>:delete<\/code> forigas la eron kaj redonas al vi ĝian valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ero <code>apple<\/code> malaperis.<\/span> <span class=\"sg\" data-s=\"1\">Vi ricevas reen la forigitan valoron <code>1<\/code>, do vi povas uzi ĝin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ adverboj funkcias ankaŭ ĉe tabeloj, kun indekso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel aspektas la tabelo, post kiam ero en la mezo estas forigita?<\/span> <span class=\"sg\" data-s=\"1\">Jen la respondo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do unu konsekvenca skribmaniero permesas al vi kontroli kaj ŝanĝi ujojn surloke.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne bezonas apartajn metodojn por tio.<\/span><\/p>"]]},"la":{"t":"Exists et delete","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:exists<\/code> subscriptum in quaestionem vertit.<\/span> <span class=\"sg\" data-s=\"1\">Estne valor sub hac clave vel indice?<\/span> <span class=\"sg\" data-s=\"2\">Adverbium valorem Booleanum reddit, sed valorem ipsum non obtinet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:exists; # True\nsay %h&lt;plum&gt;:exists;  # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic est rectus modus clavem probandi.<\/span> <span class=\"sg\" data-s=\"1\">Si simpliciter <code>%h&lt;plum&gt;<\/code> legis, valorem indefinitum accipis.<\/span> <span class=\"sg\" data-s=\"2\">Secundum data, hoc differentiam inter \"absentem\" et \"praesentem sed indefinitum\" celare potest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Adverbium <code>:delete<\/code> introitum removet et valorem eius tibi reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %h = apple =&gt; 1, pear =&gt; 2;\n\nsay %h&lt;apple&gt;:delete; # 1\nsay %h.keys;          # (pear)\nsay %h;               # {pear =&gt; 2}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Introitus <code>apple<\/code> abest.<\/span> <span class=\"sg\" data-s=\"1\">Valorem deletum <code>1<\/code> recipis, itaque eo uti potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ambo adverbia etiam in ordinibus operantur, cum indice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\n\nsay @a[1]:exists; # True\nsay @a[5]:exists; # False\n\nsay @a[1]:delete; # 20\nsay @a[1]:exists; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quomodo ordo apparet postquam elementum medium remotum est?<\/span> <span class=\"sg\" data-s=\"1\">Hic est responsum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @a; # [10 (Any) 30]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque una notatio constans tibi permittit continentia probare et in loco mutare.<\/span> <span class=\"sg\" data-s=\"1\">Methodis separatis ad hoc non eges.<\/span><\/p>"]]}}}</script>
