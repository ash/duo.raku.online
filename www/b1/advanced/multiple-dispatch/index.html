<script type="application/json" id="page-data">{"u":"advanced/multiple-dispatch","n":656,"k":"section","pv":"advanced/colon-calls/quiz","nx":"advanced/multiple-dispatch/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Multiple dispatch","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you met <a href=\"/essentials/more-on-functions/multi-functions/\"><em>multi-functions<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">These are several subroutines with the same name.<\/span> <span class=\"sg\" data-s=\"2\">Raku chooses the right one by looking at the types of the arguments.<\/span> <span class=\"sg\" data-s=\"3\">This is called <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So far, Raku chose by the <em>type<\/em> of the arguments.<\/span> <span class=\"sg\" data-s=\"1\">A <code>where<\/code> clause lets you go further and also choose by the <em>value<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You write it after a parameter, and it holds a condition.<\/span> <span class=\"sg\" data-s=\"3\">The argument must meet this condition, or that candidate is not chosen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Every call runs the candidate with a condition that is true for the given value:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">If you look only at types, all three candidates have the same signature: one <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So without the <code>where<\/code> clauses, they would clash.<\/span> <span class=\"sg\" data-s=\"2\">The conditions make them different from each other.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">A base case for recursion<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> is often used for the stopping point of a recursion.<\/span> <span class=\"sg\" data-s=\"1\">This point gets its own candidate.<\/span> <span class=\"sg\" data-s=\"2\">Here is the factorial again, now as two multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The first candidate handles the base case, when <code>$n<\/code> is <code>1<\/code> or less.<\/span> <span class=\"sg\" data-s=\"1\">It simply returns <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Every other value goes to the second candidate.<\/span> <span class=\"sg\" data-s=\"3\">It calls <code>fact<\/code> again with a smaller number.<\/span> <span class=\"sg\" data-s=\"4\">There is no <code>if<\/code> inside the function.<\/span> <span class=\"sg\" data-s=\"5\">The dispatcher chooses between the base case and the recursive step.<\/span><\/p>"]]},"de":{"t":"Mehrfach-Dispatch","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Im Teil „Grundlagen“ haben Sie <a href=\"https://course.raku.org/de/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>Multi-Funktionen<\/em><\/a> kennengelernt.<\/span> <span class=\"sg\" data-s=\"1\">Das sind mehrere Subroutinen mit demselben Namen.<\/span> <span class=\"sg\" data-s=\"2\">Raku wählt die richtige aus, indem es sich die Typen der Argumente ansieht.<\/span> <span class=\"sg\" data-s=\"3\">Das nennt man <em>Multiple Dispatch<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bisher hat Raku nach dem <em>Typ<\/em> der Argumente gewählt.<\/span> <span class=\"sg\" data-s=\"1\">Mit einer <code>where<\/code>-Klausel können Sie weiter gehen und auch nach dem <em>Wert<\/em> wählen.<\/span> <span class=\"sg\" data-s=\"2\">Sie schreiben sie nach einem Parameter, und sie enthält eine Bedingung.<\/span> <span class=\"sg\" data-s=\"3\">Das Argument muss diese Bedingung erfüllen, sonst wird dieser Kandidat nicht gewählt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf führt den Kandidaten aus, dessen Bedingung für den gegebenen Wert wahr ist:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie nur auf die Typen schauen, haben alle drei Kandidaten dieselbe Signatur: ein <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ohne die <code>where<\/code>-Klauseln würden sie also kollidieren.<\/span> <span class=\"sg\" data-s=\"2\">Erst die Bedingungen machen sie verschieden.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ein Basisfall für die Rekursion<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> wird oft für den Endpunkt einer Rekursion benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Punkt bekommt einen eigenen Kandidaten.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist wieder die Fakultät, jetzt als zwei Multi-Subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Der erste Kandidat behandelt den Basisfall, wenn <code>$n<\/code> gleich <code>1<\/code> oder kleiner ist.<\/span> <span class=\"sg\" data-s=\"1\">Er gibt egative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je alleen naar de typen kijkt, hebben alle drie de kandidaten dezelfde signatuur: één <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zonder de <code>where<\/code>-clausules zouden ze dus botsen.<\/span> <span class=\"sg\" data-s=\"2\">De voorwaarden maken ze van elkaar verschillend.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een basisgeval voor recursie<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> wordt vaak gebruikt voor het stoppunt van een recursie.<\/span> <span class=\"sg\" data-s=\"1\">Dit punt krijgt een eigen kandidaat.<\/span> <span class=\"sg\" data-s=\"2\">Hier is de faculteit opnieuw, nu als twee multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">De eerste kandidaat behandelt het basisgeval, als <code>$n<\/code> gelijk is aan <code>1<\/code> of minder.<\/span> <span class=\"sg\" data-s=\"1\">Hij geeft gewoon <code>1<\/code> terug.<\/span> <span class=\"sg\" data-s=\"2\">Elke andere waarde gaat naar de tweede kandidaat.<\/span> <span class=\"sg\" data-s=\"3\">Die roept <code>fact<\/code> opnieuw aan met een kleiner getal.<\/span> <span class=\"sg\" data-s=\"4\">Er staat geen <code>if<\/code> in de functie.<\/span> <span class=\"sg\" data-s=\"5\">De dispatcher kiest tussen het basisgeval en de recursieve stap.<\/span><\/p>"]]},"es":{"t":"Despacho múltiple","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, conociste las <a href=\"https://course.raku.org/es/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funciones<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Son varias subrutinas con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"2\">Raku elige la correcta mirando los tipos de los argumentos.<\/span> <span class=\"sg\" data-s=\"3\">Esto se llama <em>despacho múltiple<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, Raku elegía por el <em>tipo<\/em> de los argumentos.<\/span> <span class=\"sg\" data-s=\"1\">Una cláusula <code>where<\/code> te permite ir más allá y elegir también por el <em>valor<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La escribes después de un parámetro, y contiene una condición.<\/span> <span class=\"sg\" data-s=\"3\">El argumento debe cumplir esta condición, o ese candidato no se elige:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada ejecuta el candidato que tiene una condición verdadera para el valor dado:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si miras solo los tipos, los tres candidatos tienen la misma firma: un <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que sin las cláusulas <code>where<\/code>, entrarían en conflicto.<\/span> <span class=\"sg\" data-s=\"2\">Las condiciones los hacen diferentes entre sí.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Un caso base para la recursión<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> se usa a menudo para el punto de parada de una recursión.<\/span> <span class=\"sg\" data-s=\"1\">Este punto tiene su propio candidato.<\/span> <span class=\"sg\" data-s=\"2\">Aquí está otra vez el factorial, ahora como dos multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El primer candidato se ocupa del caso base, cuando <code>$n<\/code> es <code>1<\/code> o menos.<\/span> <span class=\"sg\" data-s=\"1\">Simplemente devuelve <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cualquier otro valor va al segundo candidato.<\/span> <span class=\"sg\" data-s=\"3\">Este llama a <code>fact<\/code> otra vez con un número más pequeño.<\/span> <span class=\"sg\" data-s=\"4\">No hay ningún <code>if<\/code> dentro de la función.<\/span> <span class=\"sg\" data-s=\"5\">El despachador elige entre el caso base y el paso recursivo.<\/span><\/p>"]]},"it":{"t":"Dispatch multiplo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essenziali hai incontrato le <a href=\"https://course.raku.org/it/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funzioni<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sono diverse subroutine con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"2\">Raku sceglie quella giusta guardando i tipi degli argomenti.<\/span> <span class=\"sg\" data-s=\"3\">Questo si chiama <em>multiple dispatch<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Finora Raku ha scelto in base al <em>tipo<\/em> degli argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Una clausola <code>where<\/code> ti permette di andare oltre e di scegliere anche in base al <em>valore<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La scrivi dopo un parametro, e contiene una condizione.<\/span> <span class=\"sg\" data-s=\"3\">L'argomento deve rispettare questa condizione, altrimenti quel candidato non viene scelto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata esegue il candidato che ha una condizione vera per il valore dato:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se guardi solo i tipi, tutti e tre i candidati hanno la stessa firma: un solo <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi senza le clausole <code>where<\/code> sarebbero in conflitto.<\/span> <span class=\"sg\" data-s=\"2\">Le condizioni li rendono diversi l'uno dall'altro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Un caso base per la ricorsione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> si usa spesso per il punto di arresto di una ricorsione.<\/span> <span class=\"sg\" data-s=\"1\">Questo punto ha un suo candidato.<\/span> <span class=\"sg\" data-s=\"2\">Ecco di nuovo il fattoriale, ora diviso in due multi-sub:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il primo candidato gestisce il caso base, quando <code>$n<\/code> vale <code>1<\/code> o meno.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce semplicemente <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ogni altro valore va al secondo candidato.<\/span> <span class=\"sg\" data-s=\"3\">Questo chiama di nuovo <code>fact<\/code> con un numero più piccolo.<\/span> <span class=\"sg\" data-s=\"4\">Dentro la funzione non c'è nessun <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Il dispatcher sceglie tra il caso base e il passo ricorsivo.<\/span><\/p>"]]},"lv":{"t":"Daudzkārtēja nosūtīšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sadaļā \"Pamati\" jūs iepazināties ar <a href=\"https://course.raku.org/lv/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkcijām<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir vairākas apakšprogrammas ar vienādu nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Raku izvēlas pareizo, skatoties uz argumentu tipiem.<\/span> <span class=\"sg\" data-s=\"3\">To sauc par <em>vairākkārtēju dispečēšanu<\/em> (multiple dispatch).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Līdz šim Raku izvēlējās pēc argumentu <em>tipa<\/em>.<\/span> <span class=\"sg\" data-s=\"1\"><code>where<\/code> klauzula ļauj iet tālāk un izvēlēties arī pēc <em>vērtības<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">To raksta aiz parametra, un tajā ir nosacījums.<\/span> <span class=\"sg\" data-s=\"3\">Argumentam jāatbilst šim nosacījumam, citādi šo kandidātu neizvēlas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums palaiž to kandidātu, kura nosacījums dotajai vērtībai ir patiess:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja skatās tikai uz tipiem, visiem trim kandidātiem ir vienāda signatūra: viens <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc bez <code>where<\/code> klauzulām tie konfliktētu.<\/span> <span class=\"sg\" data-s=\"2\">Nosacījumi padara tos atšķirīgus vienu no otra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bāzes gadījums rekursijai<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> bieži lieto rekursijas apturēšanas punktam.<\/span> <span class=\"sg\" data-s=\"1\">Šis punkts saņem savu kandidātu.<\/span> <span class=\"sg\" data-s=\"2\">Šeit atkal ir faktoriāls, tagad kā divas multi-apakšprogrammas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pirmais kandidāts apstrādā bāzes gadījumu, kad <code>$n<\/code> ir <code>1<\/code> vai mazāks.<\/span> <span class=\"sg\" data-s=\"1\">Tas vienkārši atgriež <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Katra cita vērtība nonāk pie otrā kandidāta.<\/span> <span class=\"sg\" data-s=\"3\">Tas izsauc <code>fact<\/code> vēlreiz ar mazāku skaitli.<\/span> <span class=\"sg\" data-s=\"4\">Funkcijā nav neviena <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Starp bāzes gadījumu un rekursīvo soli izvēlas dispečeris.<\/span><\/p>"]]},"ru":{"t":"Мультиметоды","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы познакомились с <a href=\"https://course.raku.org/ru/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функциями<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это несколько подпрограмм с одним именем.<\/span> <span class=\"sg\" data-s=\"2\">Raku выбирает нужную, глядя на типы аргументов.<\/span> <span class=\"sg\" data-s=\"3\">Это называется <em>множественная диспетчеризация<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">До сих пор Raku выбирал по <em>типу<\/em> аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Конструкция <code>where<\/code> позволяет пойти дальше и выбирать также по <em>значению<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Её пишут после параметра, и она содержит условие.<\/span> <span class=\"sg\" data-s=\"3\">Аргумент должен подходить под это условие, иначе этого кандидата не выберут:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов запускает того кандидата, чьё условие истинно для данного значения:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если смотреть только на типы, у всех трёх кандидатов одна и та же сигнатура: один <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому без конструкций <code>where<\/code> они бы конфликтовали.<\/span> <span class=\"sg\" data-s=\"2\">Условия отличают их друг от друга.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базовый случай для рекурсии<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> часто используют для точки остановки рекурсии.<\/span> <span class=\"sg\" data-s=\"1\">Эта точка получает своего отдельного кандидата.<\/span> <span class=\"sg\" data-s=\"2\">Вот снова факториал, теперь в виде двух мульти-подпрограмм:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Первый кандидат обрабатывает базовый случай, когда <code>$n<\/code> равно <code>1<\/code> или меньше.<\/span> <span class=\"sg\" data-s=\"1\">Он просто возвращает <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Все остальные значения попадают ко второму кандидату.<\/span> <span class=\"sg\" data-s=\"3\">Он снова вызывает <code>fact<\/code> с меньшим числом.<\/span> <span class=\"sg\" data-s=\"4\">Внутри функции нет никакого <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Выбор между базовым случаем и рекурсивным шагом делает диспетчер.<\/span><\/p>"]]},"uk":{"t":"Множинна диспетчеризація","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви познайомилися з <a href=\"https://course.raku.org/uk/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мульти-функціями<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це кілька підпрограм з однаковим іменем.<\/span> <span class=\"sg\" data-s=\"2\">Raku вибирає потрібну, дивлячись на типи аргументів.<\/span> <span class=\"sg\" data-s=\"3\">Це називають <em>множинною диспетчеризацією<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Досі Raku вибирав за <em>типом<\/em> аргументів.<\/span> <span class=\"sg\" data-s=\"1\">Речення <code>where<\/code> дозволяє піти далі й вибирати ще й за <em>значенням<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете його після параметра, і воно містить умову.<\/span> <span class=\"sg\" data-s=\"3\">Аргумент мусить відповідати цій умові, інакше цього кандидата не виберуть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик запускає кандидата, умова якого істинна для цього значення:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо дивитися лише на типи, усі три кандидати мають однакову сигнатуру: один <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож без речень <code>where<\/code> вони б конфліктували.<\/span> <span class=\"sg\" data-s=\"2\">Умови роблять їх відмінними один від одного.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базовий випадок для рекурсії<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Часто <code>where<\/code> використовують для точки зупинки рекурсії.<\/span> <span class=\"sg\" data-s=\"1\">Ця точка отримує власного кандидата.<\/span> <span class=\"sg\" data-s=\"2\">Ось знову факторіал, тепер у вигляді двох мульти-підпрограм:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Перший кандидат обробляє базовий випадок, коли <code>$n<\/code> дорівнює <code>1<\/code> або менше.<\/span> <span class=\"sg\" data-s=\"1\">Він просто повертає <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Кожне інше значення йде до другого кандидата.<\/span> <span class=\"sg\" data-s=\"3\">Той знову викликає <code>fact<\/code> із меншим числом.<\/span> <span class=\"sg\" data-s=\"4\">Усередині функції немає жодного <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вибір між базовим випадком і рекурсивним кроком робить диспетчер.<\/span><\/p>"]]},"bg":{"t":"Множествена диспечеризация","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ се запознахте с <a href=\"https://course.raku.org/bg/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>мулти-функциите<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Това са няколко подпрограми с едно и също име.<\/span> <span class=\"sg\" data-s=\"2\">Raku избира правилната, като гледа типовете на аргументите.<\/span> <span class=\"sg\" data-s=\"3\">Това се нарича <em>множествено диспечиране<\/em> (multiple dispatch).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Досега Raku избираше по <em>типа<\/em> на аргументите.<\/span> <span class=\"sg\" data-s=\"1\">Клаузата <code>where<\/code> ви позволява да отидете по-далеч и да избирате и по <em>стойността<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Пишете я след параметъра и тя съдържа условие.<\/span> <span class=\"sg\" data-s=\"3\">Аргументът трябва да изпълни това условие, иначе този кандидат не се избира:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване изпълнява кандидата с условие, което е вярно за дадената стойност:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако гледате само типовете, и трите кандидата имат една и съща сигнатура: един <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова без клаузите <code>where<\/code> те биха се сблъскали.<\/span> <span class=\"sg\" data-s=\"2\">Условията ги правят различни един от друг.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Базов случай за рекурсия<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> често се използва за точката на спиране на рекурсията.<\/span> <span class=\"sg\" data-s=\"1\">Тази точка получава свой собствен кандидат.<\/span> <span class=\"sg\" data-s=\"2\">Ето отново факториелът, този път като две мулти-подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Първият кандидат обработва базовия случай, когато <code>$n<\/code> е <code>1<\/code> или по-малко.<\/span> <span class=\"sg\" data-s=\"1\">Той просто връща <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Всяка друга стойност отива към втория кандидат.<\/span> <span class=\"sg\" data-s=\"3\">Той извиква <code>fact<\/code> отново с по-малко число.<\/span> <span class=\"sg\" data-s=\"4\">Вътре във функцията няма <code>if<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Диспечерът избира между базовия случай и рекурсивната стъпка.<\/span><\/p>"]]},"eo":{"t":"Multobla dissendo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj, vi renkontis <a href=\"https://course.raku.org/eo/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-funkciojn<\/em><\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas pluraj subrutinoj kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"2\">Raku elektas la ĝustan, rigardante la tipojn de la argumentoj.<\/span> <span class=\"sg\" data-s=\"3\">Tio nomiĝas <em>multobla sendo<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, Raku elektis laŭ la <em>tipo<\/em> de la argumentoj.<\/span> <span class=\"sg\" data-s=\"1\">Frazo <code>where<\/code> permesas iri plu kaj elekti ankaŭ laŭ la <em>valoro<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas ĝin post parametro, kaj ĝi enhavas kondiĉon.<\/span> <span class=\"sg\" data-s=\"3\">La argumento devas plenumi ĉi tiun kondiĉon, alie tiu kandidato ne estas elektita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko rulas la kandidaton, kies kondiĉo estas vera por la donita valoro:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi rigardas nur la tipojn, ĉiuj tri kandidatoj havas la saman signaturon: unu <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do sen la <code>where<\/code>-frazoj, ili kolizius.<\/span> <span class=\"sg\" data-s=\"2\">La kondiĉoj faras ilin malsamaj unu de la alia.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Baza kazo por rekursio<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> estas ofte uzata por la halta punkto de rekursio.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu punkto ricevas sian propran kandidaton.<\/span> <span class=\"sg\" data-s=\"2\">Jen denove la faktorialo, nun kiel du multi-subrutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La unua kandidato traktas la bazan kazon, kiam <code>$n<\/code> estas <code>1<\/code> aŭ malpli.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi simple redonas <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu alia valoro iras al la dua kandidato.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi vokas <code>fact<\/code> denove kun pli malgranda nombro.<\/span> <span class=\"sg\" data-s=\"4\">Ne estas <code>if<\/code> ene de la funkcio.<\/span> <span class=\"sg\" data-s=\"5\">La sendilo elektas inter la baza kazo kaj la rekursia paŝo.<\/span><\/p>"]]},"la":{"t":"Multiplex dispatch","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <a href=\"https://course.raku.org/la/essentials/more-on-functions/multi-functions/\" target=\"_blank\" rel=\"noopener\"><em>multi-functionibus<\/em><\/a> occurristi.<\/span> <span class=\"sg\" data-s=\"1\">Hae sunt plures subroutinae cum eodem nomine.<\/span> <span class=\"sg\" data-s=\"2\">Raku rectam eligit genera argumentorum spectando.<\/span> <span class=\"sg\" data-s=\"3\">Hoc <em>multiplex dispatium<\/em> vocatur.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hactenus Raku ex <em>genere<\/em> argumentorum eligebat.<\/span> <span class=\"sg\" data-s=\"1\">Clausula <code>where<\/code> te longius ire sinit et etiam ex <em>valore<\/em> eligere.<\/span> <span class=\"sg\" data-s=\"2\">Eam post parametrum scribis, et condicionem continet.<\/span> <span class=\"sg\" data-s=\"3\">Argumentum huic condicioni satisfacere debet, aliter ille candidatus non eligitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub info(Int $n where $n &lt; 0)  { say \"$n is negative\" }\nmulti sub info(Int $n where $n == 0) { say \"$n is zero\" }\nmulti sub info(Int $n where $n &gt; 0)  { say \"$n is positive\" }\n\ninfo(-5);\ninfo(0);\ninfo(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio candidatum currit cuius condicio pro dato valore vera est:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n0 is zero\n7 is positive<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si solum genera spectas, omnes tres candidati eandem signaturam habent: unum <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque sine clausulis <code>where<\/code> confligerent.<\/span> <span class=\"sg\" data-s=\"2\">Condiciones eos inter se diversos faciunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Casus basis pro recursione<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>where<\/code> saepe adhibetur ad punctum sistendi recursionis.<\/span> <span class=\"sg\" data-s=\"1\">Hoc punctum suum candidatum accipit.<\/span> <span class=\"sg\" data-s=\"2\">Ecce iterum factorialis, nunc ut duo multi-subs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub fact(Int $n where $n &lt;= 1) { 1 }\nmulti sub fact(Int $n)               { $n * fact($n - 1) }\n\nsay fact(5); # 120<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Primus candidatus casum basis tractat, cum <code>$n<\/code> est <code>1<\/code> vel minus.<\/span> <span class=\"sg\" data-s=\"1\">Simpliciter <code>1<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"2\">Omnis alius valor ad secundum candidatum it.<\/span> <span class=\"sg\" data-s=\"3\">Is <code>fact<\/code> iterum cum numero minore vocat.<\/span> <span class=\"sg\" data-s=\"4\">Nullum <code>if<\/code> intra functionem est.<\/span> <span class=\"sg\" data-s=\"5\">Dispatchor inter casum basis et gradum recursivum eligit.<\/span><\/p>"]]}}}</script>
