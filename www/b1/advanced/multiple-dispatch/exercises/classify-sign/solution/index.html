ulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Усі три кандидати приймають один <code>Int<\/code>, тож без речень <code>where<\/code> вони б конфліктували. Умови на перших двох роблять їх різними. Третій ловить усе інше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Речення <code>where<\/code> перевіряють <code>$n.abs<\/code>. Тож результат визначає лише величина числа, а знак ігнорується. <code>size(7)<\/code> підходить до першого кандидата (<code>small<\/code>). У <code>size(-250)<\/code> абсолютне значення — <code>250<\/code>. Воно не проходить жодної з умов і йде далі, до всеохопного кандидата (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кандидатів перевіряють від найконкретнішого до найзагальнішого. Тут це саме той порядок, у якому їх записано.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Класифицирайте размера","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И трите кандидата приемат един-единствен <code>Int<\/code>, затова без клаузите <code>where<\/code> биха се сблъскали. Условията на първите два ги правят различни. Третият улавя всичко останало.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Клаузите <code>where<\/code> проверяват <code>$n.abs<\/code>. Затова само големината на числото решава резултата, а знакът няма значение. <code>size(7)<\/code> съвпада с първия кандидат (<code>small<\/code>). В <code>size(-250)<\/code> абсолютната стойност е <code>250<\/code>. Тя не отговаря на нито едно от двете условия и отива към кандидата уловител (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кандидатите се проверяват от най-специфичния към най-общия. Тук това е точно редът, в който са написани.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Klasifiki la grandecon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiuj tri kandidatoj prenas unu solan <code>Int<\/code>, do ili kolizius sen la <code>where<\/code>-frazoj. La kondiĉoj ĉe la unuaj du faras ilin malsamaj. La tria kaptas ĉion alian.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>where<\/code>-frazoj testas <code>$n.abs<\/code>. Do nur la grandeco de la nombro decidas la rezulton, kaj la signo estas ignorata. <code>size(7)<\/code> kongruas kun la unua kandidato (<code>small<\/code>). En <code>size(-250)<\/code>, la absoluta valoro estas <code>250<\/code>. Ĝi plenumas neniun el la du kondiĉoj kaj iras plu al la kandidato por ĉio alia (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La kandidatoj estas testataj de la plej specifa ĝis la plej ĝenerala. Ĉi tie, tio estas ĝuste la ordo, en kiu ili estas skribitaj.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Magnitudinem classificare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub size(Int $n where $n.abs &lt; 10)  { 'small' }\nmulti sub size(Int $n where $n.abs &lt; 100) { 'medium' }\nmulti sub size(Int $n)                    { 'large' }\n\nsay size(7);\nsay size(30);\nsay size(-250);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/multiple-dispatch/classify-sign.raku\" target=\"_blank\" rel=\"noopener\">classify-sign.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>small\nmedium\nlarge<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Omnes tres candidati unum <code>Int<\/code> accipiunt, itaque sine clausulis <code>where<\/code> confligerent. Condiciones in primis duobus eos diversos faciunt. Tertius omnia cetera capit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Clausulae <code>where<\/code> <code>$n.abs<\/code> probant. Itaque sola magnitudo numeri exitum decernit, et signum neglegitur. <code>size(7)<\/code> primo candidato congruit (<code>small<\/code>). In <code>size(-250)<\/code> valor absolutus est <code>250<\/code>. Neutri condicioni satisfacit et ad candidatum transit qui omnia cetera capit (<code>large<\/code>).<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Candidati a specificissimo ad generalissimum probantur. Hic hoc est prorsus ordo quo scripti sunt.<\/span><\/li><\/ol>"]]}}}</script>
