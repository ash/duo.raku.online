<script type="application/json" id="page-data">{"u":"advanced/distributing/meta6","n":736,"k":"topic","pv":"advanced/distributing","nx":"advanced/distributing/meta6/quiz","tr":["advanced","advanced/distributing"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The META6 file","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A single file in the top directory describes a distribution: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It is plain JSON.<\/span> <span class=\"sg\" data-s=\"2\">It tells the tools the name and version of the distribution.<\/span> <span class=\"sg\" data-s=\"3\">It also says what the distribution provides and what it depends on:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The two most important keys are <code>provides<\/code> and <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> links each module name to the file that contains its code.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> lists the other distributions that this one needs.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The file is at the top of a standard directory layout:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The module code lives under <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The directory path matches the parts of the name between the <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">For example, <code>Maths::Simple<\/code> goes into <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tests live under <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">With this structure and a correct <code>META6.json<\/code>, the tools can build, test and install it.<\/span><\/p>"]]},"de":{"t":"Die META6-Datei","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine einzige Datei im obersten Verzeichnis beschreibt eine Distribution: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie enthält einfaches JSON.<\/span> <span class=\"sg\" data-s=\"2\">Sie teilt den Werkzeugen den Namen und die Version der Distribution mit.<\/span> <span class=\"sg\" data-s=\"3\">Sie sagt auch, was die Distribution bereitstellt und wovon sie abhängt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die zwei wichtigsten Schlüssel sind <code>provides<\/code> und <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> verbindet jeden Modulnamen mit der Datei, die seinen Code enthält.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> listet die anderen Distributionen auf, die diese braucht.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Datei liegt ganz oben in einem Standard-Verzeichnislayout:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der Modulcode liegt unter <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Verzeichnispfad passt zu den Teilen des Namens zwischen den <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kommt <code>Maths::Simple<\/code> in die Datei <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tests liegen unter <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Mit dieser Struktur und einer korrekten <code>META6.json<\/code> können die Werkzeuge die Distribution bauen, testen und installieren.<\/span><\/p>"]]},"nl":{"t":"Het META6-bestand","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een enkel bestand in de hoofdmap beschrijft een distributie: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het is gewone JSON.<\/span> <span class=\"sg\" data-s=\"2\">Het vertelt de gereedschappen de naam en de versie van de distributie.<\/span> <span class=\"sg\" data-s=\"3\">Het zegt ook wat de distributie levert en waar ze van afhangt:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De twee belangrijkste sleutels zijn <code>provides<\/code> en <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> koppelt elke modulenaam aan het bestand waarin de code staat.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> noemt de andere distributies die deze nodig heeft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het bestand staat bovenaan in een standaardindeling van mappen:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De modulecode staat onder <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het pad van de map komt overeen met de delen van de naam tussen de <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Maths::Simple<\/code> komt bijvoorbeeld in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tests staan onder <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Met deze structuur en een correct <code>META6.json<\/code> kunnen de gereedschappen de distributie bouwen, testen en installeren.<\/span><\/p>"]]},"es":{"t":"El archivo META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un solo archivo en el directorio raíz describe una distribución: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es JSON simple.<\/span> <span class=\"sg\" data-s=\"2\">Indica a las herramientas el nombre y la versión de la distribución.<\/span> <span class=\"sg\" data-s=\"3\">También dice qué ofrece la distribución y de qué depende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Las dos claves más importantes son <code>provides<\/code> y <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> conecta cada nombre de módulo con el archivo que contiene su código.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> lista las otras distribuciones que esta necesita.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El archivo está en la raíz de una estructura de directorios estándar:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El código del módulo vive en <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ruta de directorios coincide con las partes del nombre entre los <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, <code>Maths::Simple<\/code> va en <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Las pruebas viven en <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Con esta estructura y un <code>META6.json<\/code> correcto, las herramientas pueden construirla, probarla e instalarla.<\/span><\/p>"]]},"it":{"t":"Il file META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un singolo file nella directory principale descrive una distribuzione: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È un normale file JSON.<\/span> <span class=\"sg\" data-s=\"2\">Indica agli strumenti il nome e la versione della distribuzione.<\/span> <span class=\"sg\" data-s=\"3\">Dice anche cosa fornisce la distribuzione e da cosa dipende:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Le due chiavi più importanti sono <code>provides<\/code> e <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> collega ogni nome di modulo al file che contiene il suo codice.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> elenca le altre distribuzioni di cui questa ha bisogno.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il file si trova in cima a una struttura di directory standard:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il codice del modulo si trova sotto <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il percorso delle directory corrisponde alle parti del nome separate da <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, <code>Maths::Simple<\/code> va in <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">I test si trovano sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Con questa struttura e un <code>META6.json<\/code> corretto, gli strumenti possono compilarla, testarla e installarla.<\/span><\/p>"]]},"lv":{"t":"META6 fails","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Distribūciju apraksta viens fails tās augšējā direktorijā: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir vienkāršs JSON.<\/span> <span class=\"sg\" data-s=\"2\">Tas pasaka rīkiem distribūcijas nosaukumu un versiju.<\/span> <span class=\"sg\" data-s=\"3\">Tas arī norāda, ko distribūcija nodrošina un no kā tā ir atkarīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Divas svarīgākās atslēgas ir <code>provides<\/code> un <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> saista katru moduļa nosaukumu ar failu, kurā ir tā kods.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> uzskaita citas distribūcijas, kas šai ir vajadzīgas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fails atrodas standarta direktoriju izkārtojuma augšā:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Moduļa kods dzīvo zem <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Direktoriju ceļš atbilst nosaukuma daļām starp <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, <code>Maths::Simple<\/code> nonāk failā <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Testi dzīvo zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ar šādu struktūru un pareizu <code>META6.json<\/code> rīki var to būvēt, testēt un instalēt.<\/span><\/p>"]]},"ru":{"t":"Файл META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив описывает один файл в его корневой директории: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это обычный JSON.<\/span> <span class=\"sg\" data-s=\"2\">Он сообщает инструментам имя и версию дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Ещё он говорит, что дистрибутив предоставляет и от чего зависит:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два самых важных ключа — <code>provides<\/code> и <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> связывает имя каждого модуля с файлом, где лежит его код.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> перечисляет другие дистрибутивы, которые нужны этому дистрибутиву.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файл лежит в корне стандартной структуры каталогов:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Код модуля находится в <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Путь из каталогов совпадает с частями имени между <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Например, <code>Maths::Simple<\/code> попадает в <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тесты находятся в <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">С такой структурой и правильным <code>META6.json<\/code> инструменты могут собрать, протестировать и установить дистрибутив.<\/span><\/p>"]]},"uk":{"t":"Файл META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Один файл у верхньому каталозі описує дистрибутив: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це звичайний JSON.<\/span> <span class=\"sg\" data-s=\"2\">Він повідомляє інструментам назву й версію дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Також він каже, що дистрибутив надає і від чого залежить:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Два найважливіші ключі — це <code>provides<\/code> і <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> пов'язує ім'я кожного модуля з файлом, у якому лежить його код.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> перелічує інші дистрибутиви, які потрібні цьому.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файл лежить нагорі стандартної структури каталогів:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Код модуля живе під <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Шлях каталогів відповідає частинам імені між <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, <code>Maths::Simple<\/code> іде в <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тести живуть під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">З такою структурою і правильним <code>META6.json<\/code> інструменти можуть зібрати, протестувати й встановити його.<\/span><\/p>"]]},"bg":{"t":"Файлът META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Един-единствен файл в главната директория описва дистрибуцията: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е обикновен JSON.<\/span> <span class=\"sg\" data-s=\"2\">Той казва на инструментите името и версията на дистрибуцията.<\/span> <span class=\"sg\" data-s=\"3\">Казва също какво предоставя дистрибуцията и от какво зависи:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двата най-важни ключа са <code>provides<\/code> и <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> свързва всяко име на модул с файла, който съдържа кода му.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> изброява другите дистрибуции, от които тази има нужда.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Файлът е най-отгоре в стандартното о ,["p",1,"<p><span class=\"sg\" data-s=\"0\">La dosiero estas ĉe la supro de norma dosieruja aranĝo:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La modula kodo loĝas sub <code>lib/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La dosieruja vojo kongruas kun la partoj de la nomo inter la <code>::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, <code>Maths::Simple<\/code> iras en <code>lib/Maths/Simple.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Testoj loĝas sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Kun ĉi tiu strukturo kaj ĝusta <code>META6.json<\/code>, la iloj povas konstrui, testi kaj instali ĝin.<\/span><\/p>"]]},"la":{"t":"Fasciculus META6","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Unum archivum in summo directorio distributionem describit: <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Est JSON simplex.<\/span> <span class=\"sg\" data-s=\"2\">Instrumentis nomen et versionem distributionis indicat.<\/span> <span class=\"sg\" data-s=\"3\">Etiam dicit quid distributio praebeat et a quibus pendeat:<\/span><\/p>"],["code",0,"<pre class=\"lang-json\"><code>{\n    \"name\": \"Maths::Simple\",\n    \"version\": \"0.0.1\",\n    \"description\": \"Simple maths helpers\",\n    \"authors\": [ \"Your Name\" ],\n    \"license\": \"Artistic-2.0\",\n    \"depends\": [],\n    \"provides\": {\n        \"Maths::Simple\": \"lib/Maths/Simple.rakumod\"\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Duae claves maximi momenti sunt <code>provides<\/code> et <code>depends<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>provides<\/code> quodque nomen moduli cum archivo coniungit quod codicem eius continet.<\/span> <span class=\"sg\" data-s=\"2\"><code>depends<\/code> alias distributiones enumerat quas haec requirit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Archivum in summo dispositionis normalis directorii est:<\/span><\/p>"],["code",0,"<pre><code>Maths-Simple/\n├── META6.json\n├── README.md\n├── lib/\n│   └── Maths/\n│       └── Simple.rakumod\n└── t/\n    └── 01-basic.rakutest<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Codex moduli sub <code>lib/<\/code> habitat.<\/span> <span class=\"sg\" data-s=\"1\">Via directorii partibus nominis inter <code>::<\/code> respondet.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, <code>Maths::Simple<\/code> in <code>lib/Maths/Simple.rakumod<\/code> collocatur.<\/span> <span class=\"sg\" data-s=\"3\">Probationes sub <code>t/<\/code> habitant.<\/span> <span class=\"sg\" data-s=\"4\">Hac structura et <code>META6.json<\/code> recto instrumenta eam aedificare, probare et installare possunt.<\/span><\/p>"]]}}}</script>
