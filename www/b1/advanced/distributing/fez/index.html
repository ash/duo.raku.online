<script type="application/json" id="page-data">{"u":"advanced/distributing/fez","n":739,"k":"topic","pv":"advanced/distributing/zef-ecosystem","nx":"advanced/distributing/exercises","tr":["advanced","advanced/distributing"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Publishing with fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">The previous topic introduced <code>fez<\/code>, a tool that uploads distributions to the Raku ecosystem.<\/span> <span class=\"sg\" data-s=\"1\">You do not have to use <code>fez<\/code>, because there are other ways to publish.<\/span> <span class=\"sg\" data-s=\"2\">But it is the most common choice.<\/span> <span class=\"sg\" data-s=\"3\">It also does more than upload.<\/span> <span class=\"sg\" data-s=\"4\">It can set up a new distribution for you and manage your author account.<\/span> <span class=\"sg\" data-s=\"5\">Install it with <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Starting a distribution<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can create a <code>META6.json<\/code> and the <code>lib/<\/code> and <code>t/<\/code> directories by hand.<\/span> <span class=\"sg\" data-s=\"1\">Or you can let <code>fez<\/code> set them up for you:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> creates a new distribution that you can build on.<\/span> <span class=\"sg\" data-s=\"1\">This is a project directory with a ready <code>META6.json<\/code> and the standard layout.<\/span> <span class=\"sg\" data-s=\"2\">So you can start writing code under <code>lib/<\/code> and tests under <code>t/<\/code> right away.<\/span> <span class=\"sg\" data-s=\"3\">You do not have to prepare the metadata file yourself.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registering and logging in<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">To publish, you need an ecosystem account.<\/span> <span class=\"sg\" data-s=\"1\">You create it once with <code>fez register<\/code>, which asks for a username, email and password.<\/span> <span class=\"sg\" data-s=\"2\">Then you sign in with <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It stores your key, so that later commands know who you are:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Your username is important.<\/span> <span class=\"sg\" data-s=\"1\">The <code>META6.json<\/code> of a distribution must have an <code>auth<\/code> field with the value <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This is how the ecosystem knows that the upload really comes from you.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uploading<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Once you have an account and the distribution is ready, run <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It packages the current directory and sends it:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">After that, anyone can install it by name with <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can upload each version only once.<\/span> <span class=\"sg\" data-s=\"2\">So remember to increase the <code>version<\/code> in <code>META6.json<\/code> before you publish an update.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Other useful commands<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here are a few more <code>fez<\/code> commands that you will need:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — check a distribution for possible problems before you upload it;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — show the distributions that you have already published;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — build <code>META6.json<\/code> again from the files that are on the disk now.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">All of these need <code>fez<\/code> to be installed and a network connection. Everything after <code>init<\/code> also needs an ecosystem account.<\/span><\/blockquote>"]]},"de":{"t":"Veröffentlichen mit fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Das vorherige Thema hat <code>fez<\/code> vorgestellt, ein Werkzeug, das Distributionen in das Raku-Ökosystem hochlädt.<\/span> <span class=\"sg\" data-s=\"1\">Du musst <code>fez<\/code> nicht benutzen, denn es gibt auch andere Wege zum Veröffentlichen.<\/span> <span class=\"sg\" data-s=\"2\">Aber es ist die häufigste Wahl.<\/span> <span class=\"sg\" data-s=\"3\">Es kann auch mehr als nur hochladen.<\/span> <span class=\"sg\" data-s=\"4\">Es kann eine neue Distribution für dich einrichten und dein Autoren-Konto verwalten.<\/span> <span class=\"sg\" data-s=\"5\">Installiere es mit <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eine Distribution starten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst eine <code>META6.json<\/code> und die Verzeichnisse <code>lib/<\/code> und <code>t/<\/code> von Hand erstellen.<\/span> <span class=\"sg\" data-s=\"1\">Oder du lässt <code>fez<\/code> sie für dich einrichten:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> erstellt eine neue Distribution, auf der du aufbauen kannst.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein Projektverzeichnis mit einer fertigen <code>META6.json<\/code> und dem Standard-Layout.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du sofort Code unter <code>lib/<\/code> und Tests unter <code>t/<\/code> schreiben.<\/span> <span class=\"sg\" data-s=\"3\">Du musst die Metadaten-Datei nicht selbst vorbereiten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrieren und Anmelden<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Zum Veröffentlichen brauchst du ein Ökosystem-Konto.<\/span> <span class=\"sg\" data-s=\"1\">Du erstellst es einmal mit <code>fez register<\/code>, das nach Benutzername, E-Mail und Passwort fragt.<\/span> <span class=\"sg\" data-s=\"2\">Dann meldest du dich mit <code>fez login<\/code> an.<\/span> <span class=\"sg\" data-s=\"3\">Es speichert deinen Schlüssel, damit spätere Befehle wissen, wer du bist:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dein Benutzername ist wichtig.<\/span> <span class=\"sg\" data-s=\"1\">Die <code>META6.json<\/code> einer Distribution muss ein <code>auth<\/code>-Feld mit dem Wert <code>zef:&lt;benutzername&gt;<\/code> haben.<\/span> <span class=\"sg\" data-s=\"2\">Daran erkennt das Ökosystem, dass der Upload wirklich von dir kommt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hochladen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Konto hast und die Distribution fertig ist, führe <code>fez upload<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Es verpackt das aktuelle Verzeichnis und schickt es ab:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Danach kann jeder sie mit <code>zef install My::Greeting<\/code> über den Namen installieren.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst jede Version nur einmal hochladen.<\/span> <span class=\"sg\" data-s=\"2\">Denk also daran, die <code>version<\/code> in <code>META6.json<\/code> zu erhöhen, bevor du ein Update veröffentlichst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Weitere nützliche Befehle<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier sind noch ein paar <code>fez<\/code>-Befehle, die du brauchen wirst:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — prüfe eine Distribution auf mögliche Probleme, bevor du sie hochlädst;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — zeige die Distributionen an, die du schon veröffentlicht hast;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — erstelle <code>META6.json<\/code> neu aus den Dateien, die jetzt auf der Festplatte sind.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Für all diese Befehle muss <code>fez<\/code> installiert sein, und du brauchst eine Netzwerkverbindung. Alles nach <code>init<\/code> braucht außerdem ein Ökosystem-Konto.<\/span><\/blockquote>"]]},"nl":{"t":"Publiceren met fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Het vorige onderwerp noemde <code>fez<\/code>, een tool die distributies naar het Raku-ecosysteem uploadt.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft <code>fez<\/code> niet te gebruiken, want er zijn andere manieren om te publiceren.<\/span> <span class=\"sg\" data-s=\"2\">Maar het is de meest gebruikelijke keuze.<\/span> <span class=\"sg\" data-s=\"3\">Het doet ook meer dan uploaden.<\/span> <span class=\"sg\" data-s=\"4\">Het kan een nieuwe distributie voor je opzetten en je auteursaccount beheren.<\/span> <span class=\"sg\" data-s=\"5\">Installeer het met <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Een distributie starten<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt een <code>META6.json<\/code> en de mappen <code>lib/<\/code> en <code>t/<\/code> met de hand maken.<\/span> <span class=\"sg\" data-s=\"1\">Of je laat <code>fez<\/code> ze voor je klaarzetten:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> maakt een nieuwe distributie waarop je verder kunt bouwen.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een projectmap met een kant-en-klare <code>META6.json<\/code> en de standaardindeling.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je meteen code schrijven onder <code>lib/<\/code> en tests onder <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Je hoeft het metadatabestand niet zelf klaar te maken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registreren en inloggen<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Om te publiceren heb je een ecosysteemaccount nodig.<\/span> <span class=\"sg\" data-s=\"1\">Je maakt het één keer aan met <code>fez register<\/code>, dat om een gebruikersnaam, e-mailadres en wachtwoord vraagt.<\/span> <span class=\"sg\" data-s=\"2\">Daarna log je in met <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het bewaart je sleutel, zodat latere commando's weten wie je bent:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je gebruikersnaam is belangrijk.<\/span> <span class=\"sg\" data-s=\"1\">Het <code>META6.json<\/code> van een distributie moet een veld <code>auth<\/code> hebben met de waarde <code>zef:&lt;gebruikersnaam&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Zo weet het ecosysteem dat de upload echt van jou komt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uploaden<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een account hebt en de distributie klaar is, voer je <code>fez upload<\/code> uit.<\/span> <span class=\"sg\" data-s=\"1\">Het verpakt de huidige map en verstuurt die:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Daarna kan iedereen ze op naam installeren met <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt elke versie maar één keer uploaden.<\/span> <span class=\"sg\" data-s=\"2\">Vergeet dus niet de <code>version<\/code> in <code>META6.json<\/code> te verhogen voordat je een update publiceert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Andere nuttige commando's<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier zijn nog een paar <code>fez<\/code>-commando's die je nodig zult hebben:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — controleer een distributie op mogelijke problemen voordat je ze uploadt;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — toon de distributies die je al hebt gepubliceerd;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — bouw <code>META6.json<\/code> opnieuw op uit de bestanden die nu op de schijf staan.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Voor al deze commando's moet <code>fez<\/code> geïnstalleerd zijn, en je hebt een netwerkverbinding nodig. Alles na <code>init<\/code> heeft ook een ecosysteemaccount nodig.<\/span><\/blockquote>"]]},"es":{"t":"Publicar con fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">El tema anterior presentó <code>fez<\/code>, una herramienta que sube distribuciones al ecosistema de Raku.<\/span> <span class=\"sg\" data-s=\"1\">No tienes que usar <code>fez<\/code>, porque hay otras formas de publicar.<\/span> <span class=\"sg\" data-s=\"2\">Pero es la opción más común.<\/span> <span class=\"sg\" data-s=\"3\">Además, hace más que subir.<\/span> <span class=\"sg\" data-s=\"4\">Puede preparar una nueva distribución para ti y gestionar tu cuenta de autor.<\/span> <span class=\"sg\" data-s=\"5\">Instálalo con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Iniciar una distribución<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes crear a mano un <code>META6.json<\/code> y los directorios <code>lib/<\/code> y <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">O puedes dejar que <code>fez<\/code> los prepare por ti:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> crea una nueva distribución sobre la que puedes trabajar.<\/span> <span class=\"sg\" data-s=\"1\">Es un directorio de proyecto con un <code>META6.json<\/code> ya preparado y la estructura estándar.<\/span> <span class=\"sg\" data-s=\"2\">Así puedes empezar enseguida a escribir código en <code>lib/<\/code> y pruebas en <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">No tienes que preparar tú mismo el archivo de metadatos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registro e inicio de sesión<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Para publicar, necesitas una cuenta en el ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">La creas una vez con <code>fez register<\/code>, que te pide un nombre de usuario, un correo electrónico y una contraseña.<\/span> <span class=\"sg\" data-s=\"2\">Después inicias sesión con <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Este comando guarda tu clave, para que los comandos posteriores sepan quién eres:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tu nombre de usuario es importante.<\/span> <span class=\"sg\" data-s=\"1\">El <code>META6.json<\/code> de una distribución debe tener un campo <code>auth<\/code> con el valor <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así es como el ecosistema sabe que la subida viene de verdad de ti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Subida<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando tengas una cuenta y la distribución esté lista, ejecuta <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Este comando empaqueta el directorio actual y lo envía:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Después, cualquiera puede instalarla por su nombre con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes subir cada versión solo una vez.<\/span> <span class=\"sg\" data-s=\"2\">Así que recuerda aumentar la <code>version<\/code> en <code>META6.json<\/code> antes de publicar una actualización.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Otros comandos útiles<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes algunos comandos más de <code>fez<\/code> que vas a necesitar:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — revisar si una distribución tiene posibles problemas antes de subirla;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostrar las distribuciones que ya has publicado;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — volver a construir <code>META6.json<\/code> a partir de los archivos que hay ahora en el disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Todos estos necesitan tener <code>fez<\/code> instalado y una conexión a la red. Todo lo que va después de <code>init<\/code> también necesita una cuenta en el ecosistema.<\/span><\/blockquote>"]]},"it":{"t":"Pubblicare con fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">L'argomento precedente ha presentato <code>fez<\/code>, uno strumento che carica le distribuzioni nell'ecosistema Raku.<\/span> <span class=\"sg\" data-s=\"1\">Non sei obbligato a usare <code>fez<\/code>, perché ci sono altri modi per pubblicare.<\/span> <span class=\"sg\" data-s=\"2\">Ma è la scelta più comune.<\/span> <span class=\"sg\" data-s=\"3\">Inoltre fa più che caricare.<\/span> <span class=\"sg\" data-s=\"4\">Può preparare per te una nuova distribuzione e gestire il tuo account di autore.<\/span> <span class=\"sg\" data-s=\"5\">Installalo con <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Creare una distribuzione<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi creare a mano un <code>META6.json<\/code> e le directory <code>lib/<\/code> e <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Oppure puoi lasciare che <code>fez<\/code> li prepari per te:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> crea una nuova distribuzione su cui puoi lavorare.<\/span> <span class=\"sg\" data-s=\"1\">È una directory di progetto con un <code>META6.json<\/code> già pronto e la struttura standard.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi iniziare subito a scrivere il codice sotto <code>lib/<\/code> e i test sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Non devi preparare tu il file dei metadati.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registrazione e accesso<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per pubblicare, ti serve un account nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Lo crei una sola volta con <code>fez register<\/code>, che chiede nome utente, email e password.<\/span> <span class=\"sg\" data-s=\"2\">Poi accedi con <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo comando salva la tua chiave, così i comandi successivi sanno chi sei:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il tuo nome utente è importante.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>META6.json<\/code> di una distribuzione deve avere un campo <code>auth<\/code> con il valore <code>zef:&lt;nomeutente&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">È così che l'ecosistema sa che il caricamento viene davvero da te.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Caricamento<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando hai un account e la distribuzione è pronta, esegui <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo comando impacchetta la directory corrente e la invia:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dopo, chiunque può installarla per nome con <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi caricare ogni versione una sola volta.<\/span> <span class=\"sg\" data-s=\"2\">Quindi ricordati di aumentare la <code>version<\/code> nel <code>META6.json<\/code> prima di pubblicare un aggiornamento.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Altri comandi utili<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco alcuni altri comandi <code>fez<\/code> che ti serviranno:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — controlla una distribuzione per trovare possibili problemi prima di caricarla;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — mostra le distribuzioni che hai già pubblicato;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — ricostruisce il <code>META6.json<\/code> dai file che ci sono ora sul disco.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Per tutti questi comandi servono <code>fez<\/code> installato e una connessione di rete. Tutto quello che viene dopo <code>init<\/code> richiede anche un account nell'ecosistema.<\/span><\/blockquote>"]]},"lv":{"t":"Publicēšana ar fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējais temats iepazīstināja ar <code>fez<\/code> — rīku, kas augšupielādē distribūcijas Raku ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\"><code>fez<\/code> nav obligāti jāizmanto, jo ir arī citi veidi, kā publicēt.<\/span> <span class=\"sg\" data-s=\"2\">Taču tā ir visbiežākā izvēle.<\/span> <span class=\"sg\" data-s=\"3\">Turklāt tas dara vairāk nekā tikai augšupielādē.<\/span> <span class=\"sg\" data-s=\"4\">Tas var jums sagatavot jaunu distribūciju un pārvaldīt jūsu autora kontu.<\/span> <span class=\"sg\" data-s=\"5\">Instalējiet to ar <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Distribūcijas uzsākšana<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izveidot <code>META6.json<\/code> un direktorijas <code>lib/<\/code> un <code>t/<\/code> ar rokām.<\/span> <span class=\"sg\" data-s=\"1\">Vai arī varat ļaut <code>fez<\/code> tos sagatavot jūsu vietā:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> izveido jaunu distribūciju, uz kuras jūs varat būvēt tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir projekta direktorija ar gatavu <code>META6.json<\/code> un standarta izkārtojumu.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat uzreiz sākt rakstīt kodu zem <code>lib/<\/code> un testus zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Jums nav pašam jāgatavo metadatu fails.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reģistrēšanās un pieteikšanās<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Lai publicētu, jums vajadzīgs ekosistēmas konts.<\/span> <span class=\"sg\" data-s=\"1\">To jūs izveidojat vienreiz ar <code>fez register<\/code>, kas prasa lietotājvārdu, e-pastu un paroli.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam jūs piesakāties ar <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas saglabā jūsu atslēgu, lai vēlākās komandas zinātu, kas jūs esat:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūsu lietotājvārds ir svarīgs.<\/span> <span class=\"sg\" data-s=\"1\">Distribūcijas failā <code>META6.json<\/code> jābūt laukam <code>auth<\/code> ar vērtību <code>zef:&lt;lietotājvārds&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tā ekosistēma zina, ka augšupielāde tiešām nāk no jums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Augšupielāde<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jums ir konts un distribūcija ir gatava, palaidiet <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas iepako pašreizējo direktoriju un nosūta to:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pēc tam ikviens to var instalēt pēc nosaukuma ar <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katru versiju var augšupielādēt tikai vienreiz.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc neaizmirstiet palielināt <code>version<\/code> failā <code>META6.json<\/code>, pirms publicējat atjauninājumu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Citas noderīgas komandas<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vēl dažas <code>fez<\/code> komandas, kas jums būs vajadzīgas:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — pārbaudīt, vai distribūcijā nav iespējamu problēmu, pirms jūs to augšupielādējat;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — parādīt distribūcijas, kuras jūs jau esat publicējuši;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — no jauna izveidot <code>META6.json<\/code> no failiem, kas tagad ir diskā.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Visām šīm komandām vajadzīgs instalēts <code>fez<\/code> un tīkla savienojums. Visam pēc <code>init<\/code> vajadzīgs arī ekosistēmas konts.<\/span><\/blockquote>"]]},"ru":{"t":"Публикация с помощью fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В предыдущей теме вы познакомились с <code>fez<\/code> — инструментом, который загружает дистрибутивы в экосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">Использовать <code>fez<\/code> не обязательно, потому что есть и другие способы публикации.<\/span> <span class=\"sg\" data-s=\"2\">Но чаще всего выбирают именно его.<\/span> <span class=\"sg\" data-s=\"3\">Кроме того, он умеет больше, чем просто загружать.<\/span> <span class=\"sg\" data-s=\"4\">Он может создать для вас новый дистрибутив и управлять вашей учётной записью автора.<\/span> <span class=\"sg\" data-s=\"5\">Установите его с помощью <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Создание дистрибутива<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы можете создать <code>META6.json<\/code> и каталоги <code>lib/<\/code> и <code>t/<\/code> вручную.<\/span> <span class=\"sg\" data-s=\"1\">Или можно позволить <code>fez<\/code> создать их за вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> создаёт новый дистрибутив, который можно развивать дальше.<\/span> <span class=\"sg\" data-s=\"1\">Это директория проекта с готовым <code>META6.json<\/code> и стандартной структурой.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вы можете сразу писать код в <code>lib/<\/code> и тесты в <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вам не нужно самим готовить файл метаданных.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и вход<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Чтобы публиковать, нужна учётная запись в экосистеме.<\/span> <span class=\"sg\" data-s=\"1\">Вы создаёте её один раз командой <code>fez register<\/code>, которая спрашивает имя пользователя, email и пароль.<\/span> <span class=\"sg\" data-s=\"2\">Потом вы входите командой <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Она сохраняет ваш ключ, чтобы следующие команды знали, кто вы:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ваше имя пользователя важно.<\/span> <span class=\"sg\" data-s=\"1\">В <code>META6.json<\/code> дистрибутива должно быть поле <code>auth<\/code> со значением <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так экосистема узнаёт, что загрузка действительно пришла от вас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Загрузка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда у вас есть учётная запись и дистрибутив готов, запустите <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Эта команда упаковывает текущую директорию и отправляет её:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">После этого любой может установить его по имени с помощью <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждую версию можно загрузить только один раз.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому не забудьте увеличить <code>version<\/code> в <code>META6.json<\/code>, прежде чем публиковать обновление.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Другие полезные команды<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот ещё несколько команд <code>fez<\/code>, которые вам понадобятся:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — проверить дистрибутив на возможные проблемы, прежде чем загружать его;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показать дистрибутивы, которые вы уже опубликовали;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — заново собрать <code>META6.json<\/code> по файлам, которые сейчас есть на диске.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Для всех этих команд нужны установленный <code>fez<\/code> и подключение к сети. Всем командам, кроме <code>init<\/code>, нужна ещё и учётная запись в экосистеме.<\/span><\/blockquote>"]]},"uk":{"t":"Публікація за допомогою fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Попередня тема познайомила вас із <code>fez<\/code>, інструментом, який завантажує дистрибутиви в екосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">Використовувати <code>fez<\/code> не обов'язково, бо є й інші способи публікації.<\/span> <span class=\"sg\" data-s=\"2\">Але це найпоширеніший вибір.<\/span> <span class=\"sg\" data-s=\"3\">Крім того, він уміє більше, ніж просто завантажувати.<\/span> <span class=\"sg\" data-s=\"4\">Він може підготувати для вас новий дистрибутив і керувати вашим обліковим записом автора.<\/span> <span class=\"sg\" data-s=\"5\">Встановіть його через <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Започаткування дистрибутива<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви можете створити <code>META6.json<\/code> і каталоги <code>lib/<\/code> та <code>t/<\/code> вручну.<\/span> <span class=\"sg\" data-s=\"1\">Або ви можете доручити <code>fez<\/code> підготувати їх за вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> створює новий дистрибутив, на якому можна будувати далі.<\/span> <span class=\"sg\" data-s=\"1\">Це каталог проєкту з готовим <code>META6.json<\/code> і стандартною структурою.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви можете одразу писати код під <code>lib/<\/code> і тести під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Вам не треба самим готувати файл метаданих.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Реєстрація та вхід<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Для публікації потрібен обліковий запис в екосистемі.<\/span> <span class=\"sg\" data-s=\"1\">Ви створюєте його один раз через <code>fez register<\/code>, який запитує ім'я користувача, електронну пошту й пароль.<\/span> <span class=\"sg\" data-s=\"2\">Потім ви входите через <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він зберігає ваш ключ, щоб наступні команди знали, хто ви:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ваше ім'я користувача важливе.<\/span> <span class=\"sg\" data-s=\"1\">У <code>META6.json<\/code> дистрибутива має бути поле <code>auth<\/code> зі значенням <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Саме так екосистема знає, що завантаження справді від вас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завантаження<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли у вас є обліковий запис і дистрибутив готовий, запустіть <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він пакує поточний каталог і надсилає його:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Після цього будь-хто може встановити його за іменем через <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожну версію можна завантажити лише один раз.<\/span> <span class=\"sg\" data-s=\"2\">Тож не забудьте збільшити <code>version<\/code> у <code>META6.json<\/code>, перш ніж публікувати оновлення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Інші корисні команди<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось ще кілька команд <code>fez<\/code>, які вам знадобляться:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — перевірити дистрибутив на можливі проблеми, перш ніж завантажити його;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показати дистрибутиви, які ви вже опублікували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — знову зібрати <code>META6.json<\/code> з файлів, які зараз лежать на диску.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Усім цим командам потрібні встановлений <code>fez<\/code> і з'єднання з мережею. Усім командам після <code>init<\/code> також потрібен обліковий запис в екосистемі.<\/span><\/blockquote>"]]},"bg":{"t":"Публикуване с fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Предишната тема представи <code>fez<\/code> — инструмент, който качва дистрибуции в екосистемата на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не е задължително да използвате <code>fez<\/code>, защото има и други начини за публикуване.<\/span> <span class=\"sg\" data-s=\"2\">Но той е най-честият избор.<\/span> <span class=\"sg\" data-s=\"3\">Освен това той прави повече от качване.<\/span> <span class=\"sg\" data-s=\"4\">Може да подготви нова дистрибуция за вас и да управлява вашия авторски акаунт.<\/span> <span class=\"sg\" data-s=\"5\">Инсталирайте го със <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стартиране на дистрибуция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да създадете <code>META6.json<\/code> и директориите <code>lib/<\/code> и <code>t/<\/code> на ръка.<\/span> <span class=\"sg\" data-s=\"1\">Или можете да оставите <code>fez<\/code> да ги подготви вместо вас:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> създава нова дистрибуция, която после можете да развивате.<\/span> <span class=\"sg\" data-s=\"1\">Това е директория на проект с готов <code>META6.json<\/code> и стандартното оформление.<\/span> <span class=\"sg\" data-s=\"2\">Така можете веднага да започнете да пишете код под <code>lib/<\/code> и тестове под <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Не е нужно сами да подготвяте файла с метаданни.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Регистрация и влизане<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За да публикувате, ви трябва акаунт в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">Създавате го веднъж с <code>fez register<\/code>, който пита за потребителско име, имейл и парола.<\/span> <span class=\"sg\" data-s=\"2\">След това влизате с <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той запазва вашия ключ, така че следващите команди да знаят кой сте:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Потребителското ви име е важно.<\/span> <span class=\"sg\" data-s=\"1\"><code>META6.json<\/code> на дистрибуцията трябва да има поле <code>auth<\/code> със стойност <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така екосистемата знае, че качването наистина идва от вас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Качване<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато имате акаунт и дистрибуцията е готова, изпълнете <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той пакетира текущата директория и я изпраща:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">След това всеки може да я инсталира по име със <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка версия можете да качите само веднъж.<\/span> <span class=\"sg\" data-s=\"2\">Затова не забравяйте да увеличите <code>version<\/code> в <code>META6.json<\/code>, преди да публикувате обновление.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Други полезни команди<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето още няколко команди на <code>fez<\/code>, които ще ви трябват:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — проверява дистрибуцията за възможни проблеми, преди да я качите;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — показва дистрибуциите, които вече сте публикували;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — изгражда отново <code>META6.json<\/code> от файловете, които са на диска в момента.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Всички те изискват инсталиран <code>fez<\/code> и връзка с мрежата. Всичко след <code>init<\/code> изисква и акаунт в екосистемата.<\/span><\/blockquote>"]]},"eo":{"t":"Publikigi per fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La antaŭa temo prezentis <code>fez<\/code>, ilon, kiu alŝutas distribuojn al la Raku-ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne devas uzi <code>fez<\/code>, ĉar estas aliaj manieroj publikigi.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi estas la plej ofta elekto.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ faras pli ol alŝuti.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi povas prepari novan distribuon por vi kaj administri vian aŭtoran konton.<\/span> <span class=\"sg\" data-s=\"5\">Instalu ĝin per <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komenci distribuon<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas krei <code>META6.json<\/code> kaj la dosierujojn <code>lib/<\/code> kaj <code>t/<\/code> mane.<\/span> <span class=\"sg\" data-s=\"1\">Aŭ vi povas lasi <code>fez<\/code> prepari ilin por vi:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> kreas novan distribuon, sur kiu vi povas konstrui.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas projekta dosierujo kun preta <code>META6.json<\/code> kaj la norma aranĝo.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas tuj komenci skribi kodon sub <code>lib/<\/code> kaj testojn sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne devas mem prepari la metadatuman dosieron.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Registriĝi kaj ensaluti<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por publikigi, vi bezonas ekosisteman konton.<\/span> <span class=\"sg\" data-s=\"1\">Vi kreas ĝin unufoje per <code>fez register<\/code>, kiu petas uzantnomon, retpoŝton kaj pasvorton.<\/span> <span class=\"sg\" data-s=\"2\">Poste vi ensalutas per <code>fez login<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi konservas vian ŝlosilon, tiel ke postaj komandoj scias, kiu vi estas:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Via uzantnomo estas grava.<\/span> <span class=\"sg\" data-s=\"1\">La <code>META6.json<\/code> de distribuo devas havi kampon <code>auth<\/code> kun la valoro <code>zef:&lt;username&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiel la ekosistemo scias, ke la alŝuto vere venas de vi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alŝuti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi havas konton kaj la distribuo estas preta, rulu <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi pakas la nunan dosierujon kaj sendas ĝin:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Post tio, iu ajn povas instali ĝin laŭ nomo per <code>zef install My::Greeting<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas alŝuti ĉiun version nur unufoje.<\/span> <span class=\"sg\" data-s=\"2\">Do memoru pligrandigi la <code>version<\/code> en <code>META6.json<\/code>, antaŭ ol vi publikigas ĝisdatigon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Aliaj utilaj komandoj<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kelkaj pliaj komandoj de <code>fez<\/code>, kiujn vi bezonos:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — kontroli distribuon pri eblaj problemoj, antaŭ ol vi alŝutas ĝin;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — montri la distribuojn, kiujn vi jam publikigis;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — konstrui <code>META6.json<\/code> denove el la dosieroj, kiuj nun estas sur la disko.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉiuj ĉi tiuj bezonas instalitan <code>fez<\/code> kaj retan konekton. Ĉio post <code>init<\/code> ankaŭ bezonas ekosisteman konton.<\/span><\/blockquote>"]]},"la":{"t":"Publicare cum fez","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Thema praecedens <code>fez<\/code> introduxit, instrumentum quod distributiones in systema Raku imponit.<\/span> <span class=\"sg\" data-s=\"1\">Non necesse est <code>fez<\/code> uti, quia alii modi publicandi sunt.<\/span> <span class=\"sg\" data-s=\"2\">Sed est electio usitatissima.<\/span> <span class=\"sg\" data-s=\"3\">Etiam plus quam imponere facit.<\/span> <span class=\"sg\" data-s=\"4\">Novam distributionem pro te parare et rationem auctoris tui administrare potest.<\/span> <span class=\"sg\" data-s=\"5\">Installa eum per <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install fez<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nova distributio inchoanda<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code> et directoria <code>lib/<\/code> et <code>t/<\/code> manu creare potes.<\/span> <span class=\"sg\" data-s=\"1\">Aut sinere potes ut <code>fez<\/code> ea pro te paret:<\/span><\/p>"],["code",0,"<pre><code>fez init My::Greeting<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>fez init<\/code> novam distributionem creat in qua aedificare potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est directorium proiecti cum <code>META6.json<\/code> parato et dispositione normali.<\/span> <span class=\"sg\" data-s=\"2\">Itaque statim codicem sub <code>lib/<\/code> et probationes sub <code>t/<\/code> scribere potes.<\/span> <span class=\"sg\" data-s=\"3\">Non necesse est tibi ipsi archivum metadatorum parare.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Inscriptio et aditus<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ad publicandum rationem in systemate requiris.<\/span> <span class=\"sg\" data-s=\"1\">Eam semel per <code>fez register<\/code> creas, quod nomen usoris, inscriptionem electronicam et tesseram rogat.<\/span> <span class=\"sg\" data-s=\"2\">Deinde per <code>fez login<\/code> intras.<\/span> <span class=\"sg\" data-s=\"3\">Id clavem tuam servat, ut mandata posteriora sciant quis sis:<\/span><\/p>"],["code",0,"<pre><code>fez register\nfez login<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomen usoris tui magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\"><code>META6.json<\/code> distributionis campum <code>auth<\/code> cum valore <code>zef:&lt;username&gt;<\/code> habere debet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc modo systema scit impositionem vere a te venire.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Impositio<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ubi rationem habes et distributio parata est, <code>fez upload<\/code> exsequere.<\/span> <span class=\"sg\" data-s=\"1\">Directorium praesens componit et mittit:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Postea quisque eam nomine per <code>zef install My::Greeting<\/code> installare potest.<\/span> <span class=\"sg\" data-s=\"1\">Quamque versionem semel tantum imponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Itaque memento <code>version<\/code> in <code>META6.json<\/code> augere antequam renovationem publicas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Alia mandata utilia<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce aliquot alia mandata <code>fez<\/code> quae requires:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>fez review<\/code> — inspice distributionem pro problematibus possibilibus antequam eam imponis;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>fez list<\/code> — ostende distributiones quas iam publicavisti;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>fez refresh<\/code> — aedifica <code>META6.json<\/code> iterum ex archivis quae nunc in disco sunt.<\/span><\/li><\/ul>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Omnia haec <code>fez<\/code> installatum et accessum ad retia requirunt. Omnia post <code>init<\/code> etiam rationem in systemate requirunt.<\/span><\/blockquote>"]]}}}</script>
