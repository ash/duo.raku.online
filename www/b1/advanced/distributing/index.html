<script type="application/json" id="page-data">{"u":"advanced/distributing","n":735,"k":"section","pv":"advanced/packages/exercises/nested-name/solution","nx":"advanced/distributing/meta6","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Distributing modules","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A module may be useful outside your own computer.<\/span> <span class=\"sg\" data-s=\"1\">Then you can package it as a <em>distribution<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You can share it through the Raku module ecosystem.<\/span> <span class=\"sg\" data-s=\"3\">Then anyone can install it with <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This section describes the two parts that make this possible.<\/span> <span class=\"sg\" data-s=\"1\">The first is the <code>META6.json<\/code> file, which describes a distribution.<\/span> <span class=\"sg\" data-s=\"2\">The second is the tools that install and publish it: <code>zef<\/code> and <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">These steps are about the ecosystem and the network, not about the language itself.<\/span> <span class=\"sg\" data-s=\"4\">So the examples here show files and commands, not program output.<\/span><\/p>"]]},"de":{"t":"Module verteilen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Modul kann auch außerhalb deines eigenen Computers nützlich sein.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du es als <em>Distribution<\/em> verpacken.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst es über das Raku-Modul-Ökosystem teilen.<\/span> <span class=\"sg\" data-s=\"3\">Dann kann jeder es mit <code>zef<\/code> installieren.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt beschreibt die zwei Teile, die das möglich machen.<\/span> <span class=\"sg\" data-s=\"1\">Das Erste ist die Datei <code>META6.json<\/code>, die eine Distribution beschreibt.<\/span> <span class=\"sg\" data-s=\"2\">Das Zweite sind die Werkzeuge, die sie installieren und veröffentlichen: <code>zef<\/code> und <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Bei diesen Schritten geht es um das Ökosystem und das Netzwerk, nicht um die Sprache selbst.<\/span> <span class=\"sg\" data-s=\"4\">Deshalb zeigen die Beispiele hier Dateien und Befehle, keine Programmausgabe.<\/span><\/p>"]]},"nl":{"t":"Modules distribueren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een module kan nuttig zijn buiten je eigen computer.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je hem verpakken als een <em>distributie<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt hem delen via het Raku-module-ecosysteem.<\/span> <span class=\"sg\" data-s=\"3\">Dan kan iedereen hem installeren met <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel beschrijft de twee delen die dit mogelijk maken.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is het bestand <code>META6.json<\/code>, dat een distributie beschrijft.<\/span> <span class=\"sg\" data-s=\"2\">Het tweede zijn de gereedschappen die de distributie installeren en publiceren: <code>zef<\/code> en <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Deze stappen gaan over het ecosysteem en het netwerk, niet over de taal zelf.<\/span> <span class=\"sg\" data-s=\"4\">Dus tonen de voorbeelden hier bestanden en commando's, geen programma-uitvoer.<\/span><\/p>"]]},"es":{"t":"Distribución de módulos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un módulo puede ser útil fuera de tu propio ordenador.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes empaquetarlo como una <em>distribución<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Puedes compartirla a través del ecosistema de módulos de Raku.<\/span> <span class=\"sg\" data-s=\"3\">Así cualquiera puede instalarla con <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta sección describe las dos partes que hacen esto posible.<\/span> <span class=\"sg\" data-s=\"1\">La primera es el archivo <code>META6.json<\/code>, que describe una distribución.<\/span> <span class=\"sg\" data-s=\"2\">La segunda son las herramientas que la instalan y la publican: <code>zef<\/code> y <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Estos pasos tratan del ecosistema y de la red, no del lenguaje en sí.<\/span> <span class=\"sg\" data-s=\"4\">Por eso los ejemplos de aquí muestran archivos y comandos, no salida de programas.<\/span><\/p>"]]},"it":{"t":"Distribuzione di moduli","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un modulo può essere utile anche fuori dal tuo computer.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi impacchettarlo come <em>distribuzione<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi condividerla attraverso l'ecosistema dei moduli Raku.<\/span> <span class=\"sg\" data-s=\"3\">Così chiunque può installarla con <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questa sezione descrive le due parti che rendono possibile tutto questo.<\/span> <span class=\"sg\" data-s=\"1\">La prima è il file <code>META6.json<\/code>, che descrive una distribuzione.<\/span> <span class=\"sg\" data-s=\"2\">La seconda sono gli strumenti che la installano e la pubblicano: <code>zef<\/code> e <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questi passaggi riguardano l'ecosistema e la rete, non il linguaggio stesso.<\/span> <span class=\"sg\" data-s=\"4\">Quindi gli esempi qui mostrano file e comandi, non l'output di un programma.<\/span><\/p>"]]},"lv":{"t":"Moduļu izplatīšana 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulis var būt noderīgs ne tikai jūsu datorā.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat to iepakot kā <em>distribūciju<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat to kopīgot caur Raku moduļu ekosistēmu.<\/span> <span class=\"sg\" data-s=\"3\">Tad ikviens var to instalēt ar <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa apraksta divas daļas, kas to padara iespējamu.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā ir fails <code>META6.json<\/code>, kas apraksta distribūciju.<\/span> <span class=\"sg\" data-s=\"2\">Otrā ir rīki, kas to instalē un publicē: <code>zef<\/code> un <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šie soļi ir saistīti ar ekosistēmu un tīklu, nevis ar pašu valodu.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc piemēri šeit rāda failus un komandas, nevis programmas izvadi.<\/span><\/p>"]]},"ru":{"t":"Распространение модулей","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Модуль может оказаться полезным не только на вашем компьютере.<\/span> <span class=\"sg\" data-s=\"1\">Тогда его можно упаковать в виде <em>дистрибутива<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете поделиться им через экосистему модулей Raku.<\/span> <span class=\"sg\" data-s=\"3\">Тогда любой сможет установить его с помощью <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В этом разделе описаны две части, которые делают это возможным.<\/span> <span class=\"sg\" data-s=\"1\">Первая — файл <code>META6.json<\/code>, который описывает дистрибутив.<\/span> <span class=\"sg\" data-s=\"2\">Вторая — инструменты, которые устанавливают и публикуют его: <code>zef<\/code> и <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Эти шаги связаны с экосистемой и сетью, а не с самим языком.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому примеры здесь показывают файлы и команды, а не вывод программ.<\/span><\/p>"]]},"uk":{"t":"Розповсюдження модулів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Модуль може бути корисним не лише на вашому комп'ютері.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви можете спакувати його як <em>дистрибутив<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете поділитися ним через екосистему модулів Raku.<\/span> <span class=\"sg\" data-s=\"3\">Тоді будь-хто зможе встановити його через <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Цей розділ описує дві частини, які роблять це можливим.<\/span> <span class=\"sg\" data-s=\"1\">Перша — це файл <code>META6.json<\/code>, який описує дистрибутив.<\/span> <span class=\"sg\" data-s=\"2\">Друга — це інструменти, які його встановлюють і публікують: <code>zef<\/code> і <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ці кроки стосуються екосистеми й мережі, а не самої мови.<\/span> <span class=\"sg\" data-s=\"4\">Тому приклади тут показують файли й команди, а не вивід програми.<\/span><\/p>"]]},"bg":{"t":"Разпространение на модули 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Един модул може да е полезен и извън вашия собствен компютър.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да го пакетирате като <em>дистрибуция<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да я споделите чрез екосистемата за модули на Raku.<\/span> <span class=\"sg\" data-s=\"3\">Тогава всеки може да я инсталира със <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Този раздел описва двете части, които правят това възможно.<\/span> <span class=\"sg\" data-s=\"1\">Първата е файлът <code>META6.json<\/code>, който описва дистрибуцията.<\/span> <span class=\"sg\" data-s=\"2\">Втората са инструментите, които я инсталират и публикуват: <code>zef<\/code> и <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тези стъпки са свързани с екосистемата и мрежата, а не със самия език.<\/span> <span class=\"sg\" data-s=\"4\">Затова примерите тук показват файлове и команди, а не изход от програма.<\/span><\/p>"]]},"eo":{"t":"Distribui modulojn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulo povas esti utila ankaŭ ekster via propra komputilo.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas paki ĝin kiel <em>distribuon<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas kunhavigi ĝin per la modula ekosistemo de Raku.<\/span> <span class=\"sg\" data-s=\"3\">Tiam iu ajn povas instali ĝin per <code>zef<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio priskribas la du partojn, kiuj ebligas tion.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la dosiero <code>META6.json<\/code>, kiu priskribas distribuon.<\/span> <span class=\"sg\" data-s=\"2\">La dua parto estas la iloj, kiuj instalas kaj publikigas ĝin: <code>zef<\/code> kaj <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiuj paŝoj temas pri la ekosistemo kaj la reto, ne pri la lingvo mem.<\/span> <span class=\"sg\" data-s=\"4\">Do la ekzemploj ĉi tie montras dosierojn kaj komandojn, ne programan eligon.<\/span><\/p>"]]},"la":{"t":"Modulos distribuere","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Modulus fortasse etiam extra computatrum tuum utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Tum eum ut <em>distributionem<\/em> componere potes.<\/span> <span class=\"sg\" data-s=\"2\">Eam per systema modulorum Raku communicare potes.<\/span> <span class=\"sg\" data-s=\"3\">Tum quisque eum per <code>zef<\/code> installare potest.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec sectio duas partes describit quae hoc possibile faciunt.<\/span> <span class=\"sg\" data-s=\"1\">Prima est archivum <code>META6.json<\/code>, quod distributionem describit.<\/span> <span class=\"sg\" data-s=\"2\">Secunda sunt instrumenta quae eam installant et publicant: <code>zef<\/code> et <code>fez<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hi gradus ad systema et ad retia pertinent, non ad linguam ipsam.<\/span> <span class=\"sg\" data-s=\"4\">Itaque exempla hic archiva et mandata ostendunt, non exitum programmatis.<\/span><\/p>"]]}}}</script>
