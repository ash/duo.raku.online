<script type="application/json" id="page-data">{"u":"advanced/distributing/zef-ecosystem","n":738,"k":"topic","pv":"advanced/distributing/meta6/quiz","nx":"advanced/distributing/fez","tr":["advanced","advanced/distributing"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"zef and the ecosystem","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> is the module installer of Raku.<\/span> <span class=\"sg\" data-s=\"1\">You have already used it to install modules by name.<\/span> <span class=\"sg\" data-s=\"2\">It also works with a local distribution directory.<\/span> <span class=\"sg\" data-s=\"3\">Inside a distribution, you can test and install it directly:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> runs the files under <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> installs the distribution into your Raku, so that other programs can <code>use<\/code> it.<\/span> <span class=\"sg\" data-s=\"2\">Installing by name, as in <code>zef install Cro<\/code>, does the same thing.<\/span> <span class=\"sg\" data-s=\"3\">But it first downloads the distribution from the ecosystem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can <strong>publish<\/strong> your own distribution, so that others can install it by name.<\/span> <span class=\"sg\" data-s=\"1\">To do that, you upload it to the ecosystem.<\/span> <span class=\"sg\" data-s=\"2\">The usual tool for this is <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This packages the current distribution and sends it to the Raku ecosystem.<\/span> <span class=\"sg\" data-s=\"1\">After that, <code>zef install Maths::Simple<\/code> will work for anyone.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">These commands need <code>zef<\/ \/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das verpackt die aktuelle Distribution und schickt sie an das Raku-Ökosystem.<\/span> <span class=\"sg\" data-s=\"1\">Danach funktioniert <code>zef install Maths::Simple<\/code> für alle.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Für diese Befehle muss <code>zef<\/code>/<code>fez<\/code> installiert sein, und du brauchst eine Netzwerkverbindung. Zum Hochladen brauchst du außerdem ein Ökosystem-Konto.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Leben eines geteilten Moduls hat also drei Schritte.<\/span> <span class=\"sg\" data-s=\"1\">Du richtest es mit einer <code>META6.json<\/code> ein und testest es mit <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann veröffentlichst du es mit <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ab dann ist es einfach ein weiterer Name, den jeder mit <code>zef install<\/code> installieren kann.<\/span><\/p>"]]},"nl":{"t":"zef en het ecosysteem","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> is de module-installeerder van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt het al gebruikt om modules op naam te installeren.<\/span> <span class=\"sg\" data-s=\"2\">Het werkt ook met een lokale distributiemap.<\/span> <span class=\"sg\" data-s=\"3\">Vanuit een distributie kun je ze direct testen en installeren:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> voert de bestanden onder <code>t/<\/code> uit.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> installeert de distributie in je Raku, zodat andere programma's ze met <code>use<\/code> kunnen laden.<\/span> <span class=\"sg\" data-s=\"2\">Installeren op naam, zoals bij <code>zef install Cro<\/code>, doet hetzelfde.<\/span> <span class=\"sg\" data-s=\"3\">Maar dan downloadt het eerst de distributie uit het ecosysteem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt je eigen distributie <strong>publiceren<\/strong>, zodat anderen ze op naam kunnen installeren.<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor upload je ze naar het ecosysteem.<\/span> <span class=\"sg\" data-s=\"2\">Het gebruikelijke gereedschap hiervoor is <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit verpakt de huidige distributie en stuurt ze naar het Raku-ecosysteem.<\/span> <span class=\"sg\" data-s=\"1\">Daarna werkt <code>zef install Maths::Simple<\/code> voor iedereen.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Voor deze commando's moet <code>zef<\/code>/<code>fez<\/code> geïnstalleerd zijn, en je hebt een netwerkverbinding nodig. Voor uploaden heb je ook een ecosysteemaccount nodig.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het leven van een gedeelde module heeft dus drie stappen.<\/span> <span class=\"sg\" data-s=\"1\">Je geeft hem een indeling met een <code>META6.json<\/code> en test hem met <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Daarna publiceer je hem met <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vanaf dan is hij gewoon nog een naam die iedereen kan installeren met <code>zef install<\/code>.<\/span><\/p>"]]},"es":{"t":"zef y el ecosistema","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> es el instalador de módulos de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ya lo has usado para instalar módulos por su nombre.<\/span> <span class=\"sg\" data-s=\"2\">También funciona con un directorio de distribución local.<\/span> <span class=\"sg\" data-s=\"3\">Dentro de una distribución, puedes probarla e instalarla directamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> ejecuta los archivos de <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instala la distribución en tu Raku, para que otros programas puedan cargarla con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Instalar por nombre, como en <code>zef install Cro<\/code>, hace lo mismo.<\/span> <span class=\"sg\" data-s=\"3\">Pero primero descarga la distribución del ecosistema.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes <strong>publicar<\/strong> tu propia distribución, para que otros puedan instalarla por nombre.<\/span> <span class=\"sg\" data-s=\"1\">Para eso, la subes al ecosistema.<\/span> <span class=\"sg\" data-s=\"2\">La herramienta habitual para esto es <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto empaqueta la distribución actual y la envía al ecosistema de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Después, <code>zef install Maths::Simple<\/code> funcionará para cualquiera.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Estos comandos necesitan tener <code>zef<\/code>/<code>fez<\/code> instalado y una conexión a la red. Para subir, también hace falta una cuenta en el ecosistema.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Así que la vida de un módulo compartido tiene tres pasos.<\/span> <span class=\"sg\" data-s=\"1\">Lo organizas con un <code>META6.json<\/code> y lo pruebas con <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Luego lo publicas con <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">A partir de entonces, es solo un nombre más que cualquiera puede instalar con <code>zef install<\/code>.<\/span><\/p>"]]},"it":{"t":"zef e l'ecosistema","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> è l'installer di moduli di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Lo hai già usato per installare moduli per nome.<\/span> <span class=\"sg\" data-s=\"2\">Funziona anche con la directory di una distribuzione locale.<\/span> <span class=\"sg\" data-s=\"3\">Dall'interno di una distribuzione puoi testarla e installarla direttamente:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> esegue i file sotto <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> installa la distribuzione nel tuo Raku, così altri programmi possono usarla con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Installare per nome, come in <code>zef install Cro<\/code>, fa la stessa cosa.<\/span> <span class=\"sg\" data-s=\"3\">Ma prima scarica la distribuzione dall'ecosistema.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi <strong>pubblicare<\/strong> la tua distribuzione, così altri possono installarla per nome.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, la carichi nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"2\">Lo strumento più comune per questo è <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo comando impacchetta la distribuzione corrente e la invia all'ecosistema Raku.<\/span> <span class=\"sg\" data-s=\"1\">Dopo, <code>zef install Maths::Simple<\/code> funzionerà per chiunque.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Per questi comandi servono <code>zef<\/code>/<code>fez<\/code> installati e una connessione di rete. Per il caricamento serve anche un account nell'ecosistema.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quindi la vita di un modulo condiviso ha tre fasi.<\/span> <span class=\"sg\" data-s=\"1\">Lo organizzi con un <code>META6.json<\/code> e lo testi con <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi lo pubblichi con <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Da quel momento è solo un altro nome che chiunque può installare con <code>zef install<\/code>.<\/span><\/p>"]]},"lv":{"t":"zef un ekosistēma","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> ir Raku moduļu instalētājs.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to jau esat izmantojuši, lai instalētu moduļus pēc nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Tas darbojas arī ar vietēju distribūcijas direktoriju.<\/span> <span class=\"sg\" data-s=\"3\">Distribūcijas iekšpusē jūs varat to tieši notestēt un instalēt:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> izpilda failus zem <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instalē distribūciju jūsu Raku vidē, lai citas programmas varētu to ielādēt ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Instalēšana pēc nosaukuma, kā <code>zef install Cro<\/code>, dara to pašu.<\/span> <span class=\"sg\" data-s=\"3\">Bet vispirms tā lejupielādē distribūciju no ekosistēmas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat <strong>publicēt<\/strong> savu distribūciju, lai citi to varētu instalēt pēc nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, jūs to augšupielādējat ekosistēmā.<\/span> <span class=\"sg\" data-s=\"2\">Parastais rīks tam ir <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas iepako pašreizējo distribūciju un nosūta to uz Raku ekosistēmu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam <code>zef install Maths::Simple<\/code> darbosies ikvienam.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Šīm komandām vajadzīgs instalēts <code>zef<\/code>/<code>fez<\/code> un tīkla savienojums. Augšupielādei vajadzīgs arī ekosistēmas konts.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tātad kopīgota moduļa dzīvē ir trīs soļi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izkārtojat ar <code>META6.json<\/code> un notestējat ar <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs to publicējat ar <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">No tā brīža tas ir tikai vēl viens nosaukums, ko ikviens var <code>zef install<\/code>.<\/span><\/p>"]]},"ru":{"t":"zef и экосистема","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> — это установщик модулей Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже использовали его, чтобы устанавливать модули по имени.<\/span> <span class=\"sg\" data-s=\"2\">Он также работает с локальной директорией дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Внутри дистрибутива его можно сразу протестировать и установить:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> запускает файлы из <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> устанавливает дистрибутив в ваш Raku, чтобы другие программы могли загружать его через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Установка по имени, как в <code>zef install Cro<\/code>, делает то же самое.<\/span> <span class=\"sg\" data-s=\"3\">Но сначала она скачивает дистрибутив из экосистемы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы можете <strong>опубликовать<\/strong> свой дистрибутив, чтобы другие могли установить его по имени.<\/span> <span class=\"sg\" data-s=\"1\">Для этого его нужно загрузить в экосистему.<\/span> <span class=\"sg\" data-s=\"2\">Обычно для этого используют <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта команда упаковывает текущий дистрибутив и отправляет его в экосистему Raku.<\/span> <span class=\"sg\" data-s=\"1\">После этого <code>zef install Maths::Simple<\/code> будет работать у всех.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Для этих команд нужны установленные <code>zef<\/code>/<code>fez<\/code> и подключение к сети. Для загрузки также нужна учётная запись в экосистеме.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итак, жизнь общего модуля состоит из трёх шагов.<\/span> <span class=\"sg\" data-s=\"1\">Вы готовите его структуру с <code>META6.json<\/code> и тестируете его с помощью <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потом вы публикуете его через <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">С этого момента это просто ещё одно имя, которое любой может установить через <code>zef install<\/code>.<\/span><\/p>"]]},"uk":{"t":"zef та екосистема","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> — це встановлювач модулів Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже користувалися ним, щоб встановлювати модулі за іменем.<\/span> <span class=\"sg\" data-s=\"2\">Він також працює з локальним каталогом дистрибутива.<\/span> <span class=\"sg\" data-s=\"3\">Усередині дистрибутива його можна одразу протестувати й встановити:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> запускає файли під <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> встановлює дистрибутив у ваш Raku, щоб інші програми могли завантажити його через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Встановлення за іменем, як-от <code>zef install Cro<\/code>, робить те саме.<\/span> <span class=\"sg\" data-s=\"3\">Але спершу воно завантажує дистрибутив з екосистеми.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете <strong>опублікувати<\/strong> власний дистрибутив, щоб інші могли встановити його за іменем.<\/span> <span class=\"sg\" data-s=\"1\">Для цього ви завантажуєте його в екосистему.<\/span> <span class=\"sg\" data-s=\"2\">Звичайний інструмент для цього — <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це пакує поточний дистрибутив і надсилає його до екосистеми Raku.<\/span> <span class=\"sg\" data-s=\"1\">Після цього <code>zef install Maths::Simple<\/code> спрацює в будь-кого.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Цим командам потрібні встановлені <code>zef<\/code>/<code>fez<\/code> і з'єднання з мережею. Для завантаження також потрібен обліковий запис в екосистемі.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Отже, життя спільного модуля має три кроки.<\/span> <span class=\"sg\" data-s=\"1\">Ви даєте йому структуру з <code>META6.json<\/code> і тестуєте його через <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім ви публікуєте його через <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Відтоді це просто ще одне ім'я, яке будь-хто може встановити через <code>zef install<\/code>.<\/span><\/p>"]]},"bg":{"t":"zef и екосистемата","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> е инсталаторът на модули на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте го използвали, за да инсталирате модули по име.<\/span> <span class=\"sg\" data-s=\"2\">Той работи и с локална директория на дистрибуция.<\/span> <span class=\"sg\" data-s=\"3\">Вътре в дистрибуцията можете директно да я тествате и инсталирате:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> изпълнява файловете под <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> инсталира дистрибуцията във вашия Raku, така че други програми да могат да я заредят с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Инсталирането по име, както в <code>zef install Cro<\/code>, прави същото.<\/span> <span class=\"sg\" data-s=\"3\">Но първо изтегля дистрибуцията от екосистемата.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да <strong>публикувате<\/strong> своя дистрибуция, така че други да могат да я инсталират по име.<\/span> <span class=\"sg\" data-s=\"1\">За целта я качвате в екосистемата.<\/span> <span class=\"sg\" data-s=\"2\">Обичайният инструмент за това е <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това пакетира текущата дистрибуция и я изпраща в екосистемата на Raku.<\/span> <span class=\"sg\" data-s=\"1\">След това <code>zef install Maths::Simple<\/code> ще работи за всеки.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тези команди изискват инсталирани <code>zef<\/code>/<code>fez<\/code> и връзка с мрежата. Качването изисква и акаунт в екосистемата.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Така животът на споделения модул има три стъпки.<\/span> <span class=\"sg\" data-s=\"1\">Оформяте го с <code>META6.json<\/code> и го тествате със <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това го публикувате с <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оттам нататък той е просто още едно име, което всеки може да инсталира със <code>zef install<\/code>.<\/span><\/p>"]]},"eo":{"t":"zef kaj la ekosistemo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> estas la modula instalilo de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam uzis ĝin por instali modulojn laŭ nomo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ funkcias kun loka distribua dosierujo.<\/span> <span class=\"sg\" data-s=\"3\">Ene de distribuo vi povas rekte testi kaj instali ĝin:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> rulas la dosierojn sub <code>t/<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> instalas la distribuon en vian Raku, tiel ke aliaj programoj povas <code>use<\/code> ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Instali laŭ nomo, kiel en <code>zef install Cro<\/code>, faras la samon.<\/span> <span class=\"sg\" data-s=\"3\">Sed ĝi unue elŝutas la distribuon el la ekosistemo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas <strong>publikigi<\/strong> vian propran distribuon, tiel ke aliaj povas instali ĝin laŭ nomo.<\/span> <span class=\"sg\" data-s=\"1\">Por tio vi alŝutas ĝin al la ekosistemo.<\/span> <span class=\"sg\" data-s=\"2\">La kutima ilo por tio estas <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio pakas la nunan distribuon kaj sendas ĝin al la Raku-ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, <code>zef install Maths::Simple<\/code> funkcios por iu ajn.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Ĉi tiuj komandoj bezonas instalitajn <code>zef<\/code>/<code>fez<\/code> kaj retan konekton. Alŝutado ankaŭ bezonas ekosisteman konton.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do la vivo de kunhavigita modulo havas tri paŝojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi aranĝas ĝin kun <code>META6.json<\/code> kaj testas ĝin per <code>zef test<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste vi publikigas ĝin per <code>fez upload<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De tiam ĝi estas nur unu plia nomo, kiun iu ajn povas <code>zef install<\/code>.<\/span><\/p>"]]},"la":{"t":"zef et oecosystema","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> est installator modulorum Raku.<\/span> <span class=\"sg\" data-s=\"1\">Iam eo usus es ut modulos nomine installares.<\/span> <span class=\"sg\" data-s=\"2\">Etiam cum directorio distributionis locali operatur.<\/span> <span class=\"sg\" data-s=\"3\">Intra distributionem eam directe probare et installare potes:<\/span><\/p>"],["code",0,"<pre><code>zef test .\nzef install .<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>zef test .<\/code> archiva sub <code>t/<\/code> exsequitur.<\/span> <span class=\"sg\" data-s=\"1\"><code>zef install .<\/code> distributionem in Raku tuum installat, ut alia programmata eam per <code>use<\/code> adhibere possint.<\/span> <span class=\"sg\" data-s=\"2\">Installatio nomine, ut in <code>zef install Cro<\/code>, idem facit.<\/span> <span class=\"sg\" data-s=\"3\">Sed prius distributionem ex systemate deponit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Distributionem tuam <strong>publicare<\/strong> potes, ut alii eam nomine installare possint.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc eam in systema imponis.<\/span> <span class=\"sg\" data-s=\"2\">Instrumentum usitatum ad hoc est <code>fez<\/code>:<\/span><\/p>"],["code",0,"<pre><code>fez upload<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc distributionem praesentem componit et in systema Raku mittit.<\/span> <span class=\"sg\" data-s=\"1\">Postea <code>zef install Maths::Simple<\/code> pro omnibus operabitur.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Haec mandata <code>zef<\/code>/<code>fez<\/code> installata et accessum ad retia requirunt. Impositio etiam rationem in systemate requirit.<\/span><\/blockquote>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Itaque vita moduli communicati tres gradus habet.<\/span> <span class=\"sg\" data-s=\"1\">Eum cum <code>META6.json<\/code> disponis et per <code>zef test<\/code> probas.<\/span> <span class=\"sg\" data-s=\"2\">Deinde eum per <code>fez upload<\/code> publicas.<\/span> <span class=\"sg\" data-s=\"3\">Ab eo tempore solum unum aliud nomen est quod quisque per <code>zef install<\/code> installare potest.<\/span><\/p>"]]}}}</script>
