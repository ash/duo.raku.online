<script type="application/json" id="page-data">{"u":"advanced/enumerations/values-and-keys","n":515,"k":"topic","pv":"advanced/enumerations/defining/quiz","nx":"advanced/enumerations/values-and-keys/quiz","tr":["advanced","advanced/enumerations"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Values and keys","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Every enum constant has both a name and a number.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.value<\/code> method returns the number, and <code>.key<\/code> returns the name as a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You do not have to use the automatic numbers from zero.<\/span> <span class=\"sg\" data-s=\"1\">To choose the values yourself, write the constants as pairs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here, the working week starts at one instead of zero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The enum type can also list all its constants itself.<\/span> <span class=\"sg\" data-s=\"1\">Its <code>.enums<\/code> method returns a map that links each name to its value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">These three methods, <code>.value<\/code>, <code>.key<\/code> and <code>.enums<\/code>, let you move around freely.<\/span> <span class=\"sg\" data-s=\"1\">You can go from a constant to its number and from a number back to data.<\/span> <span class=\"sg\" data-s=\"2\">You can also work with the whole set.<\/span> <span class=\"sg\" data-s=\"3\">This is what makes enums useful for things like menus, states and lookup tables.<\/span><\/p>"]]},"de":{"t":"Werte und Schlüssel","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede Enum-Konstante hat einen Namen und eine Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>.value<\/code> gibt die Zahl zurück, und <code>.key<\/code> gibt den Namen als String zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Du musst nicht die automatischen Zahlen ab null benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Um die Werte selbst zu wählen, schreibe die Konstanten als Paare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier beginnt die Arbeitswoche bei eins statt bei null.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Enum-Typ kann auch selbst alle seine Konstanten auflisten.<\/span> <span class=\"sg\" data-s=\"1\">Seine Methode <code>.enums<\/code> gibt eine Map zurück, die jeden Namen mit seinem Wert verbindet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mit diesen drei Methoden, <code>.value<\/code>, <code>.key<\/code> und <code>.enums<\/code>, kannst du dich frei bewegen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst von einer Konstante zu ihrer Zahl gehen und von einer Zahl zurück zu den Daten.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst auch mit der ganzen Menge arbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Deshalb sind Enums nützlich für Dinge wie Menüs, Zustände und Nachschlagetabellen.<\/span><\/p>"]]},"nl":{"t":"Waarden en sleutels","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke enum-constante heeft zowel een naam als een getal.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.value<\/code> geeft het getal terug, en <code>.key<\/code> geeft de naam als een tekenreeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hoeft de automatische nummers vanaf nul niet te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Om de waarden zelf te kiezen, schrijf je de constanten als paren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier begint de werkweek bij één in plaats van bij nul.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het enum-type kan zelf ook al zijn constanten opsommen.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>.enums<\/code> geeft een map terug die elke naam aan zijn waarde koppelt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Met deze drie methoden, <code>.value<\/code>, <code>.key<\/code> en <code>.enums<\/code>, kun je vrij heen en weer gaan.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt van een constante naar zijn getal gaan en van een getal terug naar de gegevens.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ook met de hele verzameling werken.<\/span> <span class=\"sg\" data-s=\"3\">Daardoor zijn enums handig voor zaken als menu's, toestanden en opzoektabellen.<\/span><\/p>"]]},"es":{"t":"Valores y claves","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada constante de un enum tiene un nombre y también un número.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>.value<\/code> devuelve el número, y <code>.key<\/code> devuelve el nombre como cadena de texto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">No tienes que usar los números automáticos desde cero.<\/span> <span class=\"sg\" data-s=\"1\">Para elegir los valores tú mismo, escribe las constantes como pares:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí, la semana laboral empieza en uno en lugar de cero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El propio tipo enum también puede listar todas sus constantes.<\/span> <span class=\"sg\" data-s=\"1\">Su método <code>.enums<\/code> devuelve un mapa que une cada nombre con su valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estos tres métodos, <code>.value<\/code>, <code>.key<\/code> y <code>.enums<\/code>, te permiten moverte con libertad.<\/span> <span class=\"sg\" data-s=\"1\">Puedes ir de una constante a su número y volver de un número a los datos.<\/span> <span class=\"sg\" data-s=\"2\">También puedes trabajar con todo el conjunto.<\/span> <span class=\"sg\" data-s=\"3\">Por eso los enums son útiles para cosas como menús, estados y tablas de búsqueda.<\/span><\/p>"]]},"it":{"t":"Valori e chiavi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni costante di un enum ha sia un nome sia un numero.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>.value<\/code> restituisce il numero, e <code>.key<\/code> restituisce il nome come stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non devi per forza usare i numeri automatici da zero.<\/span> <span class=\"sg\" data-s=\"1\">Per scegliere tu i valori, scrivi le costanti come coppie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Qui la settimana lavorativa parte da uno invece che da zero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il tipo enum può anche elencare da solo tutte le sue costanti.<\/span> <span class=\"sg\" data-s=\"1\">Il suo metodo <code>.enums<\/code> restituisce una mappa che collega ogni nome al suo valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questi tre metodi, <code>.value<\/code>, <code>.key<\/code> e <code>.enums<\/code>, ti permettono di muoverti liberamente.<\/span> <span class=\"sg\" data-s=\"1\">Puoi andare da una costante al suo numero e da un numero di nuovo ai dati.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche lavorare con l'intero insieme.<\/span> <span class=\"sg\" data-s=\"3\">Ecco perché gli enum sono utili per cose come menu, stati e tabelle di ricerca.<\/span><\/p>"]]},"lv":{"t":"Vērtības un atslēgas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrai uzskaitījuma konstantei ir gan nosaukums, gan skaitlis.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>.value<\/code> atgriež skaitli, bet <code>.key<\/code> atgriež nosaukumu kā virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jums nav obligāti jāizmanto automātiskie numuri no nulles.<\/span> <span class=\"sg\" data-s=\"1\">Lai vērtības izvēlētos pats, rakstiet konstantes kā pārus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit darba nedēļa sākas ar vienu, nevis ar nulli.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzskaitījuma tips pats var arī uzskaitīt visas savas konstantes.<\/span> <span class=\"sg\" data-s=\"1\">Tā metode <code>.enums<\/code> atgriež attēlojumu, kas saista katru nosaukumu ar tā vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šīs trīs metodes, <code>.value<\/code>, <code>.key<\/code> un <code>.enums<\/code>, ļauj jums brīvi pārvietoties.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat iet no konstantes uz tās skaitli un no skaitļa atpakaļ uz datiem.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat strādāt arī ar visu kopu.<\/span> <span class=\"sg\" data-s=\"3\">Tieši tas padara uzskaitījumus noderīgus tādām lietām kā izvēlnes, stāvokļi un uzmeklēšanas tabulas.<\/span><\/p>"]]},"ru":{"t":"Значения и ключи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У каждой константы перечисления есть и имя, и число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> возвращает число, а <code>.key<\/code> возвращает имя в виде строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам не обязательно использовать автоматические номера от нуля.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы выбрать значения самим, запишите константы в виде пар:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Здесь рабочая неделя начинается с единицы вместо нуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип перечисления может и сам перечислить все свои константы.<\/span> <span class=\"sg\" data-s=\"1\">Его метод <code>.enums<\/code> возвращает отображение, которое связывает каждое имя с его значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Эти три метода, <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code>, позволяют свободно двигаться.<\/span> <span class=\"sg\" data-s=\"1\">Можно перейти от константы к её числу и от числа обратно к данным.<\/span> <span class=\"sg\" data-s=\"2\">Можно также работать со всем набором.<\/span> <span class=\"sg\" data-s=\"3\">Именно поэтому перечисления полезны для таких вещей, как меню, состояния и таблицы соответствий.<\/span><\/p>"]]},"uk":{"t":"Значення та ключі","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожна константа перелічення має і ім'я, і число.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>.value<\/code> повертає число, а <code>.key<\/code> повертає ім'я як рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вам не обов'язково використовувати автоматичні числа від нуля.<\/span> <span class=\"sg\" data-s=\"1\">Щоб обрати значення самостійно, запишіть константи як пари:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тут робочий тиждень починається з одиниці замість нуля.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тип перелічення може й сам перелічити всі свої константи.<\/span> <span class=\"sg\" data-s=\"1\">Його метод <code>.enums<\/code> повертає відображення, яке пов'язує кожне ім'я з його значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ці три методи, <code>.value<\/code>, <code>.key<\/code> і <code>.enums<\/code>, дозволяють вільно рухатися.<\/span> <span class=\"sg\" data-s=\"1\">Можна перейти від константи до її числа і від числа назад до даних.<\/span> <span class=\"sg\" data-s=\"2\">Також можна працювати з усім набором.<\/span> <span class=\"sg\" data-s=\"3\">Саме це робить перелічення корисними для таких речей, як меню, стани й таблиці пошуку.<\/span><\/p>"]]},"bg":{"t":"Стойности и ключове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Всяка константа на изброим тип има и име, и число.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>.value<\/code> връща числото, а <code>.key<\/code> връща името като низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Не е задължително да използвате автоматичните числа от нула.<\/span> <span class=\"sg\" data-s=\"1\">За да изберете стойностите сами, запишете константите като двойки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тук работната седмица започва от едно вместо от нула.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Самият изброим тип също може да изброи всичките си константи.<\/span> <span class=\"sg\" data-s=\"1\">Неговият метод <code>.enums<\/code> връща карта, която свързва всяко име с неговата стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тези три метода, <code>.value<\/code>, <code>.key<\/code> и <code>.enums<\/code>, ви позволяват да се движите свободно.<\/span> <span class=\"sg\" data-s=\"1\">Можете да минете от константа към нейното число и от число обратно към данните.<\/span> <span class=\"sg\" data-s=\"2\">Можете да работите и с целия набор.<\/span> <span class=\"sg\" data-s=\"3\">Ето защо изброимите типове са полезни за неща като менюта, състояния и таблици за справка.<\/span><\/p>"]]},"eo":{"t":"Valoroj kaj ŝlosiloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu enumeracia konstanto havas kaj nomon kaj nombron.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>.value<\/code> redonas la nombron, kaj <code>.key<\/code> redonas la nomon kiel ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ne devas uzi la aŭtomatajn nombrojn de nulo.<\/span> <span class=\"sg\" data-s=\"1\">Por mem elekti la valorojn, skribu la konstantojn kiel parojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la labora semajno komenciĝas ĉe unu anstataŭ ĉe nulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La enumeracia tipo ankaŭ povas mem listigi ĉiujn siajn konstantojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia metodo <code>.enums<\/code> redonas mapon, kiu ligas ĉiun nomon al ĝia valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj tri metodoj, <code>.value<\/code>, <code>.key<\/code> kaj <code>.enums<\/code>, lasas vin libere moviĝi.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas iri de konstanto al ĝia nombro kaj de nombro reen al datumoj.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas labori kun la tuta aro.<\/span> <span class=\"sg\" data-s=\"3\">Tio faras enumeraciojn utilaj por aferoj kiel menuoj, statoj kaj serĉtabeloj.<\/span><\/p>"]]},"la":{"t":"Valores et claves","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Omnis constans enumerationis et nomen et numerum habet.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>.value<\/code> numerum reddit, et <code>.key<\/code> nomen ut chordam reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay green.value; # 1\nsay green.key;   # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Non necesse est numeros automaticos ab zero adhibere.<\/span> <span class=\"sg\" data-s=\"1\">Ut valores ipse eligas, constantes ut paria scribe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Day (Mon =&gt; 1, Tue =&gt; 2, Wed =&gt; 3, Thu =&gt; 4, Fri =&gt; 5);\n\nsay Tue.value; # 2\nsay Fri.value; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic hebdomas operaria ab uno potius quam ab zero incipit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Typus enumerationis etiam ipse omnes constantes suas enumerare potest.<\/span> <span class=\"sg\" data-s=\"1\">Methodus eius <code>.enums<\/code> tabulam reddit quae quodque nomen cum valore suo coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;\n\nsay Colour.enums;       # Map.new((blue =&gt; 2, green =&gt; 1, red =&gt; 0))\nsay Colour.enums.elems; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hae tres methodi, <code>.value<\/code>, <code>.key<\/code> et <code>.enums<\/code>, tibi permittunt libere ire.<\/span> <span class=\"sg\" data-s=\"1\">A constante ad numerum eius ire potes et a numero retro ad data.<\/span> <span class=\"sg\" data-s=\"2\">Etiam cum toto grege operari potes.<\/span> <span class=\"sg\" data-s=\"3\">Hoc enumerationes utiles reddit pro rebus ut indicibus, statibus et tabulis inspectionis.<\/span><\/p>"]]}}}</script>
