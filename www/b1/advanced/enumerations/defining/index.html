u\"><code>say Colour::red; # red<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перечисление даёт группе связанных констант имя и тип.<\/span> <span class=\"sg\" data-s=\"1\">Код, который их использует, гораздо понятнее, чем код с простыми числами.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема рассказывает о <a href=\"https://course.raku.org/ru/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числах, которые стоят за именами<\/a>.<\/span><\/p>"]]},"uk":{"t":"Визначення перелічення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб оголосити перелічення, напишіть ключове слово <code>enum<\/code>, ім'я та список імен констант:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер є новий тип <code>Colour<\/code> із трьома константами: <code>red<\/code>, <code>green<\/code> і <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кожну константу можна використовувати прямо за її іменем:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За кожним іменем стоїть число.<\/span> <span class=\"sg\" data-s=\"1\">Raku дає ці числа автоматично, від нуля, у порядку вашого списку.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>red<\/code> — це <code>0<\/code>, <code>green<\/code> — <code>1<\/code>, а <code>blue<\/code> — <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оскільки значення мають порядок, константи можна порівнювати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінній можна дати перелічення як тип.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вона приймає лише ці константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ім'я константи може збігатися з іншим іменем у вашій програмі.<\/span> <span class=\"sg\" data-s=\"1\">Тоді до константи завжди можна звернутися через ім'я перелічення та <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перелічення дає групі пов'язаних констант ім'я та тип.<\/span> <span class=\"sg\" data-s=\"1\">Код, який їх використовує, набагато зрозуміліший за код зі звичайними числами.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема розглядає <a href=\"https://course.raku.org/uk/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числа, що стоять за іменами<\/a>.<\/span><\/p>"]]},"bg":{"t":"Дефиниране на enum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">За да декларирате изброим тип, напишете ключовата дума <code>enum<\/code>, име и списък от имена на константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега има нов тип, <code>Colour<\/code>, с три константи: <code>red<\/code>, <code>green<\/code> и <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да използвате всяка константа директно по нейното име:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зад всяко име стои число.<\/span> <span class=\"sg\" data-s=\"1\">Raku дава тези числа автоматично, като започва от нула, в реда на вашия списък.<\/span> <span class=\"sg\" data-s=\"2\">Така <code>red<\/code> е <code>0<\/code>, <code>green<\/code> е <code>1<\/code>, а <code>blue<\/code> е <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тъй като стойностите имат ред, можете да сравнявате константите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да дадете на променлива изброимия тип като неин тип.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя приема само тези константи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Името на константа може да съвпада с друго име във вашата програма.<\/span> <span class=\"sg\" data-s=\"1\">Тогава винаги можете да стигнете до константата чрез името на изброимия тип и <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Изброимият тип дава на група свързани константи име и тип.<\/span> <span class=\"sg\" data-s=\"1\">Кодът, който ги използва, е много по-ясен от код с обикновени числа.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема разглежда <a href=\"https://course.raku.org/bg/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">числата зад имената<\/a>.<\/span><\/p>"]]},"eo":{"t":"Difini enumeracion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Por deklari enumeracion, skribu la ŝlosilvorton <code>enum<\/code>, nomon kaj la liston de konstantaj nomoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun ekzistas nova tipo, <code>Colour<\/code>, kun tri konstantoj: <code>red<\/code>, <code>green<\/code> kaj <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĉiun konstanton rekte per ĝia nomo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Malantaŭ ĉiu nomo estas nombro.<\/span> <span class=\"sg\" data-s=\"1\">Raku donas ĉi tiujn nombrojn aŭtomate, komencante de nulo, laŭ la ordo de via listo.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>red<\/code> estas <code>0<\/code>, <code>green<\/code> estas <code>1<\/code> kaj <code>blue<\/code> estas <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉar la valoroj havas ordon, vi povas kompari la konstantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas doni al variablo la enumeracion kiel tipon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi akceptas nur tiujn konstantojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La nomo de konstanto povas esti la sama kiel alia nomo en via programo.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi ĉiam povas atingi la konstanton per la nomo de la enumeracio kaj <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Enumeracio donas al grupo de rilataj konstantoj nomon kaj tipon.<\/span> <span class=\"sg\" data-s=\"1\">Kodo, kiu uzas ilin, estas multe pli klara ol kodo kun simplaj nombroj.<\/span> <span class=\"sg\" data-s=\"2\">La sekva temo rigardas <a href=\"https://course.raku.org/eo/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">la nombrojn malantaŭ la nomoj<\/a>.<\/span><\/p>"]]},"la":{"t":"Enumerationem definire","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut enum declares, scribe verbum clavis <code>enum<\/code>, nomen et indicem nominum constantium:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>enum Colour &lt;red green blue&gt;;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc est novus typus, <code>Colour<\/code>, cum tribus constantibus: <code>red<\/code>, <code>green<\/code> et <code>blue<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quamque constantem directe nomine eius adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red;   # red\nsay green; # green<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Post quodque nomen est numerus.<\/span> <span class=\"sg\" data-s=\"1\">Raku hos numeros sponte dat, ab zero incipiens, ordine indicis tui.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>red<\/code> est <code>0<\/code>, <code>green<\/code> est <code>1<\/code> et <code>blue<\/code> est <code>2<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Quia valores ordinem habent, constantes comparare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say red &lt; blue; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabili enum ut typum dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum solas illas constantes accipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Colour $c = green;\nsay $c; # green<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomen constantis idem esse potest ac aliud nomen in programmate tuo.<\/span> <span class=\"sg\" data-s=\"1\">Tum constantem semper per nomen enumerationis et <code>::<\/code> attingere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Colour::red; # red<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Enum gregi constantium cognatarum nomen et typum dat.<\/span> <span class=\"sg\" data-s=\"1\">Codex qui eas adhibet multo clarior est quam codex cum nudis numeris.<\/span> <span class=\"sg\" data-s=\"2\">Proximum thema <a href=\"https://course.raku.org/la/advanced/enumerations/values-and-keys/\" target=\"_blank\" rel=\"noopener\">numeros post nomina<\/a> spectat.<\/span><\/p>"]]}}}</script>
