sg\" data-s=\"0\">Fortasse putes <code>$current++<\/code> sponte ad proximam lucem progredi.<\/span> <span class=\"sg\" data-s=\"1\">Id tempta et vide quid accidat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/enumerations/exercises/traffic-enum/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
