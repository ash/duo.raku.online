a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> ir parasts mainīgais, un jūs varat to mainīt. Vienīgais ierobežojums ir tas, ka tajā jābūt <code>Light<\/code>. Kad piešķirat nākamo konstanti, gaisma pārslēdzas. Skaitlis katru reizi seko nosaukumam: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izskatās, ka <code>$current++<\/code> vajadzētu pašam pāriet uz nākamo gaismu. Bet tas beidzas ar tipa pārbaudes kļūdu. <code>++<\/code> izmanto konstanti kā vienkāršu skaitli un atgriež <code>Int<\/code> (<code>red<\/code> kļūst par <code>1<\/code>). Bet <code>Int<\/code> neder tipam <code>Light<\/code>. Tāpēc gaismu pārslēdz, piešķirot nākamo konstanti, kā augstāk.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tipa pārbaude darbojas katrai piešķiršanai, ne tikai pirmajai. <code>$current<\/code> pieņem <code>red<\/code>, <code>amber<\/code> vai <code>green<\/code>. Kaut kas, kas nav <code>Light<\/code>, dod tipa pārbaudes kļūdu. Tā tas ir, piemēram, ar vienkāršu skaitli vai virkni.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Светофор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> — обычная переменная, и её можно менять. Единственное ограничение — она должна хранить <code>Light<\/code>. Когда вы присваиваете следующую константу, сигнал переключается. Число каждый раз следует за именем: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Кажется, что <code>$current++<\/code> должен сам перейти к следующему сигналу. Но он завершается ошибкой проверки типа. <code>++<\/code> использует константу как простое число и возвращает <code>Int<\/code> (<code>red<\/code> становится <code>1<\/code>). Но <code>Int<\/code> не подходит к типу <code>Light<\/code>. Поэтому, чтобы переключить сигнал, вы присваиваете следующую константу, как показано выше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Проверка типа работает при каждом присваивании, а не только при первом. <code>$current<\/code> принимает <code>red<\/code>, <code>amber<\/code> или <code>green<\/code>. Если присвоить что-то, что не является <code>Light<\/code>, будет ошибка проверки типа. Например, так будет с простым числом или строкой.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Світлофор","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> — це звичайна змінна, і її можна змінювати. Єдине обмеження: вона мусить зберігати <code>Light<\/code>. Коли ви присвоюєте наступну константу, сигнал переходить далі. Число щоразу йде за іменем: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Здається, що <code>$current++<\/code> мав би сам перейти до наступного сигналу. Але він дає помилку перевірки типу. <code>++<\/code> використовує константу як звичайне число й повертає <code>Int<\/code> (<code>red<\/code> стає <code>1<\/code>). Але <code>Int<\/code> не підходить до типу <code>Light<\/code>. Тож щоб змінити сигнал, ви присвоюєте наступну константу, як вище.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Перевірка типу працює для кожного присвоєння, а не лише для першого. <code>$current<\/code> приймає <code>red<\/code>, <code>amber<\/code> або <code>green<\/code>. Те, що не є <code>Light<\/code>, дає помилку перевірки типу. Це стосується, наприклад, звичайного числа чи рядка.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Светофар","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> е обикновена променлива и можете да я променяте. Единственото ограничение е, че тя трябва да пази <code>Light<\/code>. Когато присвоите следващата константа, светлината минава нататък. Всеки път числото следва името: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изглежда, че <code>$current++<\/code> трябва да мине сам към следващата светлина. Но той се проваля с грешка при проверка на типа. <code>++<\/code> използва константата като обикновено число и връща <code>Int<\/code> (<code>red<\/code> става <code>1<\/code>). Но <code>Int<\/code> не отговаря на типа <code>Light<\/code>. Затова сменяте светлината, като присвоявате следващата константа, както по-горе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Проверката на типа работи при всяко присвояване, не само при първото. <code>$current<\/code> приема <code>red<\/code>, <code>amber<\/code> или <code>green<\/code>. Нещо, което не е <code>Light<\/code>, дава грешка при проверка на типа. Това важи например за обикновено число или за низ.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Trafiklumo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> estas normala variablo, kaj vi povas ŝanĝi ĝin. La sola limo estas, ke ĝi devas teni <code>Light<\/code>. Kiam vi atribuas la sekvan konstanton, la lumo iras plu. La nombro sekvas la nomon ĉiufoje: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> aspektas, kvazaŭ ĝi devus iri al la sekva lumo per si mem. Sed ĝi malsukcesas kun tipkontrola eraro. <code>++<\/code> uzas la konstanton kiel ĝian simplan nombron kaj redonas <code>Int<\/code> (<code>red<\/code> fariĝas <code>1<\/code>). Sed <code>Int<\/code> ne konvenas al la tipo <code>Light<\/code>. Do vi movas la lumon, atribuante la sekvan konstanton, kiel supre.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tipkontrolo funkcias por ĉiu atribuo, ne nur por la unua. <code>$current<\/code> akceptas <code>red<\/code>, <code>amber<\/code> aŭ <code>green<\/code>. Io, kio ne estas <code>Light<\/code>, donas tipkontrolan eraron. Tio validas, ekzemple, por simpla nombro aŭ ĉeno.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Lumina trafficum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>enum Light &lt;red amber green&gt;;\n\nmy Light $current = red;\nsay \"$current is {$current.value}\";\n\n$current = amber;\nsay \"$current is {$current.value}\";\n\n$current = green;\nsay \"$current is {$current.value}\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/enumerations/traffic-enum.raku\" target=\"_blank\" rel=\"noopener\">traffic-enum.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>red is 0\namber is 1\ngreen is 2<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>my Light $current<\/code> est variabilis ordinaria, et eam mutare potes. Solus limes est quod <code>Light<\/code> tenere debet. Cum proximam constantem assignas, lux progreditur. Numerus quaque vice nomen sequitur: <code>0<\/code>, <code>1<\/code>, <code>2<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$current++<\/code> videtur sponte ad proximam lucem ire debere. Sed errore typi verificandi deficit. <code>++<\/code> constantem ut nudum numerum eius adhibet et <code>Int<\/code> reddit (<code>red<\/code> fit <code>1<\/code>). Sed <code>Int<\/code> typo <code>Light<\/code> non convenit. Itaque lucem moves proximam constantem assignando, ut supra.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Probatio typi in omni assignatione operatur, non solum in prima. <code>$current<\/code> accipit <code>red<\/code>, <code>amber<\/code> vel <code>green<\/code>. Aliquid quod non est <code>Light<\/code> errorem typi verificandi dat. Hoc verum est, exempli gratia, pro nudo numero vel chorda.<\/span><\/li><\/ol>"]]}}}</script>
