<script type="application/json" id="page-data">{"u":"advanced/enumerations","n":512,"k":"section","pv":"advanced/sequences/exercises/last-three/solution","nx":"advanced/enumerations/defining","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Enumerations","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">An <em>enumeration<\/em>, or <em>enum<\/em>, is a type with a fixed set of values.<\/span> <span class=\"sg\" data-s=\"1\">Each value is a named constant.<\/span> <span class=\"sg\" data-s=\"2\">Think of the days of the week or the colours of a traffic light.<\/span> <span class=\"sg\" data-s=\"3\">The suits in a deck of cards are another example.<\/span> <span class=\"sg\" data-s=\"4\">You do not have to remember that <code>0<\/code> means red and <code>1<\/code> means amber.<\/span> <span class=\"sg\" data-s=\"5\">Instead, you give each value a name, and Raku keeps track of the numbers.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In this section, you will learn how to define an enum.<\/span> <span class=\"sg\" data-s=\"1\">You will also see how to go between its names and the values behind them.<\/span><\/p>"]]},"de":{"t":"Aufzählungen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Enumeration<\/em>, kurz <em>Enum<\/em>, ist ein Typ mit einer festen Menge von Werten.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Wert ist eine benannte Konstante.<\/span> <span class=\"sg\" data-s=\"2\">Denk zum Beispiel an die Wochentage oder an die Farben einer Ampel.<\/span> <span class=\"sg\" data-s=\"3\">Die Farben in einem Kartenspiel sind ein weiteres Beispiel.<\/span> <span class=\"sg\" data-s=\"4\">Du musst dir nicht merken, dass <code>0<\/code> rot und <code>1<\/code> gelb bedeutet.<\/span> <span class=\"sg\" data-s=\"5\">Stattdessen gibst du jedem Wert einen Namen, und Raku kümmert sich um die Zahlen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt lernst du, wie man ein Enum definiert.<\/span> <span class=\"sg\" data-s=\"1\">Du siehst auch, wie man zwischen seinen Namen und den Werten dahinter wechselt.<\/span><\/p>"]]},"nl":{"t":"Enumeraties","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>enumeratie<\/em>, of <em>enum<\/em>, is een type met een vaste verzameling waarden.<\/span> <span class=\"sg\" data-s=\"1\">Elke waarde is een constante met een naam.<\/span> <span class=\"sg\" data-s=\"2\">Denk aan de dagen van de week of de kleuren van een verkeerslicht.<\/span> <span class=\"sg\" data-s=\"3\">De kleuren in een kaartspel zijn nog een voorbeeld.<\/span> <span class=\"sg\" data-s=\"4\">Je hoeft niet te onthouden dat <code>0<\/code> rood betekent en <code>1<\/code> oranje.<\/span> <span class=\"sg\" data-s=\"5\">In plaats daarvan geef je elke waarde een naam, en Raku houdt de nummers bij.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In dit onderdeel leer je hoe je een enum definieert.<\/span> <span class=\"sg\" data-s=\"1\">Je ziet ook hoe je wisselt tussen de namen en de waarden erachter.<\/span><\/p>"]]},"es":{"t":"Enumeraciones","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Una <em>enumeración<\/em>, o <em>enum<\/em>, es un tipo con un conjunto fijo de valores.<\/span> <span class=\"sg\" data-s=\"1\">Cada valor es una constante con nombre.<\/span> <span class=\"sg\" data-s=\"2\">Piensa en los días de la semana o en los colores de un semáforo.<\/span> <span class=\"sg\" data-s=\"3\">Los palos de una baraja de cartas son otro ejemplo.<\/span> <span class=\"sg\" data-s=\"4\">No tienes que recordar que <code>0<\/code> significa rojo y <code>1<\/code> significa ámbar.<\/span> <span class=\"sg\" data-s=\"5\">En su lugar, le das un nombre a cada valor, y Raku se encarga de los números.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En esta sección, aprenderás a definir un enum.<\/span> <span class=\"sg\" data-s=\"1\">También verás cómo moverte entre sus nombres y los valores que hay detrás de ellos.<\/span><\/p>"]]},"it":{"t":"Enumerazioni","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un'<em>enumerazione<\/em>, o <em>enum<\/em>, è un tipo con un insieme fisso di valori.<\/span> <span class=\"sg\" data-s=\"1\">Ogni valore è una costante con nome.<\/span> <span class=\"sg\" data-s=\"2\">Pensa ai giorni della settimana o ai colori di un semaforo.<\/span> <span class=\"sg\" data-s=\"3\">I semi di un mazzo di carte sono un altro esempio.<\/span> <span class=\"sg\" data-s=\"4\">Non devi ricordare che <code>0<\/code> significa rosso e <code>1<\/code> significa giallo.<\/span> <span class=\"sg\" data-s=\"5\">Invece dai un nome a ogni valore, e Raku tiene traccia dei numeri.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In questa sezione imparerai a definire un enum.<\/span> <span class=\"sg\" data-s=\"1\">Vedrai anche come muoverti tra i suoi nomi e i valori che stanno dietro.<\/span><\/p>"]]},"lv":{"t":"Uzskaitījumi 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Uzskaitījums<\/em> jeb <em>enum<\/em> ir tips ar noteiktu vērtību kopu.<\/span> <span class=\"sg\" data-s=\"1\">Katra vērtība ir nosaukta konstante.<\/span> <span class=\"sg\" data-s=\"2\">Iedomājieties nedēļas dienas vai luksofora krāsas.<\/span> <span class=\"sg\" data-s=\"3\">Kāršu masti ir vēl viens piemērs.<\/span> <span class=\"sg\" data-s=\"4\">Jums nav jāatceras, ka <code>0<\/code> nozīmē sarkano un <code>1<\/code> — dzelteno.<\/span> <span class=\"sg\" data-s=\"5\">Tā vietā jūs katrai vērtībai dodat nosaukumu, un Raku seko līdzi skaitļiem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā jūs uzzināsiet, kā definēt uzskaitījumu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs arī redzēsiet, kā pāriet starp tā nosaukumiem un vērtībām, kas aiz tiem stāv.<\/span><\/p>"]]},"ru":{"t":"Перечисления","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Перечисление<\/em>, или <em>enum<\/em>, — это тип с фиксированным набором значений.<\/span> <span class=\"sg\" data-s=\"1\">Каждое значение — это именованная константа.<\/span> <span class=\"sg\" data-s=\"2\">Вспомните дни недели или цвета светофора.<\/span> <span class=\"sg\" data-s=\"3\">Масти в колоде карт — ещё один пример.<\/span> <span class=\"sg\" data-s=\"4\">Вам не нужно запоминать, что <code>0<\/code> означает красный, а <code>1<\/code> — жёлтый.<\/span> <span class=\"sg\" data-s=\"5\">Вместо этого вы даёте каждому значению имя, а Raku следит за числами.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В этом разделе вы узнаете, как определить перечисление.<\/span> <span class=\"sg\" data-s=\"1\">Вы также увидите, как переходить между его именами и значениями, которые стоят за ними.<\/span><\/p>"]]},"uk":{"t":"Перелічення","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Перелічення<\/em>, або <em>enum<\/em>, — це тип із фіксованим набором значень.<\/span> <span class=\"sg\" data-s=\"1\">Кожне значення — це іменована константа.<\/span> <span class=\"sg\" data-s=\"2\">Згадайте дні тижня або кольори світлофора.<\/span> <span class=\"sg\" data-s=\"3\">Масті в колоді карт — ще один приклад.<\/span> <span class=\"sg\" data-s=\"4\">Вам не треба пам'ятати, що <code>0<\/code> означає червоний, а <code>1<\/code> — жовтий.<\/span> <span class=\"sg\" data-s=\"5\">Натомість ви даєте кожному значенню ім'я, а Raku стежить за числами.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ви дізнаєтеся, як визначити перелічення.<\/span> <span class=\"sg\" data-s=\"1\">Ви також побачите, як переходити між його іменами та значеннями, що стоять за ними.<\/span><\/p>"]]},"bg":{"t":"Изброявания 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Изброимият тип<\/em>, или <em>enum<\/em>, е тип с определен набор от стойности.<\/span> <span class=\"sg\" data-s=\"1\">Всяка стойност е именувана константа.<\/span> <span class=\"sg\" data-s=\"2\">Помислете за дните от седмицата или за цветовете на светофара.<\/span> <span class=\"sg\" data-s=\"3\">Боите в тесте карти са още един пример.<\/span> <span class=\"sg\" data-s=\"4\">Не е нужно да помните, че <code>0<\/code> означава червено, а <code>1<\/code> означава жълто.<\/span> <span class=\"sg\" data-s=\"5\">Вместо това давате име на всяка стойност, а Raku следи числата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В тази секция ще научите как да дефинирате изброим тип.<\/span> <span class=\"sg\" data-s=\"1\">Ще видите и как да минавате между имената му и стойностите зад тях.<\/span><\/p>"]]},"eo":{"t":"Enumeracioj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Enumeracio<\/em>, aŭ <em>enum<\/em>, estas tipo kun fiksita aro de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu valoro estas nomita konstanto.<\/span> <span class=\"sg\" data-s=\"2\">Pensu pri la tagoj de la semajno aŭ la koloroj de trafiklumo.<\/span> <span class=\"sg\" data-s=\"3\">La emblemoj en kartaro estas alia ekzemplo.<\/span> <span class=\"sg\" data-s=\"4\">Vi ne devas memori, ke <code>0<\/code> signifas ruĝan kaj <code>1<\/code> sukcenan.<\/span> <span class=\"sg\" data-s=\"5\">Anstataŭe, vi donas al ĉiu valoro nomon, kaj Raku prizorgas la nombrojn.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio, vi lernos, kiel difini enumeracion.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ vidos, kiel iri inter ĝiaj nomoj kaj la valoroj malantaŭ ili.<\/span><\/p>"]]},"la":{"t":"Enumerationes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Enumeratio<\/em>, vel <em>enum<\/em>, est typus qui fixum gregem valorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Quisque valor est constans nominata.<\/span> <span class=\"sg\" data-s=\"2\">Cogita de diebus hebdomadis vel de coloribus lucernae itinerariae.<\/span> <span class=\"sg\" data-s=\"3\">Genera chartarum in fasciculo sunt aliud exemplum.<\/span> <span class=\"sg\" data-s=\"4\">Non necesse est meminisse <code>0<\/code> significare rubrum et <code>1<\/code> flavum.<\/span> <span class=\"sg\" data-s=\"5\">Potius cuique valori nomen das, et Raku numeros custodit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In hac sectione disces quomodo enum definias.<\/span> <span class=\"sg\" data-s=\"1\">Etiam videbis quomodo a nominibus eius ad valores post ea transeas, et retro.<\/span><\/p>"]]}}}</script>
