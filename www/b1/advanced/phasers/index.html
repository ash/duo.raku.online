<script type="application/json" id="page-data">{"u":"advanced/phasers","n":579,"k":"section","pv":"advanced/traits-pragmas/exercises/no-strict/solution","nx":"advanced/phasers/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Phasers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A <em>phaser<\/em> is a special block.<\/span> <span class=\"sg\" data-s=\"1\">It runs automatically at a certain moment in the life of a program.<\/span> <span class=\"sg\" data-s=\"2\">It does not run where it appears in the source code.<\/span> <span class=\"sg\" data-s=\"3\">You do not call a phaser.<\/span> <span class=\"sg\" data-s=\"4\">You only say <em>when<\/em> its code should run, with the name of the block.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The most common phasers mark the stages of the whole program:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs as early as possible, while Raku is still compiling the program;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> runs once when the program starts, before the main code;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> runs once at the very end, after the main code has finished.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next program puts these phasers between ordinary statements.<\/span> <span class=\"sg\" data-s=\"1\">Note that the output does not follow the order of the lines in the file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> runs first, while the program is compiled.<\/span> <span class=\"sg\" data-s=\"1\">Then, when the program runs, <code>INIT<\/code> comes before the main body.<\/span> <span class=\"sg\" data-s=\"2\">The main body prints next.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> runs last, wherever it is written in the file.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> is often used just before the program ends.<\/span> <span class=\"sg\" data-s=\"1\">It can print a summary or clean something up.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> is useful for work that must happen before anything else.<\/span><\/p>"]]},"de":{"t":"Phasers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Phaser<\/em> ist ein spezieller Block.<\/span> <span class=\"sg\" data-s=\"1\">Er läuft automatisch zu einem bestimmten Zeitpunkt im Leben eines Programms.<\/span> <span class=\"sg\" data-s=\"2\">Er läuft nicht dort, wo er im Quellcode steht.<\/span> <span class=\"sg\" data-s=\"3\">Du rufst einen Phaser nicht auf.<\/span> <span class=\"sg\" data-s=\"4\">Du sagst nur mit dem Namen des Blocks, <em>wann<\/em> sein Code laufen soll.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die häufigsten Phaser markieren die Phasen des ganzen Programms:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> läuft so früh wie möglich, während Raku das Programm noch kompiliert;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> läuft einmal beim Start des Programms, vor dem Hauptcode;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> läuft einmal ganz am Ende, wenn der Hauptcode fertig ist.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das nächste Programm stellt diese Phaser zwischen gewöhnliche Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass die Ausgabe nicht der Reihenfolge der Zeilen in der Datei folgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> läuft zuerst, während das Programm kompiliert wird.<\/span> <span class=\"sg\" data-s=\"1\">Dann, wenn das Programm läuft, kommt <code>INIT<\/code> vor dem Hauptteil.<\/span> <span class=\"sg\" data-s=\"2\">Danach gibt der Hauptteil etwas aus.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> läuft zuletzt, egal wo es in der Datei steht.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> wird oft kurz vor dem Ende des Programms verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Es kann eine Zusammenfassung ausgeben oder etwas aufräumen.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> ist nützlich für Arbeit, die vor allem anderen passieren muss.<\/span><\/p>"]]},"nl":{"t":"Phasers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <em>phaser<\/em> is een speciaal blok.<\/span> <span class=\"sg\" data-s=\"1\">Het draait automatisch op een bepaald moment in het leven van een programma.<\/span> <span class=\"sg\" data-s=\"2\">Het draait niet op de plek waar het in de broncode staat.<\/span> <span class=\"sg\" data-s=\"3\">Je roept een phaser niet aan.<\/span> <span class=\"sg\" data-s=\"4\">Je geeft alleen aan <em>wanneer<\/em> de code moet draaien, met de naam van het blok.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De meest gebruikte phasers markeren de fasen van het hele programma:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> draait zo vroeg mogelijk, terwijl Raku het programma nog compileert;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> draait één keer als het programma start, vóór de hoofdcode;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> draait één keer helemaal aan het einde, als de hoofdcode klaar is.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het volgende programma zet deze phasers tussen gewone instructies.<\/span> <span class=\"sg\" data-s=\"1\">Merk op dat de uitvoer niet de volgorde van de regels in het bestand volgt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> draait als eerste, terwijl het programma gecompileerd wordt.<\/span> <span class=\"sg\" data-s=\"1\">Als het programma daarna draait, komt <code>INIT<\/code> vóór de hoofdcode.<\/span> <span class=\"sg\" data-s=\"2\">Daarna drukt de hoofdcode zijn tekst af.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> draait als laatste, waar het ook in het bestand staat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> wordt vaak gebruikt vlak voordat het programma eindigt.<\/span> <span class=\"sg\" data-s=\"1\">Het kan een samenvatting afdrukken of iets opruimen.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> is handig voor werk dat moet gebeuren voordat er iets anders gebeurt.<\/span><\/p>"]]},"es":{"t":"Phasers","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> es un bloque especial.<\/span> <span class=\"sg\" data-s=\"1\">Se ejecuta automáticamente en un momento concreto de la vida de un programa.<\/span> <span class=\"sg\" data-s=\"2\">No se ejecuta donde aparece en el código fuente.<\/span> <span class=\"sg\" data-s=\"3\">No llamas a un phaser.<\/span> <span class=\"sg\" data-s=\"4\">Solo dices <em>cuándo<\/em> debe ejecutarse su código, con el nombre del bloque.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los phasers más comunes marcan las etapas de todo el programa:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta lo antes posible, mientras Raku todavía compila el programa;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> se ejecuta una vez cuando el programa empieza, antes del código principal;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> se ejecuta una vez al final de todo, cuando el código principal ya ha terminado.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El siguiente programa pone estos phasers entre instrucciones normales.<\/span> <span class=\"sg\" data-s=\"1\">Observa que la salida no sigue el orden de las líneas del archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> se ejecuta primero, mientras se compila el programa.<\/span> <span class=\"sg\" data-s=\"1\">Después, cuando el programa se ejecuta, <code>INIT<\/code> va antes del cuerpo principal.<\/span> <span class=\"sg\" data-s=\"2\">El cuerpo principal imprime a continuación.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> se ejecuta al final, sin importar dónde esté escrito en el archivo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> se usa a menudo justo antes de que el programa termine.<\/span> <span class=\"sg\" data-s=\"1\">Puede imprimir un resumen o limpiar algo.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> es útil para el trabajo que debe ocurrir antes que cualquier otra cosa.<\/span><\/p>"]]},"it":{"t":"Phaser","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>phaser<\/em> è un blocco speciale.<\/span> <span class=\"sg\" data-s=\"1\">Viene eseguito automaticamente in un certo momento della vita di un programma.<\/span> <span class=\"sg\" data-s=\"2\">Non viene eseguito nel punto in cui si trova nel codice sorgente.<\/span> <span class=\"sg\" data-s=\"3\">Non chiami un phaser.<\/span> <span class=\"sg\" data-s=\"4\">Dici soltanto <em>quando<\/em> il suo codice deve essere eseguito, con il nome del blocco.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I phaser più comuni segnano le fasi di tutto il programma:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> viene eseguito il prima possibile, mentre Raku sta ancora compilando il programma;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> viene eseguito una volta all'avvio del programma, prima del codice principale;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> viene eseguito una volta alla fine di tutto, dopo che il codice principale è terminato.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il prossimo programma mette questi phaser tra istruzioni normali.<\/span> <span class=\"sg\" data-s=\"1\">Nota che l'output non segue l'ordine delle righe nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> viene eseguito per primo, mentre il programma viene compilato.<\/span> <span class=\"sg\" data-s=\"1\">Poi, quando il programma è in esecuzione, <code>INIT<\/code> viene prima del corpo principale.<\/span> <span class=\"sg\" data-s=\"2\">Il corpo principale stampa subito dopo.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> viene eseguito per ultimo, in qualunque punto del file sia scritto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> si usa spesso appena prima che il programma finisca.<\/span> <span class=\"sg\" data-s=\"1\">Può stampare un riepilogo o ripulire qualcosa.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> è utile per il lavoro che deve avvenire prima di qualsiasi altra cosa.<\/span><\/p>"]]},"lv":{"t":"Fāzeri","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Fāzeris<\/em> (phaser) ir īpašs bloks.<\/span> <span class=\"sg\" data-s=\"1\">Tas izpildās automātiski noteiktā programmas dzīves brīdī.<\/span> <span class=\"sg\" data-s=\"2\">Tas neizpildās tur, kur tas atrodas pirmkodā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs neizsaucat fāzeri.<\/span> <span class=\"sg\" data-s=\"4\">Jūs tikai norādāt, <em>kad<\/em> tā kodam jāizpildās, ar bloka nosaukumu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Biežāk lietotie fāzeri atzīmē visas programmas posmus:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pēc iespējas agrāk, kamēr Raku vēl kompilē programmu;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> izpildās vienu reizi, kad programma sākas, pirms galvenā koda;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> izpildās vienu reizi pašās beigās, pēc tam, kad galvenais kods ir pabeigts.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamā programma novieto šos fāzerus starp parastiem izteikumiem.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka izvade neseko rindu secībai failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> izpildās pirmais, kamēr programma tiek kompilēta.<\/span> <span class=\"sg\" data-s=\"1\">Tad programmas izpildes laikā <code>INIT<\/code> izpildās pirms galvenās daļas.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam drukā galvenā daļa.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> izpildās pēdējais, lai kur tas būtu uzrakstīts failā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> bieži lieto tieši pirms programmas beigām.<\/span> <span class=\"sg\" data-s=\"1\">Tas var izdrukāt kopsavilkumu vai kaut ko iztīrīt.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> ir noderīgs darbam, kam jānotiek pirms visa pārējā.<\/span><\/p>"]]},"ru":{"t":"Фазеры","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Фейзер<\/em> (phaser) — это специальный блок.<\/span> <span class=\"sg\" data-s=\"1\">Он выполняется автоматически в определённый момент жизни программы.<\/span> <span class=\"sg\" data-s=\"2\">Он выполняется не там, где записан в исходном коде.<\/span> <span class=\"sg\" data-s=\"3\">Вы не вызываете фейзер.<\/span> <span class=\"sg\" data-s=\"4\">Вы только указываете именем блока, <em>когда<\/em> должен выполниться его код.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Самые распространённые фейзеры отмечают этапы всей программы:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется как можно раньше, пока Raku ещё компилирует программу;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> выполняется один раз, когда программа запускается, перед основным кодом;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> выполняется один раз в самом конце, когда основной код уже закончил работу.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующая программа ставит эти фейзеры между обычными инструкциями.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что вывод не следует порядку строк в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> выполняется первым, пока программа компилируется.<\/span> <span class=\"sg\" data-s=\"1\">Затем, когда программа работает, <code>INIT<\/code> идёт перед основным телом.<\/span> <span class=\"sg\" data-s=\"2\">Следующим выводит свой текст основное тело.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> выполняется последним, где бы он ни был записан в файле.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> часто используют прямо перед завершением программы.<\/span> <span class=\"sg\" data-s=\"1\">Он может вывести итог или что-то очистить.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> удобен для работы, которая должна произойти раньше всего остального.<\/span><\/p>"]]},"uk":{"t":"Фазери","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Фазер<\/em> — це особливий блок.<\/span> <span class=\"sg\" data-s=\"1\">Він виконується автоматично в певний момент життя програми.<\/span> <span class=\"sg\" data-s=\"2\">Він не виконується там, де з'являється у вихідному коді.<\/span> <span class=\"sg\" data-s=\"3\">Ви не викликаєте фазер.<\/span> <span class=\"sg\" data-s=\"4\">Ви лише кажете, <em>коли<\/em> його код має виконатися, за допомогою імені блоку.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпоширеніші фазери позначають етапи всієї програми:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується якомога раніше, поки Raku ще компілює програму;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> виконується один раз, коли програма стартує, перед основним кодом;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> виконується один раз у самому кінці, після того як основний код завершився.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступна програма ставить ці фазери між звичайними операторами.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що вивід не відповідає порядку рядків у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> виконується першим, поки програма компілюється.<\/span> <span class=\"sg\" data-s=\"1\">Потім, коли програма виконується, <code>INIT<\/code> іде перед основним тілом.<\/span> <span class=\"sg\" data-s=\"2\">Далі друкує основне тіло.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> виконується останнім, хоч би де його записали у файлі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> часто використовують перед самим кінцем програми.<\/span> <span class=\"sg\" data-s=\"1\">Він може вивести підсумок або щось прибрати.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> корисний для роботи, яка має відбутися раніше за все інше.<\/span><\/p>"]]},"bg":{"t":"Фейзъри","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> е специален блок.<\/span> <span class=\"sg\" data-s=\"1\">Той се изпълнява автоматично в определен момент от живота на програмата.<\/span> <span class=\"sg\" data-s=\"2\">Той не се изпълнява там, където стои в изходния код.<\/span> <span class=\"sg\" data-s=\"3\">Вие не извиквате phaser.<\/span> <span class=\"sg\" data-s=\"4\">Вие само казвате <em>кога<\/em> трябва да се изпълни кодът му, чрез името на блока.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-честите phasers отбелязват етапите на цялата програма:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява възможно най-рано, докато Raku още компилира програмата;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> се изпълнява веднъж, когато програмата започва, преди основния код;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> се изпълнява веднъж в самия край, след като основният код е завършил.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващата програма поставя тези phasers между обикновени инструкции.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че изходът не следва реда на редовете във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> се изпълнява първи, докато програмата се компилира.<\/span> <span class=\"sg\" data-s=\"1\">След това, когато програмата работи, <code>INIT<\/code> идва преди основното тяло.<\/span> <span class=\"sg\" data-s=\"2\">След това отпечатва основното тяло.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> се изпълнява последен, където и да е написан във файла.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> често се използва точно преди програмата да завърши.<\/span> <span class=\"sg\" data-s=\"1\">Той може да отпечата обобщение или да почисти нещо.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> е удобен за работа, която трябва да стане преди всичко друго.<\/span><\/p>"]]},"eo":{"t":"Faziloj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> estas speciala bloko.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ruliĝas aŭtomate en certa momento de la vivo de programo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne ruliĝas tie, kie ĝi aperas en la fontkodo.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne vokas phaser-on.<\/span> <span class=\"sg\" data-s=\"4\">Vi nur diras, <em>kiam<\/em> ĝia kodo ruliĝu, per la nomo de la bloko.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plej oftaj phaser-oj markas la stadiojn de la tuta programo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas kiel eble plej frue, dum Raku ankoraŭ kompilas la programon;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> ruliĝas unufoje, kiam la programo komenciĝas, antaŭ la ĉefa kodo;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> ruliĝas unufoje ĉe la plej fino, post kiam la ĉefa kodo finiĝis.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekva programo metas ĉi tiujn phaser-ojn inter ordinarajn deklarojn.<\/span> <span class=\"sg\" data-s=\"1\">Rimarku, ke la eligo ne sekvas la ordon de la linioj en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> ruliĝas unue, dum la programo estas kompilata.<\/span> <span class=\"sg\" data-s=\"1\">Poste, kiam la programo ruliĝas, <code>INIT<\/code> venas antaŭ la ĉefa korpo.<\/span> <span class=\"sg\" data-s=\"2\">Poste presas la ĉefa korpo.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> ruliĝas laste, kie ajn ĝi estas skribita en la dosiero.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> estas ofte uzata tuj antaŭ ol la programo finiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas presi resumon aŭ purigi ion.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> estas utila por laboro, kiu devas okazi antaŭ ĉio alia.<\/span><\/p>"]]},"la":{"t":"Phaseres","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Phaser<\/em> est copia specialis.<\/span> <span class=\"sg\" data-s=\"1\">Automatice currit certo momento in vita programmatis.<\/span> <span class=\"sg\" data-s=\"2\">Non currit ubi in codice fonte apparet.<\/span> <span class=\"sg\" data-s=\"3\">Phaserem non vocas.<\/span> <span class=\"sg\" data-s=\"4\">Tantum dicis <em>quando<\/em> codex eius currere debeat, nomine copiae.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Phaseres frequentissimi stadia totius programmatis signant:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> quam primum currit, dum Raku programma adhuc compilat;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>INIT<\/code> semel currit cum programma incipit, ante codicem principalem;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>END<\/code> semel currit in ipso fine, postquam codex principalis finitus est.<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma sequens hos phaseres inter sententias ordinarias ponit.<\/span> <span class=\"sg\" data-s=\"1\">Nota quod output ordinem linearum in archivo non sequitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'main body';\nBEGIN say 'BEGIN';\nEND say 'END';\nINIT say 'INIT';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>BEGIN\nINIT\nmain body\nEND<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>BEGIN<\/code> primus currit, dum programma compilatur.<\/span> <span class=\"sg\" data-s=\"1\">Deinde, cum programma currit, <code>INIT<\/code> ante corpus principale venit.<\/span> <span class=\"sg\" data-s=\"2\">Tum corpus principale imprimit.<\/span> <span class=\"sg\" data-s=\"3\"><code>END<\/code> ultimus currit, ubicumque in archivo scriptus est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>END<\/code> saepe adhibetur paulo antequam programma finitur.<\/span> <span class=\"sg\" data-s=\"1\">Summarium imprimere vel aliquid purgare potest.<\/span> <span class=\"sg\" data-s=\"2\"><code>BEGIN<\/code> utilis est pro opere quod ante omnia alia fieri debet.<\/span><\/p>"]]}}}</script>
