<script type="application/json" id="page-data">{"u":"advanced/phasers/exercises/end-order","n":585,"k":"exercise","pv":"advanced/phasers/exercises/begin-first/solution","nx":"advanced/phasers/exercises/end-order/solution","tr":["advanced","advanced/phasers"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exercise ’The order of ENDs‘","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A program can have more than one <code>END<\/code> phaser.<\/span> <span class=\"sg\" data-s=\"1\">In that case, they run in the <strong>reverse<\/strong> order of how they were written.<\/span> <span class=\"sg\" data-s=\"2\">The last one that you declare runs first: last in, first out.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Write two <code>END<\/code> phasers.<\/span> <span class=\"sg\" data-s=\"1\">The first prints <code>first END<\/code>, and the second prints <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">After them, add a simple <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Predict the order of the output, and then get the same output with your program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Example<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solution<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">See the solution<\/a><\/span><\/p>"]]},"de":{"t":"Die Reihenfolge der ENDs","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Programm kann mehr als einen <code>END<\/code>-Phaser haben.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall laufen sie <strong>umgekehrt<\/strong> zu der Reihenfolge, in der sie im Code stehen.<\/span> <span class=\"sg\" data-s=\"2\">Der Phaser, den du zuletzt deklarierst, läuft zuerst: Last in, First out.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schreibe zwei <code>END<\/code>-Phaser.<\/span> <span class=\"sg\" data-s=\"1\">Der erste gibt <code>first END<\/code> aus, und der zweite gibt <code>second END<\/code> aus.<\/span> <span class=\"sg\" data-s=\"2\">Füge danach ein einfaches <code>say 'body'<\/code> hinzu.<\/span> <span class=\"sg\" data-s=\"3\">Sage die Reihenfolge der Ausgabe voraus, und erzeuge dann dieselbe Ausgabe mit deinem Programm.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Beispiel<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lösung<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Siehe die Lösung<\/a><\/span><\/p>"]]},"nl":{"t":"De volgorde van ENDs","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Probleem<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een programma kan meer dan één <code>END<\/code>-phaser hebben.<\/span> <span class=\"sg\" data-s=\"1\">Ze draaien dan in de <strong>omgekeerde<\/strong> volgorde van hoe ze geschreven zijn.<\/span> <span class=\"sg\" data-s=\"2\">De laatste die je declareert, draait als eerste: last in, first out.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Schrijf twee <code>END<\/code>-phasers.<\/span> <span class=\"sg\" data-s=\"1\">De eerste drukt <code>first END<\/code> af, en de tweede drukt <code>second END<\/code> af.<\/span> <span class=\"sg\" data-s=\"2\">Voeg daarna een gewone <code>say 'body'<\/code> toe.<\/span> <span class=\"sg\" data-s=\"3\">Voorspel de volgorde van de uitvoer, en krijg daarna dezelfde uitvoer met je programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Voorbeeld<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Oplossing<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Bekijk de oplossing<\/a><\/span><\/p>"]]},"es":{"t":"El orden de los END","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un programa puede tener más de un phaser <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ese caso, se ejecutan en el orden <strong>inverso<\/strong> al que se escribieron.<\/span> <span class=\"sg\" data-s=\"2\">El último que declaras se ejecuta primero: último en entrar, primero en salir.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Escribe dos phasers <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El primero imprime <code>first END<\/code>, y el segundo imprime <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Después de ellos, añade un simple <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Predice el orden de la salida, y después obtén la misma salida con tu programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ejemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solución<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Ve la solución<\/a><\/span><\/p>"]]},"it":{"t":"L'ordine degli END","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un programma può avere più di un phaser <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In quel caso, vengono eseguiti in ordine <strong>inverso<\/strong> rispetto a come sono scritti.<\/span> <span class=\"sg\" data-s=\"2\">L'ultimo che dichiari viene eseguito per primo: last in, first out.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scrivi due phaser <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il primo stampa <code>first END<\/code>, e il secondo stampa <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dopo di loro, aggiungi un semplice <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Prevedi l'ordine dell'output, e poi ottieni lo stesso output con il tuo programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"END secība","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programmā var būt vairāk nekā viens <code>END<\/code> fāzeris.<\/span> <span class=\"sg\" data-s=\"1\">Tādā gadījumā tie izpildās <strong>apgrieztā<\/strong> secībā, nekā ir uzrakstīti.<\/span> <span class=\"sg\" data-s=\"2\">Pēdējais, ko jūs deklarējat, izpildās pirmais: pēdējais iekšā, pirmais ārā.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzrakstiet divus <code>END<\/code> fāzerus.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais izdrukā <code>first END<\/code>, un otrais izdrukā <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tiem pievienojiet vienkāršu <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Paredziet izvades secību un pēc tam iegūstiet tādu pašu izvadi ar savu programmu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Порядок END","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В программе может быть больше одного фейзера <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае они выполняются в порядке, <strong>обратном<\/strong> тому, в котором записаны.<\/span> <span class=\"sg\" data-s=\"2\">Последний объявленный вами фейзер выполняется первым: последним пришёл — первым ушёл.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишите два фейзера <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Первый выводит <code>first END<\/code>, а второй — <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">После них добавьте обычный <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Предскажите порядок вывода, а затем получите такой же вывод своей программой.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Порядок блоків END»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Програма може мати більше ніж один фазер <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У такому разі вони виконуються в порядку, <strong>зворотному<\/strong> до порядку запису.<\/span> <span class=\"sg\" data-s=\"2\">Той, який ви оголосили останнім, виконується першим: останнім прийшов — першим вийшов.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишіть два фазери <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Перший виводить <code>first END<\/code>, а другий — <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Після них додайте простий <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Передбачте порядок виводу, а потім отримайте такий самий вивід своєю програмою.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Редът на END","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една програма може да има повече от един phaser <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В такъв случай те се изпълняват в <strong>обратен<\/strong> ред спрямо реда, в който са написани.<\/span> <span class=\"sg\" data-s=\"2\">Последният, който декларирате, се изпълнява пръв: последен влязъл, пръв излязъл.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Напишете два phaser-а <code>END<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Първият отпечатва <code>first END<\/code>, а вторият отпечатва <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След тях добавете обикновен <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Предвидете реда на изхода и след това получете същия изход с вашата програма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"La ordo de END-oj","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programo povas havi pli ol unu <code>END<\/code>-phaser-on.<\/span> <span class=\"sg\" data-s=\"1\">En tiu kazo, ili ruliĝas en la <strong>inversa<\/strong> ordo de tio, kiel ili estis skribitaj.<\/span> <span class=\"sg\" data-s=\"2\">Tiu, kiun vi deklaras laste, ruliĝas unue: lasta eniras, unua eliras.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Skribu du <code>END<\/code>-phaser-ojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua presas <code>first END<\/code>, kaj la dua presas <code>second END<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Post ili, aldonu simplan <code>say 'body'<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Antaŭdiru la ordon de la eligo, kaj poste ricevu la saman eligon per via programo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>body\nsecond END\nfirst END<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/end-order/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Ordo ENDium","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma plus quam unum phaserem <code>END<\/code> habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Tum currunt
