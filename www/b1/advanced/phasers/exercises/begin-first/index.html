xercises/begin-first/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Сначала BEGIN","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Фейзер <code>BEGIN<\/code> — это больше, чем блок, который выполняется рано.<\/span> <span class=\"sg\" data-s=\"1\">Это ещё и <em>выражение<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Его значение вычисляется один раз, во время компиляции.<\/span> <span class=\"sg\" data-s=\"3\">Затем оно остаётся в программе неизменным.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>BEGIN { 2 + 3 }<\/code> задайте начальное значение переменной <code>$compiled<\/code>, а затем выведите её.<\/span> <span class=\"sg\" data-s=\"1\">Выражение <code>2 + 3<\/code> вычисляется, пока программа ещё компилируется.<\/span> <span class=\"sg\" data-s=\"2\">Но сохранённое значение отлично работает и во время выполнения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа выводит:<\/span><\/p>"],["code",0,"<pre><code>5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/phasers/exercises/begin-first/solution/\">Смотрите решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Спочатку BEGIN»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Фазер <code>BEGIN<\/code> — це більше, ніж блок, який виконується рано.<\/span> <span class=\"sg\" data-s=\"1\">Це також <em>вираз<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Його значення обчислюється один раз, під час компіляції.<\/span> <span class=\"sg\" data-s=\"3\">Потім воно лишається незмінним у програмі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За допомогою <code>BEGIN { 2 + 3 }<\/code> задайте перше значення змінної <code>$compiled<\/code>, а потім виведі
