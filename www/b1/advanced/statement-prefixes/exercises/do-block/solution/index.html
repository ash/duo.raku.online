u<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обикновеният <code>if<\/code> е оператор и не можете да използвате стойността му. Префиксът <code>do<\/code> превръща цялата конструкция <code>if<\/code>/<code>else<\/code> в израз.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> е вярно, затова изразът дава <code>'big'<\/code> и тази стойност се присвоява на <code>$label<\/code>. Същият трик работи с <code>do given<\/code> и <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фигурните скоби <code>{ }<\/code> не може да се пропускат. В Raku <code>if<\/code> винаги приема блок. Затова не можете да съкратите клоновете до <code>if 7 &gt; 5 'big' else 'small'<\/code>. Това не се компилира и дава грешката <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: La valoro de do-bloko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simpla <code>if<\/code> estas deklaro, kaj vi ne povas uzi ĝian valoron. La prefikso <code>do<\/code> transformas la tutan <code>if<\/code>/<code>else<\/code> en esprimon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> estas vera, do la esprimo donas <code>'big'<\/code>, kaj ĉi tiu valoro estas atribuata al <code>$label<\/code>. La sama truko funkcias kun <code>do given<\/code> kaj <code>do for<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La krampoj <code>{ }<\/code> ne estas nedevigaj. En Raku, <code>if<\/code> ĉiam prenas blokon. Do vi ne povas mallongigi la branĉojn al <code>if 7 &gt; 5 'big' else 'small'<\/code>. Tio ne kompiliĝas, kaj la eraro estas <em>Missing block<\/em>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Valor bloci do","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $label = do if 7 &gt; 5 { 'big' } else { 'small' };\n\nsay $label;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/do-block.raku\" target=\"_blank\" rel=\"noopener\">do-block.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>big<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nudum <code>if<\/code> sententia est, et valore eius uti non potes. Praefixum <code>do<\/code> totum <code>if<\/code>/<code>else<\/code> in expressionem convertit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>7 &gt; 5<\/code> verum est, itaque expressio <code>'big'<\/code> dat, et hic valor ad <code>$label<\/code> assignatur. Idem artificium cum <code>do given<\/code> et <code>do for<\/code> operatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unci curvi <code>{ }<\/code> non sunt optionales. In Raku <code>if<\/code> semper copiam accipit. Itaque ramos in <code>if 7 &gt; 5 'big' else 'small'<\/code> breviare non potes. Compilatio cum errore <em>Missing block<\/em> deficit.<\/span><\/li><\/ol>"]]}}}</script>
