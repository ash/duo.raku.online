<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/silence-warning/solution","n":628,"k":"solution","pv":"advanced/statement-prefixes/exercises/silence-warning","nx":"advanced/signatures","tr":["advanced","advanced/statement-prefixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Silence a warning‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Putting the undefined <code>$name<\/code> into the string normally causes a “use of uninitialized value” warning. With <code>quietly<\/code> around the expression, the warning is hidden, so only the greeting is printed.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Like <code>do<\/code>, <code>quietly<\/code> returns the value of its block. So the finished string is stored in <code>$greeting<\/code>. The missing name leaves an empty gap in it.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> only hides the warning, and the value is still undefined. If you want to <em>deal<\/em> with the missing value instead, give a default value. Use the defined-or operator <code>//<\/code> for this. <code>$name // 'friend'<\/code> gives <code>'friend'<\/code> when <code>$name<\/code> is undefined. So <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> prints <code>Hello, friend!<\/code> with no warning at all.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Eine Warnung unterdrücken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wenn man das undefinierte <code>$name<\/code> in den String setzt, gibt es normalerweise die Warnung „use of uninitialized value“. Mit <code>quietly<\/code> um den Ausdruck herum ist die Warnung versteckt, also wird nur der Gruß ausgegeben.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wie <code>do<\/code> gibt <code>quietly<\/code> den Wert seines Blocks zurück. Also wird der fertige String in <code>$greeting<\/code> gespeichert. Der fehlende Name lässt darin eine leere Lücke.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> versteckt nur die Warnung, und der Wert ist immer noch undefiniert. Wenn du stattdessen mit dem fehlenden Wert <em>umgehen<\/em> willst, gib einen Standardwert an. Nutze dafür den Defined-or-Operator <code>//<\/code>. <code>$name // 'friend'<\/code> ergibt <code>'friend'<\/code>, wenn <code>$name<\/code> undefiniert ist. Also gibt <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> den Text <code>Hello, friend!<\/code> ganz ohne Warnung aus.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een waarschuwing onderdrukken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Als je de ongedefinieerde <code>$name<\/code> in de string zet, geeft dat normaal een waarschuwing \"use of uninitialized value\". Met <code>quietly<\/code> rond de expressie blijft de waarschuwing verborgen, dus alleen de begroeting wordt afgedrukt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Net als <code>do<\/code> geeft <code>quietly<\/code> de waarde van zijn blok terug. De complete string wordt dus opgeslagen in <code>$greeting<\/code>. De ontbrekende naam laat er een leeg gat in achter.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> verbergt alleen de waarschuwing, en de waarde is nog steeds ongedefinieerd. Als je in plaats daarvan de ontbrekende waarde wilt <em>afhandelen<\/em>, geef dan een standaardwaarde. Gebruik daarvoor de defined-or-operator <code>//<\/code>. <code>$name // 'friend'<\/code> geeft <code>'friend'<\/code> als <code>$name<\/code> ongedefinieerd is. Zo print <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> de tekst <code>Hello, friend!<\/code> zonder enige waarschuwing.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Silenciar una advertencia","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Poner el <code>$name<\/code> indefinido dentro de la cadena normalmente causa una advertencia de «uso de valor no inicializado». Con <code>quietly<\/code> alrededor de la expresión, la advertencia queda oculta, así que solo se imprime el saludo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Como <code>do<\/code>, <code>quietly<\/code> devuelve el valor de su bloque. Así que la cadena terminada se guarda en <code>$greeting<\/code>. El nombre que falta deja un hueco vacío en ella.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> solo oculta la advertencia, y el valor sigue indefinido. Si en cambio quieres <em>ocuparte<\/em> del valor que falta, da un valor predeterminado. Usa para esto el operador definido-o <code>//<\/code>. <code>$name // 'friend'<\/code> da <code>'friend'<\/code> cuando <code>$name<\/code> está indefinido. Así que <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> imprime <code>Hello, friend!<\/code> sin ninguna advertencia.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Silenziare un avviso","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Il codice sorgente è disponibile nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mettere il <code>$name<\/code> non definito nella stringa normalmente causa un avviso “use of uninitialized value”. Con <code>quietly<\/code> intorno all'espressione, l'avviso viene nascosto, quindi viene stampato solo il saluto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Come <code>do<\/code>, <code>quietly<\/code> restituisce il valore del suo blocco. Quindi la stringa finita viene salvata in <code>$greeting<\/code>. Il nome che manca lascia uno spazio vuoto nella stringa.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> nasconde solo l'avviso, e il valore resta non definito. Se invece volete <em>gestire<\/em> il valore mancante, date un valore predefinito. Usate per questo l'operatore defined-or <code>//<\/code>. <code>$name // 'friend'<\/code> dà <code>'friend'<\/code> quando <code>$name<\/code> non è definito. Così <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> stampa <code>Hello, friend!<\/code> senza nessun avviso.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Apklusināt brīdinājumu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ja virknē ieliek nedefinēto <code>$name<\/code>, parasti rodas brīdinājums par “neinicializētas vērtības lietošanu”. Ar <code>quietly<\/code> ap izteiksmi brīdinājums ir paslēpts, tāpēc tiek izdrukāts tikai sveiciens.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tāpat kā <code>do<\/code>, <code>quietly<\/code> atgriež sava bloka vērtību. Tāpēc gatavā virkne tiek saglabāta mainīgajā <code>$greeting<\/code>. Trūkstošais vārds tajā atstāj tukšu spraugu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> tikai paslēpj brīdinājumu, un vērtība joprojām ir nedefinēta. Ja jūs gribat ar trūkstošo vērtību <em>tikt galā<\/em>, dodiet noklusējuma vērtību. Šim nolūkam izmantojiet defined-or operatoru <code>//<\/code>. <code>$name // 'friend'<\/code> dod <code>'friend'<\/code>, kad <code>$name<\/code> ir nedefinēts. Tāpēc <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> izdrukā <code>Hello, friend!<\/code> pavisam bez brīdinājuma.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Подавление предупреждения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Если вставить неопределённую <code>$name<\/code> в строку, обычно появляется предупреждение «use of uninitialized value». Когда выражение обёрнуто в <code>quietly<\/code>, предупреждение скрыто, поэтому печатается только приветствие.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Как и <code>do<\/code>, <code>quietly<\/code> возвращает значение своего блока. Поэтому готовая строка сохраняется в <code>$greeting<\/code>. На месте отсутствующего имени в ней остаётся пустое место.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> только скрывает предупреждение, а значение по-прежнему не определено. Если вместо этого вы хотите <em>обработать<\/em> отсутствующее значение, задайте значение по умолчанию. Для этого используйте оператор defined-or <code>//<\/code>. <code>$name // 'friend'<\/code> даёт <code>'friend'<\/code>, когда <code>$name<\/code> не определено. Поэтому <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> печатает <code>Hello, friend!<\/code> без всяких предупреждений.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Приглушіть попередження","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Якщо вставити невизначений <code>$name<\/code> у рядок, зазвичай з'являється попередження «use of uninitialized value». Коли навколо виразу стоїть <code>quietly<\/code>, попередження приховане, тож виводиться лише привітання.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Як і <code>do<\/code>, <code>quietly<\/code> повертає значення свого блоку. Тож готовий рядок зберігається в <code>$greeting<\/code>. Відсутнє ім'я лишає в ньому порожній проміжок.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> лише ховає попередження, а значення все одно залишається невизначеним. Якщо ж ви хочете <em>впоратися<\/em> з відсутнім значенням, дайте типове значення. Для цього використайте оператор «визначене або» <code>//<\/code>. <code>$name // 'friend'<\/code> дає <code>'friend'<\/code>, коли <code>$name<\/code> не визначено. Тож <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> виводить <code>Hello, friend!<\/code> взагалі без попереджень.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Заглушете предупреждение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Когато сложите неопределената <code>$name<\/code> в низа, обикновено получавате предупреждение „use of uninitialized value“. С <code>quietly<\/code> около израза предупреждението е скрито, затова се отпечатва само поздравът.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Както <code>do<\/code>, <code>quietly<\/code> връща стойността на своя блок. Затова готовият низ се записва в <code>$greeting<\/code>. Липсващото име оставя празно място в него.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> само скрива предупреждението, а стойността все още е неопределена. Ако вместо това искате да се <em>справите<\/em> с липсващата стойност, дайте стойност по подразбиране. Използвайте за това оператора за определеност <code>//<\/code>. <code>$name // 'friend'<\/code> дава <code>'friend'<\/code>, когато <code>$name<\/code> е неопределена. Затова <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> отпечатва <code>Hello, friend!<\/code> без никакво предупреждение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Silentigi averton","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Meti la nedefinitan <code>$name<\/code> en la ĉenon normale kaŭzas averton pri \"uzo de neinicialigita valoro\". Kun <code>quietly<\/code> ĉirkaŭ la esprimo, la averto estas kaŝita, do nur la salutfrazo estas presata.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kiel <code>do<\/code>, <code>quietly<\/code> redonas la valoron de sia bloko. Do la preta ĉeno estas konservata en <code>$greeting<\/code>. La mankanta nomo lasas malplenan interspacon en ĝi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> nur kaŝas la averton, kaj la valoro ankoraŭ estas nedefinita. Se vi anstataŭe volas <em>trakti<\/em> la mankantan valoron, donu defaŭltan valoron. Uzu por tio la difinita-aŭ operatoron <code>//<\/code>. <code>$name // 'friend'<\/code> donas <code>'friend'<\/code>, kiam <code>$name<\/code> estas nedefinita. Do <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> presas <code>Hello, friend!<\/code> tute sen averto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Admonitionem silere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name;\n\nmy $greeting = quietly { \"Hello, \" ~ $name ~ \"!\" };\nsay $greeting;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/silence-warning.raku\" target=\"_blank\" rel=\"noopener\">silence-warning.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Hello, !<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Si <code>$name<\/code> indefinitum in chordam ponis, plerumque admonitio “use of uninitialized value” oritur. Cum <code>quietly<\/code> circa expressionem, admonitio celatur, itaque sola salutatio imprimitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sicut <code>do<\/code>, <code>quietly<\/code> valorem copiae suae reddit. Itaque chorda perfecta in <code>$greeting<\/code> servatur. Nomen absens lacunam vacuam in ea relinquit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>quietly<\/code> solum admonitionem celat, et valor adhuc indefinitus est. Si potius valorem absentem <em>tractare<\/em> vis, valorem praedefinitum da. Ad hoc operatore definito-vel <code>//<\/code> utere. <code>$name // 'friend'<\/code> dat <code>'friend'<\/code> cum <code>$name<\/code> indefinitus est. Itaque <code>\"Hello, \" ~ ($name // 'friend') ~ \"!\"<\/code> imprimit <code>Hello, friend!<\/code> sine ulla admonitione.<\/span><\/li><\/ol>"]]}}}</script>
