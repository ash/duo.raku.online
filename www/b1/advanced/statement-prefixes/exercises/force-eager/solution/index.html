<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/exercises/force-eager/solution","n":626,"k":"solution","pv":"advanced/statement-prefixes/exercises/force-eager","nx":"advanced/statement-prefixes/exercises/silence-warning","tr":["advanced","advanced/statement-prefixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Force eager evaluation‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A range up to <code>Inf<\/code> cannot be computed all at once, so it is lazy. <code>.is-lazy<\/code> returns <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix makes Raku produce a list at once. So the result is no longer lazy. <code>.is-lazy<\/code> returns <code>False<\/code>. This is the direct opposite of marking a list <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Do not use <code>eager<\/code> with a range that has no end. <code>eager 1 .. Inf<\/code> tries to compute every element at once. So the program simply hangs and uses more and more memory until it is killed. <code>eager<\/code> is only safe with lists that you know are finite.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The reverse also works. <code>lazy 1..3<\/code> marks even a short, finite range as lazy, so <code>.is-lazy<\/code> returns <code>True<\/code>. The prefix sets the laziness flag, no matter how small the list is. A list does not have to be infinite to be lazy.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Sofortige Auswertung erzwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ein Bereich bis <code>Inf<\/code> kann nicht auf einmal berechnet werden, also ist er lazy. <code>.is-lazy<\/code> gibt <code>True<\/code> zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix lässt Raku eine Liste sofort erzeugen. Deshalb ist das Ergebnis nicht mehr lazy. <code>.is-lazy<\/code> gibt <code>False<\/code> zurück. Das ist das direkte Gegenteil davon, eine Liste als <code>lazy<\/code> zu markieren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Verwende <code>eager<\/code> nicht mit einem Bereich ohne Ende. <code>eager 1 .. Inf<\/code> versucht, jedes Element auf einmal zu berechnen. Deshalb hängt das Programm einfach und braucht immer mehr Speicher, bis es beendet wird. <code>eager<\/code> ist nur bei Listen sicher, von denen du weißt, dass sie endlich sind.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Umgekehrte geht auch. <code>lazy 1..3<\/code> markiert sogar einen kurzen, endlichen Bereich als lazy, also gibt <code>.is-lazy<\/code> <code>True<\/code> zurück. Das Präfix setzt das Laziness-Flag, egal wie klein die Liste ist. Eine Liste muss nicht unendlich sein, um lazy zu sein.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gretige evaluatie afdwingen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Een range tot <code>Inf<\/code> kan niet in één keer worden berekend, dus die is lazy. <code>.is-lazy<\/code> geeft <code>True<\/code> terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> laat Raku een lijst meteen maken. Het resultaat is dus niet langer lazy. <code>.is-lazy<\/code> geeft <code>False<\/code> terug. Dit is precies het omgekeerde van een lijst als <code>lazy<\/code> markeren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gebruik <code>eager<\/code> niet met een range zonder einde. <code>eager 1 .. Inf<\/code> probeert elk element in één keer te berekenen. Het programma blijft dus gewoon hangen en gebruikt steeds meer geheugen, tot het wordt afgebroken. <code>eager<\/code> is alleen veilig bij lijsten waarvan je weet dat ze eindig zijn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het omgekeerde werkt ook. <code>lazy 1..3<\/code> markeert zelfs een korte, eindige range als lazy, dus <code>.is-lazy<\/code> geeft <code>True<\/code> terug. Het prefix zet de laziness-vlag, hoe klein de lijst ook is. Een lijst hoeft niet oneindig te zijn om lazy te zijn.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Forzar evaluación ansiosa","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un rango hasta <code>Inf<\/code> no se puede calcular todo de una vez, así que es perezoso. <code>.is-lazy<\/code> devuelve <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> hace que Raku produzca una lista enseguida. Así que el resultado ya no es perezoso. <code>.is-lazy<\/code> devuelve <code>False<\/code>. Esto es lo contrario directo de marcar una lista como <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">No uses <code>eager<\/code> con un rango que no tiene final. <code>eager 1 .. Inf<\/code> intenta calcular todos los elementos de una vez. Así que el programa simplemente se cuelga y usa cada vez más memoria hasta que alguien lo detiene a la fuerza. <code>eager<\/code> solo es seguro con listas que sabes que son finitas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lo contrario también funciona. <code>lazy 1..3<\/code> marca como perezoso incluso un rango corto y finito, así que <code>.is-lazy<\/code> devuelve <code>True<\/code>. El prefijo pone la marca de pereza, sin importar lo pequeña que sea la lista. Una lista no tiene que ser infinita para ser perezosa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Forzare la valutazione eager","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Il codice sorgente è disponibile nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un intervallo fino a <code>Inf<\/code> non può essere calcolato tutto in una volta, quindi è lazy. <code>.is-lazy<\/code> restituisce <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> fa produrre a Raku una lista subito. Quindi il risultato non è più lazy. <code>.is-lazy<\/code> restituisce <code>False<\/code>. Questo è l'opposto diretto di segnare una lista come <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Non usate <code>eager<\/code> con un intervallo senza fine. <code>eager 1 .. Inf<\/code> prova a calcolare ogni elemento in una volta sola. Così il programma si blocca e usa sempre più memoria, finché non viene chiuso a forza. <code>eager<\/code> è sicuro solo con liste che sapete essere finite.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Funziona anche il contrario. <code>lazy 1..3<\/code> segna come lazy anche un intervallo corto e finito, quindi <code>.is-lazy<\/code> restituisce <code>True<\/code>. Il prefisso imposta il flag di pigrizia, non importa quanto sia piccola la lista. Una lista non deve essere infinita per essere lazy.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Piespiest tūlītēju izvērtēšanu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Diapazonu līdz <code>Inf<\/code> nevar aprēķināt visu uzreiz, tāpēc tas ir slinks. <code>.is-lazy<\/code> atgriež <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek Raku izveidot sarakstu uzreiz. Tāpēc rezultāts vairs nav slinks. <code>.is-lazy<\/code> atgriež <code>False<\/code>. Tas ir tiešs pretstats saraksta atzīmēšanai ar <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Neizmantojiet <code>eager<\/code> ar diapazonu, kam nav beigu. <code>eager 1 .. Inf<\/code> mēģina aprēķināt katru elementu uzreiz. Tāpēc programma vienkārši iekaras un izmanto arvien vairāk atmiņas, līdz to nogalina. <code>eager<\/code> ir drošs tikai ar sarakstiem, par kuriem jūs zināt, ka tie ir galīgi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Darbojas arī otrādi. <code>lazy 1..3<\/code> atzīmē kā slinku pat īsu, galīgu diapazonu, tāpēc <code>.is-lazy<\/code> atgriež <code>True<\/code>. Prefikss uzstāda slinkuma karodziņu neatkarīgi no tā, cik mazs ir saraksts. Sarakstam nav jābūt bezgalīgam, lai tas būtu slinks.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Принудительное немедленное вычисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Диапазон до <code>Inf<\/code> нельзя вычислить целиком, поэтому он ленивый. <code>.is-lazy<\/code> возвращает <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет Raku создать список сразу. Поэтому результат больше не ленивый. <code>.is-lazy<\/code> возвращает <code>False<\/code>. Это прямая противоположность тому, чтобы пометить список как <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не используйте <code>eager<\/code> с диапазоном, у которого нет конца. <code>eager 1 .. Inf<\/code> пытается вычислить каждый элемент сразу. Поэтому программа просто зависает и занимает всё больше памяти, пока её не остановят принудительно. <code>eager<\/code> безопасен только со списками, которые точно конечны.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратное тоже работает. <code>lazy 1..3<\/code> помечает как ленивый даже короткий конечный диапазон, поэтому <code>.is-lazy<\/code> возвращает <code>True<\/code>. Префикс ставит флаг ленивости, каким бы маленьким ни был список. Списку не обязательно быть бесконечным, чтобы быть ленивым.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Змусьте до жадібного обчислення","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Діапазон до <code>Inf<\/code> неможливо обчислити весь одразу, тож він лінивий. <code>.is-lazy<\/code> повертає <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує Raku створити список одразу. Тож результат більше не лінивий. <code>.is-lazy<\/code> повертає <code>False<\/code>. Це пряма протилежність до того, щоб позначити список як <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не використовуйте <code>eager<\/code> з діапазоном, який не має кінця. <code>eager 1 .. Inf<\/code> намагається обчислити кожен елемент одразу. Тож програма просто зависає і бере дедалі більше пам'яті, доки її не вб'ють. <code>eager<\/code> безпечний лише для списків, про які ви знаєте, що вони скінченні.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зворотне теж працює. <code>lazy 1..3<\/code> позначає як лінивий навіть короткий скінченний діапазон, тож <code>.is-lazy<\/code> повертає <code>True<\/code>. Префікс ставить прапорець лінивості, хоч би який малий був список. Список не мусить бути нескінченним, щоб бути лінивим.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Принудете нетърпеливо изчисление","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Изходният код на тази програма можете да намерите във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Диапазон до <code>Inf<\/code> не може да се изчисли наведнъж, затова е мързелив. <code>.is-lazy<\/code> връща <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> кара Raku да създаде списъка веднага. Затова резултатът вече не е мързелив. <code>.is-lazy<\/code> връща <code>False<\/code>. Това е точно обратното на отбелязването на списък с <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Не използвайте <code>eager<\/code> с диапазон, който няма край. <code>eager 1 .. Inf<\/code> се опитва да изчисли всеки елемент наведнъж. Затова програмата просто увисва и използва все повече памет, докато не бъде спряна. <code>eager<\/code> е безопасен само със списъци, за които знаете, че са крайни.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обратното също работи. <code>lazy 1..3<\/code> отбелязва като мързелив дори къс, краен диапазон, затова <code>.is-lazy<\/code> връща <code>True<\/code>. Префиксът слага флага за мързеливост, без значение колко малък е списъкът. Не е нужно списъкът да е безкраен, за да бъде мързелив.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Devigi fervoron","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Intervalo ĝis <code>Inf<\/code> ne povas esti komputata tuta samtempe, do ĝi estas maldiligenta. <code>.is-lazy<\/code> redonas <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> igas Raku produkti liston tuj. Do la rezulto ne plu estas maldiligenta. <code>.is-lazy<\/code> redonas <code>False<\/code>. Tio estas la rekta malo de markado de listo kiel <code>lazy<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ne uzu <code>eager<\/code> kun intervalo, kiu ne havas finon. <code>eager 1 .. Inf<\/code> provas komputi ĉiun elementon samtempe. Do la programo simple blokiĝas kaj uzas pli kaj pli da memoro, ĝis oni mortigas ĝin. <code>eager<\/code> estas sekura nur kun listoj, pri kiuj vi scias, ke ili estas finitaj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ankaŭ la inverso funkcias. <code>lazy 1..3<\/code> markas eĉ mallongan, finitan intervalon kiel maldiligenta, do <code>.is-lazy<\/code> redonas <code>True<\/code>. La prefikso starigas la maldiligento-flagon, kiom ajn malgranda estas la listo. Listo ne devas esti senfina por esti maldiligenta.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Alacrem aestimationem cogere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 .. Inf).is-lazy;\nsay (eager 1..3).is-lazy;\nsay (lazy 1..3).is-lazy;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/statement-prefixes/force-eager.raku\" target=\"_blank\" rel=\"noopener\">force-eager.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True\nFalse\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Intervallum usque ad <code>Inf<\/code> totum simul computari non potest, itaque pigrum est. <code>.is-lazy<\/code> reddit <code>True<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> Raku cogit indicem statim producere. Itaque resultatum non iam pigrum est. <code>.is-lazy<\/code> reddit <code>False<\/code>. Hoc directe contrarium est signo <code>lazy<\/code> in indice.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Noli <code>eager<\/code> cum intervallo sine fine adhibere. <code>eager 1 .. Inf<\/code> conatur omne elementum statim computare. Itaque programma simpliciter pendet et plus plusque memoriae consumit donec interficitur. <code>eager<\/code> tutum est solum cum indicibus quos finitos esse scis.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Contrarium quoque operatur. <code>lazy 1..3<\/code> etiam breve, finitum intervallum ut pigrum signat, itaque <code>.is-lazy<\/code> reddit <code>True<\/code>. Praefixum signum pigritiae ponit, quamvis parvus index sit. Index non debet infinitus esse ut piger sit.<\/span><\/li><\/ol>"]]}}}</script>
