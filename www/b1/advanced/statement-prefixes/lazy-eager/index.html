<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/lazy-eager","n":619,"k":"topic","pv":"advanced/statement-prefixes/do-prefix/quiz","nx":"advanced/statement-prefixes/sink-quietly","tr":["advanced","advanced/statement-prefixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Laziness and eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Some lists in Raku are computed only when their elements are needed.<\/span> <span class=\"sg\" data-s=\"1\">Such lists are <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>lazy<\/code> and <code>eager<\/code> prefixes let you control this directly.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>eager<\/code> prefix makes Raku produce a list <strong>all at once<\/strong>, straight away:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without <code>eager<\/code>, the <code>map<\/code> would still produce the values.<\/span> <span class=\"sg\" data-s=\"1\">But <code>eager<\/code> makes sure that they are all computed right away, not later on demand.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>lazy<\/code> prefix does the opposite.<\/span> <span class=\"sg\" data-s=\"1\">It marks a list as lazy.<\/span> <span class=\"sg\" data-s=\"2\">Then its elements are produced only when the code asks for them.<\/span> <span class=\"sg\" data-s=\"3\">This is what allows a list to be infinite, at least in theory:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>.is-lazy<\/code> method confirms this.<\/span> <span class=\"sg\" data-s=\"1\">The list will not try to compute all of its endless elements in advance.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">In this example, though, Raku would make the list lazy anyway.<\/span> <span class=\"sg\" data-s=\"1\">A range with no end, like <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, is already lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">So <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> prints <\/code>True<code> without the prefix.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Writing <code>lazy<\/code> here changes nothing.<\/span> <span class=\"sg\" data-s=\"6\">It only shows your intention clearly.<\/span> <span class=\"sg\" data-s=\"7\">The prefix is really useful for a list that Raku would otherwise compute eagerly.<\/span> <span class=\"sg\" data-s=\"8\">With <code>lazy<\/code>, you can make such a list lazy.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Most of the time, Raku makes a good choice on its own.<\/span> <span class=\"sg\" data-s=\"1\">Ranges and sequences are lazy, and normal assignment to an array is eager.<\/span> <span class=\"sg\" data-s=\"2\">Use these prefixes when you need to change that choice.<\/span> <span class=\"sg\" data-s=\"3\">Use <code>eager<\/code> to make a costly computation happen now.<\/span> <span class=\"sg\" data-s=\"4\">Use <code>lazy<\/code> to delay a computation that might be large or have no end.<\/span><\/p>"]]},"de":{"t":"Laziness und Eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Manche Listen in Raku werden erst berechnet, wenn ihre Elemente gebraucht werden.<\/span> <span class=\"sg\" data-s=\"1\">Solche Listen sind <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mit den Präfixen <code>lazy<\/code> und <code>eager<\/code> kannst du das direkt steuern.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das <code>eager<\/code>-Präfix lässt Raku eine Liste <strong>auf einmal<\/strong> und sofort erzeugen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne <code>eager<\/code> würde das <code>map<\/code> die Werte trotzdem erzeugen.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>eager<\/code> sorgt dafür, dass sie alle sofort berechnet werden, nicht erst später bei Bedarf.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das <code>lazy<\/code>-Präfix macht das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Es markiert eine Liste als lazy.<\/span> <span class=\"sg\" data-s=\"2\">Dann werden ihre Elemente erst erzeugt, wenn der Code danach fragt.<\/span> <span class=\"sg\" data-s=\"3\">Dadurch kann eine Liste unendlich sein, zumindest in der Theorie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.is-lazy<\/code> bestätigt das.<\/span> <span class=\"sg\" data-s=\"1\">Die Liste versucht nicht, alle ihre endlosen Elemente im Voraus zu berechnen.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">In diesem Beispiel würde Raku die Liste aber sowieso lazy machen.<\/span> <span class=\"sg\" data-s=\"1\">Ein Bereich ohne Ende, wie <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, ist schon lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Also gibt <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> auch ohne das Präfix <\/code>True<code> aus.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Wenn du hier <code>lazy<\/code> schreibst, ändert das nichts.<\/span> <span class=\"sg\" data-s=\"6\">Es zeigt nur deine Absicht deutlich.<\/span> <span class=\"sg\" data-s=\"7\">Das Präfix ist wirklich nützlich für eine Liste, die Raku sonst eager berechnen würde.<\/span> <span class=\"sg\" data-s=\"8\">Mit <code>lazy<\/code> kannst du so eine Liste lazy machen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Meistens trifft Raku von selbst eine gute Wahl.<\/span> <span class=\"sg\" data-s=\"1\">Bereiche und Sequenzen sind lazy, und eine normale Zuweisung an ein Array ist eager.<\/span> <span class=\"sg\" data-s=\"2\">Nutze diese Präfixe, wenn du diese Wahl ändern musst.<\/span> <span class=\"sg\" data-s=\"3\">Nutze <code>eager<\/code>, damit eine teure Berechnung jetzt passiert.<\/span> <span class=\"sg\" data-s=\"4\">Nutze <code>lazy<\/code>, um eine Berechnung aufzuschieben, die groß sein oder kein Ende haben könnte.<\/span><\/p>"]]},"nl":{"t":"Luiheid en gretigheid","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sommige lijsten in Raku worden pas berekend als hun elementen nodig zijn.<\/span> <span class=\"sg\" data-s=\"1\">Zulke lijsten zijn <em>lazy<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Met de prefixen <code>lazy<\/code> en <code>eager<\/code> kun je dit direct sturen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>eager<\/code> laat Raku een lijst <strong>helemaal in één keer<\/strong> maken, meteen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder <code>eager<\/code> zou de <code>map<\/code> de waarden ook maken.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>eager<\/code> zorgt ervoor dat ze allemaal meteen berekend worden, niet later op aanvraag.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>lazy<\/code> doet het omgekeerde.<\/span> <span class=\"sg\" data-s=\"1\">Het markeert een lijst als lazy.<\/span> <span class=\"sg\" data-s=\"2\">Dan worden de elementen pas gemaakt als de code erom vraagt.<\/span> <span class=\"sg\" data-s=\"3\">Daardoor kan een lijst oneindig zijn, in elk geval in theorie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De methode <code>.is-lazy<\/code> bevestigt dit.<\/span> <span class=\"sg\" data-s=\"1\">De lijst zal niet proberen al zijn eindeloze elementen vooraf te berekenen.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Maar in dit voorbeeld zou Raku de lijst toch al lazy maken.<\/span> <span class=\"sg\" data-s=\"1\">Een range zonder einde, zoals <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, is al lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Daarom print <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> ook zonder het prefix <\/code>True<code>.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Hier <code>lazy<\/code> schrijven verandert niets.<\/span> <span class=\"sg\" data-s=\"6\">Het laat alleen duidelijk zien wat je bedoelt.<\/span> <span class=\"sg\" data-s=\"7\">Het prefix is echt nuttig voor een lijst die Raku anders eager zou berekenen.<\/span> <span class=\"sg\" data-s=\"8\">Met <code>lazy<\/code> kun je zo'n lijst lazy maken.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Meestal maakt Raku zelf een goede keuze.<\/span> <span class=\"sg\" data-s=\"1\">Ranges en reeksen zijn lazy, en een gewone toewijzing aan een array is eager.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik deze prefixen als je die keuze moet veranderen.<\/span> <span class=\"sg\" data-s=\"3\">Gebruik <code>eager<\/code> om een dure berekening nu te laten gebeuren.<\/span> <span class=\"sg\" data-s=\"4\">Gebruik <code>lazy<\/code> om een berekening uit te stellen die groot kan zijn of geen einde heeft.<\/span><\/p>"]]},"es":{"t":"Pereza y ansiedad","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Algunas listas en Raku se calculan solo cuando se necesitan sus elementos.<\/span> <span class=\"sg\" data-s=\"1\">Estas listas son <em>perezosas<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">Los prefijos <code>lazy<\/code> y <code>eager<\/code> te dejan controlar esto de forma directa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>eager<\/code> hace que Raku produzca una lista <strong>toda de una vez<\/strong>, enseguida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin <code>eager<\/code>, el <code>map<\/code> también produciría los valores.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>eager<\/code> se asegura de que todos se calculen enseguida, y no más tarde cuando se pidan.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>lazy<\/code> hace lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Marca una lista como perezosa.<\/span> <span class=\"sg\" data-s=\"2\">Entonces sus elementos se producen solo cuando el código los pide.<\/span> <span class=\"sg\" data-s=\"3\">Esto es lo que permite que una lista sea infinita, al menos en teoría:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>.is-lazy<\/code> lo confirma.<\/span> <span class=\"sg\" data-s=\"1\">La lista no intentará calcular por adelantado todos sus elementos, que no tienen fin.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Sin embargo, en este ejemplo Raku haría la lista perezosa de todos modos.<\/span> <span class=\"sg\" data-s=\"1\">Un rango sin final, como <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, ya es perezoso.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Así que <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> imprime <\/code>True<code> sin el prefijo.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Escribir <code>lazy<\/code> aquí no cambia nada.<\/span> <span class=\"sg\" data-s=\"6\">Solo muestra tu intención con claridad.<\/span> <span class=\"sg\" data-s=\"7\">El prefijo es útil de verdad con una lista que Raku, si no, calcularía de forma ansiosa.<\/span> <span class=\"sg\" data-s=\"8\">Con <code>lazy<\/code>, puedes hacer perezosa esa lista.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La mayor parte del tiempo, Raku elige bien por sí solo.<\/span> <span class=\"sg\" data-s=\"1\">Los rangos y las secuencias son perezosos, y la asignación normal a un array es ansiosa.<\/span> <span class=\"sg\" data-s=\"2\">Usa estos prefijos cuando necesites cambiar esa elección.<\/span> <span class=\"sg\" data-s=\"3\">Usa <code>eager<\/code> para que un cálculo costoso ocurra ahora.<\/span> <span class=\"sg\" data-s=\"4\">Usa <code>lazy<\/code> para retrasar un cálculo que podría ser grande o no tener fin.<\/span><\/p>"]]},"it":{"t":"Laziness e eagerness","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Alcune liste in Raku vengono calcolate solo quando servono i loro elementi.<\/span> <span class=\"sg\" data-s=\"1\">Queste liste sono <em>lazy<\/em> (pigre).<\/span> <span class=\"sg\" data-s=\"2\">I prefissi <code>lazy<\/code> e <code>eager<\/code> vi permettono di controllarlo direttamente.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>eager<\/code> fa produrre a Raku una lista <strong>tutta in una volta<\/strong>, senza aspettare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza <code>eager<\/code>, il <code>map<\/code> produrrebbe comunque i valori.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>eager<\/code> fa in modo che vengano calcolati tutti subito, non più tardi su richiesta.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>lazy<\/code> fa l'opposto.<\/span> <span class=\"sg\" data-s=\"1\">Segna una lista come lazy.<\/span> <span class=\"sg\" data-s=\"2\">Allora i suoi elementi vengono prodotti solo quando il codice li chiede.<\/span> <span class=\"sg\" data-s=\"3\">È questo che permette a una lista di essere infinita, almeno in teoria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.is-lazy<\/code> lo conferma.<\/span> <span class=\"sg\" data-s=\"1\">La lista non proverà a calcolare in anticipo tutti i suoi infiniti elementi.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">In questo esempio, però, Raku renderebbe comunque la lista lazy.<\/span> <span class=\"sg\" data-s=\"1\">Un intervallo senza fine, come <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, è già lazy.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Quindi <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> stampa <\/code>True<code> anche senza il prefisso.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Scrivere <code>lazy<\/code> qui non cambia niente.<\/span> <span class=\"sg\" data-s=\"6\">Mostra solo in modo chiaro la vostra intenzione.<\/span> <span class=\"sg\" data-s=\"7\">Il prefisso è davvero utile per una lista che Raku altrimenti calcolerebbe in modo eager.<\/span> <span class=\"sg\" data-s=\"8\">Con <code>lazy<\/code>, potete rendere lazy una lista così.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Nella maggior parte dei casi Raku fa da solo una buona scelta.<\/span> <span class=\"sg\" data-s=\"1\">Gli intervalli e le sequenze sono lazy, e la normale assegnazione a un array è eager.<\/span> <span class=\"sg\" data-s=\"2\">Usate questi prefissi quando dovete cambiare quella scelta.<\/span> <span class=\"sg\" data-s=\"3\">Usate <code>eager<\/code> per far avvenire subito un calcolo costoso.<\/span> <span class=\"sg\" data-s=\"4\">Usate <code>lazy<\/code> per rimandare un calcolo che potrebbe essere grande o senza fine.<\/span><\/p>"]]},"lv":{"t":"Slinkums un dedzīgums","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Daži saraksti Raku valodā tiek aprēķināti tikai tad, kad vajag to elementus.<\/span> <span class=\"sg\" data-s=\"1\">Tādi saraksti ir <em>slinki<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Prefiksi <code>lazy<\/code> un <code>eager<\/code> ļauj jums to vadīt tieši.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>eager<\/code> liek Raku izveidot sarakstu <strong>visu uzreiz<\/strong>, nekavējoties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> radītu vērtības arī bez <code>eager<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>eager<\/code> gādā, ka tās visas tiek aprēķinātas uzreiz, nevis vēlāk pēc pieprasījuma.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>lazy<\/code> dara pretējo.<\/span> <span class=\"sg\" data-s=\"1\">Tas atzīmē sarakstu kā slinku.<\/span> <span class=\"sg\" data-s=\"2\">Tad tā elementi tiek radīti tikai tad, kad kods tos prasa.<\/span> <span class=\"sg\" data-s=\"3\">Tieši tas ļauj sarakstam būt bezgalīgam, vismaz teorētiski:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.is-lazy<\/code> to apstiprina.<\/span> <span class=\"sg\" data-s=\"1\">Saraksts nemēģinās jau iepriekš aprēķināt visus savus bezgalīgos elementus.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Tomēr šajā piemērā Raku tik un tā padarītu sarakstu slinku.<\/span> <span class=\"sg\" data-s=\"1\">Diapazons bez beigām, piemēram, <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, jau ir slinks.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Tāpēc <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> izdrukā <\/code>True<code> arī bez prefiksa.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Ja šeit uzraksta <code>lazy<\/code>, tas neko nemaina.<\/span> <span class=\"sg\" data-s=\"6\">Tas tikai skaidri parāda jūsu nodomu.<\/span> <span class=\"sg\" data-s=\"7\">Prefikss ir patiešām noderīgs sarakstam, ko Raku citādi aprēķinātu dedzīgi.<\/span> <span class=\"sg\" data-s=\"8\">Ar <code>lazy<\/code> jūs varat padarīt tādu sarakstu slinku.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lielākoties Raku pats izdara labu izvēli.<\/span> <span class=\"sg\" data-s=\"1\">Diapazoni un virknes ir slinkas, un parasta piešķiršana masīvam ir dedzīga.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet šos prefiksus, kad šo izvēli vajag mainīt.<\/span> <span class=\"sg\" data-s=\"3\">Izmantojiet <code>eager<\/code>, lai dārgs aprēķins notiktu tagad.<\/span> <span class=\"sg\" data-s=\"4\">Izmantojiet <code>lazy<\/code>, lai atliktu aprēķinu, kas var būt liels vai bez beigām.<\/span><\/p>"]]},"ru":{"t":"Ленивость и немедленность","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Некоторые списки в Raku вычисляются только тогда, когда нужны их элементы.<\/span> <span class=\"sg\" data-s=\"1\">Такие списки называют <em>ленивыми<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Префиксы <code>lazy<\/code> и <code>eager<\/code> позволяют управлять этим напрямую.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>eager<\/code> заставляет Raku создать список <strong>целиком<\/strong>, сразу же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>eager<\/code> <code>map<\/code> всё равно создал бы значения.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>eager<\/code> гарантирует, что все они вычисляются сразу, а не позже по запросу.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>lazy<\/code> делает обратное.<\/span> <span class=\"sg\" data-s=\"1\">Он помечает список как ленивый.<\/span> <span class=\"sg\" data-s=\"2\">Тогда его элементы создаются только тогда, когда код их запрашивает.<\/span> <span class=\"sg\" data-s=\"3\">Именно это позволяет списку быть бесконечным, хотя бы в теории:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> это подтверждает.<\/span> <span class=\"sg\" data-s=\"1\">Список не будет пытаться заранее вычислить все свои бесконечные элементы.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Однако в этом примере Raku и так сделал бы список ленивым.<\/span> <span class=\"sg\" data-s=\"1\">Диапазон без конца, например <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, уже ленивый.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Поэтому <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> печатает <\/code>True<code> и без префикса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Слово <code>lazy<\/code> здесь ничего не меняет.<\/span> <span class=\"sg\" data-s=\"6\">Оно только ясно показывает ваше намерение.<\/span> <span class=\"sg\" data-s=\"7\">Префикс по-настоящему полезен для списка, который Raku иначе вычислил бы нетерпеливо.<\/span> <span class=\"sg\" data-s=\"8\">С <code>lazy<\/code> такой список можно сделать ленивым.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Чаще всего Raku сам делает хороший выбор.<\/span> <span class=\"sg\" data-s=\"1\">Диапазоны и последовательности ленивые, а обычное присваивание массиву — нетерпеливое.<\/span> <span class=\"sg\" data-s=\"2\">Используйте эти префиксы, когда нужно изменить этот выбор.<\/span> <span class=\"sg\" data-s=\"3\">Используйте <code>eager<\/code>, чтобы дорогое вычисление произошло сейчас.<\/span> <span class=\"sg\" data-s=\"4\">Используйте <code>lazy<\/code>, чтобы отложить вычисление, которое может быть большим или бесконечным.<\/span><\/p>"]]},"uk":{"t":"Лінивість та жадібність","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Деякі списки в Raku обчислюються лише тоді, коли потрібні їхні елементи.<\/span> <span class=\"sg\" data-s=\"1\">Такі списки — <em>ліниві<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Префікси <code>lazy<\/code> і <code>eager<\/code> дають змогу керувати цим прямо.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>eager<\/code> змушує Raku створити список <strong>весь одразу<\/strong>, негайно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>map<\/code> і без <code>eager<\/code> усе одно створив би значення.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>eager<\/code> дбає, щоб усі вони обчислювалися відразу, а не пізніше на вимогу.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>lazy<\/code> робить протилежне.<\/span> <span class=\"sg\" data-s=\"1\">Він позначає список як лінивий.<\/span> <span class=\"sg\" data-s=\"2\">Тоді його елементи створюються лише тоді, коли код їх просить.<\/span> <span class=\"sg\" data-s=\"3\">Саме це дає змогу списку бути нескінченним, принаймні в теорії:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.is-lazy<\/code> це підтверджує.<\/span> <span class=\"sg\" data-s=\"1\">Список не намагатиметься обчислити наперед усі свої нескінченні елементи.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Проте в цьому прикладі Raku і так зробив би список лінивим.<\/span> <span class=\"sg\" data-s=\"1\">Діапазон без кінця, як-от <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, уже лінивий.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Тож <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> виводить <\/code>True<code> і без префікса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Якщо написати тут <code>lazy<\/code>, нічого не зміниться.<\/span> <span class=\"sg\" data-s=\"6\">Це лише ясно показує ваш намір.<\/span> <span class=\"sg\" data-s=\"7\">Префікс справді корисний для списку, який Raku інакше обчислив би жадібно.<\/span> <span class=\"sg\" data-s=\"8\">З <code>lazy<\/code> ви можете зробити такий список лінивим.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здебільшого Raku сам робить добрий вибір.<\/span> <span class=\"sg\" data-s=\"1\">Діапазони й послідовності ліниві, а звичайне присвоєння масиву жадібне.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте ці префікси, коли треба змінити цей вибір.<\/span> <span class=\"sg\" data-s=\"3\">Використовуйте <code>eager<\/code>, щоб дороге обчислення відбулося зараз.<\/span> <span class=\"sg\" data-s=\"4\">Використовуйте <code>lazy<\/code>, щоб відкласти обчислення, яке може бути великим або не мати кінця.<\/span><\/p>"]]},"bg":{"t":"Мързеливост и нетърпеливост","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Някои списъци в Raku се изчисляват само когато елементите им са нужни.<\/span> <span class=\"sg\" data-s=\"1\">Такива списъци са <em>мързеливи<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Префиксите <code>lazy<\/code> и <code>eager<\/code> ви позволяват да управлявате това пряко.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>eager<\/code> кара Raku да създаде целия списък <strong>наведнъж<\/strong>, още сега:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без <code>eager<\/code> операцията <code>map<\/code> пак би създала стойностите.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>eager<\/code> гарантира, че всички те се изчисляват веднага, а не по-късно при поискване.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>lazy<\/code> прави обратното.<\/span> <span class=\"sg\" data-s=\"1\">Той отбелязва списък като мързелив.<\/span> <span class=\"sg\" data-s=\"2\">Тогава елементите му се създават само когато кодът ги поиска.<\/span> <span class=\"sg\" data-s=\"3\">Точно това позволява на списъка да бъде безкраен, поне на теория:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.is-lazy<\/code> потвърждава това.<\/span> <span class=\"sg\" data-s=\"1\">Списъкът няма да се опита да изчисли предварително всичките си безкрайни елементи.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">В този пример обаче Raku и без това би направил списъка мързелив.<\/span> <span class=\"sg\" data-s=\"1\">Диапазон без край, като <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, вече е мързелив.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Затова <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> отпечатва <\/code>True<code> и без префикса.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Писането на <code>lazy<\/code> тук не променя нищо.<\/span> <span class=\"sg\" data-s=\"6\">То само показва ясно намерението ви.<\/span> <span class=\"sg\" data-s=\"7\">Префиксът е наистина полезен за списък, който иначе Raku би изчислил нетърпеливо.<\/span> <span class=\"sg\" data-s=\"8\">С <code>lazy<\/code> можете да направите такъв списък мързелив.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В повечето случаи Raku сам прави добър избор.<\/span> <span class=\"sg\" data-s=\"1\">Диапазоните и последователностите са мързеливи, а обикновеното присвояване на масив е нетърпеливо.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте тези префикси, когато трябва да промените този избор.<\/span> <span class=\"sg\" data-s=\"3\">Използвайте <code>eager<\/code>, за да накарате скъпо изчисление да стане сега.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте <code>lazy<\/code>, за да отложите изчисление, което може да е голямо или да няма край.<\/span><\/p>"]]},"eo":{"t":"Maldiligento kaj fervoro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Iuj listoj en Raku estas komputataj nur, kiam iliaj elementoj estas bezonataj.<\/span> <span class=\"sg\" data-s=\"1\">Tiaj listoj estas <em>maldiligentaj<\/em> (lazy).<\/span> <span class=\"sg\" data-s=\"2\">La prefiksoj <code>lazy<\/code> kaj <code>eager<\/code> ebligas al vi regi tion rekte.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>eager<\/code> igas Raku produkti liston <strong>tutan samtempe<\/strong>, tuj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sen <code>eager<\/code>, la <code>map<\/code> tamen produktus la valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>eager<\/code> certigas, ke ili ĉiuj estas komputataj tuj, ne poste laŭbezone.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>lazy<\/code> faras la malon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi markas liston kiel maldiligenta.<\/span> <span class=\"sg\" data-s=\"2\">Tiam ĝiaj elementoj estas produktataj nur, kiam la kodo petas ilin.<\/span> <span class=\"sg\" data-s=\"3\">Tio ebligas al listo esti senfina, almenaŭ teorie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.is-lazy<\/code> konfirmas tion.<\/span> <span class=\"sg\" data-s=\"1\">La listo ne provos komputi ĉiujn siajn senfinajn elementojn antaŭe.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu ekzemplo tamen Raku ĉiuokaze farus la liston maldiligenta.<\/span> <span class=\"sg\" data-s=\"1\">Intervalo sen fino, kiel <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, jam estas maldiligenta.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Do <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> presas <\/code>True<code> sen la prefikso.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Skribi <code>lazy<\/code> ĉi tie ŝanĝas nenion.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi nur montras klare vian intencon.<\/span> <span class=\"sg\" data-s=\"7\">La prefikso estas vere utila por listo, kiun Raku alie komputus avide.<\/span> <span class=\"sg\" data-s=\"8\">Per <code>lazy<\/code>, vi povas fari tian liston maldiligenta.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Plej ofte Raku mem faras bonan elekton.<\/span> <span class=\"sg\" data-s=\"1\">Intervaloj kaj sekvencoj estas maldiligentaj, kaj normala atribuo al tabelo estas avida.<\/span> <span class=\"sg\" data-s=\"2\">Uzu ĉi tiujn prefiksojn, kiam vi bezonas ŝanĝi tiun elekton.<\/span> <span class=\"sg\" data-s=\"3\">Uzu <code>eager<\/code>, por ke multekosta komputado okazu nun.<\/span> <span class=\"sg\" data-s=\"4\">Uzu <code>lazy<\/code> por prokrasti komputadon, kiu povus esti granda aŭ ne havi finon.<\/span><\/p>"]]},"la":{"t":"Pigritia et alacri","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quidam indices in Raku solum computantur cum elementa eorum requiruntur.<\/span> <span class=\"sg\" data-s=\"1\">Tales indices <em>pigri<\/em> sunt.<\/span> <span class=\"sg\" data-s=\"2\">Praefixa <code>lazy<\/code> et <code>eager<\/code> sinunt te hoc directe regere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>eager<\/code> Raku cogit indicem <strong>totum simul<\/strong> producere, statim:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @squares = eager (1..3).map(* ** 2);\nsay @squares; # [1 4 9]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine <code>eager<\/code>, <code>map<\/code> tamen valores produceret.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>eager<\/code> curat ut omnes statim computentur, non postea cum opus est.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>lazy<\/code> contrarium facit.<\/span> <span class=\"sg\" data-s=\"1\">Indicem ut pigrum signat.<\/span> <span class=\"sg\" data-s=\"2\">Tum elementa eius solum producuntur cum codex ea petit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc sinit indicem infinitum esse, saltem in theoria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $numbers = lazy (1 .. Inf);\nsay $numbers.is-lazy; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.is-lazy<\/code> hoc confirmat.<\/span> <span class=\"sg\" data-s=\"1\">Index non conabitur omnia sua elementa infinita ante computare.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">In hoc tamen exemplo Raku indicem utcumque pigrum faceret.<\/span> <span class=\"sg\" data-s=\"1\">Intervallum sine fine, sicut <code>1 ..<\/code><\/span> <span class=\"sg\" data-s=\"2\">Inf<code>, iam pigrum est.<\/code><\/span> <span class=\"sg\" data-s=\"3\">Itaque <code>say (1 ..<\/code><\/span> <span class=\"sg\" data-s=\"4\">Inf).is-lazy<code> imprimit <\/code>True<code> sine praefixo.<\/code><\/span> <span class=\"sg\" data-s=\"5\">Scribere <code>lazy<\/code> hic nihil mutat.<\/span> <span class=\"sg\" data-s=\"6\">Solum consilium tuum clare ostendit.<\/span> <span class=\"sg\" data-s=\"7\">Praefixum vere utile est pro indice quem Raku aliter impigre computaret.<\/span> <span class=\"sg\" data-s=\"8\">Cum <code>lazy<\/code> talem indicem pigrum facere potes.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Plerumque Raku per se bene eligit.<\/span> <span class=\"sg\" data-s=\"1\">Intervalla et sequentiae pigra sunt, et simplex assignatio ad ordinem impigra est.<\/span> <span class=\"sg\" data-s=\"2\">Haec praefixa adhibe cum illam electionem mutare debes.<\/span> <span class=\"sg\" data-s=\"3\">Adhibe <code>eager<\/code> ut computatio sumptuosa nunc fiat.<\/span> <span class=\"sg\" data-s=\"4\">Adhibe <code>lazy<\/code> ut computationem differas quae magna vel sine fine esse potest.<\/span><\/p>"]]}}}</script>
