<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/sink-quietly","n":620,"k":"topic","pv":"advanced/statement-prefixes/lazy-eager","nx":"advanced/statement-prefixes/sink-quietly/quiz","tr":["advanced","advanced/statement-prefixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"sink and quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Two more prefixes are about running code for its effects, not for its value.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>sink<\/code> prefix runs something in <em>sink context<\/em>, that is, only for its side effects.<\/span> <span class=\"sg\" data-s=\"1\">The result is thrown away.<\/span> <span class=\"sg\" data-s=\"2\">This is useful when you want to force a lazy operation to run:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the <code>map<\/code> runs only for the printing it does.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> makes sure that it really runs, and then throws the resulting list away.<\/span> <span class=\"sg\" data-s=\"2\">If nothing forces it, a lazy <code>map<\/code> might not run at all.<\/span> <span class=\"sg\" data-s=\"3\">This can happen when its result is never used.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>quietly<\/code> prefix runs a block with its <strong>warnings turned off<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Code that usually prints a warning to the error stream stays silent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Adding <code>1<\/code> to an undefined <code>$value<\/code> usually gives a warning about an uninitialized value.<\/span> <span class=\"sg\" data-s=\"1\">Inside <code>quietly<\/code>, this warning is hidden.<\/span> <span class=\"sg\" data-s=\"2\">Use it when you know that some code warns, and you do not want the noise.<\/span> <span class=\"sg\" data-s=\"3\">But use it rarely, because warnings usually point to a real mistake.<\/span><\/p>"]]},"de":{"t":"sink und quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Zwei weitere Präfixe führen Code wegen seiner Wirkung aus, nicht wegen seines Werts.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>sink<\/code>-Präfix führt etwas im <em>Sink-Kontext<\/em> aus, also nur für seine Seiteneffekte.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis wird weggeworfen.<\/span> <span class=\"sg\" data-s=\"2\">Das ist nützlich, wenn du eine lazy Operation zum Laufen zwingen willst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier läuft das <code>map<\/code> nur wegen der Ausgabe, die es macht.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> sorgt dafür, dass es wirklich läuft, und wirft dann die Liste weg, die dabei entsteht.<\/span> <span class=\"sg\" data-s=\"2\">Wenn nichts es zwingt, läuft ein lazy <code>map<\/code> vielleicht gar nicht.<\/span> <span class=\"sg\" data-s=\"3\">Das kann passieren, wenn sein Ergebnis nie verwendet wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>quietly<\/code>-Präfix führt einen Block mit <strong>ausgeschalteten Warnungen<\/strong> aus.<\/span> <span class=\"sg\" data-s=\"1\">Code, der normalerweise eine Warnung in den Fehlerstrom ausgibt, bleibt still:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, ohne \"uninitialized value\"-Warnung\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn du <code>1<\/code> zu einem undefinierten <code>$value<\/code> addierst, warnt Raku normalerweise vor einem uninitialisierten Wert.<\/span> <span class=\"sg\" data-s=\"1\">In <code>quietly<\/code> ist diese Warnung versteckt.<\/span> <span class=\"sg\" data-s=\"2\">Nutze es, wenn du weißt, dass ein Code warnt, und du den Lärm nicht willst.<\/span> <span class=\"sg\" data-s=\"3\">Aber nutze es selten, weil Warnungen meistens auf einen echten Fehler zeigen.<\/span><\/p>"]]},"nl":{"t":"sink en quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Nog twee prefixen gaan over code draaien voor de effecten, niet voor de waarde.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>sink<\/code> draait iets in <em>sink context<\/em>, dus alleen voor de neveneffecten.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat wordt weggegooid.<\/span> <span class=\"sg\" data-s=\"2\">Dat is handig als je een luie operatie wilt dwingen om te draaien:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier draait de <code>map<\/code> alleen voor het printen dat hij doet.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> zorgt ervoor dat hij echt draait, en gooit daarna de lijst die eruit komt weg.<\/span> <span class=\"sg\" data-s=\"2\">Als niets hem dwingt, draait een luie <code>map<\/code> misschien helemaal niet.<\/span> <span class=\"sg\" data-s=\"3\">Dat kan gebeuren als zijn resultaat nooit wordt gebruikt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Het prefix <code>quietly<\/code> draait een blok met de <strong>waarschuwingen uitgezet<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Code die meestal een waarschuwing naar de foutuitvoer print, blijft stil:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Als je <code>1<\/code> optelt bij een ongedefinieerde <code>$value<\/code>, krijg je meestal een waarschuwing over een niet-geïnitialiseerde waarde.<\/span> <span class=\"sg\" data-s=\"1\">Binnen <code>quietly<\/code> is deze waarschuwing verborgen.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik het als je weet dat code een waarschuwing geeft en je het lawaai niet wilt.<\/span> <span class=\"sg\" data-s=\"3\">Maar gebruik het weinig, want waarschuwingen wijzen meestal op een echte fout.<\/span><\/p>"]]},"es":{"t":"sink y quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Dos prefijos más sirven para ejecutar código por sus efectos, no por su valor.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>sink<\/code> ejecuta algo en <em>contexto sink<\/em>, es decir, solo por sus efectos secundarios.<\/span> <span class=\"sg\" data-s=\"1\">El resultado se tira.<\/span> <span class=\"sg\" data-s=\"2\">Esto es útil cuando quieres obligar a una operación perezosa a ejecutarse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, el <code>map<\/code> se ejecuta solo por lo que imprime.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> se asegura de que de verdad se ejecute, y después tira la lista resultante.<\/span> <span class=\"sg\" data-s=\"2\">Si nada lo obliga, un <code>map<\/code> perezoso podría no ejecutarse en absoluto.<\/span> <span class=\"sg\" data-s=\"3\">Esto puede pasar cuando su resultado nunca se usa.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El prefijo <code>quietly<\/code> ejecuta un bloque con sus <strong>advertencias apagadas<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">El código que normalmente imprime una advertencia en el flujo de error se queda en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sumar <code>1<\/code> a un <code>$value<\/code> indefinido normalmente da una advertencia sobre un valor no inicializado.<\/span> <span class=\"sg\" data-s=\"1\">Dentro de <code>quietly<\/code>, esta advertencia queda oculta.<\/span> <span class=\"sg\" data-s=\"2\">Úsalo cuando sabes que un código da advertencias y no quieres el ruido.<\/span> <span class=\"sg\" data-s=\"3\">Pero úsalo poco, porque las advertencias normalmente señalan un error real.<\/span><\/p>"]]},"it":{"t":"sink e quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Altri due prefissi servono a eseguire codice per i suoi effetti, non per il suo valore.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>sink<\/code> esegue qualcosa in <em>contesto sink<\/em>, cioè solo per i suoi effetti collaterali.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato viene buttato via.<\/span> <span class=\"sg\" data-s=\"2\">Questo è utile quando volete obbligare un'operazione lazy a partire:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui il <code>map<\/code> viene eseguito solo per la stampa che fa.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> fa in modo che venga eseguito davvero, e poi butta via la lista che ne risulta.<\/span> <span class=\"sg\" data-s=\"2\">Se niente lo obbliga, un <code>map<\/code> lazy potrebbe non essere eseguito affatto.<\/span> <span class=\"sg\" data-s=\"3\">Questo può succedere quando il suo risultato non viene mai usato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il prefisso <code>quietly<\/code> esegue un blocco con i suoi <strong>avvisi spenti<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Il codice che di solito stampa un avviso sul flusso di errore resta in silenzio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sommare <code>1<\/code> a un <code>$value<\/code> non definito di solito dà un avviso su un valore non inizializzato.<\/span> <span class=\"sg\" data-s=\"1\">Dentro <code>quietly<\/code>, questo avviso viene nascosto.<\/span> <span class=\"sg\" data-s=\"2\">Usatelo quando sapete che un certo codice dà un avviso e non volete il rumore.<\/span> <span class=\"sg\" data-s=\"3\">Ma usatelo raramente, perché gli avvisi di solito indicano un errore vero.<\/span><\/p>"]]},"lv":{"t":"sink un quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl divi prefiksi ir par koda izpildi tā efektu dēļ, nevis vērtības dēļ.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>sink<\/code> izpilda kaut ko <em>iesūkšanas kontekstā<\/em>, tas ir, tikai blakusefektu dēļ.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts tiek izmests.<\/span> <span class=\"sg\" data-s=\"2\">Tas noder, kad jūs gribat piespiest slinku darbību izpildīties:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>map<\/code> izpildās tikai tās drukāšanas dēļ, ko tas veic.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> gādā, ka tas tiešām izpildās, un pēc tam izmet iegūto sarakstu.<\/span> <span class=\"sg\" data-s=\"2\">Ja nekas to nepiespiež, slinks <code>map<\/code> var vispār neizpildīties.<\/span> <span class=\"sg\" data-s=\"3\">Tā var notikt, ja tā rezultātu nekad neizmanto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prefikss <code>quietly<\/code> izpilda bloku ar <strong>izslēgtiem brīdinājumiem<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Kods, kas parasti izdrukā brīdinājumu kļūdu plūsmā, paliek kluss:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ja nedefinētam <code>$value<\/code> pieskaita <code>1<\/code>, parasti rodas brīdinājums par neinicializētu vērtību.<\/span> <span class=\"sg\" data-s=\"1\"><code>quietly<\/code> iekšienē šis brīdinājums ir paslēpts.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet to, kad zināt, ka kāds kods brīdina, un jūs negribat troksni.<\/span> <span class=\"sg\" data-s=\"3\">Bet izmantojiet to reti, jo brīdinājumi parasti norāda uz īstu kļūdu.<\/span><\/p>"]]},"ru":{"t":"sink и quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ещё два префикса нужны, чтобы выполнять код ради его эффектов, а не ради его значения.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>sink<\/code> выполняет что-то в <em>контексте sink<\/em>, то есть только ради побочных эффектов.<\/span> <span class=\"sg\" data-s=\"1\">Результат выбрасывается.<\/span> <span class=\"sg\" data-s=\"2\">Это полезно, когда нужно заставить ленивую операцию выполниться:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>map<\/code> выполняется только ради печати, которую он делает.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> гарантирует, что он действительно выполнится, а потом выбрасывает полученный список.<\/span> <span class=\"sg\" data-s=\"2\">Если ничто его не заставляет, ленивый <code>map<\/code> может вообще не запуститься.<\/span> <span class=\"sg\" data-s=\"3\">Так бывает, когда его результат никогда не используется.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префикс <code>quietly<\/code> выполняет блок с <strong>выключенными предупреждениями<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, который обычно печатает предупреждение в поток ошибок, молчит:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без предупреждения \"uninitialized value\"\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Если прибавить <code>1<\/code> к неопределённому <code>$value<\/code>, обычно появляется предупреждение о неинициализированном значении.<\/span> <span class=\"sg\" data-s=\"1\">Внутри <code>quietly<\/code> это предупреждение скрыто.<\/span> <span class=\"sg\" data-s=\"2\">Используйте его, когда вы знаете, что код выдаёт предупреждение, и не хотите лишнего шума.<\/span> <span class=\"sg\" data-s=\"3\">Но делайте это редко, потому что предупреждения обычно указывают на настоящую ошибку.<\/span><\/p>"]]},"uk":{"t":"sink та quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще два префікси стосуються виконання коду заради його ефектів, а не заради значення.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>sink<\/code> виконує щось у <em>контексті стоку<\/em>, тобто лише заради побічних ефектів.<\/span> <span class=\"sg\" data-s=\"1\">Результат викидається.<\/span> <span class=\"sg\" data-s=\"2\">Це корисно, коли ви хочете змусити ліниву операцію виконатися:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут <code>map<\/code> виконується лише заради друку, який він робить.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> дбає, щоб він справді виконався, а потім викидає отриманий список.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ніщо його не змушує, лінивий <code>map<\/code> може взагалі не виконатися.<\/span> <span class=\"sg\" data-s=\"3\">Так буває, коли його результат ніде не використовується.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префікс <code>quietly<\/code> виконує блок із <strong>вимкненими попередженнями<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, який зазвичай друкує попередження в потік помилок, мовчить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, без попередження \"uninitialized value\"\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Якщо додати <code>1<\/code> до невизначеного <code>$value<\/code>, зазвичай з'являється попередження про неініціалізоване значення.<\/span> <span class=\"sg\" data-s=\"1\">Усередині <code>quietly<\/code> це попередження приховане.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте його, коли знаєте, що якийсь код дає попередження, і не хочете цього шуму.<\/span> <span class=\"sg\" data-s=\"3\">Але робіть це рідко, бо попередження зазвичай вказують на справжню помилку.<\/span><\/p>"]]},"bg":{"t":"sink и quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Още два префикса изпълняват код заради ефектите му, а не заради стойността му.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>sink<\/code> изпълнява нещо в <em>sink контекст<\/em>, тоест само заради страничните му ефекти.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът се изхвърля.<\/span> <span class=\"sg\" data-s=\"2\">Това е полезно, когато искате да накарате мързелива операция да се изпълни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук <code>map<\/code> се изпълнява само заради отпечатването, което прави.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> гарантира, че той наистина се изпълнява, и след това изхвърля получения списък.<\/span> <span class=\"sg\" data-s=\"2\">Ако нищо не го принуждава, мързеливият <code>map<\/code> може изобщо да не се изпълни.<\/span> <span class=\"sg\" data-s=\"3\">Това може да стане, когато резултатът му никога не се използва.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Префиксът <code>quietly<\/code> изпълнява блок с <strong>изключени предупреждения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Код, който обикновено отпечатва предупреждение в потока за грешки, остава тих:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Добавянето на <code>1<\/code> към неопределена <code>$value<\/code> обикновено дава предупреждение за неинициализирана стойност.<\/span> <span class=\"sg\" data-s=\"1\">Вътре в <code>quietly<\/code> това предупреждение е скрито.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте го, когато знаете, че някой код предупреждава, и не искате шума.<\/span> <span class=\"sg\" data-s=\"3\">Но го използвайте рядко, защото предупрежденията обикновено сочат истинска грешка.<\/span><\/p>"]]},"eo":{"t":"sink kaj quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Du pliaj prefiksoj temas pri rulado de kodo pro ĝiaj efektoj, ne pro ĝia valoro.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>sink<\/code> rulas ion en <em>sink-kunteksto<\/em>, tio estas, nur pro ĝiaj flankefektoj.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas forĵetata.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas utila, kiam vi volas devigi maldiligentan operacion ruliĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la <code>map<\/code> ruliĝas nur pro la presado, kiun ĝi faras.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> certigas, ke ĝi vere ruliĝas, kaj poste forĵetas la rezultan liston.<\/span> <span class=\"sg\" data-s=\"2\">Se nenio devigas ĝin, maldiligenta <code>map<\/code> eble tute ne ruliĝus.<\/span> <span class=\"sg\" data-s=\"3\">Tio povas okazi, kiam ĝia rezulto neniam estas uzata.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La prefikso <code>quietly<\/code> rulas blokon kun ĝiaj <strong>avertoj malŝaltitaj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Kodo, kiu kutime presas averton al la erara fluo, restas silenta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aldoni <code>1<\/code> al nedefinita <code>$value<\/code> kutime donas averton pri neinicialigita valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ene de <code>quietly<\/code>, ĉi tiu averto estas kaŝita.<\/span> <span class=\"sg\" data-s=\"2\">Uzu ĝin, kiam vi scias, ke iu kodo avertas, kaj vi ne volas la bruon.<\/span> <span class=\"sg\" data-s=\"3\">Sed uzu ĝin malofte, ĉar avertoj kutime montras veran eraron.<\/span><\/p>"]]},"la":{"t":"sink et quietly","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Duo alia praefixa codicem propter effectus eius currunt, non propter valorem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>sink<\/code> aliquid in <em>contextu sink<\/em> currit, id est solum propter effectus laterales.<\/span> <span class=\"sg\" data-s=\"1\">Resultatum abicitur.<\/span> <span class=\"sg\" data-s=\"2\">Hoc utile est cum operationem pigram currere cogere vis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sink (1..3).map({ print \"$_ \" });\nprint \"\\n\"; # 1 2 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic <code>map<\/code> solum propter impressionem quam facit currit.<\/span> <span class=\"sg\" data-s=\"1\"><code>sink<\/code> curat ut revera currat, deinde indicem resultantem abicit.<\/span> <span class=\"sg\" data-s=\"2\">Si nihil eam cogit, <code>map<\/code> pigra fortasse omnino non curreret.<\/span> <span class=\"sg\" data-s=\"3\">Hoc fieri potest cum resultatum eius numquam adhibetur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praefixum <code>quietly<\/code> copiam cum <strong>admonitionibus exstinctis<\/strong> currit.<\/span> <span class=\"sg\" data-s=\"1\">Codex qui plerumque admonitionem ad fluxum errorum imprimit tacitus manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nquietly {\n    say $value + 1; # 1, with no \"uninitialized value\" warning\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Si <code>1<\/code> ad <code>$value<\/code> indefinitum addis, plerumque admonitio de valore non initializato oritur.<\/span> <span class=\"sg\" data-s=\"1\">Intra <code>quietly<\/code> haec admonitio celatur.<\/span> <span class=\"sg\" data-s=\"2\">Eo utere cum scis aliquem codicem admonere, et strepitum non vis.<\/span> <span class=\"sg\" data-s=\"3\">Sed raro eo utere, quia admonitiones plerumque verum errorem indicant.<\/span><\/p>"]]}}}</script>
