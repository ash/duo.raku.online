<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes/do-prefix","n":617,"k":"topic","pv":"advanced/statement-prefixes","nx":"advanced/statement-prefixes/do-prefix/quiz","tr":["advanced","advanced/statement-prefixes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"do and the value of a block","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A block on its own is a statement, not an expression.<\/span> <span class=\"sg\" data-s=\"1\">So normally you cannot assign it to a variable.<\/span> <span class=\"sg\" data-s=\"2\">The <code>do<\/code> prefix turns a block into an expression.<\/span> <span class=\"sg\" data-s=\"3\">Its value is the value of the block's <strong>last<\/strong> statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Inside the block, you can declare variables, run several statements and compute a result.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>do<\/code> returns the value of the block.<\/span> <span class=\"sg\" data-s=\"2\">This is useful when you need more than one expression to get a value.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> also works in front of control-flow statements.<\/span> <span class=\"sg\" data-s=\"1\">Then they can return a value too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here <code>do given<\/code> turns the whole <code>given<\/code>/<code>when<\/code> into an expression with the value <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The same works with <code>do if<\/code> and <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In short, <code>do<\/code> lets you use a block where a value is expected.<\/span> <span class=\"sg\" data-s=\"3\">This also works for a control structure.<\/span><\/p>"]]},"de":{"t":"do und der Wert eines Blocks","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Block für sich ist eine Anweisung, kein Ausdruck.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb kannst du ihn normalerweise keiner Variablen zuweisen.<\/span> <span class=\"sg\" data-s=\"2\">Das <code>do<\/code>-Präfix verwandelt einen Block in einen Ausdruck.<\/span> <span class=\"sg\" data-s=\"3\">Sein Wert ist der Wert der <strong>letzten<\/strong> Anweisung des Blocks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Im Block kannst du Variablen deklarieren, mehrere Anweisungen ausführen und ein Ergebnis berechnen.<\/span> <span class=\"sg\" data-s=\"1\">Dann gibt <code>do<\/code> den Wert des Blocks zurück.<\/span> <span class=\"sg\" data-s=\"2\">Das ist praktisch, wenn du mehr als einen Ausdruck brauchst, um einen Wert zu bekommen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funktioniert auch vor Kontrollfluss-Anweisungen.<\/span> <span class=\"sg\" data-s=\"1\">Dann können auch sie einen Wert zurückgeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier verwandelt <code>do given<\/code> das ganze <code>given<\/code>/<code>when<\/code> in einen Ausdruck mit dem Wert <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert genauso mit <code>do if<\/code> und <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kurz gesagt: Mit <code>do<\/code> kannst du einen Block dort verwenden, wo ein Wert erwartet wird.<\/span> <span class=\"sg\" data-s=\"3\">Das funktioniert auch für eine Kontrollstruktur.<\/span><\/p>"]]},"nl":{"t":"do en de waarde van een blok","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een blok op zichzelf is een statement, geen expressie.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het dus normaal niet aan een variabele toewijzen.<\/span> <span class=\"sg\" data-s=\"2\">Het prefix <code>do<\/code> verandert een blok in een expressie.<\/span> <span class=\"sg\" data-s=\"3\">De waarde daarvan is de waarde van het <strong>laatste<\/strong> statement van het blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Binnen het blok kun je variabelen declareren, meerdere statements uitvoeren en een resultaat berekenen.<\/span> <span class=\"sg\" data-s=\"1\">Daarna geeft <code>do<\/code> de waarde van het blok terug.<\/span> <span class=\"sg\" data-s=\"2\">Dat is handig als je meer dan één expressie nodig hebt om een waarde te krijgen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> werkt ook vóór control-flow-statements.<\/span> <span class=\"sg\" data-s=\"1\">Dan kunnen die ook een waarde teruggeven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier verandert <code>do given<\/code> de hele <code>given<\/code>/<code>when<\/code> in een expressie met de waarde <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde werkt met <code>do if<\/code> en <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kortom: met <code>do<\/code> kun je een blok gebruiken op een plek waar een waarde verwacht wordt.<\/span> <span class=\"sg\" data-s=\"3\">Dat werkt ook voor een besturingsstructuur.<\/span><\/p>"]]},"es":{"t":"do y el valor de un bloque","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un bloque por sí solo es una sentencia, no una expresión.<\/span> <span class=\"sg\" data-s=\"1\">Así que normalmente no puedes asignarlo a una variable.<\/span> <span class=\"sg\" data-s=\"2\">El prefijo <code>do<\/code> convierte un bloque en una expresión.<\/span> <span class=\"sg\" data-s=\"3\">Su valor es el valor de la <strong>última<\/strong> sentencia del bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro del bloque, puedes declarar variables, ejecutar varias sentencias y calcular un resultado.<\/span> <span class=\"sg\" data-s=\"1\">Después, <code>do<\/code> devuelve el valor del bloque.<\/span> <span class=\"sg\" data-s=\"2\">Esto es útil cuando necesitas más de una expresión para obtener un valor.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> también funciona delante de las sentencias de flujo de control.<\/span> <span class=\"sg\" data-s=\"1\">Entonces también pueden devolver un valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí <code>do given<\/code> convierte todo el <code>given<\/code>/<code>when<\/code> en una expresión con el valor <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo funciona con <code>do if<\/code> y <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En resumen, <code>do<\/code> te deja usar un bloque donde se espera un valor.<\/span> <span class=\"sg\" data-s=\"3\">Esto también funciona con una estructura de control.<\/span><\/p>"]]},"it":{"t":"do e il valore di un blocco","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un blocco da solo è un'istruzione, non un'espressione.<\/span> <span class=\"sg\" data-s=\"1\">Quindi normalmente non potete assegnarlo a una variabile.<\/span> <span class=\"sg\" data-s=\"2\">Il prefisso <code>do<\/code> trasforma un blocco in un'espressione.<\/span> <span class=\"sg\" data-s=\"3\">Il suo valore è il valore dell'<strong>ultima<\/strong> istruzione del blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dentro il blocco potete dichiarare variabili, eseguire diverse istruzioni e calcolare un risultato.<\/span> <span class=\"sg\" data-s=\"1\">Poi <code>do<\/code> restituisce il valore del blocco.<\/span> <span class=\"sg\" data-s=\"2\">Questo è utile quando vi serve più di un'espressione per ottenere un valore.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> funziona anche davanti alle istruzioni di controllo del flusso.<\/span> <span class=\"sg\" data-s=\"1\">Allora anche queste possono restituire un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui <code>do given<\/code> trasforma tutto il <code>given<\/code>/<code>when<\/code> in un'espressione con il valore <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso funziona con <code>do if<\/code> e <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In breve, <code>do<\/code> vi permette di usare un blocco dove serve un valore.<\/span> <span class=\"sg\" data-s=\"3\">Questo funziona anche per una struttura di controllo.<\/span><\/p>"]]},"lv":{"t":"do un bloka vērtība","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloks pats par sevi ir teikums, nevis izteiksme.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc parasti to nevar piešķirt mainīgajam.<\/span> <span class=\"sg\" data-s=\"2\">Prefikss <code>do<\/code> pārvērš bloku par izteiksmi.<\/span> <span class=\"sg\" data-s=\"3\">Tās vērtība ir bloka <strong>pēdējā<\/strong> teikuma vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Bloka iekšienē jūs varat deklarēt mainīgos, izpildīt vairākus teikumus un aprēķināt rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>do<\/code> atgriež bloka vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Tas noder, kad vērtības iegūšanai vajag vairāk nekā vienu izteiksmi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> darbojas arī vadības plūsmas teikumu priekšā.<\/span> <span class=\"sg\" data-s=\"1\">Tad arī tie var atgriezt vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>do given<\/code> pārvērš visu <code>given<\/code>/<code>when<\/code> par izteiksmi ar vērtību <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats darbojas ar <code>do if<\/code> un <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Īsi sakot, <code>do<\/code> ļauj izmantot bloku tur, kur gaida vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tas darbojas arī ar vadības struktūru.<\/span><\/p>"]]},"ru":{"t":"do и значение блока","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок сам по себе — это оператор, а не выражение.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому обычно его нельзя присвоить переменной.<\/span> <span class=\"sg\" data-s=\"2\">Префикс <code>do<\/code> превращает блок в выражение.<\/span> <span class=\"sg\" data-s=\"3\">Значение этого выражения — значение <strong>последнего<\/strong> оператора блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри блока можно объявлять переменные, выполнять несколько операторов и вычислять результат.<\/span> <span class=\"sg\" data-s=\"1\">Затем <code>do<\/code> возвращает значение блока.<\/span> <span class=\"sg\" data-s=\"2\">Это удобно, когда для получения значения нужно больше одного выражения.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> также работает перед управляющими конструкциями.<\/span> <span class=\"sg\" data-s=\"1\">Тогда они тоже могут возвращать значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>do given<\/code> превращает всю конструкцию <code>given<\/code>/<code>when<\/code> в выражение со значением <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">То же самое работает с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Короче говоря, <code>do<\/code> позволяет использовать блок там, где ожидается значение.<\/span> <span class=\"sg\" data-s=\"3\">Это работает и для управляющей конструкции.<\/span><\/p>"]]},"uk":{"t":"do та значення блоку","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок сам по собі — оператор, а не вираз.<\/span> <span class=\"sg\" data-s=\"1\">Тож зазвичай його не можна присвоїти змінній.<\/span> <span class=\"sg\" data-s=\"2\">Префікс <code>do<\/code> перетворює блок на вираз.<\/span> <span class=\"sg\" data-s=\"3\">Його значення — це значення <strong>останнього<\/strong> оператора блоку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усередині блоку можна оголошувати змінні, виконувати кілька операторів і обчислювати результат.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>do<\/code> повертає значення блоку.<\/span> <span class=\"sg\" data-s=\"2\">Це корисно, коли для отримання значення потрібен не один вираз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> також працює перед операторами керування потоком виконання.<\/span> <span class=\"sg\" data-s=\"1\">Тоді вони теж можуть повертати значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут <code>do given<\/code> перетворює весь <code>given<\/code>/<code>when<\/code> на вираз зі значенням <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так само працюють <code>do if<\/code> і <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Коротко кажучи, <code>do<\/code> дає змогу використати блок там, де очікується значення.<\/span> <span class=\"sg\" data-s=\"3\">Це працює і для керівної конструкції.<\/span><\/p>"]]},"bg":{"t":"do и стойността на блок","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Самостоятелният блок е оператор, а не израз.<\/span> <span class=\"sg\" data-s=\"1\">Затова обикновено не можете да го присвоите на променлива.<\/span> <span class=\"sg\" data-s=\"2\">Префиксът <code>do<\/code> превръща блок в израз.<\/span> <span class=\"sg\" data-s=\"3\">Стойността на този израз е стойността на <strong>последния<\/strong> оператор на блока:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вътре в блока можете да декларирате променливи, да изпълнявате няколко оператора и да изчислите резултат.<\/span> <span class=\"sg\" data-s=\"1\">След това <code>do<\/code> връща стойността на блока.<\/span> <span class=\"sg\" data-s=\"2\">Това е полезно, когато ви трябва повече от един израз, за да получите стойност.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> работи и пред операторите за управление на потока.<\/span> <span class=\"sg\" data-s=\"1\">Тогава и те могат да връщат стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук <code>do given<\/code> превръща цялата конструкция <code>given<\/code>/<code>when<\/code> в израз със стойност <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Същото работи с <code>do if<\/code> и <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Накратко, <code>do<\/code> ви позволява да използвате блок там, където се очаква стойност.<\/span> <span class=\"sg\" data-s=\"3\">Това работи и за управляваща конструкция.<\/span><\/p>"]]},"eo":{"t":"do kaj la valoro de bloko","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloko per si mem estas deklaro, ne esprimo.<\/span> <span class=\"sg\" data-s=\"1\">Do normale vi ne povas atribui ĝin al variablo.<\/span> <span class=\"sg\" data-s=\"2\">La prefikso <code>do<\/code> transformas blokon en esprimon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝia valoro estas la valoro de la <strong>lasta<\/strong> deklaro de la bloko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ene de la bloko, vi povas deklari variablojn, ruli plurajn deklarojn kaj komputi rezulton.<\/span> <span class=\"sg\" data-s=\"1\">Poste <code>do<\/code> redonas la valoron de la bloko.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas utila, kiam vi bezonas pli ol unu esprimon por ricevi valoron.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> ankaŭ funkcias antaŭ kontrolfluaj deklaroj.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ili ankaŭ povas redoni valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>do given<\/code> transformas la tutan <code>given<\/code>/<code>when<\/code> en esprimon kun la valoro <code>positive<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Same funkcias <code>do if<\/code> kaj <code>do for<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Resume, per <code>do<\/code> vi povas uzi blokon tie, kie oni atendas valoron.<\/span> <span class=\"sg\" data-s=\"3\">Tio funkcias ankaŭ por kontrolstrukturo.<\/span><\/p>"]]},"la":{"t":"do et valor bloci","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Copia per se sententia est, non expressio.<\/span> <span class=\"sg\" data-s=\"1\">Itaque plerumque eam variabili assignare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Praefixum <code>do<\/code> copiam in expressionem convertit.<\/span> <span class=\"sg\" data-s=\"3\">Valor eius est valor <strong>ultimae<\/strong> sententiae copiae:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = do {\n    my $a = 3;\n    $a + 4;\n};\n\nsay $x; # 7<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intra copiam variabiles declarare, plures sententias currere et resultatum computare potes.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>do<\/code> valorem copiae reddit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc utile est cum plus quam unam expressionem requiris ut valorem accipias.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>do<\/code> etiam ante sententias fluxus controllandi operatur.<\/span> <span class=\"sg\" data-s=\"1\">Tum etiam illae valorem reddere possunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $sign = do given 5 {\n    when * &gt; 0 { 'positive' }\n    when * &lt; 0 { 'negative' }\n    default    { 'zero' }\n};\n\nsay $sign; # positive<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic <code>do given<\/code> totum <code>given<\/code>/<code>when<\/code> in expressionem cum valore <code>positive<\/code> convertit.<\/span> <span class=\"sg\" data-s=\"1\">Idem cum <code>do if<\/code> et <code>do for<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"2\">Breviter, <code>do<\/code> sinit te copia uti ubi valor exspectatur.<\/span> <span class=\"sg\" data-s=\"3\">Hoc etiam pro structura controllandi operatur.<\/span><\/p>"]]}}}</script>
