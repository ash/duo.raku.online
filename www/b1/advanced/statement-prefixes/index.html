<script type="application/json" id="page-data">{"u":"advanced/statement-prefixes","n":616,"k":"section","pv":"advanced/gather-take/quiz","nx":"advanced/statement-prefixes/do-prefix","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Statement prefixes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>statement prefix<\/em> is a keyword that you put before a statement or block.<\/span> <span class=\"sg\" data-s=\"1\">It changes the way that the code runs.<\/span> <span class=\"sg\" data-s=\"2\">You have already seen one: <code>gather<\/code>, which collects everything that a block gives to <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This section shows a few more prefixes for general use.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">With prefixes, you can do several things.<\/span> <span class=\"sg\" data-s=\"1\">You can turn a block into an expression that gives a value (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">You can decide when a list is computed: at once or on demand (<code>eager<\/code> and <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">And you can run code only for its side effects (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Or you can run it with its warnings turned off (<code>quietly<\/code>).<\/span><\/p>"]]},"de":{"t":"Anweisungspräfixe","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Statement-Prefix<\/em> ist ein Schlüsselwort, das du vor eine Anweisung oder einen Block setzt.<\/span> <span class=\"sg\" data-s=\"1\">Es ändert, wie der Code läuft.<\/span> <span class=\"sg\" data-s=\"2\">Du hast schon eines gesehen: <code>gather<\/code>, das alles sammelt, was ein Block an <code>take<\/code> gibt.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt noch ein paar weitere Präfixe für den allgemeinen Gebrauch.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Mit Präfixen kannst du verschiedene Dinge tun.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst einen Block in einen Ausdruck verwandeln, der einen Wert liefert (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Du kannst entscheiden, wann eine Liste berechnet wird: sofort oder bei Bedarf (<code>eager<\/code> und <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Und du kannst Code nur für seine Seiteneffekte ausführen (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Oder du kannst ihn mit ausgeschalteten Warnungen ausführen (<code>quietly<\/code>).<\/span><\/p>"]]},"nl":{"t":"Statement-prefixen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>statement prefix<\/em> is een sleutelwoord dat je voor een statement of blok zet.<\/span> <span class=\"sg\" data-s=\"1\">Het verandert de manier waarop de code draait.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt er al een gezien: <code>gather<\/code>, dat alles verzamelt wat een blok aan <code>take<\/code> geeft.<\/span> <span class=\"sg\" data-s=\"3\">Dit gedeelte laat nog een paar prefixen voor algemeen gebruik zien.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Met prefixen kun je verschillende dingen doen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt een blok veranderen in een expressie die een waarde geeft (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Je kunt bepalen wanneer een lijst berekend wordt: meteen of pas als het nodig is (<code>eager<\/code> en <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">En je kunt code alleen voor zijn neveneffecten draaien (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Of je kunt code draaien met de waarschuwingen uitgezet (<code>quietly<\/code>).<\/span><\/p>"]]},"es":{"t":"Prefijos de sentencia","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefijo de sentencia<\/em> es una palabra clave que pones delante de una sentencia o bloque.<\/span> <span class=\"sg\" data-s=\"1\">Cambia la forma en que se ejecuta el código.<\/span> <span class=\"sg\" data-s=\"2\">Ya has visto uno: <code>gather<\/code>, que recoge todo lo que un bloque da a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra algunos prefijos más para uso general.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Con los prefijos puedes hacer varias cosas.<\/span> <span class=\"sg\" data-s=\"1\">Puedes convertir un bloque en una expresión que da un valor (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Puedes decidir cuándo se calcula una lista: enseguida o cuando se pide (<code>eager<\/code> y <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Y puedes ejecutar código solo por sus efectos secundarios (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">O puedes ejecutarlo con sus advertencias apagadas (<code>quietly<\/code>).<\/span><\/p>"]]},"it":{"t":"Prefissi di istruzione","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>prefisso di istruzione<\/em> è una parola chiave che mettete prima di un'istruzione o di un blocco.<\/span> <span class=\"sg\" data-s=\"1\">Cambia il modo in cui il codice viene eseguito.<\/span> <span class=\"sg\" data-s=\"2\">Ne avete già visto uno: <code>gather<\/code>, che raccoglie tutto quello che un blocco dà a <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra alcuni altri prefissi di uso generale.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Con i prefissi potete fare diverse cose.<\/span> <span class=\"sg\" data-s=\"1\">Potete trasformare un blocco in un'espressione che dà un valore (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Potete decidere quando una lista viene calcolata: subito o su richiesta (<code>eager<\/code> e <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">E potete eseguire codice solo per i suoi effetti collaterali (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Oppure potete eseguirlo con gli avvisi spenti (<code>quietly<\/code>).<\/span><\/p>"]]},"lv":{"t":"Priekšrakstu prefiksi 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Teikuma prefikss<\/em> ir atslēgvārds, ko jūs liekat pirms teikuma vai bloka.<\/span> <span class=\"sg\" data-s=\"1\">Tas maina to, kā kods izpildās.<\/span> <span class=\"sg\" data-s=\"2\">Vienu tādu jūs jau esat redzējuši: <code>gather<\/code>, kas savāc visu, ko bloks dod <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda vēl dažus prefiksus vispārīgai lietošanai.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ar prefiksiem jūs varat darīt vairākas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat pārvērst bloku par izteiksmi, kas dod vērtību (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat izlemt, kad saraksts tiek aprēķināts: uzreiz vai pēc pieprasījuma (<code>eager<\/code> un <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Un jūs varat izpildīt kodu tikai tā blakusefektu dēļ (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Vai arī jūs varat to izpildīt ar izslēgtiem brīdinājumiem (<code>quietly<\/code>).<\/span><\/p>"]]},"ru":{"t":"Префиксы инструкций","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Префикс оператора<\/em> — это ключевое слово, которое вы ставите перед оператором или блоком.<\/span> <span class=\"sg\" data-s=\"1\">Он меняет то, как выполняется код.<\/span> <span class=\"sg\" data-s=\"2\">Один такой префикс вы уже видели: <code>gather<\/code>, который собирает всё, что блок передаёт в <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе показано ещё несколько префиксов общего назначения.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">С помощью префиксов можно делать разные вещи.<\/span> <span class=\"sg\" data-s=\"1\">Можно превратить блок в выражение, которое даёт значение (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Можно решить, когда вычисляется список: сразу или по запросу (<code>eager<\/code> и <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">А ещё можно выполнять код только ради побочных эффектов (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Или можно выполнить его с выключенными предупреждениями (<code>quietly<\/code>).<\/span><\/p>"]]},"uk":{"t":"Префікси операторів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Префікс оператора<\/em> — це ключове слово, яке ви ставите перед оператором або блоком.<\/span> <span class=\"sg\" data-s=\"1\">Він змінює те, як виконується код.<\/span> <span class=\"sg\" data-s=\"2\">Один такий префікс ви вже бачили: <code>gather<\/code>, який збирає все, що блок передає до <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує ще кілька префіксів загального призначення.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За допомогою префіксів можна робити різні речі.<\/span> <span class=\"sg\" data-s=\"1\">Можна перетворити блок на вираз, що дає значення (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Можна вирішувати, коли обчислюється список: одразу чи на вимогу (<code>eager<\/code> і <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Також можна виконувати код лише заради його побічних ефектів (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Або можна виконувати його з вимкненими попередженнями (<code>quietly<\/code>).<\/span><\/p>"]]},"bg":{"t":"Префикси на инструкции 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Един <em>префикс на оператор<\/em> е ключова дума, която слагате пред оператор или блок.<\/span> <span class=\"sg\" data-s=\"1\">Тя променя начина, по който се изпълнява кодът.<\/span> <span class=\"sg\" data-s=\"2\">Вече сте виждали един такъв префикс: <code>gather<\/code>, който събира всичко, което блокът дава на <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел показва още няколко префикса за обща употреба.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">С префиксите можете да правите няколко неща.<\/span> <span class=\"sg\" data-s=\"1\">Можете да превърнете блок в израз, който дава стойност (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Можете да решите кога се изчислява списък: веднага или при поискване (<code>eager<\/code> и <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Можете и да изпълните код само заради страничните му ефекти (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Или можете да го изпълните с изключени предупреждения (<code>quietly<\/code>).<\/span><\/p>"]]},"eo":{"t":"Deklaraj prefiksoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Deklara prefikso<\/em> estas ŝlosilvorto, kiun vi metas antaŭ deklaro aŭ bloko.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ŝanĝas la manieron, kiel la kodo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam vidis unu: <code>gather<\/code>, kiu kolektas ĉion, kion bloko donas al <code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras kelkajn pliajn prefiksojn por ĝenerala uzo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Per prefiksoj vi povas fari plurajn aferojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas transformi blokon en esprimon, kiu donas valoron (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Vi povas decidi, kiam listo estas komputata: tuj aŭ laŭbezone (<code>eager<\/code> kaj <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Kaj vi povas ruli kodon nur pro ĝiaj flankefektoj (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Aŭ vi povas ruli ĝin kun malŝaltitaj avertoj (<code>quietly<\/code>).<\/span><\/p>"]]},"la":{"t":"Praefixae sententiae","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In Raku, <em>praefixum sententiae<\/em> est verbum clavium quod ante sententiam vel copiam ponis.<\/span> <span class=\"sg\" data-s=\"1\">Modum mutat quo codex currit.<\/span> <span class=\"sg\" data-s=\"2\">Unum iam vidisti: <code>gather<\/code>, quod omnia colligit quae copia ad <code>take<\/code> dat.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio pauca alia praefixa ad usum generalem ostendit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum praefixis plures res facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Copiam in expressionem convertere potes quae valorem dat (<code>do<\/code>).<\/span> <span class=\"sg\" data-s=\"2\">Decernere potes quando index computetur: statim aut cum opus est (<code>eager<\/code> et <code>lazy<\/code>).<\/span> <span class=\"sg\" data-s=\"3\">Et codicem solum propter effectus laterales currere potes (<code>sink<\/code>).<\/span> <span class=\"sg\" data-s=\"4\">Aut eum cum admonitionibus exstinctis currere potes (<code>quietly<\/code>).<\/span><\/p>"]]}}}</script>
