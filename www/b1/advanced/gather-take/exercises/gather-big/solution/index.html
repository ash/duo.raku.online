<script type="application/json" id="page-data">{"u":"advanced/gather-take/exercises/gather-big/solution","n":614,"k":"solution","pv":"advanced/gather-take/exercises/gather-big","nx":"advanced/gather-take/quiz","tr":["advanced","advanced/gather-take"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Gather until full‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop gets a range of a hundred numbers, much more than it will use. That is fine, because the loop stops by itself. As soon as <code>$sum<\/code> goes over <code>10<\/code>, <code>last<\/code> leaves the loop. The rest of the numbers are never looked at.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The order inside the block matters. We add to <code>$sum<\/code> first and check the limit before we take the number. So the number that pushes the total over <code>10<\/code> (here, <code>5<\/code>) is not collected. The total reaches exactly <code>10<\/code> after <code>4<\/code>, so the list is <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">With <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> can leave early, but <code>grep<\/code> cannot. <code>grep<\/code> always goes through the whole list, while here we choose when to stop.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Sammeln bis voll","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Schleife bekommt einen Bereich mit hundert Zahlen, viel mehr, als sie braucht. Das ist in Ordnung, weil die Schleife von selbst stoppt. Sobald <code>$sum<\/code> über <code>10<\/code> geht, verlässt <code>last<\/code> die Schleife. Die restlichen Zahlen werden nie angesehen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Reihenfolge im Block ist wichtig. Wir addieren zuerst zu <code>$sum<\/code> und prüfen das Limit, bevor wir die Zahl nehmen. Deshalb wird die Zahl, die die Summe über <code>10<\/code> bringt (hier <code>5<\/code>), nicht gesammelt. Die Summe erreicht nach <code>4<\/code> genau <code>10<\/code>, also ist die Liste <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mit <code>for<\/code> kann <code>gather<\/code>/<code>take<\/code> früh aufhören, aber <code>grep<\/code> kann das nicht. <code>grep<\/code> geht immer die ganze Liste durch, während wir hier selbst entscheiden, wann wir aufhören.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Verzamelen tot vol","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lus krijgt een bereik van honderd getallen, veel meer dan hij zal gebruiken. Dat is geen probleem, want de lus stopt vanzelf. Zodra <code>$sum<\/code> boven <code>10<\/code> komt, verlaat <code>last<\/code> de lus. Naar de rest van de getallen wordt nooit gekeken.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De volgorde binnen het blok is belangrijk. We tellen eerst op bij <code>$sum<\/code> en controleren de grens voordat we het getal nemen. Het getal dat het totaal boven <code>10<\/code> brengt (hier <code>5<\/code>), wordt dus niet verzameld. Het totaal is precies <code>10<\/code> na <code>4<\/code>, dus de lijst is <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Met <code>for<\/code> kan <code>gather<\/code>/<code>take<\/code> vroeg stoppen, maar <code>grep<\/code> kan dat niet. <code>grep<\/code> gaat altijd door de hele lijst, terwijl wij hier kiezen wanneer we stoppen.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Recolectar hasta llen data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il ciclo riceve un intervallo di cento numeri, molti più di quelli che userà. Va bene, perché il ciclo si ferma da solo. Appena <code>$sum<\/code> supera <code>10<\/code>, <code>last<\/code> esce dal ciclo. Il resto dei numeri non viene mai guardato.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'ordine dentro il blocco conta. Prima aggiungiamo a <code>$sum<\/code> e controlliamo il limite prima di prendere il numero. Così il numero che porta il totale oltre <code>10<\/code> (qui, <code>5<\/code>) non viene raccolto. Il totale arriva esattamente a <code>10<\/code> dopo <code>4<\/code>, quindi la lista è <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Con <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> può uscire in anticipo, ma <code>grep<\/code> non può farlo. <code>grep<\/code> scorre sempre tutta la lista, mentre qui scegliamo noi quando fermarci.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Vākt līdz pilnam","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cikls saņem simts skaitļu diapazonu, daudz vairāk, nekā tas izmantos. Tas ir labi, jo cikls apstājas pats. Tiklīdz <code>$sum<\/code> pārsniedz <code>10<\/code>, <code>last<\/code> iziet no cikla. Pārējie skaitļi netiek pat apskatīti.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Secībai bloka iekšienē ir nozīme. Mēs vispirms pieskaitām mainīgajam <code>$sum<\/code> un pārbaudām robežu, pirms paņemam skaitli. Tāpēc skaitlis, kas padara summu lielāku par <code>10<\/code> (šeit tas ir <code>5<\/code>), netiek savākts. Summa sasniedz tieši <code>10<\/code> pēc <code>4<\/code>, tāpēc saraksts ir <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ar <code>for<\/code> palīdzību <code>gather<\/code>/<code>take<\/code> var iziet agrāk, bet <code>grep<\/code> to nevar. <code>grep<\/code> vienmēr iet cauri visam sarakstam, bet šeit mēs izvēlamies, kad apstāties.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Собирать до заполнения","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл получает диапазон из ста чисел, гораздо больше, чем он использует. Это нормально, потому что цикл останавливается сам. Как только <code>$sum<\/code> становится больше <code>10<\/code>, <code>last<\/code> выходит из цикла. Остальные числа так и не проверяются.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок внутри блока важен. Сначала мы прибавляем к <code>$sum<\/code> и проверяем предел, а уже потом берём число. Поэтому число, из-за которого сумма становится больше <code>10<\/code> (здесь это <code>5<\/code>), не попадает в список. Сумма доходит ровно до <code>10<\/code> после <code>4<\/code>, поэтому список — <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">С <code>for<\/code> пара <code>gather<\/code>/<code>take<\/code> может выйти раньше времени, а <code>grep<\/code> — нет. <code>grep<\/code> всегда проходит весь список, а здесь мы сами решаем, когда остановиться.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Збирайте, поки не заповниться","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл отримує діапазон зі ста чисел, набагато більше, ніж він використає. Це нормально, бо цикл зупиняється сам. Щойно <code>$sum<\/code> стає більшою за <code>10<\/code>, <code>last<\/code> виходить з циклу. Решту чисел програма так і не переглядає.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок усередині блоку має значення. Ми спершу додаємо до <code>$sum<\/code> і перевіряємо межу, а вже потім беремо число. Тож число, яке робить суму більшою за <code>10<\/code> (тут це <code>5<\/code>), не збирається. Сума досягає рівно <code>10<\/code> після <code>4<\/code>, тож список — це <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">З <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> може вийти раніше, а <code>grep<\/code> — ні. <code>grep<\/code> завжди проходить весь список, а тут ми самі вибираємо, коли зупинитися.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Gather до запълване","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикълът получава диапазон от сто числа, много повече, отколкото ще използва. Това е наред, защото цикълът спира сам. Веднага щом <code>$sum<\/code> надвиши <code>10<\/code>, <code>last<\/code> излиза от цикъла. Останалите числа никога не се разглеждат.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът вътре в блока има значение. Първо добавяме към <code>$sum<\/code> и проверяваме лимита, преди да вземем числото. Така числото, което прехвърля сумата над <code>10<\/code> (тук <code>5<\/code>), не се събира. Сумата става точно <code>10<\/code> след <code>4<\/code>, затова списъкът е <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">С <code>for<\/code> двойката <code>gather<\/code>/<code>take<\/code> може да излезе рано, а <code>grep<\/code> не може. <code>grep<\/code> винаги минава през целия списък, а тук ние избираме кога да спрем.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Kolekti ĝis plena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La buklo ricevas intervalon de cent nombroj, multe pli ol ĝi uzos. Tio estas en ordo, ĉar la buklo haltas per si mem. Tuj kiam <code>$sum<\/code> superas <code>10<\/code>, <code>last<\/code> forlasas la buklon. La ceteraj nombroj neniam estas rigardataj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo ene de la bloko gravas. Ni unue aldonas al <code>$sum<\/code> kaj kontrolas la limon, antaŭ ol preni la nombron. Do la nombro, kiu puŝas la sumon super <code>10<\/code> (ĉi tie, <code>5<\/code>), ne estas kolektata. La sumo atingas ĝuste <code>10<\/code> post <code>4<\/code>, do la listo estas <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kun <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> povas eliri frue, sed <code>grep<\/code> ne povas. <code>grep<\/code> ĉiam trairas la tutan liston, dum ĉi tie ni elektas, kiam halti.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Colligere usque ad plenum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $sum = 0;\nmy @result = gather for 1..100 {\n    $sum += $_;\n    last if $sum &gt; 10;\n    take $_;\n}\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/gather-big.raku\" target=\"_blank\" rel=\"noopener\">gather-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[1 2 3 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansa seriem centum numerorum accipit, multo plures quam adhibebit. Hoc bene est, quia ansa per se desinit. Simulac <code>$sum<\/code> <code>10<\/code> superat, <code>last<\/code> ansam relinquit. Ceteri numeri numquam spectantur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo intra copiam refert. Primum ad <code>$sum<\/code> addimus et limitem probamus antequam numerum capimus. Itaque numerus qui summam supra <code>10<\/code> pellit (hic, <code>5<\/code>) non colligitur. Summa exacte <code>10<\/code> post <code>4<\/code> attingit, itaque index est <code>1, 2, 3, 4<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cum <code>for<\/code>, <code>gather<\/code>/<code>take<\/code> mature exire potest, sed <code>grep<\/code> non potest. <code>grep<\/code> semper per totum indicem it, dum hic nos eligimus quando desinamus.<\/span><\/li><\/ol>"]]}}}</script>
