<script type="application/json" id="page-data">{"u":"advanced/gather-take/exercises/collect-the-evens/solution","n":610,"k":"solution","pv":"advanced/gather-take/exercises/collect-the-evens","nx":"advanced/gather-take/exercises/squares","tr":["advanced","advanced/gather-take"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Repeat each number‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nothing says that there must be only one <code>take<\/code> on each pass. Here, the inner <code>take $n for 1..$n<\/code> runs <code>take<\/code> a different number of times on each pass. This flexibility is exactly what makes <code>gather<\/code>/<code>take<\/code> more powerful than a simple <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The outer loop uses a named variable, <code>-&gt; $n<\/code>, on purpose. Suppose we used <code>$_<\/code> in the inner loop. Then the inner <code>for<\/code> would set <code>$_<\/code> to its own counter. So we would take the counter instead of the current number.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simply collects every value that was taken, in order. So <code>@result<\/code> holds <code>1<\/code>, then two <code>2<\/code>s, then three <code>3<\/code>s, then four <code>4<\/code>s.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Jede Zahl wiederholen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nichts sagt, dass es bei jedem Durchlauf nur ein <code>take<\/code> geben muss. Hier ruft das innere <code>take $n for 1..$n<\/code> bei jedem Durchlauf <code>take<\/code> verschieden oft auf. Genau diese Flexibilität macht <code>gather<\/code>/<code>take<\/code> stärker als ein einfaches <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die äußere Schleife verwendet mit Absicht eine benannte Variable, <code>-&gt; $n<\/code>. Angenommen, wir würden in der inneren Schleife <code>$_<\/code> verwenden. Dann würde das innere <code>for<\/code> die Variable <code>$_<\/code> auf seinen eigenen Zähler setzen. Also würden wir den Zähler statt der aktuellen Zahl nehmen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> sammelt einfach jeden Wert, der genommen wurde, der Reihe nach. Also enthält <code>@result<\/code> eine <code>1<\/code>, dann zwei <code>2<\/code>en, dann drei <code>3<\/code>en, dann vier <code>4<\/code>en.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Elk getal herhalen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nergens staat dat er maar één <code>take<\/code> per ronde mag zijn. Hier voert de binnenste <code>take $n for 1..$n<\/code> de <code>take<\/code> in elke ronde een ander aantal keren uit. Juist deze flexibiliteit maakt <code>gather<\/code>/<code>take<\/code> krachtiger dan een simpele <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De buitenste lus gebruikt met opzet een benoemde variabele, <code>-&gt; $n<\/code>. Stel dat we <code>$_<\/code> in de binnenste lus zouden gebruiken. Dan zou de binnenste <code>for<\/code> zijn eigen teller in <code>$_<\/code> zetten. Zo zouden we de teller nemen in plaats van het huidige getal.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> verzamelt gewoon elke waarde die genomen is, op volgorde. Daarom bevat <code>@result<\/code> eerst <code>1<\/code>, dan twee <code>2<\/code>'s, dan drie <code>3<\/code>'s en dan vier <code>4<\/code>'s.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Repetir cada número","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nada dice que deba haber un solo <code>take<\/code> en cada vuelta. Aquí, el <code>take $n for 1..$n<\/code> interior ejecuta <code>take<\/code> un número diferente de veces en cada vuelta. Esta flexibilidad es justo lo que hace a <code>gather<\/code>/<code>take<\/code> más potente que un simple <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bucle exterior usa a propósito una variable con nombre, <code>-&gt; $n<\/code>. Supón que usamos <code>$_<\/code> en el bucle interior. Entonces el <code>for<\/code> interior pondría su propio contador en <code>$_<\/code>. Así que tomaríamos el contador en lugar del número actual.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simplemente recoge cada valor tomado, en orden. Así que <code>@result<\/code> contiene <code>1<\/code>, luego dos <code>2<\/code>, luego tres <code>3<\/code> y luego cuatro <code>4<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Ripetere ogni numero","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Niente dice che ci deve essere un solo <code>take<\/code> a ogni passaggio. Qui il <code>take $n for 1..$n<\/code> interno esegue <code>take<\/code> un numero diverso di volte a ogni passaggio. Questa flessibilità è proprio ciò che rende <code>gather<\/code>/<code>take<\/code> più potente di un semplice <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il ciclo esterno usa di proposito una variabile con nome, <code>-&gt; $n<\/code>. Supponiamo di usare <code>$_<\/code> nel ciclo interno. Allora il <code>for<\/code> interno metterebbe in <code>$_<\/code> il suo contatore. Così prenderemmo il contatore invece del numero corrente.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> raccoglie semplicemente ogni valore che è stato preso, in ordine. Così <code>@result<\/code> contiene <code>1<\/code>, poi due <code>2<\/code>, poi tre <code>3<\/code>, poi quattro <code>4<\/code>.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Atkārtot katru skaitli","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nekur nav teikts, ka katrā piegājienā jābūt tikai vienam <code>take<\/code>. Šeit iekšējais <code>take $n for 1..$n<\/code> katrā piegājienā izpilda <code>take<\/code> atšķirīgu reižu skaitu. Tieši šī elastība padara <code>gather<\/code>/<code>take<\/code> jaudīgāku par vienkāršu <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ārējais cikls ar nolūku izmanto nosauktu mainīgo, <code>-&gt; $n<\/code>. Pieņemsim, ka mēs iekšējā ciklā izmantotu <code>$_<\/code>. Tad iekšējais <code>for<\/code> ieliktu <code>$_<\/code> savu skaitītāju. Tāpēc mēs paņemtu skaitītāju, nevis pašreizējo skaitli.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> vienkārši savāc katru paņemto vērtību secībā. Tāpēc <code>@result<\/code> satur <code>1<\/code>, tad divus <code>2<\/code>, tad trīs <code>3<\/code>, tad četrus <code>4<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Повторение каждого числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нигде не сказано, что на каждом проходе должен быть только один <code>take<\/code>. Здесь внутренний <code>take $n for 1..$n<\/code> выполняет <code>take<\/code> разное число раз на каждом проходе. Именно эта гибкость делает <code>gather<\/code>/<code>take<\/code> мощнее простого <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Внешний цикл специально использует именованную переменную, <code>-&gt; $n<\/code>. Допустим, мы использовали бы <code>$_<\/code> во внутреннем цикле. Тогда внутренний <code>for<\/code> записал бы в <code>$_<\/code> свой счётчик. И мы брали бы счётчик вместо текущего числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто собирает по порядку все взятые значения. Поэтому <code>@result<\/code> содержит <code>1<\/code>, затем два <code>2<\/code>, затем три <code>3<\/code>, затем четыре <code>4<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Повторіть кожне число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ніщо не каже, що на кожному проході має бути лише один <code>take<\/code>. Тут внутрішній <code>take $n for 1..$n<\/code> виконує <code>take<\/code> різну кількість разів на кожному проході. Саме ця гнучкість робить <code>gather<\/code>/<code>take<\/code> потужнішим за простий <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зовнішній цикл навмисно використовує іменовану змінну, <code>-&gt; $n<\/code>. Припустімо, ми використали б <code>$_<\/code> у внутрішньому циклі. Тоді внутрішній <code>for<\/code> записав би у <code>$_<\/code> свій власний лічильник. Тож ми брали б лічильник замість поточного числа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто збирає по порядку кожне взяте значення. Тож <code>@result<\/code> містить <code>1<\/code>, потім дві <code>2<\/code>, потім три <code>3<\/code>, потім чотири <code>4<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Повторете всяко число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нищо не казва, че трябва да има само едно <code>take<\/code> при всяко преминаване. Тук вътрешното <code>take $n for 1..$n<\/code> изпълнява <code>take<\/code> различен брой пъти при всяко преминаване. Точно тази гъвкавост прави <code>gather<\/code>/<code>take<\/code> по-мощни от обикновен <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Външният цикъл нарочно използва именувана променлива, <code>-&gt; $n<\/code>. Да кажем, че използваме <code>$_<\/code> във вътрешния цикъл. Тогава вътрешният <code>for<\/code> би сложил в <code>$_<\/code> собствения си брояч. Така бихме взели брояча вместо текущото число.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> просто събира всяка взета стойност, по ред. Така <code>@result<\/code> съдържа <code>1<\/code>, после две <code>2<\/code>, после три <code>3<\/code>, после четири <code>4<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ripeti ĉiun nombron","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nenio diras, ke devas esti nur unu <code>take<\/code> ĉe ĉiu paŝo. Ĉi tie la interna <code>take $n for 1..$n<\/code> rulas <code>take<\/code> malsaman nombron da fojoj ĉe ĉiu paŝo. Ĉi tiu fleksebleco estas ĝuste tio, kio faras <code>gather<\/code>/<code>take<\/code> pli potenca ol simpla <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ekstera buklo intence uzas nomitan variablon, <code>-&gt; $n<\/code>. Supozu, ke ni uzus <code>$_<\/code> en la interna buklo. Tiam la interna <code>for<\/code> metus sian propran nombrilon en <code>$_<\/code>. Do ni prenus la nombrilon anstataŭ la aktualan nombron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simple kolektas ĉiun valoron, kiu estis prenita, laŭ ordo. Do <code>@result<\/code> enhavas <code>1<\/code>, poste du <code>2<\/code>-ojn, poste tri <code>3<\/code>-ojn, poste kvar <code>4<\/code>-ojn.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Quemque numerum repetere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather for 1..4 -&gt; $n {\n    take $n for 1..$n;\n};\n\nsay @result;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/gather-take/collect-the-evens.raku\" target=\"_blank\" rel=\"noopener\">collect-the-evens.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>[1 2 2 3 3 3 4 4 4 4]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nulla regula unum tantum <code>take<\/code> in quoque transitu postulat. Hic interius <code>take $n for 1..$n<\/code> in quoque transitu <code>take<\/code> alio numero vicium currit. Haec flexibilitas est exacte quod <code>gather<\/code>/<code>take<\/code> potentius facit quam simplicem <code>map<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ansa exterior variabilem nominatam, <code>-&gt; $n<\/code>, consulto adhibet. Finge nos <code>$_<\/code> in ansa interiore adhibere. Tum interior <code>for<\/code> suum numeratorem in <code>$_<\/code> poneret. Itaque numeratorem loco numeri currentis caperemus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>gather<\/code> simpliciter omnem valorem captum ordine colligit. Itaque <code>@result<\/code> continet <code>1<\/code>, deinde duos <code>2<\/code>, deinde tres <code>3<\/code>, deinde quattuor <code>4<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
