<script type="application/json" id="page-data">{"u":"advanced/gather-take","n":607,"k":"section","pv":"advanced/given-when/exercises/match-by-type/solution","nx":"advanced/gather-take/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"<code>gather<\/code> and <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The pair <code>gather<\/code> and <code>take<\/code> is a flexible way to build a list.<\/span> <span class=\"sg\" data-s=\"1\">You put some code inside a <code>gather<\/code> block.<\/span> <span class=\"sg\" data-s=\"2\">Each time this code calls <code>take<\/code>, the value goes into the list that <code>gather<\/code> returns.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The three <code>take<\/code> calls give three values, and <code>gather<\/code> collects them into a list.<\/span> <span class=\"sg\" data-s=\"1\">This list is stored in <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The pair is really strong when the <code>take<\/code> calls are spread through ordinary code.<\/span> <span class=\"sg\" data-s=\"1\">An example is a loop with a condition.<\/span> <span class=\"sg\" data-s=\"2\">Then the list has only the values that you chose to take:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here the loop goes over the numbers from 1 to 10.<\/span> <span class=\"sg\" data-s=\"1\">But only the even ones are taken.<\/span> <span class=\"sg\" data-s=\"2\">So in the end, <code>@evens<\/code> holds <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The <code>%%<\/code> operator checks whether a number divides evenly.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This division of work is what makes <code>gather<\/code>/<code>take<\/code> so useful.<\/span> <span class=\"sg\" data-s=\"1\">The code around it decides <em>when<\/em> to produce a value.<\/span> <span class=\"sg\" data-s=\"2\">And <code>gather<\/code> quietly collects whatever is taken.<\/span><\/p>"]]},"de":{"t":"<code>gather<\/code> und <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Paar <code>gather<\/code> und <code>take<\/code> ist ein flexibler Weg, eine Liste zu bauen.<\/span> <span class=\"sg\" data-s=\"1\">Du setzt etwas Code in einen <code>gather<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"2\">Jedes Mal, wenn dieser Code <code>take<\/code> aufruft, kommt der Wert in die Liste, die <code>gather<\/code> zurückgibt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die drei <code>take<\/code>-Aufrufe liefern drei Werte, und <code>gather<\/code> sammelt sie in einer Liste.<\/span> <span class=\"sg\" data-s=\"1\">Diese Liste wird in <code>@result<\/code> gespeichert.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Paar ist wirklich stark, wenn die <code>take<\/code>-Aufrufe über normalen Code verteilt sind.<\/span> <span class=\"sg\" data-s=\"1\">Ein Beispiel ist eine Schleife mit einer Bedingung.<\/span> <span class=\"sg\" data-s=\"2\">Dann enthält die Liste nur die Werte, die du nehmen wolltest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier geht die Schleife über die Zahlen von 1 bis 10.<\/span> <span class=\"sg\" data-s=\"1\">Aber nur die geraden werden genommen.<\/span> <span class=\"sg\" data-s=\"2\">Am Ende enthält <code>@evens<\/code> also <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Der Operator <code>%%<\/code> prüft, ob eine Zahl glatt teilbar ist.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Arbeitsteilung macht <code>gather<\/code>/<code>take<\/code> so nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Der Code drumherum entscheidet, <em>wann<\/em> ein Wert erzeugt wird.<\/span> <span class=\"sg\" data-s=\"2\">Und <code>gather<\/code> sammelt still alles, was genommen wird.<\/span><\/p>"]]},"nl":{"t":"<code>gather<\/code> en <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het paar <code>gather<\/code> en <code>take<\/code> is een flexibele manier om een lijst te bouwen.<\/span> <span class=\"sg\" data-s=\"1\">Je zet wat code in een <code>gather<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"2\">Elke keer als deze code <code>take<\/code> aanroept, gaat de waarde naar de lijst die <code>gather<\/code> teruggeeft.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De drie <code>take<\/code>-aanroepen geven drie waarden, en <code>gather<\/code> verzamelt ze in een lijst.<\/span> <span class=\"sg\" data-s=\"1\">Deze lijst wordt in <code>@result<\/code> opgeslagen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het paar is echt sterk als de <code>take<\/code>-aanroepen verspreid zijn over gewone code.<\/span> <span class=\"sg\" data-s=\"1\">Een voorbeeld is een lus met een voorwaarde.<\/span> <span class=\"sg\" data-s=\"2\">Dan heeft de lijst alleen de waarden die je hebt gekozen om te nemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier gaat de lus over de getallen van 1 tot 10.<\/span> <span class=\"sg\" data-s=\"1\">Maar alleen de even getallen worden genomen.<\/span> <span class=\"sg\" data-s=\"2\">Aan het einde bevat <code>@evens<\/code> dus <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De <code>%%<\/code>-operator kijkt of een getal deelbaar is zonder rest.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze verdeling van het werk maakt <code>gather<\/code>/<code>take<\/code> zo handig.<\/span> <span class=\"sg\" data-s=\"1\">De code eromheen bepaalt <em>wanneer<\/em> er een waarde gemaakt wordt.<\/span> <span class=\"sg\" data-s=\"2\">En <code>gather<\/code> verzamelt stilletjes alles wat genomen wordt.<\/span><\/p>"]]},"es":{"t":"<code>gather<\/code> y <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El par <code>gather<\/code> y <code>take<\/code> es una forma flexible de construir una lista.<\/span> <span class=\"sg\" data-s=\"1\">Pones algo de código dentro de un bloque <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cada vez que este código llama a <code>take<\/code>, el valor entra en la lista que devuelve <code>gather<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las tres llamadas a <code>take<\/code> dan tres valores, y <code>gather<\/code> los recoge en una lista.<\/span> <span class=\"sg\" data-s=\"1\">Esta lista se guarda en <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El par es muy potente cuando las llamadas a <code>take<\/code> están repartidas por código normal.<\/span> <span class=\"sg\" data-s=\"1\">Un ejemplo es un bucle con una condición.<\/span> <span class=\"sg\" data-s=\"2\">Entonces la lista tiene solo los valores que elegiste tomar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí el bucle recorre los números del 1 al 10.<\/span> <span class=\"sg\" data-s=\"1\">Pero solo se toman los pares.<\/span> <span class=\"sg\" data-s=\"2\">Así que al final, <code>@evens<\/code> contiene <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El operador <code>%%<\/code> comprueba si un número se divide de forma exacta.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta división del trabajo es lo que hace tan útil a <code>gather<\/code>/<code>take<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El código de alrededor decide <em>cuándo<\/em> producir un valor.<\/span> <span class=\"sg\" data-s=\"2\">Y <code>gather<\/code> recoge en silencio todo lo que se toma.<\/span><\/p>"]]},"it":{"t":"<code>gather<\/code> e <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La coppia <code>gather<\/code> e <code>take<\/code> è un modo flessibile per costruire una lista.<\/span> <span class=\"sg\" data-s=\"1\">Metti del codice dentro un blocco <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ogni volta che questo codice chiama <code>take<\/code>, il valore va nella lista che <code>gather<\/code> restituisce.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le tre chiamate a <code>take<\/code> danno tre valori, e <code>gather<\/code> li raccoglie in una lista.<\/span> <span class=\"sg\" data-s=\"1\">Questa lista viene salvata in <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La coppia è davvero forte quando le chiamate a <code>take<\/code> sono sparse nel codice normale.<\/span> <span class=\"sg\" data-s=\"1\">Un esempio è un ciclo con una condizione.<\/span> <span class=\"sg\" data-s=\"2\">Allora la lista contiene solo i valori che hai scelto di prendere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui il ciclo scorre i numeri da 1 a 10.<\/span> <span class=\"sg\" data-s=\"1\">Ma vengono presi solo quelli pari.<\/span> <span class=\"sg\" data-s=\"2\">Così alla fine <code>@evens<\/code> contiene <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">L'operatore <code>%%<\/code> controlla se un numero è divisibile in modo esatto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa divisione del lavoro è ciò che rende <code>gather<\/code>/<code>take<\/code> così utile.<\/span> <span class=\"sg\" data-s=\"1\">Il codice intorno decide <em>quando<\/em> produrre un valore.<\/span> <span class=\"sg\" data-s=\"2\">E <code>gather<\/code> raccoglie in silenzio tutto ciò che viene preso.<\/span><\/p>"]]},"lv":{"t":"<code>gather<\/code> un <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Pāris <code>gather<\/code> un <code>take<\/code> ir elastīgs veids, kā uzbūvēt sarakstu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs ieliekat kādu kodu blokā <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Katru reizi, kad šis kods izsauc <code>take<\/code>, vērtība nonāk sarakstā, ko <code>gather<\/code> atgriež.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Trīs <code>take<\/code> izsaukumi dod trīs vērtības, un <code>gather<\/code> tās savāc sarakstā.<\/span> <span class=\"sg\" data-s=\"1\">Šis saraksts tiek saglabāts mainīgajā <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pāris ir patiešām spēcīgs, kad <code>take<\/code> izsaukumi ir izkaisīti pa parastu kodu.<\/span> <span class=\"sg\" data-s=\"1\">Piemērs ir cikls ar nosacījumu.<\/span> <span class=\"sg\" data-s=\"2\">Tad sarakstā ir tikai tās vērtības, ko jūs izvēlējāties paņemt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit cikls iet pāri skaitļiem no 1 līdz 10.<\/span> <span class=\"sg\" data-s=\"1\">Bet tiek paņemti tikai pāra skaitļi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc beigās <code>@evens<\/code> satur <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Operators <code>%%<\/code> pārbauda, vai skaitlis dalās bez atlikuma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tieši šī darba dalīšana padara <code>gather<\/code>/<code>take<\/code> tik noderīgu.<\/span> <span class=\"sg\" data-s=\"1\">Kods ap to izlemj, <em>kad<\/em> radīt vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>gather<\/code> klusi savāc visu, kas ir paņemts.<\/span><\/p>"]]},"ru":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара <code>gather<\/code> и <code>take<\/code> — это гибкий способ построить список.<\/span> <span class=\"sg\" data-s=\"1\">Вы помещаете код внутрь блока <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Каждый раз, когда этот код вызывает <code>take<\/code>, значение попадает в список, который возвращает <code>gather<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Три вызова <code>take<\/code> дают три значения, и <code>gather<\/code> собирает их в список.<\/span> <span class=\"sg\" data-s=\"1\">Этот список хранится в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Эта пара по-настоящему сильна, когда вызовы <code>take<\/code> разбросаны по обычному коду.<\/span> <span class=\"sg\" data-s=\"1\">Пример — цикл с условием.<\/span> <span class=\"sg\" data-s=\"2\">Тогда в списке есть только те значения, которые вы решили взять:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь цикл проходит по числам от 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Но берутся только чётные.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому в итоге <code>@evens<\/code> содержит <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оператор <code>%%<\/code> проверяет, делится ли число нацело.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Именно это разделение работы делает <code>gather<\/code>/<code>take<\/code> таким удобным.<\/span> <span class=\"sg\" data-s=\"1\">Окружающий код решает, <em>когда<\/em> создать значение.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо собирает всё, что было взято.<\/span><\/p>"]]},"uk":{"t":"<code>gather<\/code> та <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пара <code>gather<\/code> і <code>take<\/code> — це гнучкий спосіб побудувати список.<\/span> <span class=\"sg\" data-s=\"1\">Ви кладете якийсь код усередину блоку <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Щоразу, коли цей код викликає <code>take<\/code>, значення потрапляє в список, який повертає <code>gather<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Три виклики <code>take<\/code> дають три значення, а <code>gather<\/code> збирає їх у список.<\/span> <span class=\"sg\" data-s=\"1\">Цей список зберігається в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ця пара справді сильна, коли виклики <code>take<\/code> розкидані по звичайному коду.<\/span> <span class=\"sg\" data-s=\"1\">Приклад — цикл з умовою.<\/span> <span class=\"sg\" data-s=\"2\">Тоді список має лише ті значення, які ви вирішили взяти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут цикл проходить по числах від 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Але беруться лише парні.<\/span> <span class=\"sg\" data-s=\"2\">Тож зрештою <code>@evens<\/code> містить <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Оператор <code>%%<\/code> перевіряє, чи ділиться число націло.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Саме такий поділ роботи робить <code>gather<\/code>/<code>take<\/code> таким корисним.<\/span> <span class=\"sg\" data-s=\"1\">Код навколо вирішує, <em>коли<\/em> видати значення.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо збирає все, що взяли.<\/span><\/p>"]]},"bg":{"t":"<code>gather<\/code> и <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Двойката <code>gather<\/code> и <code>take<\/code> е гъвкав начин да изградите списък.<\/span> <span class=\"sg\" data-s=\"1\">Слагате някакъв код в блок <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Всеки път, когато този код извика <code>take<\/code>, стойността влиза в списъка, който <code>gather<\/code> връща.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Трите извиквания на <code>take<\/code> дават три стойности, а <code>gather<\/code> ги събира в списък.<\/span> <span class=\"sg\" data-s=\"1\">Този списък се пази в <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Двойката е наистина силна, когато извикванията на <code>take<\/code> са разпръснати в обикновен код.<\/span> <span class=\"sg\" data-s=\"1\">Пример за това е цикъл с условие.<\/span> <span class=\"sg\" data-s=\"2\">Тогава списъкът съдържа само стойностите, които сте избрали да вземете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук цикълът минава през числата от 1 до 10.<\/span> <span class=\"sg\" data-s=\"1\">Но се вземат само четните.<\/span> <span class=\"sg\" data-s=\"2\">Така накрая <code>@evens<\/code> съдържа <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Операторът <code>%%<\/code> проверява дали числото се дели без остатък.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това разделение на работата прави <code>gather<\/code>/<code>take<\/code> толкова полезни.<\/span> <span class=\"sg\" data-s=\"1\">Кодът около тях решава <em>кога<\/em> да създаде стойност.<\/span> <span class=\"sg\" data-s=\"2\">А <code>gather<\/code> тихо събира всичко, което е взето.<\/span><\/p>"]]},"eo":{"t":"<code>gather<\/code> kaj <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La paro <code>gather<\/code> kaj <code>take<\/code> estas fleksebla maniero konstrui liston.<\/span> <span class=\"sg\" data-s=\"1\">Vi metas iom da kodo en blokon <code>gather<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiufoje, kiam ĉi tiu kodo vokas <code>take<\/code>, la valoro iras en la liston, kiun <code>gather<\/code> redonas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La tri vokoj de <code>take<\/code> donas tri valorojn, kaj <code>gather<\/code> kolektas ilin en liston.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu listo estas konservata en <code>@result<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La paro estas vere forta, kiam la vokoj de <code>take<\/code> estas disaj tra ordinara kodo.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemplo estas buklo kun kondiĉo.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la listo havas nur la valorojn, kiujn vi elektis preni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie la buklo iras tra la nombroj de 1 ĝis 10.<\/span> <span class=\"sg\" data-s=\"1\">Sed nur la paraj estas prenataj.<\/span> <span class=\"sg\" data-s=\"2\">Do fine <code>@evens<\/code> enhavas <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La operatoro <code>%%<\/code> kontrolas, ĉu nombro dividiĝas senreste.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu divido de la laboro estas tio, kio faras <code>gather<\/code>/<code>take<\/code> tiel utila.<\/span> <span class=\"sg\" data-s=\"1\">La ĉirkaŭa kodo decidas, <em>kiam<\/em> produkti valoron.<\/span> <span class=\"sg\" data-s=\"2\">Kaj <code>gather<\/code> kviete kolektas ĉion, kio estas prenata.<\/span><\/p>"]]},"la":{"t":"<code>gather<\/code> et <code>take<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Par <code>gather<\/code> et <code>take<\/code> est modus flexibilis ad indicem construendum.<\/span> <span class=\"sg\" data-s=\"1\">Codicem intra copiam <code>gather<\/code> ponis.<\/span> <span class=\"sg\" data-s=\"2\">Quotiens hic codex <code>take<\/code> vocat, valor in indicem it quem <code>gather<\/code> reddit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @result = gather {\n    take 1;\n    take 2;\n    take 3;\n};\n\nsay @result; # [1 2 3]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres vocationes <code>take<\/code> tres valores dant, et <code>gather<\/code> eos in indicem colligit.<\/span> <span class=\"sg\" data-s=\"1\">Hic index in <code>@result<\/code> servatur.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Par vere validum est cum vocationes <code>take<\/code> per codicem ordinarium sparsae sunt.<\/span> <span class=\"sg\" data-s=\"1\">Exemplum est ansa cum condicione.<\/span> <span class=\"sg\" data-s=\"2\">Tum index solum valores habet quos capere elegisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @evens = gather for 1..10 {\n    take $_ if $_ %% 2;\n};\n\nsay @evens; # [2 4 6 8 10]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic ansa per numeros ab 1 ad 10 it.<\/span> <span class=\"sg\" data-s=\"1\">Sed soli pares capiuntur.<\/span> <span class=\"sg\" data-s=\"2\">Itaque in fine <code>@evens<\/code> continet <code>2, 4, 6, 8, 10<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Operator <code>%%<\/code> probat num numerus aequaliter dividatur.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec divisio operis est quod <code>gather<\/code>/<code>take<\/code> tam utile facit.<\/span> <span class=\"sg\" data-s=\"1\">Codex circa id decernit <em>quando<\/em> valorem producat.<\/span> <span class=\"sg\" data-s=\"2\">Et <code>gather<\/code> quiete colligit quidquid capitur.<\/span><\/p>"]]}}}</script>
