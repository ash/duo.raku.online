age of 65 and above. None of the listed ranges catches these ages.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You could also turn this around and let <code>default<\/code> catch the <em>invalid<\/em> input instead.<\/span> <span class=\"sg\" data-s=\"1\">List every known stage, including <code>senior<\/code> as the condition <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Treat everything that is left, such as a negative age, as invalid:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, <code>default<\/code> is a real “none of the above” branch.<\/span> <span class=\"sg\" data-s=\"1\">Which version reads better is a matter of taste.<\/span> <span class=\"sg\" data-s=\"2\">Put the check first when the invalid case is an exception.<\/span> <span class=\"sg\" data-s=\"3\">Or make it the <code>default<\/code> when all the valid stages are clearly listed.<\/span><\/p>"]]},"de":{"t":"Solution: Lebensphase nach Alter","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>" nn der ungültige Fall eine Ausnahme ist.<\/span> <span class=\"sg\" data-s=\"3\">Oder mache ihn zum <code>default<\/code>, wenn alle gültigen Lebensphasen klar aufgelistet sind.<\/span><\/p>"]]},"nl":{"t":"Solution: Levensfase op basis van leeftijd","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Deze oplossing mengt twee soorten <code>when<\/code>. De eerste is een <em>voorwaarde<\/em>, <code>$_ &lt; 0<\/code>, waarbij <code>$_<\/code> het topic is dat <code>given<\/code> instelt. Die filtert de ongeldige leeftijden eruit. De andere zijn <em>bereiken<\/em>, die de geldige leeftijden in fasen verdelen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De volgorde is belangrijk. De controle op een negatieve leeftijd komt eerst. Daardoor draait die voordat er een bereik wordt geprobeerd. De waarde <code>30<\/code> valt in <code>20..64<\/code>, dus het programma drukt <code>adult<\/code> af.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok dekt elke leeftijd van 65 en ouder. Geen van de genoemde bereiken vangt deze leeftijden op.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt dit ook omdraaien en <code>default<\/code> juist de <em>ongeldige<\/em> invoer laten opvangen.<\/span> <span class=\"sg\" data-s=\"1\">Noem elke bekende fase, ook <code>senior<\/code> als de voorwaarde <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Behandel alles wat overblijft, zoals een negatieve leeftijd, als ongeldig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is <code>default<\/code> een echte \"geen van de bovenstaande\"-tak.<\/span> <span class=\"sg\" data-s=\"1\">Welke versie beter leest, is een kwestie van smaak.<\/span> <span class=\"sg\" data-s=\"2\">Zet de controle vooraan als het ongeldige geval een uitzondering is.<\/span> <span class=\"sg\" data-s=\"3\">Of maak het de <code>default<\/code> als alle geldige fasen duidelijk genoemd zijn.<\/span><\/p>"]]},"es":{"t":"Solution: Etapa de vida según la edad","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esta solución mezcla dos tipos de <code>when<\/code>. El primero es una <em>condición<\/em>, <code>$_ &lt; 0<\/code>, donde <code>$_<\/code> es el tópico que fija <code>given<\/code>. Filtra las edades no válidas. Los otros son <em>rangos<\/em>, que agrupan las edades válidas en etapas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El orden importa. La comprobación de la edad negativa va primero. Así que se ejecuta antes de probar cualquier rango. El valor <code>30<\/code> está en <code>20..64<\/code>, así que el programa imprime <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code> cubre todas las edades de 65 en adelante. Ninguno de los rangos de la lista atrapa estas edades.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También podrías hacerlo al revés y dejar que <code>default<\/code> atrape la entrada <em>inválida<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Escribe todas las etapas conocidas, con <code>senior<\/code> como la condición <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Trata como inválido todo lo que quede, como una edad negativa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>default<\/code> es una verdadera rama de «ninguno de los anteriores».<\/span> <span class=\"sg\" data-s=\"1\">Qué versión se lee mejor es cuestión de gusto.<\/span> <span class=\"sg\" data-s=\"2\">Pon la comprobación primero cuando el caso inválido sea una excepción.<\/span> <span class=\"sg\" data-s=\"3\">O haz que sea el <code>default<\/code> cuando todas las etapas válidas estén claramente en la lista.<\/span><\/p>"]]},"it":{"t":"Solution: Fase della vita dall'età","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Questa soluzione mescola due tipi di <code>when<\/code>. Il primo è una <em>condizione<\/em>, <code>$_ &lt; 0<\/code>, dove <code>$_<\/code> è il topic impostato da <code>given<\/code>. Scarta le età non valide. Gli altri sono <em>intervalli<\/em>, che raggruppano le età valide nelle fasi della vita.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'ordine conta. Il controllo per un'età negativa viene per primo. Quindi viene eseguito prima di provare qualsiasi intervallo. Il valore <code>30<\/code> è in <code>20..64<\/code>, quindi il programma stampa <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code> copre ogni età da 65 in su. Nessuno degli intervalli elencati cattura queste età.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche fare il contrario e lasciare che <code>default<\/code> catturi invece l'input <em>non valido<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elenca ogni fase conosciuta, anche <code>senior<\/code> come condizione <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tratta come non valido tutto quello che resta, per esempio un'età negativa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui <code>default<\/code> è un vero ramo “nessuna delle precedenti”.<\/span> <span class=\"sg\" data-s=\"1\">Quale versione si legge meglio è una questione di gusti.<\/span> <span class=\"sg\" data-s=\"2\">Metti il controllo per primo quando il caso non valido è un'eccezione.<\/span> <span class=\"sg\" data-s=\"3\">Oppure rendilo il <code>default<\/code> quando tutte le fasi valide sono elencate in modo chiaro.<\/span><\/p>"]]},"lv":{"t":"Risinājums: Dzīves posms pēc vecuma","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Jūs varat atrast pirmkodu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šis risinājums apvieno divus <code>when<\/code> veidus. Pirmais ir <em>nosacījums<\/em>, <code>$_ &lt; 0<\/code>, kur <code>$_<\/code> ir tēma, ko nosaka <code>given<\/code>. Tas izfiltrē nederīgos vecumus. Pārējie ir <em>diapazoni<\/em>, kas grupē derīgos vecumus pa posmiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Secībai ir nozīme. Negatīvā vecuma pārbaude ir pirmā. Tāpēc tā izpildās, pirms tiek pārbaudīts kāds diapazons. Vērtība <code>30<\/code> ir diapazonā <code>20..64<\/code>, tāpēc programma izdrukā <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks aptver visus vecumus no 65 un vairāk. Neviens no uzskaitītajiem diapazoniem šos vecumus neaptver.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat to arī apgriezt otrādi un ļaut <code>default<\/code> noķert <em>nederīgo<\/em> ievadi.<\/span> <span class=\"sg\" data-s=\"1\">Uzskaitiet visus zināmos posmus, arī <code>senior<\/code> kā nosacījumu <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Visu, kas paliek pāri, piemēram, negatīvu vecumu, uzskatiet par nederīgu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>default<\/code> ir īsts atzars “nekas no augstāk minētā”.<\/span> <span class=\"sg\" data-s=\"1\">Kura versija lasās labāk, ir gaumes jautājums.<\/span> <span class=\"sg\" data-s=\"2\">Ielieciet pārbaudi pirmo, ja nederīgais gadījums ir izņēmums.<\/span> <span class=\"sg\" data-s=\"3\">Vai arī padariet to par <code>default<\/code>, ja visi derīgie posmi ir skaidri uzskaitīti.<\/span><\/p>"]]},"ru":{"t":"Решение: Жизненный этап по возрасту","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">В этом решении смешаны два вида <code>when<\/code>. Первый — это <em>условие<\/em> <code>$_ &lt; 0<\/code>, где <code>$_<\/code> — топик, который задаёт <code>given<\/code>. Оно отсеивает недопустимые возрасты. Остальные — это <em>диапазоны<\/em>, которые делят допустимые возрасты на этапы.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок имеет значение. Проверка отрицательного возраста идёт первой. Поэтому она выполняется до проверки любого диапазона. Значение <code>30<\/code> входит в <code>20..64<\/code>, поэтому программа печатает <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> покрывает любой возраст от 65 и выше. Ни один из перечисленных диапазонов не ловит эти возрасты.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можно сделать и наоборот: пусть <code>default<\/code> ловит <em>недопустимый<\/em> ввод.<\/span> <span class=\"sg\" data-s=\"1\">Перечислите все известные этапы, включая <code>senior<\/code> в виде условия <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Всё, что осталось, например отрицательный возраст, считайте недопустимым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>default<\/code> — настоящая ветка «ничего из перечисленного».<\/span> <span class=\"sg\" data-s=\"1\">Какой вариант читается лучше — дело вкуса.<\/span> <span class=\"sg\" data-s=\"2\">Ставьте проверку первой, когда недопустимый случай — исключение.<\/span> <span class=\"sg\" data-s=\"3\">Или сделайте его блоком <code>default<\/code>, когда все допустимые этапы ясно перечислены.<\/span><\/p>"]]},"uk":{"t":"Розв'язання: Життєвий етап за віком","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це розв'язання поєднує два види <code>when<\/code>. Перший — це <em>умова<\/em>, <code>$_ &lt; 0<\/code>, де <code>$_<\/code> — топік, який задає <code>given<\/code>. Вона відсіює недійсний вік. Решта — це <em>діапазони<\/em>, які групують дійсний вік за етапами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порядок має значення. Перевірка на від'ємний вік іде першою. Тож вона виконується раніше, ніж програма пробує будь-який діапазон. Значення <code>30<\/code> входить у <code>20..64<\/code>, тож програма виводить <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> охоплює будь-який вік від 65 і вище. Жоден із перелічених діапазонів не ловить такий вік.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можна також зробити навпаки й дозволити <code>default<\/code> ловити <em>недійсний<\/em> ввід.<\/span> <span class=\"sg\" data-s=\"1\">Перелічіть кожен відомий етап, разом із <code>senior<\/code> як умовою <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Усе, що залишилося, наприклад від'ємний вік, вважайте недійсним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут <code>default<\/code> — справжня гілка «жодне з переліченого».<\/span> <span class=\"sg\" data-s=\"1\">Який варіант читається краще — справа смаку.<\/span> <span class=\"sg\" data-s=\"2\">Ставте перевірку першою, коли недійсний випадок — виняток.<\/span> <span class=\"sg\" data-s=\"3\">Або зробіть цей випадок блоком <code>default<\/code>, коли всі дійсні етапи чітко перелічено.<\/span><\/p>"]]},"bg":{"t":"Solution: Етап от живота по възраст","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това решение смесва два вида <code>when<\/code>. Първият е <em>условие<\/em>, <code>$_ &lt; 0<\/code>, където <code>$_<\/code> е темата, зададена от <code>given<\/code>. То отсява невалидните възрасти. Останалите са <em>диапазони<\/em>, които групират валидните възрасти в етапи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът има значение. Проверката за отрицателна възраст е първа. Затова тя се изпълнява, преди да се опита който и да е диапазон. Стойността <code>30<\/code> е в <code>20..64<\/code>, затова програмата отпечатва <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> покрива всяка възраст от 65 и нагоре. Нито един от изброените диапазони не хваща тези възрасти.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете и да обърнете нещата и да оставите <code>default<\/code> да хваща <em>невалидния<\/em> вход.<\/span> <span class=\"sg\" data-s=\"1\">Изброете всеки познат етап, включително <code>senior<\/code> като условието <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Смятайте за невалидно всичко, което остава, например отрицателна възраст:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук <code>default<\/code> е истински клон „нищо от горното“.<\/span> <span class=\"sg\" data-s=\"1\">Кой вариант се чете по-добре е въпрос на вкус.<\/span> <span class=\"sg\" data-s=\"2\">Сложете проверката първа, когато невалидният случай е изключение.<\/span> <span class=\"sg\" data-s=\"3\">Или го направете <code>default<\/code>, когато всички валидни етапи са ясно изброени.<\/span><\/p>"]]},"eo":{"t":"Solvo: Vivperiodo laŭ aĝo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tiu solvo miksas du specojn de <code>when<\/code>. La unua estas <em>kondiĉo<\/em>, <code>$_ &lt; 0<\/code>, kie <code>$_<\/code> estas la temo, kiun <code>given<\/code> starigas. Ĝi forfiltras la nevalidajn aĝojn. La ceteraj estas <em>intervaloj<\/em>, kiuj grupigas la validajn aĝojn en periodojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo gravas. La kontrolo de negativa aĝo venas unue. Do ĝi ruliĝas, antaŭ ol iu intervalo estas provata. La valoro <code>30<\/code> estas en <code>20..64<\/code>, do la programo presas <code>adult<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code> kovras ĉiun aĝon de 65 kaj pli. Neniu el la listigitaj intervaloj kaptas ĉi tiujn aĝojn.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povus ankaŭ inversigi tion kaj lasi <code>default<\/code> kapti la <em>nevalidan<\/em> enigon anstataŭe.<\/span> <span class=\"sg\" data-s=\"1\">Listigu ĉiun konatan periodon, inkluzive de <code>senior<\/code> kiel la kondiĉon <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Traktu ĉion, kio restas, ekzemple negativan aĝon, kiel nevalidan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>default<\/code> estas vera branĉo «neniu el la supraj».<\/span> <span class=\"sg\" data-s=\"1\">Kiu versio legiĝas pli bone, estas afero de gusto.<\/span> <span class=\"sg\" data-s=\"2\">Metu la kontrolon unue, kiam la nevalida kazo estas escepto.<\/span> <span class=\"sg\" data-s=\"3\">Aŭ faru ĝin la <code>default<\/code>, kiam ĉiuj validaj periodoj estas klare listigitaj.<\/span><\/p>"]]},"la":{"t":"Solutio: Stadium vitae ex aetate","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $age = 30;\n\ngiven $age {\n    when $_ &lt; 0 { say 'invalid' }\n    when 0..12  { say 'child' }\n    when 13..19 { say 'teenager' }\n    when 20..64 { say 'adult' }\n    default     { say 'senior' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/given-when/grade-the-score.raku\" target=\"_blank\" rel=\"noopener\">grade-the-score.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>adult<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec solutio duo genera <code>when<\/code> miscet. Primum est <em>condicio<\/em>, <code>$_ &lt; 0<\/code>, ubi <code>$_<\/code> est topicum a <code>given<\/code> positum. Aetates invalidas removet. Cetera sunt <em>intervalla<\/em>, quae aetates validas in stadia dividunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo refert. Probatio aetatis negativae prima venit. Itaque currit antequam ullum intervallum probatur. Valor <code>30<\/code> in <code>20..64<\/code> est, itaque programma <code>adult<\/code> imprimit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code> omnem aetatem 65 et supra tegit. Nullum ex intervallis enumeratis has aetates capit.<\/span><\/li><\/ol>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc etiam invertere potes et sinere <code>default<\/code> potius inputum <em>invalidum<\/em> capere.<\/span> <span class=\"sg\" data-s=\"1\">Enumera omne stadium notum, etiam <code>senior<\/code> ut condicionem <code>$_ &gt;= 65<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tracta ut invalidum quidquid restat, sicut aetatem negativam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>given $age {\n    when 0..12    { say 'child' }\n    when 13..19   { say 'teenager' }\n    when 20..64   { say 'adult' }\n    when $_ &gt;= 65 { say 'senior' }\n    default       { say 'invalid' }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic <code>default<\/code> verus ramus “nihil ex supra dictis” est.<\/span> <span class=\"sg\" data-s=\"1\">Quae versio melius legitur, res gustus est.<\/span> <span class=\"sg\" data-s=\"2\">Pone probationem primam cum casus invalidus exceptio est.<\/span> <span class=\"sg\" data-s=\"3\">Aut fac eum <code>default<\/code> cum omnia stadia valida clare enumerata sunt.<\/span><\/p>"]]}}}</script>
