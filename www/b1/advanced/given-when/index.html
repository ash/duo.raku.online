<script type="application/json" id="page-data">{"u":"advanced/given-when","n":597,"k":"section","pv":"advanced/block-phasers/quiz","nx":"advanced/given-when/matching","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"<code>given<\/code> and <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sometimes a program needs to choose between several options.<\/span> <span class=\"sg\" data-s=\"1\">A chain of <code>if<\/code> and <code>elsif<\/code> checks can then get long and full of repetition.<\/span> <span class=\"sg\" data-s=\"2\">In such cases, <code>given<\/code>/<code>when<\/code> is often clearer.<\/span> <span class=\"sg\" data-s=\"3\">It is similar to the <code>switch<\/code> statement in other languages.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>given<\/code> block takes a value and makes it the <em>topic<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The topic is the special variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Then each <code>when<\/code> block is compared with this topic.<\/span> <span class=\"sg\" data-s=\"3\">The first one that matches runs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unlike <code>switch<\/code> in some languages, there is no fall-through to the next case.<\/span> <span class=\"sg\" data-s=\"1\">As soon as a <code>when<\/code> matches, its block runs, and the <code>given<\/code> block is finished.<\/span> <span class=\"sg\" data-s=\"2\">The other <code>when<\/code> blocks are not tested.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>default<\/code> block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>default<\/code> block runs when none of the <code>when<\/code> blocks matched.<\/span> <span class=\"sg\" data-s=\"1\">It does the same job as the <code>else<\/code> branch of an <code>if<\/code> statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> is neither <code>1<\/code> nor <code>2<\/code>, so the program prints:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"de":{"t":"<code>given<\/code> und <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Manchmal muss ein Programm zwischen mehreren Möglichkeiten wählen.<\/span> <span class=\"sg\" data-s=\"1\">Eine Kette von <code>if<\/code>- und <code>elsif<\/code>-Prüfungen kann dann lang werden und sich oft wiederholen.<\/span> <span class=\"sg\" data-s=\"2\">In solchen Fällen ist <code>given<\/code>/<code>when<\/code> oft klarer.<\/span> <span class=\"sg\" data-s=\"3\">Es ähnelt der <code>switch<\/code>-Anweisung in anderen Sprachen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der <code>given<\/code>-Block nimmt einen Wert und macht ihn zum <em>Thema<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das Thema ist die spezielle Variable <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dann wird jeder <code>when<\/code>-Block mit diesem Thema verglichen.<\/span> <span class=\"sg\" data-s=\"3\">Der erste, der passt, läuft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders als bei <code>switch<\/code> in manchen Sprachen gibt es kein Fall-Through zum nächsten Fall.<\/span> <span class=\"sg\" data-s=\"1\">Sobald ein <code>when<\/code> passt, läuft sein Block, und der <code>given<\/code>-Block ist beendet.<\/span> <span class=\"sg\" data-s=\"2\">Die anderen <code>when<\/code>-Blöcke werden nicht geprüft.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Der <code>default<\/code>-Block<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>default<\/code>-Block läuft, wenn keiner der <code>when<\/code>-Blöcke gepasst hat.<\/span> <span class=\"sg\" data-s=\"1\">Er hat dieselbe Aufgabe wie der <code>else<\/code>-Zweig einer <code>if<\/code>-Anweisung:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> ist weder <code>1<\/code> noch <code>2<\/code>, also gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"nl":{"t":"<code>given<\/code> en <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Soms moet een programma kiezen uit meerdere opties.<\/span> <span class=\"sg\" data-s=\"1\">Een rij <code>if<\/code>- en <code>elsif<\/code>-controles kan dan lang worden en vol herhaling zitten.<\/span> <span class=\"sg\" data-s=\"2\">In zulke gevallen is <code>given<\/code>/<code>when<\/code> vaak duidelijker.<\/span> <span class=\"sg\" data-s=\"3\">Het lijkt op het <code>switch<\/code>-statement in andere talen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het <code>given<\/code>-blok neemt een waarde en maakt die het <em>topic<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Het topic is de speciale variabele <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dan wordt elk <code>when<\/code>-blok met dit topic vergeleken.<\/span> <span class=\"sg\" data-s=\"3\">Het eerste blok dat overeenkomt, draait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anders dan bij <code>switch<\/code> in sommige talen is er geen doorval (fall-through) naar het volgende geval.<\/span> <span class=\"sg\" data-s=\"1\">Zodra een <code>when<\/code> overeenkomt, draait zijn blok en is het <code>given<\/code>-blok klaar.<\/span> <span class=\"sg\" data-s=\"2\">De andere <code>when<\/code>-blokken worden niet getest.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>default<\/code>-blok draait als geen van de <code>when<\/code>-blokken overeenkwam.<\/span> <span class=\"sg\" data-s=\"1\">Het doet hetzelfde werk als de <code>else<\/code>-tak van een <code>if<\/code>-statement:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> is geen <code>1<\/code> en geen <code>2<\/code>, dus drukt het programma af:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"es":{"t":"<code>given<\/code> y <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A veces un programa necesita elegir entre varias opciones.<\/span> <span class=\"sg\" data-s=\"1\">Entonces una cadena de comprobaciones <code>if<\/code> y <code>elsif<\/code> puede volverse larga y llena de repeticiones.<\/span> <span class=\"sg\" data-s=\"2\">En esos casos, <code>given<\/code>/<code>when<\/code> suele ser más claro.<\/span> <span class=\"sg\" data-s=\"3\">Se parece a la sentencia <code>switch<\/code> de otros lenguajes.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>given<\/code> toma un valor y lo convierte en el <em>tópico<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El tópico es la variable especial <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Después, cada bloque <code>when<\/code> se compara con este tópico.<\/span> <span class=\"sg\" data-s=\"3\">Se ejecuta el primero que coincida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A diferencia de <code>switch<\/code> en algunos lenguajes, no hay fall-through al siguiente caso.<\/span> <span class=\"sg\" data-s=\"1\">En cuanto un <code>when<\/code> coincide, su bloque se ejecuta y el bloque <code>given<\/code> termina.<\/span> <span class=\"sg\" data-s=\"2\">Los otros bloques <code>when<\/code> no se prueban.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un bloque <code>default<\/code> se ejecuta cuando ninguno de los bloques <code>when<\/code> ha coincidido.<\/span> <span class=\"sg\" data-s=\"1\">Hace el mismo trabajo que la rama <code>else<\/code> de una sentencia <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> no es ni <code>1<\/code> ni <code>2<\/code>, así que el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"it":{"t":"<code>given<\/code> e <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte un programma deve scegliere tra diverse opzioni.<\/span> <span class=\"sg\" data-s=\"1\">Una catena di controlli <code>if<\/code> e <code>elsif<\/code> può allora diventare lunga e piena di ripetizioni.<\/span> <span class=\"sg\" data-s=\"2\">In questi casi, <code>given<\/code>/<code>when<\/code> è spesso più chiaro.<\/span> <span class=\"sg\" data-s=\"3\">È simile all'istruzione <code>switch<\/code> di altri linguaggi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>given<\/code> prende un valore e lo rende il <em>topic<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il topic è la variabile speciale <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi ogni blocco <code>when<\/code> viene confrontato con questo topic.<\/span> <span class=\"sg\" data-s=\"3\">Viene eseguito il primo che corrisponde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A differenza dello <code>switch<\/code> di alcuni linguaggi, non c'è fall-through al caso successivo.<\/span> <span class=\"sg\" data-s=\"1\">Appena un <code>when<\/code> corrisponde, il suo blocco viene eseguito e il blocco <code>given<\/code> è finito.<\/span> <span class=\"sg\" data-s=\"2\">Gli altri blocchi <code>when<\/code> non vengono provati.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un blocco <code>default<\/code> viene eseguito quando nessuno dei blocchi <code>when<\/code> ha trovato corrispondenza.<\/span> <span class=\"sg\" data-s=\"1\">Fa lo stesso lavoro del ramo <code>else<\/code> di un'istruzione <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> non è né <code>1<\/code> né <code>2<\/code>, quindi il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"lv":{"t":"<code>given<\/code> un <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz programmai jāizvēlas starp vairākām iespējām.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>if<\/code> un <code>elsif<\/code> pārbaužu ķēde var kļūt gara un pilna ar atkārtojumiem.<\/span> <span class=\"sg\" data-s=\"2\">Šādos gadījumos <code>given<\/code>/<code>when<\/code> bieži ir skaidrāks.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir līdzīgs <code>switch<\/code> priekšrakstam citās valodās.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>given<\/code> bloks paņem vērtību un padara to par <em>tēmu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tēma ir īpašais mainīgais <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad katrs <code>when<\/code> bloks tiek salīdzināts ar šo tēmu.<\/span> <span class=\"sg\" data-s=\"3\">Pirmais, kas atbilst, tiek izpildīts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Atšķirībā no <code>switch<\/code> dažās valodās, šeit nav \"caurkritšanas\" (fall-through) uz nākamo gadījumu.<\/span> <span class=\"sg\" data-s=\"1\">Tiklīdz <code>when<\/code> atbilst, tā bloks izpildās, un <code>given<\/code> bloks ir pabeigts.<\/span> <span class=\"sg\" data-s=\"2\">Pārējie <code>when<\/code> bloki netiek pārbaudīti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>default<\/code> bloks izpildās, ja neviens no <code>when<\/code> blokiem neatbilda.<\/span> <span class=\"sg\" data-s=\"1\">Tas dara to pašu darbu, ko <code>else<\/code> atzars <code>if<\/code> priekšrakstā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> nav ne <code>1<\/code>, ne <code>2<\/code>, tāpēc programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"ru":{"t":"<code>given<\/code> и <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда программе нужно выбрать один из нескольких вариантов.<\/span> <span class=\"sg\" data-s=\"1\">Тогда цепочка проверок <code>if<\/code> и <code>elsif<\/code> может стать длинной и полной повторов.<\/span> <span class=\"sg\" data-s=\"2\">В таких случаях <code>given<\/code>/<code>when<\/code> часто понятнее.<\/span> <span class=\"sg\" data-s=\"3\">Эта конструкция похожа на оператор <code>switch<\/code> из других языков.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>given<\/code> принимает значение и делает его <em>топиком<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Топик — это специальная переменная <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затем каждый блок <code>when<\/code> сравнивается с этим топиком.<\/span> <span class=\"sg\" data-s=\"3\">Выполняется первый, который совпал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В отличие от <code>switch<\/code> в некоторых языках, здесь нет «проваливания» (fall-through) к следующему случаю.<\/span> <span class=\"sg\" data-s=\"1\">Как только <code>when<\/code> совпадает, выполняется его блок, и блок <code>given<\/code> заканчивается.<\/span> <span class=\"sg\" data-s=\"2\">Остальные блоки <code>when<\/code> не проверяются.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> выполняется, когда ни один из блоков <code>when<\/code> не совпал.<\/span> <span class=\"sg\" data-s=\"1\">Он делает ту же работу, что и ветка <code>else<\/code> в операторе <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> не равно ни <code>1<\/code>, ни <code>2<\/code>, поэтому программа печатает:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"uk":{"t":"<code>given<\/code> та <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді програмі треба вибрати з кількох варіантів.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ланцюжок перевірок <code>if<\/code> і <code>elsif<\/code> може стати довгим і повним повторів.<\/span> <span class=\"sg\" data-s=\"2\">У таких випадках <code>given<\/code>/<code>when<\/code> часто зрозуміліший.<\/span> <span class=\"sg\" data-s=\"3\">Він схожий на оператор <code>switch<\/code> з інших мов.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>given<\/code> бере значення і робить його <em>топіком<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Топік — це спеціальна змінна <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Потім кожен блок <code>when<\/code> порівнюється з цим топіком.<\/span> <span class=\"sg\" data-s=\"3\">Виконується перший, що збігся:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На відміну від <code>switch<\/code> у деяких мовах, тут немає провалювання до наступного випадку.<\/span> <span class=\"sg\" data-s=\"1\">Щойно якийсь <code>when<\/code> збігся, виконується його блок, і блок <code>given<\/code> завершується.<\/span> <span class=\"sg\" data-s=\"2\">Інші блоки <code>when<\/code> не перевіряються.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> виконується, коли не збігся жоден із блоків <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він робить ту саму роботу, що й гілка <code>else<\/code> в операторі <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> не дорівнює ні <code>1<\/code>, ні <code>2<\/code>, тож програма виводить:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"bg":{"t":"<code>given<\/code> и <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога програмата трябва да избира между няколко възможности.<\/span> <span class=\"sg\" data-s=\"1\">Тогава верига от проверки <code>if<\/code> и <code>elsif<\/code> може да стане дълга и пълна с повторения.<\/span> <span class=\"sg\" data-s=\"2\">В такива случаи конструкцията <code>given<\/code>/<code>when<\/code> често е по-ясна.<\/span> <span class=\"sg\" data-s=\"3\">Тя е подобна на оператора <code>switch<\/code> в други езици.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>given<\/code> приема стойност и я прави <em>тема<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Темата е специалната променлива <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">След това всеки блок <code>when<\/code> се сравнява с тази тема.<\/span> <span class=\"sg\" data-s=\"3\">Първият, който съвпадне, се изпълнява:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За разлика от <code>switch<\/code> в някои езици, тук няма преминаване надолу към следващия случай.<\/span> <span class=\"sg\" data-s=\"1\">Щом един <code>when<\/code> съвпадне, неговият блок се изпълнява и блокът <code>given<\/code> приключва.<\/span> <span class=\"sg\" data-s=\"2\">Другите блокове <code>when<\/code> не се проверяват.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> се изпълнява, когато нито един от блоковете <code>when<\/code> не е съвпаднал.<\/span> <span class=\"sg\" data-s=\"1\">Той върши същата работа като клона <code>else<\/code> на оператора <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> не е нито <code>1<\/code>, нито <code>2<\/code>, затова програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"eo":{"t":"<code>given<\/code> kaj <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Foje programo bezonas elekti inter pluraj ebloj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉeno de kontroloj <code>if<\/code> kaj <code>elsif<\/code> tiam povas fariĝi longa kaj plena de ripetoj.<\/span> <span class=\"sg\" data-s=\"2\">En tiaj kazoj <code>given<\/code>/<code>when<\/code> ofte estas pli klara.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi similas al la instrukcio <code>switch<\/code> en aliaj lingvoj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La bloko <code>given<\/code> prenas valoron kaj faras ĝin la <em>temo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La temo estas la speciala variablo <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste ĉiu bloko <code>when<\/code> estas komparata kun ĉi tiu temo.<\/span> <span class=\"sg\" data-s=\"3\">La unua, kiu kongruas, ruliĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Male al <code>switch<\/code> en kelkaj lingvoj, ĉi tie ne estas trafalado al la sekva kazo.<\/span> <span class=\"sg\" data-s=\"1\">Tuj kiam <code>when<\/code> kongruas, ĝia bloko ruliĝas, kaj la bloko <code>given<\/code> finiĝas.<\/span> <span class=\"sg\" data-s=\"2\">La aliaj blokoj <code>when<\/code> ne estas provataj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bloko <code>default<\/code> ruliĝas, kiam neniu el la blokoj <code>when<\/code> kongruis.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi faras la saman laboron kiel la branĉo <code>else<\/code> de instrukcio <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> estas nek <code>1<\/code> nek <code>2<\/code>, do la programo presas:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]},"la":{"t":"<code>given<\/code> et <code>when<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum programma inter plures optiones eligere debet.<\/span> <span class=\"sg\" data-s=\"1\">Tum catena probationum <code>if<\/code> et <code>elsif<\/code> longa et plena repetitionum fieri potest.<\/span> <span class=\"sg\" data-s=\"2\">In talibus casibus constructio <code>given<\/code>/<code>when<\/code> saepe clarior est.<\/span> <span class=\"sg\" data-s=\"3\">Similis est sententiae <code>switch<\/code> in aliis linguis.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Copia <code>given<\/code> valorem accipit et eum <em>topicum<\/em> facit.<\/span> <span class=\"sg\" data-s=\"1\">Topicum est variabilis specialis <code>$_<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deinde quaeque copia <code>when<\/code> cum hoc topico comparatur.<\/span> <span class=\"sg\" data-s=\"3\">Prima quae congruit currit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 2;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    when 3 { say 'three' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>two<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dissimiliter a <code>switch<\/code> in quibusdam linguis, nullus est transitus ad proximum casum.<\/span> <span class=\"sg\" data-s=\"1\">Simulac <code>when<\/code> congruit, copia eius currit, et copia <code>given<\/code> finita est.<\/span> <span class=\"sg\" data-s=\"2\">Ceterae copiae <code>when<\/code> non probantur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Copia <code>default<\/code> currit cum nulla ex copiis <code>when<\/code> congruit.<\/span> <span class=\"sg\" data-s=\"1\">Idem munus agit ac ramus <code>else<\/code> sententiae <code>if<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\n\ngiven $n {\n    when 1 { say 'one' }\n    when 2 { say 'two' }\n    default { say 'many' }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>$n<\/code> neque <code>1<\/code> neque <code>2<\/code> est, itaque programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>many<\/code><\/pre>"]]}}}</script>
