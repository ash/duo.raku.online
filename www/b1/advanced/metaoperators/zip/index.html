<script type="application/json" id="page-data">{"u":"advanced/metaoperators/zip","n":547,"k":"topic","pv":"advanced/metaoperators/reduction/quiz","nx":"advanced/metaoperators/more","tr":["advanced","advanced/metaoperators"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Zip metaoperators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The zip meta-operator <code>Z<\/code> takes two or more lists.<\/span> <span class=\"sg\" data-s=\"1\">It pairs up their elements by position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The result is a list of groups.<\/span> <span class=\"sg\" data-s=\"1\">The first group has the first element of each list.<\/span> <span class=\"sg\" data-s=\"2\">The next group has the second elements, and so on.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Even more cleverly, you can combine <code>Z<\/code> with an operator that works on each pair.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>Z+<\/code> adds the elements position by position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Here, the zip meta-operator wraps the <code>+<\/code> operator.<\/span> <span class=\"sg\" data-s=\"1\">It calculates <code>1 + 10<\/code>, <code>2 + 20<\/code>, and <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In the same way, <code>Z*<\/code> multiplies the matching elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And <code>Z~<\/code> joins the matching strings:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"de":{"t":"Zip-Metaoperatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Zip-Meta-Operator <code>Z<\/code> nimmt zwei oder mehr Listen.<\/span> <span class=\"sg\" data-s=\"1\">Er bildet aus ihren Elementen Paare, nach der Position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Ergebnis ist eine Liste von Gruppen.<\/span> <span class=\"sg\" data-s=\"1\">Die erste Gruppe enthält das erste Element jeder Liste.<\/span> <span class=\"sg\" data-s=\"2\">Die nächste Gruppe enthält die zweiten Elemente, und so weiter.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noch geschickter: Sie können <code>Z<\/code> mit einem Operator kombinieren, der mit jedem Paar arbeitet.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel addiert <code>Z+<\/code> die Elemente Position für Position:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier umhüllt der Zip-Meta-Operator den Operator <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er berechnet <code>1 + 10<\/code>, <code>2 + 20<\/code> und <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Genauso multipliziert <code>Z*<\/code> die passenden Elemente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und <code>Z~<\/code> verbindet die passenden Zeichenketten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"nl":{"t":"Zip-meta-operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De zip-meta-operator <code>Z<\/code> neemt twee of meer lijsten.<\/span> <span class=\"sg\" data-s=\"1\">Hij koppelt hun elementen op positie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het resultaat is een lijst van groepen.<\/span> <span class=\"sg\" data-s=\"1\">De eerste groep bevat het eerste element van elke lijst.<\/span> <span class=\"sg\" data-s=\"2\">De volgende groep bevat de tweede elementen, enzovoort.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nog slimmer: je kunt <code>Z<\/code> combineren met een operator die op elk paar werkt.<\/span> <span class=\"sg\" data-s=\"1\"><code>Z+<\/code> telt bijvoorbeeld de elementen positie voor positie op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hier omhult de zip-meta-operator de operator <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hij berekent <code>1 + 10<\/code>, <code>2 + 20<\/code> en <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Op dezelfde manier vermenigvuldigt <code>Z*<\/code> de elementen die bij elkaar horen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En <code>Z~<\/code> voegt de tekenreeksen samen die bij elkaar horen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"es":{"t":"Metaoperadores zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">El meta-operador zip <code>Z<\/code> toma dos o más listas.<\/span> <span class=\"sg\" data-s=\"1\">Empareja sus elementos por posición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El resultado es una lista de grupos.<\/span> <span class=\"sg\" data-s=\"1\">El primer grupo tiene el primer elemento de cada lista.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente grupo tiene los segundos elementos, y así sucesivamente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De forma aún más inteligente, puedes combinar <code>Z<\/code> con un operador que trabaja con cada par.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>Z+<\/code> suma los elementos posición por posición:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aquí, el meta-operador zip envuelve al operador <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Calcula <code>1 + 10<\/code>, <code>2 + 20<\/code> y <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De la misma forma, <code>Z*<\/code> multiplica los elementos correspondientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y <code>Z~<\/code> une las cadenas correspondientes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"it":{"t":"Meta-operatori zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore zip <code>Z<\/code> prende due o più liste.<\/span> <span class=\"sg\" data-s=\"1\">Accoppia i loro elementi per posizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il risultato è una lista di gruppi.<\/span> <span class=\"sg\" data-s=\"1\">Il primo gruppo contiene il primo elemento di ogni lista.<\/span> <span class=\"sg\" data-s=\"2\">Il gruppo successivo contiene i secondi elementi, e così via.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In modo ancora più intelligente, puoi combinare <code>Z<\/code> con un operatore che lavora su ogni coppia.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, <code>Z+<\/code> somma gli elementi posizione per posizione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Qui il meta-operatore zip avvolge l'operatore <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Calcola <code>1 + 10<\/code>, <code>2 + 20<\/code> e <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Allo stesso modo, <code>Z*<\/code> moltiplica gli elementi corrispondenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E <code>Z~<\/code> unisce le stringhe corrispondenti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"lv":{"t":"Zip metaoperatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zip metaoperators <code>Z<\/code> paņem divus vai vairākus sarakstus.<\/span> <span class=\"sg\" data-s=\"1\">Tas sapāro to elementus pēc pozīcijas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rezultāts ir grupu saraksts.<\/span> <span class=\"sg\" data-s=\"1\">Pirmajā grupā ir katra saraksta pirmais elements.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajā grupā ir otrie elementi un tā tālāk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vēl gudrāk ir apvienot <code>Z<\/code> ar operatoru, kas strādā ar katru pāri.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>Z+<\/code> saskaita elementus pa pozīcijām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šeit zip metaoperators ietver operatoru <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas aprēķina <code>1 + 10<\/code>, <code>2 + 20<\/code> un <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat <code>Z*<\/code> sareizina atbilstošos elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Z~<\/code> savieno atbilstošās virknes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"ru":{"t":"Метаоператоры zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> берёт два или больше списков.<\/span> <span class=\"sg\" data-s=\"1\">Он объединяет их элементы по позициям:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат — это список групп.<\/span> <span class=\"sg\" data-s=\"1\">Первая группа содержит первый элемент каждого списка.<\/span> <span class=\"sg\" data-s=\"2\">Следующая группа содержит вторые элементы, и так далее.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно поступить ещё умнее и совместить <code>Z<\/code> с оператором, который работает с каждой парой.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>Z+<\/code> складывает элементы по позициям:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Здесь метаоператор zip оборачивает оператор <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он вычисляет <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Точно так же <code>Z*<\/code> перемножает соответствующие элементы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> соединяет соответствующие строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"uk":{"t":"Метаоператори zip","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператор zip <code>Z<\/code> бере два або більше списків.<\/span> <span class=\"sg\" data-s=\"1\">Він складає їхні елементи в пари за позиціями:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Результат — це список груп.<\/span> <span class=\"sg\" data-s=\"1\">Перша група містить перший елемент кожного списку.<\/span> <span class=\"sg\" data-s=\"2\">Наступна група містить другі елементи і так далі.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ще розумніше те, що <code>Z<\/code> можна поєднати з оператором, який діє на кожну пару.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>Z+<\/code> додає елементи позиція за позицією:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут метаоператор zip огортає оператор <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він обчислює <code>1 + 10<\/code>, <code>2 + 20<\/code> і <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так само <code>Z*<\/code> перемножує відповідні елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> з'єднує відповідні рядки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"bg":{"t":"Zip метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът zip <code>Z<\/code> взима два или повече списъка.<\/span> <span class=\"sg\" data-s=\"1\">Той сдвоява елементите им по позиция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Резултатът е списък от групи.<\/span> <span class=\"sg\" data-s=\"1\">Първата група съдържа първия елемент от всеки списък.<\/span> <span class=\"sg\" data-s=\"2\">Следващата група съдържа вторите елементи и така нататък.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Още по-умно е, че можете да комбинирате <code>Z<\/code> с оператор, който работи върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>Z+<\/code> събира елементите позиция по позиция:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук метаоператорът zip обвива оператора <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той пресмята <code>1 + 10<\/code>, <code>2 + 20<\/code> и <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По същия начин <code>Z*<\/code> умножава съответните елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А <code>Z~<\/code> съединява съответните низове:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"eo":{"t":"Zip-metaoperatoroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La zipa meta-operatoro <code>Z<\/code> prenas du aŭ pli da listoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi parigas iliajn elementojn laŭ pozicio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La rezulto estas listo de grupoj.<\/span> <span class=\"sg\" data-s=\"1\">La unua grupo havas la unuan elementon de ĉiu listo.<\/span> <span class=\"sg\" data-s=\"2\">La sekva grupo havas la duajn elementojn, kaj tiel plu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eĉ pli lerte, vi povas kombini <code>Z<\/code> kun operatoro, kiu laboras kun ĉiu paro.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, <code>Z+<\/code> adicias la elementojn pozicio post pozicio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la zipa meta-operatoro ĉirkaŭas la operatoron <code>+<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kalkulas <code>1 + 10<\/code>, <code>2 + 20<\/code> kaj <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Same, <code>Z*<\/code> multobligas la respondajn elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>Z~<\/code> kunigas la respondajn ĉenojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]},"la":{"t":"Zip meta-operatores","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Meta-operator zip <code>Z<\/code> duas vel plures listas accipit.<\/span> <span class=\"sg\" data-s=\"1\">Elementa earum per positionem in paria coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z (4, 5, 6); # ((1 4) (2 5) (3 6))<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eventus est lista gregum.<\/span> <span class=\"sg\" data-s=\"1\">Primus grex primum elementum cuiusque listae habet.<\/span> <span class=\"sg\" data-s=\"2\">Proximus grex secunda elementa habet, et ita porro.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam callidius, <code>Z<\/code> cum operatore coniungere potes qui in quoque pari agit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>Z+<\/code> elementa per positionem addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z+ (10, 20, 30); # (11 22 33)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic meta-operator zip operatorem <code>+<\/code> involvit.<\/span> <span class=\"sg\" data-s=\"1\">Computat <code>1 + 10<\/code>, <code>2 + 20<\/code> et <code>3 + 30<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eodem modo <code>Z*<\/code> elementa sibi respondentia multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) Z* (10, 20, 30); # (10 40 90)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et <code>Z~<\/code> fila sibi respondentia coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt; Z~ &lt;1 2 3&gt;; # (a1 b2 c3)<\/code><\/pre>"]]}}}</script>
