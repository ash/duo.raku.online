<script type="application/json" id="page-data">{"u":"advanced/metaoperators/more","n":548,"k":"topic","pv":"advanced/metaoperators/zip","nx":"advanced/metaoperators/more/quiz","tr":["advanced","advanced/metaoperators"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Cross, hyper, and negated meta-operators","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Apart from reduction and zip, Raku has several more meta-operators.<\/span> <span class=\"sg\" data-s=\"1\">Three of them are useful to know at this point.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The cross meta-operator <code>X<\/code> takes two lists.<\/span> <span class=\"sg\" data-s=\"1\">It pairs <strong>every<\/strong> element of one with <strong>every<\/strong> element of the other.<\/span> <span class=\"sg\" data-s=\"2\">This is called the cartesian product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Like zip, it can wrap an operator, which then works on each pair.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> joins each pair into a string, and <code>X*<\/code> multiplies the values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip goes through two lists side by side, while cross combines them in all possible ways.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A hyper meta-operator applies an operator to <strong>each element<\/strong> of a list.<\/span> <span class=\"sg\" data-s=\"1\">The operator goes inside the pointy brackets <code>»…«<\/code>, or the ASCII form <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">With two lists, it works element by element, like zip.<\/span> <span class=\"sg\" data-s=\"3\">With a single value on one side, it stretches that value over the whole list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The two arrows do not have to point the same way.<\/span> <span class=\"sg\" data-s=\"1\">Their direction decides what happens when the lists have different lengths.<\/span> <span class=\"sg\" data-s=\"2\">If an arrow points <strong>at<\/strong> a list, that list may repeat to match the other.<\/span> <span class=\"sg\" data-s=\"3\">Here are the four combinations, written in ASCII with <code>&lt;&lt;<\/code> and <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — no list is repeated, so the lists must already have the same length, or there is an error;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — the <strong>right<\/strong> list repeats to match the left one;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — the <strong>left<\/strong> list repeats to match the right one;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — the <strong>shorter<\/strong> list repeats to match the longer one.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">There is also a unary form, with only one operand.<\/span> <span class=\"sg\" data-s=\"1\">It calls a method on every element.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> turns each string into upper case:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hyper operations also show that the work <em>may<\/em> be done in parallel.<\/span> <span class=\"sg\" data-s=\"1\">You will see the related <code>.hyper<\/code> method later, in <a href=\"/paradigms/hyper-race/\">the section on concurrent programming<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negated — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">If you put <code>!<\/code> before a comparison operator, you get the opposite result.<\/span> <span class=\"sg\" data-s=\"1\">The familiar <code>!=<\/code> (not equal) is exactly this meta-operator used with <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The same works for other Boolean operators, such as <code>eq<\/code> and <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In short, <code>$a !op $b<\/code> is just a neater way to write <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This is on purpose.<\/span> <span class=\"sg\" data-s=\"1\">Some languages, such as Esperanto, are small and simple on purpose.<\/span> <span class=\"sg\" data-s=\"2\">They try to have one regular way to say each thing.<\/span> <span class=\"sg\" data-s=\"3\">Raku is different and happily gives you several ways.<\/span> <span class=\"sg\" data-s=\"4\">So the negated <code>!eq<\/code> exists right next to the special <code>ne<\/code> operator.<\/span> <span class=\"sg\" data-s=\"5\">The two mean exactly the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"de":{"t":"Kreuz-, Hyper- und negierte Operatoren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben Reduktion und Zip hat Raku noch mehrere andere Meta-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Drei davon sollte man an dieser Stelle kennen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kreuz — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Kreuz-Meta-Operator <code>X<\/code> nimmt zwei Listen.<\/span> <span class=\"sg\" data-s=\"1\">Er bildet aus <strong>jedem<\/strong> Element der einen Liste und <strong>jedem<\/strong> Element der anderen ein Paar.<\/span> <span class=\"sg\" data-s=\"2\">Das nennt man das kartesische Produkt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie Zip kann er einen Operator umhüllen, der dann mit jedem Paar arbeitet.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> verbindet jedes Paar zu einer Zeichenkette, und <code>X*<\/code> multipliziert die Werte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip geht zwei Listen nebeneinander durch, während Kreuz sie auf alle möglichen Arten kombiniert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Hyper-Meta-Operator wendet einen Operator auf <strong>jedes Element<\/strong> einer Liste an.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator steht in den spitzen Klammern <code>»…«<\/code> oder in der ASCII-Form <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mit zwei Listen arbeitet er Element für Element, wie Zip.<\/span> <span class=\"sg\" data-s=\"3\">Wenn auf einer Seite nur ein einzelner Wert steht, streckt er diesen Wert über die ganze Liste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die zwei Pfeile müssen nicht in dieselbe Richtung zeigen.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Richtung bestimmt, was passiert, wenn die Listen verschieden lang sind.<\/span> <span class=\"sg\" data-s=\"2\">Wenn ein Pfeil <strong>auf<\/strong> eine Liste zeigt, darf sich diese Liste wiederholen, bis sie zur anderen passt.<\/span> <span class=\"sg\" data-s=\"3\">Hier sind die vier Kombinationen, in ASCII mit <code>&lt;&lt;<\/code> und <code>&gt;&gt;<\/code> geschrieben:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — keine Liste wird wiederholt, also müssen die Listen schon gleich lang sein, sonst gibt es einen Fehler;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — die <strong>rechte<\/strong> Liste wiederholt sich, bis sie zur linken passt;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — die <strong>linke<\/strong> Liste wiederholt sich, bis sie zur rechten passt;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — die <strong>kürzere<\/strong> Liste wiederholt sich, bis sie zur längeren passt.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt auch eine unäre Form, mit nur einem Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Sie ruft für jedes Element eine Methode auf.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> wandelt jede Zeichenkette in Großbuchstaben um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hyper-Operationen zeigen auch, dass die Arbeit parallel laufen <em>darf<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Die verwandte Methode <code>.hyper<\/code> sehen Sie später im <a href=\"https://course.raku.org/de/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">Abschnitt über nebenläufige Programmierung<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negiert — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>!<\/code> vor einen Vergleichsoperator setzen, bekommen Sie das umgekehrte Ergebnis.<\/span> <span class=\"sg\" data-s=\"1\">Das bekannte <code>!=<\/code> (ungleich) ist genau dieser Meta-Operator mit <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dasselbe funktioniert für andere boolesche Operatoren, wie <code>eq<\/code> und <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — nicht gleich als Zeichenketten\nsay 5 !%% 2;     # True  — 5 ist nicht teilbar durch 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kurz gesagt: <code>$a !op $b<\/code> ist nur eine schönere Schreibweise für <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Das ist Absicht.<\/span> <span class=\"sg\" data-s=\"1\">Manche Sprachen, wie Esperanto, sind mit Absicht klein und einfach.<\/span> <span class=\"sg\" data-s=\"2\">Sie wollen für jede Sache genau eine regelmäßige Ausdrucksweise haben.<\/span> <span class=\"sg\" data-s=\"3\">Raku ist anders und gibt Ihnen gern mehrere Wege.<\/span> <span class=\"sg\" data-s=\"4\">Deshalb gibt es das negierte <code>!eq<\/code> direkt neben dem speziellen Operator <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Die beiden bedeuten genau dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — derselbe Test wie 'a' !eq 'b'<\/code><\/pre>"]]},"nl":{"t":"Cross, hyper en genegeerd","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast reductie en zip heeft Raku nog meer meta-operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Drie daarvan zijn nu handig om te kennen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De cross-meta-operator <code>X<\/code> neemt twee lijsten.<\/span> <span class=\"sg\" data-s=\"1\">Hij koppelt <strong>elk<\/strong> element van de ene aan <strong>elk<\/strong> element van de andere.<\/span> <span class=\"sg\" data-s=\"2\">Dit heet het cartesisch product:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als zip kan hij een operator omhullen, die dan op elk paar werkt.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> voegt elk paar samen tot een tekenreeks, en <code>X*<\/code> vermenigvuldigt de waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip loopt tegelijk door twee lijsten, terwijl cross ze op alle mogelijke manieren combineert.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een hyper-meta-operator past een operator toe op <strong>elk element<\/strong> van een lijst.<\/span> <span class=\"sg\" data-s=\"1\">De operator staat tussen de puntige haken <code>»…«<\/code>, of in de ASCII-vorm <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Met twee lijsten werkt hij element voor element, net als zip.<\/span> <span class=\"sg\" data-s=\"3\">Met één waarde aan één kant rekt hij die waarde uit over de hele lijst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De twee pijlen hoeven niet dezelfde kant op te wijzen.<\/span> <span class=\"sg\" data-s=\"1\">Hun richting bepaalt wat er gebeurt als de lijsten niet even lang zijn.<\/span> <span class=\"sg\" data-s=\"2\">Als een pijl <strong>naar<\/strong> een lijst wijst, mag die lijst zich herhalen tot hij bij de andere past.<\/span> <span class=\"sg\" data-s=\"3\">Hier zijn de vier combinaties, geschreven in ASCII met <code>&lt;&lt;<\/code> en <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — geen lijst herhaalt zich, dus de lijsten moeten al even lang zijn, anders is er een fout;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — de <strong>rechter<\/strong> lijst herhaalt zich tot hij bij de linker past;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — de <strong>linker<\/strong> lijst herhaalt zich tot hij bij de rechter past;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — de <strong>kortere<\/strong> lijst herhaalt zich tot hij bij de langere past.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 herhaalt tot 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er is ook een unaire vorm, met maar één operand.<\/span> <span class=\"sg\" data-s=\"1\">Die roept op elk element een methode aan.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> zet elke tekenreeks om in hoofdletters:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hyper-operaties laten ook zien dat het werk parallel gedaan <em>mag<\/em> worden.<\/span> <span class=\"sg\" data-s=\"1\">Je ziet de verwante methode <code>.hyper<\/code> later, in <a href=\"https://course.raku.org/nl/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">het gedeelte over gelijktijdig programmeren<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Genegeerd — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je <code>!<\/code> voor een vergelijkingsoperator zet, krijg je het omgekeerde resultaat.<\/span> <span class=\"sg\" data-s=\"1\">Het bekende <code>!=<\/code> (niet gelijk) is precies deze meta-operator, gebruikt met <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde werkt voor andere Booleaanse operatoren, zoals <code>eq<\/code> en <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — niet gelijk als tekenreeksen\nsay 5 !%% 2;     # True  — 5 is niet deelbaar door 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kort gezegd is <code>$a !op $b<\/code> gewoon een nettere schrijfwijze voor <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dit is met opzet zo.<\/span> <span class=\"sg\" data-s=\"1\">Sommige talen, zoals Esperanto, zijn met opzet klein en eenvoudig.<\/span> <span class=\"sg\" data-s=\"2\">Ze proberen voor elk ding één regelmatige manier te hebben.<\/span> <span class=\"sg\" data-s=\"3\">Raku is anders en geeft je graag meerdere manieren.<\/span> <span class=\"sg\" data-s=\"4\">Daarom bestaat het genegeerde <code>!eq<\/code> gewoon naast de speciale operator <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">De twee betekenen precies hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — dezelfde test als 'a' !eq 'b'<\/code><\/pre>"]]},"es":{"t":"Cross, hyper y negados","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de la reducción y el zip, Raku tiene varios meta-operadores más.<\/span> <span class=\"sg\" data-s=\"1\">Es útil conocer tres de ellos en este punto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El meta-operador cross <code>X<\/code> toma dos listas.<\/span> <span class=\"sg\" data-s=\"1\">Empareja <strong>cada<\/strong> elemento de una con <strong>cada<\/strong> elemento de la otra.<\/span> <span class=\"sg\" data-s=\"2\">Esto se llama producto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como zip, puede envolver un operador, que entonces trabaja con cada par.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> une cada par en una cadena, y <code>X*<\/code> multiplica los valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip recorre dos listas una al lado de la otra, mientras que cross las combina de todas las formas posibles.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>&gt;&gt;...&lt;&lt;<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un meta-operador hyper aplica un operador a <strong>cada elemento<\/strong> de una lista.<\/span> <span class=\"sg\" data-s=\"1\">El operador va dentro de las flechas <code>»…«<\/code>, o de su forma ASCII <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con dos listas, trabaja elemento por elemento, como zip.<\/span> <span class=\"sg\" data-s=\"3\">Si un lado tiene un solo valor, extiende ese valor a toda la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Las dos flechas no tienen que apuntar en la misma dirección.<\/span> <span class=\"sg\" data-s=\"1\">Su dirección decide qué pasa cuando las listas tienen longitudes diferentes.<\/span> <span class=\"sg\" data-s=\"2\">Si una flecha apunta <strong>hacia<\/strong> una lista, esa lista puede repetirse hasta igualar a la otra.<\/span> <span class=\"sg\" data-s=\"3\">Estas son las cuatro combinaciones, escritas en ASCII con <code>&lt;&lt;<\/code> y <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — no se repite ninguna lista, así que las listas ya deben tener la misma longitud, o hay un error;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la lista <strong>derecha<\/strong> se repite hasta igualar a la izquierda;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la lista <strong>izquierda<\/strong> se repite hasta igualar a la derecha;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la lista <strong>más corta<\/strong> se repite hasta igualar a la más larga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También existe una forma unaria, con un solo operando.<\/span> <span class=\"sg\" data-s=\"1\">Llama a un método en cada elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> convierte cada cadena a mayúsculas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Las operaciones hyper también indican que el trabajo <em>puede<\/em> hacerse en paralelo.<\/span> <span class=\"sg\" data-s=\"1\">Más adelante verás el método relacionado <code>.hyper<\/code>, en <a href=\"https://course.raku.org/es/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">la sección sobre programación concurrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negado — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si pones <code>!<\/code> antes de un operador de comparación, obtienes el resultado contrario.<\/span> <span class=\"sg\" data-s=\"1\">El conocido <code>!=<\/code> (no igual) es justo este meta-operador usado con <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo mismo funciona con otros operadores booleanos, como <code>eq<\/code> y <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En resumen, <code>$a !op $b<\/code> es solo una forma más ordenada de escribir <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Esto es a propósito.<\/span> <span class=\"sg\" data-s=\"1\">Algunos lenguajes, como el esperanto, son pequeños y simples a propósito.<\/span> <span class=\"sg\" data-s=\"2\">Intentan tener una forma regular de decir cada cosa.<\/span> <span class=\"sg\" data-s=\"3\">Raku es diferente y con gusto te da varias formas.<\/span> <span class=\"sg\" data-s=\"4\">Por eso el negado <code>!eq<\/code> existe justo al lado del operador especial <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Los dos significan exactamente lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"it":{"t":"Cross, hyper e negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre alla riduzione e allo zip, Raku ha diversi altri meta-operatori.<\/span> <span class=\"sg\" data-s=\"1\">A questo punto è utile conoscerne tre.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il meta-operatore cross <code>X<\/code> prende due liste.<\/span> <span class=\"sg\" data-s=\"1\">Accoppia <strong>ogni<\/strong> elemento di una con <strong>ogni<\/strong> elemento dell'altra.<\/span> <span class=\"sg\" data-s=\"2\">Questo si chiama prodotto cartesiano:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Come lo zip, può avvolgere un operatore, che poi lavora su ogni coppia.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> unisce ogni coppia in una stringa, e <code>X*<\/code> moltiplica i valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo zip scorre due liste fianco a fianco, mentre il cross le combina in tutti i modi possibili.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un meta-operatore hyper applica un operatore a <strong>ogni elemento<\/strong> di una lista.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore va dentro le parentesi a punta <code>»…«<\/code>, o nella forma ASCII <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con due liste, lavora elemento per elemento, come lo zip.<\/span> <span class=\"sg\" data-s=\"3\">Con un solo valore da un lato, estende quel valore a tutta la lista:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Le due frecce non devono per forza puntare nella stessa direzione.<\/span> <span class=\"sg\" data-s=\"1\">La loro direzione decide cosa succede quando le liste hanno lunghezze diverse.<\/span> <span class=\"sg\" data-s=\"2\">Se una freccia punta <strong>verso<\/strong> una lista, quella lista può ripetersi fino alla lunghezza dell'altra.<\/span> <span class=\"sg\" data-s=\"3\">Ecco le quattro combinazioni, scritte in ASCII con <code>&lt;&lt;<\/code> e <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — nessuna lista viene ripetuta, quindi le liste devono già avere la stessa lunghezza, altrimenti c'è un errore;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la lista <strong>destra<\/strong> si ripete fino alla lunghezza della sinistra;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la lista <strong>sinistra<\/strong> si ripete fino alla lunghezza della destra;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la lista <strong>più corta<\/strong> si ripete fino alla lunghezza della più lunga.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 si ripete come 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è anche una forma unaria, con un solo operando.<\/span> <span class=\"sg\" data-s=\"1\">Chiama un metodo su ogni elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> trasforma ogni stringa in maiuscolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Le operazioni hyper mostrano anche che il lavoro <em>può<\/em> essere fatto in parallelo.<\/span> <span class=\"sg\" data-s=\"1\">Vedrai il metodo simile <code>.hyper<\/code> più avanti, nella <a href=\"https://course.raku.org/it/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sezione sulla programmazione concorrente<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negato — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se metti <code>!<\/code> prima di un operatore di confronto, ottieni il risultato opposto.<\/span> <span class=\"sg\" data-s=\"1\">Il noto <code>!=<\/code> (diverso da) è proprio questo meta-operatore usato con <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso funziona per altri operatori booleani, come <code>eq<\/code> e <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non uguale come stringhe\nsay 5 !%% 2;     # True  — 5 non è divisibile per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In breve, <code>$a !op $b<\/code> è solo un modo più ordinato di scrivere <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questo è voluto.<\/span> <span class=\"sg\" data-s=\"1\">Alcune lingue, come l'Esperanto, sono piccole e semplici apposta.<\/span> <span class=\"sg\" data-s=\"2\">Cercano di avere un solo modo regolare per dire ogni cosa.<\/span> <span class=\"sg\" data-s=\"3\">Raku è diverso e ti dà volentieri diversi modi.<\/span> <span class=\"sg\" data-s=\"4\">Così il negato <code>!eq<\/code> esiste proprio accanto all'operatore speciale <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">I due significano esattamente la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — lo stesso test di 'a' !eq 'b'<\/code><\/pre>"]]},"lv":{"t":"Krustojuma, hiper un noliedzošie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez redukcijas un zip Raku ir vēl vairāki metaoperatori.<\/span> <span class=\"sg\" data-s=\"1\">Trīs no tiem šobrīd ir noderīgi zināt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Krusteniskais — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Krusteniskais metaoperators <code>X<\/code> paņem divus sarakstus.<\/span> <span class=\"sg\" data-s=\"1\">Tas sapāro <strong>katru<\/strong> viena saraksta elementu ar <strong>katru<\/strong> otra saraksta elementu.<\/span> <span class=\"sg\" data-s=\"2\">To sauc par Dekarta reizinājumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā zip, tas var ietvert operatoru, kas tad strādā ar katru pāri.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> savieno katru pāri virknē, un <code>X*<\/code> sareizina vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip iet cauri diviem sarakstiem vienlaikus, bet krusteniskais operators tos apvieno visos iespējamos veidos.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hiper — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hiper metaoperators piemēro operatoru <strong>katram elementam<\/strong> sarakstā.<\/span> <span class=\"sg\" data-s=\"1\">Operators atrodas smailajās iekavās <code>»…«<\/code> vai ASCII formā <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ar diviem sarakstiem tas strādā pa elementiem, tāpat kā zip.<\/span> <span class=\"sg\" data-s=\"3\">Ja vienā pusē ir tikai viena vērtība, tas izstiepj šo vērtību pār visu sarakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Abām bultiņām nav jārāda vienā virzienā.<\/span> <span class=\"sg\" data-s=\"1\">To virziens nosaka, kas notiek, ja sarakstiem ir dažāds garums.<\/span> <span class=\"sg\" data-s=\"2\">Ja bultiņa rāda <strong>uz<\/strong> sarakstu, šis saraksts var atkārtoties, lai būtu tikpat garš kā otrs.<\/span> <span class=\"sg\" data-s=\"3\">Šeit ir četras kombinācijas, uzrakstītas ASCII formā ar <code>&lt;&lt;<\/code> un <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — neviens saraksts netiek atkārtots, tāpēc sarakstiem jau jābūt vienāda garuma, citādi rodas kļūda;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>labais<\/strong> saraksts atkārtojas, lai būtu tikpat garš kā kreisais;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>kreisais<\/strong> saraksts atkārtojas, lai būtu tikpat garš kā labais;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>īsākais<\/strong> saraksts atkārtojas, lai būtu tikpat garš kā garākais.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir arī unārā forma, ar tikai vienu operandu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izsauc metodi katram elementam.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> pārvērš katru virkni lielajos burtos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hiper operācijas arī parāda, ka darbu <em>var<\/em> veikt paralēli.<\/span> <span class=\"sg\" data-s=\"1\">Ar saistīto metodi <code>.hyper<\/code> jūs iepazīsieties vēlāk, <a href=\"https://course.raku.org/lv/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">konkurentās programmēšanas sadaļā<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negācijas — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja ieliekat <code>!<\/code> pirms salīdzināšanas operatora, jūs saņemat pretēju rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Pazīstamais <code>!=<\/code> (nav vienāds) ir tieši šis metaoperators kopā ar <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats darbojas ar citiem Būla operatoriem, piemēram, <code>eq<\/code> un <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — not equal as strings\nsay 5 !%% 2;     # True  — 5 is not divisible by 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Īsi sakot, <code>$a !op $b<\/code> ir vienkārši glītāks veids, kā rakstīt <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tas ir apzināti.<\/span> <span class=\"sg\" data-s=\"1\">Dažas valodas, piemēram, esperanto, ir apzināti mazas un vienkāršas.<\/span> <span class=\"sg\" data-s=\"2\">Tās cenšas katrai lietai dot vienu regulāru izteikšanas veidu.<\/span> <span class=\"sg\" data-s=\"3\">Raku ir citāda un labprāt dod jums vairākus veidus.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc negācijas <code>!eq<\/code> pastāv tieši blakus īpašajam operatoram <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Abi nozīmē tieši to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — the same test as 'a' !eq 'b'<\/code><\/pre>"]]},"ru":{"t":"Перекрёстные, гипер- и отрицающие","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кроме свёртки и zip, в Raku есть ещё несколько метаоператоров.<\/span> <span class=\"sg\" data-s=\"1\">Три из них полезно знать уже сейчас.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перекрёстный — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перекрёстный метаоператор <code>X<\/code> берёт два списка.<\/span> <span class=\"sg\" data-s=\"1\">Он составляет пары из <strong>каждого<\/strong> элемента одного списка и <strong>каждого<\/strong> элемента другого.<\/span> <span class=\"sg\" data-s=\"2\">Это называется декартовым произведением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и zip, он может обернуть оператор, который потом работает с каждой парой.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> соединяет каждую пару в строку, а <code>X*<\/code> перемножает значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip проходит по двум спискам одновременно, а перекрёстный оператор сочетает их всеми возможными способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гипероператор — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Гипероператор применяет оператор к <strong>каждому элементу<\/strong> списка.<\/span> <span class=\"sg\" data-s=\"1\">Оператор ставится внутрь угловых стрелок <code>»…«<\/code> или в их ASCII-форму <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С двумя списками он работает поэлементно, как zip.<\/span> <span class=\"sg\" data-s=\"3\">Если с одной стороны стоит одно значение, он растягивает это значение на весь список:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Стрелки не обязательно смотрят в одну сторону.<\/span> <span class=\"sg\" data-s=\"1\">Их направление решает, что происходит, когда у списков разная длина.<\/span> <span class=\"sg\" data-s=\"2\">Если стрелка смотрит <strong>на<\/strong> список, этот список может повторяться, чтобы совпасть по длине с другим.<\/span> <span class=\"sg\" data-s=\"3\">Вот четыре сочетания, записанные в ASCII с <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — ни один список не повторяется, поэтому списки уже должны быть одной длины, иначе будет ошибка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>правый<\/strong> список повторяется, чтобы совпасть по длине с левым;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>левый<\/strong> список повторяется, чтобы совпасть по длине с правым;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>более короткий<\/strong> список повторяется, чтобы совпасть по длине с более длинным.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторяется как 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Есть также унарная форма, у которой только один операнд.<\/span> <span class=\"sg\" data-s=\"1\">Она вызывает метод у каждого элемента.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> переводит каждую строку в верхний регистр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Гипероперации также показывают, что работа <em>может<\/em> выполняться параллельно.<\/span> <span class=\"sg\" data-s=\"1\">Позже вы встретите связанный с ними метод <code>.hyper<\/code> в <a href=\"https://course.raku.org/ru/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">разделе о конкурентном программировании<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицающий — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если поставить <code>!<\/code> перед оператором сравнения, получится обратный результат.<\/span> <span class=\"sg\" data-s=\"1\">Знакомый вам <code>!=<\/code> (не равно) — это ровно этот метаоператор, применённый к <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Точно так же это работает с другими логическими операторами, например <code>eq<\/code> и <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не равны как строки\nsay 5 !%% 2;     # True  — 5 не делится на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко говоря, <code>$a !op $b<\/code> — это просто более аккуратный способ записать <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Так задумано.<\/span> <span class=\"sg\" data-s=\"1\">Некоторые языки, например эсперанто, специально сделаны маленькими и простыми.<\/span> <span class=\"sg\" data-s=\"2\">Они стараются иметь один правильный способ выразить каждую мысль.<\/span> <span class=\"sg\" data-s=\"3\">Raku не такой и охотно даёт вам несколько способов.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому отрицающий <code>!eq<\/code> существует прямо рядом с отдельным оператором <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Оба означают ровно одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та же проверка, что и 'a' !eq 'b'<\/code><\/pre>"]]},"uk":{"t":"Перехресний, гіпер- та заперечний метаоператори","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім згортки та zip, у Raku є ще кілька метаоператорів.<\/span> <span class=\"sg\" data-s=\"1\">Три з них корисно знати вже зараз.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перехресний — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перехресний метаоператор <code>X<\/code> бере два списки.<\/span> <span class=\"sg\" data-s=\"1\">Він складає в пару <strong>кожен<\/strong> елемент одного списку з <strong>кожним<\/strong> елементом іншого.<\/span> <span class=\"sg\" data-s=\"2\">Це називають декартовим добутком:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і zip, він може огортати оператор, який тоді працює з кожною парою.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> з'єднує кожну пару в рядок, а <code>X*<\/code> перемножує значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip іде по двох списках поруч, а перехресний оператор поєднує їх усіма можливими способами.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Гіпер — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Гіпероператор застосовує оператор до <strong>кожного елемента<\/strong> списку.<\/span> <span class=\"sg\" data-s=\"1\">Оператор стоїть усередині кутових дужок <code>»…«<\/code> або їхньої ASCII-форми <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">З двома списками він працює поелементно, як zip.<\/span> <span class=\"sg\" data-s=\"3\">Якщо з одного боку лише одне значення, він розтягує це значення на весь список:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Дві стрілки не мусять дивитися в один бік.<\/span> <span class=\"sg\" data-s=\"1\">Їхній напрямок вирішує, що станеться, коли списки мають різну довжину.<\/span> <span class=\"sg\" data-s=\"2\">Якщо стрілка дивиться <strong>на<\/strong> список, цей список може повторюватися, щоб зрівнятися з іншим.<\/span> <span class=\"sg\" data-s=\"3\">Ось чотири варіанти, записані в ASCII з <code>&lt;&lt;<\/code> і <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — жоден список не повторюється, тож списки вже мають бути однакової довжини, інакше буде помилка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>правий<\/strong> список повторюється, щоб зрівнятися з лівим;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>лівий<\/strong> список повторюється, щоб зрівнятися з правим;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>коротший<\/strong> список повторюється, щоб зрівнятися з довшим.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 повторюється як 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Є й унарна форма, лише з одним операндом.<\/span> <span class=\"sg\" data-s=\"1\">Вона викликає метод для кожного елемента.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> переводить кожен рядок у верхній регістр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Гіпероперації також показують, що роботу <em>можна<\/em> виконати паралельно.<\/span> <span class=\"sg\" data-s=\"1\">Пізніше ви побачите схожий метод <code>.hyper<\/code> у <a href=\"https://course.raku.org/uk/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">розділі про конкурентне програмування<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Заперечний — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо поставити <code>!<\/code> перед оператором порівняння, ви отримаєте протилежний результат.<\/span> <span class=\"sg\" data-s=\"1\">Знайомий вам <code>!=<\/code> (не дорівнює) — це саме цей метаоператор разом із <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так само це працює для інших булевих операторів, як-от <code>eq<\/code> і <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не рівні як рядки\nsay 5 !%% 2;     # True  — 5 не ділиться на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коротко кажучи, <code>$a !op $b<\/code> — це просто охайніший спосіб записати <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Так задумано.<\/span> <span class=\"sg\" data-s=\"1\">Деякі мови, як-от есперанто, навмисно малі й прості.<\/span> <span class=\"sg\" data-s=\"2\">Вони намагаються мати один правильний спосіб сказати кожну річ.<\/span> <span class=\"sg\" data-s=\"3\">Raku інший і охоче дає вам кілька способів.<\/span> <span class=\"sg\" data-s=\"4\">Тому заперечний <code>!eq<\/code> існує поруч зі спеціальним оператором <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Обидва означають точно те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — та сама перевірка, що й 'a' !eq 'b'<\/code><\/pre>"]]},"bg":{"t":"Кръстосани, хипер и отрицателни","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен редукция и zip, Raku има още няколко метаоператора.<\/span> <span class=\"sg\" data-s=\"1\">Три от тях е полезно да знаете на този етап.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът cross <code>X<\/code> взима два списъка.<\/span> <span class=\"sg\" data-s=\"1\">Той сдвоява <strong>всеки<\/strong> елемент от единия с <strong>всеки<\/strong> елемент от другия.<\/span> <span class=\"sg\" data-s=\"2\">Това се нарича декартово произведение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Както zip, той може да обвие оператор, който след това работи върху всяка двойка.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> съединява всяка двойка в низ, а <code>X*<\/code> умножава стойностите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip минава през два списъка успоредно, докато cross ги комбинира по всички възможни начини.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Хипер — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Хипер метаоператорът прилага оператор към <strong>всеки елемент<\/strong> от списък.<\/span> <span class=\"sg\" data-s=\"1\">Операторът стои вътре в острите скоби <code>»…«<\/code> или в ASCII формата <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С два списъка той работи елемент по елемент, както zip.<\/span> <span class=\"sg\" data-s=\"3\">Ако от едната страна има само една стойност, той я разтяга върху целия списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Двете стрелки не е задължително да сочат в една посока.<\/span> <span class=\"sg\" data-s=\"1\">Тяхната посока решава какво става, когато списъците са с различна дължина.<\/span> <span class=\"sg\" data-s=\"2\">Ако стрелка сочи <strong>към<\/strong> списък, този списък може да се повтори, за да стане колкото другия.<\/span> <span class=\"sg\" data-s=\"3\">Ето четирите комбинации, записани в ASCII с <code>&lt;&lt;<\/code> и <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — никой списък не се повтаря, затова списъците трябва вече да са с еднаква дължина, иначе има грешка;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — <strong>десният<\/strong> списък се повтаря, за да стане колкото левия;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — <strong>левият<\/strong> списък се повтаря, за да стане колкото десния;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — <strong>по-късият<\/strong> списък се повтаря, за да стане колкото по-дългия.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има и унарна форма, само с един операнд.<\/span> <span class=\"sg\" data-s=\"1\">Тя извиква метод върху всеки елемент.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> превръща всеки низ в главни букви:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хипер операциите показват също, че работата <em>може<\/em> да се свърши паралелно.<\/span> <span class=\"sg\" data-s=\"1\">По-късно ще видите свързания метод <code>.hyper<\/code> в <a href=\"https://course.raku.org/bg/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">раздела за конкурентно програмиране<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрицание — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако поставите <code>!<\/code> пред оператор за сравнение, получавате обратния резултат.<\/span> <span class=\"sg\" data-s=\"1\">Познатият <code>!=<\/code> (не е равно) е точно този метаоператор, използван с <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Същото работи и за други булеви оператори, като <code>eq<\/code> и <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — не са равни като низове\nsay 5 !%% 2;     # True  — 5 не се дели на 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Накратко, <code>$a !op $b<\/code> е просто по-подреден начин да запишете <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Това е нарочно.<\/span> <span class=\"sg\" data-s=\"1\">Някои езици, като есперанто, са малки и прости нарочно.<\/span> <span class=\"sg\" data-s=\"2\">Те се стремят да имат един правилен начин да се каже всяко нещо.<\/span> <span class=\"sg\" data-s=\"3\">Raku е различен и с удоволствие ви дава няколко начина.<\/span> <span class=\"sg\" data-s=\"4\">Затова отрицателният <code>!eq<\/code> съществува точно до специалния оператор <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Двата означават точно едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — същата проверка като 'a' !eq 'b'<\/code><\/pre>"]]},"eo":{"t":"Kruca, hiper kaj neita","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom redukto kaj zipado, Raku havas plurajn aliajn meta-operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Nun estas utile koni tri el ili.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kruca — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La kruca meta-operatoro <code>X<\/code> prenas du listojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi parigas <strong>ĉiun<\/strong> elementon de unu kun <strong>ĉiu<\/strong> elemento de la alia.<\/span> <span class=\"sg\" data-s=\"2\">Oni nomas tion la kartezia produkto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel zipado, ĝi povas ĉirkaŭi operatoron, kiu tiam laboras kun ĉiu paro.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> kunigas ĉiun paron en ĉenon, kaj <code>X*<\/code> multobligas la valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zipado iras tra du listoj flanko ĉe flanko, dum krucado kombinas ilin en ĉiuj eblaj manieroj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hipera — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hipera meta-operatoro aplikas operatoron al <strong>ĉiu elemento<\/strong> de listo.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro iras en la pintajn krampojn <code>»…«<\/code>, aŭ en la askian formon <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kun du listoj, ĝi laboras elemento post elemento, kiel zipado.<\/span> <span class=\"sg\" data-s=\"3\">Kun unu sola valoro ĉe unu flanko, ĝi etendas tiun valoron tra la tuta listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La du sagoj ne devas montri al la sama direkto.<\/span> <span class=\"sg\" data-s=\"1\">Ilia direkto decidas, kio okazas, kiam la listoj havas malsamajn longojn.<\/span> <span class=\"sg\" data-s=\"2\">Se sago montras <strong>al<\/strong> listo, tiu listo povas ripetiĝi por egali la alian.<\/span> <span class=\"sg\" data-s=\"3\">Jen la kvar kombinoj, skribitaj askie per <code>&lt;&lt;<\/code> kaj <code>&gt;&gt;<\/code>:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — neniu listo ripetiĝas, do la listoj devas jam havi la saman longon, alie estas eraro;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — la <strong>dekstra<\/strong> listo ripetiĝas por egali la maldekstran;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — la <strong>maldekstra<\/strong> listo ripetiĝas por egali la dekstran;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — la <strong>pli mallonga<\/strong> listo ripetiĝas por egali la pli longan.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repeats to 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ekzistas ankaŭ unuargumenta formo, kun nur unu operando.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi vokas metodon sur ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> ŝanĝas ĉiun ĉenon al majuskloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hiperaj operacioj ankaŭ montras, ke la laboro <em>povas<\/em> esti farata paralele.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidos la rilatan metodon <code>.hyper<\/code> poste, en <a href=\"https://course.raku.org/eo/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">la sekcio pri samtempa programado<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neiga — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi metas <code>!<\/code> antaŭ komparan operatoron, vi ricevas la malan rezulton.<\/span> <span class=\"sg\" data-s=\"1\">La konata <code>!=<\/code> (ne-egala) estas ĝuste ĉi tiu meta-operatoro uzata kun <code>==<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La samo funkcias por aliaj buleaj operatoroj, kiel <code>eq<\/code> kaj <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — ne-egalaj kiel ĉenoj\nsay 5 !%% 2;     # True  — 5 ne estas dividebla per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Resume, <code>$a !op $b<\/code> estas nur pli neta maniero skribi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Tio estas intenca.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj lingvoj, kiel Esperanto, estas intence malgrandaj kaj simplaj.<\/span> <span class=\"sg\" data-s=\"2\">Ili celas havi unu regulan manieron diri ĉiun aferon.<\/span> <span class=\"sg\" data-s=\"3\">Raku estas malsama kaj volonte donas al vi plurajn manierojn.<\/span> <span class=\"sg\" data-s=\"4\">Do la neiga <code>!eq<\/code> ekzistas tuj apud la speciala operatoro <code>ne<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La du signifas ĝuste la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — la sama testo kiel 'a' !eq 'b'<\/code><\/pre>"]]},"la":{"t":"Crux, hyper, et negati","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter reductionem et zip, Raku plures alios meta-operatores habet.<\/span> <span class=\"sg\" data-s=\"1\">Tres ex eis nunc cognoscere utile est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cross — <code>X<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Meta-operator cross <code>X<\/code> duas listas accipit.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Omne<\/strong> elementum unius cum <strong>omni<\/strong> elemento alterius coniungit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc productum Cartesianum vocatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X &lt;1 2&gt;; # ((a 1) (a 2) (b 1) (b 2))<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut zip, operatorem involvere potest, qui deinde in quoque pari agit.<\/span> <span class=\"sg\" data-s=\"1\"><code>X~<\/code> quodque par in filum coniungit, et <code>X*<\/code> valores multiplicat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b&gt; X~ &lt;1 2&gt;;         # (a1 a2 b1 b2)\nsay (1, 2, 3) X* (10, 100); # (10 100 20 200 30 300)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zip duas listas simul percurrit, cross autem eas omnibus modis possibilibus coniungit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hyper — <code>»…«<\/code><\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Meta-operator hyper operatorem ad <strong>unumquodque elementum<\/strong> listae applicat.<\/span> <span class=\"sg\" data-s=\"1\">Operator intra uncos acutos <code>»…«<\/code> stat, vel intra formam ASCII <code>&gt;&gt;…&lt;&lt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cum duabus listis elementum per elementum operatur, sicut zip.<\/span> <span class=\"sg\" data-s=\"3\">Cum uno valore ab una parte, illum valorem per totam listam extendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3) »+» (10, 20, 30); # (11 22 33)\nsay (1, 2, 3) »*» 2;            # (2 4 6)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Duae sagittae non debent in eandem partem spectare.<\/span> <span class=\"sg\" data-s=\"1\">Directio earum decernit quid fiat cum listae diversas longitudines habent.<\/span> <span class=\"sg\" data-s=\"2\">Si sagitta <strong>ad<\/strong> listam spectat, illa lista repeti potest ut alteri respondeat.<\/span> <span class=\"sg\" data-s=\"3\">Hic sunt quattuor combinationes, in ASCII cum <code>&lt;&lt;<\/code> et <code>&gt;&gt;<\/code> scriptae:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>&gt;&gt;op&lt;&lt;<\/code> — nulla lista repetitur, itaque listae iam eandem longitudinem habere debent, aut error est;<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>&gt;&gt;op&gt;&gt;<\/code> — lista <strong>dextra<\/strong> repetitur ut sinistrae respondeat;<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>&lt;&lt;op&lt;&lt;<\/code> — lista <strong>sinistra<\/strong> repetitur ut dextrae respondeat;<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>&lt;&lt;op&gt;&gt;<\/code> — lista <strong>brevior<\/strong> repetitur ut longiori respondeat.<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3, 4) &lt;&lt;+&gt;&gt; (10, 20); # (11 22 13 24)  — 10, 20 repetitur ad 10, 20, 10, 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Est etiam forma unaria, cum uno tantum operando.<\/span> <span class=\"sg\" data-s=\"1\">Methodum in omni elemento vocat.<\/span> <span class=\"sg\" data-s=\"2\"><code>&gt;&gt;.uc<\/code> quodque filum in maiusculas convertit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;raku perl&gt;&gt;&gt;.uc; # (RAKU PERL)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operationes hyper etiam ostendunt opus paralleliter fieri <em>posse<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Methodum cognatam <code>.hyper<\/code> postea videbis, in <a href=\"https://course.raku.org/la/paradigms/hyper-race/\" target=\"_blank\" rel=\"noopener\">sectione de programmatione concurrenti<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Negatus — <code>!<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si <code>!<\/code> ante operatorem comparationis ponis, eventum contrarium accipis.<\/span> <span class=\"sg\" data-s=\"1\">Notus <code>!=<\/code> (non aequalis) est exacte hic meta-operator cum <code>==<\/code> adhibitus.<\/span> <span class=\"sg\" data-s=\"2\">Idem operatur pro aliis operatoribus Booleanis, ut <code>eq<\/code> et <code>%%<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 != 4;      # True\nsay 'a' !eq 'b'; # True  — non aequales ut fila\nsay 5 !%% 2;     # True  — 5 non est divisibilis per 2<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Breviter, <code>$a !op $b<\/code> est tantum modus elegantior scribendi <code>!($a op $b)<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hoc de industria est.<\/span> <span class=\"sg\" data-s=\"1\">Quaedam linguae, ut Esperanto, de industria parvae et simplices sunt.<\/span> <span class=\"sg\" data-s=\"2\">Pro quaque re unum modum regularem habere volunt.<\/span> <span class=\"sg\" data-s=\"3\">Raku non talis est et libenter tibi plures modos dat.<\/span> <span class=\"sg\" data-s=\"4\">Ergo negatus <code>!eq<\/code> iuxta operatorem specialem <code>ne<\/code> exstat.<\/span> <span class=\"sg\" data-s=\"5\">Ambo exacte idem significant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'a' ne 'b'; # True — idem experimentum ac 'a' !eq 'b'<\/code><\/pre>"]]}}}</script>
