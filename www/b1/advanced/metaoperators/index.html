<script type="application/json" id="page-data">{"u":"advanced/metaoperators","n":544,"k":"section","pv":"advanced/operators-overview/quiz","nx":"advanced/metaoperators/reduction","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Meta-operators","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>meta-operator<\/em> is not an operator by itself.<\/span> <span class=\"sg\" data-s=\"1\">It goes around an ordinary operator and turns it into a new one.<\/span> <span class=\"sg\" data-s=\"2\">For example, it can apply one operator to a whole list of values at once.<\/span> <span class=\"sg\" data-s=\"3\">Then you do not have to write the operator between every pair of values.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku has several meta-operators.<\/span> <span class=\"sg\" data-s=\"1\">This section covers the most useful groups of them.<\/span> <span class=\"sg\" data-s=\"2\">A <em>reduction<\/em> turns a list into a single value.<\/span> <span class=\"sg\" data-s=\"3\">A <em>zip<\/em> combines two lists element by element.<\/span> <span class=\"sg\" data-s=\"4\">The last page covers the <em>cross<\/em>, <em>hyper<\/em>, and <em>negated<\/em> operators.<\/span><\/p>"]]},"de":{"t":"Meta-Operatoren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Meta-Operator<\/em> ist kein Operator für sich allein.<\/span> <span class=\"sg\" data-s=\"1\">Er legt sich um einen gewöhnlichen Operator und macht daraus einen neuen.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann er einen Operator auf eine ganze Liste von Werten auf einmal anwenden.<\/span> <span class=\"sg\" data-s=\"3\">Dann müssen Sie den Operator nicht zwischen jedes Paar von Werten schreiben.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku hat mehrere Meta-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt behandelt die nützlichsten Gruppen davon.<\/span> <span class=\"sg\" data-s=\"2\">Eine <em>Reduktion<\/em> macht aus einer Liste einen einzigen Wert.<\/span> <span class=\"sg\" data-s=\"3\">Ein <em>Zip<\/em> verbindet zwei Listen Element für Element.<\/span> <span class=\"sg\" data-s=\"4\">Die letzte Seite behandelt die <em>Kreuz-<\/em>, <em>Hyper-<\/em> und <em>negierten<\/em> Operatoren.<\/span><\/p>"]]},"nl":{"t":"Meta-operatoren","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>meta-operator<\/em> is zelf geen operator.<\/span> <span class=\"sg\" data-s=\"1\">Hij zit om een gewone operator heen en maakt er een nieuwe van.<\/span> <span class=\"sg\" data-s=\"2\">Hij kan bijvoorbeeld één operator in één keer op een hele lijst waarden toepassen.<\/span> <span class=\"sg\" data-s=\"3\">Dan hoef je de operator niet tussen elk paar waarden te schrijven.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku heeft verschillende meta-operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte behandelt de nuttigste groepen daarvan.<\/span> <span class=\"sg\" data-s=\"2\">Een <em>reductie<\/em> maakt van een lijst één enkele waarde.<\/span> <span class=\"sg\" data-s=\"3\">Een <em>zip<\/em> combineert twee lijsten element voor element.<\/span> <span class=\"sg\" data-s=\"4\">De laatste pagina behandelt de <em>cross<\/em>-, <em>hyper<\/em>- en <em>genegeerde<\/em> operatoren.<\/span><\/p>"]]},"es":{"t":"Metaoperadores","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operador<\/em> no es un operador por sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Envuelve un operador normal y lo convierte en uno nuevo.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, puede aplicar un operador a toda una lista de valores a la vez.<\/span> <span class=\"sg\" data-s=\"3\">Así no tienes que escribir el operador entre cada par de valores.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku tiene varios meta-operadores.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección trata sus grupos más útiles.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>reducción<\/em> convierte una lista en un único valor.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>zip<\/em> combina dos listas elemento por elemento.<\/span> <span class=\"sg\" data-s=\"4\">La última página trata los operadores <em>cross<\/em>, <em>hyper<\/em> y <em>negado<\/em>.<\/span><\/p>"]]},"it":{"t":"Meta-operatori","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>meta-operatore<\/em> non è un operatore a sé.<\/span> <span class=\"sg\" data-s=\"1\">Avvolge un operatore normale e lo trasforma in uno nuovo.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, può applicare un operatore a un'intera lista di valori in una volta sola.<\/span> <span class=\"sg\" data-s=\"3\">Così non devi scrivere l'operatore tra ogni coppia di valori.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ha diversi meta-operatori.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione tratta i gruppi più utili.<\/span> <span class=\"sg\" data-s=\"2\">Una <em>riduzione<\/em> trasforma una lista in un singolo valore.<\/span> <span class=\"sg\" data-s=\"3\">Uno <em>zip<\/em> combina due liste elemento per elemento.<\/span> <span class=\"sg\" data-s=\"4\">L'ultima pagina tratta gli operatori <em>cross<\/em>, <em>hyper<\/em> e <em>negato<\/em>.<\/span><\/p>"]]},"lv":{"t":"Metaoperatori","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Metaoperators<\/em> pats par sevi nav operators.<\/span> <span class=\"sg\" data-s=\"1\">Tas apņem parastu operatoru un pārvērš to jaunā operatorā.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, tas var lietot vienu operatoru visam vērtību sarakstam uzreiz.<\/span> <span class=\"sg\" data-s=\"3\">Tad jums nav jāraksta operators starp katru vērtību pāri.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ir vairāki metaoperatori.<\/span> <span class=\"sg\" data-s=\"1\">Šajā sadaļā apskatītas to visnoderīgākās grupas.<\/span> <span class=\"sg\" data-s=\"2\">Tā sauktā <em>redukcija<\/em> pārvērš sarakstu par vienu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Tā sauktais <em>zip<\/em> apvieno divus sarakstus pa elementiem.<\/span> <span class=\"sg\" data-s=\"4\">Pēdējā lapā apskatīti <em>krusteniskais<\/em>, <em>hiper<\/em> un <em>negācijas<\/em> operatori.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> — это не оператор сам по себе.<\/span> <span class=\"sg\" data-s=\"1\">Он оборачивается вокруг обычного оператора и превращает его в новый.<\/span> <span class=\"sg\" data-s=\"2\">Например, он может применить один оператор сразу ко всему списку значений.<\/span> <span class=\"sg\" data-s=\"3\">Тогда не нужно писать оператор между каждой парой значений.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku есть несколько метаоператоров.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе рассказывается о самых полезных их группах.<\/span> <span class=\"sg\" data-s=\"2\">Метаоператор <em>свёртки<\/em> превращает список в одно значение.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператор <em>zip<\/em> объединяет два списка поэлементно.<\/span> <span class=\"sg\" data-s=\"4\">На последней странице речь идёт о <em>перекрёстных<\/em>, <em>гипер-<\/em> и <em>отрицающих<\/em> операторах.<\/span><\/p>"]]},"uk":{"t":"Метаоператори","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператор<\/em> сам по собі не є оператором.<\/span> <span class=\"sg\" data-s=\"1\">Він стоїть навколо звичайного оператора і перетворює його на новий.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, він може застосувати один оператор до цілого списку значень одразу.<\/span> <span class=\"sg\" data-s=\"3\">Тоді не треба писати оператор між кожною парою значень.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У Raku є кілька метаоператорів.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає найкорисніші їхні групи.<\/span> <span class=\"sg\" data-s=\"2\">Метаоператор <em>згортки<\/em> перетворює список на одне значення.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператор <em>zip<\/em> поєднує два списки елемент за елементом.<\/span> <span class=\"sg\" data-s=\"4\">Остання сторінка розглядає <em>перехресний<\/em>, <em>гіпер<\/em>- та <em>заперечний<\/em> оператори.<\/span><\/p>"]]},"bg":{"t":"Метаоператори","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаоператорът<\/em> не е оператор сам по себе си.<\/span> <span class=\"sg\" data-s=\"1\">Той обвива обикновен оператор и го превръща в нов.<\/span> <span class=\"sg\" data-s=\"2\">Например, той може да приложи един оператор към цял списък от стойности наведнъж.<\/span> <span class=\"sg\" data-s=\"3\">Тогава не е нужно да пишете оператора между всяка двойка стойности.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku има няколко метаоператора.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда най-полезните им групи.<\/span> <span class=\"sg\" data-s=\"2\">Метаоператорът за <em>редукция<\/em> превръща списък в една стойност.<\/span> <span class=\"sg\" data-s=\"3\">Метаоператорът <em>zip<\/em> комбинира два списъка елемент по елемент.<\/span> <span class=\"sg\" data-s=\"4\">Последната страница разглежда операторите <em>cross<\/em>, <em>хипер<\/em> и <em>отрицание<\/em>.<\/span><\/p>"]]},"eo":{"t":"Metaoperatoroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operatoro<\/em> ne estas operatoro per si mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĉirkaŭas ordinaran operatoron kaj faras el ĝi novan.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, ĝi povas apliki unu operatoron al tuta listo de valoroj samtempe.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi ne devas skribi la operatoron inter ĉiu paro de valoroj.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku havas plurajn meta-operatorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio traktas la plej utilajn grupojn el ili.<\/span> <span class=\"sg\" data-s=\"2\">La <em>redukto<\/em> faras el listo unu solan valoron.<\/span> <span class=\"sg\" data-s=\"3\">La <em>zipado<\/em> kombinas du listojn elemento post elemento.<\/span> <span class=\"sg\" data-s=\"4\">La lasta paĝo traktas la <em>krucan<\/em>, <em>hiperan<\/em> kaj <em>neigan<\/em> operatorojn.<\/span><\/p>"]]},"la":{"t":"Meta-operatores","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Meta-operator<\/em> non est operator per se.<\/span> <span class=\"sg\" data-s=\"1\">Operatorem ordinarium circumdat et eum in novum convertit.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, unum operatorem ad totam listam valorum simul applicare potest.<\/span> <span class=\"sg\" data-s=\"3\">Tum operatorem inter omne par valorum scribere non debes.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku plures meta-operatores habet.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio familias eorum utilissimas tractat.<\/span> <span class=\"sg\" data-s=\"2\">Familia <em>reductionis<\/em> listam in unum valorem convertit.<\/span> <span class=\"sg\" data-s=\"3\">Familia <em>zip<\/em> duas listas elementum per elementum coniungit.<\/span> <span class=\"sg\" data-s=\"4\">Ultima pagina operatores <em>cross<\/em>, <em>hyper<\/em> et <em>negatos<\/em> tractat.<\/span><\/p>"]]}}}</script>
