<script type="application/json" id="page-data">{"u":"advanced/metaoperators/reduction","n":545,"k":"topic","pv":"advanced/metaoperators","nx":"advanced/metaoperators/reduction/quiz","tr":["advanced","advanced/metaoperators"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Reduction metaoperators","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A reduction meta-operator is an ordinary operator in square brackets, like <code>[+]<\/code> or <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It takes a list of values and puts the operator between every pair of them.<\/span> <span class=\"sg\" data-s=\"2\">In this way, it reduces the whole list to a single value.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For example, <code>[+]<\/code> adds up all the elements of a list:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The code <code>[+] @data<\/code> is the same as writing out the operator by hand:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Any suitable infix operator works in the same way.<\/span> <span class=\"sg\" data-s=\"1\">With <code>[*]<\/code>, you get the product of the list.<\/span> <span class=\"sg\" data-s=\"2\">So you can use it on the range <code>1..$n<\/code> to calculate a factorial easily:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, the range <code>1..$n<\/code> gives the numbers from 1 to 5, and <code>[*]<\/code> multiplies them: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The result is <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">It works for joining strings too.<\/span> <span class=\"sg\" data-s=\"1\">The <code>[~]< s=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi persino ridurre gli operatori di confronto.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> ti dice se ogni valore è più grande di quello che lo precede:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Riduzione triangolare<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se metti un backslash dentro le parentesi quadre, ottieni una riduzione <em>triangolare<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Conserva tutti i risultati intermedi, non solo quello finale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni elemento del risultato è una somma parziale: <code>1<\/code>, poi <code>1+2<\/code>, poi <code>1+2+3<\/code>, e così via.<\/span> <span class=\"sg\" data-s=\"1\">L'ultimo è la somma di tutta la lista.<\/span><\/p>"]]},"lv":{"t":"Reducēšanas metaoperatori","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Redukcijas metaoperators ir parasts operators kvadrātiekavās, piemēram, <code>[+]<\/code> vai <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem vērtību sarakstu un ievieto operatoru starp katru vērtību pāri.<\/span> <span class=\"sg\" data-s=\"2\">Tādā veidā tas samazina visu sarakstu līdz vienai vērtībai.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Piemēram, <code>[+]<\/code> saskaita visus saraksta elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kods <code>[+] @data<\/code> ir tas pats, kas izrakstīt operatoru pilnā formā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jebkurš piemērots infiksa operators darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"1\">Ar <code>[*]<\/code> jūs iegūstat saraksta reizinājumu.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc varat to lietot diapazonam <code>1..$n<\/code>, lai viegli aprēķinātu faktoriālu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit diapazons <code>1..$n<\/code> dod skaitļus no 1 līdz 5, un <code>[*]<\/code> tos sareizina: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas darbojas arī virkņu savienošanai.<\/span> <span class=\"sg\" data-s=\"1\">Redukcija <code>[~]<\/code> savieno virkņu sarakstu vienā virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs varat reducēt pat salīdzināšanas operatorus.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> pasaka, vai katra vērtība ir lielāka par iepriekšējo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Trīsstūra redukcija<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja iekavās ieliekat atpakaļsvītru, jūs iegūstat <em>trīsstūra<\/em> redukciju.<\/span> <span class=\"sg\" data-s=\"1\">Tā saglabā visus starprezultātus, ne tikai gala rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs rezultāta elements ir daļēja summa: <code>1<\/code>, tad <code>1+2<\/code>, tad <code>1+2+3<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Pēdējais ir visa saraksta summa.<\/span><\/p>"]]},"ru":{"t":"Метаоператоры свёртки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаоператор свёртки — это обычный оператор в квадратных скобках, например <code>[+]<\/code> или <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он берёт список значений и ставит оператор между каждой их парой.<\/span> <span class=\"sg\" data-s=\"2\">Так он сворачивает весь список в одно значение.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например, <code>[+]<\/code> складывает все элементы списка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Код <code>[+] @data<\/code> — то же самое, что выписать оператор вручную:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Любой подходящий инфиксный оператор работает так же.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> вы получаете произведение списка.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому, если применить его к диапазону <code>1..$n<\/code>, можно легко вычислить факториал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь диапазон <code>1..$n<\/code> даёт числа от 1 до 5, а <code>[*]<\/code> перемножает их: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат — <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это работает и для соединения строк.<\/span> <span class=\"sg\" data-s=\"1\">Свёртка <code>[~]<\/code> соединяет список строк в одну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно сворачивать даже операторы сравнения.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> сообщает, больше ли каждое значение, чем предыдущее:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Треугольная свёртка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если поставить внутри скобок обратную косую черту, получится <em>треугольная<\/em> свёртка.<\/span> <span class=\"sg\" data-s=\"1\">Она сохраняет все промежуточные результаты, а не только итоговый:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый элемент результата — частичная сумма: <code>1<\/code>, затем <code>1+2<\/code>, затем <code>1+2+3<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"1\">Последний из них — сумма всего списка.<\/span><\/p>"]]},"uk":{"t":"Метаоператори згортки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаоператор згортки — це звичайний оператор у квадратних дужках, як-от <code>[+]<\/code> або <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він бере список значень і ставить оператор між кожною їхньою парою.<\/span> <span class=\"sg\" data-s=\"2\">Так він згортає весь список до одного значення.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Наприклад, <code>[+]<\/code> додає всі елементи списку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Код <code>[+] @data<\/code> — це те саме, що виписати оператор вручну:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Будь-який відповідний інфіксний оператор працює так само.<\/span> <span class=\"sg\" data-s=\"1\">З <code>[*]<\/code> ви отримуєте добуток списку.<\/span> <span class=\"sg\" data-s=\"2\">Тож можна застосувати його до діапазону <code>1..$n<\/code> і легко обчислити факторіал:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут діапазон <code>1..$n<\/code> дає числа від 1 до 5, а <code>[*]<\/code> їх перемножує: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Результат — <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це працює і для з'єднання рядків.<\/span> <span class=\"sg\" data-s=\"1\">Згортка <code>[~]<\/code> з'єднує список рядків в один:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можна згортати навіть оператори порівняння.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> повідомляє, чи кожне значення більше за попереднє:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Трикутна згортка<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо поставити всередині дужок зворотну косу риску, ви отримаєте <em>трикутну<\/em> згортку.<\/span> <span class=\"sg\" data-s=\"1\">Вона зберігає всі проміжні результати, а не лише кінцевий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен елемент результату — це часткова сума: <code>1<\/code>, потім <code>1+2<\/code>, потім <code>1+2+3<\/code> і так далі.<\/span> <span class=\"sg\" data-s=\"1\">Останній із них — сума всього списку.<\/span><\/p>"]]},"bg":{"t":"Метаоператори за редукция","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаоператорът за редукция е обикновен оператор в квадратни скоби, като <code>[+]<\/code> или <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той взима списък от стойности и поставя оператора между всяка двойка от тях.<\/span> <span class=\"sg\" data-s=\"2\">Така той свежда целия списък до една стойност.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Например <code>[+]<\/code> събира всички елементи на списък:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кодът <code>[+] @data<\/code> е същото като да изпишете оператора на ръка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки подходящ инфиксен оператор работи по същия начин.<\/span> <span class=\"sg\" data-s=\"1\">С <code>[*]<\/code> получавате произведението на списъка.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да го използвате върху диапазона <code>1..$n<\/code>, за да пресметнете лесно факториел:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук диапазонът <code>1..$n<\/code> дава числата от 1 до 5, а <code>[*]<\/code> ги умножава: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това работи и за съединяване на низове.<\/span> <span class=\"sg\" data-s=\"1\">Редукцията <code>[~]<\/code> съединява списък от низове в един:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да редуцирате дори оператори за сравнение.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> ви казва дали всяка стойност е по-голяма от предишната:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Триъгълна редукция<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако поставите обратна наклонена черта вътре в скобите, получавате <em>триъгълна<\/em> редукция.<\/span> <span class=\"sg\" data-s=\"1\">Тя пази всички междинни резултати, а не само крайния:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент от резултата е частична сума: <code>1<\/code>, после <code>1+2<\/code>, после <code>1+2+3<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"1\">Последният е сумата на целия списък.<\/span><\/p>"]]},"eo":{"t":"Reduktaj metaoperatoroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Redukta meta-operatoro estas ordinara operatoro en kvadrataj krampoj, kiel <code>[+]<\/code> aŭ <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas liston de valoroj kaj metas la operatoron inter ĉiun paron el ili.<\/span> <span class=\"sg\" data-s=\"2\">Tiel ĝi reduktas la tutan liston al unu sola valoro.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekzemple, <code>[+]<\/code> sumigas ĉiujn elementojn de listo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La kodo <code>[+] @data<\/code> estas same kiel skribi la operatoron mane:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu taŭga infiksa operatoro funkcias same.<\/span> <span class=\"sg\" data-s=\"1\">Per <code>[*]<\/code>, vi ricevas la produkton de la listo.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas uzi ĝin kun la gamo <code>1..$n<\/code> por facile kalkuli faktorialon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la gamo <code>1..$n<\/code> donas la nombrojn de 1 ĝis 5, kaj <code>[*]<\/code> multobligas ilin: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĝi funkcias ankaŭ por kunigi ĉenojn.<\/span> <span class=\"sg\" data-s=\"1\">La redukto <code>[~]<\/code> kunigas liston de ĉenoj en unu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi eĉ povas redukti komparajn operatorojn.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> diras al vi, ĉu ĉiu valoro estas pli granda ol tiu antaŭ ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Triangula redukto<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi metas retrokliniĝon ene de la krampoj, vi ricevas <em>triangulan<\/em> redukton.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi konservas ĉiujn mezajn rezultojn, ne nur la finan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu elemento de la rezulto estas parta sumo: <code>1<\/code>, poste <code>1+2<\/code>, poste <code>1+2+3<\/code>, kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"1\">La lasta estas la sumo de la tuta listo.<\/span><\/p>"]]},"la":{"t":"Reductionis meta-operatores","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Meta-operator reductionis est operator ordinarius in uncis quadratis, ut <code>[+]<\/code> vel <code>[*]<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Listam valorum accipit et operatorem inter omne par eorum ponit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc modo totam listam ad unum valorem reducit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Exempli gratia, <code>[+]<\/code> omnia elementa listae addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7, 9, 11;\nsay [+] @data; # 35<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Codex <code>[+] @data<\/code> idem est ac operatorem manu scribere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 5 + 7 + 9 + 11; # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quilibet operator infixus idoneus eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>[*]<\/code> productum listae accipis.<\/span> <span class=\"sg\" data-s=\"2\">Ergo eum ad intervallum <code>1..$n<\/code> applicare potes ut factorialem facile computes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $n = 5;\nsay [*] 1..$n; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic intervallum <code>1..$n<\/code> numeros ab 1 ad 5 dat, et <code>[*]<\/code> eos multiplicat: <code>1 * 2 * 3 * 4 * 5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eventus est <em>5!<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam ad fila coniungenda operatur.<\/span> <span class=\"sg\" data-s=\"1\">Reductio <code>[~]<\/code> listam filorum in unum coniungit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @strings = &lt;neun hundert fünf und zwanzig&gt;;\nsay [~] @strings; # neunhundertfünfundzwanzig<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam operatores comparationis reducere potes.<\/span> <span class=\"sg\" data-s=\"1\"><code>[&lt;]<\/code> tibi dicit an omnis valor maior sit quam valor prior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [&lt;] 1, 2, 3; # True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Reductio triangularis<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si lineam obliquam inversam intra uncos ponis, reductionem <em>triangularem<\/em> accipis.<\/span> <span class=\"sg\" data-s=\"1\">Omnes eventus intermedios servat, non tantum ultimum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say [\\+] 1..5; # (1 3 6 10 15)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quodque elementum eventus est summa partialis: <code>1<\/code>, deinde <code>1+2<\/code>, deinde <code>1+2+3<\/code>, et ita porro.<\/span> <span class=\"sg\" data-s=\"1\">Ultimum est summa totius listae.<\/span><\/p>"]]}}}</script>
