<script type="application/json" id="page-data">{"u":"advanced/signatures","n":629,"k":"section","pv":"advanced/statement-prefixes/exercises/silence-warning/solution","nx":"advanced/signatures/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Signatures","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you <a href=\"/essentials/functions/\">defined subroutines with positional and named parameters<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You also gave the parameters default values.<\/span> <span class=\"sg\" data-s=\"2\">The list of parameters is called the <em>signature<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">This section shows two more things that a signature can do.<\/span> <span class=\"sg\" data-s=\"4\">It can make a parameter optional, and it can collect any number of extra arguments.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optional parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A parameter with a question mark after it is <em>optional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This means that the caller may leave it out.<\/span> <span class=\"sg\" data-s=\"2\">In that case, the parameter is undefined.<\/span> <span class=\"sg\" data-s=\"3\">So you can give it a fallback value with the defined-or operator <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When <code>greet<\/code> is called with one argument, <code>$greeting<\/code> is undefined.<\/span> <span class=\"sg\" data-s=\"1\">So <code>//<\/code> uses <code>'Hello'<\/code> instead.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A parameter marked with a <code>*<\/code> is <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It takes all the remaining arguments.<\/span> <span class=\"sg\" data-s=\"2\">A slurpy array, written <code>*@<\/code>, collects any number of positional arguments into an array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can mix ordinary parameters with a slurpy one.<\/span> <span class=\"sg\" data-s=\"1\">The fixed parameters get their values first.<\/span> <span class=\"sg\" data-s=\"2\">Whatever is left goes into the slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A slurpy hash works in the same way.<\/span> <span class=\"sg\" data-s=\"1\">You write it as <code>*%<\/code>, and it collects any extra named arguments into a hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The two named arguments become keys in <code>%options<\/code>, so the program prints:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"de":{"t":"Signaturen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Im Abschnitt „Grundlagen“ haben Sie <a href=\"https://course.raku.org/de/essentials/functions/\" target=\"_blank\" rel=\"noopener\">Subroutinen mit positionalen und benannten Parametern definiert<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sie haben den Parametern auch Standardwerte gegeben.<\/span> <span class=\"sg\" data-s=\"2\">Die Liste der Parameter heißt <em>Signatur<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt zwei weitere Dinge, die eine Signatur kann.<\/span> <span class=\"sg\" data-s=\"4\">Sie kann einen Parameter optional machen, und sie kann beliebig viele zusätzliche Argumente sammeln.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optionale Parameter<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Parameter mit einem Fragezeichen dahinter ist <em>optional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das heißt, dass der Aufrufer ihn weglassen darf.<\/span> <span class=\"sg\" data-s=\"2\">In diesem Fall ist der Parameter undefiniert.<\/span> <span class=\"sg\" data-s=\"3\">Also können Sie ihm mit dem Defined-or-Operator <code>//<\/code> einen Ersatzwert geben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn <code>greet<\/code> mit einem Argument aufgerufen wird, ist <code>$greeting<\/code> undefiniert.<\/span> <span class=\"sg\" data-s=\"1\">Also nimmt <code>//<\/code> stattdessen <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy-Parameter<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Parameter, der mit <code>*<\/code> markiert ist, ist <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Er nimmt alle restlichen Argumente.<\/span> <span class=\"sg\" data-s=\"2\">Ein Slurpy-Array, geschrieben als <code>*@<\/code>, sammelt beliebig viele positionale Argumente in einem Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können gewöhnliche Parameter mit einem Slurpy-Parameter mischen.<\/span> <span class=\"sg\" data-s=\"1\">Die festen Parameter bekommen zuerst ihre Werte.<\/span> <span class=\"sg\" data-s=\"2\">Was übrig bleibt, kommt in das Slurpy-Array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Slurpy-Hash funktioniert genauso.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben ihn als <code>*%<\/code>, und er sammelt alle zusätzlichen benannten Argumente in einem Hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die beiden benannten Argumente werden Schlüssel in <code>%options<\/code>, also gibt das Programm aus:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"nl":{"t":"Signaturen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <a href=\"https://course.raku.org/nl/essentials/functions/\" target=\"_blank\" rel=\"noopener\">subroutines gedefinieerd met positionele en benoemde parameters<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je gaf de parameters ook standaardwaarden.<\/span> <span class=\"sg\" data-s=\"2\">De lijst van parameters heet de <em>signatuur<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dit onderdeel laat nog twee dingen zien die een signatuur kan doen.<\/span> <span class=\"sg\" data-s=\"4\">Ze kan een parameter optioneel maken, en ze kan elk aantal extra argumenten verzamelen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Optionele parameters<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een parameter met een vraagteken erachter is <em>optioneel<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat de aanroeper hem mag weglaten.<\/span> <span class=\"sg\" data-s=\"2\">In dat geval is de parameter ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt hem dus een terugvalwaarde geven met de defined-or-operator <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als <code>greet<\/code> met één argument wordt aangeroepen, is <code>$greeting<\/code> ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"1\">Daarom gebruikt <code>//<\/code> in plaats daarvan <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy parameters<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een parameter die gemarkeerd is met een <code>*<\/code>, is <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hij neemt alle overige argumenten.<\/span> <span class=\"sg\" data-s=\"2\">Een slurpy array, geschreven als <code>*@<\/code>, verzamelt elk aantal positionele argumenten in een array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt gewone parameters mengen met een slurpy parameter.<\/span> <span class=\"sg\" data-s=\"1\">De vaste parameters krijgen eerst hun waarden.<\/span> <span class=\"sg\" data-s=\"2\">Wat overblijft, gaat naar de slurpy array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een slurpy hash werkt op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft hem als <code>*%<\/code>, en hij verzamelt alle extra benoemde argumenten in een hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De twee benoemde argumenten worden sleutels in <code>%options<\/code>, dus het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"es":{"t":"Firmas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la parte de Fundamentos, <a href=\"https://course.raku.org/es/essentials/functions/\" target=\"_blank\" rel=\"noopener\">definiste subrutinas con parámetros posicionales y nombrados<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">También diste valores predeterminados a los parámetros.<\/span> <span class=\"sg\" data-s=\"2\">La lista de parámetros se llama <em>firma<\/em> (signature).<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra dos cosas más que puede hacer una firma.<\/span> <span class=\"sg\" data-s=\"4\">Puede hacer opcional un parámetro y puede recoger cualquier número de argumentos extra.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros opcionales<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un parámetro con un signo de interrogación detrás es <em>opcional<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que quien llama a la función puede dejarlo fuera.<\/span> <span class=\"sg\" data-s=\"2\">En ese caso, el parámetro queda indefinido.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes darle un valor de respaldo con el operador defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando se llama a <code>greet<\/code> con un argumento, <code>$greeting<\/code> queda indefinido.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>//<\/code> usa <code>'Hello'<\/code> en su lugar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parámetros slurpy<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un parámetro marcado con un <code>*<\/code> es <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Toma todos los argumentos que quedan.<\/span> <span class=\"sg\" data-s=\"2\">Un array slurpy, escrito <code>*@<\/code>, recoge cualquier número de argumentos posicionales en un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes mezclar parámetros normales con uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">Los parámetros fijos reciben sus valores primero.<\/span> <span class=\"sg\" data-s=\"2\">Lo que queda va al array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un hash slurpy funciona de la misma manera.<\/span> <span class=\"sg\" data-s=\"1\">Se escribe <code>*%<\/code> y recoge cualquier argumento nombrado extra en un hash:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Los dos argumentos nombrados se convierten en claves de <code>%options<\/code>, así que el programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"it":{"t":"Firme","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai <a href=\"https://course.raku.org/it/essentials/functions/\" target=\"_blank\" rel=\"noopener\">definito subroutine con parametri posizionali e nominati<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Hai anche dato ai parametri valori predefiniti.<\/span> <span class=\"sg\" data-s=\"2\">La lista dei parametri si chiama <em>signature<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra altre due cose che una signature può fare.<\/span> <span class=\"sg\" data-s=\"4\">Può rendere opzionale un parametro, e può raccogliere un numero qualsiasi di argomenti in più.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri opzionali<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un parametro seguito da un punto interrogativo è <em>opzionale<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Questo vuol dire che il chiamante può ometterlo.<\/span> <span class=\"sg\" data-s=\"2\">In quel caso, il parametro è indefinito.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi dargli un valore di riserva con l'operatore defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando <code>greet<\/code> viene chiamata con un solo argomento, <code>$greeting<\/code> è indefinito.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>//<\/code> usa invece <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri slurpy<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un parametro segnato con un <code>*<\/code> è <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Prende tutti gli argomenti rimanenti.<\/span> <span class=\"sg\" data-s=\"2\">Un array slurpy, scritto <code>*@<\/code>, raccoglie un numero qualsiasi di argomenti posizionali in un array:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi mescolare parametri normali con uno slurpy.<\/span> <span class=\"sg\" data-s=\"1\">I parametri fissi ricevono per primi i loro valori.<\/span> <span class=\"sg\" data-s=\"2\">Quello che resta va nell'array slurpy:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un hash slurpy funziona allo stesso modo.<\/span> <span class=\"sg\" data-s=\"1\">Lo scrivi come <code>*%<\/code>, e raccoglie in un hash tutti gli argomenti nominati in più:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">I due argomenti nominati diventano chiavi in <code>%options<\/code>, quindi il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"lv":{"t":"Paraksti","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs <a href=\"https://course.raku.org/lv/essentials/functions/\" target=\"_blank\" rel=\"noopener\">definējāt apakšprogrammas ar pozicionāliem un nosauktiem parametriem<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs arī devāt parametriem noklusējuma vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Parametru sarakstu sauc par <em>signatūru<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda vēl divas lietas, ko signatūra var darīt.<\/span> <span class=\"sg\" data-s=\"4\">Tā var padarīt parametru neobligātu, un tā var savākt jebkuru skaitu papildu argumentu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Neobligatie parametri<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametrs ar jautājuma zīmi aiz tā ir <em>neobligāts<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka izsaucējs var to izlaist.<\/span> <span class=\"sg\" data-s=\"2\">Tādā gadījumā parametrs ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat tam dot rezerves vērtību ar definēts-vai operatoru <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad <code>greet<\/code> izsauc ar vienu argumentu, <code>$greeting<\/code> ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>//<\/code> tā vietā izmanto <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzsucosie parametri<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametrs, kas atzīmēts ar <code>*<\/code>, ir <em>uzsūcošs<\/em> (slurpy).<\/span> <span class=\"sg\" data-s=\"1\">Tas paņem visus atlikušos argumentus.<\/span> <span class=\"sg\" data-s=\"2\">Uzsūcošs masīvs, ko raksta kā <code>*@<\/code>, savāc jebkuru skaitu pozicionālo argumentu masīvā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat jaukt parastus parametrus ar uzsūcošu.<\/span> <span class=\"sg\" data-s=\"1\">Fiksētie parametri saņem vērtības pirmie.<\/span> <span class=\"sg\" data-s=\"2\">Viss, kas paliek pāri, nonāk uzsūcošajā masīvā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzsūcošs hešs darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"1\">To raksta kā <code>*%<\/code>, un tas savāc visus papildu nosauktos argumentus hešā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Abi nosauktie argumenti kļūst par atslēgām hešā <code>%options<\/code>, tāpēc programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"ru":{"t":"Сигнатуры","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В разделе \"Основы\" вы <a href=\"https://course.raku.org/ru/essentials/functions/\" target=\"_blank\" rel=\"noopener\">определяли подпрограммы с позиционными и именованными параметрами<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё вы задавали параметрам значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"2\">Список параметров называется <em>сигнатурой<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе показаны ещё две вещи, которые умеет сигнатура.<\/span> <span class=\"sg\" data-s=\"4\">Она может сделать параметр необязательным и может собрать любое количество дополнительных аргументов.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необязательные параметры<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Параметр, после которого стоит знак вопроса, — <em>необязательный<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что при вызове его можно не указывать.<\/span> <span class=\"sg\" data-s=\"2\">В этом случае параметр не определён.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому ему можно дать запасное значение с помощью оператора defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда <code>greet<\/code> вызывается с одним аргументом, <code>$greeting<\/code> не определён.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>//<\/code> подставляет вместо него <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Поглощающие параметры<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметр, помеченный символом <code>*<\/code>, — <em>поглощающий<\/em> (slurpy).<\/span> <span class=\"sg\" data-s=\"1\">Он забирает все оставшиеся аргументы.<\/span> <span class=\"sg\" data-s=\"2\">Поглощающий массив, который пишется как <code>*@<\/code>, собирает любое количество позиционных аргументов в массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обычные параметры можно сочетать с поглощающим.<\/span> <span class=\"sg\" data-s=\"1\">Фиксированные параметры получают свои значения первыми.<\/span> <span class=\"sg\" data-s=\"2\">Всё, что осталось, попадает в поглощающий массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Поглощающий хеш работает так же.<\/span> <span class=\"sg\" data-s=\"1\">Вы пишете его как <code>*%<\/code>, и он собирает все дополнительные именованные аргументы в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два именованных аргумента становятся ключами в <code>%options<\/code>, поэтому программа выводит:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"uk":{"t":"Сигнатури","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви <a href=\"https://course.raku.org/uk/essentials/functions/\" target=\"_blank\" rel=\"noopener\">визначали підпрограми з позиційними та іменованими параметрами<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ви також давали параметрам типові значення.<\/span> <span class=\"sg\" data-s=\"2\">Список параметрів називають <em>сигнатурою<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує ще дві речі, які вміє сигнатура.<\/span> <span class=\"sg\" data-s=\"4\">Вона може зробити параметр необов'язковим і може збирати будь-яку кількість зайвих аргументів.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Необов'язкові параметри<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Параметр, після якого стоїть знак питання, — <em>необов'язковий<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що той, хто викликає, може його пропустити.<\/span> <span class=\"sg\" data-s=\"2\">У такому разі параметр невизначений.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете дати йому запасне значення за допомогою оператора «визначене або» <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли <code>greet<\/code> викликано з одним аргументом, <code>$greeting<\/code> невизначений.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>//<\/code> використовує замість нього <code>'Hello'<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Всеїдні параметри<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметр, позначений <code>*<\/code>, — <em>всеїдний<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Він бере всі аргументи, що залишилися.<\/span> <span class=\"sg\" data-s=\"2\">Всеїдний масив, який записують як <code>*@<\/code>, збирає будь-яку кількість позиційних аргументів у масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можна поєднувати звичайні параметри із всеїдним.<\/span> <span class=\"sg\" data-s=\"1\">Сталі параметри отримують свої значення першими.<\/span> <span class=\"sg\" data-s=\"2\">Усе, що лишилося, потрапляє у всеїдний масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеїдний хеш працює так само.<\/span> <span class=\"sg\" data-s=\"1\">Його записують як <code>*%<\/code>, і він збирає всі зайві іменовані аргументи в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Два іменовані аргументи стають ключами в <code>%options<\/code>, тож програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"bg":{"t":"Сигнатури","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ вие <a href=\"https://course.raku.org/bg/essentials/functions/\" target=\"_blank\" rel=\"noopener\">дефинирахте подпрограми с позиционни и именувани параметри<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Също така задавахте на параметрите стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"2\">Списъкът от параметри се нарича <em>сигнатура<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел показва още две неща, които сигнатурата може да прави.<\/span> <span class=\"sg\" data-s=\"4\">Тя може да направи параметър незадължителен и може да събира всякакъв брой допълнителни аргументи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Незадължителни параметри<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Параметър с въпросителен знак след него е <em>незадължителен<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че извикващият може да го пропусне.<\/span> <span class=\"sg\" data-s=\"2\">В този случай параметърът е недефиниран.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да му дадете резервна стойност с оператора defined-or <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато <code>greet<\/code> е извикана с един аргумент, <code>$greeting<\/code> е недефинирана.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>//<\/code> използва <code>'Hello'<\/code> вместо нея.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Slurpy параметри<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметър, отбелязан със <code>*<\/code>, е <em>slurpy<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Той взема всички останали аргументи.<\/span> <span class=\"sg\" data-s=\"2\">Slurpy масив, записан като <code>*@<\/code>, събира всякакъв брой позиционни аргументи в масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да смесвате обикновени параметри със slurpy параметър.<\/span> <span class=\"sg\" data-s=\"1\">Фиксираните параметри получават стойностите си първи.<\/span> <span class=\"sg\" data-s=\"2\">Каквото остане, отива в slurpy масива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Slurpy хешът работи по същия начин.<\/span> <span class=\"sg\" data-s=\"1\">Записва се като <code>*%<\/code> и събира всички допълнителни именувани аргументи в хеш:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Двата именувани аргумента стават ключове в <code>%options<\/code>, затова програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"eo":{"t":"Subskriboj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencoj, vi <a href=\"https://course.raku.org/eo/essentials/functions/\" target=\"_blank\" rel=\"noopener\">difinis subrutinojn kun poziciaj kaj nomitaj parametroj<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ donis al la parametroj defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"2\">La listo de parametroj nomiĝas la <em>subskribo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras du pliajn aferojn, kiujn subskribo povas fari.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi povas fari parametron nedeviga, kaj ĝi povas kolekti ajnan nombron da kromaj argumentoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nedevigaj parametroj<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametro kun demandosigno post ĝi estas <em>nedeviga<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke la vokanto rajtas ellasi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">En tiu kazo la parametro estas nedifinita.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas doni al ĝi rezervan valoron per la difinita-aŭ operatoro <code>//<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam <code>greet<\/code> estas vokata kun unu argumento, <code>$greeting<\/code> estas nedifinita.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>//<\/code> uzas <code>'Hello'<\/code> anstataŭe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Englutaj parametroj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametro markita per <code>*<\/code> estas <em>engluta<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi prenas ĉiujn restantajn argumentojn.<\/span> <span class=\"sg\" data-s=\"2\">Engluta tabelo, skribata <code>*@<\/code>, kolektas ajnan nombron da poziciaj argumentoj en tabelon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas miksi ordinarajn parametrojn kun engluta.<\/span> <span class=\"sg\" data-s=\"1\">La fiksitaj parametroj ricevas siajn valorojn unue.<\/span> <span class=\"sg\" data-s=\"2\">Kio ajn restas, iras en la englutan tabelon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Engluta hako funkcias same.<\/span> <span class=\"sg\" data-s=\"1\">Vi skribas ĝin kiel <code>*%<\/code>, kaj ĝi kolektas ajnajn kromajn nomitajn argumentojn en hakon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La du nomitaj argumentoj fariĝas ŝlosiloj en <code>%options<\/code>, do la programo presas:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]},"la":{"t":"Signaturae","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">In parte Elementorum <a href=\"https://course.raku.org/la/essentials/functions/\" target=\"_blank\" rel=\"noopener\">subprogrammata cum parametris positionalibus et nominatis definivisti<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam valores praedefinitos parametris dedisti.<\/span> <span class=\"sg\" data-s=\"2\">Index parametrorum <em>signatura<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio duas alias res ostendit quas signatura facere potest.<\/span> <span class=\"sg\" data-s=\"4\">Parametrum optionalem facere potest, et quotlibet argumenta superflua colligere potest.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri optionales<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parametrus cum signo interrogationis post se <em>optionalis<\/em> est.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat: vocans eum omittere potest.<\/span> <span class=\"sg\" data-s=\"2\">Tum parametrus indefinitus est.<\/span> <span class=\"sg\" data-s=\"3\">Itaque ei valorem subsidiarium per operatorem defined-or <code>//<\/code> dare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name, $greeting?) {\n    my $g = $greeting // 'Hello';\n    say \"$g, $name!\";\n}\n\ngreet('Anna');           # Hello, Anna!\ngreet('Anna', 'Hi');     # Hi, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum <code>greet<\/code> uno argumento vocatur, <code>$greeting<\/code> indefinitus est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>//<\/code> pro eo <code>'Hello'<\/code> adhibet.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Parametri sorbentes<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametrus signo <code>*<\/code> notatus <em>sorbens<\/em> est.<\/span> <span class=\"sg\" data-s=\"1\">Omnia argumenta reliqua capit.<\/span> <span class=\"sg\" data-s=\"2\">Ordo sorbens, <code>*@<\/code> scriptus, quotlibet argumenta positionalia in ordinem colligit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub count-them(*@items) {\n    say @items.elems;\n}\n\ncount-them(1, 2, 3, 4); # 4\ncount-them('a', 'b');   # 2<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametros ordinarios cum sorbente miscere potes.<\/span> <span class=\"sg\" data-s=\"1\">Parametri fixi primi valores suos accipiunt.<\/span> <span class=\"sg\" data-s=\"2\">Quidquid restat, in ordinem sorbentem it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub titles($name, *@titles) {\n    say \"$name has {@titles.elems} title(s)\";\n}\n\ntitles('Anna', 'Dr', 'Prof'); # Anna has 2 title(s)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mappa sorbens eodem modo operatur.<\/span> <span class=\"sg\" data-s=\"1\">Eam ut <code>*%<\/code> scribis, et omnia argumenta nominata superflua in mappam colligit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub register($name, *%options) {\n    say \"$name: {%options.elems} option(s)\";\n    say \"role is %options&lt;role&gt;\";\n}\n\nregister('Anna', role =&gt; 'admin', active =&gt; True);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Duo argumenta nominata claves in <code>%options<\/code> fiunt, itaque programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Anna: 2 option(s)\nrole is admin<\/code><\/pre>"]]}}}</script>
