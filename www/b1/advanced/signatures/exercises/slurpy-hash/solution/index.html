no enhavas la valorojn de <code>$name<\/code> kaj de la preta <code>$details<\/code>. Tio donas <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Absorptiva nominata argumenta","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub describe($name, *%opts) {\n    my $details = %opts.sort.map({ \"{.key}={.value}\" }).join(', ');\n    \"$name: $details\";\n}\n\nsay describe('Anna', colour =&gt; 'red', size =&gt; 5);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/signatures/slurpy-hash.raku\" target=\"_blank\" rel=\"noopener\">slurpy-hash.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Anna: colour=red, size=5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Parametrus positionalis fixus <code>$name<\/code> primus valorem suum accipit. Deinde sorbens <code>*%opts<\/code> omnia argumenta nominata reliqua in mappam colligit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>%opts.sort<\/code> paria per claves ordinat, itaque exitus semper idem est: <code>colour<\/code> ante <code>size<\/code> venit. <code>.map<\/code> unumquodque par in chordam <code>clavis=valor<\/code> per <code>.key<\/code> et <code>.value<\/code> vertit. Deinde <code>.join(', ')<\/code> chordas coniungit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Chorda finalis valores <code>$name<\/code> et perfecti <code>$details<\/code> includit. Hoc dat <code>Anna: colour=red, size=5<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
