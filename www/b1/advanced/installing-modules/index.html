<script type="application/json" id="page-data">{"u":"advanced/installing-modules","n":723,"k":"section","pv":"advanced/module-introspection/quiz","nx":"advanced/packages","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Installing modules from the web","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">You are not limited to the modules that you write yourself.<\/span> <span class=\"sg\" data-s=\"1\">The Raku community has published a large collection of modules.<\/span> <span class=\"sg\" data-s=\"2\">They cover everything from web frameworks to data formats.<\/span> <span class=\"sg\" data-s=\"3\">You can install them and use them in your own programs.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>zef<\/code> installer<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modules are installed with <code>zef<\/code>, which is the standard module manager.<\/span> <span class=\"sg\" data-s=\"1\">It comes together with Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">To install a module, pass its name to <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> downloads the module together with everything it depends on.<\/span> <span class=\"sg\" data-s=\"1\">Then it runs the tests of the module and installs it.<\/span> <span class=\"sg\" data-s=\"2\">An installed module is on the search path automatically.<\/span> <span class=\"sg\" data-s=\"3\">So a program can load it with a plain <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">No <code>-I<\/code> option is needed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> can also search the ecosystem.<\/span> <span class=\"sg\" data-s=\"1\">It can update or remove modules as well:<\/span><\/p>"],["code",0,"<pre class "<p><span class=\"sg\" data-s=\"0\">Module werden mit <code>zef<\/code> installiert, dem Standard-Modulmanager.<\/span> <span class=\"sg\" data-s=\"1\">Er wird zusammen mit Rakudo geliefert.<\/span> <span class=\"sg\" data-s=\"2\">Um ein Modul zu installieren, gibst du <code>zef<\/code> seinen Namen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> lädt das Modul zusammen mit allem herunter, wovon es abhängt.<\/span> <span class=\"sg\" data-s=\"1\">Dann führt er die Tests des Moduls aus und installiert das Modul.<\/span> <span class=\"sg\" data-s=\"2\">Ein installiertes Modul ist automatisch im Suchpfad.<\/span> <span class=\"sg\" data-s=\"3\">Also kann ein Programm es mit einem einfachen <code>use<\/code> laden.<\/span> <span class=\"sg\" data-s=\"4\">Die Option <code>-I<\/code> wird nicht gebraucht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> kann auch das Ökosystem durchsuchen.<\/span> <span class=\"sg\" data-s=\"1\">Er kann außerdem Module aktualisieren oder entfernen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Woher Module kommen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Veröffentlichte Module gehören zum Raku-<em>Ökosystem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst es dir auf der Website <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a> ansehen.<\/span> <span class=\"sg\" data-s=\"2\">Sie listet die verfügbaren Distributionen und ihre Dokumentation auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Eine Distribution, die zum Teilen gedacht ist, hat eine Beschreibungsdatei namens <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Diese Datei speichert den Namen und die Version der Distribution.<\/span> <span class=\"sg\" data-s=\"2\">Außerdem nennt sie ihre Module und die anderen Distributionen, von denen sie abhängt.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> liest diese Datei.<\/span> <span class=\"sg\" data-s=\"4\">Daraus erfährt <code>zef<\/code>, was er installieren muss und wie die Teile zusammenpassen.<\/span> <span class=\"sg\" data-s=\"5\">Wenn du dein eigenes Modul veröffentlichst, braucht es eine korrekte <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Nur so können alle anderen es installieren.<\/span><\/p>"]]},"nl":{"t":"Modules installeren van het web","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Je bent niet beperkt tot de modules die je zelf schrijft.<\/span> <span class=\"sg\" data-s=\"1\">De Raku-gemeenschap heeft een grote verzameling modules gepubliceerd.<\/span> <span class=\"sg\" data-s=\"2\">Ze gaan over alles, van webframeworks tot dataformaten.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ze installeren en gebruiken in je eigen programma's.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De <code>zef<\/code>-installer<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modules worden geïnstalleerd met <code>zef<\/code>, dat de standaard modulebeheerder is.<\/span> <span class=\"sg\" data-s=\"1\">Het wordt samen met Rakudo geleverd.<\/span> <span class=\"sg\" data-s=\"2\">Om een module te installeren, geef je de naam ervan aan <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> downloadt de module samen met alles waar die van afhankelijk is.<\/span> <span class=\"sg\" data-s=\"1\">Daarna voert het de tests van de module uit en installeert het de module.<\/span> <span class=\"sg\" data-s=\"2\">Een geïnstalleerde module staat automatisch op het zoekpad.<\/span> <span class=\"sg\" data-s=\"3\">Een programma kan hem dus laden met een gewone <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">De optie <code>-I<\/code> is niet nodig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> kan ook het ecosysteem doorzoeken.<\/span> <span class=\"sg\" data-s=\"1\">Daarnaast kan het modules bijwerken of verwijderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Waar modules vandaan komen<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gepubliceerde modules horen bij het Raku-<em>ecosysteem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het bekijken op de website <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Die toont de beschikbare distributies en hun documentatie.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Een distributie die bedoeld is om te delen, heeft een beschrijvingsbestand met de naam <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit bestand legt de naam en de versie van de distributie vast.<\/span> <span class=\"sg\" data-s=\"2\">Het noemt ook de modules die ze levert en de andere distributies waar ze van afhankelijk is.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> leest dit bestand.<\/span> <span class=\"sg\" data-s=\"4\">Daaruit leert <code>zef<\/code> wat het moet installeren en hoe de onderdelen in elkaar passen.<\/span> <span class=\"sg\" data-s=\"5\">Als je je eigen module publiceert, heeft die een correct <code>META6.json<\/code> nodig.<\/span> <span class=\"sg\" data-s=\"6\">Dat zorgt ervoor dat alle anderen hem kunnen installeren.<\/span><\/p>"]]},"es":{"t":"Instalar módulos desde la web","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">No estás limitado a los módulos que escribes tú mismo.<\/span> <span class=\"sg\" data-s=\"1\">La comunidad de Raku ha publicado una gran colección de módulos.<\/span> <span class=\"sg\" data-s=\"2\">Cubren de todo, desde frameworks web hasta formatos de datos.<\/span> <span class=\"sg\" data-s=\"3\">Puedes instalarlos y usarlos en tus propios programas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El instalador <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los módulos se instalan con <code>zef<\/code>, que es el gestor de módulos estándar.<\/span> <span class=\"sg\" data-s=\"1\">Viene junto con Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Para instalar un módulo, pasa su nombre a <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> descarga el módulo junto con todo lo que necesita.<\/span> <span class=\"sg\" data-s=\"1\">Luego ejecuta las pruebas del módulo y lo instala.<\/span> <span class=\"sg\" data-s=\"2\">Un módulo instalado está en la ruta de búsqueda automáticamente.<\/span> <span class=\"sg\" data-s=\"3\">Así que un programa puede cargarlo con un simple <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">No hace falta la opción <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> también puede buscar en el ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Además, puede actualizar o eliminar módulos:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De dónde vienen los módulos<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los módulos publicados forman parte del <em>ecosistema<\/em> de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puedes explorarlo en el sitio web <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Este sitio lista las distribuciones disponibles y su documentación.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Una distribución pensada para compartir tiene un archivo de descripción llamado <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Este archivo guarda el nombre y la versión de la distribución.<\/span> <span class=\"sg\" data-s=\"2\">También lista los módulos que ofrece y las otras distribuciones de las que depende.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> lee este archivo.<\/span> <span class=\"sg\" data-s=\"4\">Con él, <code>zef<\/code> sabe qué instalar y cómo encajan las partes.<\/span> <span class=\"sg\" data-s=\"5\">Si publicas tu propio módulo, necesita un <code>META6.json<\/code> correcto.<\/span> <span class=\"sg\" data-s=\"6\">Eso es lo que permite que todos los demás lo instalen.<\/span><\/p>"]]},"it":{"t":"Installare moduli dal web","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Non sei limitato ai moduli che scrivi tu stesso.<\/span> <span class=\"sg\" data-s=\"1\">La comunità Raku ha pubblicato una grande raccolta di moduli.<\/span> <span class=\"sg\" data-s=\"2\">Coprono di tutto, dai framework web ai formati dati.<\/span> <span class=\"sg\" data-s=\"3\">Puoi installarli e usarli nei tuoi programmi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">L'installer <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I moduli si installano con <code>zef<\/code>, che è il gestore di moduli standard.<\/span> <span class=\"sg\" data-s=\"1\">Viene distribuito insieme a Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Per installare un modulo, passa il suo nome a <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> scarica il modulo insieme a tutto ciò da cui dipende.<\/span> <span class=\"sg\" data-s=\"1\">Poi esegue i test del modulo e lo installa.<\/span> <span class=\"sg\" data-s=\"2\">Un modulo installato è automaticamente nel percorso di ricerca.<\/span> <span class=\"sg\" data-s=\"3\">Così un programma può caricarlo con un semplice <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Non serve l'opzione <code>-I<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> può anche cercare nell'ecosistema.<\/span> <span class=\"sg\" data-s=\"1\">Inoltre può aggiornare o rimuovere moduli:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Da dove provengono i moduli<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I moduli pubblicati fanno parte dell'<em>ecosistema<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Puoi esplorarlo sul sito <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Il sito elenca le distribuzioni disponibili e la loro documentazione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Una distribuzione pensata per essere condivisa ha un file di descrizione chiamato <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo file registra il nome e la versione della distribuzione.<\/span> <span class=\"sg\" data-s=\"2\">Elenca anche i moduli che fornisce e le altre distribuzioni da cui dipende.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> legge questo file.<\/span> <span class=\"sg\" data-s=\"4\">Da qui <code>zef<\/code> capisce cosa installare e come le parti stanno insieme.<\/span> <span class=\"sg\" data-s=\"5\">Se pubblichi un tuo modulo, gli serve un <code>META6.json<\/code> corretto.<\/span> <span class=\"sg\" data-s=\"6\">È questo che permette a tutti gli altri di installarlo.<\/span><\/p>"]]},"lv":{"t":"Moduļu instalēšana no tīmekļa","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot ne tikai tos moduļus, kurus rakstāt pats.<\/span> <span class=\"sg\" data-s=\"1\">Raku kopiena ir publicējusi lielu moduļu kolekciju.<\/span> <span class=\"sg\" data-s=\"2\">Tie aptver visu, sākot no tīmekļa ietvariem līdz datu formātiem.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat tos instalēt un izmantot savās programmās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instalētājs <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduļus instalē ar <code>zef<\/code>, kas ir standarta moduļu pārvaldnieks.<\/span> <span class=\"sg\" data-s=\"1\">Tas nāk kopā ar Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Lai instalētu moduli, nododiet tā nosaukumu <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> lejupielādē moduli kopā ar visu, no kā tas ir atkarīgs.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tas izpilda moduļa testus un instalē to.<\/span> <span class=\"sg\" data-s=\"2\">Instalēts modulis automātiski atrodas meklēšanas ceļā.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc programma var to ielādēt ar vienkāršu <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Opcija <code>-I<\/code> nav vajadzīga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> var arī meklēt ekosistēmā.<\/span> <span class=\"sg\" data-s=\"1\">Tas var arī atjaunināt vai noņemt moduļus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">No kurienes nāk moduļi<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Publicētie moduļi ir daļa no Raku <em>ekosistēmas<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">To var pārlūkot tīmekļa vietnē <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tā uzskaita pieejamās distribūcijas un to dokumentāciju.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Distribūcijai, kas paredzēta kopīgošanai, ir apraksta fails ar nosaukumu <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šajā failā ir ierakstīts distribūcijas nosaukums un versija.<\/span> <span class=\"sg\" data-s=\"2\">Tas arī uzskaita moduļus, ko distribūcija nodrošina, un citas distribūcijas, no kurām tā ir atkarīga.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> nolasa šo failu.<\/span> <span class=\"sg\" data-s=\"4\">No tā <code>zef<\/code> uzzina, ko instalēt un kā daļas sader kopā.<\/span> <span class=\"sg\" data-s=\"5\">Ja publicējat savu moduli, tam vajadzīgs pareizs <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tieši tas ļauj visiem pārējiem to instalēt.<\/span><\/p>"]]},"ru":{"t":"Установка модулей из сети","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы можете использовать не только те модули, которые пишете сами.<\/span> <span class=\"sg\" data-s=\"1\">Сообщество Raku опубликовало большую коллекцию модулей.<\/span> <span class=\"sg\" data-s=\"2\">Среди них есть всё, от веб-фреймворков до форматов данных.<\/span> <span class=\"sg\" data-s=\"3\">Вы можете установить их и использовать в своих программах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Установщик <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модули устанавливают с помощью <code>zef<\/code> — стандартного менеджера модулей.<\/span> <span class=\"sg\" data-s=\"1\">Он идёт в комплекте с Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы установить модуль, передайте <code>zef<\/code> его имя:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> скачивает модуль вместе со всем, от чего он зависит.<\/span> <span class=\"sg\" data-s=\"1\">Затем он запускает тесты модуля и устанавливает его.<\/span> <span class=\"sg\" data-s=\"2\">Установленный модуль автоматически попадает в путь поиска.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому программа может загрузить его простым <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Опция <code>-I<\/code> не нужна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> также умеет искать в экосистеме.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он может обновлять или удалять модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откуда берутся модули<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Опубликованные модули — это часть <em>экосистемы<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Её можно просмотреть на сайте <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Там есть список доступных дистрибутивов и их документация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">В дистрибутиве для общего пользования есть файл описания под названием <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом файле записаны имя и версия дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Ещё там перечислены модули из дистрибутива и другие дистрибутивы, от которых он зависит.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> читает этот файл.<\/span> <span class=\"sg\" data-s=\"4\">Из него <code>zef<\/code> узнаёт, что устанавливать и как части связаны между собой.<\/span> <span class=\"sg\" data-s=\"5\">Если вы публикуете свой модуль, ему нужен правильный <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Именно этот файл позволяет всем остальным установить ваш модуль.<\/span><\/p>"]]},"uk":{"t":"Встановлення модулів із мережі","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви не обмежені модулями, які пишете самі.<\/span> <span class=\"sg\" data-s=\"1\">Спільнота Raku опублікувала велику збірку модулів.<\/span> <span class=\"sg\" data-s=\"2\">Вони охоплюють усе, від вебфреймворків до форматів даних.<\/span> <span class=\"sg\" data-s=\"3\">Ви можете встановлювати їх і використовувати у власних програмах.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Встановлювач <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модулі встановлюють за допомогою <code>zef<\/code>, який є стандартним менеджером модулів.<\/span> <span class=\"sg\" data-s=\"1\">Він постачається разом із Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Щоб встановити модуль, передайте <code>zef<\/code> його назву:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> завантажує модуль разом з усім, від чого він залежить.<\/span> <span class=\"sg\" data-s=\"1\">Потім він запускає тести модуля й встановлює його.<\/span> <span class=\"sg\" data-s=\"2\">Встановлений модуль автоматично опиняється на шляху пошуку.<\/span> <span class=\"sg\" data-s=\"3\">Тож програма може завантажити його звичайним <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Опція <code>-I<\/code> не потрібна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> також уміє шукати в екосистемі.<\/span> <span class=\"sg\" data-s=\"1\">Ще він може оновлювати або видаляти модулі:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Звідки беруться модулі<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Опубліковані модулі є частиною <em>екосистеми<\/em> Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете переглядати її на сайті <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Він показує доступні дистрибутиви та їхню документацію.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Дистрибутив, призначений для поширення, має файл опису під назвою <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У цьому файлі записано назву й версію дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Ще там перелічено модулі, які він надає, та інші дистрибутиви, від яких він залежить.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> читає цей файл.<\/span> <span class=\"sg\" data-s=\"4\">З нього <code>zef<\/code> дізнається, що встановлювати і як частини поєднуються між собою.<\/span> <span class=\"sg\" data-s=\"5\">Якщо ви публікуєте власний модуль, йому потрібен правильний <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Саме завдяки цьому всі інші можуть його встановити.<\/span><\/p>"]]},"bg":{"t":"Инсталиране на модули от мрежата","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Не сте ограничени само до модулите, които пишете сами.<\/span> <span class=\"sg\" data-s=\"1\">Общността на Raku е публикувала голяма колекция от модули.<\/span> <span class=\"sg\" data-s=\"2\">Те покриват всичко от уеб фреймуърки до формати за данни.<\/span> <span class=\"sg\" data-s=\"3\">Можете да ги инсталирате и да ги използвате в собствените си програми.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Инсталаторът <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модулите се инсталират със <code>zef<\/code>, който е стандартният мениджър на модули.<\/span> <span class=\"sg\" data-s=\"1\">Той идва заедно с Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">За да инсталирате модул, подайте името му на <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> изтегля модула заедно с всичко, от което той зависи.<\/span> <span class=\"sg\" data-s=\"1\">След това изпълнява тестовете на модула и го инсталира.<\/span> <span class=\"sg\" data-s=\"2\">Инсталираният модул автоматично е в пътя за търсене.<\/span> <span class=\"sg\" data-s=\"3\">Така програмата може да го зареди с обикновен <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Опцията <code>-I<\/code> не е необходима:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> може също да търси в екосистемата.<\/span> <span class=\"sg\" data-s=\"1\">Той може и да обновява или премахва модули:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Откъде идват модулите<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Публикуваните модули са част от <em>екосистемата<\/em> на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я разгледате на уебсайта <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Той показва списък с наличните дистрибуции и тяхната документация.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Дистрибуцията, която е направена за споделяне, има файл с описание, наречен <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този файл записва името и версията на дистрибуцията.<\/span> <span class=\"sg\" data-s=\"2\">Той изброява и модулите, които тя предоставя, и другите дистрибуции, от които зависи.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> чете този файл.<\/span> <span class=\"sg\" data-s=\"4\">От него <code>zef<\/code> научава какво да инсталира и как частите се свързват.<\/span> <span class=\"sg\" data-s=\"5\">Ако публикувате собствен модул, той трябва да има правилен <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Точно това позволява на всички останали да го инсталират.<\/span><\/p>"]]},"eo":{"t":"Instali modulojn el la reto","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi ne estas limigita al la moduloj, kiujn vi mem skribas.<\/span> <span class=\"sg\" data-s=\"1\">La Raku-komunumo publikigis grandan kolekton de moduloj.<\/span> <span class=\"sg\" data-s=\"2\">Ili kovras ĉion de retkadroj ĝis datumformatoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas instali ilin kaj uzi ilin en viaj propraj programoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La instalilo <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduloj estas instalataj per <code>zef<\/code>, kiu estas la norma modula administrilo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi venas kune kun Rakudo.<\/span> <span class=\"sg\" data-s=\"2\">Por instali modulon, donu ĝian nomon al <code>zef<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> elŝutas la modulon kune kun ĉio, de kio ĝi dependas.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi rulas la testojn de la modulo kaj instalas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Instalita modulo estas aŭtomate en la serĉvojo.<\/span> <span class=\"sg\" data-s=\"3\">Do programo povas ŝargi ĝin per simpla <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La opcio <code>-I<\/code> ne estas bezonata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> ankaŭ povas serĉi en la ekosistemo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas ankaŭ ĝisdatigi aŭ forigi modulojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De kie venas moduloj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Publikigitaj moduloj estas parto de la Raku-<em>ekosistemo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas trarigardi ĝin en la retejo <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi listigas la disponeblajn distribuaĵojn kaj ilian dokumentadon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Distribuaĵo, kiun oni volas kunhavigi, havas priskriban dosieron nomitan <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu dosiero registras la nomon kaj la version de la distribuaĵo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ listigas la modulojn, kiujn ĝi provizas, kaj la aliajn distribuaĵojn, de kiuj ĝi dependas.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> legas ĉi tiun dosieron.<\/span> <span class=\"sg\" data-s=\"4\">El ĝi, <code>zef<\/code> lernas, kion instali kaj kiel la partoj kuniĝas.<\/span> <span class=\"sg\" data-s=\"5\">Se vi publikigas vian propran modulon, ĝi bezonas ĝustan <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Tio permesas al ĉiuj aliaj instali ĝin.<\/span><\/p>"]]},"la":{"t":"Modulos ex interrete installare","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Non solum modulos adhibere potes quos ipse scribis.<\/span> <span class=\"sg\" data-s=\"1\">Communitas Raku magnam collectionem modulorum edidit.<\/span> <span class=\"sg\" data-s=\"2\">Omnia tractant, a compagibus interretialibus usque ad formas datorum.<\/span> <span class=\"sg\" data-s=\"3\">Eos installare et in tuis programmatis adhibere potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Instrumentum <code>zef<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduli per <code>zef<\/code> installantur, qui est moderator modulorum normatus.<\/span> <span class=\"sg\" data-s=\"1\">Una cum Rakudo venit.<\/span> <span class=\"sg\" data-s=\"2\">Ut modulum installes, nomen eius <code>zef<\/code> trade:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef install JSON::Fast<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> modulum deponit una cum omnibus rebus a quibus pendet.<\/span> <span class=\"sg\" data-s=\"1\">Deinde probationes moduli exsequitur et eum installat.<\/span> <span class=\"sg\" data-s=\"2\">Modulus installatus automatice in via inquisitionis est.<\/span> <span class=\"sg\" data-s=\"3\">Itaque programma eum simplici <code>use<\/code> onerare potest.<\/span> <span class=\"sg\" data-s=\"4\">Optio <code>-I<\/code> non necessaria est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use JSON::Fast;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>zef<\/code> etiam in oecosystemate quaerere potest.<\/span> <span class=\"sg\" data-s=\"1\">Modulos quoque renovare vel removere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ zef search Test\n$ zef uninstall JSON::Fast<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Unde moduli proveniant<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduli editi pars <em>oecosystematis<\/em> Raku sunt.<\/span> <span class=\"sg\" data-s=\"1\">Id in situ interretiali <a href=\"https://raku.land\" target=\"_blank\" rel=\"noopener\">raku.land<\/a> perlustrare potes.<\/span> <span class=\"sg\" data-s=\"2\">Situs distributiones quae praesto sunt et earum documentationem enumerat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>META6.json<\/code><\/span><\/h3>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Distributio quae ad communicandum facta est fasciculum descriptionis habet, nomine <code>META6.json<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hic fasciculus nomen et versionem distributionis memorat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam modulos quos praebet enumerat et alias distributiones a quibus pendet.<\/span> <span class=\"sg\" data-s=\"3\"><code>zef<\/code> hunc fasciculum legit.<\/span> <span class=\"sg\" data-s=\"4\">Ex eo <code>zef<\/code> discit quid installare debeat et quomodo partes inter se conveniant.<\/span> <span class=\"sg\" data-s=\"5\">Si modulum tuum edis, rectum <code>META6.json<\/code> requirit.<\/span> <span class=\"sg\" data-s=\"6\">Hoc efficit ut omnes alii eum installare possint.<\/span><\/p>"]]}}}</script>
