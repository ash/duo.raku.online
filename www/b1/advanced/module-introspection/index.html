<script type="application/json" id="page-data">{"u":"advanced/module-introspection","n":716,"k":"section","pv":"advanced/modules-basics/exercises/require-at-runtime/solution","nx":"advanced/module-introspection/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Module introspection","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The name of a module creates a <em>package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">A package is a namespace that holds the names defined in the module.<\/span> <span class=\"sg\" data-s=\"2\">Earlier, in <a href=\"/advanced/containers/\">the section about containers<\/a>, you met <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It returns the <code>Stash<\/code>, or symbol table, of a package.<\/span> <span class=\"sg\" data-s=\"4\">Module introspection makes use of that.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The examples below use the <code>Greeting<\/code> module that we built in the earlier topics.<\/span> <span class=\"sg\" data-s=\"1\">It has an exported subroutine and a shared <code>our<\/code> variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You write the package of a module with <code>::<\/code> at the end.<\/span> <span class=\"sg\" data-s=\"1\">Adding <code>.keys<\/code> lists the names that it contains:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">The <code>Greeting<\/code> module from the earlier topics defines an <code>our<\/code> variable, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So its package contains this name, together with its sigil.<\/span> <span class=\"sg\" data-s=\"2\">Next to it is <code>EXPORT<\/code>, which may look surprising.<\/span> <span class=\"sg\" data-s=\"3\">It is a package that Raku creates automatically.<\/span> <span class=\"sg\" data-s=\"4\">It holds everything that a module marks with <code>is export<\/code>, such as the subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">So an exported name does <em>not<\/em> appear directly in the package.<\/span> <span class=\"sg\" data-s=\"6\">It lives inside the <code>EXPORT<\/code> sub-package.<\/span> <span class=\"sg\" data-s=\"7\">The keys come back in no fixed order.<\/span> <span class=\"sg\" data-s=\"8\">That is why the example sorts them, so that the result is always the same.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can also look up a name in the package.<\/span> <span class=\"sg\" data-s=\"1\">Just use the name as a key.<\/span> <span class=\"sg\" data-s=\"2\">This gives the same value as the qualified name <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listing what a module exports<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The exported names actually live in the <code>EXPORT<\/code> package that you saw above.<\/span> <span class=\"sg\" data-s=\"1\">So you can list them by looking one level deeper.<\/span> <span class=\"sg\" data-s=\"2\">Exports without a tag go into the <code>DEFAULT<\/code> group (see <a href=\"/advanced/modules-basics/export-tags/\">Export tags<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">The <code>.keys<\/code> of this group are the exported routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Each key is an exported name with its sigil.<\/span> <span class=\"sg\" data-s=\"1\">Here, it is the only subroutine, <code>&amp;hello<\/code>, with the <code>&amp;<\/code> that marks a routine.<\/span> <span class=\"sg\" data-s=\"2\">In this way, you can find out what a module offers its users.<\/span> <span class=\"sg\" data-s=\"3\">You do not need to read its source code.<\/span> <span class=\"sg\" data-s=\"4\">Just ask its <code>EXPORT::DEFAULT<\/code> package what it holds.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Looking inside a package like this is useful in two cases.<\/span> <span class=\"sg\" data-s=\"1\">You may want to find out what a module provides.<\/span> <span class=\"sg\" data-s=\"2\">Or you may want to reach its names while the program runs.<\/span> <span class=\"sg\" data-s=\"3\">Then you do not have to write out each one in the source code.<\/span><\/p>"]]},"de":{"t":"Modul-Introspektion","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Der Name eines Moduls erzeugt ein <em>Package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ein Package ist ein Namensraum, der die Namen enthält, die im Modul definiert sind.<\/span> <span class=\"sg\" data-s=\"2\">Vorher, im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a>, hast du <code>WHO<\/code> kennengelernt.<\/span> <span class=\"sg\" data-s=\"3\">Es gibt den <code>Stash<\/code>, also die Symboltabelle, eines Packages zurück.<\/span> <span class=\"sg\" data-s=\"4\">Modul-Introspection nutzt genau das.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die folgenden Beispiele benutzen das <code>Greeting<\/code>-Modul, das wir in den früheren Themen gebaut haben.<\/span> <span class=\"sg\" data-s=\"1\">Es hat eine exportierte Subroutine und eine gemeinsam genutzte <code>our<\/code>-Variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Package eines Moduls schreibst du mit <code>::<\/code> am Ende.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>.keys<\/code> listest du die Namen auf, die es enthält:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Das <code>Greeting<\/code>-Modul aus den früheren Themen definiert eine <code>our<\/code>-Variable, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also enthält sein Package diesen Namen, zusammen mit seinem Sigil.<\/span> <span class=\"sg\" data-s=\"2\">Daneben steht <code>EXPORT<\/code>, was vielleicht überraschend aussieht.<\/span> <span class=\"sg\" data-s=\"3\">Es ist ein Package, das Raku automatisch erzeugt.<\/span> <span class=\"sg\" data-s=\"4\">Es enthält alles, was ein Modul mit <code>is export<\/code> markiert, wie die Subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ein exportierter Name erscheint also <em>nicht<\/em> direkt im Package.<\/span> <span class=\"sg\" data-s=\"6\">Er liegt im Unter-Package <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Die Schlüssel kommen in keiner festen Reihenfolge zurück.<\/span> <span class=\"sg\" data-s=\"8\">Deshalb sortiert das Beispiel sie, damit das Ergebnis immer gleich ist.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst einen Namen auch im Package nachschlagen.<\/span> <span class=\"sg\" data-s=\"1\">Benutze den Namen einfach als Schlüssel.<\/span> <span class=\"sg\" data-s=\"2\">Das ergibt denselben Wert wie der qualifizierte Name <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Auflisten, was ein Modul exportiert<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die exportierten Namen liegen eigentlich im <code>EXPORT<\/code>-Package, das du oben gesehen hast.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst sie also auflisten, indem du eine Ebene tiefer schaust.<\/span> <span class=\"sg\" data-s=\"2\">Exporte ohne Tag kommen in die <code>DEFAULT<\/code>-Gruppe (siehe <a href=\"https://course.raku.org/de/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Export-Tags<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">Die <code>.keys<\/code> dieser Gruppe sind die exportierten Routinen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jeder Schlüssel ist ein exportierter Name mit seinem Sigil.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist es die einzige Subroutine, <code>&amp;hello<\/code>, mit dem <code>&amp;<\/code>, das eine Routine kennzeichnet.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du herausfinden, was ein Modul seinen Nutzern anbietet.<\/span> <span class=\"sg\" data-s=\"3\">Du musst dafür nicht seinen Quellcode lesen.<\/span> <span class=\"sg\" data-s=\"4\">Frag einfach sein <code>EXPORT::DEFAULT<\/code>-Package, was es enthält.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So in ein Package zu schauen ist in zwei Fällen nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Vielleicht willst du herausfinden, was ein Modul bereitstellt.<\/span> <span class=\"sg\" data-s=\"2\">Oder du willst seine Namen erreichen, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"3\">Dann musst du nicht jeden einzelnen im Quellcode ausschreiben.<\/span><\/p>"]]},"nl":{"t":"Module-introspectie","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">De naam van een module maakt een <em>pakket<\/em> aan.<\/span> <span class=\"sg\" data-s=\"1\">Een pakket is een naamruimte die de namen bevat die in de module gedefinieerd zijn.<\/span> <span class=\"sg\" data-s=\"2\">Eerder, in <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">de sectie over containers<\/a>, heb je <code>WHO<\/code> leren kennen.<\/span> <span class=\"sg\" data-s=\"3\">Het geeft de <code>Stash<\/code>, of symbooltabel, van een pakket terug.<\/span> <span class=\"sg\" data-s=\"4\">Module-introspectie maakt daar gebruik van.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De voorbeelden hieronder gebruiken de <code>Greeting<\/code>-module die we in de eerdere onderwerpen hebben gebouwd.<\/span> <span class=\"sg\" data-s=\"1\">Hij heeft een geëxporteerde subroutine en een gedeelde <code>our<\/code>-variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je schrijft het pakket van een module met <code>::<\/code> aan het eind.<\/span> <span class=\"sg\" data-s=\"1\">Met <code>.keys<\/code> erachter krijg je de namen die het bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">De <code>Greeting<\/code>-module uit de eerdere onderwerpen definieert een <code>our<\/code>-variabele, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Zijn pakket bevat dus deze naam, samen met de sigil.<\/span> <span class=\"sg\" data-s=\"2\">Daarnaast staat <code>EXPORT<\/code>, wat misschien verrassend lijkt.<\/span> <span class=\"sg\" data-s=\"3\">Het is een pakket dat Raku automatisch aanmaakt.<\/span> <span class=\"sg\" data-s=\"4\">Het bevat alles wat een module markeert met <code>is export<\/code>, zoals de subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Een geëxporteerde naam staat dus <em>niet<\/em> direct in het pakket.<\/span> <span class=\"sg\" data-s=\"6\">Hij zit in het <code>EXPORT<\/code>-subpakket.<\/span> <span class=\"sg\" data-s=\"7\">De sleutels komen in geen vaste volgorde terug.<\/span> <span class=\"sg\" data-s=\"8\">Daarom sorteert het voorbeeld ze, zodat het resultaat altijd hetzelfde is.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een naam opzoeken in het pakket.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik de naam gewoon als sleutel.<\/span> <span class=\"sg\" data-s=\"2\">Dat geeft dezelfde waarde als de gekwalificeerde naam <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Weergeven wat een module exporteert<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De geëxporteerde namen staan eigenlijk in het <code>EXPORT<\/code>-pakket dat je hierboven zag.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt ze dus weergeven door één niveau dieper te kijken.<\/span> <span class=\"sg\" data-s=\"2\">Exports zonder tag gaan naar de <code>DEFAULT<\/code>-groep (zie <a href=\"https://course.raku.org/nl/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Exporttags<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">De <code>.keys<\/code> van deze groep zijn de geëxporteerde routines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Elke sleutel is een geëxporteerde naam met zijn sigil.<\/span> <span class=\"sg\" data-s=\"1\">Hier is dat de enige subroutine, <code>&amp;hello<\/code>, met de <code>&amp;<\/code> die een routine aangeeft.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je ontdekken wat een module zijn gebruikers aanbiedt.<\/span> <span class=\"sg\" data-s=\"3\">Je hoeft de broncode niet te lezen.<\/span> <span class=\"sg\" data-s=\"4\">Vraag gewoon aan het <code>EXPORT::DEFAULT<\/code>-pakket wat het bevat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Op deze manier in een pakket kijken is handig in twee gevallen.<\/span> <span class=\"sg\" data-s=\"1\">Misschien wil je ontdekken wat een module biedt.<\/span> <span class=\"sg\" data-s=\"2\">Of je wilt de namen bereiken terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"3\">Dan hoef je niet elke naam uit te schrijven in de broncode.<\/span><\/p>"]]},"es":{"t":"Introspección de módulos","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">El nombre de un módulo crea un <em>paquete<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un paquete es un espacio de nombres que guarda los nombres definidos en el módulo.<\/span> <span class=\"sg\" data-s=\"2\">Antes, en <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sección sobre contenedores<\/a>, conociste <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Devuelve el <code>Stash<\/code>, o tabla de símbolos, de un paquete.<\/span> <span class=\"sg\" data-s=\"4\">La introspección de módulos aprovecha eso.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los ejemplos de abajo usan el módulo <code>Greeting<\/code> que construimos en los temas anteriores.<\/span> <span class=\"sg\" data-s=\"1\">Tiene una subrutina exportada y una variable compartida <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Escribes el paquete de un módulo con <code>::<\/code> al final.<\/span> <span class=\"sg\" data-s=\"1\">Al añadir <code>.keys<\/code>, obtienes la lista de los nombres que contiene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">El módulo <code>Greeting<\/code> de los temas anteriores define una variable <code>our<\/code>, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que su paquete contiene este nombre, junto con su sigilo.<\/span> <span class=\"sg\" data-s=\"2\">A su lado está <code>EXPORT<\/code>, que puede parecer sorprendente.<\/span> <span class=\"sg\" data-s=\"3\">Es un paquete que Raku crea automáticamente.<\/span> <span class=\"sg\" data-s=\"4\">Guarda todo lo que un módulo marca con <code>is export<\/code>, como la subrutina <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Así que un nombre exportado <em>no<\/em> aparece directamente en el paquete.<\/span> <span class=\"sg\" data-s=\"6\">Vive dentro del sub-paquete <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Las claves vuelven sin un orden fijo.<\/span> <span class=\"sg\" data-s=\"8\">Por eso el ejemplo las ordena, para que el resultado sea siempre el mismo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También puedes buscar un nombre en el paquete.<\/span> <span class=\"sg\" data-s=\"1\">Solo tienes que usar el nombre como clave.<\/span> <span class=\"sg\" data-s=\"2\">Esto da el mismo valor que el nombre calificado <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listar lo que exporta un módulo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los nombres exportados viven en realidad en el paquete <code>EXPORT<\/code> que viste arriba.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes listarlos si miras un nivel más adentro.<\/span> <span class=\"sg\" data-s=\"2\">Las exportaciones sin etiqueta van al grupo <code>DEFAULT<\/code> (consulta <a href=\"https://course.raku.org/es/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Etiquetas de exportación<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">Las <code>.keys<\/code> de este grupo son las rutinas exportadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cada clave es un nombre exportado con su sigilo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí es la única subrutina, <code>&amp;hello<\/code>, con el <code>&amp;<\/code> que marca una rutina.<\/span> <span class=\"sg\" data-s=\"2\">De esta forma, puedes descubrir qué ofrece un módulo a sus usuarios.<\/span> <span class=\"sg\" data-s=\"3\">No necesitas leer su código fuente.<\/span> <span class=\"sg\" data-s=\"4\">Solo pregúntale a su paquete <code>EXPORT::DEFAULT<\/code> qué contiene.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mirar dentro de un paquete así es útil en dos casos.<\/span> <span class=\"sg\" data-s=\"1\">Puede que quieras descubrir qué ofrece un módulo.<\/span> <span class=\"sg\" data-s=\"2\">O puede que quieras llegar a sus nombres mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"3\">Así no tienes que escribir cada uno en el código fuente.<\/span><\/p>"]]},"it":{"t":"Introspezione dei moduli","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il nome di un modulo crea un <em>package<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Un package è uno spazio dei nomi che contiene i nomi definiti nel modulo.<\/span> <span class=\"sg\" data-s=\"2\">Prima, nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui container<\/a>, hai incontrato <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Restituisce lo <code>Stash<\/code>, cioè la tabella dei simboli, di un package.<\/span> <span class=\"sg\" data-s=\"4\">L'introspezione dei moduli usa proprio questo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli esempi qui sotto usano il modulo <code>Greeting<\/code> che abbiamo costruito nei capitoli precedenti.<\/span> <span class=\"sg\" data-s=\"1\">Ha una subroutine esportata e una variabile <code>our<\/code> condivisa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Scrivi il package di un modulo con <code>::<\/code> alla fine.<\/span> <span class=\"sg\" data-s=\"1\">Se aggiungi <code>.keys<\/code>, ottieni l'elenco dei nomi che contiene:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Il modulo <code>Greeting<\/code> dei capitoli precedenti definisce una variabile <code>our<\/code>, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi il suo package contiene questo nome, insieme al suo sigillo.<\/span> <span class=\"sg\" data-s=\"2\">Accanto c'è <code>EXPORT<\/code>, che può sembrare strano.<\/span> <span class=\"sg\" data-s=\"3\">È un package che Raku crea automaticamente.<\/span> <span class=\"sg\" data-s=\"4\">Contiene tutto ciò che un modulo contrassegna con <code>is export<\/code>, come la subroutine <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Quindi un nome esportato <em>non<\/em> appare direttamente nel package.<\/span> <span class=\"sg\" data-s=\"6\">Si trova dentro il sotto-package <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Le chiavi tornano senza un ordine fisso.<\/span> <span class=\"sg\" data-s=\"8\">Per questo l'esempio le ordina, così il risultato è sempre lo stesso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi anche cercare un nome nel package.<\/span> <span class=\"sg\" data-s=\"1\">Basta usare il nome come chiave.<\/span> <span class=\"sg\" data-s=\"2\">Così ottieni lo stesso valore del nome qualificato <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Elencare ciò che un modulo esporta<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I nomi esportati si trovano davvero nel package <code>EXPORT<\/code> che hai visto sopra.<\/span> <span class=\"sg\" data-s=\"1\">Quindi puoi elencarli guardando un livello più in profondità.<\/span> <span class=\"sg\" data-s=\"2\">Le esportazioni senza tag vanno nel gruppo <code>DEFAULT<\/code> (vedi <a href=\"https://course.raku.org/it/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Tag di esportazione<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">Le <code>.keys<\/code> di questo gruppo sono le routine esportate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ogni chiave è un nome esportato con il suo sigillo.<\/span> <span class=\"sg\" data-s=\"1\">Qui è l'unica subroutine, <code>&amp;hello<\/code>, con il <code>&amp;<\/code> che indica una routine.<\/span> <span class=\"sg\" data-s=\"2\">In questo modo puoi scoprire cosa offre un modulo ai suoi utenti.<\/span> <span class=\"sg\" data-s=\"3\">Non devi leggere il suo codice sorgente.<\/span> <span class=\"sg\" data-s=\"4\">Basta chiedere al suo package <code>EXPORT::DEFAULT<\/code> cosa contiene.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Guardare dentro un package in questo modo è utile in due casi.<\/span> <span class=\"sg\" data-s=\"1\">Forse vuoi scoprire cosa offre un modulo.<\/span> <span class=\"sg\" data-s=\"2\">Oppure vuoi raggiungere i suoi nomi mentre il programma è in esecuzione.<\/span> <span class=\"sg\" data-s=\"3\">Allora non devi scriverli uno per uno nel codice sorgente.<\/span><\/p>"]]},"lv":{"t":"Moduļu introspekcija","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Moduļa nosaukums izveido <em>pakotni<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pakotne ir nosaukumtelpa, kas glabā modulī definētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Iepriekš, <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>, jūs iepazināties ar <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas atgriež pakotnes <code>Stash<\/code> jeb simbolu tabulu.<\/span> <span class=\"sg\" data-s=\"4\">Moduļu introspekcija to izmanto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tālākie piemēri izmanto moduli <code>Greeting<\/code>, ko mēs izveidojām iepriekšējās tēmās.<\/span> <span class=\"sg\" data-s=\"1\">Tam ir eksportēta apakšprogramma un koplietots <code>our<\/code> mainīgais:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs rakstāt moduļa pakotni ar <code>::<\/code> beigās.<\/span> <span class=\"sg\" data-s=\"1\">Pievienojot <code>.keys<\/code>, jūs iegūstat nosaukumus, kas tajā ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Modulis <code>Greeting<\/code> no iepriekšējām tēmām definē <code>our<\/code> mainīgo <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tā pakotnē ir šis nosaukums kopā ar sigilu.<\/span> <span class=\"sg\" data-s=\"2\">Blakus tam ir <code>EXPORT<\/code>, kas var šķist pārsteidzoši.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir pakotne, ko Raku izveido automātiski.<\/span> <span class=\"sg\" data-s=\"4\">Tā glabā visu, ko modulis atzīmē ar <code>is export<\/code>, piemēram, apakšprogrammu <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tāpēc eksportēts nosaukums <em>neparādās<\/em> tieši pakotnē.<\/span> <span class=\"sg\" data-s=\"6\">Tas atrodas apakšpakotnē <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Atslēgas tiek atgrieztas bez noteiktas secības.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc piemērs tās sakārto, lai rezultāts vienmēr būtu vienāds.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat arī meklēt nosaukumu pakotnē.<\/span> <span class=\"sg\" data-s=\"1\">Vienkārši izmantojiet nosaukumu kā atslēgu.<\/span> <span class=\"sg\" data-s=\"2\">Tas dod to pašu vērtību kā kvalificētais nosaukums <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Moduļa eksportēto elementu uzskaitīšana<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eksportētie nosaukumi patiesībā atrodas pakotnē <code>EXPORT<\/code>, ko redzējāt augstāk.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tos var uzskaitīt, ieskatoties vienu līmeni dziļāk.<\/span> <span class=\"sg\" data-s=\"2\">Eksporti bez birkas nonāk grupā <code>DEFAULT<\/code> (skatiet <a href=\"https://course.raku.org/lv/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksporta birkas<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">Šīs grupas <code>.keys<\/code> ir eksportētās rutīnas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Katra atslēga ir eksportēts nosaukums ar tā sigilu.<\/span> <span class=\"sg\" data-s=\"1\">Šeit tā ir vienīgā apakšprogramma <code>&amp;hello<\/code> ar <code>&amp;<\/code>, kas apzīmē rutīnu.<\/span> <span class=\"sg\" data-s=\"2\">Šādi jūs varat uzzināt, ko modulis piedāvā saviem lietotājiem.<\/span> <span class=\"sg\" data-s=\"3\">Jums nav jālasa tā pirmkods.<\/span> <span class=\"sg\" data-s=\"4\">Vienkārši pajautājiet tā pakotnei <code>EXPORT::DEFAULT<\/code>, ko tā satur.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šāda ieskatīšanās pakotnē noder divos gadījumos.<\/span> <span class=\"sg\" data-s=\"1\">Varbūt jūs vēlaties uzzināt, ko modulis piedāvā.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī jūs vēlaties piekļūt tā nosaukumiem programmas darbības laikā.<\/span> <span class=\"sg\" data-s=\"3\">Tad jums nav jāieraksta katrs no tiem pirmkodā.<\/span><\/p>"]]},"ru":{"t":"Интроспекция модулей","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Имя модуля создаёт <em>пакет<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакет — это пространство имён, в котором хранятся имена, объявленные в модуле.<\/span> <span class=\"sg\" data-s=\"2\">Раньше, в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>, вы познакомились с <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он возвращает <code>Stash<\/code> пакета, то есть его таблицу символов.<\/span> <span class=\"sg\" data-s=\"4\">Интроспекция модулей использует именно это.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В примерах ниже используется модуль <code>Greeting<\/code>, который мы создали в прошлых темах.<\/span> <span class=\"sg\" data-s=\"1\">В нём есть экспортированная подпрограмма и общая переменная <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакет модуля записывают с <code>::<\/code> в конце.<\/span> <span class=\"sg\" data-s=\"1\">Если добавить <code>.keys<\/code>, получится список имён, которые в нём есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Greeting<\/code> из прошлых тем объявляет переменную <code>our<\/code> — <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому его пакет содержит это имя вместе с сигилом.<\/span> <span class=\"sg\" data-s=\"2\">Рядом с ним стоит <code>EXPORT<\/code>, и это может показаться странным.<\/span> <span class=\"sg\" data-s=\"3\">Это пакет, который Raku создаёт автоматически.<\/span> <span class=\"sg\" data-s=\"4\">В нём хранится всё, что модуль помечает как <code>is export<\/code>, например подпрограмма <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Поэтому экспортированное имя <em>не<\/em> появляется прямо в пакете.<\/span> <span class=\"sg\" data-s=\"6\">Оно находится внутри подпакета <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ключи могут возвращаться в разном порядке.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому пример их сортирует, чтобы результат всегда был одинаковым.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Также можно найти имя в пакете.<\/span> <span class=\"sg\" data-s=\"1\">Просто используйте имя как ключ.<\/span> <span class=\"sg\" data-s=\"2\">Это даёт то же значение, что и полное имя <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Список экспортируемых имён модуля<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Экспортированные имена на самом деле находятся в пакете <code>EXPORT<\/code>, который вы видели выше.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому их можно перечислить, если заглянуть на один уровень глубже.<\/span> <span class=\"sg\" data-s=\"2\">Экспорты без тега попадают в группу <code>DEFAULT<\/code> (смотрите <a href=\"https://course.raku.org/ru/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Теги экспорта<\/a>).<\/span> <span class=\"sg\" data-s=\"3\"><code>.keys<\/code> этой группы — это экспортированные подпрограммы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Каждый ключ — это экспортированное имя вместе с сигилом.<\/span> <span class=\"sg\" data-s=\"1\">Здесь это единственная подпрограмма <code>&amp;hello<\/code> со знаком <code>&amp;<\/code>, который обозначает подпрограмму.<\/span> <span class=\"sg\" data-s=\"2\">Так можно узнать, что модуль предлагает своим пользователям.<\/span> <span class=\"sg\" data-s=\"3\">Вам не нужно читать его исходный код.<\/span> <span class=\"sg\" data-s=\"4\">Просто спросите у его пакета <code>EXPORT::DEFAULT<\/code>, что в нём хранится.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Заглядывать внутрь пакета таким способом полезно в двух случаях.<\/span> <span class=\"sg\" data-s=\"1\">Может быть, вы хотите узнать, что предоставляет модуль.<\/span> <span class=\"sg\" data-s=\"2\">Или вы хотите обращаться к его именам во время работы программы.<\/span> <span class=\"sg\" data-s=\"3\">Тогда не нужно выписывать каждое имя в исходном коде.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція модулів","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ім'я модуля створює <em>пакунок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакунок — це простір імен, який містить імена, визначені в модулі.<\/span> <span class=\"sg\" data-s=\"2\">Раніше, у <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>, ви познайомилися з <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він повертає <code>Stash<\/code>, тобто таблицю символів пакунка.<\/span> <span class=\"sg\" data-s=\"4\">Інтроспекція модулів використовує саме це.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приклади нижче використовують модуль <code>Greeting<\/code>, який ми створили в попередніх темах.<\/span> <span class=\"sg\" data-s=\"1\">Він має експортовану підпрограму та спільну змінну <code>our<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пакунок модуля записують із <code>::<\/code> у кінці.<\/span> <span class=\"sg\" data-s=\"1\">Якщо додати <code>.keys<\/code>, ви отримаєте список імен, які він містить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Модуль <code>Greeting<\/code> із попередніх тем визначає змінну <code>our<\/code> під назвою <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож його пакунок містить це ім'я разом із сигілом.<\/span> <span class=\"sg\" data-s=\"2\">Поруч із ним стоїть <code>EXPORT<\/code>, і це може здивувати.<\/span> <span class=\"sg\" data-s=\"3\">Це пакунок, який Raku створює автоматично.<\/span> <span class=\"sg\" data-s=\"4\">Він зберігає все, що модуль позначає <code>is export<\/code>, наприклад, підпрограму <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тож експортоване ім'я <em>не<\/em> з'являється в пакунку напряму.<\/span> <span class=\"sg\" data-s=\"6\">Воно живе всередині підпакунка <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ключі повертаються без сталого порядку.<\/span> <span class=\"sg\" data-s=\"8\">Тому приклад їх сортує, щоб результат завжди був однаковим.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ім'я можна також знайти в пакунку.<\/span> <span class=\"sg\" data-s=\"1\">Просто використайте ім'я як ключ.<\/span> <span class=\"sg\" data-s=\"2\">Це дає те саме значення, що й кваліфіковане ім'я <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Перелік того, що експортує модуль<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Експортовані імена насправді живуть у пакунку <code>EXPORT<\/code>, який ви бачили вище.<\/span> <span class=\"sg\" data-s=\"1\">Тож їх можна перелічити, якщо заглянути на рівень глибше.<\/span> <span class=\"sg\" data-s=\"2\">Експорти без мітки потрапляють до групи <code>DEFAULT<\/code> (дивіться <a href=\"https://course.raku.org/uk/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Мітки експорту<\/a>).<\/span> <span class=\"sg\" data-s=\"3\"><code>.keys<\/code> цієї групи — це експортовані підпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Кожен ключ — це експортоване ім'я з його сигілом.<\/span> <span class=\"sg\" data-s=\"1\">Тут це єдина підпрограма, <code>&amp;hello<\/code>, з <code>&amp;<\/code>, що позначає підпрограму.<\/span> <span class=\"sg\" data-s=\"2\">Так можна дізнатися, що модуль пропонує своїм користувачам.<\/span> <span class=\"sg\" data-s=\"3\">Вам не потрібно читати його вихідний код.<\/span> <span class=\"sg\" data-s=\"4\">Просто спитайте його пакунок <code>EXPORT::DEFAULT<\/code>, що той містить.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так заглядати всередину пакунка корисно у двох випадках.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, ви хочете дізнатися, що надає модуль.<\/span> <span class=\"sg\" data-s=\"2\">Або ви хочете дістатися до його імен, поки програма працює.<\/span> <span class=\"sg\" data-s=\"3\">Тоді не треба виписувати кожне з них у вихідному коді.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на модули","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Името на модула създава <em>пакет<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пакетът е пространство от имена, което съдържа имената, дефинирани в модула.<\/span> <span class=\"sg\" data-s=\"2\">По-рано, в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>, се запознахте с <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той връща <code>Stash<\/code>, или таблицата със символи, на пакета.<\/span> <span class=\"sg\" data-s=\"4\">Интроспекцията на модули използва именно това.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Примерите по-долу използват модула <code>Greeting<\/code>, който изградихме в предишните теми.<\/span> <span class=\"sg\" data-s=\"1\">Той има експортирана подпрограма и споделена <code>our<\/code> променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Записвате пакета на модула с <code>::<\/code> в края.<\/span> <span class=\"sg\" data-s=\"1\">Ако добавите <code>.keys<\/code>, получавате списък с имената, които той съдържа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Модулът <code>Greeting<\/code> от предишните теми дефинира <code>our<\/code> променлива, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова пакетът му съдържа това име, заедно със сигила му.<\/span> <span class=\"sg\" data-s=\"2\">До него стои <code>EXPORT<\/code>, което може да изглежда изненадващо.<\/span> <span class=\"sg\" data-s=\"3\">Това е пакет, който Raku създава автоматично.<\/span> <span class=\"sg\" data-s=\"4\">Той съдържа всичко, което модулът маркира с <code>is export<\/code>, например подпрограмата <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Така експортираното име <em>не<\/em> се появява директно в пакета.<\/span> <span class=\"sg\" data-s=\"6\">То се намира вътре в подпакета <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ключовете се връщат в произволен ред.<\/span> <span class=\"sg\" data-s=\"8\">Затова примерът ги сортира, за да бъде резултатът винаги един и същ.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете също да потърсите име в пакета.<\/span> <span class=\"sg\" data-s=\"1\">Просто използвайте името като ключ.<\/span> <span class=\"sg\" data-s=\"2\">Така получавате същата стойност като с квалифицираното име <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изброяване на експортите на модул<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Експортираните имена всъщност се намират в пакета <code>EXPORT<\/code>, който видяхте по-горе.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да ги изброите, като погледнете едно ниво по-навътре.<\/span> <span class=\"sg\" data-s=\"2\">Експортите без таг попадат в групата <code>DEFAULT<\/code> (вижте <a href=\"https://course.raku.org/bg/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Тагове за експортиране<\/a>).<\/span> <span class=\"sg\" data-s=\"3\"><code>.keys<\/code> на тази група показва експортираните рутини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Всеки ключ е експортирано име със сигила му.<\/span> <span class=\"sg\" data-s=\"1\">Тук това е единствената подпрограма, <code>&amp;hello<\/code>, със знака <code>&amp;<\/code>, който маркира рутина.<\/span> <span class=\"sg\" data-s=\"2\">По този начин можете да разберете какво предлага модулът на своите потребители.<\/span> <span class=\"sg\" data-s=\"3\">Не е нужно да четете изходния му код.<\/span> <span class=\"sg\" data-s=\"4\">Просто попитайте пакета му <code>EXPORT::DEFAULT<\/code> какво съдържа.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Такъв поглед вътре в пакета е полезен в два случая.<\/span> <span class=\"sg\" data-s=\"1\">Може да искате да разберете какво предоставя модулът.<\/span> <span class=\"sg\" data-s=\"2\">Или може да искате да стигнете до имената му, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"3\">Тогава не е нужно да изписвате всяко от тях в изходния код.<\/span><\/p>"]]},"eo":{"t":"Modula introspekto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La nomo de modulo kreas <em>pakaĵon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Pakaĵo estas nomspaco, kiu enhavas la nomojn difinitajn en la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Pli frue, en <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">la sekcio pri ujoj<\/a>, vi renkontis <code>WHO<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi redonas la <code>Stash<\/code>, aŭ simboltabelon, de pakaĵo.<\/span> <span class=\"sg\" data-s=\"4\">Modula introspektado utiligas tion.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La ekzemploj sube uzas la modulon <code>Greeting<\/code>, kiun ni konstruis en la antaŭaj temoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas eksportitan subrutinon kaj dividatan <code>our<\/code>-variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi skribas la pakaĵon de modulo kun <code>::<\/code> ĉe la fino.<\/span> <span class=\"sg\" data-s=\"1\">Kun <code>.keys<\/code> vi listigas la nomojn, kiujn ĝi enhavas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">La modulo <code>Greeting<\/code> el la antaŭaj temoj difinas <code>our<\/code>-variablon, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝia pakaĵo enhavas ĉi tiun nomon, kune kun ĝia sigelo.<\/span> <span class=\"sg\" data-s=\"2\">Apud ĝi estas <code>EXPORT<\/code>, kiu eble ŝajnas surpriza.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas pakaĵo, kiun Raku kreas aŭtomate.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi enhavas ĉion, kion modulo markas per <code>is export<\/code>, ekzemple la subrutinon <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Do eksportita nomo <em>ne<\/em> aperas rekte en la pakaĵo.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi loĝas ene de la sub-pakaĵo <code>EXPORT<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">La ŝlosiloj ne revenas en fiksita ordo.<\/span> <span class=\"sg\" data-s=\"8\">Tial la ekzemplo ordigas ilin, por ke la rezulto estu ĉiam la sama.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas serĉi nomon en la pakaĵo.<\/span> <span class=\"sg\" data-s=\"1\">Simple uzu la nomon kiel ŝlosilon.<\/span> <span class=\"sg\" data-s=\"2\">Tio donas la saman valoron kiel la kvalifikita nomo <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Listigo de tio, kion modulo eksportas<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La eksportitaj nomoj efektive loĝas en la pakaĵo <code>EXPORT<\/code>, kiun vi vidis supre.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas listigi ilin, se vi rigardas unu nivelon pli profunde.<\/span> <span class=\"sg\" data-s=\"2\">Eksportaĵoj sen etikedo iras en la grupon <code>DEFAULT<\/code> (vidu <a href=\"https://course.raku.org/eo/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Eksportaj etikedoj<\/a>).<\/span> <span class=\"sg\" data-s=\"3\">La <code>.keys<\/code> de ĉi tiu grupo estas la eksportitaj rutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ŝlosilo estas eksportita nomo kun sia sigelo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie ĝi estas la sola subrutino, <code>&amp;hello<\/code>, kun la <code>&amp;<\/code>, kiu markas rutinon.<\/span> <span class=\"sg\" data-s=\"2\">Tiel vi povas ekscii, kion modulo proponas al siaj uzantoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi ne bezonas legi ĝian fontkodon.<\/span> <span class=\"sg\" data-s=\"4\">Simple demandu al ĝia pakaĵo <code>EXPORT::DEFAULT<\/code>, kion ĝi enhavas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Rigardi en pakaĵon tiel estas utile en du kazoj.<\/span> <span class=\"sg\" data-s=\"1\">Eble vi volas ekscii, kion modulo provizas.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ eble vi volas atingi ĝiajn nomojn, dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"3\">Tiam vi ne devas skribi ĉiun el ili en la fontkodo.<\/span><\/p>"]]},"la":{"t":"Introspectio modulorum","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Nomen moduli <em>fasciculum<\/em> creat.<\/span> <span class=\"sg\" data-s=\"1\">Fasciculus est spatium nominum quod nomina in modulo definita continet.<\/span> <span class=\"sg\" data-s=\"2\">Antea, in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de continentibus<\/a>, <code>WHO<\/code> cognovisti.<\/span> <span class=\"sg\" data-s=\"3\">Id <code>Stash<\/code>, sive tabulam symbolorum, fasciculi reddit.<\/span> <span class=\"sg\" data-s=\"4\">Introspectio moduli hoc adhibet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Exempla infra modulum <code>Greeting<\/code> adhibent, quem in prioribus argumentis construximus.<\/span> <span class=\"sg\" data-s=\"1\">Subroutinam exportatam et variabilem communem <code>our<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nour $version = '1.0';\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fasciculum moduli cum <code>::<\/code> in fine scribis.<\/span> <span class=\"sg\" data-s=\"1\">Si <code>.keys<\/code> addis, id nomina quae continet enumerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::.keys.sort; # ($version EXPORT)<\/code><\/pre>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Modulus <code>Greeting<\/code> ex prioribus argumentis variabilem <code>our<\/code> definit, <code>$version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque fasciculus eius hoc nomen continet, una cum sigillo suo.<\/span> <span class=\"sg\" data-s=\"2\">Iuxta id est <code>EXPORT<\/code>, quod mirum videri potest.<\/span> <span class=\"sg\" data-s=\"3\">Est fasciculus quem Raku automatice creat.<\/span> <span class=\"sg\" data-s=\"4\">Omnia continet quae modulus <code>is export<\/code> notat, sicut subroutinam <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Itaque nomen exportatum <em>non<\/em> directe in fasciculo apparet.<\/span> <span class=\"sg\" data-s=\"6\">Intra sub-fasciculum <code>EXPORT<\/code> habitat.<\/span> <span class=\"sg\" data-s=\"7\">Claves nullo ordine fixo redeunt.<\/span> <span class=\"sg\" data-s=\"8\">Ideo exemplum eas ordinat, ut resultatum semper idem sit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nomen etiam in fasciculo quaerere potes.<\/span> <span class=\"sg\" data-s=\"1\">Nomine tantum ut clave utere.<\/span> <span class=\"sg\" data-s=\"2\">Hoc eundem valorem dat ac nomen qualificatum <code>$Greeting::version<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::{'$version'}; # 1.0<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Enumeratio eorum quae modulus exportat<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomina exportata re vera in fasciculo <code>EXPORT<\/code> habitant, quem supra vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Itaque ea enumerare potes, si unum gradum profundius inspicis.<\/span> <span class=\"sg\" data-s=\"2\">Exportata sine indice in gregem <code>DEFAULT<\/code> eunt (vide <a href=\"https://course.raku.org/la/advanced/modules-basics/export-tags/\" target=\"_blank\" rel=\"noopener\">Indices exportationis<\/a>).<\/span> <span class=\"sg\" data-s=\"3\"><code>.keys<\/code> huius gregis sunt subroutinae exportatae:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay Greeting::EXPORT::DEFAULT::.keys.sort; # (&amp;hello)<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Quaeque clavis est nomen exportatum cum sigillo suo.<\/span> <span class=\"sg\" data-s=\"1\">Hic est unica subroutina, <code>&amp;hello<\/code>, cum <code>&amp;<\/code> quod routinam designat.<\/span> <span class=\"sg\" data-s=\"2\">Hoc modo cognoscere potes quid modulus utentibus suis praebeat.<\/span> <span class=\"sg\" data-s=\"3\">Codicem fontis eius legere non debes.<\/span> <span class=\"sg\" data-s=\"4\">Tantum fasciculum eius <code>EXPORT::DEFAULT<\/code> interroga quid contineat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fasciculum sic intus inspicere utile est in duobus casibus.<\/span> <span class=\"sg\" data-s=\"1\">Fortasse cognoscere vis quid modulus praebeat.<\/span> <span class=\"sg\" data-s=\"2\">Aut fortasse nomina eius attingere vis, dum programma currit.<\/span> <span class=\"sg\" data-s=\"3\">Tum non debes unumquodque in codice fontis scribere.<\/span><\/p>"]]}}}</script>
