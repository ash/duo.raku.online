<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/types","n":356,"k":"topic","pv":"advanced/scalar-containers","nx":"advanced/scalar-containers/type-constraints","tr":["advanced","advanced/scalar-containers"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Data types and scalar containers","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is a program that uses one variable for different kinds of data.<\/span> <span class=\"sg\" data-s=\"1\">We use <code>dd<\/code> to see what is in the container at each step.<\/span> <span class=\"sg\" data-s=\"2\">This example only shows the idea.<\/span> <span class=\"sg\" data-s=\"3\">We do not recommend this style of programming.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each call to <code>dd<\/code> shows what is in the variable <code>$value<\/code> at that moment:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">At first, the variable is empty, and <code>dd<\/code> shows its value as <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is the undefined base value that every untyped container starts with.<\/span> <span class=\"sg\" data-s=\"2\">After the assignments, <code>dd<\/code> shows the integer and then the string.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Note that <code>dd<\/code> does not print a type before the name here.<\/span> <span class=\"sg\" data-s=\"1\">An untyped container is not tied to any type, so only the value is shown.<\/span> <span class=\"sg\" data-s=\"2\">The next topic shows that <a href=\"/advanced/scalar-containers/type-constraints/\">a container with a declared type<\/a> behaves differently.<\/span><\/p>"]]},"de":{"t":"Datentypen und skalare Container","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Programm, das eine Variable für verschiedene Arten von Daten verwendet.<\/span> <span class=\"sg\" data-s=\"1\">Wir verwenden <code>dd<\/code>, um bei jedem Schritt zu sehen, was im Container ist.<\/span> <span class=\"sg\" data-s=\"2\">Dieses Beispiel zeigt nur die Idee.<\/span> <span class=\"sg\" data-s=\"3\">Wir empfehlen diesen Programmierstil nicht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>dd<\/code> zeigt, was in diesem Moment in der Variable <code>$value<\/code> ist:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zuerst ist die Variable leer, und <code>dd<\/code> zeigt ihren Wert als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist der undefinierte Basiswert, mit dem jeder untypisierte Container beginnt.<\/span> <span class=\"sg\" data-s=\"2\">Nach den Zuweisungen zeigt <code>dd<\/code> die Ganzzahl und dann den String.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass <code>dd<\/code> hier keinen Typ vor dem Namen ausgibt.<\/span> <span class=\"sg\" data-s=\"1\">Ein untypisierter Container ist an keinen Typ gebunden, deshalb wird nur der Wert gezeigt.<\/span> <span class=\"sg\" data-s=\"2\">Das nächste Thema zeigt, dass sich <a href=\"https://course.raku.org/de/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">ein Container mit deklariertem Typ<\/a> anders verhält.<\/span><\/p>"]]},"nl":{"t":"Gegevenstypen en scalaire containers","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is een programma dat één variabele gebruikt voor verschillende soorten gegevens.<\/span> <span class=\"sg\" data-s=\"1\">We gebruiken <code>dd<\/code> om te zien wat er bij elke stap in de container zit.<\/span> <span class=\"sg\" data-s=\"2\">Dit voorbeeld laat alleen het idee zien.<\/span> <span class=\"sg\" data-s=\"3\">We raden deze programmeerstijl niet aan.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>dd<\/code> toont wat er op dat moment in de variabele <code>$value<\/code> zit:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In het begin is de variabele leeg, en <code>dd<\/code> toont de waarde als <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is de ongedefinieerde basiswaarde waarmee elke container zonder type begint.<\/span> <span class=\"sg\" data-s=\"2\">Na de toewijzingen toont <code>dd<\/code> het gehele getal en daarna de string.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Merk op dat <code>dd<\/code> hier geen type voor de naam afdrukt.<\/span> <span class=\"sg\" data-s=\"1\">Een container zonder type is aan geen enkel type gebonden, dus alleen de waarde wordt getoond.<\/span> <span class=\"sg\" data-s=\"2\">Het volgende onderwerp laat zien dat <a href=\"https://course.raku.org/nl/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">een container met een gedeclareerd type<\/a> zich anders gedraagt.<\/span><\/p>"]]},"es":{"t":"Tipos de datos y contenedores escalares","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un programa que usa una variable para diferentes tipos de datos.<\/span> <span class=\"sg\" data-s=\"1\">Usamos <code>dd<\/code> para ver qué hay en el contenedor en cada paso.<\/span> <span class=\"sg\" data-s=\"2\">Este ejemplo solo muestra la idea.<\/span> <span class=\"sg\" data-s=\"3\">No recomendamos este estilo de programación.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>dd<\/code> muestra lo que hay en la variable <code>$value<\/code> en ese momento:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Al principio, la variable está vacía, y <code>dd<\/code> muestra su valor como <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es el valor base indefinido con el que empieza todo contenedor sin tipo.<\/span> <span class=\"sg\" data-s=\"2\">Después de las asignaciones, <code>dd<\/code> muestra el entero y luego la cadena.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Observa que aquí <code>dd<\/code> no imprime un tipo antes del nombre.<\/span> <span class=\"sg\" data-s=\"1\">Un contenedor sin tipo no está atado a ningún tipo, así que solo se muestra el valor.<\/span> <span class=\"sg\" data-s=\"2\">El siguiente tema muestra que <a href=\"https://course.raku.org/es/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">un contenedor con un tipo declarado<\/a> se comporta de otra manera.<\/span><\/p>"]]},"it":{"t":"Tipi di dati e contenitori scalari","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco un programma che usa una sola variabile per tipi diversi di dati.<\/span> <span class=\"sg\" data-s=\"1\">Usiamo <code>dd<\/code> per vedere cosa c'è nel contenitore a ogni passo.<\/span> <span class=\"sg\" data-s=\"2\">Questo esempio mostra solo l'idea.<\/span> <span class=\"sg\" data-s=\"3\">Non consigliamo questo stile di programmazione.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>dd<\/code> mostra cosa c'è nella variabile <code>$value<\/code> in quel momento:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">All'inizio la variabile è vuota, e <code>dd<\/code> mostra il suo valore come <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È il valore base indefinito con cui inizia ogni contenitore non tipizzato.<\/span> <span class=\"sg\" data-s=\"2\">Dopo le assegnazioni, <code>dd<\/code> mostra l'intero e poi la stringa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notate che qui <code>dd<\/code> non stampa un tipo prima del nome.<\/span> <span class=\"sg\" data-s=\"1\">Un contenitore non tipizzato non è legato a nessun tipo, quindi viene mostrato solo il valore.<\/span> <span class=\"sg\" data-s=\"2\">Il prossimo argomento mostra che <a href=\"https://course.raku.org/it/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">un contenitore con un tipo dichiarato<\/a> si comporta in modo diverso.<\/span><\/p>"]]},"lv":{"t":"Datu tipi un skalārie konteineri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir programma, kas izmanto vienu mainīgo dažādiem datu veidiem.<\/span> <span class=\"sg\" data-s=\"1\">Mēs izmantojam <code>dd<\/code>, lai redzētu, kas ir konteinerā katrā solī.<\/span> <span class=\"sg\" data-s=\"2\">Šis piemērs tikai parāda ideju.<\/span> <span class=\"sg\" data-s=\"3\">Mēs neiesakām šādu programmēšanas stilu.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>dd<\/code> izsaukums parāda, kas tajā brīdī ir mainīgajā <code>$value<\/code>:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sākumā mainīgais ir tukšs, un <code>dd<\/code> parāda tā vērtību kā <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir nedefinētā bāzes vērtība, ar ko sākas katrs netipizēts konteineris.<\/span> <span class=\"sg\" data-s=\"2\">Pēc piešķiršanām <code>dd<\/code> parāda veselo skaitli un pēc tam virkni.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka <code>dd<\/code> šeit neizdrukā tipu pirms nosaukuma.<\/span> <span class=\"sg\" data-s=\"1\">Netipizēts konteineris nav piesaistīts nevienam tipam, tāpēc tiek parādīta tikai vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Nākamā tēma parāda, ka <a href=\"https://course.raku.org/lv/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">konteineris ar deklarētu tipu<\/a> uzvedas citādi.<\/span><\/p>"]]},"ru":{"t":"Типы данных и скалярные контейнеры","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот программа, которая использует одну переменную для разных видов данных.<\/span> <span class=\"sg\" data-s=\"1\">Мы используем <code>dd<\/code>, чтобы увидеть, что лежит в контейнере на каждом шаге.<\/span> <span class=\"sg\" data-s=\"2\">Этот пример только показывает идею.<\/span> <span class=\"sg\" data-s=\"3\">Мы не советуем так программировать.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>dd<\/code> показывает, что лежит в переменной <code>$value<\/code> в этот момент:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сначала переменная пустая, и <code>dd<\/code> показывает её значение как <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это неопределённое базовое значение, с которого начинает любой контейнер без типа.<\/span> <span class=\"sg\" data-s=\"2\">После присваиваний <code>dd<\/code> показывает сначала целое число, а потом строку.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что здесь <code>dd<\/code> не печатает тип перед именем.<\/span> <span class=\"sg\" data-s=\"1\">Контейнер без типа не привязан ни к какому типу, поэтому показывается только значение.<\/span> <span class=\"sg\" data-s=\"2\">Следующая тема покажет, что <a href=\"https://course.raku.org/ru/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер с объявленным типом<\/a> ведёт себя иначе.<\/span><\/p>"]]},"uk":{"t":"Типи даних і скалярні контейнери","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось програма, яка використовує одну змінну для різних видів даних.<\/span> <span class=\"sg\" data-s=\"1\">Ми використовуємо <code>dd<\/code>, щоб побачити, що є в контейнері на кожному кроці.<\/span> <span class=\"sg\" data-s=\"2\">Цей приклад лише показує ідею.<\/span> <span class=\"sg\" data-s=\"3\">Ми не радимо такий стиль програмування.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>dd<\/code> показує, що є у змінній <code>$value<\/code> у цю мить:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Спочатку змінна порожня, і <code>dd<\/code> показує її значення як <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це невизначене базове значення, з якого починає кожен нетипізований контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Після присвоєнь <code>dd<\/code> показує ціле число, а потім рядок.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що тут <code>dd<\/code> не виводить типу перед іменем.<\/span> <span class=\"sg\" data-s=\"1\">Нетипізований контейнер не прив'язаний до жодного типу, тож показано лише значення.<\/span> <span class=\"sg\" data-s=\"2\">Наступна тема показує, що <a href=\"https://course.raku.org/uk/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер з оголошеним типом<\/a> поводиться інакше.<\/span><\/p>"]]},"bg":{"t":"Типове данни и скаларни контейнери","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето програма, която използва една променлива за различни видове данни.<\/span> <span class=\"sg\" data-s=\"1\">Използваме <code>dd<\/code>, за да видим какво има в контейнера на всяка стъпка.<\/span> <span class=\"sg\" data-s=\"2\">Този пример само показва идеята.<\/span> <span class=\"sg\" data-s=\"3\">Не препоръчваме този стил на програмиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>dd<\/code> показва какво има в променливата <code>$value<\/code> в този момент:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В началото променливата е празна и <code>dd<\/code> показва стойността й като <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е неопределената базова стойност, с която започва всеки нетипизиран контейнер.<\/span> <span class=\"sg\" data-s=\"2\">След присвояванията <code>dd<\/code> показва цялото число, а след това низа.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че тук <code>dd<\/code> не отпечатва тип преди името.<\/span> <span class=\"sg\" data-s=\"1\">Нетипизираният контейнер не е свързан с никакъв тип, затова се показва само стойността.<\/span> <span class=\"sg\" data-s=\"2\">Следващата тема показва, че <a href=\"https://course.raku.org/bg/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">контейнер с деклариран тип<\/a> се държи различно.<\/span><\/p>"]]},"eo":{"t":"Datentipoj kaj skalaraj ujoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen programo, kiu uzas unu variablon por diversaj specoj de datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Ni uzas <code>dd<\/code> por vidi, kio estas en la ujo en ĉiu paŝo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu ekzemplo nur montras la ideon.<\/span> <span class=\"sg\" data-s=\"3\">Ni ne rekomendas ĉi tiun stilon de programado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>dd<\/code> montras, kio estas en la variablo <code>$value<\/code> en tiu momento:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Komence, la variablo estas malplena, kaj <code>dd<\/code> montras ĝian valoron kiel <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas la nedifinita baza valoro, kun kiu ĉiu netipigita ujo komenciĝas.<\/span> <span class=\"sg\" data-s=\"2\">Post la asignoj, <code>dd<\/code> montras la entjeron kaj poste la ĉenon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke <code>dd<\/code> ne presas tipon antaŭ la nomo ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Netipigita ujo ne estas ligita al iu tipo, do nur la valoro estas montrata.<\/span> <span class=\"sg\" data-s=\"2\">La sekva temo montras, ke <a href=\"https://course.raku.org/eo/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">ujo kun deklarita tipo<\/a> kondutas alie.<\/span><\/p>"]]},"la":{"t":"Data genera et scalaria receptacula","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic est programma quod unam variabilem pro diversis generibus datorum adhibet.<\/span> <span class=\"sg\" data-s=\"1\"><code>dd<\/code> adhibemus ut videamus quid in continenti in quoque gradu sit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc exemplum solum ideam ostendit.<\/span> <span class=\"sg\" data-s=\"3\">Hunc modum programmandi non commendamus.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\ndd $value;\n\n$value = 42;\ndd $value;\n\n$value = 'forty-two';\ndd $value;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio <code>dd<\/code> ostendit quid in variabili <code>$value<\/code> illo momento sit:<\/span><\/p>"],["code",0,"<pre><code>$value = Any\n$value = 42\n$value = \"forty-two\"<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Initio variabilis vacua est, et <code>dd<\/code> valorem eius ut <code>Any<\/code> ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Hic est valor indefinitus basalis quo quisque continens sine typo incipit.<\/span> <span class=\"sg\" data-s=\"2\">Post assignationes <code>dd<\/code> numerum integrum et deinde seriem ostendit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod <code>dd<\/code> hic typum ante nomen non imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Continens sine typo nulli typo ligatus est, itaque solum valor ostenditur.<\/span> <span class=\"sg\" data-s=\"2\">Thema sequens ostendit <a href=\"https://course.raku.org/la/advanced/scalar-containers/type-constraints/\" target=\"_blank\" rel=\"noopener\">continentem cum typo declarato<\/a> aliter se gerere.<\/span><\/p>"]]}}}</script>
