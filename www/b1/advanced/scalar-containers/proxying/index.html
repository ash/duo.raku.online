<script type="application/json" id="page-data">{"u":"advanced/scalar-containers/proxying","n":360,"k":"topic","pv":"advanced/scalar-containers/default","nx":"advanced/scalar-containers/exercises","tr":["advanced","advanced/scalar-containers"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Proxying method calls","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In fact, a scalar container is an object of the <code>Scalar<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">In most cases, you do not even notice the container when you use a scalar.<\/span> <span class=\"sg\" data-s=\"2\">You do not need to think about it.<\/span> <span class=\"sg\" data-s=\"3\">You can imagine that you work directly with the values in it.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This works because a scalar container passes method calls on to its value.<\/span> <span class=\"sg\" data-s=\"1\">For example, after <code>my $lang = 'Raku'<\/code>, you can call the <code>.chars<\/code> method on the variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The program prints <code>4<\/code>, the number of characters in the string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Now call <code>.chars<\/code> directly on the string value, not on the container variable.<\/span> <span class=\"sg\" data-s=\"2\">The result is exactly the same:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In other words, the container quietly passes the <code>.chars<\/code> call to the string inside it.<\/span> <span class=\"sg\" data-s=\"1\">Then it returns the result to you.<\/span><\/p>"]]},"de":{"t":"Proxierung von Methodenaufrufen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich ist ein Skalar-Container ein Objekt vom Typ <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In den meisten Fällen bemerkst du den Container gar nicht, wenn du einen Skalar verwendest.<\/span> <span class=\"sg\" data-s=\"2\">Du musst nicht an ihn denken.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst dir vorstellen, dass du direkt mit den Werten darin arbeitest.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das funktioniert, weil ein Skalar-Container Methodenaufrufe an seinen Wert weitergibt.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kannst du nach <code>my $lang = 'Raku'<\/code> die Methode <code>.chars<\/code> für die Variable aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt <code>4<\/code> aus, die Anzahl der Zeichen im String <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Rufe jetzt <code>.chars<\/code> direkt für den Stringwert auf, nicht für die Containervariable.<\/span> <span class=\"sg\" data-s=\"2\">Das Ergebnis ist genau dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit anderen Worten: Der Container gibt den <code>.chars<\/code>-Aufruf still an den String darin weiter.<\/span> <span class=\"sg\" data-s=\"1\">Dann gibt er dir das Ergebnis zurück.<\/span><\/p>"]]},"nl":{"t":"Proxying van methode-aanroepen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een scalaire container is in feite een object van het type <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In de meeste gevallen merk je de container niet eens als je een scalar gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">Je hoeft er niet aan te denken.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt je voorstellen dat je direct met de waarden erin werkt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit werkt omdat een scalaire container methodeaanroepen doorstuurt naar zijn waarde.<\/span> <span class=\"sg\" data-s=\"1\">Na <code>my $lang = 'Raku'<\/code> kun je bijvoorbeeld de <code>.chars<\/code>-methode aanroepen op de variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt <code>4<\/code> af, het aantal tekens in de string <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Roep nu <code>.chars<\/code> direct aan op de stringwaarde, niet op de containervariabele.<\/span> <span class=\"sg\" data-s=\"2\">Het resultaat is precies hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met andere woorden: de container stuurt de <code>.chars<\/code>-aanroep stil door naar de string erin.<\/span> <span class=\"sg\" data-s=\"1\">Daarna geeft hij het resultaat aan je terug.<\/span><\/p>"]]},"es":{"t":"Proxificación de llamadas a métodos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De hecho, un contenedor escalar es un objeto del tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En la mayoría de los casos, ni siquiera notas el contenedor cuando usas un escalar.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas pensar en él.<\/span> <span class=\"sg\" data-s=\"3\">Puedes imaginar que trabajas directamente con los valores que contiene.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto funciona porque un contenedor escalar pasa las llamadas a métodos a su valor.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, después de <code>my $lang = 'Raku'<\/code>, puedes llamar al método <code>.chars<\/code> sobre la variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El programa imprime <code>4<\/code>, el número de caracteres de la cadena <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ahora llama a <code>.chars<\/code> directamente sobre el valor de la cadena, no sobre la variable contenedora.<\/span> <span class=\"sg\" data-s=\"2\">El resultado es exactamente el mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En otras palabras, el contenedor pasa en silencio la llamada a <code>.chars<\/code> a la cadena que tiene dentro.<\/span> <span class=\"sg\" data-s=\"1\">Luego te devuelve el resultado.<\/span><\/p>"]]},"it":{"t":"Proxying delle chiamate di metodo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In realtà, un contenitore scalare è un oggetto del tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nella maggior parte dei casi, quando usate uno scalare, non notate nemmeno il contenitore.<\/span> <span class=\"sg\" data-s=\"2\">Non avete bisogno di pensarci.<\/span> <span class=\"sg\" data-s=\"3\">Potete immaginare di lavorare direttamente con i valori al suo interno.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo funziona perché un contenitore scalare passa le chiamate ai metodi al suo valore.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, dopo <code>my $lang = 'Raku'<\/code>, potete chiamare il metodo <code>.chars<\/code> sulla variabile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa <code>4<\/code>, il numero di caratteri nella stringa <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ora chiamate <code>.chars<\/code> direttamente sul valore stringa, non sulla variabile contenitore.<\/span> <span class=\"sg\" data-s=\"2\">Il risultato è esattamente lo stesso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In altre parole, il contenitore passa in silenzio la chiamata <code>.chars<\/code> alla stringa che contiene.<\/span> <span class=\"sg\" data-s=\"1\">Poi vi restituisce il risultato.<\/span><\/p>"]]},"lv":{"t":"Metožu izsaukumu pāradresēšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Patiesībā skalārs konteineris ir <code>Scalar<\/code> tipa objekts.<\/span> <span class=\"sg\" data-s=\"1\">Vairumā gadījumu jūs pat nepamanāt konteineru, kad lietojat skalāru.<\/span> <span class=\"sg\" data-s=\"2\">Jums par to nav jādomā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat iedomāties, ka strādājat tieši ar vērtībām, kas ir tajā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas darbojas tāpēc, ka skalārs konteineris nodod metožu izsaukumus tālāk savai vērtībai.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, pēc <code>my $lang = 'Raku'<\/code> jūs varat izsaukt metodi <code>.chars<\/code> mainīgajam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā <code>4<\/code>, rakstzīmju skaitu virknē <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tagad izsauciet <code>.chars<\/code> tieši virknes vērtībai, nevis konteinera mainīgajam.<\/span> <span class=\"sg\" data-s=\"2\">Rezultāts ir tieši tāds pats:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Citiem vārdiem, konteineris klusi nodod <code>.chars<\/code> izsaukumu virknei, kas ir tajā.<\/span> <span class=\"sg\" data-s=\"1\">Tad tas atgriež jums rezultātu.<\/span><\/p>"]]},"ru":{"t":"Проксирование вызова методов","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">На самом деле скалярный контейнер — это объект типа <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чаще всего, когда вы используете скаляр, вы даже не замечаете контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Вам не нужно о нём думать.<\/span> <span class=\"sg\" data-s=\"3\">Можно представить, что вы работаете прямо со значениями, которые в нём хранятся.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это работает, потому что скалярный контейнер передаёт вызовы методов своему значению.<\/span> <span class=\"sg\" data-s=\"1\">Например, после <code>my $lang = 'Raku'<\/code> можно вызвать метод <code>.chars<\/code> для переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Программа печатает <code>4<\/code> — число символов в строке <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Теперь вызовите <code>.chars<\/code> прямо для строкового значения, а не для переменной-контейнера.<\/span> <span class=\"sg\" data-s=\"2\">Результат точно такой же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Другими словами, контейнер незаметно передаёт вызов <code>.chars<\/code> строке внутри себя.<\/span> <span class=\"sg\" data-s=\"1\">Затем он возвращает вам результат.<\/span><\/p>"]]},"uk":{"t":"Проксіювання викликів методів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Насправді скалярний контейнер — це об'єкт типу <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У більшості випадків ви навіть не помічаєте контейнера, коли використовуєте скаляр.<\/span> <span class=\"sg\" data-s=\"2\">Вам не треба про нього думати.<\/span> <span class=\"sg\" data-s=\"3\">Можна уявляти, що ви працюєте напряму зі значеннями в ньому.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це працює, бо скалярний контейнер передає виклики методів своєму значенню.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, після <code>my $lang = 'Raku'<\/code> можна викликати метод <code>.chars<\/code> для змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Програма виводить <code>4<\/code> — кількість символів у рядку <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тепер викличте <code>.chars<\/code> прямо для рядкового значення, а не для змінної-контейнера.<\/span> <span class=\"sg\" data-s=\"2\">Результат точно такий самий:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Іншими словами, контейнер тихо передає виклик <code>.chars<\/code> рядку, який у ньому лежить.<\/span> <span class=\"sg\" data-s=\"1\">Потім він повертає вам результат.<\/span><\/p>"]]},"bg":{"t":"Проксиране на методни повиквания","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Всъщност скаларният контейнер е обект от тип <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В повечето случаи дори не забелязвате контейнера, когато използвате скалар.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно да мислите за него.<\/span> <span class=\"sg\" data-s=\"3\">Можете да си представяте, че работите директно със стойностите в него.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това работи, защото скаларният контейнер препраща извикванията на методи към своята стойност.<\/span> <span class=\"sg\" data-s=\"1\">Например след <code>my $lang = 'Raku'<\/code> можете да извикате метода <code>.chars<\/code> върху променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва <code>4<\/code>, броя на символите в низа <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Сега извикайте <code>.chars<\/code> директно върху стойността на низа, а не върху контейнерната променлива.<\/span> <span class=\"sg\" data-s=\"2\">Резултатът е абсолютно същият:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С други думи, контейнерът тихо препраща извикването на <code>.chars<\/code> към низа в него.<\/span> <span class=\"sg\" data-s=\"1\">След това ви връща резултата.<\/span><\/p>"]]},"eo":{"t":"Prokuranto de metodvokoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Fakte, skalara ujo estas objekto de la tipo <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Plej ofte, vi eĉ ne rimarkas la ujon, kiam vi uzas skalaron.<\/span> <span class=\"sg\" data-s=\"2\">Vi ne bezonas pensi pri ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas imagi, ke vi laboras rekte kun la valoroj en ĝi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio funkcias, ĉar skalara ujo transdonas metodvokojn al sia valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, post <code>my $lang = 'Raku'<\/code>, vi povas voki la metodon <code>.chars<\/code> sur la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La programo presas <code>4<\/code>, la nombron de signoj en la ĉeno <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nun voku <code>.chars<\/code> rekte sur la ĉena valoro, ne sur la ujo-variablo.<\/span> <span class=\"sg\" data-s=\"2\">La rezulto estas ekzakte la sama:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Alivorte, la ujo silente transdonas la vokon <code>.chars<\/code> al la ĉeno en ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi redonas la rezulton al vi.<\/span><\/p>"]]},"la":{"t":"Procuratio vocationum methodorum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Re vera continens scalaris est obiectum typi <code>Scalar<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In plerisque casibus continentem ne animadvertis quidem cum scalarem adhibes.<\/span> <span class=\"sg\" data-s=\"2\">De eo cogitare non debes.<\/span> <span class=\"sg\" data-s=\"3\">Imaginari potes te directe cum valoribus in eo laborare.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc operatur quia continens scalaris vocationes methodorum ad valorem suum mittit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, post <code>my $lang = 'Raku'<\/code> methodum <code>.chars<\/code> in variabili vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';\nsay $lang.chars; # 4<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Programma <code>4<\/code> imprimit, numerum characterum in serie <code>'Raku'<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nunc <code>.chars<\/code> directe in valore seriei voca, non in variabili continentis.<\/span> <span class=\"sg\" data-s=\"2\">Resultatum prorsus idem est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.chars; # 4<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliis verbis, continens tacite vocationem <code>.chars<\/code> ad seriem in eo mittit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde resultatum tibi reddit.<\/span><\/p>"]]}}}</script>
