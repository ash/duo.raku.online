 the same. But <code>$typed<\/code> still has its type, so it would not accept a non-integer value. <code>$untyped<\/code>, on the other hand, accepts anything.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Typisiert oder untypisiert","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung für die Aufgabe.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> beschreibt die beiden Container unterschiedlich. Für den untypisierten gibt es nur <code>$untyped<\/code> aus. Für den typisierten setzt es den deklarierten Typ davor: <code>Int $typed<\/code>. Dieses Präfix ist genau das, was ein deklarierter Typ ändert.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Auch die leeren Werte sind verschieden. Ein untypisierter Container beginnt mit dem einfachen undefinierten Wert <code>Any<\/code>. Aber ein typisierter Container beginnt mit dem undefinierten Wert <em>seines<\/em> Typs, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nachdem du beiden <code>42<\/code> zugewiesen hast, sehen die Werte gleich aus. Aber <code>$typed<\/code> hat immer noch seinen Typ, also würde es nur Ganzzahlen annehmen. <code>$untyped<\/code> dagegen nimmt alles an.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Getypt of ongetypt","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing voor de opgave.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> beschrijft de twee containers op een andere manier. Voor de container zonder type drukt het alleen <code>$untyped<\/code> af. Voor de container met type zet <code>dd<\/code> het gedeclareerde type ervoor: <code>Int $typed<\/code>. Dat voorvoegsel is precies wat een gedeclareerd type verandert.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ook de lege waarden zijn anders. Een container zonder type begint met de eenvoudige ongedefinieerde waarde <code>Any<\/code>. Maar een container met type begint met de ongedefinieerde waarde van <em>zijn<\/em> type, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nadat je aan beide <code>42<\/code> toewijst, zien de waarden er hetzelfde uit. Maar <code>$typed<\/code> heeft nog steeds zijn type, dus die zou een niet-gehele waarde weigeren. <code>$untyped<\/code> accepteert daarentegen alles.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Tipado o sin tipar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución para la tarea.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> describe los dos contenedores de manera diferente. Para el que no tiene tipo, imprime solo <code>$untyped<\/code>. Para el que tiene tipo, pone delante el tipo declarado: <code>Int $typed<\/code>. Este prefijo es exactamente lo que cambia un tipo declarado.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los valores vacíos también son diferentes. Un contenedor sin tipo empieza con el valor indefinido simple <code>Any<\/code>. Pero un contenedor con tipo empieza con el valor indefinido de <em>su<\/em> tipo, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Después de asignar <code>42<\/code> a las dos, los valores se ven iguales. Pero <code>$typed<\/code> todavía tiene su tipo, así que no aceptaría un valor que no sea entero. En cambio, <code>$untyped<\/code> acepta cualquier cosa.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Tipizzato o non tipizzato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione del compito д можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> описывает два контейнера по-разному. Для контейнера без типа она печатает просто <code>$untyped<\/code>. Для контейнера с типом она ставит впереди объявленный тип: <code>Int $typed<\/code>. Этот префикс и есть то, что меняет объявленный тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пустые значения тоже различаются. Контейнер без типа начинает с простого неопределённого значения <code>Any<\/code>. А контейнер с типом начинает с неопределённого значения <em>своего<\/em> типа, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">После того как вы присвоите обеим <code>42<\/code>, значения выглядят одинаково. Но у <code>$typed<\/code> всё ещё есть свой тип, поэтому она не приняла бы нецелое значение. А <code>$untyped<\/code> принимает что угодно.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Типізований чи нетипізований","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків задачі.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> описує ці два контейнери по-різному. Для нетипізованого він виводить просто <code>$untyped<\/code>. Для типізованого він ставить попереду оголошений тип: <code>Int $typed<\/code>. Цей префікс — саме те, що змінює оголошений тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Порожні значення теж різняться. Нетипізований контейнер починає з простого невизначеного значення <code>Any<\/code>. А типізований контейнер починає з невизначеного значення <em>свого<\/em> типу — <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Після того як ви присвоїте обом <code>42<\/code>, значення виглядають однаково. Але <code>$typed<\/code> досі має свій тип, тому він не прийняв би нецілого значення. А <code>$untyped<\/code> приймає будь-що.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Типизиран или нетипизиран","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение на задачата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> описва двата контейнера по различен начин. За нетипизирания отпечатва само <code>$untyped<\/code>. За типизирания поставя декларирания тип отпред: <code>Int $typed<\/code>. Този префикс е точно това, което декларираният тип променя.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Празните стойности също са различни. Нетипизираният контейнер започва с простата неопределена стойност <code>Any<\/code>. А типизираният контейнер започва с неопределената стойност на <em>своя<\/em> тип, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След като присвоите <code>42<\/code> и на двете, стойностите изглеждат еднакво. Но <code>$typed<\/code> все още има своя тип, затова не би приела стойност, която не е цяло число. <code>$untyped<\/code>, от друга страна, приема всичко.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Tipita aŭ netipita","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo de la tasko.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> priskribas la du ujojn malsame. Por la netipita, ĝi presas nur <code>$untyped<\/code>. Por la tipita, ĝi metas la deklaritan tipon antaŭe: <code>Int $typed<\/code>. Ĉi tiu prefikso estas ĝuste tio, kion ŝanĝas deklarita tipo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ankaŭ la malplenaj valoroj estas malsamaj. Netipita ujo komenciĝas kun la simpla nedifinita valoro <code>Any<\/code>. Sed tipita ujo komenciĝas kun la nedifinita valoro de <em>sia<\/em> tipo, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post kiam vi atribuas <code>42<\/code> al ambaŭ, la valoroj aspektas same. Sed <code>$typed<\/code> ankoraŭ havas sian tipon, do ĝi ne akceptus ne-entjeran valoron. <code>$untyped<\/code>, aliflanke, akceptas ion ajn.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Typificatum vel non typificatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis huius operis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $untyped;\nmy Int $typed;\n\ndd $untyped;\ndd $typed;\n\n$untyped = 42;\n$typed = 42;\n\ndd $untyped;\ndd $typed;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/scalar-containers/reuse-the-container.raku\" target=\"_blank\" rel=\"noopener\">reuse-the-container.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>$untyped = Any\nInt $typed = Int\n$untyped = 42\nInt $typed = 42<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>dd<\/code> duos continentes diverse describit. Pro eo qui sine typo est solum <code>$untyped<\/code> imprimit. Pro eo qui typum habet typum declaratum ante ponit: <code>Int $typed<\/code>. Hoc praefixum exacte est quod typus declaratus mutat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Valores vacui quoque differunt. Continens sine typo cum valore indefinito simplici <code>Any<\/code> incipit. Sed continens cum typo cum valore indefinito <em>sui<\/em> typi incipit, <code>Int<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Postquam <code>42<\/code> ambabus assignas, valores idem apparent. Sed <code>$typed<\/code> adhuc typum suum habet, itaque valorem non integrum non acciperet. <code>$untyped<\/code> autem quidlibet accipit.<\/span><\/li><\/ol>"]]}}}</script>
