e>.<\/span> <span class=\"sg\" data-s=\"1\">Eble vi atendis tion, se vi pensis, ke la defaŭlta valoro de <code>$int<\/code> estas <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed la programo ankaŭ presas averton:<\/span><\/p>"],["code",0,"<pre><code>Use of uninitialized value $int of type Any in numeric context\n  in block &lt;unit&gt; at t.raku line 2\n5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por klarigi, kio estas la valoro, vi povas aŭ mem asigni ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay $int + 5; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aŭ vi povas difini defaŭltan valoron per la trajto <code>is default<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(0);\nsay $int + 5; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La defaŭlta valoro ne devas esti nulo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas esti ajna valoro, kiun vi opinias bona elekto, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(1);\nsay $int + 5; # 6<\/code><\/pre>"]]},"la":{"t":"Valores praedefiniti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum novam variabilem scalarem creas nec statim quicquam ei assignas.<\/span> <span class=\"sg\" data-s=\"1\">Etiam tum continens valorem tenet, valorem defectus suum.<\/span> <span class=\"sg\" data-s=\"2\">Valor defectus exactus a typo variabilis pendet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Programma sequens non est optimus modus Raku utendi.<\/span> <span class=\"sg\" data-s=\"1\">Sed ideam ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int;\nsay $int + 5;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Output <code>5<\/code> continet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fortasse exspectabas, si putabas valorem defectus <code>$int<\/code> esse <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed programma etiam monitum imprimit:<\/span><\/p>"],["code",0,"<pre><code>Use of uninitialized value $int of type Any in numeric context\n  in block &lt;unit&gt; at t.raku line 2\n5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut valor clarus sit, aut eum ipse assignare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int = 0;\nsay $int + 5; # 5<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aut valorem defectus cum tratto <code>is default<\/code> ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(0);\nsay $int + 5; # 5<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor defectus non necessario zero est.<\/span> <span class=\"sg\" data-s=\"1\">Quilibet valor esse potest quem bonam electionem putas, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $int is default(1);\nsay $int + 5; # 6<\/code><\/pre>"]]}}}</script>
