<script type="application/json" id="page-data">{"u":"advanced/scalar-containers","n":355,"k":"section","pv":"advanced/containers","nx":"advanced/scalar-containers/types","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Scalar containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">As the name tells you, scalar containers keep single, or scalar, values.<\/span> <span class=\"sg\" data-s=\"1\">These containers have the <code>$<\/code> sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a very simple and direct way to use a scalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>$lang<\/code> variable is a scalar container.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">By default, scalar containers do not limit the type of their data.<\/span> <span class=\"sg\" data-s=\"1\">So you can keep a value of any type in them.<\/span> <span class=\"sg\" data-s=\"2\">Here is the simplest way to show this.<\/span> <span class=\"sg\" data-s=\"3\">You can use the same variable for an integer and then for a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The author does not encourage you to write programs this way.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Internally, this means the following.<\/span> <span class=\"sg\" data-s=\"1\">By default, a new container can keep values of the <code>Any<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> is the base type of most other types, such as <code>Int<\/code> or <code>Str<\/code>.<\/span><\/p>"]]},"de":{"t":"Skalare Container","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie der Name schon sagt, speichern Skalar-Container einzelne, also skalare, Werte.<\/span> <span class=\"sg\" data-s=\"1\">Diese Container haben das Sigil <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine sehr einfache und direkte Art, einen Skalar zu verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$lang<\/code> ist ein Skalar-Container.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig begrenzen Skalar-Container den Typ ihrer Daten nicht.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du darin einen Wert von jedem Typ speichern.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist der einfachste Weg, das zu zeigen.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst dieselbe Variable erst für eine Ganzzahl und dann für einen String verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Autor ermutigt dich nicht, Programme so zu schreiben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intern bedeutet das Folgendes.<\/span> <span class=\"sg\" data-s=\"1\">Standardmäßig kann ein neuer Container Werte vom Typ <code>Any<\/code> speichern.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> ist der Basistyp der meisten anderen Typen, wie <code>Int<\/code> oder <code>Str<\/code>.<\/span><\/p>"]]},"nl":{"t":"Scalaire containers","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Zoals de naam al zegt, bewaren scalaire containers enkele, of scalaire, waarden.<\/span> <span class=\"sg\" data-s=\"1\">Deze containers hebben het <code>$<\/code>-sigil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een heel eenvoudige en directe manier om een scalar te gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$lang<\/code> is een scalaire container.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Standaard beperken scalaire containers het type van hun gegevens niet.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er dus een waarde van elk type in bewaren.<\/span> <span class=\"sg\" data-s=\"2\">Hier is de eenvoudigste manier om dat te laten zien.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dezelfde variabele gebruiken voor een geheel getal en daarna voor een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De auteur moedigt je niet aan om zo programma's te schrijven.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Intern betekent dit het volgende.<\/span> <span class=\"sg\" data-s=\"1\">Standaard kan een nieuwe container waarden van het type <code>Any<\/code> bewaren.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> is het basistype van de meeste andere typen, zoals <code>Int<\/code> of <code>Str<\/code>.<\/span><\/p>"]]},"es":{"t":"Contenedores escalares","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Como dice su nombre, los contenedores escalares guardan valores individuales, o escalares.<\/span> <span class=\"sg\" data-s=\"1\">Estos contenedores tienen el sigilo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una forma muy simple y directa de usar un escalar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$lang<\/code> es un contenedor escalar.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por defecto, los contenedores escalares no limitan el tipo de sus datos.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes guardar en ellos un valor de cualquier tipo.<\/span> <span class=\"sg\" data-s=\"2\">Esta es la forma más simple de mostrarlo.<\/span> <span class=\"sg\" data-s=\"3\">Puedes usar la misma variable para un entero y luego para una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El autor no te anima a escribir programas de esta manera.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Internamente, esto significa lo siguiente.<\/span> <span class=\"sg\" data-s=\"1\">Por defecto, un contenedor nuevo puede guardar valores del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> es el tipo base de la mayoría de los otros tipos, como <code>Int<\/code> o <code>Str<\/code>.<\/span><\/p>"]]},"it":{"t":"Contenitori scalari","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Come dice il nome, i contenitori scalari conservano valori singoli, o scalari.<\/span> <span class=\"sg\" data-s=\"1\">Questi contenitori hanno il sigillo <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modo molto semplice e diretto di usare uno scalare:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$lang<\/code> è un contenitore scalare.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Di default, i contenitori scalari non limitano il tipo dei loro dati.<\/span> <span class=\"sg\" data-s=\"1\">Quindi potete metterci un valore di qualsiasi tipo.<\/span> <span class=\"sg\" data-s=\"2\">Ecco il modo più semplice per mostrarlo.<\/span> <span class=\"sg\" data-s=\"3\">Potete usare la stessa variabile per un intero e poi per una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">L'autore non vi incoraggia a scrivere programmi in questo modo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Internamente, questo vuol dire quanto segue.<\/span> <span class=\"sg\" data-s=\"1\">Di default, un nuovo contenitore può contenere valori del tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> è il tipo base della maggior parte degli altri tipi, come <code>Int<\/code> o <code>Str<\/code>.<\/span><\/p>"]]},"lv":{"t":"Skalārie konteineri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kā norāda nosaukums, skalārie konteineri glabā atsevišķas jeb skalāras vērtības.<\/span> <span class=\"sg\" data-s=\"1\">Šiem konteineriem ir sigils <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir ļoti vienkāršs un tiešs veids, kā lietot skalāru:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$lang<\/code> ir skalārs konteineris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma skalārie konteineri neierobežo savu datu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat glabāt tajos jebkura tipa vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir vienkāršākais veids, kā to parādīt.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat izmantot vienu un to pašu mainīgo veselam skaitlim un pēc tam virknei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Autors neaicina jūs rakstīt programmas šādā veidā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iekšēji tas nozīmē šo.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma jauns konteineris var glabāt <code>Any<\/code> tipa vērtības.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> ir bāzes tips lielākajai daļai citu tipu, piemēram, <code>Int<\/code> vai <code>Str<\/code>.<\/span><\/p>"]]},"ru":{"t":"Скалярные контейнеры","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Как говорит название, скалярные контейнеры хранят одиночные, или скалярные, значения.<\/span> <span class=\"sg\" data-s=\"1\">У этих контейнеров есть сигил <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот очень простой и прямой способ использовать скаляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$lang<\/code> — это скалярный контейнер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">По умолчанию скалярные контейнеры не ограничивают тип своих данных.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в них можно хранить значение любого типа.<\/span> <span class=\"sg\" data-s=\"2\">Вот самый простой способ это показать.<\/span> <span class=\"sg\" data-s=\"3\">Одну и ту же переменную можно использовать сначала для целого числа, а потом для строки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Автор не рекомендует вам писать программы таким образом.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Внутри это означает следующее.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию новый контейнер может хранить значения типа <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> — это базовый тип для большинства других типов, например <code>Int<\/code> или <code>Str<\/code>.<\/span><\/p>"]]},"uk":{"t":"Скалярні контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Як каже назва, скалярні контейнери зберігають поодинокі, або скалярні, значення.<\/span> <span class=\"sg\" data-s=\"1\">Ці контейнери мають сигіл <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось дуже простий і прямий спосіб використати скаляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$lang<\/code> є скалярним контейнером.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням скалярні контейнери не обмежують тип своїх даних.<\/span> <span class=\"sg\" data-s=\"1\">Тому в них можна зберігати значення будь-якого типу.<\/span> <span class=\"sg\" data-s=\"2\">Ось найпростіший спосіб це показати.<\/span> <span class=\"sg\" data-s=\"3\">Ту саму змінну можна використати для цілого числа, а потім для рядка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Автор не радить вам так писати програми.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Усередині Raku це означає ось що.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням новий контейнер може зберігати значення типу <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> — це базовий тип для більшості інших типів, як-от <code>Int<\/code> чи <code>Str<\/code>.<\/span><\/p>"]]},"bg":{"t":"Скаларни контейнери","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Както подсказва името, скаларните контейнери пазят единични, или скаларни, стойности.<\/span> <span class=\"sg\" data-s=\"1\">Тези контейнери имат сигила <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето един много прост и пряк начин да използвате скалар:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$lang<\/code> е скаларен контейнер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">По подразбиране скаларните контейнери не ограничават типа на данните си.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да пазите в тях стойност от всякакъв тип.<\/span> <span class=\"sg\" data-s=\"2\">Ето най-простият начин да покажем това.<\/span> <span class=\"sg\" data-s=\"3\">Можете да използвате една и съща променлива първо за цяло число, а след това за низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Авторът не ви насърчава да пишете програми по този начин.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вътрешно това означава следното.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране нов контейнер може да пази стойности от тип <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> е базовият тип на повечето други типове, като <code>Int<\/code> или <code>Str<\/code>.<\/span><\/p>"]]},"eo":{"t":"Skalaraj ujoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel la nomo diras al vi, skalaraj ujoj tenas unuopajn, aŭ skalarajn, valorojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiuj ujoj havas la sigelon <code>$<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen tre simpla kaj rekta maniero uzi skalaron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$lang<\/code> estas skalara ujo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, skalaraj ujoj ne limigas la tipon de siaj datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas teni valoron de ajna tipo en ili.<\/span> <span class=\"sg\" data-s=\"2\">Jen la plej simpla maniero montri tion.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas uzi la saman variablon por entjero kaj poste por ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La aŭtoro ne kuraĝigas vin skribi programojn tiamaniere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interne, tio signifas la jenon.<\/span> <span class=\"sg\" data-s=\"1\">Defaŭlte, nova ujo povas teni valorojn de la tipo <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> estas la baza tipo de plej multaj aliaj tipoj, kiel <code>Int<\/code> aŭ <code>Str<\/code>.<\/span><\/p>"]]},"la":{"t":"Scalaria receptacula","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ut nomen tibi dicit, continentes scalares valores singulos, vel scalares, servant.<\/span> <span class=\"sg\" data-s=\"1\">Hi continentes sigillum <code>$<\/code> habent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est modus valde simplex et directus scalarem adhibendi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lang = 'Raku';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$lang<\/code> est continens scalaris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Per defectum continentes scalares typum datorum suorum non limitant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque valorem cuiuslibet typi in eis servare potes.<\/span> <span class=\"sg\" data-s=\"2\">Hic est modus simplicissimus hoc ostendendi.<\/span> <span class=\"sg\" data-s=\"3\">Eandem variabilem pro numero integro et deinde pro serie adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 42;\n$value = 'forty-two';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Auctor te non hortatur programmata hoc modo scribere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interne hoc significat quod sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Per defectum novus continens valores typi <code>Any<\/code> servare potest.<\/span> <span class=\"sg\" data-s=\"2\"><code>Any<\/code> est typus basalis plerorumque aliorum typorum, ut <code>Int<\/code> vel <code>Str<\/code>.<\/span><\/p>"]]}}}</script>
