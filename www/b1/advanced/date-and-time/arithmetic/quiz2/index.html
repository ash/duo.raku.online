<script type="application/json" id="page-data">{"u":"advanced/date-and-time/arithmetic/quiz2","n":481,"k":"quiz","pv":"advanced/date-and-time/arithmetic/quiz","nx":"advanced/date-and-time/time","tr":["advanced","advanced/date-and-time","advanced/date-and-time/arithmetic"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Adding months","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">What does the following program print?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 1, 31).later(:months(1));<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">2026-02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">One month after 31 January would be \"31 February\", but that day does not exist.<\/span> <span class=\"sg\" data-s=\"1\">So <code>later<\/code> moves the result back to the last real day of that month.<\/span> <span class=\"sg\" data-s=\"2\">This gives 28 February 2026.<\/span> <span class=\"sg\" data-s=\"3\">Because 2026 is not a leap year, February has only 28 days.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Monate addieren","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Was gibt das folgende Programm aus?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 1, 31).later(:months(1));<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">2026-02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\ 02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un mes después del 31 de enero sería el \"31 de febrero\", pero ese día no existe.<\/span> <span class=\"sg\" data-s=\"1\">Por eso <code>later<\/code> mueve el resultado hacia atrás, hasta el último día real de ese mes.<\/span> <span class=\"sg\" data-s=\"2\">Así se obtiene el 28 de febrero de 2026.<\/span> <span class=\"sg\" data-s=\"3\">Como 2026 no es un año bisiesto, febrero tiene solo 28 días.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Aggiungere mesi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Cosa stampa il seguente programma?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 1, 31).later(:months(1));<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">2026-02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un mese dopo il 31 gennaio sarebbe il \"31 febbraio\", ma quel giorno non esiste.<\/span> <span class=\"sg\" data-s=\"1\">Così <code>later<\/code> sposta indietro il risultato all'ultimo giorno reale di quel mese.<\/span> <span class=\"sg\" data-s=\"2\">Si ottiene il 28 febbraio 2026.<\/span> <span class=\"sg\" data-s=\"3\">Dato che il 2026 non è un anno bisestile, febbraio ha solo 28 giorni.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Mēnešu pieskaitīšana","b":[["p",1,"<p><span class=\"sg\ 6 года.<\/span> <span class=\"sg\" data-s=\"3\">Так как 2026 год не високосный, в феврале только 28 дней.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Додавання місяців","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Що виведе наведена програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 1, 31).later(:months(1));<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">2026-02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Через місяць після 31 січня було б «31 лютого», але такого дня не існує.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>later<\/code> переносить результат назад на останній справжній день цього місяця.<\/span> <span class=\"sg\" data-s=\"2\">Так виходить 28 лютого 2026 року.<\/span> <span class=\"sg\" data-s=\"3\">Оскільки 2026 рік не високосний, лютий має лише 28 днів.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Добавяне на месеци","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какво отпечатва следната програма?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 1, 31).later(:months(1));<\/code><\/pre>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">2026-02-28<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">2026-03-03<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">2026-02-31<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Един месец след 31 януари би бил „31 февруари\", но такъв д -opt\"><span class=\"sg\" data-s=\"3\">2026-03-31<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Unus mensis post 31 Ianuarii esset \"31 Februarii\", sed ille dies non exsistit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>later<\/code> eventum retro movet ad ultimum verum diem illius mensis.<\/span> <span class=\"sg\" data-s=\"2\">Sic accipis 28 Februarii 2026.<\/span> <span class=\"sg\" data-s=\"3\">Quia 2026 non est annus bisextilis, Februarius tantum 28 dies habet.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
