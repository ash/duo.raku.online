<script type="application/json" id="page-data">{"u":"advanced/date-and-time/arithmetic","n":479,"k":"topic","pv":"advanced/date-and-time","nx":"advanced/date-and-time/arithmetic/quiz","tr":["advanced","advanced/date-and-time"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Date arithmetic","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You can do arithmetic with dates.<\/span> <span class=\"sg\" data-s=\"1\">This makes many everyday calculations simple.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">If you add an integer to a date, it moves forward by that many days.<\/span> <span class=\"sg\" data-s=\"1\">The result is a new date.<\/span> <span class=\"sg\" data-s=\"2\">Its month and year change automatically when needed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you subtract one date from another, you get the number of days between them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For bigger steps, there are the <code>later<\/code> and <code>earlier<\/code> methods.<\/span> <span class=\"sg\" data-s=\"1\">They take named arguments like <code>:days<\/code>, <code>:months<\/code> or <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">These methods count correctly when a new month or year begins.<\/span> <span class=\"sg\" data-s=\"1\">So you never have to worry about how many days a month has.<\/span><\/p>"]]},"de":{"t":"Datumsarithmetik","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du kannst mit Daten rechnen.<\/span> <span class=\"sg\" data-s=\"1\">Das macht viele alltägliche Berechnungen einfach.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn du eine ganze Zahl zu einem Datum addierst, geht es um so viele Tage nach vorne.<\/span> <span class=\"sg\" data-s=\"1\">Das Ergebnis ist ein neues Datum.<\/span> <span class=\"sg\" data-s=\"2\">Monat und Jahr ändern sich automatisch, wenn das nötig ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Datum von einem anderen subtrahierst, bekommst du die Anzahl der Tage zwischen ihnen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Für größere Schritte gibt es die Methoden <code>later<\/code> und <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie nehmen benannte Argumente wie <code>:days<\/code>, <code>:months<\/code> oder <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese Methoden rechnen richtig, auch wenn ein neuer Monat oder ein neues Jahr beginnt.<\/span> <span class=\"sg\" data-s=\"1\">So musst du dir nie Gedanken machen, wie viele Tage ein Monat hat.<\/span><\/p>"]]},"nl":{"t":"Datumrekenen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt met datums rekenen.<\/span> <span class=\"sg\" data-s=\"1\">Dat maakt veel alledaagse berekeningen eenvoudig.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je een geheel getal bij een datum optelt, gaat die zoveel dagen vooruit.<\/span> <span class=\"sg\" data-s=\"1\">Het resultaat is een nieuwe datum.<\/span> <span class=\"sg\" data-s=\"2\">De maand en het jaar veranderen automatisch als dat nodig is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je de ene datum van de andere aftrekt, krijg je het aantal dagen ertussen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voor grotere stappen zijn er de methoden <code>later<\/code> en <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die accepteren benoemde argumenten zoals <code>:days<\/code>, <code>:months<\/code> of <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Deze methoden rekenen goed als er een nieuwe maand of een nieuw jaar begint.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft je dus nooit zorgen te maken over hoeveel dagen een maand heeft.<\/span><\/p>"]]},"es":{"t":"Aritmética de fechas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Puedes hacer aritmética con fechas.<\/span> <span class=\"sg\" data-s=\"1\">Esto hace que muchos cálculos de cada día sean simples.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si sumas un entero a una fecha, la fecha avanza ese número de días.<\/span> <span class=\"sg\" data-s=\"1\">El resultado es una fecha nueva.<\/span> <span class=\"sg\" data-s=\"2\">Su mes y su año cambian automáticamente cuando hace falta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si restas una fecha de otra, obtienes el número de días entre ellas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para pasos más grandes, existen los métodos <code>later<\/code> y <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aceptan argumentos con nombre como <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Estos métodos cuentan bien cuando empieza un nuevo mes o un nuevo año.<\/span> <span class=\"sg\" data-s=\"1\">Así que nunca tienes que preocuparte por cuántos días tiene un mes.<\/span><\/p>"]]},"it":{"t":"Aritmetica delle date","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi fare operazioni aritmetiche con le date.<\/span> <span class=\"sg\" data-s=\"1\">Questo rende semplici molti calcoli di tutti i giorni.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se aggiungi un intero a una data, la data va avanti di quel numero di giorni.<\/span> <span class=\"sg\" data-s=\"1\">Il risultato è una nuova data.<\/span> <span class=\"sg\" data-s=\"2\">Il mese e l'anno cambiano da soli, quando serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se sottrai una data da un'altra, ottieni il numero di giorni tra le due:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per passi più grandi ci sono i metodi <code>later<\/code> e <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Accettano argomenti con nome come <code>:days<\/code>, <code>:months<\/code> o <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questi metodi contano in modo corretto quando inizia un nuovo mese o un nuovo anno.<\/span> <span class=\"sg\" data-s=\"1\">Così non devi mai preoccuparti di quanti giorni ha un mese.<\/span><\/p>"]]},"lv":{"t":"Datumu aritmētika","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar datumiem var veikt aritmētiskas darbības.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara daudzus ikdienas aprēķinus vienkāršus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja datumam pieskaitāt veselu skaitli, tas pavirzās uz priekšu par tik dienām.<\/span> <span class=\"sg\" data-s=\"1\">Rezultāts ir jauns datums.<\/span> <span class=\"sg\" data-s=\"2\">Tā mēnesis un gads mainās automātiski, kad vajag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja atņemat vienu datumu no otra, jūs iegūstat dienu skaitu starp tiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lielākiem soļiem ir metodes <code>later<\/code> un <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tās pieņem nosauktus argumentus, piemēram, <code>:days<\/code>, <code>:months<\/code> vai <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šīs metodes rēķina pareizi arī tad, kad sākas jauns mēnesis vai gads.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jums nekad nav jāuztraucas par to, cik dienu ir mēnesī.<\/span><\/p>"]]},"ru":{"t":"Арифметика дат","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">С датами можно выполнять арифметические действия.<\/span> <span class=\"sg\" data-s=\"1\">Это делает многие повседневные расчёты простыми.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если прибавить к дате целое число, она сдвинется вперёд на столько же дней.<\/span> <span class=\"sg\" data-s=\"1\">Результат — новая дата.<\/span> <span class=\"sg\" data-s=\"2\">Месяц и год в ней меняются автоматически, когда это нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вычесть одну дату из другой, вы получите количество дней между ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для больших шагов есть методы <code>later<\/code> и <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Они принимают именованные аргументы, такие как <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эти методы считают правильно и тогда, когда начинается новый месяц или год.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вам никогда не нужно думать о том, сколько дней в месяце.<\/span><\/p>"]]},"uk":{"t":"Арифметика дат","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">З датами можна виконувати арифметичні дії.<\/span> <span class=\"sg\" data-s=\"1\">Це робить багато щоденних обчислень простими.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо додати до дати ціле число, вона зсунеться вперед на стільки ж днів.<\/span> <span class=\"sg\" data-s=\"1\">Результат — нова дата.<\/span> <span class=\"sg\" data-s=\"2\">Її місяць і рік змінюються автоматично, коли це потрібно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо відняти одну дату від іншої, ви отримаєте кількість днів між ними:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для більших кроків є методи <code>later<\/code> та <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони приймають іменовані аргументи, такі як <code>:days<\/code>, <code>:months<\/code> чи <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ці методи рахують правильно, коли починається новий місяць або рік.<\/span> <span class=\"sg\" data-s=\"1\">Тож вам ніколи не треба думати про те, скільки днів має місяць.<\/span><\/p>"]]},"bg":{"t":"Аритметика с дати","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете да извършвате аритметични действия с дати.<\/span> <span class=\"sg\" data-s=\"1\">Това прави много ежедневни изчисления прости.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако добавите цяло число към дата, тя се премества напред с толкова дни.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът е нова дата.<\/span> <span class=\"sg\" data-s=\"2\">Месецът и годината ѝ се сменят автоматично, когато е нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако извадите една дата от друга, получавате броя на дните между тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За по-големи стъпки има методите <code>later<\/code> и <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Те приемат именувани аргументи като <code>:days<\/code>, <code>:months<\/code> или <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тези методи смятат правилно, когато започва нов месец или нова година.<\/span> <span class=\"sg\" data-s=\"1\">Така никога не трябва да се притеснявате колко дни има даден месец.<\/span><\/p>"]]},"eo":{"t":"Datkalkulado","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas fari aritmetikon kun datoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio faras multajn ĉiutagajn kalkulojn simplaj.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi aldonas entjeron al dato, ĝi moviĝas antaŭen je tiom da tagoj.<\/span> <span class=\"sg\" data-s=\"1\">La rezulto estas nova dato.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia monato kaj jaro aŭtomate ŝanĝiĝas, kiam necese:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi subtrahas unu daton de alia, vi ricevas la nombron de tagoj inter ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por pli grandaj paŝoj, ekzistas la metodoj <code>later<\/code> kaj <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ili akceptas nomitajn argumentojn kiel <code>:days<\/code>, <code>:months<\/code> aŭ <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj metodoj kalkulas ĝuste, kiam nova monato aŭ jaro komenciĝas.<\/span> <span class=\"sg\" data-s=\"1\">Do vi neniam devas zorgi pri tio, kiom da tagoj havas monato.<\/span><\/p>"]]},"la":{"t":"Arithmetica dierum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum diebus arithmeticam facere potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc multas computationes cotidianas simplices reddit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si numerum integrum ad diem addis, dies tot diebus progreditur.<\/span> <span class=\"sg\" data-s=\"1\">Eventus est novus dies.<\/span> <span class=\"sg\" data-s=\"2\">Mensis et annus eius sponte mutantur, si opus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27) + 7; # 2026-07-04<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si unum diem ab alio subtrahis, numerum dierum inter eos accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 7, 4) - Date.new(2026, 6, 27); # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro maioribus gradibus sunt methodi <code>later<\/code> et <code>earlier<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Argumenta nominata accipiunt, ut <code>:days<\/code>, <code>:months<\/code> vel <code>:years<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).later(:days(10));    # 2026-07-07\nsay Date.new(2026, 6, 27).earlier(:months(2)); # 2026-04-27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hae methodi recte numerant cum novus mensis vel annus incipit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque numquam curare debes quot dies mensis habeat.<\/span><\/p>"]]}}}</script>
