<script type="application/json" id="page-data">{"u":"advanced/date-and-time","n":478,"k":"section","pv":"advanced/quoting/exercises/a-heredoc/solution","nx":"advanced/date-and-time/arithmetic","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Date and time","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku has built-in types for calendar dates and clock times.<\/span> <span class=\"sg\" data-s=\"1\">A calendar date has the <code>Date<\/code> type.<\/span> <span class=\"sg\" data-s=\"2\">To create one, you give the year, the month and the day:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you have a date, you can read its parts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>day-of-week<\/code> method tells you the day of the week of a date.<\/span> <span class=\"sg\" data-s=\"1\">It gives a number from <code>1<\/code> for Monday to <code>7<\/code> for Sunday:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">June 27, 2026, is a Saturday, so the result is <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>is-leap-year<\/code> method checks whether the year of the date is a leap year:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Call <code>Date.today<\/code> to get today’s date.<\/span> <span class=\"sg\" data-s=\"1\">Its output is not shown here.<\/span> <span class=\"sg\" data-s=\"2\">It depends on the day when you run the program.<\/span><\/p>"]]},"de":{"t":"Datum und Uhrzeit","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hat eingebaute Typen für Kalenderdaten und Uhrzeiten.<\/span> <span class=\"sg\" data-s=\"1\">Ein Kalenderdatum hat den Typ <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Um eines zu erstellen, gibst du das Jahr, den Monat und den Tag an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Datum hast, kannst du seine Teile auslesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>day-of-week<\/code> sagt dir den Wochentag eines Datums.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt eine Zahl von <code>1<\/code> für Montag bis <code>7<\/code> für Sonntag zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der 27.06.2026 ist ein Samstag, also ist das Ergebnis <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>is-leap-year<\/code> prüft, ob das Jahr des Datums ein Schaltjahr ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rufe <code>Date.today<\/code> auf, um das heutige Datum zu bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausgabe zeigen wir hier nicht.<\/span> <span class=\"sg\" data-s=\"2\">Sie hängt vom Tag ab, an dem du das Programm ausführst.<\/span><\/p>"]]},"nl":{"t":"Datum en tijd","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku heeft ingebouwde typen voor kalenderdatums en kloktijden.<\/span> <span class=\"sg\" data-s=\"1\">Een kalenderdatum heeft het type <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Om er een te maken, geef je het jaar, de maand en de dag op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je een datum hebt, kun je de delen ervan lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De methode <code>day-of-week<\/code> vertelt je op welke dag van de week een datum valt.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft een nummer van <code>1<\/code> voor maandag tot <code>7<\/code> voor zondag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 juni 2026 is een zaterdag, dus het resultaat is <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>is-leap-year<\/code> controleert of het jaar van de datum een schrikkeljaar is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Roep <code>Date.today<\/code> aan om de datum van vandaag te krijgen.<\/span> <span class=\"sg\" data-s=\"1\">De uitvoer staat hier niet.<\/span> <span class=\"sg\" data-s=\"2\">Die hangt af van de dag waarop je het programma uitvoert.<\/span><\/p>"]]},"es":{"t":"Fecha y hora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku tiene tipos incorporados para fechas de calendario y horas del reloj.<\/span> <span class=\"sg\" data-s=\"1\">Una fecha de calendario tiene el tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Para crear una, das el año, el mes y el día:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando tienes una fecha, puedes leer sus partes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>day-of-week<\/code> te dice el día de la semana de una fecha.<\/span> <span class=\"sg\" data-s=\"1\">Da un número desde <code>1<\/code> para el lunes hasta <code>7<\/code> para el domingo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El 27 de junio de 2026 es sábado, así que el resultado es <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>is-leap-year<\/code> comprueba si el año de la fecha es bisiesto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Llama a <code>Date.today<\/code> para obtener la fecha de hoy.<\/span> <span class=\"sg\" data-s=\"1\">Su salida no se muestra aquí.<\/span> <span class=\"sg\" data-s=\"2\">Depende del día en que ejecutes el programa.<\/span><\/p>"]]},"it":{"t":"Data e ora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ha dei tipi predefiniti per le date del calendario e per gli orari.<\/span> <span class=\"sg\" data-s=\"1\">Una data del calendario ha il tipo <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per crearne una, indichi l'anno, il mese e il giorno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando hai una data, puoi leggere le sue parti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>day-of-week<\/code> ti dice in quale giorno della settimana cade una data.<\/span> <span class=\"sg\" data-s=\"1\">Dà un numero da <code>1<\/code> per il lunedì a <code>7<\/code> per la domenica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il 27 giugno 2026 è un sabato, quindi il risultato è <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>is-leap-year<\/code> controlla se l'anno della data è bisestile:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Chiama <code>Date.today<\/code> per ottenere la data di oggi.<\/span> <span class=\"sg\" data-s=\"1\">Il suo output qui non è mostrato.<\/span> <span class=\"sg\" data-s=\"2\">Dipende dal giorno in cui esegui il programma.<\/span><\/p>"]]},"lv":{"t":"Datums un laiks","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ir iebūvēti tipi kalendāra datumiem un pulksteņa laikiem.<\/span> <span class=\"sg\" data-s=\"1\">Kalendāra datumam ir tips <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izveidotu, jūs norādāt gadu, mēnesi un dienu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jums ir datums, jūs varat nolasīt tā daļas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>day-of-week<\/code> pasaka, kurā nedēļas dienā ir datums.<\/span> <span class=\"sg\" data-s=\"1\">Tā dod skaitli no <code>1<\/code> pirmdienai līdz <code>7<\/code> svētdienai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27.06.2026 ir sestdiena, tāpēc rezultāts ir <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>is-leap-year<\/code> pārbauda, vai datuma gads ir garais gads:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Izsauciet <code>Date.today<\/code>, lai iegūtu šodienas datumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā izvade šeit nav parādīta.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir atkarīga no dienas, kad jūs palaižat programmu.<\/span><\/p>"]]},"ru":{"t":"Дата и время","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенные типы для календарных дат и времени.<\/span> <span class=\"sg\" data-s=\"1\">Календарная дата имеет тип <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы создать её, вы указываете год, месяц и день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда у вас есть дата, вы можете прочитать её части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> сообщает, на какой день недели приходится дата.<\/span> <span class=\"sg\" data-s=\"1\">Он даёт число от <code>1<\/code> для понедельника до <code>7<\/code> для воскресенья:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 июня 2026 года — суббота, поэтому результат равен <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>is-leap-year<\/code> проверяет, високосный ли год у этой даты:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вызовите <code>Date.today<\/code>, чтобы получить сегодняшнюю дату.<\/span> <span class=\"sg\" data-s=\"1\">Её результат здесь не показан.<\/span> <span class=\"sg\" data-s=\"2\">Он зависит от того, в какой день вы запускаете программу.<\/span><\/p>"]]},"uk":{"t":"Дата й час","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku є вбудовані типи для календарних дат і часу на годиннику.<\/span> <span class=\"sg\" data-s=\"1\">Календарна дата має тип <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб створити її, ви вказуєте рік, місяць і день:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли у вас є дата, ви можете прочитати її частини:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>day-of-week<\/code> каже, на який день тижня припадає дата.<\/span> <span class=\"sg\" data-s=\"1\">Він дає число від <code>1<\/code> для понеділка до <code>7<\/code> для неділі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 червня 2026 року — субота, тому результат — <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>is-leap-year<\/code> перевіряє, чи є рік цієї дати високосним:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Викличте <code>Date.today<\/code>, щоб отримати сьогоднішню дату.<\/span> <span class=\"sg\" data-s=\"1\">Її вивід тут не показано.<\/span> <span class=\"sg\" data-s=\"2\">Він залежить від того, в який день ви запускаєте програму.<\/span><\/p>"]]},"bg":{"t":"Дата и време","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има вградени типове за календарни дати и часове.<\/span> <span class=\"sg\" data-s=\"1\">Календарната дата има типа <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За да създадете такава, подавате годината, месеца и деня:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d; # 2026-06-27<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато имате дата, можете да прочетете нейните части:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $d = Date.new(2026, 6, 27);\nsay $d.year;  # 2026\nsay $d.month; # 6\nsay $d.day;   # 27<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>day-of-week<\/code> ви казва кой ден от седмицата е датата.<\/span> <span class=\"sg\" data-s=\"1\">Той дава число от <code>1<\/code> за понеделник до <code>7<\/code> за неделя:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2026, 6, 27).day-of-week; # 6<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">27 юни 2026 е събота, така че резултатът е <code>6<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>is-leap-year<\/code> проверява дали годината на датата е високосна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Date.new(2024, 1, 1).is-leap-year; # True\nsay Date.new(2026, 1, 1).is-leap-year; # False<\/code><\/pre>"],["p",3,"<p><
