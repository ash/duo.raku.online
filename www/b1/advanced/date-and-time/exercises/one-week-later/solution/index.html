ank\" rel=\"noopener\">one-week-later.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>2027-03-07\n7<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>later(:days(7))<\/code> movas la daton antaŭen je sep tagoj, kio estas unu semajno. Ni ankaŭ povus skribi <code>+ 7<\/code>, sed la nomita argumento klare montras la unuon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Februaro 2027 havas nur 28 tagojn. Do unu semajnon post la 28-a, Raku per si mem iras en marton. La rezulto estas <code>2027-03-07<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Se vi vokas <code>day-of-week<\/code> sur la nova dato, vi ricevas <code>7<\/code>. Tiel estas facile kontroli la rezulton. Ĝuste unu semajnon poste, la tago de la semajno devas esti la <em>sama<\/em> kiel antaŭe. Kaj <code>2027-02-28<\/code> ankaŭ estas dimanĉo (<code>7<\/code>), do <code>7<\/code> estas la respondo, kiun vi atendas.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Una septimana postea","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $later = Date.new(2027, 2, 28).later(:days(7));\nsay $later;\nsay $later.day-of-week;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/date-and-time/one-week-later.raku\" target=\"_blank\" rel=\"noopener\">one-week-later.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>2027-03-07\n7<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>later
