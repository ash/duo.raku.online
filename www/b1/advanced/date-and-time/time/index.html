<script type="application/json" id="page-data">{"u":"advanced/date-and-time/time","n":482,"k":"topic","pv":"advanced/date-and-time/arithmetic/quiz2","nx":"advanced/date-and-time/exercises","tr":["advanced","advanced/date-and-time"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Working with time","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">If you need both the date and the time of day, use the <code>DateTime<\/code> type.<\/span> <span class=\"sg\" data-s=\"1\">You create it almost like a <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But you also give the hour, the minute and the second:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The default text form follows the ISO 8601 standard.<\/span> <span class=\"sg\" data-s=\"1\">It has the date, the letter <code>T<\/code> and the time.<\/span> <span class=\"sg\" data-s=\"2\">At the end, a <code>Z<\/code> stands for the UTC time zone.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <code>DateTime<\/code> has the date parts that you already know.<\/span> <span class=\"sg\" data-s=\"1\">It also lets you read the parts of the time:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To get the current moment, call <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Its output is not shown here, just as for <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It changes every time you run the program.<\/span><\/p>"]]},"de":{"t":"Mit Uhrzeiten arbeiten","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn du das Datum und auch die Uhrzeit brauchst, verwende den Typ <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Du erstellst ihn fast wie ein <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber du gibst auch die Stunde, die Minute und die Sekunde an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die normale Textform folgt dem Standard ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Sie enthält das Datum, den Buchstaben <code>T<\/code> und die Uhrzeit.<\/span> <span class=\"sg\" data-s=\"2\">Am Ende steht ein <code>Z<\/code> für die Zeitzone UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein <code>DateTime<\/code> hat die Teile des Datums, die du schon kennst.<\/span> <span class=\"sg\" data-s=\"1\">Außerdem kannst du damit die Teile der Uhrzeit lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Für den aktuellen Zeitpunkt rufe <code>DateTime.now<\/code> auf.<\/span> <span class=\"sg\" data-s=\"1\">Die Ausgabe zeigen wir hier nicht, genau wie bei <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie ändert sich jedes Mal, wenn du das Programm ausführst.<\/span><\/p>"]]},"nl":{"t":"Werken met tijd","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je zowel de datum als de tijd van de dag nodig hebt, gebruik je het <code>DateTime<\/code>-type.<\/span> <span class=\"sg\" data-s=\"1\">Je maakt het bijna op dezelfde manier als een <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar je geeft ook het uur, de minuut en de seconde op:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De standaard tekstvorm volgt de ISO 8601-standaard.<\/span> <span class=\"sg\" data-s=\"1\">Die bevat de datum, de letter <code>T<\/code> en de tijd.<\/span> <span class=\"sg\" data-s=\"2\">Aan het eind staat een <code>Z<\/code> voor de UTC-tijdzone.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <code>DateTime<\/code> heeft de datumdelen die je al kent.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er ook de delen van de tijd mee lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om het huidige moment te krijgen, roep je <code>DateTime.now<\/code> aan.<\/span> <span class=\"sg\" data-s=\"1\">De uitvoer staat hier niet, net als bij <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die verandert elke keer dat je het programma uitvoert.<\/span><\/p>"]]},"es":{"t":"Trabajando con la hora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Si necesitas tanto la fecha como la hora del día, usa el tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo creas casi igual que un <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero también das la hora, el minuto y el segundo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma de texto por defecto sigue el estándar ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Tiene la fecha, la letra <code>T<\/code> y la hora.<\/span> <span class=\"sg\" data-s=\"2\">Al final, una <code>Z<\/code> indica la zona horaria UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>DateTime<\/code> tiene las partes de la fecha que ya conoces.<\/span> <span class=\"sg\" data-s=\"1\">También te deja leer las partes de la hora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para obtener el momento actual, llama a <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Su salida no se muestra aquí, igual que con <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cambia cada vez que ejecutas el programa.<\/span><\/p>"]]},"it":{"t":"Lavorare con l'ora","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Se ti servono sia la data sia l'ora del giorno, usa il tipo <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lo crei quasi come un <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma indichi anche l'ora, il minuto e il secondo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La forma di testo predefinita segue lo standard ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Contiene la data, la lettera <code>T<\/code> e l'ora.<\/span> <span class=\"sg\" data-s=\"2\">Alla fine, una <code>Z<\/code> indica il fuso orario UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un <code>DateTime<\/code> ha le parti della data che conosci già.<\/span> <span class=\"sg\" data-s=\"1\">Ti permette anche di leggere le parti dell'ora:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per ottenere il momento attuale, chiama <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il suo output qui non è mostrato, proprio come per <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cambia ogni volta che esegui il programma.<\/span><\/p>"]]},"lv":{"t":"Darbs ar laiku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja jums vajag gan datumu, gan diennakts laiku, izmantojiet tipu <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izveidojat gandrīz tāpat kā <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet jūs norādāt arī stundu, minūti un sekundi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Noklusētā teksta forma seko standartam ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir datums, burts <code>T<\/code> un laiks.<\/span> <span class=\"sg\" data-s=\"2\">Beigās <code>Z<\/code> nozīmē UTC laika joslu.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tipam <code>DateTime<\/code> ir datuma daļas, kuras jūs jau zināt.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj nolasīt arī laika daļas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai iegūtu pašreizējo brīdi, izsauciet <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā izvade šeit nav parādīta, tāpat kā <code>Date.today<\/code> gadījumā.<\/span> <span class=\"sg\" data-s=\"2\">Tā mainās katru reizi, kad jūs palaižat programmu.<\/span><\/p>"]]},"ru":{"t":"Работа со временем","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Если вам нужны и дата, и время суток, используйте тип <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы создаёте его почти так же, как <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но вы также указываете час, минуту и секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Текстовая форма по умолчанию следует стандарту ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">В ней есть дата, буква <code>T<\/code> и время.<\/span> <span class=\"sg\" data-s=\"2\">Буква <code>Z<\/code> в конце означает часовой пояс UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <code>DateTime<\/code> есть части даты, которые вы уже знаете.<\/span> <span class=\"sg\" data-s=\"1\">Он также позволяет читать части времени:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы получить текущий момент, вызовите <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Его результат здесь не показан, так же как для <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он меняется каждый раз, когда вы запускаете программу.<\/span><\/p>"]]},"uk":{"t":"Робота з часом","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо вам потрібні і дата, і час доби, використовуйте тип <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви створюєте його майже як <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але ви також вказуєте годину, хвилину й секунду:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типова текстова форма відповідає стандарту ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Вона містить дату, літеру <code>T<\/code> і час.<\/span> <span class=\"sg\" data-s=\"2\">У кінці <code>Z<\/code> позначає часовий пояс UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> має частини дати, які ви вже знаєте.<\/span> <span class=\"sg\" data-s=\"1\">Він також дозволяє читати частини часу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб отримати поточну мить, викличте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Його вивід тут не показано, так само як і для <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він змінюється щоразу, коли ви запускаєте програму.<\/span><\/p>"]]},"bg":{"t":"Работа с време","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако ви трябват и датата, и часът от деня, използвайте типа <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Създавате го почти като <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но подавате също часа, минутата и секундата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Текстовата форма по подразбиране следва стандарта ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Тя съдържа датата, буквата <code>T<\/code> и часа.<\/span> <span class=\"sg\" data-s=\"2\">Накрая <code>Z<\/code> означава часовата зона UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> има частите на датата, които вече познавате.<\/span> <span class=\"sg\" data-s=\"1\">Той ви позволява да прочетете и частите на времето:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да получите текущия момент, извикайте <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Резултатът не е показан тук, също както при <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той се променя всеки път, когато стартирате програмата.<\/span><\/p>"]]},"eo":{"t":"Laboro kun tempo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi bezonas kaj la daton kaj la horon de la tago, uzu la tipon <code>DateTime<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi kreas ĝin preskaŭ kiel <code>Date<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed vi ankaŭ donas la horon, la minuton kaj la sekundon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La defaŭlta teksta formo sekvas la normon ISO 8601.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas la daton, la literon <code>T<\/code> kaj la tempon.<\/span> <span class=\"sg\" data-s=\"2\">Ĉe la fino, <code>Z<\/code> signifas la horzonon UTC.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> havas la datpartojn, kiujn vi jam konas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ lasas vin legi la partojn de la tempo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por ricevi la nunan momenton, voku <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia eligo ne estas montrita ĉi tie, same kiel por <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ŝanĝiĝas ĉiufoje, kiam vi rulas la programon.<\/span><\/p>"]]},"la":{"t":"Laborando cum tempore","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Si et diem et tempus diei requiris, typum <code>DateTime<\/code> adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Eum fere ut <code>Date<\/code> creas.<\/span> <span class=\"sg\" data-s=\"2\">Sed etiam horam, minutum et secundum das:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt; # 2026-06-27T14:30:00Z<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Forma textus praedefinita normam ISO 8601 sequitur.<\/span> <span class=\"sg\" data-s=\"1\">Diem, litteram <code>T<\/code> et tempus habet.<\/span> <span class=\"sg\" data-s=\"2\">In fine <code>Z<\/code> zonam temporis UTC significat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>DateTime<\/code> partes diei habet quas iam cognoscis.<\/span> <span class=\"sg\" data-s=\"1\">Etiam tibi permittit partes temporis legere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $dt = DateTime.new(2026, 6, 27, 14, 30, 0);\nsay $dt.hour;   # 14\nsay $dt.minute; # 30<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut momentum praesens accipias, voca <code>DateTime.now<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Exitus eius hic non monstratur, sicut pro <code>Date.today<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mutatur quotiens programma curris.<\/span><\/p>"]]}}}</script>
