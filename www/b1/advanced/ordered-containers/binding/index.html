">Тому зміну через одне ім'я видно через інше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$y := $x<\/code> не копіює значення <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Натомість <code>$y<\/code> стає ще одним іменем того самого контейнера, що й <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Пізніше, коли <code>$x<\/code> отримує значення <code>20<\/code>, <code>$y<\/code> теж дає <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер порівняйте це зі звичайним присвоєнням.<\/span> <span class=\"sg\" data-s=\"1\">Воно копіює значення в окремий контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # звичайна копія\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зв'язування також працює з масивами.<\/span> <span class=\"sg\" data-s=\"1\">Цей код робить <code>@alias<\/code> ще одним іменем для <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ще одна деталь.<\/span> <span class=\"sg\" data-s=\"1\">Якщо зв'язати ім'я прямо з літеральним значенням, за ним немає контейнера.<\/span> <span class=\"sg\" data-s=\"2\">Тому ім'я стає доступним лише для читання:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"bg":{"t":"Свързване с <code>:=<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досега всяка променлива, която създавахте, получаваше нов контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Присвояването с <code>=<\/code> слагаше стойност <em>в<\/em> този контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Свързването, което се пише с <code>:=<\/code>, е различно.<\/span> <span class=\"sg\" data-s=\"3\">То кара едно име да сочи към <em>съществуващ<\/em> контейнер, вместо да създава нов.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След свързването двете имена споделят един и същ контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Затова промяна чрез едното име се вижда и чрез другото:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$y := $x<\/code> не копира стойността <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това <code>$y<\/code> става друго име за точно същия контейнер като <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По-късно, когато <code>$x<\/code> получи стойност <code>20<\/code>, <code>$y<\/code> също дава <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега го сравнете с обикновеното присвояване.<\/span> <span class=\"sg\" data-s=\"1\">То копира стойността в отделен контейнер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Свързването работи и с масиви.<\/span> <span class=\"sg\" data-s=\"1\">Този код прави <code>@alias<\/code> друго име за <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Още един детайл.<\/span> <span class=\"sg\" data-s=\"1\">Ако свържете име директно с литерална стойност, зад него няма контейнер.<\/span> <span class=\"sg\" data-s=\"2\">Затова името става само за четене:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"eo":{"t":"Ligado per <code>:=<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun, ĉiu variablo, kiun vi kreis, ricevis novan ujon.<\/span> <span class=\"sg\" data-s=\"1\">Atribuo per <code>=<\/code> metis valoron <em>en<\/em> tiun ujon.<\/span> <span class=\"sg\" data-s=\"2\">Ligado, skribata kiel <code>:=<\/code>, estas alia.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi igas nomon montri al <em>ekzistanta<\/em> ujo anstataŭ krei novan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post ligado, la du nomoj kunhavas la saman ujon.<\/span> <span class=\"sg\" data-s=\"1\">Do ŝanĝo tra unu nomo videblas tra la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>$y := $x<\/code> ne kopias la valoron <code>10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭe, <code>$y<\/code> fariĝas alia nomo por ĝuste la sama ujo kiel <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poste, kiam <code>$x<\/code> ricevas <code>20<\/code>, <code>$y<\/code> ankaŭ donas <code>20<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun komparu ĝin kun normala atribuo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kopias la valoron en apartan ujon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # simpla kopio\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ligado funkcias ankaŭ kun tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu kodo faras el <code>@alias<\/code> alian nomon por <code>@data<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nmy @alias := @data;\n\n@alias[0] = 99;\nsay @data; # [99 2 3]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ankoraŭ unu detalo.<\/span> <span class=\"sg\" data-s=\"1\">Se vi ligas nomon rekte al literala valoro, neniu ujo estas malantaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Do la nomo fariĝas nur-legebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $pi := 3.14;\n$pi = 3;<\/code><\/pre>"],["code",0,"<pre><code>Cannot assign to an immutable value\n  in block &lt;unit&gt; at t.raku line 2<\/code><\/pre>"]]},"la":{"t":"Ligatio cum <code>:=<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hucusque quaeque variabilis quam creavisti novum continentem accepit.<\/span> <span class=\"sg\" data-s=\"1\">Assignatio cum <code>=<\/code> valorem <em>in<\/em> illum continentem posuit.<\/span> <span class=\"sg\" data-s=\"2\">Vinculum, quod ut <code>:=<\/code> scribitur, diversum est.<\/span> <span class=\"sg\" data-s=\"3\">Facit ut nomen ad continentem <em>iam existentem<\/em> referat, nec novum creat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post vinculum duo nomina eundem continentem communicant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque mutatio per unum nomen per alterum visibilis est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y := $x;\n\n$x = 20;\nsay $y; # 20<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic <code>$y := $x<\/code> valorem <code>10<\/code> non copiat.<\/span> <span class=\"sg\" data-s=\"1\">Potius <code>$y<\/code> fit aliud nomen pro eodem ipso continenti ac <code>$x<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Postea, cum <code>$x<\/code> ad <code>20<\/code> ponitur, <code>$y<\/code> quoque <code>20<\/code> dat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc id cum assignatione normali compara.<\/span> <span class=\"sg\" data-s=\"1\">Ea valorem in continentem separatum copiat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nmy $y = $x; # a plain copy\n\n$x = 20;\nsay $y; # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vinculum etiam cum ordinibus operatur.<
