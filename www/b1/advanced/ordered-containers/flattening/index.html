<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/flattening","n":373,"k":"topic","pv":"advanced/ordered-containers/binding","nx":"advanced/ordered-containers/flattening/quiz","tr":["advanced","advanced/ordered-containers"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Flattening and itemisation (itemization)","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">If you put one array into another, Raku does <em>not<\/em> merge their elements by itself.<\/span> <span class=\"sg\" data-s=\"1\">Look at this program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The array <code>@c<\/code> has only two elements, the arrays <code>@a<\/code> and <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku keeps each container as one item.<\/span> <span class=\"sg\" data-s=\"2\">It does not unpack its contents into the outer array.<\/span> <span class=\"sg\" data-s=\"3\">The same happens when you put an array among other values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you really want one flat sequence, ask for it directly with the <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisation (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sometimes you want the opposite.<\/span> <span class=\"sg\" data-s=\"1\">You want to protect a container from flattening, even inside <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>$(...)<\/code> construct <em>itemises<\/em> its argument.<\/span> <span class=\"sg\" data-s=\"3\">This means it marks the result as a single item.<\/span> <span class=\"sg\" data-s=\"4\">Compare the previous example with this one:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$(@a)<\/code> keeps <code>@a<\/code> as one element.<\/span> <span class=\"sg\" data-s=\"1\">But <code>@b<\/code> is still flattened into its two values.<\/span> <span class=\"sg\" data-s=\"2\">This is the idea of the <code>$<\/code> sigil again.<\/span> <span class=\"sg\" data-s=\"3\">A <code>$<\/code> means “treat this as a single thing”.<\/span><\/p>"]]},"de":{"t":"Flattening und Itemisierung","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Array in ein anderes steckst, fügt Raku ihre Elemente <em>nicht<\/em> von selbst zusammen.<\/span> <span class=\"sg\" data-s=\"1\">Sieh dir dieses Programm an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das Array <code>@c<\/code> hat nur zwei Elemente, die Arrays <code>@a<\/code> und <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku behält jeden Container als ein Element.<\/span> <span class=\"sg\" data-s=\"2\">Es packt seinen Inhalt nicht in das äußere Array aus.<\/span> <span class=\"sg\" data-s=\"3\">Dasselbe passiert, wenn du ein Array zwischen andere Werte setzt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn du wirklich eine flache Sequenz willst, frage mit der Routine <code>flat<\/code> direkt danach:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisierung<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Manchmal willst du das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Du willst einen Container davor schützen, abgeflacht zu werden, auch innerhalb von <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das Konstrukt <code>$(...)<\/code> <em>itemisiert<\/em> sein Argument.<\/span> <span class=\"sg\" data-s=\"3\">Das bedeutet, es markiert das Ergebnis als einzelnes Element.<\/span> <span class=\"sg\" data-s=\"4\">Vergleiche das vorherige Beispiel mit diesem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier behält <code>$(@a)<\/code> <code>@a<\/code> als ein Element.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>@b<\/code> wird weiterhin in seine zwei Werte abgeflacht.<\/span> <span class=\"sg\" data-s=\"2\">Das ist wieder die Idee des Sigils <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ein <code>$<\/code> bedeutet \"behandle dies als eine einzelne Sache\".<\/span><\/p>"]]},"nl":{"t":"Afvlakken en itemisatie","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een array in een ander array zet, voegt Raku hun elementen <em>niet<\/em> vanzelf samen.<\/span> <span class=\"sg\" data-s=\"1\">Bekijk dit programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het array <code>@c<\/code> heeft maar twee elementen, de arrays <code>@a<\/code> en <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku bewaart elke container als één item.<\/span> <span class=\"sg\" data-s=\"2\">Het pakt de inhoud niet uit in het buitenste array.<\/span> <span class=\"sg\" data-s=\"3\">Hetzelfde gebeurt als je een array tussen andere waarden zet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je echt één platte reeks wilt, vraag er dan direct om met de <code>flat<\/code> routine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatie (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Soms wil je het tegenovergestelde.<\/span> <span class=\"sg\" data-s=\"1\">Je wilt een container beschermen tegen platslaan, zelfs binnen <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De <code>$(...)<\/code> constructie <em>itemiseert<\/em> zijn argument.<\/span> <span class=\"sg\" data-s=\"3\">Dat betekent dat de constructie het resultaat als een enkel item markeert.<\/span> <span class=\"sg\" data-s=\"4\">Vergelijk het vorige voorbeeld met dit voorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier houdt <code>$(@a)<\/code> het array <code>@a<\/code> als één element.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>@b<\/code> wordt nog steeds platgeslagen tot zijn twee waarden.<\/span> <span class=\"sg\" data-s=\"2\">Dit is weer het idee van de <code>$<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"3\">Een <code>$<\/code> betekent \"behandel dit als een enkel ding\".<\/span><\/p>"]]},"es":{"t":"Aplanamiento e itemización","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Si pones un array dentro de otro, Raku <em>no<\/em> une sus elementos por sí solo.<\/span> <span class=\"sg\" data-s=\"1\">Mira este programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El array <code>@c<\/code> tiene solo dos elementos, los arrays <code>@a<\/code> y <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku mantiene cada contenedor como un solo elemento.<\/span> <span class=\"sg\" data-s=\"2\">No saca su contenido al array externo.<\/span> <span class=\"sg\" data-s=\"3\">Lo mismo pasa cuando pones un array entre otros valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si de verdad quieres una sola secuencia plana, pídela directamente con la rutina <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemización<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A veces quieres lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Quieres proteger un contenedor para que no se aplane, incluso dentro de <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La construcción <code>$(...)<\/code> <em>itemiza<\/em> su argumento.<\/span> <span class=\"sg\" data-s=\"3\">Esto significa que marca el resultado como un único elemento.<\/span> <span class=\"sg\" data-s=\"4\">Compara el ejemplo anterior con este:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$(@a)<\/code> mantiene <code>@a<\/code> como un solo elemento.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>@b<\/code> sigue aplanándose en sus dos valores.<\/span> <span class=\"sg\" data-s=\"2\">Esta es otra vez la idea del sigilo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>$<\/code> significa \"trata esto como una sola cosa\".<\/span><\/p>"]]},"it":{"t":"Appiattimento e itemizzazione","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Se metti un array dentro un altro, Raku <em>non<\/em> unisce da solo i loro elementi.<\/span> <span class=\"sg\" data-s=\"1\">Guarda questo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">L'array <code>@c<\/code> ha solo due elementi, gli array <code>@a<\/code> e <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tiene ogni contenitore come un solo elemento.<\/span> <span class=\"sg\" data-s=\"2\">Non svuota il suo contenuto nell'array esterno.<\/span> <span class=\"sg\" data-s=\"3\">Lo stesso succede quando metti un array tra altri valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vuoi davvero una sola sequenza piatta, chiedila direttamente con la routine <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizzazione (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte vuoi il contrario.<\/span> <span class=\"sg\" data-s=\"1\">Vuoi proteggere un contenitore dall'appiattimento, anche dentro <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il costrutto <code>$(...)<\/code> <em>itemizza<\/em> il suo argomento.<\/span> <span class=\"sg\" data-s=\"3\">Vuol dire che segna il risultato come un singolo elemento.<\/span> <span class=\"sg\" data-s=\"4\">Confronta l'esempio precedente con questo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui <code>$(@a)<\/code> tiene <code>@a<\/code> come un solo elemento.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>@b<\/code> viene comunque appiattito nei suoi due valori.<\/span> <span class=\"sg\" data-s=\"2\">Questa è di nuovo l'idea del sigillo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un <code>$<\/code> significa \"tratta questo come una singola cosa\".<\/span><\/p>"]]},"lv":{"t":"Saplacināšana un vienuma veidošana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja jūs ievietojat vienu masīvu citā, Raku pats <em>neapvieno<\/em> to elementus.<\/span> <span class=\"sg\" data-s=\"1\">Aplūkojiet šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Masīvam <code>@c<\/code> ir tikai divi elementi, masīvi <code>@a<\/code> un <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku glabā katru konteineru kā vienu vienību.<\/span> <span class=\"sg\" data-s=\"2\">Tas neizpako tā saturu ārējā masīvā.<\/span> <span class=\"sg\" data-s=\"3\">Tas pats notiek, kad jūs ieliekat masīvu starp citām vērtībām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja jums tiešām vajag vienu plakanu secību, prasiet to tieši ar rutīnu <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemizācija (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag pretējo.<\/span> <span class=\"sg\" data-s=\"1\">Jūs gribat pasargāt konteineru no izlīdzināšanas, pat <code>flat<\/code> iekšienē.<\/span> <span class=\"sg\" data-s=\"2\">Konstrukcija <code>$(...)<\/code> <em>itemizē<\/em> savu argumentu.<\/span> <span class=\"sg\" data-s=\"3\">Tas nozīmē, ka tā atzīmē rezultātu kā vienu vienību.<\/span> <span class=\"sg\" data-s=\"4\">Salīdziniet iepriekšējo piemēru ar šo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$(@a)<\/code> saglabā <code>@a<\/code> kā vienu elementu.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>@b<\/code> joprojām tiek izlīdzināts savās divās vērtībās.<\/span> <span class=\"sg\" data-s=\"2\">Šī atkal ir sigila <code>$<\/code> ideja.<\/span> <span class=\"sg\" data-s=\"3\"><code>$<\/code> nozīmē \"uztvert šo kā vienu lietu\".<\/span><\/p>"]]},"ru":{"t":"Сглаживание и элементизация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вы кладёте один массив в другой, Raku сам <em>не<\/em> объединяет их элементы.<\/span> <span class=\"sg\" data-s=\"1\">Посмотрите на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В массиве <code>@c<\/code> только два элемента — массивы <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku хранит каждый контейнер как один элемент.<\/span> <span class=\"sg\" data-s=\"2\">Он не распаковывает его содержимое во внешний массив.<\/span> <span class=\"sg\" data-s=\"3\">То же самое происходит, когда вы ставите массив среди других значений:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вам действительно нужна одна плоская последовательность, попросите её прямо с помощью функции <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Упаковка в элемент (Itemisation)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно обратное.<\/span> <span class=\"sg\" data-s=\"1\">Вы хотите защитить контейнер от разворачивания, даже внутри <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкция <code>$(...)<\/code> <em>упаковывает<\/em> свой аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Это значит, что она помечает результат как один элемент.<\/span> <span class=\"sg\" data-s=\"4\">Сравните предыдущий пример с этим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>$(@a)<\/code> сохраняет <code>@a<\/code> как один элемент.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>@b<\/code> всё равно разворачивается в свои два значения.<\/span> <span class=\"sg\" data-s=\"2\">Это снова идея сигила <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Знак <code>$<\/code> означает «рассматривать это как одну вещь».<\/span><\/p>"]]},"uk":{"t":"Сплощення та штучність","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо ви кладете один масив в інший, Raku сам <em>не<\/em> зливає їхні елементи.<\/span> <span class=\"sg\" data-s=\"1\">Подивіться на цю програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Масив <code>@c<\/code> має лише два елементи — масиви <code>@a<\/code> та <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku зберігає кожен контейнер як один елемент.<\/span> <span class=\"sg\" data-s=\"2\">Він не розпаковує його вміст у зовнішній масив.<\/span> <span class=\"sg\" data-s=\"3\">Те саме стається, коли ви ставите масив серед інших значень:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо вам справді потрібна одна плоска послідовність, попросіть її прямо за допомогою підпрограми <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Штучність<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді потрібне протилежне.<\/span> <span class=\"sg\" data-s=\"1\">Ви хочете захистити контейнер від сплощення, навіть усередині <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкція <code>$(...)<\/code> робить свій аргумент <em>штучним<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Це означає, що вона позначає результат як один елемент.<\/span> <span class=\"sg\" data-s=\"4\">Порівняйте попередній приклад із цим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$(@a)<\/code> зберігає <code>@a<\/code> як один елемент.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>@b<\/code> усе одно сплощується у свої два значення.<\/span> <span class=\"sg\" data-s=\"2\">Це знову ідея сигіла <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Знак <code>$<\/code> означає «розглядай це як одну річ».<\/span><\/p>"]]},"bg":{"t":"Изравняване и елементизация","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако сложите един масив в друг, Raku <em>не<\/em> обединява сам елементите им.<\/span> <span class=\"sg\" data-s=\"1\">Разгледайте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Масивът <code>@c<\/code> има само два елемента, масивите <code>@a<\/code> и <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku запазва всеки контейнер като един елемент.<\/span> <span class=\"sg\" data-s=\"2\">Той не разопакова съдържанието му във външния масив.<\/span> <span class=\"sg\" data-s=\"3\">Същото се случва, когато сложите масив сред други стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако наистина искате една плоска последователност, поискайте я директно с рутината <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Айтемизация (Itemization)<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога искате обратното.<\/span> <span class=\"sg\" data-s=\"1\">Искате да защитите контейнер от изравняване, дори вътре във <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Конструкцията <code>$(...)<\/code> <em>айтемизира<\/em> аргумента си.<\/span> <span class=\"sg\" data-s=\"3\">Това означава, че тя маркира резултата като единичен елемент.<\/span> <span class=\"sg\" data-s=\"4\">Сравнете предишния пример с този:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$(@a)<\/code> запазва <code>@a<\/code> като един елемент.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>@b<\/code> все пак се изравнява до двете си стойности.<\/span> <span class=\"sg\" data-s=\"2\">Това отново е идеята на сигила <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Знакът <code>$<\/code> означава „третирай това като едно нещо“.<\/span><\/p>"]]},"eo":{"t":"Platigo kaj ero-igo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi metas unu tabelon en alian, Raku <em>ne<\/em> kunigas iliajn elementojn per si mem.<\/span> <span class=\"sg\" data-s=\"1\">Rigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La tabelo <code>@c<\/code> havas nur du elementojn, la tabelojn <code>@a<\/code> kaj <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku tenas ĉiun ujon kiel unu eron.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne elpakas ĝian enhavon en la eksteran tabelon.<\/span> <span class=\"sg\" data-s=\"3\">La samo okazas, kiam vi metas tabelon inter aliajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi vere volas unu platan sekvencon, petu ĝin rekte per la rutino <code>flat<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ero-igo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje vi volas la malon.<\/span> <span class=\"sg\" data-s=\"1\">Vi volas protekti ujon kontraŭ platigo, eĉ ene de <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La konstruo <code>$(...)<\/code> <em>ero-igas<\/em> sian argumenton.<\/span> <span class=\"sg\" data-s=\"3\">Tio signifas, ke ĝi markas la rezulton kiel unuopan eron.<\/span> <span class=\"sg\" data-s=\"4\">Komparu la antaŭan ekzemplon kun ĉi tiu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>$(@a)<\/code> tenas <code>@a<\/code> kiel unu elementon.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>@b<\/code> ankoraŭ estas platigita en siajn du valorojn.<\/span> <span class=\"sg\" data-s=\"2\">Jen denove la ideo de la sigelo <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\"><code>$<\/code> signifas «traktu ĉi tion kiel unu solan aĵon».<\/span><\/p>"]]},"la":{"t":"Complanatio et itemisatio","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Si unum ordinem in alterum ponis, Raku elementa eorum per se <em>non<\/em> confundit.<\/span> <span class=\"sg\" data-s=\"1\">Specta hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\nmy @c = @a, @b;\n\nsay @c.elems; # 2\nsay @c;       # [[1 2 3] [4 5]]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ordo <code>@c<\/code> solum duo elementa habet, ordines <code>@a<\/code> et <code>@b<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Raku quemque continentem ut unum elementum servat.<\/span> <span class=\"sg\" data-s=\"2\">Contenta eius in ordinem exteriorem non effundit.<\/span> <span class=\"sg\" data-s=\"3\">Idem accidit cum ordinem inter alios valores ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @d = 0, @a, 99;\nsay @d; # [0 [1 2 3] 99]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si revera unam seriem planam vis, eam directe cum subroutina <code>flat<\/code> pete:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat(@a, @b);       # (1 2 3 4 5)\nsay flat(@a, @b).elems; # 5<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Itemisatio<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum contrarium vis.<\/span> <span class=\"sg\" data-s=\"1\">Continentem ab explanatione protegere vis, etiam intra <code>flat<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Constructio <code>$(...)<\/code> argumentum suum <em>itemisat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Hoc significat eam resultatum ut unum elementum notare.<\/span> <span class=\"sg\" data-s=\"4\">Compara exemplum praecedens cum hoc:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 1, 2, 3;\nmy @b = 4, 5;\n\nsay flat($(@a), @b); # ([1 2 3] 4 5)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic <code>$(@a)<\/code> ordinem <code>@a<\/code> ut unum elementum servat.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>@b<\/code> adhuc in duos valores suos explanatur.<\/span> <span class=\"sg\" data-s=\"2\">Haec est iterum idea sigilli <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Signum <code>$<\/code> significat “hoc ut rem unam tracta”.<\/span><\/p>"]]}}}</script>
