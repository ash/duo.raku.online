<script type="application/json" id="page-data">{"u":"advanced/ordered-containers/arrays","n":369,"k":"topic","pv":"advanced/ordered-containers","nx":"advanced/ordered-containers/lists","tr":["advanced","advanced/ordered-containers"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">An array is an ordered container, and its elements are scalar containers too.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>@<\/code> sigil means that such a variable behaves like a <code>Positional<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">This lets you use subscripts to read single elements:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each element is a scalar container, so you can assign a new value to it.<\/span> <span class=\"sg\" data-s=\"1\">You do it in the same way as with a separate scalar variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can also assign a value of another type, for example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This is what makes arrays <em>mutable<\/em>, that is, changeable.<\/span> <span class=\"sg\" data-s=\"1\">Each slot is a container that can get a new value.<\/span> <span class=\"sg\" data-s=\"2\">In the next topic, you will see that <a href=\"/advanced/ordered-containers/lists/\">lists<\/a> behave differently.<\/span><\/p>"]]},"de":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Array ist ein geordneter Container, und seine Elemente sind auch Skalar-Container.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Sigil <code>@<\/code> bedeutet, dass sich so eine Variable wie ein <code>Positional<\/code>-Objekt verhält.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb kannst du mit Indizes einzelne Elemente lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jedes Element ist ein Skalar-Container, also kannst du ihm einen neuen Wert zuweisen.<\/span> <span class=\"sg\" data-s=\"1\">Das geht genauso wie bei einer einzelnen Skalarvariable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Du kannst auch einen Wert eines anderen Typs zuweisen, zum Beispiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das macht Arrays <em>veränderbar<\/em>, das heißt, du kannst sie ändern.<\/span> <span class=\"sg\" data-s=\"1\">Jeder Platz ist ein Container, der einen neuen Wert bekommen kann.<\/span> <span class=\"sg\" data-s=\"2\">Im nächsten Thema wirst du sehen, dass sich <a href=\"https://course.raku.org/de/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">Listen<\/a> anders verhalten.<\/span><\/p>"]]},"nl":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Een array is een geordende container, en de elementen ervan zijn ook scalar containers.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>@<\/code> sigil betekent dat zo'n variabele zich gedraagt als een <code>Positional<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">Daardoor kun je subscripts gebruiken om losse elementen te lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elk element is een scalar container, dus je kunt er een nieuwe waarde aan toekennen.<\/span> <span class=\"sg\" data-s=\"1\">Je doet dat op dezelfde manier als bij een losse scalar variabele:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook een waarde van een ander type toekennen, bijvoorbeeld:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit maakt arrays <em>muteerbaar<\/em>, dat wil zeggen: veranderbaar.<\/span> <span class=\"sg\" data-s=\"1\">Elke plek is een container die een nieuwe waarde kan krijgen.<\/span> <span class=\"sg\" data-s=\"2\">In het volgende onderwerp zie je dat <a href=\"https://course.raku.org/nl/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">lists<\/a> zich anders gedragen.<\/span><\/p>"]]},"es":{"t":"Arrays","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array es un contenedor ordenado, y sus elementos también son contenedores escalares.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El sigilo <code>@<\/code> significa que esa variable se comporta como un objeto <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto te permite usar subíndices para leer elementos individuales:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada elemento es un contenedor escalar, así que puedes asignarle un nuevo valor.<\/span> <span class=\"sg\" data-s=\"1\">Lo haces igual que con una variable escalar independiente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">También puedes asignar un valor de otro tipo, por ejemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto es lo que hace que los arrays sean <em>mutables<\/em>, es decir, que se puedan cambiar.<\/span> <span class=\"sg\" data-s=\"1\">Cada posición es un contenedor que puede recibir un nuevo valor.<\/span> <span class=\"sg\" data-s=\"2\">En el siguiente tema, verás que las <a href=\"https://course.raku.org/es/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">listas<\/a> se comportan de otra manera.<\/span><\/p>"]]},"it":{"t":"Array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Un array è un contenitore ordinato, e anche i suoi elementi sono contenitori scalari.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il sigillo <code>@<\/code> vuol dire che una variabile così si comporta come un oggetto <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi usare gli indici per leggere i singoli elementi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni elemento è un contenitore scalare, quindi puoi assegnargli un nuovo valore.<\/span> <span class=\"sg\" data-s=\"1\">Lo fai come con una variabile scalare separata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi anche assegnare un valore di un altro tipo, per esempio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">È questo che rende gli array <em>mutabili<\/em>, cioè modificabili.<\/span> <span class=\"sg\" data-s=\"1\">Ogni posizione è un contenitore che può ricevere un nuovo valore.<\/span> <span class=\"sg\" data-s=\"2\">Nel prossimo argomento, vedrai che le <a href=\"https://course.raku.org/it/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">liste<\/a> si comportano in modo diverso.<\/span><\/p>"]]},"lv":{"t":"Masīvi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Masīvs ir sakārtots konteineris, un arī tā elementi ir skalāri konteineri.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigils <code>@<\/code> nozīmē, ka šāds mainīgais uzvedas kā <code>Positional<\/code> objekts.<\/span> <span class=\"sg\" data-s=\"1\">Tas ļauj izmantot indeksus, lai nolasītu atsevišķus elementus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs elements ir skalārs konteineris, tāpēc jūs varat tam piešķirt jaunu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to darāt tāpat kā ar atsevišķu skalāru mainīgo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs varat piešķirt arī cita tipa vērtību, piemēram:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tieši tas padara masīvus <em>maināmus<\/em>, tas ir, tādus, ko var mainīt.<\/span> <span class=\"sg\" data-s=\"1\">Katra vieta ir konteineris, kas var saņemt jaunu vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajā tēmā jūs redzēsiet, ka <a href=\"https://course.raku.org/lv/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">saraksti<\/a> uzvedas citādi.<\/span><\/p>"]]},"ru":{"t":"Массивы","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Массив — это упорядоченный контейнер, и его элементы — тоже скалярные контейнеры.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигил <code>@<\/code> означает, что такая переменная ведёт себя как объект <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это позволяет читать отдельные элементы по индексу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый элемент — это скалярный контейнер, поэтому ему можно присвоить новое значение.<\/span> <span class=\"sg\" data-s=\"1\">Вы делаете это так же, как с отдельной скалярной переменной:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можно также присвоить значение другого типа, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Именно это делает массивы <em>изменяемыми<\/em>, то есть их можно менять.<\/span> <span class=\"sg\" data-s=\"1\">Каждая ячейка — это контейнер, который может получить новое значение.<\/span> <span class=\"sg\" data-s=\"2\">В следующей теме вы увидите, что <a href=\"https://course.raku.org/ru/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списки<\/a> ведут себя иначе.<\/span><\/p>"]]},"uk":{"t":"Масиви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Масив — це впорядкований контейнер, а його елементи — теж скалярні контейнери.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> означає, що така змінна поводиться як об'єкт <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це дає змогу читати окремі елементи за допомогою індексів:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен елемент є скалярним контейнером, тому йому можна присвоїти нове значення.<\/span> <span class=\"sg\" data-s=\"1\">Ви робите це так само, як з окремою скалярною змінною:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можна також присвоїти значення іншого типу, наприклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Саме це робить масиви <em>змінюваними<\/em>, тобто такими, які можна змінювати.<\/span> <span class=\"sg\" data-s=\"1\">Кожна комірка — це контейнер, який може отримати нове значення.<\/span> <span class=\"sg\" data-s=\"2\">У наступній темі ви побачите, що <a href=\"https://course.raku.org/uk/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списки<\/a> поводяться інакше.<\/span><\/p>"]]},"bg":{"t":"Масиви","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Масивът е подреден контейнер, а неговите елементи също са скаларни контейнери.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> означава, че такава променлива се държи като обект от тип <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Така можете да използвате индекси, за да четете отделни елементи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент е скаларен контейнер, затова можете да му присвоите нова стойност.<\/span> <span class=\"sg\" data-s=\"1\">Правите го по същия начин, както с отделна скаларна променлива:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Можете също да присвоите стойност от друг тип, например:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Именно това прави масивите <em>изменяеми<\/em>, тоест такива, които могат да се променят.<\/span> <span class=\"sg\" data-s=\"1\">Всяка позиция е контейнер, който може да получи нова стойност.<\/span> <span class=\"sg\" data-s=\"2\">В следващата тема ще видите, че <a href=\"https://course.raku.org/bg/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">списъците<\/a> се държат по различен начин.<\/span><\/p>"]]},"eo":{"t":"Tabeloj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Tabelo estas ordigita ujo, kaj ĝiaj elementoj estas ankaŭ skalaraj ujoj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sigelo <code>@<\/code> signifas, ke tia variablo kondutas kiel objekto <code>Positional<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio permesas al vi uzi subskribojn por legi unuopajn elementojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu elemento estas skalara ujo, do vi povas atribui novan valoron al ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Vi faras tion same kiel kun aparta skalara variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas atribui valoron de alia tipo, ekzemple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jen kio faras tabelojn <em>ŝanĝeblaj<\/em>, tio estas, vi povas ŝanĝi ilin.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu fako estas ujo, kiu povas ricevi novan valoron.<\/span> <span class=\"sg\" data-s=\"2\">En la sekva temo, vi vidos, ke <a href=\"https://course.raku.org/eo/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">listoj<\/a> kondutas alie.<\/span><\/p>"]]},"la":{"t":"Array","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ordo est continens ordinatus, et elementa eius quoque continentes scalares sunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\nmy @letters = 'a', 'b', 'c';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> significat talem variabilem ut obiectum <code>Positional<\/code> se gerere.<\/span> <span class=\"sg\" data-s=\"1\">Hoc tibi permittit subscriptiones adhibere ad elementa singula legenda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say @array[1];   # 200\nsay @letters[2]; # c<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quodque elementum continens scalaris est, itaque novum valorem ei assignare potes.<\/span> <span class=\"sg\" data-s=\"1\">Hoc eodem modo facis ac cum variabili scalari separata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 10;\nsay @array; # [10 200 300]<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valorem typi diversi quoque assignare potes, exempli gratia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @array = 100, 200, 300;\n@array[0] = 'ten';\nsay @array; # [ten 200 300]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc est quod ordines <em>mutabiles<\/em> facit, id est, tales ut eos mutare possis.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque positio est continens qui novum valorem accipere potest.<\/span> <span class=\"sg\" data-s=\"2\">In themate sequenti videbis <a href=\"https://course.raku.org/la/advanced/ordered-containers/lists/\" target=\"_blank\" rel=\"noopener\">indices<\/a> aliter se gerere.<\/span><\/p>"]]}}}</script>
