<script type="application/json" id="page-data">{"u":"advanced/ordered-containers","n":368,"k":"section","pv":"advanced/scalar-containers/exercises/reuse-the-container/solution","nx":"advanced/ordered-containers/arrays","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Ordered containers","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ordered containers keep several elements in order.<\/span> <span class=\"sg\" data-s=\"1\">So you can reach each element by its position.<\/span> <span class=\"sg\" data-s=\"2\">In special cases, they may also keep only one element, or none at all.<\/span> <span class=\"sg\" data-s=\"3\">The most common ordered containers are <em>arrays<\/em> and <em>lists<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>@<\/code> sigil tells you that a variable is for many elements.<\/span> <span class=\"sg\" data-s=\"1\">Such a variable supports subscripting, which means you can read an element by its index.<\/span> <span class=\"sg\" data-s=\"2\">You already saw this in the Essentials part.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In this section, we look more closely at how arrays and lists differ <em>as containers<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Which of them can you change?<\/span> <span class=\"sg\" data-s=\"2\">What happens when you put one container inside another?<\/span> <span class=\"sg\" data-s=\"3\">And how does <em>binding<\/em> give a name to a container without copying anything?<\/span><\/p>"]]},"de":{"t":"Geordnete Container","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Geordnete Container speichern mehrere Elemente in einer festen Reihenfolge.<\/span> <span class=\"sg\" data-s=\"1\">So kannst du jedes Element über seine Position erreichen.<\/span> <span class=\"sg\" data-s=\"2\">In Sonderfällen können sie auch nur ein Element enthalten oder gar keines.<\/span> <span class=\"sg\" data-s=\"3\">Die häufigsten geordneten Container sind <em>Arrays<\/em> und <em>Listen<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Sigil <code>@<\/code> sagt dir, dass eine Variable für viele Elemente da ist.<\/span> <span class=\"sg\" data-s=\"1\">So eine Variable unterstützt Indizierung, das heißt, du kannst ein Element über seinen Index lesen.<\/span> <span class=\"sg\" data-s=\"2\">Das hast du schon im Grundlagenteil gesehen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In diesem Abschnitt sehen wir uns genauer an, wie sich Arrays und Listen <em>als Container<\/em> unterscheiden.<\/span> <span class=\"sg\" data-s=\"1\">Welche davon kannst du ändern?<\/span> <span class=\"sg\" data-s=\"2\">Was passiert, wenn du einen Container in einen anderen steckst?<\/span> <span class=\"sg\" data-s=\"3\">Und wie gibt <em>Binding<\/em> einem Container einen Namen, ohne etwas zu kopieren?<\/span><\/p>"]]},"nl":{"t":"Geordende containers","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Geordende containers bewaren meerdere elementen in volgorde.<\/span> <span class=\"sg\" data-s=\"1\">Zo kun je elk element bereiken via zijn positie.<\/span> <span class=\"sg\" data-s=\"2\">In bijzondere gevallen bewaren ze ook maar één element, of helemaal geen.<\/span> <span class=\"sg\" data-s=\"3\">De meest voorkomende geordende containers zijn <em>arrays<\/em> en <em>lists<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>@<\/code> sigil vertelt je dat een variabele voor veel elementen is.<\/span> <span class=\"sg\" data-s=\"1\">Zo'n variabele ondersteunt subscripting, wat betekent dat je een element via zijn index kunt lezen.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt dit al gezien in het deel Essentials.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In dit deel bekijken we van dichterbij hoe arrays en lists verschillen <em>als containers<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Welke kun je wijzigen?<\/span> <span class=\"sg\" data-s=\"2\">Wat gebeurt er als je de ene container in de andere zet?<\/span> <span class=\"sg\" data-s=\"3\">En hoe geeft <em>binding<\/em> een naam aan een container zonder iets te kopiëren?<\/span><\/p>"]]},"es":{"t":"Contenedores ordenados","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Los contenedores ordenados guardan varios elementos en orden.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes llegar a cada elemento por su posición.<\/span> <span class=\"sg\" data-s=\"2\">En casos especiales, también pueden guardar un solo elemento, o ninguno.<\/span> <span class=\"sg\" data-s=\"3\">Los contenedores ordenados más comunes son los <em>arrays<\/em> y las <em>listas<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El sigilo <code>@<\/code> te indica que una variable es para muchos elementos.<\/span> <span class=\"sg\" data-s=\"1\">Esa variable admite subíndices, es decir, puedes leer un elemento por su índice.<\/span> <span class=\"sg\" data-s=\"2\">Ya viste esto en la parte de Esenciales.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En esta sección, vemos más de cerca en qué se diferencian los arrays y las listas <em>como contenedores<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">¿Cuáles de ellos puedes cambiar?<\/span> <span class=\"sg\" data-s=\"2\">¿Qué pasa cuando pones un contenedor dentro de otro?<\/span> <span class=\"sg\" data-s=\"3\">¿Y cómo da la <em>vinculación<\/em> (binding) un nombre a un contenedor sin copiar nada?<\/span><\/p>"]]},"it":{"t":"Contenitori ordinati","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">I contenitori ordinati conservano più elementi in ordine.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi raggiungere ogni elemento tramite la sua posizione.<\/span> <span class=\"sg\" data-s=\"2\">In casi speciali, possono anche conservare un solo elemento, o nessuno.<\/span> <span class=\"sg\" data-s=\"3\">I contenitori ordinati più comuni sono gli <em>array<\/em> e le <em>liste<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il sigillo <code>@<\/code> ti dice che una variabile è per molti elementi.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile così supporta l'indicizzazione, cioè puoi leggere un elemento tramite il suo indice.<\/span> <span class=\"sg\" data-s=\"2\">Lo hai già visto nella parte Essenziali.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In questa sezione, guardiamo più da vicino come gli array e le liste sono diversi <em>come contenitori<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Quali di essi puoi cambiare?<\/span> <span class=\"sg\" data-s=\"2\">Cosa succede quando metti un contenitore dentro un altro?<\/span> <span class=\"sg\" data-s=\"3\">E come fa il <em>binding<\/em> a dare un nome a un contenitore senza copiare niente?<\/span><\/p>"]]},"lv":{"t":"Kārtotie konteineri","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Sakārtotie konteineri glabā vairākus elementus noteiktā secībā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat piekļūt katram elementam pēc tā pozīcijas.<\/span> <span class=\"sg\" data-s=\"2\">Īpašos gadījumos tie var glabāt arī tikai vienu elementu vai nevienu.<\/span> <span class=\"sg\" data-s=\"3\">Visizplatītākie sakārtotie konteineri ir <em>masīvi<\/em> un <em>saraksti<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sigils <code>@<\/code> norāda, ka mainīgais ir paredzēts daudziem elementiem.<\/span> <span class=\"sg\" data-s=\"1\">Šāds mainīgais atbalsta indeksēšanu, kas nozīmē, ka jūs varat nolasīt elementu pēc tā indeksa.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to jau redzējāt daļā Pamati.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šajā sadaļā mēs tuvāk aplūkojam, kā masīvi un saraksti atšķiras <em>kā konteineri<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Kurus no tiem jūs varat mainīt?<\/span> <span class=\"sg\" data-s=\"2\">Kas notiek, kad jūs ievietojat vienu konteineru citā?<\/span> <span class=\"sg\" data-s=\"3\">Un kā <em>saistīšana<\/em> piešķir konteineram nosaukumu, neko nekopējot?<\/span><\/p>"]]},"ru":{"t":"Упорядоченные контейнеры","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Упорядоченные контейнеры хранят несколько элементов по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому до каждого элемента можно добраться по его позиции.<\/span> <span class=\"sg\" data-s=\"2\">В особых случаях в них может быть только один элемент или вообще ни одного.<\/span> <span class=\"sg\" data-s=\"3\">Самые распространённые упорядоченные контейнеры — это <em>массивы<\/em> и <em>списки<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигил <code>@<\/code> говорит о том, что переменная нужна для многих элементов.<\/span> <span class=\"sg\" data-s=\"1\">Такая переменная поддерживает индексирование, то есть элемент можно прочитать по его индексу.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже видели это в части «Основы».<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В этом разделе мы подробнее посмотрим, чем массивы и списки различаются <em>как контейнеры<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Какие из них можно изменять?<\/span> <span class=\"sg\" data-s=\"2\">Что происходит, когда один контейнер кладут внутрь другого?<\/span> <span class=\"sg\" data-s=\"3\">И как <em>привязка<\/em> (binding) даёт контейнеру имя, ничего не копируя?<\/span><\/p>"]]},"uk":{"t":"Впорядковані контейнери","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Впорядковані контейнери зберігають кілька елементів по порядку.<\/span> <span class=\"sg\" data-s=\"1\">Тому до кожного елемента можна дістатися за його позицією.<\/span> <span class=\"sg\" data-s=\"2\">В окремих випадках вони можуть зберігати лише один елемент або взагалі жодного.<\/span> <span class=\"sg\" data-s=\"3\">Найпоширеніші впорядковані контейнери — це <em>масиви<\/em> та <em>списки<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигіл <code>@<\/code> каже вам, що змінна призначена для багатьох елементів.<\/span> <span class=\"sg\" data-s=\"1\">Така змінна підтримує індексування, тобто ви можете прочитати елемент за його індексом.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже бачили це в частині «Основи».<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У цьому розділі ми уважніше розглянемо, чим масиви й списки відрізняються <em>як контейнери<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Який із них можна змінювати?<\/span> <span class=\"sg\" data-s=\"2\">Що стається, коли ви кладете один контейнер усередину іншого?<\/span> <span class=\"sg\" data-s=\"3\">І як <em>зв'язування<\/em> дає контейнеру ім'я, нічого не копіюючи?<\/span><\/p>"]]},"bg":{"t":"Подредени контейнери","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Подредените контейнери пазят няколко елемента в определен ред.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да стигнете до всеки елемент по неговата позиция.<\/span> <span class=\"sg\" data-s=\"2\">В специални случаи те могат да пазят и само един елемент или нито един.<\/span> <span class=\"sg\" data-s=\"3\">Най-често използваните подредени контейнери са <em>масивите<\/em> и <em>списъците<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сигилът <code>@<\/code> ви казва, че променливата е за много елементи.<\/span> <span class=\"sg\" data-s=\"1\">Такава променлива поддържа индексиране, което означава, че можете да прочетете елемент по неговия индекс.<\/span> <span class=\"sg\" data-s=\"2\">Вече видяхте това в частта „Основи“.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В тази секция ще разгледаме по-отблизо как масивите и списъците се различават <em>като контейнери<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кои от тях можете да променяте?<\/span> <span class=\"sg\" data-s=\"2\">Какво става, когато сложите един контейнер в друг?<\/span> <span class=\"sg\" data-s=\"3\">И как <em>свързването<\/em> дава име на контейнер, без да копира нищо?<\/span><\/p>"]]},"eo":{"t":"Ordigitaj ujoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ordigitaj ujoj tenas plurajn elementojn en ordo.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas atingi ĉiun elementon laŭ ĝia pozicio.<\/span> <span class=\"sg\" data-s=\"2\">En specialaj kazoj, ili povas ankaŭ teni nur unu elementon, aŭ eĉ neniun.<\/span> <span class=\"sg\" data-s=\"3\">La plej oftaj ordigitaj ujoj estas <em>tabeloj<\/em> kaj <em>listoj<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sigelo <code>@<\/code> diras al vi, ke variablo estas por multaj elementoj.<\/span> <span class=\"sg\" data-s=\"1\">Tia variablo subtenas subskribadon, kio signifas, ke vi povas legi elementon laŭ ĝia indekso.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam vidis tion en la parto Esencoj.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En ĉi tiu sekcio, ni pli detale rigardas, kiel tabeloj kaj listoj diferencas <em>kiel ujoj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Kiun el ili vi povas ŝanĝi?<\/span> <span class=\"sg\" data-s=\"2\">Kio okazas, kiam vi metas unu ujon en alian?<\/span> <span class=\"sg\" data-s=\"3\">Kaj kiel <em>ligado<\/em> donas nomon al ujo sen kopii ion ajn?<\/span><\/p>"]]},"la":{"t":"Ordinata receptacula","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Continentes ordinati plura elementa in ordine servant.<\/span> <span class=\"sg\" data-s=\"1\">Itaque quodque elementum per positionem suam attingere potes.<\/span> <span class=\"sg\" data-s=\"2\">In casibus specialibus etiam unum solum elementum servare possunt, vel nullum omnino.<\/span> <span class=\"sg\" data-s=\"3\">Continentes ordinati frequentissimi sunt <em>ordines<\/em> et <em>indices<\/em>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sigillum <code>@<\/code> tibi indicat variabilem multis elementis destinatam esse.<\/span> <span class=\"sg\" data-s=\"1\">Talis variabilis subscriptionem sustinet, quod significat te elementum per indicem suum legere posse.<\/span> <span class=\"sg\" data-s=\"2\">Hoc iam in parte Essentialium vidisti.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In hac sectione propius inspicimus quomodo ordines et indices <em>ut continentes<\/em> differant.<\/span> <span class=\"sg\" data-s=\"1\">Quos ex eis mutare potes?<\/span> <span class=\"sg\" data-s=\"2\">Quid accidit cum unum continentem intra alterum ponis?<\/span> <span class=\"sg\" data-s=\"3\">Et quomodo <em>vinculum<\/em> nomen continenti dat sine ulla copia?<\/span><\/p>"]]}}}</script>
