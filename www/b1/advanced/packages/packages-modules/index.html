<script type="application/json" id="page-data">{"u":"advanced/packages/packages-modules","n":725,"k":"topic","pv":"advanced/packages","nx":"advanced/packages/packages-modules/quiz","tr":["advanced","advanced/packages"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Packages and modules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>package<\/code> keyword creates a namespace.<\/span> <span class=\"sg\" data-s=\"1\">Everything declared inside it with <code>our<\/code> becomes part of that namespace.<\/span> <span class=\"sg\" data-s=\"2\">From outside, you can reach these names through the package name and the <code>::<\/code> separator:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You reach the variable as <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It has the sigil, then the package name, then the variable name.<\/span> <span class=\"sg\" data-s=\"2\">A subroutine is called as <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Both <code>package<\/code> and <code>module<\/code> create a namespace, but they differ in what else they do.<\/span> <span class=\"sg\" data-s=\"1\">A <code>module<\/code> is the usual choice for reusable code.<\/span> <span class=\"sg\" data-s=\"2\">A plain <code>package<\/code> is just the namespace, with nothing extra.<\/span> <span class=\"sg\" data-s=\"3\">A <code>class<\/code>, which you will meet in <a href=\"/oop/\">the next part<\/a>, also creates a namespace.<\/span> <span class=\"sg\" data-s=\"4\">On top of that, it adds everything you need for object-oriented programming.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So <code>module<\/code> gives you the same namespace that a plain <code>package<\/code> gives.<\/span> <span class=\"sg\" data-s=\"1\">Which one you choose depends mostly on what you want to do.<\/span> <span class=\"sg\" data-s=\"2\">Use <code>module<\/code> for libraries and <code>package<\/code> for a simple namespace.<\/span> <span class=\"sg\" data-s=\"3\">Later, when you reach objects, use <code>class<\/code> for types.<\/span><\/p>"]]},"de":{"t":"Pakete und Module","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Schlüsselwort <code>package<\/code> erzeugt einen Namensraum.<\/span> <span class=\"sg\" data-s=\"1\">Alles, was darin mit <code>our<\/code> deklariert wird, wird Teil dieses Namensraums.<\/span> <span class=\"sg\" data-s=\"2\">Von außen erreichst du diese Namen über den Package-Namen und den <code>::<\/code>-Trenner:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du erreichst die Variable als <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Name hat das Sigil, dann den Package-Namen, dann den Variablennamen.<\/span> <span class=\"sg\" data-s=\"2\">Eine Subroutine wird als <code>Maths::double(...)<\/code> aufgerufen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>package<\/code> und <code>module<\/code> erzeugen beide einen Namensraum, aber sonst tun sie verschiedene Dinge.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>module<\/code> ist die übliche Wahl für wiederverwendbaren Code.<\/span> <span class=\"sg\" data-s=\"2\">Ein einfaches <code>package<\/code> ist nur der Namensraum, ohne Extras.<\/span> <span class=\"sg\" data-s=\"3\">Eine <code>class<\/code>, die du im <a href=\"https://course.raku.org/de/oop/\" target=\"_blank\" rel=\"noopener\">nächsten Teil<\/a> kennenlernst, erzeugt ebenfalls einen Namensraum.<\/span> <span class=\"sg\" data-s=\"4\">Dazu fügt sie alles hinzu, was du für objektorientierte Programmierung brauchst.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>module<\/code> gibt dir also denselben Namensraum wie ein einfaches <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Welches du wählst, hängt vor allem davon ab, was du tun willst.<\/span> <span class=\"sg\" data-s=\"2\">Benutze <code>module<\/code> für Bibliotheken und <code>package<\/code> für einen einfachen Namensraum.<\/span> <span class=\"sg\" data-s=\"3\">Später, wenn du bei Objekten bist, benutze <code>class<\/code> für Typen.<\/span><\/p>"]]},"nl":{"t":"Pakketten en modules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Het sleutelwoord <code>package<\/code> maakt een naamruimte aan.<\/span> <span class=\"sg\" data-s=\"1\">Alles wat erin met <code>our<\/code> gedeclareerd wordt, wordt deel van die naamruimte.<\/span> <span class=\"sg\" data-s=\"2\">Van buitenaf kun je deze namen bereiken via de naam van het pakket en het <code>::<\/code>-scheidingsteken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je bereikt de variabele als <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er staat eerst de sigil, dan de pakketnaam en dan de naam van de variabele.<\/span> <span class=\"sg\" data-s=\"2\">Een subroutine roep je aan als <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Zowel <code>package<\/code> als <code>module<\/code> maken een naamruimte aan, maar ze verschillen in wat ze verder doen.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>module<\/code> is de gebruikelijke keuze voor herbruikbare code.<\/span> <span class=\"sg\" data-s=\"2\">Een gewoon <code>package<\/code> is alleen de naamruimte, zonder extra's.<\/span> <span class=\"sg\" data-s=\"3\">Een <code>class<\/code>, die je in <a href=\"https://course.raku.org/nl/oop/\" target=\"_blank\" rel=\"noopener\">het volgende deel<\/a> leert kennen, maakt ook een naamruimte aan.<\/span> <span class=\"sg\" data-s=\"4\">Daarbovenop voegt hij alles toe wat je nodig hebt voor objectgeoriënteerd programmeren.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <code>module<\/code> geeft je dus dezelfde naamruimte als een gewoon <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Welke je kiest, hangt vooral af van wat je wilt doen.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik <code>module<\/code> voor bibliotheken en <code>package<\/code> voor een eenvoudige naamruimte.<\/span> <span class=\"sg\" data-s=\"3\">Later, als je bij objecten komt, gebruik je <code>class<\/code> voor typen.<\/span><\/p>"]]},"es":{"t":"Paquetes y módulos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La palabra clave <code>package<\/code> crea un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Todo lo que se declara dentro de él con <code>our<\/code> pasa a formar parte de ese espacio de nombres.<\/span> <span class=\"sg\" data-s=\"2\">Desde fuera, puedes acceder a estos nombres a través del nombre del paquete y el separador <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Accedes a la variable como <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiene el sigilo, luego el nombre del paquete y después el nombre de la variable.<\/span> <span class=\"sg\" data-s=\"2\">Una subrutina se llama como <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tanto <code>package<\/code> como <code>module<\/code> crean un espacio de nombres, pero se diferencian en lo demás que hacen.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>module<\/code> es la opción habitual para código reutilizable.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>package<\/code> simple es solo el espacio de nombres, sin nada extra.<\/span> <span class=\"sg\" data-s=\"3\">Una <code>class<\/code>, que conocerás en <a href=\"https://course.raku.org/es/oop/\" target=\"_blank\" rel=\"noopener\">la siguiente parte<\/a>, también crea un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"4\">Además, añade todo lo que necesitas para la programación orientada a objetos.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Así que <code>module<\/code> te da el mismo espacio de nombres que da un <code>package<\/code> simple.<\/span> <span class=\"sg\" data-s=\"1\">Cuál elegir depende sobre todo de lo que quieres hacer.<\/span> <span class=\"sg\" data-s=\"2\">Usa <code>module<\/code> para bibliotecas y <code>package<\/code> para un espacio de nombres simple.<\/span> <span class=\"sg\" data-s=\"3\">Más adelante, cuando llegues a los objetos, usa <code>class<\/code> para tipos.<\/span><\/p>"]]},"it":{"t":"Pacchetti e moduli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La parola chiave <code>package<\/code> crea un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Tutto ciò che dichiari dentro con <code>our<\/code> diventa parte di quel namespace.<\/span> <span class=\"sg\" data-s=\"2\">Dall'esterno, puoi raggiungere questi nomi attraverso il nome del package e il separatore <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raggiungi la variabile come <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ha il sigillo, poi il nome del package, poi il nome della variabile.<\/span> <span class=\"sg\" data-s=\"2\">Una subroutine viene chiamata come <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Sia <code>package<\/code> sia <code>module<\/code> creano un namespace, ma sono diversi in quello che fanno in più.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>module<\/code> è la scelta abituale per il codice riutilizzabile.<\/span> <span class=\"sg\" data-s=\"2\">Un semplice <code>package<\/code> è solo il namespace, senza niente in più.<\/span> <span class=\"sg\" data-s=\"3\">Anche una <code>class<\/code>, che incontrerai nella <a href=\"https://course.raku.org/it/oop/\" target=\"_blank\" rel=\"noopener\">prossima parte<\/a>, crea un namespace.<\/span> <span class=\"sg\" data-s=\"4\">In più, aggiunge tutto quello che serve per la programmazione orientata agli oggetti.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>module<\/code> ti dà lo stesso namespace che dà un semplice <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La scelta tra i due dipende soprattutto da quello che vuoi fare.<\/span> <span class=\"sg\" data-s=\"2\">Usa <code>module<\/code> per le librerie e <code>package<\/code> per un namespace semplice.<\/span> <span class=\"sg\" data-s=\"3\">Più avanti, quando arriverai agli oggetti, usa <code>class<\/code> per i tipi.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un moduļi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Atslēgvārds <code>package<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Viss, kas tajā deklarēts ar <code>our<\/code>, kļūst par šīs vārdtelpas daļu.<\/span> <span class=\"sg\" data-s=\"2\">No ārpuses jūs varat sasniegt šos nosaukumus caur pakotnes nosaukumu un <code>::<\/code> atdalītāju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mainīgajam jūs piekļūstat kā <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir sigils, tad pakotnes nosaukums, tad mainīgā nosaukums.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogrammu izsauc kā <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Gan <code>package<\/code>, gan <code>module<\/code> izveido vārdtelpu, bet tie atšķiras ar to, ko vēl tie dara.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> ir parastā izvēle atkārtoti lietojamam kodam.<\/span> <span class=\"sg\" data-s=\"2\">Vienkāršs <code>package<\/code> ir tikai vārdtelpa bez papildinājumiem.<\/span> <span class=\"sg\" data-s=\"3\">Arī <code>class<\/code>, ar kuru iepazīsieties <a href=\"https://course.raku.org/lv/oop/\" target=\"_blank\" rel=\"noopener\">nākamajā daļā<\/a>, izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"4\">Papildus tam klase pievieno visu, kas vajadzīgs objektorientētajai programmēšanai.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>module<\/code> jums dod to pašu vārdtelpu, ko dod vienkāršs <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kuru no tiem izvēlēties, lielākoties ir atkarīgs no tā, ko vēlaties darīt.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet <code>module<\/code> bibliotēkām un <code>package<\/code> vienkāršai vārdtelpai.<\/span> <span class=\"sg\" data-s=\"3\">Vēlāk, kad nonāksiet līdz objektiem, izmantojiet <code>class<\/code> tipiem.<\/span><\/p>"]]},"ru":{"t":"Пакеты и модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключевое слово <code>package<\/code> создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"1\">Всё, что объявлено внутри него с <code>our<\/code>, становится частью этого пространства имён.<\/span> <span class=\"sg\" data-s=\"2\">Снаружи к этим именам можно обратиться через имя пакета и разделитель <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">К переменной вы обращаетесь как <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Здесь идёт сигил, затем имя пакета, затем имя переменной.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмма вызывается как <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> создают пространство имён, но они различаются тем, что ещё они делают.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> — обычный выбор для кода, который используют снова.<\/span> <span class=\"sg\" data-s=\"2\">Простой <code>package<\/code> — это только пространство имён, и ничего больше.<\/span> <span class=\"sg\" data-s=\"3\"><code>class<\/code>, с которым вы познакомитесь в <a href=\"https://course.raku.org/ru/oop/\" target=\"_blank\" rel=\"noopener\">следующей части<\/a>, тоже создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"4\">Кроме того, он добавляет всё, что нужно для объектно-ориентированного программирования.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>module<\/code> даёт вам то же пространство имён, что и простой <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Какой из них выбрать, зависит в основном от того, что вы хотите сделать.<\/span> <span class=\"sg\" data-s=\"2\">Используйте <code>module<\/code> для библиотек, а <code>package<\/code> — для простого пространства имён.<\/span> <span class=\"sg\" data-s=\"3\">Позже, когда вы дойдёте до объектов, используйте <code>class<\/code> для типов.<\/span><\/p>"]]},"uk":{"t":"Пакунки та модулі","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключове слово <code>package<\/code> створює простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Усе, що оголошено всередині нього через <code>our<\/code>, стає частиною цього простору імен.<\/span> <span class=\"sg\" data-s=\"2\">Ззовні до цих імен можна дістатися через ім'я пакунка й роздільник <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">До змінної ви дістаєтеся як <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це ім'я має сигіл, потім ім'я пакунка, потім ім'я змінної.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограму викликають як <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">І <code>package<\/code>, і <code>module<\/code> створюють простір імен, але різняться тим, що ще вони роблять.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> — звичайний вибір для коду, який використовують знову.<\/span> <span class=\"sg\" data-s=\"2\">Звичайний <code>package<\/code> — це просто простір імен, без нічого зайвого.<\/span> <span class=\"sg\" data-s=\"3\"><code>class<\/code>, з яким ви познайомитеся в <a href=\"https://course.raku.org/uk/oop/\" target=\"_blank\" rel=\"noopener\">наступній частині<\/a>, теж створює простір імен.<\/span> <span class=\"sg\" data-s=\"4\">Крім того, він додає все, що потрібно для об'єктно-орієнтованого програмування.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>module<\/code> дає вам той самий простір імен, що й звичайний <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Який із них вибрати, залежить здебільшого від того, що ви хочете зробити.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте <code>module<\/code> для бібліотек, а <code>package<\/code> — для простого простору імен.<\/span> <span class=\"sg\" data-s=\"3\">Пізніше, коли дійдете до об'єктів, використовуйте <code>class<\/code> для типів.<\/span><\/p>"]]},"bg":{"t":"Пакети и модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ключовата дума <code>package<\/code> създава пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Всичко, декларирано вътре в него с <code>our<\/code>, става част от това пространство от имена.<\/span> <span class=\"sg\" data-s=\"2\">Отвън можете да достигнете до тези имена чрез името на пакета и разделителя <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Достигате до променливата като <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това име съдържа сигила, след това името на пакета, след това името на променливата.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограма се извиква като <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И <code>package<\/code>, и <code>module<\/code> създават пространство от имена, но се различават по това какво още правят.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> е обичайният избор за код за повторна употреба.<\/span> <span class=\"sg\" data-s=\"2\">Обикновеният <code>package<\/code> е просто пространство от имена, без нищо допълнително.<\/span> <span class=\"sg\" data-s=\"3\"><code>class<\/code>, който ще срещнете в <a href=\"https://course.raku.org/bg/oop/\" target=\"_blank\" rel=\"noopener\">следващата част<\/a>, също създава пространство от имена.<\/span> <span class=\"sg\" data-s=\"4\">Освен това той добавя всичко, което ви трябва за обектно-ориентирано програмиране.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Значи <code>module<\/code> ви дава същото пространство от имена, което дава и обикновеният <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Кой от тях ще изберете, зависи най-вече от това какво искате да направите.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте <code>module<\/code> за библиотеки, а <code>package<\/code> за просто пространство от имена.<\/span> <span class=\"sg\" data-s=\"3\">По-късно, когато стигнете до обектите, използвайте <code>class<\/code> за типове.<\/span><\/p>"]]},"eo":{"t":"Pakoj kaj moduloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La ŝlosilvorto <code>package<\/code> kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉio, kion oni deklaras en ĝi per <code>our<\/code>, fariĝas parto de tiu nomspaco.<\/span> <span class=\"sg\" data-s=\"2\">De ekstere, vi povas atingi ĉi tiujn nomojn per la nomo de la pako kaj la apartigilo <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi atingas la variablon kiel <code>$Maths::pi<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas la sigelon, poste la nomon de la pako, poste la nomon de la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Subrutino estas vokata kiel <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kaj <code>package<\/code> kaj <code>module<\/code> kreas nomspacon, sed ili diferencas en tio, kion alian ili faras.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> estas la kutima elekto por reuzebla kodo.<\/span> <span class=\"sg\" data-s=\"2\">Simpla <code>package<\/code> estas nur la nomspaco, sen io kroma.<\/span> <span class=\"sg\" data-s=\"3\"><code>class<\/code>, kiun vi renkontos en <a href=\"https://course.raku.org/eo/oop/\" target=\"_blank\" rel=\"noopener\">la sekva parto<\/a>, ankaŭ kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"4\">Krome, ĝi aldonas ĉion, kion vi bezonas por objekt-orientita programado.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do <code>module<\/code> donas al vi la saman nomspacon, kiun donas simpla <code>package<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kiun vi elektas, dependas ĉefe de tio, kion vi volas fari.<\/span> <span class=\"sg\" data-s=\"2\">Uzu <code>module<\/code> por bibliotekoj kaj <code>package<\/code> por simpla nomspaco.<\/span> <span class=\"sg\" data-s=\"3\">Poste, kiam vi atingos objektojn, uzu <code>class<\/code> por tipoj.<\/span><\/p>"]]},"la":{"t":"Fasciculi et moduli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Verbum clave <code>package<\/code> spatium nominum creat.<\/span> <span class=\"sg\" data-s=\"1\">Quidquid intra id cum <code>our<\/code> declaratur, pars illius spatii nominum fit.<\/span> <span class=\"sg\" data-s=\"2\">Ab extra haec nomina per nomen fasciculi et separatorem <code>::<\/code> attingere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>package Maths {\n    our $pi = 3.14;\n    our sub double($x) { $x * 2 }\n}\n\nsay $Maths::pi;         # 3.14\nsay Maths::double(5);   # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Variabilem ut <code>$Maths::pi<\/code> attingis.<\/span> <span class=\"sg\" data-s=\"1\">Habet sigillum, deinde nomen fasciculi, deinde nomen variabilis.<\/span> <span class=\"sg\" data-s=\"2\">Subroutina vocatur ut <code>Maths::double(...)<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Et <code>package<\/code> et <code>module<\/code> spatium nominum creant, sed differunt in eo quod praeterea faciunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>module<\/code> est electio usitata pro codice quem iterum adhibere vis.<\/span> <span class=\"sg\" data-s=\"2\">Simplex <code>package<\/code> tantum spatium nominum est, sine additamentis.<\/span> <span class=\"sg\" data-s=\"3\"><code>class<\/code>, quam in <a href=\"https://course.raku.org/la/oop/\" target=\"_blank\" rel=\"noopener\">parte sequente<\/a> invenies, quoque spatium nominum creat.<\/span> <span class=\"sg\" data-s=\"4\">Praeterea omnia addit quae ad programmationem obiectorum requiris.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Greet {\n    our sub hello { 'hi' }\n}\n\nsay Greet::hello; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>module<\/code> tibi idem spatium nominum dat quod simplex <code>package<\/code> dat.<\/span> <span class=\"sg\" data-s=\"1\">Utrum eligas maxime ex eo pendet quod facere vis.<\/span> <span class=\"sg\" data-s=\"2\">Adhibe <code>module<\/code> pro bibliothecis et <code>package<\/code> pro simplici spatio nominum.<\/span> <span class=\"sg\" data-s=\"3\">Postea, cum ad obiecta perveneris, <code>class<\/code> pro typis adhibe.<\/span><\/p>"]]}}}</script>
