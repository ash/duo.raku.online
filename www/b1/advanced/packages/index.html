<script type="application/json" id="page-data">{"u":"advanced/packages","n":724,"k":"section","pv":"advanced/installing-modules","nx":"advanced/packages/packages-modules","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Packages and namespaces","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>namespace<\/em> is a named container.<\/span> <span class=\"sg\" data-s=\"1\">It holds other named things, such as variables and subroutines.<\/span> <span class=\"sg\" data-s=\"2\">It stops names from clashing: <code>Maths::pi<\/code> and <code>Physics::pi<\/code> can both exist without a conflict.<\/span> <span class=\"sg\" data-s=\"3\">A <em>package<\/em> is the most basic kind of namespace.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You have already used a namespace without calling it one: every <code>module<\/code> creates a namespace.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at packages directly.<\/span> <span class=\"sg\" data-s=\"2\">You will also see how to reach into a namespace from outside.<\/span> <span class=\"sg\" data-s=\"3\">For that, you use <code>our<\/code> variables and the <code>::<\/code> separator.<\/span><\/p>"]]},"de":{"t":"Pakete und Namensräume","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Namensraum<\/em> (Namespace) ist ein Behälter mit einem Namen.<\/span> <span class=\"sg\" data-s=\"1\">Er enthält andere Dinge mit Namen, wie Variablen und Subroutinen.<\/span> <span class=\"sg\" data-s=\"2\">Er verhindert Konflikte zwischen Namen: <code>Maths::pi<\/code> und <code>Physics::pi<\/code> können beide existieren, ohne sich zu stören.<\/span> <span class=\"sg\" data-s=\"3\">Ein <em>Package<\/em> ist die einfachste Art von Namensraum.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du hast schon einen Namensraum benutzt, ohne ihn so zu nennen: Jedes <code>module<\/code> erzeugt einen Namensraum.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet Packages direkt.<\/span> <span class=\"sg\" data-s=\"2\">Du siehst auch, wie du von außen in einen Namensraum greifen kannst.<\/span> <span class=\"sg\" data-s=\"3\">Dafür benutzt du <code>our<\/code>-Variablen und den <code>::<\/code>-Trenner.<\/span><\/p>"]]},"nl":{"t":"Pakketten en naamruimten","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>naamruimte<\/em> (namespace) is een container met een naam.<\/span> <span class=\"sg\" data-s=\"1\">Die bevat andere dingen met een naam, zoals variabelen en subroutines.<\/span> <span class=\"sg\" data-s=\"2\">Zo botsen namen niet met elkaar: <code>Maths::pi<\/code> en <code>Physics::pi<\/code> kunnen allebei bestaan zonder conflict.<\/span> <span class=\"sg\" data-s=\"3\">Een <em>pakket<\/em> (package) is de meest eenvoudige soort naamruimte.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je hebt al een naamruimte gebruikt zonder die zo te noemen: elke <code>module<\/code> maakt een naamruimte aan.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte kijkt direct naar pakketten.<\/span> <span class=\"sg\" data-s=\"2\">Je ziet ook hoe je van buitenaf een naamruimte kunt bereiken.<\/span> <span class=\"sg\" data-s=\"3\">Daarvoor gebruik je <code>our<\/code>-variabelen en het <code>::<\/code>-scheidingsteken.<\/span><\/p>"]]},"es":{"t":"Paquetes y espacios de nombres","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>espacio de nombres<\/em> (namespace) es un contenedor con nombre.<\/span> <span class=\"sg\" data-s=\"1\">Guarda otras cosas con nombre, como variables y subrutinas.<\/span> <span class=\"sg\" data-s=\"2\">Evita que los nombres choquen: <code>Maths::pi<\/code> y <code>Physics::pi<\/code> pueden existir los dos sin conflicto.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>paquete<\/em> (package) es el tipo más básico de espacio de nombres.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ya has usado un espacio de nombres sin llamarlo así: cada <code>module<\/code> crea un espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección trata los paquetes directamente.<\/span> <span class=\"sg\" data-s=\"2\">También verás cómo acceder a un espacio de nombres desde fuera.<\/span> <span class=\"sg\" data-s=\"3\">Para eso, usas variables <code>our<\/code> y el separador <code>::<\/code>.<\/span><\/p>"]]},"it":{"t":"Pacchetti e namespace","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>namespace<\/em> è un contenitore con un nome.<\/span> <span class=\"sg\" data-s=\"1\">Contiene altre cose con un nome, come variabili e subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Evita che i nomi si scontrino: <code>Maths::pi<\/code> e <code>Physics::pi<\/code> possono esistere entrambi senza conflitto.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>package<\/em> è il tipo più semplice di namespace.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hai già usato un namespace senza chiamarlo così: ogni <code>module<\/code> crea un namespace.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione guarda direttamente i package.<\/span> <span class=\"sg\" data-s=\"2\">Vedrai anche come raggiungere un namespace dall'esterno.<\/span> <span class=\"sg\" data-s=\"3\">Per farlo, usi le variabili <code>our<\/code> e il separatore <code>::<\/code>.<\/span><\/p>"]]},"lv":{"t":"Pakotnes un vārdtelpas 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Vārdtelpa<\/em> (namespace) ir nosaukts konteiners.<\/span> <span class=\"sg\" data-s=\"1\">Tā glabā citas nosauktas lietas, piemēram, mainīgos un apakšprogrammas.<\/span> <span class=\"sg\" data-s=\"2\">Tā neļauj nosaukumiem sadurties: <code>Maths::pi<\/code> un <code>Physics::pi<\/code> var pastāvēt abi bez konflikta.<\/span> <span class=\"sg\" data-s=\"3\">Pašu vienkāršāko vārdtelpas veidu sauc par <em>pakotni<\/em> (package).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat izmantojuši vārdtelpu, to tā nenosaucot: katrs <code>module<\/code> izveido vārdtelpu.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko pakotnes tieši.<\/span> <span class=\"sg\" data-s=\"2\">Jūs arī redzēsiet, kā piekļūt vārdtelpai no ārpuses.<\/span> <span class=\"sg\" data-s=\"3\">Tam jūs izmantojat <code>our<\/code> mainīgos un <code>::<\/code> atdalītāju.<\/span><\/p>"]]},"ru":{"t":"Пакеты и пространства имён","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Пространство имён<\/em> — это контейнер с именем.<\/span> <span class=\"sg\" data-s=\"1\">В нём хранятся другие вещи с именами, например переменные и подпрограммы.<\/span> <span class=\"sg\" data-s=\"2\">Оно не даёт именам мешать друг другу: <code>Maths::pi<\/code> и <code>Physics::pi<\/code> могут существовать вместе без конфликта.<\/span> <span class=\"sg\" data-s=\"3\">Самый базовый вид пространства имён — это <em>пакет<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали пространство имён, даже не называя его так: каждый <code>module<\/code> создаёт пространство имён.<\/span> <span class=\"sg\" data-s=\"1\">Этот раздел рассказывает о самих пакетах.<\/span> <span class=\"sg\" data-s=\"2\">Ещё вы увидите, как обратиться к пространству имён снаружи.<\/span> <span class=\"sg\" data-s=\"3\">Для этого нужны переменные <code>our<\/code> и разделитель <code>::<\/code>.<\/span><\/p>"]]},"uk":{"t":"Пакунки та простори імен","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Простір імен<\/em> — це іменований контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Він містить інші іменовані речі, як-от змінні й підпрограми.<\/span> <span class=\"sg\" data-s=\"2\">Він не дає іменам стикатися: <code>Maths::pi<\/code> і <code>Physics::pi<\/code> можуть існувати разом без конфлікту.<\/span> <span class=\"sg\" data-s=\"3\">А <em>пакунок<\/em> — це найпростіший різновид простору імен.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися простором імен, не називаючи його так: кожен <code>module<\/code> створює простір імен.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає пакунки безпосередньо.<\/span> <span class=\"sg\" data-s=\"2\">Також ви побачите, як дотягнутися до простору імен ззовні.<\/span> <span class=\"sg\" data-s=\"3\">Для цього ви використовуєте змінні <code>our<\/code> і роздільник <code>::<\/code>.<\/span><\/p>"]]},"bg":{"t":"Пакети и пространства от имена 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Пространството от имена<\/em> е именуван контейнер.<\/span> <span class=\"sg\" data-s=\"1\">То съдържа други именувани неща, като променливи и подпрограми.<\/span> <span class=\"sg\" data-s=\"2\">То не позволява на имената да се сблъскват: <code>Maths::pi<\/code> и <code>Physics::pi<\/code> могат да съществуват едновременно без конфликт.<\/span> <span class=\"sg\" data-s=\"3\">А <em>пакетът<\/em> е най-основният вид пространство от имена.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали пространство от имена, без да го наричате така: всеки <code>module<\/code> създава пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда пакетите директно.<\/span> <span class=\"sg\" data-s=\"2\">Ще видите също как да достигнете до пространство от имена отвън.<\/span> <span class=\"sg\" data-s=\"3\">За целта използвате <code>our<\/code> променливи и разделителя <code>::<\/code>.<\/span><\/p>"]]},"eo":{"t":"Pakoj kaj nomspacoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Nomspaco<\/em> estas nomita ujo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi enhavas aliajn nomitajn aferojn, kiel variablojn kaj subrutinojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi malhelpas, ke nomoj koliziu: <code>Maths::pi<\/code> kaj <code>Physics::pi<\/code> povas ambaŭ ekzisti sen konflikto.<\/span> <span class=\"sg\" data-s=\"3\">La <em>pako<\/em> estas la plej baza speco de nomspaco.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis nomspacon sen nomi ĝin tiel: ĉiu <code>module<\/code> kreas nomspacon.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio rigardas pakojn rekte.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ vidos, kiel atingi la enhavon de nomspaco de ekstere.<\/span> <span class=\"sg\" data-s=\"3\">Por tio, vi uzas <code>our<\/code>-variablojn kaj la apartigilon <code>::<\/code>.<\/span><\/p>"]]},"la":{"t":"Fasciculi et spatia nominum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Spatium nominum<\/em> est receptaculum nominatum.<\/span> <span class=\"sg\" data-s=\"1\">Alias res nominatas continet, ut variabiles et subroutinas.<\/span> <span class=\"sg\" data-s=\"2\">Nomina a collisione servat: <code>Maths::pi<\/code> et <code>Physics::pi<\/code> ambo esse possunt sine conflictu.<\/span> <span class=\"sg\" data-s=\"3\">Genus spatii nominum maxime fundamentale est <em>fasciculus<\/em> (package).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Spatium nominum iam adhibuisti, nec id ita vocavisti: omnis <code>module<\/code> spatium nominum creat.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio fasciculos directe inspicit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam videbis quomodo in spatium nominum ab extra accedas.<\/span> <span class=\"sg\" data-s=\"3\">Ad hoc variabiles <code>our<\/code> et separatorem <code>::<\/code> adhibes.<\/span><\/p>"]]}}}</script>
