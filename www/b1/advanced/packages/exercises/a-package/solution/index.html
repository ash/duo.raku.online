<script type="application/json" id="page-data">{"u":"advanced/packages/exercises/a-package/solution","n":732,"k":"solution","pv":"advanced/packages/exercises/a-package","nx":"advanced/packages/exercises/nested-name","tr":["advanced","advanced/packages"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A package‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both the variable and the subroutine are declared with <code>our<\/code>. So both become part of the <code>Temperature<\/code> namespace, and you can reach them from outside.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The variable is reached as <code>$Temperature::freezing<\/code>: the sigil, the package name, then the variable name. The subroutine is called as <code>Temperature::fahrenheit(100)<\/code>. Converting <code>100<\/code> gives <code>100 * 9/5 + 32<\/code>, which is <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">A plain <code>package<\/code> gives you just the namespace. For a reusable library, we would use <code>module<\/code> instead. When we work with objects, we would sh/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gan mainīgais, gan apakšprogramma ir deklarēti ar <code>our<\/code>. Tāpēc abi kļūst par <code>Temperature<\/code> vārdtelpas daļu, un tos var sasniegt no ārpuses.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Mainīgajam piekļūst kā <code>$Temperature::freezing<\/code>: sigils, pakotnes nosaukums, tad mainīgā nosaukums. Apakšprogrammu izsauc kā <code>Temperature::fahrenheit(100)<\/code>. Pārvēršot <code>100<\/code>, iegūst <code>100 * 9/5 + 32<\/code>, kas ir <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vienkāršs <code>package<\/code> jums dod tikai vārdtelpu. Atkārtoti lietojamai bibliotēkai mēs tā vietā izmantotu <code>module<\/code>. Kad strādājam ar objektiem, mēs izmantotu <code>class<\/code>. Bet vārdtelpa katrā gadījumā darbojas vienādi.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Пакет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И переменная, и подпрограмма объявлены с <code>our<\/code>. Поэтому обе становятся частью пространства имён <code>Temperature<\/code>, и к ним можно обратиться снаружи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">К переменной обращаются как <code>$Temperature::freezing<\/code>: сигил, имя пакета, затем имя переменной. Подпрограмму вызывают как <code>Temperature::fahrenheit(100)<\/code>. Перевод <code>100<\/code> даёт <code>100 * 9/5 + 32<\/code>, то есть <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Простой <code>package<\/code> даёт вам только пространство имён. Для библиотеки, которую используют снова, мы бы взяли <code>module<\/code>. При работе с объектами мы бы взяли <code>class<\/code>. Но пространство имён во всех случаях работает одинаково.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Пакунок","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І змінну, і підпрограму оголошено через <code>our<\/code>. Тож обидві стають частиною простору імен <code>Temperature<\/code>, і до них можна дістатися ззовні.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">До змінної дістаються як <code>$Temperature::freezing<\/code>: сигіл, ім'я пакунка, потім ім'я змінної. Підпрограму викликають як <code>Temperature::fahrenheit(100)<\/code>. Переведення <code>100<\/code> дає <code>100 * 9/5 + 32<\/code>, тобто <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Звичайний <code>package<\/code> дає вам лише простір імен. Для бібліотеки, яку можна використовувати знову, ми взяли б натомість <code>module<\/code>. Коли ми працюємо з об'єктами, ми взяли б <code>class<\/code>. Але простір імен працює однаково в кожному з цих випадків.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Пакет","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И променливата, и подпрограмата са декларирани с <code>our<\/code>. Така и двете стават част от пространството от имена <code>Temperature<\/code> и можете да достигнете до тях отвън.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">До променливата се достига като <code>$Temperature::freezing<\/code>: сигилът, името на пакета, след това името на променливата. Подпрограмата се извиква като <code>Temperature::fahrenheit(100)<\/code>. Преобразуването на <code>100<\/code> дава <code>100 * 9/5 + 32<\/code>, което е <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обикновеният <code>package<\/code> ви дава само пространството от имена. За библиотека за повторна употреба бихме използвали <code>module<\/code> вместо това. Когато работим с обекти, бихме използвали <code>class<\/code>. Но пространството от имена работи по същия начин във всеки от случаите.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Pako","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kaj la variablo kaj la subrutino estas deklaritaj per <code>our<\/code>. Do ambaŭ fariĝas parto de la nomspaco <code>Temperature<\/code>, kaj vi povas atingi ilin de ekstere.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La variablo estas atingata kiel <code>$Temperature::freezing<\/code>: la sigelo, la nomo de la pako, poste la nomo de la variablo. La subrutino estas vokata kiel <code>Temperature::fahrenheit(100)<\/code>. Konverti <code>100<\/code> donas <code>100 * 9/5 + 32<\/code>, kio estas <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simpla <code>package<\/code> donas al vi nur la nomspacon. Por reuzebla biblioteko, ni uzus <code>module<\/code> anstataŭe. Kiam ni laboras kun objektoj, ni uzus <code>class<\/code>. Sed la nomspaco funkcias same en ĉiu kazo.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Fasciculus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>package Temperature {\n    our $freezing = 0;\n    our sub fahrenheit($c) { $c * 9/5 + 32 }\n}\n\nsay $Temperature::freezing;\nsay Temperature::fahrenheit(100);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/a-package.raku\" target=\"_blank\" rel=\"noopener\">a-package.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>0\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tam variabilis quam subroutina cum <code>our<\/code> declaratae sunt. Itaque ambae partes spatii nominum <code>Temperature<\/code> fiunt, et eas ab extra attingere potes.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Variabilis attingitur ut <code>$Temperature::freezing<\/code>: sigillum, nomen fasciculi, deinde nomen variabilis. Subroutina vocatur ut <code>Temperature::fahrenheit(100)<\/code>. Conversio <code>100<\/code> dat <code>100 * 9/5 + 32<\/code>, quod est <code>212<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Simplex <code>package<\/code> tibi tantum spatium nominum dat. Pro bibliotheca quam iterum adhibere vis, <code>module<\/code> adhiberemus. Ubi cum obiectis laboramus, <code>class<\/code> adhiberemus. Sed spatium nominum in unoquoque casu eodem modo operatur.<\/span><\/li><\/ol>"]]}}}</script>
