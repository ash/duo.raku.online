 Вложено име","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Когато сложите едно пространство от имена вътре в друго, получавате по-дълъг път с <code>::<\/code>. И променливата, и подпрограмата са на две нива навътре, в <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пълното име <code>$Outer::Inner::base<\/code> достига до променливата. <code>Outer::Inner::doubled()<\/code> достига до подпрограмата през същите две нива. Името на подпрограмата няма сигил. Затова, за разлика от променливата, то няма <code>$<\/code> отпред.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата члена са декларирани с <code>our<\/code>. Точно това ги прави видими извън техния модул. С <code>my<\/code> те биха останали частни за <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Nestita nomo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kiam vi metas unu nomspacon en alian, vi ricevas pli longan vojon <code>::<\/code>. Kaj la variablo kaj la subrutino estas du nivelojn profunde, en <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La plena nomo <code>$Outer::Inner::base<\/code> atingas la variablon. <code>Outer::Inner::doubled()<\/code> atingas la subrutinon tra la samaj du niveloj. La nomo de subrutino ne havas sigelon. Do, male al la variablo, ĝi ne havas <code>$<\/code> antaŭe.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambaŭ membroj estas deklaritaj per <code>our<\/code>. Tio faras ilin videblaj ekster ilia modulo. Kun <code>my<\/code>, ili restus privataj en <code>Inner<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Nomen nidificatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $base = 10;\n        our sub doubled { $base * 2 }\n    }\n}\n\nsay $Outer::Inner::base;\nsay Outer::Inner::doubled();<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/packages/nested-name.raku\" target=\"_blank\" rel=\"noopener\">nested-name.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>10\n20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cum unum spatium nominum intra alterum ponis, longiorem viam <code>::<\/code> accipis. Tam variabilis quam subroutina duobus gradibus profunde sunt, in <code>Outer::Inner<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nomen plenum <code>$Outer::Inner::base<\/code> variabilem attingit. <code>Outer::Inner::doubled()<\/code> subroutinam per eosdem duos gradus attingit. Nomen subroutinae sigillum non habet. Itaque, dissimile variabili, <code>$<\/code> ante se non habet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambo membra cum <code>our<\/code> declarata sunt. Hoc ea extra modulum suum visibilia facit. Cum <code>my<\/code>, privata intra <code>Inner<\/code> manerent.<\/span><\/li><\/ol>"]]}}}</script>
