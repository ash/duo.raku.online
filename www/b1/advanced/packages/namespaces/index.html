<script type="application/json" id="page-data">{"u":"advanced/packages/namespaces","n":727,"k":"topic","pv":"advanced/packages/packages-modules/quiz","nx":"advanced/packages/exercises","tr":["advanced","advanced/packages"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Namespaces and our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>our<\/code> declarator is what makes a name visible in its namespace.<\/span> <span class=\"sg\" data-s=\"1\">A variable declared with <code>my<\/code> is lexical, which means it is private to its block.<\/span> <span class=\"sg\" data-s=\"2\">A variable declared with <code>our<\/code> is also a package variable.<\/span> <span class=\"sg\" data-s=\"3\">You can reach it from outside through the <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> works because <code>count<\/code> was declared with <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But <code>$Counter::secret<\/code> would fail, because <code>secret<\/code> is lexical.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namespaces can <strong>nest<\/strong>, that is, one can be inside another.<\/span> <span class=\"sg\" data-s=\"1\">A package inside a package gives a longer <code>::<\/code> path:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The full name <code>$Outer::Inner::val<\/code> leads from the outer namespace into the inner one.<\/span> <span class=\"sg\" data-s=\"1\">From there, it leads to the variable.<\/span> <span class=\"sg\" data-s=\"2\">This is exactly how the standard library is organised: names like <code>IO::Socket::INET<\/code> are nested namespaces.<\/span> <span class=\"sg\" data-s=\"3\">Your own modules also group their parts under one top-level name in this way.<\/span><\/p>"]]},"de":{"t":"Namensräume und our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Erst der <code>our<\/code>-Deklarator macht einen Namen in seinem Namensraum sichtbar.<\/span> <span class=\"sg\" data-s=\"1\">Eine Variable, die du mit <code>my<\/code> deklarierst, ist lexikalisch, also privat in ihrem Block.<\/span> <span class=\"sg\" data-s=\"2\">Eine Variable, die du mit <code>our<\/code> deklarierst, ist auch eine Package-Variable.<\/span> <span class=\"sg\" data-s=\"3\">Du kannst sie von außen über den <code>::<\/code>-Pfad erreichen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funktioniert, weil <code>count<\/code> mit <code>our<\/code> deklariert wurde.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>$Counter::secret<\/code> würde nicht funktionieren, weil <code>secret<\/code> lexikalisch ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Namensräume kann man <strong>verschachteln<\/strong>, das heißt, einer kann in einem anderen liegen.<\/span> <span class=\"sg\" data-s=\"1\">Ein Package in einem Package ergibt einen längeren <code>::<\/code>-Pfad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der volle Name <code>$Outer::Inner::val<\/code> führt vom äußeren Namensraum in den inneren.<\/span> <span class=\"sg\" data-s=\"1\">Von dort führt er zur Variable.<\/span> <span class=\"sg\" data-s=\"2\">Genau so ist die Standardbibliothek aufgebaut: Namen wie <code>IO::Socket::INET<\/code> sind verschachtelte Namensräume.<\/span> <span class=\"sg\" data-s=\"3\">Auch deine eigenen Module ordnen ihre Teile so unter einem gemeinsamen Hauptnamen.<\/span><\/p>"]]},"nl":{"t":"Naamruimten en our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De <code>our<\/code>-declarator maakt een naam zichtbaar in zijn naamruimte.<\/span> <span class=\"sg\" data-s=\"1\">Een variabele die met <code>my<\/code> gedeclareerd is, is lexicaal, wat betekent dat hij privé is voor zijn blok.<\/span> <span class=\"sg\" data-s=\"2\">Een variabele die met <code>our<\/code> gedeclareerd is, is ook een pakketvariabele.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt hem van buitenaf bereiken via het <code>::<\/code>-pad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> werkt omdat <code>count<\/code> met <code>our<\/code> gedeclareerd is.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>$Counter::secret<\/code> zou mislukken, omdat <code>secret<\/code> lexicaal is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Naamruimten kunnen <strong>genest<\/strong> worden, dat wil zeggen dat de ene in de andere kan zitten.<\/span> <span class=\"sg\" data-s=\"1\">Een pakket binnen een pakket geeft een langer <code>::<\/code>-pad:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De volledige naam <code>$Outer::Inner::val<\/code> leidt van de buitenste naamruimte naar de binnenste.<\/span> <span class=\"sg\" data-s=\"1\">Van daaruit leidt hij naar de variabele.<\/span> <span class=\"sg\" data-s=\"2\">Precies zo is de standaardbibliotheek opgebouwd: namen zoals <code>IO::Socket::INET<\/code> zijn geneste naamruimten.<\/span> <span class=\"sg\" data-s=\"3\">Je eigen modules groeperen hun onderdelen ook zo onder één naam op het hoogste niveau.<\/span><\/p>"]]},"es":{"t":"Espacios de nombres y our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El declarador <code>our<\/code> es lo que hace visible un nombre en su espacio de nombres.<\/span> <span class=\"sg\" data-s=\"1\">Una variable declarada con <code>my<\/code> es léxica, es decir, es privada para su bloque.<\/span> <span class=\"sg\" data-s=\"2\">Una variable declarada con <code>our<\/code> también es una variable de paquete.<\/span> <span class=\"sg\" data-s=\"3\">Puedes acceder a ella desde fuera a través de la ruta <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funciona porque <code>count<\/code> se declaró con <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>$Counter::secret<\/code> fallaría, porque <code>secret<\/code> es léxica.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los espacios de nombres pueden <strong>anidarse<\/strong>, es decir, uno puede estar dentro de otro.<\/span> <span class=\"sg\" data-s=\"1\">Un paquete dentro de otro paquete da una ruta <code>::<\/code> más larga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El nombre completo <code>$Outer::Inner::val<\/code> lleva del espacio de nombres externo al interno.<\/span> <span class=\"sg\" data-s=\"1\">Desde ahí, lleva a la variable.<\/span> <span class=\"sg\" data-s=\"2\">Así es justo como se organiza la biblioteca estándar: nombres como <code>IO::Socket::INET<\/code> son espacios de nombres anidados.<\/span> <span class=\"sg\" data-s=\"3\">Tus propios módulos también agrupan así sus partes bajo un nombre de nivel superior.<\/span><\/p>"]]},"it":{"t":"Namespace e our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">È il dichiaratore <code>our<\/code> che rende un nome visibile nel suo namespace.<\/span> <span class=\"sg\" data-s=\"1\">Una variabile dichiarata con <code>my<\/code> è lessicale, cioè è privata al suo blocco.<\/span> <span class=\"sg\" data-s=\"2\">Una variabile dichiarata con <code>our<\/code> è anche una variabile di package.<\/span> <span class=\"sg\" data-s=\"3\">Puoi raggiungerla dall'esterno attraverso il percorso <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funziona perché <code>count<\/code> è stata dichiarata con <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>$Counter::secret<\/code> non funzionerebbe, perché <code>secret<\/code> è lessicale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I namespace possono essere <strong>annidati<\/strong>, cioè uno può stare dentro un altro.<\/span> <span class=\"sg\" data-s=\"1\">Un package dentro un package dà un percorso <code>::<\/code> più lungo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il nome completo <code>$Outer::Inner::val<\/code> porta dal namespace esterno a quello interno.<\/span> <span class=\"sg\" data-s=\"1\">Da lì, porta alla variabile.<\/span> <span class=\"sg\" data-s=\"2\">È proprio così che è organizzata la libreria standard: nomi come <code>IO::Socket::INET<\/code> sono namespace annidati.<\/span> <span class=\"sg\" data-s=\"3\">Anche i tuoi moduli raggruppano così le loro parti sotto un unico nome di primo livello.<\/span><\/p>"]]},"lv":{"t":"Vārdtelpas un our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tieši deklarators <code>our<\/code> padara nosaukumu redzamu tā vārdtelpā.<\/span> <span class=\"sg\" data-s=\"1\">Mainīgais, kas deklarēts ar <code>my<\/code>, ir leksisks, tas nozīmē, ka tas ir privāts savam blokam.<\/span> <span class=\"sg\" data-s=\"2\">Mainīgais, kas deklarēts ar <code>our<\/code>, ir arī pakotnes mainīgais.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat to sasniegt no ārpuses caur <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> darbojas, jo <code>count<\/code> tika deklarēts ar <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>$Counter::secret<\/code> nedarbotos, jo <code>secret<\/code> ir leksisks.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vārdtelpas var būt <strong>ligzdotas<\/strong>, tas ir, viena var atrasties otras iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Pakotne pakotnes iekšienē dod garāku <code>::<\/code> ceļu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pilnais nosaukums <code>$Outer::Inner::val<\/code> ved no ārējās vārdtelpas uz iekšējo.<\/span> <span class=\"sg\" data-s=\"1\">No turienes tas ved līdz mainīgajam.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tā ir veidota standarta bibliotēka: tādi nosaukumi kā <code>IO::Socket::INET<\/code> ir ligzdotas vārdtelpas.<\/span> <span class=\"sg\" data-s=\"3\">Arī jūsu pašu moduļi šādi grupē savas daļas zem viena augstākā līmeņa nosaukuma.<\/span><\/p>"]]},"ru":{"t":"Пространства имён и our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Именно декларатор <code>our<\/code> делает имя видимым в его пространстве имён.<\/span> <span class=\"sg\" data-s=\"1\">Переменная, объявленная с <code>my<\/code>, лексическая, то есть она приватная для своего блока.<\/span> <span class=\"sg\" data-s=\"2\">Переменная, объявленная с <code>our<\/code>, — это ещё и переменная пакета.<\/span> <span class=\"sg\" data-s=\"3\">К ней можно обратиться снаружи через путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работает, потому что <code>count<\/code> объявлена с <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А <code>$Counter::secret<\/code> вызвало бы ошибку, потому что <code>secret<\/code> — лексическая переменная.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пространства имён могут быть <strong>вложенными<\/strong>, то есть одно может лежать внутри другого.<\/span> <span class=\"sg\" data-s=\"1\">Пакет внутри пакета даёт более длинный путь <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Полное имя <code>$Outer::Inner::val<\/code> ведёт из внешнего пространства имён во внутреннее.<\/span> <span class=\"sg\" data-s=\"1\">Оттуда оно ведёт к переменной.<\/span> <span class=\"sg\" data-s=\"2\">Именно так устроена стандартная библиотека: имена вроде <code>IO::Socket::INET<\/code> — это вложенные пространства имён.<\/span> <span class=\"sg\" data-s=\"3\">Ваши собственные модули тоже так собирают свои части под одним именем верхнего уровня.<\/span><\/p>"]]},"uk":{"t":"Простори імен та our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Саме декларатор <code>our<\/code> робить ім'я видимим у його просторі імен.<\/span> <span class=\"sg\" data-s=\"1\">Змінна, оголошена через <code>my<\/code>, є лексичною, тобто приватною для свого блоку.<\/span> <span class=\"sg\" data-s=\"2\">Змінна, оголошена через <code>our<\/code>, — це ще й змінна пакунка.<\/span> <span class=\"sg\" data-s=\"3\">До неї можна дістатися ззовні через шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # змінна пакунка\n    my  $secret = 42; # лексична, ззовні не видима\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> працює, бо <code>count<\/code> оголошено через <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>$Counter::secret<\/code> не спрацював би, бо <code>secret<\/code> — лексична змінна.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Простори імен можуть <strong>вкладатися<\/strong>, тобто один може бути всередині іншого.<\/span> <span class=\"sg\" data-s=\"1\">Пакунок усередині пакунка дає довший шлях із <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Повне ім'я <code>$Outer::Inner::val<\/code> веде із зовнішнього простору імен у внутрішній.<\/span> <span class=\"sg\" data-s=\"1\">Звідти воно веде до змінної.<\/span> <span class=\"sg\" data-s=\"2\">Саме так побудована стандартна бібліотека: імена на кшталт <code>IO::Socket::INET<\/code> — це вкладені простори імен.<\/span> <span class=\"sg\" data-s=\"3\">Ваші власні модулі теж так збирають свої частини під одним іменем верхнього рівня.<\/span><\/p>"]]},"bg":{"t":"Пространства от имена и our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Декларацията <code>our<\/code> е това, което прави едно име видимо в неговото пространство от имена.<\/span> <span class=\"sg\" data-s=\"1\">Променлива, декларирана с <code>my<\/code>, е лексикална, което значи, че е частна за своя блок.<\/span> <span class=\"sg\" data-s=\"2\">Променлива, декларирана с <code>our<\/code>, е също и пакетна променлива.<\/span> <span class=\"sg\" data-s=\"3\">Можете да достигнете до нея отвън чрез пътя с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> работи, защото <code>count<\/code> е декларирана с <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>$Counter::secret<\/code> не би сработила, защото <code>secret<\/code> е лексикална.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пространствата от имена могат да бъдат <strong>вложени<\/strong>, тоест едно може да е вътре в друго.<\/span> <span class=\"sg\" data-s=\"1\">Пакет вътре в пакет дава по-дълъг път с <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Пълното име <code>$Outer::Inner::val<\/code> води от външното пространство от имена към вътрешното.<\/span> <span class=\"sg\" data-s=\"1\">Оттам то води до променливата.<\/span> <span class=\"sg\" data-s=\"2\">Точно така е организирана стандартната библиотека: имена като <code>IO::Socket::INET<\/code> са вложени пространства от имена.<\/span> <span class=\"sg\" data-s=\"3\">Вашите собствени модули също групират частите си под едно име от най-високо ниво по този начин.<\/span><\/p>"]]},"eo":{"t":"Nomspacoj kaj our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La deklaracio <code>our<\/code> estas tio, kio faras nomon videbla en ĝia nomspaco.<\/span> <span class=\"sg\" data-s=\"1\">Variablo deklarita per <code>my<\/code> estas leksika, kio signifas, ke ĝi estas privata en sia bloko.<\/span> <span class=\"sg\" data-s=\"2\">Variablo deklarita per <code>our<\/code> estas ankaŭ paka variablo.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas atingi ĝin de ekstere per la vojo <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # paka variablo\n    my  $secret = 42; # leksika, ne videbla ekstere\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> funkcias, ĉar <code>count<\/code> estis deklarita per <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>$Counter::secret<\/code> malsukcesus, ĉar <code>secret<\/code> estas leksika.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomspacoj povas <strong>nestiĝi<\/strong>, tio estas, unu povas esti en alia.<\/span> <span class=\"sg\" data-s=\"1\">Pako en pako donas pli longan vojon <code>::<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La plena nomo <code>$Outer::Inner::val<\/code> kondukas de la ekstera nomspaco en la internan.<\/span> <span class=\"sg\" data-s=\"1\">De tie, ĝi kondukas al la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝuste tiel la norma biblioteko estas organizita: nomoj kiel <code>IO::Socket::INET<\/code> estas nestitaj nomspacoj.<\/span> <span class=\"sg\" data-s=\"3\">Ankaŭ viaj propraj moduloj tiel grupigas siajn partojn sub unu supra nomo.<\/span><\/p>"]]},"la":{"t":"Spatia nominum et our","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Declarator <code>our<\/code> est quod nomen in spatio nominum suo visibile facit.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis cum <code>my<\/code> declarata lexicalis est, id est privata suo blocco.<\/span> <span class=\"sg\" data-s=\"2\">Variabilis cum <code>our<\/code> declarata etiam variabilis fasciculi est.<\/span> <span class=\"sg\" data-s=\"3\">Eam ab extra per viam <code>::<\/code> attingere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Counter {\n    our $count = 0;  # package variable\n    my  $secret = 42; # lexical, not visible outside\n}\n\nsay $Counter::count; # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>$Counter::count<\/code> operatur quia <code>count<\/code> cum <code>our<\/code> declarata est.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>$Counter::secret<\/code> non operaretur, quia <code>secret<\/code> lexicalis est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Spatia nominum <strong>nidificari<\/strong> possunt, id est unum intra alterum esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Fasciculus intra fasciculum longiorem viam <code>::<\/code> dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>module Outer {\n    module Inner {\n        our $val = 42;\n    }\n}\n\nsay $Outer::Inner::val; # 42<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomen plenum <code>$Outer::Inner::val<\/code> ab exteriore spatio nominum in interius ducit.<\/span> <span class=\"sg\" data-s=\"1\">Inde ad variabilem ducit.<\/span> <span class=\"sg\" data-s=\"2\">Sic exacte bibliotheca ordinaria disposita est: nomina ut <code>IO::Socket::INET<\/code> sunt spatia nominum nidificata.<\/span> <span class=\"sg\" data-s=\"3\">Moduli tui quoque hoc modo partes suas sub uno nomine summo colligunt.<\/span><\/p>"]]}}}</script>
