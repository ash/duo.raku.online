<script type="application/json" id="page-data">{"u":"advanced/introspection/who-how","n":423,"k":"topic","pv":"advanced/introspection/var","nx":"advanced/introspection/exercises","tr":["advanced","advanced/introspection"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"<code>WHO<\/code> and <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">The last two introspection tools in the set are <code>HOW<\/code> and <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Behind every value in Raku, there is a <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is an object that knows how the type of the value works.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, which is short for <em>Higher Order Workings<\/em>, returns this metaobject:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In fact, you have used the metaobject all the time, maybe without noticing it.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.^<\/code> in <code>.^name<\/code> is a method call that goes through <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">These two lines do the same thing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">So <code>$x.^name<\/code> is just a shorter way to write <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Note that the object is passed in again as an argument.<\/span> <span class=\"sg\" data-s=\"2\">This is because every value of the type <em>shares<\/em> the same metaobject.<\/span> <span class=\"sg\" data-s=\"3\">So a meta-method must be told which object you are asking about.<\/span> <span class=\"sg\" data-s=\"4\">The <code>.^<\/code> form does this for you automatically.<\/span> <span class=\"sg\" data-s=\"5\">For <code>name<\/code>, the argument is actually ignored.<\/span> <span class=\"sg\" data-s=\"6\">But passing it is the correct, general form, because some meta-methods do use it.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same is true for other meta-methods that you may see, such as <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It lists the methods that you can call on a value.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> returns the <em>package<\/em> that a name belongs to.<\/span> <span class=\"sg\" data-s=\"1\">This is the table of symbols that are defined in that namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A <code>Stash<\/code> is a hash that holds a symbol table.<\/span> <span class=\"sg\" data-s=\"1\">It becomes useful when you work with modules.<\/span> <span class=\"sg\" data-s=\"2\">Then it lets you look up the names that a module defines.<\/span> <span class=\"sg\" data-s=\"3\">We will come back to it in <a href=\"/advanced/module-introspection/\">the section about modules<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">For now, it is enough to know that <code>WHO<\/code> exists and what it returns.<\/span><\/p>"]]},"de":{"t":"<code>WHO<\/code> und <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Die letzten zwei Introspektionswerkzeuge der Reihe sind <code>HOW<\/code> und <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hinter jedem Wert in Raku gibt es ein <em>Metaobjekt<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist ein Objekt, das weiß, wie der Typ des Wertes funktioniert.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, das kurz für <em>Higher Order Workings<\/em> ist, gibt dieses Metaobjekt zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich hast du das Metaobjekt die ganze Zeit verwendet, vielleicht ohne es zu bemerken.<\/span> <span class=\"sg\" data-s=\"1\">Das <code>.^<\/code> in <code>.^name<\/code> ist ein Methodenaufruf, der über <code>HOW<\/code> geht.<\/span> <span class=\"sg\" data-s=\"2\">Diese beiden Zeilen tun dasselbe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Also ist <code>$x.^name<\/code> nur eine kürzere Schreibweise für <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Beachte, dass das Objekt noch einmal als Argument übergeben wird.<\/span> <span class=\"sg\" data-s=\"2\">Das liegt daran, dass jeder Wert des Typs dasselbe Metaobjekt <em>teilt<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Also muss eine Meta-Methode erfahren, nach welchem Objekt du fragst.<\/span> <span class=\"sg\" data-s=\"4\">Die Form <code>.^<\/code> macht das automatisch für dich.<\/span> <span class=\"sg\" data-s=\"5\">Bei <code>name<\/code> wird das Argument tatsächlich ignoriert.<\/span> <span class=\"sg\" data-s=\"6\">Aber es zu übergeben ist die richtige, allgemeine Form, weil manche Meta-Methoden es wirklich verwenden.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dasselbe gilt für andere Meta-Methoden, die du vielleicht siehst, wie <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es listet die Methoden auf, die du auf einem Wert aufrufen kannst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> gibt das <em>Paket<\/em> zurück, zu dem ein Name gehört.<\/span> <span class=\"sg\" data-s=\"1\">Das ist die Tabelle der Symbole, die in diesem Namensraum definiert sind:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Stash<\/code> ist ein Hash, der eine Symboltabelle enthält.<\/span> <span class=\"sg\" data-s=\"1\">Er wird nützlich, wenn du mit Modulen arbeitest.<\/span> <span class=\"sg\" data-s=\"2\">Dann kannst du mit ihm die Namen nachschlagen, die ein Modul definiert.<\/span> <span class=\"sg\" data-s=\"3\">Wir kommen im <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Module<\/a> darauf zurück.<\/span> <span class=\"sg\" data-s=\"4\">Für den Moment reicht es zu wissen, dass <code>WHO<\/code> existiert und was es zurückgibt.<\/span><\/p>"]]},"nl":{"t":"<code>WHO<\/code> en <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">De laatste twee introspectietools in de set zijn <code>HOW<\/code> en <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Achter elke waarde in Raku zit een <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een object dat weet hoe het type van de waarde werkt.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, een afkorting van <em>Higher Order Workings<\/em>, geeft dit metaobject terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eigenlijk heb je het metaobject al die tijd gebruikt, misschien zonder het te merken.<\/span> <span class=\"sg\" data-s=\"1\">De <code>.^<\/code> in <code>.^name<\/code> is een methode-aanroep die via <code>HOW<\/code> gaat.<\/span> <span class=\"sg\" data-s=\"2\">Deze twee regels doen hetzelfde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Dus is <code>$x.^name<\/code> gewoon een kortere manier om <code>$x.HOW.name($x)<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Let op: het object wordt opnieuw als argument meegegeven.<\/span> <span class=\"sg\" data-s=\"2\">Dat komt doordat elke waarde van het type hetzelfde metaobject <em>deelt<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dus moet een meta-methode horen over welk object je vraagt.<\/span> <span class=\"sg\" data-s=\"4\">De <code>.^<\/code>-vorm doet dit automatisch voor je.<\/span> <span class=\"sg\" data-s=\"5\">Voor <code>name<\/code> wordt het argument eigenlijk genegeerd.<\/span> <span class=\"sg\" data-s=\"6\">Maar het meegeven ervan is de correcte, algemene vorm, want sommige meta-methodes gebruiken het wel.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde geldt voor andere meta-methodes die je kunt tegenkomen, zoals <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft een lijst van de methodes die je op een waarde kunt aanroepen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> geeft het <em>package<\/em> terug waar een naam bij hoort.<\/span> <span class=\"sg\" data-s=\"1\">Dat is de tabel met symbolen die in die namespace gedefinieerd zijn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <code>Stash<\/code> is een hash die een symbooltabel bevat.<\/span> <span class=\"sg\" data-s=\"1\">Hij wordt nuttig als je met modules werkt.<\/span> <span class=\"sg\" data-s=\"2\">Dan kun je er de namen mee opzoeken die een module definieert.<\/span> <span class=\"sg\" data-s=\"3\">We komen er later op terug in <a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">het gedeelte over modules<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Voor nu is het genoeg om te weten dat <code>WHO<\/code> bestaat en wat het teruggeeft.<\/span><\/p>"]]},"es":{"t":"<code>WHO<\/code> y <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Las dos últimas herramientas de introspección del conjunto son <code>HOW<\/code> y <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Detrás de cada valor en Raku, hay un <em>metaobjeto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es un objeto que sabe cómo funciona el tipo del valor.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, que es la forma corta de <em>Higher Order Workings<\/em>, devuelve este metaobjeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De hecho, has usado el metaobjeto todo el tiempo, quizás sin darte cuenta.<\/span> <span class=\"sg\" data-s=\"1\">El <code>.^<\/code> en <code>.^name<\/code> es una llamada a un método que pasa por <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Estas dos líneas hacen lo mismo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Así que <code>$x.^name<\/code> es solo una forma más corta de escribir <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Observa que el objeto se pasa otra vez como argumento.<\/span> <span class=\"sg\" data-s=\"2\">Esto es porque todos los valores del tipo <em>comparten<\/em> el mismo metaobjeto.<\/span> <span class=\"sg\" data-s=\"3\">Así que hay que decirle a un meta-método por qué objeto preguntas.<\/span> <span class=\"sg\" data-s=\"4\">La forma <code>.^<\/code> hace esto por ti automáticamente.<\/span> <span class=\"sg\" data-s=\"5\">Para <code>name<\/code>, en realidad el argumento no se usa.<\/span> <span class=\"sg\" data-s=\"6\">Pero pasarlo es la forma correcta y general, porque algunos meta-métodos sí lo usan.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo mismo vale para otros meta-métodos que puedes encontrar, como <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da una lista de los métodos que puedes llamar sobre un valor.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> devuelve el <em>paquete<\/em> al que pertenece un nombre.<\/span> <span class=\"sg\" data-s=\"1\">Es la tabla de los símbolos que están definidos en ese espacio de nombres:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <code>Stash<\/code> es un hash que guarda una tabla de símbolos.<\/span> <span class=\"sg\" data-s=\"1\">Se vuelve útil cuando trabajas con módulos.<\/span> <span class=\"sg\" data-s=\"2\">Entonces te permite buscar los nombres que define un módulo.<\/span> <span class=\"sg\" data-s=\"3\">Volveremos a él en <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sección sobre módulos<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Por ahora, basta con saber que <code>WHO<\/code> existe y qué devuelve.<\/span><\/p>"]]},"it":{"t":"<code>WHO<\/code> e <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Gli ultimi due strumenti di introspezione dell'insieme sono <code>HOW<\/code> e <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dietro ogni valore in Raku c'è un <em>metaoggetto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È un oggetto che sa come funziona il tipo del valore.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, che sta per <em>Higher Order Workings<\/em>, restituisce questo metaoggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">In realtà, hai sempre usato il metaoggetto, forse senza accorgertene.<\/span> <span class=\"sg\" data-s=\"1\">Il <code>.^<\/code> in <code>.^name<\/code> è una chiamata di metodo che passa per <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Queste due righe fanno la stessa cosa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Quindi <code>$x.^name<\/code> è solo un modo più breve di scrivere <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota che l'oggetto viene passato di nuovo come argomento.<\/span> <span class=\"sg\" data-s=\"2\">Questo perché ogni valore del tipo <em>condivide<\/em> lo stesso metaoggetto.<\/span> <span class=\"sg\" data-s=\"3\">Quindi bisogna dire a un meta-metodo di quale oggetto stai chiedendo.<\/span> <span class=\"sg\" data-s=\"4\">La forma <code>.^<\/code> lo fa per te in automatico.<\/span> <span class=\"sg\" data-s=\"5\">Per <code>name<\/code>, in realtà l'argomento viene ignorato.<\/span> <span class=\"sg\" data-s=\"6\">Ma passarlo è la forma corretta e generale, perché alcuni meta-metodi lo usano davvero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale per altri meta-metodi che potresti incontrare, come <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Elenca i metodi che puoi chiamare su un valore.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> restituisce il <em>package<\/em> a cui appartiene un nome.<\/span> <span class=\"sg\" data-s=\"1\">È la tabella dei simboli che sono definiti in quel namespace:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Uno <code>Stash<\/code> è un hash che contiene una tabella dei simboli.<\/span> <span class=\"sg\" data-s=\"1\">Diventa utile quando lavori con i moduli.<\/span> <span class=\"sg\" data-s=\"2\">Allora ti permette di cercare i nomi che un modulo definisce.<\/span> <span class=\"sg\" data-s=\"3\">Ci torneremo nella <a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sezione sui moduli<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Per ora basta sapere che <code>WHO<\/code> esiste e cosa restituisce.<\/span><\/p>"]]},"lv":{"t":"<code>WHO<\/code> un <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Pēdējie divi introspekcijas rīki šajā kopā ir <code>HOW<\/code> un <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Aiz katras vērtības Raku valodā ir <em>metaobjekts<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir objekts, kas zina, kā darbojas vērtības tips.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, kas ir saīsinājums no <em>Higher Order Workings<\/em>, atgriež šo metaobjektu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Patiesībā jūs visu laiku esat izmantojuši metaobjektu, varbūt to nepamanot.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> izsaukumā <code>.^name<\/code> ir metodes izsaukums, kas iet caur <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šīs divas rindas dara vienu un to pašu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>$x.^name<\/code> ir tikai īsāks veids, kā uzrakstīt <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ievērojiet, ka objekts tiek padots vēlreiz kā arguments.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tāpēc, ka visām tipa vērtībām ir <em>kopīgs<\/em> viens un tas pats metaobjekts.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc metametodei ir jāpasaka, par kuru objektu jūs jautājat.<\/span> <span class=\"sg\" data-s=\"4\">Forma <code>.^<\/code> to dara jūsu vietā automātiski.<\/span> <span class=\"sg\" data-s=\"5\">Metodes <code>name<\/code> gadījumā arguments patiesībā tiek ignorēts.<\/span> <span class=\"sg\" data-s=\"6\">Bet tā padošana ir pareizā, vispārīgā forma, jo dažas metametodes to tiešām izmanto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats attiecas uz citām metametodēm, ko jūs varat sastapt, piemēram, <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā uzskaita metodes, kuras jūs varat izsaukt uz vērtības.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> atgriež <em>pakotni<\/em>, kurai pieder nosaukums.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir to simbolu tabula, kas ir definēti šajā vārdtelpā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> ir hešs, kas satur simbolu tabulu.<\/span> <span class=\"sg\" data-s=\"1\">Tas kļūst noderīgs, kad jūs strādājat ar moduļiem.<\/span> <span class=\"sg\" data-s=\"2\">Tad tas ļauj atrast nosaukumus, ko modulis definē.<\/span> <span class=\"sg\" data-s=\"3\">Mēs pie tā atgriezīsimies <a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sadaļā par moduļiem<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Pagaidām pietiek zināt, ka <code>WHO<\/code> pastāv un ko tas atgriež.<\/span><\/p>"]]},"ru":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Последние два инструмента интроспекции в этом наборе — <code>HOW<\/code> и <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За каждым значением в Raku стоит <em>метаобъект<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это объект, который знает, как работает тип значения.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, сокращение от <em>Higher Order Workings<\/em>, возвращает этот метаобъект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На самом деле вы всё время пользовались метаобъектом, может быть, не замечая этого.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> в <code>.^name<\/code> — это вызов метода, который идёт через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эти две строки делают одно и то же:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Значит, <code>$x.^name<\/code> — это просто более короткая запись <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обратите внимание, что объект снова передаётся как аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Это потому, что у всех значений типа <em>общий<\/em> метаобъект.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому мета-методу нужно сказать, о каком объекте вы спрашиваете.<\/span> <span class=\"sg\" data-s=\"4\">Форма <code>.^<\/code> делает это за вас автоматически.<\/span> <span class=\"sg\" data-s=\"5\">Для <code>name<\/code> этот аргумент на самом деле не используется.<\/span> <span class=\"sg\" data-s=\"6\">Но передавать его — правильная, общая форма, потому что некоторые мета-методы его используют.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То же верно и для других мета-методов, которые вы можете встретить, например <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он перечисляет методы, которые можно вызвать у значения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> возвращает <em>пакет<\/em>, к которому относится имя.<\/span> <span class=\"sg\" data-s=\"1\">Это таблица символов, которые определены в этом пространстве имён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> — это хеш, в котором хранится таблица символов.<\/span> <span class=\"sg\" data-s=\"1\">Он становится полезным, когда вы работаете с модулями.<\/span> <span class=\"sg\" data-s=\"2\">Тогда он позволяет найти имена, которые определяет модуль.<\/span> <span class=\"sg\" data-s=\"3\">Мы вернёмся к нему в <a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">разделе о модулях<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Пока достаточно знать, что <code>WHO<\/code> существует и что он возвращает.<\/span><\/p>"]]},"uk":{"t":"<code>WHO<\/code> та <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Останні два інструменти інтроспекції в наборі — це <code>HOW<\/code> і <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За кожним значенням у Raku стоїть <em>метаоб'єкт<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це об'єкт, який знає, як працює тип значення.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, скорочення від <em>Higher Order Workings<\/em>, повертає цей метаоб'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Насправді ви весь час використовували метаоб'єкт, можливо, не помічаючи цього.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> у <code>.^name<\/code> — це виклик методу, який іде через <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ці два рядки роблять те саме:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Тож <code>$x.^name<\/code> — це просто коротший спосіб записати <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Зверніть увагу, що об'єкт ще раз передається як аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Це тому, що всі значення типу мають <em>спільний<\/em> метаоб'єкт.<\/span> <span class=\"sg\" data-s=\"3\">Тож метаметоду треба сказати, про який об'єкт ви питаєте.<\/span> <span class=\"sg\" data-s=\"4\">Форма <code>.^<\/code> робить це за вас автоматично.<\/span> <span class=\"sg\" data-s=\"5\">Для <code>name<\/code> цей аргумент насправді ігнорується.<\/span> <span class=\"sg\" data-s=\"6\">Але передавати його — правильна, загальна форма, бо деякі метаметоди таки його використовують.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Те саме стосується інших метаметодів, які ви можете зустріти, як-от <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він перелічує методи, які можна викликати для значення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> повертає <em>пакунок<\/em>, якому належить ім'я.<\/span> <span class=\"sg\" data-s=\"1\">Це таблиця символів, які визначено в цьому просторі імен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> — це хеш, який містить таблицю символів.<\/span> <span class=\"sg\" data-s=\"1\">Він стає корисним, коли ви працюєте з модулями.<\/span> <span class=\"sg\" data-s=\"2\">Тоді він дозволяє шукати імена, які визначає модуль.<\/span> <span class=\"sg\" data-s=\"3\">Ми повернемося до нього в <a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">розділі про модулі<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Поки що досить знати, що <code>WHO<\/code> існує і що він повертає.<\/span><\/p>"]]},"bg":{"t":"<code>WHO<\/code> и <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Последните два инструмента за интроспекция в набора са <code>HOW<\/code> и <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зад всяка стойност в Raku стои <em>метаобект<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това е обект, който знае как работи типът на стойността.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, което е съкращение от <em>Higher Order Workings<\/em>, връща този метаобект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всъщност вие използвате метаобекта през цялото време, може би без да го забелязвате.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> в <code>.^name<\/code> е извикване на метод, което минава през <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тези два реда правят едно и също:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Така <code>$x.^name<\/code> е просто по-кратък начин да напишете <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Забележете, че обектът се предава отново като аргумент.<\/span> <span class=\"sg\" data-s=\"2\">Това е така, защото всяка стойност на типа <em>споделя<\/em> същия метаобект.<\/span> <span class=\"sg\" data-s=\"3\">Затова на мета-метода трябва да се каже за кой обект питате.<\/span> <span class=\"sg\" data-s=\"4\">Формата <code>.^<\/code> прави това автоматично вместо вас.<\/span> <span class=\"sg\" data-s=\"5\">За <code>name<\/code> аргументът всъщност не се използва.<\/span> <span class=\"sg\" data-s=\"6\">Но предаването му е правилната, обща форма, защото някои мета-методи наистина го използват.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същото важи и за други мета-методи, които може да срещнете, например <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той изброява методите, които можете да извикате върху стойност.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> връща <em>пакета<\/em>, към който принадлежи дадено име.<\/span> <span class=\"sg\" data-s=\"1\">Това е таблицата на символите, които са дефинирани в това пространство от имена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> е хеш, който съдържа таблица на символите.<\/span> <span class=\"sg\" data-s=\"1\">Той става полезен, когато работите с модули.<\/span> <span class=\"sg\" data-s=\"2\">Тогава ви позволява да потърсите имената, които модулът дефинира.<\/span> <span class=\"sg\" data-s=\"3\">Ще се върнем към него в <a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">раздела за модулите<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Засега е достатъчно да знаете, че <code>WHO<\/code> съществува и какво връща.<\/span><\/p>"]]},"eo":{"t":"<code>WHO<\/code> kaj <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">La lastaj du introspektaj iloj en la aro estas <code>HOW<\/code> kaj <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Malantaŭ ĉiu valoro en Raku, estas <em>metaobjekto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas objekto, kiu scias, kiel funkcias la tipo de la valoro.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, kiu estas mallongigo de <em>Higher Order Workings<\/em>, redonas ĉi tiun metaobjekton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fakte, vi uzis la metaobjekton la tutan tempon, eble sen rimarki tion.<\/span> <span class=\"sg\" data-s=\"1\">La <code>.^<\/code> en <code>.^name<\/code> estas metod-alvoko, kiu iras tra <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj du linioj faras la samon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Do <code>$x.^name<\/code> estas nur pli mallonga maniero skribi <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Notu, ke la objekto denove estas transdonita kiel argumento.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas ĉar ĉiu valoro de la tipo <em>kunhavas<\/em> la saman metaobjekton.<\/span> <span class=\"sg\" data-s=\"3\">Do oni devas diri al meta-metodo, pri kiu objekto vi demandas.<\/span> <span class=\"sg\" data-s=\"4\">La formo <code>.^<\/code> faras tion por vi aŭtomate.<\/span> <span class=\"sg\" data-s=\"5\">Por <code>name<\/code>, la argumento fakte estas ignorata.<\/span> <span class=\"sg\" data-s=\"6\">Sed transdoni ĝin estas la ĝusta, ĝenerala formo, ĉar kelkaj meta-metodoj ja uzas ĝin.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La samo validas por aliaj meta-metodoj, kiujn vi eble vidos, ekzemple <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi listigas la metodojn, kiujn vi povas voki sur valoro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> redonas la <em>pakon<\/em>, al kiu nomo apartenas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la tabelo de simboloj, kiuj estas difinitaj en tiu nomspaco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> estas hako, kiu tenas simbol-tabelon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi fariĝas utila, kiam vi laboras kun moduloj.<\/span> <span class=\"sg\" data-s=\"2\">Tiam ĝi permesas al vi serĉi la nomojn, kiujn modulo difinas.<\/span> <span class=\"sg\" data-s=\"3\">Ni revenos al ĝi en <a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">la sekcio pri moduloj<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Por nun, sufiĉas scii, ke <code>WHO<\/code> ekzistas, kaj kion ĝi redonas.<\/span><\/p>"]]},"la":{"t":"<code>WHO<\/code> et <code>HOW<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ultima duo instrumenta introspectionis in serie sunt <code>HOW<\/code> et <code>WHO<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>HOW<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Post omnem valorem in Raku est <em>metaobiectum<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est obiectum quod scit quomodo typus valoris operetur.<\/span> <span class=\"sg\" data-s=\"2\"><code>HOW<\/code>, quod est abbreviatio pro <em>Higher Order Workings<\/em>, hoc metaobiectum reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.HOW.^name; # Perl6::Metamodel::ClassHOW<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Re vera metaobiecto semper usus es, fortasse sine animadversione.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^<\/code> in <code>.^name<\/code> est vocatio methodi quae per <code>HOW<\/code> it.<\/span> <span class=\"sg\" data-s=\"2\">Hae duae lineae idem faciunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 42;\nsay $x.^name;        # Int\nsay $x.HOW.name($x); # Int<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>$x.^name<\/code> est tantum brevior modus scribendi <code>$x.HOW.name($x)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Nota obiectum iterum ut argumentum transmitti.<\/span> <span class=\"sg\" data-s=\"2\">Causa est quod omnis valor typi idem metaobiectum <em>communicat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Itaque meta-methodus scire debet de quo obiecto interroges.<\/span> <span class=\"sg\" data-s=\"4\">Forma <code>.^<\/code> hoc pro te sponte facit.<\/span> <span class=\"sg\" data-s=\"5\">Pro <code>name<\/code> argumentum revera neglegitur.<\/span> <span class=\"sg\" data-s=\"6\">Sed id transmittere est forma recta et generalis, quia quaedam meta-methodi eo utuntur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem verum est de aliis meta-methodis quas videre potes, ut <code>.^methods<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Haec methodos enumerat quas in valore vocare potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>WHO<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHO<\/code> <em>fasciculum<\/em> reddit ad quem nomen pertinet.<\/span> <span class=\"sg\" data-s=\"1\">Haec est tabula symbolorum quae in illo spatio nominum definita sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.WHO.^name; # Stash<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>Stash<\/code> est hash quod tabulam symbolorum tenet.<\/span> <span class=\"sg\" data-s=\"1\">Utile fit cum modulis operaris.<\/span> <span class=\"sg\" data-s=\"2\">Tum tibi permittit nomina quae modulus definit inspicere.<\/span> <span class=\"sg\" data-s=\"3\">Ad id redibimus in <a href=\"https://course.raku.org/la/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">sectione de modulis<\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Nunc satis est scire <code>WHO<\/code> exsistere et quid reddat.<\/span><\/p>"]]}}}</script>
