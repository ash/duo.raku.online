<script type="application/json" id="page-data">{"u":"advanced/introspection/var","n":422,"k":"topic","pv":"advanced/introspection/what/quiz","nx":"advanced/introspection/who-how","tr":["advanced","advanced/introspection"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> is a pseudo-method that returns the container object behind a variable.<\/span> <span class=\"sg\" data-s=\"1\">For a scalar variable, a call to <code>.VAR<\/code> gives the <code>Scalar<\/code> container behind it.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">With the container, you can ask for the name of its class with <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> on the variable gives the type of the <em>value<\/em>, <code>Int<\/code> or <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But <code>.VAR.^name<\/code> gives the type of the <em>container<\/em>, which is <code>Scalar<\/code> in both cases.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>default<\/code> method returns the default value of the container.<\/span> <span class=\"sg\" data-s=\"1\">This is what you get when the container holds no value of its own.<\/span> <span class=\"sg\" data-s=\"2\">You can set it yourself with the <code>is default<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">If yo "Usare <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> è uno pseudo-metodo che restituisce l'oggetto contenitore dietro una variabile.<\/span> <span class=\"sg\" data-s=\"1\">Per una variabile scalare, una chiamata a <code>.VAR<\/code> dà il contenitore <code>Scalar<\/code> che c'è dietro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Con il contenitore, puoi chiedere il nome della sua classe con <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> sulla variabile dà il tipo del <em>valore<\/em>, <code>Int<\/code> o <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>.VAR.^name<\/code> dà il tipo del <em>contenitore<\/em>, che è <code>Scalar<\/code> in entrambi i casi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>default<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>default<\/code> restituisce il valore predefinito del contenitore.<\/span> <span class=\"sg\" data-s=\"1\">È quello che ottieni quando il contenitore non contiene un valore suo.<\/span> <span class=\"sg\" data-s=\"2\">Puoi impostarlo tu stesso con il trait <code>is default<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se non imposti un valore predefinito, il valore predefinito è il tipo del contenitore.<\/span> <span class=\"sg\" data-s=\"1\">Per un contenitore senza tipo, è <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il suo valore attuale non conta:<\/span><\/p>"],["code",0,"<pre clas =\"0\"><code>default<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metode <code>default<\/code> atgriež konteinera noklusējuma vērtību.<\/span> <span class=\"sg\" data-s=\"1\">To jūs saņemat, kad konteineram nav savas vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat to iestatīt paši ar iezīmi <code>is default<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language is default('Raku');\nsay $language.VAR.default; # Raku<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja jūs neiestatāt noklusējuma vērtību, noklusējuma vērtība ir konteinera tips.<\/span> <span class=\"sg\" data-s=\"1\">Konteineram bez tipa tā ir <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā pašreizējai vērtībai nav nozīmes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tipizētam konteineram tā ir ierobežojumā norādītais tips:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>name<\/code> dod konteinera nosaukumu kopā ar tā sigilu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Uzmanieties, lai nesajauktu <code>^name<\/code> un <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais dod tipu, bet otrais dod paša mainīgā nosaukumu.<\/span><\/p>"]]},"ru":{"t":"<code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> — это псевдо-метод, который возвращает объект контейнера, стоящий за переменной.<\/span> <span class=\"sg\" data-s=\"1\">Для скалярной переменной вызов <code>.VAR<\/code> даёт контейнер <code>Scalar<\/code>, которы =\"sg\" data-s=\"2\">Ĝia nuna valoro ne gravas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language = 'Raku';\nsay $language.VAR.default; # (Any)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por tipigita ujo, ĝi estas la tipo en la limigo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $language;\nsay $language.VAR.default; # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>name<\/code> donas la nomon de la ujo, kune kun ĝia sigelo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $language;\nsay $language.VAR.name; # $language<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atentu ne konfuzi <code>^name<\/code> kaj <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La unua donas la tipon, kaj la dua donas la propran nomon de la variablo.<\/span><\/p>"]]},"la":{"t":"Utendo <code>VAR<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>VAR<\/code> est pseudo-methodus quae obiectum receptaculi post variabilem reddit.<\/span> <span class=\"sg\" data-s=\"1\">Pro variabili scalari vocatio <code>.VAR<\/code> receptaculum <code>Scalar<\/code> post eam dat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>^name<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum receptaculo nomen classis eius per <code>.^name<\/code> petere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var1 = 42;\nmy $var2 = '42';\n\nsay $var1.^name;     # Int\nsay $var1.VAR.^name; # Scalar\n\nsay $var2.^name;     # Str\nsay $var2.VAR.^name; # Scalar<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.^name<\/code> in variabili typum <em>valoris<\/em> dat, <code>Int<\/code> vel <code>Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>.VAR.^name<\/code> typum <em>receptaculi<\/em> dat, qui in utroque casu <code>Scalar<\/code>
