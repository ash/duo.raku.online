<script type="application/json" id="page-data">{"u":"advanced/introspection","n":419,"k":"section","pv":"advanced/special-variables/exercises/topic-variable/solution","nx":"advanced/introspection/what","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Introspecting containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspection<\/em> means asking a value or a container about itself.<\/span> <span class=\"sg\" data-s=\"1\">You can ask about its type, the container behind it, or how it works inside.<\/span> <span class=\"sg\" data-s=\"2\">You have already used one introspection tool, <code>.^name<\/code>, which prints the type of a value.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku has a small family of such tools, and their names are in capital letters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code>, and <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">They are sometimes called <em>pseudo-methods<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">This is because the compiler gives them a special meaning.<\/span> <span class=\"sg\" data-s=\"3\">It does not treat them as ordinary methods.<\/span> <span class=\"sg\" data-s=\"4\">This section looks at each of them.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">As a reminder, here is <code>.^name<\/code> again.<\/span> <span class=\"sg\" data-s=\"1\">This container has no type constraint, and we store different values in it.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> shows how its type changes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">At first, the container is <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then it shows the type of whatever value it holds at the moment.<\/span><\/p>"]]},"de":{"t":"Introspektion von Containern","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspektion<\/em> bedeutet, einen Wert oder einen Container nach sich selbst zu fragen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst nach seinem Typ fragen, nach dem Container dahinter oder danach, wie er innen funktioniert.<\/span> <span class=\"sg\" data-s=\"2\">Du hast schon ein Introspektionswerkzeug verwendet, <code>.^name<\/code>, mit dem du den Typ eines Wertes ausgibst.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine kleine Familie solcher Werkzeuge, und ihre Namen sind in Großbuchstaben: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> und <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie werden manchmal <em>Pseudo-Methoden<\/em> genannt.<\/span> <span class=\"sg\" data-s=\"2\">Das liegt daran, dass der Compiler ihnen eine besondere Bedeutung gibt.<\/span> <span class=\"sg\" data-s=\"3\">Er behandelt sie nicht als gewöhnliche Methoden.<\/span> <span class=\"sg\" data-s=\"4\">Dieser Abschnitt schaut sich jedes davon an.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Zur Erinnerung ist hier noch einmal <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Container hat keinen Typ-Constraint, und wir speichern verschiedene Werte darin.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> zeigt, wie sich sein Typ ändert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Am Anfang ist der Container <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dann zeigt er den Typ des Wertes, den er gerade enthält.<\/span><\/p>"]]},"nl":{"t":"Containers introspecteren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectie<\/em> betekent dat je een waarde of een container iets over zichzelf vraagt.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt vragen naar zijn type, naar de container erachter, of naar hoe hij van binnen werkt.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt al één introspectietool gebruikt, <code>.^name<\/code>, die het type van een waarde afdrukt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een kleine familie van zulke tools, en hun namen staan in hoofdletters: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> en <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze worden soms <em>pseudo-methodes<\/em> genoemd.<\/span> <span class=\"sg\" data-s=\"2\">Dat komt doordat de compiler ze een speciale betekenis geeft.<\/span> <span class=\"sg\" data-s=\"3\">Hij behandelt ze niet als gewone methodes.<\/span> <span class=\"sg\" data-s=\"4\">Dit gedeelte bekijkt ze een voor een.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ter herinnering is hier nog een keer <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deze container heeft geen typebeperking, en we bewaren er verschillende waarden in.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> laat zien hoe zijn type verandert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In het begin is de container <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarna toont hij het type van de waarde die hij op dat moment bevat.<\/span><\/p>"]]},"es":{"t":"Introspección de contenedores","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La <em>introspección<\/em> consiste en preguntar a un valor o a un contenedor sobre sí mismo.<\/span> <span class=\"sg\" data-s=\"1\">Puedes preguntar por su tipo, por el contenedor que hay detrás o por cómo funciona por dentro.<\/span> <span class=\"sg\" data-s=\"2\">Ya has usado una herramienta de introspección, <code>.^name<\/code>, que imprime el tipo de un valor.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku tiene una pequeña familia de estas herramientas, y sus nombres están en mayúsculas: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> y <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A veces se les llama <em>pseudo-métodos<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Esto es porque el compilador les da un significado especial.<\/span> <span class=\"sg\" data-s=\"3\">No los trata como métodos normales.<\/span> <span class=\"sg\" data-s=\"4\">Esta sección examina cada uno de ellos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como recordatorio, aquí tienes <code>.^name<\/code> otra vez.<\/span> <span class=\"sg\" data-s=\"1\">Este contenedor no tiene restricción de tipo, y guardamos diferentes valores en él.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> muestra cómo cambia su tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Al principio, el contenedor es <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Luego muestra el tipo del valor que guarda en ese momento.<\/span><\/p>"]]},"it":{"t":"Introspezione dei contenitori","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'<em>introspezione<\/em> significa chiedere a un valore o a un contenitore informazioni su se stesso.<\/span> <span class=\"sg\" data-s=\"1\">Puoi chiedere il suo tipo, quale contenitore c'è dietro o come funziona dentro.<\/span> <span class=\"sg\" data-s=\"2\">Hai già usato uno strumento di introspezione, <code>.^name<\/code>, che stampa il tipo di un valore.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ha una piccola famiglia di strumenti di questo tipo, e i loro nomi sono in lettere maiuscole: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> e <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">A volte vengono chiamati <em>pseudo-metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Questo perché il compilatore dà loro un significato speciale.<\/span> <span class=\"sg\" data-s=\"3\">Non li tratta come metodi normali.<\/span> <span class=\"sg\" data-s=\"4\">Questa sezione li esamina uno per uno.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Come promemoria, ecco di nuovo <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo contenitore non ha un vincolo di tipo, e ci mettiamo dentro valori diversi.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> mostra come cambia il suo tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">All'inizio, il contenitore è <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poi mostra il tipo del valore che contiene in quel momento.<\/span><\/p>"]]},"lv":{"t":"Konteineru introspekcija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekcija<\/em> nozīmē jautāt vērtībai vai konteineram par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat jautāt par tā tipu, par konteineru aiz tā vai par to, kā tas darbojas iekšienē.<\/span> <span class=\"sg\" data-s=\"2\">Jūs jau esat izmantojuši vienu introspekcijas rīku, <code>.^name<\/code>, kas izdrukā vērtības tipu.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ir neliela šādu rīku saime, un to nosaukumi ir rakstīti ar lielajiem burtiem: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> un <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tos dažreiz sauc par <em>pseidometodēm<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tāpēc, ka kompilators tiem dod īpašu nozīmi.<\/span> <span class=\"sg\" data-s=\"3\">Tas neuzskata tos par parastām metodēm.<\/span> <span class=\"sg\" data-s=\"4\">Šī sadaļa aplūko katru no tiem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Atgādinājumam šeit atkal ir <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šim konteineram nav tipa ierobežojuma, un mēs tajā glabājam dažādas vērtības.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> parāda, kā mainās tā tips:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sākumā konteineris ir <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tas rāda tās vērtības tipu, kuru tas pašlaik satur.<\/span><\/p>"]]},"ru":{"t":"Интроспекция с помощью МОП","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> — это когда вы спрашиваете значение или контейнер о нём самом.<\/span> <span class=\"sg\" data-s=\"1\">Можно спросить о его типе, о контейнере за ним или о том, как он работает внутри.<\/span> <span class=\"sg\" data-s=\"2\">Вы уже использовали один инструмент интроспекции, <code>.^name<\/code>, который печатает тип значения.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku есть небольшое семейство таких инструментов, и их имена пишутся заглавными буквами: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Их иногда называют <em>псевдо-методами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Это потому, что компилятор даёт им особый смысл.<\/span> <span class=\"sg\" data-s=\"3\">Он не считает их обычными методами.<\/span> <span class=\"sg\" data-s=\"4\">В этом разделе мы рассмотрим каждый из них.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Для напоминания вот снова <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У этого контейнера нет ограничения типа, и мы сохраняем в нём разные значения.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> показывает, как меняется его тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сначала контейнер — это <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затем он показывает тип того значения, которое в нём сейчас хранится.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція контейнерів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Інтроспекція<\/em> означає, що ви питаєте значення чи контейнер про нього самого.<\/span> <span class=\"sg\" data-s=\"1\">Можна спитати про його тип, про контейнер за ним або про те, як воно працює всередині.<\/span> <span class=\"sg\" data-s=\"2\">Ви вже використовували один інструмент інтроспекції, <code>.^name<\/code>, який виводить тип значення.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">У Raku є невелика родина таких інструментів, і їхні імена написані великими літерами: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> і <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Їх іноді називають <em>псевдометодами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Це тому, що компілятор дає їм особливе значення.<\/span> <span class=\"sg\" data-s=\"3\">Він не вважає їх звичайними методами.<\/span> <span class=\"sg\" data-s=\"4\">Цей розділ розглядає кожен із них.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Для нагадування, ось знову <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Цей контейнер не має обмеження типу, і ми зберігаємо в ньому різні значення.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> показує, як змінюється його тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Спочатку контейнер — це <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім він показує тип того значення, яке містить у цю мить.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Интроспекция<\/em> означава да попитате стойност или контейнер за самия него.<\/span> <span class=\"sg\" data-s=\"1\">Можете да попитате за неговия тип, за контейнера зад него или как работи отвътре.<\/span> <span class=\"sg\" data-s=\"2\">Вече сте използвали един инструмент за интроспекция, <code>.^name<\/code>, който отпечатва типа на стойност.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku има малко семейство от такива инструменти, а имената им са с главни букви: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> и <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Понякога ги наричат <em>псевдо-методи<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Това е така, защото компилаторът им дава специално значение.<\/span> <span class=\"sg\" data-s=\"3\">Той не ги третира като обикновени методи.<\/span> <span class=\"sg\" data-s=\"4\">Този раздел разглежда всеки от тях.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За напомняне, ето отново <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Този контейнер няма ограничение на типа и ние съхраняваме в него различни стойности.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> показва как се променя типът му:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отначало контейнерът е <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това показва типа на стойността, която съдържа в момента.<\/span><\/p>"]]},"eo":{"t":"Introspekto de ujoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspekto<\/em> signifas demandi valoron aŭ ujon pri si mem.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas demandi pri ĝia tipo, pri la ujo malantaŭ ĝi, aŭ pri tio, kiel ĝi funkcias interne.<\/span> <span class=\"sg\" data-s=\"2\">Vi jam uzis unu introspektan ilon, <code>.^name<\/code>, kiu presas la tipon de valoro.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku havas malgrandan familion de tiaj iloj, kaj iliaj nomoj estas en grandaj literoj: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> kaj <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Oni foje nomas ilin <em>pseŭdo-metodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas ĉar la kompililo donas al ili specialan signifon.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne traktas ilin kiel ordinarajn metodojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĉi tiu sekcio rigardas ĉiun el ili.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por rememorigi, jen denove <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu ujo ne havas tiplimigon, kaj ni konservas diversajn valorojn en ĝi.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> montras, kiel ĝia tipo ŝanĝiĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komence la ujo estas <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi montras la tipon de la valoro, kiun ĝi tenas en tiu momento.<\/span><\/p>"]]},"la":{"t":"Introspectio receptaculorum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Introspectio<\/em> significat valorem vel receptaculum de se ipso interrogare.<\/span> <span class=\"sg\" data-s=\"1\">Interrogare potes de typo eius, de receptaculo post eum, vel quomodo intus operetur.<\/span> <span class=\"sg\" data-s=\"2\">Iam uno instrumento introspectionis usus es, <code>.^name<\/code>, quod typum valoris imprimit.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku parvam familiam talium instrumentorum habet, et nomina eorum litteris maiusculis scribuntur: <code>WHAT<\/code>, <code>VAR<\/code>, <code>WHO<\/code> et <code>HOW<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Interdum <em>pseudo-methodi<\/em> vocantur.<\/span> <span class=\"sg\" data-s=\"2\">Causa est quod compilator eis significationem specialem dat.<\/span> <span class=\"sg\" data-s=\"3\">Ea ut methodos ordinarias non tractat.<\/span> <span class=\"sg\" data-s=\"4\">Haec sectio unumquodque eorum inspicit.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ad memoriam, hic iterum est <code>.^name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc receptaculum nullam restrictionem typi habet, et diversos valores in eo condimus.<\/span> <span class=\"sg\" data-s=\"2\"><code>.^name<\/code> ostendit quomodo typus eius mutetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value;\nsay $value.^name; # Any\n\n$value = 42;\nsay $value.^name; # Int\n\n$value = 'forty-two';\nsay $value.^name; # Str<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Primo receptaculum est <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deinde typum cuiuscumque valoris ostendit quem nunc continet.<\/span><\/p>"]]}}}</script>
