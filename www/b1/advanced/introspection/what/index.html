 data-s=\"0\">Ja mainīgajam nav tipa ierobežojuma, sākumā tā tips ir <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kad jūs piešķirat vērtību, gan <code>^name<\/code>, gan <code>WHAT<\/code> rāda tās tipu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ar tipa ierobežojumu tips ir zināms uzreiz, pat pirms jūs kaut ko piešķirat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Tipa objektu salīdzināšana<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> atgriež pašu tipa objektu, tāpēc divus tipa objektus var salīdzināt ar <code>===<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir <em>vērtības identitātes<\/em> operators.<\/span> <span class=\"sg\" data-s=\"2\">Tas pārbauda, vai abas puses ir tieši viena un tā pati vērtība.<\/span> <span class=\"sg\" data-s=\"3\">Katram tipam ir tikai viens tipa objekts.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc šis ir tīrs veids, kā pārbaudīt, vai divām vērtībām ir vienāds tips:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — abi ir Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> salīdzina skaitļus, bet <code>===<\/code> salīdzina identitāti.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tas darbojas tieši ar tipa objektiem un arī ar citām vērtībām.<\/span><\/p>"]]},"ru":{"t":"<code>WHAT<\/code> и <code>^name<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> — это псевдо-метод, который позволяет получить ><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> сравнивает числа, а <code>===<\/code> сравнивает тождество.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому он работает прямо с объектами типов, а также с другими значениями.<\/span><\/p>"]]},"uk":{"t":"Використання <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> — це псевдометод, який дозволяє отримати тип значення.<\/span> <span class=\"sg\" data-s=\"1\">Його можна використовувати майже так само, як <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Обидва виводять тип, але виглядає це трохи по-різному.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^name<\/code> дає лише ім'я, а <code>WHAT<\/code> показує об'єкт типу в дужках:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо змінна не має обмеження типу, спочатку її тип — <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після того як ви присвоїте значення, і <code>^name<\/code>, і <code>WHAT<\/code> показують його тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">З обмеженням типу тип відомий одразу, ще до того, як ви щось присвоїте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Порівняння об'єктів типу<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> повертає сам об'єкт типу, тож два об'єкти типу можна порівняти оператором <code>===<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це оператор <em>тотожності значень<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Він перевіряє, чи обидві сторони є точно тим самим значенням.<\/span> <span class=\"sg\" data-s=\"3\">Кожен тип має лише один об'єкт типу.<\/span> <span class=\"sg\" data-s=\"4\">Тож це чистий спосіб перевірити, чи мають два значення той самий тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — обидва Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> порівнює числа, а <code>===<\/code> порівнює тотожність.<\/span> <span class=\"sg\" data-s=\"1\">Тож він працює прямо з об'єктами типу, а також з іншими значеннями.<\/span><\/p>"]]},"bg":{"t":"Използване на <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> е псевдо-метод, който ви позволява да получите типа на стойност.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го използвате почти по същия начин като <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата отпечатват типа, но изглеждат малко различно.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^name<\/code> дава само името, а <code>WHAT<\/code> показва типовия обект в скоби:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако променливата няма ограничение на типа, отначало типът ѝ е <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След като присвоите стойност, и <code>^name<\/code>, и <code>WHAT<\/code> показват нейния тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">С ограничение на типа типът е известен веднага, дори преди да присвоите нещо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сравняване на типови обекти<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> връща самия типов обект, така че можете да сравните два типови обекта с <code>===<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е операторът за <em>идентичност на стойности<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Той проверява дали двете страни са точно една и съща стойност.<\/span> <span class=\"sg\" data-s=\"3\">Всеки тип има само един типов обект.<\/span> <span class=\"sg\" data-s=\"4\">Така това е чист начин да проверите дали две стойности имат един и същ тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> сравнява числа, а <code>===<\/code> сравнява идентичност.<\/span> <span class=\"sg\" data-s=\"1\">Затова той работи направо с типови обекти, а също и с други стойности.<\/span><\/p>"]]},"eo":{"t":"Uzante <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> estas pseŭdo-metodo, kiu permesas al vi ricevi la tipon de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas uzi ĝin preskaŭ same kiel <code>.^name<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ presas la tipon, sed ili aspektas iomete malsame.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^name<\/code> donas nur la nomon, kaj <code>WHAT<\/code> montras la tip-objekton en krampoj:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se variablo ne havas tiplimigon, ĝia tipo komence estas <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post kiam vi atribuas valoron, <code>^name<\/code> kaj <code>WHAT<\/code> ambaŭ montras ĝian tipon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kun tiplimigo, la tipo estas konata tuj, eĉ antaŭ ol vi atribuas ion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komparado de tip-objektoj<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> redonas la tip-objekton mem, do vi povas kompari du tip-objektojn per <code>===<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la operatoro de <em>valor-identeco<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi kontrolas, ĉu ambaŭ flankoj estas ĝuste la sama valoro.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu tipo havas nur unu tip-objekton.<\/span> <span class=\"sg\" data-s=\"4\">Do tio estas pura maniero kontroli, ĉu du valoroj havas la saman tipon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> komparas nombrojn, sed <code>===<\/code> komparas identecon.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi funkcias rekte kun tip-objektoj, kaj ankaŭ kun aliaj valoroj.<\/span><\/p>"]]},"la":{"t":"Utendo <code>WHAT<\/code>","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> est pseudo-methodus quae tibi typum valoris dat.<\/span> <span class=\"sg\" data-s=\"1\">Eam fere eodem modo quo <code>.^name<\/code> adhibere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\n\nsay $var.^name;\nsay $var.WHAT;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambo typum imprimunt, sed paulum aliter apparent.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^name<\/code> nomen tantum dat, et <code>WHAT<\/code> obiectum typi in parenthesibus ostendit:<\/span><\/p>"],["code",0,"<pre><code>Int\n(Int)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si variabilis nullam restrictionem typi habet, typus eius primo est <code>Any<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Postquam valorem assignas, et <code>^name<\/code> et <code>WHAT<\/code> typum eius ostendunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var;\nsay $var.^name; # Any\nsay $var.WHAT;  # (Any)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum restrictione typi typus statim notus est, etiam antequam quidquam assignas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Str $var;\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)\n\n$var = 'Hello';\nsay $var.^name; # Str\nsay $var.WHAT;  # (Str)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparatio obiectorum typi<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>WHAT<\/code> ipsum obiectum typi reddit, itaque duo obiecta typi cum <code>===<\/code> comparare potes.<\/span> <span class=\"sg\" data-s=\"1\">Hic est operator <em>identitatis valoris<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Probat an ambo latera prorsus idem valor sint.<\/span> <span class=\"sg\" data-s=\"3\">Quisque typus unum tantum obiectum typi habet.<\/span> <span class=\"sg\" data-s=\"4\">Itaque hic est modus purus probandi an duo valores eundem typum habeant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = 42;\nmy $b = 100;\n\nsay $a.WHAT === $b.WHAT; # True  — both are Int\nsay $a.WHAT === Int;     # True\nsay $a.WHAT === Str;     # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>==<\/code> numeros comparat, sed <code>===<\/code> identitatem comparat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque directe cum obiectis typi operatur, et etiam cum aliis valoribus.<\/span><\/p>"]]}}}</script>
