<script type="application/json" id="page-data">{"u":"advanced/quoting/exercises/a-heredoc/solution","n":477,"k":"solution","pv":"advanced/quoting/exercises/a-heredoc","nx":"advanced/date-and-time","tr":["advanced","advanced/quoting"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A heredoc‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The heredoc starts with <code>qq:to<\/code> instead of <code>q:to<\/code>, so it interpolates. Like a <code>qq<\/code> string, it fills in the scalars <code>$name<\/code>, <code>$count<\/code> and <code>$item<\/code>. It <em>also<\/em> runs code inside the text: the block <code>{$count * $price}<\/code> calculates <code>3 * 25<\/code>. So the total, <code>75<\/code>, appears right in the text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The double quotes around <code>\"$item\"<\/code> are just normal characters here. Inside a heredoc, there is no delimiter that needs escaping. So the quotes are printed as written, while <code>$item<\/code> is still interpolated.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body and the closing <code>END<\/code> have the same indentation of four spaces. The indentation of the terminator is removed from every line. So those four spaces never get into the string. The output starts at the left edge.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The heredoc already ends with a newline. So the code uses <code>print<\/code> instead of <code>say<\/code>. With <code>say<\/code>, you would get a second newline and an extra empty line.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc beginnt mit <code>qq:to<\/code> statt mit <code>q:to<\/code>, deshalb interpoliert es den Text. Wie ein <code>qq<\/code>-String setzt es die Skalare <code>$name<\/code>, <code>$count<\/code> und <code>$item<\/code> ein. Es führt <em>auch<\/em> Code im Text aus: Der Block <code>{$count * $price}<\/code> berechnet <code>3 * 25<\/code>. Deshalb erscheint die Gesamtsumme, <code>75<\/code>, direkt im Text.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die doppelten Anführungszeichen um <code>\"$item\"<\/code> sind hier nur normale Zeichen. In einem Heredoc gibt es kein Trennzeichen, das man escapen muss. Deshalb werden die Anführungszeichen so ausgegeben, wie sie geschrieben sind, während <code>$item<\/code> trotzdem interpoliert wird.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf und das schließende <code>END<\/code> haben dieselbe Einrückung von vier Leerzeichen. Die Einrückung des Abschlussworts wird aus jeder Zeile entfernt. Deshalb kommen diese vier Leerzeichen nie in den String. Die Ausgabe beginnt am linken Rand.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Heredoc endet bereits mit einem Zeilenumbruch. Deshalb benutzt der Code <code>print<\/code> statt <code>say<\/code>. Mit <code>say<\/code> würdest du einen zweiten Zeilenumbruch und eine zusätzliche Leerzeile bekommen.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Een heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc begint met <code>qq:to<\/code> in plaats van <code>q:to<\/code>, dus hij interpoleert. Net als een <code>qq<\/code>-string vult hij de scalars <code>$name<\/code>, <code>$count<\/code> en <code>$item<\/code> in. Hij voert <em>ook<\/em> code in de tekst uit: het blok <code>{$count * $price}<\/code> berekent <code>3 * 25<\/code>. Daarom staat het totaal, <code>75<\/code>, meteen in de tekst.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De dubbele aanhalingstekens rond <code>\"$item\"<\/code> zijn hier gewoon normale tekens. In een heredoc is er geen scheidingsteken dat je moet escapen. Daarom worden de aanhalingstekens afgedrukt zoals ze er staan, terwijl <code>$item<\/code> toch wordt geïnterpoleerd.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De inhoud en het afsluitende <code>END<\/code> hebben dezelfde inspringing van vier spaties. De inspringing van het afsluitwoord wordt van elke regel verwijderd. Daarom komen die vier spaties nooit in de string. De uitvoer begint aan de linkerkant.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De heredoc eindigt al met een nieuwe regel. Daarom gebruikt de code <code>print<\/code> in plaats van <code>say<\/code>. Met <code>say<\/code> zou je een tweede nieuwe regel krijgen, en dus een extra lege regel.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc empieza con <code>qq:to<\/code> en lugar de <code>q:to<\/code>, así que interpola. Como una cadena <code>qq<\/code>, rellena los escalares <code>$name<\/code>, <code>$count<\/code> y <code>$item<\/code>. <em>También<\/em> ejecuta código dentro del texto: el bloque <code>{$count * $price}<\/code> calcula <code>3 * 25<\/code>. Así que el total, <code>75<\/code>, aparece directamente en el texto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las comillas dobles alrededor de <code>\"$item\"<\/code> son solo caracteres normales aquí. Dentro de un heredoc, no hay ningún delimitador que haya que escapar. Así que las comillas se imprimen tal como están escritas, mientras que <code>$item<\/code> se sigue interpolando.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo y el <code>END<\/code> de cierre tienen la misma indentación de cuatro espacios. La indentación del terminador se elimina de cada línea. Así que esos cuatro espacios nunca llegan a la cadena. La salida empieza en el borde izquierdo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El heredoc ya termina con un salto de línea. Por eso el código usa <code>print<\/code> en lugar de <code>say<\/code>. Con <code>say<\/code>, tendrías un segundo salto de línea y una línea vacía de más.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc inizia con <code>qq:to<\/code> invece che con <code>q:to<\/code>, quindi interpola. Come una stringa <code>qq<\/code>, inserisce gli scalari <code>$name<\/code>, <code>$count<\/code> e <code>$item<\/code>. Esegue <em>anche<\/em> il codice dentro il testo: il blocco <code>{$count * $price}<\/code> calcola <code>3 * 25<\/code>. Così il totale, <code>75<\/code>, appare direttamente nel testo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Qui le virgolette doppie intorno a <code>\"$item\"<\/code> sono solo caratteri normali. Dentro un heredoc non c'è nessun delimitatore che ha bisogno di escape. Quindi le virgolette vengono stampate come sono scritte, mentre <code>$item<\/code> viene comunque interpolato.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo e il terminatore di chiusura <code>END<\/code> hanno la stessa indentazione di quattro spazi. L'indentazione del terminatore viene tolta da ogni riga. Quindi quei quattro spazi non entrano mai nella stringa. L'output inizia dal bordo sinistro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'heredoc finisce già con un carattere di nuova riga. Quindi il codice usa <code>print<\/code> invece di <code>say<\/code>. Con <code>say<\/code> avresti un secondo carattere di nuova riga e una riga vuota in più.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc sākas ar <code>qq:to<\/code>, nevis <code>q:to<\/code>, tāpēc tas interpolē. Tāpat kā <code>qq<\/code> virkne, tas ievieto skalāru <code>$name<\/code>, <code>$count<\/code> un <code>$item<\/code> vērtības. Tas <em>arī<\/em> izpilda kodu teksta iekšienē: bloks <code>{$count * $price}<\/code> aprēķina <code>3 * 25<\/code>. Tāpēc kopsumma, <code>75<\/code>, parādās tieši tekstā.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dubultpēdiņas ap <code>\"$item\"<\/code> šeit ir tikai parastas rakstzīmes. Heredoc iekšienē nav norobežotāja, ko vajadzētu aizbēgt. Tāpēc pēdiņas tiek izdrukātas tā, kā uzrakstītas, bet <code>$item<\/code> joprojām tiek interpolēts.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Pamattekstam un aizverošajam <code>END<\/code> ir vienāda četru atstarpju atkāpe. Terminatora atkāpe tiek noņemta no katras rindas. Tāpēc šīs četras atstarpes nekad nenonāk virknē. Izvade sākas pie kreisās malas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc jau beidzas ar jaunrindu. Tāpēc kods izmanto <code>print<\/code>, nevis <code>say<\/code>. Ar <code>say<\/code> jūs iegūtu otru jaunrindu un lieku tukšu rindu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc начинается с <code>qq:to<\/code>, а не с <code>q:to<\/code>, поэтому он интерполирует. Как и строка <code>qq<\/code>, он подставляет скаляры <code>$name<\/code>, <code>$count<\/code> и <code>$item<\/code>. Он <em>также<\/em> выполняет код внутри текста: блок <code>{$count * $price}<\/code> вычисляет <code>3 * 25<\/code>. Поэтому итоговая сумма, <code>75<\/code>, появляется прямо в тексте.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Двойные кавычки вокруг <code>\"$item\"<\/code> здесь — просто обычные символы. Внутри heredoc'а нет разделителя, который нужно экранировать. Поэтому кавычки выводятся так, как написаны, а <code>$item<\/code> всё равно интерполируется.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У тела и у закрывающего <code>END<\/code> одинаковый отступ в четыре пробела. Отступ терминатора удаляется из каждой строки. Поэтому эти четыре пробела никогда не попадают в строку. Вывод начинается у левого края.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже заканчивается переводом строки. Поэтому в коде используется <code>print<\/code>, а не <code>say<\/code>. С <code>say<\/code> вы бы получили второй перевод строки и лишнюю пустую строку.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc починається з <code>qq:to<\/code> замість <code>q:to<\/code>, тож він інтерполює. Як і рядок <code>qq<\/code>, він підставляє скаляри <code>$name<\/code>, <code>$count<\/code> і <code>$item<\/code>. Він <em>також<\/em> виконує код усередині тексту: блок <code>{$count * $price}<\/code> обчислює <code>3 * 25<\/code>. Тож сума, <code>75<\/code>, з'являється просто в тексті.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Подвійні лапки навколо <code>\"$item\"<\/code> тут — просто звичайні символи. Усередині heredoc-а немає роздільника, який треба екранувати. Тож лапки виводяться як записано, а <code>$item<\/code> усе одно інтерполюється.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло й закривальне <code>END<\/code> мають однаковий відступ у чотири пробіли. Відступ термінатора прибирається з кожного рядка. Тож ці чотири пробіли ніколи не потрапляють у рядок. Вивід починається з лівого краю.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc уже закінчується переходом рядка. Тому код використовує <code>print<\/code> замість <code>say<\/code>. Із <code>say<\/code> ви отримали б другий перехід рядка і зайвий порожній рядок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът започва с <code>qq:to<\/code> вместо с <code>q:to<\/code>, затова интерполира. Подобно на низ с <code>qq<\/code>, той попълва скаларите <code>$name<\/code>, <code>$count<\/code> и <code>$item<\/code>. Той <em>също<\/em> изпълнява код в текста: блокът <code>{$count * $price}<\/code> изчислява <code>3 * 25<\/code>. Така общата сума, <code>75<\/code>, се появява направо в текста.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Двойните кавички около <code>\"$item\"<\/code> тук са просто обикновени символи. Вътре в heredoc няма разделител, който трябва да се екранира. Затова кавичките се отпечатват както са написани, а <code>$item<\/code> все пак се интерполира.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото и затварящият <code>END<\/code> имат еднакъв отстъп от четири интервала. Отстъпът на терминатора се премахва от всеки ред. Затова тези четири интервала никога не попадат в низа. Изходът започва от левия край.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc-ът вече завършва с нов ред. Затова кодът използва <code>print<\/code> вместо <code>say<\/code>. Със <code>say<\/code> бихте получили втори нов ред и излишен празен ред.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Heredoko","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc komenciĝas per <code>qq:to<\/code> anstataŭ <code>q:to<\/code>, do ĝi interpolas. Kiel <code>qq<\/code>-ĉeno, ĝi enmetas la skalarojn <code>$name<\/code>, <code>$count<\/code> kaj <code>$item<\/code>. Ĝi <em>ankaŭ<\/em> rulas kodon ene de la teksto: la bloko <code>{$count * $price}<\/code> kalkulas <code>3 * 25<\/code>. Do la totalo, <code>75<\/code>, aperas rekte en la teksto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La duoblaj citiloj ĉirkaŭ <code>\"$item\"<\/code> estas nur normalaj signoj ĉi tie. Ene de heredoc ne estas limigilo, kiun oni devas eskapi. Do la citiloj estas presitaj kiel skribitaj, dum <code>$item<\/code> tamen estas interpolita.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La korpo kaj la ferma <code>END<\/code> havas la saman krommarĝenon de kvar spacetoj. La krommarĝeno de la finilo estas forigita el ĉiu linio. Do tiuj kvar spacetoj neniam eniras la ĉenon. La eligo komenciĝas ĉe la maldekstra rando.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La heredoc jam finiĝas per novlinio. Do la kodo uzas <code>print<\/code> anstataŭ <code>say<\/code>. Kun <code>say<\/code>, vi ricevus duan novlinion kaj kroman malplenan linion.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Heredoc","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $name  = 'Anna';\nmy $item  = 'Raku Book';\nmy $price = 25;\nmy $count = 3;\n\nprint qq:to/END/;\n    Dear $name,\n    You ordered $count copies of \"$item\".\n    That comes to {$count * $price} dollars.\n    Thank you!\n    END<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/a-heredoc.raku\" target=\"_blank\" rel=\"noopener\">a-heredoc.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc cum <code>qq:to<\/code> incipit, non cum <code>q:to<\/code>, itaque interpolat. Sicut series <code>qq<\/code>, scalares <code>$name<\/code>, <code>$count<\/code> et <code>$item<\/code> implet. <em>Etiam<\/em> codicem intra textum exsequitur: claustrum <code>{$count * $price}<\/code> computat <code>3 * 25<\/code>. Itaque summa, <code>75<\/code>, directe in textu apparet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Apostrophi duplices circa <code>\"$item\"<\/code> hic solum characteres normales sunt. Intra heredoc nullus delimitator est quem effugere debes. Itaque apostrophi ut scripti sunt imprimuntur, dum <code>$item<\/code> tamen interpolatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus et <code>END<\/code> claudens eandem indentationem quattuor spatiorum habent. Indentatio terminatoris ab omni linea removetur. Itaque illa quattuor spatia numquam in seriem perveniunt. Eventus a margine sinistro incipit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Heredoc iam cum fine lineae desinit. Itaque codex <code>print<\/code> adhibet, non <code>say<\/code>. Cum <code>say<\/code> alterum finem lineae et lineam vacuam additam acciperes.<\/span><\/li><\/ol>"]]}}}</script>
