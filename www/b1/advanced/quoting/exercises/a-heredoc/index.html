n> <span class=\"sg\" data-s=\"1\">Вирівняйте закривальний термінатор із текстом.<\/span> <span class=\"sg\" data-s=\"2\">Тоді відступ не з'явиться у виводі.<\/span> <span class=\"sg\" data-s=\"3\">Виведіть результат.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Візьміть <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> і <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді програма виводить таке, без пробілів на початку:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Heredoc","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Използвайте <em>интерполиращ<\/em> heredoc, за да съставите писмо, което потвърждава поръчка.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте няколко променливи: клиент <code>$name<\/code>, артикул <code>$item<\/code>, цена <code>$price<\/code> и брой <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Цената е за един артикул.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc-ът трябва да интерполира променливите.<\/span> <span class=\"sg\" data-s=\"4\">Той трябва <em>също<\/em> да изчисли общата сума в текста с вграден блок <code>{ … }<\/code> (<code>$count * $price<\/code>).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Отместете тялото на heredoc-а, за да съвпада с кода около него.<\/span> <span class=\"sg\" data-s=\"1\">Подравнете затварящия терминатор с текста.<\/span> <span class=\"sg\" data-s=\"2\">Тогава отстъпът не се появява в изхода.<\/span> <span class=\"sg\" data-s=\"3\">Отпечатайте резултата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вземете <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> и <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тогава програмата отпечатва следното, без интервали в началото:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Heredoko","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Uzu <em>interpolantan<\/em> heredoc-on por konstrui leteron, kiu konfirmas mendon.<\/span> <span class=\"sg\" data-s=\"1\">Uzu kelkajn variablojn: kliento <code>$name<\/code>, <code>$item<\/code>, <code>$price<\/code> kaj <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La prezo estas por unu varo.<\/span> <span class=\"sg\" data-s=\"3\">La heredoc devas interpoli la variablojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi <em>ankaŭ<\/em> devas kalkuli la totalon en la teksto, per enmetita <code>{ … }<\/code>-bloko (<code>$count * $price<\/code>).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Krommarĝenigu la korpon de la heredoc, por ke ĝi kongruu kun la kodo ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Vicigu la fermilon kun la teksto.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la krommarĝeno ne aperas en la eligo.<\/span> <span class=\"sg\" data-s=\"3\">Presu la rezulton.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prenu <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> kaj <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiam la programo presas la jenon, sen spacetoj komence:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Heredoc","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Heredoc <em>interpolans<\/em> adhibe ut epistulam aedifices quae emptionem confirmat.<\/span> <span class=\"sg\" data-s=\"1\">Paucas variabiles adhibe: emptorem <code>$name<\/code>, rem <code>$item<\/code>, pretium <code>$price<\/code> et numerum <code>$count<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pretium est pro una re.<\/span> <span class=\"sg\" data-s=\"3\">Heredoc variabiles interpolare debet.<\/span> <span class=\"sg\" data-s=\"4\"><em>Etiam<\/em> summam in textu computare debet, cum claustro inserto <code>{ … }<\/code> (<code>$count * $price<\/code>).<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Corpus heredoc indenta ut cum codice circa id congruat.<\/span> <span class=\"sg\" data-s=\"1\">Terminatorem claudentem cum textu congruere fac.<\/span> <span class=\"sg\" data-s=\"2\">Tum indentatio in output non apparet.<\/span> <span class=\"sg\" data-s=\"3\">Eventum imprime.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sume <code>$name = 'Anna'<\/code>, <code>$item = 'Raku Book'<\/code>, <code>$price = 25<\/code> et <code>$count = 3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum programma haec imprimit, sine spatiis in initio:<\/span><\/p>"],["code",0,"<pre><code>Dear Anna,\nYou ordered 3 copies of \"Raku Book\".\nThat comes to 75 dollars.\nThank you!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/quoting/exercises/a-heredoc/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
