<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Форма <code>q<\/code> зазвичай лишає весь текст без змін. Наріччя <code>:c<\/code> (closure) вмикає в ній інтерполяцію коду <code>{ … }<\/code>. Усередині фігурних дужок <code>$x<\/code> — справжній код, тож <code>{$x ** 2}<\/code> дає <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> поза фігурними дужками лишається точно таким, як записано. Це тому, що наріччя скалярів <code>:s<\/code> <em>не<\/em> ввімкнено. У цьому весь сенс окремого наріччя для кожної можливості. Ви отримуєте код у рядку, але не вмикаєте заодно інтерполяцію <code>$<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Наріччя можна поєднувати. Якщо додати ще й <code>:s<\/code>, перший <code>$x<\/code> теж інтерполюється. Тепер обидві можливості ввімкнені одночасно:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"bg":{"t":"Solution: Closure в q низ","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Формата <code>q<\/code> обикновено оставя целия текст без промяна. Наречието <code>:c<\/code> (closure — затваряне) включва в нея интерполирането на код <code>{ … }<\/code>. Във фигурните скоби <code>$x<\/code> е истински код, затова <code>{$x ** 2}<\/code> дава <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> извън фигурните скоби остава точно както е написано. Това е така, защото скаларното наречие <code>:s<\/code> <em>не<\/em> е включено. В това е целият смисъл да има отделно наречие за всяка функция. Получавате код в низа, без да включвате и <code>$<\/code>-интерполиране.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Можете да комбинирате наречия. Ако добавите и <code>:s<\/code>, първото <code>$x<\/code> също ще се интерполира. Сега и двете функции са включени едновременно:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"eo":{"t":"Solvo: Fermilo en q-ĉeno","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>q<\/code>-formo kutime tenas la tutan tekston sen ŝanĝo. La adverbo <code>:c<\/code> (fermo) ŝaltas interpoladon de <code>{ … }<\/code>-kodo en ĝi. Ene de la krampoj, <code>$x<\/code> estas vera kodo, do <code>{$x ** 2}<\/code> donas <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La <code>$x<\/code> ekster la krampoj restas ĝuste kiel skribita. Tio estas, ĉar la skalara adverbo <code>:s<\/code> <em>ne<\/em> estas ŝaltita. Ĝuste por tio ekzistas aparta adverbo por ĉiu funkcio. Vi ricevas kodon en la ĉeno, sen ankaŭ ŝalti <code>$<\/code>-interpoladon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi povas kombini adverbojn. Se vi aldonas ankaŭ <code>:s<\/code>, la unua <code>$x<\/code> ankaŭ estas interpolita. Nun ambaŭ funkcioj estas ŝaltitaj samtempe:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]},"la":{"t":"Solutio: Clausura in q catena","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c/$x squared is {$x ** 2}/;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/quoting/closure-quote.raku\" target=\"_blank\" rel=\"noopener\">closure-quote.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>$x squared is 100<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Forma <code>q<\/code> plerumque totum textum ut est servat. Adverbium <code>:c<\/code> (clausura) interpolationem codicis <code>{ … }<\/code> intra eam accendit. Intra uncos <code>$x<\/code> verus codex est, itaque <code>{$x ** 2}<\/code> dat <code>100<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$x<\/code> extra uncos exacte ut scriptum est manet. Hoc fit quia adverbium scalare <code>:s<\/code> <em>non<\/em> accensum est. Ideo pro quaque proprietate unum adverbium habemus. Codicem in serie accipis, neque etiam interpolationem <code>$<\/code> accendis.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Adverbia coniungere potes. Si etiam <code>:s<\/code> addis, primum <code>$x<\/code> quoque interpolatur. Nunc ambae proprietates simul accensae sunt:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 10;\nsay q:c:s/$x squared is {$x ** 2}/; # 10 squared is 100<\/code><\/pre>"]]}}}</script>
