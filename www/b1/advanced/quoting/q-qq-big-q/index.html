<script type="application/json" id="page-data">{"u":"advanced/quoting/q-qq-big-q","n":466,"k":"topic","pv":"advanced/quoting","nx":"advanced/quoting/q-qq-big-q/quiz","tr":["advanced","advanced/quoting"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"q, qq, and Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">There are three base quoting operators.<\/span> <span class=\"sg\" data-s=\"1\">The difference is how much they process the text inside them:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — like single quotes: almost everything stays as it is<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — like double quotes: variables and escapes are interpolated<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — the most literal of all: <strong>nothing<\/strong> is processed<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Each of them takes the text between a pair of delimiters.<\/span> <span class=\"sg\" data-s=\"1\">The well-known <code>'…'<\/code> is just a short way to write <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">In the same way, <code>\"…\"<\/code> is short for <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> leaves <code>$name<\/code> as it is, but <code>qq<\/code> interpolates it.<\/span> <span class=\"sg\" data-s=\"1\">Backslash escapes such as <code>\\n<\/code> work in the same way.<\/span> <span class=\"sg\" data-s=\"2\">Only <code>qq<\/code> (and <code>\"…\"<\/code>) turns <code>\\n<\/code> into a real newline.<\/span> <span class=\"sg\" data-s=\"3\">Both <code>q<\/code> and <code>Q<\/code> leave it as two characters, <code>\\<\/code> and <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">So how are <code>q<\/code> and <code>Q<\/code> different?<\/span> <span class=\"sg\" data-s=\"1\">Like single quotes, <code>q<\/code> still handles a <em>small<\/em> set of escapes.<\/span> <span class=\"sg\" data-s=\"2\">A doubled backslash <code>\\\\<\/code> becomes one, and you can escape the closing delimiter.<\/span> <span class=\"sg\" data-s=\"3\">The plain <code>Q<\/code> form, however, processes <strong>nothing<\/strong> at all:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You can use any delimiters, such as <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> or <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is useful when the text itself contains quotes.<\/span> <span class=\"sg\" data-s=\"2\">The three operators are the base.<\/span> <span class=\"sg\" data-s=\"3\">The next topic shows how <a href=\"/advanced/quoting/adverbs/\"><em>adverbs<\/em><\/a> let you choose exactly which features are on.<\/span><\/p>"]]},"de":{"t":"q, qq und Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Es gibt drei grundlegende Quoting-Operatoren.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied ist, wie viel sie den Text in ihnen verarbeiten:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — wie einfache Anführungszeichen: fast alles bleibt, wie es ist<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — wie doppelte Anführungszeichen: Variablen und Escape-Sequenzen werden interpoliert<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — die wörtlichste Form von allen: <strong>nichts<\/strong> wird verarbeitet<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jeder von ihnen nimmt den Text zwischen einem Paar von Trennzeichen.<\/span> <span class=\"sg\" data-s=\"1\">Das bekannte <code>'…'<\/code> ist nur eine kurze Schreibweise für <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Genauso ist <code>\"…\"<\/code> die Kurzform für <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> lässt <code>$name<\/code>, wie es ist, aber <code>qq<\/code> interpoliert die Variable.<\/span> <span class=\"sg\" data-s=\"1\">Backslash-Escape-Sequenzen wie <code>\\n<\/code> funktionieren genauso.<\/span> <span class=\"sg\" data-s=\"2\">Nur <code>qq<\/code> (und <code>\"…\"<\/code>) macht aus <code>\\n<\/code> einen echten Zeilenumbruch.<\/span> <span class=\"sg\" data-s=\"3\">Sowohl <code>q<\/code> als auch <code>Q<\/code> lassen es als zwei Zeichen stehen, <code>\\<\/code> und <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wie unterscheiden sich also <code>q<\/code> und <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Wie einfache Anführungszeichen verarbeitet <code>q<\/code> noch eine <em>kleine<\/em> Menge von Escape-Sequenzen.<\/span> <span class=\"sg\" data-s=\"2\">Ein verdoppelter Backslash <code>\\\\<\/code> wird zu einem, und du kannst das schließende Trennzeichen escapen.<\/span> <span class=\"sg\" data-s=\"3\">Die einfache <code>Q<\/code>-Form verarbeitet dagegen <strong>gar nichts<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kannst beliebige Trennzeichen benutzen, zum Beispiel <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> oder <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist praktisch, wenn der Text selbst Anführungszeichen enthält.<\/span> <span class=\"sg\" data-s=\"2\">Die drei Operatoren sind die Grundlage.<\/span> <span class=\"sg\" data-s=\"3\">Das nächste Thema zeigt, wie du mit <a href=\"https://course.raku.org/de/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>Adverbien<\/em><\/a> genau wählen kannst, welche Funktionen eingeschaltet sind.<\/span><\/p>"]]},"nl":{"t":"q, qq en Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Er zijn drie basis-quotingoperatoren.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil is hoeveel ze de tekst erin verwerken:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — als enkele aanhalingstekens: bijna alles blijft zoals het is<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — als dubbele aanhalingstekens: variabelen en escapes worden geïnterpoleerd<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — de meest letterlijke van allemaal: <strong>niets<\/strong> wordt verwerkt<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk ervan neemt de tekst tussen twee scheidingstekens.<\/span> <span class=\"sg\" data-s=\"1\">Het bekende <code>'…'<\/code> is gewoon een korte manier om <code>q<\/code> te schrijven.<\/span> <span class=\"sg\" data-s=\"2\">Op dezelfde manier is <code>\"…\"<\/code> kort voor <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> laat <code>$name<\/code> zoals het is, maar <code>qq<\/code> interpoleert het.<\/span> <span class=\"sg\" data-s=\"1\">Backslash-escapes zoals <code>\\n<\/code> werken op dezelfde manier.<\/span> <span class=\"sg\" data-s=\"2\">Alleen <code>qq<\/code> (en <code>\"…\"<\/code>) maakt van <code>\\n<\/code> een echte nieuwe regel.<\/span> <span class=\"sg\" data-s=\"3\">Zowel <code>q<\/code> als <code>Q<\/code> laten het staan als twee tekens, <code>\\<\/code> en <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Waarin verschillen <code>q<\/code> en <code>Q<\/code> dan?<\/span> <span class=\"sg\" data-s=\"1\">Net als enkele aanhalingstekens verwerkt <code>q<\/code> nog steeds een <em>klein<\/em> aantal escapes.<\/span> <span class=\"sg\" data-s=\"2\">Een dubbele backslash <code>\\\\<\/code> wordt er één, en je kunt het afsluitende scheidingsteken escapen.<\/span> <span class=\"sg\" data-s=\"3\">De gewone <code>Q<\/code>-vorm verwerkt echter helemaal <strong>niets<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q klapt de ge-escapete backslash samen\nsay Q{a\\\\b}; # a\\\\b  — Q behoudt beide tekens<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt elk scheidingsteken gebruiken, zoals <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> of <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is handig als de tekst zelf aanhalingstekens bevat.<\/span> <span class=\"sg\" data-s=\"2\">De drie operatoren zijn de basis.<\/span> <span class=\"sg\" data-s=\"3\">Het volgende onderwerp laat zien hoe je met <a href=\"https://course.raku.org/nl/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>bijwoorden<\/em><\/a> precies kiest welke functies aan staan.<\/span><\/p>"]]},"es":{"t":"q, qq y Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hay tres operadores base de entrecomillado.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia está en cuánto procesan el texto que tienen dentro:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — como las comillas simples: casi todo queda tal como está<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — como las comillas dobles: las variables y las secuencias de escape se interpolan<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — la forma más literal de todas: no se procesa <strong>nada<\/strong><\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada uno toma el texto entre un par de delimitadores.<\/span> <span class=\"sg\" data-s=\"1\">Las conocidas <code>'…'<\/code> son solo una forma corta de escribir <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Del mismo modo, <code>\"…\"<\/code> es una forma corta de <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> deja <code>$name<\/code> tal como está, pero <code>qq<\/code> lo interpola.<\/span> <span class=\"sg\" data-s=\"1\">Las secuencias de escape con barra invertida como <code>\\n<\/code> funcionan de la misma manera.<\/span> <span class=\"sg\" data-s=\"2\">Solo <code>qq<\/code> (y <code>\"…\"<\/code>) convierte <code>\\n<\/code> en un salto de línea real.<\/span> <span class=\"sg\" data-s=\"3\">Tanto <code>q<\/code> como <code>Q<\/code> lo dejan como dos caracteres, <code>\\<\/code> y <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Entonces, ¿en qué se diferencian <code>q<\/code> y <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Como las comillas simples, <code>q<\/code> todavía procesa un <em>pequeño<\/em> conjunto de secuencias de escape.<\/span> <span class=\"sg\" data-s=\"2\">Una barra invertida doble <code>\\\\<\/code> se convierte en una, y puedes escapar el delimitador de cierre.<\/span> <span class=\"sg\" data-s=\"3\">En cambio, la forma <code>Q<\/code> simple no procesa <strong>nada<\/strong> en absoluto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes usar cualquier delimitador, como <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> o <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil cuando el propio texto contiene comillas.<\/span> <span class=\"sg\" data-s=\"2\">Los tres operadores son la base.<\/span> <span class=\"sg\" data-s=\"3\">El siguiente tema muestra cómo los <a href=\"https://course.raku.org/es/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbios<\/em><\/a> te dejan elegir exactamente qué características están activadas.<\/span><\/p>"]]},"it":{"t":"q, qq e Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ci sono tre operatori di quoting base.<\/span> <span class=\"sg\" data-s=\"1\">La differenza è quanto elaborano il testo al loro interno:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — come le virgolette singole: quasi tutto resta così com'è<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — come le virgolette doppie: variabili e sequenze di escape vengono interpolate<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — il più letterale di tutti: <strong>niente<\/strong> viene elaborato<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ognuno prende il testo tra una coppia di delimitatori.<\/span> <span class=\"sg\" data-s=\"1\">Il noto <code>'…'<\/code> è solo un modo breve per scrivere <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Allo stesso modo, <code>\"…\"<\/code> è la forma breve di <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> lascia <code>$name<\/code> così com'è, ma <code>qq<\/code> lo interpola.<\/span> <span class=\"sg\" data-s=\"1\">Le sequenze di escape con backslash come <code>\\n<\/code> funzionano allo stesso modo.<\/span> <span class=\"sg\" data-s=\"2\">Solo <code>qq<\/code> (e <code>\"…\"<\/code>) trasforma <code>\\n<\/code> in un vero carattere di nuova riga.<\/span> <span class=\"sg\" data-s=\"3\">Sia <code>q<\/code> che <code>Q<\/code> lo lasciano come due caratteri, <code>\\<\/code> e <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Allora in cosa sono diversi <code>q<\/code> e <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Come le virgolette singole, <code>q<\/code> gestisce ancora un <em>piccolo<\/em> gruppo di sequenze di escape.<\/span> <span class=\"sg\" data-s=\"2\">Un doppio backslash <code>\\\\<\/code> diventa uno solo, e puoi fare l'escape del delimitatore di chiusura.<\/span> <span class=\"sg\" data-s=\"3\">La semplice forma <code>Q<\/code>, invece, non elabora proprio <strong>niente<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi usare qualsiasi delimitatore, come <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> o <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo è comodo quando il testo stesso contiene virgolette.<\/span> <span class=\"sg\" data-s=\"2\">I tre operatori sono la base.<\/span> <span class=\"sg\" data-s=\"3\">Il prossimo argomento mostra come gli <a href=\"https://course.raku.org/it/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>avverbi<\/em><\/a> ti permettono di scegliere esattamente quali funzionalità sono attive.<\/span><\/p>"]]},"lv":{"t":"q, qq un Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ir trīs bāzes citēšanas operatori.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir tajā, cik daudz tie apstrādā tekstu savā iekšienē:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — kā vienpēdiņas: gandrīz viss paliek tāds, kāds ir<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — kā dubultpēdiņas: mainīgie un aizbēgšanas secības tiek interpolēti<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — visburtiskākais no visiem: <strong>nekas<\/strong> netiek apstrādāts<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrs no tiem ņem tekstu starp norobežotāju pāri.<\/span> <span class=\"sg\" data-s=\"1\">Labi zināmais <code>'…'<\/code> ir tikai īss veids, kā uzrakstīt <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpat <code>\"…\"<\/code> ir <code>qq<\/code> īsais pieraksts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> atstāj <code>$name<\/code> tādu, kāds tas ir, bet <code>qq<\/code> to interpolē.<\/span> <span class=\"sg\" data-s=\"1\">Atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code>, darbojas tāpat.<\/span> <span class=\"sg\" data-s=\"2\">Tikai <code>qq<\/code> (un <code>\"…\"<\/code>) pārvērš <code>\\n<\/code> par īstu jaunrindu.<\/span> <span class=\"sg\" data-s=\"3\">Gan <code>q<\/code>, gan <code>Q<\/code> to atstāj kā divas rakstzīmes, <code>\\<\/code> un <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tad ar ko atšķiras <code>q<\/code> un <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā vienpēdiņas, <code>q<\/code> tomēr apstrādā <em>nelielu<\/em> aizbēgšanas secību kopu.<\/span> <span class=\"sg\" data-s=\"2\">Dubultota atpakaļsvītra <code>\\\\<\/code> kļūst par vienu, un jūs varat aizbēgt aizverošo norobežotāju.<\/span> <span class=\"sg\" data-s=\"3\">Turpretī vienkāršā <code>Q<\/code> forma neapstrādā pilnīgi <strong>neko<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q saspiež aizēto atpakaļsvītru\nsay Q{a\\\\b}; # a\\\\b  — Q saglabā abas rakstzīmes<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izmantot jebkurus norobežotājus, piemēram, <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> vai <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir noderīgi, ja pašā tekstā ir pēdiņas.<\/span> <span class=\"sg\" data-s=\"2\">Šie trīs operatori ir pamats.<\/span> <span class=\"sg\" data-s=\"3\">Nākamā tēma parāda, kā <a href=\"https://course.raku.org/lv/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbi<\/em><\/a> ļauj precīzi izvēlēties, kuras funkcijas ir ieslēgtas.<\/span><\/p>"]]},"ru":{"t":"q, qq и Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Есть три базовых оператора цитирования.<\/span> <span class=\"sg\" data-s=\"1\">Они отличаются тем, насколько сильно обрабатывают текст внутри себя:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — как одинарные кавычки: почти всё остаётся как есть<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — как двойные кавычки: переменные и управляющие последовательности интерполируются<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — самая буквальная форма из всех: <strong>ничего<\/strong> не обрабатывается<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый из них берёт текст между парой разделителей.<\/span> <span class=\"sg\" data-s=\"1\">Привычные <code>'…'<\/code> — это просто короткая запись <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Точно так же <code>\"…\"<\/code> — короткая запись <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> оставляет <code>$name<\/code> как есть, а <code>qq<\/code> его интерполирует.<\/span> <span class=\"sg\" data-s=\"1\">Управляющие последовательности с обратным слэшем, такие как <code>\\n<\/code>, работают так же.<\/span> <span class=\"sg\" data-s=\"2\">Только <code>qq<\/code> (и <code>\"…\"<\/code>) превращает <code>\\n<\/code> в настоящий перевод строки.<\/span> <span class=\"sg\" data-s=\"3\">И <code>q<\/code>, и <code>Q<\/code> оставляют его как два символа, <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Так чем же отличаются <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Как и одинарные кавычки, <code>q<\/code> всё же обрабатывает <em>небольшой<\/em> набор управляющих последовательностей.<\/span> <span class=\"sg\" data-s=\"2\">Удвоенный обратный слэш <code>\\\\<\/code> становится одним, и можно экранировать закрывающий разделитель.<\/span> <span class=\"sg\" data-s=\"3\">А вот простая форма <code>Q<\/code> не обрабатывает <strong>совсем ничего<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можно использовать любые разделители, например <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> или <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это полезно, когда сам текст содержит кавычки.<\/span> <span class=\"sg\" data-s=\"2\">Эти три оператора — основа.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема показывает, как <a href=\"https://course.raku.org/ru/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречия<\/em><\/a> позволяют точно выбрать, какие возможности включены.<\/span><\/p>"]]},"uk":{"t":"q, qq та Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Є три базові оператори цитування.<\/span> <span class=\"sg\" data-s=\"1\">Різниця в тому, наскільки сильно вони обробляють текст усередині:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — як одинарні лапки: майже все лишається як є<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — як подвійні лапки: змінні та екрановані послідовності інтерполюються<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — найбуквальніший з усіх: <strong>нічого<\/strong> не обробляється<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен із них бере текст між парою роздільників.<\/span> <span class=\"sg\" data-s=\"1\">Знайоме <code>'…'<\/code> — це просто короткий запис <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так само <code>\"…\"<\/code> — короткий запис <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> лишає <code>$name<\/code> як є, а <code>qq<\/code> його інтерполює.<\/span> <span class=\"sg\" data-s=\"1\">Екрановані послідовності, такі як <code>\\n<\/code>, працюють так само.<\/span> <span class=\"sg\" data-s=\"2\">Лише <code>qq<\/code> (і <code>\"…\"<\/code>) перетворює <code>\\n<\/code> на справжній перехід рядка.<\/span> <span class=\"sg\" data-s=\"3\">І <code>q<\/code>, і <code>Q<\/code> лишають його двома символами, <code>\\<\/code> та <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;новий рядок&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">То чим різняться <code>q<\/code> і <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Як і одинарні лапки, <code>q<\/code> усе ж обробляє <em>невеликий<\/em> набір екранованих послідовностей.<\/span> <span class=\"sg\" data-s=\"2\">Подвоєна зворотна коса риска <code>\\\\<\/code> стає однією, і можна екранувати закривальний роздільник.<\/span> <span class=\"sg\" data-s=\"3\">А от проста форма <code>Q<\/code> не обробляє взагалі <strong>нічого<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q згортає екрановану зворотну косу риску\nsay Q{a\\\\b}; # a\\\\b  — Q зберігає обидва символи<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можна використовувати будь-які роздільники, наприклад <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> чи <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це зручно, коли сам текст містить лапки.<\/span> <span class=\"sg\" data-s=\"2\">Ці три оператори — основа.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема показує, як <a href=\"https://course.raku.org/uk/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наріччя<\/em><\/a> дозволяють вибрати, які саме можливості ввімкнені.<\/span><\/p>"]]},"bg":{"t":"q, qq и Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Има три основни оператора за цитиране.<\/span> <span class=\"sg\" data-s=\"1\">Разликата е в това колко обработват текста вътре в себе си:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — като единични кавички: почти всичко остава непроменено<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — като двойни кавички: променливите и екраниращите последователности се интерполират<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — най-буквалният от всички: <strong>нищо<\/strong> не се обработва<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки от тях приема текста между двойка разделители.<\/span> <span class=\"sg\" data-s=\"1\">Познатите <code>'…'<\/code> са просто кратък начин да напишете <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По същия начин <code>\"…\"<\/code> е съкращение за <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> оставя <code>$name<\/code> непроменено, а <code>qq<\/code> го интерполира.<\/span> <span class=\"sg\" data-s=\"1\">Екраниращите последователности с обратна наклонена черта, като <code>\\n<\/code>, работят по същия начин.<\/span> <span class=\"sg\" data-s=\"2\">Само <code>qq<\/code> (и <code>\"…\"<\/code>) превръща <code>\\n<\/code> в истински нов ред.<\/span> <span class=\"sg\" data-s=\"3\">И <code>q<\/code>, и <code>Q<\/code> го оставят като два символа, <code>\\<\/code> и <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тогава по какво се различават <code>q<\/code> и <code>Q<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Подобно на единичните кавички, <code>q<\/code> все пак обработва <em>малък<\/em> набор от екранирания.<\/span> <span class=\"sg\" data-s=\"2\">Удвоената обратна наклонена черта <code>\\\\<\/code> става една и можете да екранирате затварящия разделител.<\/span> <span class=\"sg\" data-s=\"3\">Обикновената форма <code>Q<\/code> обаче не обработва <strong>абсолютно нищо<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q колапсира екранираната обратна наклонена черта\nsay Q{a\\\\b}; # a\\\\b  — Q запазва и двата символа<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате всякакви разделители, например <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> или <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е удобно, когато самият текст съдържа кавички.<\/span> <span class=\"sg\" data-s=\"2\">Трите оператора са основата.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема показва как <a href=\"https://course.raku.org/bg/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>наречията<\/em><\/a> ви позволяват да изберете точно кои функции са включени.<\/span><\/p>"]]},"eo":{"t":"q, qq, kaj Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ekzistas tri bazaj citaj operatoroj.<\/span> <span class=\"sg\" data-s=\"1\">La diferenco estas, kiom ili prilaboras la tekston ene de si:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — kiel unuopaj citiloj: preskaŭ ĉio restas sen ŝanĝo<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — kiel duoblaj citiloj: variabloj kaj eskapoj estas interpolataj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — la plej laŭlitera el ĉiuj: <strong>nenio<\/strong> estas prilaborata<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu el ili prenas la tekston inter paro de limigiloj.<\/span> <span class=\"sg\" data-s=\"1\">La konata <code>'…'<\/code> estas nur mallonga maniero skribi <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Same, <code>\"…\"<\/code> estas mallongigo por <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> lasas <code>$name<\/code> sen ŝanĝo, sed <code>qq<\/code> interpolas ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Maldekstre-streketaj eskapoj kiel <code>\\n<\/code> funkcias same.<\/span> <span class=\"sg\" data-s=\"2\">Nur <code>qq<\/code> (kaj <code>\"…\"<\/code>) faras el <code>\\n<\/code> veran novlinion.<\/span> <span class=\"sg\" data-s=\"3\">Kaj <code>q<\/code> kaj <code>Q<\/code> lasas ĝin kiel du signojn, <code>\\<\/code> kaj <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do kiel <code>q<\/code> kaj <code>Q<\/code> diferencas?<\/span> <span class=\"sg\" data-s=\"1\">Kiel unuopaj citiloj, <code>q<\/code> ankoraŭ traktas <em>malgrandan<\/em> aron da eskapoj.<\/span> <span class=\"sg\" data-s=\"2\">Duobligita maldekstra streketo <code>\\\\<\/code> fariĝas unu, kaj vi povas eskapi la fermilon.<\/span> <span class=\"sg\" data-s=\"3\">La simpla <code>Q<\/code>-formo, tamen, prilaboras tute <strong>nenion<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q kolapsas la eskapitan maldekstran streketon\nsay Q{a\\\\b}; # a\\\\b  — Q konservas ambaŭ signojn<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi ajnajn limigilojn, ekzemple <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> aŭ <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio utilas, kiam la teksto mem enhavas citilojn.<\/span> <span class=\"sg\" data-s=\"2\">La tri operatoroj estas la bazo.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo montras, kiel <a href=\"https://course.raku.org/eo/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverboj<\/em><\/a> lasas vin elekti ĝuste, kiuj funkcioj estas ŝaltitaj.<\/span><\/p>"]]},"la":{"t":"q, qq, et Q","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tres operatores citandi fundamentales sunt.<\/span> <span class=\"sg\" data-s=\"1\">Differentia est quantum textum intra se tractent:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>q<\/code> — sicut apostrophi simplices: fere omnia ut sunt manent<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>qq<\/code> — sicut apostrophi duplices: variabiles et effugia interpolantur<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>Q<\/code> — maxime ad litteram omnium: <strong>nihil<\/strong> tractatur<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quisque eorum textum inter par delimitatorum accipit.<\/span> <span class=\"sg\" data-s=\"1\">Notum <code>'…'<\/code> est solum modus brevis scribendi <code>q<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Eodem modo <code>\"…\"<\/code> est forma brevis pro <code>qq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nsay q{Hello $name};  # Hello $name\nsay qq{Hello $name}; # Hello Anna<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>q<\/code> relinquit <code>$name<\/code> ut est, sed <code>qq<\/code> eam interpolat.<\/span> <span class=\"sg\" data-s=\"1\">Effugia per obliquum reversum ut <code>\\n<\/code> eodem modo operantur.<\/span> <span class=\"sg\" data-s=\"2\">Solum <code>qq<\/code> (et <code>\"…\"<\/code>) convertit <code>\\n<\/code> in verum finem lineae.<\/span> <span class=\"sg\" data-s=\"3\">Tam <code>q<\/code> quam <code>Q<\/code> id ut duos characteres relinquunt, <code>\\<\/code> et <code>n<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say qq{line\\nbreak}; # line&lt;newline&gt;break\nsay q{line\\nbreak};  # line\\nbreak\nsay Q{line\\nbreak};  # line\\nbreak<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quomodo ergo <code>q<\/code> et <code>Q<\/code> differunt?<\/span> <span class=\"sg\" data-s=\"1\">Sicut apostrophi simplices, <code>q<\/code> adhuc <em>parvum<\/em> numerum effugiorum tractat.<\/span> <span class=\"sg\" data-s=\"2\">Obliquus reversus duplicatus <code>\\\\<\/code> fit unus, et delimitatorem claudentem effugere potes.<\/span> <span class=\"sg\" data-s=\"3\">Forma simplex <code>Q<\/code> autem <strong>nihil<\/strong> omnino tractat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q{a\\\\b}; # a\\b   — q collapses the escaped backslash\nsay Q{a\\\\b}; # a\\\\b  — Q keeps both characters<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quoslibet delimitatores adhibere potes, ut <code>q{…}<\/code>, <code>q[…]<\/code>, <code>q/…/<\/code> vel <code>q!…!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc utile est cum textus ipse apostrophos continet.<\/span> <span class=\"sg\" data-s=\"2\">Tres operatores fundamentum sunt.<\/span> <span class=\"sg\" data-s=\"3\">Proximum thema ostendit quomodo <a href=\"https://course.raku.org/la/advanced/quoting/adverbs/\" target=\"_blank\" rel=\"noopener\"><em>adverbia<\/em><\/a> tibi permittant exacte eligere quae proprietates accensae sint.<\/span><\/p>"]]}}}</script>
