<script type="application/json" id="page-data">{"u":"advanced/quoting/heredocs","n":470,"k":"topic","pv":"advanced/quoting/adverbs/quiz","nx":"advanced/quoting/exercises","tr":["advanced","advanced/quoting"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A <em>heredoc<\/em> is a quoting form for text with several lines.<\/span> <span class=\"sg\" data-s=\"1\">It does not use delimiters around the text.<\/span> <span class=\"sg\" data-s=\"2\">Instead, you give a terminator word with <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The string starts on the next line.<\/span> <span class=\"sg\" data-s=\"4\">It goes on until a line that contains only that word:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">The terminator marks where the text ends.<\/span> <span class=\"sg\" data-s=\"1\">Here it is <code>END<\/code>, but any word is fine.<\/span> <span class=\"sg\" data-s=\"2\">Note the <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">The text keeps the newline before the terminator.<\/span> <span class=\"sg\" data-s=\"4\">So it already ends with a line break.<\/span> <span class=\"sg\" data-s=\"5\">With <code>say<\/code>, you would get a second one and an empty line at the end.<\/span> <span class=\"sg\" data-s=\"6\">The heredoc starts with <code>q:to<\/code>, so the text is not interpolated.<\/span> <span class=\"sg\" data-s=\"7\">To interpolate variables, use <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is a useful detail.<\/span> <span class=\"sg\" data-s=\"1\">The <strong>indentation of the closing terminator<\/strong> is removed from every line of the text.<\/span> <span class=\"sg\" data-s=\"2\">So you can indent a heredoc to match the code around it.<\/span> <span class=\"sg\" data-s=\"3\">That indentation does not end up in the string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This prints the same <code>Hello,<\/code> and <code>World!<\/code> as in the first example.<\/span> <span class=\"sg\" data-s=\"1\">Here, the closing <code>END<\/code> is indented by eight spaces.<\/span> <span class=\"sg\" data-s=\"2\">So eight spaces are removed from each line.<\/span> <span class=\"sg\" data-s=\"3\">The returned string is just <code>Hello,\\nWorld!<\/code>, with no spaces at the start of the lines.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">The closing terminator sets how many spaces are removed.<\/span> <span class=\"sg\" data-s=\"1\">So every line of the text must have at least that much indentation.<\/span> <span class=\"sg\" data-s=\"2\">If a line has fewer spaces at the start, Raku cannot remove the full amount.<\/span> <span class=\"sg\" data-s=\"3\">Then it warns: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">To avoid this, do not indent the terminator deeper than the least indented line.<\/span> <span class=\"sg\" data-s=\"5\">Heredocs are the natural choice for templates, messages, and any text with several lines.<\/span><\/p>"]]},"de":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Heredoc<\/em> ist eine Quoting-Form für Text mit mehreren Zeilen.<\/span> <span class=\"sg\" data-s=\"1\">Es benutzt keine Trennzeichen um den Text herum.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen gibst du mit <code>:to<\/code> ein Abschlusswort an.<\/span> <span class=\"sg\" data-s=\"3\">Der String beginnt in der nächsten Zeile.<\/span> <span class=\"sg\" data-s=\"4\">Er geht bis zu einer Zeile, die nur dieses Wort enthält:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Ausgabe ist:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Das Abschlusswort markiert, wo der Text endet.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist es <code>END<\/code>, aber jedes Wort ist in Ordnung.<\/span> <span class=\"sg\" data-s=\"2\">Beachte das <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Der Text behält den Zeilenumbruch vor dem Abschlusswort.<\/span> <span class=\"sg\" data-s=\"4\">Deshalb endet er schon mit einem Zeilenumbruch.<\/span> <span class=\"sg\" data-s=\"5\">Mit <code>say<\/code> würdest du einen zweiten bekommen und am Ende eine Leerzeile.<\/span> <span class=\"sg\" data-s=\"6\">Das Heredoc beginnt mit <code>q:to<\/code>, deshalb wird der Text nicht interpoliert.<\/span> <span class=\"sg\" data-s=\"7\">Um Variablen zu interpolieren, benutze <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein nützliches Detail.<\/span> <span class=\"sg\" data-s=\"1\">Die <strong>Einrückung des schließenden Abschlussworts<\/strong> wird aus jeder Zeile des Textes entfernt.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du ein Heredoc passend zum Code drumherum einrücken.<\/span> <span class=\"sg\" data-s=\"3\">Diese Einrückung landet nicht im String:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das gibt dasselbe <code>Hello,<\/code> und <code>World!<\/code> aus wie im ersten Beispiel.<\/span> <span class=\"sg\" data-s=\"1\">Hier ist das schließende <code>END<\/code> um acht Leerzeichen eingerückt.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb werden aus jeder Zeile acht Leerzeichen entfernt.<\/span> <span class=\"sg\" data-s=\"3\">Der zurückgegebene String ist nur <code>Hello,\\nWorld!<\/code>, ohne Leerzeichen am Anfang der Zeilen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Das schließende Abschlusswort legt fest, wie viele Leerzeichen entfernt werden.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb muss jede Zeile des Textes mindestens so weit eingerückt sein.<\/span> <span class=\"sg\" data-s=\"2\">Wenn eine Zeile am Anfang weniger Leerzeichen hat, kann Raku nicht die volle Menge entfernen.<\/span> <span class=\"sg\" data-s=\"3\">Dann warnt Raku: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Um das zu vermeiden, rücke das Abschlusswort nicht tiefer ein als die am wenigsten eingerückte Zeile.<\/span> <span class=\"sg\" data-s=\"5\">Heredocs sind die natürliche Wahl für Vorlagen, Nachrichten und jeden Text mit mehreren Zeilen.<\/span><\/p>"]]},"nl":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een <em>heredoc<\/em> is een quoting-vorm voor tekst met meerdere regels.<\/span> <span class=\"sg\" data-s=\"1\">Hij gebruikt geen scheidingstekens rond de tekst.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan geef je een afsluitwoord op met <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De string begint op de volgende regel.<\/span> <span class=\"sg\" data-s=\"4\">Hij loopt door tot een regel die alleen dat woord bevat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit drukt af:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Het afsluitwoord geeft aan waar de tekst eindigt.<\/span> <span class=\"sg\" data-s=\"1\">Hier is het <code>END<\/code>, maar elk woord is goed.<\/span> <span class=\"sg\" data-s=\"2\">Let op de <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De tekst houdt de nieuwe regel voor het afsluitwoord.<\/span> <span class=\"sg\" data-s=\"4\">Hij eindigt dus al met een regelafbreking.<\/span> <span class=\"sg\" data-s=\"5\">Met <code>say<\/code> zou je er een tweede krijgen, en een lege regel aan het einde.<\/span> <span class=\"sg\" data-s=\"6\">De heredoc begint met <code>q:to<\/code>, dus de tekst wordt niet geïnterpoleerd.<\/span> <span class=\"sg\" data-s=\"7\">Gebruik <code>qq:to<\/code> om variabelen te interpoleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is een handig detail.<\/span> <span class=\"sg\" data-s=\"1\">De <strong>inspringing van het afsluitwoord<\/strong> wordt van elke regel van de tekst verwijderd.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je een heredoc laten inspringen zoals de code eromheen.<\/span> <span class=\"sg\" data-s=\"3\">Die inspringing komt dan niet in de string terecht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit drukt dezelfde <code>Hello,<\/code> en <code>World!<\/code> af als in het eerste voorbeeld.<\/span> <span class=\"sg\" data-s=\"1\">Hier springt het afsluitende <code>END<\/code> acht spaties in.<\/span> <span class=\"sg\" data-s=\"2\">Daarom worden er acht spaties van elke regel verwijderd.<\/span> <span class=\"sg\" data-s=\"3\">De teruggegeven string is gewoon <code>Hello,\\nWorld!<\/code>, zonder spaties aan het begin van de regels.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Het afsluitwoord bepaalt hoeveel spaties er worden verwijderd.<\/span> <span class=\"sg\" data-s=\"1\">Elke regel van de tekst moet dus minstens zo ver inspringen.<\/span> <span class=\"sg\" data-s=\"2\">Als een regel minder spaties aan het begin heeft, kan Raku niet alles verwijderen.<\/span> <span class=\"sg\" data-s=\"3\">Dan geeft Raku een waarschuwing: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Om dit te voorkomen, laat je het afsluitwoord niet dieper inspringen dan de regel die het minst inspringt.<\/span> <span class=\"sg\" data-s=\"5\">Heredocs zijn de natuurlijke keuze voor sjablonen, berichten en elke tekst met meerdere regels.<\/span><\/p>"]]},"es":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> es una forma de entrecomillado para texto con varias líneas.<\/span> <span class=\"sg\" data-s=\"1\">No usa delimitadores alrededor del texto.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, indicas una palabra terminadora con <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La cadena empieza en la línea siguiente.<\/span> <span class=\"sg\" data-s=\"4\">Continúa hasta una línea que contiene solo esa palabra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">El terminador marca dónde termina el texto.<\/span> <span class=\"sg\" data-s=\"1\">Aquí es <code>END<\/code>, pero cualquier palabra sirve.<\/span> <span class=\"sg\" data-s=\"2\">Observa el <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El texto conserva el salto de línea antes del terminador.<\/span> <span class=\"sg\" data-s=\"4\">Así que ya termina con un salto de línea.<\/span> <span class=\"sg\" data-s=\"5\">Con <code>say<\/code>, tendrías un segundo salto y una línea vacía al final.<\/span> <span class=\"sg\" data-s=\"6\">El heredoc empieza con <code>q:to<\/code>, así que el texto no se interpola.<\/span> <span class=\"sg\" data-s=\"7\">Para interpolar variables, usa <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un detalle útil.<\/span> <span class=\"sg\" data-s=\"1\">La <strong>indentación del terminador de cierre<\/strong> se elimina de cada línea del texto.<\/span> <span class=\"sg\" data-s=\"2\">Así puedes indentar un heredoc para que coincida con el código de alrededor.<\/span> <span class=\"sg\" data-s=\"3\">Esa indentación no termina en la cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esto imprime los mismos <code>Hello,<\/code> y <code>World!<\/code> que en el primer ejemplo.<\/span> <span class=\"sg\" data-s=\"1\">Aquí, el <code>END<\/code> de cierre está indentado con ocho espacios.<\/span> <span class=\"sg\" data-s=\"2\">Así que se eliminan ocho espacios de cada línea.<\/span> <span class=\"sg\" data-s=\"3\">La cadena devuelta es solo <code>Hello,\\nWorld!<\/code>, sin espacios al principio de las líneas.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">El terminador de cierre fija cuántos espacios se eliminan.<\/span> <span class=\"sg\" data-s=\"1\">Así que cada línea del texto debe tener al menos esa indentación.<\/span> <span class=\"sg\" data-s=\"2\">Si una línea tiene menos espacios al principio, Raku no puede eliminar la cantidad completa.<\/span> <span class=\"sg\" data-s=\"3\">Entonces muestra una advertencia: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Para evitarlo, no indentes el terminador más que la línea menos indentada.<\/span> <span class=\"sg\" data-s=\"5\">Los heredocs son la opción natural para plantillas, mensajes y cualquier texto con varias líneas.<\/span><\/p>"]]},"it":{"t":"Heredoc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <em>heredoc<\/em> è una forma di quoting per il testo su più righe.<\/span> <span class=\"sg\" data-s=\"1\">Non usa delimitatori intorno al testo.<\/span> <span class=\"sg\" data-s=\"2\">Invece, indichi una parola terminatore con <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La stringa inizia dalla riga successiva.<\/span> <span class=\"sg\" data-s=\"4\">Continua fino a una riga che contiene solo quella parola:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Il terminatore segna dove finisce il testo.<\/span> <span class=\"sg\" data-s=\"1\">Qui è <code>END<\/code>, ma va bene qualsiasi parola.<\/span> <span class=\"sg\" data-s=\"2\">Nota il <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il testo tiene il carattere di nuova riga prima del terminatore.<\/span> <span class=\"sg\" data-s=\"4\">Quindi finisce già con un'interruzione di riga.<\/span> <span class=\"sg\" data-s=\"5\">Con <code>say<\/code> ne avresti una seconda e una riga vuota alla fine.<\/span> <span class=\"sg\" data-s=\"6\">L'heredoc inizia con <code>q:to<\/code>, quindi il testo non viene interpolato.<\/span> <span class=\"sg\" data-s=\"7\">Per interpolare le variabili, usa <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco un dettaglio utile.<\/span> <span class=\"sg\" data-s=\"1\">L'<strong>indentazione del terminatore di chiusura<\/strong> viene tolta da ogni riga del testo.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi indentare un heredoc come il codice intorno.<\/span> <span class=\"sg\" data-s=\"3\">Quell'indentazione non finisce nella stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo stampa gli stessi <code>Hello,<\/code> e <code>World!<\/code> del primo esempio.<\/span> <span class=\"sg\" data-s=\"1\">Qui il terminatore di chiusura <code>END<\/code> è indentato di otto spazi.<\/span> <span class=\"sg\" data-s=\"2\">Quindi da ogni riga vengono tolti otto spazi.<\/span> <span class=\"sg\" data-s=\"3\">La stringa restituita è solo <code>Hello,\\nWorld!<\/code>, senza spazi all'inizio delle righe.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Il terminatore di chiusura stabilisce quanti spazi vengono tolti.<\/span> <span class=\"sg\" data-s=\"1\">Quindi ogni riga del testo deve avere almeno quell'indentazione.<\/span> <span class=\"sg\" data-s=\"2\">Se una riga ha meno spazi all'inizio, Raku non può togliere tutta la quantità.<\/span> <span class=\"sg\" data-s=\"3\">Allora avvisa: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Per evitarlo, non indentare il terminatore più della riga meno indentata.<\/span> <span class=\"sg\" data-s=\"5\">Gli heredoc sono la scelta naturale per template, messaggi e qualsiasi testo su più righe.<\/span><\/p>"]]},"lv":{"t":"Heredoc","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> ir citēšanas forma tekstam ar vairākām rindām.<\/span> <span class=\"sg\" data-s=\"1\">Tā neizmanto norobežotājus ap tekstu.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā jūs norādāt terminatora vārdu ar <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Virkne sākas nākamajā rindā.<\/span> <span class=\"sg\" data-s=\"4\">Tā turpinās līdz rindai, kas satur tikai šo vārdu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Terminators atzīmē, kur teksts beidzas.<\/span> <span class=\"sg\" data-s=\"1\">Šeit tas ir <code>END<\/code>, bet der jebkurš vārds.<\/span> <span class=\"sg\" data-s=\"2\">Ievērojiet <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Teksts saglabā jaunrindu pirms terminatora.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc tas jau beidzas ar rindas pārtraukumu.<\/span> <span class=\"sg\" data-s=\"5\">Ar <code>say<\/code> jūs iegūtu vēl vienu un tukšu rindu beigās.<\/span> <span class=\"sg\" data-s=\"6\">Heredoc sākas ar <code>q:to<\/code>, tāpēc teksts netiek interpolēts.<\/span> <span class=\"sg\" data-s=\"7\">Lai interpolētu mainīgos, izmantojiet <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir noderīga detaļa.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Aizverošā terminatora atkāpe<\/strong> tiek noņemta no katras teksta rindas.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat atkāpēt heredoc atbilstoši apkārtējam kodam.<\/span> <span class=\"sg\" data-s=\"3\">Šī atkāpe nenonāk virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā tos pašus <code>Hello,<\/code> un <code>World!<\/code> kā pirmajā piemērā.<\/span> <span class=\"sg\" data-s=\"1\">Šeit aizverošais <code>END<\/code> ir atkāpēts par astoņām atstarpēm.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc no katras rindas tiek noņemtas astoņas atstarpes.<\/span> <span class=\"sg\" data-s=\"3\">Atgrieztā virkne ir vienkārši <code>Hello,\\nWorld!<\/code>, bez atstarpēm rindu sākumā.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aizverošais terminators nosaka, cik atstarpju tiek noņemts.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc katrai teksta rindai jābūt vismaz tik lielai atkāpei.<\/span> <span class=\"sg\" data-s=\"2\">Ja kādai rindai sākumā ir mazāk atstarpju, Raku nevar noņemt visu daudzumu.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas brīdina: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Lai no tā izvairītos, neatkāpiet terminatoru dziļāk par vismazāk atkāpēto rindu.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc ir dabiska izvēle veidnēm, ziņojumiem un jebkuram tekstam ar vairākām rindām.<\/span><\/p>"]]},"ru":{"t":"Heredoc-строки","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — это форма цитирования для текста в несколько строк.<\/span> <span class=\"sg\" data-s=\"1\">Она не использует разделители вокруг текста.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого вы указываете слово-терминатор с помощью <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текст начинается со следующей строки.<\/span> <span class=\"sg\" data-s=\"4\">Он продолжается до строки, в которой есть только это слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это выводит:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Терминатор отмечает, где заканчивается текст.<\/span> <span class=\"sg\" data-s=\"1\">Здесь это <code>END<\/code>, но подойдёт любое слово.<\/span> <span class=\"sg\" data-s=\"2\">Обратите внимание на <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текст сохраняет перевод строки перед терминатором.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому он уже заканчивается переводом строки.<\/span> <span class=\"sg\" data-s=\"5\">С <code>say<\/code> вы бы получили второй перевод строки и пустую строку в конце.<\/span> <span class=\"sg\" data-s=\"6\">Heredoc начинается с <code>q:to<\/code>, поэтому текст не интерполируется.<\/span> <span class=\"sg\" data-s=\"7\">Чтобы интерполировать переменные, используйте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот полезная деталь.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Отступ закрывающего терминатора<\/strong> удаляется из каждой строки текста.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому heredoc можно писать с таким же отступом, как код вокруг него.<\/span> <span class=\"sg\" data-s=\"3\">Этот отступ не попадает в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Это выводит те же <code>Hello,<\/code> и <code>World!<\/code>, что и в первом примере.<\/span> <span class=\"sg\" data-s=\"1\">Здесь у закрывающего <code>END<\/code> отступ в восемь пробелов.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому из каждой строки удаляется восемь пробелов.<\/span> <span class=\"sg\" data-s=\"3\">Возвращаемая строка — просто <code>Hello,\\nWorld!<\/code>, без пробелов в начале строк.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Закрывающий терминатор задаёт, сколько пробелов удаляется.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому у каждой строки текста должен быть хотя бы такой же отступ.<\/span> <span class=\"sg\" data-s=\"2\">Если в начале строки пробелов меньше, Raku не может удалить их полностью.<\/span> <span class=\"sg\" data-s=\"3\">Тогда он предупреждает: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы этого избежать, не делайте у терминатора отступ больше, чем у строки с самым маленьким отступом.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc'и — естественный выбор для шаблонов, сообщений и любого текста в несколько строк.<\/span><\/p>"]]},"uk":{"t":"Heredoc-и","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> — це форма цитування для тексту з кількох рядків.<\/span> <span class=\"sg\" data-s=\"1\">Він не використовує роздільників навколо тексту.<\/span> <span class=\"sg\" data-s=\"2\">Натомість ви вказуєте слово-термінатор через <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Рядок починається з наступного рядка коду.<\/span> <span class=\"sg\" data-s=\"4\">Він триває до рядка, який містить лише це слово:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Термінатор позначає, де закінчується текст.<\/span> <span class=\"sg\" data-s=\"1\">Тут це <code>END<\/code>, але підійде будь-яке слово.<\/span> <span class=\"sg\" data-s=\"2\">Зверніть увагу на <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текст зберігає перехід рядка перед термінатором.<\/span> <span class=\"sg\" data-s=\"4\">Тож він уже закінчується розривом рядка.<\/span> <span class=\"sg\" data-s=\"5\">Із <code>say<\/code> ви отримали б другий розрив і порожній рядок у кінці.<\/span> <span class=\"sg\" data-s=\"6\">Heredoc починається з <code>q:to<\/code>, тож текст не інтерполюється.<\/span> <span class=\"sg\" data-s=\"7\">Щоб інтерполювати змінні, використовуйте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось корисна деталь.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Відступ закривального термінатора<\/strong> прибирається з кожного рядка тексту.<\/span> <span class=\"sg\" data-s=\"2\">Тож heredoc можна зробити з відступом, як у коді навколо.<\/span> <span class=\"sg\" data-s=\"3\">Цей відступ не потрапляє в рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це виводить ті самі <code>Hello,<\/code> та <code>World!<\/code>, що й у першому прикладі.<\/span> <span class=\"sg\" data-s=\"1\">Тут закривальне <code>END<\/code> має відступ у вісім пробілів.<\/span> <span class=\"sg\" data-s=\"2\">Тож із кожного рядка прибирається вісім пробілів.<\/span> <span class=\"sg\" data-s=\"3\">Повернений рядок — просто <code>Hello,\\nWorld!<\/code>, без пробілів на початку рядків.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Закривальний термінатор задає, скільки пробілів прибирається.<\/span> <span class=\"sg\" data-s=\"1\">Тож кожен рядок тексту мусить мати щонайменше такий відступ.<\/span> <span class=\"sg\" data-s=\"2\">Якщо на початку рядка менше пробілів, Raku не може прибрати всю кількість.<\/span> <span class=\"sg\" data-s=\"3\">Тоді він попереджає: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Щоб цього уникнути, не робіть термінатору глибший відступ, ніж у рядка з найменшим відступом.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc-и — природний вибір для шаблонів, повідомлень і будь-якого тексту з кількох рядків.<\/span><\/p>"]]},"bg":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> е форма на цитиране за текст с няколко реда.<\/span> <span class=\"sg\" data-s=\"1\">Тя не използва разделители около текста.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това задавате терминираща дума с <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Низът започва на следващия ред.<\/span> <span class=\"sg\" data-s=\"4\">Той продължава до ред, който съдържа само тази дума:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Терминаторът показва къде свършва текстът.<\/span> <span class=\"sg\" data-s=\"1\">Тук това е <code>END<\/code>, но всяка дума става.<\/span> <span class=\"sg\" data-s=\"2\">Обърнете внимание на <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Текстът запазва новия ред преди терминатора.<\/span> <span class=\"sg\" data-s=\"4\">Затова той вече завършва с край на ред.<\/span> <span class=\"sg\" data-s=\"5\">Със <code>say<\/code> бихте получили втори и празен ред в края.<\/span> <span class=\"sg\" data-s=\"6\">Heredoc-ът започва с <code>q:to<\/code>, затова текстът не се интерполира.<\/span> <span class=\"sg\" data-s=\"7\">За да интерполирате променливи, използвайте <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето един полезен детайл.<\/span> <span class=\"sg\" data-s=\"1\">От всеки ред на текста се премахва <strong>отстъпът на затварящия терминатор<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Така можете да отместите heredoc-а, за да съвпада с кода около него.<\/span> <span class=\"sg\" data-s=\"3\">Този отстъп не попада в низа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва същите <code>Hello,<\/code> и <code>World!<\/code> като в първия пример.<\/span> <span class=\"sg\" data-s=\"1\">Тук затварящият <code>END<\/code> е отместен с осем интервала.<\/span> <span class=\"sg\" data-s=\"2\">Затова от всеки ред се премахват осем интервала.<\/span> <span class=\"sg\" data-s=\"3\">Върнатият низ е просто <code>Hello,\\nWorld!<\/code>, без интервали в началото на редовете.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Затварящият терминатор определя колко интервала се премахват.<\/span> <span class=\"sg\" data-s=\"1\">Затова всеки ред от текста трябва да има поне толкова голям отстъп.<\/span> <span class=\"sg\" data-s=\"2\">Ако някой ред има по-малко интервали в началото, Raku не може да премахне цялото количество.<\/span> <span class=\"sg\" data-s=\"3\">Тогава той предупреждава: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">За да избегнете това, не отмествайте терминатора по-навътре от най-малко отместения ред.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc-ите са естественият избор за шаблони, съобщения и всякакъв текст с няколко реда.<\/span><\/p>"]]},"eo":{"t":"Heredokoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> estas cita formo por teksto kun pluraj linioj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne uzas limigilojn ĉirkaŭ la teksto.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, vi donas finan vorton per <code>:to<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La ĉeno komenciĝas en la sekva linio.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi daŭras ĝis linio, kiu enhavas nur tiun vorton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">La finilo markas, kie la teksto finiĝas.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie ĝi estas <code>END<\/code>, sed ajna vorto taŭgas.<\/span> <span class=\"sg\" data-s=\"2\">Rimarku la <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La teksto tenas la novlinion antaŭ la finilo.<\/span> <span class=\"sg\" data-s=\"4\">Do ĝi jam finiĝas per liniorompo.<\/span> <span class=\"sg\" data-s=\"5\">Kun <code>say<\/code>, vi ricevus duan kaj malplenan linion ĉe la fino.<\/span> <span class=\"sg\" data-s=\"6\">La heredoc komenciĝas per <code>q:to<\/code>, do la teksto ne estas interpolita.<\/span> <span class=\"sg\" data-s=\"7\">Por interpoli variablojn, uzu <code>qq:to<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen utila detalo.<\/span> <span class=\"sg\" data-s=\"1\">La <strong>krommarĝeno de la ferma finilo<\/strong> estas forigita el ĉiu linio de la teksto.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas krommarĝenigi heredoc-on, por ke ĝi kongruu kun la kodo ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Tiu krommarĝeno ne aperas en la ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tio presas la samajn <code>Hello,<\/code> kaj <code>World!<\/code> kiel en la unua ekzemplo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tie, la ferma <code>END<\/code> estas krommarĝenigita per ok spacetoj.<\/span> <span class=\"sg\" data-s=\"2\">Do ok spacetoj estas forigitaj el ĉiu linio.<\/span> <span class=\"sg\" data-s=\"3\">La redonita ĉeno estas nur <code>Hello,\\nWorld!<\/code>, sen spacetoj komence de la linioj.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La ferma finilo difinas, kiom da spacetoj estas forigitaj.<\/span> <span class=\"sg\" data-s=\"1\">Do ĉiu linio de la teksto devas havi almenaŭ tiom da krommarĝeno.<\/span> <span class=\"sg\" data-s=\"2\">Se linio havas malpli da spacetoj komence, Raku ne povas forigi la plenan kvanton.<\/span> <span class=\"sg\" data-s=\"3\">Tiam ĝi avertas: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Por eviti tion, ne krommarĝenigu la finilon pli profunde ol la malplej krommarĝenigita linio.<\/span> <span class=\"sg\" data-s=\"5\">Heredoc-oj estas la natura elekto por ŝablonoj, mesaĝoj kaj ajna teksto kun pluraj linioj.<\/span><\/p>"]]},"la":{"t":"Heredocs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\"><em>Heredoc<\/em> est forma citandi pro textu plurium linearum.<\/span> <span class=\"sg\" data-s=\"1\">Delimitatores circa textum non adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Pro eis verbum terminans cum <code>:to<\/code> das.<\/span> <span class=\"sg\" data-s=\"3\">Series in proxima linea incipit.<\/span> <span class=\"sg\" data-s=\"4\">Pergit usque ad lineam quae solum illud verbum continet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = q:to/END/;\nHello,\nWorld!\nEND\n\nprint $text;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>Hello,\nWorld!<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Terminator signat ubi textus desinat.<\/span> <span class=\"sg\" data-s=\"1\">Hic est <code>END<\/code>, sed quodlibet verbum convenit.<\/span> <span class=\"sg\" data-s=\"2\">Nota <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Textus finem lineae ante terminatorem servat.<\/span> <span class=\"sg\" data-s=\"4\">Itaque iam cum fractura lineae desinit.<\/span> <span class=\"sg\" data-s=\"5\">Cum <code>say<\/code> alteram acciperes et lineam vacuam in fine.<\/span> <span class=\"sg\" data-s=\"6\">Heredoc cum <code>q:to<\/code> incipit, itaque textus non interpolatur.<\/span> <span class=\"sg\" data-s=\"7\">Ut variabiles interpoles, <code>qq:to<\/code> adhibe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\n\nmy $greeting = qq:to/EOF/;\nDear $name,\nWelcome!\nEOF\n\nprint $greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecce res utilis.<\/span> <span class=\"sg\" data-s=\"1\"><strong>Indentatio terminatoris claudentis<\/strong> ab omni linea textus removetur.<\/span> <span class=\"sg\" data-s=\"2\">Itaque heredoc indentare potes ut cum codice circa id congruat.<\/span> <span class=\"sg\" data-s=\"3\">Illa indentatio in seriem non pervenit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greeting {\n    return q:to/END/;\n        Hello,\n        World!\n        END\n}\n\nprint greeting;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc idem <code>Hello,<\/code> et <code>World!<\/code> imprimit ac in primo exemplo.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>END<\/code> claudens octo spatiis indentatus est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque octo spatia ab omni linea removentur.<\/span> <span class=\"sg\" data-s=\"3\">Series reddita solum <code>Hello,\\nWorld!<\/code> est, sine spatiis in initio linearum.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Terminator claudens statuit quot spatia Raku removeat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque omnis linea textus saltem tantam indentationem habere debet.<\/span> <span class=\"sg\" data-s=\"2\">Si linea pauciora spatia in initio habet, Raku totam quantitatem removere non potest.<\/span> <span class=\"sg\" data-s=\"3\">Tum monet: <em>Asked to remove 8 spaces, but the shortest indent is 4 spaces<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ut hoc vites, terminatorem non profundius indenta quam lineam minime indentatam.<\/span> <span class=\"sg\" data-s=\"5\">Heredocs sunt naturalis electio pro exemplaribus, nuntiis, et quolibet textu plurium linearum.<\/span><\/p>"]]}}}</script>
