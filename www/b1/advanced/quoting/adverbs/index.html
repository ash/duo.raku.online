<script type="application/json" id="page-data">{"u":"advanced/quoting/adverbs","n":468,"k":"topic","pv":"advanced/quoting/q-qq-big-q/quiz","nx":"advanced/quoting/adverbs/quiz","tr":["advanced","advanced/quoting"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quoting adverbs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">You can adjust the behaviour of a quoting construct with <em>adverbs<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Each quoting feature has its own adverb, which turns that one feature on or off.<\/span> <span class=\"sg\" data-s=\"2\">The features are interpolating scalars, running closures (code in braces), and processing backslashes.<\/span> <span class=\"sg\" data-s=\"3\">So you can start from <code>q<\/code> or <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Then you add back exactly the features you need.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Some common adverbs:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpolate scalar variables (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpolate code in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — handle backslash escapes such as <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Add one adverb to <code>q<\/code> to turn on a single feature.<\/span> <span class=\"sg\" data-s=\"1\">For example, allow code in braces but nothing else:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">With plain <code>q<\/code>, the <code>{ 3 * 4 }<\/code> is printed exactly as written.<\/span> <span class=\"sg\" data-s=\"1\">Only <code>:c<\/code> makes the block run and inserts its value.<\/span> <span class=\"sg\" data-s=\"2\">A <code>$variable<\/code>, however, would still stay as it is.<\/span> <span class=\"sg\" data-s=\"3\">Note the <code>/…/<\/code> delimiters here.<\/span> <span class=\"sg\" data-s=\"4\">You could also use <code>{…}<\/code> as delimiters, and the code would still compile.<\/span> <span class=\"sg\" data-s=\"5\">The compiler counts the nested braces correctly.<\/span> <span class=\"sg\" data-s=\"6\">But then the inner <code>{ 3 * 4 }<\/code> would be just part of the text, not a closure.<\/span> <span class=\"sg\" data-s=\"7\">So <code>:c<\/code> would leave it as it is.<\/span> <span class=\"sg\" data-s=\"8\">So if the text contains a <code>{ … }<\/code> block, choose a delimiter other than <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Then the closure really runs.<\/span> <span class=\"sg\" data-s=\"10\">You can also add scalar interpolation to <code>Q<\/code>, which normally changes nothing:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With a <code>!<\/code>, adverbs also turn features <strong>off<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Here is how to use <code>qq<\/code> but keep <code>$<\/code> as it is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is the same as <code>Q<\/code> with all the interpolation adverbs turned on.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> is the same as <code>Q<\/code> with a smaller set of them.<\/span> <span class=\"sg\" data-s=\"2\">Between these two ends, the adverbs let you control every detail.<\/span><\/p>"]]},"de":{"t":"Quoting-Adverbien","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Du kannst das Verhalten eines Quoting-Konstrukts mit <em>Adverbien<\/em> anpassen.<\/span> <span class=\"sg\" data-s=\"1\">Jede Quoting-Funktion hat ihr eigenes Adverb, das genau diese eine Funktion ein- oder ausschaltet.<\/span> <span class=\"sg\" data-s=\"2\">Die Funktionen sind: Skalare interpolieren, Closures ausführen (Code in geschweiften Klammern) und Backslashes verarbeiten.<\/span> <span class=\"sg\" data-s=\"3\">So kannst du mit <code>q<\/code> oder <code>Q<\/code> beginnen.<\/span> <span class=\"sg\" data-s=\"4\">Dann fügst du genau die Funktionen wieder hinzu, die du brauchst.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Einige gebräuchliche Adverbien:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoliert skalare Variablen (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoliert Code in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verarbeitet Backslash-Escape-Sequenzen wie <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Füge zu <code>q<\/code> ein Adverb hinzu, um eine einzelne Funktion einzuschalten.<\/span> <span class=\"sg\" data-s=\"1\">Erlaube zum Beispiel Code in geschweiften Klammern, aber sonst nichts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Mit einfachem <code>q<\/code> wird <code>{ 3 * 4 }<\/code> genau so ausgegeben, wie es geschrieben ist.<\/span> <span class=\"sg\" data-s=\"1\">Erst <code>:c<\/code> lässt den Block laufen und fügt seinen Wert ein.<\/span> <span class=\"sg\" data-s=\"2\">Eine <code>$variable<\/code> würde aber trotzdem so bleiben, wie sie ist.<\/span> <span class=\"sg\" data-s=\"3\">Beachte hier die Trennzeichen <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Du könntest auch <code>{…}<\/code> als Trennzeichen benutzen, und der Code würde trotzdem kompilieren.<\/span> <span class=\"sg\" data-s=\"5\">Der Compiler zählt die verschachtelten Klammern richtig.<\/span> <span class=\"sg\" data-s=\"6\">Aber dann wäre das innere <code>{ 3 * 4 }<\/code> nur ein Teil des Textes, keine Closure.<\/span> <span class=\"sg\" data-s=\"7\">Also würde <code>:c<\/code> es so lassen, wie es ist.<\/span> <span class=\"sg\" data-s=\"8\">Wenn der Text also einen <code>{ … }<\/code>-Block enthält, wähle ein anderes Trennzeichen als <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Dann läuft die Closure wirklich.<\/span> <span class=\"sg\" data-s=\"10\">Du kannst auch skalare Interpolation zu <code>Q<\/code> hinzufügen, das normalerweise nichts verändert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit einem <code>!<\/code> schalten Adverbien Funktionen auch <strong>aus<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Hier siehst du, wie du <code>qq<\/code> benutzt, aber <code>$<\/code> so lässt, wie es ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ist dasselbe wie <code>Q<\/code> mit allen eingeschalteten Interpolations-Adverbien.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> ist dasselbe wie <code>Q<\/code> mit einer kleineren Auswahl davon.<\/span> <span class=\"sg\" data-s=\"2\">Zwischen diesen zwei Enden kannst du mit den Adverbien jedes Detail steuern.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsadverbia","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Je kunt het gedrag van een quoting-constructie aanpassen met <em>bijwoorden<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Elke quoting-functie heeft een eigen bijwoord, dat die ene functie aan- of uitzet.<\/span> <span class=\"sg\" data-s=\"2\">De functies zijn het interpoleren van scalars, het uitvoeren van closures (code tussen accolades) en het verwerken van backslashes.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt dus beginnen met <code>q<\/code> of <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Daarna voeg je precies de functies weer toe die je nodig hebt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Enkele veelgebruikte bijwoorden:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoleer scalaire variabelen (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoleer code in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — verwerk backslash-escapes zoals <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voeg één bijwoord toe aan <code>q<\/code> om één functie aan te zetten.<\/span> <span class=\"sg\" data-s=\"1\">Sta bijvoorbeeld code tussen accolades toe, maar verder niets:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — gewone q laat het blok onaangeroerd\nsay q:c/result: {3 * 4}/; # result: 12        — :c voert het blok uit<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Met gewone <code>q<\/code> wordt <code>{ 3 * 4 }<\/code> precies zo afgedrukt als het geschreven is.<\/span> <span class=\"sg\" data-s=\"1\">Alleen <code>:c<\/code> zorgt dat het blok draait en voegt de waarde in.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>$variable<\/code> zou echter nog steeds blijven zoals hij is.<\/span> <span class=\"sg\" data-s=\"3\">Let op de scheidingstekens <code>/…/<\/code> hier.<\/span> <span class=\"sg\" data-s=\"4\">Je zou ook <code>{…}<\/code> als scheidingstekens kunnen gebruiken, en de code zou nog steeds compileren.<\/span> <span class=\"sg\" data-s=\"5\">De compiler telt de geneste accolades goed.<\/span> <span class=\"sg\" data-s=\"6\">Maar dan zou de binnenste <code>{ 3 * 4 }<\/code> gewoon deel van de tekst zijn, geen closure.<\/span> <span class=\"sg\" data-s=\"7\">Daardoor zou <code>:c<\/code> het laten zoals het is.<\/span> <span class=\"sg\" data-s=\"8\">Als de tekst dus een <code>{ … }<\/code>-blok bevat, kies dan een ander scheidingsteken dan <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Dan draait de closure echt.<\/span> <span class=\"sg\" data-s=\"10\">Je kunt ook scalaire interpolatie toevoegen aan <code>Q<\/code>, dat normaal niets verandert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met een <code>!<\/code> zetten bijwoorden functies ook <strong>uit<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Zo gebruik je <code>qq<\/code> maar laat je <code>$<\/code> zoals het is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> is hetzelfde als <code>Q<\/code> met alle interpolatie-bijwoorden aangezet.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> is hetzelfde als <code>Q<\/code> met een kleinere groep ervan.<\/span> <span class=\"sg\" data-s=\"2\">Tussen deze twee uitersten kun je met de bijwoorden elk detail regelen.<\/span><\/p>"]]},"es":{"t":"Adverbios de entrecomillado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puedes ajustar el comportamiento de una construcción de entrecomillado con <em>adverbios<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Cada característica del entrecomillado tiene su propio adverbio, que activa o desactiva solo esa característica.<\/span> <span class=\"sg\" data-s=\"2\">Las características son interpolar escalares, ejecutar closures (código entre llaves) y procesar barras invertidas.<\/span> <span class=\"sg\" data-s=\"3\">Así puedes empezar desde <code>q<\/code> o <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Luego vuelves a añadir exactamente las características que necesitas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Algunos adverbios comunes:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpola variables escalares (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpola código en <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — procesa secuencias de escape con barra invertida como <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Añade un adverbio a <code>q<\/code> para activar una sola característica.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, permite código entre llaves pero nada más:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Con <code>q<\/code> simple, <code>{ 3 * 4 }<\/code> se imprime exactamente como está escrito.<\/span> <span class=\"sg\" data-s=\"1\">Solo <code>:c<\/code> hace que el bloque se ejecute e inserta su valor.<\/span> <span class=\"sg\" data-s=\"2\">Una <code>$variable<\/code>, en cambio, seguiría igual.<\/span> <span class=\"sg\" data-s=\"3\">Observa los delimitadores <code>/…/<\/code> aquí.<\/span> <span class=\"sg\" data-s=\"4\">También podrías usar <code>{…}<\/code> como delimitadores, y el código compilaría igual.<\/span> <span class=\"sg\" data-s=\"5\">El compilador cuenta bien las llaves anidadas.<\/span> <span class=\"sg\" data-s=\"6\">Pero entonces el <code>{ 3 * 4 }<\/code> interior sería solo parte del texto, no un closure.<\/span> <span class=\"sg\" data-s=\"7\">Así que <code>:c<\/code> lo dejaría tal como está.<\/span> <span class=\"sg\" data-s=\"8\">Por eso, si el texto contiene un bloque <code>{ … }<\/code>, elige un delimitador distinto de <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Así el closure se ejecuta de verdad.<\/span> <span class=\"sg\" data-s=\"10\">También puedes añadir interpolación escalar a <code>Q<\/code>, que normalmente no cambia nada:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con un <code>!<\/code>, los adverbios también <strong>desactivan<\/strong> características.<\/span> <span class=\"sg\" data-s=\"1\">Aquí ves cómo usar <code>qq<\/code> y dejar <code>$<\/code> tal como está:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> es lo mismo que <code>Q<\/code> con todos los adverbios de interpolación activados.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> es lo mismo que <code>Q<\/code> con un conjunto más pequeño de ellos.<\/span> <span class=\"sg\" data-s=\"2\">Entre estos dos extremos, los adverbios te dejan controlar cada detalle.<\/span><\/p>"]]},"it":{"t":"Avverbi di quoting","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Puoi regolare il comportamento di un costrutto di quoting con gli <em>avverbi<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni funzionalità di quoting ha il suo avverbio, che attiva o disattiva solo quella funzionalità.<\/span> <span class=\"sg\" data-s=\"2\">Le funzionalità sono l'interpolazione degli scalari, l'esecuzione delle closure (codice tra parentesi graffe) e l'elaborazione dei backslash.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi partire da <code>q<\/code> o <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Poi aggiungi esattamente le funzionalità che ti servono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alcuni avverbi comuni:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpola le variabili scalari (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpola il codice in <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — gestisce le sequenze di escape con backslash come <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aggiungi un avverbio a <code>q<\/code> per attivare una sola funzionalità.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, permetti il codice tra parentesi graffe ma nient'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Con il semplice <code>q<\/code>, il <code>{ 3 * 4 }<\/code> viene stampato esattamente come è scritto.<\/span> <span class=\"sg\" data-s=\"1\">Solo <code>:c<\/code> fa eseguire il blocco e ne inserisce il valore.<\/span> <span class=\"sg\" data-s=\"2\">Una variabile come <code>$variable<\/code>, però, resterebbe comunque così com'è.<\/span> <span class=\"sg\" data-s=\"3\">Nota i delimitatori <code>/…/<\/code> qui.<\/span> <span class=\"sg\" data-s=\"4\">Potresti usare anche <code>{…}<\/code> come delimitatori, e il codice verrebbe compilato lo stesso.<\/span> <span class=\"sg\" data-s=\"5\">Il compilatore conta correttamente le parentesi graffe annidate.<\/span> <span class=\"sg\" data-s=\"6\">Ma allora il <code>{ 3 * 4 }<\/code> interno sarebbe solo una parte del testo, non una closure.<\/span> <span class=\"sg\" data-s=\"7\">Quindi <code>:c<\/code> lo lascerebbe così com'è.<\/span> <span class=\"sg\" data-s=\"8\">Perciò, se il testo contiene un blocco <code>{ … }<\/code>, scegli un delimitatore diverso da <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Allora la closure viene davvero eseguita.<\/span> <span class=\"sg\" data-s=\"10\">Puoi anche aggiungere l'interpolazione degli scalari a <code>Q<\/code>, che di solito non cambia niente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con un <code>!<\/code>, gli avverbi possono anche <strong>disattivare<\/strong> le funzionalità.<\/span> <span class=\"sg\" data-s=\"1\">Ecco come usare <code>qq<\/code> ma lasciare <code>$<\/code> così com'è:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> è uguale a <code>Q<\/code> con tutti gli avverbi di interpolazione attivati.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> è uguale a <code>Q<\/code> con un gruppo più piccolo di avverbi.<\/span> <span class=\"sg\" data-s=\"2\">Tra questi due estremi, gli avverbi ti permettono di controllare ogni dettaglio.<\/span><\/p>"]]},"lv":{"t":"Citēšanas apzīmētāji","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Citēšanas konstrukcijas uzvedību var pielāgot ar <em>adverbiem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Katrai citēšanas funkcijai ir savs adverbs, kas ieslēdz vai izslēdz tieši šo funkciju.<\/span> <span class=\"sg\" data-s=\"2\">Šīs funkcijas ir skalāru interpolēšana, slēgumu (koda figūriekavās) izpilde un atpakaļsvītru apstrāde.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat sākt no <code>q<\/code> vai <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tad jūs pievienojat tieši tās funkcijas, kas jums vajadzīgas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Daži bieži lietotie adverbi:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpolē skalāros mainīgos (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpolē kodu <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — apstrādā atpakaļsvītras aizbēgšanas secības, piemēram, <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pievienojiet <code>q<\/code> vienu adverbu, lai ieslēgtu vienu funkciju.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, atļaujiet kodu figūriekavās, bet neko citu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — parasts q atstāj bloku neskartu\nsay q:c/result: {3 * 4}/; # result: 12        — :c izpilda bloku<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Ar parastu <code>q<\/code> bloks <code>{ 3 * 4 }<\/code> tiek izdrukāts tieši tā, kā uzrakstīts.<\/span> <span class=\"sg\" data-s=\"1\">Tikai <code>:c<\/code> liek blokam izpildīties un ievieto tā vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Turpretī <code>$mainīgais<\/code> joprojām paliktu tāds, kāds tas ir.<\/span> <span class=\"sg\" data-s=\"3\">Ievērojiet šeit norobežotājus <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jūs varētu izmantot arī <code>{…}<\/code> kā norobežotājus, un kods joprojām kompilētos.<\/span> <span class=\"sg\" data-s=\"5\">Kompilators pareizi saskaita ligzdotās figūriekavas.<\/span> <span class=\"sg\" data-s=\"6\">Bet tad iekšējais <code>{ 3 * 4 }<\/code> būtu tikai daļa no teksta, nevis slēgums.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc <code>:c<\/code> to atstātu tādu, kāds tas ir.<\/span> <span class=\"sg\" data-s=\"8\">Tātad, ja tekstā ir <code>{ … }<\/code> bloks, izvēlieties citu norobežotāju, nevis <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Tad slēgums patiešām izpildās.<\/span> <span class=\"sg\" data-s=\"10\">Jūs varat arī pievienot skalāro interpolēšanu formai <code>Q<\/code>, kas parasti neko nemaina:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>!<\/code> adverbi arī <strong>izslēdz<\/strong> funkcijas.<\/span> <span class=\"sg\" data-s=\"1\">Lūk, kā izmantot <code>qq<\/code>, bet atstāt <code>$<\/code> tādu, kāds tas ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> ir tas pats, kas <code>Q<\/code> ar visiem ieslēgtiem interpolēšanas adverbiem.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> ir tas pats, kas <code>Q<\/code> ar mazāku to kopu.<\/span> <span class=\"sg\" data-s=\"2\">Starp šiem diviem galiem adverbi ļauj jums kontrolēt katru detaļu.<\/span><\/p>"]]},"ru":{"t":"Наречия кавычек","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Поведение конструкции цитирования можно настроить с помощью <em>наречий<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">У каждой возможности цитирования есть своё наречие, которое включает или выключает именно эту возможность.<\/span> <span class=\"sg\" data-s=\"2\">Возможности такие: интерполяция скаляров, выполнение замыканий (кода в фигурных скобках) и обработка обратных слэшей.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно начать с <code>q<\/code> или <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Потом вы добавляете обратно ровно те возможности, которые вам нужны.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Некоторые распространённые наречия:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — интерполировать скалярные переменные (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — интерполировать код в <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обрабатывать управляющие последовательности с обратным слэшем, такие как <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавьте одно наречие к <code>q<\/code>, чтобы включить одну возможность.<\/span> <span class=\"sg\" data-s=\"1\">Например, разрешите код в фигурных скобках, но больше ничего:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">С простым <code>q<\/code> блок <code>{ 3 * 4 }<\/code> печатается точно так, как написан.<\/span> <span class=\"sg\" data-s=\"1\">Только <code>:c<\/code> заставляет блок выполниться и вставляет его значение.<\/span> <span class=\"sg\" data-s=\"2\">А вот <code>$переменная<\/code> всё равно осталась бы как есть.<\/span> <span class=\"sg\" data-s=\"3\">Обратите внимание на разделители <code>/…/<\/code> здесь.<\/span> <span class=\"sg\" data-s=\"4\">Можно было бы использовать как разделители и <code>{…}<\/code>, и код всё равно бы скомпилировался.<\/span> <span class=\"sg\" data-s=\"5\">Компилятор правильно считает вложенные фигурные скобки.<\/span> <span class=\"sg\" data-s=\"6\">Но тогда внутренний <code>{ 3 * 4 }<\/code> был бы просто частью текста, а не замыканием.<\/span> <span class=\"sg\" data-s=\"7\">Поэтому <code>:c<\/code> оставил бы его как есть.<\/span> <span class=\"sg\" data-s=\"8\">Так что если в тексте есть блок <code>{ … }<\/code>, выберите любой разделитель, кроме <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Тогда замыкание действительно выполнится.<\/span> <span class=\"sg\" data-s=\"10\">Ещё к <code>Q<\/code>, который обычно ничего не меняет, можно добавить интерполяцию скаляров:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С помощью <code>!<\/code> наречия также <strong>выключают<\/strong> возможности.<\/span> <span class=\"sg\" data-s=\"1\">Вот как использовать <code>qq<\/code>, но оставить <code>$<\/code> как есть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> — то же самое, что <code>Q<\/code> со всеми включёнными наречиями интерполяции.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> — то же самое, что <code>Q<\/code> с меньшим их набором.<\/span> <span class=\"sg\" data-s=\"2\">Между этими двумя крайностями наречия позволяют управлять каждой деталью.<\/span><\/p>"]]},"uk":{"t":"Наріччя цитування","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Поведінку конструкції цитування можна налаштувати <em>наріччями<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Кожна можливість цитування має своє наріччя, яке вмикає або вимикає саме її.<\/span> <span class=\"sg\" data-s=\"2\">Ці можливості — інтерполяція скалярів, виконання замикань (коду у фігурних дужках) та обробка зворотних косих рисок.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете почати з <code>q<\/code> або <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Потім ви додаєте саме ті можливості, які вам потрібні.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Кілька поширених наріч:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — інтерполювати скалярні змінні (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — інтерполювати код у <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обробляти екрановані послідовності, такі як <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Додайте до <code>q<\/code> одне наріччя, щоб увімкнути одну можливість.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, дозвольте код у фігурних дужках, але більше нічого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — звичайний q залишає блок недоторканим\nsay q:c/result: {3 * 4}/; # result: 12        — :c виконує блок<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Зі звичайним <code>q<\/code> вираз <code>{ 3 * 4 }<\/code> виводиться точно так, як записаний.<\/span> <span class=\"sg\" data-s=\"1\">Лише <code>:c<\/code> змушує блок виконатися й вставляє його значення.<\/span> <span class=\"sg\" data-s=\"2\">А от <code>$змінна<\/code> все одно лишилася б без змін.<\/span> <span class=\"sg\" data-s=\"3\">Зверніть увагу на роздільники <code>/…/<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Як роздільники можна взяти й <code>{…}<\/code>, і код однаково скомпілюється.<\/span> <span class=\"sg\" data-s=\"5\">Компілятор правильно рахує вкладені фігурні дужки.<\/span> <span class=\"sg\" data-s=\"6\">Але тоді внутрішнє <code>{ 3 * 4 }<\/code> було б просто частиною тексту, а не замиканням.<\/span> <span class=\"sg\" data-s=\"7\">Тож <code>:c<\/code> залишило б його без змін.<\/span> <span class=\"sg\" data-s=\"8\">Отже, якщо текст містить блок <code>{ … }<\/code>, обирайте інший роздільник, не <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Тоді замикання справді виконається.<\/span> <span class=\"sg\" data-s=\"10\">Також можна додати інтерполяцію скалярів до <code>Q<\/code>, який зазвичай нічого не змінює:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Зі знаком <code>!<\/code> наріччя також <strong>вимикають<\/strong> можливості.<\/span> <span class=\"sg\" data-s=\"1\">Ось як використати <code>qq<\/code>, але залишити <code>$<\/code> як є:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> — це те саме, що <code>Q<\/code> з усіма увімкненими наріччями інтерполяції.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> — це те саме, що <code>Q<\/code> з меншим їх набором.<\/span> <span class=\"sg\" data-s=\"2\">Між цими двома кінцями наріччя дають вам керувати кожною деталлю.<\/span><\/p>"]]},"bg":{"t":"Наречия за цитиране","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Можете да настроите поведението на конструкция за цитиране с <em>наречия<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Всяка функция на цитирането има свое наречие, което включва или изключва само тази функция.<\/span> <span class=\"sg\" data-s=\"2\">Функциите са интерполиране на скалари, изпълнение на затваряния (код във фигурни скоби) и обработка на обратни наклонени черти.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да започнете от <code>q<\/code> или <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">После добавяте обратно точно функциите, от които имате нужда.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Някои често срещани наречия:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — интерполиране на скаларни променливи (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — интерполиране на код в <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — обработка на екраниращи последователности като <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Добавете едно наречие към <code>q<\/code>, за да включите една функция.<\/span> <span class=\"sg\" data-s=\"1\">Например разрешете код във фигурни скоби, но нищо друго:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — обикновено q оставя блока непроменен\nsay q:c/result: {3 * 4}/; # result: 12        — :c изпълнява блока<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">С обикновено <code>q<\/code> блокът <code>{ 3 * 4 }<\/code> се отпечатва точно както е написан.<\/span> <span class=\"sg\" data-s=\"1\">Само <code>:c<\/code> кара блока да се изпълни и вмъква стойността му.<\/span> <span class=\"sg\" data-s=\"2\"><code>$variable<\/code> обаче пак би останала непроменена.<\/span> <span class=\"sg\" data-s=\"3\">Обърнете внимание на разделителите <code>/…/<\/code> тук.<\/span> <span class=\"sg\" data-s=\"4\">Можете да използвате и <code>{…}<\/code> като разделители и кодът пак ще се компилира.<\/span> <span class=\"sg\" data-s=\"5\">Компилаторът брои вложените фигурни скоби правилно.<\/span> <span class=\"sg\" data-s=\"6\">Но тогава вътрешният <code>{ 3 * 4 }<\/code> би бил просто част от текста, а не затваряне.<\/span> <span class=\"sg\" data-s=\"7\">Затова <code>:c<\/code> би го оставило непроменено.<\/span> <span class=\"sg\" data-s=\"8\">Така че ако текстът съдържа блок <code>{ … }<\/code>, изберете разделител, различен от <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Тогава затварянето наистина се изпълнява.<\/span> <span class=\"sg\" data-s=\"10\">Можете да добавите и интерполиране на скалари към <code>Q<\/code>, който обикновено не променя нищо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>!<\/code> наречията също <strong>изключват<\/strong> функции.<\/span> <span class=\"sg\" data-s=\"1\">Ето как да използвате <code>qq<\/code>, но да запазите <code>$<\/code> непроменен:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> е същото като <code>Q<\/code> с включени всички наречия за интерполация.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> е същото като <code>Q<\/code> с по-малък набор от тях.<\/span> <span class=\"sg\" data-s=\"2\">Между тези два края наречията ви позволяват да контролирате всеки детайл.<\/span><\/p>"]]},"eo":{"t":"Citaj adverboj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi povas agordi la konduton de cita konstruaĵo per <em>adverboj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu cita funkcio havas sian propran adverbon, kiu ŝaltas aŭ malŝaltas tiun unu funkcion.<\/span> <span class=\"sg\" data-s=\"2\">La funkcioj estas interpoli skalarojn, ruli fermojn (kodon en krampoj) kaj prilabori maldekstrajn streketojn.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas komenci de <code>q<\/code> aŭ <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Poste vi aldonas reen ĝuste la funkciojn, kiujn vi bezonas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kelkaj oftaj adverboj:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — interpoli skalarajn variablojn (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — interpoli kodon en <code>{ … }<\/code><\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — trakti maldekstre-streketajn eskapojn kiel <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aldonu unu adverbon al <code>q<\/code> por ŝalti unu solan funkcion.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, permesu kodon en krampoj, sed nenion alian:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — simpla q lasas la blokon netuŝita\nsay q:c/result: {3 * 4}/; # result: 12        — :c ruligas la blokon<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Kun simpla <code>q<\/code>, la <code>{ 3 * 4 }<\/code> estas presita ĝuste kiel skribita.<\/span> <span class=\"sg\" data-s=\"1\">Nur <code>:c<\/code> igas la blokon ruliĝi kaj enmetas ĝian valoron.<\/span> <span class=\"sg\" data-s=\"2\"><code>$variablo<\/code> tamen ankoraŭ restus sen ŝanĝo.<\/span> <span class=\"sg\" data-s=\"3\">Rimarku la limigilojn <code>/…/<\/code> ĉi tie.<\/span> <span class=\"sg\" data-s=\"4\">Vi povus uzi ankaŭ <code>{…}<\/code> kiel limigilojn, kaj la kodo tamen kompiliĝus.<\/span> <span class=\"sg\" data-s=\"5\">La kompililo ĝuste nombras la nestitajn krampojn.<\/span> <span class=\"sg\" data-s=\"6\">Sed tiam la interna <code>{ 3 * 4 }<\/code> estus nur parto de la teksto, ne fermo.<\/span> <span class=\"sg\" data-s=\"7\">Do <code>:c<\/code> lasus ĝin sen ŝanĝo.<\/span> <span class=\"sg\" data-s=\"8\">Do se la teksto enhavas <code>{ … }<\/code>-blokon, elektu limigilon alian ol <code>{…}<\/code>.<\/span> <span class=\"sg\" data-s=\"9\">Tiam la fermo vere ruliĝas.<\/span> <span class=\"sg\" data-s=\"10\">Vi ankaŭ povas aldoni skalaran interpoladon al <code>Q<\/code>, kiu normale ŝanĝas nenion:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <code>!<\/code>, adverboj ankaŭ <strong>malŝaltas<\/strong> funkciojn.<\/span> <span class=\"sg\" data-s=\"1\">Jen kiel uzi <code>qq<\/code>, sed teni <code>$<\/code> sen ŝanĝo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> estas la sama kiel <code>Q<\/code> kun ĉiuj interpolaj adverboj ŝaltitaj.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> estas la sama kiel <code>Q<\/code> kun pli malgranda aro da ili.<\/span> <span class=\"sg\" data-s=\"2\">Inter ĉi tiuj du finoj, la adverboj lasas vin regi ĉiun detalon.<\/span><\/p>"]]},"la":{"t":"Adverbia quotationis","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Modum constructionis citandi <em>adverbiis<\/em> temperare potes.<\/span> <span class=\"sg\" data-s=\"1\">Quaeque proprietas citandi suum adverbium habet, quod illam unam proprietatem accendit vel exstinguit.<\/span> <span class=\"sg\" data-s=\"2\">Proprietates sunt interpolatio scalarium, executio clausurarum (codicis in uncis), et tractatio obliquorum reversorum.<\/span> <span class=\"sg\" data-s=\"3\">Itaque a <code>q<\/code> vel <code>Q<\/code> incipere potes.<\/span> <span class=\"sg\" data-s=\"4\">Deinde exacte eas proprietates rursus addis quas requiris.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nonnulla adverbia communia:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>:s<\/code> / <code>:scalar<\/code> — variabiles scalares interpola (<code>$x<\/code>)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>:c<\/code> / <code>:closure<\/code> — codicem in <code>{ … }<\/code> interpola<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>:b<\/code> / <code>:backslash<\/code> — effugia per obliquum reversum tracta, ut <code>\\n<\/code><\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Adde unum adverbium ad <code>q<\/code> ut unam proprietatem accendas.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, codicem in uncis permitte sed nihil aliud:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say q/result: {3 * 4}/;   # result: {3 * 4}  — plain q leaves the block untouched\nsay q:c/result: {3 * 4}/; # result: 12        — :c runs the block<\/code><\/pre>"],["p",11,"<p><span class=\"sg\" data-s=\"0\">Cum simplici <code>q<\/code>, <code>{ 3 * 4 }<\/code> exacte ut scriptum est imprimitur.<\/span> <span class=\"sg\" data-s=\"1\">Solum <code>:c<\/code> claustrum exsequitur et valorem eius inserit.<\/span> <span class=\"sg\" data-s=\"2\"><code>$variable<\/code> tamen adhuc ut est maneret.<\/span> <span class=\"sg\" data-s=\"3\">Nota delimitatores <code>/…/<\/code> hic.<\/span> <span class=\"sg\" data-s=\"4\">Etiam <code>{…}<\/code> ut delimitatores adhibere posses, et codex adhuc compilaretur.<\/span> <span class=\"sg\" data-s=\"5\">Compilator uncos inclusos recte numerat.<\/span> <span class=\"sg\" data-s=\"6\">Sed tum interior <code>{ 3 * 4 }<\/code> solum pars textus esset, non clausura.<\/span> <span class=\"sg\" data-s=\"7\">Itaque <code>:c<\/code> eum ut est relinqueret.<\/span> <span class=\"sg\" data-s=\"8\">Ergo si textus claustrum <code>{ … }<\/code> continet, delimitatorem alium quam <code>{…}<\/code> elige.<\/span> <span class=\"sg\" data-s=\"9\">Tum clausura re vera currit.<\/span> <span class=\"sg\" data-s=\"10\">Etiam interpolationem scalarem ad formam <code>Q<\/code> addere potes, quae normaliter nihil mutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $name = 'Anna';\nsay Q:s{Hi, $name}; # Hi, Anna<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum <code>!<\/code> adverbia etiam proprietates <strong>exstinguunt<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sic <code>qq<\/code> adhibes sed <code>$<\/code> ut est servas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $price = 5;\nsay qq:!s{costs $price dollars}; # costs $price dollars<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>qq<\/code> idem est ac <code>Q<\/code> cum omnibus adverbiis interpolationis accensis.<\/span> <span class=\"sg\" data-s=\"1\"><code>q<\/code> idem est ac <code>Q<\/code> cum minore numero eorum.<\/span> <span class=\"sg\" data-s=\"2\">Inter hos duos fines adverbia tibi permittunt singula omnia regere.<\/span><\/p>"]]}}}</script>
