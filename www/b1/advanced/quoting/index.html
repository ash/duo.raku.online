<script type="application/json" id="page-data">{"u":"advanced/quoting","n":465,"k":"section","pv":"advanced/strings/exercises/find-domain/solution","nx":"advanced/quoting/q-qq-big-q","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quoting constructs","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you used <a href=\"/essentials/strings/\">single and double quotes to write strings<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">They are the two most common members of a whole family of <em>quoting constructs<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">With them, you can build strings with exactly the amount of processing you want.<\/span> <span class=\"sg\" data-s=\"3\">This goes from “take every character literally” to “interpolate variables, escapes, and even embedded code”.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This section covers the three base forms <code>q<\/code>, <code>qq<\/code> and <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It also covers the adverbs that adjust them, and <em>heredocs<\/em> for text with several lines.<\/span><\/p>"]]},"de":{"t":"Quoting-Konstrukte","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Im Grundlagenteil hast du <a href=\"https://course.raku.org/de/essentials/strings/\" target=\"_blank\" rel=\"noopener\">einfache und doppelte Anführungszeichen zum Schreiben von Strings<\/a> benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind die zwei häufigsten Mitglieder einer ganzen Familie von <em>Quoting-Konstrukten<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Mit ihnen kannst du Strings bauen, die genau so viel verarbeitet werden, wie du willst.<\/span> <span class=\"sg\" data-s=\"3\">Das geht von „nimm jedes Zeichen wörtlich“ bis „interpoliere Variablen, Escape-Sequenzen und sogar eingebetteten Code“.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die drei Grundformen <code>q<\/code>, <code>qq<\/code> und <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Er behandelt auch die Adverbien, die sie anpassen, und <em>Heredocs<\/em> für Text mit mehreren Zeilen.<\/span><\/p>"]]},"nl":{"t":"Aanhalingsconstructies","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials gebruikte je <a href=\"https://course.raku.org/nl/essentials/strings/\" target=\"_blank\" rel=\"noopener\">enkele en dubbele aanhalingstekens om strings te schrijven<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn de twee meest gebruikte leden van een hele familie van <em>quoting-constructies<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Daarmee kun je strings maken met precies zoveel verwerking als je wilt.<\/span> <span class=\"sg\" data-s=\"3\">Dat gaat van \"neem elk teken letterlijk\" tot \"interpoleer variabelen, escapes en zelfs ingebedde code\".<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel behandelt de drie basisvormen <code>q<\/code>, <code>qq<\/code> en <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het behandelt ook de bijwoorden die ze aanpassen, en <em>heredocs<\/em> voor tekst met meerdere regels.<\/span><\/p>"]]},"es":{"t":"Construcciones de entrecomillado","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, usaste <a href=\"https://course.raku.org/es/essentials/strings/\" target=\"_blank\" rel=\"noopener\">comillas simples y dobles para escribir cadenas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Son los dos miembros más comunes de toda una familia de <em>construcciones de entrecomillado<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Con ellas, puedes construir cadenas con exactamente el procesamiento que quieres.<\/span> <span class=\"sg\" data-s=\"3\">Esto va desde «tomar cada carácter literalmente» hasta «interpolar variables, secuencias de escape e incluso código incrustado».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata las tres formas base <code>q<\/code>, <code>qq<\/code> y <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También trata los adverbios que las ajustan, y los <em>heredocs<\/em> para texto con varias líneas.<\/span><\/p>"]]},"it":{"t":"Costrutti di quoting","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai usato <a href=\"https://course.raku.org/it/essentials/strings/\" target=\"_blank\" rel=\"noopener\">virgolette singole e doppie per scrivere stringhe<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sono i due membri più comuni di un'intera famiglia di <em>costrutti di quoting<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Con questi costrutti puoi costruire stringhe con esattamente la quantità di elaborazione che vuoi.<\/span> <span class=\"sg\" data-s=\"3\">Si va da \"prendi ogni carattere letteralmente\" a \"interpola variabili, sequenze di escape e anche codice incorporato\".<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta le tre forme base <code>q<\/code>, <code>qq<\/code> e <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tratta anche gli avverbi che le regolano, e gli <em>heredoc<\/em> per il testo su più righe.<\/span><\/p>"]]},"lv":{"t":"Citēšanas konstrukcijas 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">vienpēdiņas un dubultpēdiņas, lai rakstītu virknes<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir divi biežākie veselas <em>citēšanas konstrukciju<\/em> saimes locekļi.<\/span> <span class=\"sg\" data-s=\"2\">Ar tām jūs varat veidot virknes ar tieši tik daudz apstrādes, cik vēlaties.<\/span> <span class=\"sg\" data-s=\"3\">Tas sniedzas no \"ņem katru rakstzīmi burtiski\" līdz \"interpolē mainīgos, aizbēgšanas secības un pat iegultu kodu\".<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko trīs bāzes formas <code>q<\/code>, <code>qq<\/code> un <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā aplūko arī adverbus, kas tās pielāgo, un <em>heredoc<\/em> konstrukcijas tekstam ar vairākām rindām.<\/span><\/p>"]]},"ru":{"t":"Конструкции кавычек","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В части «Основы» вы использовали <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарные и двойные кавычки для записи строк<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Это два самых частых представителя целого семейства <em>конструкций цитирования<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">С ними можно строить строки ровно с той обработкой, которая вам нужна.<\/span> <span class=\"sg\" data-s=\"3\">Обработка бывает разной: от «брать каждый символ буквально» до «интерполировать переменные, управляющие последовательности и даже встроенный код».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот раздел рассказывает о трёх базовых формах: <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он рассказывает о наречиях, которые их настраивают, и о <em>heredoc'ах<\/em> для текста в несколько строк.<\/span><\/p>"]]},"uk":{"t":"Конструкції цитування","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви використовували <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">одинарні та подвійні лапки для запису рядків<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Це два найпоширеніші представники цілої родини <em>конструкцій цитування<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">З ними можна будувати рядки саме з тим обсягом обробки, який вам потрібен.<\/span> <span class=\"sg\" data-s=\"3\">Вибір — від «сприймай кожен символ буквально» до «інтерполюй змінні, екрановані послідовності й навіть вбудований код».<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей розділ розглядає три базові форми <code>q<\/code>, <code>qq<\/code> і <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він також розглядає наріччя, які їх налаштовують, і <em>heredoc<\/em>-и для тексту з кількох рядків.<\/span><\/p>"]]},"bg":{"t":"Конструкции за цитиране 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" използвахте <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">единични и двойни кавички за писане на низове<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Те са двата най-често срещани члена на цяло семейство от <em>конструкции за цитиране<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">С тях можете да създавате низове с точно толкова обработка, колкото искате.<\/span> <span class=\"sg\" data-s=\"3\">Това стига от „приеми всеки символ буквално\" до „интерполирай променливи, екраниращи последователности и дори вграден код\".<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази секция разглежда трите основни форми <code>q<\/code>, <code>qq<\/code> и <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя разглежда и наречията, които ги настройват, и <em>heredoc<\/em> за текст с няколко реда.<\/span><\/p>"]]},"eo":{"t":"Citaj konstruoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">En la parto Essentials, vi uzis <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">unuopajn kaj duoblajn citilojn por skribi ĉenojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas la du plej oftaj membroj de tuta familio de <em>citaj konstruaĵoj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per ili vi povas konstrui ĉenojn kun ĝuste tiom da prilaborado, kiom vi volas.<\/span> <span class=\"sg\" data-s=\"3\">Tio iras de “prenu ĉiun signon laŭlitere” ĝis “interpolu variablojn, eskapojn kaj eĉ kodon ene de la teksto”.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la tri bazajn formojn <code>q<\/code>, <code>qq<\/code> kaj <code>Q<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ traktas la adverbojn, kiuj agordas ilin, kaj <em>heredoc<\/em>-ojn por teksto kun pluraj linioj.<\/span><\/p>"]]},"la":{"t":"Constructiones quotationis","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">apostrophos simplices et duplices ad series scribendas<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Hi sunt duo membra maxime communia totius familiae <em>constructionum citandi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Cum eis series aedificare potes cum exacta quantitate processus quam vis.<\/span> <span class=\"sg\" data-s=\"3\">Hoc it ab “omnem characterem ad litteram sume” usque ad “variabiles, effugia, atque etiam codicem insertum interpola”.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sectio tres formas fundamentales <code>q<\/code>, <code>qq<\/code> et <code>Q<\/code> tractat.<\/span> <span class=\"sg\" data-s=\"1\">Etiam adverbia tractat quae eas mutant, et <em>heredocs<\/em> pro textu plurium linearum.<\/span><\/p>"]]}}}</script>
