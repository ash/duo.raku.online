ode> ĝis <code>255<\/code>, do ĝi havas 256 malsamajn valorojn. Praktike, aritmetiko kun ĝi okazas laŭ modulo 256.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>250 + 10<\/code> estus <code>260<\/code>, kio ne konvenas. Do la valoro ĉirkaŭvolviĝas kaj alvenas <code>260 - 256 = 4<\/code> super la malsupro. Tio signifas, ke superfluo ne temas nur pri unu paŝo super la supro. Ĉiu rezulto ekster la intervalo estas revenigita en ĝin.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Iri en la alian direkton ankaŭ kaŭzas superfluon. En sensigna tipo, malpliigi <code>0<\/code> ne povas doni <code>-1<\/code>. Do ĝi ĉirkaŭvolviĝas al la maksimumo, <code>255<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Circumvolvere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 250;\n$u += 10;\nsay $u;\n\nmy uint8 $v = 0;\n$v--;\nsay $v;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/wrap-around.raku\" target=\"_blank\" rel=\"noopener\">wrap-around.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>4\n255<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>uint8<\/code> ab <code>0<\/code> ad <code>255<\/code> pertinet, itaque 256 valores diversos habet. Re vera arithmetica in eo modulo 256 fit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>250 + 10<\/code> esset <code>260<\/code>, qui locum non habet. Itaque valor circumvolvitur et ad <code>260 - 256 = 4<\/code> supra imum pervenit. Hoc significat superfluxum non solum de uno gradu ultra summum esse. Quilibet eventus extra ambitum in eum reducitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Etiam in alteram partem ire superfluxum facit. In typo non signato decrementum <code>0<\/code> non potest <code>-1<\/code> dare. Itaque ad maximum, <code>255<\/code>, circumvolvitur.<\/span><\/li><\/ol>"]]}}}</script>
