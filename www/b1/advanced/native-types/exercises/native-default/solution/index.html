\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>num<\/code> nativo no puede ser indefinido. Así que, como un <code>int<\/code> nativo, empieza en <code>0<\/code> y no en <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Un <code>str<\/code> nativo empieza como la cadena vacía. Por eso no hay nada entre los corchetes en la salida. Ninguno de los tipos nativos guarda nunca un valor indefinido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los nombres de tipo son muy importantes aquí. Si los quitas y escribes <code>my $n; my $s;<\/code>, las variables se convierten en contenedores ordinarios. Empiezan <em>indefinidas<\/em> (<code>Any<\/code>). Entonces <code>say $n<\/code> imprime <code>(Any)<\/code>. Interpolar el <code>$s<\/code> indefinido también da una advertencia: <em>\"Use of uninitialized value … in string context\"<\/em>. Solo los tipos nativos <code>num<\/code> y <code>str<\/code> dan los valores por defecto <code>0<\/code> y la cadena vacía.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Il valore predefinito nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><co com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>num<\/code> nevar būt nedefinēts. Tāpēc, tāpat kā natīvais <code>int<\/code>, tas sākas ar <code>0<\/code>, nevis ar <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Natīvais <code>str<\/code> sākas kā tukša virkne. Tāpēc izvadē starp iekavām nav nekā. Neviens no natīvajiem tipiem nekad nesatur nedefinētu vērtību.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tipu nosaukumi šeit ir ļoti svarīgi. Ja jūs tos noņemat un uzrakstāt <code>my $n; my $s;<\/code>, mainīgie kļūst par parastiem konteineriem. Tie sākas kā <em>nedefinēti<\/em> (<code>Any<\/code>). Tad <code>say $n<\/code> izdrukā <code>(Any)<\/code>. Nedefinētā <code>$s<\/code> interpolēšana arī dod brīdinājumu: <em>\"Use of uninitialized value … in string context\"<\/em>. Tikai natīvie tipi <code>num<\/code> un <code>str<\/code> dod noklusējuma vērtības <code>0<\/code> un tukšo virkni.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Значение по умолчанию нативного типа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативный <code>num<\/code> не может быть неопределённым. Поэтому, как и нативный <code>int<\/code>, он начинается с <code>0<\/code>, а не с <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативный <code>str<\/code> начинается как пустая строка. Вот почему в выводе между скобками ничего нет. Ни один нативный тип никогда не хранит неопределённое значение.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Имена типов здесь очень важны. Если убрать их и написать <code>my $n; my $s;<\/code>, переменные станут обычными контейнерами. Сначала они <em>неопределённые<\/em> (<code>Any<\/code>). Тогда <code>say $n<\/code> печатает <code>(Any)<\/code>. Интерполяция неопределённой <code>$s<\/code> к тому же даёт предупреждение: <em>«Use of uninitialized value … in string context»<\/em>. Только нативные типы <code>num<\/code> и <code>str<\/code> дают значения по умолчанию <code>0<\/code> и пустую строку.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Типове значення машинного типу","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>num<\/code> не може бути невизначеним. Тож, як і машинний <code>int<\/code>, він починає з <code>0<\/code>, а не з <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Машинний <code>str<\/code> починає з порожнього рядка. Саме тому у виводі між дужками нічого немає. Жоден машинний тип ніколи не містить невизначеного значення.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Назви типів тут дуже важливі. Якщо прибрати їх і написати <code>my $n; my $s;<\/code>, змінні стануть звичайними контейнерами. Спочатку вони <em>невизначені<\/em> (<code>Any<\/code>). Тоді <code>say $n<\/code> виводить <code>(Any)<\/code>. Інтерполяція невизначеної <code>$s<\/code> теж дає попередження: <em>«Use of uninitialized value … in string context»<\/em>. Тільки машинні типи <code>num<\/code> і <code>str<\/code> дають типові значення <code>0<\/code> і порожній рядок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Нативна стойност по подразбиране","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативният <code>num<\/code> не може да бъде недефиниран. Затова, както нативният <code>int<\/code>, той започва от <code>0<\/code>, а не от <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативният <code>str<\/code> започва като празен низ. Затова в изхода между скобите няма нищо. Никой от нативните типове никога не съдържа недефинирана стойност.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Имената на типовете са много важни тук. Ако ги премахнете и напишете <code>my $n; my $s;<\/code>, променливите стават обикновени контейнери. Те започват като <em>недефинирани<\/em> (<code>Any<\/code>). Тогава <code>say $n<\/code> отпечатва <code>(Any)<\/code>. Интерполирането на недефинираната <code>$s<\/code> също дава предупреждение: <em>\"Use of uninitialized value … in string context\"<\/em>. Само нативните типове <code>num<\/code> и <code>str<\/code> дават стойностите по подразбиране <code>0<\/code> и празен низ.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: La denaska defaŭlto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>num<\/code> ne povas esti nedefinita. Do, same kiel indiĝena <code>int<\/code>, ĝi komenciĝas je <code>0<\/code> kaj ne je <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Indiĝena <code>str<\/code> komenciĝas kiel la malplena ĉeno. Tial estas nenio inter la krampoj en la eligo. Neniu el la indiĝenaj tipoj iam tenas nedefinitan valoron.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La nomoj de la tipoj estas tre gravaj ĉi tie. Se vi forigas ilin kaj skribas <code>my $n; my $s;<\/code>, la variabloj fariĝas ordinaraj ujoj. Komence ili estas <em>nedefinitaj<\/em> (<code>Any<\/code>). Tiam <code>say $n<\/code> presas <code>(Any)<\/code>. Interpoli la nedefinitan <code>$s<\/code> ankaŭ donas averton: <em>“Use of uninitialized value … in string context”<\/em>. Nur la indiĝenaj tipoj <code>num<\/code> kaj <code>str<\/code> donas la defaŭltajn valorojn <code>0<\/code> kaj la malplenan ĉenon.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Praedefinitum nativum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my num $n;\nmy str $s;\n\nsay $n;\nsay \"[$s]\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-default.raku\" target=\"_blank\" rel=\"noopener\">native-default.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>0\n[]<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>num<\/code> indefinitus esse non potest. Itaque, sicut nativus <code>int<\/code>, a <code>0<\/code> incipit, non a <code>(Num)<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nativus <code>str<\/code> ut chorda vacua incipit. Ideo nihil inter parentheses in eventu apparet. Nullus typorum nativorum umquam valorem indefinitum continet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nomina typorum hic valde necessaria sunt. Si ea removes et <code>my $n; my $s;<\/code> scribis, variabiles receptacula ordinaria fiunt. Initio <em>indefinitae<\/em> sunt (<code>Any<\/code>). Tum <code>say $n<\/code> imprimit <code>(Any)<\/code>. Interpolatio indefinitae <code>$s<\/code> etiam monitum dat: <em>\"Use of uninitialized value … in string context\"<\/em>. Soli typi nativi <code>num<\/code> et <code>str<\/code> valores defaltos <code>0<\/code> et chordam vacuam dant.<\/span><\/li><\/ol>"]]}}}</script>
