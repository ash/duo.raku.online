gned byte is. Die neemt weinig geheugen in, en dat is goed voor binaire gegevens.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De wrap-around-grens <code>0..255<\/code> geldt voor elk <em>element<\/em>, maar niet voor hun som. <code>.sum<\/code> boxt het totaal in een gewoon <code>Int<\/code>. Zo geeft <code>100 + 200 + 255<\/code> de volledige <code>555<\/code>.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un array nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 @bytes = 100, 200, 255;\nsay @bytes.sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Encuentra el programa en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El tipo nativo con tamaño <code>uint8<\/code> va antes del array <code>@<\/code>. Esto declara un array donde cada elemento es un solo byte sin signo. Ocupa poca memoria, lo cual es bueno para datos binarios.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El límite de desbordamiento <code>0..255<\/code> vale para cada <em>elemento<\/em>, pero no para su suma. <code>.sum<\/code> encapsula el total en un <code>Int<\/code> ordinario. Así que <code>100 + 200 + 255<\/code> da el <code>555<\/code> completo.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un array nativo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre cla vais tips ar fiksētu izmēru <code>uint8<\/code> atrodas pirms <code>@<\/code> masīva. Tas deklarē masīvu, kurā katrs elements ir viens neparakstīts baits. Tas aizņem maz atmiņas, un tas ir labi binārajiem datiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Apgriešanās robeža <code>0..255<\/code> attiecas uz katru <em>elementu<\/em>, bet ne uz to summu. <code>.sum<\/code> iesaiņo kopsummu parastā <code>Int<\/code>. Tāpēc <code>100 + 200 + 255<\/code> dod pilnu <code>555<\/code>.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Нативный массив","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение задачи.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 @bytes = 100, 200, 255;\nsay @bytes.sum;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/native-types/native-array.raku\" target=\"_blank\" rel=\"noopener\">native-array.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>555<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Нативный тип фиксированного размера <code>uint8<\/code> стоит перед массивом с <code>@<\/code>. Так объявляется массив, где каждый элемент — это один беззнаковый байт. Он занимает мало памяти, и это хорошо для двоичных данных.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Граница <code>0..255<\/code>, после которой значение идёт по кругу, действует для каждого <em>элемента<\/em>, но не для их суммы. <code>.sum<\/code> упаковывает итог в обычный <code>Int<\/code>. Поэтому <code>100 + 200 + 255<\/code> даёт полное значение <code>555<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Машинний масив","b":[["p",1,"<p><span clas
