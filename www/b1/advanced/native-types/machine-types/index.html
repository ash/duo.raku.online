<script type="application/json" id="page-data">{"u":"advanced/native-types/machine-types","n":443,"k":"topic","pv":"advanced/native-types","nx":"advanced/native-types/machine-types/quiz","tr":["advanced","advanced/native-types"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Machine-level types","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">The names of the native types are in lower case: <code>int<\/code>, <code>num<\/code> and <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You use them to declare a variable, just like <code>Int<\/code> or <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A native value matches a machine register or word directly.<\/span> <span class=\"sg\" data-s=\"1\">It has no wrapper object, which a normal Raku value always has.<\/span> <span class=\"sg\" data-s=\"2\">This makes native types faster and smaller in memory.<\/span> <span class=\"sg\" data-s=\"3\">That matters in short loops that do a lot of calculations, and in large arrays.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You should know one thing right away: a native variable can never be undefined.<\/span> <span class=\"sg\" data-s=\"1\">An ordinary <code>Int<\/code> variable starts as the undefined <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">A native <code>int<\/code>, however, starts at <strong>zero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same is true for native arrays.<\/span> <span class=\"sg\" data-s=\"1\">You declare them by putting the native type before the <code>@<\/code> variable:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Such an array stores its elements as raw machine integers, not as boxed <code>Int<\/code> objects.<\/span> <span class=\"sg\" data-s=\"1\">So it uses less memory.<\/span> <span class=\"sg\" data-s=\"2\">When you ask a native value about itself, Raku automatically <em>boxes<\/em> it.<\/span> <span class=\"sg\" data-s=\"3\">It puts the value into the matching full type.<\/span> <span class=\"sg\" data-s=\"4\">That is why <code>(my int $b).WHAT<\/code> shows <code>(Int)<\/code>.<\/span><\/p>"]]},"de":{"t":"Maschinennahe Typen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Namen der nativen Typen sind kleingeschrieben: <code>int<\/code>, <code>num<\/code> und <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Du benutzt sie, um eine Variable zu deklarieren, genau wie <code>Int<\/code> oder <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein nativer Wert entspricht direkt einem Maschinenregister oder Maschinenwort.<\/span> <span class=\"sg\" data-s=\"1\">Er hat kein Wrapper-Objekt, das ein normaler Raku-Wert immer hat.<\/span> <span class=\"sg\" data-s=\"2\">Dadurch sind native Typen schneller und brauchen weniger Speicher.<\/span> <span class=\"sg\" data-s=\"3\">Das ist wichtig in kurzen Schleifen, die viel rechnen, und in großen Arrays.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Sache solltest du gleich wissen: Eine native Variable kann nie undefiniert sein.<\/span> <span class=\"sg\" data-s=\"1\">Eine normale <code>Int<\/code>-Variable beginnt als das undefinierte <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ein nativer <code>int<\/code> beginnt dagegen bei <strong>Null<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das Gleiche gilt für native Arrays.<\/span> <span class=\"sg\" data-s=\"1\">Du deklarierst sie, indem du den nativen Typ vor die <code>@<\/code>-Variable setzt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Solch ein Array speichert seine Elemente als rohe Maschinen-Ganzzahlen, nicht als geboxte <code>Int<\/code>-Objekte.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb braucht es weniger Speicher.<\/span> <span class=\"sg\" data-s=\"2\">Wenn du einen nativen Wert nach sich selbst fragst, <em>boxt<\/em> Raku ihn automatisch.<\/span> <span class=\"sg\" data-s=\"3\">Raku steckt den Wert in den passenden vollwertigen Typ.<\/span> <span class=\"sg\" data-s=\"4\">Darum zeigt <code>(my int $b).WHAT<\/code> den Typ <code>(Int)<\/code>.<\/span><\/p>"]]},"nl":{"t":"Typen op machineniveau","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">De namen van de native typen zijn in kleine letters: <code>int<\/code>, <code>num<\/code> en <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Je gebruikt ze om een variabele te declareren, net als <code>Int<\/code> of <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een native waarde past direct bij een machineregister of machinewoord.<\/span> <span class=\"sg\" data-s=\"1\">Die heeft geen wrapper-object, dat een normale Raku-waarde altijd wel heeft.<\/span> <span class=\"sg\" data-s=\"2\">Daardoor zijn native typen sneller en nemen ze minder geheugen in.<\/span> <span class=\"sg\" data-s=\"3\">Dat is belangrijk in korte lussen die veel berekeningen doen, en in grote arrays.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén ding moet je meteen weten: een native variabele kan nooit ongedefinieerd zijn.<\/span> <span class=\"sg\" data-s=\"1\">Een gewone <code>Int<\/code>-variabele begint als de ongedefinieerde <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Een native <code>int<\/code> begint echter op <strong>nul<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde geldt voor native arrays.<\/span> <span class=\"sg\" data-s=\"1\">Je declareert ze door het native type voor de <code>@<\/code>-variabele te zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Zo'n array slaat zijn elementen op als ruwe machine-integers, niet als boxed <code>Int<\/code>-objecten.<\/span> <span class=\"sg\" data-s=\"1\">Daardoor gebruikt hij minder geheugen.<\/span> <span class=\"sg\" data-s=\"2\">Als je een native waarde iets over zichzelf vraagt, <em>boxt<\/em> Raku die waarde automatisch.<\/span> <span class=\"sg\" data-s=\"3\">Raku zet de waarde dan in het bijbehorende volwaardige type.<\/span> <span class=\"sg\" data-s=\"4\">Daarom toont <code>(my int $b).WHAT<\/code> <code>(Int)<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos a nivel de máquina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los nombres de los tipos nativos están en minúsculas: <code>int<\/code>, <code>num<\/code> y <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los usas para declarar una variable, igual que <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un valor nativo corresponde directamente a un registro o una palabra de la máquina.<\/span> <span class=\"sg\" data-s=\"1\">No tiene el objeto envolvente que siempre tiene un valor normal de Raku.<\/span> <span class=\"sg\" data-s=\"2\">Esto hace que los tipos nativos sean más rápidos y ocupen menos memoria.<\/span> <span class=\"sg\" data-s=\"3\">Eso importa en bucles cortos que hacen muchos cálculos, y en arrays grandes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Debes saber una cosa desde el principio: una variable nativa nunca puede ser indefinida.<\/span> <span class=\"sg\" data-s=\"1\">Una variable <code>Int<\/code> normal empieza como el indefinido <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">En cambio, un <code>int<\/code> nativo empieza en <strong>cero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo mismo ocurre con los arrays nativos.<\/span> <span class=\"sg\" data-s=\"1\">Los declaras poniendo el tipo nativo antes de la variable <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un array así guarda sus elementos como enteros crudos de la máquina, no como objetos <code>Int<\/code> encapsulados.<\/span> <span class=\"sg\" data-s=\"1\">Por eso usa menos memoria.<\/span> <span class=\"sg\" data-s=\"2\">Cuando le preguntas a un valor nativo sobre sí mismo, Raku lo <em>encapsula<\/em> automáticamente.<\/span> <span class=\"sg\" data-s=\"3\">Pone el valor en el tipo completo correspondiente.<\/span> <span class=\"sg\" data-s=\"4\">Por eso <code>(my int $b).WHAT<\/code> muestra <code>(Int)<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi a livello macchina","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">I nomi dei tipi nativi sono in minuscolo: <code>int<\/code>, <code>num<\/code> e <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Li usi per dichiarare una variabile, proprio come <code>Int<\/code> o <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un valore nativo corrisponde direttamente a un registro o a una parola della macchina.<\/span> <span class=\"sg\" data-s=\"1\">Non ha l'oggetto wrapper che un normale valore Raku ha sempre.<\/span> <span class=\"sg\" data-s=\"2\">Questo rende i tipi nativi più veloci e più piccoli in memoria.<\/span> <span class=\"sg\" data-s=\"3\">È importante nei cicli brevi che fanno molti calcoli, e negli array grandi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Devi sapere subito una cosa: una variabile nativa non può mai essere indefinita.<\/span> <span class=\"sg\" data-s=\"1\">Una normale variabile <code>Int<\/code> inizia come <code>(Int)<\/code> indefinito.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>int<\/code> nativo, invece, inizia da <strong>zero<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso vale per gli array nativi.<\/span> <span class=\"sg\" data-s=\"1\">Li dichiari mettendo il tipo nativo prima della variabile <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un array così memorizza i suoi elementi come interi macchina grezzi, non come oggetti <code>Int<\/code> boxed.<\/span> <span class=\"sg\" data-s=\"1\">Quindi usa meno memoria.<\/span> <span class=\"sg\" data-s=\"2\">Quando chiedi a un valore nativo informazioni su sé stesso, Raku ne fa automaticamente il <em>boxing<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Mette il valore nel tipo completo corrispondente.<\/span> <span class=\"sg\" data-s=\"4\">Per questo <code>(my int $b).WHAT<\/code> mostra <code>(Int)<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mašīnas līmeņa tipi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Natīvo tipu nosaukumi ir rakstīti ar mazajiem burtiem: <code>int<\/code>, <code>num<\/code> un <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tos izmantojat, lai deklarētu mainīgo, tāpat kā <code>Int<\/code> vai <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Natīvā vērtība tieši atbilst mašīnas reģistram vai vārdam.<\/span> <span class=\"sg\" data-s=\"1\">Tai nav iesaiņojuma objekta, kāds vienmēr ir parastai Raku vērtībai.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc natīvie tipi ir ātrāki un aizņem mazāk atmiņas.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir svarīgi īsās cilpās, kas veic daudz aprēķinu, un lielos masīvos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vienu lietu jums vajadzētu zināt uzreiz: natīvais mainīgais nekad nevar būt nedefinēts.<\/span> <span class=\"sg\" data-s=\"1\">Parasts <code>Int<\/code> mainīgais sākas kā nedefinēts <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Turpretī natīvais <code>int<\/code> sākas ar <strong>nulli<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats attiecas uz natīvajiem masīviem.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tos deklarējat, liekot natīvo tipu pirms <code>@<\/code> mainīgā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šāds masīvs glabā savus elementus kā neapstrādātus mašīnas veselos skaitļus, nevis kā iesaiņotus <code>Int<\/code> objektus.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tas aizņem mazāk atmiņas.<\/span> <span class=\"sg\" data-s=\"2\">Kad jūs jautājat kaut ko par natīvo vērtību, Raku to automātiski <em>iesaiņo<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ieliek vērtību atbilstošajā pilnajā tipā.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc <code>(my int $b).WHAT<\/code> parāda <code>(Int)<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы машинного уровня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имена нативных типов записываются строчными буквами: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">С ними объявляют переменную точно так же, как с <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Нативное значение прямо соответствует машинному регистру или слову.<\/span> <span class=\"sg\" data-s=\"1\">У него нет объекта-обёртки, который всегда есть у обычного значения Raku.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому нативные типы быстрее и занимают меньше памяти.<\/span> <span class=\"sg\" data-s=\"3\">Это важно в коротких циклах с большим количеством вычислений и в больших массивах.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одну вещь стоит знать сразу: нативная переменная никогда не может быть неопределённой.<\/span> <span class=\"sg\" data-s=\"1\">Обычная переменная <code>Int<\/code> начинается с неопределённого значения <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А вот нативный <code>int<\/code> начинается с <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То же верно для нативных массивов.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы их объявить, нативный тип ставят перед переменной с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Такой массив хранит элементы как «сырые» машинные целые числа, а не как упакованные объекты <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому он занимает меньше памяти.<\/span> <span class=\"sg\" data-s=\"2\">Когда вы спрашиваете нативное значение о нём самом, Raku автоматически <em>упаковывает<\/em> его.<\/span> <span class=\"sg\" data-s=\"3\">Он кладёт значение в соответствующий полный тип.<\/span> <span class=\"sg\" data-s=\"4\">Вот почему <code>(my int $b).WHAT<\/code> показывает <code>(Int)<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи машинного рівня","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Назви машинних типів пишуться малими літерами: <code>int<\/code>, <code>num<\/code> і <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви використовуєте їх, щоб оголосити змінну, так само як <code>Int<\/code> чи <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Машинне значення прямо відповідає регістру чи слову машини.<\/span> <span class=\"sg\" data-s=\"1\">Воно не має об'єкта-обгортки, який завжди має звичайне значення Raku.<\/span> <span class=\"sg\" data-s=\"2\">Через це машинні типи швидші й менші в пам'яті.<\/span> <span class=\"sg\" data-s=\"3\">Це має значення в коротких циклах, які роблять багато обчислень, і у великих масивах.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одну річ варто знати одразу: машинна змінна ніколи не може бути невизначеною.<\/span> <span class=\"sg\" data-s=\"1\">Звичайна змінна <code>Int<\/code> починає з невизначеного <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А от машинний <code>int<\/code> починає з <strong>нуля<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Те саме стосується машинних масивів.<\/span> <span class=\"sg\" data-s=\"1\">Щоб оголосити їх, ставте машинний тип перед змінною з <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Такий масив зберігає свої елементи як сирі машинні цілі числа, а не як упаковані об'єкти <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому він займає менше пам'яті.<\/span> <span class=\"sg\" data-s=\"2\">Коли ви щось запитуєте про машинне значення, Raku автоматично <em>упаковує<\/em> його.<\/span> <span class=\"sg\" data-s=\"3\">Він кладе значення у відповідний повний тип.<\/span> <span class=\"sg\" data-s=\"4\">Саме тому <code>(my int $b).WHAT<\/code> показує <code>(Int)<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове на машинно ниво","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Имената на нативните типове са с малки букви: <code>int<\/code>, <code>num<\/code> и <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Използвате ги, за да декларирате променлива, точно както <code>Int<\/code> или <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Нативната стойност съответства директно на машинен регистър или дума.<\/span> <span class=\"sg\" data-s=\"1\">Тя няма обвиващ обект, който обикновената Raku стойност винаги има.<\/span> <span class=\"sg\" data-s=\"2\">Това прави нативните типове по-бързи и по-малки в паметта.<\/span> <span class=\"sg\" data-s=\"3\">Това е важно в кратки цикли с много изчисления и в големи масиви.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Едно нещо трябва да знаете веднага: нативната променлива никога не може да бъде недефинирана.<\/span> <span class=\"sg\" data-s=\"1\">Обикновената <code>Int<\/code> променлива започва като недефинираното <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Нативният <code>int<\/code> обаче започва от <strong>нула<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същото важи и за нативните масиви.<\/span> <span class=\"sg\" data-s=\"1\">Декларирате ги, като поставите нативния тип преди променливата с <code>@<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Такъв масив съхранява елементите си като сурови машинни цели числа, а не като обвити <code>Int<\/code> обекти.<\/span> <span class=\"sg\" data-s=\"1\">Затова заема по-малко памет.<\/span> <span class=\"sg\" data-s=\"2\">Когато попитате нативна стойност за самата нея, Raku автоматично я <em>обвива<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Raku поставя стойността в съответния пълен тип.<\/span> <span class=\"sg\" data-s=\"4\">Ето защо <code>(my int $b).WHAT<\/code> показва <code>(Int)<\/code>.<\/span><\/p>"]]},"eo":{"t":"Maŝin-nivelaj tipoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La nomoj de la indiĝenaj tipoj estas per minusklaj literoj: <code>int<\/code>, <code>num<\/code> kaj <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi uzas ilin por deklari variablon, same kiel <code>Int<\/code> aŭ <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Indiĝena valoro rekte kongruas kun maŝina registro aŭ vorto.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne havas envolvan objekton, kiun normala Raku-valoro ĉiam havas.<\/span> <span class=\"sg\" data-s=\"2\">Tio faras indiĝenajn tipojn pli rapidaj kaj pli malgrandaj en la memoro.<\/span> <span class=\"sg\" data-s=\"3\">Tio gravas en mallongaj bukloj, kiuj faras multajn kalkulojn, kaj en grandaj tabeloj.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu aferon vi sciu tuj: indiĝena variablo neniam povas esti nedefinita.<\/span> <span class=\"sg\" data-s=\"1\">Ordinara <code>Int<\/code>-variablo komenciĝas kiel la nedefinita <code>(Int)<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Indiĝena <code>int<\/code>, tamen, komenciĝas je <strong>nulo<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La samo validas por indiĝenaj tabeloj.<\/span> <span class=\"sg\" data-s=\"1\">Vi deklaras ilin, metante la indiĝenan tipon antaŭ la <code>@<\/code>-variablon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tia tabelo konservas siajn elementojn kiel krudajn maŝinajn entjerojn, ne kiel enkastitajn <code>Int<\/code>-objektojn.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi uzas malpli da memoro.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi demandas indiĝenan valoron pri ĝi mem, Raku aŭtomate <em>enkastas<\/em> ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi metas la valoron en la respondan plenan tipon.<\/span> <span class=\"sg\" data-s=\"4\">Tial <code>(my int $b).WHAT<\/code> montras <code>(Int)<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi machinae","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nomina typorum nativorum minuscula sunt: <code>int<\/code>, <code>num<\/code> et <code>str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eos adhibes ut variabilem declares, sicut <code>Int<\/code> vel <code>Str<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int $i = 42;\nmy num $n = 3.14e0;\nsay $i; # 42\nsay $n; # 3.14<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Valor nativus directe registro vel verbo machinae respondet.<\/span> <span class=\"sg\" data-s=\"1\">Nullum obiectum involucrum habet, quod valor normalis Raku semper habet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc typos nativos celeriores et minores in memoria facit.<\/span> <span class=\"sg\" data-s=\"3\">Hoc magni momenti est in brevibus cyclis qui multa computant, et in magnis indicibus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unam rem statim scire debes: variabilis nativa numquam indefinita esse potest.<\/span> <span class=\"sg\" data-s=\"1\">Variabilis ordinaria <code>Int<\/code> ut indefinitum <code>(Int)<\/code> incipit.<\/span> <span class=\"sg\" data-s=\"2\">Nativus <code>int<\/code> autem a <strong>nulla<\/strong> incipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (my Int $a); # (Int)\nsay (my int $b); # 0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem verum est de indicibus nativis.<\/span> <span class=\"sg\" data-s=\"1\">Eos declaras si typum nativum ante variabilem <code>@<\/code> ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int @numbers = 10, 20, 30;\nsay @numbers.sum; # 60<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Talis index elementa sua ut integros crudos machinae servat, non ut obiecta involuta <code>Int<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque minus memoriae adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Cum valorem nativum de se ipso interrogas, Raku eum automatice <em>involvit<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Valorem in typum plenum respondentem ponit.<\/span> <span class=\"sg\" data-s=\"4\">Ideo <code>(my int $b).WHAT<\/code> ostendit <code>(Int)<\/code>.<\/span><\/p>"]]}}}</script>
