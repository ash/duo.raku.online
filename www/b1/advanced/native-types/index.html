<script type="application/json" id="page-data">{"u":"advanced/native-types","n":442,"k":"section","pv":"advanced/integers/exercises/prime-check/solution","nx":"advanced/native-types/machine-types","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Native types","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">The types you have used so far, <code>Int<\/code>, <code>Num<\/code> and <code>Str<\/code>, are full Raku objects.<\/span> <span class=\"sg\" data-s=\"1\">They are flexible and can tell you about themselves.<\/span> <span class=\"sg\" data-s=\"2\">They can also be as large as you need.<\/span> <span class=\"sg\" data-s=\"3\">Raku also has a second, parallel family of <em>native<\/em> types.<\/span> <span class=\"sg\" data-s=\"4\">They match directly the way the machine itself stores values.<\/span> <span class=\"sg\" data-s=\"5\">These are <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, and a set of integers with a fixed size.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Native types have names in lower case.<\/span> <span class=\"sg\" data-s=\"1\">They give up some flexibility to get speed and a fixed size.<\/span> <span class=\"sg\" data-s=\"2\">They also behave a little differently from the matching boxed types.<\/span> <span class=\"sg\" data-s=\"3\">This section shows what native types are and how their fixed size leads to overflow.<\/span><\/p>"]]},"de":{"t":"Native Typen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Die Typen, die du bisher benutzt hast, <code>Int<\/code>, <code>Num<\/code> und <code>Str<\/code>, sind vollwertige Raku-Objekte.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind flexibel und können dir etwas über sich selbst sagen.<\/span> <span class=\"sg\" data-s=\"2\">Sie können auch so groß werden, wie du sie brauchst.<\/span> <span class=\"sg\" data-s=\"3\">Raku hat außerdem eine zweite, parallele Familie von <em>nativen<\/em> Typen.<\/span> <span class=\"sg\" data-s=\"4\">Sie passen direkt zu der Art, wie die Maschine selbst Werte speichert.<\/span> <span class=\"sg\" data-s=\"5\">Das sind <code>int<\/code>, <code>num<\/code>, <code>str<\/code> und eine Reihe von Ganzzahlen mit fester Größe.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Native Typen haben Namen in Kleinbuchstaben.<\/span> <span class=\"sg\" data-s=\"1\">Sie geben etwas Flexibilität auf und bekommen dafür Geschwindigkeit und eine feste Größe.<\/span> <span class=\"sg\" data-s=\"2\">Sie verhalten sich auch etwas anders als die passenden geboxten Typen.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt zeigt, was native Typen sind und wie ihre feste Größe zu einem Überlauf führt.<\/span><\/p>"]]},"nl":{"t":"Native typen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De typen die je tot nu toe hebt gebruikt, <code>Int<\/code>, <code>Num<\/code> en <code>Str<\/code>, zijn volwaardige Raku-objecten.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn flexibel en kunnen je iets over zichzelf vertellen.<\/span> <span class=\"sg\" data-s=\"2\">Ze kunnen ook zo groot zijn als je nodig hebt.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft daarnaast een tweede, parallelle familie van <em>native<\/em> typen.<\/span> <span class=\"sg\" data-s=\"4\">Die passen direct bij de manier waarop de machine zelf waarden opslaat.<\/span> <span class=\"sg\" data-s=\"5\">Dat zijn <code>int<\/code>, <code>num<\/code>, <code>str<\/code> en een reeks gehele getallen met een vaste grootte.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Native typen hebben namen in kleine letters.<\/span> <span class=\"sg\" data-s=\"1\">Ze leveren wat flexibiliteit in voor snelheid en een vaste grootte.<\/span> <span class=\"sg\" data-s=\"2\">Ze gedragen zich ook een beetje anders dan de bijbehorende boxed typen.<\/span> <span class=\"sg\" data-s=\"3\">Dit deel laat zien wat native typen zijn en hoe hun vaste grootte tot overflow leidt.<\/span><\/p>"]]},"es":{"t":"Tipos nativos","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Los tipos que has usado hasta ahora, <code>Int<\/code>, <code>Num<\/code> y <code>Str<\/code>, son objetos completos de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Son flexibles y te pueden dar información sobre sí mismos.<\/span> <span class=\"sg\" data-s=\"2\">También pueden ser tan grandes como necesites.<\/span> <span class=\"sg\" data-s=\"3\">Raku también tiene una segunda familia paralela de tipos <em>nativos<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Siguen directamente la forma en que la propia máquina guarda los valores.<\/span> <span class=\"sg\" data-s=\"5\">Son <code>int<\/code>, <code>num<\/code>, <code>str<\/code> y un conjunto de enteros con un tamaño fijo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los tipos nativos tienen nombres en minúsculas.<\/span> <span class=\"sg\" data-s=\"1\">Pierden algo de flexibilidad para ganar velocidad y un tamaño fijo.<\/span> <span class=\"sg\" data-s=\"2\">También se comportan un poco diferente de los tipos encapsulados correspondientes.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección muestra qué son los tipos nativos y cómo su tamaño fijo lleva al desbordamiento.<\/span><\/p>"]]},"it":{"t":"Tipi nativi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">I tipi che hai usato finora, <code>Int<\/code>, <code>Num<\/code> e <code>Str<\/code>, sono oggetti Raku completi.<\/span> <span class=\"sg\" data-s=\"1\">Sono flessibili e possono darti informazioni su sé stessi.<\/span> <span class=\"sg\" data-s=\"2\">Possono anche essere grandi quanto ti serve.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha anche una seconda famiglia parallela di tipi <em>nativi<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Corrispondono direttamente al modo in cui la macchina stessa conserva i valori.<\/span> <span class=\"sg\" data-s=\"5\">Sono <code>int<\/code>, <code>num<\/code>, <code>str<\/code> e un gruppo di interi di dimensione fissa.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I tipi nativi hanno nomi in minuscolo.<\/span> <span class=\"sg\" data-s=\"1\">Rinunciano a un po' di flessibilità per avere velocità e una dimensione fissa.<\/span> <span class=\"sg\" data-s=\"2\">Si comportano anche in modo un po' diverso dai tipi boxed corrispondenti.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione mostra cosa sono i tipi nativi e come la loro dimensione fissa porta all'overflow.<\/span><\/p>"]]},"lv":{"t":"Natīvie tipi 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Tipi, kurus jūs esat lietojuši līdz šim, <code>Int<\/code>, <code>Num<\/code> un <code>Str<\/code>, ir pilnvērtīgi Raku objekti.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir elastīgi un var jums pastāstīt par sevi.<\/span> <span class=\"sg\" data-s=\"2\">Tie var būt arī tik lieli, cik jums vajag.<\/span> <span class=\"sg\" data-s=\"3\">Raku valodā ir arī otra, paralēla <em>natīvo<\/em> tipu saime.<\/span> <span class=\"sg\" data-s=\"4\">Tie tieši atbilst tam, kā pati mašīna glabā vērtības.<\/span> <span class=\"sg\" data-s=\"5\">Tie ir <code>int<\/code>, <code>num<\/code>, <code>str<\/code> un vairāki veselie skaitļi ar fiksētu izmēru.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Natīvo tipu nosaukumi ir ar mazajiem burtiem.<\/span> <span class=\"sg\" data-s=\"1\">Tie atsakās no daļas elastības, lai iegūtu ātrumu un fiksētu izmēru.<\/span> <span class=\"sg\" data-s=\"2\">Tie arī uzvedas nedaudz citādi nekā atbilstošie iesaiņotie tipi.<\/span> <span class=\"sg\" data-s=\"3\">Šī sadaļa parāda, kas ir natīvie tipi un kā to fiksētais izmērs noved pie pārplūšanas.<\/span><\/p>"]]},"ru":{"t":"Нативные типы","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Типы, которые вы использовали до сих пор, — <code>Int<\/code>, <code>Num<\/code> и <code>Str<\/code> — это полноценные объекты Raku.<\/span> <span class=\"sg\" data-s=\"1\">Они гибкие и могут рассказать вам о себе.<\/span> <span class=\"sg\" data-s=\"2\">Ещё они могут быть такими большими, как вам нужно.<\/span> <span class=\"sg\" data-s=\"3\">В Raku есть и второе, параллельное семейство <em>нативных<\/em> типов.<\/span> <span class=\"sg\" data-s=\"4\">Они прямо соответствуют тому, как сама машина хранит значения.<\/span> <span class=\"sg\" data-s=\"5\">Это <code>int<\/code>, <code>num<\/code>, <code>str<\/code> и набор целых чисел фиксированного размера.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Имена нативных типов пишутся строчными буквами.<\/span> <span class=\"sg\" data-s=\"1\">Они отдают часть гибкости, чтобы получить скорость и фиксированный размер.<\/span> <span class=\"sg\" data-s=\"2\">Ещё они ведут себя немного иначе, чем соответствующие упакованные типы.<\/span> <span class=\"sg\" data-s=\"3\">Этот раздел показывает, что такое нативные типы и как их фиксированный размер приводит к переполнению.<\/span><\/p>"]]},"uk":{"t":"Машинні типи","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Типи, якими ви досі користувалися, <code>Int<\/code>, <code>Num<\/code> і <code>Str<\/code>, є повноцінними об'єктами Raku.<\/span> <span class=\"sg\" data-s=\"1\">Вони гнучкі й можуть розповісти вам про себе.<\/span> <span class=\"sg\" data-s=\"2\">Вони також можуть бути такими великими, як вам потрібно.<\/span> <span class=\"sg\" data-s=\"3\">Raku має також другу, паралельну родину <em>машинних<\/em> типів.<\/span> <span class=\"sg\" data-s=\"4\">Вони прямо відповідають тому, як сама машина зберігає значення.<\/span> <span class=\"sg\" data-s=\"5\">Це <code>int<\/code>, <code>num<\/code>, <code>str<\/code> і набір цілих чисел фіксованого розміру.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Машинні типи мають назви з малих літер.<\/span> <span class=\"sg\" data-s=\"1\">Вони віддають частину гнучкості, щоб отримати швидкість і фіксований розмір.<\/span> <span class=\"sg\" data-s=\"2\">Вони також поводяться трохи інакше, ніж відповідні упаковані типи.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ показує, що таке машинні типи і як їхній фіксований розмір призводить до переповнення.<\/span><\/p>"]]},"bg":{"t":"Нативни типове 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Типовете, които сте използвали досега, <code>Int<\/code>, <code>Num<\/code> и <code>Str<\/code>, са пълноценни Raku обекти.<\/span> <span class=\"sg\" data-s=\"1\">Те са гъвкави и могат да ви кажат нещо за себе си.<\/span> <span class=\"sg\" data-s=\"2\">Могат също да са толкова големи, колкото ви трябва.<\/span> <span class=\"sg\" data-s=\"3\">Raku има и второ, паралелно семейство от <em>нативни<\/em> типове.<\/span> <span class=\"sg\" data-s=\"4\">Те съответстват директно на начина, по който самата машина съхранява стойностите.<\/span> <span class=\"sg\" data-s=\"5\">Това са <code>int<\/code>, <code>num<\/code>, <code>str<\/code> и набор от цели числа с фиксиран размер.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Нативните типове имат имена с малки букви.<\/span> <span class=\"sg\" data-s=\"1\">Те се отказват от част от гъвкавостта, за да получат скорост и фиксиран размер.<\/span> <span class=\"sg\" data-s=\"2\">Те се държат и малко по-различно от съответните обвити типове.<\/span> <span class=\"sg\" data-s=\"3\">Тази секция показва какво представляват нативните типове и как фиксираният им размер води до препълване.<\/span><\/p>"]]},"eo":{"t":"Denaskaj tipoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La tipoj, kiujn vi uzis ĝis nun, <code>Int<\/code>, <code>Num<\/code> kaj <code>Str<\/code>, estas plenaj Raku-objektoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas flekseblaj kaj povas rakonti al vi pri si mem.<\/span> <span class=\"sg\" data-s=\"2\">Ili ankaŭ povas esti tiom grandaj, kiom vi bezonas.<\/span> <span class=\"sg\" data-s=\"3\">Raku ankaŭ havas duan, paralelan familion de <em>indiĝenaj<\/em> tipoj.<\/span> <span class=\"sg\" data-s=\"4\">Ili rekte kongruas kun la maniero, kiel la maŝino mem konservas valorojn.<\/span> <span class=\"sg\" data-s=\"5\">Tiuj estas <code>int<\/code>, <code>num<\/code>, <code>str<\/code> kaj aro de entjeroj kun fiksa grandeco.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Indiĝenaj tipoj havas nomojn per minusklaj literoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili rezignas iom da fleksebleco por gajni rapidecon kaj fiksan grandecon.<\/span> <span class=\"sg\" data-s=\"2\">Ili ankaŭ kondutas iom alie ol la respondaj enkastitaj tipoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio montras, kio estas indiĝenaj tipoj kaj kiel ilia fiksa grandeco kondukas al superfluo.<\/span><\/p>"]]},"la":{"t":"Typi nativi","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Typi quos adhuc adhibuisti, <code>Int<\/code>, <code>Num<\/code> et <code>Str<\/code>, plena obiecta Raku sunt.<\/span> <span class=\"sg\" data-s=\"1\">Flexibilia sunt et tibi de se ipsis narrare possunt.<\/span> <span class=\"sg\" data-s=\"2\">Etiam tam magna esse possunt quam opus est.<\/span> <span class=\"sg\" data-s=\"3\">Raku etiam alteram familiam parallelam typorum <em>nativorum<\/em> habet.<\/span> <span class=\"sg\" data-s=\"4\">Hi directe congruunt cum modo quo machina ipsa valores servat.<\/span> <span class=\"sg\" data-s=\"5\">Hi sunt <code>int<\/code>, <code>num<\/code>, <code>str<\/code>, et grex numerorum integrorum magnitudinis fixae.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Typi nativi nomina litteris minusculis habent.<\/span> <span class=\"sg\" data-s=\"1\">Aliquid flexibilitatis dant ut celeritatem et magnitudinem fixam accipiant.<\/span> <span class=\"sg\" data-s=\"2\">Etiam paulo aliter se gerunt quam typi involuti qui eis respondent.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio ostendit quid typi nativi sint et quomodo magnitudo eorum fixa ad superfluxum ducat.<\/span><\/p>"]]}}}</script>
