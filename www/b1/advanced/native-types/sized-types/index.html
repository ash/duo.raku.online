<script type="application/json" id="page-data">{"u":"advanced/native-types/sized-types","n":445,"k":"topic","pv":"advanced/native-types/machine-types/quiz","nx":"advanced/native-types/sized-types/quiz","tr":["advanced","advanced/native-types"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sized types and overflow","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Besides the plain <code>int<\/code>, Raku has integers with a fixed size in bits.<\/span> <span class=\"sg\" data-s=\"1\">These are <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, and their unsigned partners <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The number shows how many bits the value takes.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">When the width is fixed, the range is fixed too.<\/span> <span class=\"sg\" data-s=\"1\">An <code>int8<\/code> holds values from <code>-128<\/code> to <code>127<\/code>, and a <code>uint8<\/code> from <code>0<\/code> to <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">The storage cannot grow, so going past the top wraps around to the bottom.<\/span> <span class=\"sg\" data-s=\"3\">This is called <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">If you add one to the largest <code>int8<\/code>, you do not get <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That number would not fit.<\/span> <span class=\"sg\" data-s=\"2\">Instead, it wraps around to the smallest value, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unsigned types wrap around too:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A normal <code>Int<\/code> is the opposite.<\/span> <span class=\"sg\" data-s=\"1\">It simply grows as large as needed and never overflows.<\/span> <span class=\"sg\" data-s=\"2\">This deal is the whole point of sized native types.<\/span> <span class=\"sg\" data-s=\"3\">You accept a fixed range.<\/span> <span class=\"sg\" data-s=\"4\">In return, you get storage that is predictable, small and fast.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Do you know the range of your data, and do you want efficiency?<\/span> <span class=\"sg\" data-s=\"1\">Then use a sized native type.<\/span> <span class=\"sg\" data-s=\"2\">For example, keep bytes of binary data in a <code>uint8<\/code> array.<\/span> <span class=\"sg\" data-s=\"3\">For ordinary arithmetic, where numbers may grow without limit, stay with <code>Int<\/code>.<\/span><\/p>"]]},"de":{"t":"Typen mit fester Größe und Überlauf","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Neben dem einfachen <code>int<\/code> hat Raku Ganzzahlen mit einer festen Größe in Bits.<\/span> <span class=\"sg\" data-s=\"1\">Das sind <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> und ihre vorzeichenlosen Partner <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die Zahl zeigt, wie viele Bits der Wert braucht.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn die Breite fest ist, ist auch der Bereich fest.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>int8<\/code> fasst Werte von <code>-128<\/code> bis <code>127<\/code>, und ein <code>uint8<\/code> von <code>0<\/code> bis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Der Speicher kann nicht wachsen, also springt ein Wert über dem oberen Ende zurück zum unteren Ende.<\/span> <span class=\"sg\" data-s=\"3\">Das nennt man <em>Überlauf<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn du eins zum größten <code>int8<\/code> addierst, bekommst du nicht <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Diese Zahl würde nicht hineinpassen.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen springt der Wert zum kleinsten Wert, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Vorzeichenlose Typen laufen auch um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein normaler <code>Int<\/code> ist das Gegenteil.<\/span> <span class=\"sg\" data-s=\"1\">Er wird einfach so groß wie nötig und läuft nie über.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Tausch ist der ganze Sinn von nativen Typen mit fester Größe.<\/span> <span class=\"sg\" data-s=\"3\">Du akzeptierst einen festen Bereich.<\/span> <span class=\"sg\" data-s=\"4\">Dafür bekommst du Speicher, der vorhersagbar, klein und schnell ist.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kennst du den Bereich deiner Daten, und willst du Effizienz?<\/span> <span class=\"sg\" data-s=\"1\">Dann benutze einen nativen Typ mit fester Größe.<\/span> <span class=\"sg\" data-s=\"2\">Speichere zum Beispiel Bytes von Binärdaten in einem <code>uint8<\/code>-Array.<\/span> <span class=\"sg\" data-s=\"3\">Für normale Arithmetik, bei der Zahlen ohne Grenze wachsen können, bleib bei <code>Int<\/code>.<\/span><\/p>"]]},"nl":{"t":"Typen met vaste grootte en overflow","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Naast het gewone <code>int<\/code> heeft Raku gehele getallen met een vaste grootte in bits.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> en hun unsigned partners <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het getal laat zien hoeveel bits de waarde inneemt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Als de breedte vastligt, ligt ook het bereik vast.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>int8<\/code> bevat waarden van <code>-128<\/code> tot <code>127<\/code>, en een <code>uint8<\/code> van <code>0<\/code> tot <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De opslag kan niet groeien, dus een waarde voorbij de bovenkant wrapt naar de onderkant.<\/span> <span class=\"sg\" data-s=\"3\">Dit heet <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Als je één optelt bij de grootste <code>int8<\/code>, krijg je geen <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat getal zou niet passen.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan wrapt het naar de kleinste waarde, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Unsigned typen wrappen ook:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een normaal <code>Int<\/code> is het tegenovergestelde.<\/span> <span class=\"sg\" data-s=\"1\">Het groeit gewoon zo groot als nodig en loopt nooit over.<\/span> <span class=\"sg\" data-s=\"2\">Deze ruil is precies het doel van native typen met vaste grootte.<\/span> <span class=\"sg\" data-s=\"3\">Je accepteert een vast bereik.<\/span> <span class=\"sg\" data-s=\"4\">In ruil krijg je opslag die voorspelbaar, klein en snel is.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ken je het bereik van je gegevens, en wil je dat je code efficiënt is?<\/span> <span class=\"sg\" data-s=\"1\">Gebruik dan een native type met vaste grootte.<\/span> <span class=\"sg\" data-s=\"2\">Bewaar bijvoorbeeld bytes van binaire gegevens in een <code>uint8<\/code>-array.<\/span> <span class=\"sg\" data-s=\"3\">Voor gewoon rekenwerk, waarbij getallen zonder grens kunnen groeien, blijf je bij <code>Int<\/code>.<\/span><\/p>"]]},"es":{"t":"Tipos con tamaño y desbordamiento","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Además del <code>int<\/code> simple, Raku tiene enteros con un tamaño fijo en bits.<\/span> <span class=\"sg\" data-s=\"1\">Son <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> y sus parejas sin signo <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El número indica cuántos bits ocupa el valor.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cuando el ancho es fijo, el rango también es fijo.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> guarda valores de <code>-128<\/code> a <code>127<\/code>, y un <code>uint8<\/code> de <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">El almacenamiento no puede crecer, así que al pasar del tope, el valor da la vuelta al mínimo.<\/span> <span class=\"sg\" data-s=\"3\">Esto se llama <em>desbordamiento<\/em> (overflow):<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Si sumas uno al <code>int8<\/code> más grande, no obtienes <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ese número no cabría.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, da la vuelta hasta el valor más pequeño, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Los tipos sin signo también dan la vuelta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un <code>Int<\/code> normal es lo contrario.<\/span> <span class=\"sg\" data-s=\"1\">Simplemente crece tanto como haga falta y nunca se desborda.<\/span> <span class=\"sg\" data-s=\"2\">Este trato es la idea principal de los tipos nativos con tamaño.<\/span> <span class=\"sg\" data-s=\"3\">Aceptas un rango fijo.<\/span> <span class=\"sg\" data-s=\"4\">A cambio, obtienes un almacenamiento predecible, pequeño y rápido.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">¿Conoces el rango de tus datos y quieres eficiencia?<\/span> <span class=\"sg\" data-s=\"1\">Entonces usa un tipo nativo con tamaño.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, guarda bytes de datos binarios en un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Para la aritmética normal, donde los números pueden crecer sin límite, sigue con <code>Int<\/code>.<\/span><\/p>"]]},"it":{"t":"Tipi dimensionati e overflow","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Oltre al semplice <code>int<\/code>, Raku ha interi con una dimensione fissa in bit.<\/span> <span class=\"sg\" data-s=\"1\">Sono <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> e i loro compagni senza segno <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il numero mostra quanti bit occupa il valore.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quando la larghezza è fissa, anche l'intervallo è fisso.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>int8<\/code> contiene valori da <code>-128<\/code> a <code>127<\/code>, e un <code>uint8<\/code> da <code>0<\/code> a <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Lo spazio non può crescere, quindi un valore che supera il massimo si riavvolge al minimo.<\/span> <span class=\"sg\" data-s=\"3\">Questo si chiama <em>overflow<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Se aggiungi uno al valore massimo di <code>int8<\/code>, non ottieni <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quel numero non ci starebbe.<\/span> <span class=\"sg\" data-s=\"2\">Invece, si riavvolge al valore minimo, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Anche i tipi senza segno si riavvolgono:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un normale <code>Int<\/code> è l'opposto.<\/span> <span class=\"sg\" data-s=\"1\">Cresce semplicemente quanto serve e non va mai in overflow.<\/span> <span class=\"sg\" data-s=\"2\">Questo scambio è proprio il senso dei tipi nativi di dimensione fissa.<\/span> <span class=\"sg\" data-s=\"3\">Accetti un intervallo fisso.<\/span> <span class=\"sg\" data-s=\"4\">In cambio, hai uno spazio prevedibile, piccolo e veloce.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Conosci l'intervallo dei tuoi dati e vuoi efficienza?<\/span> <span class=\"sg\" data-s=\"1\">Allora usa un tipo nativo di dimensione fissa.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, tieni i byte di dati binari in un array <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Per l'aritmetica normale, dove i numeri possono crescere senza limiti, resta con <code>Int<\/code>.<\/span><\/p>"]]},"lv":{"t":"Izmēra tipi un pārpilde","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Bez parastā <code>int<\/code> Raku valodā ir veselie skaitļi ar fiksētu izmēru bitos.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> un to neparakstītie partneri <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Skaitlis parāda, cik bitu aizņem vērtība.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ja platums ir fiksēts, arī diapazons ir fiksēts.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> satur vērtības no <code>-128<\/code> līdz <code>127<\/code>, bet <code>uint8<\/code> no <code>0<\/code> līdz <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Krātuve nevar augt, tāpēc, pārkāpjot augšējo robežu, vērtība apgriežas uz apakšējo.<\/span> <span class=\"sg\" data-s=\"3\">To sauc par <em>pārplūšanu<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ja jūs pieskaitāt vienu lielākajam <code>int8<\/code>, jūs nesaņemat <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šis skaitlis neietilptu.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā vērtība apgriežas uz mazāko vērtību, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Neparakstītie tipi arī apgriežas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ar parastu <code>Int<\/code> ir otrādi.<\/span> <span class=\"sg\" data-s=\"1\">Tas vienkārši kļūst tik liels, cik vajag, un nekad nepārplūst.<\/span> <span class=\"sg\" data-s=\"2\">Šis kompromiss ir visa natīvo tipu ar fiksētu izmēru jēga.<\/span> <span class=\"sg\" data-s=\"3\">Jūs pieņemat fiksētu diapazonu.<\/span> <span class=\"sg\" data-s=\"4\">Pretī jūs saņemat krātuvi, kas ir paredzama, maza un ātra.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vai jūs zināt savu datu diapazonu un vēlaties efektivitāti?<\/span> <span class=\"sg\" data-s=\"1\">Tad izmantojiet natīvo tipu ar fiksētu izmēru.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, glabājiet bināro datu baitus <code>uint8<\/code> masīvā.<\/span> <span class=\"sg\" data-s=\"3\">Parastai aritmētikai, kur skaitļi var augt bez robežas, palieciet pie <code>Int<\/code>.<\/span><\/p>"]]},"ru":{"t":"Типы с фиксированным размером и переполнение","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кроме простого <code>int<\/code>, в Raku есть целые числа с фиксированным размером в битах.<\/span> <span class=\"sg\" data-s=\"1\">Это <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> и их беззнаковые пары <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Число показывает, сколько битов занимает значение.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Когда размер в битах фиксирован, диапазон тоже фиксирован.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> хранит значения от <code>-128<\/code> до <code>127<\/code>, а <code>uint8<\/code> — от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Хранилище не может расти, поэтому выход за верхнюю границу ведёт по кругу к нижней.<\/span> <span class=\"sg\" data-s=\"3\">Это называется <em>переполнением<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Если прибавить единицу к наибольшему <code>int8<\/code>, вы не получите <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это число не поместилось бы.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого значение по кругу переходит к наименьшему, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнаковые типы тоже идут по кругу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обычный <code>Int<\/code> — противоположность.<\/span> <span class=\"sg\" data-s=\"1\">Он просто растёт до нужного размера и никогда не переполняется.<\/span> <span class=\"sg\" data-s=\"2\">В таком обмене и есть весь смысл нативных типов фиксированного размера.<\/span> <span class=\"sg\" data-s=\"3\">Вы соглашаетесь на фиксированный диапазон.<\/span> <span class=\"sg\" data-s=\"4\">Взамен вы получаете предсказуемое, небольшое и быстрое хранение.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы знаете диапазон своих данных и хотите эффективности?<\/span> <span class=\"sg\" data-s=\"1\">Тогда используйте нативный тип фиксированного размера.<\/span> <span class=\"sg\" data-s=\"2\">Например, храните байты двоичных данных в массиве <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Для обычной арифметики, где числа могут расти без предела, используйте <code>Int<\/code>.<\/span><\/p>"]]},"uk":{"t":"Типи фіксованого розміру та переповнення","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Окрім простого <code>int<\/code>, Raku має цілі числа з фіксованим розміром у бітах.<\/span> <span class=\"sg\" data-s=\"1\">Це <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> і їхні беззнакові партнери <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Число показує, скільки бітів займає значення.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Коли ширина фіксована, діапазон теж фіксований.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> містить значення від <code>-128<\/code> до <code>127<\/code>, а <code>uint8<\/code> — від <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сховище не може зрости, тож вихід за верхню межу загортається до нижньої.<\/span> <span class=\"sg\" data-s=\"3\">Це називають <em>переповненням<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Якщо додати одиницю до найбільшого <code>int8<\/code>, ви не отримаєте <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це число не змогло б уміститися.<\/span> <span class=\"sg\" data-s=\"2\">Натомість значення загортається до найменшого, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнакові типи теж загортаються:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Зі звичайним <code>Int<\/code> усе навпаки.<\/span> <span class=\"sg\" data-s=\"1\">Він просто росте, скільки потрібно, і ніколи не переповнюється.<\/span> <span class=\"sg\" data-s=\"2\">У цьому обміні й полягає весь сенс машинних типів фіксованого розміру.<\/span> <span class=\"sg\" data-s=\"3\">Ви погоджуєтеся на фіксований діапазон.<\/span> <span class=\"sg\" data-s=\"4\">Натомість ви отримуєте сховище, яке передбачуване, маленьке і швидке.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви знаєте діапазон своїх даних і хочете ефективності?<\/span> <span class=\"sg\" data-s=\"1\">Тоді використовуйте машинний тип фіксованого розміру.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, зберігайте байти двійкових даних у масиві <code>uint8<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Для звичайної арифметики, де числа можуть рости без меж, залишайтеся з <code>Int<\/code>.<\/span><\/p>"]]},"bg":{"t":"Типове с размер и препълване","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Освен обикновения <code>int<\/code>, Raku има цели числа с фиксиран размер в битове.<\/span> <span class=\"sg\" data-s=\"1\">Това са <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> и техните беззнакови партньори <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Числото показва колко бита заема стойността.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Когато ширината е фиксирана, диапазонът също е фиксиран.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> съдържа стойности от <code>-128<\/code> до <code>127<\/code>, а <code>uint8<\/code> — от <code>0<\/code> до <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Хранилището не може да расте, затова преминаването над горната граница води до връщане в началото.<\/span> <span class=\"sg\" data-s=\"3\">Това се нарича <em>препълване<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ако добавите единица към най-голямата стойност на <code>int8<\/code>, няма да получите <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това число не би се побрало.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това стойността се обръща до най-малката, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Беззнаковите типове също се обръщат:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обикновеният <code>Int<\/code> е обратното.<\/span> <span class=\"sg\" data-s=\"1\">Той просто расте колкото е нужно и никога не препълва.<\/span> <span class=\"sg\" data-s=\"2\">Тази сделка е целият смисъл на нативните типове с размер.<\/span> <span class=\"sg\" data-s=\"3\">Приемате фиксиран диапазон.<\/span> <span class=\"sg\" data-s=\"4\">В замяна получавате хранилище, което е предвидимо, малко и бързо.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Знаете ли диапазона на данните си и искате ли ефективност?<\/span> <span class=\"sg\" data-s=\"1\">Тогава използвайте нативен тип с размер.<\/span> <span class=\"sg\" data-s=\"2\">Например пазете байтове от двоични данни в <code>uint8<\/code> масив.<\/span> <span class=\"sg\" data-s=\"3\">За обикновена аритметика, при която числата могат да растат без граница, останете при <code>Int<\/code>.<\/span><\/p>"]]},"eo":{"t":"Grandecaj tipoj kaj superfluo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Krom la simpla <code>int<\/code>, Raku havas entjerojn kun fiksa grandeco en bitoj.<\/span> <span class=\"sg\" data-s=\"1\">Tiuj estas <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code> kaj iliaj sensignaj partneroj <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La nombro montras, kiom da bitoj la valoro prenas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiam la larĝo estas fiksa, ankaŭ la intervalo estas fiksa.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> tenas valorojn de <code>-128<\/code> ĝis <code>127<\/code>, kaj <code>uint8<\/code> de <code>0<\/code> ĝis <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La stokado ne povas kreski, do se valoro iras preter la supron, ĝi ĉirkaŭvolviĝas al la malsupro.<\/span> <span class=\"sg\" data-s=\"3\">Tio nomiĝas <em>superfluo<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Se vi aldonas unu al la plej granda <code>int8<\/code>, vi ne ricevas <code>128<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tiu nombro ne konvenus.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĝi ĉirkaŭvolviĝas al la plej malgranda valoro, <code>-128<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ankaŭ sensignaj tipoj ĉirkaŭvolviĝas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normala <code>Int<\/code> estas la malo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi simple kreskas tiom, kiom necesas, kaj neniam superfluas.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu interŝanĝo estas la tuta celo de fiksgrandaj indiĝenaj tipoj.<\/span> <span class=\"sg\" data-s=\"3\">Vi akceptas fiksan intervalon.<\/span> <span class=\"sg\" data-s=\"4\">Kompense, vi ricevas stokadon, kiu estas antaŭvidebla, malgranda kaj rapida.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi konas la intervalon de viaj datumoj, kaj ĉu vi volas efikecon?<\/span> <span class=\"sg\" data-s=\"1\">Tiam uzu fiksgrandan indiĝenan tipon.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, tenu bajtojn de binaraj datumoj en <code>uint8<\/code>-tabelo.<\/span> <span class=\"sg\" data-s=\"3\">Por ordinara aritmetiko, kie nombroj povas kreski sen limo, restu ĉe <code>Int<\/code>.<\/span><\/p>"]]},"la":{"t":"Typi cum magnitudine et superfluentia","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Praeter simplicem <code>int<\/code>, Raku numeros integros magnitudinis fixae in bitis habet.<\/span> <span class=\"sg\" data-s=\"1\">Hi sunt <code>int8<\/code>, <code>int16<\/code>, <code>int32<\/code>, <code>int64<\/code>, et eorum socii non signati <code>uint8<\/code>, <code>uint16<\/code>, <code>uint32<\/code>, <code>uint64<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Numerus ostendit quot bitos valor occupet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum latitudo fixa est, ambitus quoque fixus est.<\/span> <span class=\"sg\" data-s=\"1\"><code>int8<\/code> valores a <code>-128<\/code> ad <code>127<\/code> continet, et <code>uint8<\/code> ab <code>0<\/code> ad <code>255<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Repositorium crescere non potest, itaque valor qui summum transit ad imum circumvolvitur.<\/span> <span class=\"sg\" data-s=\"3\">Hoc <em>superfluxus<\/em> vocatur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my int8 $i = 127;\n$i++;\nsay $i; # -128<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Si unum ad maximum <code>int8<\/code> addis, <code>128<\/code> non accipis.<\/span> <span class=\"sg\" data-s=\"1\">Ille numerus locum non haberet.<\/span> <span class=\"sg\" data-s=\"2\">Potius ad minimum valorem, <code>-128<\/code>, circumvolvitur.<\/span> <span class=\"sg\" data-s=\"3\">Typi non signati quoque circumvolvuntur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my uint8 $u = 255;\n$u++;\nsay $u; # 0<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Normalis <code>Int<\/code> contrarium est.<\/span> <span class=\"sg\" data-s=\"1\">Simpliciter tam magnus crescit quam opus est et numquam superfluit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc pactum est totum propositum typorum nativorum dimensorum.<\/span> <span class=\"sg\" data-s=\"3\">Ambitum fixum accipis.<\/span> <span class=\"sg\" data-s=\"4\">Pro hoc repositorium certum, parvum et celere accipis.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Scisne ambitum datorum tuorum, et visne efficientiam?<\/span> <span class=\"sg\" data-s=\"1\">Tum typum nativum dimensum adhibe.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, bytes datorum binariorum in indice <code>uint8<\/code> serva.<\/span> <span class=\"sg\" data-s=\"3\">Pro arithmetica ordinaria, ubi numeri sine limite crescere possunt, <code>Int<\/code> retine.<\/span><\/p>"]]}}}</script>
