<script type="application/json" id="page-data">{"u":"advanced/testing/comparisons","n":748,"k":"topic","pv":"advanced/testing/test-module/quiz","nx":"advanced/testing/running-tests","tr":["advanced","advanced/testing"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Comparisons and plans","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Besides <code>ok<\/code> and <code>is<\/code>, the <code>Test<\/code> module has comparisons for different kinds of values.<\/span> <span class=\"sg\" data-s=\"1\">Here are the most useful ones:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — checks whether two values are equal (as strings or numbers)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — checks that two data structures are exactly equal, including their types<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — checks that a string matches a regex<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — passes when two values are <strong>not<\/strong> equal<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> is the right choice for arrays, hashes and nested data.<\/span> <span class=\"sg\" data-s=\"1\">It compares both the structure and the type exactly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This prints:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> would turn the values into strings and compare them loosely.<\/span> <span class=\"sg\" data-s=\"1\">But <code>is-deeply<\/code> requires that the structures really match.<\/span> <span class=\"sg\" data-s=\"2\">Note that <code>done-testing<\/code> puts the plan <code>1..1<\/code> at the end, after the check.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You do not have to let <code>done-testing<\/code> count the tests for you.<\/span> <span class=\"sg\" data-s=\"1\">Instead, you can give the number at the start with <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This protects you from a test file that stops early and quietly skips some checks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This time, the plan comes <strong>first<\/strong>, before the results:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">This is the difference from <code>done-testing<\/code> that you can see.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> prints the count <code>1..2<\/code> at the top, before any checks run.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> prints it at the very end instead.<\/span> <span class=\"sg\" data-s=\"3\">In any case, with <code>plan 2<\/code> the run expects exactly two tests.<\/span> <span class=\"sg\" data-s=\"4\">If fewer or more tests run, the test suite is reported as failing.<\/span> <span class=\"sg\" data-s=\"5\">Use <code>plan<\/code> when the number of tests is fixed and known.<\/span> <span class=\"sg\" data-s=\"6\">Use <code>done-testing<\/code> when it is easier to let the test framework count.<\/span><\/p>"]]},"de":{"t":"Vergleiche und Pläne","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Neben <code>ok<\/code> und <code>is<\/code> hat das <code>Test<\/code>-Modul Vergleiche für verschiedene Arten von Werten.<\/span> <span class=\"sg\" data-s=\"1\">Hier sind die nützlichsten:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — prüft, ob zwei Werte gleich sind (als Strings oder Zahlen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — prüft, ob zwei Datenstrukturen genau gleich sind, einschließlich ihrer Typen<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — prüft, ob ein String zu einer Regex passt<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — wird bestanden, wenn zwei Werte <strong>nicht<\/strong> gleich sind<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> ist die richtige Wahl für Arrays, Hashes und verschachtelte Daten.<\/span> <span class=\"sg\" data-s=\"1\">Es vergleicht sowohl die Struktur als auch den Typ genau:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dies gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> würde die Werte in Strings umwandeln und sie locker vergleichen.<\/span> <span class=\"sg\" data-s=\"1\">Aber <code>is-deeply<\/code> verlangt, dass die Strukturen wirklich übereinstimmen.<\/span> <span class=\"sg\" data-s=\"2\">Beachte, dass <code>done-testing<\/code> den Plan <code>1..1<\/code> ans Ende setzt, nach der Prüfung.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du musst die Tests nicht von <code>done-testing<\/code> zählen lassen.<\/span> <span class=\"sg\" data-s=\"1\">Stattdessen kannst du die Anzahl mit <code>plan<\/code> am Anfang angeben.<\/span> <span class=\"sg\" data-s=\"2\">Das schützt dich vor einer Testdatei, die zu früh aufhört und still einige Prüfungen überspringt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diesmal kommt der Plan <strong>zuerst<\/strong>, vor den Ergebnissen:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Das ist der sichtbare Unterschied zu <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> gibt die Anzahl <code>1..2<\/code> oben aus, bevor irgendeine Prüfung läuft.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> gibt sie dagegen ganz am Ende aus.<\/span> <span class=\"sg\" data-s=\"3\">In jedem Fall erwartet der Lauf mit <code>plan 2<\/code> genau zwei Tests.<\/span> <span class=\"sg\" data-s=\"4\">Wenn weniger oder mehr Tests laufen, wird die Testsuite als fehlgeschlagen gemeldet.<\/span> <span class=\"sg\" data-s=\"5\">Benutze <code>plan<\/code>, wenn die Anzahl der Tests fest und bekannt ist.<\/span> <span class=\"sg\" data-s=\"6\">Benutze <code>done-testing<\/code>, wenn es einfacher ist, das Test-Framework zählen zu lassen.<\/span><\/p>"]]},"nl":{"t":"Vergelijkingen en plannen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Naast <code>ok<\/code> en <code>is<\/code> heeft de <code>Test<\/code>-module vergelijkingen voor verschillende soorten waarden.<\/span> <span class=\"sg\" data-s=\"1\">Hier zijn de nuttigste:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — controleert of twee waarden gelijk zijn (als strings of getallen)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — controleert of twee datastructuren precies gelijk zijn, ook hun types<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — controleert of een string overeenkomt met een regex<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — slaagt als twee waarden <strong>niet<\/strong> gelijk zijn<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> is de juiste keuze voor arrays, hashes en geneste data.<\/span> <span class=\"sg\" data-s=\"1\">Het vergelijkt zowel de structuur als het type precies:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit geeft:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> zou de waarden omzetten naar strings en ze losjes vergelijken.<\/span> <span class=\"sg\" data-s=\"1\">Maar <code>is-deeply<\/code> eist dat de structuren echt overeenkomen.<\/span> <span class=\"sg\" data-s=\"2\">Let op: <code>done-testing<\/code> zet het plan <code>1..1<\/code> aan het eind, na de controle.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hoeft <code>done-testing<\/code> de tests niet voor je te laten tellen.<\/span> <span class=\"sg\" data-s=\"1\">In plaats daarvan kun je het aantal aan het begin opgeven met <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dit beschermt je tegen een testbestand dat te vroeg stopt en stilletjes controles overslaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit keer komt het plan <strong>eerst<\/strong>, vóór de resultaten:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Dit is het verschil met <code>done-testing<\/code> dat je kunt zien.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> print het aantal <code>1..2<\/code> bovenaan, voordat er controles worden uitgevoerd.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> print het juist helemaal aan het eind.<\/span> <span class=\"sg\" data-s=\"3\">In elk geval verwacht de uitvoering met <code>plan 2<\/code> precies twee tests.<\/span> <span class=\"sg\" data-s=\"4\">Als er minder of meer tests draaien, wordt de testsuite als mislukt gemeld.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik <code>plan<\/code> als het aantal tests vastligt en bekend is.<\/span> <span class=\"sg\" data-s=\"6\">Gebruik <code>done-testing<\/code> als het makkelijker is om het testframework te laten tellen.<\/span><\/p>"]]},"es":{"t":"Comparaciones y planes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Además de <code>ok<\/code> e <code>is<\/code>, el módulo <code>Test<\/code> tiene comparaciones para distintos tipos de valores.<\/span> <span class=\"sg\" data-s=\"1\">Aquí tienes las más útiles:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — comprueba si dos valores son iguales (como cadenas o números)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — comprueba que dos estructuras de datos son exactamente iguales, incluidos sus tipos<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — comprueba que una cadena coincide con una expresión regular<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — pasa cuando dos valores <strong>no<\/strong> son iguales<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> es la opción correcta para arreglos, hashes y datos anidados.<\/span> <span class=\"sg\" data-s=\"1\">Compara exactamente tanto la estructura como el tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto imprime:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> convertiría los valores en cadenas y los compararía de forma flexible.<\/span> <span class=\"sg\" data-s=\"1\">Pero <code>is-deeply<\/code> exige que las estructuras coincidan de verdad.<\/span> <span class=\"sg\" data-s=\"2\">Observa que <code>done-testing<\/code> pone el plan <code>1..1<\/code> al final, después de la comprobación.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">No tienes que dejar que <code>done-testing<\/code> cuente las pruebas por ti.<\/span> <span class=\"sg\" data-s=\"1\">En su lugar, puedes dar el número al principio con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto te protege de un archivo de pruebas que se detiene antes de tiempo y se salta algunas comprobaciones sin avisar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esta vez, el plan aparece <strong>primero<\/strong>, antes de los resultados:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Esta es la diferencia con <code>done-testing<\/code> que puedes ver.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> imprime el conteo <code>1..2<\/code> arriba, antes de que se ejecute ninguna comprobación.<\/span> <span class=\"sg\" data-s=\"2\">En cambio, <code>done-testing<\/code> lo imprime justo al final.<\/span> <span class=\"sg\" data-s=\"3\">En cualquier caso, con <code>plan 2<\/code> la ejecución espera exactamente dos pruebas.<\/span> <span class=\"sg\" data-s=\"4\">Si se ejecutan menos o más pruebas, el conjunto de pruebas se marca como fallido.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>plan<\/code> cuando el número de pruebas es fijo y conocido.<\/span> <span class=\"sg\" data-s=\"6\">Usa <code>done-testing<\/code> cuando es más fácil dejar que el marco de pruebas cuente.<\/span><\/p>"]]},"it":{"t":"Confronti e piani","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Oltre a <code>ok<\/code> e <code>is<\/code>, il modulo <code>Test<\/code> ha dei confronti per diversi tipi di valori.<\/span> <span class=\"sg\" data-s=\"1\">Ecco i più utili:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — controlla se due valori sono uguali (come stringhe o numeri)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — controlla che due strutture dati siano esattamente uguali, tipi compresi<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — controlla che una stringa corrisponda a un'espressione regolare<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — ha successo quando due valori <strong>non<\/strong> sono uguali<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> è la scelta giusta per array, hash e dati annidati.<\/span> <span class=\"sg\" data-s=\"1\">Confronta in modo esatto sia la struttura sia il tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo stampa:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> trasformerebbe i valori in stringhe e li confronterebbe in modo poco preciso.<\/span> <span class=\"sg\" data-s=\"1\">Ma <code>is-deeply<\/code> richiede che le strutture corrispondano davvero.<\/span> <span class=\"sg\" data-s=\"2\">Nota che <code>done-testing<\/code> mette il piano <code>1..1<\/code> alla fine, dopo il controllo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non devi per forza lasciare che <code>done-testing<\/code> conti i test per te.<\/span> <span class=\"sg\" data-s=\"1\">Invece puoi dare il numero all'inizio con <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo ti protegge da un file di test che si ferma presto e salta in silenzio alcuni controlli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questa volta il piano viene <strong>per primo<\/strong>, prima dei risultati:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Questa è la differenza da <code>done-testing<\/code> che si vede.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> stampa il conteggio <code>1..2<\/code> in cima, prima che parta qualsiasi controllo.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> invece lo stampa proprio alla fine.<\/span> <span class=\"sg\" data-s=\"3\">In ogni caso, con <code>plan 2<\/code> l'esecuzione si aspetta esattamente due test.<\/span> <span class=\"sg\" data-s=\"4\">Se ne vengono eseguiti meno o di più, la suite di test risulta fallita.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>plan<\/code> quando il numero di test è fisso e noto.<\/span> <span class=\"sg\" data-s=\"6\">Usa <code>done-testing<\/code> quando è più facile lasciare che il framework di test conti.<\/span><\/p>"]]},"lv":{"t":"Salīdzinājumi un plāni","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez <code>ok<\/code> un <code>is<\/code> modulim <code>Test<\/code> ir salīdzinājumi dažādu veidu vērtībām.<\/span> <span class=\"sg\" data-s=\"1\">Šeit ir noderīgākie:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — pārbauda, vai divas vērtības ir vienādas (kā virknes vai skaitļi)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — pārbauda, vai divas datu struktūras ir pilnīgi vienādas, ieskaitot to tipus<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — pārbauda, vai virkne atbilst regulārajai izteiksmei<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — izdodas, kad divas vērtības <strong>nav<\/strong> vienādas<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> ir pareizā izvēle masīviem, jaukteņiem un ligzdotiem datiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas precīzi salīdzina gan struktūru, gan tipu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> pārvērstu vērtības virknēs un salīdzinātu tās brīvi.<\/span> <span class=\"sg\" data-s=\"1\">Bet <code>is-deeply<\/code> prasa, lai struktūras tiešām sakristu.<\/span> <span class=\"sg\" data-s=\"2\">Ievērojiet, ka <code>done-testing<\/code> liek plānu <code>1..1<\/code> beigās, pēc pārbaudes.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jums nav obligāti jāļauj <code>done-testing<\/code> saskaitīt testus jūsu vietā.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā skaitu var norādīt sākumā ar <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas jūs pasargā no testu faila, kas apstājas par agru un klusi izlaiž dažas pārbaudes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šoreiz plāns nāk <strong>pirmais<\/strong>, pirms rezultātiem:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Šī ir redzamā atšķirība no <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> izdrukā skaitu <code>1..2<\/code> augšā, pirms izpildās kāda pārbaude.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> savukārt to izdrukā pašās beigās.<\/span> <span class=\"sg\" data-s=\"3\">Jebkurā gadījumā ar <code>plan 2<\/code> izpilde gaida tieši divus testus.<\/span> <span class=\"sg\" data-s=\"4\">Ja izpildās mazāk vai vairāk testu, testu kopa tiek ziņota kā neizdevusies.<\/span> <span class=\"sg\" data-s=\"5\">Izmantojiet <code>plan<\/code>, kad testu skaits ir noteikts un zināms.<\/span> <span class=\"sg\" data-s=\"6\">Izmantojiet <code>done-testing<\/code>, kad ir vieglāk ļaut testēšanas ietvaram skaitīt.<\/span><\/p>"]]},"ru":{"t":"Сравнения и планы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Кроме <code>ok<\/code> и <code>is<\/code>, в модуле <code>Test<\/code> есть функции сравнения для разных видов значений.<\/span> <span class=\"sg\" data-s=\"1\">Вот самые полезные из них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — проверяет, равны ли два значения (как строки или числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — проверяет, что две структуры данных точно равны, включая их типы<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — проверяет, что строка соответствует регулярному выражению<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — проходит, когда два значения <strong>не<\/strong> равны<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> — правильный выбор для массивов, хэшей и вложенных данных.<\/span> <span class=\"sg\" data-s=\"1\">Он точно сравнивает и структуру, и тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вывод:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> превратил бы значения в строки и сравнил бы их нестрого.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>is-deeply<\/code> требует, чтобы структуры действительно совпадали.<\/span> <span class=\"sg\" data-s=\"2\">Обратите внимание, что <code>done-testing<\/code> ставит план <code>1..1<\/code> в конец, после проверки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не обязательно позволять <code>done-testing<\/code> считать тесты за вас.<\/span> <span class=\"sg\" data-s=\"1\">Вместо этого можно указать их число в начале с помощью <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это защищает от тестового файла, который завершается раньше времени и молча пропускает некоторые проверки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">На этот раз план стоит <strong>первым<\/strong>, перед результатами:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Вот отличие от <code>done-testing<\/code>, которое можно увидеть.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> печатает количество <code>1..2<\/code> вверху, до начала всех проверок.<\/span> <span class=\"sg\" data-s=\"2\">А <code>done-testing<\/code> печатает его в самом конце.<\/span> <span class=\"sg\" data-s=\"3\">В любом случае при <code>plan 2<\/code> запуск ожидает ровно два теста.<\/span> <span class=\"sg\" data-s=\"4\">Если запустится меньше или больше тестов, набор тестов будет считаться неудачным.<\/span> <span class=\"sg\" data-s=\"5\">Используйте <code>plan<\/code>, когда число тестов постоянно и известно.<\/span> <span class=\"sg\" data-s=\"6\">Используйте <code>done-testing<\/code>, когда проще дать фреймворку для тестов посчитать самому.<\/span><\/p>"]]},"uk":{"t":"Порівняння та плани","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окрім <code>ok<\/code> та <code>is<\/code>, модуль <code>Test<\/code> має порівняння для різних видів значень.<\/span> <span class=\"sg\" data-s=\"1\">Ось найкорисніші з них:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — перевіряє, чи рівні два значення (як рядки чи числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — перевіряє, що дві структури даних точно рівні, разом з їхніми типами<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — перевіряє, що рядок збігається з регулярним виразом<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — проходить, коли два значення <strong>не<\/strong> рівні<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> — правильний вибір для масивів, хешів і вкладених даних.<\/span> <span class=\"sg\" data-s=\"1\">Він точно порівнює і структуру, і тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це виводить:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> перетворив би значення на рядки й порівняв би їх нестрого.<\/span> <span class=\"sg\" data-s=\"1\">Але <code>is-deeply<\/code> вимагає, щоб структури справді збігалися.<\/span> <span class=\"sg\" data-s=\"2\">Зверніть увагу, що <code>done-testing<\/code> ставить план <code>1..1<\/code> у кінці, після перевірки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вам не обов'язково доручати <code>done-testing<\/code> рахувати тести за вас.<\/span> <span class=\"sg\" data-s=\"1\">Натомість ви можете вказати їхню кількість на початку через <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це захищає вас від файлу тестів, який зупиняється рано й тихо пропускає деякі перевірки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Цього разу план іде <strong>першим<\/strong>, перед результатами:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Це і є видима відмінність від <code>done-testing<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> виводить кількість <code>1..2<\/code> угорі, ще до того, як запускаються перевірки.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> натомість виводить її в самому кінці.<\/span> <span class=\"sg\" data-s=\"3\">У будь-якому разі з <code>plan 2<\/code> запуск очікує рівно двох тестів.<\/span> <span class=\"sg\" data-s=\"4\">Якщо запуститься менше або більше тестів, набір тестів вважатиметься невдалим.<\/span> <span class=\"sg\" data-s=\"5\">Використовуйте <code>plan<\/code>, коли кількість тестів незмінна й відома.<\/span> <span class=\"sg\" data-s=\"6\">Використовуйте <code>done-testing<\/code>, коли простіше дати фреймворку тестування порахувати їх.<\/span><\/p>"]]},"bg":{"t":"Сравнения и планове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Освен <code>ok<\/code> и <code>is<\/code>, модулът <code>Test<\/code> има сравнения за различни видове стойности.<\/span> <span class=\"sg\" data-s=\"1\">Ето най-полезните от тях:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — проверява дали две стойности са равни (като низове или числа)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — проверява дали две структури от данни са точно равни, включително типовете им<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — проверява дали низ съвпада с регулярен израз<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — минава, когато две стойности <strong>не<\/strong> са равни<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> е правилният избор за масиви, хешове и вложени данни.<\/span> <span class=\"sg\" data-s=\"1\">Тази функция сравнява точно и структурата, и типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това извежда:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> би превърнало стойностите в низове и би ги сравнило свободно.<\/span> <span class=\"sg\" data-s=\"1\">Но <code>is-deeply<\/code> изисква структурите наистина да съвпадат.<\/span> <span class=\"sg\" data-s=\"2\">Забележете, че <code>done-testing<\/code> слага плана <code>1..1<\/code> в края, след проверката.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не е нужно да оставяте <code>done-testing<\/code> да брои тестовете вместо вас.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това можете да дадете броя в началото с <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това ви пази от тестов файл, който спира рано и тихо пропуска някои проверки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Този път планът идва <strong>пръв<\/strong>, преди резултатите:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Това е разликата от <code>done-testing<\/code>, която можете да видите.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> извежда броя <code>1..2<\/code> най-горе, преди да започнат проверките.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> пък го извежда в самия край.<\/span> <span class=\"sg\" data-s=\"3\">Във всеки случай с <code>plan 2<\/code> изпълнението очаква точно два теста.<\/span> <span class=\"sg\" data-s=\"4\">Ако се изпълнят по-малко или повече тестове, наборът от тестове се отчита като неуспешен.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте <code>plan<\/code>, когато броят на тестовете е постоянен и известен.<\/span> <span class=\"sg\" data-s=\"6\">Използвайте <code>done-testing<\/code>, когато е по-лесно да оставите тестовата рамка да брои.<\/span><\/p>"]]},"eo":{"t":"Komparoj kaj planoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Krom <code>ok<\/code> kaj <code>is<\/code>, la modulo <code>Test<\/code> havas komparojn por diversaj specoj de valoroj.<\/span> <span class=\"sg\" data-s=\"1\">Jen la plej utilaj:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — kontrolas, ĉu du valoroj estas egalaj (kiel ĉenoj aŭ nombroj)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — kontrolas, ke du datumstrukturoj estas ekzakte egalaj, kune kun iliaj tipoj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — kontrolas, ke ĉeno kongruas kun regula esprimo<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — sukcesas, kiam du valoroj <strong>ne<\/strong> estas egalaj<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> estas la ĝusta elekto por tabeloj, asociaj tabeloj kaj nestitaj datumoj.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komparas kaj la strukturon kaj la tipon ekzakte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio presas:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> ŝanĝus la valorojn en ĉenojn kaj komparus ilin malstrikte.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>is-deeply<\/code> postulas, ke la strukturoj vere kongruu.<\/span> <span class=\"sg\" data-s=\"2\">Notu, ke <code>done-testing<\/code> metas la planon <code>1..1<\/code> ĉe la fino, post la kontrolo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ne devas lasi <code>done-testing<\/code> kalkuli la testojn por vi.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭe, vi povas doni la nombron ĉe la komenco per <code>plan<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio protektas vin kontraŭ testodosiero, kiu haltas frue kaj silente preterlasas iujn kontrolojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi-foje la plano venas <strong>unue<\/strong>, antaŭ la rezultoj:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Jen la diferenco de <code>done-testing<\/code>, kiun vi povas vidi.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> presas la kalkulon <code>1..2<\/code> supre, antaŭ ol iuj kontroloj ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> anstataŭe presas ĝin tute ĉe la fino.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiukaze, kun <code>plan 2<\/code> la rulo atendas ekzakte du testojn.<\/span> <span class=\"sg\" data-s=\"4\">Se ruliĝas malpli aŭ pli da testoj, la testoserio estas raportita kiel malsukcesinta.<\/span> <span class=\"sg\" data-s=\"5\">Uzu <code>plan<\/code>, kiam la nombro de testoj estas fiksita kaj konata.<\/span> <span class=\"sg\" data-s=\"6\">Uzu <code>done-testing<\/code>, kiam estas pli facile lasi la testan kadron kalkuli.<\/span><\/p>"]]},"la":{"t":"Comparationes et consilia","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Praeter <code>ok<\/code> et <code>is<\/code>, modulus <code>Test<\/code> comparationes pro diversis generibus valorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Ecce utilissimae:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>is<\/code> — verificat num duo valores aequales sint (ut chordae vel numeri)<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>is-deeply<\/code> — verificat duas structuras datorum exacte aequales esse, generibus inclusis<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>like<\/code> — verificat chordam expressioni regulari respondere<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>isnt<\/code> — transit cum duo valores <strong>non<\/strong> aequales sunt<\/span><\/li><\/ul>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>is-deeply<\/code> est electio recta pro ordinibus, mappis et datis nidificatis.<\/span> <span class=\"sg\" data-s=\"1\">Et structuram et genus exacte comparat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nmy @reversed = (1, 2, 3).reverse;\nis-deeply @reversed, [3, 2, 1], 'reversed';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - reversed\n1..1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>is<\/code> valores in chordas verteret et laxe compararet.<\/span> <span class=\"sg\" data-s=\"1\">Sed <code>is-deeply<\/code> postulat ut structurae vere conveniant.<\/span> <span class=\"sg\" data-s=\"2\">Nota <code>done-testing<\/code> consilium <code>1..1<\/code> in fine ponere, post probationem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non necesse est sinere ut <code>done-testing<\/code> probationes pro te numeret.<\/span> <span class=\"sg\" data-s=\"1\">Potius numerum in initio per <code>plan<\/code> dare potes.<\/span> <span class=\"sg\" data-s=\"2\">Hoc te custodit contra archivum probationum quod mature desinit et quasdam probationes tacite praeterit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nplan 2;\nok True,  'first';\nok 1 &lt; 2, 'second';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hac vice consilium <strong>primum<\/strong> venit, ante effectus:<\/span><\/p>"],["code",0,"<pre><code>1..2\nok 1 - first\nok 2 - second<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Haec est differentia a <code>done-testing<\/code> quam videre potes.<\/span> <span class=\"sg\" data-s=\"1\"><code>plan<\/code> numerum <code>1..2<\/code> in summo imprimit, antequam ullae probationes currunt.<\/span> <span class=\"sg\" data-s=\"2\"><code>done-testing<\/code> autem eum in ipso fine imprimit.<\/span> <span class=\"sg\" data-s=\"3\">Utroque modo cum <code>plan 2<\/code> cursus exacte duas probationes exspectat.<\/span> <span class=\"sg\" data-s=\"4\">Si pauciores vel plures probationes currunt, series probationum ut deficiens nuntiatur.<\/span> <span class=\"sg\" data-s=\"5\">Adhibe <code>plan<\/code> cum numerus probationum fixus et notus est.<\/span> <span class=\"sg\" data-s=\"6\">Adhibe <code>done-testing<\/code> cum facilius est sinere ut compages probationum numeret.<\/span><\/p>"]]}}}</script>
