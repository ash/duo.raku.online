ta-s=\"0\">Cuando lo ejecutas, imprime esto en el formato estándar de pruebas llamado <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada comprobación que pasa se muestra como <code>ok<\/code> con su número y su descripción.<\/span> <span class=\"sg\" data-s=\"1\">Una comprobación que falla mostraría <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La última línea, <code>1..2<\/code>, es el <em>plan<\/em>, que dice cuántas pruebas se ejecutaron.<\/span> <span class=\"sg\" data-s=\"3\">La llamada a <code>done-testing<\/code> al final imprime este plan automáticamente.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando esperas un valor concreto, <code>is<\/code> es más claro que <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si la prueba falla, <code>is<\/code> muestra tanto el valor esperado como el valor real:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Para ver cómo <code>is<\/code> informa de un problema, dale un valor esperado incorrecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ahora la comprobación falla, y la salida explica exactamente qué salió mal:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La línea <code>not ok<\/code> marca el fallo.<\/span> <span class=\"sg\" data-s=\"1\">Las líneas de debajo muestran qué se esperaba y qué obtuvo realmente el programa.< de>is<\/code> mostra sia il valore atteso sia il valore effettivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Per vedere come <code>is<\/code> segnala un problema, dagli un valore atteso sbagliato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ora il controllo fallisce, e l'output spiega esattamente cosa è andato storto:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La riga <code>not ok<\/code> segna il fallimento.<\/span> <span class=\"sg\" data-s=\"1\">Le righe sotto mostrano cosa era atteso e cosa ha ottenuto davvero il programma.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, quando conta un certo valore, <code>is<\/code> è più utile di un semplice <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> e <code>done-testing<\/code> bastano già per un file di test utile.<\/span> <span class=\"sg\" data-s=\"1\">L'argomento successivo aggiunge <a href=\"https://course.raku.org/it/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">gli altri confronti<\/a>.<\/span><\/p>"]]},"lv":{"t":"Test modulis","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Testēšanas rīkus jūs ielādējat ar <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pati vienkāršākā pārbaude ir <code>ok<\/code>, kas izdodas, kad tās nosacījums ir patiess.<\/span> <span class=\"sg\" data-s=\"2\">Katra pārbaude var saņemt arī aprakstu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jūs to palaižat, tā izdrukā šo standarta testu formātā, ko sauc par <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Katra pārbaude, kas izdodas, tiek parādīta kā <code>ok<\/code> ar savu numuru un aprakstu.<\/span> <span class=\"sg\" data-s=\"1\">Neizdevusies pārbaude rādītu <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēdējā rinda, <code>1..2<\/code>, ir <em>plāns<\/em>, kas pasaka, cik testu izpildījās.<\/span> <span class=\"sg\" data-s=\"3\">Izsaukums <code>done-testing<\/code> beigās šo plānu izdrukā automātiski.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jūs gaidāt noteiktu vērtību, <code>is<\/code> ir skaidrāks nekā <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja tests neizdodas, <code>is<\/code> parāda gan gaidīto, gan faktisko vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Lai redzētu, kā <code>is<\/code> ziņo par problēmu, dodiet tam nepareizu gaidīto vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tagad pārbaude neizdodas, un izvade paskaidro, kas tieši nogāja greizi:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rinda <code>not ok<\/code> iezīmē neveiksmi.<\/span> <span class=\"sg\" data-s=\"1\">Rindas zem tās parāda, kas tika gaidīts un ko programma patiesībā ieguva.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc, kad svarīga ir noteikta vērtība, <code>is<\/code> ir noderīgāks nekā vienkāršs <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>ok<\/code>, <code>is<\/code> un <code>done-testing<\/code> jau pietiek noderīgam testu failam.<\/span> <span class=\"sg\" data-s=\"1\">Nākamais temats pievieno <a href=\"https://course.raku.org/lv/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">pārējos salīdzinājumus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Модуль Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы загружаете инструменты для тестирования с помощью <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Самая базовая проверка — <code>ok<\/code>, которая проходит, когда её условие истинно.<\/span> <span class=\"sg\" data-s=\"2\">Каждая проверка может также принимать описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если её запустить, она выведет это в стандартном формате тестов, который называется <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждая проверка, которая прошла, показана как <code>ok<\/code> с номером и описанием.<\/span> <span class=\"sg\" data-s=\"1\">Проверка, которая не прошла, показала бы <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последняя строка, <code>1..2<\/code>, — это <em>план<\/em>, который говорит, сколько тестов было выполнено.<\/span> <span class=\"sg\" data-s=\"3\">Вызов <code>done-testing<\/code> в конце печатает этот план автоматически.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы ожидаете определённое значение, <code>is<\/code> понятнее, чем <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если тест не проходит, <code>is<\/code> показывает и ожидаемое, и фактическое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Эта программа выводит <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы увидеть, как <code>is<\/code> сообщает о проблеме, передайте ему неверное ожидаемое значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Теперь проверка не проходит, и вывод точно объясняет, что пошло не так:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Строка <code>not ok<\/code> отмечает неудачу.<\/span> <span class=\"sg\" data-s=\"1\">Строки под ней показывают, что ожидалось и что программа получила на самом деле.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому, когда важно определённое значение, <code>is<\/code> полезнее, чем простой <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> — этого уже достаточно для полезного тестового файла.<\/span> <span class=\"sg\" data-s=\"1\">Следующая тема добавляет <a href=\"https://course.raku.org/ru/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другие виды сравнений<\/a>.<\/span><\/p>"]]},"uk":{"t":"Модуль Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви завантажуєте інструменти тестування через <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Найпростіша перевірка — <code>ok<\/code>, яка проходить, коли її умова істинна.<\/span> <span class=\"sg\" data-s=\"2\">Кожна перевірка також може приймати опис:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо її запустити, вона виводить таке у стандартному форматі тестів під назвою <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожну перевірку, яка пройшла, показано як <code>ok<\/code> з її номером та описом.<\/span> <span class=\"sg\" data-s=\"1\">Невдала перевірка показала б <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Останній рядок, <code>1..2<\/code>, — це <em>план<\/em>, який каже, скільки тестів виконалося.<\/span> <span class=\"sg\" data-s=\"3\">Виклик <code>done-testing<\/code> у кінці виводить цей план автоматично.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви очікуєте певне значення, <code>is<\/code> зрозуміліший за <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо тест не проходить, <code>is<\/code> показує і очікуване значення, і фактичне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щоб побачити, як <code>is<\/code> повідомляє про проблему, дайте йому неправильне очікуване значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тепер перевірка не проходить, і вивід точно пояснює, що пішло не так:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Рядок <code>not ok<\/code> позначає невдачу.<\/span> <span class=\"sg\" data-s=\"1\">Рядки під ним показують, що очікувалося і що програма насправді отримала.<\/span> <span class=\"sg\" data-s=\"2\">Тож коли важливе певне значення, <code>is<\/code> корисніший за простий <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> і <code>done-testing<\/code> уже достатньо для корисного файлу тестів.<\/span> <span class=\"sg\" data-s=\"1\">Наступна тема додає <a href=\"https://course.raku.org/uk/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">інші порівняння<\/a>.<\/span><\/p>"]]},"bg":{"t":"Модулът Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Зареждате инструментите за тестване с <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Най-основната проверка е <code>ok<\/code>, която минава, когато условието ѝ е вярно.<\/span> <span class=\"sg\" data-s=\"2\">Всяка проверка може да приеме и описание:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато я изпълните, тя извежда това в стандартния тестов формат, наречен <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всяка проверка, която минава, се показва като <code>ok<\/code> с нейния номер и описание.<\/span> <span class=\"sg\" data-s=\"1\">Неуспешна проверка би показала <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Последният ред, <code>1..2<\/code>, е <em>планът<\/em>, който казва колко теста са се изпълнили.<\/span> <span class=\"sg\" data-s=\"3\">Извикването на <code>done-testing<\/code> в края извежда този план автоматично.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато очаквате определена стойност, <code>is<\/code> е по-ясно от <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако тестът не мине, <code>is<\/code> показва и очакваната, и действителната стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това извежда <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За да видите как <code>is<\/code> съобщава за проблем, дайте му грешна очаквана стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Сега проверката се проваля и изходът обяснява точно какво се е объркало:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Редът <code>not ok<\/code> отбелязва неуспеха.<\/span> <span class=\"sg\" data-s=\"1\">Редовете под него показват какво се е очаквало и какво програмата всъщност е получила.<\/span> <span class=\"sg\" data-s=\"2\">Затова, когато определена стойност е важна, <code>is<\/code> е по-полезно от обикновено <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> и <code>done-testing<\/code> вече стигат за полезен тестов файл.<\/span> <span class=\"sg\" data-s=\"1\">Следващата тема добавя <a href=\"https://course.raku.org/bg/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">другите сравнения<\/a>.<\/span><\/p>"]]},"eo":{"t":"La modulo Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ŝargas la testadajn ilojn per <code>use Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La plej baza kontrolo estas <code>ok<\/code>, kiu sukcesas, kiam ĝia kondiĉo estas vera.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu kontrolo povas ankaŭ akcepti priskribon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi rulas ĝin, ĝi presas jenon en la norma testformato nomata <em>TAP<\/em>:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu kontrolo, kiu sukcesas, aperas kiel <code>ok<\/code> kun sia numero kaj priskribo.<\/span> <span class=\"sg\" data-s=\"1\">Malsukcesa kontrolo montrus <code>not ok<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La lasta linio, <code>1..2<\/code>, estas la <em>plano<\/em>, kiu diras, kiom da testoj ruliĝis.<\/span> <span class=\"sg\" data-s=\"3\">La alvoko <code>done-testing<\/code> ĉe la fino presas ĉi tiun planon aŭtomate.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi atendas certan valoron, <code>is<\/code> estas pli klara ol <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se la testo malsukcesas, <code>is<\/code> montras kaj la atendatan valoron kaj la realan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio presas <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por vidi, kiel <code>is<\/code> raportas problemon, donu al ĝi malĝustan atendatan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nun la kontrolo malsukcesas, kaj la eligo klarigas ekzakte, kio misiris:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La linio <code>not ok<\/code> markas la malsukceson.<\/span> <span class=\"sg\" data-s=\"1\">La linioj sub ĝi montras, kio estis atendata kaj kion la programo efektive ricevis.<\/span> <span class=\"sg\" data-s=\"2\">Do kiam certa valoro gravas, <code>is<\/code> estas pli helpa ol simpla <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> kaj <code>done-testing<\/code> jam sufiĉas por utila testodosiero.<\/span> <span class=\"sg\" data-s=\"1\">La sekva temo aldonas <a href=\"https://course.raku.org/eo/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">la aliajn komparojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Modulus Test","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Instrumenta probandi per <code>use Test<\/code> oneras.<\/span> <span class=\"sg\" data-s=\"1\">Probatio simplicissima est <code>ok<\/code>, quae transit cum condicio eius vera est.<\/span> <span class=\"sg\" data-s=\"2\">Quaeque probatio etiam descriptionem accipere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nok 1 == 1, 'one equals one';\nok 2 &gt; 1,  'two is greater';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum id curris, hoc imprimit in forma probationum normali quae <em>TAP<\/em> appellatur:<\/span><\/p>"],["code",0,"<pre><code>ok 1 - one equals one\nok 2 - two is greater\n1..2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quaeque probatio quae transit ut <code>ok<\/code> cum numero et descriptione ostenditur.<\/span> <span class=\"sg\" data-s=\"1\">Probatio deficiens <code>not ok<\/code> ostenderet.<\/span> <span class=\"sg\" data-s=\"2\">Ultima linea, <code>1..2<\/code>, est <em>consilium<\/em>, quod dicit quot probationes cucurrerint.<\/span> <span class=\"sg\" data-s=\"3\">Vocatio <code>done-testing<\/code> in fine hoc consilium sponte imprimit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum certum valorem exspectas, <code>is<\/code> clarior est quam <code>ok<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si probatio deficit, <code>is<\/code> et valorem exspectatum et valorem actualem ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 4, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc imprimit <code>ok 1 - addition works<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ut videas quomodo <code>is<\/code> problema nuntiet, da ei valorem exspectatum falsum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Test;\n\nis 2 + 2, 5, 'addition works';\n\ndone-testing;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nunc probatio deficit, et exitus prorsus explicat quid male evenerit:<\/span><\/p>"],["code",0,"<pre><code>not ok 1 - addition works\n# Failed test 'addition works'\n# at test.raku line 3\n# expected: '5'\n#      got: '4'\n1..1\n# You failed 1 test of 1<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Linea <code>not ok<\/code> defectum notat.<\/span> <span class=\"sg\" data-s=\"1\">Lineae infra ostendunt quid exspectatum sit et quid programma revera acceperit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque cum certus valor refert, <code>is<\/code> utilior est quam simplex <code>ok<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>ok<\/code>, <code>is<\/code> et <code>done-testing<\/code> iam sufficiunt ad archivum probationum utile.<\/span> <span class=\"sg\" data-s=\"1\">Argumentum sequens <a href=\"https://course.raku.org/la/advanced/testing/comparisons/\" target=\"_blank\" rel=\"noopener\">ceteras comparationes<\/a> addit.<\/span><\/p>"]]}}}</script>
