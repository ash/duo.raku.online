\" data-s=\"4\">The ecosystem runs them to check a distribution before anyone installs it.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Test files have a <code>.rakutest<\/code> (or <code>.t<\/code>) extension. They usually have numbers in their names, as in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"de":{"t":"Tests ausführen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine einzelne Testdatei ist einfach ein Raku-Programm.<\/span> <span class=\"sg\" data-s=\"1\">Also kannst du sie direkt ausführen:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie gibt ihre TAP-Ausgabe auf dem Bildschirm aus.<\/span> <span class=\"sg\" data-s=\"1\">Wenn du mehr als ein oder zwei Dateien hast, brauchst du einen <em>Test-Runner<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Er führt ein ganzes Verzeichnis von Tests aus und fasst die Ergebnisse zusammen.<\/span> <span class=\"sg\" data-s=\"3\">Der Runner für Raku ist <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das führt jede Testdatei unter <code>t/<\/code> aus und meldet, wie viele Dateien und Tests bestanden wurden.<\/span> <span class=\"sg\" data-s=\"1\">Am Ende gibt es ein Gesamtergebnis, bestanden oder fehlgeschlagen.<\/span> <span class=\"sg\" data-s=\"2\">Das ist viel leichter zu lesen als das rohe TAP aus jeder Datei.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Distribution eine <code>META6.json<\/code> hat, kann das Modultool ihre Tests für dich ausführen:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> findet das Verzeichnis <code>t/<\/code>, führt die Tests aus und meldet das Ergebnis.<\/span> <span class=\"sg\" data-s=\"1\">Genau dasselbe passiert automatisch, bevor eine Distribution installiert wird.<\/span> <span class=\"sg\" data-s=\"2\">Tests haben also zwei Aufgaben.<\/span> <span class=\"sg\" data-s=\"3\">Du führst sie mit <code>prove6<\/code> aus, während du entwickelst.<\/span> <span class=\"sg\" data-s=\"4\">Das Ökosystem führt sie aus, um eine Distribution zu prüfen, bevor jemand sie installiert.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testdateien haben die Endung <code>.rakutest<\/code> (oder <code>.t<\/code>). Sie haben meist Nummern im Namen, wie in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"nl":{"t":"Tests uitvoeren","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Een enkel testbestand is gewoon een Raku-programma.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt het dus direct uitvoeren:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het print zijn TAP-uitvoer op het scherm.<\/span> <span class=\"sg\" data-s=\"1\">Als je meer dan één of twee bestanden hebt, heb je een <em>test runner<\/em> nodig.<\/span> <span class=\"sg\" data-s=\"2\">Die voert een hele map met tests uit en geeft een samenvatting van de resultaten.<\/span> <span class=\"sg\" data-s=\"3\">De runner voor Raku is <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit voert elk testbestand onder <code>t/<\/code> uit en meldt hoeveel bestanden en tests geslaagd zijn.<\/span> <span class=\"sg\" data-s=\"1\">Aan het eind staat één totaalresultaat: geslaagd of mislukt.<\/span> <span class=\"sg\" data-s=\"2\">Dit is veel makkelijker te lezen dan de ruwe TAP van elk bestand.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als een distributie een <code>META6.json<\/code> heeft, kan de moduletool de tests voor je uitvoeren:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> vindt de map <code>t/<\/code>, voert de tests uit en meldt het resultaat.<\/span> <span class=\"sg\" data-s=\"1\">Precies hetzelfde gebeurt automatisch voordat een distributie wordt geïnstalleerd.<\/span> <span class=\"sg\" data-s=\"2\">Tests hebben dus twee taken.<\/span> <span class=\"sg\" data-s=\"3\">Jij voert ze uit met <code>prove6<\/code> terwijl je aan het ontwikkelen bent.<\/span> <span class=\"sg\" data-s=\"4\">Het ecosysteem voert ze uit om een distributie te controleren voordat iemand die distributie installeert.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testbestanden hebben de extensie <code>.rakutest<\/code> (of <code>.t<\/code>). Meestal staan er nummers in hun naam, zoals in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"es":{"t":"Ejecutar pruebas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Un solo archivo de pruebas es simplemente un programa Raku.<\/span> <span class=\"sg\" data-s=\"1\">Así que puedes ejecutarlo directamente:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Imprime su salida TAP en la pantalla.<\/span> <span class=\"sg\" data-s=\"1\">Cuando tienes más de uno o dos archivos, necesitas un <em>ejecutor de pruebas<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ejecuta un directorio entero de pruebas y da un resumen de los resultados.<\/span> <span class=\"sg\" data-s=\"3\">El ejecutor de Raku es <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto ejecuta cada archivo de pruebas de <code>t/<\/code> e informa de cuántos archivos y pruebas pasaron.<\/span> <span class=\"sg\" data-s=\"1\">Al final, hay un resultado global, aprobado o fallido.<\/span> <span class=\"sg\" data-s=\"2\">Esto es mucho más fácil de leer que el TAP en bruto de cada archivo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si una distribución tiene un <code>META6.json<\/code>, la herramienta de mó a leggere del TAP grezzo di ciascun file.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se una distribuzione ha un <code>META6.json<\/code>, lo strumento per i moduli può eseguire i suoi test per te:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> trova la directory <code>t/<\/code>, esegue i test e riporta il risultato.<\/span> <span class=\"sg\" data-s=\"1\">Esattamente la stessa cosa succede in automatico prima che una distribuzione venga installata.<\/span> <span class=\"sg\" data-s=\"2\">Quindi i test hanno due compiti.<\/span> <span class=\"sg\" data-s=\"3\">Tu li esegui con <code>prove6<\/code> mentre sviluppi.<\/span> <span class=\"sg\" data-s=\"4\">L'ecosistema li esegue per controllare una distribuzione prima che qualcuno la installi.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">I file di test hanno l'estensione <code>.rakutest<\/code> (o <code>.t<\/code>). Di solito hanno dei numeri nel nome, come in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"lv":{"t":"Testu palaišana","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Atsevišķs testu fails ir vienkārši Raku programma.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc to var palaist tieši:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā savu TAP izvadi ekrānā.<\/span> <span class=\"sg\" data-s=\"1\">Kad jums ir vairāk par vienu vai diviem failiem, jums vajadzīgs <em>testu palaidējs<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tas izpilda veselu testu direktoriju un dod rezultātu kopsavilkumu.<\/span> <span class=\"sg\" data-s=\"3\">Raku palaidējs ir <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas izpilda katru testu failu zem <code>t/<\/code> un ziņo, cik failu un testu izdevās.<\/span> <span class=\"sg\" data-s=\"1\">Beigās ir viens kopējs rezultāts: izdevās vai neizdevās.<\/span> <span class=\"sg\" data-s=\"2\">To ir daudz vieglāk lasīt nekā katra faila neapstrādāto TAP.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja distribūcijai ir <code>META6.json<\/code>, moduļu rīks var izpildīt tās testus jūsu vietā:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> atrod direktoriju <code>t/<\/code>, izpilda testus un ziņo rezultātu.<\/span> <span class=\"sg\" data-s=\"1\">Tieši tas pats notiek automātiski, pirms distribūcija tiek instalēta.<\/span> <span class=\"sg\" data-s=\"2\">Tātad testiem ir divi uzdevumi.<\/span> <span class=\"sg\" data-s=\"3\">Jūs tos palaižat ar <code>prove6<\/code>, kamēr izstrādājat kodu.<\/span> <span class=\"sg\" data-s=\"4\">Ekosistēma tos izpilda, lai pārbaudītu distribūciju, pirms kāds to instalē.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testu failiem ir paplašinājums <code>.rakutest<\/code> (vai <code>.t<\/code>). Parasti to nosaukumos ir numuri, kā <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"ru":{"t":"Запуск тестов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Отдельный тестовый файл — это просто программа на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому его можно запустить напрямую:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Он печатает на экран результат в формате TAP.<\/span> <span class=\"sg\" data-s=\"1\">Когда у вас больше одного-двух файлов, нужно <em>средство запуска тестов<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Оно запускает целую директорию тестов и даёт сводку результатов.<\/span> <span class=\"sg\" data-s=\"3\">Для Raku такое средство — <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Эта команда запускает все тестовые файлы в <code>t/<\/code> и сообщает, сколько файлов и тестов прошло.<\/span> <span class=\"sg\" data-s=\"1\">В конце есть один общий результат: успех или неудача.<\/span> <span class=\"sg\" data-s=\"2\">Это читать гораздо легче, чем необработанный TAP каждого файла.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если у дистрибутива есть <code>META6.json<\/code>, инструмент управления модулями может запустить его тесты за вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> находит директорию <code>t/<\/code>, запускает тесты и сообщает результат.<\/span> <span class=\"sg\" data-s=\"1\">Точно то же самое происходит автоматически перед установкой дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому у тестов две задачи.<\/span> <span class=\"sg\" data-s=\"3\">Вы запускаете их с помощью <code>prove6<\/code> во время разработки.<\/span> <span class=\"sg\" data-s=\"4\">Экосистема запускает их, чтобы проверить дистрибутив, прежде чем кто-то его установит.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тестовые файлы имеют расширение <code>.rakutest<\/code> (или <code>.t<\/code>). Обычно в их именах есть номера, как в <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"uk":{"t":"Запуск тестів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Окремий файл тестів — це просто програма на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Тож його можна запустити напряму:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Він виводить на екран свій результат у форматі TAP.<\/span> <span class=\"sg\" data-s=\"1\">Коли у вас більше ніж один-два файли, вам потрібен <em>запускач тестів<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Він запускає цілий каталог тестів і підсумовує результати.<\/span> <span class=\"sg\" data-s=\"3\">Запускач для Raku — це <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це запускає кожен файл тестів під <code>t/<\/code> і повідомляє, скільки файлів і тестів пройшло.<\/span> <span class=\"sg\" data-s=\"1\">У кінці є один загальний результат: пройдено чи не пройдено.<\/span> <span class=\"sg\" data-s=\"2\">Це набагато легше читати, ніж сирий TAP із кожного файлу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо дистрибутив має <code>META6.json<\/code>, інструмент для модулів може запустити його тести за вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> знаходить каталог <code>t/<\/code>, запускає тести й повідомляє результат.<\/span> <span class=\"sg\" data-s=\"1\">Точно те саме відбувається автоматично перед встановленням дистрибутива.<\/span> <span class=\"sg\" data-s=\"2\">Отже, тести мають два завдання.<\/span> <span class=\"sg\" data-s=\"3\">Ви запускаєте їх через <code>prove6<\/code> під час розробки.<\/span> <span class=\"sg\" data-s=\"4\">Екосистема запускає їх, щоб перевірити дистрибутив, перш ніж хтось його встановить.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Файли тестів мають розширення <code>.rakutest<\/code> (або <code>.t<\/code>). Зазвичай у їхніх назвах є номери, як-от <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"bg":{"t":"Стартиране на тестове","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Един тестов файл е просто програма на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Затова можете да го стартирате директно:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Той извежда своя TAP резултат на екрана.<\/span> <span class=\"sg\" data-s=\"1\">Когато имате повече от един-два файла, ви трябва <em>тестов изпълнител<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Той изпълнява цяла директория с тестове и обобщава резултатите.<\/span> <span class=\"sg\" data-s=\"3\">Изпълнителят за Raku е <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това изпълнява всеки тестов файл под <code>t/<\/code> и отчита колко файла и теста са минали.<\/span> <span class=\"sg\" data-s=\"1\">Накрая има един общ резултат, успех или неуспех.<\/span> <span class=\"sg\" data-s=\"2\">Това се чете много по-лесно от суровия TAP от всеки файл.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако дистрибуцията има <code>META6.json<\/code>, инструментът за модули може да изпълни тестовете ѝ вместо вас:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> намира директорията <code>t/<\/code>, изпълнява тестовете и отчита резултата.<\/span> <span class=\"sg\" data-s=\"1\">Точно същото става автоматично преди инсталирането на дистрибуция.<\/span> <span class=\"sg\" data-s=\"2\">Така тестовете имат две задачи.<\/span> <span class=\"sg\" data-s=\"3\">Вие ги изпълнявате с <code>prove6<\/code>, докато разработвате.<\/span> <span class=\"sg\" data-s=\"4\">Екосистемата ги изпълнява, за да провери дистрибуцията, преди някой да я инсталира.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Тестовите файлове имат разширение <code>.rakutest<\/code> (или <code>.t<\/code>). Обикновено имената им съдържат номера, както в <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"eo":{"t":"Rulado de testoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ununura testodosiero estas simple Raku-programo.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas ruli ĝin rekte:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝi presas sian TAP-eligon sur la ekrano.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi havas pli ol unu aŭ du dosierojn, vi bezonas <em>testorulanton<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi rulas tutan dosierujon de testoj kaj donas resumon de la rezultoj.<\/span> <span class=\"sg\" data-s=\"3\">La rulanto por Raku estas <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tio rulas ĉiun testodosieron sub <code>t/<\/code> kaj raportas, kiom da dosieroj kaj testoj sukcesis.<\/span> <span class=\"sg\" data-s=\"1\">Ĉe la fino estas unu ĝenerala rezulto, sukceso aŭ malsukceso.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas multe pli facile legebla ol la kruda TAP el ĉiu dosiero.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se distribuo havas <code>META6.json<\/code>, la modula ilo povas ruli ĝiajn testojn por vi:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> trovas la dosierujon <code>t/<\/code>, rulas la testojn kaj raportas la rezulton.<\/span> <span class=\"sg\" data-s=\"1\">Ekzakte la sama afero okazas aŭtomate, antaŭ ol distribuo estas instalita.<\/span> <span class=\"sg\" data-s=\"2\">Do testoj havas du taskojn.<\/span> <span class=\"sg\" data-s=\"3\">Vi rulas ilin per <code>prove6<\/code>, dum vi programas.<\/span> <span class=\"sg\" data-s=\"4\">La ekosistemo rulas ilin por kontroli distribuon, antaŭ ol iu ajn instalas ĝin.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Testodosieroj havas la sufikson <code>.rakutest<\/code> (aŭ <code>.t<\/code>). Ili kutime havas nombrojn en siaj nomoj, kiel en <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]},"la":{"t":"Probationes currere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Unum archivum probationum merum programma Raku est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque id directe currere potes:<\/span><\/p>"],["code",0,"<pre><code>raku t/01-basic.rakutest<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Exitum suum TAP in screen imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Cum plura quam unum aut duo archiva habes, <em>cursorem probationum<\/em> requiris.<\/span> <span class=\"sg\" data-s=\"2\">Totum directorium probationum currit et summam effectuum dat.<\/span> <span class=\"sg\" data-s=\"3\">Cursor pro Raku est <code>prove6<\/code>:<\/span><\/p>"],["code",0,"<pre><code>prove6 t/<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc omne archivum probationum sub <code>t/<\/code> currit et nuntiat quot archiva et probationes transierint.<\/span> <span class=\"sg\" data-s=\"1\">In fine est unus effectus universalis, transit aut deficit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc multo facilius legitur quam nudum TAP ex singulis archivis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si distributio <code>META6.json<\/code> habet, instrumentum modulorum probationes eius pro te currere potest:<\/span><\/p>"],["code",0,"<pre><code>zef test .<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>zef test<\/code> directorium <code>t/<\/code> invenit, probationes currit et effectum nuntiat.<\/span> <span class=\"sg\" data-s=\"1\">Prorsus idem sponte fit antequam distributio installatur.<\/span> <span class=\"sg\" data-s=\"2\">Itaque probationes duo munera habent.<\/span> <span class=\"sg\" data-s=\"3\">Eas per <code>prove6<\/code> curris dum codicem evolvis.<\/span> <span class=\"sg\" data-s=\"4\">Oecosystema eas currit ut distributionem verificet antequam quisquam eam installat.<\/span><\/p>"],["quote",1,"<blockquote><span class=\"sg\" data-s=\"0\">Archiva probationum extensionem <code>.rakutest<\/code> (vel <code>.t<\/code>) habent. Plerumque numeros in nominibus habent, ut in <code>t/01-basic.rakutest<\/code>.<\/span><\/blockquote>"]]}}}</script>
