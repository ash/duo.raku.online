<script type="application/json" id="page-data">{"u":"advanced/testing","n":745,"k":"section","pv":"advanced/distributing/exercises/module-layout/solution","nx":"advanced/testing/test-module","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Testing","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tests check that your code does what it should.<\/span> <span class=\"sg\" data-s=\"1\">They also check that it keeps working when you change it.<\/span> <span class=\"sg\" data-s=\"2\">Raku comes with a testing module, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It also has standard ways to run whole sets of tests at once.<\/span> <span class=\"sg\" data-s=\"4\">Writing tests is a key part of building real Raku programs and modules.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This section covers the basic parts of the <code>Test<\/code> module.<\/span> <span class=\"sg\" data-s=\"1\">It also shows the kinds of comparison that it offers and how tests are run.<\/span><\/p>"]]},"de":{"t":"Testen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tests prüfen, ob dein Code das tut, was er soll.<\/span> <span class=\"sg\" data-s=\"1\">Sie prüfen auch, ob er weiter funktioniert, wenn du ihn änderst.<\/span> <span class=\"sg\" data-s=\"2\">Raku bringt ein Testmodul mit, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku hat auch Standardwege, um ganze Gruppen von Tests auf einmal auszuführen.<\/span> <span class=\"sg\" data-s=\"4\">Tests zu schreiben ist ein wichtiger Teil der Arbeit an echten Raku-Programmen und -Modulen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die grundlegenden Teile des <code>Test<\/code>-Moduls.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch, welche Arten von Vergleichen es bietet und wie man Tests ausführt.<\/span><\/p>"]]},"nl":{"t":"Testen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Tests controleren of je code doet wat die moet doen.<\/span> <span class=\"sg\" data-s=\"1\">Ze controleren ook of de code blijft werken als je die verandert.<\/span> <span class=\"sg\" data-s=\"2\">Raku wordt geleverd met een testmodule, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het heeft ook vaste manieren om hele reeksen tests tegelijk uit te voeren.<\/span> <span class=\"sg\" data-s=\"4\">Tests schrijven is een belangrijk deel van het bouwen van echte Raku-programma's en -modules.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dit onderdeel behandelt de basisdelen van de <code>Test<\/code>-module.<\/span> <span class=\"sg\" data-s=\"1\">Het laat ook zien welke soorten vergelijkingen de module biedt en hoe je tests uitvoert.<\/span><\/p>"]]},"es":{"t":"Pruebas","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Las pruebas comprueban que tu código hace lo que debe.<\/span> <span class=\"sg\" data-s=\"1\">También comprueban que sigue funcionando cuando lo cambias.<\/span> <span class=\"sg\" data-s=\"2\">Raku viene con un módulo de pruebas, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">También tiene formas estándar de ejecutar conjuntos enteros de pruebas a la vez.<\/span> <span class=\"sg\" data-s=\"4\">Escribir pruebas es una parte clave de crear programas y módulos reales en Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata las partes básicas del módulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">También muestra los tipos de comparación que ofrece y cómo se ejecutan las pruebas.<\/span><\/p>"]]},"it":{"t":"Test","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">I test controllano che il tuo codice faccia quello che deve.<\/span> <span class=\"sg\" data-s=\"1\">Controllano anche che continui a funzionare quando lo modifichi.<\/span> <span class=\"sg\" data-s=\"2\">Raku include un modulo di test, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ha anche dei modi standard per eseguire interi gruppi di test in una volta.<\/span> <span class=\"sg\" data-s=\"4\">Scrivere test è una parte fondamentale dello sviluppo di veri programmi e moduli Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta le parti di base del modulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche i tipi di confronto che offre e come si eseguono i test.<\/span><\/p>"]]},"lv":{"t":"Testēšana 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Testi pārbauda, vai jūsu kods dara to, kas tam jādara.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī pārbauda, vai tas turpina strādāt, kad jūs to maināt.<\/span> <span class=\"sg\" data-s=\"2\">Raku nāk kopā ar testēšanas moduli <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku piedāvā arī standarta veidus, kā izpildīt veselas testu kopas uzreiz.<\/span> <span class=\"sg\" data-s=\"4\">Testu rakstīšana ir svarīga darba daļa, veidojot īstas Raku programmas un moduļus.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko moduļa <code>Test<\/code> pamata daļas.<\/span> <span class=\"sg\" data-s=\"1\">Tā arī parāda, kādus salīdzināšanas veidus tas piedāvā un kā testi tiek izpildīti.<\/span><\/p>"]]},"ru":{"t":"Тестирование","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Тесты проверяют, что ваш код делает то, что должен.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они проверяют, что он продолжает работать, когда вы его меняете.<\/span> <span class=\"sg\" data-s=\"2\">Вместе с Raku идёт модуль для тестирования, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ещё в Raku есть стандартные способы запускать целые наборы тестов за один раз.<\/span> <span class=\"sg\" data-s=\"4\">Писать тесты — ключевая часть разработки настоящих программ и модулей на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Этот раздел рассказывает об основных частях модуля <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает, какие виды сравнений есть в модуле и как запускают тесты.<\/span><\/p>"]]},"uk":{"t":"Тестування","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Тести перевіряють, що ваш код робить те, що має робити.<\/span> <span class=\"sg\" data-s=\"1\">Також вони перевіряють, що код і далі працює, коли ви його змінюєте.<\/span> <span class=\"sg\" data-s=\"2\">Разом із Raku йде модуль тестування <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Також у Raku є стандартні способи запускати цілі набори тестів за раз.<\/span> <span class=\"sg\" data-s=\"4\">Писати тести — ключова частина створення справжніх програм і модулів на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює основні частини модуля <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Також він показує, які порівняння пропонує модуль і як запускають тести.<\/span><\/p>"]]},"bg":{"t":"Тестване 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Тестовете проверяват дали вашият код прави това, което трябва.<\/span> <span class=\"sg\" data-s=\"1\">Те проверяват също, че той продължава да работи, когато го променяте.<\/span> <span class=\"sg\" data-s=\"2\">Raku идва с модул за тестване, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Raku има и стандартни начини за изпълнение на цели набори от тестове наведнъж.<\/span> <span class=\"sg\" data-s=\"4\">Писането на тестове е основна част от създаването на истински програми и модули на Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тази секция обхваща основните части на модула <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя показва също видовете сравнения, които той предлага, и как се изпълняват тестовете.<\/span><\/p>"]]},"eo":{"t":"Testado","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Testoj kontrolas, ke via kodo faras tion, kion ĝi devas.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ kontrolas, ke ĝi daŭre funkcias, kiam vi ŝanĝas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Raku venas kun testada modulo, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ankaŭ havas normajn manierojn ruli tutajn arojn de testoj samtempe.<\/span> <span class=\"sg\" data-s=\"4\">Skribi testojn estas ĉefa parto de la konstruado de veraj programoj kaj moduloj en Raku.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la bazajn partojn de la modulo <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras la specojn de komparo, kiujn ĝi ofertas, kaj kiel oni rulas testojn.<\/span><\/p>"]]},"la":{"t":"Probatio","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Probationes verificant codicem tuum id agere quod debet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam verificant eum recte operari pergere cum eum mutas.<\/span> <span class=\"sg\" data-s=\"2\">Raku cum modulo probandi venit, <code>Test<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Etiam modos normales habet ad totas series probationum simul currendas.<\/span> <span class=\"sg\" data-s=\"4\">Probationes scribere magna pars operis est cum vera programmata et modulos Raku aedificas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sectio partes fundamentales moduli <code>Test<\/code> tractat.<\/span> <span class=\"sg\" data-s=\"1\">Etiam genera comparationum quae offert ostendit, et quomodo probationes currantur.<\/span><\/p>"]]}}}</script>
