<script type="application/json" id="page-data">{"u":"advanced/representations","n":337,"k":"section","pv":"advanced","nx":"advanced/representations/gist","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Turning values into text","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">When a program shows a value, it has to turn this value into text.<\/span> <span class=\"sg\" data-s=\"1\">This happens when you <code>say<\/code> the value, print it, or put it into a string.<\/span> <span class=\"sg\" data-s=\"2\">Raku does not have just one fixed way to do this.<\/span> <span class=\"sg\" data-s=\"3\">Instead, every value has a few standard methods.<\/span> <span class=\"sg\" data-s=\"4\">Each of them makes a string for a different purpose:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — a form that is easy for people to read. This is what <code>say<\/code> prints.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — the plain string form, for places where Raku needs a string.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — a code-like form, which is useful when you debug.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">All three are ordinary methods that every value in Raku has.<\/span> <span class=\"sg\" data-s=\"1\">So they work the same way on numbers, strings, arrays, and your own objects.<\/span> <span class=\"sg\" data-s=\"2\">The next pages look at each method one by one.<\/span> <span class=\"sg\" data-s=\"3\">Then they help you choose the right one.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"/advanced/dd/\">The section after that introduces <code>dd<\/code><\/a>, a Rakudo tool that is built on <code>.raku<\/code>.<\/span><\/p>"]]},"de":{"t":"Werte in Text umwandeln","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn ein Programm einen Wert zeigt, muss es diesen Wert in Text umwandeln.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert, wenn du den Wert mit <code>say<\/code> ausgibst, ihn druckst oder in einen String einfügst.<\/span> <span class=\"sg\" data-s=\"2\">Raku hat dafür nicht nur einen festen Weg.<\/span> <span class=\"sg\" data-s=\"3\">Stattdessen hat jeder Wert ein paar Standardmethoden.<\/span> <span class=\"sg\" data-s=\"4\">Jede davon erzeugt einen String für einen anderen Zweck:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — eine Form, die für Menschen leicht zu lesen ist. Diese Form gibt <code>say<\/code> aus.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — die einfache Stringform, für Stellen, an denen Raku einen String braucht.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — eine codeähnliche Form, die beim Debuggen nützlich ist.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Alle drei sind gewöhnliche Methoden, die jeder Wert in Raku hat.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb funktionieren sie gleich bei Zahlen, Strings, Arrays und deinen eigenen Objekten.<\/span> <span class=\"sg\" data-s=\"2\">Die nächsten Seiten sehen sich jede Methode einzeln an.<\/span> <span class=\"sg\" data-s=\"3\">Dann helfen sie dir, die richtige auszuwählen.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/de/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Der Abschnitt danach stellt <code>dd<\/code> vor<\/a>, ein Rakudo-Werkzeug, das auf <code>.raku<\/code> aufbaut.<\/span><\/p>"]]},"nl":{"t":"Waarden omzetten naar tekst","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Als een programma een waarde toont, moet het die waarde omzetten naar tekst.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt als je de waarde met <code>say<\/code> toont, print, of in een string zet.<\/span> <span class=\"sg\" data-s=\"2\">Raku heeft niet maar één vaste manier om dit te doen.<\/span> <span class=\"sg\" data-s=\"3\">In plaats daarvan heeft elke waarde een paar standaardmethodes.<\/span> <span class=\"sg\" data-s=\"4\">Elk daarvan maakt een string voor een ander doel:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — een vorm die mensen makkelijk kunnen lezen. Dit is wat <code>say<\/code> afdrukt.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — de gewone stringvorm, voor plekken waar Raku een string nodig heeft.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — een codeachtige vorm, die handig is bij het debuggen.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Alle drie zijn gewone methodes die elke waarde in Raku heeft.<\/span> <span class=\"sg\" data-s=\"1\">Dus werken ze op dezelfde manier voor getallen, strings, arrays en je eigen objecten.<\/span> <span class=\"sg\" data-s=\"2\">De volgende pagina's bekijken elke methode een voor een.<\/span> <span class=\"sg\" data-s=\"3\">Daarna helpen ze je de juiste te kiezen.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/nl/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Het deel daarna introduceert <code>dd<\/code><\/a>, een Rakudo-hulpmiddel dat op <code>.raku<\/code> gebouwd is.<\/span><\/p>"]]},"es":{"t":"Convirtiendo valores en texto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cuando un programa muestra un valor, tiene que convertir ese valor en texto.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa cuando muestras el valor con <code>say<\/code>, lo imprimes o lo pones en una cadena.<\/span> <span class=\"sg\" data-s=\"2\">Raku no tiene una sola forma fija de hacerlo.<\/span> <span class=\"sg\" data-s=\"3\">En cambio, cada valor tiene algunos métodos estándar.<\/span> <span class=\"sg\" data-s=\"4\">Cada uno de ellos crea una cadena con un propósito diferente:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma que las personas pueden leer fácilmente. Es lo que imprime <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma de cadena simple, para los lugares donde Raku necesita una cadena.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma similar a código, que es útil cuando depuras.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Los tres son métodos normales que tiene cada valor en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Por eso funcionan igual con números, cadenas, arreglos y tus propios objetos.<\/span> <span class=\"sg\" data-s=\"2\">Las páginas siguientes explican cada método uno por uno.<\/span> <span class=\"sg\" data-s=\"3\">Luego te ayudan a elegir el correcto.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/es/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sección siguiente presenta <code>dd<\/code><\/a>, una herramienta de Rakudo que se basa en <code>.raku<\/code>.<\/span><\/p>"]]},"it":{"t":"Trasformare valori in testo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Quando un programma mostra un valore, deve trasformarlo in testo.<\/span> <span class=\"sg\" data-s=\"1\">Succede quando stampi il valore con <code>say<\/code> o con <code>print<\/code>, o quando lo metti in una stringa.<\/span> <span class=\"sg\" data-s=\"2\">Raku non ha un solo modo fisso per farlo.<\/span> <span class=\"sg\" data-s=\"3\">Invece, ogni valore ha alcuni metodi standard.<\/span> <span class=\"sg\" data-s=\"4\">Ognuno di essi crea una stringa per uno scopo diverso:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — una forma facile da leggere per le persone. È quella che stampa <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la forma stringa semplice, per i punti in cui Raku ha bisogno di una stringa.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — una forma simile al codice, utile quando fai il debug.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tutti e tre sono metodi normali, presenti in ogni valore di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Così funzionano nello stesso modo su numeri, stringhe, array e oggetti creati da te.<\/span> <span class=\"sg\" data-s=\"2\">Le pagine seguenti guardano ogni metodo, uno alla volta.<\/span> <span class=\"sg\" data-s=\"3\">Poi ti aiutano a scegliere quello giusto.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/it/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sezione successiva presenta <code>dd<\/code><\/a>, uno strumento di Rakudo costruito sopra <code>.raku<\/code>.<\/span><\/p>"]]},"lv":{"t":"Vērtību pārvēršana tekstā","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kad programma parāda vērtību, tai šī vērtība jāpārvērš tekstā.<\/span> <span class=\"sg\" data-s=\"1\">Tas notiek, kad jūs vērtību izvadāt ar <code>say<\/code>, izdrukājat vai ievietojat virknē.<\/span> <span class=\"sg\" data-s=\"2\">Raku nav tikai viena fiksēta veida, kā to darīt.<\/span> <span class=\"sg\" data-s=\"3\">Tā vietā katrai vērtībai ir dažas standarta metodes.<\/span> <span class=\"sg\" data-s=\"4\">Katra no tām izveido virkni citam mērķim:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — forma, ko cilvēkiem ir viegli lasīt. Tieši to izdrukā <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — vienkārša virknes forma vietām, kur Raku vajag virkni.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — kodam līdzīga forma, kas noder, kad jūs atkļūdojat.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Visas trīs ir parastas metodes, kas ir katrai vērtībai Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tās darbojas vienādi ar skaitļiem, virknēm, masīviem un jūsu pašu objektiem.<\/span> <span class=\"sg\" data-s=\"2\">Nākamās lappuses aplūko katru metodi pa vienai.<\/span> <span class=\"sg\" data-s=\"3\">Tad tās palīdz jums izvēlēties pareizo.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/lv/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Nākamā sadaļa iepazīstina ar <code>dd<\/code><\/a> — Rakudo rīku, kura pamatā ir <code>.raku<\/code>.<\/span><\/p>"]]},"ru":{"t":"Преобразование значений в текст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Когда программа показывает значение, она должна превратить его в текст.<\/span> <span class=\"sg\" data-s=\"1\">Так бывает, когда вы выводите значение через <code>say<\/code>, печатаете его или вставляете в строку.<\/span> <span class=\"sg\" data-s=\"2\">В Raku нет одного-единственного способа сделать это.<\/span> <span class=\"sg\" data-s=\"3\">Вместо этого у каждого значения есть несколько стандартных методов.<\/span> <span class=\"sg\" data-s=\"4\">Каждый из них делает строку для своей цели:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, которую людям легко читать. Именно её печатает <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — простая строковая форма для мест, где Raku нужна строка.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, похожая на код, которая полезна при отладке.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Все три — обычные методы, которые есть у каждого значения в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому они одинаково работают с числами, строками, массивами и вашими собственными объектами.<\/span> <span class=\"sg\" data-s=\"2\">Следующие страницы рассматривают каждый метод по очереди.<\/span> <span class=\"sg\" data-s=\"3\">Затем они помогут вам выбрать подходящий.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/ru/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Следующий за ними раздел знакомит с <code>dd<\/code><\/a> — инструментом Rakudo, который построен на <code>.raku<\/code>.<\/span><\/p>"]]},"uk":{"t":"Перетворення значень у текст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Коли програма показує значення, вона має перетворити його на текст.<\/span> <span class=\"sg\" data-s=\"1\">Це стається, коли ви виводите значення через <code>say<\/code>, друкуєте його або вставляєте в рядок.<\/span> <span class=\"sg\" data-s=\"2\">У Raku немає лише одного сталого способу це зробити.<\/span> <span class=\"sg\" data-s=\"3\">Натомість кожне значення має кілька стандартних методів.<\/span> <span class=\"sg\" data-s=\"4\">Кожен із них створює рядок для іншої мети:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, яку людям легко читати. Саме її друкує <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — проста рядкова форма для місць, де Raku потрібен рядок.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — форма, схожа на код, яка корисна під час налагодження.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Усі три — звичайні методи, які має кожне значення в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Тому вони працюють однаково для чисел, рядків, масивів і ваших власних об'єктів.<\/span> <span class=\"sg\" data-s=\"2\">Наступні сторінки розглядають кожен метод по черзі.<\/span> <span class=\"sg\" data-s=\"3\">Потім вони допомагають вам вибрати правильний.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/uk/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Наступний розділ знайомить з <code>dd<\/code><\/a> — інструментом Rakudo, що працює на основі <code>.raku<\/code>.<\/span><\/p>"]]},"bg":{"t":"Превръщане на стойности в текст","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Когато програмата показва стойност, тя трябва да превърне тази стойност в текст.<\/span> <span class=\"sg\" data-s=\"1\">Това става, когато изведете стойността със <code>say<\/code>, отпечатате я или я сложите в низ.<\/span> <span class=\"sg\" data-s=\"2\">Raku няма само един фиксиран начин за това.<\/span> <span class=\"sg\" data-s=\"3\">Вместо това всяка стойност има няколко стандартни метода.<\/span> <span class=\"sg\" data-s=\"4\">Всеки от тях прави низ за различна цел:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — форма, която хората четат лесно. Точно нея отпечатва <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — обикновената форма на низ, за места, където Raku има нужда от низ.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — кодоподобна форма, която е полезна при дебъгване.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И трите са обикновени методи, които всяка стойност в Raku има.<\/span> <span class=\"sg\" data-s=\"1\">Затова работят по един и същи начин за числа, низове, масиви и ваши собствени обекти.<\/span> <span class=\"sg\" data-s=\"2\">Следващите страници разглеждат всеки метод поотделно.<\/span> <span class=\"sg\" data-s=\"3\">След това ви помагат да изберете правилния.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/bg/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Разделът след тях представя <code>dd<\/code><\/a>, инструмент на Rakudo, който е построен върху <code>.raku<\/code>.<\/span><\/p>"]]},"eo":{"t":"Konverti valorojn al teksto","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Kiam programo montras valoron, ĝi devas ŝanĝi ĉi tiun valoron en tekston.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, kiam vi uzas <code>say<\/code> por la valoro, presas ĝin, aŭ metas ĝin en ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">Raku ne havas nur unu fiksan manieron fari tion.<\/span> <span class=\"sg\" data-s=\"3\">Anstataŭe, ĉiu valoro havas kelkajn normajn metodojn.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu el ili faras ĉenon por alia celo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — formo, kiun homoj facile legas. Tion presas <code>say<\/code>.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — la simpla ĉenformo, por lokoj, kie Raku bezonas ĉenon.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — kodosimila formo, kiu estas utila, kiam vi sencimigas.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉiuj tri estas ordinaraj metodoj, kiujn havas ĉiu valoro en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Do ili funkcias same por nombroj, ĉenoj, tabeloj kaj viaj propraj objektoj.<\/span> <span class=\"sg\" data-s=\"2\">La sekvaj paĝoj rigardas ĉiun metodon unu post la alia.<\/span> <span class=\"sg\" data-s=\"3\">Poste ili helpas vin elekti la ĝustan.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/eo/advanced/dd/\" target=\"_blank\" rel=\"noopener\">La sekcio post tio prezentas <code>dd<\/code><\/a>, Rakudo-ilon, kiu estas konstruita sur <code>.raku<\/code>.<\/span><\/p>"]]},"la":{"t":"Valores in textum convertere","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Cum programma valorem ostendit, hunc valorem in textum convertere debet.<\/span> <span class=\"sg\" data-s=\"1\">Hoc accidit cum valorem cum <code>say<\/code> dicis, imprimis, vel in seriem ponis.<\/span> <span class=\"sg\" data-s=\"2\">Raku non habet unum solum modum fixum hoc faciendi.<\/span> <span class=\"sg\" data-s=\"3\">Potius quisque valor aliquot methodos normales habet.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque earum seriem ad diversum propositum facit:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>.gist<\/code> — forma quam homines facile legunt. Hanc formam <code>say<\/code> imprimit.<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>.Str<\/code> — forma seriei planae, pro locis ubi Raku seriem requirit.<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>.raku<\/code> — forma codici similis, quae utilis est dum errores corrigis.<\/span><\/li><\/ul>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Omnes tres sunt methodi ordinariae quas quisque valor in Raku habet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eodem modo in numeris, seriebus, ordinibus, et obiectis tuis propriis operantur.<\/span> <span class=\"sg\" data-s=\"2\">Paginae sequentes quamque methodum, unam post aliam, inspiciunt.<\/span> <span class=\"sg\" data-s=\"3\">Deinde te adiuvant rectam eligere.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/la/advanced/dd/\" target=\"_blank\" rel=\"noopener\">Sectio post eas <code>dd<\/code> introducit<\/a>, instrumentum Rakudo quod supra <code>.raku<\/code> aedificatum est.<\/span><\/p>"]]}}}</script>
