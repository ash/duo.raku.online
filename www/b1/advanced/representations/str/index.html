<script type="application/json" id="page-data">{"u":"advanced/representations/str","n":339,"k":"topic","pv":"advanced/representations/gist","nx":"advanced/representations/str/quiz","tr":["advanced","advanced/representations"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>.Str<\/code> method","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>.Str<\/code> method returns the <strong>plain string<\/strong> form of a value.<\/span> <span class=\"sg\" data-s=\"1\">Raku calls it whenever it uses a value in <em>string context<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">This happens in <code>print<\/code> and <code>put<\/code>, and with the <code>~<\/code> operator, which joins strings.<\/span> <span class=\"sg\" data-s=\"3\">It also happens when you insert a value into a string in double quotes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Note that the array came back <strong>without the brackets<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Its elements are just joined with spaces.<\/span> <span class=\"sg\" data-s=\"2\">This is the visible difference from <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, which keeps the brackets.<\/span> <span class=\"sg\" data-s=\"3\">Compare them side by side:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When you insert an array into a string, Raku uses <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So the array is shown in the plain way:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"de":{"t":"Die <code>.Str<\/code>-Methode","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.Str<\/code> gibt die <strong>einfache Stringform<\/strong> eines Wertes zurück.<\/span> <span class=\"sg\" data-s=\"1\">Raku ruft sie immer dann auf, wenn es einen Wert im <em>Stringkontext<\/em> verwendet.<\/span> <span class=\"sg\" data-s=\"2\">Das passiert bei <code>print<\/code> und <code>put<\/code> und beim Operator <code>~<\/code>, der Strings verbindet.<\/span> <span class=\"sg\" data-s=\"3\">Es passiert auch, wenn du einen Wert in einen String in doppelten Anführungszeichen einfügst.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass das Array <strong>ohne Klammern<\/strong> zurückkam.<\/span> <span class=\"sg\" data-s=\"1\">Seine Elemente sind einfach durch Leerzeichen verbunden.<\/span> <span class=\"sg\" data-s=\"2\">Das ist der sichtbare Unterschied zu <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, das die Klammern behält.<\/span> <span class=\"sg\" data-s=\"3\">Vergleiche die beiden nebeneinander:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Array in einen String einfügst, verwendet Raku <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb wird das Array auf die einfache Art dargestellt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"nl":{"t":"De <code>.Str<\/code>-methode","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De <code>.Str<\/code>-methode geeft de <strong>gewone string<\/strong>-vorm van een waarde terug.<\/span> <span class=\"sg\" data-s=\"1\">Raku roept hem aan wanneer het een waarde in <em>stringcontext<\/em> gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebeurt in <code>print<\/code> en <code>put<\/code>, en bij de <code>~<\/code> operator, die strings aan elkaar plakt.<\/span> <span class=\"sg\" data-s=\"3\">Het gebeurt ook als je een waarde in een string tussen dubbele aanhalingstekens zet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de array <strong>zonder de vierkante haken<\/strong> terugkwam.<\/span> <span class=\"sg\" data-s=\"1\">De elementen zijn gewoon met spaties verbonden.<\/span> <span class=\"sg\" data-s=\"2\">Dit is het zichtbare verschil met <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, dat de haken wel houdt.<\/span> <span class=\"sg\" data-s=\"3\">Vergelijk ze naast elkaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een array in een string zet, gebruikt Raku <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus wordt de array op de gewone manier getoond:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"es":{"t":"El método <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El método <code>.Str<\/code> devuelve la forma de <strong>cadena simple<\/strong> de un valor.<\/span> <span class=\"sg\" data-s=\"1\">Raku llama a este método siempre que usa un valor en <em>contexto de cadena<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Esto pasa en <code>print<\/code> y <code>put<\/code>, y con el operador <code>~<\/code>, que une cadenas.<\/span> <span class=\"sg\" data-s=\"3\">También pasa cuando insertas un valor en una cadena entre comillas dobles.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Observa que el arreglo volvió <strong>sin los corchetes<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sus elementos simplemente están unidos con espacios.<\/span> <span class=\"sg\" data-s=\"2\">Esta es la diferencia visible con <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, que mantiene los corchetes.<\/span> <span class=\"sg\" data-s=\"3\">Compáralos lado a lado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando insertas un arreglo en una cadena, Raku usa <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por eso el arreglo se muestra de la forma simple:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"it":{"t":"Il metodo <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.Str<\/code> restituisce la forma <strong>stringa semplice<\/strong> di un valore.<\/span> <span class=\"sg\" data-s=\"1\">Raku lo chiama ogni volta che usa un valore in <em>contesto stringa<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Succede in <code>print<\/code> e <code>put<\/code>, e con l'operatore <code>~<\/code>, che unisce le stringhe.<\/span> <span class=\"sg\" data-s=\"3\">Succede anche quando inserisci un valore in una stringa tra virgolette doppie.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota che l'array è tornato <strong>senza le parentesi quadre<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">I suoi elementi sono solo uniti da spazi.<\/span> <span class=\"sg\" data-s=\"2\">Questa è la differenza visibile rispetto a <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, che tiene le parentesi.<\/span> <span class=\"sg\" data-s=\"3\">Confrontali uno accanto all'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando inserisci un array in una stringa, Raku usa <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi l'array viene mostrato nella forma semplice:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"lv":{"t":"Metode <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.Str<\/code> atgriež vērtības <strong>vienkāršas virknes<\/strong> formu.<\/span> <span class=\"sg\" data-s=\"1\">Raku to izsauc katru reizi, kad izmanto vērtību <em>virknes kontekstā<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek ar <code>print<\/code> un <code>put<\/code>, kā arī ar operatoru <code>~<\/code>, kas savieno virknes.<\/span> <span class=\"sg\" data-s=\"3\">Tas notiek arī tad, kad jūs ievietojat vērtību virknē dubultpēdiņās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka masīvs atgriezās <strong>bez iekavām<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tā elementi ir vienkārši savienoti ar atstarpēm.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir redzamā atšķirība no <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, kas iekavas saglabā.<\/span> <span class=\"sg\" data-s=\"3\">Salīdziniet tās blakus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jūs ievietojat masīvu virknē, Raku izmanto <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc masīvs tiek parādīts vienkāršā veidā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"ru":{"t":"Метод <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> возвращает <strong>простую строковую<\/strong> форму значения.<\/span> <span class=\"sg\" data-s=\"1\">Raku вызывает его каждый раз, когда использует значение в <em>строковом контексте<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Так бывает в <code>print<\/code> и <code>put<\/code>, а также с оператором <code>~<\/code>, который соединяет строки.<\/span> <span class=\"sg\" data-s=\"3\">Так бывает и тогда, когда вы вставляете значение в строку в двойных кавычках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что массив вернулся <strong>без скобок<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Его элементы просто соединены пробелами.<\/span> <span class=\"sg\" data-s=\"2\">В этом видимое отличие от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, который оставляет скобки.<\/span> <span class=\"sg\" data-s=\"3\">Сравните их рядом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы вставляете массив в строку, Raku использует <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому массив показан в простом виде:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"uk":{"t":"Метод <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.Str<\/code> повертає <strong>просту рядкову<\/strong> форму значення.<\/span> <span class=\"sg\" data-s=\"1\">Raku викликає його щоразу, коли використовує значення в <em>рядковому контексті<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Так буває в <code>print<\/code> і <code>put<\/code>, а також з оператором <code>~<\/code>, який з'єднує рядки.<\/span> <span class=\"sg\" data-s=\"3\">Так буває й тоді, коли ви вставляєте значення в рядок у подвійних лапках.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що масив повернувся <strong>без дужок<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Його елементи просто з'єднані пробілами.<\/span> <span class=\"sg\" data-s=\"2\">Це видима відмінність від <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, який зберігає дужки.<\/span> <span class=\"sg\" data-s=\"3\">Порівняйте їх поруч:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви вставляєте масив у рядок, Raku використовує <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому масив показано у простому вигляді:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"bg":{"t":"Методът <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.Str<\/code> връща формата на <strong>обикновен низ<\/strong> на стойността.<\/span> <span class=\"sg\" data-s=\"1\">Raku го извиква винаги, когато използва стойност в <em>контекст на низ<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Това става в <code>print<\/code> и <code>put<\/code>, както и с оператора <code>~<\/code>, който съединява низове.<\/span> <span class=\"sg\" data-s=\"3\">Става и когато вмъкнете стойност в низ с двойни кавички.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Забележете, че масивът се върна <strong>без скобите<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Елементите му са просто свързани с интервали.<\/span> <span class=\"sg\" data-s=\"2\">Това е видимата разлика от <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, който запазва скобите.<\/span> <span class=\"sg\" data-s=\"3\">Сравнете ги един до друг:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато вмъкнете масив в низ, Raku използва <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова масивът се показва по обикновения начин:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"eo":{"t":"La metodo <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.Str<\/code> redonas la <strong>simplan ĉenan<\/strong> formon de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Raku vokas ĝin ĉiam, kiam ĝi uzas valoron en <em>ĉenkonteksto<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas ĉe <code>print<\/code> kaj <code>put<\/code>, kaj ĉe la operatoro <code>~<\/code>, kiu kunigas ĉenojn.<\/span> <span class=\"sg\" data-s=\"3\">Tio okazas ankaŭ, kiam vi enmetas valoron en ĉenon en duoblaj citiloj.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la tabelo revenis <strong>sen la krampoj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝiaj elementoj estas simple kunigitaj per spacoj.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas la videbla diferenco de <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, kiu konservas la krampojn.<\/span> <span class=\"sg\" data-s=\"3\">Komparu ilin unu apud la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi enmetas tabelon en ĉenon, Raku uzas <code>.Str<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do la tabelo aperas en la simpla maniero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]},"la":{"t":"Methodus <code>.Str<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.Str<\/code> formam <strong>seriei planae<\/strong> valoris reddit.<\/span> <span class=\"sg\" data-s=\"1\">Raku eam vocat quotiens valorem in <em>contextu serierum<\/em> adhibet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc accidit in <code>print<\/code> et <code>put<\/code>, et cum operatore <code>~<\/code>, qui series iungit.<\/span> <span class=\"sg\" data-s=\"3\">Etiam accidit cum valorem in seriem in signis citationis duplicibus inseris.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.Str;    # 42\nmy @a = 'alpha', 'beta', 'gamma';\nsay @a.Str;    # alpha beta gamma<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nota quod ordo <strong>sine uncis<\/strong> rediit.<\/span> <span class=\"sg\" data-s=\"1\">Elementa eius solum spatiis iunguntur.<\/span> <span class=\"sg\" data-s=\"2\">Haec est differentia visibilis a <a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a>, quae uncos servat.<\/span> <span class=\"sg\" data-s=\"3\">Compara eas iuxta positas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, 2, 3;\nsay @data.gist; # [1 2 3]\nsay @data.Str;  # 1 2 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum ordinem in seriem inseris, Raku <code>.Str<\/code> adhibet.<\/span> <span class=\"sg\" data-s=\"1\">Itaque ordo modo plano ostenditur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"data: @data[]\"; # data: 10 20 30<\/code><\/pre>"]]}}}</script>
