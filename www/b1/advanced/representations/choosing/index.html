aku<\/code><\/a> — для формы, <em>похожей на код<\/em>, при отладке (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда вы пишете класс, вы можете дать каждому из этих методов своё определение.<\/span> <span class=\"sg\" data-s=\"1\">Тогда и ваши собственные объекты будут печататься красиво.<\/span> <span class=\"sg\" data-s=\"2\">Мы вернёмся к этому, когда будем <a href=\"https://course.raku.org/ru/oop/classes/\" target=\"_blank\" rel=\"noopener\">создавать классы<\/a> в следующей части.<\/span><\/p>"]]},"uk":{"t":"Вибір правильного методу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Для звичайних скалярів, як-от чисел і рядків, усі три представлення виглядають однаково.<\/span> <span class=\"sg\" data-s=\"1\">Різниця з'являється для складених або невизначених значень.<\/span> <span class=\"sg\" data-s=\"2\">Ось <code>Pair<\/code>, показаний трьома способами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось приблизне загальне правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — для виводу, який будуть <em>читати<\/em> люди (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — для виводу <em>простим текстом<\/em> (<code>print<\/code>, <code>put<\/code>, змінні всередині рядків, оператор <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — для форми, <em>подібної до коду<\/em>, під час налагодження (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви пишете клас, ви можете дати кожному з цих методів власне визначення.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ваші власні об'єкти теж гарно друкуватимуться.<\/span> <span class=\"sg\" data-s=\"2\">Ми повернемося до цього, коли будемо <a href=\"https://course.raku.org/uk/oop/classes/\" target=\"_blank\" rel=\"noopener\">створювати класи<\/a> в наступній частині.<\/span><\/p>"]]},"bg":{"t":"Избор на правилния метод","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">При обикновени скалари, като числа и низове, и трите представяния изглеждат еднакво.<\/span> <span class=\"sg\" data-s=\"1\">Разликата се появява при съставни или недефинирани стойности.<\/span> <span class=\"sg\" data-s=\"2\">Ето една <code>Pair<\/code>, показана по три начина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно приблизително общо правило:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — за изход, който хората ще <em>четат<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — за изход като <em>обикновен текст<\/em> (<code>print<\/code>, <code>put<\/code>, променливи вътре в низове, операторът <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — за <em>кодоподобна<\/em> форма, когато дебъгвате (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато пишете клас, можете да дадете на всеки от тези методи своя собствена дефиниция.<\/span> <span class=\"sg\" data-s=\"1\">Тогава и вашите обекти ще се отпечатват добре.<\/span> <span class=\"sg\" data-s=\"2\">Ще се върнем към това, когато <a href=\"https://course.raku.org/bg/oop/classes/\" target=\"_blank\" rel=\"noopener\">създаваме класове<\/a> в следващата част.<\/span><\/p>"]]},"eo":{"t":"Elekti la ĝustan","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉe ĉiutagaj skalaroj, kiel nombroj kaj ĉenoj, ĉiuj tri reprezentoj aspektas same.<\/span> <span class=\"sg\" data-s=\"1\">La diferenco aperas ĉe kunmetitaj aŭ nedifinitaj valoroj.<\/span> <span class=\"sg\" data-s=\"2\">Jen <code>Pair<\/code>, montrata en tri manieroj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen proksimuma ĝenerala regulo:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — por eligo, kiun homoj <em>legos<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — por eligo en <em>simpla teksto<\/em> (<code>print<\/code>, <code>put<\/code>, variabloj ene de ĉenoj, la operatoro <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — por <em>kodosimila<\/em> formo, kiam vi sencimigas (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam vi skribas klason, vi povas doni al ĉiu el ĉi tiuj metodoj vian propran difinon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ankaŭ viaj propraj objektoj presiĝas bele.<\/span> <span class=\"sg\" data-s=\"2\">Ni revenos al tio, kiam ni <a href=\"https://course.raku.org/eo/oop/classes/\" target=\"_blank\" rel=\"noopener\">kreos klasojn<\/a> en la sekva parto.<\/span><\/p>"]]},"la":{"t":"Rectam eligere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum scalaribus quotidianis, ut numeris et seriebus, omnes tres repraesentationes idem apparent.<\/span> <span class=\"sg\" data-s=\"1\">Differentia apparet cum valoribus compositis vel indefinitis.<\/span> <span class=\"sg\" data-s=\"2\">Hic est <code>Pair<\/code>, tribus modis ostensus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (foo =&gt; 1).gist; # foo =&gt; 1\nsay (foo =&gt; 1).Str;  # foo\t1\nsay (foo =&gt; 1).raku; # :foo(1)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est regula generalis et approximata:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><a href=\"/advanced/representations/gist/\"><code>.gist<\/code><\/a> — pro output quod homines <em>legent<\/em> (<code>say<\/code>, <code>note<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><a href=\"/advanced/representations/str/\"><code>.Str<\/code><\/a> — pro output <em>textus plani<\/em> (<code>print<\/code>, <code>put<\/code>, variabiles intra series, operator <code>~<\/code>).<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> — pro forma <em>codici simili<\/em> dum errores corrigis (<code>dd<\/code>).<\/span><\/li><\/ul>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum classem scribis, cuique harum methodorum propriam definitionem dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum obiecta tua quoque pulchre imprimuntur.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc redibimus cum <a href=\"https://course.raku.org/la/oop/classes/\" target=\"_blank\" rel=\"noopener\">classes creabimus<\/a> in parte sequenti.<\/span><\/p>"]]}}}</script>
