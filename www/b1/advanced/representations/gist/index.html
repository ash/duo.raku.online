<script type="application/json" id="page-data">{"u":"advanced/representations/gist","n":338,"k":"topic","pv":"advanced/representations","nx":"advanced/representations/str","tr":["advanced","advanced/representations"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>.gist<\/code> method","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>.gist<\/code> method returns a <strong>human-friendly<\/strong> representation of a value.<\/span> <span class=\"sg\" data-s=\"1\">This is the form that you would want to <em>read<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> and <code>note<\/code> print exactly this, because they call <code>.gist<\/code> on each argument.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">For simple values, the gist is just the value itself.<\/span> <span class=\"sg\" data-s=\"1\">For compound data, <code>.gist<\/code> adds some formatting, so that the structure is easy to read:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A type object is a value that stands for the type itself.<\/span> <span class=\"sg\" data-s=\"1\">Its gist is its name in parentheses.<\/span> <span class=\"sg\" data-s=\"2\">This makes it easy to notice in the output:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"de":{"t":"Die <code>.gist<\/code>-Methode","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>.gist<\/code> gibt eine <strong>menschenfreundliche<\/strong> Darstellung eines Wertes zurück.<\/span> <span class=\"sg\" data-s=\"1\">Das ist die Form, die du gern <em>lesen<\/em> würdest.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> und <code>note<\/code> geben genau das aus, weil sie <code>.gist<\/code> für jedes Argument aufrufen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bei einfachen Werten ist der Gist einfach der Wert selbst.<\/span> <span class=\"sg\" data-s=\"1\">Bei zusammengesetzten Daten fügt <code>.gist<\/code> etwas Formatierung hinzu, damit die Struktur leicht zu lesen ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Typobjekt ist ein Wert, der für den Typ selbst steht.<\/span> <span class=\"sg\" data-s=\"1\">Sein Gist ist sein Name in runden Klammern.<\/span> <span class=\"sg\" data-s=\"2\">So fällt es in der Ausgabe leicht auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"nl":{"t":"De <code>.gist<\/code>-methode","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>.gist<\/code>-methode geeft een <strong>mensvriendelijke<\/strong> representatie van een waarde terug.<\/span> <span class=\"sg\" data-s=\"1\">Dit is de vorm die je zou willen <em>lezen<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> en <code>note<\/code> drukken precies dit af, omdat ze <code>.gist<\/code> aanroepen op elk argument.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Voor eenvoudige waarden is de gist gewoon de waarde zelf.<\/span> <span class=\"sg\" data-s=\"1\">Voor samengestelde gegevens voegt <code>.gist<\/code> wat opmaak toe, zodat de structuur makkelijk te lezen is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een type-object is een waarde die staat voor het type zelf.<\/span> <span class=\"sg\" data-s=\"1\">Zijn gist is zijn naam tussen haakjes.<\/span> <span class=\"sg\" data-s=\"2\">Daardoor valt het makkelijk op in de uitvoer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"es":{"t":"El método <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El método <code>.gist<\/code> devuelve una representación <strong>legible para humanos<\/strong> de un valor.<\/span> <span class=\"sg\" data-s=\"1\">Es la forma que querrías <em>leer<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> y <code>note<\/code> imprimen exactamente esto, porque llaman a <code>.gist<\/code> sobre cada argumento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Para valores simples, el gist es simplemente el valor.<\/span> <span class=\"sg\" data-s=\"1\">Para datos compuestos, <code>.gist<\/code> añade algo de formato, para que la estructura sea fácil de leer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un objeto de tipo es un valor que representa al tipo mismo.<\/span> <span class=\"sg\" data-s=\"1\">Su gist es su nombre entre paréntesis.<\/span> <span class=\"sg\" data-s=\"2\">Esto hace que sea fácil de ver en la salida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"it":{"t":"Il metodo <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>.gist<\/code> restituisce una rappresentazione del valore <strong>leggibile per le persone<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">È la forma che vorresti <em>leggere<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> e <code>note<\/code> stampano proprio questa, perché chiamano <code>.gist<\/code> su ogni argomento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per i valori semplici, il gist è solo il valore stesso.<\/span> <span class=\"sg\" data-s=\"1\">Per i dati composti, <code>.gist<\/code> aggiunge un po' di formattazione, così la struttura è facile da leggere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un oggetto tipo è un valore che rappresenta il tipo stesso.<\/span> <span class=\"sg\" data-s=\"1\">Il suo gist è il suo nome tra parentesi.<\/span> <span class=\"sg\" data-s=\"2\">Questo lo rende facile da notare nell'output:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"lv":{"t":"Metode <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Metode <code>.gist<\/code> atgriež vērtības <strong>cilvēkam draudzīgu<\/strong> attēlojumu.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir forma, ko jūs gribētu <em>lasīt<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> un <code>note<\/code> izdrukā tieši to, jo tās izsauc <code>.gist<\/code> katram argumentam.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vienkāršām vērtībām kopsavilkums ir vienkārši pati vērtība.<\/span> <span class=\"sg\" data-s=\"1\">Saliktiem datiem <code>.gist<\/code> pievieno nedaudz formatējuma, lai struktūru būtu viegli lasīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tipa objekts ir vērtība, kas apzīmē pašu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Tā kopsavilkums ir tā nosaukums iekavās.<\/span> <span class=\"sg\" data-s=\"2\">Tas ļauj to viegli pamanīt izvadē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"ru":{"t":"Метод <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.gist<\/code> возвращает <strong>удобное для человека<\/strong> представление значения.<\/span> <span class=\"sg\" data-s=\"1\">Это та форма, которую вам хотелось бы <em>прочитать<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>note<\/code> печатают именно её, потому что вызывают <code>.gist<\/code> для каждого аргумента.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для простых значений gist — это просто само значение.<\/span> <span class=\"sg\" data-s=\"1\">Для составных данных <code>.gist<\/code> добавляет немного форматирования, чтобы структуру было легко читать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типовой объект — это значение, которое обозначает сам тип.<\/span> <span class=\"sg\" data-s=\"1\">Его gist — это его имя в скобках.<\/span> <span class=\"sg\" data-s=\"2\">Благодаря этому его легко заметить в выводе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"uk":{"t":"Метод <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Метод <code>.gist<\/code> повертає <strong>зручне для людини<\/strong> представлення значення.<\/span> <span class=\"sg\" data-s=\"1\">Це форма, яку ви хотіли б <em>прочитати<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> і <code>note<\/code> друкують саме її, бо вони викликають <code>.gist<\/code> для кожного аргументу.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Для простих значень gist — це просто саме значення.<\/span> <span class=\"sg\" data-s=\"1\">Для складених даних <code>.gist<\/code> додає трохи форматування, щоб структуру було легко читати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Об'єкт типу — це значення, яке представляє сам тип.<\/span> <span class=\"sg\" data-s=\"1\">Його gist — це його назва в дужках.<\/span> <span class=\"sg\" data-s=\"2\">Завдяки цьому його легко помітити у виводі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"bg":{"t":"Методът <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.gist<\/code> връща <strong>удобно за четене от човек<\/strong> представяне на стойността.<\/span> <span class=\"sg\" data-s=\"1\">Това е формата, която бихте искали да <em>прочетете<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> и <code>note<\/code> отпечатват точно нея, защото извикват <code>.gist<\/code> за всеки аргумент.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">За прости стойности gist е просто самата стойност.<\/span> <span class=\"sg\" data-s=\"1\">За съставни данни <code>.gist<\/code> добавя малко форматиране, така че структурата да се чете лесно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типовият обект е стойност, която представлява самия тип.<\/span> <span class=\"sg\" data-s=\"1\">Неговият gist е името му в скоби.<\/span> <span class=\"sg\" data-s=\"2\">Така той лесно се забелязва в изхода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"eo":{"t":"La metodo <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>.gist<\/code> redonas <strong>homlegeblan<\/strong> reprezenton de valoro.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas la formo, kiun vi volus <em>legi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> kaj <code>note<\/code> presas ĝuste tion, ĉar ili vokas <code>.gist<\/code> sur ĉiu argumento.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Por simplaj valoroj, la gist estas simple la valoro mem.<\/span> <span class=\"sg\" data-s=\"1\">Por kunmetitaj datumoj, <code>.gist<\/code> aldonas iom da formatado, por ke la strukturo estu facile legebla:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tipobjekto estas valoro, kiu reprezentas la tipon mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝia gist estas ĝia nomo en krampoj.<\/span> <span class=\"sg\" data-s=\"2\">Tio faciligas rimarki ĝin en la eligo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]},"la":{"t":"Methodus <code>.gist<\/code>","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>.gist<\/code> repraesentationem valoris <strong>homini amicam<\/strong> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Haec est forma quam <em>legere<\/em> velles.<\/span> <span class=\"sg\" data-s=\"2\"><code>say<\/code> et <code>note<\/code> hoc ipsum imprimunt, quia <code>.gist<\/code> in quoque argumento vocant.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.gist;     # 42\nsay 'Raku'.gist; # Raku<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pro valoribus simplicibus gist est solum valor ipse.<\/span> <span class=\"sg\" data-s=\"1\">Pro datis compositis <code>.gist<\/code> aliquid formationis addit, ut structura facile legi possit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 'alpha', 'beta', 'gamma';\nsay @a.gist; # [alpha beta gamma]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Obiectum typi est valor qui typum ipsum repraesentat.<\/span> <span class=\"sg\" data-s=\"1\">Gist eius est nomen eius in parenthesibus.<\/span> <span class=\"sg\" data-s=\"2\">Itaque in output facile apparet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Int.gist; # (Int)<\/code><\/pre>"]]}}}</script>
