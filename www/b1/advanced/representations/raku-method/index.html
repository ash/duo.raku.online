<script type="application/json" id="page-data">{"u":"advanced/representations/raku-method","n":341,"k":"topic","pv":"advanced/representations/str/quiz","nx":"advanced/representations/choosing","tr":["advanced","advanced/representations"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>.raku<\/code> method","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">The third representation method is <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It returns a string with a <strong>code-like<\/strong> representation of the value.<\/span> <span class=\"sg\" data-s=\"2\">Ideally, you could paste this string into a program and get the same value back.<\/span> <span class=\"sg\" data-s=\"3\">Every value in Raku has this method.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Note that the string <code>'Raku'<\/code> comes back with quotes around it.<\/span> <span class=\"sg\" data-s=\"1\">So you can quickly see the difference between a number and a string.<\/span> <span class=\"sg\" data-s=\"2\">This is exactly the kind of detail you need when you debug.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The method also works for compound data, even for nested structures:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Since <code>.raku<\/code> returns a normal string, you can use it wherever a string is expected.<\/span> <span class=\"sg\" data-s=\"1\">For example, you can put it inside a string in double quotes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Use <code>.raku<\/code> when you need the code-like representation as a string.<\/span> <span class=\"sg\" data-s=\"1\">Then you can combine it with your own messages.<\/span> <span class=\"sg\" data-s=\"2\">Very soon, we will introduce <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This Rakudo tool prints the same kind of representation for you in one step.<\/span><\/p>"]]},"de":{"t":"Die <code>.raku<\/code>-Methode","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Die dritte Darstellungsmethode ist <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie gibt einen String mit einer <strong>codeähnlichen<\/strong> Darstellung des Wertes zurück.<\/span> <span class=\"sg\" data-s=\"2\">Im Idealfall kannst du diesen String in ein Programm einfügen und bekommst denselben Wert zurück.<\/span> <span class=\"sg\" data-s=\"3\">Jeder Wert in Raku hat diese Methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Beachte, dass der String <code>'Raku'<\/code> mit Anführungszeichen zurückkommt.<\/span> <span class=\"sg\" data-s=\"1\">So siehst du schnell den Unterschied zwischen einer Zahl und einem String.<\/span> <span class=\"sg\" data-s=\"2\">Genau so ein Detail brauchst du beim Debuggen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode funktioniert auch für zusammengesetzte Daten, sogar für verschachtelte Strukturen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Da <code>.raku<\/code> einen normalen String zurückgibt, kannst du ihn überall verwenden, wo ein String erwartet wird.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kannst du ihn in einen String in doppelten Anführungszeichen setzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Verwende <code>.raku<\/code>, wenn du die codeähnliche Darstellung als String brauchst.<\/span> <span class=\"sg\" data-s=\"1\">Dann kannst du sie mit deinen eigenen Nachrichten kombinieren.<\/span> <span class=\"sg\" data-s=\"2\">Sehr bald stellen wir <code>dd<\/code> vor.<\/span> <span class=\"sg\" data-s=\"3\">Dieses Rakudo-Werkzeug gibt dieselbe Art von Darstellung in einem Schritt für dich aus.<\/span><\/p>"]]},"nl":{"t":"De <code>.raku<\/code>-methode","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">De derde representatiemethode is <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft een string terug met een <strong>codeachtige<\/strong> representatie van de waarde.<\/span> <span class=\"sg\" data-s=\"2\">In het ideale geval kun je deze string in een programma plakken en dezelfde waarde terugkrijgen.<\/span> <span class=\"sg\" data-s=\"3\">Elke waarde in Raku heeft deze methode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de string <code>'Raku'<\/code> terugkomt met aanhalingstekens eromheen.<\/span> <span class=\"sg\" data-s=\"1\">Zo zie je snel het verschil tussen een getal en een string.<\/span> <span class=\"sg\" data-s=\"2\">Dit is precies het soort detail dat je nodig hebt als je debugt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode werkt ook voor samengestelde gegevens, zelfs voor geneste structuren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Omdat <code>.raku<\/code> een gewone string teruggeeft, kun je hem overal gebruiken waar een string verwacht wordt.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt hem bijvoorbeeld in een string tussen dubbele aanhalingstekens zetten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Gebruik <code>.raku<\/code> als je de codeachtige representatie als string nodig hebt.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je die combineren met je eigen berichten.<\/span> <span class=\"sg\" data-s=\"2\">Heel binnenkort introduceren we <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dit Rakudo-hulpmiddel drukt dezelfde soort representatie in één stap voor je af.<\/span><\/p>"]]},"es":{"t":"El método <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El tercer método de representación es <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Devuelve una cadena con una representación <strong>similar a código<\/strong> del valor.<\/span> <span class=\"sg\" data-s=\"2\">Lo ideal es que puedas pegar esta cadena en un programa y obtener de nuevo el mismo valor.<\/span> <span class=\"sg\" data-s=\"3\">Cada valor en Raku tiene este método.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Observa que la cadena <code>'Raku'<\/code> vuelve con comillas alrededor.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes ver rápido la diferencia entre un número y una cadena.<\/span> <span class=\"sg\" data-s=\"2\">Es justo el tipo de detalle que necesitas cuando depuras.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método también funciona con datos compuestos, incluso con estructuras anidadas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Como <code>.raku<\/code> devuelve una cadena normal, puedes usarlo en cualquier lugar donde se espera una cadena.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, puedes ponerlo dentro de una cadena entre comillas dobles:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> cuando necesites la representación similar a código como cadena.<\/span> <span class=\"sg\" data-s=\"1\">Así puedes combinarla con tus propios mensajes.<\/span> <span class=\"sg\" data-s=\"2\">Muy pronto presentaremos <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Esta herramienta de Rakudo imprime el mismo tipo de representación por ti en un solo paso.<\/span><\/p>"]]},"it":{"t":"Il metodo <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il terzo metodo di rappresentazione è <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Restituisce una stringa con una rappresentazione del valore <strong>simile al codice<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Idealmente, potresti incollare questa stringa in un programma e riavere lo stesso valore.<\/span> <span class=\"sg\" data-s=\"3\">Ogni valore in Raku ha questo metodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota che la stringa <code>'Raku'<\/code> torna con le virgolette intorno.<\/span> <span class=\"sg\" data-s=\"1\">Così puoi vedere subito la differenza tra un numero e una stringa.<\/span> <span class=\"sg\" data-s=\"2\">È proprio il tipo di dettaglio che ti serve quando fai il debug.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo funziona anche per dati composti, perfino per strutture annidate:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Poiché <code>.raku<\/code> restituisce una stringa normale, puoi usarlo ovunque serva una stringa.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, puoi metterlo dentro una stringa tra virgolette doppie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Usa <code>.raku<\/code> quando ti serve la rappresentazione simile al codice come stringa.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi combinarla con i tuoi messaggi.<\/span> <span class=\"sg\" data-s=\"2\">Molto presto presenteremo <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Questo strumento di Rakudo stampa per te lo stesso tipo di rappresentazione in un solo passo.<\/span><\/p>"]]},"lv":{"t":"Metode <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Trešā attēlojuma metode ir <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā atgriež virkni ar vērtības <strong>kodam līdzīgu<\/strong> attēlojumu.<\/span> <span class=\"sg\" data-s=\"2\">Ideālā gadījumā jūs varētu ielīmēt šo virkni programmā un atkal iegūt to pašu vērtību.<\/span> <span class=\"sg\" data-s=\"3\">Katrai vērtībai Raku valodā ir šī metode.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka virkne <code>'Raku'<\/code> atgriežas ar pēdiņām ap to.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc jūs varat ātri redzēt atšķirību starp skaitli un virkni.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tādas detaļas jums vajag, kad jūs atkļūdojat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode darbojas arī ar saliktiem datiem, pat ar ligzdotām struktūrām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tā kā <code>.raku<\/code> atgriež parastu virkni, jūs varat to izmantot visur, kur gaida virkni.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, jūs varat to ievietot virknē dubultpēdiņās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Izmantojiet <code>.raku<\/code>, kad jums vajag kodam līdzīgo attēlojumu kā virkni.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat to apvienot ar saviem ziņojumiem.<\/span> <span class=\"sg\" data-s=\"2\">Ļoti drīz mēs iepazīstināsim ar <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Šis Rakudo rīks izdrukā tāda paša veida attēlojumu jūsu vietā vienā solī.<\/span><\/p>"]]},"ru":{"t":"Метод <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Третий метод представления — <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он возвращает строку с представлением значения, <strong>похожим на код<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">В идеале эту строку можно вставить в программу и снова получить то же значение.<\/span> <span class=\"sg\" data-s=\"3\">Этот метод есть у каждого значения в Raku.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что строка <code>'Raku'<\/code> возвращается с кавычками.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому вы сразу видите разницу между числом и строкой.<\/span> <span class=\"sg\" data-s=\"2\">Именно такие детали нужны при отладке.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод работает и для составных данных, даже для вложенных структур:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так как <code>.raku<\/code> возвращает обычную строку, его можно использовать везде, где ожидается строка.<\/span> <span class=\"sg\" data-s=\"1\">Например, его можно вставить в строку в двойных кавычках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Используйте <code>.raku<\/code>, когда вам нужно представление, похожее на код, в виде строки.<\/span> <span class=\"sg\" data-s=\"1\">Тогда его можно соединить с вашими собственными сообщениями.<\/span> <span class=\"sg\" data-s=\"2\">Совсем скоро мы познакомим вас с <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Этот инструмент Rakudo печатает такое же представление за вас за один шаг.<\/span><\/p>"]]},"uk":{"t":"Метод <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Третій метод представлення — це <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він повертає рядок із <strong>подібним до коду<\/strong> представленням значення.<\/span> <span class=\"sg\" data-s=\"2\">В ідеалі цей рядок можна вставити в програму й отримати те саме значення назад.<\/span> <span class=\"sg\" data-s=\"3\">Кожне значення в Raku має цей метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що рядок <code>'Raku'<\/code> повертається з лапками навколо.<\/span> <span class=\"sg\" data-s=\"1\">Тому ви можете швидко побачити різницю між числом і рядком.<\/span> <span class=\"sg\" data-s=\"2\">Саме такі деталі потрібні під час налагодження.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод також працює для складених даних, навіть для вкладених структур:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оскільки <code>.raku<\/code> повертає звичайний рядок, ви можете використовувати його будь-де, де очікується рядок.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, його можна вставити в рядок у подвійних лапках:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Використовуйте <code>.raku<\/code>, коли вам потрібне подібне до коду представлення як рядок.<\/span> <span class=\"sg\" data-s=\"1\">Тоді ви можете поєднати його з власними повідомленнями.<\/span> <span class=\"sg\" data-s=\"2\">Дуже скоро ми познайомимо вас з <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Цей інструмент Rakudo друкує таке саме представлення за вас за один крок.<\/span><\/p>"]]},"bg":{"t":"Методът <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Третият метод за представяне е <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той връща низ с <strong>кодоподобно<\/strong> представяне на стойността.<\/span> <span class=\"sg\" data-s=\"2\">В идеалния случай бихте могли да поставите този низ в програма и да получите обратно същата стойност.<\/span> <span class=\"sg\" data-s=\"3\">Всяка стойност в Raku има този метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че низът <code>'Raku'<\/code> се връща с кавички около него.<\/span> <span class=\"sg\" data-s=\"1\">Така можете бързо да видите разликата между число и низ.<\/span> <span class=\"sg\" data-s=\"2\">Точно такъв детайл ви трябва, когато дебъгвате.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът работи и за съставни данни, дори за вложени структури:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тъй като <code>.raku<\/code> връща обикновен низ, можете да го използвате навсякъде, където се очаква низ.<\/span> <span class=\"sg\" data-s=\"1\">Например можете да го сложите вътре в низ с двойни кавички:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Използвайте <code>.raku<\/code>, когато ви трябва кодоподобното представяне като низ.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да го комбинирате със свои собствени съобщения.<\/span> <span class=\"sg\" data-s=\"2\">Много скоро ще представим <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Този инструмент на Rakudo отпечатва същия вид представяне вместо вас с една стъпка.<\/span><\/p>"]]},"eo":{"t":"La metodo <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">La tria reprezenta metodo estas <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi redonas ĉenon kun <strong>kodosimila<\/strong> reprezento de la valoro.<\/span> <span class=\"sg\" data-s=\"2\">Ideale, vi povus enmeti ĉi tiun ĉenon en programon kaj ricevi la saman valoron reen.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu valoro en Raku havas ĉi tiun metodon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke la ĉeno <code>'Raku'<\/code> revenas kun citiloj ĉirkaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Do vi povas rapide vidi la diferencon inter nombro kaj ĉeno.<\/span> <span class=\"sg\" data-s=\"2\">Ĝuste tian detalon vi bezonas, kiam vi sencimigas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo ankaŭ funkcias por kunmetitaj datumoj, eĉ por nestitaj strukturoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉar <code>.raku<\/code> redonas normalan ĉenon, vi povas uzi ĝin ĉie, kie oni atendas ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, vi povas meti ĝin en ĉenon en duoblaj citiloj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Uzu <code>.raku<\/code>, kiam vi bezonas la kodosimilan reprezenton kiel ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas kombini ĝin kun viaj propraj mesaĝoj.<\/span> <span class=\"sg\" data-s=\"2\">Tre baldaŭ, ni prezentos <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu Rakudo-ilo presas la saman specon de reprezento por vi en unu paŝo.<\/span><\/p>"]]},"la":{"t":"Methodus <code>.raku<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tertia methodus repraesentationis est <code>.raku<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Seriem cum repraesentatione valoris <strong>codici simili<\/strong> reddit.<\/span> <span class=\"sg\" data-s=\"2\">In casu optimo hanc seriem in programma inserere posses et eundem valorem recipere.<\/span> <span class=\"sg\" data-s=\"3\">Quisque valor in Raku hanc methodum habet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.raku;        # 42\nsay 'Raku'.raku;    # \"Raku\"\nsay (1, 2, 3).raku; # (1, 2, 3)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod series <code>'Raku'<\/code> cum signis citationis circum se redit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque differentiam inter numerum et seriem cito videre potes.<\/span> <span class=\"sg\" data-s=\"2\">Hoc est exacte genus rei quam requiris dum errores corrigis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus etiam pro datis compositis operatur, etiam pro structuris insertis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 1, [2, 3], 4;\nsay @data.raku; # [1, [2, 3], 4]<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quia <code>.raku<\/code> seriem normalem reddit, eam ubicumque series exspectatur adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, eam intra seriem in signis citationis duplicibus ponere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 10, 20, 30;\nsay \"The data is { @data.raku }\";\n# The data is [10, 20, 30]<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Utere <code>.raku<\/code> cum repraesentationem codici similem ut seriem requiris.<\/span> <span class=\"sg\" data-s=\"1\">Tum eam cum nuntiis tuis componere potes.<\/span> <span class=\"sg\" data-s=\"2\">Mox <code>dd<\/code> introducemus.<\/span> <span class=\"sg\" data-s=\"3\">Hoc instrumentum Rakudo idem genus repraesentationis pro te uno gradu imprimit.<\/span><\/p>"]]}}}</script>
