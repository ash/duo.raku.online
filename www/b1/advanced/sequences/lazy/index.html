<script type="application/json" id="page-data">{"u":"advanced/sequences/lazy","n":504,"k":"topic","pv":"advanced/sequences/patterns/quiz","nx":"advanced/sequences/exercises","tr":["advanced","advanced/sequences"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Lazy and infinite sequences","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A sequence does not need to compute all its values at once.<\/span> <span class=\"sg\" data-s=\"1\">Raku sequences are <em>lazy<\/em>: each value is made only when it is really needed.<\/span> <span class=\"sg\" data-s=\"2\">So you can describe a sequence that has no end at all.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To write an infinite sequence, use <code>Inf<\/code> as the endpoint.<\/span> <span class=\"sg\" data-s=\"1\">The <code>...<\/code> operator binds more loosely than <code>=<\/code>, so Raku would do the <code>=<\/code> first.<\/span> <span class=\"sg\" data-s=\"2\">That is why you put the sequence in parentheses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Without the parentheses, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> would assign only <\/code>1<code> to the variable.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Then it would build the sequence separately.<\/span> <span class=\"sg\" data-s=\"3\">Computing an endless sequence that nobody uses would make the program hang.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">At this point, nothing is computed.<\/span> <span class=\"sg\" data-s=\"1\">The sequence only gives out values when you ask for them.<\/span> <span class=\"sg\" data-s=\"2\">The <code>head<\/code> method takes the first few of them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The sequence is infinite, but only the first five numbers are generated.<\/span> <span class=\"sg\" data-s=\"1\">Without laziness, the program would try to build the whole endless sequence.<\/span> <span class=\"sg\" data-s=\"2\">Such a program would never finish.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If a sequence is finite, the <code>tail<\/code> method can take values from its end instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Laziness lets you separate two things.<\/span> <span class=\"sg\" data-s=\"1\">The first is the <em>description<\/em> of a sequence.<\/span> <span class=\"sg\" data-s=\"2\">The second is the decision about how much of it to use.<\/span><\/p>"]]},"de":{"t":"Lazy und unendliche Sequenzen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Sequenz muss nicht alle ihre Werte auf einmal berechnen.<\/span> <span class=\"sg\" data-s=\"1\">Raku-Sequenzen sind <em>lazy<\/em>: Jeder Wert wird erst erzeugt, wenn er wirklich gebraucht wird.<\/span> <span class=\"sg\" data-s=\"2\">So kannst du eine Sequenz beschreiben, die überhaupt kein Ende hat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um eine unendliche Sequenz zu schreiben, benutze <code>Inf<\/code> als Endpunkt.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>...<\/code> bindet schwächer als <code>=<\/code>, also würde Raku zuerst das <code>=<\/code> ausführen.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb setzt du die Sequenz in Klammern:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ohne die Klammern würde <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> der Variablen nur <\/code>1<code> zuweisen.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Dann würde Raku die Sequenz getrennt davon bauen.<\/span> <span class=\"sg\" data-s=\"3\">Eine endlose Sequenz zu berechnen, die niemand benutzt, würde das Programm hängen lassen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">An dieser Stelle wird noch nichts berechnet.<\/span> <span class=\"sg\" data-s=\"1\">Die Sequenz gibt Werte nur heraus, wenn du danach fragst.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>head<\/code> nimmt die ersten paar davon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Sequenz ist unendlich, aber nur die ersten fünf Zahlen werden erzeugt.<\/span> <span class=\"sg\" data-s=\"1\">Ohne Laziness würde das Programm versuchen, die ganze endlose Sequenz zu bauen.<\/span> <span class=\"sg\" data-s=\"2\">So ein Programm würde nie fertig werden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Sequenz endlich ist, kann die Methode <code>tail<\/code> stattdessen Werte von ihrem Ende nehmen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit Laziness kannst du zwei Dinge trennen.<\/span> <span class=\"sg\" data-s=\"1\">Das erste ist die <em>Beschreibung<\/em> einer Sequenz.<\/span> <span class=\"sg\" data-s=\"2\">Das zweite ist die Entscheidung, wie viel davon du benutzt.<\/span><\/p>"]]},"nl":{"t":"Luie en oneindige reeksen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een reeks hoeft niet al zijn waarden in één keer te berekenen.<\/span> <span class=\"sg\" data-s=\"1\">Raku-reeksen zijn <em>lui<\/em> (lazy): elke waarde wordt pas gemaakt als die echt nodig is.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je een reeks beschrijven die helemaal geen einde heeft.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een oneindige reeks te schrijven, gebruik je <code>Inf<\/code> als eindpunt.<\/span> <span class=\"sg\" data-s=\"1\">De <code>...<\/code>-operator bindt minder sterk dan <code>=<\/code>, dus Raku zou de <code>=<\/code> eerst doen.<\/span> <span class=\"sg\" data-s=\"2\">Daarom zet je de reeks tussen haakjes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Zonder de haakjes zou <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> alleen <\/code>1<code> aan de variabele toewijzen.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Daarna zou het de reeks apart opbouwen.<\/span> <span class=\"sg\" data-s=\"3\">Een eindeloze reeks berekenen die niemand gebruikt, zou het programma laten vastlopen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Op dit moment is er nog niets berekend.<\/span> <span class=\"sg\" data-s=\"1\">De reeks geeft alleen waarden als je erom vraagt.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>head<\/code> neemt de eerste paar ervan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De reeks is oneindig, maar alleen de eerste vijf getallen worden gemaakt.<\/span> <span class=\"sg\" data-s=\"1\">Zonder luiheid zou het programma proberen de hele eindeloze reeks te bouwen.<\/span> <span class=\"sg\" data-s=\"2\">Zo'n programma zou nooit klaar zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als een reeks eindig is, kan de methode <code>tail<\/code> juist waarden van het einde nemen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Door luiheid kun je twee dingen scheiden.<\/span> <span class=\"sg\" data-s=\"1\">Het eerste is de <em>beschrijving<\/em> van een reeks.<\/span> <span class=\"sg\" data-s=\"2\">Het tweede is de beslissing hoeveel je ervan gebruikt.<\/span><\/p>"]]},"es":{"t":"Secuencias perezosas e infinitas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una secuencia no necesita calcular todos sus valores a la vez.<\/span> <span class=\"sg\" data-s=\"1\">Las secuencias de Raku son <em>perezosas<\/em> (lazy): cada valor se crea solo cuando de verdad se necesita.<\/span> <span class=\"sg\" data-s=\"2\">Así puedes describir una secuencia que no tiene ningún final.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para escribir una secuencia infinita, usa <code>Inf<\/code> como punto final.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>...<\/code> tiene menor precedencia que <code>=<\/code>, así que Raku haría primero el <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por eso pones la secuencia entre paréntesis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sin los paréntesis, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> asignaría solo <\/code>1<code> a la variable.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Luego construiría la secuencia por separado.<\/span> <span class=\"sg\" data-s=\"3\">Calcular una secuencia sin fin que nadie usa haría que el programa se colgara.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">En este punto, no se calcula nada.<\/span> <span class=\"sg\" data-s=\"1\">La secuencia solo entrega valores cuando los pides.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>head<\/code> toma los primeros de ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La secuencia es infinita, pero solo se generan los primeros cinco números.<\/span> <span class=\"sg\" data-s=\"1\">Sin la evaluación perezosa, el programa intentaría construir toda la secuencia sin fin.<\/span> <span class=\"sg\" data-s=\"2\">Un programa así nunca terminaría.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si una secuencia es finita, el método <code>tail<\/code> puede tomar, en cambio, valores de su final:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La evaluación perezosa te permite separar dos cosas.<\/span> <span class=\"sg\" data-s=\"1\">La primera es la <em>descripción<\/em> de una secuencia.<\/span> <span class=\"sg\" data-s=\"2\">La segunda es la decisión de cuánto de ella usar.<\/span><\/p>"]]},"it":{"t":"Sequenze lazy e infinite","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una sequenza non deve calcolare tutti i suoi valori in una volta.<\/span> <span class=\"sg\" data-s=\"1\">Le sequenze di Raku sono <em>lazy<\/em>: ogni valore viene creato solo quando serve davvero.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi descrivere una sequenza che non ha nessuna fine.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per scrivere una sequenza infinita, usa <code>Inf<\/code> come punto finale.<\/span> <span class=\"sg\" data-s=\"1\">L'operatore <code>...<\/code> ha una precedenza più bassa di <code>=<\/code>, quindi Raku farebbe prima <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Per questo metti la sequenza tra parentesi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Senza le parentesi, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> assegnerebbe solo <\/code>1<code> alla variabile.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Poi costruirebbe la sequenza a parte.<\/span> <span class=\"sg\" data-s=\"3\">Calcolare una sequenza senza fine che nessuno usa bloccherebbe il programma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A questo punto non viene calcolato niente.<\/span> <span class=\"sg\" data-s=\"1\">La sequenza dà i valori solo quando li chiedi.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>head<\/code> ne prende i primi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sequenza è infinita, ma vengono generati solo i primi cinque numeri.<\/span> <span class=\"sg\" data-s=\"1\">Senza la valutazione lazy, il programma proverebbe a costruire tutta la sequenza senza fine.<\/span> <span class=\"sg\" data-s=\"2\">Un programma così non finirebbe mai.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se una sequenza è finita, il metodo <code>tail<\/code> può invece prendere i valori dalla sua fine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La valutazione lazy ti permette di separare due cose.<\/span> <span class=\"sg\" data-s=\"1\">La prima è la <em>descrizione<\/em> di una sequenza.<\/span> <span class=\"sg\" data-s=\"2\">La seconda è la decisione su quanto usarne.<\/span><\/p>"]]},"lv":{"t":"Slinkas un bezgalīgas secības","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Virknei nav jāaprēķina visas savas vērtības uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Raku virknes ir <em>slinkas<\/em>: katra vērtība tiek radīta tikai tad, kad tā tiešām vajadzīga.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat aprakstīt virkni, kurai vispār nav beigu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai uzrakstītu bezgalīgu virkni, izmantojiet <code>Inf<\/code> kā beigu punktu.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>...<\/code> saistās vaļīgāk nekā <code>=<\/code>, tāpēc Raku vispirms izpildītu <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tāpēc jūs ieliekat virkni iekavās:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bez iekavām <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> mainīgajam piešķirtu tikai <\/code>1<code>.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Pēc tam tas būvētu virkni atsevišķi.<\/span> <span class=\"sg\" data-s=\"3\">Ja Raku aprēķinātu bezgalīgu virkni, kuru neviens neizmanto, programma uzkārtos.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šajā brīdī nekas vēl nav aprēķināts.<\/span> <span class=\"sg\" data-s=\"1\">Virkne izdod vērtības tikai tad, kad jūs tās prasāt.<\/span> <span class=\"sg\" data-s=\"2\">Metode <code>head<\/code> paņem pirmās dažas no tām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Virkne ir bezgalīga, bet tiek ģenerēti tikai pirmie pieci skaitļi.<\/span> <span class=\"sg\" data-s=\"1\">Bez slinkuma programma mēģinātu uzbūvēt visu bezgalīgo virkni.<\/span> <span class=\"sg\" data-s=\"2\">Šāda programma nekad nebeigtu darbu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja virkne ir galīga, metode <code>tail<\/code> var tā vietā paņemt vērtības no tās beigām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Slinkums ļauj nošķirt divas lietas.<\/span> <span class=\"sg\" data-s=\"1\">Pirmā ir virknes <em>apraksts<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Otrā ir lēmums par to, cik daudz no tās izmantot.<\/span><\/p>"]]},"ru":{"t":"Ленивые и бесконечные последовательности","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Последовательности не нужно вычислять все свои значения сразу.<\/span> <span class=\"sg\" data-s=\"1\">Последовательности в Raku <em>ленивые<\/em>: каждое значение создаётся, только когда оно действительно нужно.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому можно описать последовательность, у которой вообще нет конца.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы записать бесконечную последовательность, используйте <code>Inf<\/code> как конечную точку.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>...<\/code> связывает слабее, чем <code>=<\/code>, поэтому Raku сначала выполнил бы <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Вот почему последовательность нужно взять в скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без скобок <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> присвоил бы переменной только <\/code>1<code>.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Потом он отдельно построил бы последовательность.<\/span> <span class=\"sg\" data-s=\"3\">Если вычислять бесконечную последовательность, которую никто не использует, программа зависнет.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Пока ничего не вычислено.<\/span> <span class=\"sg\" data-s=\"1\">Последовательность выдаёт значения, только когда вы их просите.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> берёт первые несколько из них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Последовательность бесконечна, но создаются только первые пять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Без ленивости программа пыталась бы построить всю бесконечную последовательность.<\/span> <span class=\"sg\" data-s=\"2\">Такая программа никогда бы не закончилась.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если последовательность конечна, метод <code>tail<\/code> может брать значения с её конца:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ленивость позволяет разделить две вещи.<\/span> <span class=\"sg\" data-s=\"1\">Первая — это <em>описание<\/em> последовательности.<\/span> <span class=\"sg\" data-s=\"2\">Вторая — решение о том, какую её часть использовать.<\/span><\/p>"]]},"uk":{"t":"Ліниві та нескінченні послідовності","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Послідовності не треба обчислювати всі свої значення одразу.<\/span> <span class=\"sg\" data-s=\"1\">Послідовності Raku є <em>лінивими<\/em>: кожне значення створюється лише тоді, коли воно справді потрібне.<\/span> <span class=\"sg\" data-s=\"2\">Тож можна описати послідовність, яка зовсім не має кінця.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб записати нескінченну послідовність, використайте <code>Inf<\/code> як кінцеву точку.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>...<\/code> зв'язується слабше за <code>=<\/code>, тож Raku спершу виконав би <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тому ви берете послідовність у дужки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без дужок <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> присвоїло б змінній лише <\/code>1<code>.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Потім воно побудувало б послідовність окремо.<\/span> <span class=\"sg\" data-s=\"3\">Обчислення нескінченної послідовності, яку ніхто не використовує, змусило б програму зависнути.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">На цей момент нічого не обчислено.<\/span> <span class=\"sg\" data-s=\"1\">Послідовність видає значення лише тоді, коли ви їх просите.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>head<\/code> бере кілька перших із них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Послідовність нескінченна, але створюються лише перші п'ять чисел.<\/span> <span class=\"sg\" data-s=\"1\">Без лінивості програма спробувала б побудувати всю нескінченну послідовність.<\/span> <span class=\"sg\" data-s=\"2\">Така програма ніколи б не закінчилася.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо послідовність скінченна, метод <code>tail<\/code> може натомість брати значення з її кінця:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Лінивість дозволяє розділити дві речі.<\/span> <span class=\"sg\" data-s=\"1\">Перша — це <em>опис<\/em> послідовності.<\/span> <span class=\"sg\" data-s=\"2\">Друга — це рішення про те, скільки з неї використати.<\/span><\/p>"]]},"bg":{"t":"Мързеливи и безкрайни последователности","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Последователността не е длъжна да изчислява всичките си стойности наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Последователностите в Raku са <em>мързеливи<\/em>: всяка стойност се прави само когато наистина е нужна.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да опишете последователност, която изобщо няма край.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да напишете безкрайна последователност, използвайте <code>Inf<\/code> като крайна точка.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>...<\/code> свързва по-слабо от <code>=<\/code>, затова Raku би изпълнил първо <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ето защо слагате последователността в скоби:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без скобите <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> ще присвои само <\/code>1<code> на променливата.<\/code><\/span> <span class=\"sg\" data-s=\"2\">След това ще създаде последователността отделно.<\/span> <span class=\"sg\" data-s=\"3\">Ако Raku изчислява безкрайна последователност, която никой не използва, програмата ще блокира.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В този момент нищо не е изчислено.<\/span> <span class=\"sg\" data-s=\"1\">Последователността дава стойности само когато ги поискате.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>head<\/code> взема първите няколко от тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Последователността е безкрайна, но се генерират само първите пет числа.<\/span> <span class=\"sg\" data-s=\"1\">Без мързеливост програмата би се опитала да създаде цялата безкрайна последователност.<\/span> <span class=\"sg\" data-s=\"2\">Такава програма никога не би завършила.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако последователността е крайна, методът <code>tail<\/code> може вместо това да взема стойности от нейния край:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Мързеливостта ви позволява да разделите две неща.<\/span> <span class=\"sg\" data-s=\"1\">Първото е <em>описанието<\/em> на последователността.<\/span> <span class=\"sg\" data-s=\"2\">Второто е решението колко от нея да използвате.<\/span><\/p>"]]},"eo":{"t":"Maldiligentaj kaj senlimaj sekvencoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sekvenco ne devas kalkuli ĉiujn siajn valorojn samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Sekvencoj de Raku estas <em>maldiligentaj<\/em>: ĉiu valoro estas farata nur kiam ĝi vere estas bezonata.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas priskribi sekvencon, kiu tute ne havas finon.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por skribi senliman sekvencon, uzu <code>Inf<\/code> kiel la finan punkton.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro <code>...<\/code> ligas pli malforte ol <code>=<\/code>, do Raku farus la <code>=<\/code> unue.<\/span> <span class=\"sg\" data-s=\"2\">Tial vi metas la sekvencon en krampojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sen la krampoj, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> atribuus nur <\/code>1<code> al la variablo.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Poste ĝi konstruus la sekvencon aparte.<\/span> <span class=\"sg\" data-s=\"3\">Kalkuli senfinan sekvencon, kiun neniu uzas, igus la programon pendi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉe ĉi tiu punkto, nenio estas kalkulita.<\/span> <span class=\"sg\" data-s=\"1\">La sekvenco donas valorojn nur kiam vi petas ilin.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>head<\/code> prenas la unuajn kelkajn el ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sekvenco estas senlima, sed nur la unuaj kvin nombroj estas generataj.<\/span> <span class=\"sg\" data-s=\"1\">Sen maldiligento, la programo provus konstrui la tutan senfinan sekvencon.<\/span> <span class=\"sg\" data-s=\"2\">Tia programo neniam finiĝus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se sekvenco estas finia, la metodo <code>tail<\/code> povas anstataŭe preni valorojn de ĝia fino:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Maldiligento lasas vin apartigi du aferojn.<\/span> <span class=\"sg\" data-s=\"1\">La unua estas la <em>priskribo<\/em> de sekvenco.<\/span> <span class=\"sg\" data-s=\"2\">La dua estas la decido, kiom da ĝi uzi.<\/span><\/p>"]]},"la":{"t":"Pigrae et infinitae series","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Series non debet omnes valores suos simul computare.<\/span> <span class=\"sg\" data-s=\"1\">Series in Raku <em>pigrae<\/em> sunt: quisque valor solum fit cum re vera opus est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque seriem describere potes quae omnino finem non habet.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut seriem infinitam scribas, <code>Inf<\/code> ut finem adhibe.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>...<\/code> laxius ligat quam <code>=<\/code>, itaque Raku primum <code>=<\/code> faceret.<\/span> <span class=\"sg\" data-s=\"2\">Ideo seriem in parenthesibus ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $naturals = (1 ... Inf);<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sine parenthesibus, <code>my $naturals = 1 ...<\/code><\/span> <span class=\"sg\" data-s=\"1\">Inf<code> solum <\/code>1<code> variabili assignaret.<\/code><\/span> <span class=\"sg\" data-s=\"2\">Deinde seriem separatim construeret.<\/span> <span class=\"sg\" data-s=\"3\">Si Raku seriem infinitam computaret quam nemo adhibet, programma haereret.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc loco nihil computatur.<\/span> <span class=\"sg\" data-s=\"1\">Series valores solum tradit cum eos petis.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>head<\/code> primos paucos ex eis sumit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... Inf).head(5); # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Series infinita est, sed solum primi quinque numeri generantur.<\/span> <span class=\"sg\" data-s=\"1\">Sine pigritia programma totam seriem infinitam construere conaretur.<\/span> <span class=\"sg\" data-s=\"2\">Tale programma numquam finiret.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si series finita est, methodus <code>tail<\/code> potius valores a fine eius sumere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 100).tail(3); # (98 99 100)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pigritia tibi permittit duas res separare.<\/span> <span class=\"sg\" data-s=\"1\">Prima est <em>descriptio<\/em> seriei.<\/span> <span class=\"sg\" data-s=\"2\">Altera est decisio quantum eius adhibeas.<\/span><\/p>"]]}}}</script>
