<script type="application/json" id="page-data">{"u":"advanced/sequences","n":501,"k":"section","pv":"advanced/sets-bags-mixes/exercises/bag-count/solution","nx":"advanced/sequences/patterns","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Sequences","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>sequence<\/em> is a series of values in order, produced one after another.<\/span> <span class=\"sg\" data-s=\"1\">Raku builds sequences with the <code>...<\/code> operator.<\/span> <span class=\"sg\" data-s=\"2\">It finds the pattern in the values you give it.<\/span> <span class=\"sg\" data-s=\"3\">Then it generates the rest, up to an endpoint.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The simplest sequence just counts from one value to another:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">If you give two starting values, Raku finds the step between them.<\/span> <span class=\"sg\" data-s=\"1\">Then it goes on with the same step.<\/span> <span class=\"sg\" data-s=\"2\">This is how you make an arithmetic sequence:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Here, the starting values <code>1, 3<\/code> make the step two.<\/span> <span class=\"sg\" data-s=\"1\">So Raku counts up in twos and stops when it reaches <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The value that <code>...<\/code> produces has the <code>Seq<\/code> type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next topics show other patterns that the <code>...<\/code> operator can recognise.<\/span> <span class=\"sg\" data-s=\"1\">They also show how a sequence can be lazy, and even infinite.<\/span><\/p>"]]},"de":{"t":"Sequenzen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Sequenz<\/em> ist eine geordnete Reihe von Werten, die nacheinander erzeugt werden.<\/span> <span class=\"sg\" data-s=\"1\">Raku baut Sequenzen mit dem Operator <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er findet das Muster in den Werten, die du ihm gibst.<\/span> <span class=\"sg\" data-s=\"3\">Dann erzeugt er den Rest, bis zu einem Endpunkt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die einfachste Sequenz zählt einfach von einem Wert zu einem anderen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn du zwei Startwerte angibst, findet Raku den Schritt zwischen ihnen.<\/span> <span class=\"sg\" data-s=\"1\">Dann macht Raku mit dem gleichen Schritt weiter.<\/span> <span class=\"sg\" data-s=\"2\">So erstellst du eine arithmetische Sequenz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier machen die Startwerte <code>1, 3<\/code> den Schritt zwei.<\/span> <span class=\"sg\" data-s=\"1\">Also zählt Raku in Zweierschritten hoch und stoppt, wenn <code>11<\/code> erreicht ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Der Wert, den <code>...<\/code> erzeugt, hat den Typ <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen weitere Muster, die der Operator <code>...<\/code> erkennen kann.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, wie eine Sequenz lazy und sogar unendlich sein kann.<\/span><\/p>"]]},"nl":{"t":"Reeksen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>reeks<\/em> (sequence) is een serie waarden op volgorde, die na elkaar worden gemaakt.<\/span> <span class=\"sg\" data-s=\"1\">Raku bouwt reeksen met de <code>...<\/code>-operator.<\/span> <span class=\"sg\" data-s=\"2\">Die vindt het patroon in de waarden die je hem geeft.<\/span> <span class=\"sg\" data-s=\"3\">Daarna maakt hij de rest, tot aan een eindpunt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De eenvoudigste reeks telt gewoon van de ene waarde tot de andere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je twee startwaarden geeft, vindt Raku de stap ertussen.<\/span> <span class=\"sg\" data-s=\"1\">Daarna gaat het door met dezelfde stap.<\/span> <span class=\"sg\" data-s=\"2\">Zo maak je een rekenkundige reeks:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hier maken de startwaarden <code>1, 3<\/code> de stap twee.<\/span> <span class=\"sg\" data-s=\"1\">Raku telt dus op in stappen van twee en stopt als het <code>11<\/code> bereikt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De waarde die <code>...<\/code> maakt, is van het type <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten andere patronen zien die de <code>...<\/code>-operator kan herkennen.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien hoe een reeks lui (lazy) kan zijn, en zelfs oneindig.<\/span><\/p>"]]},"es":{"t":"Secuencias","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una <em>secuencia<\/em> es una serie de valores en orden, producidos uno tras otro.<\/span> <span class=\"sg\" data-s=\"1\">Raku construye secuencias con el operador <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Encuentra el patrón en los valores que le das.<\/span> <span class=\"sg\" data-s=\"3\">Luego genera el resto, hasta un punto final.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La secuencia más simple solo cuenta de un valor a otro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si das dos valores iniciales, Raku encuentra el paso entre ellos.<\/span> <span class=\"sg\" data-s=\"1\">Luego sigue con el mismo paso.<\/span> <span class=\"sg\" data-s=\"2\">Así es como creas una secuencia aritmética:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, los valores iniciales <code>1, 3<\/code> hacen que el paso sea dos.<\/span> <span class=\"sg\" data-s=\"1\">Así que Raku cuenta de dos en dos y se detiene cuando llega a <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El valor que produce <code>...<\/code> tiene el tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran otros patrones que el operador <code>...<\/code> puede reconocer.<\/span> <span class=\"sg\" data-s=\"1\">También muestran cómo una secuencia puede ser perezosa, e incluso infinita.<\/span><\/p>"]]},"it":{"t":"Sequenze","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una <em>sequenza<\/em> è una serie di valori in ordine, prodotti uno dopo l'altro.<\/span> <span class=\"sg\" data-s=\"1\">Raku costruisce le sequenze con l'operatore <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">L'operatore trova il modello nei valori che gli dai.<\/span> <span class=\"sg\" data-s=\"3\">Poi genera il resto, fino a un punto finale.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La sequenza più semplice conta solo da un valore a un altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se dai due valori iniziali, Raku trova il passo tra di loro.<\/span> <span class=\"sg\" data-s=\"1\">Poi continua con lo stesso passo.<\/span> <span class=\"sg\" data-s=\"2\">Ecco come crei una sequenza aritmetica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui i valori iniziali <code>1, 3<\/code> rendono il passo uguale a due.<\/span> <span class=\"sg\" data-s=\"1\">Quindi Raku conta di due in due e si ferma quando raggiunge <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il valore che <code>...<\/code> produce ha il tipo <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano altri modelli che l'operatore <code>...<\/code> sa riconoscere.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche come una sequenza può essere lazy, e perfino infinita.<\/span><\/p>"]]},"lv":{"t":"Secības","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Virkne<\/em> ir sakārtota vērtību rinda, kuras vērtības rodas cita pēc citas.<\/span> <span class=\"sg\" data-s=\"1\">Raku būvē virknes ar operatoru <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas atrod likumsakarību vērtībās, ko jūs tam dodat.<\/span> <span class=\"sg\" data-s=\"3\">Pēc tam tas ģenerē pārējo līdz beigu punktam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākā virkne tikai skaita no vienas vērtības līdz otrai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja jūs dodat divas sākuma vērtības, Raku atrod soli starp tām.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tas turpina ar to pašu soli.<\/span> <span class=\"sg\" data-s=\"2\">Tā veido aritmētisku virkni:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit sākuma vērtības <code>1, 3<\/code> nosaka soli divi.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku skaita pa diviem un apstājas, kad sasniedz <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vērtībai, ko rada <code>...<\/code>, ir tips <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda citas likumsakarības, ko operators <code>...<\/code> var atpazīt.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī parāda, kā virkne var būt slinka un pat bezgalīga.<\/span><\/p>"]]},"ru":{"t":"Последовательности","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Последовательность<\/em> — это ряд значений по порядку, которые создаются одно за другим.<\/span> <span class=\"sg\" data-s=\"1\">Raku строит последовательности с помощью оператора <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он находит закономерность в значениях, которые вы ему даёте.<\/span> <span class=\"sg\" data-s=\"3\">Затем он создаёт остальные значения, до конечной точки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Самая простая последовательность просто считает от одного значения до другого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если дать два начальных значения, Raku найдёт шаг между ними.<\/span> <span class=\"sg\" data-s=\"1\">Потом он продолжит с тем же шагом.<\/span> <span class=\"sg\" data-s=\"2\">Так создаётся арифметическая последовательность:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь начальные значения <code>1, 3<\/code> дают шаг, равный двум.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku считает через два и останавливается, когда доходит до <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значение, которое создаёт <code>...<\/code>, имеет тип <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают другие закономерности, которые умеет находить оператор <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, как последовательность может быть ленивой и даже бесконечной.<\/span><\/p>"]]},"uk":{"t":"Послідовності","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Послідовність<\/em> — це ряд значень у певному порядку, які з'являються одне за одним.<\/span> <span class=\"sg\" data-s=\"1\">Raku будує послідовності оператором <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він знаходить закономірність у значеннях, які ви йому даєте.<\/span> <span class=\"sg\" data-s=\"3\">Потім він створює решту, аж до кінцевої точки.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найпростіша послідовність просто рахує від одного значення до іншого:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо дати два початкові значення, Raku знаходить крок між ними.<\/span> <span class=\"sg\" data-s=\"1\">Потім він продовжує з тим самим кроком.<\/span> <span class=\"sg\" data-s=\"2\">Так створюють арифметичну послідовність:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут початкові значення <code>1, 3<\/code> роблять крок рівним двом.<\/span> <span class=\"sg\" data-s=\"1\">Тож Raku рахує вгору по двійках і зупиняється, коли доходить до <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значення, яке створює <code>...<\/code>, має тип <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують інші закономірності, які може розпізнати оператор <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують, як послідовність може бути лінивою і навіть нескінченною.<\/span><\/p>"]]},"bg":{"t":"Последователности","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Последователността<\/em> е поредица от подредени стойности, които се получават една след друга.<\/span> <span class=\"sg\" data-s=\"1\">Raku създава последователности с оператора <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той намира шаблона в стойностите, които му давате.<\/span> <span class=\"sg\" data-s=\"3\">След това генерира останалите, до крайната точка.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-простата последователност просто брои от една стойност до друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако дадете две начални стойности, Raku намира стъпката между тях.<\/span> <span class=\"sg\" data-s=\"1\">След това продължава със същата стъпка.<\/span> <span class=\"sg\" data-s=\"2\">Така се прави аритметична последователност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук началните стойности <code>1, 3<\/code> правят стъпката две.<\/span> <span class=\"sg\" data-s=\"1\">Затова Raku брои нагоре по две и спира, когато стигне <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стойността, която дава <code>...<\/code>, е от типа <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват други шаблони, които операторът <code>...<\/code> може да разпознае.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и как една последователност може да бъде мързелива и дори безкрайна.<\/span><\/p>"]]},"eo":{"t":"Sekvencoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Sekvenco<\/em> estas serio de valoroj en ordo, produktataj unu post la alia.<\/span> <span class=\"sg\" data-s=\"1\">Raku konstruas sekvencojn per la operatoro <code>...<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi trovas la ŝablonon en la valoroj, kiujn vi donas al ĝi.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi generas la ceteron, ĝis fina punkto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La plej simpla sekvenco nur nombras de unu valoro al alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se vi donas du komencajn valorojn, Raku trovas la paŝon inter ili.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi daŭrigas per la sama paŝo.<\/span> <span class=\"sg\" data-s=\"2\">Tiel vi faras aritmetikan sekvencon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la komencaj valoroj <code>1, 3<\/code> faras la paŝon du.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku nombras supren po du kaj haltas, kiam ĝi atingas <code>11<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La valoro, kiun <code>...<\/code> produktas, havas la tipon <code>Seq<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras aliajn ŝablonojn, kiujn la operatoro <code>...<\/code> povas rekoni.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kiel sekvenco povas esti maldiligenta, kaj eĉ senlima.<\/span><\/p>"]]},"la":{"t":"Series","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Series<\/em> est catena valorum ordine dispositorum, qui unus post alterum fiunt.<\/span> <span class=\"sg\" data-s=\"1\">Raku series operatore <code>...<\/code> construit.<\/span> <span class=\"sg\" data-s=\"2\">Exemplar in valoribus quos ei das invenit.<\/span> <span class=\"sg\" data-s=\"3\">Deinde cetera generat, usque ad finem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Series simplicissima tantum ab uno valore ad alterum numerat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 ... 5; # (1 2 3 4 5)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si duos valores initiales das, Raku gradum inter eos invenit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde eodem gradu pergit.<\/span> <span class=\"sg\" data-s=\"2\">Sic seriem arithmeticam facis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1, 3 ... 11; # (1 3 5 7 9 11)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic valores initiales <code>1, 3<\/code> gradum duorum faciunt.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku binis sursum numerat et consistit cum <code>11<\/code> attingit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valor quem <code>...<\/code> producit typum <code>Seq<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1 ... 5).WHAT; # (Seq)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proxima themata alia exemplaria ostendunt quae operator <code>...<\/code> agnoscere potest.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendunt quomodo series pigra esse possit, atque etiam infinita.<\/span><\/p>"]]}}}</script>
