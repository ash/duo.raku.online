ku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Esto es <code>(8 - 3) - 2<\/code>, que da <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La exponenciación, en cambio, es asociativa por la derecha:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aquí, la expresión se agrupa como <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eso es <code>2 ** 9<\/code>, que da <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparaciones encadenadas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los operadores de comparación se pueden <em>encadenar<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Esto se lee de forma natural y hace lo que esperarías en matemáticas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El valor del medio se compara con los valores a ambos lados.<\/span> <span class=\"sg\" data-s=\"1\">Así, <code>1 &lt; 2 &lt; 3<\/code> es verdadero, porque tanto <code>1 &lt; 2<\/code> como <code>2 &lt; 3<\/code> son verdaderos.<\/span><\/p>"]]},"it":{"t":"Panoramica del comportamento degli operatori","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando un'espressione ha diversi operatori, Raku deve decidere in quale ordine usarli.<\/span> <span class=\"sg\" data-s=\"1\">Due regole lo controllano: la <em>precedenza<\/em> e l'<em>associatività<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Precedenza<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La precedenza decide quale operatore è più forte, cioè quale lega più strettamente.<\/span> <span class=\"sg\" data-s=\"1\">La moltiplicazione ha una precedenza più alta dell'addizione, quindi viene fatta per prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku legge l'espressione come <code>2 + (3 * 4)<\/code>, quindi il risultato è <code>14<\/code> e non <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi sempre usare le parentesi per avere un ordine diverso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associatività<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'associatività decide l'ordine quando gli operatori hanno la <em>stessa<\/em> precedenza.<\/span> <span class=\"sg\" data-s=\"1\">La sottrazione è associativa a sinistra, cioè si raggruppa da sinistra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo è <code>(8 - 3) - 2<\/code>, che dà <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'elevamento a potenza, invece, è associativo a destra:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Qui l'espressione si raggruppa come <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo è <code>2 ** 9<\/code>, che dà <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Confronti concatenati<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli operatori di confronto possono essere <em>concatenati<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Questo si legge in modo naturale e fa quello che ti aspetteresti dalla matematica:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il valore centrale viene confrontato con i valori ai suoi due lati.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>1 &lt; 2 &lt; 3<\/code> è vero, perché sia <code>1 &lt; 2<\/code> sia <code>2 &lt; 3<\/code> sono veri.<\/span><\/p>"]]},"lv":{"t":"Operatoru uzvedības pārskats","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad izteiksmē ir vairāki operatori, Raku ir jāizlemj, kādā secībā tos lietot.<\/span> <span class=\"sg\" data-s=\"1\">To nosaka divi noteikumi: <em>prioritāte<\/em> un <em>asociativitāte<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Prioritāte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prioritāte nosaka, kurš operators ir stiprāks, tas ir, kurš saistās ciešāk.<\/span> <span class=\"sg\" data-s=\"1\">Reizināšanai ir augstāka prioritāte nekā saskaitīšanai, tāpēc to izpilda pirmo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku lasa izteiksmi kā <code>2 + (3 * 4)<\/code>, tāpēc rezultāts ir <code>14<\/code>, nevis <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs vienmēr varat izmantot iekavas, lai iegūtu citu secību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asociativitāte<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Asociativitāte nosaka secību, kad operatoriem ir <em>vienāda<\/em> prioritāte.<\/span> <span class=\"sg\" data-s=\"1\">Atņemšana ir kreisi asociatīva, un tas nozīmē, ka tā grupējas no kreisās puses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas ir <code>(8 - 3) - 2<\/code>, kas dod <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kāpināšana savukārt ir labēji asociatīva:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit izteiksme grupējas kā <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir <code>2 ** 9<\/code>, kas dod <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ķēdētas salīdzināšanas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Salīdzināšanas operatorus var <em>ķēdēt<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tas lasās dabiski un dara to, ko jūs sagaidītu no matemātikas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vidējo vērtību salīdzina ar vērtībām abās tās pusēs.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>1 &lt; 2 &lt; 3<\/code> ir patiess, jo gan <code>1 &lt; 2<\/code>, gan <code>2 &lt; 3<\/code> ir patiesi.<\/span><\/p>"]]},"ru":{"t":"Обзор поведения операторов","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда в выражении несколько операторов, Raku должен решить, в каком порядке их применять.<\/span> <span class=\"sg\" data-s=\"1\">Это определяют два правила: <em>приоритет<\/em> и <em>ассоциативность<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приоритет определяет, какой оператор сильнее, то есть какой из них связывается теснее.<\/span> <span class=\"sg\" data-s=\"1\">У умножения приоритет выше, чем у сложения, поэтому оно выполняется первым:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku читает выражение как <code>2 + (3 * 4)<\/code>, поэтому результат — <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы получить другой порядок, всегда можно использовать скобки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ассоциативность<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ассоциативность определяет порядок, когда у операторов <em>одинаковый<\/em> приоритет.<\/span> <span class=\"sg\" data-s=\"1\">Вычитание левоассоциативно, то есть оно группируется слева:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это <code>(8 - 3) - 2<\/code>, что даёт <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А вот возведение в степень правоассоциативно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь выражение группируется как <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это <code>2 ** 9<\/code>, что даёт <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Цепочки сравнений<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторы сравнения можно <em>объединять в цепочки<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это читается естественно и работает так, как вы ожидаете по математике:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Среднее значение сравнивается со значениями по обе стороны от него.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>1 &lt; 2 &lt; 3<\/code> истинно, ведь и <code>1 &lt; 2<\/code>, и <code>2 &lt; 3<\/code> истинны.<\/span><\/p>"]]},"uk":{"t":"Огляд поведінки операторів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли вираз має кілька операторів, Raku має вирішити, в якому порядку їх застосовувати.<\/span> <span class=\"sg\" data-s=\"1\">Цим керують два правила: <em>пріоритет<\/em> і <em>асоціативність<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пріоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Пріоритет вирішує, який оператор сильніший, тобто який зв'язується міцніше.<\/span> <span class=\"sg\" data-s=\"1\">Множення має вищий пріоритет, ніж додавання, тож воно виконується першим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku читає вираз як <code>2 + (3 * 4)<\/code>, тож результат — <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви завжди можете поставити дужки, щоб отримати інший порядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Асоціативність<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоціативність вирішує порядок, коли оператори мають <em>однаковий<\/em> пріоритет.<\/span> <span class=\"sg\" data-s=\"1\">Віднімання лівоасоціативне, тобто воно групується зліва:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це <code>(8 - 3) - 2<\/code>, що дає <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">А от піднесення до степеня, навпаки, правоасоціативне:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут вираз групується як <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тобто це <code>2 ** 9<\/code>, що дає <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ланцюжки порівнянь<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в <em>ланцюжки<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це читається природно й працює так, як ви чекаєте з математики:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Середнє значення порівнюється зі значеннями з обох боків від нього.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>1 &lt; 2 &lt; 3<\/code> істинне, бо істинні і <code>1 &lt; 2<\/code>, і <code>2 &lt; 3<\/code>.<\/span><\/p>"]]},"bg":{"t":"Преглед на поведението на операторите","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато един израз има няколко оператора, Raku трябва да реши в какъв ред да ги използва.<\/span> <span class=\"sg\" data-s=\"1\">Две правила управляват това: <em>приоритет<\/em> и <em>асоциативност<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приоритет<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приоритетът решава кой оператор е по-силен, тоест кой свързва по-силно.<\/span> <span class=\"sg\" data-s=\"1\">Умножението има по-висок приоритет от събирането, затова се изпълнява първо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku чете израза като <code>2 + (3 * 4)<\/code>, затова резултатът е <code>14<\/code>, а не <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Винаги можете да използвате скоби, за да получите различен ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Асоциативност<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Асоциативността решава реда, когато операторите имат <em>еднакъв<\/em> приоритет.<\/span> <span class=\"sg\" data-s=\"1\">Изваждането е ляво-асоциативно, което означава, че се групира отляво:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това е <code>(8 - 3) - 2<\/code>, което дава <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Степенуването, от друга страна, е дясно-асоциативно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук изразът се групира като <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е <code>2 ** 9<\/code>, което дава <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Верижни сравнения<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Операторите за сравнение могат да бъдат <em>верижни<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това се чете естествено и прави това, което бихте очаквали от математиката:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Средната стойност се сравнява със стойностите от двете ѝ страни.<\/span> <span class=\"sg\" data-s=\"1\">Така <code>1 &lt; 2 &lt; 3<\/code> е вярно, защото и <code>1 &lt; 2<\/code>, и <code>2 &lt; 3<\/code> са верни.<\/span><\/p>"]]},"eo":{"t":"Revizio de operatora konduto","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam esprimo havas plurajn operatorojn, Raku devas decidi, en kiu ordo uzi ilin.<\/span> <span class=\"sg\" data-s=\"1\">Du reguloj regas tion: <em>prioritato<\/em> kaj <em>asocieco<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Prioritato<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Prioritato decidas, kiu operatoro estas pli forta, tio estas, kiu ligas pli forte.<\/span> <span class=\"sg\" data-s=\"1\">Multipliko havas pli altan prioritaton ol adicio, do ĝi estas farata unue:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku legas la esprimon kiel <code>2 + (3 * 4)<\/code>, do la rezulto estas <code>14<\/code> kaj ne <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ĉiam povas uzi krampojn por ricevi alian ordon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Asocieco<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Asocieco decidas la ordon, kiam operatoroj havas la <em>saman<\/em> prioritaton.<\/span> <span class=\"sg\" data-s=\"1\">Subtraho estas maldekstre-asocia, kio signifas, ke ĝi grupiĝas de maldekstre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio estas <code>(8 - 3) - 2<\/code>, kio donas <code>3<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Potencigo, aliflanke, estas dekstre-asocia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la esprimo grupiĝas kiel <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas <code>2 ** 9<\/code>, kio donas <code>512<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ĉenitaj komparoj<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Komparaj operatoroj povas esti <em>ĉenitaj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tio legiĝas nature kaj faras tion, kion vi atendus el matematiko:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La meza valoro estas komparata kun la valoroj ĉe ambaŭ flankoj de ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>1 &lt; 2 &lt; 3<\/code> estas vera, ĉar kaj <code>1 &lt; 2<\/code> kaj <code>2 &lt; 3<\/code> estas veraj.<\/span><\/p>"]]},"la":{"t":"Conspectus operatorum","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum expressio plures operatores habet, Raku decernere debet quo ordine eos adhibeat.<\/span> <span class=\"sg\" data-s=\"1\">Duae regulae hoc regunt: <em>praecedentia<\/em> et <em>associativitas<\/em>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Praecedentia<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Praecedentia decernit quis operator fortior sit, id est, quis arctius liget.<\/span> <span class=\"sg\" data-s=\"1\">Multiplicatio altiorem praecedentiam quam additio habet, ergo primum fit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 + 3 * 4; # 14<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku expressionem legit ut <code>2 + (3 * 4)<\/code>, ergo eventus est <code>14<\/code>, non <code>20<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Semper parenthesibus uti potes ut alium ordinem accipias:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (2 + 3) * 4; # 20<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Associativitas<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Associativitas ordinem decernit cum operatores <em>eandem<\/em> praecedentiam habent.<\/span> <span class=\"sg\" data-s=\"1\">Subtractio sinistro-associativa est, id est a sinistra congregat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 8 - 3 - 2; # 3<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc est <code>(8 - 3) - 2<\/code>, quod <code>3<\/code> dat.<\/span> <span class=\"sg\" data-s=\"1\">Elevatio ad potestatem autem dextro-associativa est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 3 ** 2; # 512<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic expressio congregat ut <code>2 ** (3 ** 2)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Id est <code>2 ** 9<\/code>, quod <code>512<\/code> dat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comparationes catenatae<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operatores comparationis <em>catenari<\/em> possunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc naturaliter legitur et facit quod ex mathematica exspectas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1 &lt; 2 &lt; 3; # True\nsay 1 &lt; 5 &lt; 3; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Valor medius cum valoribus ab utraque parte comparatur.<\/span> <span class=\"sg\" data-s=\"1\">Ergo <code>1 &lt; 2 &lt; 3<\/code> verum est, quia et <code>1 &lt; 2<\/code> et <code>2 &lt; 3<\/code> vera sunt.<\/span><\/p>"]]}}}</script>
