orter way.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Verketteter Vergleich","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vergleichsoperatoren können verkettet werden. Also bedeutet <code>0 &lt;= 73 &lt;= 100<\/code>: „0 ist höchstens 73, und 73 ist höchstens 100“. Der Operator <code>&lt;=<\/code> erlaubt die Endwerte. Also wäre auch ein Ergebnis von genau <code>0<\/code> oder <code>100<\/code> gültig.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Teile sind wahr, also ist der ganze Ausdruck <code>True<\/code>. Beachten Sie, dass Sie den mittleren Wert <code>73<\/code> nur einmal schreiben. Trotzdem wird er mit seinen beiden Nachbarn verglichen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ohne Verkettung müssten Sie beide Vergleiche ausschreiben und mit <code>&amp;&amp;<\/code> verbinden. Dann wiederholen Sie den mittleren Wert: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Die verkettete Form sagt dasselbe auf kürzere Weise.<\/span><\/li><\/ol>"]]},"nl":{"t":"Solution: Gekoppelde vergelijking","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sa \"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los operadores de comparación se pueden encadenar. Así, <code>0 &lt;= 73 &lt;= 100<\/code> significa “0 es como máximo 73, y 73 es como máximo 100”. El operador <code>&lt;=<\/code> permite los valores de los extremos. Así, una puntuación de exactamente <code>0<\/code> o <code>100<\/code> también sería válida.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Las dos partes son verdaderas, así que toda la expresión es <code>True<\/code>. Observa que escribes el valor del medio <code>73<\/code> solo una vez. Aun así, se compara con sus dos vecinos.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sin encadenar, tendrías que escribir las dos comparaciones y unirlas con <code>&amp;&amp;<\/code>. Entonces repites el valor del medio: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La forma encadenada dice lo mismo de forma más corta.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Confronto concatenato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Gli operatori di confronto possono essere concatenati. Quindi <code>0 &lt;= 73 &lt;= 100<\/code> significa “0 è al massimo 73, e 73 è al massimo 100”. L'operatore <code>&lt;=<\/code> ammette i valori agli estremi. Quindi anche un punteggio di esattamente <code>0<\/code> o <code>100<\/code> sarebbe valido.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Entrambe le parti sono vere, quindi tutta l'espressione è <code>True<\/code>. Nota che scrivi il valore centrale <code>73<\/code> una sola volta. Eppure viene confrontato con entrambi i suoi vicini.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Senza concatenazione, dovresti scrivere entrambi i confronti e unirli con <code>&amp;&amp;<\/code>. Allora ripeti il valore centrale: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La forma concatenata dice la stessa cosa in modo più breve.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Ķēdēts salīdzinājums","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Salīdzināšanas operatorus var ķēdēt. Tāpēc <code>0 &lt;= 73 &lt;= 100<\/code> nozīmē “0 ir ne lielāks par 73, un 73 ir ne lielāks par 100”. Operators <code>&lt;=<\/code> atļauj arī galējās vērtības. Tāpēc arī rezultāts tieši <code>0<\/code> vai <code>100<\/code> būtu derīgs.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Abas daļas ir patiesas, tāpēc visa izteiksme ir <code>True<\/code>. Ievērojiet, ka vidējo vērtību <code>73<\/code> jūs rakstāt tikai vienu reizi. Tomēr to salīdzina ar abiem tās kaimiņiem.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Bez ķēdēšanas jums būtu jāuzraksta abas salīdzināšanas un jāsavieno tās ar <code>&amp;&amp;<\/code>. Tad jūs atkārtojat vidējo vērtību: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Ķēdētā forma saka to pašu īsākā veidā.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Цепочечное сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторы сравнения можно объединять в цепочки. Поэтому <code>0 &lt;= 73 &lt;= 100<\/code> означает «0 не больше 73, а 73 не больше 100». Оператор <code>&lt;=<\/code> допускает граничные значения. Поэтому результат ровно <code>0<\/code> или <code>100<\/code> тоже был бы допустимым.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обе части истинны, поэтому всё выражение равно <code>True<\/code>. Обратите внимание, что среднее значение <code>73<\/code> вы пишете только один раз. И всё же оно сравнивается с обоими соседями.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без цепочек пришлось бы записать оба сравнения и соединить их с помощью <code>&amp;&amp;<\/code>. Тогда среднее значение повторяется: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Цепочка сравнений говорит то же самое короче.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ланцюжок порівнянь","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оператори порівняння можна об'єднувати в ланцюжки. Тож <code>0 &lt;= 73 &lt;= 100<\/code> означає «0 не більше за 73, і 73 не більше за 100». Оператор <code>&lt;=<\/code> дозволяє крайні значення. Тож бал рівно <code>0<\/code> чи <code>100<\/code> теж був би дійсним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидві частини істинні, тож увесь вираз дає <code>True<\/code>. Зверніть увагу, що середнє значення <code>73<\/code> ви пишете лише раз. Проте його порівнюють з обома сусідами.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без ланцюжка довелося б виписати обидва порівняння й з'єднати їх через <code>&amp;&amp;<\/code>. Тоді ви повторюєте середнє значення: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Форма з ланцюжком каже те саме коротше.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Верижно сравнение","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите пълния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Резултат<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Операторите за сравнение могат да бъдат верижни. Така <code>0 &lt;= 73 &lt;= 100<\/code> означава „0 е най-много 73, и 73 е най-много 100“. Операторът <code>&lt;=<\/code> позволява крайните стойности. Така резултат от точно <code>0<\/code> или <code>100<\/code> също би бил валиден.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двете части са верни, затова целият израз е <code>True<\/code>. Забележете, че пишете средната стойност <code>73<\/code> само веднъж. Въпреки това тя се сравнява и с двата си съседа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Без верижното сравнение би трябвало да напишете двете сравнения и да ги свържете с <code>&amp;&amp;<\/code>. Тогава повтаряте средната стойност: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Верижната форма казва същото по по-кратък начин.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ĉenita komparo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Komparaj operatoroj povas esti ĉenitaj. Do <code>0 &lt;= 73 &lt;= 100<\/code> signifas «0 estas maksimume 73, kaj 73 estas maksimume 100». La operatoro <code>&lt;=<\/code> permesas la finajn valorojn. Do poentaro de ĝuste <code>0<\/code> aŭ <code>100<\/code> ankaŭ validus.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambaŭ partoj estas veraj, do la tuta esprimo estas <code>True<\/code>. Notu, ke vi skribas la mezan valoron <code>73<\/code> nur unufoje. Tamen ĝi estas komparata kun ambaŭ siaj najbaroj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sen ĉenado, vi devus skribi ambaŭ komparojn kaj kunigi ilin per <code>&amp;&amp;<\/code>. Tiam vi ripetas la mezan valoron: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. La ĉenita formo diras la samon pli mallonge.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Comparatio catenata","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>say 0 &lt;= 73 &lt;= 100;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/operators-overview/chained-comparison.raku\" target=\"_blank\" rel=\"noopener\">chained-comparison.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Operatores comparationis catenari possunt. Ergo <code>0 &lt;= 73 &lt;= 100<\/code> significat “0 est ad summum 73, et 73 est ad summum 100”. Operator <code>&lt;=<\/code> valores extremos permittit. Ergo punctum exacte <code>0<\/code> vel <code>100<\/code> quoque validum esset.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ambae partes verae sunt, ergo tota expressio <code>True<\/code> est. Nota quod valorem medium <code>73<\/code> semel tantum scribis. Tamen cum ambobus vicinis suis comparatur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sine catenatione ambas comparationes scribere et cum <code>&amp;&amp;<\/code> coniungere deberes. Tum valorem medium repetis: <code>0 &lt;= 73 &amp;&amp; 73 &lt;= 100<\/code>. Forma catenata idem brevius dicit.<\/span><\/li><\/ol>"]]}}}</script>
