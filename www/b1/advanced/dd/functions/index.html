<script type="application/json" id="page-data">{"u":"advanced/dd/functions","n":346,"k":"topic","pv":"advanced/dd/variables/quiz","nx":"advanced/dd/exercises","tr":["advanced","advanced/dd"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Dumping function signatures","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">You can call a bare <code>dd<\/code>, with no arguments, inside a subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Then it prints the signature of that subroutine.<\/span> <span class=\"sg\" data-s=\"2\">This is its name and the list of parameters, if it has any.<\/span> <span class=\"sg\" data-s=\"3\">Look at the following example with two subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints the signatures, not any values:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This is especially useful with multi-functions, as it shows which variant was really called:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Each time, the output shows the matching variant:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"de":{"t":"Funktionssignaturen dumpen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Du kannst ein nacktes <code>dd<\/code> ohne Argumente in einer Subroutine aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Dann gibt es die Signatur dieser Subroutine aus.<\/span> <span class=\"sg\" data-s=\"2\">Das sind ihr Name und die Liste der Parameter, falls sie welche hat.<\/span> <span class=\"sg\" data-s=\"3\">Sieh dir das folgende Beispiel mit zwei Subroutinen an:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt die Signaturen aus, keine Werte:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das ist besonders nützlich bei Multi-Funktionen, denn es zeigt, welche Variante wirklich aufgerufen wurde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jedes Mal zeigt die Ausgabe die passende Variante:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"nl":{"t":"Functiesignaturen dumpen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Je kunt een kale <code>dd<\/code> aanroepen, zonder argumenten, binnen een subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Dan toont hij de signatuur van die subroutine.<\/span> <span class=\"sg\" data-s=\"2\">Dat is de naam en de lijst van parameters, als die er zijn.<\/span> <span class=\"sg\" data-s=\"3\">Bekijk het volgende voorbeeld met twee subroutines:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma toont de signaturen, geen waarden:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit is vooral handig bij multi-functies, omdat het laat zien welke variant echt werd aangeroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Elke keer toont de uitvoer de passende variant:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"es":{"t":"Volcado de firmas de funciones","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puedes llamar a <code>dd<\/code> solo, sin argumentos, dentro de una subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Entonces imprime la firma de esa subrutina.<\/span> <span class=\"sg\" data-s=\"2\">Es decir, su nombre y la lista de parámetros, si los tiene.<\/span> <span class=\"sg\" data-s=\"3\">Mira el siguiente ejemplo con dos subrutinas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime las firmas, no los valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Esto es especialmente útil con multi-funciones, porque muestra qué variante se llamó realmente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cada vez, la salida muestra la variante correspondiente:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"it":{"t":"Dump delle firme di funzione","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Puoi chiamare un <code>dd<\/code> da solo, senza argomenti, dentro una subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Allora stampa la firma di quella subroutine.<\/span> <span class=\"sg\" data-s=\"2\">La firma contiene il suo nome e la lista dei parametri, se ne ha.<\/span> <span class=\"sg\" data-s=\"3\">Guarda il seguente esempio con due subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa le firme, non dei valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo è utile soprattutto con le multi-funzioni, perché mostra quale variante è stata chiamata davvero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ogni volta, l'output mostra la variante corrispondente:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"lv":{"t":"Funkciju parakstu izgūšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs varat izsaukt kailu <code>dd<\/code> bez argumentiem apakšprogrammas iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā izdrukā šīs apakšprogrammas parakstu.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tās nosaukums un parametru saraksts, ja tādi ir.<\/span> <span class=\"sg\" data-s=\"3\">Aplūkojiet šo piemēru ar divām apakšprogrammām:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā parakstus, nevis vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tas ir īpaši noderīgi ar multifunkcijām, jo tas parāda, kurš variants tiešām tika izsaukts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Katru reizi izvade parāda atbilstošo variantu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"ru":{"t":"Сигнатура функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри подпрограммы можно вызвать просто <code>dd<\/code>, без аргументов.<\/span> <span class=\"sg\" data-s=\"1\">Тогда она печатает сигнатуру этой подпрограммы.<\/span> <span class=\"sg\" data-s=\"2\">Это её имя и список параметров, если они есть.<\/span> <span class=\"sg\" data-s=\"3\">Посмотрите на следующий пример с двумя подпрограммами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает сигнатуры, а не значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Это особенно полезно с мультифункциями, потому что <code>dd<\/code> показывает, какой вариант был вызван на самом деле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Каждый раз вывод показывает подходящий вариант:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"uk":{"t":"Вивід сигнатур функцій","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви можете викликати просто <code>dd<\/code>, без аргументів, усередині підпрограми.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>dd<\/code> друкує сигнатуру цієї підпрограми.<\/span> <span class=\"sg\" data-s=\"2\">Це її ім'я та список параметрів, якщо підпрограма їх має.<\/span> <span class=\"sg\" data-s=\"3\">Подивіться на такий приклад із двома підпрограмами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма друкує сигнатури, а не значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Це особливо корисно з мультифункціями, бо показує, який варіант було справді викликано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоразу вивід показує відповідний варіант:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"bg":{"t":"Извеждане на сигнатури на функции","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Можете да извикате само <code>dd<\/code>, без аргументи, вътре в подпрограма.<\/span> <span class=\"sg\" data-s=\"1\">Тогава тя отпечатва сигнатурата на тази подпрограма.<\/span> <span class=\"sg\" data-s=\"2\">Това са нейното име и списъкът с параметри, ако има такива.<\/span> <span class=\"sg\" data-s=\"3\">Разгледайте следния пример с две подпрограми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва сигнатурите, а не стойности:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това е особено полезно при мулти-функции, защото показва кой вариант е бил извикан наистина:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Всеки път изходът показва съответния вариант:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"eo":{"t":"Dumpado de funkciaj subskriboj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi povas voki nudan <code>dd<\/code>, sen argumentoj, ene de subrutino.<\/span> <span class=\"sg\" data-s=\"1\">Tiam ĝi presas la signaturon de tiu subrutino.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas ĝia nomo kaj la listo de parametroj, se ĝi havas iujn.<\/span> <span class=\"sg\" data-s=\"3\">Rigardu la jenan ekzemplon kun du subrutinoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas la signaturojn, ne valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tio estas speciale utila kun plur-funkcioj, ĉar ĝi montras, kiu varianto estis vere vokita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉiufoje, la eligo montras la kongruan varianton:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]},"la":{"t":"Signaturas functionum dumping","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> nudum, sine argumentis, intra subroutinam vocare potes.<\/span> <span class=\"sg\" data-s=\"1\">Tum signaturam illius subroutinae imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Signatura nomen eius et indicem parametrorum continet, si quos habet.<\/span> <span class=\"sg\" data-s=\"3\">Inspice exemplum sequens cum duabus subroutinis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub f1 {\n    dd\n}\n\nf1();\n\nsub f2($x) {\n    dd\n}\n\nf2(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma signaturas imprimit, non valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub f1()\nsub f2($x)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc praecipue utile est cum multi-functionibus, quia ostendit quam variantem programma revera vocaverit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>multi sub g {\n    dd\n}\n\nmulti sub g($x) {\n    dd\n}\n\ng();\ng(42);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quaque vice output variantem congruentem ostendit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>sub g()\nsub g($x)<\/code><\/pre>"]]}}}</script>
