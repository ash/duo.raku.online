<script type="application/json" id="page-data">{"u":"advanced/dd","n":343,"k":"section","pv":"advanced/representations/choosing","nx":"advanced/dd/variables","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Debugging Raku programs","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">There are different ways to debug a program.<\/span> <span class=\"sg\" data-s=\"1\">You can simply print values with <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Or you can use more advanced tools that trace the program.<\/span> <span class=\"sg\" data-s=\"3\">In this section, we look at the useful <code>dd<\/code> routine.<\/span> <span class=\"sg\" data-s=\"4\">It comes with the Rakudo compiler, but the Raku language standard does not include it.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">The name <code>dd<\/code> stands for <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The routines <code>say<\/code> and <code>put<\/code> are for the normal output of a program.<\/span> <span class=\"sg\" data-s=\"2\">But <code>dd<\/code> prints a value in a form that is useful for developers.<\/span> <span class=\"sg\" data-s=\"3\">This is the same code-like form that you get from the <a href=\"/advanced/representations/raku-method/\"><code>.raku<\/code><\/a> method.<\/span> <span class=\"sg\" data-s=\"4\">We saw this method in the previous section.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> prints to the standard error stream.<\/span> <span class=\"sg\" data-s=\"6\">So its output does not mix with what your program prints for the user.<\/span><\/p>"]]},"de":{"t":"Debugging mit <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Es gibt verschiedene Wege, ein Programm zu debuggen.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst Werte einfach mit <code>say<\/code> ausgeben.<\/span> <span class=\"sg\" data-s=\"2\">Oder du verwendest fortgeschrittene Werkzeuge, die das Programm verfolgen.<\/span> <span class=\"sg\" data-s=\"3\">In diesem Abschnitt schauen wir uns die nützliche Routine <code>dd<\/code> an.<\/span> <span class=\"sg\" data-s=\"4\">Sie gehört zum Rakudo-Compiler, aber der Raku-Sprachstandard enthält sie nicht.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Der Name <code>dd<\/code> steht für <em>Data Dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Die Routinen <code>say<\/code> und <code>put<\/code> sind für die normale Ausgabe eines Programms gedacht.<\/span> <span class=\"sg\" data-s=\"2\">Aber <code>dd<\/code> gibt einen Wert in einer Form aus, die für Entwickler nützlich ist.<\/span> <span class=\"sg\" data-s=\"3\">Das ist dieselbe codeähnliche Form, die du von der <a href=\"https://course.raku.org/de/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code>-Methode<\/a> bekommst.<\/span> <span class=\"sg\" data-s=\"4\">Wir haben diese Methode im vorherigen Abschnitt gesehen.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> schreibt auf den Standardfehlerstream.<\/span> <span class=\"sg\" data-s=\"6\">Deshalb mischt sich seine Ausgabe nicht mit dem, was dein Programm für den Benutzer ausgibt.<\/span><\/p>"]]},"nl":{"t":"Debuggen met <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Er zijn verschillende manieren om een programma te debuggen.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt gewoon waarden tonen met <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Of je gebruikt geavanceerdere hulpmiddelen die het programma volgen.<\/span> <span class=\"sg\" data-s=\"3\">In dit onderdeel bekijken we de handige <code>dd<\/code>-routine.<\/span> <span class=\"sg\" data-s=\"4\">Hij hoort bij de Rakudo-compiler, maar de Raku-taalstandaard bevat hem niet.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">De naam <code>dd<\/code> staat voor <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De routines <code>say<\/code> en <code>put<\/code> zijn voor de normale uitvoer van een programma.<\/span> <span class=\"sg\" data-s=\"2\">Maar <code>dd<\/code> toont een waarde in een vorm die handig is voor ontwikkelaars.<\/span> <span class=\"sg\" data-s=\"3\">Dit is dezelfde codeachtige vorm die je krijgt van de <a href=\"https://course.raku.org/nl/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>-methode.<\/span> <span class=\"sg\" data-s=\"4\">We zagen deze methode in het vorige onderdeel.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> schrijft naar de standaardfoutstroom.<\/span> <span class=\"sg\" data-s=\"6\">Daarom mengt de uitvoer niet met wat je programma voor de gebruiker toont.<\/span><\/p>"]]},"es":{"t":"Depuración con <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Hay diferentes formas de depurar un programa.<\/span> <span class=\"sg\" data-s=\"1\">Puedes simplemente imprimir valores con <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">O puedes usar herramientas más avanzadas que rastrean el programa.<\/span> <span class=\"sg\" data-s=\"3\">En esta sección, vemos la útil rutina <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Viene con el compilador Rakudo, pero el estándar del lenguaje Raku no la incluye.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">El nombre <code>dd<\/code> significa <em>data dumper<\/em> (volcador de datos).<\/span> <span class=\"sg\" data-s=\"1\">Las rutinas <code>say<\/code> y <code>put<\/code> son para la salida normal de un programa.<\/span> <span class=\"sg\" data-s=\"2\">Pero <code>dd<\/code> imprime un valor en una forma que es útil para los desarrolladores.<\/span> <span class=\"sg\" data-s=\"3\">Es la misma forma similar a código que obtienes con el método <a href=\"https://course.raku.org/es/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Vimos este método en la sección anterior.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> imprime en el flujo de error estándar.<\/span> <span class=\"sg\" data-s=\"6\">Así su salida no se mezcla con lo que tu programa imprime para el usuario.<\/span><\/p>"]]},"it":{"t":"Debugging con <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ci sono diversi modi per fare il debug di un programma.<\/span> <span class=\"sg\" data-s=\"1\">Puoi semplicemente stampare i valori con <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Oppure puoi usare strumenti più avanzati che seguono il programma passo dopo passo.<\/span> <span class=\"sg\" data-s=\"3\">In questa sezione, guardiamo l'utile routine <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">È inclusa nel compilatore Rakudo, ma lo standard del linguaggio Raku non la contiene.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Il nome <code>dd<\/code> sta per <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Le routine <code>say<\/code> e <code>put<\/code> servono per l'output normale di un programma.<\/span> <span class=\"sg\" data-s=\"2\">Ma <code>dd<\/code> stampa un valore in una forma utile per gli sviluppatori.<\/span> <span class=\"sg\" data-s=\"3\">È la stessa forma simile al codice che ottieni dal metodo <a href=\"https://course.raku.org/it/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Abbiamo visto questo metodo nella sezione precedente.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> stampa sul flusso di errore standard.<\/span> <span class=\"sg\" data-s=\"6\">Così il suo output non si mescola con quello che il tuo programma stampa per l'utente.<\/span><\/p>"]]},"lv":{"t":"Atkļūdošana ar <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Programmu var atkļūdot dažādos veidos.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat vienkārši izdrukāt vērtības ar <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī jūs varat izmantot sarežģītākus rīkus, kas izseko programmas darbu.<\/span> <span class=\"sg\" data-s=\"3\">Šajā sadaļā mēs aplūkojam noderīgo rutīnu <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tā nāk kopā ar Rakudo kompilatoru, bet Raku valodas standarts to neietver.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Nosaukums <code>dd<\/code> nozīmē <em>data dumper<\/em> (datu izmetējs).<\/span> <span class=\"sg\" data-s=\"1\">Rutīnas <code>say<\/code> un <code>put<\/code> ir paredzētas programmas parastajai izvadei.<\/span> <span class=\"sg\" data-s=\"2\">Bet <code>dd<\/code> izdrukā vērtību formā, kas ir noderīga izstrādātājiem.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir tā pati kodam līdzīgā forma, ko jūs iegūstat no metodes <a href=\"https://course.raku.org/lv/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Mēs redzējām šo metodi iepriekšējā sadaļā.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> drukā standarta kļūdu plūsmā.<\/span> <span class=\"sg\" data-s=\"6\">Tāpēc tās izvade nesajaucas ar to, ko jūsu programma izdrukā lietotājam.<\/span><\/p>"]]},"ru":{"t":"Отладка с помощью <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Есть разные способы отладки программы.<\/span> <span class=\"sg\" data-s=\"1\">Можно просто печатать значения с помощью <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">А можно взять более сложные инструменты, которые следят за ходом программы.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе мы рассмотрим полезную процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Она есть в компиляторе Rakudo, но стандарт языка Raku её не включает.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Название <code>dd<\/code> расшифровывается как <em>data dumper<\/em> (дампер данных).<\/span> <span class=\"sg\" data-s=\"1\">Процедуры <code>say<\/code> и <code>put<\/code> нужны для обычного вывода программы.<\/span> <span class=\"sg\" data-s=\"2\">А <code>dd<\/code> печатает значение в виде, который удобен для разработчиков.<\/span> <span class=\"sg\" data-s=\"3\">Это та же форма, похожая на код, которую даёт метод <a href=\"https://course.raku.org/ru/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Мы видели этот метод в предыдущем разделе.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> печатает в поток стандартной ошибки.<\/span> <span class=\"sg\" data-s=\"6\">Поэтому её вывод не смешивается с тем, что ваша программа печатает для пользователя.<\/span><\/p>"]]},"uk":{"t":"Налагодження з <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Є різні способи налагодити програму.<\/span> <span class=\"sg\" data-s=\"1\">Можна просто друкувати значення через <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Або можна взяти складніші інструменти, які стежать за виконанням програми.<\/span> <span class=\"sg\" data-s=\"3\">У цьому розділі ми розглянемо корисну процедуру <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вона входить до компілятора Rakudo, але стандарт мови Raku її не містить.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Назва <code>dd<\/code> означає <em>data dumper<\/em> (дамп даних).<\/span> <span class=\"sg\" data-s=\"1\">Процедури <code>say<\/code> і <code>put<\/code> призначені для звичайного виводу програми.<\/span> <span class=\"sg\" data-s=\"2\">Але <code>dd<\/code> друкує значення у формі, зручній для розробників.<\/span> <span class=\"sg\" data-s=\"3\">Це та сама схожа на код форма, яку ви отримуєте від методу <a href=\"https://course.raku.org/uk/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ми бачили цей метод у попередньому розділі.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> друкує у стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"6\">Тому її вивід не змішується з тим, що ваша програма друкує для користувача.<\/span><\/p>"]]},"bg":{"t":"Отстраняване на грешки с <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Има различни начини да дебъгвате програма.<\/span> <span class=\"sg\" data-s=\"1\">Можете просто да отпечатвате стойности със <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Или можете да използвате по-сложни инструменти, които проследяват програмата.<\/span> <span class=\"sg\" data-s=\"3\">В тази секция ще разгледаме полезната процедура <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Тя идва с компилатора Rakudo, но стандартът на езика Raku не я включва.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Името <code>dd<\/code> означава <em>data dumper<\/em> (инструмент за извеждане на данни).<\/span> <span class=\"sg\" data-s=\"1\">Процедурите <code>say<\/code> и <code>put<\/code> са за нормалния изход на програмата.<\/span> <span class=\"sg\" data-s=\"2\">Но <code>dd<\/code> отпечатва стойността във форма, която е удобна за разработчици.<\/span> <span class=\"sg\" data-s=\"3\">Това е същата кодоподобна форма, която получавате от метода <a href=\"https://course.raku.org/bg/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Видяхме този метод в предишната секция.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> отпечатва в стандартния поток за грешки.<\/span> <span class=\"sg\" data-s=\"6\">Така нейният изход не се смесва с това, което програмата ви отпечатва за потребителя.<\/span><\/p>"]]},"eo":{"t":"Senararigado kun <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ekzistas diversaj manieroj sencimigi programon.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas simple presi valorojn per <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ vi povas uzi pli progresintajn ilojn, kiuj spuras la programon.<\/span> <span class=\"sg\" data-s=\"3\">En ĉi tiu sekcio, ni rigardas la utilan rutinon <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi venas kun la Rakudo-kompililo, sed la normo de la lingvo Raku ne enhavas ĝin.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">La nomo <code>dd<\/code> signifas <em>data dumper<\/em> (datumelmontrilo).<\/span> <span class=\"sg\" data-s=\"1\">La rutinoj <code>say<\/code> kaj <code>put<\/code> estas por la normala eligo de programo.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>dd<\/code> presas valoron en formo, kiu estas utila por programistoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas la sama kodosimila formo, kiun vi ricevas de la metodo <a href=\"https://course.raku.org/eo/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a>.<\/span> <span class=\"sg\" data-s=\"4\">Ni vidis ĉi tiun metodon en la antaŭa sekcio.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> presas al la norma erara fluo.<\/span> <span class=\"sg\" data-s=\"6\">Do ĝia eligo ne miksiĝas kun tio, kion via programo presas por la uzanto.<\/span><\/p>"]]},"la":{"t":"Debugging cum <code>dd<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Diversi modi sunt ad programma corrigendum.<\/span> <span class=\"sg\" data-s=\"1\">Valores simpliciter cum <code>say<\/code> imprimere potes.<\/span> <span class=\"sg\" data-s=\"2\">Vel instrumenta provectiora adhibere potes, quae cursum programmatis sequuntur.<\/span> <span class=\"sg\" data-s=\"3\">In hac sectione utilem subroutinam <code>dd<\/code> inspicimus.<\/span> <span class=\"sg\" data-s=\"4\">Cum compilatore Rakudo venit, sed norma linguae Raku eam non continet.<\/span><\/p>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Nomen <code>dd<\/code> significat <em>data dumper<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Subroutinae <code>say<\/code> et <code>put<\/code> pro output normali programmatis sunt.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>dd<\/code> valorem in forma imprimit quae developoribus utilis est.<\/span> <span class=\"sg\" data-s=\"3\">Haec est eadem forma codici similis quam a methodo <a href=\"https://course.raku.org/la/advanced/representations/raku-method/\" target=\"_blank\" rel=\"noopener\"><code>.raku<\/code><\/a> accipis.<\/span> <span class=\"sg\" data-s=\"4\">Hanc methodum in sectione priore vidimus.<\/span> <span class=\"sg\" data-s=\"5\"><code>dd<\/code> in flumen erroris normalis imprimit.<\/span> <span class=\"sg\" data-s=\"6\">Itaque output eius non miscetur cum eo quod programma tuum pro usore imprimit.<\/span><\/p>"]]}}}</script>
