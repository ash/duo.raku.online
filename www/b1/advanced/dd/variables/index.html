ar = 42<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">В этом главное отличие от <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Один вызов <code>dd<\/code> для скаляра сообщает вам имя переменной.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он сообщает тип данных, когда тот известен.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно добавить в программу несколько вызовов <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Вы всё равно увидите, какой вывод относится к какой переменной.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можно выводить дамп и более сложных структур данных, например массивов или хэшей.<\/span> <span class=\"sg\" data-s=\"1\">Тогда <code>dd<\/code> печатает значение в виде, похожем на код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что вложенный массив хорошо видно.<\/span> <span class=\"sg\" data-s=\"1\">Но имя переменной не печатается.<\/span> <span class=\"sg\" data-s=\"2\">С хэшами это работает так же, и <code>dd<\/code> печатает их ключи в отсортированном порядке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"uk":{"t":"Вивід змінних","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Викличте <code>dd<\/code>, щоб побачити, що є всередині змінної.<\/span> <span class=\"sg\" data-s=\"1\">Ви користуєтеся <code>dd<\/code> так само, як <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> друкує і значення, і ім'я змінної:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо змінна має оголошений тип, <code>dd<\/code> показує також тип.<\/span> <span class=\"sg\" data-s=\"1\">Порівняйте вивід цієї програми з попередньою:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це головна відмінність від <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Один виклик <code>dd<\/code> для скаляра показує вам ім'я змінної.<\/span> <span class=\"sg\" data-s=\"2\">Він також показує тип даних, коли тип відомий.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете додати в програму кілька викликів <code>dd<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ви все одно побачите, який вивід належить якій змінній.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви також можете дампити складніші структури даних, наприклад масиви або хеші.<\/span> <span class=\"sg\" data-s=\"1\">Тоді <code>dd<\/code> друкує значення у формі, схожій на код:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що вкладений масив добре видно.<\/span> <span class=\"sg\" data-s=\"1\">Але ім'я змінної не друкується.<\/span> <span class=\"sg\" data-s=\"2\">З хешами це працює так само, і <code>dd<\/code> друкує їхні ключі у відсортованому порядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"bg":{"t":"Извеждане на променливи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Извикайте <code>dd<\/code>, за да видите какво има в променлива.<\/span> <span class=\"sg\" data-s=\"1\">Използвате я по същия начин като <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> отпечатва и стойността, и името на променливата:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако променливата има деклариран тип, <code>dd<\/code> показва и него.<\/span> <span class=\"sg\" data-s=\"1\">Сравнете изхода на тази програма с изхода на предишната:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това е основната разлика от <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Едно извикване на <code>dd<\/code> върху скалар ви казва името на променливата.<\/span> <span class=\"sg\" data-s=\"2\">То ви казва и типа на данните, когато той е известен.<\/span> <span class=\"sg\" data-s=\"3\">Така можете да добавите няколко извиквания на <code>dd<\/code> в програмата.<\/span> <span class=\"sg\" data-s=\"4\">Пак ще виждате кой изход на коя променлива принадлежи.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете също да извеждате по-сложни структури от данни, например масиви или хешове.<\/span> <span class=\"sg\" data-s=\"1\">Тогава <code>dd<\/code> отпечатва стойността в кодоподобна форма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Забележете, че вложеният масив се вижда ясно.<\/span> <span class=\"sg\" data-s=\"1\">Но името на променливата не се отпечатва.<\/span> <span class=\"sg\" data-s=\"2\">Същото работи и за хешове, а <code>dd<\/code> отпечатва ключовете им в сортиран ред:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"eo":{"t":"Dumpado de variabloj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Voku <code>dd<\/code> por vidi, kio estas en variablo.<\/span> <span class=\"sg\" data-s=\"1\">Vi uzas ĝin same kiel <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> presas kaj la valoron kaj la nomon de la variablo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se la variablo havas deklaritan tipon, <code>dd<\/code> montras ankaŭ la tipon.<\/span> <span class=\"sg\" data-s=\"1\">Komparu la eligon de ĉi tiu programo kun la antaŭa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jen la ĉefa diferenco de <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unu <code>dd<\/code>-voko sur skalaro diras al vi la nomon de la variablo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ diras al vi la tipon de la datumoj, kiam ĝi estas konata.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas aldoni plurajn <code>dd<\/code>-vokojn al programo.<\/span> <span class=\"sg\" data-s=\"4\">Vi ankoraŭ vidos, kiu eligo apartenas al kiu variablo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi povas ankaŭ elmontri pli kompleksajn datumstrukturojn, ekzemple tabelojn aŭ hakojn.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>dd<\/code> presas la valoron en kodosimila formo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Notu, ke vi klare vidas la nestitan tabelon.<\/span> <span class=\"sg\" data-s=\"1\">Sed la nomo de la variablo ne estas presata.<\/span> <span class=\"sg\" data-s=\"2\">Same funkcias por hakoj, kaj <code>dd<\/code> presas iliajn ŝlosilojn en ordigita ordo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]},"la":{"t":"Variabiles dumping","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Voca <code>dd<\/code> ut videas quid in variabili sit.<\/span> <span class=\"sg\" data-s=\"1\">Eam eodem modo adhibes ac <code>say<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $var = 42;\ndd $var;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>dd<\/code> et valorem et nomen variabilis imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$var = 42<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si variabilis typum declaratum habet, <code>dd<\/code> typum quoque ostendit.<\/span> <span class=\"sg\" data-s=\"1\">Compara output huius programmatis cum priore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my Int $var = 42;\ndd $var;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>Int $var = 42<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec est differentia principalis a <code>say<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Una vocatio <code>dd<\/code> in scalari tibi nomen variabilis dicit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam typum datorum tibi dicit, cum notus est.<\/span> <span class=\"sg\" data-s=\"3\">Itaque plures vocationes <code>dd<\/code> programmati addere potes.<\/span> <span class=\"sg\" data-s=\"4\">Tamen videbis ad quam variabilem quodque output pertineat.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Etiam structuras datorum magis complexas exscribere potes, exempli gratia ordines vel hashes.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>dd<\/code> valorem in forma codici simili imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @arr = 10, 20, [1, 2, 3], 30;\ndd @arr;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>[10, 20, [1, 2, 3], 30]<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nota quod ordinem insertum clare videre potes.<\/span> <span class=\"sg\" data-s=\"1\">Sed nomen variabilis non imprimitur.<\/span> <span class=\"sg\" data-s=\"2\">Idem pro hashes operatur, et <code>dd<\/code> claves eorum ordine alphabetico imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my %hash =\n    gamma =&gt; 'g',\n    alpha =&gt; 'a',\n    beta  =&gt; 'b';\ndd %hash;<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>{:alpha(\"a\"), :beta(\"b\"), :gamma(\"g\")}<\/code><\/pre>"]]}}}</script>
