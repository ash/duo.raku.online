<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/writing-a-trait","n":569,"k":"topic","pv":"advanced/traits-pragmas/built-in-traits/quiz","nx":"advanced/traits-pragmas/pragmas","tr":["advanced","advanced/traits-pragmas"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Writing a trait","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Traits are ordinary multi-subroutines with a special name, so you can write your own.<\/span> <span class=\"sg\" data-s=\"1\">To add a trait called <code>is something<\/code>, define a <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Its parameters say what the trait applies to and give the trait its name:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">This is one of the more advanced parts of Raku.<\/span> <span class=\"sg\" data-s=\"1\">Do not worry if it seems complicated.<\/span> <span class=\"sg\" data-s=\"2\">You can use the built-in traits perfectly well without knowing how they are made.<\/span> <span class=\"sg\" data-s=\"3\">You will rarely need to write one yourself.<\/span> <span class=\"sg\" data-s=\"4\">So take this page as a look at how things work inside.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Read the signature.<\/span> <span class=\"sg\" data-s=\"1\">The first parameter, <code>Routine:D $r<\/code>, is the thing the trait is attached to.<\/span> <span class=\"sg\" data-s=\"2\">Here, it is a subroutine.<\/span> <span class=\"sg\" data-s=\"3\">The <code>:D<\/code> is a type <em>smiley<\/em> that requires a <strong>defined<\/strong> value.<\/span> <span class=\"sg\" data-s=\"4\">This means a real routine object, not the undefined <code>Routine<\/code> type itself.<\/span> <span class=\"sg\" data-s=\"5\">Its partners are <code>:U<\/code>, which requires the undefined type object, and <code>:_<\/code>, which accepts both.<\/span> <span class=\"sg\" data-s=\"6\">The named parameter <code>:$traced!<\/code> is the name of the trait itself.<\/span> <span class=\"sg\" data-s=\"7\">Because this parameter is there, <code>is traced<\/code> calls this sub.<\/span> <span class=\"sg\" data-s=\"8\">Traits run at <strong>compile time<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">So <code>foo<\/code> and <code>bar<\/code> are recorded as soon as they are declared.<\/span> <span class=\"sg\" data-s=\"10\">When the program runs, <code>@traced<\/code> already lists them.<\/span> <span class=\"sg\" data-s=\"11\">You could even move the <code>say @traced<\/code> line above the two <code>sub<\/code> definitions.<\/span> <span class=\"sg\" data-s=\"12\">It would still print <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This small trait only records names, but the same idea can do much more.<\/span> <span class=\"sg\" data-s=\"1\">It can wrap a routine to add logging, check an attribute, or add metadata.<\/span> <span class=\"sg\" data-s=\"2\">The first parameter can also be an <code>Attribute<\/code> or <code>Variable<\/code> instead of a <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Then the trait applies to attributes or variables.<\/span> <span class=\"sg\" data-s=\"4\">Traits are the way Raku keeps its declaration syntax open.<\/span> <span class=\"sg\" data-s=\"5\">The built-in <code>is rw<\/code> and your own <code>is traced<\/code> are made in the same way.<\/span><\/p>"]]},"de":{"t":"Einen Trait schreiben","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Traits sind gewöhnliche Multi-Subroutinen mit einem speziellen Namen, also können Sie eigene schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Um ein Trait namens <code>is something<\/code> hinzuzufügen, definieren Sie ein <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Seine Parameter sagen, worauf das Trait wirkt, und geben ihm seinen Namen:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Das ist einer der fortgeschritteneren Teile von Raku.<\/span> <span class=\"sg\" data-s=\"1\">Machen Sie sich keine Sorgen, wenn es kompliziert wirkt.<\/span> <span class=\"sg\" data-s=\"2\">Sie können die eingebauten Traits sehr gut benutzen, ohne zu wissen, wie sie gemacht sind.<\/span> <span class=\"sg\" data-s=\"3\">Sie werden selten selbst ein Trait schreiben müssen.<\/span> <span class=\"sg\" data-s=\"4\">Sehen Sie diese Seite also als einen Blick darauf, wie die Dinge innen funktionieren.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie die Signatur.<\/span> <span class=\"sg\" data-s=\"1\">Der erste Parameter, <code>Routine:D $r<\/code>, ist das Element, an dem das Trait hängt.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist es eine Subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Das <code>:D<\/code> ist ein Typ-<em>Smiley<\/em>, der einen <strong>definierten<\/strong> Wert verlangt.<\/span> <span class=\"sg\" data-s=\"4\">Das bedeutet ein echtes Routine-Objekt, nicht den undefinierten Typ <code>Routine<\/code> selbst.<\/span> <span class=\"sg\" data-s=\"5\">Seine Partner sind <code>:U<\/code>, das das undefinierte Typ-Objekt verlangt, und <code>:_<\/code>, das beides akzeptiert.<\/span> <span class=\"sg\" data-s=\"6\">Der benannte Parameter <code>:$traced!<\/code> ist der Name des Traits selbst.<\/span> <span class=\"sg\" data-s=\"7\">Weil dieser Parameter da ist, ruft <code>is traced<\/code> diese Sub auf.<\/span> <span class=\"sg\" data-s=\"8\">Traits laufen zur <strong>Kompilierzeit<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Also werden <code>foo<\/code> und <code>bar<\/code> gespeichert, sobald sie deklariert werden.<\/span> <span class=\"sg\" data-s=\"10\">Wenn das Programm läuft, listet <code>@traced<\/code> sie schon auf.<\/span> <span class=\"sg\" data-s=\"11\">Sie könnten die Zeile <code>say @traced<\/code> sogar über die zwei <code>sub<\/code>-Definitionen schieben.<\/span> <span class=\"sg\" data-s=\"12\">Die Zeile würde trotzdem <code>[foo bar]<\/code> ausgeben.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dieses kleine Trait speichert nur Namen, aber die gleiche Idee kann viel mehr.<\/span> <span class=\"sg\" data-s=\"1\">Ein Trait kann eine Routine umhüllen, um Protokollierung hinzuzufügen, ein Attribut prüfen oder Metadaten hinzufügen.<\/span> <span class=\"sg\" data-s=\"2\">Der erste Parameter kann statt einer <code>Routine<\/code> auch ein <code>Attribute<\/code> oder eine <code>Variable<\/code> sein.<\/span> <span class=\"sg\" data-s=\"3\">Dann gilt das Trait für Attribute oder Variablen.<\/span> <span class=\"sg\" data-s=\"4\">Mit Traits hält Raku seine Syntax für Deklarationen offen.<\/span> <span class=\"sg\" data-s=\"5\">Das eingebaute <code>is rw<\/code> und Ihr eigenes <code>is traced<\/code> sind auf die gleiche Weise gemacht.<\/span><\/p>"]]},"nl":{"t":"Een trait schrijven","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Traits zijn gewone multi-subroutines met een speciale naam, dus je kunt er zelf een schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Wil je een trait toevoegen die <code>is something<\/code> heet, definieer dan een <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De parameters zeggen waarop de trait van toepassing is en geven hem zijn naam:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dit is een van de meer gevorderde delen van Raku.<\/span> <span class=\"sg\" data-s=\"1\">Maak je geen zorgen als het ingewikkeld lijkt.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt de ingebouwde traits prima gebruiken zonder te weten hoe ze gemaakt zijn.<\/span> <span class=\"sg\" data-s=\"3\">Je zult er zelden zelf een hoeven te schrijven.<\/span> <span class=\"sg\" data-s=\"4\">Zie deze pagina dus als een kijkje in hoe het van binnen werkt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Lees de signatuur.<\/span> <span class=\"sg\" data-s=\"1\">De eerste parameter, <code>Routine:D $r<\/code>, is datgene waar de trait aan hangt.<\/span> <span class=\"sg\" data-s=\"2\">Hier is dat een subroutine.<\/span> <span class=\"sg\" data-s=\"3\">De <code>:D<\/code> is een type-<em>smiley<\/em> die een <strong>gedefinieerde<\/strong> waarde eist.<\/span> <span class=\"sg\" data-s=\"4\">Dat betekent een echt routineobject, niet het ongedefinieerde type <code>Routine<\/code> zelf.<\/span> <span class=\"sg\" data-s=\"5\">Zijn partners zijn <code>:U<\/code>, die het ongedefinieerde typeobject eist, en <code>:_<\/code>, die allebei accepteert.<\/span> <span class=\"sg\" data-s=\"6\">De benoemde parameter <code>:$traced!<\/code> is de naam van de trait zelf.<\/span> <span class=\"sg\" data-s=\"7\">Omdat deze parameter er is, roept <code>is traced<\/code> deze sub aan.<\/span> <span class=\"sg\" data-s=\"8\">Traits draaien <strong>tijdens het compileren<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Daarom worden <code>foo<\/code> en <code>bar<\/code> vastgelegd zodra ze gedeclareerd worden.<\/span> <span class=\"sg\" data-s=\"10\">Als het programma draait, bevat <code>@traced<\/code> ze al.<\/span> <span class=\"sg\" data-s=\"11\">Je zou de regel <code>say @traced<\/code> zelfs boven de twee <code>sub<\/code>-definities kunnen zetten.<\/span> <span class=\"sg\" data-s=\"12\">Hij zou dan nog steeds <code>[foo bar]<\/code> afdrukken.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Deze kleine trait legt alleen namen vast, maar hetzelfde idee kan veel meer.<\/span> <span class=\"sg\" data-s=\"1\">Hij kan een routine omwikkelen om logging toe te voegen, een attribuut controleren of metadata toevoegen.<\/span> <span class=\"sg\" data-s=\"2\">De eerste parameter kan ook een <code>Attribute<\/code> of <code>Variable<\/code> zijn in plaats van een <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Dan werkt de trait op attributen of variabelen.<\/span> <span class=\"sg\" data-s=\"4\">Met traits houdt Raku zijn syntaxis voor declaraties open.<\/span> <span class=\"sg\" data-s=\"5\">De ingebouwde <code>is rw<\/code> en je eigen <code>is traced<\/code> zijn op dezelfde manier gemaakt.<\/span><\/p>"]]},"es":{"t":"Escribir un trait","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los traits son subrutinas multi normales con un nombre especial, así que puedes escribir los tuyos.<\/span> <span class=\"sg\" data-s=\"1\">Para añadir un trait llamado <code>is something<\/code>, define un <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sus parámetros dicen a qué se aplica el trait y le dan su nombre:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Esta es una de las partes más avanzadas de Raku.<\/span> <span class=\"sg\" data-s=\"1\">No te preocupes si te parece complicada.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usar los traits incorporados perfectamente sin saber cómo están hechos.<\/span> <span class=\"sg\" data-s=\"3\">Pocas veces necesitarás escribir uno tú mismo.<\/span> <span class=\"sg\" data-s=\"4\">Así que toma esta página como una mirada a cómo funcionan las cosas por dentro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Lee la firma.<\/span> <span class=\"sg\" data-s=\"1\">El primer parámetro, <code>Routine:D $r<\/code>, es el elemento al que está asociado el trait.<\/span> <span class=\"sg\" data-s=\"2\">Aquí, es una subrutina.<\/span> <span class=\"sg\" data-s=\"3\">El <code>:D<\/code> es un <em>smiley<\/em> de tipo que exige un valor <strong>definido<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Esto significa un objeto de rutina real, no el propio tipo indefinido <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Sus compañeros son <code>:U<\/code>, que exige el objeto de tipo indefinido, y <code>:_<\/code>, que acepta los dos.<\/span> <span class=\"sg\" data-s=\"6\">El parámetro nombrado <code>:$traced!<\/code> es el nombre del propio trait.<\/span> <span class=\"sg\" data-s=\"7\">Como este parámetro está ahí, <code>is traced<\/code> llama a esta sub.<\/span> <span class=\"sg\" data-s=\"8\">Los traits se ejecutan en <strong>tiempo de compilación<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Así, <code>foo<\/code> y <code>bar<\/code> se registran en cuanto se declaran.<\/span> <span class=\"sg\" data-s=\"10\">Cuando el programa se ejecuta, <code>@traced<\/code> ya los contiene.<\/span> <span class=\"sg\" data-s=\"11\">Incluso podrías mover la línea <code>say @traced<\/code> antes de las dos definiciones <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Seguiría imprimiendo <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Este pequeño trait solo registra nombres, pero la misma idea puede hacer mucho más.<\/span> <span class=\"sg\" data-s=\"1\">Puede envolver una rutina para añadir un registro de eventos, comprobar un atributo o añadir metadatos.<\/span> <span class=\"sg\" data-s=\"2\">El primer parámetro también puede ser un <code>Attribute<\/code> o <code>Variable<\/code> en lugar de un <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Entonces el trait se aplica a atributos o variables.<\/span> <span class=\"sg\" data-s=\"4\">Los traits son la forma en que Raku mantiene abierta su sintaxis de declaraciones.<\/span> <span class=\"sg\" data-s=\"5\">El <code>is rw<\/code> incorporado y tu propio <code>is traced<\/code> están hechos de la misma forma.<\/span><\/p>"]]},"it":{"t":"Scrivere un trait","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">I trait sono normali multi-subroutine con un nome speciale, quindi puoi scrivere i tuoi.<\/span> <span class=\"sg\" data-s=\"1\">Per aggiungere un trait chiamato <code>is something<\/code>, definisci una <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">I suoi parametri dicono a cosa si applica il trait e gli danno il suo nome:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Questa è una delle parti più avanzate di Raku.<\/span> <span class=\"sg\" data-s=\"1\">Non preoccuparti se ti sembra complicata.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usare benissimo i trait integrati senza sapere come sono fatti.<\/span> <span class=\"sg\" data-s=\"3\">Raramente avrai bisogno di scriverne uno tu stesso.<\/span> <span class=\"sg\" data-s=\"4\">Quindi prendi questa pagina come uno sguardo a come funzionano le cose dentro.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Leggi la firma.<\/span> <span class=\"sg\" data-s=\"1\">Il primo parametro, <code>Routine:D $r<\/code>, è la cosa a cui è associato il trait.<\/span> <span class=\"sg\" data-s=\"2\">Qui è una subroutine.<\/span> <span class=\"sg\" data-s=\"3\">Il <code>:D<\/code> è uno <em>smiley<\/em> di tipo che richiede un valore <strong>definito<\/strong>.<\/span> <span class=\"sg\" data-s=\"4\">Significa un vero oggetto routine, non il tipo indefinito <code>Routine<\/code> stesso.<\/span> <span class=\"sg\" data-s=\"5\">I suoi compagni sono <code>:U<\/code>, che richiede l'oggetto tipo indefinito, e <code>:_<\/code>, che accetta entrambi.<\/span> <span class=\"sg\" data-s=\"6\">Il parametro nominato <code>:$traced!<\/code> è il nome del trait stesso.<\/span> <span class=\"sg\" data-s=\"7\">Siccome c'è questo parametro, <code>is traced<\/code> chiama questa sub.<\/span> <span class=\"sg\" data-s=\"8\">I trait vengono eseguiti in <strong>fase di compilazione<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Così <code>foo<\/code> e <code>bar<\/code> vengono registrati appena vengono dichiarati.<\/span> <span class=\"sg\" data-s=\"10\">Quando il programma è in esecuzione, <code>@traced<\/code> li elenca già.<\/span> <span class=\"sg\" data-s=\"11\">Potresti persino spostare la riga <code>say @traced<\/code> sopra le due definizioni <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Stamperebbe comunque <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questo piccolo trait registra solo dei nomi, ma la stessa idea può fare molto di più.<\/span> <span class=\"sg\" data-s=\"1\">Può avvolgere una routine per aggiungere il logging, controllare un attributo o aggiungere metadati.<\/span> <span class=\"sg\" data-s=\"2\">Il primo parametro può anche essere un <code>Attribute<\/code> o una <code>Variable<\/code> invece di una <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Allora il trait si applica ad attributi o variabili.<\/span> <span class=\"sg\" data-s=\"4\">I trait sono il modo in cui Raku tiene aperta la sintassi delle dichiarazioni.<\/span> <span class=\"sg\" data-s=\"5\">Il trait integrato <code>is rw<\/code> e il tuo <code>is traced<\/code> sono fatti nello stesso modo.<\/span><\/p>"]]},"lv":{"t":"Īpašības rakstīšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Īpašības ir parastas multi-apakšprogrammas ar īpašu nosaukumu, tāpēc jūs varat rakstīt savas.<\/span> <span class=\"sg\" data-s=\"1\">Lai pievienotu īpašību ar nosaukumu <code>is kautkas<\/code>, definējiet <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tās parametri norāda, kam īpašība ir piemērojama, un dod tai nosaukumu:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šī ir viena no Raku sarežģītākajām daļām.<\/span> <span class=\"sg\" data-s=\"1\">Neuztraucieties, ja tā šķiet grūta.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat lieliski lietot iebūvētās īpašības, nezinot, kā tās ir veidotas.<\/span> <span class=\"sg\" data-s=\"3\">Jums reti būs pašiem jāraksta sava īpašība.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc uztveriet šo lapu kā ieskatu tajā, kā lietas darbojas iekšpusē.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Izlasiet signatūru.<\/span> <span class=\"sg\" data-s=\"1\">Pirmais parametrs, <code>Routine:D $r<\/code>, ir lieta, kurai īpašība ir pievienota.<\/span> <span class=\"sg\" data-s=\"2\">Šeit tā ir apakšprogramma.<\/span> <span class=\"sg\" data-s=\"3\"><code>:D<\/code> ir tipa <em>smailijs<\/em>, kas pieprasa <strong>definētu<\/strong> vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Tas nozīmē īstu apakšprogrammas objektu, nevis pašu nedefinēto <code>Routine<\/code> tipu.<\/span> <span class=\"sg\" data-s=\"5\">Tā partneri ir <code>:U<\/code>, kas pieprasa nedefinētu tipa objektu, un <code>:_<\/code>, kas pieņem abus.<\/span> <span class=\"sg\" data-s=\"6\">Nosauktais parametrs <code>:$traced!<\/code> ir pašas īpašības nosaukums.<\/span> <span class=\"sg\" data-s=\"7\">Tā kā šis parametrs ir klāt, <code>is traced<\/code> izsauc šo apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"8\">Īpašības izpildās <strong>kompilēšanas laikā<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Tāpēc <code>foo<\/code> un <code>bar<\/code> tiek pierakstītas, tiklīdz tās ir deklarētas.<\/span> <span class=\"sg\" data-s=\"10\">Kad programma darbojas, <code>@traced<\/code> jau satur tās.<\/span> <span class=\"sg\" data-s=\"11\">Jūs pat varētu pārcelt rindu <code>say @traced<\/code> virs abām <code>sub<\/code> definīcijām.<\/span> <span class=\"sg\" data-s=\"12\">Tā joprojām izdrukātu <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šī mazā īpašība tikai pieraksta nosaukumus, bet tā pati ideja var izdarīt daudz vairāk.<\/span> <span class=\"sg\" data-s=\"1\">Tā var ietvert apakšprogrammu, lai pievienotu žurnalēšanu, pārbaudīt atribūtu vai pievienot metadatus.<\/span> <span class=\"sg\" data-s=\"2\">Pirmais parametrs var būt arī <code>Attribute<\/code> vai <code>Variable<\/code>, nevis <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tad īpašība attiecas uz atribūtiem vai mainīgajiem.<\/span> <span class=\"sg\" data-s=\"4\">Ar īpašībām Raku uztur savu deklarāciju sintaksi atvērtu.<\/span> <span class=\"sg\" data-s=\"5\">Iebūvētā <code>is rw<\/code> un jūsu pašu <code>is traced<\/code> ir veidotas vienādi.<\/span><\/p>"]]},"ru":{"t":"Написание трейта","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Типажи — это обычные мультиподпрограммы с особым именем, поэтому вы можете написать собственный.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы добавить типаж с именем <code>is something<\/code>, определите <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Его параметры указывают, к чему применяется типаж, и задают его имя:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Это одна из более сложных частей Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не беспокойтесь, если она кажется запутанной.<\/span> <span class=\"sg\" data-s=\"2\">Вы можете отлично пользоваться встроенными типажами, не зная, как они устроены.<\/span> <span class=\"sg\" data-s=\"3\">Писать собственный типаж вам понадобится редко.<\/span> <span class=\"sg\" data-s=\"4\">Так что считайте эту страницу взглядом на то, как всё устроено внутри.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Прочитайте сигнатуру.<\/span> <span class=\"sg\" data-s=\"1\">Первый параметр, <code>Routine:D $r<\/code>, — это то, к чему прикреплён типаж.<\/span> <span class=\"sg\" data-s=\"2\">Здесь это подпрограмма.<\/span> <span class=\"sg\" data-s=\"3\"><code>:D<\/code> — это типовой <em>смайлик<\/em>, который требует <strong>определённое<\/strong> значение.<\/span> <span class=\"sg\" data-s=\"4\">Имеется в виду настоящий объект подпрограммы, а не сам неопределённый тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Его партнёры — <code>:U<\/code>, который требует неопределённый объект типа, и <code>:_<\/code>, который принимает и то, и другое.<\/span> <span class=\"sg\" data-s=\"6\">Именованный параметр <code>:$traced!<\/code> — это имя самого типажа.<\/span> <span class=\"sg\" data-s=\"7\">Так как этот параметр есть, <code>is traced<\/code> вызывает эту подпрограмму.<\/span> <span class=\"sg\" data-s=\"8\">Типажи выполняются во время <strong>компиляции<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Поэтому <code>foo<\/code> и <code>bar<\/code> записываются сразу, как только их объявили.<\/span> <span class=\"sg\" data-s=\"10\">Когда программа работает, <code>@traced<\/code> уже содержит их.<\/span> <span class=\"sg\" data-s=\"11\">Вы могли бы даже передвинуть строку <code>say @traced<\/code> выше двух определений <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Она всё равно напечатала бы <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Этот маленький типаж только записывает имена, но та же идея может делать гораздо больше.<\/span> <span class=\"sg\" data-s=\"1\">С её помощью можно обернуть подпрограмму, чтобы добавить логирование, проверить атрибут или добавить метаданные.<\/span> <span class=\"sg\" data-s=\"2\">Первым параметром может быть также <code>Attribute<\/code> или <code>Variable<\/code> вместо <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогда типаж применяется к атрибутам или переменным.<\/span> <span class=\"sg\" data-s=\"4\">С помощью типажей Raku оставляет синтаксис объявлений открытым.<\/span> <span class=\"sg\" data-s=\"5\">Встроенный <code>is rw<\/code> и ваш собственный <code>is traced<\/code> сделаны одинаково.<\/span><\/p>"]]},"uk":{"t":"Написання трейта","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Трейти — це звичайні мульти-підпрограми з особливим іменем, тож ви можете написати власний.<\/span> <span class=\"sg\" data-s=\"1\">Щоб додати трейт під назвою <code>is something<\/code>, визначте <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Його параметри кажуть, до чого застосовується трейт, і дають йому ім'я:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Це одна зі складніших частин Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не переймайтеся, якщо вона здається заплутаною.<\/span> <span class=\"sg\" data-s=\"2\">Вбудованими трейтами можна чудово користуватися, не знаючи, як вони зроблені.<\/span> <span class=\"sg\" data-s=\"3\">Писати власний трейт вам доведеться рідко.<\/span> <span class=\"sg\" data-s=\"4\">Тож сприймайте цю сторінку як погляд на те, як усе працює всередині.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Прочитайте сигнатуру.<\/span> <span class=\"sg\" data-s=\"1\">Перший параметр, <code>Routine:D $r<\/code>, — це те, до чого приєднано трейт.<\/span> <span class=\"sg\" data-s=\"2\">Тут це підпрограма.<\/span> <span class=\"sg\" data-s=\"3\"><code>:D<\/code> — це <em>смайлик<\/em> типу, який вимагає <strong>визначеного<\/strong> значення.<\/span> <span class=\"sg\" data-s=\"4\">Це означає справжній об'єкт-підпрограму, а не сам невизначений тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Його партнери — <code>:U<\/code>, що вимагає невизначеного об'єкта типу, і <code>:_<\/code>, що приймає обидва варіанти.<\/span> <span class=\"sg\" data-s=\"6\">Іменований параметр <code>:$traced!<\/code> — це власне ім'я трейта.<\/span> <span class=\"sg\" data-s=\"7\">Оскільки цей параметр є, <code>is traced<\/code> викликає цю підпрограму.<\/span> <span class=\"sg\" data-s=\"8\">Трейти виконуються <strong>під час компіляції<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Тож <code>foo<\/code> і <code>bar<\/code> записуються, щойно їх оголошено.<\/span> <span class=\"sg\" data-s=\"10\">Коли програма запускається, <code>@traced<\/code> уже містить їх.<\/span> <span class=\"sg\" data-s=\"11\">Ви навіть могли б перенести рядок <code>say @traced<\/code> над двома означеннями <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Він однаково вивів би <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Цей маленький трейт лише записує імена, але та сама ідея може робити набагато більше.<\/span> <span class=\"sg\" data-s=\"1\">Вона може обгорнути підпрограму, щоб додати журналювання, перевірити атрибут або додати метадані.<\/span> <span class=\"sg\" data-s=\"2\">Перший параметр може також бути <code>Attribute<\/code> чи <code>Variable<\/code> замість <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тоді трейт застосовується до атрибутів або змінних.<\/span> <span class=\"sg\" data-s=\"4\">Саме за допомогою трейтів Raku тримає синтаксис оголошень відкритим.<\/span> <span class=\"sg\" data-s=\"5\">Вбудований <code>is rw<\/code> і ваш власний <code>is traced<\/code> зроблені однаково.<\/span><\/p>"]]},"bg":{"t":"Писане на трейт","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Трейтовете са обикновени multi-подпрограми със специално име, затова можете да напишете свой.<\/span> <span class=\"sg\" data-s=\"1\">За да добавите трейт с име <code>is something<\/code>, дефинирайте <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Нейните параметри казват към какво се прилага трейтът и му дават име:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Това е една от по-сложните части на Raku.<\/span> <span class=\"sg\" data-s=\"1\">Не се тревожете, ако ви изглежда заплетено.<\/span> <span class=\"sg\" data-s=\"2\">Можете да използвате вградените трейтове напълно добре, без да знаете как са направени.<\/span> <span class=\"sg\" data-s=\"3\">Рядко ще ви се налага сами да пишете трейт.<\/span> <span class=\"sg\" data-s=\"4\">Затова гледайте на тази страница като на поглед към това как работят нещата отвътре.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Прочетете сигнатурата.<\/span> <span class=\"sg\" data-s=\"1\">Първият параметър, <code>Routine:D $r<\/code>, е нещото, към което е прикрепен трейтът.<\/span> <span class=\"sg\" data-s=\"2\">Тук това е подпрограма.<\/span> <span class=\"sg\" data-s=\"3\"><code>:D<\/code> е типов <em>смайли<\/em>, който изисква <strong>дефинирана<\/strong> стойност.<\/span> <span class=\"sg\" data-s=\"4\">Това означава истински обект-подпрограма, а не самия недефиниран тип <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Неговите партньори са <code>:U<\/code>, който изисква недефиниран типов обект, и <code>:_<\/code>, който приема и двата вида.<\/span> <span class=\"sg\" data-s=\"6\">Именуваният параметър <code>:$traced!<\/code> е самото име на трейта.<\/span> <span class=\"sg\" data-s=\"7\">Тъй като този параметър е там, <code>is traced<\/code> извиква тази подпрограма.<\/span> <span class=\"sg\" data-s=\"8\">Трейтовете се изпълняват по <strong>време на компилация<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Затова <code>foo<\/code> и <code>bar<\/code> се записват веднага щом бъдат декларирани.<\/span> <span class=\"sg\" data-s=\"10\">Когато програмата работи, <code>@traced<\/code> вече ги съдържа.<\/span> <span class=\"sg\" data-s=\"11\">Дори бихте могли да преместите реда <code>say @traced<\/code> над двете дефиниции <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Програмата пак би отпечатала <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Този малък трейт само записва имена, но същата идея може да направи много повече.<\/span> <span class=\"sg\" data-s=\"1\">Трейтът може да обвие подпрограма, за да добави логване, да провери атрибут или да добави метаданни.<\/span> <span class=\"sg\" data-s=\"2\">Първият параметър може да бъде и <code>Attribute<\/code> или <code>Variable<\/code> вместо <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тогава трейтът се прилага към атрибути или променливи.<\/span> <span class=\"sg\" data-s=\"4\">Чрез трейтовете Raku пази синтаксиса си за декларации отворен.<\/span> <span class=\"sg\" data-s=\"5\">Вграденият <code>is rw<\/code> и вашият собствен <code>is traced<\/code> са направени по един и същи начин.<\/span><\/p>"]]},"eo":{"t":"Skribi trajton","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Trajtoj estas ordinaraj multi-subrutinoj kun speciala nomo, do vi povas skribi viajn proprajn.<\/span> <span class=\"sg\" data-s=\"1\">Por aldoni trajton nomatan <code>is something<\/code>, difinu <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝiaj parametroj diras, al kio la trajto aplikiĝas, kaj donas al la trajto ĝian nomon:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas unu el la pli progresintaj partoj de Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ne maltrankviliĝu, se ĝi ŝajnas komplika.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi la enkonstruitajn trajtojn tute bone sen scii, kiel ili estas faritaj.<\/span> <span class=\"sg\" data-s=\"3\">Vi malofte bezonos skribi tian mem.<\/span> <span class=\"sg\" data-s=\"4\">Do prenu ĉi tiun paĝon kiel rigardon al tio, kiel la aferoj funkcias interne.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Legu la subskribon.<\/span> <span class=\"sg\" data-s=\"1\">La unua parametro, <code>Routine:D $r<\/code>, estas la aĵo, al kiu la trajto estas alfiksita.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tie, ĝi estas subrutino.<\/span> <span class=\"sg\" data-s=\"3\">La <code>:D<\/code> estas tipa <em>rideto<\/em>, kiu postulas <strong>difinitan<\/strong> valoron.<\/span> <span class=\"sg\" data-s=\"4\">Tio signifas veran rutinan objekton, ne la nedifinitan tipon <code>Routine<\/code> mem.<\/span> <span class=\"sg\" data-s=\"5\">Ĝiaj partneroj estas <code>:U<\/code>, kiu postulas la nedifinitan tipobjekton, kaj <code>:_<\/code>, kiu akceptas ambaŭ.<\/span> <span class=\"sg\" data-s=\"6\">La nomita parametro <code>:$traced!<\/code> estas la nomo de la trajto mem.<\/span> <span class=\"sg\" data-s=\"7\">Ĉar ĉi tiu parametro ĉeestas, <code>is traced<\/code> vokas ĉi tiun subrutinon.<\/span> <span class=\"sg\" data-s=\"8\">Trajtoj ruliĝas dum <strong>kompilado<\/strong>.<\/span> <span class=\"sg\" data-s=\"9\">Do <code>foo<\/code> kaj <code>bar<\/code> estas registritaj, tuj kiam ili estas deklaritaj.<\/span> <span class=\"sg\" data-s=\"10\">Kiam la programo ruliĝas, <code>@traced<\/code> jam listigas ilin.<\/span> <span class=\"sg\" data-s=\"11\">Vi eĉ povus movi la linion <code>say @traced<\/code> antaŭ la du difinojn <code>sub<\/code>.<\/span> <span class=\"sg\" data-s=\"12\">Ĝi ankoraŭ presus <code>[foo bar]<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu malgranda trajto nur registras nomojn, sed la sama ideo povas fari multe pli.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi povas envolvi rutinon por aldoni protokoladon, kontroli atributon aŭ aldoni metadatumojn.<\/span> <span class=\"sg\" data-s=\"2\">La unua parametro ankaŭ povas esti <code>Attribute<\/code> aŭ <code>Variable<\/code> anstataŭ <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tiam la trajto aplikiĝas al atributoj aŭ variabloj.<\/span> <span class=\"sg\" data-s=\"4\">Per trajtoj Raku tenas sian deklaran sintakson malfermita.<\/span> <span class=\"sg\" data-s=\"5\">La enkonstruita <code>is rw<\/code> kaj via propra <code>is traced<\/code> estas faritaj same.<\/span><\/p>"]]},"la":{"t":"Proprietatem scribere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Traits sunt multi-subroutinae ordinariae nomine speciali, itaque tuos scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Ut trait nomine <code>is something<\/code> addas, defini <code>multi sub trait_mod:&lt;is&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Parametra eius dicunt cui rei trait applicetur, et nomen trait dant:<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Haec est una ex partibus altioribus Raku.<\/span> <span class=\"sg\" data-s=\"1\">Noli sollicitari si difficilis videtur.<\/span> <span class=\"sg\" data-s=\"2\">Traits incorporatos optime adhibere potes, etsi nescis quomodo facti sint.<\/span> <span class=\"sg\" data-s=\"3\">Raro unum ipse scribere debebis.<\/span> <span class=\"sg\" data-s=\"4\">Ergo hanc paginam accipe ut aspectum in interiora rerum.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @traced;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$traced!) {\n    @traced.push($r.name);\n}\n\nsub foo() is traced { }\nsub bar() is traced { }\n\nsay @traced; # [foo bar]<\/code><\/pre>"],["p",13,"<p><span class=\"sg\" data-s=\"0\">Lege signaturam.<\/span> <span class=\"sg\" data-s=\"1\">Primum parametrum, <code>Routine:D $r<\/code>, est res cui trait adiunctus est.<\/span> <span class=\"sg\" data-s=\"2\">Hic est subroutina.<\/span> <span class=\"sg\" data-s=\"3\"><code>:D<\/code> est typus <em>smiley<\/em> qui valorem <strong>definitum<\/strong> requirit.<\/span> <span class=\"sg\" data-s=\"4\">Hoc significat obiectum routinae verum, non ipsum typum indefinitum <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Socii eius sunt <code>:U<\/code>, qui obiectum typi indefinitum requirit, et <code>:_<\/code>, qui utrumque accipit.<\/span> <span class=\"sg\" data-s=\"6\">Parametrum nominatum <code>:$traced!<\/code> est nomen ipsius trait.<\/span> <span class=\"sg\" data-s=\"7\">Quia hoc parametrum adest, <code>is traced<\/code> hanc sub vocat.<\/span> <span class=\"sg\" data-s=\"8\">Traits tempore <strong>compilationis<\/strong> currunt.<\/span> <span class=\"sg\" data-s=\"9\">Ergo <code>foo<\/code> et <code>bar<\/code> registrantur statim ut declarantur.<\/span> <span class=\"sg\" data-s=\"10\">Cum programma currit, <code>@traced<\/code> iam eos enumerat.<\/span> <span class=\"sg\" data-s=\"11\">Etiam lineam <code>say @traced<\/code> supra duas definitiones <code>sub<\/code> movere posses.<\/span> <span class=\"sg\" data-s=\"12\">Adhuc <code>[foo bar]<\/code> imprimeret.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic parvus trait tantum nomina registrat, sed eadem idea multo plus facere potest.<\/span> <span class=\"sg\" data-s=\"1\">Routinam involvere potest ut logificationem addat, attributum probare, vel metadata addere.<\/span> <span class=\"sg\" data-s=\"2\">Primum parametrum etiam <code>Attribute<\/code> vel <code>Variable<\/code> esse potest loco <code>Routine<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tum trait attributis vel variabilibus applicatur.<\/span> <span class=\"sg\" data-s=\"4\">Per traits Raku syntaxin declarationum suam apertam servat.<\/span> <span class=\"sg\" data-s=\"5\">Trait incorporatus <code>is rw<\/code> et tuus <code>is traced<\/code> eodem modo facti sunt.<\/span><\/p>"]]}}}</script>
