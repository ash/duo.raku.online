<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/pragmas","n":570,"k":"topic","pv":"advanced/traits-pragmas/writing-a-trait","nx":"advanced/traits-pragmas/pragmas/quiz","tr":["advanced","advanced/traits-pragmas"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Pragmas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>pragma<\/em> looks like a module that you load with <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But it does not bring in any code.<\/span> <span class=\"sg\" data-s=\"2\">Instead, it changes a compilation rule for the rest of the current scope.<\/span> <span class=\"sg\" data-s=\"3\">You turn it on with <code>use<\/code>, and, where it makes sense, off with <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The most important pragma, <code>strict<\/code>, is <strong>on by default<\/strong> in Raku.<\/span> <span class=\"sg\" data-s=\"1\">It requires you to declare every variable before you use it.<\/span> <span class=\"sg\" data-s=\"2\">This is why Raku catches a typo in a variable name.<\/span> <span class=\"sg\" data-s=\"3\">Without it, the typo would silently create a new variable.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you turn <code>strict<\/code> off with <code>no strict<\/code>, this rule no longer applies.<\/span> <span class=\"sg\" data-s=\"1\">Then you can assign to a variable that was never declared with <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">With the default <code>strict<\/code>, this bare <code>$x = 42<\/code> would be a compile-time error.<\/span> <span class=\"sg\" data-s=\"1\">The message is <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">The <code>no strict<\/code> line relaxes the rule until the end of the scope around it.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Some other pragmas are <code>fatal<\/code>, <code>isms<\/code> and <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> turns a quiet failure into a thrown exception.<\/span> <span class=\"sg\" data-s=\"2\">This is useful once you know how to handle exceptions.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> allows ways of writing that come from other languages.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> lets you adjust the rules for variables.<\/span> <span class=\"sg\" data-s=\"5\">The effect of a pragma is <em>lexical<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">It lasts only until the end of the block where it appears.<\/span> <span class=\"sg\" data-s=\"7\">So you can make a rule stricter or looser.<\/span> <span class=\"sg\" data-s=\"8\">You can do this in exactly the part of code where you need it.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">One pragma takes an argument: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It adds a directory to the list that Raku searches when it loads modules.<\/span> <span class=\"sg\" data-s=\"2\">It does the same as the <code>-I<\/code> command-line option, but inside the program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You will start using it when you begin to write and load your own <a href=\"/advanced/modules-basics/using-modules/\">modules<\/a>.<\/span><\/p>"]]},"de":{"t":"Pragmas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Pragma<\/em> sieht aus wie ein Modul, das Sie mit <code>use<\/code> laden.<\/span> <span class=\"sg\" data-s=\"1\">Aber es bringt keinen Code mit.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen ändert es eine Regel der Kompilierung für den Rest des aktuellen Gültigkeitsbereichs.<\/span> <span class=\"sg\" data-s=\"3\">Sie schalten es mit <code>use<\/code> ein und, wo es sinnvoll ist, mit <code>no<\/code> aus.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das wichtigste Pragma, <code>strict<\/code>, ist in Raku <strong>standardmäßig eingeschaltet<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Es verlangt, dass Sie jede Variable deklarieren, bevor Sie sie benutzen.<\/span> <span class=\"sg\" data-s=\"2\">Darum findet Raku einen Tippfehler in einem Variablennamen.<\/span> <span class=\"sg\" data-s=\"3\">Ohne das Pragma würde der Tippfehler still eine neue Variable erzeugen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>strict<\/code> mit <code>no strict<\/code> ausschalten, gilt diese Regel nicht mehr.<\/span> <span class=\"sg\" data-s=\"1\">Dann können Sie einer Variablen etwas zuweisen, die nie mit <code>my<\/code> deklariert wurde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mit dem standardmäßigen <code>strict<\/code> wäre dieses bloße <code>$x = 42<\/code> ein Fehler zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Die Meldung ist <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Die Zeile <code>no strict<\/code> lockert die Regel bis zum Ende des Gültigkeitsbereichs um sie herum.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Einige andere Pragmas sind <code>fatal<\/code>, <code>isms<\/code> und <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> macht aus einem stillen Fehler eine geworfene Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Das ist nützlich, sobald Sie wissen, wie man Ausnahmen behandelt.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> erlaubt Schreibweisen, die aus anderen Sprachen kommen.<\/span> <span class=\"sg\" data-s=\"4\">Mit <code>variables<\/code> können Sie die Regeln für Variablen anpassen.<\/span> <span class=\"sg\" data-s=\"5\">Die Wirkung eines Pragmas ist <em>lexikalisch<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Sie gilt nur bis zum Ende des Blocks, in dem es steht.<\/span> <span class=\"sg\" data-s=\"7\">So können Sie eine Regel strenger oder lockerer machen.<\/span> <span class=\"sg\" data-s=\"8\">Das können Sie genau in dem Teil des Codes tun, wo Sie es brauchen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Pragma nimmt ein Argument: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es fügt ein Verzeichnis zu der Liste hinzu, die Raku durchsucht, wenn es Module lädt.<\/span> <span class=\"sg\" data-s=\"2\">Es macht dasselbe wie die Kommandozeilenoption <code>-I<\/code>, aber im Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie werden es benutzen, sobald Sie anfangen, eigene <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">Module<\/a> zu schreiben und zu laden.<\/span><\/p>"]]},"nl":{"t":"Pragma's","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>pragma<\/em> lijkt op een module die je met <code>use<\/code> laadt.<\/span> <span class=\"sg\" data-s=\"1\">Maar het haalt geen code binnen.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan verandert het een compilatieregel voor de rest van het huidige bereik.<\/span> <span class=\"sg\" data-s=\"3\">Je zet het aan met <code>use<\/code>, en, waar dat zin heeft, uit met <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het belangrijkste pragma, <code>strict<\/code>, staat in Raku <strong>standaard aan<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Het eist dat je elke variabele declareert voordat je hem gebruikt.<\/span> <span class=\"sg\" data-s=\"2\">Daarom merkt Raku een typefout in een variabelenaam op.<\/span> <span class=\"sg\" data-s=\"3\">Zonder dit pragma zou de typefout stilletjes een nieuwe variabele aanmaken.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je <code>strict<\/code> uitzet met <code>no strict<\/code>, geldt deze regel niet meer.<\/span> <span class=\"sg\" data-s=\"1\">Dan kun je toekennen aan een variabele die nooit met <code>my<\/code> gedeclareerd is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Met het standaard <code>strict<\/code> zou deze kale <code>$x = 42<\/code> een compilatiefout zijn.<\/span> <span class=\"sg\" data-s=\"1\">De melding is <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">De regel <code>no strict<\/code> maakt de eis minder streng, tot het einde van het bereik eromheen.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Andere pragma's zijn bijvoorbeeld <code>fatal<\/code>, <code>isms<\/code> en <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> maakt van een stille mislukking een geworpen exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Dat is handig zodra je weet hoe je excepties afhandelt.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> staat schrijfwijzen toe die uit andere talen komen.<\/span> <span class=\"sg\" data-s=\"4\">Met <code>variables<\/code> kun je de regels voor variabelen aanpassen.<\/span> <span class=\"sg\" data-s=\"5\">De werking van een pragma is <em>lexicaal<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ze duurt alleen tot het einde van het blok waarin het pragma staat.<\/span> <span class=\"sg\" data-s=\"7\">Zo kun je een regel strenger of losser maken.<\/span> <span class=\"sg\" data-s=\"8\">Dat kan precies in het stuk code waar je het nodig hebt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eén pragma neemt een argument: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het voegt een map toe aan de lijst die Raku doorzoekt als het modules laadt.<\/span> <span class=\"sg\" data-s=\"2\">Het doet hetzelfde als de opdrachtregeloptie <code>-I<\/code>, maar dan binnen het programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je gaat het gebruiken zodra je je eigen <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modules<\/a> begint te schrijven en te laden.<\/span><\/p>"]]},"es":{"t":"Pragmas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una <em>pragma<\/em> se parece a un módulo que cargas con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero no trae ningún código.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, cambia una regla de compilación para el resto del ámbito actual.<\/span> <span class=\"sg\" data-s=\"3\">La activas con <code>use<\/code> y, cuando tiene sentido, la desactivas con <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La pragma más importante, <code>strict<\/code>, está <strong>activada por defecto<\/strong> en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Te obliga a declarar cada variable antes de usarla.<\/span> <span class=\"sg\" data-s=\"2\">Por eso Raku detecta un error de escritura en el nombre de una variable.<\/span> <span class=\"sg\" data-s=\"3\">Sin ella, el error crearía en silencio una variable nueva.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si desactivas <code>strict<\/code> con <code>no strict<\/code>, esta regla ya no se aplica.<\/span> <span class=\"sg\" data-s=\"1\">Entonces puedes asignar un valor a una variable que nunca se declaró con <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con la pragma <code>strict<\/code> por defecto, este <code>$x = 42<\/code> sin declarar sería un error en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">El mensaje es <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La línea <code>no strict<\/code> relaja la regla hasta el final del ámbito que la contiene.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Algunas otras pragmas son <code>fatal<\/code>, <code>isms<\/code> y <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> convierte un fallo silencioso en una excepción lanzada.<\/span> <span class=\"sg\" data-s=\"2\">Esto es útil cuando ya sabes manejar excepciones.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permite formas de escribir que vienen de otros lenguajes.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> te permite ajustar las reglas para las variables.<\/span> <span class=\"sg\" data-s=\"5\">El efecto de una pragma es <em>léxico<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Dura solo hasta el final del bloque donde aparece.<\/span> <span class=\"sg\" data-s=\"7\">Así, puedes hacer una regla más estricta o más flexible.<\/span> <span class=\"sg\" data-s=\"8\">Puedes hacerlo justo en la parte del código donde lo necesitas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una pragma recibe un argumento: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Añade un directorio a la lista donde Raku busca cuando carga módulos.<\/span> <span class=\"sg\" data-s=\"2\">Hace lo mismo que la opción <code>-I<\/code> de la línea de comandos, pero dentro del programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La empezarás a usar cuando comiences a escribir y cargar tus propios <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">módulos<\/a>.<\/span><\/p>"]]},"it":{"t":"Pragma","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>pragma<\/em> sembra un modulo che carichi con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma non importa nessun codice.<\/span> <span class=\"sg\" data-s=\"2\">Invece, cambia una regola di compilazione per il resto dello scope attuale.<\/span> <span class=\"sg\" data-s=\"3\">Lo attivi con <code>use<\/code> e, dove ha senso, lo disattivi con <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il pragma più importante, <code>strict<\/code>, è <strong>attivo di default<\/strong> in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ti chiede di dichiarare ogni variabile prima di usarla.<\/span> <span class=\"sg\" data-s=\"2\">Per questo Raku trova un errore di battitura nel nome di una variabile.<\/span> <span class=\"sg\" data-s=\"3\">Senza questo pragma, l'errore creerebbe in silenzio una nuova variabile.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se disattivi <code>strict<\/code> con <code>no strict<\/code>, questa regola non vale più.<\/span> <span class=\"sg\" data-s=\"1\">Allora puoi assegnare un valore a una variabile mai dichiarata con <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Con il <code>strict<\/code> predefinito, questo semplice <code>$x = 42<\/code> sarebbe un errore di compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Il messaggio è <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La riga <code>no strict<\/code> allenta la regola fino alla fine dello scope che la contiene.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Alcuni altri pragma sono <code>fatal<\/code>, <code>isms<\/code> e <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> trasforma un fallimento silenzioso in un'eccezione lanciata.<\/span> <span class=\"sg\" data-s=\"2\">Questo è utile quando sai già gestire le eccezioni.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permette modi di scrivere che vengono da altri linguaggi.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> ti permette di adattare le regole per le variabili.<\/span> <span class=\"sg\" data-s=\"5\">L'effetto di un pragma è <em>lessicale<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Dura solo fino alla fine del blocco in cui compare.<\/span> <span class=\"sg\" data-s=\"7\">Così puoi rendere una regola più severa o più libera.<\/span> <span class=\"sg\" data-s=\"8\">Puoi farlo esattamente nella parte di codice dove ti serve.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un pragma prende un argomento: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge una directory alla lista in cui Raku cerca quando carica i moduli.<\/span> <span class=\"sg\" data-s=\"2\">Fa la stessa cosa dell'opzione <code>-I<\/code> della riga di comando, ma dentro il programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Comincerai a usarlo quando inizierai a scrivere e caricare i tuoi <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduli<\/a>.<\/span><\/p>"]]},"lv":{"t":"Pragmas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> izskatās kā modulis, ko ielādē ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet tā neienes nekādu kodu.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tā maina kādu kompilēšanas noteikumu pārējā pašreizējā tvērumā.<\/span> <span class=\"sg\" data-s=\"3\">Jūs to ieslēdzat ar <code>use<\/code> un, kur tas ir jēgpilni, izslēdzat ar <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vissvarīgākā pragma, <code>strict<\/code>, Raku valodā ir <strong>ieslēgta pēc noklusējuma<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Tā pieprasa, lai jūs deklarētu katru mainīgo pirms lietošanas.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc Raku pamana drukas kļūdu mainīgā nosaukumā.<\/span> <span class=\"sg\" data-s=\"3\">Bez tās drukas kļūda klusi izveidotu jaunu mainīgo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja izslēdzat <code>strict<\/code> ar <code>no strict<\/code>, šis noteikums vairs nav spēkā.<\/span> <span class=\"sg\" data-s=\"1\">Tad jūs varat piešķirt vērtību mainīgajam, kas nekad nav deklarēts ar <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ar noklusēto <code>strict<\/code> šis <code>$x = 42<\/code> bez deklarācijas būtu kompilēšanas laika kļūda.<\/span> <span class=\"sg\" data-s=\"1\">Ziņojums ir <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Rinda <code>no strict<\/code> atvieglo noteikumu līdz tā tvēruma beigām, kurā tā atrodas.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dažas citas pragmas ir <code>fatal<\/code>, <code>isms<\/code> un <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> pārvērš klusu kļūdu par izmestu izņēmumu.<\/span> <span class=\"sg\" data-s=\"2\">Tas noder, kad jūs jau protat apstrādāt izņēmumus.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> atļauj rakstības veidus, kas nāk no citām valodām.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> ļauj pielāgot mainīgo noteikumus.<\/span> <span class=\"sg\" data-s=\"5\">Pragmas iedarbība ir <em>leksiska<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Tā ilgst tikai līdz tā bloka beigām, kurā tā atrodas.<\/span> <span class=\"sg\" data-s=\"7\">Tāpēc jūs varat padarīt noteikumu stingrāku vai brīvāku.<\/span> <span class=\"sg\" data-s=\"8\">To var darīt tieši tajā koda daļā, kur tas jums vajadzīgs.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Viena pragma pieņem argumentu: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā pievieno direktoriju sarakstam, kurā Raku meklē, kad ielādē moduļus.<\/span> <span class=\"sg\" data-s=\"2\">Tā dara to pašu, ko komandrindas opcija <code>-I<\/code>, bet programmas iekšienē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs sāksiet to lietot, kad sāksiet rakstīt un ielādēt savus <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">moduļus<\/a>.<\/span><\/p>"]]},"ru":{"t":"Прагмы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> выглядит как модуль, который вы загружаете с помощью <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но она не подключает никакого кода.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого она меняет правило компиляции для остальной части текущей области видимости.<\/span> <span class=\"sg\" data-s=\"3\">Её включают с помощью <code>use<\/code>, а там, где это имеет смысл, выключают с помощью <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Самая важная прагма, <code>strict<\/code>, в Raku <strong>включена по умолчанию<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Она требует, чтобы вы объявляли каждую переменную перед использованием.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому Raku замечает опечатку в имени переменной.<\/span> <span class=\"sg\" data-s=\"3\">Без неё опечатка молча создала бы новую переменную.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если выключить <code>strict<\/code> с помощью <code>no strict<\/code>, это правило больше не действует.<\/span> <span class=\"sg\" data-s=\"1\">Тогда можно присвоить значение переменной, которая никогда не была объявлена с <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">С включённой по умолчанию <code>strict<\/code> такое <code>$x = 42<\/code> без объявления было бы ошибкой компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Сообщение такое: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Строка <code>no strict<\/code> ослабляет правило до конца окружающей области видимости.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Другие прагмы — это <code>fatal<\/code>, <code>isms<\/code> и <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> превращает тихую ошибку в выброшенное исключение.<\/span> <span class=\"sg\" data-s=\"2\">Это полезно, когда вы уже знаете, как обрабатывать исключения.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> разрешает способы записи, которые пришли из других языков.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> позволяет настраивать правила для переменных.<\/span> <span class=\"sg\" data-s=\"5\">Действие прагмы <em>лексическое<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Оно длится только до конца блока, в котором она стоит.<\/span> <span class=\"sg\" data-s=\"7\">Поэтому правило можно сделать строже или мягче.<\/span> <span class=\"sg\" data-s=\"8\">Это можно сделать именно в той части кода, где это нужно.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна прагма принимает аргумент: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Она добавляет каталог в список, в котором Raku ищет модули при загрузке.<\/span> <span class=\"sg\" data-s=\"2\">Она делает то же самое, что параметр командной строки <code>-I<\/code>, но внутри программы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы начнёте её использовать, когда станете писать и загружать собственные <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"uk":{"t":"Прагми","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Прагма<\/em> схожа на модуль, який ви завантажуєте через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але вона не приносить жодного коду.<\/span> <span class=\"sg\" data-s=\"2\">Натомість вона змінює правило компіляції до кінця поточної області видимості.<\/span> <span class=\"sg\" data-s=\"3\">Ви вмикаєте її через <code>use<\/code>, а вимикаєте, де це має сенс, через <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Найважливіша прагма, <code>strict<\/code>, у Raku <strong>увімкнена за замовчуванням<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Вона вимагає, щоб ви оголошували кожну змінну перед використанням.<\/span> <span class=\"sg\" data-s=\"2\">Ось чому Raku ловить одрук в імені змінної.<\/span> <span class=\"sg\" data-s=\"3\">Без неї одрук мовчки створив би нову змінну.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо вимкнути <code>strict<\/code> через <code>no strict<\/code>, це правило більше не діє.<\/span> <span class=\"sg\" data-s=\"1\">Тоді можна присвоїти значення змінній, яку ніколи не оголошували через <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">З типовою <code>strict<\/code> цей <code>$x = 42<\/code> без оголошення був би помилкою під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Повідомлення таке: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Рядок <code>no strict<\/code> послаблює правило до кінця області видимості навколо нього.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ось ще кілька прагм: <code>fatal<\/code>, <code>isms<\/code> і <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> перетворює тихий збій на кинутий виняток.<\/span> <span class=\"sg\" data-s=\"2\">Це корисно, коли ви вже знаєте, як обробляти винятки.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> дозволяє способи писати, які прийшли з інших мов.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> дає змогу налаштувати правила для змінних.<\/span> <span class=\"sg\" data-s=\"5\">Дія прагми <em>лексична<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Вона триває лише до кінця блоку, у якому з'явилася.<\/span> <span class=\"sg\" data-s=\"7\">Тож ви можете зробити правило суворішим або м'якшим.<\/span> <span class=\"sg\" data-s=\"8\">Ви можете зробити це саме в тій частині коду, де вам треба.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Одна прагма приймає аргумент: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вона додає каталог до списку, у якому Raku шукає модулі, коли їх завантажує.<\/span> <span class=\"sg\" data-s=\"2\">Вона робить те саме, що опція командного рядка <code>-I<\/code>, але всередині програми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви почнете користуватися нею, коли почнете писати й завантажувати власні <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модулі<\/a>.<\/span><\/p>"]]},"bg":{"t":"Прагми","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Прагмата<\/em> прилича на модул, който зареждате с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но тя не внася никакъв код.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това тя променя правило за компилация за останалата част от текущия обхват.<\/span> <span class=\"sg\" data-s=\"3\">Включвате я с <code>use<\/code>, а където има смисъл, я изключвате с <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Най-важната прагма, <code>strict<\/code>, е <strong>включена по подразбиране<\/strong> в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Тя изисква да декларирате всяка променлива, преди да я използвате.<\/span> <span class=\"sg\" data-s=\"2\">Затова Raku улавя правописна грешка в името на променлива.<\/span> <span class=\"sg\" data-s=\"3\">Без нея грешката тихо би създала нова променлива.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако изключите <code>strict<\/code> с <code>no strict<\/code>, това правило вече не важи.<\/span> <span class=\"sg\" data-s=\"1\">Тогава можете да присвоявате на променлива, която никога не е декларирана с <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Със <code>strict<\/code> по подразбиране това голо <code>$x = 42<\/code> би било грешка при компилация.<\/span> <span class=\"sg\" data-s=\"1\">Съобщението е <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Редът <code>no strict<\/code> отслабва правилото до края на обхвата около него.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Някои други прагми са <code>fatal<\/code>, <code>isms<\/code> и <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> превръща тихия неуспех в хвърлено изключение.<\/span> <span class=\"sg\" data-s=\"2\">Това е полезно, когато вече знаете как да обработвате изключения.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> позволява начини на писане, които идват от други езици.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> ви позволява да настроите правилата за променливите.<\/span> <span class=\"sg\" data-s=\"5\">Ефектът на прагмата е <em>лексикален<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Той важи само до края на блока, в който се появява.<\/span> <span class=\"sg\" data-s=\"7\">Така можете да направите правило по-строго или по-свободно.<\/span> <span class=\"sg\" data-s=\"8\">Можете да направите това точно в частта от кода, където ви трябва.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Една прагма приема аргумент: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тя добавя директория към списъка, в който Raku търси, когато зарежда модули.<\/span> <span class=\"sg\" data-s=\"2\">Тя прави същото като опцията <code>-I<\/code> от командния ред, но вътре в програмата:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще започнете да я използвате, когато започнете да пишете и зареждате собствени <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">модули<\/a>.<\/span><\/p>"]]},"eo":{"t":"Pragmoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Pragmo<\/em> aspektas kiel modulo, kiun vi ŝargas per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi ne enportas iun ajn kodon.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĝi ŝanĝas kompilan regulon por la resto de la nuna amplekso.<\/span> <span class=\"sg\" data-s=\"3\">Vi ŝaltas ĝin per <code>use<\/code>, kaj, kie tio havas sencon, malŝaltas per <code>no<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La plej grava pragmo, <code>strict<\/code>, estas <strong>ŝaltita defaŭlte<\/strong> en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi postulas, ke vi deklaru ĉiun variablon, antaŭ ol vi uzas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tial Raku kaptas tajperaron en nomo de variablo.<\/span> <span class=\"sg\" data-s=\"3\">Sen ĝi, la tajperaro silente kreus novan variablon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi malŝaltas <code>strict<\/code> per <code>no strict<\/code>, ĉi tiu regulo ne plu validas.<\/span> <span class=\"sg\" data-s=\"1\">Tiam vi povas atribui al variablo, kiu neniam estis deklarita per <code>my<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kun la defaŭlta <code>strict<\/code>, ĉi tiu nuda <code>$x = 42<\/code> estus kompiltempa eraro.<\/span> <span class=\"sg\" data-s=\"1\">La mesaĝo estas <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La linio <code>no strict<\/code> malstreĉas la regulon ĝis la fino de la amplekso ĉirkaŭ ĝi.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Kelkaj aliaj pragmoj estas <code>fatal<\/code>, <code>isms<\/code> kaj <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> transformas kvietan malsukceson en ĵetitan escepton.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas utila, kiam vi jam scias trakti esceptojn.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> permesas manierojn de skribado, kiuj venas el aliaj lingvoj.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> permesas al vi agordi la regulojn por variabloj.<\/span> <span class=\"sg\" data-s=\"5\">La efiko de pragmo estas <em>leksika<\/em>.<\/span> <span class=\"sg\" data-s=\"6\">Ĝi daŭras nur ĝis la fino de la bloko, kie ĝi aperas.<\/span> <span class=\"sg\" data-s=\"7\">Do vi povas fari regulon pli strikta aŭ pli malstrikta.<\/span> <span class=\"sg\" data-s=\"8\">Vi povas fari tion ĝuste en tiu parto de la kodo, kie vi bezonas ĝin.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unu pragmo prenas argumenton: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas dosierujon al la listo, kiun Raku traserĉas, kiam ĝi ŝargas modulojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi faras la samon kiel la komandlinia opcio <code>-I<\/code>, sed ene de la programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi komencos uzi ĝin, kiam vi komencos skribi kaj ŝargi viajn proprajn <a href=\"https://course.raku.org/eo/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modulojn<\/a>.<\/span><\/p>"]]},"la":{"t":"Pragmata","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Pragma<\/em> simile videtur modulo quem cum <code>use<\/code> oneras.<\/span> <span class=\"sg\" data-s=\"1\">Sed nullum codicem importat.<\/span> <span class=\"sg\" data-s=\"2\">Potius regulam compilationis pro reliquo ambitu currenti mutat.<\/span> <span class=\"sg\" data-s=\"3\">Id cum <code>use<\/code> activas, et, ubi sensum habet, cum <code>no<\/code> deactivas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pragma gravissimum, <code>strict<\/code>, in Raku <strong>ex defectu activum<\/strong> est.<\/span> <span class=\"sg\" data-s=\"1\">Requirit ut omnem variabilem declares antequam eam adhibes.<\/span> <span class=\"sg\" data-s=\"2\">Ideo Raku errorem scribendi in nomine variabilis deprehendit.<\/span> <span class=\"sg\" data-s=\"3\">Sine eo, error tacite novam variabilem crearet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si <code>strict<\/code> cum <code>no strict<\/code> deactivas, haec regula iam non valet.<\/span> <span class=\"sg\" data-s=\"1\">Tum variabili assignare potes quae numquam cum <code>my<\/code> declarata est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$x = 42;\nsay $x; # 42<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum <code>strict<\/code> ex defectu, hoc nudum <code>$x = 42<\/code> error tempore compilationis esset.<\/span> <span class=\"sg\" data-s=\"1\">Nuntius est <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Linea <code>no strict<\/code> regulam relaxat usque ad finem ambitus circum eam.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Quaedam alia pragmata sunt <code>fatal<\/code>, <code>isms<\/code> et <code>variables<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>fatal<\/code> defectum quietum in exceptionem iactam convertit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc utile est cum iam scis exceptiones tractare.<\/span> <span class=\"sg\" data-s=\"3\"><code>isms<\/code> modos scribendi permittit qui ex aliis linguis veniunt.<\/span> <span class=\"sg\" data-s=\"4\"><code>variables<\/code> tibi permittit regulas variabilium moderari.<\/span> <span class=\"sg\" data-s=\"5\">Effectus pragmatis <em>lexicalis<\/em> est.<\/span> <span class=\"sg\" data-s=\"6\">Tantum usque ad finem blocki durat ubi apparet.<\/span> <span class=\"sg\" data-s=\"7\">Ergo regulam severiorem vel laxiorem facere potes.<\/span> <span class=\"sg\" data-s=\"8\">Hoc facere potes in ipsa parte codicis ubi eam requiris.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Unum pragma argumentum accipit: <code>lib<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Directorium addit ad indicem in quo Raku quaerit cum modulos onerat.<\/span> <span class=\"sg\" data-s=\"2\">Idem facit ac optio lineae mandatorum <code>-I<\/code>, sed intra programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use lib 'lib';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eo uti incipies cum tuos proprios <a href=\"https://course.raku.org/la/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">modulos<\/a> scribere et onerare incipies.<\/span><\/p>"]]}}}</script>
