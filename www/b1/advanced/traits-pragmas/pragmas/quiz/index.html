<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/pragmas/quiz","n":571,"k":"quiz","pv":"advanced/traits-pragmas/pragmas","nx":"advanced/traits-pragmas/exercises","tr":["advanced","advanced/traits-pragmas","advanced/traits-pragmas/pragmas"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku’s <code>strict<\/code> pragma is on by default.<\/span> <span class=\"sg\" data-s=\"1\">What happens if you assign to a variable that you never declared, as in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">It is a compile-time error<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">It silently creates <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">It prints a warning but runs<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">It sets <code>$x<\/code> to <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> is on by default.<\/span> <span class=\"sg\" data-s=\"1\">It requires you to declare every variable with <code>my<\/code> first.<\/span> <span class=\"sg\" data-s=\"2\">So <code>$x = 42<\/code> without <code>my<\/code> does not compile.<\/span> <span class=\"sg\" data-s=\"3\">The error is <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">If you turn the pragma off with <code>no strict<\/code>, the assignment works.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>strict<\/code>-Pragma von Raku ist standardmäßig eingeschaltet.<\/span> <span class=\"sg\" data-s=\"1\">Was passiert, wenn Sie einer Variablen etwas zuweisen, die Sie nie deklariert haben, wie in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Es ist ein Kompilierzeitfehler<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Es erzeugt stillschweigend <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Es gibt eine Warnung aus, läuft aber<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Es setzt <code>$x<\/code> auf <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ist standardmäßig eingeschaltet.<\/span> <span class=\"sg\" data-s=\"1\">Es verlangt, dass Sie jede Variable zuerst mit <code>my<\/code> deklarieren.<\/span> <span class=\"sg\" data-s=\"2\">Also lässt sich <code>$x = 42<\/code> ohne <code>my<\/code> nicht kompilieren.<\/span> <span class=\"sg\" data-s=\"3\">Der Fehler ist <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Sie das Pragma mit <code>no strict<\/code> ausschalten, funktioniert die Zuweisung.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Pragma's","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku's pragma <code>strict<\/code> staat standaard aan.<\/span> <span class=\"sg\" data-s=\"1\">Wat gebeurt er als je toekent aan een variabele die je nooit hebt gedeclareerd, zoals in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Het is een compilatiefout<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Het maakt stilzwijgend <code>$x<\/code> aan<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Het drukt een waarschuwing af maar draait<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Het zet <code>$x<\/code> op <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> staat standaard aan.<\/span> <span class=\"sg\" data-s=\"1\">Het eist dat je elke variabele eerst met <code>my<\/code> declareert.<\/span> <span class=\"sg\" data-s=\"2\"><code>$x = 42<\/code> zonder <code>my<\/code> compileert dus niet.<\/span> <span class=\"sg\" data-s=\"3\">De fout is <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Als je het pragma uitzet met <code>no strict<\/code>, werkt de toekenning wel.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La pragma <code>strict<\/code> de Raku está activada por defecto.<\/span> <span class=\"sg\" data-s=\"1\">¿Qué pasa si asignas un valor a una variable que nunca declaraste, como en <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Es un error en tiempo de compilación<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Crea <code>$x<\/code> silenciosamente<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Imprime una advertencia pero se ejecuta<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Establece <code>$x<\/code> en <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> está activada por defecto.<\/span> <span class=\"sg\" data-s=\"1\">Te obliga a declarar primero cada variable con <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así, <code>$x = 42<\/code> sin <code>my<\/code> no compila.<\/span> <span class=\"sg\" data-s=\"3\">El error es <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Si desactivas la pragma con <code>no strict<\/code>, la asignación funciona.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Pragma","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Il pragma <code>strict<\/code> di Raku è attivo di default.<\/span> <span class=\"sg\" data-s=\"1\">Cosa succede se assegni un valore a una variabile che non hai mai dichiarato, come in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">È un errore di compilazione<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Crea silenziosamente <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Stampa un avviso ma viene eseguito<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Imposta <code>$x<\/code> a <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> è attivo di default.<\/span> <span class=\"sg\" data-s=\"1\">Ti chiede di dichiarare prima ogni variabile con <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>$x = 42<\/code> senza <code>my<\/code> non si compila.<\/span> <span class=\"sg\" data-s=\"3\">L'errore è <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Se disattivi il pragma con <code>no strict<\/code>, l'assegnazione funziona.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Pragmas","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku pragma <code>strict<\/code> ir ieslēgta pēc noklusējuma.<\/span> <span class=\"sg\" data-s=\"1\">Kas notiek, ja piešķirat vērtību mainīgajam, kuru nekad neesat deklarējuši, kā <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Tā ir kompilēšanas laika kļūda<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Tas klusi izveido <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Tas izdrukā brīdinājumu, bet izpildās<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Tas iestata <code>$x<\/code> uz <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ir ieslēgta pēc noklusējuma.<\/span> <span class=\"sg\" data-s=\"1\">Tā pieprasa, lai jūs vispirms deklarētu katru mainīgo ar <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>$x = 42<\/code> bez <code>my<\/code> nekompilējas.<\/span> <span class=\"sg\" data-s=\"3\">Kļūda ir <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ja izslēdzat pragmu ar <code>no strict<\/code>, piešķiršana darbojas.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Прагмы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Прагма <code>strict<\/code> в Raku включена по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">Что произойдёт, если присвоить значение переменной, которую вы никогда не объявляли, как в <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Это ошибка времени компиляции<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Он молча создаёт <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Он выводит предупреждение, но работает<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Он устанавливает <code>$x<\/code> в <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> включена по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">Она требует сначала объявлять каждую переменную с помощью <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$x = 42<\/code> без <code>my<\/code> не компилируется.<\/span> <span class=\"sg\" data-s=\"3\">Ошибка: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Если выключить прагму с помощью <code>no strict<\/code>, присваивание сработает.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Прагми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Прагма <code>strict<\/code> у Raku увімкнена за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Що станеться, якщо присвоїти значення змінній, яку ви ніколи не оголошували, як у <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Це помилка під час компіляції<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Це мовчки створює <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Це виводить попередження, але виконується<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Це встановлює <code>$x<\/code> у <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> увімкнена за замовчуванням.<\/span> <span class=\"sg\" data-s=\"1\">Вона вимагає спершу оголосити кожну змінну через <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>$x = 42<\/code> без <code>my<\/code> не компілюється.<\/span> <span class=\"sg\" data-s=\"3\">Помилка така: <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Якщо вимкнути прагму через <code>no strict<\/code>, присвоєння спрацює.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Прагми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Прагмата <code>strict<\/code> в Raku е включена по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Какво се случва, ако присвоите стойност на променлива, която никога не сте декларирали, например <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Грешка по време на компилация<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Мълчаливо създава <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Извежда предупреждение, но се изпълнява<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Задава <code>$x<\/code> на <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> е включена по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\">Тя изисква първо да декларирате всяка променлива с <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>$x = 42<\/code> без <code>my<\/code> не се компилира.<\/span> <span class=\"sg\" data-s=\"3\">Грешката е <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ако изключите прагмата с <code>no strict<\/code>, присвояването работи.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Pragmoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">La pragmo <code>strict<\/code> de Raku estas ŝaltita defaŭlte.<\/span> <span class=\"sg\" data-s=\"1\">Kio okazas, se vi atribuas al variablo, kiun vi neniam deklaris, kiel en <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Ĝi estas kompiltempa eraro<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Ĝi silente kreas <code>$x<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Ĝi presas averton sed ruliĝas<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Ĝi metas <code>$x<\/code> al <code>Nil<\/code><\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> estas ŝaltita defaŭlte.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi postulas, ke vi unue deklaru ĉiun variablon per <code>my<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$x = 42<\/code> sen <code>my<\/code> ne kompiliĝas.<\/span> <span class=\"sg\" data-s=\"3\">La eraro estas <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Se vi malŝaltas la pragmon per <code>no strict<\/code>, la atribuo funkcias.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Pragmata","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pragma <code>strict<\/code> in Raku ex defectu activum est.<\/span> <span class=\"sg\" data-s=\"1\">Quid accidit si variabili assignas quam numquam declaravisti, ut in <code>$x = 42<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">Error tempore compilationis est<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">Silenter <code>$x<\/code> creat<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">Admonitionem imprimit sed currit<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\"><code>$x<\/code> ad <code>Nil<\/code> statuit<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>strict<\/code> ex defectu activum est.<\/span> <span class=\"sg\" data-s=\"1\">Requirit ut omnem variabilem prius cum <code>my<\/code> declares.<\/span> <span class=\"sg\" data-s=\"2\">Ergo <code>$x = 42<\/code> sine <code>my<\/code> compilari non potest.<\/span> <span class=\"sg\" data-s=\"3\">Error est <em>Variable '$x' is not declared<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Si pragma cum <code>no strict<\/code> deactivas, assignatio operatur.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
