<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/exercises/custom-trait/solution","n":576,"k":"solution","pv":"advanced/traits-pragmas/exercises/custom-trait","nx":"advanced/traits-pragmas/exercises/no-strict","tr":["advanced","advanced/traits-pragmas"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A custom trait‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The trait is a <code>multi sub trait_mod:&lt;is&gt;<\/code> with the named parameter <code>:$role!<\/code>. This parameter makes it run for <code>is role(...)<\/code>. Some traits are only present or absent, but this one <em>receives<\/em> the argument. Here, <code>is role('admin')<\/code> binds <code>'admin'<\/code> to <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body stores this value under the name of the subroutine. When you later read <code>%role&lt;login&gt;<\/code>, you get <code>admin<\/code>. Traits run at compile time, so the entry is already there when the program runs.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein benutzerdefinierter Trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Trait ist ein <code>multi sub trait_mod:&lt;is&gt;<\/code> mit dem benannten Parameter <code>:$role!<\/code>. Durch diesen Parameter läuft es bei <code>is role(...)<\/code>. Manche Traits sind nur vorhanden oder nicht vorhanden, aber dieses <em>empfängt<\/em> das Argument. Hier bindet <code>is role('admin')<\/code> den Wert <code>'admin'<\/code> an <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Rumpf speichert diesen Wert unter dem Namen der Subroutine. Wenn Sie später <code>%role&lt;login&gt;<\/code> lesen, bekommen Sie <code>admin<\/code>. Traits laufen zur Kompilierzeit, also ist der Eintrag schon da, wenn das Programm läuft.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een eigen trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De trait is een <code>multi sub trait_mod:&lt;is&gt;<\/code> met de benoemde parameter <code>:$role!<\/code>. Door deze parameter draait hij bij <code>is role(...)<\/code>. Sommige traits zijn alleen aanwezig of afwezig, maar deze <em>ontvangt<\/em> het argument. Hier bindt <code>is role('admin')<\/code> de waarde <code>'admin'<\/code> aan <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De body slaat deze waarde op onder de naam van de subroutine. Als je later <code>%role&lt;login&gt;<\/code> leest, krijg je <code>admin<\/code>. Traits draaien tijdens het compileren, dus de waarde staat er al als het programma draait.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un trait personalizado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El trait es un <code>multi sub trait_mod:&lt;is&gt;<\/code> con el parámetro nombrado <code>:$role!<\/code>. Este parámetro hace que se ejecute para <code>is role(...)<\/code>. Algunos traits solo están presentes o ausentes, pero este <em>recibe<\/em> el argumento. Aquí, <code>is role('admin')<\/code> vincula <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo guarda este valor bajo el nombre de la subrutina. Cuando después lees <code>%role&lt;login&gt;<\/code>, obtienes <code>admin<\/code>. Los traits se ejecutan en tiempo de compilación, así que la entrada ya existe cuando el programa se ejecuta.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un trait personalizzato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il trait è una <code>multi sub trait_mod:&lt;is&gt;<\/code> con il parametro nominato <code>:$role!<\/code>. Questo parametro la fa eseguire per <code>is role(...)<\/code>. Alcuni trait sono solo presenti o assenti, ma questo <em>riceve<\/em> l'argomento. Qui <code>is role('admin')<\/code> lega <code>'admin'<\/code> a <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il corpo memorizza questo valore sotto il nome della subroutine. Quando poi leggi <code>%role&lt;login&gt;<\/code>, ottieni <code>admin<\/code>. I trait vengono eseguiti in fase di compilazione, quindi la voce c'è già durante l'esecuzione.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pielāgota īpašība","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams uzdevuma risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Programmas pirmkodu var atrast failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Īpašība ir <code>multi sub trait_mod:&lt;is&gt;<\/code> ar nosaukto parametru <code>:$role!<\/code>. Šis parametrs liek tai darboties ar <code>is role(...)<\/code>. Dažas īpašības ir tikai klāt vai nav klāt, bet šī <em>saņem<\/em> argumentu. Šeit <code>is role('admin')<\/code> piesaista <code>'admin'<\/code> parametram <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ķermenis saglabā šo vērtību ar apakšprogrammas nosaukumu kā atslēgu. Kad vēlāk nolasāt <code>%role&lt;login&gt;<\/code>, jūs iegūstat <code>admin<\/code>. Īpašības izpildās kompilēšanas laikā, tāpēc ieraksts jau ir tur, kad programma darbojas.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Пользовательский трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Типаж — это <code>multi sub trait_mod:&lt;is&gt;<\/code> с именованным параметром <code>:$role!<\/code>. Благодаря этому параметру он срабатывает для <code>is role(...)<\/code>. Некоторые типажи могут только присутствовать или отсутствовать, а этот <em>получает<\/em> аргумент. Здесь <code>is role('admin')<\/code> привязывает <code>'admin'<\/code> к <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тело сохраняет это значение под именем подпрограммы. Если потом прочитать <code>%role&lt;login&gt;<\/code>, вы получите <code>admin<\/code>. Типажи выполняются во время компиляции, поэтому запись уже есть, когда программа запускается.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Власний трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейт — це <code>multi sub trait_mod:&lt;is&gt;<\/code> з іменованим параметром <code>:$role!<\/code>. Завдяки цьому параметру він спрацьовує для <code>is role(...)<\/code>. Деякі трейти лише присутні чи відсутні, а цей <em>отримує<\/em> аргумент. Тут <code>is role('admin')<\/code> зв'язує <code>'admin'<\/code> із <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тіло зберігає це значення під іменем підпрограми. Коли ви згодом читаєте <code>%role&lt;login&gt;<\/code>, ви отримуєте <code>admin<\/code>. Трейти виконуються під час компіляції, тож коли програма запускається, цей запис уже на місці.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Потребителски трейт","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Трейтът е <code>multi sub trait_mod:&lt;is&gt;<\/code> с именувания параметър <code>:$role!<\/code>. Този параметър го кара да се изпълни при <code>is role(...)<\/code>. Някои трейтове само присъстват или липсват, но този <em>получава<\/em> аргумента. Тук <code>is role('admin')<\/code> свързва <code>'admin'<\/code> с <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Тялото записва тази стойност под името на подпрограмата. Когато по-късно прочетете <code>%role&lt;login&gt;<\/code>, получавате <code>admin<\/code>. Трейтовете се изпълняват по време на компилация, затова записът вече е там, когато програмата работи.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Propra trajto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La trajto estas <code>multi sub trait_mod:&lt;is&gt;<\/code> kun la nomita parametro <code>:$role!<\/code>. Ĉi tiu parametro igas ĝin ruliĝi por <code>is role(...)<\/code>. Kelkaj trajtoj nur ĉeestas aŭ forestas, sed ĉi tiu <em>ricevas<\/em> la argumenton. Ĉi tie, <code>is role('admin')<\/code> ligas <code>'admin'<\/code> al <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La korpo konservas ĉi tiun valoron sub la nomo de la subrutino. Kiam vi poste legas <code>%role&lt;login&gt;<\/code>, vi ricevas <code>admin<\/code>. Trajtoj ruliĝas dum kompilado, do la ero jam estas tie, kiam la programo ruliĝas.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Proprietas personalis","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my %role;\n\nmulti sub trait_mod:&lt;is&gt;(Routine:D $r, :$role!) {\n    %role{$r.name} = $role;\n}\n\nsub login() is role('admin') { }\n\nsay %role&lt;login&gt;;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/custom-trait.raku\" target=\"_blank\" rel=\"noopener\">custom-trait.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>admin<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Trait est <code>multi sub trait_mod:&lt;is&gt;<\/code> cum parametro nominato <code>:$role!<\/code>. Hoc parametrum efficit ut pro <code>is role(...)<\/code> currat. Quaedam traits tantum praesentia vel absentia sunt, sed hoc argumentum <em>accipit<\/em>. Hic <code>is role('admin')<\/code> ligat <code>'admin'<\/code> parametro <code>$role<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Corpus hunc valorem sub nomine subroutinae reponit. Cum postea <code>%role&lt;login&gt;<\/code> legis, <code>admin<\/code> accipis. Traits
