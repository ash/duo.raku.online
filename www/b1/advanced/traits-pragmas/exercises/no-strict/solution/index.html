data-s=\"0\">Це лише демонстрація, і ми не радимо робити так на практиці. <code>strict<\/code> увімкнена за замовчуванням недарма. Вона ловить одруки в іменах змінних під час компіляції. У справжньому коді тримайте її увімкненою й оголошуйте змінні через <code>my<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Отпускане на strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> изключва правилото, че променливите трябва да бъдат декларирани. Затова можете да присвоявате на <code>$a<\/code> и <code>$b<\/code> без <code>my<\/code>. Със <code>strict<\/code> по подразбиране всеки от тези редове би бил грешка при компилация.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">След като им присвоите стойности, променливите се държат както обикновено, затова <code>$a + $b<\/code> е <code>30<\/code>. Това по-слабо правило е лексикално. То важи само до края на обхвата, в който се появява <code>no strict<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е само демонстрация и не я препоръчваме на практика. <code>strict<\/code> е включен по подразбиране с добра причина. Той улавя правописни грешки в имената на променливите по време на компилация. В реален код го оставете включен и декларирайте променливите си с <code>my<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Malstreĉi strict","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> malŝaltas la regulon, ke variabloj devas esti deklaritaj. Do vi povas atribui al <code>$a<\/code> kaj <code>$b<\/code> sen <code>my<\/code>. Kun la defaŭlta <code>strict<\/code>, ĉiu el ĉi tiuj linioj estus kompiltempa eraro.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Post kiam vi atribuas ilin, la variabloj kondutas kiel kutime, do <code>$a + $b<\/code> estas <code>30<\/code>. Ĉi tiu pli malforta regulo estas leksika. Ĝi daŭras nur ĝis la fino de la amplekso, kie <code>no strict<\/code> aperas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tio estas nur demonstro, kaj ni ne rekomendas ĝin en praktiko. <code>strict<\/code> estas ŝaltita defaŭlte pro bona kialo. Ĝi kaptas tajperarojn en nomoj de variabloj dum kompilado. En vera kodo, lasu ĝin ŝaltita kaj deklaru viajn variablojn per <code>my<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Strictum relaxare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>no strict;\n\n$a = 10;\n$b = 20;\nsay $a + $b;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/traits-pragmas/no-strict.raku\" target=\"_blank\" rel=\"noopener\">no-strict.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>30<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>no strict<\/code> regulam deactivat quae dicit variabiles declarari debere. Ergo variabilibus <code>$a<\/code> et <code>$b<\/code> sine <code>my<\/code> assignare potes. Cum <code>strict<\/code> ex defectu, quaeque ex his lineis error tempore compilationis esset.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Postquam eas assignas, variabiles ut solent se gerunt, ergo <code>$a + $b<\/code> est <code>30<\/code>. Haec regula laxior lexicalis est. Tantum usque ad finem ambitus durat ubi <code>no strict<\/code> apparet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Haec tantum demonstratio est, et eam in praxi non commendamus. <code>strict<\/code> ex defectu activum est bona ratione. Errores scribendi in nominibus variabilium tempore compilationis deprehendit. In codice vero, id activum serva et variabiles tuas cum <code>my<\/code> declara.<\/span><\/li><\/ol>"]]}}}</script>
