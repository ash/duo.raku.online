<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits/quiz","n":568,"k":"quiz","pv":"advanced/traits-pragmas/built-in-traits","nx":"advanced/traits-pragmas/writing-a-trait","tr":["advanced","advanced/traits-pragmas","advanced/traits-pragmas/built-in-traits"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Which trait allows a subroutine to <strong>change the caller’s variable<\/strong> through a parameter?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A parameter is read-only by default, so you cannot assign to a plain parameter.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> binds the parameter to the caller’s own variable.<\/span> <span class=\"sg\" data-s=\"2\">So a change inside the routine is also visible outside.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> would instead give you a <em>copy<\/em> that you can change.<\/span> <span class=\"sg\" data-s=\"4\">The caller’s variable would stay untouched.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Welches Trait erlaubt einer Subroutine, über einen Parameter <strong>die Variable des Aufrufers zu ändern<\/strong>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">keines — Parameter sind standardmäßig beschreibbar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ein Parameter ist standardmäßig schreibgeschützt, also können Sie einem einfachen Parameter nichts zuweisen.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> bindet den Parameter an die eigene Variable des Aufrufers.<\/span> <span class=\"sg\" data-s=\"2\">Also ist eine Änderung in der Routine auch außerhalb sichtbar.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> würde Ihnen stattdessen eine <em>Kopie<\/em> geben, die Sie ändern können.<\/span> <span class=\"sg\" data-s=\"4\">Die Variable des Aufrufers würde unverändert bleiben.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Met welke trait kan een subroutine via een parameter <strong>de variabele van de aanroeper wijzigen<\/strong>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">geen — parameters zijn standaard schrijfbaar<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een parameter is standaard alleen-lezen, dus aan een gewone parameter kun je niets toekennen.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> bindt de parameter aan de eigen variabele van de aanroeper.<\/span> <span class=\"sg\" data-s=\"2\">Een verandering binnen de routine is dus ook buiten zichtbaar.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> zou je in plaats daarvan een <em>kopie<\/em> geven die je kunt veranderen.<\/span> <span class=\"sg\" data-s=\"4\">De variabele van de aanroeper zou dan onveranderd blijven.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Traits","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">¿Qué trait permite que una subrutina <strong>cambie la variable del llamador<\/strong> a través de un parámetro?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ninguno — los parámetros son modificables por defecto<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un parámetro es de solo lectura por defecto, así que no puedes asignar un valor a un parámetro simple.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> vincula el parámetro a la propia variable del llamador.<\/span> <span class=\"sg\" data-s=\"2\">Así, un cambio dentro de la rutina también es visible fuera.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code>, en cambio, te daría una <em>copia<\/em> que puedes cambiar.<\/span> <span class=\"sg\" data-s=\"4\">La variable del llamador quedaría intacta.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Trait","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quale trait permette a una subroutine di <strong>cambiare la variabile del chiamante<\/strong> attraverso un parametro?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nessuno — i parametri sono scrivibili per impostazione predefinita<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un parametro è in sola lettura di default, quindi non puoi assegnare un valore a un parametro semplice.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> lega il parametro alla variabile stessa del chiamante.<\/span> <span class=\"sg\" data-s=\"2\">Così un cambiamento dentro la routine è visibile anche fuori.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> invece ti darebbe una <em>copia<\/em> che puoi cambiare.<\/span> <span class=\"sg\" data-s=\"4\">La variabile del chiamante resterebbe intatta.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Īpašības","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kura īpašība ļauj apakšprogrammai <strong>mainīt izsaucēja mainīgo<\/strong> caur parametru?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">none — parameters are writable by default<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parametrs pēc noklusējuma ir tikai lasāms, tāpēc parastam parametram nevar piešķirt vērtību.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> sasaista parametru ar paša izsaucēja mainīgo.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc izmaiņa apakšprogrammas iekšienē ir redzama arī ārpusē.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> turpretī dotu jums <em>kopiju<\/em>, ko varat mainīt.<\/span> <span class=\"sg\" data-s=\"4\">Izsaucēja mainīgais paliktu neskarts.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Трейты","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Какой типаж позволяет подпрограмме <strong>изменять переменную вызывающей стороны<\/strong> через параметр?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">ни один — параметры по умолчанию доступны для записи<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">По умолчанию параметр доступен только для чтения, поэтому обычному параметру нельзя ничего присвоить.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> привязывает параметр к самой переменной вызывающей стороны.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому изменение внутри подпрограммы видно и снаружи.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> вместо этого дал бы вам <em>копию<\/em>, которую можно менять.<\/span> <span class=\"sg\" data-s=\"4\">Переменная вызывающей стороны осталась бы нетронутой.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Трейти","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Який трейт дозволяє підпрограмі <strong>змінювати змінну викликача<\/strong> через параметр?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">жоден — параметри доступні для запису за замовчуванням<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням параметр доступний лише для читання, тож звичайному параметру нічого не можна присвоїти.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> зв'язує параметр із власною змінною викликача.<\/span> <span class=\"sg\" data-s=\"2\">Тож зміну всередині підпрограми видно й ззовні.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> натомість дав би вам <em>копію<\/em>, яку можна змінювати.<\/span> <span class=\"sg\" data-s=\"4\">Змінна викликача лишилася б недоторканою.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Трейтове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Кой трейт позволява на подпрограмата да <strong>промени променливата на извикващия<\/strong> чрез параметър?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">нито един — параметрите са записваеми по подразбиране<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Параметърът е само за четене по подразбиране, затова не можете да присвоявате на обикновен параметър.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> свързва параметъра със собствената променлива на извикващия.<\/span> <span class=\"sg\" data-s=\"2\">Така промяната вътре в подпрограмата се вижда и навън.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> вместо това би ви дал <em>копие<\/em>, което можете да променяте.<\/span> <span class=\"sg\" data-s=\"4\">Променливата на извикващия би останала незасегната.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Trajtoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiu trajto permesas al subrutino <strong>ŝanĝi la variablon de la vokanto<\/strong> per parametro?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">neniu — parametroj estas skribeblaj defaŭlte<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parametro estas nur-legebla defaŭlte, do vi ne povas atribui al simpla parametro.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> ligas la parametron al la propra variablo de la vokanto.<\/span> <span class=\"sg\" data-s=\"2\">Do ŝanĝo ene de la rutino videblas ankaŭ ekstere.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> anstataŭe donus al vi <em>kopion<\/em>, kiun vi povas ŝanĝi.<\/span> <span class=\"sg\" data-s=\"4\">La variablo de la vokanto restus netuŝita.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Proprietates","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quis trait subroutinae permittit <strong>variabilem vocantis mutare<\/strong> per parametrum?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\"><code>is rw<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\"><code>is copy<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\"><code>is default<\/code><\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">nullus — parametra ex defectu scribilia sunt<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parametrum ex defectu tantum-lectu est, ergo parametro simplici assignare non potes.<\/span> <span class=\"sg\" data-s=\"1\"><code>is rw<\/code> parametrum variabili propriae vocantis ligat.<\/span> <span class=\"sg\" data-s=\"2\">Ergo mutatio intra routinam etiam foris visibilis est.<\/span> <span class=\"sg\" data-s=\"3\"><code>is copy<\/code> potius tibi <em>copiam<\/em> daret quam mutare potes.<\/span> <span class=\"sg\" data-s=\"4\">Variabilis vocantis intacta maneret.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
