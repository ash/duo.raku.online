<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas/built-in-traits","n":567,"k":"topic","pv":"advanced/traits-pragmas","nx":"advanced/traits-pragmas/built-in-traits/quiz","tr":["advanced","advanced/traits-pragmas"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Built-in traits","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>trait<\/em> is added with the <code>is<\/code> keyword right after a declaration.<\/span> <span class=\"sg\" data-s=\"1\">It runs at compile time.<\/span> <span class=\"sg\" data-s=\"2\">It changes a fixed property of the thing it belongs to.<\/span> <span class=\"sg\" data-s=\"3\">Raku comes with many traits, and you have already used a few.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">By default, the parameters of a subroutine are <strong>read-only<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">You cannot assign to them inside the routine.<\/span> <span class=\"sg\" data-s=\"2\">The <code>is copy<\/code> trait gives you a private copy of the argument that you can change.<\/span> <span class=\"sg\" data-s=\"3\">The change does not affect the caller:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>is rw<\/code> trait goes further.<\/span> <span class=\"sg\" data-s=\"1\">It binds the parameter to the caller’s variable.<\/span> <span class=\"sg\" data-s=\"2\">So a change inside the routine is also visible outside:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Without one of these traits, <code>$n++<\/code> would cause an error.<\/span> <span class=\"sg\" data-s=\"1\">The parameter would be read-only.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Another common trait sets a default value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Here, <code>is default<\/code> gives the variable a value to use when there is no other value.<\/span> <span class=\"sg\" data-s=\"1\">There are many built-in traits, such as <code>is rw<\/code>, <code>is copy<\/code> and <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Each of them adds one specific behaviour to a declaration at compile time.<\/span> <span class=\"sg\" data-s=\"3\">The next topic shows that the set of traits is not closed.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"/advanced/traits-pragmas/writing-a-trait/\">You can define your own<\/a>.<\/span><\/p>"]]},"de":{"t":"Eingebaute Traits","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Trait<\/em> wird mit dem Schlüsselwort <code>is<\/code> direkt nach einer Deklaration hinzugefügt.<\/span> <span class=\"sg\" data-s=\"1\">Es läuft zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"2\">Es ändert eine feste Eigenschaft des Elements, zu dem es gehört.<\/span> <span class=\"sg\" data-s=\"3\">Raku bringt viele Traits mit, und Sie haben schon einige benutzt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig sind die Parameter einer Subroutine <strong>schreibgeschützt<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Sie können ihnen in der Routine nichts zuweisen.<\/span> <span class=\"sg\" data-s=\"2\">Das Trait <code>is copy<\/code> gibt Ihnen eine private Kopie des Arguments, die Sie ändern können.<\/span> <span class=\"sg\" data-s=\"3\">Die Änderung hat keine Wirkung auf den Aufrufer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Trait <code>is rw<\/code> geht noch weiter.<\/span> <span class=\"sg\" data-s=\"1\">Es bindet den Parameter an die Variable des Aufrufers.<\/span> <span class=\"sg\" data-s=\"2\">Also ist eine Änderung in der Routine auch außerhalb sichtbar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ohne eines dieser Traits würde <code>$n++<\/code> einen Fehler auslösen.<\/span> <span class=\"sg\" data-s=\"1\">Der Parameter wäre schreibgeschützt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein weiteres häufiges Trait setzt einen Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier gibt <code>is default<\/code> der Variablen einen Wert, den sie nutzt, wenn es keinen anderen Wert gibt.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt viele eingebaute Traits, zum Beispiel <code>is rw<\/code>, <code>is copy<\/code> und <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jedes davon gibt einer Deklaration zur Kompilierzeit ein bestimmtes Verhalten.<\/span> <span class=\"sg\" data-s=\"3\">Das nächste Thema zeigt, dass die Menge der Traits nicht geschlossen ist.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/de/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Sie können eigene definieren<\/a>.<\/span><\/p>"]]},"nl":{"t":"Ingebouwde traits","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>trait<\/em> wordt toegevoegd met het sleutelwoord <code>is<\/code>, direct na een declaratie.<\/span> <span class=\"sg\" data-s=\"1\">Hij draait tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"2\">Hij verandert een vaste eigenschap van datgene waar hij bij hoort.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft veel traits, en je hebt er al een paar gebruikt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Standaard zijn de parameters van een subroutine <strong>alleen-lezen<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er binnen de routine niets aan toekennen.<\/span> <span class=\"sg\" data-s=\"2\">De trait <code>is copy<\/code> geeft je een eigen kopie van het argument, die je wel kunt veranderen.<\/span> <span class=\"sg\" data-s=\"3\">De verandering heeft geen invloed op de aanroeper:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — de variabele van de aanroeper blijft ongemoeid<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De trait <code>is rw<\/code> gaat verder.<\/span> <span class=\"sg\" data-s=\"1\">Hij bindt de parameter aan de variabele van de aanroeper.<\/span> <span class=\"sg\" data-s=\"2\">Een verandering binnen de routine is dus ook buiten zichtbaar:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zonder een van deze traits zou <code>$n++<\/code> een fout geven.<\/span> <span class=\"sg\" data-s=\"1\">De parameter zou dan alleen-lezen zijn.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een andere veelgebruikte trait stelt een standaardwaarde in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hier geeft <code>is default<\/code> de variabele een waarde voor als er geen andere waarde is.<\/span> <span class=\"sg\" data-s=\"1\">Er zijn veel ingebouwde traits, zoals <code>is rw<\/code>, <code>is copy<\/code> en <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Elk daarvan geeft een declaratie tijdens het compileren één specifiek gedrag.<\/span> <span class=\"sg\" data-s=\"3\">Het volgende onderwerp laat zien dat de verzameling traits niet gesloten is.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/nl/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Je kunt er zelf een definiëren<\/a>.<\/span><\/p>"]]},"es":{"t":"Traits integrados","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>trait<\/em> se añade con la palabra clave <code>is<\/code> justo después de una declaración.<\/span> <span class=\"sg\" data-s=\"1\">Se ejecuta en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"2\">Cambia una propiedad fija del elemento al que pertenece.<\/span> <span class=\"sg\" data-s=\"3\">Raku trae muchos traits, y ya has usado algunos.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Por defecto, los parámetros de una subrutina son de <strong>solo lectura<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">No puedes asignarles valores dentro de la rutina.<\/span> <span class=\"sg\" data-s=\"2\">El trait <code>is copy<\/code> te da una copia privada del argumento que puedes cambiar.<\/span> <span class=\"sg\" data-s=\"3\">El cambio no afecta al llamador:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El trait <code>is rw<\/code> va más allá.<\/span> <span class=\"sg\" data-s=\"1\">Vincula el parámetro a la variable del llamador.<\/span> <span class=\"sg\" data-s=\"2\">Así, un cambio dentro de la rutina también es visible fuera:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sin uno de estos traits, <code>$n++<\/code> causaría un error.<\/span> <span class=\"sg\" data-s=\"1\">El parámetro sería de solo lectura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Otro trait común establece un valor por defecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>is default<\/code> da a la variable un valor para usar cuando no hay otro valor.<\/span> <span class=\"sg\" data-s=\"1\">Hay muchos traits incorporados, como <code>is rw<\/code>, <code>is copy<\/code> y <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Cada uno añade un comportamiento concreto a una declaración en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"3\">El siguiente tema muestra que el conjunto de traits no está cerrado.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/es/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Puedes definir los tuyos propios<\/a>.<\/span><\/p>"]]},"it":{"t":"Trait integrati","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>trait<\/em> si aggiunge con la parola chiave <code>is<\/code> subito dopo una dichiarazione.<\/span> <span class=\"sg\" data-s=\"1\">Viene eseguito in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"2\">Cambia una proprietà fissa della cosa a cui appartiene.<\/span> <span class=\"sg\" data-s=\"3\">Raku offre molti trait, e ne hai già usati alcuni.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Di default, i parametri di una subroutine sono <strong>in sola lettura<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Non puoi assegnare loro un valore dentro la routine.<\/span> <span class=\"sg\" data-s=\"2\">Il trait <code>is copy<\/code> ti dà una copia privata dell'argomento, che puoi cambiare.<\/span> <span class=\"sg\" data-s=\"3\">Il cambiamento non tocca il chiamante:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il trait <code>is rw<\/code> va oltre.<\/span> <span class=\"sg\" data-s=\"1\">Lega il parametro alla variabile del chiamante.<\/span> <span class=\"sg\" data-s=\"2\">Così un cambiamento dentro la routine è visibile anche fuori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Senza uno di questi trait, <code>$n++<\/code> causerebbe un errore.<\/span> <span class=\"sg\" data-s=\"1\">Il parametro sarebbe in sola lettura.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un altro trait comune imposta un valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Qui <code>is default<\/code> dà alla variabile un valore da usare quando non ce n'è un altro.<\/span> <span class=\"sg\" data-s=\"1\">Ci sono molti trait integrati, come <code>is rw<\/code>, <code>is copy<\/code> e <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ognuno aggiunge un comportamento specifico a una dichiarazione in fase di compilazione.<\/span> <span class=\"sg\" data-s=\"3\">Il prossimo argomento mostra che l'insieme dei trait non è chiuso.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/it/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Puoi definire i tuoi<\/a>.<\/span><\/p>"]]},"lv":{"t":"Iebūvētās īpašības","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Īpašību<\/em> pievieno ar atslēgvārdu <code>is<\/code> uzreiz pēc deklarācijas.<\/span> <span class=\"sg\" data-s=\"1\">Tā izpildās kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"2\">Tā maina kādu nemainīgu iezīmi lietai, kurai tā pieder.<\/span> <span class=\"sg\" data-s=\"3\">Raku ir daudz iebūvētu īpašību, un dažas jūs jau esat lietojuši.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma apakšprogrammas parametri ir <strong>tikai lasāmi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogrammas iekšienē jūs nevarat tiem piešķirt vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Īpašība <code>is copy<\/code> dod jums privātu argumenta kopiju, kuru varat mainīt.<\/span> <span class=\"sg\" data-s=\"3\">Izmaiņa neietekmē izsaucēju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Īpašība <code>is rw<\/code> iet tālāk.<\/span> <span class=\"sg\" data-s=\"1\">Tā sasaista parametru ar izsaucēja mainīgo.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc izmaiņa apakšprogrammas iekšienē ir redzama arī ārpusē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Bez kādas no šīm īpašībām <code>$n++<\/code> izraisītu kļūdu.<\/span> <span class=\"sg\" data-s=\"1\">Parametrs būtu tikai lasāms.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vēl viena izplatīta īpašība nosaka noklusējuma vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>is default<\/code> dod mainīgajam vērtību, ko lietot, kad citas vērtības nav.<\/span> <span class=\"sg\" data-s=\"1\">Ir daudz iebūvētu īpašību, piemēram, <code>is rw<\/code>, <code>is copy<\/code> un <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Katra no tām kompilēšanas laikā pievieno deklarācijai vienu noteiktu uzvedību.<\/span> <span class=\"sg\" data-s=\"3\">Nākamā tēma parāda, ka īpašību kopa nav slēgta.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/lv/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Jūs varat definēt savas<\/a>.<\/span><\/p>"]]},"ru":{"t":"Встроенные трейты","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Типаж<\/em> добавляется с помощью ключевого слова <code>is<\/code> сразу после объявления.<\/span> <span class=\"sg\" data-s=\"1\">Он выполняется во время компиляции.<\/span> <span class=\"sg\" data-s=\"2\">Он меняет фиксированное свойство того, к чему относится.<\/span> <span class=\"sg\" data-s=\"3\">В Raku есть много типажей, и некоторые вы уже использовали.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">По умолчанию параметры подпрограммы доступны <strong>только для чтения<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Внутри подпрограммы им нельзя ничего присвоить.<\/span> <span class=\"sg\" data-s=\"2\">Типаж <code>is copy<\/code> даёт вам личную копию аргумента, которую можно менять.<\/span> <span class=\"sg\" data-s=\"3\">Это изменение не затрагивает вызывающую сторону:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Типаж <code>is rw<\/code> идёт дальше.<\/span> <span class=\"sg\" data-s=\"1\">Он привязывает параметр к переменной вызывающей стороны.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому изменение внутри подпрограммы видно и снаружи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без одного из этих типажей <code>$n++<\/code> вызвало бы ошибку.<\/span> <span class=\"sg\" data-s=\"1\">Параметр был бы доступен только для чтения.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Другой распространённый типаж задаёт значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>is default<\/code> даёт переменной значение, которое используется, когда другого значения нет.<\/span> <span class=\"sg\" data-s=\"1\">Есть много встроенных типажей, например <code>is rw<\/code>, <code>is copy<\/code> и <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Каждый из них добавляет к объявлению одно определённое поведение во время компиляции.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема показывает, что набор типажей не закрыт.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/ru/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Вы можете определить собственные<\/a>.<\/span><\/p>"]]},"uk":{"t":"Вбудовані трейти","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Трейт<\/em> додають ключовим словом <code>is<\/code> одразу після оголошення.<\/span> <span class=\"sg\" data-s=\"1\">Він виконується під час компіляції.<\/span> <span class=\"sg\" data-s=\"2\">Він змінює сталу властивість того, до чого належить.<\/span> <span class=\"sg\" data-s=\"3\">Raku має багато трейтів, і кількома ви вже користувалися.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням параметри підпрограми доступні <strong>лише для читання<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Усередині підпрограми їм не можна нічого присвоїти.<\/span> <span class=\"sg\" data-s=\"2\">Трейт <code>is copy<\/code> дає вам приватну копію аргументу, яку можна змінювати.<\/span> <span class=\"sg\" data-s=\"3\">Ця зміна не зачіпає того, хто викликав підпрограму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — власна змінна викликача недоторкана<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Трейт <code>is rw<\/code> іде далі.<\/span> <span class=\"sg\" data-s=\"1\">Він зв'язує параметр зі змінною викликача.<\/span> <span class=\"sg\" data-s=\"2\">Тож зміну всередині підпрограми видно й ззовні:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без одного з цих трейтів <code>$n++<\/code> спричинив би помилку.<\/span> <span class=\"sg\" data-s=\"1\">Параметр був би доступний лише для читання.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ще один поширений трейт задає типове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тут <code>is default<\/code> дає змінній значення, яке діє, коли іншого значення немає.<\/span> <span class=\"sg\" data-s=\"1\">Є багато вбудованих трейтів, як-от <code>is rw<\/code>, <code>is copy<\/code> і <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Кожен із них додає до оголошення одну конкретну поведінку під час компіляції.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема показує, що набір трейтів не закритий.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/uk/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Ви можете визначати власні<\/a>.<\/span><\/p>"]]},"bg":{"t":"Вградени трейтове","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Трейтът<\/em> се добавя с ключовата дума <code>is<\/code> веднага след декларацията.<\/span> <span class=\"sg\" data-s=\"1\">Той се изпълнява по време на компилация.<\/span> <span class=\"sg\" data-s=\"2\">Той променя някое постоянно свойство на нещото, към което принадлежи.<\/span> <span class=\"sg\" data-s=\"3\">Raku идва с много трейтове и вече сте използвали няколко от тях.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">По подразбиране параметрите на подпрограмата са <strong>само за четене<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Не можете да им присвоявате стойност вътре в подпрограмата.<\/span> <span class=\"sg\" data-s=\"2\">Трейтът <code>is copy<\/code> ви дава лично копие на аргумента, което можете да променяте.<\/span> <span class=\"sg\" data-s=\"3\">Промяната не засяга извикващия:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Трейтът <code>is rw<\/code> отива по-далеч.<\/span> <span class=\"sg\" data-s=\"1\">Той свързва параметъра с променливата на извикващия.<\/span> <span class=\"sg\" data-s=\"2\">Така промяната вътре в подпрограмата се вижда и навън:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Без един от тези трейтове <code>$n++<\/code> би предизвикал грешка.<\/span> <span class=\"sg\" data-s=\"1\">Параметърът би бил само за четене.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Друг често срещан трейт задава стойност по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тук <code>is default<\/code> дава на променливата стойност, която да се използва, когато няма друга стойност.<\/span> <span class=\"sg\" data-s=\"1\">Има много вградени трейтове, като <code>is rw<\/code>, <code>is copy<\/code> и <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Всеки от тях добавя едно конкретно поведение към декларацията по време на компилация.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема показва, че множеството от трейтове не е затворено.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/bg/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Можете да дефинирате свои<\/a>.<\/span><\/p>"]]},"eo":{"t":"Enkonstruitaj trajtoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Trajto<\/em> estas aldonata per la ŝlosilvorto <code>is<\/code> tuj post deklaro.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ruliĝas dum kompilado.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ŝanĝas fiksitan econ de la aĵo, al kiu ĝi apartenas.<\/span> <span class=\"sg\" data-s=\"3\">Raku venas kun multaj trajtoj, kaj vi jam uzis kelkajn.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, la parametroj de subrutino estas <strong>nur-legeblaj<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne povas atribui al ili ene de la rutino.<\/span> <span class=\"sg\" data-s=\"2\">La trajto <code>is copy<\/code> donas al vi privatan kopion de la argumento, kiun vi povas ŝanĝi.<\/span> <span class=\"sg\" data-s=\"3\">La ŝanĝo ne influas la vokanton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — la propra variablo de la vokanto restas netuŝita<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La trajto <code>is rw<\/code> iras plu.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ligas la parametron al la variablo de la vokanto.<\/span> <span class=\"sg\" data-s=\"2\">Do ŝanĝo ene de la rutino videblas ankaŭ ekstere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sen unu el ĉi tiuj trajtoj, <code>$n++<\/code> kaŭzus eraron.<\/span> <span class=\"sg\" data-s=\"1\">La parametro estus nur-legebla.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alia ofta trajto starigas defaŭltan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>is default<\/code> donas al la variablo valoron por uzi, kiam ne estas alia valoro.<\/span> <span class=\"sg\" data-s=\"1\">Ekzistas multaj enkonstruitaj trajtoj, ekzemple <code>is rw<\/code>, <code>is copy<\/code> kaj <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu el ili aldonas unu specifan konduton al deklaro dum kompilado.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo montras, ke la aro de trajtoj ne estas fermita.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/eo/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Vi povas difini viajn proprajn<\/a>.<\/span><\/p>"]]},"la":{"t":"Proprietates incorporatae","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Trait<\/em> cum verbo clave <code>is<\/code> statim post declarationem additur.<\/span> <span class=\"sg\" data-s=\"1\">Tempore compilationis currit.<\/span> <span class=\"sg\" data-s=\"2\">Proprietatem fixam rei mutat cui adiunctus est.<\/span> <span class=\"sg\" data-s=\"3\">Raku multos traits habet, et iam paucos adhibuisti.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ex defectu parametra subroutinae sunt <strong>tantum-lectu<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Eis intra routinam assignare non potes.<\/span> <span class=\"sg\" data-s=\"2\">Trait <code>is copy<\/code> tibi copiam privatam argumenti dat, quam mutare potes.<\/span> <span class=\"sg\" data-s=\"3\">Mutatio vocantem non afficit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub greet($name is copy) {\n    $name = \"dear $name\";\n    say \"Hello, $name!\";\n}\n\nmy $who = 'Anna';\ngreet($who); # Hello, dear Anna!\nsay $who;    # Anna — the caller's own variable is untouched<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Trait <code>is rw<\/code> longius procedit.<\/span> <span class=\"sg\" data-s=\"1\">Parametrum variabili vocantis ligat.<\/span> <span class=\"sg\" data-s=\"2\">Ergo mutatio intra routinam etiam foris visibilis est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub bump($n is rw) {\n    $n++;\n}\n\nmy $x = 10;\nbump($x);\nsay $x; # 11<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sine uno ex his traits, <code>$n++<\/code> errorem faceret.<\/span> <span class=\"sg\" data-s=\"1\">Parametrum tantum-lectu esset.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Alius trait communis valorem defectivum statuit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $port is default(8080);\nsay $port; # 8080<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Hic <code>is default<\/code> variabili valorem dat quem adhibet cum nullus alius valor adest.<\/span> <span class=\"sg\" data-s=\"1\">Multi traits incorporati sunt, ut <code>is rw<\/code>, <code>is copy<\/code> et <code>is default<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quisque eorum unum modum agendi certum declarationi addit, tempore compilationis.<\/span> <span class=\"sg\" data-s=\"3\">Thema proximum ostendit traits non esse coetum clausum.<\/span> <span class=\"sg\" data-s=\"4\"><a href=\"https://course.raku.org/la/advanced/traits-pragmas/writing-a-trait/\" target=\"_blank\" rel=\"noopener\">Tuos proprios definire potes<\/a>.<\/span><\/p>"]]}}}</script>
