<script type="application/json" id="page-data">{"u":"advanced/traits-pragmas","n":566,"k":"section","pv":"advanced/user-defined-operators/quiz","nx":"advanced/traits-pragmas/built-in-traits","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Traits and pragmas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Two features let you change how code is <strong>compiled<\/strong>, before it even runs.<\/span> <span class=\"sg\" data-s=\"1\">A <em>trait<\/em> is a modifier for a declaration, such as a variable or a routine.<\/span> <span class=\"sg\" data-s=\"2\">You write it with <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">A <em>pragma<\/em> is a special instruction that looks like a module.<\/span> <span class=\"sg\" data-s=\"4\">You turn it on with <code>use<\/code>, or off with <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">It changes a rule for the rest of the lexical scope.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You have already used a trait such as <code>is default<\/code> without paying much attention to it.<\/span> <span class=\"sg\" data-s=\"1\">This section looks at traits as a feature of their own.<\/span> <span class=\"sg\" data-s=\"2\">It shows how to write your own traits and introduces pragmas.<\/span><\/p>"]]},"de":{"t":"Traits und Pragmas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Mit zwei Funktionen können Sie ändern, wie Code <strong>kompiliert<\/strong> wird, noch bevor er läuft.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Trait<\/em> ist ein Modifikator für eine Deklaration, zum Beispiel für eine Variable oder eine Routine.<\/span> <span class=\"sg\" data-s=\"2\">Sie schreiben es mit <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ein <em>Pragma<\/em> ist eine besondere Anweisung, die wie ein Modul aussieht.<\/span> <span class=\"sg\" data-s=\"4\">Sie schalten es mit <code>use<\/code> ein oder mit <code>no<\/code> aus.<\/span> <span class=\"sg\" data-s=\"5\">Es ändert eine Regel für den Rest des lexikalischen Gültigkeitsbereichs.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie haben schon ein Trait wie <code>is default<\/code> benutzt, ohne viel darauf zu achten.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt betrachtet Traits als eigene Funktion.<\/span> <span class=\"sg\" data-s=\"2\">Er zeigt, wie Sie eigene Traits schreiben, und stellt Pragmas vor.<\/span><\/p>"]]},"nl":{"t":"Traits en pragma's","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Met twee mogelijkheden kun je veranderen hoe code <strong>gecompileerd<\/strong> wordt, nog voordat ze draait.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>trait<\/em> is een modificator voor een declaratie, zoals een variabele of een routine.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft hem met <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Een <em>pragma<\/em> is een speciale aanwijzing die op een module lijkt.<\/span> <span class=\"sg\" data-s=\"4\">Je zet het aan met <code>use<\/code>, of uit met <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Het verandert een regel voor de rest van het lexicale bereik.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hebt al een trait als <code>is default<\/code> gebruikt, zonder er veel aandacht aan te besteden.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie bekijkt traits als een mogelijkheid op zichzelf.<\/span> <span class=\"sg\" data-s=\"2\">Ze laat zien hoe je je eigen traits schrijft, en introduceert pragma's.<\/span><\/p>"]]},"es":{"t":"Traits y pragmas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Dos características te permiten cambiar cómo se <strong>compila<\/strong> el código, antes incluso de que se ejecute.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>trait<\/em> es un modificador para una declaración, como una variable o una rutina.<\/span> <span class=\"sg\" data-s=\"2\">Lo escribes con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Una <em>pragma<\/em> es una instrucción especial que se parece a un módulo.<\/span> <span class=\"sg\" data-s=\"4\">La activas con <code>use<\/code>, o la desactivas con <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Cambia una regla para el resto del ámbito léxico.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ya has usado un trait como <code>is default<\/code> sin prestarle mucha atención.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección trata los traits como una característica propia.<\/span> <span class=\"sg\" data-s=\"2\">Muestra cómo escribir tus propios traits y presenta las pragmas.<\/span><\/p>"]]},"it":{"t":"Trait e pragma","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Due funzionalità ti permettono di cambiare come viene <strong>compilato<\/strong> il codice, prima ancora che venga eseguito.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>trait<\/em> è un modificatore per una dichiarazione, come una variabile o una routine.<\/span> <span class=\"sg\" data-s=\"2\">Lo scrivi con <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Un <em>pragma<\/em> è un'istruzione speciale che sembra un modulo.<\/span> <span class=\"sg\" data-s=\"4\">Lo attivi con <code>use<\/code>, o lo disattivi con <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Cambia una regola per il resto dello scope lessicale.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai già usato un trait come <code>is default<\/code> senza farci molta attenzione.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione guarda i trait come una funzionalità a sé.<\/span> <span class=\"sg\" data-s=\"2\">Mostra come scrivere i tuoi trait e presenta i pragma.<\/span><\/p>"]]},"lv":{"t":"Īpašības un pragmas 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Divas iespējas ļauj mainīt to, kā kods tiek <strong>kompilēts<\/strong>, vēl pirms tas tiek izpildīts.<\/span> <span class=\"sg\" data-s=\"1\">Tā sauktā <em>īpašība<\/em> (trait) ir deklarācijas modifikators, piemēram, mainīgajam vai apakšprogrammai.<\/span> <span class=\"sg\" data-s=\"2\">To raksta ar <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tā sauktā <em>pragma<\/em> ir īpaša instrukcija, kas izskatās pēc moduļa.<\/span> <span class=\"sg\" data-s=\"4\">Jūs to ieslēdzat ar <code>use<\/code> vai izslēdzat ar <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Tā maina kādu noteikumu pārējā leksiskajā tvērumā.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat lietojuši tādu īpašību kā <code>is default<\/code>, īpaši nepievēršot tai uzmanību.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko īpašības kā atsevišķu iespēju.<\/span> <span class=\"sg\" data-s=\"2\">Tā parāda, kā rakstīt savas īpašības, un iepazīstina ar pragmām.<\/span><\/p>"]]},"ru":{"t":"Трейты и прагмы","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Две возможности позволяют менять то, как код <strong>компилируется<\/strong>, ещё до его запуска.<\/span> <span class=\"sg\" data-s=\"1\">Модификатор для объявления, например переменной или подпрограммы, называется <em>типажом<\/em> (trait).<\/span> <span class=\"sg\" data-s=\"2\">Его записывают с помощью <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Особая инструкция, похожая на модуль, называется <em>прагмой<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Её включают с помощью <code>use<\/code> или выключают с помощью <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Она меняет правило для остальной части лексической области видимости.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали типаж, например <code>is default<\/code>, не обращая на него особого внимания.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе типажи рассматриваются как отдельная возможность.<\/span> <span class=\"sg\" data-s=\"2\">Он показывает, как писать собственные типажи, и знакомит с прагмами.<\/span><\/p>"]]},"uk":{"t":"Трейти та прагми","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Дві можливості дозволяють змінити те, як код <strong>компілюється<\/strong>, ще до того, як він запуститься.<\/span> <span class=\"sg\" data-s=\"1\">Модифікатор оголошення, наприклад змінної чи підпрограми, — це <em>трейт<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете його через <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Особлива інструкція, яка схожа на модуль, — це <em>прагма<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ви вмикаєте її через <code>use<\/code>, а вимикаєте через <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Вона змінює правило до кінця лексичної області видимості.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися трейтом на кшталт <code>is default<\/code>, не звертаючи на нього особливої уваги.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає трейти як окрему можливість.<\/span> <span class=\"sg\" data-s=\"2\">Він показує, як писати власні трейти, і знайомить із прагмами.<\/span><\/p>"]]},"bg":{"t":"Трейтове и прагми 🆕","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Две средства ви позволяват да промените как се <strong>компилира<\/strong> кодът, още преди да се изпълни.<\/span> <span class=\"sg\" data-s=\"1\">Модификаторът за декларация, например на променлива или подпрограма, се нарича <em>трейт<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Пишете го с <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Специална инструкция, която прилича на модул, се нарича <em>прагма<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Включвате я с <code>use<\/code> или я изключвате с <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Тя променя правило за останалата част от лексикалния обхват.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали трейт като <code>is default<\/code>, без да му обръщате много внимание.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда трейтовете като самостоятелно средство.<\/span> <span class=\"sg\" data-s=\"2\">Той показва как да пишете свои трейтове и представя прагмите.<\/span><\/p>"]]},"eo":{"t":"Trajtoj kaj pragmoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Du ecoj permesas al vi ŝanĝi, kiel kodo estas <strong>kompilata<\/strong>, antaŭ ol ĝi eĉ ruliĝas.<\/span> <span class=\"sg\" data-s=\"1\">La <em>trajto<\/em> estas modifilo por deklaro, ekzemple por variablo aŭ rutino.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas ĝin per <code>is<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La <em>pragmo<\/em> estas speciala instrukcio, kiu aspektas kiel modulo.<\/span> <span class=\"sg\" data-s=\"4\">Vi ŝaltas ĝin per <code>use<\/code>, aŭ malŝaltas per <code>no<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ŝanĝas regulon por la resto de la leksika amplekso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis trajton kiel <code>is default<\/code>, sen multe atenti pri ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio rigardas trajtojn kiel apartan econ.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi montras, kiel skribi viajn proprajn trajtojn, kaj prezentas pragmojn.<\/span><\/p>"]]},"la":{"t":"Proprietates et pragmata","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Duae proprietates tibi permittunt mutare quomodo codex <strong>compiletur<\/strong>, antequam etiam currat.<\/span> <span class=\"sg\" data-s=\"1\">Primum, <em>trait<\/em> est modificator declarationis, ut variabilis vel routinae.<\/span> <span class=\"sg\" data-s=\"2\">Eum cum <code>is<\/code> scribis.<\/span> <span class=\"sg\" data-s=\"3\">Deinde, <em>pragma<\/em> est mandatum speciale quod modulo simile videtur.<\/span> <span class=\"sg\" data-s=\"4\">Id cum <code>use<\/code> activas, vel cum <code>no<\/code> deactivas.<\/span> <span class=\"sg\" data-s=\"5\">Regulam pro reliquo ambitu lexicali mutat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iam trait ut <code>is default<\/code> adhibuisti, neque multum de eo cogitavisti.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio traits ut proprietatem per se considerat.<\/span> <span class=\"sg\" data-s=\"2\">Ostendit quomodo traits tua scribas, et pragmata introducit.<\/span><\/p>"]]}}}</script>
