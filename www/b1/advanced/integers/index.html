 write integers in other number bases.<\/span> <span class=\"sg\" data-s=\"1\">They also introduce a few useful integer methods.<\/span><\/p>"]]},"de":{"t":"Ganzzahlen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Du hast ganze Zahlen seit dem Anfang des Kurses benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt sieht sich einige ihrer Eigenschaften an, die man leicht übersieht.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die wichtigste ist, dass ganze Zahlen in Raku <em>beliebige Genauigkeit<\/em> haben.<\/span> <span class=\"sg\" data-s=\"1\">Sie haben keine feste Anzahl von Bytes.<\/span> <span class=\"sg\" data-s=\"2\">Sie laufen nie ohne Warnung über und liefern dann ein falsches Ergebnis.<\/span> <span class=\"sg\" data-s=\"3\">Wenn genug Speicher da ist, kann eine ganze Zahl so groß werden, wie du sie brauchst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das ist der genaue Wert, kein gerundeter.<\/span> <span class=\"sg\" data-s=\"1\">Das Gleiche gilt, wenn du große Zahlen multiplizierst.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel berechnet Raku die Fakultät von 50 genau:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst die Ziffern langer Zahlen mit Unterstrichen gruppieren.<\/span> <span class=\"sg\" data-s=\"1\">So sind sie in deinem Code leichter zu lesen.<\/span> <span class=\"sg\" data-s=\"2\">Der Compiler ignoriert die Unterstriche:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, wie man ganze Zahlen in anderen Zahlensystemen schreibt.<\/span> <span class=\"sg\" data-s=\"1\">Sie stellen auch einige nützliche Methoden für ganze Zahlen vor.<\/span><\/p>"]]},"nl":{"t":"Gehele getallen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt gehele getallen al vanaf het begin van de cursus gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Dit gedeelte bekijkt een paar van hun eigenschappen die niet meteen opvallen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De belangrijkste is dat gehele getallen in Raku <em>willekeurige precisie<\/em> hebben.<\/span> <span class=\"sg\" data-s=\"1\">Ze hebben geen vast aantal bytes.<\/span> <span class=\"sg\" data-s=\"2\">Ze lopen nooit stilletjes over en geven dus nooit een fout resultaat.<\/span> <span class=\"sg\" data-s=\"3\">Als er genoeg geheugen is, kan een geheel getal zo groot worden als je nodig hebt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit is de exacte waarde, geen afgeronde.<\/span> <span class=\"sg\" data-s=\"1\">Hetzelfde geldt als je grote getallen vermenigvuldigt.<\/span> <span class=\"sg\" data-s=\"2\">Raku berekent bijvoorbeeld de faculteit van 50 exact:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt de cijfers van lange getallen groeperen met underscores.<\/span> <span class=\"sg\" data-s=\"1\">Zo zijn ze makkelijker te lezen in je code.<\/span> <span class=\"sg\" data-s=\"2\">De compiler negeert de underscores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je gehele getallen in andere talstelsels schrijft.<\/span> <span class=\"sg\" data-s=\"1\">Ze behandelen ook een paar handige methoden voor gehele getallen.<\/span><\/p>"]]},"es":{"t":"Enteros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Has usado enteros desde el principio del curso.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección trata algunas de sus características que es fácil pasar por alto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La más importante es que los enteros en Raku tienen <em>precisión arbitraria<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">No tienen un número fijo de bytes.<\/span> <span class=\"sg\" data-s=\"2\">Nunca se desbordan en silencio ni dan un resultado incorrecto.<\/span> <span class=\"sg\" data-s=\"3\">Si hay suficiente memoria, un entero puede crecer tanto como necesites:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Este es el valor exacto, no uno redondeado.<\/span> <span class=\"sg\" data-s=\"1\">Lo mismo ocurre cuando multiplicas números grandes.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, Raku calcula el factorial de 50 de forma exacta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes agrupar los dígitos de los números largos con guiones bajos.<\/span> <span class=\"sg\" data-s=\"1\">Así son más fáciles de leer en tu código.<\/span> <span class=\"sg\" data-s=\"2\">El compilador ignora los guiones bajos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran cómo escribir enteros en otras bases numéricas.<\/span> <span class=\"sg\" data-s=\"1\">También presentan algunos métodos útiles para enteros.<\/span><\/p>"]]},"it":{"t":"Interi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Hai usato gli interi fin dall'inizio del corso.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione mostra alcune loro caratteristiche che è facile non notare.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La più importante è che gli interi in Raku hanno <em>precisione arbitraria<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Non hanno un numero fisso di byte.<\/span> <span class=\"sg\" data-s=\"2\">Non vanno mai in overflow in silenzio con un risultato sbagliato.<\/span> <span class=\"sg\" data-s=\"3\">Se c'è abbastanza memoria, un intero può crescere quanto ti serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo è il valore esatto, non un valore arrotondato.<\/span> <span class=\"sg\" data-s=\"1\">Lo stesso vale quando moltiplichi numeri grandi.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, Raku calcola in modo esatto il fattoriale di 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi raggruppare le cifre dei numeri lunghi con degli underscore.<\/span> <span class=\"sg\" data-s=\"1\">Così sono più facili da leggere nel tuo codice.<\/span> <span class=\"sg\" data-s=\"2\">Il compilatore ignora gli underscore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano come scrivere gli interi in altre basi numeriche.<\/span> <span class=\"sg\" data-s=\"1\">Presentano anche alcuni metodi utili per gli interi.<\/span><\/p>"]]},"lv":{"t":"Veseli skaitļi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Jūs esat lietojuši veselos skaitļus kopš paša kursa sākuma.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa aplūko dažas to īpašības, kuras ir viegli nepamanīt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vissvarīgākā ir tā, ka veselajiem skaitļiem Raku valodā ir <em>patvaļīga precizitāte<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tiem nav fiksēta baitu skaita.<\/span> <span class=\"sg\" data-s=\"2\">Tie nekad klusi nepārplūst un nedod nepareizu rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Ja pietiek atmiņas, vesels skaitlis var izaugt tik liels, cik jums vajag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī ir precīza vērtība, nevis noapaļota.<\/span> <span class=\"sg\" data-s=\"1\">Tas pats ir spēkā, kad jūs reizināt lielus skaitļus.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, Raku precīzi aprēķina 50 faktoriālu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat grupēt garu skaitļu ciparus ar pasvītrām.<\/span> <span class=\"sg\" data-s=\"1\">Tad tos ir vieglāk lasīt jūsu kodā.<\/span> <span class=\"sg\" data-s=\"2\">Kompilators pasvītras ignorē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamās tēmas parāda, kā rakstīt veselos skaitļus citās skaitīšanas sistēmās.<\/span> <span class=\"sg\" data-s=\"1\">Tās arī iepazīstina ar dažām noderīgām veselo skaitļu metodēm.<\/span><\/p>"]]},"ru":{"t":"Целые числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы используете целые числа с самого начала курса.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе мы рассмотрим некоторые их особенности, которые легко не заметить.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Самая важная из них — то, что целые числа в Raku имеют <em>произвольную точность<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">У них нет фиксированного количества байтов.<\/span> <span class=\"sg\" data-s=\"2\">Они никогда незаметно не переполняются и не дают неправильный результат.<\/span> <span class=\"sg\" data-s=\"3\">Если хватает памяти, целое число может расти до любого нужного размера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Это точное значение, а не округлённое.<\/span> <span class=\"sg\" data-s=\"1\">То же самое верно, когда вы умножаете большие числа.<\/span> <span class=\"sg\" data-s=\"2\">Например, Raku вычисляет факториал числа 50 точно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цифры длинных чисел можно разделять на группы с помощью подчёркиваний.<\/span> <span class=\"sg\" data-s=\"1\">Так их легче читать в коде.<\/span> <span class=\"sg\" data-s=\"2\">Компилятор не обращает внимания на подчёркивания:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как записывать целые числа в других системах счисления.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они знакомят с несколькими полезными методами для целых чисел.<\/span><\/p>"]]},"uk":{"t":"Цілі числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви користуєтеся цілими числами від самого початку курсу.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ розглядає деякі їхні властивості, які легко пропустити.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Найважливіша з них: цілі числа в Raku мають <em>довільну точність<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вони не мають фіксованої кількості байтів.<\/span> <span class=\"sg\" data-s=\"2\">Вони ніколи тихо не переповнюються й не дають неправильного результату.<\/span> <span class=\"sg\" data-s=\"3\">Якщо пам'яті досить, ціле число може зрости настільки, наскільки вам потрібно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це точне значення, а не округлене.<\/span> <span class=\"sg\" data-s=\"1\">Те саме відбувається, коли ви множите великі числа.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, Raku обчислює факторіал 50 точно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цифри довгих чисел можна групувати підкресленнями.<\/span> <span class=\"sg\" data-s=\"1\">Так їх легше читати у вашому коді.<\/span> <span class=\"sg\" data-s=\"2\">Компілятор ігнорує підкреслення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як записувати цілі числа в інших системах числення.<\/span> <span class=\"sg\" data-s=\"1\">Вони також знайомлять із кількома корисними методами цілих чисел.<\/span><\/p>"]]},"bg":{"t":"Цели числа","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Използвали сте цели числа от самото начало на курса.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел разглежда някои техни особености, които лесно се пропускат.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Най-важната от тях е, че целите числа в Raku имат <em>произволна точност<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Те нямат определен брой байтове.<\/span> <span class=\"sg\" data-s=\"2\">Никога не преливат тихо и не дават грешен резултат.<\/span> <span class=\"sg\" data-s=\"3\">Ако има достатъчно памет, цялото число може да расте колкото ви е нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това е точната стойност, а не закръглена.<\/span> <span class=\"sg\" data-s=\"1\">Същото важи, когато умножавате големи числа.<\/span> <span class=\"sg\" data-s=\"2\">Например Raku изчислява точно факториела на 50:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да групирате цифрите на дългите числа с долни черти.<\/span> <span class=\"sg\" data-s=\"1\">Така те се четат по-лесно в кода ви.<\/span> <span class=\"sg\" data-s=\"2\">Компилаторът не обръща внимание на долните черти:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да записвате цели числа в други бройни системи.<\/span> <span class=\"sg\" data-s=\"1\">Те представят и няколко полезни метода за цели числа.<\/span><\/p>"]]},"eo":{"t":"Entjeroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi uzas entjerojn jam de la komenco mem de la kurso.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio rigardas kelkajn iliajn trajtojn, kiujn oni facile ne rimarkas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La plej grava estas, ke entjeroj en Raku havas <em>arbitran precizecon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ili ne havas fiksan nombron da bajtoj.<\/span> <span class=\"sg\" data-s=\"2\">Ili neniam silente superfluas kaj donas malĝustan rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Se estas sufiĉe da memoro, entjero povas kreski tiom, kiom vi bezonas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas la ekzakta valoro, ne rondigita.<\/span> <span class=\"sg\" data-s=\"1\">La samo validas, kiam vi multiplikas grandajn nombrojn.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, Raku kalkulas la faktorialon de 50 ekzakte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas grupigi la ciferojn de longaj nombroj per substrekoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio faras ilin pli facile legeblaj en via kodo.<\/span> <span class=\"sg\" data-s=\"2\">La kompililo ignoras la substrekojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel skribi entjerojn en aliaj nombrobazoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ prezentas kelkajn utilajn metodojn de entjeroj.<\/span><\/p>"]]},"la":{"t":"Integri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Numeros integros ab ipso initio cursus adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio aliquas eorum proprietates inspicit quas facile non animadvertis.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Maxima proprietas est quod numeri integri in Raku <em>praecisionem arbitrariam<\/em> habent.<\/span> <span class=\"sg\" data-s=\"1\">Numerum fixum bytorum non habent.<\/span> <span class=\"sg\" data-s=\"2\">Numquam tacite superfluunt nec falsum eventum dant.<\/span> <span class=\"sg\" data-s=\"3\">Si satis memoriae est, numerus integer tam magnus crescere potest quam opus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 2 ** 100;\n# 1267650600228229401496703205376<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hic est valor exactus, non rotundatus.<\/span> <span class=\"sg\" data-s=\"1\">Idem verum est cum magnos numeros multiplicas.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, Raku factorialem numeri 50 exacte computat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $factorial = 1;\n$factorial = $factorial * $_ for 1..50;\nsay $factorial;\n# 30414093201713378043612608166064768844377641568960512000000000000<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Digitos longorum numerorum cum underscores in greges dividere potes.<\/span> <span class=\"sg\" data-s=\"1\">Sic eos in codice tuo facilius legis.<\/span> <span class=\"sg\" data-s=\"2\">Compilator underscores neglegit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 1_000_000; # 1000000<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proxima themata ostendunt quomodo numeros integros in aliis basibus numerorum scribas.<\/span> <span class=\"sg\" data-s=\"1\">Etiam aliquas methodos utiles numerorum integrorum tibi monstrant.<\/span><\/p>"]]}}}</script>
