 True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Der Operator <code>gcd<\/code> liefert den größten gemeinsamen Teiler von zwei Zahlen.<\/span> <span class=\"sg\" data-s=\"1\">Der Operator <code>lcm<\/code> liefert ihr kleinstes gemeinsames Vielfaches:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>abs<\/code> gibt den Absolutwert einer Zahl zurück.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>sign<\/code> gibt <code>-1<\/code>, <code>0<\/code> oder <code>1<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"2\">Das hängt davon ab, ob die Zahl negativ, null oder positiv ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"nl":{"t":"Methoden voor gehele getallen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gehele getallen hebben veel nuttige methoden en routines.<\/span> <span class=\"sg\" data-s=\"1\">Hier zijn er een paar die je vaak nodig hebt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>is-prime<\/code> controleert of een getal een priemgetal is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De operator <code>gcd<\/code> geeft de grootste gemene deler van twee getallen.<\/span> <span class=\"sg\" data-s=\"1\">De operator <code>lcm<\/code> geeft hun kleinste gemene veelvoud:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De methode <code>abs<\/code> geeft de absolute waarde van een getal terug.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>sign<\/code> geeft <code>-1<\/code>, <code>0<\/code> of <code>1<\/code> terug.<\/span> <span class=\"sg\" data-s=\"2\">Dat hangt ervan af of het getal negatief, nul of positief is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"es":{"t":"Métodos de enteros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Los enteros tienen muchos métodos y rutinas útiles.<\/span> <span class=\"sg\" data-s=\"1\">Aquí tienes algunos que vas a necesitar a menudo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>is-prime<\/code> comprueba si un número es primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El operador <code>gcd<\/code> da el máximo común divisor de dos números.<\/span> <span class=\"sg\" data-s=\"1\">El operador <code>lcm<\/code> da su mínimo común múltiplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18; # 6\nsay 4 lcm 6;   # 12<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El método <code>abs<\/code> devuelve el valor absoluto de un número.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>sign<\/code> devuelve <code>-1<\/code>, <code>0<\/code> o <code>1<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto depende de si el número es negativo, cero o positivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (-5).abs;  # 5\nsay (-5).sign; # -1\nsay 0.sign;    # 0<\/code><\/pre>"]]},"it":{"t":"Metodi degli interi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli interi hanno molti metodi e routine utili.<\/span> <span class=\"sg\" data-s=\"1\">Eccone alcuni che ti serviranno spesso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>is-prime<\/code> controlla se un numero è primo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 17.is-prime; # True\nsay 18.is-prime; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"
