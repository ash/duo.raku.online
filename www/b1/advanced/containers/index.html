<script type="application/json" id="page-data">{"u":"advanced/containers","n":354,"k":"section","pv":"advanced/dd/exercises/dump-a-hash/solution","nx":"advanced/scalar-containers","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Understanding Raku containers","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, containers keep data, but they are more than just variables.<\/span> <span class=\"sg\" data-s=\"1\">Their role and meaning go deeper and wider.<\/span> <span class=\"sg\" data-s=\"2\">This section is an overview of the container types that Raku gives you.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">It is important to understand the idea of containers.<\/span> <span class=\"sg\" data-s=\"1\">Without it, some programs may surprise you.<\/span> <span class=\"sg\" data-s=\"2\">Sometimes a program seems to use a scalar where you expected an array.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes it is the other way around.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Different containers can keep different kinds of data.<\/span> <span class=\"sg\" data-s=\"1\">The data can also differ in size, or even in the number of items.<\/span> <span class=\"sg\" data-s=\"2\">So each type of container has its own methods for working with its data.<\/span><\/p>"]]},"de":{"t":"Verständnis von Raku-Containern","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku speichern Container Daten, aber sie sind mehr als nur Variablen.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Rolle und Bedeutung gehen tiefer und weiter.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt gibt einen Überblick über die Containertypen, die Raku dir bietet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Es ist wichtig, die Idee der Container zu verstehen.<\/span> <span class=\"sg\" data-s=\"1\">Ohne sie können dich manche Programme überraschen.<\/span> <span class=\"sg\" data-s=\"2\">Manchmal scheint ein Programm einen Skalar zu verwenden, wo du ein Array erwartet hast.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal ist es umgekehrt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Verschiedene Container können verschiedene Arten von Daten speichern.<\/span> <span class=\"sg\" data-s=\"1\">Die Daten können sich auch in der Größe unterscheiden oder sogar in der Anzahl der Elemente.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb hat jeder Containertyp eigene Methoden, um mit seinen Daten zu arbeiten.<\/span><\/p>"]]},"nl":{"t":"Raku-containers begrijpen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku bewaren containers gegevens, maar ze zijn meer dan alleen variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Hun rol en betekenis gaan dieper en verder.<\/span> <span class=\"sg\" data-s=\"2\">Dit gedeelte geeft een overzicht van de containertypen die Raku je biedt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het is belangrijk om het idee van containers te begrijpen.<\/span> <span class=\"sg\" data-s=\"1\">Zonder dat kunnen sommige programma's je verrassen.<\/span> <span class=\"sg\" data-s=\"2\">Soms lijkt een programma een scalar te gebruiken waar je een array verwachtte.<\/span> <span class=\"sg\" data-s=\"3\">Soms is het andersom.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Verschillende containers kunnen verschillende soorten gegevens bewaren.<\/span> <span class=\"sg\" data-s=\"1\">De gegevens kunnen ook verschillen in grootte, of zelfs in het aantal items.<\/span> <span class=\"sg\" data-s=\"2\">Daarom heeft elk type container zijn eigen methoden om met zijn gegevens te werken.<\/span><\/p>"]]},"es":{"t":"Comprender los contenedores de Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, los contenedores guardan datos, pero son más que simples variables.<\/span> <span class=\"sg\" data-s=\"1\">Su papel y su significado son más profundos y amplios.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección es una visión general de los tipos de contenedores que Raku te ofrece.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Es importante entender la idea de los contenedores.<\/span> <span class=\"sg\" data-s=\"1\">Sin ella, algunos programas pueden sorprenderte.<\/span> <span class=\"sg\" data-s=\"2\">A veces un programa parece usar un escalar donde esperabas un arreglo.<\/span> <span class=\"sg\" data-s=\"3\">Otras veces pasa al revés.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diferentes contenedores pueden guardar diferentes tipos de datos.<\/span> <span class=\"sg\" data-s=\"1\">Los datos también pueden variar en tamaño, o incluso en el número de elementos.<\/span> <span class=\"sg\" data-s=\"2\">Por eso cada tipo de contenedor tiene sus propios métodos para trabajar con sus datos.<\/span><\/p>"]]},"it":{"t":"Comprendere i contenitori di Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku, i contenitori conservano i dati, ma sono più che semplici variabili.<\/span> <span class=\"sg\" data-s=\"1\">Il loro ruolo e il loro significato sono più profondi e più ampi.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione è una panoramica dei tipi di contenitori che Raku ti offre.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">È importante capire l'idea di contenitore.<\/span> <span class=\"sg\" data-s=\"1\">Senza di essa, alcuni programmi possono sorprenderti.<\/span> <span class=\"sg\" data-s=\"2\">A volte un programma sembra usare uno scalare dove ti aspettavi un array.<\/span> <span class=\"sg\" data-s=\"3\">A volte succede il contrario.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Contenitori diversi possono conservare tipi diversi di dati.<\/span> <span class=\"sg\" data-s=\"1\">I dati possono essere diversi anche nella dimensione, o persino nel numero di elementi.<\/span> <span class=\"sg\" data-s=\"2\">Così ogni tipo di contenitore ha i suoi metodi per lavorare con i suoi dati.<\/span><\/p>"]]},"lv":{"t":"Raku konteineru izpratne","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā konteineri glabā datus, bet tie ir kas vairāk nekā tikai mainīgie.<\/span> <span class=\"sg\" data-s=\"1\">To loma un nozīme ir dziļāka un plašāka.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa ir pārskats par konteineru veidiem, ko jums dod Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ir svarīgi saprast konteineru ideju.<\/span> <span class=\"sg\" data-s=\"1\">Bez tās dažas programmas var jūs pārsteigt.<\/span> <span class=\"sg\" data-s=\"2\">Dažreiz šķiet, ka programma izmanto skalāru tur, kur jūs gaidījāt masīvu.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz ir otrādi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažādi konteineri var glabāt dažādus datu veidus.<\/span> <span class=\"sg\" data-s=\"1\">Dati var atšķirties arī pēc izmēra vai pat pēc elementu skaita.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc katram konteinera veidam ir savas metodes darbam ar tā datiem.<\/span><\/p>"]]},"ru":{"t":"Понимание контейнеров Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku контейнеры хранят данные, но они — нечто большее, чем просто переменные.<\/span> <span class=\"sg\" data-s=\"1\">Их роль и смысл глубже и шире.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел — обзор типов контейнеров, которые вам даёт Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Важно понимать идею контейнеров.<\/span> <span class=\"sg\" data-s=\"1\">Без неё некоторые программы могут вас удивить.<\/span> <span class=\"sg\" data-s=\"2\">Иногда программа как будто использует скаляр там, где вы ждали массив.<\/span> <span class=\"sg\" data-s=\"3\">А иногда бывает наоборот.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Разные контейнеры могут хранить разные виды данных.<\/span> <span class=\"sg\" data-s=\"1\">Данные могут различаться и по размеру, и даже по числу элементов.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому у каждого типа контейнера есть свои методы для работы с его данными.<\/span><\/p>"]]},"uk":{"t":"Розуміння контейнерів Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku контейнери зберігають дані, але вони — більше, ніж просто змінні.<\/span> <span class=\"sg\" data-s=\"1\">Їхня роль і значення глибші й ширші.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ дає огляд типів контейнерів, які дає вам Raku.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Важливо розуміти ідею контейнерів.<\/span> <span class=\"sg\" data-s=\"1\">Без цього деякі програми можуть вас здивувати.<\/span> <span class=\"sg\" data-s=\"2\">Іноді програма ніби використовує скаляр там, де ви чекали масив.<\/span> <span class=\"sg\" data-s=\"3\">Іноді буває навпаки.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Різні контейнери можуть зберігати різні види даних.<\/span> <span class=\"sg\" data-s=\"1\">Дані можуть також відрізнятися розміром або навіть кількістю елементів.<\/span> <span class=\"sg\" data-s=\"2\">Тому кожен тип контейнера має власні методи для роботи зі своїми даними.<\/span><\/p>"]]},"bg":{"t":"Разбиране на Raku контейнери","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku контейнерите пазят данни, но те са нещо повече от обикновени променливи.<\/span> <span class=\"sg\" data-s=\"1\">Тяхната роля и значение са по-дълбоки и по-широки.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел дава общ преглед на типовете контейнери, които Raku ви предлага.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Важно е да разбирате идеята за контейнерите.<\/span> <span class=\"sg\" data-s=\"1\">Без нея някои програми могат да ви изненадат.<\/span> <span class=\"sg\" data-s=\"2\">Понякога програмата сякаш използва скалар там, където сте очаквали масив.<\/span> <span class=\"sg\" data-s=\"3\">Понякога е обратното.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Различните контейнери могат да пазят различни видове данни.<\/span> <span class=\"sg\" data-s=\"1\">Данните могат да се различават и по размер, и дори по броя на елементите.<\/span> <span class=\"sg\" data-s=\"2\">Затова всеки тип контейнер има свои методи за работа с данните си.<\/span><\/p>"]]},"eo":{"t":"Kompreno de Raku-ujoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En Raku, ujoj tenas datumojn, sed ili estas pli ol nur variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Ilia rolo kaj signifo estas pli profundaj kaj pli vastaj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio estas superrigardo de la ujtipoj, kiujn Raku donas al vi.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Gravas kompreni la ideon de ujoj.<\/span> <span class=\"sg\" data-s=\"1\">Sen ĝi, iuj programoj povas surprizi vin.<\/span> <span class=\"sg\" data-s=\"2\">Foje programo ŝajnas uzi skalaron, kie vi atendis tabelon.<\/span> <span class=\"sg\" data-s=\"3\">Foje estas inverse.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diversaj ujoj povas teni diversajn specojn de datumoj.<\/span> <span class=\"sg\" data-s=\"1\">La datumoj povas ankaŭ diferenci laŭ grandeco, aŭ eĉ laŭ la nombro de eroj.<\/span> <span class=\"sg\" data-s=\"2\">Do ĉiu ujtipo havas siajn proprajn metodojn por labori kun siaj datumoj.<\/span><\/p>"]]},"la":{"t":"Intellectus receptaculorum Raku","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku continentes data servant, sed plus sunt quam variabiles simplices.<\/span> <span class=\"sg\" data-s=\"1\">Munus et significatio eorum profundiora et latiora sunt.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio conspectum typorum continentium praebet quos Raku tibi dat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Magni momenti est ideam continentium intellegere.<\/span> <span class=\"sg\" data-s=\"1\">Sine ea, quaedam programmata tibi mira videri possunt.<\/span> <span class=\"sg\" data-s=\"2\">Interdum programma scalarem adhibere videtur ubi ordinem exspectabas.<\/span> <span class=\"sg\" data-s=\"3\">Interdum res contraria est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diversi continentes diversa genera datorum servare possunt.<\/span> <span class=\"sg\" data-s=\"1\">Data etiam magnitudine differre possunt, vel etiam numero elementorum.<\/span> <span class=\"sg\" data-s=\"2\">Itaque quisque typus continentis proprias methodos habet ad data sua tractanda.<\/span><\/p>"]]}}}</script>
