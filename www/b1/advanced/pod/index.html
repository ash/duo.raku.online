<script type="application/json" id="page-data">{"u":"advanced/pod","n":757,"k":"section","pv":"advanced/testing/exercises/test-a-list/solution","nx":"advanced/pod/pod-basics","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Documenting code","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku has a documentation markup that is built into the language.<\/span> <span class=\"sg\" data-s=\"1\">It is called <em>Pod<\/em>, or <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You write documentation directly in your source file with <code>=<\/code> directives.<\/span> <span class=\"sg\" data-s=\"3\">The compiler can show it as formatted text.<\/span> <span class=\"sg\" data-s=\"4\">It can also make it available to your program.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This section covers the basic Pod directives and the formatting codes for marking up text.<\/span> <span class=\"sg\" data-s=\"1\">It also shows how to get the documentation.<\/span> <span class=\"sg\" data-s=\"2\">You get it as formatted text with <code>raku --doc<\/code>, or as data through the <code>$=pod<\/code> variable.<\/span><\/p>"]]},"de":{"t":"Code dokumentieren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine Auszeichnungssprache für Dokumentation, die in die Sprache eingebaut ist.<\/span> <span class=\"sg\" data-s=\"1\">Sie heißt <em>Pod<\/em> oder <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Du schreibst die Dokumentation direkt in deine Quelldatei, mit <code>=<\/code>-Direktiven.<\/span> <span class=\"sg\" data-s=\"3\">Der Compiler kann sie als formatierten Text zeigen.<\/span> <span class=\"sg\" data-s=\"4\">Er kann sie auch deinem Programm zur Verfügung stellen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt die grundlegenden Pod-Direktiven und die Formatierungscodes zum Markieren von Text.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch, wie du an die Dokumentation kommst.<\/span> <span class=\"sg\" data-s=\"2\">Du bekommst sie als formatierten Text mit <code>raku --doc<\/code> oder als Daten über die Variable <code>$=pod<\/code>.<\/span><\/p>"]]},"nl":{"t":"Code documenteren","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een opmaaktaal voor documentatie die in de taal is ingebouwd.<\/span> <span class=\"sg\" data-s=\"1\">Die heet <em>Pod<\/em>, of <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft documentatie direct in je bronbestand met <code>=<\/code>-directieven.<\/span> <span class=\"sg\" data-s=\"3\">De compiler kan ze tonen als opgemaakte tekst.<\/span> <span class=\"sg\" data-s=\"4\">Hij kan ze ook beschikbaar maken voor je programma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit gedeelte behandelt de basisdirectieven van Pod en de opmaakcodes om tekst te markeren.<\/span> <span class=\"sg\" data-s=\"1\">Het laat ook zien hoe je de documentatie kunt opvragen.<\/span> <span class=\"sg\" data-s=\"2\">Je krijgt ze als opgemaakte tekst met <code>raku --doc<\/code>, of als gegevens via de variabele <code>$=pod<\/code>.<\/span><\/p>"]]},"es":{"t":"Documentar código","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku tiene un marcado de documentación que forma parte del lenguaje.<\/span> <span class=\"sg\" data-s=\"1\">Se llama <em>Pod<\/em>, o <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Escribes la documentación directamente en tu archivo fuente con directivas <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El compilador puede mostrarla como texto con formato.<\/span> <span class=\"sg\" data-s=\"4\">También puede hacerla accesible para tu programa.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata las directivas básicas de Pod y los códigos de formato para marcar texto.<\/span> <span class=\"sg\" data-s=\"1\">También muestra cómo obtener la documentación.<\/span> <span class=\"sg\" data-s=\"2\">La obtienes como texto con formato con <code>raku --doc<\/code>, o como datos a través de la variable <code>$=pod<\/code>.<\/span><\/p>"]]},"it":{"t":"Documentare il codice","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ha un markup per la documentazione che è integrato nel linguaggio.<\/span> <span class=\"sg\" data-s=\"1\">Si chiama <em>Pod<\/em>, o <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">La documentazione si scrive direttamente nel file sorgente, con le direttive <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il compilatore può mostrarla come testo formattato.<\/span> <span class=\"sg\" data-s=\"4\">Può anche renderla disponibile al programma.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta le direttive Pod di base e i codici di formattazione per marcare il testo.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche come ottenere la documentazione.<\/span> <span class=\"sg\" data-s=\"2\">Si può ottenere come testo formattato con <code>raku --doc<\/code>, oppure come dati attraverso la variabile <code>$=pod<\/code>.<\/span><\/p>"]]},"lv":{"t":"Koda dokumentēšana 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku ir dokumentācijas marķēšana, kas ir iebūvēta valodā.<\/span> <span class=\"sg\" data-s=\"1\">To sauc par <em>Pod<\/em> jeb <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Dokumentāciju jūs rakstāt tieši pirmkoda failā ar <code>=<\/code> direktīvām.<\/span> <span class=\"sg\" data-s=\"3\">Kompilators var to parādīt kā formatētu tekstu.<\/span> <span class=\"sg\" data-s=\"4\">Tas var arī padarīt to pieejamu jūsu programmai.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko Pod pamata direktīvas un formatēšanas kodus teksta iezīmēšanai.<\/span> <span class=\"sg\" data-s=\"1\">Tā arī parāda, kā iegūt dokumentāciju.<\/span> <span class=\"sg\" data-s=\"2\">To iegūst kā formatētu tekstu ar <code>raku --doc<\/code> vai kā datus caur mainīgo <code>$=pod<\/code>.<\/span><\/p>"]]},"ru":{"t":"Документирование кода","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">В Raku есть разметка для документации, которая встроена в сам язык.<\/span> <span class=\"sg\" data-s=\"1\">Она называется <em>Pod<\/em>, или <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вы пишете документацию прямо в исходном файле с помощью директив с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилятор может показать её как форматированный текст.<\/span> <span class=\"sg\" data-s=\"4\">Ещё он может сделать её доступной для вашей программы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В этом разделе описаны основные директивы Pod и коды форматирования для разметки текста.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает, как получить документацию.<\/span> <span class=\"sg\" data-s=\"2\">Её можно получить как форматированный текст с помощью <code>raku --doc<\/code> или как данные через переменную <code>$=pod<\/code>.<\/span><\/p>"]]},"uk":{"t":"Документування коду","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku має розмітку для документації, вбудовану в саму мову.<\/span> <span class=\"sg\" data-s=\"1\">Вона називається <em>Pod<\/em>, або <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете документацію просто у файлі з вихідним кодом за допомогою директив <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компілятор може показати її як форматований текст.<\/span> <span class=\"sg\" data-s=\"4\">Також він може зробити її доступною вашій програмі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей розділ охоплює основні директиви Pod і коди форматування для розмітки тексту.<\/span> <span class=\"sg\" data-s=\"1\">Також він показує, як отримати документацію.<\/span> <span class=\"sg\" data-s=\"2\">Ви отримуєте її як форматований текст через <code>raku --doc<\/code> або як дані через змінну <code>$=pod<\/code>.<\/span><\/p>"]]},"bg":{"t":"Документиране на код 🆕","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku има маркиращ синтаксис за документация, който е вграден в езика.<\/span> <span class=\"sg\" data-s=\"1\">Той се казва <em>Pod<\/em>, или <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Пишете документацията директно във вашия изходен файл чрез директиви с <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Компилаторът може да я покаже като форматиран текст.<\/span> <span class=\"sg\" data-s=\"4\">Може също да я направи достъпна за вашата програма.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този раздел обхваща основните Pod директиви и форматиращите кодове за маркиране на текст.<\/span> <span class=\"sg\" data-s=\"1\">Той показва също как да получите документацията.<\/span> <span class=\"sg\" data-s=\"2\">Получавате я като форматиран текст с <code>raku --doc<\/code> или като данни чрез променливата <code>$=pod<\/code>.<\/span><\/p>"]]},"eo":{"t":"Dokumentado de kodo","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku havas dokumentadan markadon, kiu estas enkonstruita en la lingvon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi nomiĝas <em>Pod<\/em>, aŭ <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas dokumentadon rekte en via fontdosiero per direktivoj <code>=<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La kompililo povas montri ĝin kiel formatitan tekston.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi ankaŭ povas fari ĝin disponebla al via programo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas la bazajn Pod-direktivojn kaj la formatajn kodojn por marki tekston.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras, kiel ricevi la dokumentadon.<\/span> <span class=\"sg\" data-s=\"2\">Vi ricevas ĝin kiel formatitan tekston per <code>raku --doc<\/code>, aŭ kiel datumojn per la variablo <code>$=pod<\/code>.<\/span><\/p>"]]},"la":{"t":"Codicem documentare","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Raku notationem documentationis habet quae in ipsa lingua inest.<\/span> <span class=\"sg\" data-s=\"1\">Appellatur <em>Pod<\/em>, vel <em>Rakudoc<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Documentationem directe in fonte tuo directivis <code>=<\/code> scribis.<\/span> <span class=\"sg\" data-s=\"3\">Compilator eam ut textum formatum ostendere potest.<\/span> <span class=\"sg\" data-s=\"4\">Etiam eam programmati tuo praebere potest.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec sectio directivas Pod fundamentales tractat et notas formationis quibus textum ornas.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendit quomodo documentationem accipias.<\/span> <span class=\"sg\" data-s=\"2\">Eam ut textum formatum cum <code>raku --doc<\/code> accipis, aut ut data per variabilem <code>$=pod<\/code>.<\/span><\/p>"]]}}}</script>
