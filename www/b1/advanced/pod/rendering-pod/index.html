<script type="application/json" id="page-data">{"u":"advanced/pod/rendering-pod","n":761,"k":"topic","pv":"advanced/pod/pod-formatting","nx":"advanced/pod/accessing-pod","tr":["advanced","advanced/pod"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Rendering Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When a file contains Pod, the compiler can turn it into formatted text.<\/span> <span class=\"sg\" data-s=\"1\">It does not need to run the program.<\/span> <span class=\"sg\" data-s=\"2\">For this, use the <code>--doc<\/code> option:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">For the earlier example with a heading and a paragraph, this prints something like:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lists and code blocks can be rendered too.<\/span> <span class=\"sg\" data-s=\"1\">Take this Pod as an example:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you render it with <code>raku --doc<\/code>, it prints:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each <code>=item<\/code> becomes a bullet point.<\/span> <span class=\"sg\" data-s=\"1\">The <code>=begin code … =end code<\/code> block is indented and shown exactly as it was written.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rendering to HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This can produce other formats as well.<\/span> <span class=\"sg\" data-s=\" <span class=\"sg\" data-s=\"0\">Ogni <code>=item<\/code> diventa un punto elenco.<\/span> <span class=\"sg\" data-s=\"1\">Il blocco <code>=begin code … =end code<\/code> viene indentato e mostrato esattamente come è stato scritto.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Rendering in HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In questo modo si possono produrre anche altri formati.<\/span> <span class=\"sg\" data-s=\"1\">Per l'HTML si installa una volta un modulo di formattazione, poi si indica il suo nome dopo <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ora proprio lo stesso documento esce come HTML.<\/span> <span class=\"sg\" data-s=\"1\">L'intestazione diventa un <code>&lt;h1&gt;<\/code>, e l'elenco diventa un <code>&lt;ul&gt;<\/code> di elementi <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Il blocco di codice diventa un <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo strumento mette tutto questo in una pagina HTML completa.<\/span> <span class=\"sg\" data-s=\"1\">La documentazione ufficiale di Raku su <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> è fatta così.<\/span> <span class=\"sg\" data-s=\"2\">Viene da file sorgente Pod.<\/span><\/p>"]]},"lv":{"t":"Pod renderēšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad failā ir Pod, kompilators var to pārvērst formatētā tekstā.<\/span> <span class=\"sg\" data-s=\"1\">Programma tam nav jāpalaiž.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izdarītu, izmantojiet opciju <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iepriekšējam piemēram ar virsrakstu un rindkopu tas izdrukā apmēram šo:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Var atveidot arī sarakstus un koda blokus.<\/span> <span class=\"sg\" data-s=\"1\">Ņemiet par piemēru šo Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jūs to atveidojat ar <code>raku --doc<\/code>, tas izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>=item<\/code> kļūst par punktu ar aizzīmi.<\/span> <span class=\"sg\" data-s=\"1\">Bloks <code>=begin code … =end code<\/code> tiek parādīts ar atkāpi un tieši tā, kā tas tika uzrakstīts.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Atveidošana HTML formātā<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šādi var iegūt arī citus formātus.<\/span> <span class=\"sg\" data-s=\"1\">HTML formātam jūs vienreiz instalējat atveidotāja moduli un pēc tam norādāt tā nosaukumu aiz <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tagad tieši tas pats dokuments iznāk kā HTML.<\/span> <span class=\"sg\" data-s=\"1\">Virsraksts kļūst par <code>&lt;h1&gt;<\/code>, un saraksts kļūst par <code>&lt;ul&gt;<\/code> ar <code>&lt;li&gt;<\/code> punktiem.<\/span> <span class=\"sg\" data-s=\"2\">Koda bloks kļūst par <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Rīks to ieliek pilnā HTML lappusē.<\/span> <span class=\"sg\" data-s=\"1\">Oficiālā Raku dokumentācija vietnē <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> tiek veidota tieši tā.<\/span> <span class=\"sg\" data-s=\"2\">Tā rodas no Pod pirmkoda failiem.<\/span><\/p>"]]},"ru":{"t":"Рендеринг Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Если в файле есть Pod, компилятор может превратить его в форматированный текст.<\/span> <span class=\"sg\" data-s=\"1\">Ему не нужно запускать программу.<\/span> <span class=\"sg\" data-s=\"2\">Для этого используйте опцию <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для прошлого примера с заголовком и абзацем это выведет что-то вроде:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списки и блоки кода тоже можно отрисовать.<\/span> <span class=\"sg\" data-s=\"1\">Возьмём для примера такой Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когда вы отрисуете его с помощью <code>raku --doc<\/code>, получится:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждый <code>=item<\/code> становится пунктом списка с маркером.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>=begin code … =end code<\/code> выводится с отступом и точно так, как он был написан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Отрисовка в HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так можно получать и другие форматы.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML нужно один раз установить модуль-форматтер, а потом указать его имя после <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Теперь точно тот же документ выводится как HTML.<\/span> <span class=\"sg\" data-s=\"1\">Заголовок становится элементом <code>&lt;h1&gt;<\/code>, а список — элементом <code>&lt;ul&gt;<\/code> из пунктов <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок кода становится элементом <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Инструмент помещает это в полную HTML-страницу.<\/span> <span class=\"sg\" data-s=\"1\">Так создаётся официальная документация Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Она получается из исходных файлов с Pod.<\/span><\/p>"]]},"uk":{"t":"Відображення Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли файл містить Pod, компілятор може перетворити його на форматований текст.<\/span> <span class=\"sg\" data-s=\"1\">Йому не треба запускати програму.<\/span> <span class=\"sg\" data-s=\"2\">Для цього використайте опцію <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Для попереднього прикладу із заголовком та абзацом це виводить приблизно таке:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списки й блоки коду теж можна відобразити.<\/span> <span class=\"sg\" data-s=\"1\">Візьмімо для прикладу такий Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви відображаєте його через <code>raku --doc<\/code>, він виводить:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>=item<\/code> стає пунктом із маркером.<\/span> <span class=\"sg\" data-s=\"1\">Блок <code>=begin code … =end code<\/code> отримує відступ і показується точно так, як його записано.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Відображення в HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так можна отримати й інші формати.<\/span> <span class=\"sg\" data-s=\"1\">Для HTML ви один раз встановлюєте модуль-форматувальник, а потім вказуєте його назву після <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тепер точно той самий документ виходить як HTML.<\/span> <span class=\"sg\" data-s=\"1\">Заголовок стає <code>&lt;h1&gt;<\/code>, а список стає <code>&lt;ul&gt;<\/code> із пунктів <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Блок коду стає <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Інструмент вкладає це в повну HTML-сторінку.<\/span> <span class=\"sg\" data-s=\"1\">Офіційну документацію Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> створюють саме так.<\/span> <span class=\"sg\" data-s=\"2\">Вона береться з вихідних файлів Pod.<\/span><\/p>"]]},"bg":{"t":"Рендериране на Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато файлът съдържа Pod, компилаторът може да го превърне във форматиран текст.<\/span> <span class=\"sg\" data-s=\"1\">Не е нужно да изпълнява програмата.<\/span> <span class=\"sg\" data-s=\"2\">За това използвайте опцията <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За по-ранния пример със заглавие и параграф това отпечатва нещо подобно на:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Списъците и кодовите блокове също могат да се визуализират.<\/span> <span class=\"sg\" data-s=\"1\">Вземете за пример този Pod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато го визуализирате с <code>raku --doc<\/code>, той отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>=item<\/code> става точка от списък.<\/span> <span class=\"sg\" data-s=\"1\">Блокът <code>=begin code … =end code<\/code> е с отстъп и се показва точно както е написан.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Визуализиране като HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така можете да получите и други формати.<\/span> <span class=\"sg\" data-s=\"1\">За HTML инсталирате веднъж форматиращ модул и после посочвате името му след <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сега точно същият документ излиза като HTML.<\/span> <span class=\"sg\" data-s=\"1\">Заглавието става <code>&lt;h1&gt;<\/code>, а списъкът става <code>&lt;ul&gt;<\/code> с елементи <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Кодовият блок става <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Инструментът слага това в цяла HTML страница.<\/span> <span class=\"sg\" data-s=\"1\">Официалната документация на Raku на <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> се прави точно така.<\/span> <span class=\"sg\" data-s=\"2\">Тя идва от изходни файлове с Pod.<\/span><\/p>"]]},"eo":{"t":"Bildigi Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam dosiero enhavas Pod, la kompililo povas ŝanĝi ĝin en formatitan tekston.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne bezonas ruli la programon.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, uzu la opcion <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por la pli frua ekzemplo kun titolo kaj alineo, tio presas ion kiel:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Oni povas bildigi ankaŭ listojn kaj kodblokojn.<\/span> <span class=\"sg\" data-s=\"1\">Prenu ĉi tiun Pod kiel ekzemplon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi bildigas ĝin per <code>raku --doc<\/code>, ĝi presas:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>=item<\/code> fariĝas bulpunkto.<\/span> <span class=\"sg\" data-s=\"1\">La bloko <code>=begin code … =end code<\/code> estas indentita kaj montrata ekzakte kiel ĝi estis skribita.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bildigi al HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio povas produkti ankaŭ aliajn formatojn.<\/span> <span class=\"sg\" data-s=\"1\">Por HTML, vi instalas formatilan modulon unufoje kaj poste donas ĝian nomon post <code>--doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nun ekzakte la sama dokumento eliras kiel HTML.<\/span> <span class=\"sg\" data-s=\"1\">La titolo fariĝas <code>&lt;h1&gt;<\/code>, kaj la listo fariĝas <code>&lt;ul&gt;<\/code> el eroj <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">La kodbloko fariĝas <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La ilo metas tion en kompletan HTML-paĝon.<\/span> <span class=\"sg\" data-s=\"1\">La oficiala dokumentado de Raku ĉe <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> estas farita tiel.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi venas el Pod-fontdosieroj.<\/span><\/p>"]]},"la":{"t":"Pod reddere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum fasciculus Pod continet, compilator eum in textum formatum vertere potest.<\/span> <span class=\"sg\" data-s=\"1\">Non necesse est programma exsequi.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc optione <code>--doc<\/code> utere:<\/span><\/p>"],["code",0,"<pre><code>raku --doc mymodule.raku<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pro exemplo superiore cum titulo et paragrapho hoc aliquid tale imprimit:<\/span><\/p>"],["code",0,"<pre><code>My Module\n\nThis module does something useful.<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Indices et trunci codicis quoque reddi possunt.<\/span> <span class=\"sg\" data-s=\"1\">Sume hunc Pod ut exemplum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Shopping list\n\nThings to buy:\n\n=item Apples\n=item Bread\n=item Cheese\n\nRun it like this:\n\n=begin code\nsay 'hello';\n=end code\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si eum cum <code>raku --doc<\/code> reddis, hoc imprimit:<\/span><\/p>"],["code",0,"<pre><code>Shopping list\n\nThings to buy:\n\n  * Apples\n\n  * Bread\n\n  * Cheese\n\nRun it like this:\n\n    say 'hello';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quodque <code>=item<\/code> punctum fit.<\/span> <span class=\"sg\" data-s=\"1\">Truncus <code>=begin code … =end code<\/code> cum incisura ostenditur, prorsus ut scriptus est.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Redditio in HTML<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc etiam alia formata producere potest.<\/span> <span class=\"sg\" data-s=\"1\">Pro HTML modulum formatoris semel installas et deinde nomen eius post <code>--doc<\/code> das:<\/span><\/p>"],["code",0,"<pre><code>zef install Pod::To::HTML\nraku --doc=HTML mymodule.raku &gt; mymodule.html<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nunc prorsus idem documentum ut HTML exit.<\/span> <span class=\"sg\" data-s=\"1\">Titulus fit <code>&lt;h1&gt;<\/code>, et index fit <code>&lt;ul&gt;<\/code> elementorum <code>&lt;li&gt;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Truncus codicis fit <code>&lt;pre&gt;<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-html\"><code>&lt;h1&gt;Shopping list&lt;/h1&gt;\n&lt;p&gt;Things to buy:&lt;/p&gt;\n&lt;ul&gt;\n  &lt;li&gt;Apples&lt;/li&gt;\n  &lt;li&gt;Bread&lt;/li&gt;\n  &lt;li&gt;Cheese&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Run it like this:&lt;/p&gt;\n&lt;pre class=\"pod-block-code\"&gt;say 'hello';&lt;/pre&gt;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Instrumentum hoc in paginam HTML integram ponit.<\/span> <span class=\"sg\" data-s=\"1\">Documentatio officialis Raku apud <a href=\"https://docs.raku.org\" target=\"_blank\" rel=\"noopener\">docs.raku.org<\/a> sic fit.<\/span> <span class=\"sg\" data-s=\"2\">Ex fontibus Pod venit.<\/span><\/p>"]]}}}</script>
