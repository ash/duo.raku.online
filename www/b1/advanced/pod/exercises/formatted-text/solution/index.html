є слово як жирне. Коли його відображають як простий текст, воно виглядає як звичайний текст. Але багатші формати показують його жирним.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> відображає Pod, але не виконує жодного коду програми.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щоб справді <em>побачити<\/em> жирний текст, відобразіть Pod у формат, який має стилі. Встановіть форматувальник, наприклад <code>Pod::To::HTML<\/code>, через <code>zef install Pod::To::HTML<\/code>. Потім запустіть <code>raku --doc=HTML formatted-text.raku<\/code>. Тепер слово виходить усередині елемента HTML <code>&lt;b&gt;<\/code>. Простий текстовий вивід <code>--doc<\/code> інший. Він не може показати жирний текст, коли потрапляє у файл чи канал.<\/span><\/li><\/ol>"]]},"bg":{"t":"Solution: Форматиран текст","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Стартирайте с <code>raku --doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> маркира думата като удебелена. Когато се визуализира като обикновен текст, тя изглежда като нормален текст. Но по-богатите формати я показват удебелена.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> визуализира Pod, но не изпълнява нищо от програмния код.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За да <em>видите<\/em> наистина удебеления текст, визуализирайте Pod във формат, който има стилове. Инсталирайте форматиращ модул, например <code>Pod::To::HTML<\/code>, със <code>zef install Pod::To::HTML<\/code>. След това изпълнете <code>raku --doc=HTML formatted-text.raku<\/code>. Сега думата излиза вътре в HTML елемент <code>&lt;b&gt;<\/code>. Обикновеният текстов изход от <code>--doc<\/code> е различен. Той не може да покаже удебелен текст, когато отива във файл или в тръба.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Formatita teksto","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rulita per <code>raku --doc<\/code>:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> markas la vorton kiel grasan. Kiam oni bildigas ĝin kiel simplan tekston, ĝi aspektas kiel ordinara teksto. Sed pli riĉaj formatoj montras ĝin grase.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> bildigas la Pod, sed ne rulas iun ajn programan kodon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Por vere <em>vidi<\/em> la grasan tekston, bildigu la Pod al formato, kiu havas stilojn. Instalu formatilon, ekzemple <code>Pod::To::HTML<\/code>, per <code>zef install Pod::To::HTML<\/code>. Poste rulu <code>raku --doc=HTML formatted-text.raku<\/code>. Nun la vorto eliras ene de HTML-elemento <code>&lt;b&gt;<\/code>. Simpla teksta eligo de <code>--doc<\/code> estas alia. Ĝi ne povas montri grasan tekston, kiam ĝi iras al dosiero aŭ dukto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Textum formatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Greeting\n\nHello, B&lt;world&gt;!\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Fontem codicis in fasciculo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/pod/formatted-text.raku\" target=\"_blank\" rel=\"noopener\">formatted-text.raku<\/a> invenire potes.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>raku --doc<\/code> exsequere:<\/span><\/p>"],["code",0,"<pre><code>Greeting\n\nHello, world!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>B&lt;world&gt;<\/code> verbum crassum notat. Cum ut textus simplex redditur, ut textus ordinarius apparet. Sed formata ditiora id crasse ostendunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>raku --doc<\/code> Pod reddit, sed nullum codicem programmatis exsequitur.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ut textum crassum vere <em>videas<\/em>, Pod in formatum redde quod ornamenta habet. Formatorem installa, ut <code>Pod::To::HTML<\/code>, per <code>zef install Pod::To::HTML<\/code>. Deinde <code>raku --doc=HTML formatted-text.raku<\/code> exsequere. Nunc verbum intra elementum HTML <code>&lt;b&gt;<\/code> exit. Exitus textualis simplex ex <code>--doc<\/code> alius est. Crassum ostendere non potest cum in fasciculum vel tubum it.<\/span><\/li><\/ol>"]]}}}</script>
