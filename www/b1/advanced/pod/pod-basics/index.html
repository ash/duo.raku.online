 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ene de la bloko, direktivoj priskribas la strukturon:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — titoloj de malsamaj niveloj<\/span><\/li><li><span class=\"sg\" data-s=\"1\">ordinara alineo — nur teksto sur propraj linioj<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — ero en listo kun bulpunktoj<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">La linio <code>=head1<\/code> estas supranivela titolo.<\/span> <span class=\"sg\" data-s=\"1\">La tri linioj <code>=item<\/code> faras liston.<\/span> <span class=\"sg\" data-s=\"2\">Pod sidas apud via kodo, sed ne ŝanĝas, kiel ĝi funkcias.<\/span> <span class=\"sg\" data-s=\"3\">La kompililo ignoras ĝin, kiam ĝi rulas la programon.<\/span> <span class=\"sg\" data-s=\"4\">Sed kiam vi petas, ĝi povas elpreni la Pod kaj bildigi ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Posta temo montras tion.<\/span><\/p>"]]},"la":{"t":"Fundamenta Pod","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Documentatio Pod in fonte tuo habitat.<\/span> <span class=\"sg\" data-s=\"1\">Lineae quae ab <code>=<\/code> incipiunt ostendunt ubi sit.<\/span> <span class=\"sg\" data-s=\"2\">Modus simplicissimus est eam inter <code>=begin pod<\/code> et <code>=end pod<\/code> scribere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 My Module\n\nThis module does something useful.\n\n=end pod<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Intra truncum directivae structuram describunt:<\/span><\/p>"],["list",3,"<ul><li><span class=\"sg\" data-s=\"0\"><code>=head1<\/code>, <code>=head2<\/code>, … — tituli diversorum graduum<\/span><\/li><li><span class=\"sg\" data-s=\"1\">paragraphus ordinarius — solum textus in lineis suis<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>=item<\/code> — elementum in indice cum punctis<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\n=head1 Features\n\n=item Fast\n=item Small\n=item Simple\n\n=end pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Linea <code>=head1<\/code> est titulus summi gradus.<\/span> <span class=\"sg\" data-s=\"1\">Tres lineae <code>=item<\/code> indicem faciunt.<\/span> <span class=\"sg\" data-s=\"2\">Pod iuxta codicem tuum stat, sed non mutat quomodo codex operetur.<\/span> <span class=\"sg\" data-s=\"3\">Compilator eum ignorat cum programma exsequitur.<\/span> <span class=\"sg\" data-s=\"4\">Sed cum rogas, Pod extrahere et reddere potest.<\/span> <span class=\"sg\" data-s=\"5\">Thema posterius hoc ostendit.<\/span><\/p>"]]}}}</script>
