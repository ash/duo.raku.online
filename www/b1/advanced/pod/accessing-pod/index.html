<script type="application/json" id="page-data">{"u":"advanced/pod/accessing-pod","n":762,"k":"topic","pv":"advanced/pod/rendering-pod","nx":"advanced/pod/exercises","tr":["advanced","advanced/pod"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Accessing the Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod can be shown as formatted text.<\/span> <span class=\"sg\" data-s=\"1\">But a program can also read its own Pod from <strong>inside<\/strong>, while it runs.<\/span> <span class=\"sg\" data-s=\"2\">The special variable <code>$=pod<\/code> holds the Pod of the current file.<\/span> <span class=\"sg\" data-s=\"3\">It is a list of block objects.<\/span> <span class=\"sg\" data-s=\"4\">So a program can look at its own documentation:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Here, <code>$=pod<\/code> has one element, the <code>pod<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">You can walk into it and read headings, paragraphs and items as data.<\/span> <span class=\"sg\" data-s=\"2\">Tools that generate documentation, or test that it exists, depend on this.<\/span> <span class=\"sg\" data-s=\"3\">The documentation can be shown with <code>--doc<\/code> or read through <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Either way, it is a full part of the program.<\/span> <span class=\"sg\" data-s=\"5\">It is not a comment to be thrown away.<\/span><\/p>"]]},"de":{"t":"Auf Pod zugreifen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod kann als formatierter Text angezeigt werden.<\/span> <span class=\"sg\" data-s=\"1\">Aber ein Programm kann sein eigenes Pod auch <strong>von innen<\/strong> lesen, während es läuft.<\/span> <span class=\"sg\" data-s=\"2\">Die spezielle Variable <code>$=pod<\/code> enthält das Pod der aktuellen Datei.<\/span> <span class=\"sg\" data-s=\"3\">Sie ist eine Liste von Block-Objekten.<\/span> <span class=\"sg\" data-s=\"4\">So kann ein Programm seine eigene Dokumentation ansehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier hat <code>$=pod<\/code> ein Element, den <code>pod<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"1\">Du kannst in ihn hineingehen und Überschriften, Absätze und Listenpunkte als Daten lesen.<\/span> <span class=\"sg\" data-s=\"2\">Werkzeuge brauchen das, wenn sie Dokumentation erzeugen oder testen, ob sie da ist.<\/span> <span class=\"sg\" data-s=\"3\">Die Dokumentation kann mit <code>--doc<\/code> angezeigt oder über <code>$=pod<\/code> gelesen werden.<\/span> <span class=\"sg\" data-s=\"4\">In beiden Fällen ist sie ein echter Teil des Programms.<\/span> <span class=\"sg\" data-s=\"5\">Sie ist kein Kommentar, der weggeworfen wird.<\/span><\/p>"]]},"nl":{"t":"Toegang tot de Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod kan getoond worden als opgemaakte tekst.<\/span> <span class=\"sg\" data-s=\"1\">Maar een programma kan zijn eigen Pod ook van <strong>binnenuit<\/strong> lezen, terwijl het draait.<\/span> <span class=\"sg\" data-s=\"2\">De speciale variabele <code>$=pod<\/code> bevat de Pod van het huidige bestand.<\/span> <span class=\"sg\" data-s=\"3\">Het is een lijst van blokobjecten.<\/span> <span class=\"sg\" data-s=\"4\">Zo kan een programma naar zijn eigen documentatie kijken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier heeft <code>$=pod<\/code> één element, het <code>pod<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt erin navigeren en koppen, alinea's en items als gegevens lezen.<\/span> <span class=\"sg\" data-s=\"2\">Tools die documentatie maken, of die testen of ze er is, hebben dit nodig.<\/span> <span class=\"sg\" data-s=\"3\">De documentatie kan getoond worden met <code>--doc<\/code> of gelezen worden via <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">In beide gevallen is ze een echt onderdeel van het programma.<\/span> <span class=\"sg\" data-s=\"5\">Ze is geen commentaar dat weggegooid wordt.<\/span><\/p>"]]},"es":{"t":"Acceder al Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">El Pod se puede mostrar como texto con formato.<\/span> <span class=\"sg\" data-s=\"1\">Pero un programa también puede leer su propio Pod <strong>desde dentro<\/strong>, mientras se ejecuta.<\/span> <span class=\"sg\" data-s=\"2\">La variable especial <code>$=pod<\/code> contiene el Pod del archivo actual.<\/span> <span class=\"sg\" data-s=\"3\">Es una lista de objetos de bloque.<\/span> <span class=\"sg\" data-s=\"4\">Así un programa puede mirar su propia documentación:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aquí, <code>$=pod<\/code> tiene un elemento, el bloque <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes recorrerlo y leer encabezados, párrafos y elementos como datos.<\/span> <span class=\"sg\" data-s=\"2\">Las herramientas que generan documentación, o que comprueban que existe, dependen de esto.<\/span> <span class=\"sg\" data-s=\"3\">La documentación se puede mostrar con <code>--doc<\/code> o leer a través de <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">En cualquier caso, es una parte completa del programa.<\/span> <span class=\"sg\" data-s=\"5\">No es un comentario que se descarta.<\/span><\/p>"]]},"it":{"t":"Accedere al Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il Pod si può mostrare come testo formattato.<\/span> <span class=\"sg\" data-s=\"1\">Ma un programma può anche leggere il proprio Pod <strong>dall'interno<\/strong>, mentre è in esecuzione.<\/span> <span class=\"sg\" data-s=\"2\">La variabile speciale <code>$=pod<\/code> contiene il Pod del file corrente.<\/span> <span class=\"sg\" data-s=\"3\">È una lista di oggetti blocco.<\/span> <span class=\"sg\" data-s=\"4\">Così un programma può esaminare la propria documentazione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Qui <code>$=pod<\/code> ha un solo elemento, il blocco <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si può navigare al suo interno e leggere intestazioni, paragrafi ed elementi come dati.<\/span> <span class=\"sg\" data-s=\"2\">Gli strumenti che generano documentazione, o che controllano che ci sia, si basano su questo.<\/span> <span class=\"sg\" data-s=\"3\">La documentazione si può mostrare con <code>--doc<\/code> o leggere attraverso <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">In entrambi i casi è una parte vera e propria del programma.<\/span> <span class=\"sg\" data-s=\"5\">Non è un commento da buttare via.<\/span><\/p>"]]},"lv":{"t":"Piekļuve Pod datiem","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod var parādīt kā formatētu tekstu.<\/span> <span class=\"sg\" data-s=\"1\">Bet programma var arī nolasīt savu Pod <strong>no iekšpuses<\/strong>, kamēr tā darbojas.<\/span> <span class=\"sg\" data-s=\"2\">Speciālais mainīgais <code>$=pod<\/code> satur pašreizējā faila Pod.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir bloku objektu saraksts.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc programma var apskatīt pati savu dokumentāciju:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>$=pod<\/code> satur vienu elementu, bloku <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat tajā ieiet un nolasīt virsrakstus, rindkopas un punktus kā datus.<\/span> <span class=\"sg\" data-s=\"2\">Uz to paļaujas rīki, kas veido dokumentāciju vai pārbauda, vai tā ir klāt.<\/span> <span class=\"sg\" data-s=\"3\">Dokumentāciju var parādīt ar <code>--doc<\/code> vai nolasīt caur <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Jebkurā gadījumā tā ir pilnvērtīga programmas daļa.<\/span> <span class=\"sg\" data-s=\"5\">Tā nav komentārs, kas jāizmet.<\/span><\/p>"]]},"ru":{"t":"Доступ к Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod можно показать как форматированный текст.<\/span> <span class=\"sg\" data-s=\"1\">Но программа может ещё и читать свой Pod <strong>изнутри<\/strong>, во время работы.<\/span> <span class=\"sg\" data-s=\"2\">Специальная переменная <code>$=pod<\/code> содержит Pod текущего файла.<\/span> <span class=\"sg\" data-s=\"3\">Это список блочных объектов.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому программа может просматривать свою документацию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь в <code>$=pod<\/code> один элемент — блок <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Вы можете пройти внутрь него и читать заголовки, абзацы и элементы как данные.<\/span> <span class=\"sg\" data-s=\"2\">На этом основаны инструменты, которые создают документацию или проверяют, что она есть.<\/span> <span class=\"sg\" data-s=\"3\">Документацию можно показать с помощью <code>--doc<\/code> или прочитать через <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">В обоих случаях она — полноценная часть программы.<\/span> <span class=\"sg\" data-s=\"5\">Это не комментарий, который просто выбрасывают.<\/span><\/p>"]]},"uk":{"t":"Доступ до Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod можна показати як форматований текст.<\/span> <span class=\"sg\" data-s=\"1\">Але програма також може читати свій Pod <strong>зсередини<\/strong>, під час виконання.<\/span> <span class=\"sg\" data-s=\"2\">Спеціальна змінна <code>$=pod<\/code> містить Pod поточного файлу.<\/span> <span class=\"sg\" data-s=\"3\">Це список об'єктів-блоків.<\/span> <span class=\"sg\" data-s=\"4\">Тож програма може переглянути власну документацію:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тут <code>$=pod<\/code> має один елемент, блок <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ви можете зайти в нього й читати заголовки, абзаци й пункти як дані.<\/span> <span class=\"sg\" data-s=\"2\">На це спираються інструменти, які створюють документацію або перевіряють, чи вона існує.<\/span> <span class=\"sg\" data-s=\"3\">Документацію можна показати через <code>--doc<\/code> або прочитати через <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Так чи інакше, вона — повноцінна частина програми.<\/span> <span class=\"sg\" data-s=\"5\">Це не коментар, який треба викинути.<\/span><\/p>"]]},"bg":{"t":"Достъп до Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod може да се покаже като форматиран текст.<\/span> <span class=\"sg\" data-s=\"1\">Но програмата може и да прочете собствения си Pod <strong>отвътре<\/strong>, докато се изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Специалната променлива <code>$=pod<\/code> съдържа Pod на текущия файл.<\/span> <span class=\"sg\" data-s=\"3\">Това е списък от блокови обекти.<\/span> <span class=\"sg\" data-s=\"4\">Така програмата може да разгледа собствената си документация:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тук <code>$=pod<\/code> има един елемент, блокът <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да влезете в него и да четете заглавия, параграфи и елементи като данни.<\/span> <span class=\"sg\" data-s=\"2\">На това разчитат инструментите, които създават документация или проверяват дали тя съществува.<\/span> <span class=\"sg\" data-s=\"3\">Документацията може да се покаже с <code>--doc<\/code> или да се прочете чрез <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">И в двата случая тя е истинска част от програмата.<\/span> <span class=\"sg\" data-s=\"5\">Тя не е коментар, който да се изхвърли.<\/span><\/p>"]]},"eo":{"t":"Aliri la Pod","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Oni povas montri Pod kiel formatitan tekston.<\/span> <span class=\"sg\" data-s=\"1\">Sed programo ankaŭ povas legi sian propran Pod de <strong>interne<\/strong>, dum ĝi ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">La speciala variablo <code>$=pod<\/code> tenas la Pod de la nuna dosiero.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas listo de blokobjektoj.<\/span> <span class=\"sg\" data-s=\"4\">Do programo povas rigardi sian propran dokumentadon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie <code>$=pod<\/code> havas unu elementon, la blokon <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas eniri ĝin kaj legi titolojn, alineojn kaj erojn kiel datumojn.<\/span> <span class=\"sg\" data-s=\"2\">Iloj, kiuj kreas dokumentadon aŭ testas, ke ĝi ekzistas, dependas de tio.<\/span> <span class=\"sg\" data-s=\"3\">Oni povas montri la dokumentadon per <code>--doc<\/code> aŭ legi ĝin per <code>$=pod<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiukaze ĝi estas plena parto de la programo.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi ne estas komento, kiun oni forĵetas.<\/span><\/p>"]]},"la":{"t":"Pod accedere","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Pod ut textus formatus ostendi potest.<\/span> <span class=\"sg\" data-s=\"1\">Sed programma etiam suum Pod <strong>ab intus<\/strong> legere potest, dum currit.<\/span> <span class=\"sg\" data-s=\"2\">Variabilis specialis <code>$=pod<\/code> Pod fasciculi praesentis continet.<\/span> <span class=\"sg\" data-s=\"3\">Est index obiectorum truncorum.<\/span> <span class=\"sg\" data-s=\"4\">Itaque programma suam documentationem inspicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n=head1 Hello\nA paragraph.\n=end pod\n\nsay $=pod.elems;      # 1\nsay $=pod[0].name;    # pod<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic <code>$=pod<\/code> unum elementum habet, truncum <code>pod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In eum descendere et titulos, paragraphos et elementa ut data legere potes.<\/span> <span class=\"sg\" data-s=\"2\">Instrumenta quae documentationem faciunt, vel probant eam adesse, ab hoc pendent.<\/span> <span class=\"sg\" data-s=\"3\">Documentatio cum <code>--doc<\/code> ostendi vel per <code>$=pod<\/code> legi potest.<\/span> <span class=\"sg\" data-s=\"4\">Utroque modo plena pars programmatis est.<\/span> <span class=\"sg\" data-s=\"5\">Non est commentarium quod abici debet.<\/span><\/p>"]]}}}</script>
