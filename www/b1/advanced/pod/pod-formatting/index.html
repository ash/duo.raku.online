<script type="application/json" id="page-data">{"u":"advanced/pod/pod-formatting","n":760,"k":"topic","pv":"advanced/pod/pod-basics/quiz","nx":"advanced/pod/rendering-pod","tr":["advanced","advanced/pod"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Formatting and code","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside Pod text, you mark up words with <em>formatting codes<\/em> of a single letter.<\/span> <span class=\"sg\" data-s=\"1\">You write the letter and then angle brackets around the text:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — bold<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — italic<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — code (with all letters of the same width)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — a link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">After rendering, <code>important<\/code> is shown in bold and <code>say<\/code> in a code font.<\/span> <span class=\"sg\" data-s=\"1\">Codes can go inside each other and be combined, so <code>B&lt;C&lt;say&gt;&gt;<\/code> is bold code.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need a whole block of code, not just a piece inside a line.<\/span> <span class=\"sg\" data-s=\"1\">Then use a code block with clear start and end lines, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">It keeps the text exactly as written:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The lines inside the code block are shown exactly as written.<\/span> <span class=\"sg\" data-s=\"1\">They are not read as Pod.<\/span> <span class=\"sg\" data-s=\"2\">With inline codes and code blocks together, Pod can document an API.<\/span> <span class=\"sg\" data-s=\"3\">It can have formatted text and examples that look like real, working code.<\/span> <span class=\"sg\" data-s=\"4\">All this stays next to the code that it describes.<\/span><\/p>"]]},"de":{"t":"Formatierung und Code","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Pod-Text markierst du Wörter mit <em>Formatierungscodes<\/em> aus einem einzigen Buchstaben.<\/span> <span class=\"sg\" data-s=\"1\">Du schreibst den Buchstaben und dann spitze Klammern um den Text:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — fett<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursiv<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — Code (alle Buchstaben haben die gleiche Breite)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ein Link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nach dem Rendern ist <code>important<\/code> fett und <code>say<\/code> in einer Code-Schrift.<\/span> <span class=\"sg\" data-s=\"1\">Codes kann man ineinander setzen und kombinieren, also ist <code>B&lt;C&lt;say&gt;&gt;<\/code> fetter Code.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal brauchst du einen ganzen Codeblock, nicht nur ein Stück in einer Zeile.<\/span> <span class=\"sg\" data-s=\"1\">Dann benutze einen Codeblock mit klaren Anfangs- und Endzeilen, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er behält den Text genau so, wie er geschrieben ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Die Zeilen im Codeblock werden genau so angezeigt, wie sie geschrieben sind.<\/span> <span class=\"sg\" data-s=\"1\">Sie werden nicht als Pod gelesen.<\/span> <span class=\"sg\" data-s=\"2\">Mit Inline-Codes und Codeblöcken zusammen kann Pod eine API dokumentieren.<\/span> <span class=\"sg\" data-s=\"3\">Es kann formatierten Text und Beispiele enthalten, die wie echter, funktionierender Code aussehen.<\/span> <span class=\"sg\" data-s=\"4\">All das steht direkt neben dem Code, den es beschreibt.<\/span><\/p>"]]},"nl":{"t":"Opmaak en code","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen Pod-tekst markeer je woorden met <em>opmaakcodes<\/em> van één letter.<\/span> <span class=\"sg\" data-s=\"1\">Je schrijft de letter en daarna punthaken rond de tekst:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — vet<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — cursief<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — code (met alle letters even breed)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — een link<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Na het renderen staat <code>important<\/code> vetgedrukt en <code>say<\/code> in een codelettertype.<\/span> <span class=\"sg\" data-s=\"1\">Codes kunnen in elkaar zitten en gecombineerd worden, dus <code>B&lt;C&lt;say&gt;&gt;<\/code> is vetgedrukte code.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Soms heb je een heel blok code nodig, niet alleen een stukje in een regel.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik dan een codeblok met een duidelijke begin- en eindregel, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Het bewaart de tekst precies zoals hij geschreven is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De regels in het codeblok worden precies getoond zoals ze geschreven zijn.<\/span> <span class=\"sg\" data-s=\"1\">Ze worden niet als Pod gelezen.<\/span> <span class=\"sg\" data-s=\"2\">Met inline codes en codeblokken samen kan Pod een API documenteren.<\/span> <span class=\"sg\" data-s=\"3\">Het kan opgemaakte tekst bevatten en voorbeelden die eruitzien als echte, werkende code.<\/span> <span class=\"sg\" data-s=\"4\">Dit alles blijft naast de code die het beschrijft.<\/span><\/p>"]]},"es":{"t":"Formato y código","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro del texto Pod, marcas las palabras con <em>códigos de formato<\/em> de una sola letra.<\/span> <span class=\"sg\" data-s=\"1\">Escribes la letra y luego paréntesis angulares alrededor del texto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — negrita<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — cursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — código (con todas las letras del mismo ancho)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un enlace<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después de renderizar, <code>important<\/code> se muestra en negrita y <code>say<\/code> en fuente de código.<\/span> <span class=\"sg\" data-s=\"1\">Los códigos pueden ir uno dentro de otro y combinarse, así que <code>B&lt;C&lt;say&gt;&gt;<\/code> es código en negrita.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas un bloque entero de código, no solo un trozo dentro de una línea.<\/span> <span class=\"sg\" data-s=\"1\">Entonces usa un bloque de código con líneas claras de inicio y de fin, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mantiene el texto exactamente como se escribió:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Las líneas dentro del bloque de código se muestran exactamente como se escribieron.<\/span> <span class=\"sg\" data-s=\"1\">No se leen como Pod.<\/span> <span class=\"sg\" data-s=\"2\">Con los códigos en línea y los bloques de código juntos, Pod puede documentar una API.<\/span> <span class=\"sg\" data-s=\"3\">Puede tener texto con formato y ejemplos que parecen código real que funciona.<\/span> <span class=\"sg\" data-s=\"4\">Todo esto se queda junto al código que describe.<\/span><\/p>"]]},"it":{"t":"Formattazione e codice","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">All'interno del testo Pod, le parole si marcano con <em>codici di formattazione<\/em> di una sola lettera.<\/span> <span class=\"sg\" data-s=\"1\">Si scrive la lettera e poi le parentesi angolari intorno al testo:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grassetto<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — corsivo<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codice (con tutte le lettere della stessa larghezza)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — un collegamento<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dopo il rendering, <code>important<\/code> appare in grassetto e <code>say<\/code> con un carattere per il codice.<\/span> <span class=\"sg\" data-s=\"1\">I codici possono stare uno dentro l'altro e si possono combinare, quindi <code>B&lt;C&lt;say&gt;&gt;<\/code> è codice in grassetto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte serve un intero blocco di codice, non solo un pezzo dentro una riga.<\/span> <span class=\"sg\" data-s=\"1\">Allora si usa un blocco di codice con righe chiare di inizio e di fine, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mantiene il testo esattamente come è scritto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Le righe all'interno del blocco di codice vengono mostrate esattamente come sono scritte.<\/span> <span class=\"sg\" data-s=\"1\">Non vengono lette come Pod.<\/span> <span class=\"sg\" data-s=\"2\">Con i codici in linea e i blocchi di codice insieme, il Pod può documentare un'API.<\/span> <span class=\"sg\" data-s=\"3\">Può avere testo formattato ed esempi che sembrano codice vero e funzionante.<\/span> <span class=\"sg\" data-s=\"4\">Tutto questo resta accanto al codice che descrive.<\/span><\/p>"]]},"lv":{"t":"Formatēšana un kods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pod tekstā jūs izceļat vārdus ar viena burta <em>formatēšanas kodiem<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs rakstāt burtu un pēc tam leņķa iekavas ap tekstu:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — treknraksts<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursīvs<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kods (visi burti ir vienādā platumā)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — saite<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc atveidošanas <code>important<\/code> ir redzams treknrakstā, bet <code>say<\/code> — koda fontā.<\/span> <span class=\"sg\" data-s=\"1\">Kodus var likt vienu otrā un apvienot, tāpēc <code>B&lt;C&lt;say&gt;&gt;<\/code> ir trekns kods.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums vajag veselu koda bloku, nevis tikai gabalu rindas iekšpusē.<\/span> <span class=\"sg\" data-s=\"1\">Tad izmantojiet koda bloku ar skaidrām sākuma un beigu rindām, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas saglabā tekstu tieši tā, kā tas uzrakstīts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Rindas koda bloka iekšpusē tiek parādītas tieši tā, kā uzrakstītas.<\/span> <span class=\"sg\" data-s=\"1\">Tās netiek lasītas kā Pod.<\/span> <span class=\"sg\" data-s=\"2\">Ar iekļautajiem kodiem un koda blokiem kopā Pod var dokumentēt API.<\/span> <span class=\"sg\" data-s=\"3\">Tajā var būt formatēts teksts un piemēri, kas izskatās pēc īsta, strādājoša koda.<\/span> <span class=\"sg\" data-s=\"4\">Tas viss paliek blakus kodam, ko tas apraksta.<\/span><\/p>"]]},"ru":{"t":"Форматирование и код","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри текста Pod вы размечаете слова однобуквенными <em>кодами форматирования<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вы пишете букву, а затем угловые скобки вокруг текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирный<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (все буквы одинаковой ширины)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ссылка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">После отрисовки <code>important<\/code> показан жирным шрифтом, а <code>say<\/code> — шрифтом для кода.<\/span> <span class=\"sg\" data-s=\"1\">Коды можно вкладывать друг в друга и сочетать, поэтому <code>B&lt;C&lt;say&gt;&gt;<\/code> — это жирный код.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда нужен целый блок кода, а не просто кусочек внутри строки.<\/span> <span class=\"sg\" data-s=\"1\">Тогда используйте блок кода с понятными строками начала и конца, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он сохраняет текст точно так, как он написан:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Строки внутри блока кода показываются точно так, как они написаны.<\/span> <span class=\"sg\" data-s=\"1\">Они не читаются как Pod.<\/span> <span class=\"sg\" data-s=\"2\">Вместе с кодами внутри строк и блоками кода Pod может описать API.<\/span> <span class=\"sg\" data-s=\"3\">В нём может быть форматированный текст и примеры, которые похожи на настоящий рабочий код.<\/span> <span class=\"sg\" data-s=\"4\">Всё это остаётся рядом с кодом, который оно описывает.<\/span><\/p>"]]},"uk":{"t":"Форматування та код","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У тексті Pod ви розмічуєте слова однолітерними <em>кодами форматування<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ви пишете літеру, а потім кутові дужки навколо тексту:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — жирний<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (усі літери однакової ширини)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — посилання<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після відображення <code>important<\/code> показано жирним, а <code>say<\/code> — шрифтом коду.<\/span> <span class=\"sg\" data-s=\"1\">Коди можна вкладати один в одного й поєднувати, тож <code>B&lt;C&lt;say&gt;&gt;<\/code> — це жирний код.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді вам потрібен цілий блок коду, а не лише шматок усередині рядка.<\/span> <span class=\"sg\" data-s=\"1\">Тоді використайте блок коду з чіткими рядками початку й кінця, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він зберігає текст точно так, як його записано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Рядки всередині блоку коду показано точно так, як їх записано.<\/span> <span class=\"sg\" data-s=\"1\">Їх не читають як Pod.<\/span> <span class=\"sg\" data-s=\"2\">Разом із кодами всередині рядків і блоками коду Pod може документувати API.<\/span> <span class=\"sg\" data-s=\"3\">Він може містити форматований текст і приклади, схожі на справжній робочий код.<\/span> <span class=\"sg\" data-s=\"4\">Усе це лежить поруч із кодом, який воно описує.<\/span><\/p>"]]},"bg":{"t":"Форматиране и код","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В Pod текста маркирате думи с еднобуквени <em>форматиращи кодове<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Пишете буквата, а след нея ъглови скоби около текста:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — удебелен<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — курсив<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — код (всички букви са с еднаква ширина)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — връзка<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След визуализиране <code>important<\/code> се показва удебелено, а <code>say<\/code> — с шрифт за код.<\/span> <span class=\"sg\" data-s=\"1\">Кодовете могат да се влагат един в друг и да се комбинират, така че <code>B&lt;C&lt;say&gt;&gt;<\/code> е удебелен код.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога ви трябва цял блок от код, а не само парче вътре в ред.<\/span> <span class=\"sg\" data-s=\"1\">Тогава използвайте кодов блок с ясни редове за начало и край, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той запазва текста точно както е написан:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Редовете вътре в кодовия блок се показват точно както са написани.<\/span> <span class=\"sg\" data-s=\"1\">Те не се четат като Pod.<\/span> <span class=\"sg\" data-s=\"2\">С кодовете в реда и кодовите блокове заедно Pod може да документира API.<\/span> <span class=\"sg\" data-s=\"3\">Той може да съдържа форматиран текст и примери, които приличат на истински, работещ код.<\/span> <span class=\"sg\" data-s=\"4\">Всичко това стои до кода, който описва.<\/span><\/p>"]]},"eo":{"t":"Formatado kaj kodo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ene de Pod-teksto vi markas vortojn per unuliteraj <em>formataj kodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Vi skribas la literon kaj poste angulajn krampojn ĉirkaŭ la teksto:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — grasa<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — kursiva<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — kodo (kun ĉiuj literoj de la sama larĝo)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — ligilo<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post bildigo, <code>important<\/code> aperas grase kaj <code>say<\/code> en koda tiparo.<\/span> <span class=\"sg\" data-s=\"1\">Oni povas meti kodojn unu en la alian kaj kombini ilin, do <code>B&lt;C&lt;say&gt;&gt;<\/code> estas grasa kodo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Foje vi bezonas tutan blokon de kodo, ne nur pecon en linio.<\/span> <span class=\"sg\" data-s=\"1\">Tiam uzu kodblokon kun klaraj komenca kaj fina linioj, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi konservas la tekston ekzakte kiel skribita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La linioj ene de la kodbloko aperas ekzakte kiel skribitaj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ne estas legataj kiel Pod.<\/span> <span class=\"sg\" data-s=\"2\">Kun entekstaj kodoj kaj kodblokoj kune, Pod povas dokumenti API-on.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi povas havi formatitan tekston kaj ekzemplojn, kiuj aspektas kiel vera, funkcianta kodo.<\/span> <span class=\"sg\" data-s=\"4\">Ĉio ĉi restas apud la kodo, kiun ĝi priskribas.<\/span><\/p>"]]},"la":{"t":"Formatio et codex","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Intra textum Pod verba <em>notis formationis<\/em> unius litterae ornas.<\/span> <span class=\"sg\" data-s=\"1\">Litteram scribis et deinde uncos angulares circa textum:<\/span><\/p>"],["list",4,"<ul><li><span class=\"sg\" data-s=\"0\"><code>B&lt;…&gt;<\/code> — crassum<\/span><\/li><li><span class=\"sg\" data-s=\"1\"><code>I&lt;…&gt;<\/code> — obliquum<\/span><\/li><li><span class=\"sg\" data-s=\"2\"><code>C&lt;…&gt;<\/code> — codex (cum omnibus litteris eiusdem latitudinis)<\/span><\/li><li><span class=\"sg\" data-s=\"3\"><code>L&lt;…&gt;<\/code> — nexus<\/span><\/li><\/ul>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nThis is B&lt;important&gt;, and C&lt;say&gt; is a built-in.\n\n=end pod<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post redditionem <code>important<\/code> crasse ostenditur et <code>say<\/code> litteris codicis.<\/span> <span class=\"sg\" data-s=\"1\">Notae aliae intra alias poni et componi possunt, itaque <code>B&lt;C&lt;say&gt;&gt;<\/code> est codex crassus.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum totum truncum codicis requiris, non solum partem intra lineam.<\/span> <span class=\"sg\" data-s=\"1\">Tum trunco codicis utere cum lineis initii et finis claris, <code>=begin code … =end code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Textum prorsus ut scriptus est servat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>=begin pod\n\nHere is how to call it:\n\n=begin code\nsay greet('world');\n=end code\n\n=end pod<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Lineae intra truncum codicis prorsus ut scriptae sunt ostenduntur.<\/span> <span class=\"sg\" data-s=\"1\">Ut Pod non leguntur.<\/span> <span class=\"sg\" data-s=\"2\">Cum notis in linea et truncis codicis Pod API documentare potest.<\/span> <span class=\"sg\" data-s=\"3\">Textum formatum habere potest et exempla quae vero codici operanti similia sunt.<\/span> <span class=\"sg\" data-s=\"4\">Haec omnia iuxta codicem manent quem describunt.<\/span><\/p>"]]}}}</script>
