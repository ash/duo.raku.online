<script type="application/json" id="page-data">{"u":"advanced/modules-basics/creating-modules","n":693,"k":"topic","pv":"advanced/modules-basics","nx":"advanced/modules-basics/creating-modules/quiz","tr":["advanced","advanced/modules-basics"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Creating modules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">When programs get bigger, it helps to split them into reusable pieces.<\/span> <span class=\"sg\" data-s=\"1\">A <em>module<\/em> is a unit of code in its own file.<\/span> <span class=\"sg\" data-s=\"2\">Other programs can load and use it.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A module file has the extension <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It begins with <code>unit module<\/code>, which gives the module its name.<\/span> <span class=\"sg\" data-s=\"2\">The subroutines inside are private by default.<\/span> <span class=\"sg\" data-s=\"3\">To share one with code that uses the module, mark it with the <code>is export<\/code> trait.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is a module in a file called <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>hello<\/code> subroutine has <code>is export<\/code>, so any program that uses the module can see it.<\/span> <span class=\"sg\" data-s=\"1\">Without <code>is export<\/code>, a subroutine would stay private to the module.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A module can also share data with <code>our<\/code> variables.<\/span> <span class=\"sg\" data-s=\"1\">Other code can reach them through the name of the module.<\/span> <span class=\"sg\" data-s=\"2\">To add a version number to <code>Greeting<\/code>, one more line in the file is enough:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Once this line is in <code>Greeting.rakumod<\/code>, the value is available as <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This works wherever the module is loaded.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next topics show <a href=\"/advanced/modules-basics/using-modules/\">how a program loads such a module<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">They also explain what exactly the program gets from it.<\/span><\/p>"]]},"de":{"t":"Module erstellen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Programme größer werden, hilft es, sie in wiederverwendbare Teile aufzuteilen.<\/span> <span class=\"sg\" data-s=\"1\">Ein <em>Modul<\/em> ist eine Code-Einheit in einer eigenen Datei.<\/span> <span class=\"sg\" data-s=\"2\">Andere Programme können es laden und benutzen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Moduldatei hat die Endung <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie beginnt mit <code>unit module<\/code>, das dem Modul seinen Namen gibt.<\/span> <span class=\"sg\" data-s=\"2\">Die Subroutinen darin sind standardmäßig privat.<\/span> <span class=\"sg\" data-s=\"3\">Um eine davon mit Code zu teilen, der das Modul benutzt, markiere sie mit dem Trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist ein Modul in einer Datei namens <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Subroutine <code>hello<\/code> hat <code>is export<\/code>, also kann jedes Programm sie sehen, das das Modul benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Ohne <code>is export<\/code> würde eine Subroutine privat im Modul bleiben.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Modul kann auch Daten mit <code>our<\/code>-Variablen teilen.<\/span> <span class=\"sg\" data-s=\"1\">Anderer Code kann sie über den Namen des Moduls erreichen.<\/span> <span class=\"sg\" data-s=\"2\">Um <code>Greeting<\/code> eine Versionsnummer zu geben, reicht eine weitere Zeile in der Datei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sobald diese Zeile in <code>Greeting.rakumod<\/code> steht, ist der Wert als <code>$Greeting::version<\/code> verfügbar.<\/span> <span class=\"sg\" data-s=\"1\">Das funktioniert überall, wo das Modul geladen wird.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, <a href=\"https://course.raku.org/de/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">wie ein Programm ein solches Modul lädt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sie erklären auch, was genau das Programm davon bekommt.<\/span><\/p>"]]},"nl":{"t":"Modules aanmaken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Als programma's groter worden, helpt het om ze op te splitsen in herbruikbare stukken.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>module<\/em> is een eenheid van code in een eigen bestand.<\/span> <span class=\"sg\" data-s=\"2\">Andere programma's kunnen hem laden en gebruiken.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een modulebestand heeft de extensie <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Het begint met <code>unit module<\/code>, dat de module zijn naam geeft.<\/span> <span class=\"sg\" data-s=\"2\">De subroutines erin zijn standaard privé.<\/span> <span class=\"sg\" data-s=\"3\">Om er een te delen met code die de module gebruikt, markeer je hem met de <code>is export<\/code>-eigenschap.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een module in een bestand met de naam <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De subroutine <code>hello<\/code> heeft <code>is export<\/code>, dus elk programma dat de module gebruikt, kan hem zien.<\/span> <span class=\"sg\" data-s=\"1\">Zonder <code>is export<\/code> zou een subroutine privé blijven binnen de module.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een module kan ook gegevens delen met <code>our<\/code>-variabelen.<\/span> <span class=\"sg\" data-s=\"1\">Andere code kan ze bereiken via de naam van de module.<\/span> <span class=\"sg\" data-s=\"2\">Om een versienummer aan <code>Greeting<\/code> toe te voegen, is één extra regel in het bestand genoeg:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zodra deze regel in <code>Greeting.rakumod<\/code> staat, is de waarde beschikbaar als <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dit werkt overal waar de module geladen is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien <a href=\"https://course.raku.org/nl/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">hoe een programma zo'n module laadt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ze leggen ook uit wat het programma er precies van krijgt.<\/span><\/p>"]]},"es":{"t":"Crear módulos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando los programas crecen, es útil dividirlos en piezas reutilizables.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>módulo<\/em> es una unidad de código en su propio archivo.<\/span> <span class=\"sg\" data-s=\"2\">Otros programas pueden cargarlo y usarlo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un archivo de módulo tiene la extensión <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Empieza con <code>unit module<\/code>, que le da su nombre al módulo.<\/span> <span class=\"sg\" data-s=\"2\">Las subrutinas de dentro son privadas por defecto.<\/span> <span class=\"sg\" data-s=\"3\">Para compartir una con el código que usa el módulo, márcala con el trait <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes un módulo en un archivo llamado <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subrutina <code>hello<\/code> tiene <code>is export<\/code>, así que cualquier programa que use el módulo puede verla.<\/span> <span class=\"sg\" data-s=\"1\">Sin <code>is export<\/code>, una subrutina seguiría siendo privada dentro del módulo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un módulo también puede compartir datos con variables <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Otro código puede acceder a ellas a través del nombre del módulo.<\/span> <span class=\"sg\" data-s=\"2\">Para añadir un número de versión a <code>Greeting<\/code>, basta con una línea más en el archivo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando esta línea está en <code>Greeting.rakumod<\/code>, el valor está disponible como <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto funciona en cualquier lugar donde se cargue el módulo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran <a href=\"https://course.raku.org/es/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">cómo un programa carga un módulo así<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">También explican qué obtiene exactamente el programa de él.<\/span><\/p>"]]},"it":{"t":"Creare moduli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando i programmi diventano più grandi, conviene dividerli in pezzi riutilizzabili.<\/span> <span class=\"sg\" data-s=\"1\">Un <em>modulo<\/em> è un'unità di codice in un proprio file.<\/span> <span class=\"sg\" data-s=\"2\">Altri programmi possono caricarlo e usarlo.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un file di modulo ha l'estensione <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Inizia con <code>unit module<\/code>, che dà il nome al modulo.<\/span> <span class=\"sg\" data-s=\"2\">Di base, le subroutine al suo interno sono private.<\/span> <span class=\"sg\" data-s=\"3\">Per condividerne una con il codice che usa il modulo, contrassegnala con il tratto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco un modulo in un file chiamato <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subroutine <code>hello<\/code> ha <code>is export<\/code>, quindi qualsiasi programma che usa il modulo può vederla.<\/span> <span class=\"sg\" data-s=\"1\">Senza <code>is export<\/code>, una subroutine resterebbe privata del modulo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un modulo può anche condividere dati con le variabili <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Altro codice può raggiungerle attraverso il nome del modulo.<\/span> <span class=\"sg\" data-s=\"2\">Per aggiungere un numero di versione a <code>Greeting<\/code>, basta una riga in più nel file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando questa riga è in <code>Greeting.rakumod<\/code>, il valore è disponibile come <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo funziona ovunque il modulo venga caricato.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano <a href=\"https://course.raku.org/it/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">come un programma carica un modulo di questo tipo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Spiegano anche cosa ottiene esattamente il programma dal modulo.<\/span><\/p>"]]},"lv":{"t":"Moduļu izveide","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad programmas kļūst lielākas, noder tās sadalīt atkārtoti izmantojamos gabalos.<\/span> <span class=\"sg\" data-s=\"1\">Koda vienību, kas glabājas savā failā, sauc par <em>moduli<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Citas programmas var to ielādēt un izmantot.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Moduļa failam ir paplašinājums <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas sākas ar <code>unit module<\/code>, kas dod modulim nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogrammas tajā pēc noklusējuma ir privātas.<\/span> <span class=\"sg\" data-s=\"3\">Lai kādu no tām kopīgotu ar kodu, kas izmanto moduli, atzīmējiet to ar iezīmi <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, modulis failā ar nosaukumu <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai <code>hello<\/code> ir <code>is export<\/code>, tāpēc to var redzēt jebkura programma, kas izmanto moduli.<\/span> <span class=\"sg\" data-s=\"1\">Bez <code>is export<\/code> apakšprogramma paliktu modulim privāta.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulis var koplietot arī datus, izmantojot <code>our<\/code> mainīgos.<\/span> <span class=\"sg\" data-s=\"1\">Cits kods tiem var piekļūt caur moduļa nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Lai modulim <code>Greeting<\/code> pievienotu versijas numuru, pietiek ar vēl vienu rindu failā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad šī rinda ir failā <code>Greeting.rakumod<\/code>, vērtība ir pieejama kā <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas darbojas visur, kur modulis ir ielādēts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, <a href=\"https://course.raku.org/lv/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kā programma ielādē šādu moduli<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī izskaidro, ko tieši programma no tā iegūst.<\/span><\/p>"]]},"ru":{"t":"Создание модулей","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда программы растут, их полезно делить на части, которые можно использовать снова.<\/span> <span class=\"sg\" data-s=\"1\">Единица кода в отдельном файле называется <em>модулем<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Другие программы могут загружать и использовать его.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файл модуля имеет расширение <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он начинается с <code>unit module<\/code>, и эта строка даёт модулю имя.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограммы внутри по умолчанию приватные.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы поделиться одной из них с кодом, который использует модуль, пометьте её трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот модуль в файле под названием <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У подпрограммы <code>hello<\/code> есть <code>is export<\/code>, поэтому её видит любая программа, которая использует модуль.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>is export<\/code> подпрограмма осталась бы приватной для модуля.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модуль также может делиться данными через переменные <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Другой код может обращаться к ним через имя модуля.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы добавить номер версии в <code>Greeting<\/code>, достаточно ещё одной строки в файле:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда эта строка есть в <code>Greeting.rakumod<\/code>, значение доступно как <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это работает везде, где загружен модуль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, <a href=\"https://course.raku.org/ru/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как программа загружает такой модуль<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они объясняют, что именно программа из него получает.<\/span><\/p>"]]},"uk":{"t":"Створення модулів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли програми ростуть, корисно розбити їх на частини, які можна використовувати знову.<\/span> <span class=\"sg\" data-s=\"1\">Кожен <em>модуль<\/em> — це одиниця коду в окремому файлі.<\/span> <span class=\"sg\" data-s=\"2\">Інші програми можуть завантажувати й використовувати його.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файл модуля має розширення <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він починається з <code>unit module<\/code>, що дає модулю ім'я.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограми всередині за замовчуванням приватні.<\/span> <span class=\"sg\" data-s=\"3\">Щоб поділитися однією з них із кодом, який використовує модуль, позначте її трейтом <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось модуль у файлі під назвою <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>hello<\/code> має <code>is export<\/code>, тож її бачить будь-яка програма, яка використовує модуль.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>is export<\/code> підпрограма лишилася б приватною для модуля.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модуль також може ділитися даними через змінні <code>our<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Інший код може дістатися до них через ім'я модуля.<\/span> <span class=\"sg\" data-s=\"2\">Щоб додати до <code>Greeting<\/code> номер версії, досить ще одного рядка у файлі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли цей рядок є в <code>Greeting.rakumod<\/code>, значення доступне як <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це працює всюди, де завантажено модуль.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, <a href=\"https://course.raku.org/uk/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">як програма завантажує такий модуль<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Також вони пояснюють, що саме програма від нього отримує.<\/span><\/p>"]]},"bg":{"t":"Създаване на модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато програмите станат по-големи, е полезно да ги разделите на части за повторна употреба.<\/span> <span class=\"sg\" data-s=\"1\">Всеки <em>модул<\/em> е единица код в собствен файл.<\/span> <span class=\"sg\" data-s=\"2\">Други програми могат да го заредят и използват.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Файлът на модула има разширение <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той започва с <code>unit module<\/code>, което дава името на модула.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмите вътре са частни по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">За да споделите някоя от тях с кода, който използва модула, маркирайте я с характеристиката <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето модул във файл с име <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата <code>hello<\/code> има <code>is export<\/code>, така че всяка програма, която използва модула, може да я вижда.<\/span> <span class=\"sg\" data-s=\"1\">Без <code>is export<\/code> една подпрограма би останала частна за модула.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Модулът може да споделя и данни чрез <code>our<\/code> променливи.<\/span> <span class=\"sg\" data-s=\"1\">Друг код може да достигне до тях чрез името на модула.<\/span> <span class=\"sg\" data-s=\"2\">За да добавите номер на версия към <code>Greeting<\/code>, стига още един ред във файла:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щом този ред е в <code>Greeting.rakumod<\/code>, стойността е достъпна като <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това работи навсякъде, където модулът е зареден.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват <a href=\"https://course.raku.org/bg/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">как програмата зарежда такъв модул<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Те обясняват и какво точно получава програмата от него.<\/span><\/p>"]]},"eo":{"t":"Krei modulojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam programoj fariĝas pli grandaj, helpas dividi ilin en reuzeblajn pecojn.<\/span> <span class=\"sg\" data-s=\"1\">La <em>modulo<\/em> estas unuo de kodo en sia propra dosiero.<\/span> <span class=\"sg\" data-s=\"2\">Aliaj programoj povas ŝargi kaj uzi ĝin.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Moduldosiero havas la finaĵon <code>.rakumod<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi komenciĝas per <code>unit module<\/code>, kiu donas al la modulo ĝian nomon.<\/span> <span class=\"sg\" data-s=\"2\">La subprogramoj interne estas defaŭlte privataj.<\/span> <span class=\"sg\" data-s=\"3\">Por kunhavi unu kun kodo, kiu uzas la modulon, marku ĝin per la trajto <code>is export<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen modulo en dosiero nomata <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La subprogramo <code>hello<\/code> havas <code>is export<\/code>, do ĉiu programo, kiu uzas la modulon, povas vidi ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Sen <code>is export<\/code>, subprogramo restus privata en la modulo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulo ankaŭ povas kunhavi datumojn per <code>our<\/code>-variabloj.<\/span> <span class=\"sg\" data-s=\"1\">Alia kodo povas atingi ilin per la nomo de la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Por aldoni numeron de versio al <code>Greeting<\/code>, sufiĉas unu plia linio en la dosiero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam ĉi tiu linio estas en <code>Greeting.rakumod<\/code>, la valoro estas disponebla kiel <code>$Greeting::version<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio funkcias ĉie, kie la modulo estas ŝargita.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras <a href=\"https://course.raku.org/eo/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">kiel programo ŝargas tian modulon<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ klarigas, kion precize la programo ricevas de ĝi.<\/span><\/p>"]]},"la":{"t":"Modulos creare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum programmata crescunt, iuvat ea in partes dividere quas iterum adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Unitas codicis in proprio archivo est <em>modulus<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Alia programmata eum onerare et adhibere possunt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Archivum moduli extensionem <code>.rakumod<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Incipit a <code>unit module<\/code>, quod modulo nomen dat.<\/span> <span class=\"sg\" data-s=\"2\">Subprogrammata intus ex more privata sunt.<\/span> <span class=\"sg\" data-s=\"3\">Ut unum cum codice communices qui modulo utitur, id proprietate <code>is export<\/code> nota.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce modulus in archivo nomine <code>Greeting.rakumod<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    return \"Hello, $name!\";\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subprogramma <code>hello<\/code> <code>is export<\/code> habet, itaque quodlibet programma quod modulo utitur id videre potest.<\/span> <span class=\"sg\" data-s=\"1\">Sine <code>is export<\/code>, subprogramma modulo privatum maneret.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulus etiam data per variabiles <code>our<\/code> communicare potest.<\/span> <span class=\"sg\" data-s=\"1\">Alius codex eas per nomen moduli attingere potest.<\/span> <span class=\"sg\" data-s=\"2\">Ut numerum versionis ad <code>Greeting<\/code> addas, una linea nova in archivo satis est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>our $version = '1.0';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum haec linea in <code>Greeting.rakumod<\/code> est, valor ut <code>$Greeting::version<\/code> praesto est.<\/span> <span class=\"sg\" data-s=\"1\">Hoc operatur ubicumque modulus oneratur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia ostendunt <a href=\"https://course.raku.org/la/advanced/modules-basics/using-modules/\" target=\"_blank\" rel=\"noopener\">quomodo programma talem modulum oneret<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Etiam explicant quid exacte programma ex eo accipiat.<\/span><\/p>"]]}}}</script>
