<script type="application/json" id="page-data">{"u":"advanced/modules-basics/importing","n":697,"k":"topic","pv":"advanced/modules-basics/using-modules/quiz","nx":"advanced/modules-basics/importing/quiz","tr":["advanced","advanced/modules-basics"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Importing","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can bring a module into a program in more than one way.<\/span> <span class=\"sg\" data-s=\"1\">The three statements <code>use<\/code>, <code>need<\/code> and <code>require<\/code> differ in <em>when<\/em> they load the module.<\/span> <span class=\"sg\" data-s=\"2\">They also differ in <em>what<\/em> they make available.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You have already seen <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It loads the module at compile time and imports its exported names.<\/span> <span class=\"sg\" data-s=\"2\">So you can call them directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> also loads the module at compile time.<\/span> <span class=\"sg\" data-s=\"1\">But it does <em>not<\/em> import the exported names.<\/span> <span class=\"sg\" data-s=\"2\">You can still reach its <code>our<\/code> variables through the module name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">After <code>need Greeting<\/code>, Raku would not recognise a plain <code>hello(...)<\/code>, because nothing was imported.<\/span> <span class=\"sg\" data-s=\"1\">Only the qualified names, such as <code>$Greeting::version<\/code>, are available.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> loads the module at <em>run time<\/em> instead of at compile time.<\/span> <span class=\"sg\" data-s=\"1\">This is useful when you only know at run time whether you need a module.<\/span> <span class=\"sg\" data-s=\"2\">For example, its name may come from user input.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Because the module is loaded at run time, nothing is imported automatically.<\/span> <span class=\"sg\" data-s=\"1\">To import symbols, list them in angle brackets after the name of the module.<\/span> <span class=\"sg\" data-s=\"2\">Then you can call them directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In everyday code, <code>use<\/code> is what you want.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> and <code>require<\/code> are there for less common cases.<\/span><\/p>"]]},"de":{"t":"Importieren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Du kannst ein Modul auf mehr als eine Weise in ein Programm bringen.<\/span> <span class=\"sg\" data-s=\"1\">Die drei Anweisungen <code>use<\/code>, <code>need<\/code> und <code>require<\/code> unterscheiden sich darin, <em>wann<\/em> sie das Modul laden.<\/span> <span class=\"sg\" data-s=\"2\">Sie unterscheiden sich auch darin, <em>was<\/em> sie verfügbar machen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du hast <code>use<\/code> schon gesehen.<\/span> <span class=\"sg\" data-s=\"1\">Es lädt das Modul zur Kompilierzeit und importiert seine exportierten Namen.<\/span> <span class=\"sg\" data-s=\"2\">Also kannst du sie direkt aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> lädt das Modul ebenfalls zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Aber es importiert die exportierten Namen <em>nicht<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Du erreichst seine <code>our<\/code>-Variablen trotzdem über den Modulnamen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nach <code>need Greeting<\/code> würde Raku ein einfaches <code>hello(...)<\/code> nicht erkennen, weil nichts importiert wurde.<\/span> <span class=\"sg\" data-s=\"1\">Nur die qualifizierten Namen, wie <code>$Greeting::version<\/code>, sind verfügbar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> lädt das Modul zur <em>Laufzeit<\/em> statt zur Kompilierzeit.<\/span> <span class=\"sg\" data-s=\"1\">Das ist nützlich, wenn du erst zur Laufzeit weißt, ob du ein Modul brauchst.<\/span> <span class=\"sg\" data-s=\"2\">Zum Beispiel kann sein Name aus einer Benutzereingabe kommen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Weil das Modul zur Laufzeit geladen wird, wird nichts automatisch importiert.<\/span> <span class=\"sg\" data-s=\"1\">Um Symbole zu importieren, liste sie in spitzen Klammern nach dem Namen des Moduls auf.<\/span> <span class=\"sg\" data-s=\"2\">Dann kannst du sie direkt aufrufen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Im alltäglichen Code ist <code>use<\/code> das, was du willst.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> und <code>require<\/code> sind für die selteneren Fälle da.<\/span><\/p>"]]},"nl":{"t":"Importeren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt een module op meer dan één manier in een programma laden.<\/span> <span class=\"sg\" data-s=\"1\">De drie statements <code>use<\/code>, <code>need<\/code> en <code>require<\/code> verschillen in <em>wanneer<\/em> ze de module laden.<\/span> <span class=\"sg\" data-s=\"2\">Ze verschillen ook in <em>wat<\/em> ze beschikbaar maken.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je hebt <code>use<\/code> al gezien.<\/span> <span class=\"sg\" data-s=\"1\">Het laadt de module tijdens het compileren en importeert de geëxporteerde namen.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze dus direct aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> laadt de module ook tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"1\">Maar het importeert de geëxporteerde namen <em>niet<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je bereikt de <code>our<\/code>-variabelen nog steeds via de naam van de module:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Na <code>need Greeting<\/code> zou Raku een gewone <code>hello(...)<\/code> niet herkennen, omdat er niets is geïmporteerd.<\/span> <span class=\"sg\" data-s=\"1\">Alleen de gekwalificeerde namen, zoals <code>$Greeting::version<\/code>, zijn beschikbaar.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> laadt de module tijdens de <em>uitvoering<\/em> in plaats van tijdens het compileren.<\/span> <span class=\"sg\" data-s=\"1\">Dat is handig als je pas tijdens de uitvoering weet of je een module nodig hebt.<\/span> <span class=\"sg\" data-s=\"2\">De naam kan bijvoorbeeld uit de invoer van de gebruiker komen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Omdat de module tijdens de uitvoering wordt geladen, wordt er niets automatisch geïmporteerd.<\/span> <span class=\"sg\" data-s=\"1\">Om symbolen te importeren, zet je ze tussen punthaken na de naam van de module.<\/span> <span class=\"sg\" data-s=\"2\">Dan kun je ze direct aanroepen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In dagelijkse code is <code>use<\/code> wat je wilt.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> en <code>require<\/code> zijn er voor minder gangbare gevallen.<\/span><\/p>"]]},"es":{"t":"Importar","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes traer un módulo a un programa de más de una forma.<\/span> <span class=\"sg\" data-s=\"1\">Las tres instrucciones <code>use<\/code>, <code>need<\/code> y <code>require<\/code> se diferencian en <em>cuándo<\/em> cargan el módulo.<\/span> <span class=\"sg\" data-s=\"2\">También se diferencian en <em>qué<\/em> ponen a disposición.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ya has visto <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carga el módulo en tiempo de compilación e importa sus nombres exportados.<\/span> <span class=\"sg\" data-s=\"2\">Así que puedes llamarlos directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> también carga el módulo en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Pero <em>no<\/em> importa los nombres exportados.<\/span> <span class=\"sg\" data-s=\"2\">Aun así, puedes acceder a sus variables <code>our<\/code> a través del nombre del módulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Después de <code>need Greeting<\/code>, Raku no reconocería un simple <code>hello(...)<\/code>, porque no se importó nada.<\/span> <span class=\"sg\" data-s=\"1\">Solo están disponibles los nombres calificados, como <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carga el módulo en <em>tiempo de ejecución<\/em> en lugar de en tiempo de compilación.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil cuando solo sabes en tiempo de ejecución si necesitas un módulo.<\/span> <span class=\"sg\" data-s=\"2\">Por ejemplo, su nombre puede venir de la entrada del usuario.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Como el módulo se carga en tiempo de ejecución, no se importa nada automáticamente.<\/span> <span class=\"sg\" data-s=\"1\">Para importar símbolos, escríbelos entre corchetes angulares después del nombre del módulo.<\/span> <span class=\"sg\" data-s=\"2\">Así puedes llamarlos directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En el código de cada día, <code>use<\/code> es lo que necesitas.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> y <code>require<\/code> están ahí para los casos menos comunes.<\/span><\/p>"]]},"it":{"t":"Importazione","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi portare un modulo in un programma in più di un modo.<\/span> <span class=\"sg\" data-s=\"1\">Le tre istruzioni <code>use<\/code>, <code>need<\/code> e <code>require<\/code> sono diverse per <em>quando<\/em> caricano il modulo.<\/span> <span class=\"sg\" data-s=\"2\">Sono diverse anche per <em>cosa<\/em> rendono disponibile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hai già visto <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Carica il modulo al momento della compilazione e importa i suoi nomi esportati.<\/span> <span class=\"sg\" data-s=\"2\">Così puoi chiamarli direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Anche <code>need<\/code> carica il modulo al momento della compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Ma <em>non<\/em> importa i nomi esportati.<\/span> <span class=\"sg\" data-s=\"2\">Puoi comunque raggiungere le sue variabili <code>our<\/code> attraverso il nome del modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dopo <code>need Greeting<\/code>, Raku non riconoscerebbe un semplice <code>hello(...)<\/code>, perché non è stato importato niente.<\/span> <span class=\"sg\" data-s=\"1\">Sono disponibili solo i nomi qualificati, come <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> carica il modulo a <em>tempo di esecuzione<\/em> invece che al momento della compilazione.<\/span> <span class=\"sg\" data-s=\"1\">Questo è utile quando sai solo durante l'esecuzione se ti serve un modulo.<\/span> <span class=\"sg\" data-s=\"2\">Per esempio, il suo nome può arrivare dall'input dell'utente.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Siccome il modulo viene caricato a tempo di esecuzione, niente viene importato automaticamente.<\/span> <span class=\"sg\" data-s=\"1\">Per importare dei simboli, elencali tra parentesi angolari dopo il nome del modulo.<\/span> <span class=\"sg\" data-s=\"2\">Poi puoi chiamarli direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nel codice di tutti i giorni, <code>use<\/code> è quello che ti serve.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> e <code>require<\/code> ci sono per i casi meno comuni.<\/span><\/p>"]]},"lv":{"t":"Importēšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Moduli programmā var ienest vairāk nekā vienā veidā.<\/span> <span class=\"sg\" data-s=\"1\">Trīs teikumi <code>use<\/code>, <code>need<\/code> un <code>require<\/code> atšķiras ar to, <em>kad<\/em> tie ielādē moduli.<\/span> <span class=\"sg\" data-s=\"2\">Tie atšķiras arī ar to, <em>ko<\/em> tie padara pieejamu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat redzējuši <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ielādē moduli kompilēšanas laikā un importē tā eksportētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat tos izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Arī <code>need<\/code> ielādē moduli kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Taču tas <em>neimportē<\/em> eksportētos nosaukumus.<\/span> <span class=\"sg\" data-s=\"2\">Tā <code>our<\/code> mainīgos jūs joprojām sasniedzat caur moduļa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc <code>need Greeting<\/code> Raku neatpazītu vienkāršu <code>hello(...)<\/code>, jo nekas netika importēts.<\/span> <span class=\"sg\" data-s=\"1\">Pieejami ir tikai kvalificētie nosaukumi, piemēram, <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ielādē moduli <em>izpildes laikā<\/em>, nevis kompilēšanas laikā.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder, kad tikai izpildes laikā uzzināt, vai jums vajag moduli.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, tā nosaukums var nākt no lietotāja ievades.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tā kā modulis tiek ielādēts izpildes laikā, nekas netiek importēts automātiski.<\/span> <span class=\"sg\" data-s=\"1\">Lai importētu simbolus, uzskaitiet tos leņķa iekavās aiz moduļa nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Tad jūs varat tos izsaukt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ikdienas kodā jums vajag <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> un <code>require<\/code> ir paredzēti retākiem gadījumiem.<\/span><\/p>"]]},"ru":{"t":"Импорт","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подключить модуль к программе можно не одним способом.<\/span> <span class=\"sg\" data-s=\"1\">Три инструкции, <code>use<\/code>, <code>need<\/code> и <code>require<\/code>, различаются тем, <em>когда<\/em> они загружают модуль.<\/span> <span class=\"sg\" data-s=\"2\">Ещё они различаются тем, <em>что<\/em> они делают доступным.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы уже видели <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он загружает модуль во время компиляции и импортирует его экспортированные имена.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому их можно вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> тоже загружает модуль во время компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Но он <em>не<\/em> импортирует экспортированные имена.<\/span> <span class=\"sg\" data-s=\"2\">До переменных <code>our<\/code> модуля всё равно можно добраться через имя модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">После <code>need Greeting<\/code> Raku не распознал бы простой вызов <code>hello(...)<\/code>, потому что ничего не было импортировано.<\/span> <span class=\"sg\" data-s=\"1\">Доступны только полные имена, такие как <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> загружает модуль <em>во время выполнения<\/em>, а не во время компиляции.<\/span> <span class=\"sg\" data-s=\"1\">Это полезно, когда только во время выполнения становится ясно, нужен ли модуль.<\/span> <span class=\"sg\" data-s=\"2\">Например, его имя может прийти из ввода пользователя.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Так как модуль загружается во время выполнения, ничего не импортируется автоматически.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы импортировать символы, перечислите их в угловых скобках после имени модуля.<\/span> <span class=\"sg\" data-s=\"2\">Тогда их можно вызывать напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В обычном коде вам нужен <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> и <code>require<\/code> существуют для более редких случаев.<\/span><\/p>"]]},"uk":{"t":"Імпортування","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Модуль можна внести в програму кількома способами.<\/span> <span class=\"sg\" data-s=\"1\">Три оператори <code>use<\/code>, <code>need<\/code> і <code>require<\/code> різняться тим, <em>коли<\/em> вони завантажують модуль.<\/span> <span class=\"sg\" data-s=\"2\">Також вони різняться тим, <em>що<\/em> вони роблять доступним.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви вже бачили <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він завантажує модуль під час компіляції й імпортує його експортовані імена.<\/span> <span class=\"sg\" data-s=\"2\">Тож їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> теж завантажує модуль під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Але він <em>не<\/em> імпортує експортованих імен.<\/span> <span class=\"sg\" data-s=\"2\">До його змінних <code>our<\/code> ви все одно дістаєтеся через ім'я модуля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Після <code>need Greeting<\/code> Raku не розпізнав би простий <code>hello(...)<\/code>, бо нічого не імпортовано.<\/span> <span class=\"sg\" data-s=\"1\">Доступні лише кваліфіковані імена, як-от <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> завантажує модуль <em>під час виконання<\/em>, а не під час компіляції.<\/span> <span class=\"sg\" data-s=\"1\">Це корисно, коли лише під час виконання стає відомо, чи потрібен модуль.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, його ім'я може ввести користувач.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Оскільки модуль завантажується під час виконання, нічого не імпортується автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Щоб імпортувати символи, перелічіть їх у кутових дужках після імені модуля.<\/span> <span class=\"sg\" data-s=\"2\">Тоді їх можна викликати напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У щоденному коді вам потрібен саме <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> і <code>require<\/code> існують для рідших випадків.<\/span><\/p>"]]},"bg":{"t":"Импортиране","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да внесете модул в програма по повече от един начин.<\/span> <span class=\"sg\" data-s=\"1\">Трите оператора <code>use<\/code>, <code>need<\/code> и <code>require<\/code> се различават по това <em>кога<\/em> зареждат модула.<\/span> <span class=\"sg\" data-s=\"2\">Те се различават и по това <em>какво<\/em> правят достъпно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вече сте виждали <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той зарежда модула по време на компилация и импортира експортираните му имена.<\/span> <span class=\"sg\" data-s=\"2\">Така можете да ги извиквате директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> също зарежда модула по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Но той <em>не<\/em> импортира експортираните имена.<\/span> <span class=\"sg\" data-s=\"2\">Все пак можете да достигнете до неговите <code>our<\/code> променливи чрез името на модула:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">След <code>need Greeting<\/code> Raku не би разпознал самостоятелно <code>hello(...)<\/code>, защото нищо не е импортирано.<\/span> <span class=\"sg\" data-s=\"1\">Достъпни са само квалифицираните имена, като <code>$Greeting::version<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> зарежда модула по <em>време на изпълнение<\/em>, вместо по време на компилация.<\/span> <span class=\"sg\" data-s=\"1\">Това е полезно, когато чак по време на изпълнение разбирате дали ви трябва модул.<\/span> <span class=\"sg\" data-s=\"2\">Например името му може да идва от това, което въвежда потребителят.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тъй като модулът се зарежда по време на изпълнение, нищо не се импортира автоматично.<\/span> <span class=\"sg\" data-s=\"1\">За да импортирате символи, изброете ги в ъглови скоби след името на модула.<\/span> <span class=\"sg\" data-s=\"2\">Тогава можете да ги извиквате директно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В ежедневния код <code>use<\/code> е това, което ви трябва.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> и <code>require<\/code> са за по-редки случаи.<\/span><\/p>"]]},"eo":{"t":"Importado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas alporti modulon en programon en pli ol unu maniero.<\/span> <span class=\"sg\" data-s=\"1\">La tri deklaroj <code>use<\/code>, <code>need<\/code> kaj <code>require<\/code> diferencas laŭ tio, <em>kiam<\/em> ili ŝargas la modulon.<\/span> <span class=\"sg\" data-s=\"2\">Ili ankaŭ diferencas laŭ tio, <em>kion<\/em> ili disponebligas.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi jam vidis <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ŝargas la modulon je kompiltempo kaj importas ĝiajn eksportitajn nomojn.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas voki ilin rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> ankaŭ ŝargas la modulon je kompiltempo.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĝi <em>ne<\/em> importas la eksportitajn nomojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi tamen povas atingi ĝiajn <code>our<\/code>-variablojn per la nomo de la modulo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post <code>need Greeting<\/code>, Raku ne rekonus simplan <code>hello(...)<\/code>, ĉar nenio estis importita.<\/span> <span class=\"sg\" data-s=\"1\">Nur la kvalifikitaj nomoj, kiel <code>$Greeting::version<\/code>, estas disponeblaj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> ŝargas la modulon je <em>rultempo<\/em> anstataŭ je kompiltempo.<\/span> <span class=\"sg\" data-s=\"1\">Tio utilas, kiam vi scias nur je rultempo, ĉu vi bezonas modulon.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, ĝia nomo povas veni de la enigo de la uzanto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉar la modulo estas ŝargata je rultempo, nenio estas importata aŭtomate.<\/span> <span class=\"sg\" data-s=\"1\">Por importi simbolojn, listigu ilin en angulaj krampoj post la nomo de la modulo.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi povas voki ilin rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">En ĉiutaga kodo, <code>use<\/code> estas tio, kion vi volas.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> kaj <code>require<\/code> ekzistas por malpli oftaj kazoj.<\/span><\/p>"]]},"la":{"t":"Importare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Modulum plus quam uno modo in programma adducere potes.<\/span> <span class=\"sg\" data-s=\"1\">Tria enuntiata <code>use<\/code>, <code>need<\/code> et <code>require<\/code> differunt in eo <em>quando<\/em> modulum onerent.<\/span> <span class=\"sg\" data-s=\"2\">Etiam differunt in eo <em>quid<\/em> praesto faciant.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>use<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Iam <code>use<\/code> vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Modulum tempore compilationis onerat et nomina eius exportata importat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ea directe vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>need<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>need<\/code> quoque modulum tempore compilationis onerat.<\/span> <span class=\"sg\" data-s=\"1\">Sed nomina exportata <em>non<\/em> importat.<\/span> <span class=\"sg\" data-s=\"2\">Variabiles eius <code>our<\/code> tamen per nomen moduli attingere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>need Greeting;\nsay $Greeting::version; # 1.0<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post <code>need Greeting<\/code>, Raku simplex <code>hello(...)<\/code> non agnosceret, quia nihil importatum est.<\/span> <span class=\"sg\" data-s=\"1\">Sola nomina qualificata, ut <code>$Greeting::version<\/code>, praesto sunt.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>require<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>require<\/code> modulum <em>tempore exsecutionis<\/em> potius quam tempore compilationis onerat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc utile est cum solum tempore exsecutionis scis an modulum requiras.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, nomen eius ab introitu utentis venire potest.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quia modulus tempore exsecutionis oneratur, nihil sponte importatur.<\/span> <span class=\"sg\" data-s=\"1\">Ut symbola importes, ea in uncis angularibus post nomen moduli enumera.<\/span> <span class=\"sg\" data-s=\"2\">Tum ea directe vocare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>require Greeting &lt;&amp;hello&gt;;\nsay hello('Anna'); # Hello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In codice cotidiano <code>use<\/code> est quod vis.<\/span> <span class=\"sg\" data-s=\"1\"><code>need<\/code> et <code>require<\/code> adsunt pro casibus rarioribus.<\/span><\/p>"]]}}}</script>
