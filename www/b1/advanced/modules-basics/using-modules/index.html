<script type="application/json" id="page-data">{"u":"advanced/modules-basics/using-modules","n":695,"k":"topic","pv":"advanced/modules-basics/creating-modules/quiz","nx":"advanced/modules-basics/using-modules/quiz","tr":["advanced","advanced/modules-basics"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Using modules","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">To use a module, load it with the <code>use<\/code> statement.<\/span> <span class=\"sg\" data-s=\"1\">After that, the names that the module exports are available.<\/span> <span class=\"sg\" data-s=\"2\">You can use them as if you had written them yourself.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is how a program uses the <code>Greeting.rakumod<\/code> file from the previous topic:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> was marked with <code>is export<\/code>, so the <code>use<\/code> statement makes it available.<\/span> <span class=\"sg\" data-s=\"1\">The program calls it directly:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku can find the module only if it is on the module search path.<\/span> <span class=\"sg\" data-s=\"1\">Your module file may be in the same directory as your program.<\/span> <span class=\"sg\" data-s=\"2\">In that case, tell Raku to look there with the <code>-I.<\/code> option.<\/span> <span class=\"sg\" data-s=\"3\">The dot means “the current directory”:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku finds installed modules automatically.<\/span> <span class=\"sg\" data-s=\"1\">They are covered later, in <a href=\"/advanced/installing-modules/\">Installing modules from the web<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">So you only need the <code>-I<\/code> option for modules next to your own program.<\/span><\/p>"]]},"de":{"t":"Module verwenden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Um ein Modul zu verwenden, lade es mit der <code>use<\/code>-Anweisung.<\/span> <span class=\"sg\" data-s=\"1\">Danach sind die Namen verfügbar, die das Modul exportiert.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst sie benutzen, als hättest du sie selbst geschrieben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">So benutzt ein Programm die Datei <code>Greeting.rakumod<\/code> aus dem vorigen Thema:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> wurde mit <code>is export<\/code> markiert, also macht die <code>use<\/code>-Anweisung sie verfügbar.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm ruft sie direkt auf:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku kann das Modul nur finden, wenn es im Modul-Suchpfad ist.<\/span> <span class=\"sg\" data-s=\"1\">Deine Moduldatei liegt vielleicht im selben Verzeichnis wie dein Programm.<\/span> <span class=\"sg\" data-s=\"2\">Dann sag Raku mit der Option <code>-I.<\/code>, dass es dort suchen soll.<\/span> <span class=\"sg\" data-s=\"3\">Der Punkt bedeutet „das aktuelle Verzeichnis“:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku findet installierte Module automatisch.<\/span> <span class=\"sg\" data-s=\"1\">Sie werden später behandelt, in <a href=\"https://course.raku.org/de/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Module aus dem Web installieren<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Also brauchst du die Option <code>-I<\/code> nur für Module, die neben deinem eigenen Programm liegen.<\/span><\/p>"]]},"nl":{"t":"Modules gebruiken","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een module te gebruiken, laad je hem met het <code>use<\/code>-statement.<\/span> <span class=\"sg\" data-s=\"1\">Daarna zijn de namen die de module exporteert beschikbaar.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt ze gebruiken alsof je ze zelf had geschreven.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zo gebruikt een programma het bestand <code>Greeting.rakumod<\/code> uit het vorige onderwerp:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> is gemarkeerd met <code>is export<\/code>, dus het <code>use<\/code>-statement maakt hem beschikbaar.<\/span> <span class=\"sg\" data-s=\"1\">Het programma roept hem direct aan:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku kan de module alleen vinden als hij op het modulezoekpad staat.<\/span> <span class=\"sg\" data-s=\"1\">Misschien staat je modulebestand in dezelfde map als je programma.<\/span> <span class=\"sg\" data-s=\"2\">Zeg in dat geval tegen Raku dat het daar moet zoeken, met de <code>-I.<\/code>-optie.<\/span> <span class=\"sg\" data-s=\"3\">De punt betekent \"de huidige map\":<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku vindt geïnstalleerde modules automatisch.<\/span> <span class=\"sg\" data-s=\"1\">Die worden later behandeld, in <a href=\"https://course.raku.org/nl/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Modules van het web installeren<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt de optie <code>-I<\/code> dus alleen nodig voor modules naast je eigen programma.<\/span><\/p>"]]},"es":{"t":"Usar módulos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Para usar un módulo, cárgalo con la instrucción <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después de eso, los nombres que exporta el módulo están disponibles.<\/span> <span class=\"sg\" data-s=\"2\">Puedes usarlos como si los hubieras escrito tú mismo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Así es como un programa usa el archivo <code>Greeting.rakumod<\/code> del tema anterior:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> está marcada con <code>is export<\/code>, así que la instrucción <code>use<\/code> la pone a disposición.<\/span> <span class=\"sg\" data-s=\"1\">El programa la llama directamente:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku solo puede encontrar el módulo si está en la ruta de búsqueda de módulos.<\/span> <span class=\"sg\" data-s=\"1\">Puede que tu archivo de módulo esté en el mismo directorio que tu programa.<\/span> <span class=\"sg\" data-s=\"2\">En ese caso, dile a Raku que busque ahí con la opción <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">El punto significa \"el directorio actual\":<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku encuentra los módulos instalados automáticamente.<\/span> <span class=\"sg\" data-s=\"1\">Los veremos más adelante, en <a href=\"https://course.raku.org/es/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Instalar módulos desde la web<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Así que solo necesitas la opción <code>-I<\/code> para los módulos que están junto a tu propio programa.<\/span><\/p>"]]},"it":{"t":"Usare moduli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Per usare un modulo, caricalo con l'istruzione <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dopo, i nomi che il modulo esporta sono disponibili.<\/span> <span class=\"sg\" data-s=\"2\">Puoi usarli come se li avessi scritti tu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco come un programma usa il file <code>Greeting.rakumod<\/code> dell'argomento precedente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> è stato contrassegnato con <code>is export<\/code>, quindi l'istruzione <code>use<\/code> lo rende disponibile.<\/span> <span class=\"sg\" data-s=\"1\">Il programma lo chiama direttamente:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku può trovare il modulo solo se è nel percorso di ricerca dei moduli.<\/span> <span class=\"sg\" data-s=\"1\">Il file del tuo modulo può essere nella stessa directory del tuo programma.<\/span> <span class=\"sg\" data-s=\"2\">In questo caso, di' a Raku di cercare lì con l'opzione <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Il punto significa \"la directory corrente\":<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku trova automaticamente i moduli installati.<\/span> <span class=\"sg\" data-s=\"1\">Ne parleremo più avanti, in <a href=\"https://course.raku.org/it/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Installare moduli dal web<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi l'opzione <code>-I<\/code> ti serve solo per i moduli accanto al tuo programma.<\/span><\/p>"]]},"lv":{"t":"Moduļu izmantošana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai izmantotu moduli, ielādējiet to ar teikumu <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam ir pieejami nosaukumi, ko modulis eksportē.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat tos izmantot tā, it kā jūs pats tos būtu uzrakstījis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lūk, kā programma izmanto failu <code>Greeting.rakumod<\/code> no iepriekšējā temata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> bija atzīmēta ar <code>is export<\/code>, tāpēc teikums <code>use<\/code> to padara pieejamu.<\/span> <span class=\"sg\" data-s=\"1\">Programma to izsauc tieši:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku var atrast moduli tikai tad, ja tas ir uz moduļu meklēšanas ceļa.<\/span> <span class=\"sg\" data-s=\"1\">Jūsu moduļa fails var atrasties tajā pašā direktorijā, kur jūsu programma.<\/span> <span class=\"sg\" data-s=\"2\">Tādā gadījumā lieciet Raku meklēt tur ar opciju <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Punkts nozīmē «pašreizējā direktorija»:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku atrod instalētos moduļus automātiski.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir aplūkoti vēlāk, sadaļā <a href=\"https://course.raku.org/lv/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Moduļu instalēšana no tīmekļa<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc opcija <code>-I<\/code> jums vajadzīga tikai moduļiem blakus jūsu paša programmai.<\/span><\/p>"]]},"ru":{"t":"Использование модулей","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы использовать модуль, загрузите его с помощью инструкции <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После этого имена, которые экспортирует модуль, становятся доступны.<\/span> <span class=\"sg\" data-s=\"2\">Их можно использовать так, как будто вы написали их сами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот как программа использует файл <code>Greeting.rakumod<\/code> из предыдущей темы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> помечена как <code>is export<\/code>, поэтому инструкция <code>use<\/code> делает её доступной.<\/span> <span class=\"sg\" data-s=\"1\">Программа вызывает её напрямую:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku может найти модуль, только если он есть в пути поиска модулей.<\/span> <span class=\"sg\" data-s=\"1\">Файл модуля может лежать в том же каталоге, что и ваша программа.<\/span> <span class=\"sg\" data-s=\"2\">В этом случае скажите Raku искать там с помощью опции <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Точка означает «текущий каталог»:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku находит установленные модули автоматически.<\/span> <span class=\"sg\" data-s=\"1\">О них мы расскажем позже, в разделе <a href=\"https://course.raku.org/ru/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Установка модулей из сети<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому опция <code>-I<\/code> нужна только для модулей, которые лежат рядом с вашей программой.<\/span><\/p>"]]},"uk":{"t":"Використання модулів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб скористатися модулем, завантажте його оператором <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Після цього імена, які модуль експортує, стають доступними.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете використовувати їх так, ніби написали їх самі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось як програма використовує файл <code>Greeting.rakumod<\/code> з попередньої теми:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> позначено як <code>is export<\/code>, тож оператор <code>use<\/code> робить її доступною.<\/span> <span class=\"sg\" data-s=\"1\">Програма викликає її напряму:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku може знайти модуль, лише якщо той є на шляху пошуку модулів.<\/span> <span class=\"sg\" data-s=\"1\">Ваш файл модуля може лежати в тому самому каталозі, що й програма.<\/span> <span class=\"sg\" data-s=\"2\">У такому разі скажіть Raku шукати там за допомогою опції <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Крапка означає «поточний каталог»:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku знаходить встановлені модулі автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Про них ідеться далі, у темі <a href=\"https://course.raku.org/uk/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Встановлення модулів із мережі<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Тож опція <code>-I<\/code> вам потрібна лише для модулів, які лежать поруч із вашою власною програмою.<\/span><\/p>"]]},"bg":{"t":"Използване на модули","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">За да използвате модул, заредете го с оператора <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">След това имената, които модулът експортира, са достъпни.<\/span> <span class=\"sg\" data-s=\"2\">Можете да ги използвате така, сякаш сте ги написали сами.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето как програмата използва файла <code>Greeting.rakumod<\/code> от предишната тема:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> беше маркирана с <code>is export<\/code>, така че операторът <code>use<\/code> я прави достъпна.<\/span> <span class=\"sg\" data-s=\"1\">Програмата я извиква директно:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku може да намери модула само ако той е в пътя за търсене на модули.<\/span> <span class=\"sg\" data-s=\"1\">Файлът на вашия модул може да е в същата директория като програмата ви.<\/span> <span class=\"sg\" data-s=\"2\">В този случай кажете на Raku да търси там с опцията <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Точката означава „текущата директория“:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku намира инсталираните модули автоматично.<\/span> <span class=\"sg\" data-s=\"1\">Те са описани по-късно, в <a href=\"https://course.raku.org/bg/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Инсталиране на модули от мрежата<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Затова опцията <code>-I<\/code> ви трябва само за модули, които са до вашата собствена програма.<\/span><\/p>"]]},"eo":{"t":"Uzi modulojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Por uzi modulon, ŝargu ĝin per la deklaro <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Post tio, la nomoj, kiujn la modulo eksportas, estas disponeblaj.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas uzi ilin, kvazaŭ vi mem skribus ilin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen kiel programo uzas la dosieron <code>Greeting.rakumod<\/code> el la antaŭa temo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> estis markita per <code>is export<\/code>, do la deklaro <code>use<\/code> faras ĝin disponebla.<\/span> <span class=\"sg\" data-s=\"1\">La programo vokas ĝin rekte:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku povas trovi la modulon nur, se ĝi estas sur la modula serĉvojo.<\/span> <span class=\"sg\" data-s=\"1\">Via moduldosiero eble estas en la sama dosierujo kiel via programo.<\/span> <span class=\"sg\" data-s=\"2\">En tiu kazo, diru al Raku serĉi tie per la opcio <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La punkto signifas \"la aktuala dosierujo\":<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku trovas instalitajn modulojn aŭtomate.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas priskribitaj poste, en <a href=\"https://course.raku.org/eo/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Instalado de moduloj el la reto<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Do vi bezonas la opcion <code>-I<\/code> nur por moduloj apud via propra programo.<\/span><\/p>"]]},"la":{"t":"Modulos utendo","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut modulo utaris, eum per enuntiatum <code>use<\/code> onera.<\/span> <span class=\"sg\" data-s=\"1\">Postea nomina quae modulus exportat praesto sunt.<\/span> <span class=\"sg\" data-s=\"2\">Eis uti potes ac si ea ipse scripsisses.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecce quomodo programma archivo <code>Greeting.rakumod<\/code> ex argumento superiore utitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;\n\nsay hello('Anna');<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> cum <code>is export<\/code> notatum est, itaque enuntiatum <code>use<\/code> id praesto facit.<\/span> <span class=\"sg\" data-s=\"1\">Programma id directe vocat:<\/span><\/p>"],["code",0,"<pre><code>Hello, Anna!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku modulum solum invenire potest si in semita quaesitionis modulorum est.<\/span> <span class=\"sg\" data-s=\"1\">Archivum moduli fortasse in eadem directoria est ac programma tuum.<\/span> <span class=\"sg\" data-s=\"2\">Hoc casu, Raku iube illic quaerere per optionem <code>-I.<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Punctum «directoriam currentem» significat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. program.raku\nHello, Anna!<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku modulos installatos sponte invenit.<\/span> <span class=\"sg\" data-s=\"1\">Postea tractantur, in <a href=\"https://course.raku.org/la/advanced/installing-modules/\" target=\"_blank\" rel=\"noopener\">Modulis ex rete installandis<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque optione <code>-I<\/code> tantum opus est pro modulis iuxta programma tuum.<\/span><\/p>"]]}}}</script>
