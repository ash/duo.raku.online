зка во время выполнения.<\/span> <span class=\"sg\" data-s=\"1\">Поместите <code>require<\/code> внутрь <code>sub MAIN<\/code> с флагом <code>--quiet<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так модуль загружается <em>только<\/em> тогда, когда приветствие действительно нужно.<\/span> <span class=\"sg\" data-s=\"3\">С <code>--quiet<\/code> программа печатает <code>Silence.<\/code> и вообще не трогает модуль.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если запустить её с модулем в пути поиска, программа печатает:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Завантаження під час виконання»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У вас є модуль <code>Greeting.rakumod<\/code>, який експортує підпрограму <code>hello<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Завантажте цей модуль через <code>require<\/code> замість <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тоді він завантажується <strong>під час виконання<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\"><code>require<\/code> не імпортує імен автоматично.<\/span> <span class=\"sg\" data-s=\"3\">Тож вам треба перелічити потрібний символ через <code>require Greeting &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Потім викличте <code>hello('Sam')<\/code> і виведіть результат.<\/span><\/p>"], &lt;&amp;hello&gt;;<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Poste voku <code>hello('Sam')<\/code> kaj presu la rezulton.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu tasko ankaŭ montras, por kio utilas ŝargado je rultempo.<\/span> <span class=\"sg\" data-s=\"1\">Metu la <code>require<\/code> en <code>sub MAIN<\/code> kun flago <code>--quiet<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiam la modulo estas ŝargata <em>nur<\/em>, kiam saluto estas vere bezonata.<\/span> <span class=\"sg\" data-s=\"3\">Kun <code>--quiet<\/code>, la programo presas <code>Silence.<\/code> kaj tute ne tuŝas la modulon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi rulas ĝin kun la modulo sur la serĉvojo, la programo presas:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/advanced/modules-basics/exercises/require-at-runtime/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Tempore exsecutionis onerare","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Modulum <code>Greeting.rakumod<\/code> habes, qui subprogramma <code>hello<\/code> exportat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name) is export {\n    \"Hello, $name!\"\n}<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Onera hunc modulum per <code>require<\/code> loco <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum <strong>tempore exsecutionis<\/strong> oneratur.<\/span> <span class=\"sg\" data-s=\"2\"><code>require<\/code> nomina sponte non importat.<\/span> <span class=\"sg\" data-s=\"3\">Itaque symbolum quod vis enumera
