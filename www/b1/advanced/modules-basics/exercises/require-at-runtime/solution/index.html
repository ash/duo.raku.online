\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> зарежда модула по време на изпълнение вместо по време на компилация. Сам по себе си той не импортира нищо. Затова Raku не би познал самостоятелно <code>hello<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Списъкът <code>&lt;&amp;hello&gt;<\/code> казва на <code>require<\/code> да импортира този един символ. Така след този оператор можете да извикате <code>hello('Sam')<\/code> директно и тя дава <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Точно <em>за това<\/em> е <code>require<\/code>. Тъй като работи по време на изпълнение, той може да бъде вътре в <code>if<\/code>. Когато подадете <code>--quiet<\/code>, този клон се прескача и модулът никога не се зарежда. <code>use<\/code> по време на компилация не би могъл да избегне зареждането му.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Ŝargi je rultempe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi ambaŭ fontdosierojn en la dosierujo <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> ŝargas la modulon je rultempo anstataŭ je kompiltempo. Per si mem, ĝi importas nenion. Tial Raku ne konus simplan <code>hello<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La listo <code>&lt;&amp;hello&gt;<\/code> diras al <code>require<\/code> importi tiun unu simbolon. Do post ĉi tiu instrukcio vi povas voki <code>hello('Sam')<\/code> rekte, kaj ĝi donas <code>Hello, Sam!<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jen <em>por kio<\/em> <code>require<\/code> servas. Ĉar ĝi funkcias je rultempo, ĝi povas esti en <code>if<\/code>. Kiam vi donas <code>--quiet<\/code>, tiu branĉo estas preterlasata, kaj la modulo neniam estas ŝargata. <code>use<\/code> je kompiltempo ne povus eviti ŝargi ĝin.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Tempore exsecutionis onerare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma, <code>require-import.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(Bool :$quiet) {\n    if $quiet {\n        say 'Silence.';\n    }\n    else {\n        require Greeting &lt;&amp;hello&gt;;\n        say hello('Sam');\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Utrumque archivum fontem in directoria <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/require-at-runtime\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/require-at-runtime<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. require-import.raku\nHello, Sam!\n\n$ raku -I. require-import.raku --quiet\nSilence.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>require<\/code> modulum tempore exsecutionis potius quam tempore compilationis onerat. Per se nihil importat. Ideo Raku simplex <code>hello<\/code> non agnosceret.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Index <code>&lt;&amp;hello&gt;<\/code> iubet <code>require<\/code> illud unum symbolum importare. Itaque post hoc enuntiatum <code>hello('Sam')<\/code> directe vocare potes, et id <code>Hello, Sam!<\/code> dat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ad hoc <code>require<\/code> <em>servit<\/em>. Quia tempore exsecutionis operatur, intra <code>if<\/code> esse potest. Cum <code>--quiet<\/code> das, ille ramus praetermittitur et modulus numquam oneratur. <code>use<\/code> tempore compilationis eum semper oneraret, nec hoc vitare posset.<\/span><\/li><\/ol>"]]}}}</script>
