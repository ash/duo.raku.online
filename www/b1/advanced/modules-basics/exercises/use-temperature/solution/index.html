 programo povas voki ĝin rekte.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>sub MAIN($celsius)<\/code> ricevas la komandlinian argumenton. Do vi elektas la temperaturon, kiam vi rulas la programon. Ĝi ne estas skribita en la kodo. Se vi rulas la programon sen argumento, Raku aŭtomate presas uzad-mesaĝon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Raku devas povi trovi la modulon. Tial vi rulas la programon per <code>-I.<\/code>. Tiam Raku serĉas <code>Temperature.rakumod<\/code> en la nuna dosierujo. La konverto de <code>100<\/code> °C donas <code>212<\/code> °F.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Convertorem utere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma, <code>temperature.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Temperature;\n\nsub MAIN($celsius) {\n    say c-to-f($celsius);\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Utrumque archivum fontem in directoria <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/use-temperature\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/use-temperature<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. temperature.raku 100\n212<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>use Temperature<\/code> modulum onerat et eius subprogramma exportatum <code>c-to-f<\/code> importat. Itaque programma id directe vocare potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>sub MAIN($celsius)<\/code> argumentum lineae imperandi accipit. Itaque temperaturam
