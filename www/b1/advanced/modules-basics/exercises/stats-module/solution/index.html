n samtempe. <code>use<\/code> importas ĉion, kion la modulo markas per <code>is export<\/code>, ne nur unu nomon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mean<\/code> vokas <code>total<\/code> ene de la modulo. Por ricevi la mezumon, la programo mem ne vokas <code>total<\/code>, sed ĝi tamen funkcias. La subrutinoj de modulo povas dependi unu de la alia. La vokanto vidas nur la eksportitajn nomojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La kvar nombroj sumiĝas al <code>100<\/code>, do la mezumo estas <code>100 / 4<\/code>, kio estas <code>25<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Modulum statisticum utere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma, <code>stats.raku<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Stats;\n\nmy @scores = 10, 20, 30, 40;\n\nsay \"total: { total(@scores) }\";\nsay \"mean: { mean(@scores) }\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Utrumque archivum fontem in directoria <a href=\"https://github.com/ash/raku-course/tree/master/exercises/advanced/modules-basics/stats-module\" target=\"_blank\" rel=\"noopener\">exercises/advanced/modules-basics/stats-module<\/a> invenies.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre class=\"lang-console\"><code>$ raku -I. stats.raku\ntotal: 100\nmean: 25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Unum <code>use Stats<\/code> <em>utrumque<\/em> subprogramma exportatum simul adducit. <code>use<\/code> omnia importat quae modulus <code>is export<\/code> notat, non unum solum nomen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mean<\/code> intra modulum <code>total<\/code> vocat. Ut medium accipiat, programma ipsum <code>total<\/code> non vocat, sed tamen operatur. Subprogrammata moduli inter se niti possunt. Vocans sola nomina exportata videt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quattuor numeri <code>100<\/code> efficiunt, itaque medium est <code>100 / 4<\/code>, id est <code>25<\/code>.<\/span><\/li><\/ol>"]]}}}</script>
