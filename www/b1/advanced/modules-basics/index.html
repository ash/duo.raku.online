<script type="application/json" id="page-data">{"u":"advanced/modules-basics","n":692,"k":"section","pv":"advanced/anonymous-subroutines/quiz","nx":"advanced/modules-basics/creating-modules","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Modules basics","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">A <em>module<\/em> is a file of code that you can use again and again.<\/span> <span class=\"sg\" data-s=\"1\">It holds subroutines, variables and more, and other programs can load and share it.<\/span> <span class=\"sg\" data-s=\"2\">This section covers the basics in three steps.<\/span> <span class=\"sg\" data-s=\"3\">First, you will see how to <strong>write<\/strong> a module and mark what it offers.<\/span> <span class=\"sg\" data-s=\"4\">Then you will see how a program <strong>loads<\/strong> it with <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Finally, you will see how <strong>importing<\/strong> brings the names of a module into your scope.<\/span><\/p>"]]},"de":{"t":"Modul-Grundlagen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein <em>Modul<\/em> ist eine Datei mit Code, den du immer wieder benutzen kannst.<\/span> <span class=\"sg\" data-s=\"1\">Es enthält Subroutinen, Variablen und mehr, und andere Programme können es laden und teilen.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Abschnitt behandelt die Grundlagen in drei Schritten.<\/span> <span class=\"sg\" data-s=\"3\">Zuerst siehst du, wie du ein Modul <strong>schreibst<\/strong> und markierst, was es anbietet.<\/span> <span class=\"sg\" data-s=\"4\">Dann siehst du, wie ein Programm es mit <code>use<\/code> <strong>lädt<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Zum Schluss siehst du, wie das <strong>Importieren<\/strong> die Namen eines Moduls in deinen Gültigkeitsbereich bringt.<\/span><\/p>"]]},"nl":{"t":"Basisbeginselen van modules","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Een <em>module<\/em> is een bestand met code die je steeds opnieuw kunt gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Hij bevat subroutines, variabelen en meer, en andere programma's kunnen hem laden en delen.<\/span> <span class=\"sg\" data-s=\"2\">Dit gedeelte behandelt de basis in drie stappen.<\/span> <span class=\"sg\" data-s=\"3\">Eerst zie je hoe je een module <strong>schrijft<\/strong> en aangeeft wat hij aanbiedt.<\/span> <span class=\"sg\" data-s=\"4\">Dan zie je hoe een programma hem <strong>laadt<\/strong> met <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Ten slotte zie je hoe <strong>importeren<\/strong> de namen van een module in je bereik brengt.<\/span><\/p>"]]},"es":{"t":"Fundamentos de módulos","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>módulo<\/em> es un archivo de código que puedes usar una y otra vez.<\/span> <span class=\"sg\" data-s=\"1\">Contiene subrutinas, variables y más, y otros programas pueden cargarlo y compartirlo.<\/span> <span class=\"sg\" data-s=\"2\">Esta sección cubre lo básico en tres pasos.<\/span> <span class=\"sg\" data-s=\"3\">Primero, verás cómo <strong>escribir<\/strong> un módulo y marcar lo que ofrece.<\/span> <span class=\"sg\" data-s=\"4\">Luego verás cómo un programa <strong>lo carga<\/strong> con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Por último, verás cómo la <strong>importación<\/strong> trae los nombres de un módulo a tu ámbito.<\/span><\/p>"]]},"it":{"t":"Basi dei moduli","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Un <em>modulo<\/em> è un file di codice che puoi usare più e più volte.<\/span> <span class=\"sg\" data-s=\"1\">Contiene subroutine, variabili e altro, e altri programmi possono caricarlo e condividerlo.<\/span> <span class=\"sg\" data-s=\"2\">Questa sezione presenta le basi in tre passi.<\/span> <span class=\"sg\" data-s=\"3\">Prima vedrai come <strong>scrivere<\/strong> un modulo e indicare cosa offre.<\/span> <span class=\"sg\" data-s=\"4\">Poi vedrai come un programma lo <strong>carica<\/strong> con <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Infine vedrai come l'<strong>importazione<\/strong> porta i nomi di un modulo nel tuo scope.<\/span><\/p>"]]},"lv":{"t":"Moduļu pamati","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Modulis<\/em> ir koda fails, ko varat izmantot atkal un atkal.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir apakšprogrammas, mainīgie un vēl citas lietas, un citas programmas var to ielādēt un koplietot.<\/span> <span class=\"sg\" data-s=\"2\">Šī sadaļa aptver pamatus trīs soļos.<\/span> <span class=\"sg\" data-s=\"3\">Vispirms jūs redzēsiet, kā moduli <strong>uzrakstīt<\/strong> un atzīmēt, ko tas piedāvā.<\/span> <span class=\"sg\" data-s=\"4\">Pēc tam jūs redzēsiet, kā programma to <strong>ielādē<\/strong> ar <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Visbeidzot jūs redzēsiet, kā <strong>importēšana<\/strong> ienes moduļa nosaukumus jūsu redzamības apgabalā.<\/span><\/p>"]]},"ru":{"t":"Основы модулей","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — это файл с кодом, который можно использовать снова и снова.<\/span> <span class=\"sg\" data-s=\"1\">В нём есть подпрограммы, переменные и не только, а другие программы могут загружать его и вместе им пользоваться.<\/span> <span class=\"sg\" data-s=\"2\">Этот раздел рассказывает об основах в три шага.<\/span> <span class=\"sg\" data-s=\"3\">Сначала вы увидите, как <strong>написать<\/strong> модуль и отметить, что он предлагает.<\/span> <span class=\"sg\" data-s=\"4\">Затем вы увидите, как программа <strong>загружает<\/strong> его с помощью <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Наконец, вы увидите, как <strong>импорт<\/strong> вносит имена модуля в вашу область видимости.<\/span><\/p>"]]},"uk":{"t":"Основи модулів","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Модуль<\/em> — це файл із кодом, який можна використовувати знову і знову.<\/span> <span class=\"sg\" data-s=\"1\">Він містить підпрограми, змінні та інше, а інші програми можуть завантажувати й спільно використовувати його.<\/span> <span class=\"sg\" data-s=\"2\">Цей розділ розглядає основи в три кроки.<\/span> <span class=\"sg\" data-s=\"3\">Спершу ви побачите, як <strong>написати<\/strong> модуль і позначити те, що він пропонує.<\/span> <span class=\"sg\" data-s=\"4\">Потім ви побачите, як програма <strong>завантажує<\/strong> його через <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Нарешті, ви побачите, як <strong>імпортування<\/strong> вводить імена модуля у вашу область видимості.<\/span><\/p>"]]},"bg":{"t":"Основи на модулите","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Модулът<\/em> е файл с код, който можете да използвате отново и отново.<\/span> <span class=\"sg\" data-s=\"1\">Той съдържа подпрограми, променливи и други неща, а други програми могат да го заредят и споделят.<\/span> <span class=\"sg\" data-s=\"2\">Този раздел разглежда основите в три стъпки.<\/span> <span class=\"sg\" data-s=\"3\">Първо ще видите как да <strong>напишете<\/strong> модул и да отбележите какво той предлага.<\/span> <span class=\"sg\" data-s=\"4\">След това ще видите как програмата го <strong>зарежда<\/strong> с <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Накрая ще видите как <strong>импортирането<\/strong> внася имената на модула във вашия обхват.<\/span><\/p>"]]},"eo":{"t":"Bazaj konoj pri moduloj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Modulo<\/em> estas dosiero de kodo, kiun vi povas uzi denove kaj denove.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi enhavas subprogramojn, variablojn kaj pli, kaj aliaj programoj povas ŝargi kaj kunhavi ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu sekcio kovras la bazojn en tri paŝoj.<\/span> <span class=\"sg\" data-s=\"3\">Unue, vi vidos, kiel <strong>skribi<\/strong> modulon kaj marki tion, kion ĝi proponas.<\/span> <span class=\"sg\" data-s=\"4\">Poste vi vidos, kiel programo <strong>ŝargas<\/strong> ĝin per <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Fine, vi vidos, kiel <strong>importado<\/strong> alportas la nomojn de modulo en vian amplekson.<\/span><\/p>"]]},"la":{"t":"Fundamenta modulorum","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><em>Modulus<\/em> est archivum codicis quem iterum atque iterum adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Subprogrammata, variabiles et plura continet, et alia programmata eum onerare et communicare possunt.<\/span> <span class=\"sg\" data-s=\"2\">Haec sectio fundamenta tribus gradibus tractat.<\/span> <span class=\"sg\" data-s=\"3\">Primum videbis quomodo modulum <strong>scribas<\/strong> et notes quid praebeat.<\/span> <span class=\"sg\" data-s=\"4\">Deinde videbis quomodo programma eum per <code>use<\/code> <strong>oneret<\/strong>.<\/span> <span class=\"sg\" data-s=\"5\">Denique videbis quomodo <strong>importatio<\/strong> nomina moduli in circumscriptionem tuam adducat.<\/span><\/p>"]]}}}</script>
