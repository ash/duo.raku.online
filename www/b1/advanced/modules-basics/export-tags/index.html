<script type="application/json" id="page-data">{"u":"advanced/modules-basics/export-tags","n":699,"k":"topic","pv":"advanced/modules-basics/importing/quiz","nx":"advanced/modules-basics/export-tags/quiz","tr":["advanced","advanced/modules-basics"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Export tags","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Marking a subroutine <code>is export<\/code> puts it in the module’s <em>default<\/em> export group.<\/span> <span class=\"sg\" data-s=\"1\">These are the names that a plain <code>use<\/code> brings in.<\/span> <span class=\"sg\" data-s=\"2\">You can also give <code>is export<\/code> a <em>tag<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tags sort the exports into named groups.<\/span> <span class=\"sg\" data-s=\"4\">Then each program can choose the group it wants.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A tag is written in parentheses after <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> has no tag, so it belongs to the default group.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> has the tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A plain <code>use<\/code> imports the default group only:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you name a tag, <code>use<\/code> imports that group instead.<\/span> <span class=\"sg\" data-s=\"1\">Perhaps surprisingly, it does <em>not<\/em> import the default group as well:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When you ask for <code>:partings<\/code>, you get exactly that group.<\/span> <span class=\"sg\" data-s=\"1\">To import everything that a module exports, use the built-in <code>:ALL<\/code> tag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">There are two special tags that are useful to know.<\/span> <span class=\"sg\" data-s=\"1\">Every module supports <code>:ALL<\/code>, which imports all of its exports.<\/span> <span class=\"sg\" data-s=\"2\">You can put <code>:MANDATORY<\/code> on a routine that must always be imported.<\/span> <span class=\"sg\" data-s=\"3\">It does not matter which tag the caller chooses.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Each tag is actually a package inside the module’s <code>EXPORT<\/code> package, for example <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is exactly what <a href=\"/advanced/module-introspection/\">module introspection<\/a> lists.<\/span> <span class=\"sg\" data-s=\"2\">With tags, a larger module can keep its default set of exports small.<\/span> <span class=\"sg\" data-s=\"3\">It can still offer extra features when a program asks for them.<\/span><\/p>"]]},"de":{"t":"Export-Tags","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Wenn du eine Subroutine mit <code>is export<\/code> markierst, kommt sie in die <em>Standard<\/em>-Exportgruppe des Moduls.<\/span> <span class=\"sg\" data-s=\"1\">Das sind die Namen, die ein einfaches <code>use<\/code> holt.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst <code>is export<\/code> auch ein <em>Tag<\/em> geben.<\/span> <span class=\"sg\" data-s=\"3\">Tags sortieren die Exporte in Gruppen mit Namen.<\/span> <span class=\"sg\" data-s=\"4\">Dann kann jedes Programm die Gruppe wählen, die es will.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Tag wird in Klammern nach <code>is export<\/code> geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> hat kein Tag, also gehört es zur Standardgruppe.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> hat das Tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein einfaches <code>use<\/code> importiert nur die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du ein Tag nennst, importiert <code>use<\/code> stattdessen diese Gruppe.<\/span> <span class=\"sg\" data-s=\"1\">Vielleicht überrascht es dich, aber es importiert <em>nicht<\/em> auch noch die Standardgruppe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn du <code>:partings<\/code> anforderst, bekommst du genau diese Gruppe.<\/span> <span class=\"sg\" data-s=\"1\">Um alles zu importieren, was ein Modul exportiert, benutze das eingebaute Tag <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei besondere Tags, die du kennen solltest.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Modul unterstützt <code>:ALL<\/code>, das alle seine Exporte importiert.<\/span> <span class=\"sg\" data-s=\"2\">Du kannst <code>:MANDATORY<\/code> an eine Routine setzen, die immer importiert werden muss.<\/span> <span class=\"sg\" data-s=\"3\">Dabei ist es egal, welches Tag der Aufrufer wählt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jedes Tag ist eigentlich ein Paket im <code>EXPORT<\/code>-Paket des Moduls, zum Beispiel <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Genau das listet die <a href=\"https://course.raku.org/de/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">Modul-Introspektion<\/a> auf.<\/span> <span class=\"sg\" data-s=\"2\">Mit Tags kann ein größeres Modul seine Standardmenge an Exporten klein halten.<\/span> <span class=\"sg\" data-s=\"3\">Trotzdem kann es zusätzliche Funktionen anbieten, wenn ein Programm danach fragt.<\/span><\/p>"]]},"nl":{"t":"Export-tags","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Als je een subroutine markeert met <code>is export<\/code>, komt hij in de <em>standaard<\/em> exportgroep van de module.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn de namen die een gewone <code>use<\/code> binnenhaalt.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt <code>is export<\/code> ook een <em>tag<\/em> geven.<\/span> <span class=\"sg\" data-s=\"3\">Tags verdelen de exports in groepen met een naam.<\/span> <span class=\"sg\" data-s=\"4\">Dan kan elk programma de groep kiezen die het wil.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een tag wordt tussen haakjes geschreven na <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> heeft geen tag, dus het hoort bij de standaardgroep.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> heeft de tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een gewone <code>use<\/code> importeert alleen de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is beschikbaar; goodbye niet<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je een tag noemt, importeert <code>use<\/code> in plaats daarvan die groep.<\/span> <span class=\"sg\" data-s=\"1\">Het importeert dan, misschien verrassend, <em>niet<\/em> ook de standaardgroep:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is beschikbaar; hello niet<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je om <code>:partings<\/code> vraagt, krijg je precies die groep.<\/span> <span class=\"sg\" data-s=\"1\">Om alles te importeren wat een module exporteert, gebruik je de ingebouwde <code>:ALL<\/code>-tag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # zowel hello als goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee speciale tags die handig zijn om te kennen.<\/span> <span class=\"sg\" data-s=\"1\">Elke module ondersteunt <code>:ALL<\/code>, dat al zijn exports importeert.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt <code>:MANDATORY<\/code> op een routine zetten die altijd geïmporteerd moet worden.<\/span> <span class=\"sg\" data-s=\"3\">Het maakt niet uit welke tag de aanroeper kiest.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Elke tag is eigenlijk een pakket binnen het <code>EXPORT<\/code>-pakket van de module, bijvoorbeeld <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is precies wat <a href=\"https://course.raku.org/nl/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">module-introspectie<\/a> toont.<\/span> <span class=\"sg\" data-s=\"2\">Met tags kan een grotere module zijn standaardset van exports klein houden.<\/span> <span class=\"sg\" data-s=\"3\">Toch kan hij extra functies aanbieden als een programma erom vraagt.<\/span><\/p>"]]},"es":{"t":"Etiquetas de exportación","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Marcar una subrutina con <code>is export<\/code> la pone en el grupo de exportación <em>predeterminado<\/em> del módulo.<\/span> <span class=\"sg\" data-s=\"1\">Estos son los nombres que trae un simple <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">También puedes darle a <code>is export<\/code> una <em>etiqueta<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Las etiquetas ordenan las exportaciones en grupos con nombre.<\/span> <span class=\"sg\" data-s=\"4\">Así cada programa puede elegir el grupo que quiere.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Una etiqueta se escribe entre paréntesis después de <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> no tiene etiqueta, así que pertenece al grupo predeterminado.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> tiene la etiqueta <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un simple <code>use<\/code> importa solo el grupo predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si nombras una etiqueta, <code>use<\/code> importa ese grupo en su lugar.<\/span> <span class=\"sg\" data-s=\"1\">Quizás te sorprenda, pero <em>no<\/em> importa también el grupo predeterminado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando pides <code>:partings<\/code>, obtienes exactamente ese grupo.<\/span> <span class=\"sg\" data-s=\"1\">Para importar todo lo que exporta un módulo, usa la etiqueta incorporada <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hay dos etiquetas especiales que conviene conocer.<\/span> <span class=\"sg\" data-s=\"1\">Todos los módulos aceptan <code>:ALL<\/code>, que importa todas sus exportaciones.<\/span> <span class=\"sg\" data-s=\"2\">Puedes poner <code>:MANDATORY<\/code> en una rutina que siempre debe importarse.<\/span> <span class=\"sg\" data-s=\"3\">Da igual qué etiqueta elija el llamador.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada etiqueta es en realidad un paquete dentro del paquete <code>EXPORT<\/code> del módulo, por ejemplo <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es justo lo que lista la <a href=\"https://course.raku.org/es/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspección de módulos<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Con etiquetas, un módulo grande puede mantener pequeño su conjunto predeterminado de exportaciones.<\/span> <span class=\"sg\" data-s=\"3\">Aun así, puede ofrecer características extra cuando un programa las pide.<\/span><\/p>"]]},"it":{"t":"Tag di esportazione","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Contrassegnare una subroutine con <code>is export<\/code> la mette nel gruppo di esportazione <em>predefinito<\/em> del modulo.<\/span> <span class=\"sg\" data-s=\"1\">Sono i nomi che un semplice <code>use<\/code> importa.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche dare un <em>tag<\/em> a <code>is export<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">I tag dividono le esportazioni in gruppi con un nome.<\/span> <span class=\"sg\" data-s=\"4\">Così ogni programma può scegliere il gruppo che vuole.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un tag si scrive tra parentesi dopo <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> non ha tag, quindi appartiene al gruppo predefinito.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> ha il tag <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un semplice <code>use<\/code> importa solo il gruppo predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se indichi un tag, <code>use<\/code> importa invece quel gruppo.<\/span> <span class=\"sg\" data-s=\"1\">Forse ti sorprenderà, ma <em>non<\/em> importa anche il gruppo predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando chiedi <code>:partings<\/code>, ottieni proprio quel gruppo.<\/span> <span class=\"sg\" data-s=\"1\">Per importare tutto ciò che un modulo esporta, usa il tag integrato <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ci sono due tag speciali che è utile conoscere.<\/span> <span class=\"sg\" data-s=\"1\">Ogni modulo supporta <code>:ALL<\/code>, che importa tutte le sue esportazioni.<\/span> <span class=\"sg\" data-s=\"2\">Puoi mettere <code>:MANDATORY<\/code> su una routine che deve essere sempre importata.<\/span> <span class=\"sg\" data-s=\"3\">Non conta quale tag sceglie il chiamante.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni tag è in realtà un package dentro il package <code>EXPORT<\/code> del modulo, per esempio <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È proprio quello che elenca l'<a href=\"https://course.raku.org/it/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspezione dei moduli<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Con i tag, un modulo più grande può tenere piccolo il suo insieme predefinito di esportazioni.<\/span> <span class=\"sg\" data-s=\"3\">Può comunque offrire funzionalità in più quando un programma le chiede.<\/span><\/p>"]]},"lv":{"t":"Eksporta tagi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ja atzīmējat apakšprogrammu ar <code>is export<\/code>, tā nonāk moduļa <em>noklusētajā<\/em> eksporta grupā.<\/span> <span class=\"sg\" data-s=\"1\">Tie ir nosaukumi, ko ienes vienkāršs <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat arī dot <code>is export<\/code> <em>birku<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Birkas sašķiro eksportus nosauktās grupās.<\/span> <span class=\"sg\" data-s=\"4\">Tad katra programma var izvēlēties vajadzīgo grupu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Birku raksta iekavās aiz <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> nav birkas, tāpēc tā pieder noklusētajai grupai.<\/span> <span class=\"sg\" data-s=\"1\">Apakšprogrammai <code>goodbye<\/code> ir birka <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršs <code>use<\/code> importē tikai noklusēto grupu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja nosaucat birku, <code>use<\/code> tā vietā importē šo grupu.<\/span> <span class=\"sg\" data-s=\"1\">Iespējams, pārsteidzoši, bet noklusēto grupu tas klāt <em>neimportē<\/em>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad prasāt <code>:partings<\/code>, jūs iegūstat tieši šo grupu.<\/span> <span class=\"sg\" data-s=\"1\">Lai importētu visu, ko modulis eksportē, izmantojiet iebūvēto birku <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ir divas īpašas birkas, ko noder zināt.<\/span> <span class=\"sg\" data-s=\"1\">Katrs modulis atbalsta <code>:ALL<\/code>, kas importē visus tā eksportus.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat uzlikt <code>:MANDATORY<\/code> rutīnai, kura vienmēr jāimportē.<\/span> <span class=\"sg\" data-s=\"3\">Nav svarīgi, kuru birku izvēlas izsaucējs.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Katra birka patiesībā ir pakotne moduļa pakotnē <code>EXPORT<\/code>, piemēram, <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tieši to uzskaita <a href=\"https://course.raku.org/lv/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">moduļu introspekcija<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Ar birkām lielāks modulis var saglabāt savu noklusēto eksportu kopu nelielu.<\/span> <span class=\"sg\" data-s=\"3\">Tas joprojām var piedāvāt papildu iespējas, kad programma tās prasa.<\/span><\/p>"]]},"ru":{"t":"Теги экспорта","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Если пометить подпрограмму как <code>is export<\/code>, она попадает в группу экспорта модуля <em>по умолчанию<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это имена, которые подключает простой <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Также можно дать <code>is export<\/code> <em>тег<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Теги распределяют экспорты по группам с именами.<\/span> <span class=\"sg\" data-s=\"4\">Тогда каждая программа может выбрать нужную ей группу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тег записывается в скобках после <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У <code>hello<\/code> нет тега, поэтому она относится к группе по умолчанию.<\/span> <span class=\"sg\" data-s=\"1\">У <code>goodbye<\/code> есть тег <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Простой <code>use<\/code> импортирует только группу по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если указать тег, <code>use<\/code> импортирует вместо этого группу тега.<\/span> <span class=\"sg\" data-s=\"1\">Возможно, это вас удивит, но группу по умолчанию он при этом <em>не<\/em> импортирует:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы запрашиваете <code>:partings<\/code>, вы получаете именно эту группу.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы импортировать всё, что экспортирует модуль, используйте встроенный тег <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Есть два особых тега, которые полезно знать.<\/span> <span class=\"sg\" data-s=\"1\">Каждый модуль поддерживает <code>:ALL<\/code>, который импортирует все его экспорты.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> можно поставить на подпрограмму, которую нужно импортировать всегда.<\/span> <span class=\"sg\" data-s=\"3\">Неважно, какой тег выберет вызывающий код.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">На самом деле каждый тег — это пакет внутри пакета <code>EXPORT<\/code> модуля, например <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Именно такие пакеты показывает <a href=\"https://course.raku.org/ru/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">интроспекция модулей<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">С тегами большой модуль может оставить свой набор экспортов по умолчанию маленьким.<\/span> <span class=\"sg\" data-s=\"3\">При этом он всё равно может дать дополнительные возможности, когда программа их просит.<\/span><\/p>"]]},"uk":{"t":"Мітки експорту","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Якщо позначити підпрограму як <code>is export<\/code>, вона потрапить до <em>типової<\/em> групи експорту модуля.<\/span> <span class=\"sg\" data-s=\"1\">Це імена, які приносить звичайний <code>use<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Також ви можете дати <code>is export<\/code> <em>мітку<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Мітки розкладають експорти по іменованих групах.<\/span> <span class=\"sg\" data-s=\"4\">Тоді кожна програма може обрати потрібну їй групу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Мітку записують у дужках після <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> не має мітки, тож належить до типової групи.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> має мітку <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Звичайний <code>use<\/code> імпортує лише типову групу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello доступна; goodbye ні<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо назвати мітку, <code>use<\/code> імпортує натомість цю групу.<\/span> <span class=\"sg\" data-s=\"1\">Можливо, це несподівано, але типову групу він при цьому <em>не<\/em> імпортує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye доступна; hello ні<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви просите <code>:partings<\/code>, ви отримуєте саме цю групу.<\/span> <span class=\"sg\" data-s=\"1\">Щоб імпортувати все, що експортує модуль, скористайтеся вбудованою міткою <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # і hello, і goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Є дві особливі мітки, які корисно знати.<\/span> <span class=\"sg\" data-s=\"1\">Кожен модуль підтримує <code>:ALL<\/code>, яка імпортує всі його експорти.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете поставити <code>:MANDATORY<\/code> на підпрограму, яка має імпортуватися завжди.<\/span> <span class=\"sg\" data-s=\"3\">Неважливо, яку мітку обере програма, що використовує модуль.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожна мітка насправді є пакунком усередині пакунка <code>EXPORT<\/code> модуля, наприклад, <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Саме це перелічує <a href=\"https://course.raku.org/uk/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">інтроспекція модулів<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Завдяки міткам більший модуль може тримати свій типовий набір експортів невеликим.<\/span> <span class=\"sg\" data-s=\"3\">Водночас він може пропонувати додаткові можливості, коли програма їх просить.<\/span><\/p>"]]},"bg":{"t":"Тагове за експортиране","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Когато маркирате подпрограма с <code>is export<\/code>, тя попада в групата <em>по подразбиране<\/em> за експортиране на модула.<\/span> <span class=\"sg\" data-s=\"1\">Това са имената, които обикновен <code>use<\/code> внася.<\/span> <span class=\"sg\" data-s=\"2\">Можете също да дадете на <code>is export<\/code> <em>таг<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Таговете разпределят експортите в именувани групи.<\/span> <span class=\"sg\" data-s=\"4\">Тогава всяка програма може да избере групата, която иска.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тагът се записва в скоби след <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> няма таг, така че принадлежи към групата по подразбиране.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> има тага <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обикновен <code>use<\/code> импортира само групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello is available; goodbye is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако посочите таг, <code>use<\/code> импортира тази група вместо това.<\/span> <span class=\"sg\" data-s=\"1\">Може би изненадващо, той <em>не<\/em> импортира и групата по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye is available; hello is not<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато поискате <code>:partings<\/code>, получавате точно тази група.<\/span> <span class=\"sg\" data-s=\"1\">За да импортирате всичко, което модулът експортира, използвайте вградения таг <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # both hello and goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Има два специални тага, които е полезно да знаете.<\/span> <span class=\"sg\" data-s=\"1\">Всеки модул поддържа <code>:ALL<\/code>, който импортира всички негови експорти.<\/span> <span class=\"sg\" data-s=\"2\">Можете да сложите <code>:MANDATORY<\/code> на рутина, която трябва винаги да се импортира.<\/span> <span class=\"sg\" data-s=\"3\">Няма значение кой таг избира извикващият код.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всеки таг всъщност е пакет вътре в пакета <code>EXPORT<\/code> на модула, например <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Точно това показва <a href=\"https://course.raku.org/bg/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">интроспекцията на модулите<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">С таговете по-голям модул може да държи малък набора си от експорти по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">Той пак може да предлага допълнителни функции, когато програмата ги поиска.<\/span><\/p>"]]},"eo":{"t":"Eksportaj etikedoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Se vi markas subprogramon per <code>is export<\/code>, ĝi iras en la <em>defaŭltan<\/em> eksportgrupon de la modulo.<\/span> <span class=\"sg\" data-s=\"1\">En ĝi estas la nomoj, kiujn simpla <code>use<\/code> alportas.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas doni al <code>is export<\/code> <em>etikedon<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Etikedoj ordigas la eksportojn en nomitajn grupojn.<\/span> <span class=\"sg\" data-s=\"4\">Tiam ĉiu programo povas elekti la grupon, kiun ĝi volas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Etikedo estas skribita en krampoj post <code>is export<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> ne havas etikedon, do ĝi apartenas al la defaŭlta grupo.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> havas la etikedon <code>:partings<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simpla <code>use<\/code> importas nur la defaŭltan grupon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello estas disponebla; goodbye ne estas<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi nomas etikedon, <code>use<\/code> importas tiun grupon anstataŭe.<\/span> <span class=\"sg\" data-s=\"1\">Eble surprize, ĝi <em>ne<\/em> importas ankaŭ la defaŭltan grupon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye estas disponebla; hello ne estas<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi petas <code>:partings<\/code>, vi ricevas ĝuste tiun grupon.<\/span> <span class=\"sg\" data-s=\"1\">Por importi ĉion, kion modulo eksportas, uzu la enkonstruitan etikedon <code>:ALL<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # ambaŭ hello kaj goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Estas du specialaj etikedoj, kiujn estas utile koni.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu modulo subtenas <code>:ALL<\/code>, kiu importas ĉiujn ĝiajn eksportojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas meti <code>:MANDATORY<\/code> sur rutinon, kiu devas esti ĉiam importata.<\/span> <span class=\"sg\" data-s=\"3\">Ne gravas, kiun etikedon la vokanto elektas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu etikedo fakte estas pako ene de la pako <code>EXPORT<\/code> de la modulo, ekzemple <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝuste tion listigas <a href=\"https://course.raku.org/eo/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">modula introspekto<\/a>.<\/span> <span class=\"sg\" data-s=\"2\">Per etikedoj, pli granda modulo povas teni sian defaŭltan aron de eksportoj malgranda.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi tamen povas proponi pliajn funkciojn, kiam programo petas ilin.<\/span><\/p>"]]},"la":{"t":"Export pittacia","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Si subprogramma <code>is export<\/code> notas, id in gregem exportationis <em>praedefinitum<\/em> moduli venit.<\/span> <span class=\"sg\" data-s=\"1\">Haec sunt nomina quae simplex <code>use<\/code> adducit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam <code>is export<\/code> <em>tesseram<\/em> dare potes.<\/span> <span class=\"sg\" data-s=\"3\">Tesserae exportationes in greges nominatos disponunt.<\/span> <span class=\"sg\" data-s=\"4\">Tum quodque programma gregem eligere potest quem vult.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tessera in parenthesibus post <code>is export<\/code> scribitur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>unit module Greeting;\n\nsub hello($name)   is export            { \"Hello, $name!\" }\nsub goodbye($name) is export(:partings) { \"Goodbye, $name!\" }<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>hello<\/code> tesseram non habet, itaque ad gregem praedefinitum pertinet.<\/span> <span class=\"sg\" data-s=\"1\"><code>goodbye<\/code> tesseram <code>:partings<\/code> habet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Simplex <code>use<\/code> solum gregem praedefinitum importat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting;      # hello praesto est; goodbye non est<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si tesseram nominas, <code>use<\/code> illum gregem pro eo importat.<\/span> <span class=\"sg\" data-s=\"1\">Quod fortasse mirum est, gregem praedefinitum <em>non<\/em> etiam importat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :partings; # goodbye praesto est; hello non est<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum <code>:partings<\/code> petis, exacte illum gregem accipis.<\/span> <span class=\"sg\" data-s=\"1\">Ut omnia importes quae modulus exportat, tessera inbuilta <code>:ALL<\/code> utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>use Greeting :ALL; # et hello et goodbye<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sunt duae tesserae speciales quas utile est nosse.<\/span> <span class=\"sg\" data-s=\"1\">Omnis modulus <code>:ALL<\/code> sustinet, quae omnes eius exportationes importat.<\/span> <span class=\"sg\" data-s=\"2\"><code>:MANDATORY<\/code> in proceduram ponere potes quae semper importari debet.<\/span> <span class=\"sg\" data-s=\"3\">Non refert quam tesseram vocans eligat.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quaeque tessera re vera est fasciculus intra fasciculum <code>EXPORT<\/code> moduli, exempli gratia <code>Greeting::EXPORT::partings<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hoc est exacte quod <a href=\"https://course.raku.org/la/advanced/module-introspection/\" target=\"_blank\" rel=\"noopener\">introspectio modulorum<\/a> enumerat.<\/span> <span class=\"sg\" data-s=\"2\">Tesseris maior modulus seriem exportationum praedefinitam parvam servare potest.<\/span> <span class=\"sg\" data-s=\"3\">Tamen alias facultates offerre potest cum programma eas petit.<\/span><\/p>"]]}}}</script>
