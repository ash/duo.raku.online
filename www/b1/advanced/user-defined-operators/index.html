<script type="application/json" id="page-data">{"u":"advanced/user-defined-operators","n":557,"k":"section","pv":"advanced/metaoperators/exercises/concatenate-a-list/solution","nx":"advanced/user-defined-operators/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"User-defined operators","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operators in Raku are really just subroutines with special names.<\/span> <span class=\"sg\" data-s=\"1\">This means that you can define your own operators.<\/span> <span class=\"sg\" data-s=\"2\">You use the category names from the <a href=\"/advanced/operator-types/\">Types of Raku operators<\/a> page: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, and so on.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To declare an operator, write a <code>sub<\/code> with a special name.<\/span> <span class=\"sg\" data-s=\"1\">The name is the category, a colon, and the operator’s symbol in angle brackets.<\/span> <span class=\"sg\" data-s=\"2\">Here is a new infix operator called <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Once it is defined, <code>plus<\/code> goes between its two operands.<\/span> <span class=\"sg\" data-s=\"1\">This is exactly like any built-in infix operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A postfix operator comes after its operand.<\/span> <span class=\"sg\" data-s=\"1\">The factorial is a classic example.<\/span> <span class=\"sg\" data-s=\"2\">Here it is as the <code>!<\/code> postfix operator.<\/span> <span class=\"sg\" data-s=\"3\">It is built on <a href=\"/advanced/metaoperators/reduction/\">the reduction meta-operator<\/a> that you saw earlier:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You are not limited to letters and ASCII punctuation.<\/span> <span class=\"sg\" data-s=\"1\">The symbol of an operator can be any character.<\/span> <span class=\"sg\" data-s=\"2\">This prefix operator uses the section sign, <code>§<\/code>, to double a number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Defining operators is a powerful tool, so use it with good taste.<\/span> <span class=\"sg\" data-s=\"1\">A well-chosen operator can make code read like the language of its subject area.<\/span> <span class=\"sg\" data-s=\"2\">An unclear one only confuses the next person who reads the code.<\/span><\/p>"]]},"de":{"t":"Benutzerdefinierte Operatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoren in Raku sind eigentlich nur Subroutinen mit speziellen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Das bedeutet, dass du eigene Operatoren definieren kannst.<\/span> <span class=\"sg\" data-s=\"2\">Du verwendest dafür die Kategorienamen von der Seite <a href=\"https://course.raku.org/de/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen von Raku-Operatoren<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> und so weiter.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um einen Operator zu deklarieren, schreibst du ein <code>sub<\/code> mit einem speziellen Namen.<\/span> <span class=\"sg\" data-s=\"1\">Der Name besteht aus der Kategorie, einem Doppelpunkt und dem Symbol des Operators in spitzen Klammern.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist ein neuer Infix-Operator namens <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sobald <code>plus<\/code> definiert ist, steht er zwischen seinen zwei Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Das ist genau wie bei jedem eingebauten Infix-Operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Postfix-Operator kommt nach seinem Operanden.<\/span> <span class=\"sg\" data-s=\"1\">Die Fakultät ist ein klassisches Beispiel.<\/span> <span class=\"sg\" data-s=\"2\">Hier ist sie als Postfix-Operator <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Er ist mit dem <a href=\"https://course.raku.org/de/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">Reduktions-Meta-Operator<\/a> gebaut, den du vorher gesehen hast:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Du bist nicht auf Buchstaben und ASCII-Satzzeichen beschränkt.<\/span> <span class=\"sg\" data-s=\"1\">Das Symbol eines Operators kann ein beliebiges Zeichen sein.<\/span> <span class=\"sg\" data-s=\"2\">Dieser Prefix-Operator verwendet das Paragraphenzeichen, <code>§<\/code>, um eine Zahl zu verdoppeln:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eigene Operatoren zu definieren ist ein mächtiges Werkzeug, also setze es mit gutem Geschmack ein.<\/span> <span class=\"sg\" data-s=\"1\">Mit einem gut gewählten Operator liest sich Code wie die Sprache seines Fachgebiets.<\/span> <span class=\"sg\" data-s=\"2\">Ein unklarer Operator verwirrt nur die nächste Person, die den Code liest.<\/span><\/p>"]]},"nl":{"t":"Zelf gedefinieerde operatoren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoren in Raku zijn eigenlijk gewoon subroutines met speciale namen.<\/span> <span class=\"sg\" data-s=\"1\">Dat betekent dat je je eigen operatoren kunt definiëren.<\/span> <span class=\"sg\" data-s=\"2\">Je gebruikt de categorienamen van de pagina <a href=\"https://course.raku.org/nl/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Typen Raku-operatoren<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, enzovoort.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een operator te declareren, schrijf je een <code>sub<\/code> met een speciale naam.<\/span> <span class=\"sg\" data-s=\"1\">De naam bestaat uit de categorie, een dubbele punt en het symbool van de operator tussen punthaken.<\/span> <span class=\"sg\" data-s=\"2\">Hier is een nieuwe infix-operator die <code>plus<\/code> heet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als <code>plus<\/code> eenmaal gedefinieerd is, staat hij tussen zijn twee operanden.<\/span> <span class=\"sg\" data-s=\"1\">Dat is precies zoals bij elke ingebouwde infix-operator.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een postfix-operator komt na zijn operand.<\/span> <span class=\"sg\" data-s=\"1\">De faculteit is een klassiek voorbeeld.<\/span> <span class=\"sg\" data-s=\"2\">Hier zie je hem als de postfix-operator <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Hij is gebouwd op <a href=\"https://course.raku.org/nl/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">de reductie-meta-operator<\/a> die je eerder zag:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je bent niet beperkt tot letters en ASCII-leestekens.<\/span> <span class=\"sg\" data-s=\"1\">Het symbool van een operator kan elk teken zijn.<\/span> <span class=\"sg\" data-s=\"2\">Deze prefix-operator gebruikt het paragraafteken, <code>§<\/code>, om een getal te verdubbelen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoren definiëren is een krachtig hulpmiddel, dus gebruik het met goede smaak.<\/span> <span class=\"sg\" data-s=\"1\">Een goed gekozen operator kan code laten lezen als de taal van het vakgebied.<\/span> <span class=\"sg\" data-s=\"2\">Een onduidelijke operator verwart alleen de volgende persoon die de code leest.<\/span><\/p>"]]},"es":{"t":"Operadores definidos por el usuario","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Los operadores en Raku son en realidad solo subrutinas con nombres especiales.<\/span> <span class=\"sg\" data-s=\"1\">Esto significa que puedes definir tus propios operadores.<\/span> <span class=\"sg\" data-s=\"2\">Usas los nombres de categoría de la página <a href=\"https://course.raku.org/es/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipos de operadores en Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, y así sucesivamente.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para declarar un operador, escribe un <code>sub<\/code> con un nombre especial.<\/span> <span class=\"sg\" data-s=\"1\">El nombre es la categoría, dos puntos y el símbolo del operador entre corchetes angulares.<\/span> <span class=\"sg\" data-s=\"2\">Aquí hay un nuevo operador infijo llamado <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una vez definido, <code>plus<\/code> va entre sus dos operandos.<\/span> <span class=\"sg\" data-s=\"1\">Es exactamente como cualquier operador infijo incorporado.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un operador postfijo va después de su operando.<\/span> <span class=\"sg\" data-s=\"1\">El factorial es un ejemplo clásico.<\/span> <span class=\"sg\" data-s=\"2\">Aquí está como el operador postfijo <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Está construido con <a href=\"https://course.raku.org/es/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">el metaoperador de reducción<\/a> que viste antes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">No estás limitado a letras y signos de puntuación ASCII.<\/span> <span class=\"sg\" data-s=\"1\">El símbolo de un operador puede ser cualquier carácter.<\/span> <span class=\"sg\" data-s=\"2\">Este operador prefijo usa el signo de sección, <code>§<\/code>, para duplicar un número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Definir operadores es una herramienta potente, así que úsala con buen gusto.<\/span> <span class=\"sg\" data-s=\"1\">Un operador bien elegido puede hacer que el código se lea como el lenguaje de su área.<\/span> <span class=\"sg\" data-s=\"2\">Uno poco claro solo confunde a la siguiente persona que lee el código.<\/span><\/p>"]]},"it":{"t":"Operatori definiti dall'utente","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In Raku gli operatori sono in realtà solo subroutine con nomi speciali.<\/span> <span class=\"sg\" data-s=\"1\">Questo vuol dire che puoi definire i tuoi operatori.<\/span> <span class=\"sg\" data-s=\"2\">Usi i nomi delle categorie della pagina <a href=\"https://course.raku.org/it/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipi di operatori Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> e così via.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per dichiarare un operatore, scrivi un <code>sub<\/code> con un nome speciale.<\/span> <span class=\"sg\" data-s=\"1\">Il nome è la categoria, i due punti e il simbolo dell'operatore tra parentesi angolari.<\/span> <span class=\"sg\" data-s=\"2\">Ecco un nuovo operatore infisso chiamato <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una volta definito, <code>plus<\/code> va tra i suoi due operandi.<\/span> <span class=\"sg\" data-s=\"1\">È esattamente come qualsiasi operatore infisso integrato.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un operatore postfisso viene dopo il suo operando.<\/span> <span class=\"sg\" data-s=\"1\">Il fattoriale è un esempio classico.<\/span> <span class=\"sg\" data-s=\"2\">Eccolo come operatore postfisso <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">È costruito sul <a href=\"https://course.raku.org/it/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">meta-operatore di riduzione<\/a> che hai visto prima:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non sei limitato a lettere e punteggiatura ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Il simbolo di un operatore può essere qualsiasi carattere.<\/span> <span class=\"sg\" data-s=\"2\">Questo operatore prefisso usa il segno di sezione, <code>§<\/code>, per raddoppiare un numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Definire operatori è uno strumento potente, quindi usalo con buon gusto.<\/span> <span class=\"sg\" data-s=\"1\">Con un operatore ben scelto, il codice si legge come la lingua del suo campo.<\/span> <span class=\"sg\" data-s=\"2\">Uno poco chiaro confonde solo la prossima persona che legge il codice.<\/span><\/p>"]]},"lv":{"t":"Lietotāja definēti operatori","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatori Raku patiesībā ir vienkārši apakšprogrammas ar īpašiem nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas nozīmē, ka jūs varat definēt savus operatorus.<\/span> <span class=\"sg\" data-s=\"2\">Jūs lietojat kategoriju nosaukumus no lapas <a href=\"https://course.raku.org/lv/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Raku operatoru tipi<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> un tā tālāk.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai deklarētu operatoru, uzrakstiet <code>sub<\/code> ar īpašu nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukums ir kategorija, kols un operatora simbols leņķa iekavās.<\/span> <span class=\"sg\" data-s=\"2\">Šeit ir jauns infiksa operators ar nosaukumu <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad <code>plus<\/code> ir definēts, tas stāv starp saviem diviem operandiem.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tieši tāpat kā jebkuram iebūvētam infiksa operatoram.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operators atrodas aiz sava operanda.<\/span> <span class=\"sg\" data-s=\"1\">Faktoriāls ir klasisks piemērs.<\/span> <span class=\"sg\" data-s=\"2\">Šeit tas ir kā postfiksa operators <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir veidots ar <a href=\"https://course.raku.org/lv/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">redukcijas metaoperatoru<\/a>, ko jūs redzējāt iepriekš:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs neesat ierobežoti ar burtiem un ASCII pieturzīmēm.<\/span> <span class=\"sg\" data-s=\"1\">Operatora simbols var būt jebkura rakstzīme.<\/span> <span class=\"sg\" data-s=\"2\">Šis prefiksa operators lieto paragrāfa zīmi, <code>§<\/code>, lai dubultotu skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoru definēšana ir spēcīgs rīks, tāpēc lietojiet to ar labu gaumi.<\/span> <span class=\"sg\" data-s=\"1\">Labi izvēlēts operators var padarīt kodu līdzīgu tās jomas valodai, par kuru tas ir.<\/span> <span class=\"sg\" data-s=\"2\">Neskaidrs operators tikai mulsina nākamo cilvēku, kas lasa kodu.<\/span><\/p>"]]},"ru":{"t":"Пользовательские операторы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Операторы в Raku — на самом деле просто подпрограммы с особыми именами.<\/span> <span class=\"sg\" data-s=\"1\">Это значит, что вы можете определять собственные операторы.<\/span> <span class=\"sg\" data-s=\"2\">Для этого используются названия категорий со страницы <a href=\"https://course.raku.org/ru/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типы операторов Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и так далее.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы объявить оператор, напишите <code>sub<\/code> с особым именем.<\/span> <span class=\"sg\" data-s=\"1\">Это имя состоит из категории, двоеточия и символа оператора в угловых скобках.<\/span> <span class=\"sg\" data-s=\"2\">Вот новый инфиксный оператор с именем <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда <code>plus<\/code> определён, он ставится между двумя своими операндами.<\/span> <span class=\"sg\" data-s=\"1\">Это точно так же, как у любого встроенного инфиксного оператора.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфиксный оператор идёт после своего операнда.<\/span> <span class=\"sg\" data-s=\"1\">Факториал — классический пример.<\/span> <span class=\"sg\" data-s=\"2\">Вот он в виде постфиксного оператора <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Он построен на <a href=\"https://course.raku.org/ru/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператоре редукции<\/a>, который вы видели раньше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы не ограничены буквами и знаками препинания ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Символом оператора может быть любой символ.<\/span> <span class=\"sg\" data-s=\"2\">Этот префиксный оператор использует знак параграфа, <code>§<\/code>, чтобы удвоить число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Определение операторов — мощный инструмент, поэтому пользуйтесь им со вкусом.<\/span> <span class=\"sg\" data-s=\"1\">Удачно выбранный оператор может сделать код похожим на язык той области, к которой относится задача.<\/span> <span class=\"sg\" data-s=\"2\">Непонятный оператор только запутает следующего человека, который будет читать код.<\/span><\/p>"]]},"uk":{"t":"Оператори, визначені користувачем","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператори в Raku насправді є просто підпрограмами з особливими іменами.<\/span> <span class=\"sg\" data-s=\"1\">Це означає, що ви можете визначати власні оператори.<\/span> <span class=\"sg\" data-s=\"2\">Ви використовуєте назви категорій зі сторінки <a href=\"https://course.raku.org/uk/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Типи операторів Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> і так далі.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб оголосити оператор, напишіть <code>sub<\/code> з особливим іменем.<\/span> <span class=\"sg\" data-s=\"1\">Ім'я складається з категорії, двокрапки й символу оператора в кутових дужках.<\/span> <span class=\"sg\" data-s=\"2\">Ось новий інфіксний оператор під назвою <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щойно його визначено, <code>plus<\/code> стоїть між двома своїми операндами.<\/span> <span class=\"sg\" data-s=\"1\">Це точно як у будь-якого вбудованого інфіксного оператора.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфіксний оператор іде після свого операнда.<\/span> <span class=\"sg\" data-s=\"1\">Класичний приклад — факторіал.<\/span> <span class=\"sg\" data-s=\"2\">Ось він як постфіксний оператор <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Він побудований на <a href=\"https://course.raku.org/uk/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператорі згортки<\/a>, який ви бачили раніше:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви не обмежені літерами й розділовими знаками ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Символом оператора може бути будь-який знак.<\/span> <span class=\"sg\" data-s=\"2\">Цей префіксний оператор використовує знак параграфа, <code>§<\/code>, щоб подвоїти число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Визначення операторів — потужний інструмент, тож користуйтеся ним зі смаком.<\/span> <span class=\"sg\" data-s=\"1\">Вдало вибраний оператор може зробити код схожим на мову його галузі.<\/span> <span class=\"sg\" data-s=\"2\">Незрозумілий оператор лише заплутає наступну людину, яка читатиме код.<\/span><\/p>"]]},"bg":{"t":"Потребителски оператори","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Операторите в Raku всъщност са просто подпрограми със специални имена.<\/span> <span class=\"sg\" data-s=\"1\">Това означава, че можете да дефинирате свои оператори.<\/span> <span class=\"sg\" data-s=\"2\">Използвате имената на категориите от страницата <a href=\"https://course.raku.org/bg/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Видове оператори в Raku<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> и така нататък.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да декларирате оператор, напишете <code>sub<\/code> със специално име.<\/span> <span class=\"sg\" data-s=\"1\">Името се състои от категорията, двоеточие и символа на оператора в ъглови скоби.<\/span> <span class=\"sg\" data-s=\"2\">Ето един нов инфиксен оператор, наречен <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Щом е дефиниран, <code>plus<\/code> стои между двата си операнда.<\/span> <span class=\"sg\" data-s=\"1\">Това е точно като при всеки вграден инфиксен оператор.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Постфиксният оператор идва след своя операнд.<\/span> <span class=\"sg\" data-s=\"1\">Факториелът е класически пример.<\/span> <span class=\"sg\" data-s=\"2\">Ето го като постфиксен оператор <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Той е изграден върху <a href=\"https://course.raku.org/bg/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">метаоператора за редукция<\/a>, който видяхте по-рано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Не сте ограничени до букви и ASCII пунктуация.<\/span> <span class=\"sg\" data-s=\"1\">Символът на оператора може да бъде всеки знак.<\/span> <span class=\"sg\" data-s=\"2\">Този префиксен оператор използва знака за параграф, <code>§<\/code>, за да удвои число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дефинирането на оператори е мощен инструмент, затова го използвайте с добър вкус.<\/span> <span class=\"sg\" data-s=\"1\">Добре избраният оператор може да направи така, че кодът да се чете като езика на своята област.<\/span> <span class=\"sg\" data-s=\"2\">Неясният оператор само обърква следващия човек, който чете кода.<\/span><\/p>"]]},"eo":{"t":"Uzant-difinitaj operatoroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatoroj en Raku vere estas nur subrutinoj kun specialaj nomoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio signifas, ke vi povas difini viajn proprajn operatorojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi uzas la kategoriajn nomojn el la paĝo <a href=\"https://course.raku.org/eo/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Tipoj de Raku-operatoroj<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code> kaj tiel plu.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por deklari operatoron, skribu <code>sub<\/code> kun speciala nomo.<\/span> <span class=\"sg\" data-s=\"1\">La nomo estas la kategorio, dupunkto kaj la simbolo de la operatoro en angulaj krampoj.<\/span> <span class=\"sg\" data-s=\"2\">Jen nova infiksa operatoro nomata <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post kiam ĝi estas difinita, <code>plus<\/code> staras inter siaj du operandoj.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas ĝuste kiel ĉe ĉiu enkonstruita infiksa operatoro.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operatoro venas post sia operando.<\/span> <span class=\"sg\" data-s=\"1\">La faktorialo estas klasika ekzemplo.<\/span> <span class=\"sg\" data-s=\"2\">Jen ĝi kiel la postfiksa operatoro <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas konstruita sur <a href=\"https://course.raku.org/eo/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">la redukta metaoperatoro<\/a>, kiun vi vidis pli frue:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ne limiĝas al literoj kaj ASCII-interpunkcio.<\/span> <span class=\"sg\" data-s=\"1\">La simbolo de operatoro povas esti ajna signo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu prefiksa operatoro uzas la paragrafan signon, <code>§<\/code>, por duobligi nombron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Difini operatorojn estas potenca ilo, do uzu ĝin kun bona gusto.<\/span> <span class=\"sg\" data-s=\"1\">Bone elektita operatoro povas igi kodon legiĝi kiel la lingvo de ĝia fako.<\/span> <span class=\"sg\" data-s=\"2\">Malklara operatoro nur konfuzas la sekvan homon, kiu legas la kodon.<\/span><\/p>"]]},"la":{"t":"Operatores ab usore definiti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatores in Raku revera tantum subroutinae cum nominibus specialibus sunt.<\/span> <span class=\"sg\" data-s=\"1\">Hoc significat te operatores tuos definire posse.<\/span> <span class=\"sg\" data-s=\"2\">Nomina categoriarum adhibes ex pagina <a href=\"https://course.raku.org/la/advanced/operator-types/\" target=\"_blank\" rel=\"noopener\">Types of Raku operators<\/a>: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, et cetera.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut operatorem declares, scribe <code>sub<\/code> cum nomine speciali.<\/span> <span class=\"sg\" data-s=\"1\">Nomen est categoria, colon, et symbolum operatoris in uncis angularibus.<\/span> <span class=\"sg\" data-s=\"2\">Hic est novus operator infixus nomine <code>plus<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub infix:&lt;plus&gt;($a, $b) {\n    $a + $b\n}\n\nsay 3 plus 4; # 7<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postquam definitus est, <code>plus<\/code> inter duos operandos suos stat.<\/span> <span class=\"sg\" data-s=\"1\">Hoc exacte simile est cuilibet operatori infixo praeconstruito.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Operator postfixus post operandum suum venit.<\/span> <span class=\"sg\" data-s=\"1\">Factorialis exemplum classicum est.<\/span> <span class=\"sg\" data-s=\"2\">Hic est ut operator postfixus <code>!<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Super <a href=\"https://course.raku.org/la/advanced/metaoperators/reduction/\" target=\"_blank\" rel=\"noopener\">meta-operatore reductionis<\/a> constructus est, quem antea vidisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;!&gt;(Int $n) {\n    [*] 1..$n\n}\n\nsay 5!; # 120<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Non limitaris ad litteras et interpunctionem ASCII.<\/span> <span class=\"sg\" data-s=\"1\">Symbolum operatoris quilibet character esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Hic operator praefixus signum sectionis, <code>§<\/code>, adhibet ut numerum duplicet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub prefix:&lt;§&gt;($x) {\n    $x * 2\n}\n\nsay §5; # 10<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Operatores definire instrumentum potens est, ergo eo cum bono gustu utere.<\/span> <span class=\"sg\" data-s=\"1\">Operator bene electus codicem similem linguae argumenti sui reddere potest.<\/span> <span class=\"sg\" data-s=\"2\">Operator obscurus tantum proximum hominem confundit qui codicem legit.<\/span><\/p>"]]}}}</script>
