<script type="application/json" id="page-data">{"u":"advanced/user-defined-operators/exercises/square-operator/solution","n":564,"k":"solution","pv":"advanced/user-defined-operators/exercises/square-operator","nx":"advanced/user-defined-operators/quiz","tr":["advanced","advanced/user-defined-operators"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’A squaring operator‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The operator is declared as <code>postfix:&lt;²&gt;<\/code>. So its symbol, the superscript two, comes after its operand, as in <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The body raises the operand to the power of two, so <code>5²<\/code> gives <code>25<\/code>. Nothing stops you from using a Unicode symbol that looks like the usual mathematical notation.<\/span><\/li><\/ol>"]]},"de":{"t":"Solution: Ein Quadrierungsoperator","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\  data-s=\"0\">De body verheft de operand tot de tweede macht, dus <code>5²<\/code> geeft <code>25<\/code>. Niets houdt je tegen om een Unicode-symbool te gebruiken dat lijkt op de gewone wiskundige notatie.<\/span><\/li><\/ol>"]]},"es":{"t":"Solution: Un operador de elevar al cuadrado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí hay una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/user-defined-operators/square-operator.raku\" target=\"_blank\" rel=\"noopener\">square-operator.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>25<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El operador se declara como <code>postfix:&lt;²&gt;<\/code>. Así, su símbolo, el dos en superíndice, va después de su operando, como en <code>5²<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El cuerpo eleva el operando a la potencia de dos, así que <code>5²<\/code> da <code>25<\/code>. Nada te impide usar un símbolo Unicode que se parezca a la notación matemática habitual.<\/span><\/li><\/ol>"]]},"it":{"t":"Solution: Un operatore di elevamento al quadrato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub postfix:&lt;²&gt;($x) {\n    $x ** 2\n}\n\nsay 5²;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puoi trovare il codice sorgente nel file <a href=\"https://github.com/ash/raku-course/blob/master/
