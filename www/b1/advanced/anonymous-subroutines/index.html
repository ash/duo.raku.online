<script type="application/json" id="page-data">{"u":"advanced/anonymous-subroutines","n":683,"k":"section","pv":"advanced/nested-subroutines/quiz","nx":"advanced/anonymous-subroutines/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Anonymous subroutines","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A subroutine does not have to have a name.<\/span> <span class=\"sg\" data-s=\"1\">An <em>anonymous<\/em> subroutine looks just like a normal one, only without a name.<\/span> <span class=\"sg\" data-s=\"2\">It is usually stored in a variable, so that you can call it later.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The variable <code>$double<\/code> holds the subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>$double(5)<\/code> calls it with the argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku has a shorter way to write the same thing: the <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The arrow <code>-&gt;<\/code> comes before the parameters.<\/span> <span class=\"sg\" data-s=\"2\">You need neither the word <code>sub<\/code> nor parentheses around them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Most often, a small anonymous subroutine is written like this.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The <code>&amp;<\/code> sigil<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You may want to call the subroutine by name, not through a <code>$<\/code> variable.<\/span> <span class=\"sg\" data-s=\"1\">In that case, declare the variable with the <code>&amp;<\/code> sigil.<\/span> <span class=\"sg\" data-s=\"2\">Then you can call it without the sigil, just like an ordinary subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Passing it to another function<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">You do not have to store an anonymous subroutine in a variable at all.<\/span> <span class=\"sg\" data-s=\"1\">It is just a value.<\/span> <span class=\"sg\" data-s=\"2\">So you can pass it directly to a function that needs one.<\/span> <span class=\"sg\" data-s=\"3\">Examples are <code>map<\/code>, <code>grep<\/code>, or <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Here, the pointy block is the anonymous subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> calls it once for each element.<\/span> <span class=\"sg\" data-s=\"2\">In fact, you have been doing this all along.<\/span> <span class=\"sg\" data-s=\"3\">You passed many <code>{ ... }<\/code> blocks and <code>-&gt; $x { ... }<\/code> to <code>map<\/code> and <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Each of them is a small anonymous subroutine.<\/span> <span class=\"sg\" data-s=\"5\">You write it right where you need it, instead of giving it a name first.<\/span><\/p>"]]},"de":{"t":"Anonyme Unterprogramme","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine muss keinen Namen haben.<\/span> <span class=\"sg\" data-s=\"1\">Eine <em>anonyme<\/em> Subroutine sieht genauso aus wie eine normale, nur ohne Namen.<\/span> <span class=\"sg\" data-s=\"2\">Meistens wird sie in einer Variablen gespeichert, damit Sie sie später aufrufen können.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Variable <code>$double<\/code> enthält die Subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Dann ruft <code>$double(5)<\/code> sie mit dem Argument <code>5<\/code> auf.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy Blocks<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hat eine kürzere Schreibweise für dasselbe: den <em>Pointy Block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Der Pfeil <code>-&gt;<\/code> steht vor den Parametern.<\/span> <span class=\"sg\" data-s=\"2\">Sie brauchen weder das Wort <code>sub<\/code> noch Klammern um die Parameter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Eine kleine anonyme Subroutine wird meistens so geschrieben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das <code>&amp;<\/code>-Sigil<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vielleicht möchten Sie die Subroutine über einen Namen aufrufen, nicht über eine <code>$<\/code>-Variable.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall deklarieren Sie die Variable mit dem <code>&amp;<\/code>-Sigil.<\/span> <span class=\"sg\" data-s=\"2\">Dann können Sie sie ohne Sigil aufrufen, genau wie eine normale Subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">An eine andere Funktion übergeben<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sie müssen eine anonyme Subroutine gar nicht in einer Variablen speichern.<\/span> <span class=\"sg\" data-s=\"1\">Sie ist nur ein Wert.<\/span> <span class=\"sg\" data-s=\"2\">Also können Sie sie direkt an eine Funktion übergeben, die so einen Wert braucht.<\/span> <span class=\"sg\" data-s=\"3\">Beispiele sind <code>map<\/code>, <code>grep<\/code> oder <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier ist der Pointy Block die anonyme Subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> ruft sie für jedes Element einmal auf.<\/span> <span class=\"sg\" data-s=\"2\">Genau das haben Sie eigentlich schon die ganze Zeit gemacht.<\/span> <span class=\"sg\" data-s=\"3\">Sie haben viele <code>{ ... }<\/code>-Blöcke und <code>-&gt; $x { ... }<\/code> an <code>map<\/code> und <code>grep<\/code> übergeben.<\/span> <span class=\"sg\" data-s=\"4\">Jeder davon ist eine kleine anonyme Subroutine.<\/span> <span class=\"sg\" data-s=\"5\">Sie schreiben sie genau dort, wo Sie sie brauchen, statt ihr zuerst einen Namen zu geben.<\/span><\/p>"]]},"nl":{"t":"Anonieme subroutines","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een subroutine hoeft geen naam te hebben.<\/span> <span class=\"sg\" data-s=\"1\">Een <em>anonieme<\/em> subroutine ziet er net zo uit als een gewone, alleen zonder naam.<\/span> <span class=\"sg\" data-s=\"2\">Meestal wordt hij in een variabele opgeslagen, zodat je hem later kunt aanroepen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De variabele <code>$double<\/code> bevat de subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Dan roept <code>$double(5)<\/code> hem aan met het argument <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pointy blocks<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku heeft een kortere manier om hetzelfde te schrijven: het <em>pointy block<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De pijl <code>-&gt;<\/code> staat voor de parameters.<\/span> <span class=\"sg\" data-s=\"2\">Je hebt het woord <code>sub<\/code> niet nodig, en ook geen haakjes eromheen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een kleine anonieme subroutine wordt meestal zo geschreven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">De <code>&amp;<\/code>-sigil<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Misschien wil je de subroutine bij naam aanroepen, niet via een <code>$<\/code>-variabele.<\/span> <span class=\"sg\" data-s=\"1\">Declareer de variabele in dat geval met de <code>&amp;<\/code>-sigil.<\/span> <span class=\"sg\" data-s=\"2\">Dan kun je hem zonder sigil aanroepen, net als een gewone subroutine:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Doorgeven aan een andere functie<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Je hoeft een anonieme subroutine helemaal niet in een variabele op te slaan.<\/span> <span class=\"sg\" data-s=\"1\">Het is gewoon een waarde.<\/span> <span class=\"sg\" data-s=\"2\">Dus kun je hem direct doorgeven aan een functie die er een nodig heeft.<\/span> <span class=\"sg\" data-s=\"3\">Voorbeelden zijn <code>map<\/code>, <code>grep<\/code> of <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier is het pointy block de anonieme subroutine.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> roept het een keer aan voor elk element.<\/span> <span class=\"sg\" data-s=\"2\">Eigenlijk doe je dit al die tijd al.<\/span> <span class=\"sg\" data-s=\"3\">Je hebt al veel <code>{ ... }<\/code>-blokken en <code>-&gt; $x { ... }<\/code> aan <code>map<\/code> en <code>grep<\/code> doorgegeven.<\/span> <span class=\"sg\" data-s=\"4\">Elk daarvan is een kleine anonieme subroutine.<\/span> <span class=\"sg\" data-s=\"5\">Je schrijft hem precies waar je hem nodig hebt, in plaats van hem eerst een naam te geven.<\/span><\/p>"]]},"es":{"t":"Subrutinas anónimas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subrutina no tiene que tener un nombre.<\/span> <span class=\"sg\" data-s=\"1\">Una subrutina <em>anónima<\/em> se ve igual que una normal, solo que sin nombre.<\/span> <span class=\"sg\" data-s=\"2\">Normalmente se guarda en una variable, para poder llamarla más tarde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variable <code>$double<\/code> contiene la subrutina.<\/span> <span class=\"sg\" data-s=\"1\">Después, <code>$double(5)<\/code> la llama con el argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bloques puntiagudos<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku tiene una forma más corta de escribir lo mismo: el <em>bloque puntiagudo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La flecha <code>-&gt;<\/code> va antes de los parámetros.<\/span> <span class=\"sg\" data-s=\"2\">No necesitas ni la palabra <code>sub<\/code> ni paréntesis alrededor de ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Casi siempre, una subrutina anónima pequeña se escribe así.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El sigilo <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quizás quieras llamar a la subrutina por un nombre, no a través de una variable <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ese caso, declara la variable con el sigilo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Entonces puedes llamarla sin el sigilo, igual que una subrutina normal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pasarla a otra función<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">No tienes por qué guardar una subrutina anónima en una variable.<\/span> <span class=\"sg\" data-s=\"1\">Es solo un valor.<\/span> <span class=\"sg\" data-s=\"2\">Así que puedes pasarla directamente a una función que necesite una.<\/span> <span class=\"sg\" data-s=\"3\">Algunos ejemplos son <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aquí, el bloque puntiagudo es la subrutina anónima.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> la llama una vez para cada elemento.<\/span> <span class=\"sg\" data-s=\"2\">De hecho, llevas todo este tiempo haciendo esto.<\/span> <span class=\"sg\" data-s=\"3\">Has pasado muchos bloques <code>{ ... }<\/code> y <code>-&gt; $x { ... }<\/code> a <code>map<\/code> y <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Cada uno de ellos es una pequeña subrutina anónima.<\/span> <span class=\"sg\" data-s=\"5\">La escribes justo donde la necesitas, en lugar de darle un nombre primero.<\/span><\/p>"]]},"it":{"t":"Subroutine anonime","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una subroutine non deve per forza avere un nome.<\/span> <span class=\"sg\" data-s=\"1\">Una subroutine <em>anonima<\/em> è proprio come una normale, solo senza nome.<\/span> <span class=\"sg\" data-s=\"2\">Di solito viene salvata in una variabile, così puoi chiamarla più tardi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variabile <code>$double<\/code> contiene la subroutine.<\/span> <span class=\"sg\" data-s=\"1\">Poi <code>$double(5)<\/code> la chiama con l'argomento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Blocchi a freccia<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ha un modo più breve per scrivere la stessa cosa: il <em>blocco a freccia<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"1\">La freccia <code>-&gt;<\/code> viene prima dei parametri.<\/span> <span class=\"sg\" data-s=\"2\">Non ti servono né la parola <code>sub<\/code> né le parentesi intorno ai parametri:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Molto spesso una piccola subroutine anonima si scrive in questo modo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il sigillo <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Forse vuoi chiamare la subroutine per nome, non attraverso una variabile <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In questo caso, dichiara la variabile con il sigillo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Poi puoi chiamarla senza il sigillo, proprio come una subroutine normale:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Passarla a un'altra funzione<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Non è affatto necessario salvare una subroutine anonima in una variabile.<\/span> <span class=\"sg\" data-s=\"1\">È solo un valore.<\/span> <span class=\"sg\" data-s=\"2\">Quindi puoi passarla direttamente a una funzione che ne ha bisogno.<\/span> <span class=\"sg\" data-s=\"3\">Alcuni esempi sono <code>map<\/code>, <code>grep<\/code> o <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Qui il blocco a freccia è la subroutine anonima.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> lo chiama una volta per ogni elemento.<\/span> <span class=\"sg\" data-s=\"2\">In realtà, è quello che hai sempre fatto finora.<\/span> <span class=\"sg\" data-s=\"3\">Hai passato molti blocchi <code>{ ... }<\/code> e <code>-&gt; $x { ... }<\/code> a <code>map<\/code> e <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ognuno di essi è una piccola subroutine anonima.<\/span> <span class=\"sg\" data-s=\"5\">La scrivi proprio dove ti serve, invece di darle prima un nome.<\/span><\/p>"]]},"lv":{"t":"Anonīmas apakšprogrammas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Apakšprogrammai nav obligāti jābūt nosaukumam.<\/span> <span class=\"sg\" data-s=\"1\">Pēc izskata <em>anonīma<\/em> apakšprogramma ir tāda pati kā parasta, tikai bez nosaukuma.<\/span> <span class=\"sg\" data-s=\"2\">Parasti to glabā mainīgajā, lai vēlāk to varētu izsaukt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mainīgais <code>$double<\/code> satur apakšprogrammu.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>$double(5)<\/code> to izsauc ar argumentu <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Bultiņu bloki<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir īsāks veids, kā uzrakstīt to pašu: <em>bultiņas bloks<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Bultiņa <code>-&gt;<\/code> atrodas pirms parametriem.<\/span> <span class=\"sg\" data-s=\"2\">Nav vajadzīgs ne vārds <code>sub<\/code>, ne iekavas ap tiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visbiežāk mazu anonīmu apakšprogrammu raksta tieši tā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigils <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Varbūt jūs gribat izsaukt apakšprogrammu pēc nosaukuma, nevis caur <code>$<\/code> mainīgo.<\/span> <span class=\"sg\" data-s=\"1\">Tādā gadījumā deklarējiet mainīgo ar sigilu <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tad to var izsaukt bez sigila, tieši tāpat kā parastu apakšprogrammu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kā to nodot citai funkcijai<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Anonīma apakšprogramma nemaz nav jāglabā mainīgajā.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir vienkārši vērtība.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc to var nodot tieši funkcijai, kurai tāda vajadzīga.<\/span> <span class=\"sg\" data-s=\"3\">Piemēri ir <code>map<\/code>, <code>grep<\/code> vai <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šeit bultiņas bloks ir anonīmā apakšprogramma.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> to izsauc vienu reizi katram elementam.<\/span> <span class=\"sg\" data-s=\"2\">Patiesībā jūs to esat darījuši visu laiku.<\/span> <span class=\"sg\" data-s=\"3\">Jūs esat nodevuši <code>map<\/code> un <code>grep<\/code> daudzus blokus <code>{ ... }<\/code> un <code>-&gt; $x { ... }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Katrs no tiem ir maza anonīma apakšprogramma.<\/span> <span class=\"sg\" data-s=\"5\">Jūs to rakstāt tieši tur, kur tā vajadzīga, nevis vispirms dodat tai nosaukumu.<\/span><\/p>"]]},"ru":{"t":"Анонимные подпрограммы","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма не обязана иметь имя.<\/span> <span class=\"sg\" data-s=\"1\">Внешне <em>анонимная<\/em> подпрограмма такая же, как обычная, только у неё нет имени.<\/span> <span class=\"sg\" data-s=\"2\">Обычно её сохраняют в переменной, чтобы потом вызвать.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Переменная <code>$double<\/code> хранит подпрограмму.<\/span> <span class=\"sg\" data-s=\"1\">Затем <code>$double(5)<\/code> вызывает её с аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Остроконечные блоки<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku есть более короткая запись того же самого — <em>остроконечный блок<\/em> (pointy block).<\/span> <span class=\"sg\" data-s=\"1\">Стрелка <code>-&gt;<\/code> стоит перед параметрами.<\/span> <span class=\"sg\" data-s=\"2\">Не нужны ни слово <code>sub<\/code>, ни скобки вокруг параметров:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чаще всего небольшую анонимную подпрограмму записывают именно так.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигил <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Возможно, вы хотите вызывать подпрограмму по имени, а не через переменную с <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае объявите переменную с сигилом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогда её можно вызывать без сигила, так же как обычную подпрограмму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача в другую функцию<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Анонимную подпрограмму вообще не обязательно сохранять в переменной.<\/span> <span class=\"sg\" data-s=\"1\">Это просто значение.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому её можно передать прямо в функцию, которой нужно такое значение.<\/span> <span class=\"sg\" data-s=\"3\">Например, это <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь остроконечный блок — это анонимная подпрограмма.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> вызывает его один раз для каждого элемента.<\/span> <span class=\"sg\" data-s=\"2\">На самом деле вы делали это всё время.<\/span> <span class=\"sg\" data-s=\"3\">Вы передавали в <code>map<\/code> и <code>grep<\/code> много блоков <code>{ ... }<\/code> и <code>-&gt; $x { ... }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Каждый из них — небольшая анонимная подпрограмма.<\/span> <span class=\"sg\" data-s=\"5\">Вы пишете её прямо там, где она нужна, а не даёте ей сначала имя.<\/span><\/p>"]]},"uk":{"t":"Анонімні підпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Підпрограмі не обов'язково мати ім'я.<\/span> <span class=\"sg\" data-s=\"1\">На вигляд <em>анонімна<\/em> підпрограма така сама, як звичайна, лише без імені.<\/span> <span class=\"sg\" data-s=\"2\">Зазвичай її зберігають у змінній, щоб можна було викликати її пізніше.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Змінна <code>$double<\/code> зберігає підпрограму.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>$double(5)<\/code> викликає її з аргументом <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрілочні блоки<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У Raku є коротший спосіб записати те саме: <em>стрілочний блок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Стрілка <code>-&gt;<\/code> стоїть перед параметрами.<\/span> <span class=\"sg\" data-s=\"2\">Вам не потрібні ні слово <code>sub<\/code>, ні дужки навколо них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найчастіше невелику анонімну підпрограму записують саме так.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигіл <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можливо, ви хочете викликати підпрограму за іменем, а не через змінну з <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У такому разі оголосіть змінну з сигілом <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тоді ви зможете викликати її без сигіла, так само, як звичайну підпрограму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Передача її в іншу функцію<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вам зовсім не обов'язково зберігати анонімну підпрограму у змінній.<\/span> <span class=\"sg\" data-s=\"1\">Це просто значення.<\/span> <span class=\"sg\" data-s=\"2\">Тож ви можете передати її прямо у функцію, якій вона потрібна.<\/span> <span class=\"sg\" data-s=\"3\">Приклади таких функцій — <code>map<\/code>, <code>grep<\/code> або <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тут стрілочний блок є анонімною підпрограмою.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> викликає її один раз для кожного елемента.<\/span> <span class=\"sg\" data-s=\"2\">Насправді ви робили це весь час.<\/span> <span class=\"sg\" data-s=\"3\">Ви передавали в <code>map<\/code> і <code>grep<\/code> багато блоків <code>{ ... }<\/code> і <code>-&gt; $x { ... }<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Кожен із них — невелика анонімна підпрограма.<\/span> <span class=\"sg\" data-s=\"5\">Ви пишете її прямо там, де вона потрібна, замість того щоб спочатку давати їй ім'я.<\/span><\/p>"]]},"bg":{"t":"Анонимни подпрограми","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата не е задължително да има име.<\/span> <span class=\"sg\" data-s=\"1\">Една <em>анонимна<\/em> подпрограма изглежда точно като обикновена, само без име.<\/span> <span class=\"sg\" data-s=\"2\">Обикновено тя се съхранява в променлива, за да можете да я извикате по-късно.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Променливата <code>$double<\/code> съдържа подпрограмата.<\/span> <span class=\"sg\" data-s=\"1\">След това <code>$double(5)<\/code> я извиква с аргумента <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Стрелкови блокове<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има по-кратък начин да запишете същото нещо: <em>стрелковият блок<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Стрелката <code>-&gt;<\/code> стои пред параметрите.<\/span> <span class=\"sg\" data-s=\"2\">Не ви трябват нито думата <code>sub<\/code>, нито скоби около тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-често малката анонимна подпрограма се пише така.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сигилът <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Може да искате да извиквате подпрограмата по име, а не чрез променлива с <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В такъв случай декларирайте променливата със сигила <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тогава можете да я извикате без сигила, точно като обикновена подпрограма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Как да я подадете на друга функция<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Изобщо не е нужно да съхранявате анонимната подпрограма в променлива.<\/span> <span class=\"sg\" data-s=\"1\">Тя е просто стойност.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да я подадете направо на функция, която има нужда от такава.<\/span> <span class=\"sg\" data-s=\"3\">Примери за това са <code>map<\/code>, <code>grep<\/code> или <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тук стрелковият блок е анонимната подпрограма.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> я извиква веднъж за всеки елемент.<\/span> <span class=\"sg\" data-s=\"2\">Всъщност точно това правите през цялото време досега.<\/span> <span class=\"sg\" data-s=\"3\">Подавали сте много блокове <code>{ ... }<\/code> и <code>-&gt; $x { ... }<\/code> на <code>map<\/code> и <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Всеки от тях е малка анонимна подпрограма.<\/span> <span class=\"sg\" data-s=\"5\">Пишете я точно там, където ви трябва, вместо първо да ѝ давате име.<\/span><\/p>"]]},"eo":{"t":"Anonimaj subrutinaj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Subrutino ne devas havi nomon.<\/span> <span class=\"sg\" data-s=\"1\">La <em>anonima<\/em> subrutino aspektas same kiel ordinara, nur sen nomo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi kutime estas konservata en variablo, por ke vi povu voki ĝin poste.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La variablo <code>$double<\/code> enhavas la subrutinon.<\/span> <span class=\"sg\" data-s=\"1\">Tiam <code>$double(5)<\/code> vokas ĝin kun la argumento <code>5<\/code>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Pintaj blokoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku havas pli mallongan manieron skribi la samon: la <em>pinta bloko<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La sago <code>-&gt;<\/code> venas antaŭ la parametroj.<\/span> <span class=\"sg\" data-s=\"2\">Vi bezonas nek la vorton <code>sub<\/code>, nek krampojn ĉirkaŭ ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Plej ofte oni skribas malgrandan anoniman subrutinon tiel.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La sigelo <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Eble vi volas voki la subrutinon per nomo, ne per <code>$<\/code>-variablo.<\/span> <span class=\"sg\" data-s=\"1\">En tiu kazo, deklaru la variablon kun la sigelo <code>&amp;<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tiam vi povas voki ĝin sen la sigelo, same kiel ordinaran subrutinon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Transdoni ĝin al alia funkcio<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi tute ne devas konservi anoniman subrutinon en variablo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas nur valoro.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas transdoni ĝin rekte al funkcio, kiu bezonas tian.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemploj estas <code>map<\/code>, <code>grep<\/code> aŭ <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la pinta bloko estas la anonima subrutino.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> vokas ĝin unufoje por ĉiu elemento.<\/span> <span class=\"sg\" data-s=\"2\">Fakte, vi faras tion jam de la komenco.<\/span> <span class=\"sg\" data-s=\"3\">Vi transdonis multajn <code>{ ... }<\/code>-blokojn kaj <code>-&gt; $x { ... }<\/code> al <code>map<\/code> kaj <code>grep<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ĉiu el ili estas malgranda anonima subrutino.<\/span> <span class=\"sg\" data-s=\"5\">Vi skribas ĝin ĝuste tie, kie vi bezonas ĝin, anstataŭ unue doni al ĝi nomon.<\/span><\/p>"]]},"la":{"t":"Subprogrammata anonyma","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Non necesse est subroutinam nomen habere.<\/span> <span class=\"sg\" data-s=\"1\">Subroutina <em>anonyma<\/em> prorsus similis est ordinariae, sed sine nomine.<\/span> <span class=\"sg\" data-s=\"2\">Plerumque in variabili servatur, ut postea eam vocare possis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = sub ($x) {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Variabilis <code>$double<\/code> subroutinam tenet.<\/span> <span class=\"sg\" data-s=\"1\">Tum <code>$double(5)<\/code> eam cum argumento <code>5<\/code> vocat.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Cuspides acutae<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku modum breviorem habet idem scribendi: <em>cuspidem acutam<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sagitta <code>-&gt;<\/code> ante parametros venit.<\/span> <span class=\"sg\" data-s=\"2\">Neque verbo <code>sub<\/code> neque parenthesibus circa eos eges:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $double = -&gt; $x {\n    $x * 2\n};\n\nsay $double(5); # 10<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Saepissime parva subroutina anonyma hoc modo scribitur.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Sigillum <code>&amp;<\/code><\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fortasse subroutinam nomine vocare vis, non per variabilem <code>$<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tum variabilem cum sigillo <code>&amp;<\/code> declara.<\/span> <span class=\"sg\" data-s=\"2\">Deinde eam sine sigillo vocare potes, prorsus sicut subroutinam ordinariam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my &amp;triple = -&gt; $x {\n    $x * 3\n};\n\nsay triple(4); # 12<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eam ad aliam functionem tradere<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Subroutinam anonymam in variabili servare omnino non necesse est.<\/span> <span class=\"sg\" data-s=\"1\">Ea est tantum valor.<\/span> <span class=\"sg\" data-s=\"2\">Itaque eam recta functioni tradere potes quae talem requirit.<\/span> <span class=\"sg\" data-s=\"3\">Exempla sunt <code>map<\/code>, <code>grep<\/code> vel <code>sort<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say (1, 2, 3).map(-&gt; $x { $x * 2 }); # (2 4 6)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic cuspis acuta est subroutina anonyma.<\/span> <span class=\"sg\" data-s=\"1\"><code>map<\/code> eam semel pro quoque elemento vocat.<\/span> <span class=\"sg\" data-s=\"2\">Re vera hoc iam diu facis.<\/span> <span class=\"sg\" data-s=\"3\">Multas clausuras <code>{ ... }<\/code> et <code>-&gt; $x { ... }<\/code> ad <code>map<\/code> et <code>grep<\/code> tradidisti.<\/span> <span class=\"sg\" data-s=\"4\">Quaeque earum parva subroutina anonyma est.<\/span> <span class=\"sg\" data-s=\"5\">Eam ibi scribis ubi opus est, nec prius ei nomen das.<\/span><\/p>"]]}}}</script>
