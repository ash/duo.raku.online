\" data-s=\"2\">So the later call sees the new <code>$factor<\/code> and returns <code>35<\/code>.<\/span><\/p>"]]},"de":{"t":"Solution: Verdreifachen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Den Quellcode finden Sie in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Pointy Block hat nur einen Parameter, <code>$x<\/code>. Trotzdem benutzt er <code>$factor<\/code>, eine Variable aus dem Gültigkeitsbereich um ihn herum. Weil er solche Variablen festhält, ist er eine Closure.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Wenn <code>$factor<\/code> gleich <code>3<\/code> ist, ergibt der Aufruf <code>$scale(7)<\/code> den Wert <code>21<\/code>. Wenn Sie <code>$factor<\/code> ändern, multipliziert derselbe Block mit dem neuen Wert:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Closure hält die <em>Variable<\/em> selbst fest.<\/span> <span class=\"sg\" data-s=\"1\">Sie hält nicht den Wert aus dem Moment fest, in dem der Block geschrieben wurde.<\/span> <span class=\"sg\" data-s=\"2\">Also sieht der spätere Aufruf das neue <code>$factor<\/code> und gibt <code>35<\/code> zurück.<\/span><\/p>"]]},"nl":{"t":"Solution: Verdrievoudigen","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het pointy block heeft maar één parameter, <code>$x<\/code>. Toch gebruikt het <code>$factor<\/code>, een variabele uit het bereik eromheen. Het vastleggen van zulke variabelen maakt er een closure van.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Als <code>$factor<\/code> gelijk is aan <code>3<\/code>, geeft <code>$scale(7)<\/code> het resultaat <code>21<\/code>. Als je <code>$factor<\/code> verandert, vermenigvuldigt hetzelfde blok met de nieuwe waarde:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De closure legt de <em>variabele<\/em> zelf vast.<\/span> <span class=\"sg\" data-s=\"1\">Hij legt niet de waarde vast van het moment waarop het blok werd geschreven.<\/span> <span class=\"sg\" data-s=\"2\">Daarom ziet de latere aanroep de nieuwe <code>$factor<\/code> en geeft hij <code>35<\/code> terug.<\/span><\/p>"]]},"es":{"t":"Solution: Triplicar","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale ,["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Когда <code>$factor<\/code> равен <code>3<\/code>, вызов <code>$scale(7)<\/code> даёт <code>21<\/code>. Если изменить <code>$factor<\/code>, тот же блок будет умножать на новое значение:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Замыкание захватывает саму <em>переменную<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Оно не захватывает значение, которое было в тот момент, когда блок написали.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому более поздний вызов видит новый <code>$factor<\/code> и возвращает <code>35<\/code>.<\/span><\/p>"]]},"uk":{"t":"Solution: Потроїти","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Ви можете знайти вихідний код у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Стрілочний блок має лише один параметр, <code>$x<\/code>. Проте він використовує <code>$factor<\/code> — змінну з області видимості навколо нього. Саме захоплення таких змінних робить його замиканням.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Коли <code>$factor<\/code> дорівнює <code>3<\/code>, виклик <code>$scale(7)<\/code> дає <code>21<\/code>. Якщо змінити <code>$factor<\/code>, той самий блок множитиме на нове значення:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Замикання захоплює саму <em>змінну<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Воно не захоплює значення, яке було в той момент, коли блок написали.<\/span> <span class=\"sg\" data-s=\"2\">Тож пізніший виклик бачить новий <code>$factor<\/code> і повертає <code>35<\/code>.<\/span><\/p>"]]},"bg":{"t":"Solution: Утройте го","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Можете да намерите изходния код във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Стрелковият блок има само един параметър, <code>$x<\/code>. Въпреки това той използва <code>$factor<\/code>, променлива от обхвата около него. Точно улавянето на такива променливи го прави затваряне.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Когато <code>$factor<\/code> е <code>3<\/code>, извикването <code>$scale(7)<\/code> дава <code>21<\/code>. Ако промените <code>$factor<\/code>, същият блок умножава по новата стойност:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Затварянето улавя самата <em>променлива<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">То не улавя стойността ѝ от момента, когато е написан блокът.<\/span> <span class=\"sg\" data-s=\"2\">Затова по-късното извикване вижда новия <code>$factor<\/code> и връща <code>35<\/code>.<\/span><\/p>"]]},"eo":{"t":"Solvo: Triobligi ĝin","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La pinta bloko havas nur unu parametron, <code>$x<\/code>. Tamen ĝi uzas <code>$factor<\/code>, variablon el la amplekso ĉirkaŭ ĝi. Ĝuste la kaptado de tiaj variabloj faras ĝin fermo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kiam <code>$factor<\/code> estas <code>3<\/code>, la voko <code>$scale(7)<\/code> donas <code>21<\/code>. Se vi ŝanĝas <code>$factor<\/code>, la sama bloko multiplikas per la nova valoro:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La fermo kaptas la <em>variablon<\/em> mem.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne kaptas la valoron de la momento, kiam oni skribis la blokon.<\/span> <span class=\"sg\" data-s=\"2\">Do la posta voko vidas la novan <code>$factor<\/code> kaj redonas <code>35<\/code>.<\/span><\/p>"]]},"la":{"t":"Solutio: Triplicare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my $factor = 3;\nmy $scale = -&gt; $x { $x * $factor };\n\nsay $scale(7);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/advanced/anonymous-subroutines/triple-it.raku\" target=\"_blank\" rel=\"noopener\">triple-it.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>21<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cuspis acuta unum tantum parametrum habet, <code>$x<\/code>. Tamen <code>$factor<\/code> adhibet, variabilem ex ambitu circa eam. Tales variabiles capere est quod eam clausuram facit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cum <code>$factor<\/code> est <code>3<\/code>, vocatio <code>$scale(7)<\/code> dat <code>21<\/code>. Si <code>$factor<\/code> mutas, eadem cuspis per novum valorem multiplicat:<\/span><\/li><\/ol>"],["code",0,"<pre class=\"lang-raku\"><code>$factor = 5;\nsay $scale(7); # 35<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Clausura ipsam <em>variabilem<\/em> capit.<\/span> <span class=\"sg\" data-s=\"1\">Non capit valorem quem variabilis habebat cum cuspis scripta est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque vocatio posterior novum <code>$factor<\/code> videt et <code>35<\/code> reddit.<\/span><\/p>"]]}}}</script>
