<script type="application/json" id="page-data">{"u":"advanced/more-on-main","n":665,"k":"section","pv":"advanced/multiple-dispatch/quiz","nx":"advanced/more-on-main/exercises","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"More on MAIN subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you used <code>MAIN<\/code> <a href=\"/essentials/the-main-function/reading-command-line-arguments/\">to get command-line arguments<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">But Raku does more for you with <code>MAIN<\/code> than just pass in the values.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">The usage message<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sometimes the command-line arguments do not fit the signature of <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In that case, Raku does not run the body.<\/span> <span class=\"sg\" data-s=\"2\">Instead, it prints a <em>usage message<\/em>, which Raku creates automatically.<\/span> <span class=\"sg\" data-s=\"3\">The message explains how to call the program.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Take a look at this program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If you call it correctly, it greets the person:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If you call it with no argument, the signature does not match.<\/span> <span class=\"sg\" data-s=\"1\">So Raku prints the usage message instead of the greeting:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku builds the message from the names of the parameters.<\/span> <span class=\"sg\" data-s=\"1\">So give them clear names, and you get useful help text for free.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Named arguments<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The parameters of <code>MAIN<\/code> can be named as well as positional.<\/span> <span class=\"sg\" data-s=\"1\">A named parameter becomes a command-line option like <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">If it has a default value, the option is not required:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"de":{"t":"Mehr zu MAIN-Unterprogrammen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Im Essentials-Teil haben Sie <code>MAIN<\/code> benutzt, <a href=\"https://course.raku.org/de/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">um Kommandozeilenargumente zu bekommen<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Aber Raku macht mit <code>MAIN<\/code> mehr für Sie, als nur die Werte weiterzugeben.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Die Verwendungsmeldung<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Manchmal passen die Argumente auf der Kommandozeile nicht zur Signatur von <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In diesem Fall führt Raku den Körper nicht aus.<\/span> <span class=\"sg\" data-s=\"2\">Stattdessen gibt Raku eine <em>Verwendungsmeldung<\/em> aus, die Raku automatisch erstellt.<\/span> <span class=\"sg\" data-s=\"3\">Die Meldung erklärt, wie man das Programm aufruft.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Werfen Sie einen Blick auf dieses Programm:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie es richtig aufrufen, begrüßt es die Person:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie es ohne Argument aufrufen, passt die Signatur nicht.<\/span> <span class=\"sg\" data-s=\"1\">Also gibt Raku die Verwendungsmeldung statt der Begrüßung aus:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku baut die Meldung aus den Namen der Parameter.<\/span> <span class=\"sg\" data-s=\"1\">Geben Sie ihnen also klare Namen, dann bekommen Sie ganz umsonst einen nützlichen Hilfetext.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benannte Argumente<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Parameter von <code>MAIN<\/code> können sowohl positional als auch benannt sein.<\/span> <span class=\"sg\" data-s=\"1\">Ein benannter Parameter wird zu einer Option auf der Kommandozeile, wie <code>--option=wert<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Wenn er einen Standardwert hat, ist die Option nicht nötig:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"nl":{"t":"Meer over MAIN-subroutines","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In het onderdeel Essentials heb je <code>MAIN<\/code> gebruikt <a href=\"https://course.raku.org/nl/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">om commandoregelargumenten te krijgen<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Maar Raku doet meer voor je met <code>MAIN<\/code> dan alleen de waarden doorgeven.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Het gebruiksbericht<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Soms passen de commandoregelargumenten niet bij de signatuur van <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In dat geval voert Raku de body niet uit.<\/span> <span class=\"sg\" data-s=\"2\">In plaats daarvan drukt het een <em>gebruiksbericht<\/em> af, dat Raku automatisch maakt.<\/span> <span class=\"sg\" data-s=\"3\">Het bericht legt uit hoe je het programma aanroept.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bekijk dit programma eens:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je het correct aanroept, begroet het de persoon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je het zonder argument aanroept, komt de signatuur niet overeen.<\/span> <span class=\"sg\" data-s=\"1\">Dus drukt Raku het gebruiksbericht af in plaats van de begroeting:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku bouwt het bericht op uit de namen van de parameters.<\/span> <span class=\"sg\" data-s=\"1\">Geef ze dus duidelijke namen, dan krijg je gratis nuttige helptekst.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Benoemde argumenten<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De parameters van <code>MAIN<\/code> kunnen zowel benoemd als positioneel zijn.<\/span> <span class=\"sg\" data-s=\"1\">Een benoemde parameter wordt een commandoregeloptie zoals <code>--optie=waarde<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Als hij een standaardwaarde heeft, is de optie niet verplicht:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"es":{"t":"Más sobre subrutinas MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, usaste <code>MAIN<\/code> <a href=\"https://course.raku.org/es/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">para recibir argumentos de la línea de comandos<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Pero Raku hace por ti con <code>MAIN<\/code> más cosas que solo pasar los valores.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">El mensaje de uso<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A veces los argumentos de la línea de comandos no encajan con la firma de <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En ese caso, Raku no ejecuta el cuerpo.<\/span> <span class=\"sg\" data-s=\"2\">En su lugar, imprime un <em>mensaje de uso<\/em>, que Raku crea automáticamente.<\/span> <span class=\"sg\" data-s=\"3\">El mensaje explica cómo llamar al programa.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Echa un vistazo a este programa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si lo llamas correctamente, saluda a la persona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si lo llamas sin ningún argumento, la firma no coincide.<\/span> <span class=\"sg\" data-s=\"1\">Así que Raku imprime el mensaje de uso en lugar del saludo:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku construye el mensaje a partir de los nombres de los parámetros.<\/span> <span class=\"sg\" data-s=\"1\">Así que dales nombres claros, y tendrás un texto de ayuda útil gratis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argumentos con nombre<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los parámetros de <code>MAIN<\/code> pueden ser con nombre además de posicionales.<\/span> <span class=\"sg\" data-s=\"1\">Un parámetro con nombre se convierte en una opción de la línea de comandos como <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si tiene un valor predeterminado, la opción no es obligatoria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"it":{"t":"Approfondimento sulle subroutine MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essenziali hai usato <code>MAIN<\/code> <a href=\"https://course.raku.org/it/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">per ricevere gli argomenti da riga di comando<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ma con <code>MAIN<\/code> Raku fa per te di più che passare semplicemente i valori.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Il messaggio di utilizzo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A volte gli argomenti da riga di comando non corrispondono alla firma di <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">In quel caso, Raku non esegue il corpo.<\/span> <span class=\"sg\" data-s=\"2\">Invece stampa un <em>messaggio di utilizzo<\/em>, che Raku crea automaticamente.<\/span> <span class=\"sg\" data-s=\"3\">Il messaggio spiega come chiamare il programma.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dai un'occhiata a questo programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se lo chiami nel modo corretto, saluta la persona:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se lo chiami senza argomenti, la firma non corrisponde.<\/span> <span class=\"sg\" data-s=\"1\">Quindi Raku stampa il messaggio di utilizzo al posto del saluto:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku costruisce il messaggio a partire dai nomi dei parametri.<\/span> <span class=\"sg\" data-s=\"1\">Quindi dai loro nomi chiari, e avrai gratis un testo di aiuto utile.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argomenti con nome<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I parametri di <code>MAIN<\/code> possono essere sia con nome sia posizionali.<\/span> <span class=\"sg\" data-s=\"1\">Un parametro con nome diventa un'opzione della riga di comando come <code>--opzione=valore<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Se ha un valore predefinito, l'opzione non è obbligatoria:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"lv":{"t":"Vairāk par MAIN apakšprogrammām","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs izmantojāt <code>MAIN<\/code>, <a href=\"https://course.raku.org/lv/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">lai saņemtu komandrindas argumentus<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Bet ar <code>MAIN<\/code> Raku jūsu labā dara vairāk nekā tikai nodod vērtības iekšā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lietošanas paziņojums<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dažreiz komandrindas argumenti neatbilst <code>MAIN<\/code> parakstam.<\/span> <span class=\"sg\" data-s=\"1\">Tādā gadījumā Raku neizpilda ķermeni.<\/span> <span class=\"sg\" data-s=\"2\">Tā vietā tas izdrukā <em>lietošanas paziņojumu<\/em>, ko Raku izveido automātiski.<\/span> <span class=\"sg\" data-s=\"3\">Paziņojums paskaidro, kā programma jāizsauc.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Paskatieties uz šo programmu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja programmu izsauc pareizi, tā sasveicinās ar cilvēku:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja programmu izsauc bez argumenta, paraksts neatbilst.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku sveiciena vietā izdrukā lietošanas paziņojumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku uzbūvē paziņojumu no parametru nosaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc dodiet tiem skaidrus nosaukumus, un noderīgu palīdzības tekstu jūs iegūsiet par velti.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nosaukti argumenti<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>MAIN<\/code> parametri var būt gan nosaukti, gan pozicionāli.<\/span> <span class=\"sg\" data-s=\"1\">Nosaukts parametrs kļūst par komandrindas opciju, piemēram, <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ja tam ir noklusējuma vērtība, opcija nav obligāta:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"ru":{"t":"Подробнее о MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В разделе «Основы» вы использовали <code>MAIN<\/code>, <a href=\"https://course.raku.org/ru/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">чтобы получать аргументы командной строки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но вокруг <code>MAIN<\/code> Raku делает для вас больше, чем просто передаёт значения.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Сообщение об использовании<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Иногда аргументы командной строки не подходят к сигнатуре <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В этом случае Raku не выполняет тело.<\/span> <span class=\"sg\" data-s=\"2\">Вместо этого он выводит <em>сообщение об использовании<\/em> (usage message), которое Raku создаёт автоматически.<\/span> <span class=\"sg\" data-s=\"3\">Сообщение объясняет, как вызывать программу.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Взгляните на эту программу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вызвать её правильно, она приветствует человека:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если вызвать её без аргумента, сигнатура не совпадает.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku выводит сообщение об использовании вместо приветствия:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku строит сообщение из имён параметров.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому давайте им понятные имена, и вы бесплатно получите полезный текст справки.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именованные аргументы<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметры <code>MAIN<\/code> могут быть не только позиционными, но и именованными.<\/span> <span class=\"sg\" data-s=\"1\">Именованный параметр становится опцией командной строки вида <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Если у него есть значение по умолчанию, опция не обязательна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"uk":{"t":"Докладніше про підпрограми MAIN","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви використовували <code>MAIN<\/code>, <a href=\"https://course.raku.org/uk/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">щоб отримувати аргументи командного рядка<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Але з <code>MAIN<\/code> Raku робить для вас більше, ніж просто передає значення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Повідомлення про використання<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Іноді аргументи командного рядка не підходять до сигнатури <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У такому разі Raku не виконує тіло.<\/span> <span class=\"sg\" data-s=\"2\">Натомість він виводить <em>повідомлення про використання<\/em>, яке Raku створює автоматично.<\/span> <span class=\"sg\" data-s=\"3\">Повідомлення пояснює, як викликати програму.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Погляньте на таку програму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо викликати її правильно, вона вітає людину:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо викликати її без аргументу, сигнатура не збігається.<\/span> <span class=\"sg\" data-s=\"1\">Тож Raku виводить повідомлення про використання замість привітання:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku будує повідомлення з імен параметрів.<\/span> <span class=\"sg\" data-s=\"1\">Тож дайте їм зрозумілі імена, і корисний текст довідки ви отримаєте задарма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Іменовані аргументи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметри <code>MAIN<\/code> можуть бути не лише позиційними, а й іменованими.<\/span> <span class=\"sg\" data-s=\"1\">Іменований параметр стає опцією командного рядка, як-от <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Якщо в нього є типове значення, опція не обов'язкова:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"bg":{"t":"Повече за MAIN подпрограми","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи“ използвахте <code>MAIN<\/code>, за да <a href=\"https://course.raku.org/bg/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">получавате аргументи от командния ред<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Но Raku прави за вас повече с <code>MAIN<\/code>, отколкото просто да подаде стойностите.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Съобщение за употреба<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Понякога аргументите от командния ред не пасват на сигнатурата на <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">В такъв случай Raku не изпълнява тялото.<\/span> <span class=\"sg\" data-s=\"2\">Вместо това той отпечатва <em>съобщение за употреба<\/em>, което Raku създава автоматично.<\/span> <span class=\"sg\" data-s=\"3\">Съобщението обяснява как да извикате програмата.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разгледайте тази програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако я извикате правилно, тя поздравява човека:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако я извикате без аргумент, сигнатурата не съвпада.<\/span> <span class=\"sg\" data-s=\"1\">Затова Raku отпечатва съобщението за употреба вместо поздрава:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku изгражда съобщението от имената на параметрите.<\/span> <span class=\"sg\" data-s=\"1\">Затова им давайте ясни имена и ще получите полезен текст за помощ безплатно.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Именувани аргументи<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Параметрите на <code>MAIN<\/code> могат да бъдат както позиционни, така и именувани.<\/span> <span class=\"sg\" data-s=\"1\">Именуваният параметър става опция на командния ред като <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ако има стойност по подразбиране, опцията не е задължителна:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"eo":{"t":"Pli pri MAIN-subrutino","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencaĵoj, vi uzis <code>MAIN<\/code> <a href=\"https://course.raku.org/eo/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">por ricevi komandliniajn argumentojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku faras pli por vi kun <code>MAIN<\/code> ol nur transdoni la valorojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">La uzad-mesaĝo<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kelkfoje la komandliniaj argumentoj ne kongruas kun la signaturo de <code>MAIN<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">En tiu kazo, Raku ne rulas la korpon.<\/span> <span class=\"sg\" data-s=\"2\">Anstataŭe, ĝi presas <em>uzad-mesaĝon<\/em>, kiun Raku kreas aŭtomate.<\/span> <span class=\"sg\" data-s=\"3\">La mesaĝo klarigas, kiel voki la programon.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ekrigardu ĉi tiun programon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi vokas ĝin ĝuste, ĝi salutas la personon:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se vi vokas ĝin sen argumento, la signaturo ne kongruas.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku presas la uzad-mesaĝon anstataŭ la saluton:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku konstruas la mesaĝon el la nomoj de la parametroj.<\/span> <span class=\"sg\" data-s=\"1\">Do donu al ili klarajn nomojn, kaj vi ricevas utilan helptekston senpage.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nomitaj argumentoj<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La parametroj de <code>MAIN<\/code> povas esti nomitaj, same kiel poziciaj.<\/span> <span class=\"sg\" data-s=\"1\">Nomita parametro fariĝas komandlinia opcio kiel <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Se ĝi havas defaŭltan valoron, la opcio ne estas deviga:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]},"la":{"t":"Plus de MAIN subprogrammatibus","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium <code>MAIN<\/code> <a href=\"https://course.raku.org/la/essentials/the-main-function/reading-command-line-arguments/\" target=\"_blank\" rel=\"noopener\">ad argumenta lineae mandati accipienda<\/a> adhibuisti.<\/span> <span class=\"sg\" data-s=\"1\">Sed Raku plura tibi cum <code>MAIN<\/code> facit quam valores tantum tradere.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Nuntius de usu<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Interdum argumenta lineae mandati signaturae <code>MAIN<\/code> non conveniunt.<\/span> <span class=\"sg\" data-s=\"1\">Tum Raku corpus non exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Pro eo <em>nuntium de usu<\/em> imprimit, quem Raku sua sponte creat.<\/span> <span class=\"sg\" data-s=\"3\">Nuntius explicat quomodo programma vocandum sit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Inspice hoc programma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN($name) {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si id recte vocas, personam salutat:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku Anna\nHello, Anna!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si id sine argumento vocas, signatura non congruit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku nuntium de usu pro salutatione imprimit:<\/span><\/p>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nUsage:\n  hello.raku &lt;name&gt;<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku nuntium ex nominibus parametrorum construit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eis nomina clara da, et textum auxilii utilem gratis accipis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Argumenta nominata<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Parametri <code>MAIN<\/code> tam nominati quam positionarii esse possunt.<\/span> <span class=\"sg\" data-s=\"1\">Parametrus nominatus fit optio lineae mandati ut <code>--option=value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si valorem praefinitum habet, optio non necessaria est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub MAIN(:$name = 'World') {\n    say \"Hello, $name!\";\n}<\/code><\/pre>"],["code",0,"<pre class=\"lang-console\"><code>$ raku hello.raku\nHello, World!\n\n$ raku hello.raku --name=Raku\nHello, Raku!<\/code><\/pre>"]]}}}</script>
