(','); # (a b c)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un caso speciale importante è la divisione con la <strong>stringa vuota<\/strong> <code>''<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Divide una stringa nei suoi singoli caratteri.<\/span> <span class=\"sg\" data-s=\"2\">Ma aggiunge anche una stringa vuota proprio all'inizio e proprio alla fine.<\/span> <span class=\"sg\" data-s=\"3\">Così il risultato ha due elementi in più di quanto potresti aspettarti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'abc'.split('').elems;        # 5 — the three letters, plus an empty string at each end\nsay 'abc'.split('', :skip-empty); # (a b c) — the :skip-empty adverb drops the empties<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per dividere una stringa in caratteri, puoi chiamare il metodo <code>comb<\/code> senza argomenti.<\/span> <span class=\"sg\" data-s=\"1\">Lo fa direttamente, e non ci sono stringhe vuote in più da togliere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.comb; # (R a k u)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per fare il contrario, usa il metodo <code>join<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Unisce una lista di valori in una sola stringa e mette un separatore tra di loro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say &lt;a b c&gt;.join('-'); # a-b-c<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Altri due metodi lavorano con parti di una stringa.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>substr<\/code> restituisce un pezzo di una stringa.<\/span> <span class=\"sg\" data-s=\"2\">Gli dai una posizione iniziale e, se vuoi, una lunghezza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello World'.substr(0, 5); # Hello\nsay 'Hello World'.substr(6);    # World<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E <code>trim<\/code> toglie gli spazi bianchi all'inizio e alla fine
