<script type="application/json" id="page-data">{"u":"advanced/strings","n":454,"k":"section","pv":"advanced/native-types/exercises/native-array/solution","nx":"advanced/strings/searching","tr":["advanced"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Strings","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In the Essentials part, you learned <a href=\"/essentials/strings/\">how to build strings<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You saw concatenation, interpolation, and the length of a string.<\/span> <span class=\"sg\" data-s=\"2\">Strings also have a large set of methods.<\/span> <span class=\"sg\" data-s=\"3\">This section collects the most useful ones.<\/span> <span class=\"sg\" data-s=\"4\">Searching with <a href=\"/regexes/\">regular expressions<\/a> is a separate, bigger topic.<\/span> <span class=\"sg\" data-s=\"5\">It is covered in its own part later.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Three methods change the case of the letters in a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>flip<\/code> method reverses the order of the characters in a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">And the <code>x<\/code> operator repeats a string as many times as you ask:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next topics show how to search inside strings.<\/span> <span class=\"sg\" data-s=\"1\">They also show how to split strings into parts and join them back together.<\/span><\/p>"]]},"de":{"t":"Zeichenketten","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Im Essentials-Teil hast du gelernt, <a href=\"https://course.raku.org/de/essentials/strings/\" target=\"_blank\" rel=\"noopener\">wie man Strings erstellt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Du hast Verkettung, Interpolation und die Länge eines Strings gesehen.<\/span> <span class=\"sg\" data-s=\"2\">Strings haben auch eine große Sammlung von Methoden.<\/span> <span class=\"sg\" data-s=\"3\">Dieser Abschnitt sammelt die nützlichsten.<\/span> <span class=\"sg\" data-s=\"4\">Die Suche mit <a href=\"https://course.raku.org/de/regexes/\" target=\"_blank\" rel=\"noopener\">regulären Ausdrücken<\/a> ist ein eigenes, größeres Thema.<\/span> <span class=\"sg\" data-s=\"5\">Es wird später in einem eigenen Teil behandelt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Drei Methoden ändern die Groß- und Kleinschreibung der Buchstaben in einem String:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>flip<\/code> kehrt die Reihenfolge der Zeichen in einem String um:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Und der Operator <code>x<\/code> wiederholt einen String so oft, wie du willst:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, wie man in Strings sucht.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, wie man Strings in Teile zerlegt und wieder zusammenfügt.<\/span><\/p>"]]},"nl":{"t":"Strings","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In het deel Essentials leerde je <a href=\"https://course.raku.org/nl/essentials/strings/\" target=\"_blank\" rel=\"noopener\">hoe je strings opbouwt<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je zag concatenatie, interpolatie en de lengte van een string.<\/span> <span class=\"sg\" data-s=\"2\">Strings hebben ook een grote verzameling methoden.<\/span> <span class=\"sg\" data-s=\"3\">Deze sectie verzamelt de nuttigste.<\/span> <span class=\"sg\" data-s=\"4\">Zoeken met <a href=\"https://course.raku.org/nl/regexes/\" target=\"_blank\" rel=\"noopener\">reguliere expressies<\/a> is een apart, groter onderwerp.<\/span> <span class=\"sg\" data-s=\"5\">Dat komt later in een eigen deel aan bod.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Drie methoden veranderen hoofdletters en kleine letters in een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — hoofdletters\nsay 'RAKU'.lc; # raku  — kleine letters\nsay 'raku'.tc; # Raku  — beginhoofdletter<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De methode <code>flip<\/code> draait de volgorde van de tekens in een string om:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En de operator <code>x<\/code> herhaalt een string zo vaak als je vraagt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je in strings zoekt.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien hoe je strings in stukken splitst en weer aan elkaar plakt.<\/span><\/p>"]]},"es":{"t":"Cadenas","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la parte de Esenciales, aprendiste <a href=\"https://course.raku.org/es/essentials/strings/\" target=\"_blank\" rel=\"noopener\">cómo construir cadenas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Viste la concatenación, la interpolación y la longitud de una cadena.<\/span> <span class=\"sg\" data-s=\"2\">Las cadenas también tienen un gran conjunto de métodos.<\/span> <span class=\"sg\" data-s=\"3\">Esta sección reúne los más útiles.<\/span> <span class=\"sg\" data-s=\"4\">La búsqueda con <a href=\"https://course.raku.org/es/regexes/\" target=\"_blank\" rel=\"noopener\">expresiones regulares<\/a> es un tema aparte y más grande.<\/span> <span class=\"sg\" data-s=\"5\">Se trata en su propia parte más adelante.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tres métodos cambian las letras de una cadena entre mayúsculas y minúsculas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El método <code>flip<\/code> invierte el orden de los caracteres de una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Y el operador <code>x<\/code> repite una cadena tantas veces como pidas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los siguientes temas muestran cómo buscar dentro de cadenas.<\/span> <span class=\"sg\" data-s=\"1\">También muestran cómo dividir cadenas en partes y volver a unirlas.<\/span><\/p>"]]},"it":{"t":"Stringhe","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nella parte Essentials hai imparato <a href=\"https://course.raku.org/it/essentials/strings/\" target=\"_blank\" rel=\"noopener\">come costruire le stringhe<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Hai visto la concatenazione, l'interpolazione e la lunghezza di una stringa.<\/span> <span class=\"sg\" data-s=\"2\">Le stringhe hanno anche un grande insieme di metodi.<\/span> <span class=\"sg\" data-s=\"3\">Questa sezione raccoglie i più utili.<\/span> <span class=\"sg\" data-s=\"4\">La ricerca con le <a href=\"https://course.raku.org/it/regexes/\" target=\"_blank\" rel=\"noopener\">espressioni regolari<\/a> è un argomento separato e più ampio.<\/span> <span class=\"sg\" data-s=\"5\">Viene trattata in una sua parte più avanti.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tre metodi rendono maiuscole o minuscole le lettere di una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>flip<\/code> inverte l'ordine dei caratteri di una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">E l'operatore <code>x<\/code> ripete una stringa tutte le volte che chiedi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano come cercare dentro le stringhe.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche come dividere le stringhe in parti e poi riunirle.<\/span><\/p>"]]},"lv":{"t":"Virknes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Pamatu daļā jūs iemācījāties, <a href=\"https://course.raku.org/lv/essentials/strings/\" target=\"_blank\" rel=\"noopener\">kā veidot virknes<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Jūs redzējāt savienošanu, interpolēšanu un virknes garumu.<\/span> <span class=\"sg\" data-s=\"2\">Virknēm ir arī liels metožu klāsts.<\/span> <span class=\"sg\" data-s=\"3\">Šajā sadaļā ir apkopotas visnoderīgākās no tām.<\/span> <span class=\"sg\" data-s=\"4\">Meklēšana ar <a href=\"https://course.raku.org/lv/regexes/\" target=\"_blank\" rel=\"noopener\">regulārajām izteiksmēm<\/a> ir atsevišķa, lielāka tēma.<\/span> <span class=\"sg\" data-s=\"5\">Tā ir aplūkota savā daļā vēlāk.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Trīs metodes maina burtu reģistru virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — lielie burti\nsay 'RAKU'.lc; # raku  — mazie burti\nsay 'raku'.tc; # Raku  — virsraksta reģistrs (pirmais burts lielais)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metode <code>flip<\/code> apgriež otrādi rakstzīmju secību virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un operators <code>x<\/code> atkārto virkni tik reižu, cik jūs prasāt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamās tēmas parāda, kā meklēt virkņu iekšienē.<\/span> <span class=\"sg\" data-s=\"1\">Tās arī parāda, kā sadalīt virknes daļās un salikt tās atpakaļ kopā.<\/span><\/p>"]]},"ru":{"t":"Строки","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В части «Основы» вы узнали, <a href=\"https://course.raku.org/ru/essentials/strings/\" target=\"_blank\" rel=\"noopener\">как создавать строки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Вы видели конкатенацию, интерполяцию и длину строки.<\/span> <span class=\"sg\" data-s=\"2\">У строк есть ещё и большой набор методов.<\/span> <span class=\"sg\" data-s=\"3\">В этом разделе собраны самые полезные из них.<\/span> <span class=\"sg\" data-s=\"4\">Поиск с помощью <a href=\"https://course.raku.org/ru/regexes/\" target=\"_blank\" rel=\"noopener\">регулярных выражений<\/a> — отдельная, более крупная тема.<\/span> <span class=\"sg\" data-s=\"5\">Она описана в своей части дальше в курсе.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три метода меняют регистр букв в строке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>flip<\/code> меняет порядок символов в строке на обратный:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А оператор <code>x<\/code> повторяет строку столько раз, сколько вы попросите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как искать внутри строк.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, как разделять строки на части и снова соединять их.<\/span><\/p>"]]},"uk":{"t":"Рядки","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">У частині «Основи» ви дізналися, <a href=\"https://course.raku.org/uk/essentials/strings/\" target=\"_blank\" rel=\"noopener\">як будувати рядки<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Ви бачили конкатенацію, інтерполяцію та довжину рядка.<\/span> <span class=\"sg\" data-s=\"2\">Рядки також мають великий набір методів.<\/span> <span class=\"sg\" data-s=\"3\">Цей розділ збирає найкорисніші з них.<\/span> <span class=\"sg\" data-s=\"4\">Пошук за <a href=\"https://course.raku.org/uk/regexes/\" target=\"_blank\" rel=\"noopener\">регулярними виразами<\/a> — окрема, більша тема.<\/span> <span class=\"sg\" data-s=\"5\">Вона розглядається у власній частині далі.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три методи змінюють регістр літер у рядку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — верхній регістр\nsay 'RAKU'.lc; # raku  — нижній регістр\nsay 'raku'.tc; # Raku  — заголовний регістр (перша літера велика)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод <code>flip<\/code> змінює порядок символів у рядку на зворотний:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А оператор <code>x<\/code> повторює рядок стільки разів, скільки ви попросите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як шукати всередині рядків.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують, як розбивати рядки на частини й склеювати їх назад.<\/span><\/p>"]]},"bg":{"t":"Низове","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В частта „Основи\" научихте <a href=\"https://course.raku.org/bg/essentials/strings/\" target=\"_blank\" rel=\"noopener\">как да създавате низове<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Видяхте конкатенация, интерполация и дължина на низ.<\/span> <span class=\"sg\" data-s=\"2\">Низовете имат и голям набор от методи.<\/span> <span class=\"sg\" data-s=\"3\">Този раздел събира най-полезните от тях.<\/span> <span class=\"sg\" data-s=\"4\">Търсенето с <a href=\"https://course.raku.org/bg/regexes/\" target=\"_blank\" rel=\"noopener\">регулярни изрази<\/a> е отделна, по-голяма тема.<\/span> <span class=\"sg\" data-s=\"5\">Тя е разгледана в своя собствена част по-нататък.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Три метода променят регистъра на буквите в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>flip<\/code> обръща реда на символите в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">А операторът <code>x<\/code> повтаря низ толкова пъти, колкото поискате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да търсите вътре в низове.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и как да разделяте низовете на части и да ги съединявате обратно.<\/span><\/p>"]]},"eo":{"t":"Ĉenoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la parto Esencoj, vi lernis, <a href=\"https://course.raku.org/eo/essentials/strings/\" target=\"_blank\" rel=\"noopener\">kiel konstrui ĉenojn<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidis kunmeton, interpoladon kaj la longecon de ĉeno.<\/span> <span class=\"sg\" data-s=\"2\">Ĉenoj ankaŭ havas grandan aron da metodoj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉi tiu sekcio kolektas la plej utilajn.<\/span> <span class=\"sg\" data-s=\"4\">Serĉado per <a href=\"https://course.raku.org/eo/regexes/\" target=\"_blank\" rel=\"noopener\">regulesprimoj<\/a> estas aparta, pli granda temo.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi estas traktata en propra parto poste.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tri metodoj ŝanĝas la usklecon de la literoj en ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — majuskloj\nsay 'RAKU'.lc; # raku  — minuskloj\nsay 'raku'.tc; # Raku  — titolusklo (unua litero majuskligita)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>flip<\/code> inversigas la ordon de la signoj en ĉeno:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kaj la operatoro <code>x<\/code> ripetas ĉenon tiom da fojoj, kiom vi petas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel serĉi ene de ĉenoj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kiel disigi ĉenojn en partojn kaj kunigi ilin denove.<\/span><\/p>"]]},"la":{"t":"Catenae","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In parte Essentialium didicisti <a href=\"https://course.raku.org/la/essentials/strings/\" target=\"_blank\" rel=\"noopener\">quomodo chordas construas<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Concatenationem, interpolationem, et longitudinem chordae vidisti.<\/span> <span class=\"sg\" data-s=\"2\">Chordae etiam magnam copiam methodorum habent.<\/span> <span class=\"sg\" data-s=\"3\">Haec sectio utilissimas colligit.<\/span> <span class=\"sg\" data-s=\"4\">Quaerere cum <a href=\"https://course.raku.org/la/regexes/\" target=\"_blank\" rel=\"noopener\">expressionibus regularibus<\/a> thema separatum et maius est.<\/span> <span class=\"sg\" data-s=\"5\">In sua parte postea tractatur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Tres methodi casum litterarum in chorda mutant:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'raku'.uc; # RAKU  — upper case\nsay 'RAKU'.lc; # raku  — lower case\nsay 'raku'.tc; # Raku  — title case (first letter capitalised)<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>flip<\/code> ordinem characterum in chorda invertit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Raku'.flip; # ukaR<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Et operator <code>x<\/code> chordam totiens repetit quotiens petis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'ab' x 3; # ababab<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Proxima themata ostendunt quomodo intra chordas quaeras.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendunt quomodo chordas in partes dividas et iterum coniungas.<\/span><\/p>"]]}}}</script>
