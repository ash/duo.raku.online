<script type="application/json" id="page-data">{"u":"advanced/operator-types/quiz3","n":534,"k":"quiz","pv":"advanced/operator-types/quiz2","nx":"advanced/operators-overview","tr":["advanced","advanced/operator-types"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"L":{"en":{"t":"Quiz — A word operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>x<\/code> operator repeats a string.<\/span> <span class=\"sg\" data-s=\"1\">For example, <code>'ab' x 3<\/code> gives <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Since <code>x<\/code> stands between its two operands, which category is it in?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Position is what matters, not whether the operator is a symbol or a word.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> stands <em>between<\/em> two operands, so it is an <strong>infix<\/strong> operator.<\/span> <span class=\"sg\" data-s=\"2\">It is just like <code>+<\/code> or <code>~<\/code>, but written as a letter.<\/span><\/p>"],["raw",0,"<\/div>"]]},"de":{"t":"Quiz — Ein Wort-Operator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Operator <code>x<\/code> wiederholt einen String.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel ergibt <code>'ab' x 3<\/code> den String <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Da <code>x<\/code> zwischen seinen zwei Operanden steht: Zu welcher Kategorie gehört dieser Operator?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wichtig ist die Position, nicht ob der Operator ein Symbol oder ein Wort ist.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> steht <em>zwischen<\/em> zwei Operanden, also ist er ein <strong>Infix<\/strong>-Operator.<\/span> <span class=\"sg\" data-s=\"2\">Er ist genau wie <code>+<\/code> oder <code>~<\/code>, nur als Buchstabe geschrieben.<\/span><\/p>"],["raw",0,"<\/div>"]]},"nl":{"t":"Quiz — Een woordoperator","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>x<\/code>-operator herhaalt een string.<\/span> <span class=\"sg\" data-s=\"1\">Zo geeft <code>'ab' x 3<\/code> bijvoorbeeld <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Omdat <code>x<\/code> tussen zijn twee operanden staat, bij welke categorie hoort hij?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wat telt is de positie, niet of de operator een symbool of een woord is.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> staat <em>tussen<\/em> twee operanden, dus het is een <strong>infix<\/strong>-operator.<\/span> <span class=\"sg\" data-s=\"2\">Het is net als <code>+<\/code> of <code>~<\/code>, maar geschreven als een letter.<\/span><\/p>"],["raw",0,"<\/div>"]]},"es":{"t":"Quiz — Un operador de palabra","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">El operador <code>x<\/code> repite una cadena.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, <code>'ab' x 3<\/code> da <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Como <code>x<\/code> está entre sus dos operandos, ¿a qué categoría pertenece?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo que importa es la posición, no si el operador es un símbolo o una palabra.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> está <em>entre<\/em> dos operandos, así que es un operador <strong>infijo<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Es igual que <code>+<\/code> o <code>~<\/code>, pero se escribe con una letra.<\/span><\/p>"],["raw",0,"<\/div>"]]},"it":{"t":"Quiz — Un operatore parola","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">L'operatore <code>x<\/code> ripete una stringa.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, <code>'ab' x 3<\/code> dà <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dato che <code>x<\/code> sta tra i suoi due operandi, in quale categoria si trova?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Conta la posizione, non se l'operatore è un simbolo o una parola.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> sta <em>tra<\/em> due operandi, quindi è un operatore <strong>infisso<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">È proprio come <code>+<\/code> o <code>~<\/code>, ma scritto come una lettera.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Vārdu operators","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operators <code>x<\/code> atkārto virkni.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, <code>'ab' x 3<\/code> dod <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā kā <code>x<\/code> stāv starp saviem diviem operandiem, kurai kategorijai tas pieder?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Svarīga ir pozīcija, nevis tas, vai operators ir simbols vai vārds.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> stāv <em>starp<\/em> diviem operandiem, tāpēc tas ir <strong>infiksa<\/strong> operators.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir tieši kā <code>+<\/code> vai <code>~<\/code>, tikai rakstīts kā burts.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Словесный оператор","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>x<\/code> повторяет строку.<\/span> <span class=\"sg\" data-s=\"1\">Например, <code>'ab' x 3<\/code> даёт <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Так как <code>x<\/code> стоит между двумя операндами, к какой категории он относится?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важна позиция, а не то, символ оператор или слово.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стоит <em>между<\/em> двумя операндами, поэтому это <strong>инфиксный<\/strong> оператор.<\/span> <span class=\"sg\" data-s=\"2\">Он такой же, как <code>+<\/code> или <code>~<\/code>, только записан буквой.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Оператор-слово","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Оператор <code>x<\/code> повторює рядок.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, <code>'ab' x 3<\/code> дає <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Оскільки <code>x<\/code> стоїть між двома своїми операндами, до якої категорії він належить?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важить позиція, а не те, чи оператор є символом, чи словом.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стоїть <em>між<\/em> двома операндами, тож це <strong>інфіксний<\/strong> оператор.<\/span> <span class=\"sg\" data-s=\"2\">Він такий самий, як <code>+<\/code> чи <code>~<\/code>, але записаний літерою.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Оператор-дума","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Операторът <code>x<\/code> повтаря низ.<\/span> <span class=\"sg\" data-s=\"1\">Например <code>'ab' x 3<\/code> дава <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Щом <code>x<\/code> стои между двата си операнда, в коя категория е той?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Важна е позицията, а не дали операторът е символ или дума.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> стои <em>между<\/em> два операнда, затова е <strong>инфиксен<\/strong> оператор.<\/span> <span class=\"sg\" data-s=\"2\">Той е точно като <code>+<\/code> или <code>~<\/code>, но е написан с буква.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — Vorta operatoro","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La operatoro <code>x<\/code> ripetas ĉenon.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, <code>'ab' x 3<\/code> donas <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉar <code>x<\/code> staras inter siaj du operandoj, en kiu kategorio ĝi estas?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gravas la pozicio, ne ĉu la operatoro estas simbolo aŭ vorto.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> staras <em>inter<\/em> du operandoj, do ĝi estas <strong>infiksa<\/strong> operatoro.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas same kiel <code>+<\/code> aŭ <code>~<\/code>, sed skribita kiel litero.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — Operator verbalis","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Operator <code>x<\/code> chordam repetit.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, <code>'ab' x 3<\/code> dat <code>'ababab'<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quia <code>x<\/code> inter duos operandos suos stat, in qua categoria est?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">infix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">prefix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">postfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">circumfix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Positio interest, non utrum operator symbolum sit an verbum.<\/span> <span class=\"sg\" data-s=\"1\"><code>x<\/code> <em>inter<\/em> duos operandos stat, itaque operator <strong>infixus<\/strong> est.<\/span> <span class=\"sg\" data-s=\"2\">Sicut <code>+<\/code> vel <code>~<\/code> est, sed ut littera scribitur.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
