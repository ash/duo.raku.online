umfix<\/code> e <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Come vedrai più avanti, Raku usa le stesse parole per <a href=\"https://course.raku.org/it/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">dichiarare un nuovo operatore<\/a>.<\/span><\/p>"]]},"lv":{"t":"Raku operatoru tipi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat lietojuši daudzus operatorus, piemēram, <code>+<\/code>, <code>~<\/code> un <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Operandi ir vērtības, ar kurām operators strādā.<\/span> <span class=\"sg\" data-s=\"2\">Raku operatorus sadala kategorijās pēc tā, <em>kur<\/em> tie stāv blakus saviem operandiem.<\/span> <span class=\"sg\" data-s=\"3\">Kategoriju zināšana jums palīdzēs vēlāk, kad veidosiet savus operatorus.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefiksa operators atrodas <em>pirms<\/em> sava vienīgā operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šeit <code>-<\/code> maina skaitļa zīmi.<\/span> <span class=\"sg\" data-s=\"1\">Operators <code>?<\/code> pārvērš vērtību tās Būla vērtībā.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Infiksa operators stāv <em>starp<\/em> diviem operandiem.<\/span> <span class=\"sg\" data-s=\"1\">Lielākā daļa aritmētisko un virkņu operatoru, ko jūs zināt, darbojas tieši tā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Infiksa operatoram nav jābūt simbolam.<\/span> <span class=\"sg\" data-s=\"1\">Tas var būt arī vārds.<\/span> <span class=\"sg\" data-s=\"2\">Piemēram, operators <code>gcd<\/code> no sadaļas par <a href=\"https://course.raku.org/lv/advanced/integers/\" target=\"_blank\" rel=\"noopener\">veseliem skaitļiem<\/a> ir infiksa operators.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir nosaukums, ko jūs rakstāt starp tā diviem operandiem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operators atrodas <em>aiz<\/em> sava vienīgā operanda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> un <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cirkumfiksa operators atrodas <em>ap<\/em> savu operandu.<\/span> <span class=\"sg\" data-s=\"1\">Kvadrātiekavas, kas izveido masīvu, ir tā piemērs:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Postcirkumfiksa operators arī atrodas ap kaut ko, bet tas nāk aiz terma.<\/span> <span class=\"sg\" data-s=\"1\">Indekss, piemēram, <code>[1]<\/code> aiz <code>@a<\/code>, ir postcirkumfiksa operators:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šie ir kategoriju nosaukumi: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> un <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kā jūs redzēsiet vēlāk, Raku lieto tos pašus vārdus, lai <a href=\"https://course.raku.org/lv/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">deklarētu jaunu operatoru<\/a>.<\/span><\/p>"]]},"ru":{"t":"Типы операторов Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вы уже использовали много операторов, например <code>+<\/code>, <code>~<\/code> и <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Операнды — это значения, с которыми работает оператор.<\/span> <span class=\"sg\" data-s=\"2\">В Raku операторы делят на категории по тому, <em>где<\/em> они стоят рядом со своими операндами.<\/span> <span class=\"sg\" data-s=\"3\">Знание категорий поможет вам позже, когда вы будете создавать свои операторы.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксный оператор стоит <em>перед<\/em> своим единственным операндом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Здесь <code>-<\/code> меняет знак числа.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>?<\/code> превращает значение в булево.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксный оператор стоит <em>между<\/em> двумя операндами.<\/span> <span class=\"sg\" data-s=\"1\">Так работает большинство знакомых вам арифметических и строковых операторов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Инфиксный оператор не обязательно должен быть символом.<\/span> <span class=\"sg\" data-s=\"1\">Он может быть и словом.<\/span> <span class=\"sg\" data-s=\"2\">Например, оператор <code>gcd<\/code> из раздела о <a href=\"https://course.raku.org/ru/advanced/integers/\" target=\"_blank\" rel=\"noopener\">целых числах<\/a> — инфиксный оператор.<\/span> <span class=\"sg\" data-s=\"3\">Это имя, которое вы пишете между двумя его операндами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфиксный оператор стоит <em>после<\/em> своего единственного операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> и <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфиксный оператор стоит <em>вокруг<\/em> своего операнда.<\/span> <span class=\"sg\" data-s=\"1\">Пример — квадратные скобки, которые создают массив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфиксный оператор тоже стоит вокруг чего-то, но идёт после терма.<\/span> <span class=\"sg\" data-s=\"1\">Обращение по индексу, например <code>[1]<\/code> после <code>@a<\/code>, — это постциркумфиксный оператор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вот названия категорий: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> и <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Как вы увидите позже, Raku использует те же слова, чтобы <a href=\"https://course.raku.org/ru/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">объявить новый оператор<\/a>.<\/span><\/p>"]]},"uk":{"t":"Типи операторів Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ви вже використовували багато операторів, наприклад <code>+<\/code>, <code>~<\/code> і <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Операнди — це значення, з якими працює оператор.<\/span> <span class=\"sg\" data-s=\"2\">У Raku оператори ділять на категорії за тим, <em>де<\/em> вони стоять відносно своїх операндів.<\/span> <span class=\"sg\" data-s=\"3\">Знання категорій допоможе вам пізніше, коли ви створюватимете власні оператори.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префіксний оператор стоїть <em>перед<\/em> своїм єдиним операндом:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тут <code>-<\/code> змінює знак числа.<\/span> <span class=\"sg\" data-s=\"1\">Оператор <code>?<\/code> перетворює значення на його булеве значення.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інфіксний оператор стоїть <em>між<\/em> двома операндами.<\/span> <span class=\"sg\" data-s=\"1\">Більшість арифметичних і рядкових операторів, які ви знаєте, працюють саме так:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Інфіксний оператор не мусить бути символом.<\/span> <span class=\"sg\" data-s=\"1\">Він може бути й словом.<\/span> <span class=\"sg\" data-s=\"2\">Наприклад, оператор <code>gcd<\/code> із розділу про <a href=\"https://course.raku.org/uk/advanced/integers/\" target=\"_blank\" rel=\"noopener\">цілі числа<\/a> є інфіксним оператором.<\/span> <span class=\"sg\" data-s=\"3\">Це ім'я, яке ви пишете між двома його операндами:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфіксний оператор стоїть <em>після<\/em> свого єдиного операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> та <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфіксний оператор стоїть <em>навколо<\/em> свого операнда.<\/span> <span class=\"sg\" data-s=\"1\">Квадратні дужки, які створюють масив, — це приклад:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфіксний оператор теж стоїть навколо чогось, але йде після терма.<\/span> <span class=\"sg\" data-s=\"1\">Індекс, наприклад <code>[1]<\/code> після <code>@a<\/code>, є постциркумфіксним оператором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ось назви категорій: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> і <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Як ви побачите пізніше, Raku використовує ці самі слова, щоб <a href=\"https://course.raku.org/uk/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">оголосити новий оператор<\/a>.<\/span><\/p>"]]},"bg":{"t":"Видове оператори в Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали много оператори, като <code>+<\/code>, <code>~<\/code> и <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Операндите са стойностите, с които работи даден оператор.<\/span> <span class=\"sg\" data-s=\"2\">В Raku операторите се делят на категории според това <em>къде<\/em> стоят спрямо операндите си.<\/span> <span class=\"sg\" data-s=\"3\">Познаването на категориите ще ви помогне по-късно, когато създавате свои оператори.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Префиксният оператор стои <em>преди<\/em> единствения си операнд:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тук <code>-<\/code> сменя знака на числото.<\/span> <span class=\"sg\" data-s=\"1\">Операторът <code>?<\/code> превръща стойност в нейната булева стойност.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Инфиксният оператор стои <em>между<\/em> два операнда.<\/span> <span class=\"sg\" data-s=\"1\">Повечето аритметични и низови оператори, които познавате, работят така:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Инфиксният оператор не е задължително да е символ.<\/span> <span class=\"sg\" data-s=\"1\">Той може да бъде и дума.<\/span> <span class=\"sg\" data-s=\"2\">Например операторът <code>gcd<\/code> от раздела за <a href=\"https://course.raku.org/bg/advanced/integers/\" target=\"_blank\" rel=\"noopener\">целите числа<\/a> е инфиксен оператор.<\/span> <span class=\"sg\" data-s=\"3\">Той е име, което пишете между двата му операнда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Постфиксният оператор стои <em>след<\/em> единствения си операнд:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> и <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Циркумфиксният оператор <em>обгражда<\/em> своя операнд.<\/span> <span class=\"sg\" data-s=\"1\">Пример са квадратните скоби, които създават масив:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Постциркумфиксният оператор също обгражда нещо, но идва след терм.<\/span> <span class=\"sg\" data-s=\"1\">Индексът, като <code>[1]<\/code> след <code>@a<\/code>, е постциркумфиксен оператор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ето имената на категориите: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> и <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Както ще видите по-късно, Raku използва същите думи, когато <a href=\"https://course.raku.org/bg/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">декларирате нов оператор<\/a>.<\/span><\/p>"]]},"eo":{"t":"Tipoj de Raku-operatoroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis multajn operatorojn, ekzemple <code>+<\/code>, <code>~<\/code> kaj <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La operandoj estas la valoroj, kun kiuj operatoro laboras.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, operatoroj estas ordigitaj en kategoriojn laŭ tio, <em>kie<\/em> ili staras apud siaj operandoj.<\/span> <span class=\"sg\" data-s=\"3\">Koni la kategoriojn helpos vin poste, kiam vi kreos proprajn operatorojn.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Prefiksa operatoro venas <em>antaŭ<\/em> sia sola operando:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, <code>-<\/code> ŝanĝas la signon de la nombro.<\/span> <span class=\"sg\" data-s=\"1\">La operatoro <code>?<\/code> ŝanĝas valoron al ĝia Boolean valoro.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Infiksa operatoro staras <em>inter<\/em> du operandoj.<\/span> <span class=\"sg\" data-s=\"1\">La plej multaj aritmetikaj kaj ĉenaj operatoroj, kiujn vi konas, funkcias tiel:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Infiksa operatoro ne devas esti simbolo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ povas esti vorto.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemple, la operatoro <code>gcd<\/code> el la sekcio pri <a href=\"https://course.raku.org/eo/advanced/integers/\" target=\"_blank\" rel=\"noopener\">entjeroj<\/a> estas infiksa operatoro.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi estas nomo, kiun vi skribas inter ĝiaj du operandoj:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Postfiksa operatoro venas <em>post<\/em> sia sola operando:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> kaj <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉirkaŭfiksa operatoro staras <em>ĉirkaŭ<\/em> sia operando.<\/span> <span class=\"sg\" data-s=\"1\">La rektaj krampoj, kiuj kreas tabelon, estas ekzemplo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Post-ĉirkaŭfiksa operatoro ankaŭ staras ĉirkaŭ io, sed ĝi venas post termino.<\/span> <span class=\"sg\" data-s=\"1\">Subskribo, ekzemple la <code>[1]<\/code> post <code>@a<\/code>, estas post-ĉirkaŭfiksa operatoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jen la nomoj de la kategorioj: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> kaj <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kiel vi vidos poste, Raku uzas la samajn vortojn por <a href=\"https://course.raku.org/eo/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">deklari novan operatoron<\/a>.<\/span><\/p>"]]},"la":{"t":"Genera operatorum Raku","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Iam multos operatores adhibuisti, ut <code>+<\/code>, <code>~<\/code> et <code>++<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Operandi sunt valores in quibus operator operatur.<\/span> <span class=\"sg\" data-s=\"2\">In Raku operatores in categorias dividuntur secundum locum suum: <em>ubi<\/em> iuxta operandos stant.<\/span> <span class=\"sg\" data-s=\"3\">Categorias cognoscere te postea iuvabit, cum operatores tuos creabis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>prefix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operator praefixus <em>ante<\/em> unicum operandum suum venit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\nsay -$x; # -5\nsay ?$x; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hic <code>-<\/code> signum numeri mutat.<\/span> <span class=\"sg\" data-s=\"1\">Operator <code>?<\/code> valorem in Booleanum suum convertit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>infix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator infixus <em>inter<\/em> duos operandos stat.<\/span> <span class=\"sg\" data-s=\"1\">Plerique operatores arithmetici et chordarum quos cognoscis sic operantur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 3 + 4;       # 7\nsay 'a' ~ 'b';   # ab<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Non necesse est operatorem infixum symbolum esse.<\/span> <span class=\"sg\" data-s=\"1\">Etiam verbum esse potest.<\/span> <span class=\"sg\" data-s=\"2\">Exempli gratia, operator <code>gcd<\/code> ex sectione de <a href=\"https://course.raku.org/la/advanced/integers/\" target=\"_blank\" rel=\"noopener\">numeris integris<\/a> operator infixus est.<\/span> <span class=\"sg\" data-s=\"3\">Est nomen quod inter duos operandos eius scribis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 12 gcd 18;   # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>postfix<\/code><\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Operator postfixus <em>post<\/em> unicum operandum suum venit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 5;\n$x++;\nsay $x; # 6<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\"><code>circumfix<\/code> et <code>postcircumfix<\/code><\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator circumfixus <em>circum<\/em> operandum suum it.<\/span> <span class=\"sg\" data-s=\"1\">Unci quadrati qui ordinem creant sunt exemplum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = [1, 2, 3];<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Operator postcircumfixus etiam circum aliquid it, sed post terminum venit.<\/span> <span class=\"sg\" data-s=\"1\">Subscriptum, ut <code>[1]<\/code> post <code>@a<\/code>, operator postcircumfixus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my @a = 10, 20, 30;\nsay @a[1]; # 20<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Haec sunt nomina categoriarum: <code>prefix<\/code>, <code>infix<\/code>, <code>postfix<\/code>, <code>circumfix<\/code> et <code>postcircumfix<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ut postea videbis, Raku eadem verba adhibet cum <a href=\"https://course.raku.org/la/advanced/user-defined-operators/\" target=\"_blank\" rel=\"noopener\">novum operatorem declaras<\/a>.<\/span><\/p>"]]}}}</script>
