code>++<\/code> non ha parentesi intorno a niente.<\/span> <span class=\"sg\" data-s=\"3\">Un circumfisso, come il costruttore di array <code>[1, 2, 3]<\/code>, va intorno a qualcosa.<\/span> <span class=\"sg\" data-s=\"4\">Ma non viene dopo un termine.<\/span><\/p>"],["raw",0,"<\/div>"]]},"lv":{"t":"Viktorīna — Operatoru kategorijas","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kādai kategorijai pieder indekss <code>[0]<\/code> izteiksmē <code>@a[0]<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">postfix<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">postcircumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">circumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">infix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Indekss ieliek savu saturu iekavās <em>un<\/em> atrodas aiz terma, šeit aiz <code>@a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas padara to par postcirkumfiksa operatoru.<\/span> <span class=\"sg\" data-s=\"2\">Parastam postfiksam, piemēram, <code>++<\/code>, nav iekavu ap kaut ko.<\/span> <span class=\"sg\" data-s=\"3\">Cirkumfikss, piemēram, masīva konstruktors <code>[1, 2, 3]<\/code>, atrodas ap kaut ko.<\/span> <span class=\"sg\" data-s=\"4\">Bet tas neatrodas aiz terma.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — Категории операторов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">К какой категории относится обращение по индексу <code>[0]<\/code> в выражении <code>@a[0]<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">postfix<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">postcircumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">circumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">infix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обращение по индексу ставит скобки вокруг своего содержимого <em>и<\/em> идёт после терма, здесь <code>@a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому это постциркумфиксный оператор.<\/span> <span class=\"sg\" data-s=\"2\">У простого постфикса вроде <code>++<\/code> нет никаких скобок.<\/span> <span class=\"sg\" data-s=\"3\">Циркумфикс, например конструктор массива <code>[1, 2, 3]<\/code>, стоит вокруг чего-то.<\/span> <span class=\"sg\" data-s=\"4\">Но он не идёт после терма.<\/span><\/p>"],["raw",0,"<\/div>"]]},"uk":{"t":"Тест — Категорії операторів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">До якої категорії належить індекс <code>[0]<\/code> у виразі <code>@a[0]<\/code>?<\/span><\/p>"],["quiz",4,"<ul class=\"quiz\"><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"0\">postfix<\/span><\/li><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"1\">postcircumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">circumfix<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">infix<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Індекс бере свій вміст у дужки <em>і<\/em> йде після терма, тут це <code>@a<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тому він є постциркумфіксним оператором.<\/span> <span class=\"sg\" data-s=\"2\">Звичайний постфіксний оператор, як <code>++<\/code>, не має жодних дужок.<\/span> <span class=\"sg\" data-s=\"3\">Циркумфіксний оператор, наприклад конструктор масиву <code>[1, 2, 3]<\/code>, стоїть навколо чогось.<\/span> <span class=\"sg\" data-s=\"4\">Але він не йде після терма.<\/span><\/p>"],["raw",0,"<\/div>"]]},"bg":{"t":"Тест — Категории оператори","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Към коя категория принадлежи индексът <code>[0]<\/code> в израза <code>@a[0]<\/code>?<\/span><\/p>"],["quiz",4,
