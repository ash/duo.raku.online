<script type="application/json" id="page-data">{"u":"oop/inheritance/overriding","n":819,"k":"topic","pv":"oop/inheritance","nx":"oop/inheritance/overriding/quiz","tr":["oop","oop/inheritance"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Overriding methods","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A child class can have its own version of a method that it inherits.<\/span> <span class=\"sg\" data-s=\"1\">This is called <em>overriding<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">For an object of the child class, the method call runs the child’s version.<\/span> <span class=\"sg\" data-s=\"3\">The parent’s version does not run.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> and <code>Cat<\/code> each override <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>intro<\/code> method comes from <code>Animal<\/code> without changes.<\/span> <span class=\"sg\" data-s=\"2\">It calls <code>self.speak<\/code>, and this call uses the <code>speak<\/code> that belongs to the actual object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So the same inherited <code>intro<\/code> gives different results, because each object has its own <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is one of the central ideas of object-oriented programming.<\/span> <span class=\"sg\" data-s=\"2\">Shared code changes its behaviour to fit each kind of object.<\/span><\/p>"]]},"de":{"t":"Methoden überschreiben","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Kindklasse kann ihre eigene Version einer Methode haben, die sie erbt.<\/span> <span class=\"sg\" data-s=\"1\">Das nennt man <em>Überschreiben<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Bei einem Objekt der Kindklasse führt der Methodenaufruf die Version des Kindes aus.<\/span> <span class=\"sg\" data-s=\"3\">Die Version der Elternklasse läuft nicht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> und <code>Cat<\/code> überschreiben jeweils <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>intro<\/code> kommt ohne Änderungen von <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie ruft <code>self.speak<\/code> auf, und dieser Aufruf benutzt das <code>speak<\/code>, das zum tatsächlichen Objekt gehört:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dasselbe geerbte <code>intro<\/code> gibt also verschiedene Ergebnisse, weil jedes Objekt sein eigenes <code>speak<\/code> hat.<\/span> <span class=\"sg\" data-s=\"1\">Das ist eine der zentralen Ideen der objektorientierten Programmierung.<\/span> <span class=\"sg\" data-s=\"2\">Gemeinsamer Code passt sein Verhalten an jede Art von Objekt an.<\/span><\/p>"]]},"nl":{"t":"Methoden overschrijven","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een kindklasse kan haar eigen versie hebben van een methode die ze erft.<\/span> <span class=\"sg\" data-s=\"1\">Dat heet <em>overschrijven<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Bij een object van de kindklasse voert de aanroep de versie van het kind uit.<\/span> <span class=\"sg\" data-s=\"3\">De versie van de ouder draait niet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> en <code>Cat<\/code> overschrijven elk <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>intro<\/code> komt zonder veranderingen van <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ze roept <code>self.speak<\/code> aan, en die aanroep gebruikt de <code>speak<\/code> die bij het werkelijke object hoort:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dezelfde geërfde <code>intro<\/code> geeft dus verschillende resultaten, omdat elk object zijn eigen <code>speak<\/code> heeft.<\/span> <span class=\"sg\" data-s=\"1\">Dit is een van de centrale ideeën van objectgeoriënteerd programmeren.<\/span> <span class=\"sg\" data-s=\"2\">Gedeelde code verandert haar gedrag, zodat het past bij elke soort object.<\/span><\/p>"]]},"es":{"t":"Sobrescribir métodos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una clase hija puede tener su propia versión de un método que hereda.<\/span> <span class=\"sg\" data-s=\"1\">Esto se llama <em>sobrescribir<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Para un objeto de la clase hija, la llamada al método ejecuta la versión de la hija.<\/span> <span class=\"sg\" data-s=\"3\">La versión del padre no se ejecuta.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> y <code>Cat<\/code> sobrescriben cada uno <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>intro<\/code> viene de <code>Animal<\/code> sin cambios.<\/span> <span class=\"sg\" data-s=\"2\">Llama a <code>self.speak<\/code>, y esta llamada usa el <code>speak<\/code> que pertenece al objeto real:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Así que el mismo <code>intro<\/code> heredado da resultados distintos, porque cada objeto tiene su propio <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esta es una de las ideas centrales de la programación orientada a objetos.<\/span> <span class=\"sg\" data-s=\"2\">El código compartido cambia su comportamiento para adaptarse a cada clase de objeto.<\/span><\/p>"]]},"it":{"t":"Sovrascrivere i metodi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Una classe figlia può avere una sua versione di un metodo che eredita.<\/span> <span class=\"sg\" data-s=\"1\">Questo si chiama <em>sovrascrittura<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per un oggetto della classe figlia, la chiamata del metodo esegue la versione della figlia.<\/span> <span class=\"sg\" data-s=\"3\">La versione della genitrice non gira.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> e <code>Cat<\/code> sovrascrivono ciascuno <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>intro<\/code> arriva da <code>Animal<\/code> senza cambiamenti.<\/span> <span class=\"sg\" data-s=\"2\">Chiama <code>self.speak<\/code>, e questa chiamata usa lo <code>speak<\/code> che appartiene all'oggetto vero e proprio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Così lo stesso <code>intro<\/code> ereditato dà risultati diversi, perché ogni oggetto ha il suo <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questa è una delle idee centrali della programmazione a oggetti.<\/span> <span class=\"sg\" data-s=\"2\">Il codice condiviso cambia il suo comportamento per adattarsi a ogni tipo di oggetto.<\/span><\/p>"]]},"lv":{"t":"Metožu pārrakstīšana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bērnklasei var būt sava versija metodei, ko tā manto.<\/span> <span class=\"sg\" data-s=\"1\">To sauc par <em>pārrakstīšanu<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Bērnklases objektam metodes izsaukums izpilda bērnklases versiju.<\/span> <span class=\"sg\" data-s=\"3\">Vecākklases versija neizpildās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> un <code>Cat<\/code> katra pārraksta <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>intro<\/code> nāk no <code>Animal<\/code> bez izmaiņām.<\/span> <span class=\"sg\" data-s=\"2\">Tā izsauc <code>self.speak<\/code>, un šis izsaukums izmanto to <code>speak<\/code>, kas pieder īstajam objektam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tātad viena un tā pati mantotā <code>intro<\/code> dod dažādus rezultātus, jo katram objektam ir savs <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Šī ir viena no objektorientētās programmēšanas centrālajām idejām.<\/span> <span class=\"sg\" data-s=\"2\">Kopīgs kods maina savu uzvedību, lai derētu katram objekta veidam.<\/span><\/p>"]]},"ru":{"t":"Переопределение методов","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">У дочернего класса может быть своя версия метода, который он наследует.<\/span> <span class=\"sg\" data-s=\"1\">Это называется <em>переопределением<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Для объекта дочернего класса вызов метода выполняет версию потомка.<\/span> <span class=\"sg\" data-s=\"3\">Версия родителя не выполняется.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждый из классов <code>Dog<\/code> и <code>Cat<\/code> переопределяет <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code> приходит из <code>Animal<\/code> без изменений.<\/span> <span class=\"sg\" data-s=\"2\">Он вызывает <code>self.speak<\/code>, и этот вызов использует тот <code>speak<\/code>, который принадлежит самому объекту:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Итак, один и тот же унаследованный <code>intro<\/code> даёт разные результаты, потому что у каждого объекта свой <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это одна из главных идей объектно-ориентированного программирования.<\/span> <span class=\"sg\" data-s=\"2\">Общий код меняет своё поведение под каждый вид объекта.<\/span><\/p>"]]},"uk":{"t":"Перевизначення методів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Дочірній клас може мати власну версію методу, який він успадковує.<\/span> <span class=\"sg\" data-s=\"1\">Це називають <em>перевизначенням<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Для об'єкта дочірнього класу виклик методу виконує версію дочірнього класу.<\/span> <span class=\"sg\" data-s=\"3\">Версія батьківського класу не виконується.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> і <code>Cat<\/code> кожен перевизначає <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>intro<\/code> приходить від <code>Animal<\/code> без змін.<\/span> <span class=\"sg\" data-s=\"2\">Він викликає <code>self.speak<\/code>, і цей виклик використовує той <code>speak<\/code>, який належить справжньому об'єктові:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тож той самий успадкований <code>intro<\/code> дає різні результати, бо кожен об'єкт має власний <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це одна з центральних ідей об'єктно-орієнтованого програмування.<\/span> <span class=\"sg\" data-s=\"2\">Спільний код змінює свою поведінку під кожен вид об'єкта.<\/span><\/p>"]]},"bg":{"t":"Предефиниране на методи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Дъщерният клас може да има своя собствена версия на метод, който наследява.<\/span> <span class=\"sg\" data-s=\"1\">Това се нарича <em>предефиниране<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">За обект от дъщерния клас извикването на метода изпълнява версията на дъщерния клас.<\/span> <span class=\"sg\" data-s=\"3\">Версията на родителя не се изпълнява.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> и <code>Cat<\/code> предефинират всеки своя <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>intro<\/code> идва от <code>Animal<\/code> без промени.<\/span> <span class=\"sg\" data-s=\"2\">Той извиква <code>self.speak<\/code>, а това извикване използва онзи <code>speak<\/code>, който принадлежи на действителния обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Така един и същ наследен <code>intro<\/code> дава различни резултати, защото всеки обект има свой собствен <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е една от основните идеи на обектно-ориентираното програмиране.<\/span> <span class=\"sg\" data-s=\"2\">Общият код променя поведението си според вида на обекта.<\/span><\/p>"]]},"eo":{"t":"Superregi metodojn","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ida klaso povas havi sian propran version de metodo, kiun ĝi heredas.<\/span> <span class=\"sg\" data-s=\"1\">Tio nomiĝas <em>superregi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Por objekto de la ida klaso, la metodvoko rulas la version de la ido.<\/span> <span class=\"sg\" data-s=\"3\">La versio de la patro ne ruliĝas.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> kaj <code>Cat<\/code> ĉiu superregas <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>intro<\/code> venas el <code>Animal<\/code> sen ŝanĝoj.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi vokas <code>self.speak<\/code>, kaj ĉi tiu voko uzas tiun <code>speak<\/code>, kiu apartenas al la efektiva objekto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Do la sama heredita <code>intro<\/code> donas malsamajn rezultojn, ĉar ĉiu objekto havas sian propran <code>speak<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tio estas unu el la centraj ideoj de objekt-orientita programado.<\/span> <span class=\"sg\" data-s=\"2\">Komuna kodo ŝanĝas sian konduton laŭ ĉiu speco de objekto.<\/span><\/p>"]]},"la":{"t":"Methodos superscribere","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Classis filia propriam versionem methodi quam heredat habere potest.<\/span> <span class=\"sg\" data-s=\"1\">Hoc <em>superscribere<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"2\">Pro obiecto classis filiae, vocatio methodi versionem filiae exsequitur.<\/span> <span class=\"sg\" data-s=\"3\">Versio parentis non currit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n    method intro {\n        \"$.name says \" ~ self.speak;\n    }\n}\n\nclass Dog is Animal {\n    method speak {\n        'Woof';\n    }\n}\n\nclass Cat is Animal {\n    method speak {\n        'Meow';\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> et <code>Cat<\/code> uterque <code>speak<\/code> superscribit.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>intro<\/code> ex <code>Animal<\/code> sine mutationibus venit.<\/span> <span class=\"sg\" data-s=\"2\">Vocat <code>self.speak<\/code>, et haec vocatio eam <code>speak<\/code> adhibet quae ad ipsum obiectum pertinet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new(name =&gt; 'Rex').intro; # Rex says Woof\nsay Cat.new(name =&gt; 'Tom').intro; # Tom says Meow<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Itaque eadem <code>intro<\/code> hereditata diversos effectus dat, quia quodque obiectum propriam <code>speak<\/code> habet.<\/span> <span class=\"sg\" data-s=\"1\">Haec est una ex ideis principalibus programmationis ad obiecta directae.<\/span> <span class=\"sg\" data-s=\"2\">Codex communis agendi rationem suam ad quodque genus obiecti accommodat.<\/span><\/p>"]]}}}</script>
