<script type="application/json" id="page-data">{"u":"oop/inheritance","n":818,"k":"section","pv":"oop/subs-vs-methods/quiz","nx":"oop/inheritance/overriding","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Inheritance","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Inheritance<\/em> lets one class build on another.<\/span> <span class=\"sg\" data-s=\"1\">After the new class name, you write <code>is<\/code> and the name of another class.<\/span> <span class=\"sg\" data-s=\"2\">The new class then inherits all the attributes and methods of that class.<\/span> <span class=\"sg\" data-s=\"3\">That class is called its <em>parent<\/em> (or <em>base<\/em>) class.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> means that a <code>Dog<\/code> is a kind of <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The class <code>Dog<\/code> has no code of its own.<\/span> <span class=\"sg\" data-s=\"2\">But it already has the <code>name<\/code> attribute and the <code>speak<\/code> method from <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>Dog<\/code> object also counts as an <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The smart-match <code>~~<\/code> against a type is true if the object has that type.<\/span> <span class=\"sg\" data-s=\"1\">It is also true if the object inherits from that type.<\/span> <span class=\"sg\" data-s=\"2\">In the next topic, a child class replaces an inherited method with its own version.<\/span><\/p>"]]},"de":{"t":"Vererbung","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Mit <em>Vererbung<\/em> kann eine Klasse auf einer anderen aufbauen.<\/span> <span class=\"sg\" data-s=\"1\">Hinter den Namen der neuen Klasse schreiben Sie <code>is<\/code> und den Namen einer anderen Klasse.<\/span> <span class=\"sg\" data-s=\"2\">Die neue Klasse erbt dann alle Attribute und Methoden dieser Klasse.<\/span> <span class=\"sg\" data-s=\"3\">Diese Klasse heißt ihre <em>Elternklasse<\/em> (oder <em>Basisklasse<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> bedeutet, dass ein <code>Dog<\/code> eine Art <code>Animal<\/code> ist.<\/span> <span class=\"sg\" data-s=\"1\">Die Klasse <code>Dog<\/code> hat keinen eigenen Code.<\/span> <span class=\"sg\" data-s=\"2\">Aber sie hat schon das Attribut <code>name<\/code> und die Methode <code>speak<\/code> von <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Dog<\/code>-Objekt gilt auch als <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der Smartmatch <code>~~<\/code> gegen einen Typ ist wahr, wenn das Objekt diesen Typ hat.<\/span> <span class=\"sg\" data-s=\"1\">Er ist auch wahr, wenn das Objekt von diesem Typ erbt.<\/span> <span class=\"sg\" data-s=\"2\">Im nächsten Thema ersetzt eine Kindklasse eine geerbte Methode durch ihre eigene Version.<\/span><\/p>"]]},"nl":{"t":"Overerving","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Met <em>overerving<\/em> kan de ene klasse op de andere voortbouwen.< nueva hereda todos los atributos y métodos de esa clase.<\/span> <span class=\"sg\" data-s=\"3\">Esa clase se llama su clase <em>padre<\/em> (o <em>base<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significa que un <code>Dog<\/code> es una clase de <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La clase <code>Dog<\/code> no tiene código propio.<\/span> <span class=\"sg\" data-s=\"2\">Pero ya tiene el atributo <code>name<\/code> y el método <code>speak<\/code> de <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto <code>Dog<\/code> también cuenta como <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El smart-match <code>~~<\/code> contra un tipo es verdadero si el objeto tiene ese tipo.<\/span> <span class=\"sg\" data-s=\"1\">También es verdadero si el objeto hereda de ese tipo.<\/span> <span class=\"sg\" data-s=\"2\">En el tema siguiente, una clase hija sustituye un método heredado por su propia versión.<\/span><\/p>"]]},"it":{"t":"Ereditarietà","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">L'<em>ereditarietà<\/em> permette a una classe di costruire su un'altra.<\/span> <span class=\"sg\" data-s=\"1\">Dopo il nome della nuova classe, scrivi <code>is<\/code> e il nome di un'altra classe.<\/span> <span class=\"sg\" data-s=\"2\">La nuova classe eredita allora tutti gli attributi e i metodi di quella classe.<\/span> <span class=\"sg\" data-s=\"3\">Quella classe si chiama la sua classe <em>genitrice<\/em> (o <em>base<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significa che un <code>Dog<\/code> è un tipo di <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La classe <code>Dog<\/code> non ha codice proprio.<\/span> <span class=\"sg\" data-s=\"2\">Ma ha già l'attributo <code>name<\/code> e il metodo <code>speak<\/code> di <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto <code>Dog<\/code> conta anche come un <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lo smart-match <code>~~<\/code> contro un tipo è vero se l'oggetto ha quel tipo.<\/span> <span class=\"sg\" data-s=\"1\">È vero anche se l'oggetto eredita da quel tipo.<\/span> <span class=\"sg\" data-s=\"2\">Nel prossimo argomento, una classe figlia sostituisce un metodo ereditato con una versione propria.<\/span><\/p>"]]},"lv":{"t":"Mantošana","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Mantošana<\/em> ļauj vienai klasei būvēties uz citas.<\/span> <span class=\"sg\" data-s=\"1\">Aiz jaunās klases nosaukuma jūs rakstāt <code>is<\/code> un citas klases nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Tad jaunā klase manto visus šīs klases atribūtus un metodes.<\/span> <span class=\"sg\" data-s=\"3\">Šo klasi sauc par tās <em>vecākklasi<\/em> (jeb <em>bāzes klasi<\/em>).<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> nozīmē, ka <code>Dog<\/code> ir <code>Animal<\/code> paveids.<\/span> <span class=\"sg\" data-s=\"1\">Klasei <code>Dog<\/code> nav sava koda.<\/span> <span class=\"sg\" data-s=\"2\">Bet tai jau ir atribūts <code>name<\/code> un metode <code>speak<\/code> no <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Dog<\/code> objekts skaitās arī par <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Gudrā sakritība <code>~~<\/code> pret tipu ir patiesa, ja objekts ir šī tipa.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir patiesa arī tad, ja objekts manto no šī tipa.<\/span> <span class=\"sg\" data-s=\"2\">Nākamajā tematā bērnklase aizstāj mantotu metodi ar savu versiju.<\/span><\/p>"]]},"ru":{"t":"Наследование","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Наследование<\/em> позволяет одному классу строиться на основе другого.<\/span> <span class=\"sg\" data-s=\"1\">После имени нового класса вы пишете <code>is<\/code> и имя другого класса.<\/span> <span class=\"sg\" data-s=\"2\">Тогда новый класс наследует все атрибуты и методы этого класса.<\/span> <span class=\"sg\" data-s=\"3\">Этот класс называется его <em>родительским<\/em> (или <em>базовым<\/em>) классом.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означает, что <code>Dog<\/code> — это разновидность <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">У класса <code>Dog<\/code> нет своего кода.<\/span> <span class=\"sg\" data-s=\"2\">Но у него уже есть атрибут <code>name<\/code> и метод <code>speak<\/code> из <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Объект <code>Dog<\/code> тоже считается объектом <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Умное сопоставление <code>~~<\/code> с типом истинно, если объект имеет этот тип.<\/span> <span class=\"sg\" data-s=\"1\">Оно истинно и тогда, когда объект наследует от этого типа.<\/span> <span class=\"sg\" data-s=\"2\">В следующей теме дочерний класс заменит унаследованный метод своей версией.<\/span><\/p>"]]},"uk":{"t":"Успадкування","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Успадкування<\/em> дозволяє одному класу будуватися на іншому.<\/span> <span class=\"sg\" data-s=\"1\">Після імені нового класу ви пишете <code>is<\/code> та ім'я іншого класу.<\/span> <span class=\"sg\" data-s=\"2\">Тоді новий клас успадковує всі атрибути й методи цього класу.<\/span> <span class=\"sg\" data-s=\"3\">Цей клас називають його <em>батьківським<\/em> (або <em>базовим<\/em>) класом.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означає, що <code>Dog<\/code> — це різновид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Клас <code>Dog<\/code> не має власного коду.<\/span> <span class=\"sg\" data-s=\"2\">Але він уже має атрибут <code>name<\/code> і метод <code>speak<\/code> від <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об'єкт <code>Dog<\/code> також вважається об'єктом <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Розумне зіставлення <code>~~<\/code> з типом істинне, якщо об'єкт має цей тип.<\/span> <span class=\"sg\" data-s=\"1\">Воно також істинне, якщо об'єкт успадковує від цього типу.<\/span> <span class=\"sg\" data-s=\"2\">У наступній темі дочірній клас замінює успадкований метод власною версією.<\/span><\/p>"]]},"bg":{"t":"Наследяване","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Наследяването<\/em> позволява един клас да се изгради върху друг.<\/span> <span class=\"sg\" data-s=\"1\">След името на новия клас пишете <code>is<\/code> и името на друг клас.<\/span> <span class=\"sg\" data-s=\"2\">Тогава новият клас наследява всички атрибути и методи на този клас.<\/span> <span class=\"sg\" data-s=\"3\">Този клас се нарича негов <em>родителски<\/em> (или <em>базов<\/em>) клас.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> означава, че <code>Dog<\/code> е вид <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Класът <code>Dog<\/code> няма свой собствен код.<\/span> <span class=\"sg\" data-s=\"2\">Но той вече има атрибута <code>name<\/code> и метода <code>speak<\/code> от <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обектът <code>Dog<\/code> се смята и за <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Интелигентното съпоставяне <code>~~<\/code> с тип е истина, ако обектът има този тип.<\/span> <span class=\"sg\" data-s=\"1\">То е истина и ако обектът наследява този тип.<\/span> <span class=\"sg\" data-s=\"2\">В следващата тема дъщерен клас заменя наследен метод със своя собствена версия.<\/span><\/p>"]]},"eo":{"t":"Heredo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Heredo<\/em> permesas al unu klaso konstrui sur alia.<\/span> <span class=\"sg\" data-s=\"1\">Post la nomo de la nova klaso, vi skribas <code>is<\/code> kaj la nomon de alia klaso.<\/span> <span class=\"sg\" data-s=\"2\">La nova klaso tiam heredas ĉiujn atributojn kaj metodojn de tiu klaso.<\/span> <span class=\"sg\" data-s=\"3\">Tiu klaso nomiĝas ĝia <em>patra<\/em> (aŭ <em>baza<\/em>) klaso.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> signifas, ke <code>Dog<\/code> estas speco de <code>Animal<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La klaso <code>Dog<\/code> havas neniun propran kodon.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝi jam havas la atributon <code>name<\/code> kaj la metodon <code>speak<\/code> el <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objekto <code>Dog<\/code> ankaŭ validas kiel <code>Animal<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La saĝa kongruado <code>~~<\/code> kontraŭ tipo estas vera, se la objekto havas tiun tipon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ estas vera, se la objekto heredas de tiu tipo.<\/span> <span class=\"sg\" data-s=\"2\">En la sekva temo, ida klaso anstataŭigas hereditan metodon per sia propra versio.<\/span><\/p>"]]},"la":{"t":"Hereditas","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Hereditas<\/em> permittit ut una classis super alteram aedificet.<\/span> <span class=\"sg\" data-s=\"1\">Post nomen novae classis scribis <code>is<\/code> et nomen alterius classis.<\/span> <span class=\"sg\" data-s=\"2\">Nova classis tum omnia attributa et methodos illius classis heredat.<\/span> <span class=\"sg\" data-s=\"3\">Illa classis eius classis <em>parens<\/em> (vel <em>basis<\/em>) appellatur.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak {\n        'some sound';\n    }\n}\n\nclass Dog is Animal {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>Dog is Animal<\/code> significat <code>Dog<\/code> genus quoddam <code>Animal<\/code> esse.<\/span> <span class=\"sg\" data-s=\"1\">Classis <code>Dog<\/code> nullum codicem proprium habet.<\/span> <span class=\"sg\" data-s=\"2\">Sed iam attributum <code>name<\/code> et methodum <code>speak<\/code> ex <code>Animal<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.name;  # Rex\nsay $rex.speak; # some sound<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obiectum <code>Dog<\/code> etiam pro <code>Animal<\/code> habetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.new ~~ Animal; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Comparatio callida <code>~~<\/code> contra genus vera est si obiectum illud genus habet.<\/span> <span class=\"sg\" data-s=\"1\">Etiam vera est si obiectum ab illo genere heredat.<\/span> <span class=\"sg\" data-s=\"2\">In argumento sequenti classis filia methodum hereditariam sua versione substituit.<\/span><\/p>"]]}}}</script>
