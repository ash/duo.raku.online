<script type="application/json" id="page-data">{"u":"oop/inheritance/exercises/inherited-attribute/solution","n":827,"k":"solution","pv":"oop/inheritance/exercises/inherited-attribute","nx":"oop/roles","tr":["oop","oop/inheritance"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’An inherited attribute‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> and <code>Car<\/code> both inherit the <code>wheels<\/code> attribute, and its accessor, from <code>Vehicle<\/code>. Neither of them declares the attribute again from the start. They only give the inherited attribute a default value: <code>2<\/code> for <code>Bike<\/code> and <code>4<\/code> for <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The default is built into each class. So you can create the objects with a simple <code>Bike.new<\/code> and <code>Car.new<\/code>. The inherited accessor then returns the right number of wheels.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">You can still pass the value yourself, for example <code>Car.new(wheels =&gt; 3)<\/code>. Such an argument overrides the default. But a bike or a car most likely has its usual number of wheels already. So the defaults keep the common case simple. But there is still room for a rare exception.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Ein geerbtes Attribut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> und <code>Car<\/code> erben beide das Attribut <code>wheels<\/code> und seinen Accessor von <code>Vehicle<\/code>. Keine von beiden deklariert das Attribut noch einmal ganz neu. Sie geben dem geerbten Attribut nur einen Standardwert: <code>2<\/code> für <code>Bike<\/code> und <code>4<\/code> für <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Standardwert ist in jede Klasse eingebaut. Deshalb können Sie die Objekte mit einem einfachen <code>Bike.new<\/code> und <code>Car.new<\/code> erzeugen. Der geerbte Accessor gibt dann die richtige Anzahl Räder zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Sie können den Wert trotzdem selbst übergeben, zum Beispiel <code>Car.new(wheels =&gt; 3)<\/code>. So ein Argument überschreibt den Standardwert. Aber ein Fahrrad oder ein Auto hat sehr wahrscheinlich schon seine übliche Anzahl Räder. Also halten die Standardwerte den häufigen Fall einfach. Aber es bleibt noch Platz für eine seltene Ausnahme.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Een geërfd attribuut","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> en <code>Car<\/code> erven allebei het attribuut <code>wheels<\/code>, en zijn accessor, van <code>Vehicle<\/code>. Geen van beide declareert het attribuut opnieuw vanaf het begin. Ze geven het geërfde attribuut alleen een standaardwaarde: <code>2<\/code> voor <code>Bike<\/code> en <code>4<\/code> voor <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De standaardwaarde zit in elke klasse ingebouwd. Dus kun je de objecten maken met een simpele <code>Bike.new<\/code> en <code>Car.new<\/code>. De geërfde accessor geeft dan het juiste aantal wielen terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Je kunt de waarde nog steeds zelf meegeven, bijvoorbeeld <code>Car.new(wheels =&gt; 3)<\/code>. Zo'n argument overschrijft de standaardwaarde. Maar een fiets of een auto heeft zeer waarschijnlijk al zijn gewone aantal wielen. Dus houden de standaardwaarden het gewone geval eenvoudig. Maar er blijft ruimte voor een zeldzame uitzondering.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Un atributo heredado","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> y <code>Car<\/code> heredan las dos de <code>Vehicle<\/code> el atributo <code>wheels<\/code> y su accesor. Ninguna de las dos vuelve a declarar el atributo desde cero. Solo dan al atributo heredado un valor por defecto: <code>2<\/code> para <code>Bike<\/code> y <code>4<\/code> para <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El valor por defecto está incorporado en cada clase. Así que puedes crear los objetos con un simple <code>Bike.new<\/code> y <code>Car.new<\/code>. Después el accesor heredado devuelve el número correcto de ruedas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Aun así, puedes pasar tú mismo el valor, por ejemplo <code>Car.new(wheels =&gt; 3)<\/code>. Un argumento así anula el valor por defecto. Pero lo más probable es que una bicicleta o un coche ya tenga su número habitual de ruedas. Así que los valores por defecto mantienen simple el caso común. Pero todavía queda sitio para una excepción poco frecuente.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un attributo ereditato","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> e <code>Car<\/code> ereditano entrambe da <code>Vehicle<\/code> l'attributo <code>wheels<\/code> e il suo accessore. Nessuna delle due dichiara di nuovo l'attributo da zero. Danno solo un valore predefinito all'attributo ereditato: <code>2<\/code> per <code>Bike<\/code> e <code>4<\/code> per <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Il valore predefinito è incorporato in ogni classe. Quindi puoi creare gli oggetti con un semplice <code>Bike.new<\/code> e <code>Car.new<\/code>. Poi l'accessore ereditato restituisce il numero giusto di ruote.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Puoi comunque passare tu il valore, per esempio <code>Car.new(wheels =&gt; 3)<\/code>. Un argomento così sostituisce il valore predefinito. Ma una bici o un'auto molto probabilmente ha già il suo numero abituale di ruote. Quindi i valori predefiniti tengono semplice il caso comune. Ma resta spazio per una rara eccezione.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Mantots atribūts","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> un <code>Car<\/code> abas manto no <code>Vehicle<\/code> atribūtu <code>wheels<\/code> un tā piekļuves metodi. Neviena no tām nedeklarē atribūtu no jauna. Tās tikai dod mantotajam atribūtam noklusēto vērtību: <code>2<\/code> klasei <code>Bike<\/code> un <code>4<\/code> klasei <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Noklusējums ir iebūvēts katrā klasē. Tāpēc objektus var izveidot ar vienkāršu <code>Bike.new<\/code> un <code>Car.new<\/code>. Mantotā piekļuves metode tad atgriež pareizo riteņu skaitu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Jūs joprojām varat padot vērtību paši, piemēram, <code>Car.new(wheels =&gt; 3)<\/code>. Šāds arguments pārraksta noklusējumu. Bet velosipēdam vai automašīnai visdrīzāk jau ir ierastais riteņu skaits. Tāpēc noklusējumi patur biežāko gadījumu vienkāršu. Bet joprojām paliek vieta retam izņēmumam.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Унаследованный атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследуют от <code>Vehicle<\/code> атрибут <code>wheels<\/code> вместе с его аксессором. Ни один из них не объявляет этот атрибут заново. Они только дают унаследованному атрибуту значение по умолчанию: <code>2<\/code> для <code>Bike<\/code> и <code>4<\/code> для <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Значение по умолчанию встроено в каждый класс. Поэтому объекты можно создать простым <code>Bike.new<\/code> и <code>Car.new<\/code>. Затем унаследованный аксессор возвращает нужное число колёс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Вы всё ещё можете передать значение сами, например <code>Car.new(wheels =&gt; 3)<\/code>. Такой аргумент переопределяет значение по умолчанию. Но у велосипеда или машины, скорее всего, уже есть привычное число колёс. Поэтому значения по умолчанию делают обычный случай простым. Но место для редкого исключения всё равно остаётся.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Успадкований атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І <code>Bike<\/code>, і <code>Car<\/code> успадковують атрибут <code>wheels<\/code> та його аксесор від <code>Vehicle<\/code>. Жоден із них не оголошує атрибут заново. Вони лише дають успадкованому атрибуту типове значення: <code>2<\/code> для <code>Bike<\/code> і <code>4<\/code> для <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Типове значення вбудоване в кожен клас. Тож об'єкти можна створити простими <code>Bike.new<\/code> та <code>Car.new<\/code>. Потім успадкований аксесор повертає правильну кількість коліс.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ви все одно можете передати значення самі, наприклад <code>Car.new(wheels =&gt; 3)<\/code>. Такий аргумент перекриває типове значення. Але велосипед чи автомобіль, найпевніше, вже має свою звичну кількість коліс. Тож типові значення роблять поширений випадок простим. Але для рідкісного винятку все одно лишається місце.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Наследен атрибут","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>Bike<\/code>, и <code>Car<\/code> наследяват атрибута <code>wheels<\/code>, както и неговия аксесор, от <code>Vehicle<\/code>. Никой от тях не декларира атрибута отново от самото начало. Те само дават на наследения атрибут стойност по подразбиране: <code>2<\/code> за <code>Bike<\/code> и <code>4<\/code> за <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Стойността по подразбиране е вградена във всеки клас. Затова можете да създадете обектите с обикновени <code>Bike.new<\/code> и <code>Car.new<\/code>. После наследеният аксесор връща правилния брой колела.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Пак можете сами да подадете стойността, например <code>Car.new(wheels =&gt; 3)<\/code>. Такъв аргумент надделява над стойността по подразбиране. Но велосипедът или колата най-вероятно вече имат обичайния си брой колела. Затова стойностите по подразбиране държат обичайния случай прост. Но пак остава място за рядкото изключение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Heredita atributo","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> kaj <code>Car<\/code> ambaŭ heredas la atributon <code>wheels<\/code>, kaj ĝian atingilon, el <code>Vehicle<\/code>. Neniu el ili deklaras la atributon denove de la komenco. Ili nur donas al la heredita atributo defaŭltan valoron: <code>2<\/code> por <code>Bike<\/code> kaj <code>4<\/code> por <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La defaŭlto estas enkonstruita en ĉiun klason. Do vi povas krei la objektojn per simpla <code>Bike.new<\/code> kaj <code>Car.new<\/code>. La heredita atingilo tiam redonas la ĝustan nombron de radoj.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Vi ankoraŭ povas mem transdoni la valoron, ekzemple <code>Car.new(wheels =&gt; 3)<\/code>. Tia argumento superregas la defaŭlton. Sed biciklo aŭ aŭto plej verŝajne jam havas sian kutiman nombron de radoj. Do la defaŭltoj tenas la oftan kazon simpla. Sed ankoraŭ restas loko por malofta escepto.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Attributum hereditatum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Vehicle {\n    has $.wheels;\n}\n\nclass Bike is Vehicle {\n    has $.wheels = 2;\n}\n\nclass Car is Vehicle {\n    has $.wheels = 4;\n}\n\nsay Bike.new.wheels;\nsay Car.new.wheels;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/inherited-attribute.raku\" target=\"_blank\" rel=\"noopener\">inherited-attribute.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>2\n4<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Bike<\/code> et <code>Car<\/code> ambae attributum <code>wheels<\/code>, et accessorem eius, ex <code>Vehicle<\/code> heredant. Neutra attributum ab initio iterum declarat. Solum attributo hereditato valorem praedefinitum dant: <code>2<\/code> pro <code>Bike<\/code> et <code>4<\/code> pro <code>Car<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Valor praedefinitus in quaque classe positus est. Itaque obiecta simplici <code>Bike.new<\/code> et <code>Car.new<\/code> creare potes. Accessor hereditatus tum rectum numerum rotarum reddit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Valorem tamen ipse tradere potes, exempli gratia <code>Car.new(wheels =&gt; 3)<\/code>. Tale argumentum valorem praedefinitum superat. Sed birota vel autocinetum verisimiliter iam solitum numerum rotarum habet. Itaque valores praedefiniti casum communem simplicem servant. Sed tamen spatium manet pro exceptione rara.<\/span><\/li><\/ol>"]]}}}</script>
