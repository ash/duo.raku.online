at.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Anna - manager\nBob - intern<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Manager<\/code> kaj <code>Intern<\/code> heredas la atributon <code>name<\/code> kaj la metodon <code>badge<\/code> el <code>Employee<\/code>. Do neniu el ili bezonas ripeti tiun kodon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiu ida klaso superregas <code>role<\/code>. Ĉar <code>badge<\/code> vokas <code>self.role<\/code>, ĝi uzas la novan version, kiu apartenas al la efektiva objekto. Do la manaĝero kaj la staĝanto ricevas malsamajn insignojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La nomo de la metodo, <code>role<\/code>, estas nur nomo. Sed ĝi estas la sama kiel la ŝlosilvorto <code>role<\/code>, kiun vi renkontos poste.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Operarii et partes","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Employee {\n    has $.name;\n    method role {\n        'staff';\n    }\n    method badge {\n        \"$.name - \" ~ self.role;\n    }\n}\n\nclass Manager is Employee {\n    method role { 'manager' }\n}\n\nclass Intern is Employee {\n    method role { 'intern' }\n}\n\nsay Manager.new(name =&gt; 'Anna').badge;\nsay Intern.new(name =&gt; 'Bob').badge;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/inheritance/dog-and-cat.raku\" target=\"_blank\" rel=\"noopener\">dog-and-cat.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Anna - manager\nBob - intern<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Manager<\/code> et <code>Intern<\/code> attributum <code>name<\/code> et methodum <code>badge<\/code> ex <code>Employee<\/code> heredant. Itaque neutra illum codicem repetere debet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quaeque classis filia <code>role<\/code> superscribit. Quia <code>badge<\/code> vocat <code>self.role<\/code>, novam versionem adhibet quae ad ipsum obiectum pertinet. Itaque administratrix et tiro diversas tesseras accipiunt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Nomen methodi, <code>role<\/code>, solum nomen est. Sed idem est ac verbum <code>role<\/code>, quod postea videbis.<\/span><\/li><\/ol>"]]}}}</script>
