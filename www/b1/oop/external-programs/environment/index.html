<script type="application/json" id="page-data">{"u":"oop/external-programs/environment","n":913,"k":"topic","pv":"oop/external-programs/the-proc-object/quiz","nx":"oop/external-programs/environment/quiz","tr":["oop","oop/external-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The environment","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Every program starts with a set of <em>environment variables<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">These are named values like <code>HOME<\/code>, <code>PATH<\/code>, or <code>USER<\/code>, which the operating system provides.<\/span> <span class=\"sg\" data-s=\"2\">In Raku, they are in the dynamic hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To read an environment variable, you use its name as a key in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Because <code>%*ENV<\/code> is an ordinary hash, you can also check whether a variable is set.<\/span> <span class=\"sg\" data-s=\"2\">You can also change it for the programs you start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">When you set a key in <code>%*ENV<\/code>, it becomes part of the environment.<\/span> <span class=\"sg\" data-s=\"1\">Every program that you then start with <code>run<\/code> or <code>shell<\/code> gets this environment too.<\/span> <span class=\"sg\" data-s=\"2\">This is how you pass settings down to a child program:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The variable is set in your program's environment <em>before<\/em> the child starts.<\/span> <span class=\"sg\" data-s=\"1\">So the shell that <code>run<\/code> starts already has <code>GREETING<\/code> in its own environment.<\/span> <span class=\"sg\" data-s=\"2\">It can print the value back with <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Any variable that you set in this way reaches every program you start later.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The <code>*<\/code> twigil shows that <code>%*ENV<\/code> is a dynamic variable.<\/span> <span class=\"sg\" data-s=\"1\">So is <code>$*OUT<\/code>, which you saw in the part on input and output.<\/span> <span class=\"sg\" data-s=\"2\">A few other variables with a star describe the world of the running program.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> holds the command-line arguments, and <code>$*PROGRAM-NAME<\/code> is the name of the script itself.<\/span> <span class=\"sg\" data-s=\"4\">Together, they help a program understand the situation in which it was started.<\/span><\/p>"]]},"de":{"t":"Die Umgebung","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm startet mit einer Reihe von <em>Umgebungsvariablen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das sind Werte mit Namen wie <code>HOME<\/code>, <code>PATH<\/code> oder <code>USER<\/code>, die das Betriebssystem bereitstellt.<\/span> <span class=\"sg\" data-s=\"2\">In Raku stehen sie im dynamischen Hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um eine Umgebungsvariable zu lesen, verwenden Sie ihren Namen als Schlüssel in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da <code>%*ENV<\/code> ein gewöhnlicher Hash ist, können Sie auch prüfen, ob eine Variable gesetzt ist.<\/span> <span class=\"sg\" data-s=\"2\">Sie können sie auch für die Programme ändern, die Sie starten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie einen Schlüssel in <code>%*ENV<\/code> setzen, wird er Teil der Umgebung.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Programm, das Sie danach mit <code>run<\/code> oder <code>shell<\/code> starten, bekommt diese Umgebung auch.<\/span> <span class=\"sg\" data-s=\"2\">So geben Sie Einstellungen an ein Kindprogramm weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Variable wird in der Umgebung Ihres Programms gesetzt, <em>bevor<\/em> das Kind startet.<\/span> <span class=\"sg\" data-s=\"1\">Also hat die Shell, die <code>run<\/code> startet, <code>GREETING<\/code> schon in ihrer eigenen Umgebung.<\/span> <span class=\"sg\" data-s=\"2\">Sie kann den Wert mit <code>echo<\/code> wieder ausgeben.<\/span> <span class=\"sg\" data-s=\"3\">Jede Variable, die Sie so setzen, erreicht jedes Programm, das Sie später starten.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der Twigil <code>*<\/code> zeigt, dass <code>%*ENV<\/code> eine dynamische Variable ist.<\/span> <span class=\"sg\" data-s=\"1\">Das gilt auch für <code>$*OUT<\/code>, das Sie im Teil über Ein- und Ausgabe gesehen haben.<\/span> <span class=\"sg\" data-s=\"2\">Einige andere Variablen mit Stern beschreiben die Welt des laufenden Programms.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> enthält die Befehlszeilenargumente, und <code>$*PROGRAM-NAME<\/code> ist der Name des Skripts selbst.<\/span> <span class=\"sg\" data-s=\"4\">Zusammen helfen sie einem Programm, die Situation zu verstehen, in der es gestartet wurde.<\/span><\/p>"]]},"nl":{"t":"De omgeving","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk programma start met een verzameling <em>omgevingsvariabelen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Dat zijn waarden met een naam, zoals <code>HOME<\/code>, <code>PATH<\/code> of <code>USER<\/code>, die het besturingssysteem levert.<\/span> <span class=\"sg\" data-s=\"2\">In Raku staan ze in de dynamische hash <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om een omgevingsvariabele te lezen, gebruik je haar naam als sleutel in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Omdat <code>%*ENV<\/code> een gewone hash is, kun je ook nagaan of een variabele gezet is.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt haar ook wijzigen voor de programma's die je start:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als je een sleutel in <code>%*ENV<\/code> zet, wordt hij deel van de omgeving.<\/span> <span class=\"sg\" data-s=\"1\">Elk programma dat je daarna met <code>run<\/code> of <code>shell<\/code> start, krijgt deze omgeving ook.<\/span> <span class=\"sg\" data-s=\"2\">Zo geef je instellingen door aan een kindprogramma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De variabele wordt in de omgeving van je programma gezet <em>voordat<\/em> het kind start.<\/span> <span class=\"sg\" data-s=\"1\">Dus heeft de shell die <code>run<\/code> start <code>GREETING<\/code> al in zijn eigen omgeving.<\/span> <span class=\"sg\" data-s=\"2\">Hij kan de waarde met <code>echo<\/code> weer afdrukken.<\/span> <span class=\"sg\" data-s=\"3\">Elke variabele die je zo zet, bereikt elk programma dat je later start.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De twigil <code>*<\/code> laat zien dat <code>%*ENV<\/code> een dynamische variabele is.<\/span> <span class=\"sg\" data-s=\"1\">Dat geldt ook voor <code>$*OUT<\/code>, die je zag in het deel over invoer en uitvoer.<\/span> <span class=\"sg\" data-s=\"2\">Een paar andere variabelen met een ster beschrijven de wereld van het draaiende programma.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> bevat de opdrachtregelargumenten, en <code>$*PROGRAM-NAME<\/code> is de naam van het script zelf.<\/span> <span class=\"sg\" data-s=\"4\">Samen helpen ze een programma de situatie te begrijpen waarin het gestart is.<\/span><\/p>"]]},"es":{"t":"El entorno","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Todo programa empieza con un conjunto de <em>variables de entorno<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Son valores con nombre como <code>HOME<\/code>, <code>PATH<\/code> o <code>USER<\/code>, que da el sistema operativo.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, están en el hash dinámico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para leer una variable de entorno, usas su nombre como clave en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Como <code>%*ENV<\/code> es un hash normal, también puedes comprobar si una variable está definida.<\/span> <span class=\"sg\" data-s=\"2\">También puedes cambiarla para los programas que inicias:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando pones una clave en <code>%*ENV<\/code>, pasa a ser parte del entorno.<\/span> <span class=\"sg\" data-s=\"1\">Cada programa que inicias después con <code>run<\/code> o <code>shell<\/code> recibe también este entorno.<\/span> <span class=\"sg\" data-s=\"2\">Así es como pasas ajustes a un programa hijo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variable se guarda en el entorno de tu programa <em>antes<\/em> de que empiece el hijo.<\/span> <span class=\"sg\" data-s=\"1\">Así que la shell que inicia <code>run<\/code> ya tiene <code>GREETING<\/code> en su propio entorno.<\/span> <span class=\"sg\" data-s=\"2\">Puede imprimir el valor con <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Cualquier variable que pongas de esta forma llega a todos los programas que inicies después.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El twigil <code>*<\/code> muestra que <code>%*ENV<\/code> es una variable dinámica.<\/span> <span class=\"sg\" data-s=\"1\">También lo es <code>$*OUT<\/code>, que viste en la parte sobre entrada y salida.<\/span> <span class=\"sg\" data-s=\"2\">Algunas otras variables con asterisco describen el mundo del programa en marcha.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> contiene los argumentos de la línea de comandos, y <code>$*PROGRAM-NAME<\/code> es el nombre del propio guion.<\/span> <span class=\"sg\" data-s=\"4\">Juntas, ayudan a un programa a entender la situación en la que empezó.<\/span><\/p>"]]},"it":{"t":"L'ambiente","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni programma parte con un insieme di <em>variabili d'ambiente<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sono valori con un nome, come <code>HOME<\/code>, <code>PATH<\/code> o <code>USER<\/code>, che il sistema operativo fornisce.<\/span> <span class=\"sg\" data-s=\"2\">In Raku si trovano nell'hash dinamico <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per leggere una variabile d'ambiente, usi il suo nome come chiave in <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poiché <code>%*ENV<\/code> è un normale hash, puoi anche controllare se una variabile è impostata.<\/span> <span class=\"sg\" data-s=\"2\">Puoi anche cambiarla per i programmi che avvii:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando imposti una chiave in <code>%*ENV<\/code>, questa diventa parte dell'ambiente.<\/span> <span class=\"sg\" data-s=\"1\">Ogni programma che poi avvii con <code>run<\/code> o <code>shell<\/code> riceve anche questo ambiente.<\/span> <span class=\"sg\" data-s=\"2\">È così che passi delle impostazioni a un programma figlio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variabile viene impostata nell'ambiente del tuo programma <em>prima<\/em> che il figlio parta.<\/span> <span class=\"sg\" data-s=\"1\">Quindi la shell che <code>run<\/code> avvia ha già <code>GREETING<\/code> nel suo ambiente.<\/span> <span class=\"sg\" data-s=\"2\">Può stampare di nuovo il valore con <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ogni variabile che imposti in questo modo arriva a ogni programma che avvii dopo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il twigil <code>*<\/code> mostra che <code>%*ENV<\/code> è una variabile dinamica.<\/span> <span class=\"sg\" data-s=\"1\">Lo è anche <code>$*OUT<\/code>, che hai visto nella parte su input e output.<\/span> <span class=\"sg\" data-s=\"2\">Alcune altre variabili con l'asterisco descrivono il mondo del programma in esecuzione.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> contiene gli argomenti della riga di comando, e <code>$*PROGRAM-NAME<\/code> è il nome dello script stesso.<\/span> <span class=\"sg\" data-s=\"4\">Insieme aiutano un programma a capire la situazione in cui è stato avviato.<\/span><\/p>"]]},"lv":{"t":"Vide","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Katra programma sāk darbu ar <em>vides mainīgo<\/em> kopu.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir vērtības ar nosaukumiem, piemēram, <code>HOME<\/code>, <code>PATH<\/code> vai <code>USER<\/code>, ko dod operētājsistēma.<\/span> <span class=\"sg\" data-s=\"2\">Raku tās ir dinamiskajā jauktenī <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # the home directory, e.g. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai nolasītu vides mainīgo, jūs lietojat tā nosaukumu kā atslēgu jauktenī <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā kā <code>%*ENV<\/code> ir parasts jauktenis, jūs varat arī pārbaudīt, vai mainīgais ir uzstādīts.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat arī to mainīt programmām, ko palaižat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad jūs uzstādāt atslēgu jauktenī <code>%*ENV<\/code>, tā kļūst par vides daļu.<\/span> <span class=\"sg\" data-s=\"1\">Katra programma, ko pēc tam palaižat ar <code>run<\/code> vai <code>shell<\/code>, arī saņem šo vidi.<\/span> <span class=\"sg\" data-s=\"2\">Tā jūs nododat iestatījumus tālāk bērnprogrammai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Mainīgais tiek uzstādīts jūsu programmas vidē <em>pirms<\/em> bērna palaišanas.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc čaulai, ko palaiž <code>run<\/code>, savā vidē jau ir <code>GREETING<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tā var izdrukāt vērtību atpakaļ ar <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Katrs mainīgais, ko šādi uzstādāt, sasniedz katru programmu, ko palaižat vēlāk.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Tvigils <code>*<\/code> rāda, ka <code>%*ENV<\/code> ir dinamisks mainīgais.<\/span> <span class=\"sg\" data-s=\"1\">Tāds ir arī <code>$*OUT<\/code>, ko redzējāt daļā par ievadi un izvadi.<\/span> <span class=\"sg\" data-s=\"2\">Daži citi mainīgie ar zvaigznīti apraksta pasauli, kurā programma darbojas.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> satur komandrindas argumentus, un <code>$*PROGRAM-NAME<\/code> ir paša skripta nosaukums.<\/span> <span class=\"sg\" data-s=\"4\">Kopā tie palīdz programmai saprast situāciju, kurā tā tika palaista.<\/span><\/p>"]]},"ru":{"t":"Переменные окружения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Каждая программа запускается с набором <em>переменных окружения<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это значения с именами, например <code>HOME<\/code>, <code>PATH<\/code> или <code>USER<\/code>, которые даёт операционная система.<\/span> <span class=\"sg\" data-s=\"2\">В Raku они находятся в динамическом хеше <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашний каталог, например /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы прочитать переменную окружения, используйте её имя как ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так как <code>%*ENV<\/code> — обычный хеш, можно также проверить, задана ли переменная.<\/span> <span class=\"sg\" data-s=\"2\">Ещё её можно изменить для программ, которые вы запускаете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда вы задаёте ключ в <code>%*ENV<\/code>, он становится частью окружения.<\/span> <span class=\"sg\" data-s=\"1\">Каждая программа, которую вы потом запускаете через <code>run<\/code> или <code>shell<\/code>, тоже получает это окружение.<\/span> <span class=\"sg\" data-s=\"2\">Так настройки передают дочерней программе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Переменная задаётся в окружении вашей программы <em>до<\/em> запуска потомка.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому оболочка, которую запускает <code>run<\/code>, уже имеет <code>GREETING<\/code> в собственном окружении.<\/span> <span class=\"sg\" data-s=\"2\">Она может напечатать это значение с помощью <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Любая переменная, заданная таким способом, попадает в каждую программу, которую вы запустите позже.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Твигил <code>*<\/code> показывает, что <code>%*ENV<\/code> — динамическая переменная.<\/span> <span class=\"sg\" data-s=\"1\">Такая же переменная — <code>$*OUT<\/code>, которую вы видели в части о вводе и выводе.<\/span> <span class=\"sg\" data-s=\"2\">Ещё несколько переменных со звёздочкой описывают мир работающей программы.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> хранит аргументы командной строки, а <code>$*PROGRAM-NAME<\/code> — это имя самого скрипта.<\/span> <span class=\"sg\" data-s=\"4\">Вместе они помогают программе понять, в каких условиях её запустили.<\/span><\/p>"]]},"uk":{"t":"Середовище","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожна програма запускається з набором <em>змінних середовища<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це значення з іменами, як-от <code>HOME<\/code>, <code>PATH<\/code> чи <code>USER<\/code>, які надає операційна система.<\/span> <span class=\"sg\" data-s=\"2\">У Raku вони лежать у динамічному хеші <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашній каталог, наприклад /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб прочитати змінну середовища, використайте її ім'я як ключ у <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оскільки <code>%*ENV<\/code> — звичайний хеш, ви можете також перевірити, чи змінна встановлена.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете також змінити її для програм, які запускаєте:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви встановлюєте ключ у <code>%*ENV<\/code>, він стає частиною середовища.<\/span> <span class=\"sg\" data-s=\"1\">Кожна програма, яку ви потім запускаєте через <code>run<\/code> чи <code>shell<\/code>, теж отримує це середовище.<\/span> <span class=\"sg\" data-s=\"2\">Так налаштування передають дочірній програмі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Змінна потрапляє в середовище вашої програми <em>до<\/em> запуску дочірньої програми.<\/span> <span class=\"sg\" data-s=\"1\">Тож оболонка, яку запускає <code>run<\/code>, уже має <code>GREETING<\/code> у своєму середовищі.<\/span> <span class=\"sg\" data-s=\"2\">Вона може вивести це значення через <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Будь-яка змінна, яку ви так встановили, доходить до кожної програми, яку ви запускаєте пізніше.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Твіґіл <code>*<\/code> показує, що <code>%*ENV<\/code> — динамічна змінна.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> — теж динамічна змінна, ви бачили її в частині про введення й виведення.<\/span> <span class=\"sg\" data-s=\"2\">Ще кілька змінних із зірочкою описують світ запущеної програми.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> містить аргументи командного рядка, а <code>$*PROGRAM-NAME<\/code> — це ім'я самого скрипта.<\/span> <span class=\"sg\" data-s=\"4\">Разом вони допомагають програмі зрозуміти, у якій ситуації її запустили.<\/span><\/p>"]]},"bg":{"t":"Средата","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяка програма стартира с набор от <em>променливи на средата<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това са стойности с имена като <code>HOME<\/code>, <code>PATH<\/code> или <code>USER<\/code>, които операционната система дава.<\/span> <span class=\"sg\" data-s=\"2\">В Raku те се намират в динамичния хеш <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # домашната директория, например /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да прочетете променлива на средата, използвате името ѝ като ключ в <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Понеже <code>%*ENV<\/code> е обикновен хеш, можете също да проверите дали дадена променлива е зададена.<\/span> <span class=\"sg\" data-s=\"2\">Можете и да я промените за програмите, които стартирате:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато зададете ключ в <code>%*ENV<\/code>, той става част от средата.<\/span> <span class=\"sg\" data-s=\"1\">Всяка програма, която после стартирате с <code>run<\/code> или <code>shell<\/code>, също получава тази среда.<\/span> <span class=\"sg\" data-s=\"2\">Така подавате настройки надолу към дъщерна програма:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Променливата се задава в средата на вашата програма <em>преди<\/em> детето да стартира.<\/span> <span class=\"sg\" data-s=\"1\">Затова обвивката, която <code>run<\/code> стартира, вече има <code>GREETING<\/code> в собствената си среда.<\/span> <span class=\"sg\" data-s=\"2\">Тя може да отпечата стойността обратно с <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Всяка променлива, която зададете по този начин, стига до всяка програма, която стартирате по-късно.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Туигилът <code>*<\/code> показва, че <code>%*ENV<\/code> е динамична променлива.<\/span> <span class=\"sg\" data-s=\"1\">Такава е и <code>$*OUT<\/code>, която видяхте в частта за входа и изхода.<\/span> <span class=\"sg\" data-s=\"2\">Няколко други променливи със звездичка описват света на работещата програма.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> съдържа аргументите от командния ред, а <code>$*PROGRAM-NAME<\/code> е името на самия скрипт.<\/span> <span class=\"sg\" data-s=\"4\">Заедно те помагат на програмата да разбере в каква обстановка е стартирана.<\/span><\/p>"]]},"eo":{"t":"La medio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu programo startas kun aro da <em>mediaj variabloj<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas valoroj kun nomoj, kiel <code>HOME<\/code>, <code>PATH<\/code> aŭ <code>USER<\/code>, kiujn la operaciumo donas.<\/span> <span class=\"sg\" data-s=\"2\">En Raku, ili estas en la dinamika hako <code>%*ENV<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # la hejma dosierujo, ekz. /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por legi median variablon, vi uzas ĝian nomon kiel ŝlosilon en <code>%*ENV<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉar <code>%*ENV<\/code> estas ordinara hako, vi ankaŭ povas kontroli, ĉu variablo estas starigita.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ povas ŝanĝi ĝin por la programoj, kiujn vi lanĉas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam vi metas ŝlosilon en <code>%*ENV<\/code>, ĝi fariĝas parto de la medio.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiu programo, kiun vi poste lanĉas per <code>run<\/code> aŭ <code>shell<\/code>, ankaŭ ricevas ĉi tiun medion.<\/span> <span class=\"sg\" data-s=\"2\">Tiel vi transdonas agordojn al ida programo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La variablo estas starigita en la medio de via programo <em>antaŭ<\/em> ol la ido startas.<\/span> <span class=\"sg\" data-s=\"1\">Do la ŝelo, kiun <code>run<\/code> lanĉas, jam havas <code>GREETING<\/code> en sia propra medio.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas presi la valoron per <code>echo<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu variablo, kiun vi starigas tiel, atingas ĉiun programon, kiun vi lanĉas poste.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La tvigilo <code>*<\/code> montras, ke <code>%*ENV<\/code> estas dinamika variablo.<\/span> <span class=\"sg\" data-s=\"1\">Same estas <code>$*OUT<\/code>, kiun vi vidis en la parto pri enigo kaj eligo.<\/span> <span class=\"sg\" data-s=\"2\">Kelkaj aliaj variabloj kun stelo priskribas la mondon de la ruliĝanta programo.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> tenas la komandliniajn argumentojn, kaj <code>$*PROGRAM-NAME<\/code> estas la nomo de la skripto mem.<\/span> <span class=\"sg\" data-s=\"4\">Kune, ili helpas al programo kompreni la situacion, en kiu oni lanĉis ĝin.<\/span><\/p>"]]},"la":{"t":"Ambitus","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Omne programma cum serie <em>variabilium ambitus<\/em> incipit.<\/span> <span class=\"sg\" data-s=\"1\">Sunt valores cum nominibus, ut <code>HOME<\/code>, <code>PATH<\/code> vel <code>USER<\/code>, quos systema operativum praebet.<\/span> <span class=\"sg\" data-s=\"2\">In Raku in mappa dynamica <code>%*ENV<\/code> sunt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say %*ENV&lt;HOME&gt;; # directoria domestica, exempli gratia /home/anna<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut variabilem ambitus legas, nomen eius ut clavem in <code>%*ENV<\/code> adhibes.<\/span> <span class=\"sg\" data-s=\"1\">Quia <code>%*ENV<\/code> mappa ordinaria est, etiam probare potes utrum variabilis posita sit.<\/span> <span class=\"sg\" data-s=\"2\">Eam etiam mutare potes pro programmatibus quae incipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\nsay %*ENV&lt;GREETING&gt;; # Hello<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum clavem in <code>%*ENV<\/code> ponis, pars ambitus fit.<\/span> <span class=\"sg\" data-s=\"1\">Omne programma quod deinde per <code>run<\/code> vel <code>shell<\/code> incipis hunc ambitum quoque accipit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc modo configurationem ad programma filium transmittis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>%*ENV&lt;GREETING&gt; = 'Hello';\n\nmy $proc = run 'sh', '-c', 'echo $GREETING', :out;\nsay $proc.out.slurp(:close).chomp; # Hello<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Variabilis in ambitu programmatis tui ponitur <em>antequam<\/em> filius incipit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque interpres quem <code>run<\/code> incipit iam <code>GREETING<\/code> in suo ambitu habet.<\/span> <span class=\"sg\" data-s=\"2\">Valorem per <code>echo<\/code> rursus imprimere potest.<\/span> <span class=\"sg\" data-s=\"3\">Quaelibet variabilis quam hoc modo ponis ad omne programma pervenit quod postea incipis.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Twigil <code>*<\/code> ostendit <code>%*ENV<\/code> variabilem dynamicam esse.<\/span> <span class=\"sg\" data-s=\"1\">Talis est etiam <code>$*OUT<\/code>, quam in parte de introitu et exitu vidisti.<\/span> <span class=\"sg\" data-s=\"2\">Paucae aliae variabiles cum stella mundum programmatis currentis describunt.<\/span> <span class=\"sg\" data-s=\"3\"><code>@*ARGS<\/code> argumenta lineae imperandi continet, et <code>$*PROGRAM-NAME<\/code> est nomen ipsius scripti.<\/span> <span class=\"sg\" data-s=\"4\">Simul programma adiuvant ut contextum intellegat in quo coepit.<\/span><\/p>"]]}}}</script>
