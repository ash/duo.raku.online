<script type="application/json" id="page-data">{"u":"oop/external-programs/capturing-output","n":910,"k":"topic","pv":"oop/external-programs/run-and-shell/quiz","nx":"oop/external-programs/the-proc-object","tr":["oop","oop/external-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Capturing output","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sometimes your program needs to read what an external program prints, instead of showing it.<\/span> <span class=\"sg\" data-s=\"1\">To do this, pass <code>:out<\/code> when you start the program.<\/span> <span class=\"sg\" data-s=\"2\">The returned <code>Proc<\/code> then has an <code>.out<\/code> handle to read from:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sends the program's standard output into the <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.out<\/code> handle works like the file handles from the previous section.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> reads everything from it at once.<\/span> <span class=\"sg\" data-s=\"3\">The <code>:close<\/code> adverb is a useful shortcut: it closes the handle for you after reading.<\/span> <span class=\"sg\" data-s=\"4\">You did the same clean-up yourself with <code>.close<\/code> on a file handle.<\/span> <span class=\"sg\" data-s=\"5\">This way, nothing stays open.<\/span> <span class=\"sg\" data-s=\"6\">Finally, <code>.chomp<\/code> removes the newline that <code>echo<\/code> adds at the end.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The same works with <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This is useful when you want to capture the result of a pipeline:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You can capture the error stream too, with <code>:err<\/code> and the matching <code>.err<\/code> handle.<\/span> <span class=\"sg\" data-s=\"1\">If you pass both <code>:out<\/code> and <code>:err<\/code>, the two streams stay apart.<\/span> <span class=\"sg\" data-s=\"2\">Each one has its own handle, so you can read them separately:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here, the shell command prints one line to standard output and one to standard error.<\/span> <span class=\"sg\" data-s=\"1\">The <code>&gt;&amp;2<\/code> part redirects the second line there.<\/span> <span class=\"sg\" data-s=\"2\">We asked for both streams, so <code>.out<\/code> and <code>.err<\/code> hold them separately.<\/span> <span class=\"sg\" data-s=\"3\">The normal output of the program never gets mixed up with its error messages.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Capturing output lets you use an external program as a building block.<\/span> <span class=\"sg\" data-s=\"1\">You run it, read its result, and continue with that data in your own program.<\/span><\/p>"]]},"de":{"t":"Ausgabe auffangen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Manchmal muss Ihr Programm lesen, was ein externes Programm ausgibt, statt es anzuzeigen.<\/span> <span class=\"sg\" data-s=\"1\">Dafür übergeben Sie beim Start <code>:out<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das zurückgegebene <code>Proc<\/code> hat dann einen Handle <code>.out<\/code>, aus dem Sie lesen können:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> schickt die Standardausgabe des Programms in das <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Der Handle <code>.out<\/code> funktioniert wie die Dateihandles aus dem vorigen Abschnitt.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> liest auf einmal alles daraus.<\/span> <span class=\"sg\" data-s=\"3\">Das Adverb <code>:close<\/code> ist eine nützliche Abkürzung: Es schließt den Handle nach dem Lesen für Sie.<\/span> <span class=\"sg\" data-s=\"4\">Bei einem Dateihandle haben Sie dasselbe Aufräumen selbst mit <code>.close<\/code> gemacht.<\/span> <span class=\"sg\" data-s=\"5\">So bleibt nichts offen.<\/span> <span class=\"sg\" data-s=\"6\">Schließlich entfernt <code>.chomp<\/code> den Zeilenumbruch, den <code>echo<\/code> am Ende anfügt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dasselbe funktioniert mit <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Das ist praktisch, wenn Sie das Ergebnis einer Pipeline auffangen möchten:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können auch den Fehlerstrom auffangen, mit <code>:err<\/code> und dem passenden Handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie sowohl <code>:out<\/code> als auch <code>:err<\/code> übergeben, bleiben die beiden Ströme getrennt.<\/span> <span class=\"sg\" data-s=\"2\">Jeder hat seinen eigenen Handle, also können Sie sie einzeln lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier gibt der Shell-Befehl eine Zeile auf der Standardausgabe und eine auf der Standardfehlerausgabe aus.<\/span> <span class=\"sg\" data-s=\"1\">Der Teil <code>&gt;&amp;2<\/code> leitet die zweite Zeile dorthin um.<\/span> <span class=\"sg\" data-s=\"2\">Wir haben beide Ströme angefordert, also enthalten <code>.out<\/code> und <code>.err<\/code> sie getrennt.<\/span> <span class=\"sg\" data-s=\"3\">Die normale Ausgabe des Programms wird nie mit seinen Fehlermeldungen vermischt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie Ausgabe auffangen, können Sie ein externes Programm als Baustein verwenden.<\/span> <span class=\"sg\" data-s=\"1\">Sie führen es aus, lesen sein Ergebnis und arbeiten mit diesen Daten in Ihrem eigenen Programm weiter.<\/span><\/p>"]]},"nl":{"t":"Uitvoer opvangen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Soms moet je programma lezen wat een extern programma afdrukt, in plaats van het te tonen.<\/span> <span class=\"sg\" data-s=\"1\">Geef daarvoor <code>:out<\/code> mee als je het programma start.<\/span> <span class=\"sg\" data-s=\"2\">De teruggegeven <code>Proc<\/code> heeft dan een handle <code>.out<\/code> waaruit je kunt lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> stuurt de standaarduitvoer van het programma naar de <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De handle <code>.out<\/code> werkt als de bestandshandles uit de vorige sectie.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> leest er alles in één keer uit.<\/span> <span class=\"sg\" data-s=\"3\">Het bijwoord <code>:close<\/code> is een handige afkorting: het sluit de handle voor je na het lezen.<\/span> <span class=\"sg\" data-s=\"4\">Dezelfde opruiming deed je zelf met <code>.close<\/code> op een bestandshandle.<\/span> <span class=\"sg\" data-s=\"5\">Zo blijft er niets open.<\/span> <span class=\"sg\" data-s=\"6\">Ten slotte haalt <code>.chomp<\/code> de newline weg die <code>echo<\/code> aan het eind toevoegt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hetzelfde werkt met <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dat is handig als je het resultaat van een pipeline wilt opvangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook de foutstroom opvangen, met <code>:err<\/code> en de bijbehorende handle <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Als je zowel <code>:out<\/code> als <code>:err<\/code> meegeeft, blijven de twee stromen apart.<\/span> <span class=\"sg\" data-s=\"2\">Elke stroom heeft een eigen handle, dus je kunt ze los van elkaar lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier drukt het shellcommando één regel af naar de standaarduitvoer en één naar de standaardfout.<\/span> <span class=\"sg\" data-s=\"1\">Het stuk <code>&gt;&amp;2<\/code> leidt de tweede regel daarheen om.<\/span> <span class=\"sg\" data-s=\"2\">We vroegen om beide stromen, dus bevatten <code>.out<\/code> en <code>.err<\/code> ze apart.<\/span> <span class=\"sg\" data-s=\"3\">De gewone uitvoer van het programma raakt nooit vermengd met zijn foutmeldingen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Door uitvoer op te vangen kun je een extern programma als bouwsteen gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Je draait het, leest zijn resultaat en gaat met die gegevens verder in je eigen programma.<\/span><\/p>"]]},"es":{"t":"Capturar la salida","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A veces tu programa necesita leer lo que imprime un programa externo, en lugar de mostrarlo.<\/span> <span class=\"sg\" data-s=\"1\">Para hacerlo, pasa <code>:out<\/code> al iniciar el programa.<\/span> <span class=\"sg\" data-s=\"2\">El <code>Proc<\/code> devuelto tiene entonces un manejador <code>.out<\/code> del que puedes leer:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> envía la salida estándar del programa al <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El manejador <code>.out<\/code> funciona como los manejadores de archivo de la sección anterior.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> lee todo de él de una vez.<\/span> <span class=\"sg\" data-s=\"3\">El adverbio <code>:close<\/code> es un atajo útil: cierra el manejador por ti después de leer.<\/span> <span class=\"sg\" data-s=\"4\">Tú mismo hacías la misma limpieza con <code>.close<\/code> sobre un manejador de archivo.<\/span> <span class=\"sg\" data-s=\"5\">Así no queda nada abierto.<\/span> <span class=\"sg\" data-s=\"6\">Por último, <code>.chomp<\/code> quita el salto de línea que <code>echo<\/code> añade al final.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo mismo funciona con <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto es útil cuando quieres capturar el resultado de una tubería:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">También puedes capturar el flujo de errores, con <code>:err<\/code> y el manejador <code>.err<\/code> correspondiente.<\/span> <span class=\"sg\" data-s=\"1\">Si pasas <code>:out<\/code> y <code>:err<\/code> a la vez, los dos flujos quedan separados.<\/span> <span class=\"sg\" data-s=\"2\">Cada uno tiene su propio manejador, así que puedes leerlos por separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí, la orden de la shell imprime una línea en la salida estándar y otra en el error estándar.<\/span> <span class=\"sg\" data-s=\"1\">La parte <code>&gt;&amp;2<\/code> redirige la segunda línea ahí.<\/span> <span class=\"sg\" data-s=\"2\">Hemos pedido los dos flujos, así que <code>.out<\/code> y <code>.err<\/code> los guardan por separado.<\/span> <span class=\"sg\" data-s=\"3\">La salida normal del programa nunca se mezcla con sus mensajes de error.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Capturar la salida te permite usar un programa externo como pieza de construcción.<\/span> <span class=\"sg\" data-s=\"1\">Lo ejecutas, lees su resultado y sigues con esos datos en tu propio programa.<\/span><\/p>"]]},"it":{"t":"Catturare l'output","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A volte il tuo programma deve leggere quello che stampa un programma esterno, invece di mostrarlo.<\/span> <span class=\"sg\" data-s=\"1\">Per farlo, passa <code>:out<\/code> quando avvii il programma.<\/span> <span class=\"sg\" data-s=\"2\">Il <code>Proc<\/code> restituito ha allora un handle <code>.out<\/code> da cui leggere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> manda l'output standard del programma dentro il <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">L'handle <code>.out<\/code> funziona come gli handle di file della sezione precedente.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> ne legge tutto il contenuto in una volta.<\/span> <span class=\"sg\" data-s=\"3\">L'avverbio <code>:close<\/code> è una scorciatoia utile: chiude l'handle al posto tuo dopo la lettura.<\/span> <span class=\"sg\" data-s=\"4\">Con un handle di file facevi da solo la stessa pulizia, con <code>.close<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">In questo modo non resta niente di aperto.<\/span> <span class=\"sg\" data-s=\"6\">Infine <code>.chomp<\/code> toglie il ritorno a capo che <code>echo<\/code> aggiunge alla fine.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lo stesso funziona con <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo è comodo quando vuoi catturare il risultato di una pipeline:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi catturare anche il flusso degli errori, con <code>:err<\/code> e l'handle <code>.err<\/code> che gli corrisponde.<\/span> <span class=\"sg\" data-s=\"1\">Se passi sia <code>:out<\/code> sia <code>:err<\/code>, i due flussi restano separati.<\/span> <span class=\"sg\" data-s=\"2\">Ognuno ha il suo handle, così puoi leggerli separatamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Qui il comando della shell stampa una riga sull'output standard e una sull'errore standard.<\/span> <span class=\"sg\" data-s=\"1\">La parte <code>&gt;&amp;2<\/code> redirige lì la seconda riga.<\/span> <span class=\"sg\" data-s=\"2\">Abbiamo chiesto entrambi i flussi, quindi <code>.out<\/code> e <code>.err<\/code> li tengono separati.<\/span> <span class=\"sg\" data-s=\"3\">Il normale output del programma non si mescola mai con i suoi messaggi di errore.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Catturare l'output ti permette di usare un programma esterno come un mattoncino.<\/span> <span class=\"sg\" data-s=\"1\">Lo esegui, leggi il suo risultato e prosegui con quei dati nel tuo programma.<\/span><\/p>"]]},"lv":{"t":"Izvades pārtveršana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jūsu programmai jānolasa tas, ko ārēja programma izdrukā, nevis jārāda tas ekrānā.<\/span> <span class=\"sg\" data-s=\"1\">Lai to izdarītu, padodiet <code>:out<\/code>, kad palaižat programmu.<\/span> <span class=\"sg\" data-s=\"2\">Atgrieztajam <code>Proc<\/code> tad ir turis <code>.out<\/code>, no kura var lasīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sūta programmas standarta izvadi uz <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Turis <code>.out<\/code> darbojas kā failu turi no iepriekšējās sadaļas.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> nolasa no tā visu uzreiz.<\/span> <span class=\"sg\" data-s=\"3\">Apstākļvārds <code>:close<\/code> ir noderīgs saīsinājums: pēc nolasīšanas tas aizver turi jūsu vietā.<\/span> <span class=\"sg\" data-s=\"4\">To pašu sakopšanu jūs paši veicāt ar <code>.close<\/code> uz faila tura.<\/span> <span class=\"sg\" data-s=\"5\">Tādā veidā nekas nepaliek atvērts.<\/span> <span class=\"sg\" data-s=\"6\">Visbeidzot <code>.chomp<\/code> noņem jaunās rindas rakstzīmi, ko <code>echo<\/code> pievieno beigās.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas pats darbojas ar <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas noder, kad gribat noķert cauruļvada rezultātu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jūs varat noķert arī kļūdu plūsmu — ar <code>:err<\/code> un atbilstošo turi <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja padodat gan <code>:out<\/code>, gan <code>:err<\/code>, abas plūsmas paliek atsevišķi.<\/span> <span class=\"sg\" data-s=\"2\">Katrai ir savs turis, tāpēc tās var lasīt atsevišķi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit čaulas komanda izdrukā vienu rindu standarta izvadē un vienu standarta kļūdu plūsmā.<\/span> <span class=\"sg\" data-s=\"1\">Daļa <code>&gt;&amp;2<\/code> novirza otro rindu turp.<\/span> <span class=\"sg\" data-s=\"2\">Mēs prasījām abas plūsmas, tāpēc <code>.out<\/code> un <code>.err<\/code> tās glabā atsevišķi.<\/span> <span class=\"sg\" data-s=\"3\">Programmas parastā izvade nekad nesajaucas ar tās kļūdu paziņojumiem.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Izvades noķeršana ļauj izmantot ārēju programmu kā būvbloku.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to palaižat, nolasāt tās rezultātu un turpināt darbu ar šiem datiem savā programmā.<\/span><\/p>"]]},"ru":{"t":"Захват вывода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Иногда вашей программе нужно прочитать то, что печатает внешняя программа, а не показывать это на экране.<\/span> <span class=\"sg\" data-s=\"1\">Для этого передайте <code>:out<\/code>, когда запускаете программу.<\/span> <span class=\"sg\" data-s=\"2\">Тогда у возвращённого <code>Proc<\/code> есть дескриптор <code>.out<\/code>, из которого можно читать:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> отправляет стандартный вывод программы в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Дескриптор <code>.out<\/code> работает как файловые дескрипторы из предыдущего раздела.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> читает из него всё сразу.<\/span> <span class=\"sg\" data-s=\"3\">Наречие <code>:close<\/code> — удобное сокращение: после чтения оно закрывает дескриптор за вас.<\/span> <span class=\"sg\" data-s=\"4\">Ту же уборку вы делали сами с помощью <code>.close<\/code> у файлового дескриптора.<\/span> <span class=\"sg\" data-s=\"5\">Так ничего не остаётся открытым.<\/span> <span class=\"sg\" data-s=\"6\">Наконец, <code>.chomp<\/code> убирает перевод строки, который <code>echo<\/code> добавляет в конце.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">То же работает и с <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это удобно, когда нужно перехватить результат конвейера:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Перехватить можно и поток ошибок — с помощью <code>:err<\/code> и соответствующего дескриптора <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если передать и <code>:out<\/code>, и <code>:err<\/code>, два потока останутся раздельными.<\/span> <span class=\"sg\" data-s=\"2\">У каждого из них свой дескриптор, поэтому их можно читать по отдельности:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Здесь команда оболочки печатает одну строку в стандартный вывод, а другую — в стандартный поток ошибок.<\/span> <span class=\"sg\" data-s=\"1\">Часть <code>&gt;&amp;2<\/code> перенаправляет туда вторую строку.<\/span> <span class=\"sg\" data-s=\"2\">Мы попросили оба потока, поэтому <code>.out<\/code> и <code>.err<\/code> хранят их отдельно.<\/span> <span class=\"sg\" data-s=\"3\">Обычный вывод программы никогда не смешивается с её сообщениями об ошибках.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Захват вывода позволяет использовать внешнюю программу как строительный блок.<\/span> <span class=\"sg\" data-s=\"1\">Вы запускаете её, читаете результат и дальше работаете с этими данными в своей программе.<\/span><\/p>"]]},"uk":{"t":"Перехоплення виводу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Іноді вашій програмі треба прочитати те, що виводить зовнішня програма, а не показувати це.<\/span> <span class=\"sg\" data-s=\"1\">Для цього передайте <code>:out<\/code>, коли запускаєте програму.<\/span> <span class=\"sg\" data-s=\"2\">Тоді повернений <code>Proc<\/code> має дескриптор <code>.out<\/code>, з якого можна читати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> надсилає стандартний вивід програми в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Дескриптор <code>.out<\/code> працює як дескриптори файлів із попереднього розділу.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> читає з нього все за раз.<\/span> <span class=\"sg\" data-s=\"3\">Наріччя <code>:close<\/code> — зручне скорочення: воно закриває дескриптор за вас після читання.<\/span> <span class=\"sg\" data-s=\"4\">Те саме прибирання ви робили самі через <code>.close<\/code> для дескриптора файлу.<\/span> <span class=\"sg\" data-s=\"5\">Так нічого не лишається відкритим.<\/span> <span class=\"sg\" data-s=\"6\">Нарешті, <code>.chomp<\/code> прибирає символ нового рядка, який <code>echo<\/code> додає в кінці.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Так само працює й <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це корисно, коли ви хочете перехопити результат конвеєра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можна перехопити й потік помилок — через <code>:err<\/code> і відповідний дескриптор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо передати і <code>:out<\/code>, і <code>:err<\/code>, два потоки лишаються окремими.<\/span> <span class=\"sg\" data-s=\"2\">Кожен має свій дескриптор, тож їх можна читати окремо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тут команда оболонки виводить один рядок у стандартний вивід, а другий — у стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"1\">Частина <code>&gt;&amp;2<\/code> перенаправляє туди другий рядок.<\/span> <span class=\"sg\" data-s=\"2\">Ми попросили обидва потоки, тож <code>.out<\/code> і <code>.err<\/code> тримають їх окремо.<\/span> <span class=\"sg\" data-s=\"3\">Звичайний вивід програми ніколи не змішується з її повідомленнями про помилки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехоплення виводу дозволяє використати зовнішню програму як будівельний блок.<\/span> <span class=\"sg\" data-s=\"1\">Ви запускаєте її, читаєте її результат і працюєте далі з цими даними у своїй програмі.<\/span><\/p>"]]},"bg":{"t":"Улавяне на изхода","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Понякога програмата ви трябва да прочете какво отпечатва външна програма, вместо да го показва.<\/span> <span class=\"sg\" data-s=\"1\">За целта подайте <code>:out<\/code>, когато стартирате програмата.<\/span> <span class=\"sg\" data-s=\"2\">Тогава върнатият <code>Proc<\/code> има манипулатор <code>.out<\/code>, от който да четете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> изпраща стандартния изход на програмата в <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Манипулаторът <code>.out<\/code> работи като манипулаторите на файлове от предишния раздел.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> прочита всичко от него наведнъж.<\/span> <span class=\"sg\" data-s=\"3\">Наречието <code>:close<\/code> е удобно съкращение: след четенето то затваря манипулатора вместо вас.<\/span> <span class=\"sg\" data-s=\"4\">Същото разчистване правехте сами с <code>.close<\/code> върху манипулатор на файл.<\/span> <span class=\"sg\" data-s=\"5\">Така нищо не остава отворено.<\/span> <span class=\"sg\" data-s=\"6\">Накрая <code>.chomp<\/code> премахва новия ред, който <code>echo<\/code> добавя в края.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Същото работи и с <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е удобно, когато искате да уловите резултата от конвейер:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да уловите и потока за грешки с <code>:err<\/code> и съответния манипулатор <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако подадете и <code>:out<\/code>, и <code>:err<\/code>, двата потока остават разделени.<\/span> <span class=\"sg\" data-s=\"2\">Всеки има свой манипулатор, така че можете да ги четете поотделно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тук командата на обвивката отпечатва един ред в стандартния изход и един в стандартната грешка.<\/span> <span class=\"sg\" data-s=\"1\">Частта <code>&gt;&amp;2<\/code> пренасочва втория ред натам.<\/span> <span class=\"sg\" data-s=\"2\">Поискахме и двата потока, така че <code>.out<\/code> и <code>.err<\/code> ги държат поотделно.<\/span> <span class=\"sg\" data-s=\"3\">Обикновеният изход на програмата никога не се смесва със съобщенията ѝ за грешки.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Улавянето на изхода ви позволява да използвате външна програма като градивен блок.<\/span> <span class=\"sg\" data-s=\"1\">Изпълнявате я, четете резултата ѝ и продължавате с тези данни в собствената си програма.<\/span><\/p>"]]},"eo":{"t":"Kapti la eligon","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Foje via programo bezonas legi tion, kion ekstera programo presas, anstataŭ montri ĝin.<\/span> <span class=\"sg\" data-s=\"1\">Por tio, transdonu <code>:out<\/code>, kiam vi lanĉas la programon.<\/span> <span class=\"sg\" data-s=\"2\">La redonita <code>Proc<\/code> tiam havas tenilon <code>.out<\/code>, el kiu vi povas legi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> sendas la norman eligon de la programo en la <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La tenilo <code>.out<\/code> funkcias kiel la dosierteniloj el la antaŭa sekcio.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> legas ĉion el ĝi samtempe.<\/span> <span class=\"sg\" data-s=\"3\">La adverbo <code>:close<\/code> estas utila mallongigo: ĝi fermas la tenilon por vi post la legado.<\/span> <span class=\"sg\" data-s=\"4\">Vi faris la saman ordigon mem per <code>.close<\/code> sur dosiertenilo.<\/span> <span class=\"sg\" data-s=\"5\">Tiel nenio restas malfermita.<\/span> <span class=\"sg\" data-s=\"6\">Fine, <code>.chomp<\/code> forigas la linifinon, kiun <code>echo<\/code> aldonas ĉe la fino.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La samo funkcias kun <code>shell<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio estas utila, kiam vi volas kapti la rezulton de dukto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas kapti la erarfluon, per <code>:err<\/code> kaj la responda tenilo <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se vi transdonas kaj <code>:out<\/code> kaj <code>:err<\/code>, la du fluoj restas apartaj.<\/span> <span class=\"sg\" data-s=\"2\">Ĉiu havas sian propran tenilon, do vi povas legi ilin aparte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la ŝela komando presas unu linion al norma eligo kaj unu al norma erarfluo.<\/span> <span class=\"sg\" data-s=\"1\">La parto <code>&gt;&amp;2<\/code> redirektas la duan linion tien.<\/span> <span class=\"sg\" data-s=\"2\">Ni petis ambaŭ fluojn, do <code>.out<\/code> kaj <code>.err<\/code> tenas ilin aparte.<\/span> <span class=\"sg\" data-s=\"3\">La normala eligo de la programo neniam miksiĝas kun ĝiaj erarmesaĝoj.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kapti eligon permesas al vi uzi eksteran programon kiel konstruelementon.<\/span> <span class=\"sg\" data-s=\"1\">Vi rulas ĝin, legas ĝian rezulton kaj daŭrigas kun tiuj datumoj en via propra programo.<\/span><\/p>"]]},"la":{"t":"Exitum capere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Interdum programma tuum legere debet quod programma externum imprimit, non id in screen ostendere.<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <code>:out<\/code> trade cum programma incipis.<\/span> <span class=\"sg\" data-s=\"2\"><code>Proc<\/code> redditum tum tractabulum <code>.out<\/code> habet, ex quo legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hello', :out;\nmy $output = $proc.out.slurp(:close);\nsay $output.chomp; # hello<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\"><code>:out<\/code> exitum vulgarem programmatis in <code>Proc<\/code> mittit.<\/span> <span class=\"sg\" data-s=\"1\">Tractabulum <code>.out<\/code> sicut tractabula archivorum ex sectione superiore operatur.<\/span> <span class=\"sg\" data-s=\"2\"><code>.slurp<\/code> omnia ex eo simul legit.<\/span> <span class=\"sg\" data-s=\"3\">Adverbium <code>:close<\/code> compendium utile est: post lectionem tractabulum pro te claudit.<\/span> <span class=\"sg\" data-s=\"4\">Eandem purgationem ipse per <code>.close<\/code> in tractabulo archivi fecisti.<\/span> <span class=\"sg\" data-s=\"5\">Sic nihil apertum manet.<\/span> <span class=\"sg\" data-s=\"6\">Denique <code>.chomp<\/code> novam lineam removet quam <code>echo<\/code> in fine addit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Idem cum <code>shell<\/code> operatur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc utile est cum effectum fistulae capere vis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = shell 'echo hello | tr a-z A-Z', :out;\nsay $proc.out.slurp(:close).chomp; # HELLO<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Etiam fluentum errorum capere potes, per <code>:err<\/code> et tractabulum conveniens <code>.err<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si et <code>:out<\/code> et <code>:err<\/code> tradis, duo fluenta separata manent.<\/span> <span class=\"sg\" data-s=\"2\">Utrumque suum tractabulum habet, itaque ea separatim legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'echo out-line; echo err-line &gt;&amp;2', :out, :err;\n\nsay 'stdout: ', $proc.out.slurp(:close).chomp; # stdout: out-line\nsay 'stderr: ', $proc.err.slurp(:close).chomp; # stderr: err-line<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hic imperatum interpretis unam lineam ad exitum vulgarem et unam ad errorem vulgarem imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Pars <code>&gt;&amp;2<\/code> secundam lineam illuc redirigit.<\/span> <span class=\"sg\" data-s=\"2\">Utrumque fluentum petivimus, itaque <code>.out<\/code> et <code>.err<\/code> ea separatim tenent.<\/span> <span class=\"sg\" data-s=\"3\">Exitus ordinarius programmatis numquam cum nuntiis errorum eius miscetur.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Exitum capere tibi permittit programmate externo ut lapide aedificandi uti.<\/span> <span class=\"sg\" data-s=\"1\">Id curris, effectum eius legis, et cum illis datis in programmate tuo pergis.<\/span><\/p>"]]}}}</script>
