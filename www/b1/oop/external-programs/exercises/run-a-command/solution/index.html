<script type="application/json" id="page-data">{"u":"oop/external-programs/exercises/run-a-command/solution","n":917,"k":"solution","pv":"oop/external-programs/exercises/run-a-command","nx":"oop/external-programs/exercises/capture-output","tr":["oop","oop/external-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Run a command‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> starts <code>echo<\/code> directly and passes each string as a separate argument. Without <code>:out<\/code>, the program's output goes straight to the screen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The argument reaches <code>echo<\/code> exactly as written. <code>$HOME<\/code> is printed as it is, not replaced with your home directory. This is because there is no shell to replace it. That is why <code>run<\/code> is the safe default. The same command given to <code>shell<\/code> could behave very differently.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">To really print the home directory, let a shell replace the variable. <code>shell 'echo home: $HOME'<\/code> prints something like <code>home: /home/anna<\/code>. Keep the single quotes on the Raku side too. A double-quoted <code>\"$HOME\"<\/code> would cause a problem. Raku itself would try to insert a variable named <code>$HOME<\/code> into the string. This would happen before <code>echo<\/code> even runs.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Führen Sie einen Befehl aus","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> startet <code>echo<\/code> direkt und übergibt jede Zeichenkette als eigenes Argument. Ohne <code>:out<\/code> geht die Ausgabe des Programms direkt auf den Bildschirm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das Argument erreicht <code>echo<\/code> genau so, wie es geschrieben ist. <code>$HOME<\/code> wird unverändert ausgegeben und nicht durch Ihr Heimatverzeichnis ersetzt. Das liegt daran, dass keine Shell da ist, die es ersetzen könnte. Deshalb ist <code>run<\/code> die sichere Standardwahl. Derselbe Befehl könnte sich mit <code>shell<\/code> ganz anders verhalten.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Um das Heimatverzeichnis wirklich auszugeben, lassen Sie eine Shell die Variable ersetzen. <code>shell 'echo home: $HOME'<\/code> gibt etwas wie <code>home: /home/anna<\/code> aus. Behalten Sie die einfachen Anführungszeichen auch auf der Raku-Seite. Ein <code>\"$HOME\"<\/code> in doppelten Anführungszeichen würde ein Problem verursachen. Raku selbst würde versuchen, eine Variable namens <code>$HOME<\/code> in die Zeichenkette einzusetzen. Das würde passieren, noch bevor <code>echo<\/code> überhaupt läuft.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Draai een commando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> start <code>echo<\/code> rechtstreeks en geeft elke string als afzonderlijk argument mee. Zonder <code>:out<\/code> gaat de uitvoer van het programma meteen naar het scherm.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Het argument bereikt <code>echo<\/code> precies zoals het geschreven is. <code>$HOME<\/code> wordt afgedrukt zoals het er staat, en niet vervangen door je thuismap. Dat komt doordat er geen shell is die het vervangt. Daarom is <code>run<\/code> de veilige standaardkeuze. Hetzelfde commando zou zich bij <code>shell<\/code> heel anders kunnen gedragen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Om de thuismap echt af te drukken, laat je een shell de variabele vervangen. <code>shell 'echo home: $HOME'<\/code> drukt iets af als <code>home: /home/anna<\/code>. Houd ook aan de Raku-kant de enkele aanhalingstekens. Een <code>\"$HOME\"<\/code> met dubbele aanhalingstekens zou een probleem geven. Raku zou dan zelf proberen een variabele met de naam <code>$HOME<\/code> in de string te zetten. Dat zou gebeuren nog voordat <code>echo<\/code> draait.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Ejecute un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> inicia <code>echo<\/code> directamente y pasa cada cadena como un argumento separado. Sin <code>:out<\/code>, la salida del programa va directa a la pantalla.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El argumento llega a <code>echo<\/code> exactamente como está escrito. <code>$HOME<\/code> se imprime tal cual, y no se cambia por tu carpeta personal. Esto pasa porque no hay ninguna shell que lo cambie. Por eso <code>run<\/code> es la opción segura por defecto. La misma orden dada a <code>shell<\/code> podría funcionar de forma muy distinta.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Para imprimir de verdad la carpeta personal, deja que una shell cambie la variable. <code>shell 'echo home: $HOME'<\/code> imprime algo como <code>home: /home/anna<\/code>. Mantén también las comillas simples del lado de Raku. Unas comillas dobles, <code>\"$HOME\"<\/code>, causarían un problema. Raku mismo intentaría poner una variable llamada <code>$HOME<\/code> en la cadena. Esto pasaría incluso antes de ejecutar <code>echo<\/code>.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Eseguite un comando","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> avvia <code>echo<\/code> direttamente e passa ogni stringa come argomento separato. Senza <code>:out<\/code>, l'output del programma va dritto sullo schermo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'argomento arriva a <code>echo<\/code> esattamente come è scritto. <code>$HOME<\/code> viene stampato così com'è, senza essere sostituito con la tua directory home. Questo perché non c'è una shell che lo sostituisca. Ecco perché <code>run<\/code> è la scelta predefinita sicura. Lo stesso comando dato a <code>shell<\/code> potrebbe comportarsi in modo molto diverso.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Per stampare davvero la directory home, lascia che una shell sostituisca la variabile. <code>shell 'echo home: $HOME'<\/code> stampa qualcosa come <code>home: /home/anna<\/code>. Tieni le virgolette singole anche dal lato Raku. Un <code>\"$HOME\"<\/code> fra virgolette doppie causerebbe un problema. Raku stesso proverebbe a inserire nella stringa una variabile di nome <code>$HOME<\/code>. Questo succederebbe prima ancora che <code>echo<\/code> parta.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Palaidiet komandu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> palaiž <code>echo<\/code> tieši un padod katru virkni kā atsevišķu argumentu. Bez <code>:out<\/code> programmas izvade iet tieši uz ekrānu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Arguments nonāk pie <code>echo<\/code> tieši tā, kā uzrakstīts. <code>$HOME<\/code> tiek izdrukāts tāds, kāds tas ir, nevis aizstāts ar jūsu mājas direktoriju. Tas ir tāpēc, ka nav čaulas, kas to aizstātu. Tieši tāpēc <code>run<\/code> ir drošais noklusējums. Ja to pašu komandu dotu <code>shell<\/code>, tā varētu darboties pavisam citādi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Lai tiešām izdrukātu mājas direktoriju, ļaujiet čaulai aizstāt mainīgo. <code>shell 'echo home: $HOME'<\/code> izdrukā kaut ko līdzīgu <code>home: /home/anna<\/code>. Paturiet vienpēdiņas arī Raku pusē. Dubultpēdiņās likts <code>\"$HOME\"<\/code> radītu problēmu. Pats Raku mēģinātu ielikt virknē mainīgo ar nosaukumu <code>$HOME<\/code>. Tas notiktu vēl pirms <code>echo<\/code> palaišanas.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Запустите команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускает <code>echo<\/code> напрямую и передаёт каждую строку отдельным аргументом. Без <code>:out<\/code> вывод программы идёт прямо на экран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент доходит до <code>echo<\/code> ровно в том виде, в каком он написан. <code>$HOME<\/code> печатается как есть и не заменяется вашим домашним каталогом. Так происходит потому, что нет оболочки, которая бы его заменила. Вот почему <code>run<\/code> — безопасный выбор по умолчанию. Та же команда, переданная <code>shell<\/code>, могла бы вести себя совсем иначе.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Чтобы всё-таки напечатать домашний каталог, пусть переменную заменит оболочка. <code>shell 'echo home: $HOME'<\/code> напечатает что-нибудь вроде <code>home: /home/anna<\/code>. Оставьте одинарные кавычки и на стороне Raku. С <code>\"$HOME\"<\/code> в двойных кавычках была бы проблема. Сам Raku попытался бы вставить в строку переменную с именем <code>$HOME<\/code>. Это случилось бы ещё до того, как запустится <code>echo<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Запустіть команду","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> запускає <code>echo<\/code> напряму й передає кожен рядок як окремий аргумент. Без <code>:out<\/code> вивід програми йде просто на екран.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргумент доходить до <code>echo<\/code> точно таким, як його записано. <code>$HOME<\/code> виводиться без змін і не замінюється вашим домашнім каталогом. Це тому, що немає оболонки, яка б його замінила. Ось чому <code>run<\/code> — безпечний вибір за замовчуванням. Та сама команда, передана до <code>shell<\/code>, могла б працювати зовсім інакше.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Щоб справді вивести домашній каталог, дозвольте оболонці замінити змінну. <code>shell 'echo home: $HOME'<\/code> виводить щось на кшталт <code>home: /home/anna<\/code>. Залиште також одинарні лапки на боці Raku. Рядок у подвійних лапках <code>\"$HOME\"<\/code> створив би проблему. Raku сам спробував би вставити в рядок змінну з іменем <code>$HOME<\/code>. Це сталося б ще до того, як <code>echo<\/code> взагалі запуститься.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изпълнете команда","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> стартира <code>echo<\/code> направо и подава всеки низ като отделен аргумент. Без <code>:out<\/code> изходът на програмата отива право на екрана.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Аргументът стига до <code>echo<\/code> точно както е написан. <code>$HOME<\/code> се отпечатва така, както е, а не се заменя с домашната ви директория. Това е така, защото няма обвивка, която да го замени. Затова <code>run<\/code> е безопасният избор по подразбиране. Същата команда, подадена на <code>shell<\/code>, би могла да се държи съвсем различно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">За да отпечатате наистина домашната директория, оставете обвивката да замени променливата. <code>shell 'echo home: $HOME'<\/code> отпечатва нещо като <code>home: /home/anna<\/code>. Запазете единичните кавички и от страна на Raku. Низ в двойни кавички <code>\"$HOME\"<\/code> би създал проблем. Самият Raku би се опитал да вмъкне в низа променлива на име <code>$HOME<\/code>. Това би станало, преди <code>echo<\/code> изобщо да е започнала работа.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Rulu komandon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> lanĉas <code>echo<\/code> rekte kaj transdonas ĉiun ĉenon kiel apartan argumenton. Sen <code>:out<\/code>, la eligo de la programo iras rekte al la ekrano.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La argumento atingas <code>echo<\/code> ĝuste tiel, kiel ĝi estas skribita. <code>$HOME<\/code> estas presata tiel, kiel ĝi estas, ne anstataŭigita per via hejma dosierujo. Tio estas, ĉar ne estas ŝelo, kiu anstataŭigus ĝin. Tial <code>run<\/code> estas la sekura defaŭlto. La sama komando, donita al <code>shell<\/code>, povus konduti tre alie.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Por vere presi la hejman dosierujon, lasu ŝelon anstataŭigi la variablon. <code>shell 'echo home: $HOME'<\/code> presas ion kiel <code>home: /home/anna<\/code>. Tenu la unuoblajn citilojn ankaŭ ĉe la Raku-flanko. Duoble citita <code>\"$HOME\"<\/code> kaŭzus problemon. Raku mem provus enmeti variablon nomatan <code>$HOME<\/code> en la ĉenon. Tio okazus eĉ antaŭ ol <code>echo<\/code> ruliĝas.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Mandatum exsequere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'home:', '$HOME';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/external-programs/run-a-command.raku\" target=\"_blank\" rel=\"noopener\">run-a-command.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>home: $HOME<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>run<\/code> programma <code>echo<\/code> directe incipit et quamque chordam ut argumentum separatum tradit. Sine <code>:out<\/code> exitus programmatis recta in screen it.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Argumentum ad <code>echo<\/code> exacte ut scriptum pervenit. <code>$HOME<\/code> ut est imprimitur, non in directoriam domesticam tuam mutatum. Hoc fit quia nullus interpres adest qui id mutet. Ideo <code>run<\/code> electio praedefinita tuta est. Idem imperatum ad <code>shell<\/code> datum valde aliter se gerere posset.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ut directoriam domesticam vere imprimas, sine interpretem variabilem mutare. <code>shell 'echo home: $HOME'<\/code> aliquid ut <code>home: /home/anna<\/code> imprimit. Etiam apostrophos simplices in parte Raku serva. <code>\"$HOME\"<\/code> cum apostrophis duplicibus problema faceret. Ipsum Raku variabilem nomine <code>$HOME<\/code> in chordam inserere conaretur. Hoc fieret antequam <code>echo<\/code> omnino curreret.<\/span><\/li><\/ol>"]]}}}</script>
