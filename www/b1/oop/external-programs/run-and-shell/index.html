<script type="application/json" id="page-data">{"u":"oop/external-programs/run-and-shell","n":908,"k":"topic","pv":"oop/external-programs","nx":"oop/external-programs/run-and-shell/quiz","tr":["oop","oop/external-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"run and shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">There are two ways to start an external program.<\/span> <span class=\"sg\" data-s=\"1\">The <code>run<\/code> function takes the command and its arguments as <strong>separate<\/strong> values.<\/span> <span class=\"sg\" data-s=\"2\">It runs the program directly, without a shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This runs the <code>echo<\/code> program with the single argument <code>hello<\/code>, so it prints <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The arguments are passed separately, so a shell cannot misread spaces or special characters.<\/span> <span class=\"sg\" data-s=\"2\">That is why <code>run<\/code> is the safe default.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>shell<\/code> function works differently.<\/span> <span class=\"sg\" data-s=\"1\">It passes a <strong>single string<\/strong> to the system shell, which reads and runs it.<\/span> <span class=\"sg\" data-s=\"2\">This lets you use shell features such as pipes and redirection:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Here, the shell runs <code>echo<\/code> and sends its output through <code>tr<\/code> with a pipe.<\/span> <span class=\"sg\" data-s=\"1\">Then it prints <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">This is convenient, but you must be careful.<\/span> <span class=\"sg\" data-s=\"3\">The shell itself decides what the string means.<\/span> <span class=\"sg\" data-s=\"4\">So it is dangerous to build a <code>shell<\/code> command from input you do not trust.<\/span> <span class=\"sg\" data-s=\"5\">Use <code>run<\/code> unless you really need shell features.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Both functions return a <code>Proc<\/code> object, which describes how the program finished.<\/span> <span class=\"sg\" data-s=\"1\">By default, the started program shares the output of your program.<\/span> <span class=\"sg\" data-s=\"2\">So what it prints appears on the screen.<\/span> <span class=\"sg\" data-s=\"3\">To capture that output instead, you have to ask for it.<\/span> <span class=\"sg\" data-s=\"4\">This is the subject of the next topic.<\/span><\/p>"]]},"de":{"t":"run und shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Es gibt zwei Wege, ein externes Programm zu starten.<\/span> <span class=\"sg\" data-s=\"1\">Die Funktion <code>run<\/code> nimmt den Befehl und seine Argumente als <strong>getrennte<\/strong> Werte.<\/span> <span class=\"sg\" data-s=\"2\">Sie führt das Programm direkt aus, ohne eine Shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das führt das Programm <code>echo<\/code> mit dem einzigen Argument <code>hello<\/code> aus, also gibt es <code>hello<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Die Argumente werden getrennt übergeben, also kann eine Shell Leerzeichen oder Sonderzeichen nicht falsch deuten.<\/span> <span class=\"sg\" data-s=\"2\">Deshalb ist <code>run<\/code> die sichere Standardwahl.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Funktion <code>shell<\/code> arbeitet anders.<\/span> <span class=\"sg\" data-s=\"1\">Sie übergibt eine <strong>einzelne Zeichenkette<\/strong> an die System-Shell, die sie liest und ausführt.<\/span> <span class=\"sg\" data-s=\"2\">Damit können Sie Shell-Möglichkeiten wie Pipes und Umleitungen nutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier führt die Shell <code>echo<\/code> aus und schickt seine Ausgabe mit einer Pipe durch <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dann gibt sie <code>HELLO<\/code> aus.<\/span> <span class=\"sg\" data-s=\"2\">Das ist bequem, aber Sie müssen vorsichtig sein.<\/span> <span class=\"sg\" data-s=\"3\">Die Shell selbst entscheidet, was die Zeichenkette bedeutet.<\/span> <span class=\"sg\" data-s=\"4\">Darum ist es gefährlich, einen <code>shell<\/code>-Befehl aus Eingaben zu bauen, denen Sie nicht vertrauen.<\/span> <span class=\"sg\" data-s=\"5\">Verwenden Sie <code>run<\/code>, wenn Sie nicht wirklich Shell-Möglichkeiten brauchen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beide Funktionen geben ein <code>Proc<\/code>-Objekt zurück, das beschreibt, wie das Programm geendet hat.<\/span> <span class=\"sg\" data-s=\"1\">Standardmäßig teilt das gestartete Programm die Ausgabe Ihres Programms.<\/span> <span class=\"sg\" data-s=\"2\">Was es ausgibt, erscheint also auf dem Bildschirm.<\/span> <span class=\"sg\" data-s=\"3\">Um diese Ausgabe stattdessen aufzufangen, müssen Sie sie anfordern.<\/span> <span class=\"sg\" data-s=\"4\">Darum geht es im nächsten Thema.<\/span><\/p>"]]},"nl":{"t":"run en shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Er zijn twee manieren om een extern programma te starten.<\/span> <span class=\"sg\" data-s=\"1\">De functie <code>run<\/code> neemt het commando en zijn argumenten als <strong>afzonderlijke<\/strong> waarden.<\/span> <span class=\"sg\" data-s=\"2\">Die draait het programma direct, zonder shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dit draait het programma <code>echo<\/code> met één argument, <code>hello<\/code>, dus het drukt <code>hello<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">De argumenten worden apart meegegeven, dus een shell kan spaties of speciale tekens niet verkeerd lezen.<\/span> <span class=\"sg\" data-s=\"2\">Daarom is <code>run<\/code> de veilige standaardkeuze.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De functie <code>shell<\/code> werkt anders.<\/span> <span class=\"sg\" data-s=\"1\">Die geeft <strong>één enkele string<\/strong> aan de systeemshell, die hem leest en uitvoert.<\/span> <span class=\"sg\" data-s=\"2\">Zo kun je shellmogelijkheden gebruiken, zoals pipes en omleiding:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hier draait de shell <code>echo<\/code> en stuurt hij de uitvoer met een pipe door <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Daarna drukt hij <code>HELLO<\/code> af.<\/span> <span class=\"sg\" data-s=\"2\">Dat is handig, maar je moet voorzichtig zijn.<\/span> <span class=\"sg\" data-s=\"3\">De shell beslist zelf wat de string betekent.<\/span> <span class=\"sg\" data-s=\"4\">Het is dus gevaarlijk om een <code>shell<\/code>-commando te bouwen uit invoer die je niet vertrouwt.<\/span> <span class=\"sg\" data-s=\"5\">Gebruik <code>run<\/code>, tenzij je echt shellmogelijkheden nodig hebt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Beide functies geven een <code>Proc<\/code>-object terug, dat beschrijft hoe het programma geëindigd is.<\/span> <span class=\"sg\" data-s=\"1\">Standaard deelt het gestarte programma de uitvoer van jouw programma.<\/span> <span class=\"sg\" data-s=\"2\">Wat het afdrukt, verschijnt dus op het scherm.<\/span> <span class=\"sg\" data-s=\"3\">Als je die uitvoer wilt opvangen, moet je erom vragen.<\/span> <span class=\"sg\" data-s=\"4\">Dat is het onderwerp van het volgende onderdeel.<\/span><\/p>"]]},"es":{"t":"run y shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay dos formas de iniciar un programa externo.<\/span> <span class=\"sg\" data-s=\"1\">La función <code>run<\/code> toma la orden y sus argumentos como valores <strong>separados<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Ejecuta el programa directamente, sin una shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esto ejecuta el programa <code>echo<\/code> con el único argumento <code>hello<\/code>, así que imprime <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Los argumentos se pasan por separado, así que una shell no puede leer mal los espacios o los caracteres especiales.<\/span> <span class=\"sg\" data-s=\"2\">Por eso <code>run<\/code> es la opción segura por defecto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La función <code>shell<\/code> funciona de otra manera.<\/span> <span class=\"sg\" data-s=\"1\">Pasa una <strong>única cadena<\/strong> a la shell del sistema, que la lee y la ejecuta.<\/span> <span class=\"sg\" data-s=\"2\">Esto te permite usar funcionalidades de la shell como las tuberías y la redirección:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aquí, la shell ejecuta <code>echo<\/code> y envía su salida a través de <code>tr<\/code> con una tubería.<\/span> <span class=\"sg\" data-s=\"1\">Después imprime <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Esto es cómodo, pero debes tener cuidado.<\/span> <span class=\"sg\" data-s=\"3\">La shell misma decide qué significa la cadena.<\/span> <span class=\"sg\" data-s=\"4\">Así que es peligroso construir una orden <code>shell<\/code> a partir de una entrada en la que no confías.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>run<\/code> a menos que de verdad necesites funcionalidades de la shell.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Las dos funciones devuelven un objeto <code>Proc<\/code>, que describe cómo terminó el programa.<\/span> <span class=\"sg\" data-s=\"1\">Por defecto, el programa iniciado comparte la salida de tu programa.<\/span> <span class=\"sg\" data-s=\"2\">Así que lo que imprime aparece en la pantalla.<\/span> <span class=\"sg\" data-s=\"3\">Para capturar esa salida, tienes que pedirla.<\/span> <span class=\"sg\" data-s=\"4\">De eso trata el tema siguiente.<\/span><\/p>"]]},"it":{"t":"run e shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ci sono due modi per avviare un programma esterno.<\/span> <span class=\"sg\" data-s=\"1\">La funzione <code>run<\/code> prende il comando e i suoi argomenti come valori <strong>separati<\/strong>.<\/span> <span class=\"sg\" data-s=\"2\">Esegue il programma direttamente, senza una shell:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questo esegue il programma <code>echo<\/code> con l'unico argomento <code>hello<\/code>, quindi stampa <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Gli argomenti sono passati separatamente, quindi una shell non può leggere male spazi o caratteri speciali.<\/span> <span class=\"sg\" data-s=\"2\">Ecco perché <code>run<\/code> è la scelta predefinita sicura.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La funzione <code>shell<\/code> funziona in modo diverso.<\/span> <span class=\"sg\" data-s=\"1\">Passa una <strong>singola stringa<\/strong> alla shell di sistema, che la legge e la esegue.<\/span> <span class=\"sg\" data-s=\"2\">Questo ti permette di usare funzionalità della shell come le pipe e la redirezione:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Qui la shell esegue <code>echo<\/code> e manda il suo output attraverso <code>tr<\/code> con una pipe.<\/span> <span class=\"sg\" data-s=\"1\">Poi stampa <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questo è comodo, ma devi stare attento.<\/span> <span class=\"sg\" data-s=\"3\">La shell stessa decide che cosa significa la stringa.<\/span> <span class=\"sg\" data-s=\"4\">Quindi è pericoloso costruire un comando <code>shell<\/code> a partire da un input di cui non ti fidi.<\/span> <span class=\"sg\" data-s=\"5\">Usa <code>run<\/code>, a meno che non ti servano davvero le funzionalità della shell.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Entrambe le funzioni restituiscono un oggetto <code>Proc<\/code>, che descrive come è terminato il programma.<\/span> <span class=\"sg\" data-s=\"1\">Normalmente il programma avviato condivide l'output del tuo programma.<\/span> <span class=\"sg\" data-s=\"2\">Quindi quello che stampa compare sullo schermo.<\/span> <span class=\"sg\" data-s=\"3\">Per catturare invece quell'output, devi chiederlo.<\/span> <span class=\"sg\" data-s=\"4\">Di questo parla il prossimo argomento.<\/span><\/p>"]]},"lv":{"t":"run un shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir divi veidi, kā palaist ārēju programmu.<\/span> <span class=\"sg\" data-s=\"1\">Funkcija <code>run<\/code> ņem komandu un tās argumentus kā <strong>atsevišķas<\/strong> vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Tā palaiž programmu tieši, bez čaulas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tas palaiž programmu <code>echo<\/code> ar vienu argumentu <code>hello<\/code>, tāpēc tā izdrukā <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Argumenti tiek padoti atsevišķi, tāpēc čaula nevar pārprast atstarpes vai īpašās rakstzīmes.<\/span> <span class=\"sg\" data-s=\"2\">Tieši tāpēc <code>run<\/code> ir drošais noklusējums.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Funkcija <code>shell<\/code> strādā citādi.<\/span> <span class=\"sg\" data-s=\"1\">Tā padod <strong>vienu virkni<\/strong> sistēmas čaulai, kas to nolasa un izpilda.<\/span> <span class=\"sg\" data-s=\"2\">Tas ļauj lietot čaulas iespējas, piemēram, caurules un novirzīšanu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šeit čaula palaiž <code>echo<\/code> un ar cauruli sūta tā izvadi caur <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad tā izdrukā <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir ērti, bet jums jābūt uzmanīgiem.<\/span> <span class=\"sg\" data-s=\"3\">Čaula pati nosaka, ko virkne nozīmē.<\/span> <span class=\"sg\" data-s=\"4\">Tāpēc ir bīstami būvēt <code>shell<\/code> komandu no ievades, kurai neuzticaties.<\/span> <span class=\"sg\" data-s=\"5\">Lietojiet <code>run<\/code>, ja vien jums tiešām nevajag čaulas iespējas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Abas funkcijas atgriež <code>Proc<\/code> objektu, kas apraksta, kā programma beidza darbu.<\/span> <span class=\"sg\" data-s=\"1\">Pēc noklusējuma palaistā programma dala jūsu programmas izvadi.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc tas, ko tā izdrukā, parādās ekrānā.<\/span> <span class=\"sg\" data-s=\"3\">Lai šo izvadi tā vietā noķertu, jums tā ir jāpieprasa.<\/span> <span class=\"sg\" data-s=\"4\">Par to ir nākamais temats.<\/span><\/p>"]]},"ru":{"t":"run и shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Есть два способа запустить внешнюю программу.<\/span> <span class=\"sg\" data-s=\"1\">Функция <code>run<\/code> принимает команду и её аргументы как <strong>отдельные<\/strong> значения.<\/span> <span class=\"sg\" data-s=\"2\">Она запускает программу напрямую, без оболочки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот код запускает программу <code>echo<\/code> с единственным аргументом <code>hello<\/code>, поэтому она печатает <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Аргументы передаются по отдельности, поэтому оболочка не может неверно понять пробелы или специальные символы.<\/span> <span class=\"sg\" data-s=\"2\">Вот почему <code>run<\/code> — безопасный выбор по умолчанию.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Функция <code>shell<\/code> работает иначе.<\/span> <span class=\"sg\" data-s=\"1\">Она передаёт <strong>одну строку<\/strong> системной оболочке, которая читает и выполняет её.<\/span> <span class=\"sg\" data-s=\"2\">Так можно пользоваться возможностями оболочки, например конвейерами и перенаправлением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Здесь оболочка запускает <code>echo<\/code> и передаёт его вывод по конвейеру в <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потом она печатает <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это удобно, но нужно быть осторожным.<\/span> <span class=\"sg\" data-s=\"3\">Оболочка сама решает, что значит строка.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому опасно собирать команду для <code>shell<\/code> из ввода, которому вы не доверяете.<\/span> <span class=\"sg\" data-s=\"5\">Используйте <code>run<\/code>, если вам на самом деле не нужны возможности оболочки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обе функции возвращают объект <code>Proc<\/code>, который описывает, как завершилась программа.<\/span> <span class=\"sg\" data-s=\"1\">По умолчанию запущенная программа делит вывод с вашей программой.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому то, что она печатает, появляется на экране.<\/span> <span class=\"sg\" data-s=\"3\">Чтобы вместо этого перехватить вывод, его нужно запросить.<\/span> <span class=\"sg\" data-s=\"4\">Об этом — следующая тема.<\/span><\/p>"]]},"uk":{"t":"run та shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Є два способи запустити зовнішню програму.<\/span> <span class=\"sg\" data-s=\"1\">Функція <code>run<\/code> бере команду та її аргументи як <strong>окремі<\/strong> значення.<\/span> <span class=\"sg\" data-s=\"2\">Вона запускає програму напряму, без оболонки:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Це запускає програму <code>echo<\/code> з єдиним аргументом <code>hello<\/code>, тож вона виводить <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Аргументи передаються окремо, тому оболонка не може неправильно прочитати пробіли чи особливі символи.<\/span> <span class=\"sg\" data-s=\"2\">Ось чому <code>run<\/code> — безпечний вибір за замовчуванням.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Функція <code>shell<\/code> працює інакше.<\/span> <span class=\"sg\" data-s=\"1\">Вона передає <strong>один рядок<\/strong> системній оболонці, яка читає його й виконує.<\/span> <span class=\"sg\" data-s=\"2\">Це дозволяє користуватися можливостями оболонки, такими як канали й перенаправлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тут оболонка запускає <code>echo<\/code> і пропускає його вивід через <code>tr<\/code> за допомогою каналу.<\/span> <span class=\"sg\" data-s=\"1\">Потім вона виводить <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це зручно, але треба бути обережними.<\/span> <span class=\"sg\" data-s=\"3\">Оболонка сама вирішує, що означає рядок.<\/span> <span class=\"sg\" data-s=\"4\">Тож небезпечно будувати команду для <code>shell<\/code> із введення, якому ви не довіряєте.<\/span> <span class=\"sg\" data-s=\"5\">Використовуйте <code>run<\/code>, якщо вам не потрібні саме можливості оболонки.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Обидві функції повертають об'єкт <code>Proc<\/code>, який описує, як програма завершилася.<\/span> <span class=\"sg\" data-s=\"1\">За замовчуванням запущена програма ділить вивід із вашою програмою.<\/span> <span class=\"sg\" data-s=\"2\">Тож те, що вона виводить, з'являється на екрані.<\/span> <span class=\"sg\" data-s=\"3\">Щоб натомість перехопити цей вивід, треба про це попросити.<\/span> <span class=\"sg\" data-s=\"4\">Про це розповідає наступна тема.<\/span><\/p>"]]},"bg":{"t":"run и shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Има два начина да стартирате външна програма.<\/span> <span class=\"sg\" data-s=\"1\">Функцията <code>run<\/code> приема командата и аргументите ѝ като <strong>отделни<\/strong> стойности.<\/span> <span class=\"sg\" data-s=\"2\">Тя изпълнява програмата направо, без обвивка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Това изпълнява програмата <code>echo<\/code> с единствения аргумент <code>hello<\/code>, затова тя отпечатва <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Аргументите се подават поотделно, така че обвивката не може да разбере погрешно интервалите или специалните символи.<\/span> <span class=\"sg\" data-s=\"2\">Ето защо <code>run<\/code> е безопасният избор по подразбиране.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Функцията <code>shell<\/code> работи различно.<\/span> <span class=\"sg\" data-s=\"1\">Тя подава <strong>един-единствен низ<\/strong> на системната обвивка, която го чете и изпълнява.<\/span> <span class=\"sg\" data-s=\"2\">Това ви позволява да използвате възможности на обвивката като канали и пренасочване:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тук обвивката изпълнява <code>echo<\/code> и с канал прекарва изхода през <code>tr<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После отпечатва <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е удобно, но трябва да внимавате.<\/span> <span class=\"sg\" data-s=\"3\">Самата обвивка решава какво означава низът.<\/span> <span class=\"sg\" data-s=\"4\">Затова е опасно да изграждате команда за <code>shell<\/code> от вход, на който не вярвате.<\/span> <span class=\"sg\" data-s=\"5\">Използвайте <code>run<\/code>, освен ако наистина не ви трябват възможности на обвивката.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">И двете функции връщат обект <code>Proc<\/code>, който описва как е приключила програмата.<\/span> <span class=\"sg\" data-s=\"1\">По подразбиране стартираната програма споделя изхода на вашата програма.<\/span> <span class=\"sg\" data-s=\"2\">Затова онова, което тя отпечатва, се появява на екрана.<\/span> <span class=\"sg\" data-s=\"3\">За да уловите този изход вместо това, трябва да го поискате.<\/span> <span class=\"sg\" data-s=\"4\">За това разказва следващата тема.<\/span><\/p>"]]},"eo":{"t":"run kaj shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas du manieroj lanĉi eksteran programon.<\/span> <span class=\"sg\" data-s=\"1\">La funkcio <code>run<\/code> prenas la komandon kaj ĝiajn argumentojn kiel <strong>apartajn<\/strong> valorojn.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi rulas la programon rekte, sen ŝelo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio rulas la programon <code>echo<\/code> kun la sola argumento <code>hello<\/code>, do ĝi presas <code>hello<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La argumentoj estas transdonataj aparte, do ŝelo ne povas miskompreni spacojn aŭ specialajn signojn.<\/span> <span class=\"sg\" data-s=\"2\">Tial <code>run<\/code> estas la sekura defaŭlto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La funkcio <code>shell<\/code> funkcias alimaniere.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi transdonas <strong>unu solan ĉenon<\/strong> al la sistema ŝelo, kiu legas kaj rulas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Tio permesas al vi uzi ŝelajn ecojn, kiel duktojn kaj redirektadon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tie, la ŝelo rulas <code>echo<\/code> kaj sendas ĝian eligon tra <code>tr<\/code> per dukto.<\/span> <span class=\"sg\" data-s=\"1\">Poste ĝi presas <code>HELLO<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas oportuna, sed vi devas esti atenta.<\/span> <span class=\"sg\" data-s=\"3\">La ŝelo mem decidas, kion la ĉeno signifas.<\/span> <span class=\"sg\" data-s=\"4\">Do estas danĝere konstrui komandon <code>shell<\/code> el enigo, kiun vi ne fidas.<\/span> <span class=\"sg\" data-s=\"5\">Uzu <code>run<\/code>, krom se vi vere bezonas ŝelajn ecojn.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ funkcioj redonas objekton <code>Proc<\/code>, kiu priskribas, kiel la programo finiĝis.<\/span> <span class=\"sg\" data-s=\"1\">Defaŭlte, la lanĉita programo kunhavas la eligon de via programo.<\/span> <span class=\"sg\" data-s=\"2\">Do tio, kion ĝi presas, aperas sur la ekrano.<\/span> <span class=\"sg\" data-s=\"3\">Por anstataŭe kapti tiun eligon, vi devas peti ĝin.<\/span> <span class=\"sg\" data-s=\"4\">Tio estas la temo de la sekva paĝo.<\/span><\/p>"]]},"la":{"t":"run et shell","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Duo modi sunt programma externum incipiendi.<\/span> <span class=\"sg\" data-s=\"1\">Functio <code>run<\/code> imperatum et argumenta eius ut valores <strong>separatos<\/strong> accipit.<\/span> <span class=\"sg\" data-s=\"2\">Programma directe currit, sine interprete:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'echo', 'hello';<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hoc programma <code>echo<\/code> cum uno argumento <code>hello<\/code> currit, itaque <code>hello<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Argumenta separatim traduntur, itaque interpres spatia aut characteres speciales male legere non potest.<\/span> <span class=\"sg\" data-s=\"2\">Ideo <code>run<\/code> electio praedefinita tuta est.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Functio <code>shell<\/code> aliter operatur.<\/span> <span class=\"sg\" data-s=\"1\">Ea <strong>unam chordam<\/strong> ad interpretem systematis tradit, qui eam legit et currit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc tibi permittit facultates interpretis adhibere, ut fistulas et redirectionem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>shell 'echo hello | tr a-z A-Z';<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hic interpres <code>echo<\/code> currit et exitum eius per fistulam ad <code>tr<\/code> mittit.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>HELLO<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc commodum est, sed cavere debes.<\/span> <span class=\"sg\" data-s=\"3\">Ipse interpres decernit quid chorda significet.<\/span> <span class=\"sg\" data-s=\"4\">Itaque periculosum est imperatum <code>shell<\/code> ex introitu aedificare cui non confidis.<\/span> <span class=\"sg\" data-s=\"5\">Utere <code>run<\/code> nisi facultates interpretis vere requiris.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ambae functiones obiectum <code>Proc<\/code> reddunt, quod describit quomodo programma finierit.<\/span> <span class=\"sg\" data-s=\"1\">Ex more programma inceptum exitum programmatis tui communicat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque quod imprimit in screen apparet.<\/span> <span class=\"sg\" data-s=\"3\">Ut illum exitum potius capias, eum petere debes.<\/span> <span class=\"sg\" data-s=\"4\">De hoc agit argumentum sequens.<\/span><\/p>"]]}}}</script>
