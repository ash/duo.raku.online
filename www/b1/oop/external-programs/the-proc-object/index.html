<script type="application/json" id="page-data">{"u":"oop/external-programs/the-proc-object","n":911,"k":"topic","pv":"oop/external-programs/capturing-output","nx":"oop/external-programs/the-proc-object/quiz","tr":["oop","oop/external-programs"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The Proc object","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Every call to <code>run<\/code> or <code>shell<\/code> returns a <code>Proc<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">It is a small record that describes which program ran and how it finished.<\/span> <span class=\"sg\" data-s=\"2\">The earlier topics used its <code>.out<\/code> handle to read output.<\/span> <span class=\"sg\" data-s=\"3\">But a <code>Proc<\/code> holds more than that.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The most useful part is the <strong>exit code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">With a small integer, a program tells whoever started it whether it succeeded.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> means success.<\/span> <span class=\"sg\" data-s=\"3\">Any other number is a failure code that the program chooses itself.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> gives you that number:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Usually you only ask a yes-or-no question: did it work?<\/span> <span class=\"sg\" data-s=\"1\">For this, a <code>Proc<\/code> is simply true when the exit code is <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Otherwise, it is false.<\/span> <span class=\"sg\" data-s=\"3\">So you can test it directly:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">A <code>Proc<\/code> also remembers which command it started, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">There is one thing to watch out for.<\/span> <span class=\"sg\" data-s=\"1\">If a command fails and you simply <strong>ignore<\/strong> the returned <code>Proc<\/code>, Raku raises an exception.<\/span> <span class=\"sg\" data-s=\"2\">It does not let the failure go unnoticed:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">A non-zero exit code usually means that something went wrong.<\/span> <span class=\"sg\" data-s=\"1\">So if you throw away a failing <code>Proc<\/code>, it throws an exception.<\/span> <span class=\"sg\" data-s=\"2\">This happens when it goes out of scope.<\/span> <span class=\"sg\" data-s=\"3\">What causes this is <em>throwing away<\/em> the result, not ignoring the exit code.<\/span> <span class=\"sg\" data-s=\"4\">Just storing the <code>Proc<\/code> in a variable is enough to avoid the exception.<\/span> <span class=\"sg\" data-s=\"5\">You do not even have to look at it again.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">So if you <em>expect<\/em> that a command might fail, keep its <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Then look at <code>.exitcode<\/code>, or test it as a Boolean.<\/span> <span class=\"sg\" data-s=\"2\">Do this whenever you want to know what happened.<\/span><\/p>"]]},"de":{"t":"Das Proc-Objekt","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf von <code>run<\/code> oder <code>shell<\/code> gibt ein <code>Proc<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es ist ein kleiner Bericht, der beschreibt, welches Programm gelaufen ist und wie es geendet hat.<\/span> <span class=\"sg\" data-s=\"2\">Die früheren Themen haben seinen Handle <code>.out<\/code> zum Lesen der Ausgabe benutzt.<\/span> <span class=\"sg\" data-s=\"3\">Aber ein <code>Proc<\/code> enthält mehr als das.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der nützlichste Teil ist der <strong>Exit-Code<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Mit einer kleinen ganzen Zahl sagt ein Programm dem, der es gestartet hat, ob es gelungen ist.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> bedeutet Erfolg.<\/span> <span class=\"sg\" data-s=\"3\">Jede andere Zahl ist ein Fehlercode, den das Programm selbst wählt.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> gibt Ihnen diese Zahl:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Meistens stellen Sie nur eine Ja-oder-Nein-Frage: Hat es funktioniert?<\/span> <span class=\"sg\" data-s=\"1\">Dafür ist ein <code>Proc<\/code> einfach wahr, wenn der Exit-Code <code>0<\/code> ist.<\/span> <span class=\"sg\" data-s=\"2\">Sonst ist es falsch.<\/span> <span class=\"sg\" data-s=\"3\">Also können Sie es direkt prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein <code>Proc<\/code> merkt sich auch, welchen Befehl es gestartet hat, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Auf eine Sache müssen Sie achten.<\/span> <span class=\"sg\" data-s=\"1\">Wenn ein Befehl fehlschlägt und Sie das zurückgegebene <code>Proc<\/code> einfach <strong>ignorieren<\/strong>, löst Raku eine Ausnahme aus.<\/span> <span class=\"sg\" data-s=\"2\">Raku lässt den Fehlschlag nicht unbemerkt durchgehen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ein Exit-Code ungleich null bedeutet meistens, dass etwas schiefgegangen ist.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie also ein fehlgeschlagenes <code>Proc<\/code> wegwerfen, wirft es eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Das passiert, wenn es seinen Gültigkeitsbereich verlässt.<\/span> <span class=\"sg\" data-s=\"3\">Der Auslöser ist das <em>Wegwerfen<\/em> des Ergebnisses, nicht das Ignorieren des Exit-Codes.<\/span> <span class=\"sg\" data-s=\"4\">Es reicht schon, das <code>Proc<\/code> in einer Variablen zu speichern, um die Ausnahme zu vermeiden.<\/span> <span class=\"sg\" data-s=\"5\">Sie müssen es nicht einmal wieder ansehen.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie also <em>erwarten<\/em>, dass ein Befehl fehlschlagen könnte, behalten Sie sein <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sehen Sie sich dann <code>.exitcode<\/code> an oder prüfen Sie es als Wahrheitswert.<\/span> <span class=\"sg\" data-s=\"2\">Tun Sie das immer dann, wenn Sie wissen möchten, was passiert ist.<\/span><\/p>"]]},"nl":{"t":"Het Proc-object","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep van <code>run<\/code> of <code>shell<\/code> geeft een <code>Proc<\/code>-object terug.<\/span> <span class=\"sg\" data-s=\"1\">Het is een klein verslag dat beschrijft welk programma gedraaid heeft en hoe het geëindigd is.<\/span> <span class=\"sg\" data-s=\"2\">De eerdere onderwerpen gebruikten zijn handle <code>.out<\/code> om uitvoer te lezen.<\/span> <span class=\"sg\" data-s=\"3\">Maar een <code>Proc<\/code> bevat meer dan dat.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Het nuttigste deel is de <strong>exitcode<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Met een klein geheel getal vertelt een programma aan wie het gestart heeft of het geslaagd is.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> betekent succes.<\/span> <span class=\"sg\" data-s=\"3\">Elk ander getal is een foutcode die het programma zelf kiest.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> geeft je dat getal:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Meestal stel je alleen een ja/nee-vraag: heeft het gewerkt?<\/span> <span class=\"sg\" data-s=\"1\">Daarvoor is een <code>Proc<\/code> gewoon waar als de exitcode <code>0<\/code> is.<\/span> <span class=\"sg\" data-s=\"2\">Anders is hij onwaar.<\/span> <span class=\"sg\" data-s=\"3\">Dus kun je hem direct testen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een <code>Proc<\/code> onthoudt ook welk commando hij gestart heeft, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Er is één ding om op te letten.<\/span> <span class=\"sg\" data-s=\"1\">Als een commando mislukt en je de teruggegeven <code>Proc<\/code> gewoon <strong>negeert<\/strong>, werpt Raku een exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Raku laat de mislukking niet ongemerkt voorbijgaan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Een exitcode die niet nul is, betekent meestal dat er iets misging.<\/span> <span class=\"sg\" data-s=\"1\">Dus als je een mislukkende <code>Proc<\/code> weggooit, werpt hij een exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebeurt als hij buiten bereik raakt.<\/span> <span class=\"sg\" data-s=\"3\">De oorzaak is het <em>weggooien<\/em> van het resultaat, niet het negeren van de exitcode.<\/span> <span class=\"sg\" data-s=\"4\">De <code>Proc<\/code> gewoon in een variabele bewaren is al genoeg om de exceptie te vermijden.<\/span> <span class=\"sg\" data-s=\"5\">Je hoeft er niet eens meer naar te kijken.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dus als je <em>verwacht<\/em> dat een commando kan mislukken, bewaar dan zijn <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Kijk daarna naar <code>.exitcode<\/code>, of test hem als boolean.<\/span> <span class=\"sg\" data-s=\"2\">Doe dat steeds wanneer je wilt weten wat er gebeurd is.<\/span><\/p>"]]},"es":{"t":"El objeto Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada llamada a <code>run<\/code> o <code>shell<\/code> devuelve un objeto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Es un pequeño registro que describe qué programa se ejecutó y cómo terminó.<\/span> <span class=\"sg\" data-s=\"2\">Los temas anteriores usaron su manejador <code>.out<\/code> para leer la salida.<\/span> <span class=\"sg\" data-s=\"3\">Pero un <code>Proc<\/code> guarda más cosas.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La parte más útil es el <strong>código de salida<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Con un número entero pequeño, un programa le dice a quien lo inició si tuvo éxito.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> significa éxito.<\/span> <span class=\"sg\" data-s=\"3\">Cualquier otro número es un código de fallo que elige el propio programa.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> te da ese número:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Normalmente solo haces una pregunta de sí o no: ¿funcionó?<\/span> <span class=\"sg\" data-s=\"1\">Para esto, un <code>Proc<\/code> es simplemente verdadero cuando el código de salida es <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Si no, es falso.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes comprobarlo directamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> también recuerda qué orden inició, en <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Hay una cosa a la que debes prestar atención.<\/span> <span class=\"sg\" data-s=\"1\">Si una orden falla y simplemente <strong>ignoras<\/strong> el <code>Proc<\/code> devuelto, Raku lanza una excepción.<\/span> <span class=\"sg\" data-s=\"2\">No deja pasar el fallo sin aviso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un código de salida distinto de cero suele significar que algo salió mal.<\/span> <span class=\"sg\" data-s=\"1\">Así que si tiras un <code>Proc<\/code> que falla, este lanza una excepción.<\/span> <span class=\"sg\" data-s=\"2\">Esto pasa cuando sale de su ámbito.<\/span> <span class=\"sg\" data-s=\"3\">Lo que causa esto es <em>tirar<\/em> el resultado, no ignorar el código de salida.<\/span> <span class=\"sg\" data-s=\"4\">Basta con guardar el <code>Proc<\/code> en una variable para evitar la excepción.<\/span> <span class=\"sg\" data-s=\"5\">Ni siquiera tienes que volver a mirarlo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Así que, si <em>esperas<\/em> que una orden pueda fallar, guarda su <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Después mira <code>.exitcode<\/code>, o compruébalo como booleano.<\/span> <span class=\"sg\" data-s=\"2\">Haz esto siempre que quieras saber qué pasó.<\/span><\/p>"]]},"it":{"t":"L'oggetto Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata a <code>run<\/code> o <code>shell<\/code> restituisce un oggetto <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">È una piccola scheda che descrive quale programma è stato eseguito e come è terminato.<\/span> <span class=\"sg\" data-s=\"2\">Gli argomenti precedenti hanno usato il suo handle <code>.out<\/code> per leggere l'output.<\/span> <span class=\"sg\" data-s=\"3\">Ma un <code>Proc<\/code> contiene più di questo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La parte più utile è il <strong>codice di uscita<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Con un piccolo intero, un programma dice a chi lo ha avviato se è riuscito.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> significa successo.<\/span> <span class=\"sg\" data-s=\"3\">Qualsiasi altro numero è un codice di fallimento che il programma sceglie da solo.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> ti dà quel numero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Di solito fai solo una domanda da sì o no: ha funzionato?<\/span> <span class=\"sg\" data-s=\"1\">Per questo un <code>Proc<\/code> è semplicemente vero quando il codice di uscita è <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Altrimenti è falso.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi controllarlo direttamente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un <code>Proc<\/code> ricorda anche quale comando ha avviato, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">C'è una cosa a cui fare attenzione.<\/span> <span class=\"sg\" data-s=\"1\">Se un comando fallisce e tu semplicemente <strong>ignori<\/strong> il <code>Proc<\/code> restituito, Raku solleva un'eccezione.<\/span> <span class=\"sg\" data-s=\"2\">Non lascia passare il fallimento in silenzio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Un codice di uscita diverso da zero di solito significa che qualcosa è andato storto.<\/span> <span class=\"sg\" data-s=\"1\">Quindi, se butti via un <code>Proc<\/code> fallito, questo solleva un'eccezione.<\/span> <span class=\"sg\" data-s=\"2\">Succede quando esce dal suo ambito.<\/span> <span class=\"sg\" data-s=\"3\">La causa è <em>buttare via<\/em> il risultato, non ignorare il codice di uscita.<\/span> <span class=\"sg\" data-s=\"4\">Basta conservare il <code>Proc<\/code> in una variabile per evitare l'eccezione.<\/span> <span class=\"sg\" data-s=\"5\">Non devi nemmeno guardarlo di nuovo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quindi, se ti <em>aspetti<\/em> che un comando possa fallire, conserva il suo <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poi guarda <code>.exitcode<\/code>, o controllalo come Booleano.<\/span> <span class=\"sg\" data-s=\"2\">Fallo ogni volta che vuoi sapere che cosa è successo.<\/span><\/p>"]]},"lv":{"t":"Proc objekts","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>run<\/code> vai <code>shell<\/code> izsaukums atgriež <code>Proc<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir neliels pieraksts, kas apraksta, kura programma darbojās un kā tā beidza darbu.<\/span> <span class=\"sg\" data-s=\"2\">Iepriekšējie temati lietoja tā turi <code>.out<\/code>, lai nolasītu izvadi.<\/span> <span class=\"sg\" data-s=\"3\">Bet <code>Proc<\/code> satur vairāk nekā tikai to.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Visnoderīgākā daļa ir <strong>izejas kods<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Ar nelielu veselu skaitli programma pasaka tam, kas to palaida, vai tā izdevās.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> nozīmē veiksmi.<\/span> <span class=\"sg\" data-s=\"3\">Jebkurš cits skaitlis ir neveiksmes kods, ko programma izvēlas pati.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> jums dod šo skaitli:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Parasti jūs uzdodat tikai jautājumu ar atbildi jā vai nē: vai tas izdevās?<\/span> <span class=\"sg\" data-s=\"1\">Tādam jautājumam <code>Proc<\/code> vienkārši ir patiess, kad izejas kods ir <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Citādi tas ir aplams.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc to var pārbaudīt tieši:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> laukā <code>.command<\/code> arī atceras, kuru komandu tas palaida:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ir viena lieta, no kuras jāuzmanās.<\/span> <span class=\"sg\" data-s=\"1\">Ja komanda neizdodas un jūs atgriezto <code>Proc<\/code> vienkārši <strong>ignorējat<\/strong>, Raku izmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"2\">Raku neļauj neveiksmei paiet nepamanītai:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# dies: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Izejas kods, kas nav nulle, parasti nozīmē, ka kaut kas nogāja greizi.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc, ja jūs izmetat neveiksmīgu <code>Proc<\/code>, tas izmet izņēmumu.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek, kad <code>Proc<\/code> iziet no redzamības apgabala.<\/span> <span class=\"sg\" data-s=\"3\">Cēlonis ir rezultāta <em>izmešana<\/em>, nevis izejas koda ignorēšana.<\/span> <span class=\"sg\" data-s=\"4\">Pietiek tikai saglabāt <code>Proc<\/code> mainīgajā, lai izvairītos no izņēmuma.<\/span> <span class=\"sg\" data-s=\"5\">Jums pat nav uz to vēlreiz jāskatās.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # no error, even though it failed\n# …and $proc is never used again<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tātad, ja jūs <em>gaidāt<\/em>, ka komanda varētu neizdoties, paturiet tās <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tad ieskatieties <code>.exitcode<\/code> vai pārbaudiet to kā Būla vērtību.<\/span> <span class=\"sg\" data-s=\"2\">Dariet to, kad vien gribat zināt, kas notika.<\/span><\/p>"]]},"ru":{"t":"Объект Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов <code>run<\/code> или <code>shell<\/code> возвращает объект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это небольшая запись, которая описывает, какая программа выполнялась и как она завершилась.<\/span> <span class=\"sg\" data-s=\"2\">В прошлых темах мы читали вывод через его дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Но в <code>Proc<\/code> есть и кое-что ещё.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Самая полезная часть — <strong>код возврата<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Небольшим целым числом программа сообщает тому, кто её запустил, удалась ли она.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> означает успех.<\/span> <span class=\"sg\" data-s=\"3\">Любое другое число — это код неудачи, который программа выбирает сама.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> даёт вам это число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обычно вы задаёте только вопрос «да или нет»: всё сработало?<\/span> <span class=\"sg\" data-s=\"1\">Для этого <code>Proc<\/code> просто истинен, когда код возврата равен <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Иначе он ложен.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому его можно проверять напрямую:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> также помнит, какую команду он запустил, — в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За одним нужно следить.<\/span> <span class=\"sg\" data-s=\"1\">Если команда дала сбой, а вы просто <strong>проигнорируете<\/strong> возвращённый <code>Proc<\/code>, Raku бросит исключение.<\/span> <span class=\"sg\" data-s=\"2\">Он не даёт сбою пройти незамеченным:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умирает: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ненулевой код возврата обычно значит, что что-то пошло не так.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому если вы выбросите неудачный <code>Proc<\/code>, он бросит исключение.<\/span> <span class=\"sg\" data-s=\"2\">Это происходит, когда он выходит из области видимости.<\/span> <span class=\"sg\" data-s=\"3\">Причина — именно то, что вы <em>выбрасываете<\/em> результат, а не то, что вы не проверяете код возврата.<\/span> <span class=\"sg\" data-s=\"4\">Чтобы не было исключения, достаточно просто сохранить <code>Proc<\/code> в переменной.<\/span> <span class=\"sg\" data-s=\"5\">Вам даже не нужно смотреть на неё снова.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # ошибки нет, хотя команда и не удалась\n# …и $proc больше нигде не используется<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Поэтому если вы <em>ожидаете<\/em>, что команда может не сработать, сохраните её <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затем смотрите на <code>.exitcode<\/code> или проверяйте его как булево значение.<\/span> <span class=\"sg\" data-s=\"2\">Делайте так всякий раз, когда хотите узнать, что произошло.<\/span><\/p>"]]},"uk":{"t":"Об'єкт Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик <code>run<\/code> чи <code>shell<\/code> повертає об'єкт <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це невеликий запис, який описує, яка програма виконувалася і як вона завершилася.<\/span> <span class=\"sg\" data-s=\"2\">У попередніх темах ми читали вивід через його дескриптор <code>.out<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Але <code>Proc<\/code> містить більше, ніж це.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Найкорисніша частина — це <strong>код завершення<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Невеликим цілим числом програма повідомляє тому, хто її запустив, чи вона спрацювала.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> означає успіх.<\/span> <span class=\"sg\" data-s=\"3\">Будь-яке інше число — це код невдачі, який програма вибирає сама.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> дає вам це число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Зазвичай ви ставите лише запитання «так чи ні»: чи спрацювало?<\/span> <span class=\"sg\" data-s=\"1\">Для цього <code>Proc<\/code> просто істинний, коли код завершення дорівнює <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Інакше він хибний.<\/span> <span class=\"sg\" data-s=\"3\">Тож його можна перевіряти напряму:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> також пам'ятає, яку команду він запустив, у <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тут є одна річ, на яку варто зважати.<\/span> <span class=\"sg\" data-s=\"1\">Якщо команда не спрацювала, а ви просто <strong>ігноруєте<\/strong> повернений <code>Proc<\/code>, Raku кидає виняток.<\/span> <span class=\"sg\" data-s=\"2\">Він не дає збою пройти непоміченим:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# гине: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ненульовий код завершення зазвичай означає, що щось пішло не так.<\/span> <span class=\"sg\" data-s=\"1\">Тож якщо ви викидаєте невдалий <code>Proc<\/code>, він кидає виняток.<\/span> <span class=\"sg\" data-s=\"2\">Це стається, коли він виходить за межі області видимості.<\/span> <span class=\"sg\" data-s=\"3\">Причина тут — саме <em>викидання<\/em> результату, а не те, що ви не дивитеся на код завершення.<\/span> <span class=\"sg\" data-s=\"4\">Досить просто зберегти <code>Proc<\/code> у змінній, щоб уникнути винятку.<\/span> <span class=\"sg\" data-s=\"5\">Вам навіть не треба знову на нього дивитися.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # помилки немає, хоч команда й зазнала невдачі\n# …і $proc більше ніколи не використовується<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тож якщо ви <em>очікуєте<\/em>, що команда може не спрацювати, збережіть її <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Потім погляньте на <code>.exitcode<\/code> або перевірте його як булеве значення.<\/span> <span class=\"sg\" data-s=\"2\">Робіть це щоразу, коли хочете дізнатися, що сталося.<\/span><\/p>"]]},"bg":{"t":"Обектът Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване на <code>run<\/code> или <code>shell<\/code> връща обект <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е малък запис, който описва коя програма е работила и как е приключила.<\/span> <span class=\"sg\" data-s=\"2\">Предишните теми използваха манипулатора му <code>.out<\/code>, за да четат изхода.<\/span> <span class=\"sg\" data-s=\"3\">Но <code>Proc<\/code> съдържа повече от това.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Най-полезната част е <strong>кодът на изход<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">С малко цяло число програмата казва на онзи, който я е стартирал, дали е успяла.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> означава успех.<\/span> <span class=\"sg\" data-s=\"3\">Всяко друго число е код за провал, който програмата избира сама.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> ви дава това число:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обикновено питате само въпрос с отговор „да“ или „не“: проработи ли?<\/span> <span class=\"sg\" data-s=\"1\">За това <code>Proc<\/code> е просто истина, когато кодът на изход е <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Иначе той е лъжа.<\/span> <span class=\"sg\" data-s=\"3\">Затова можете да го проверите направо:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> помни и коя команда е стартирал, в <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Има едно нещо, за което да внимавате.<\/span> <span class=\"sg\" data-s=\"1\">Ако команда се провали и вие просто <strong>пренебрегнете<\/strong> върнатия <code>Proc<\/code>, Raku повдига изключение.<\/span> <span class=\"sg\" data-s=\"2\">Той не оставя провала да мине незабелязано:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# умира: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ненулевият код на изход обикновено означава, че нещо се е объркало.<\/span> <span class=\"sg\" data-s=\"1\">Затова, ако изхвърлите провалил се <code>Proc<\/code>, той хвърля изключение.<\/span> <span class=\"sg\" data-s=\"2\">Това става, когато той излезе от обхват.<\/span> <span class=\"sg\" data-s=\"3\">Причината е <em>изхвърлянето<\/em> на резултата, а не пренебрегването на кода на изход.<\/span> <span class=\"sg\" data-s=\"4\">Простото запазване на <code>Proc<\/code> в променлива е достатъчно, за да избегнете изключението.<\/span> <span class=\"sg\" data-s=\"5\">Дори не е нужно да го поглеждате отново.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # няма грешка, макар да се провали\n# …и $proc никога повече не се използва<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Затова, ако <em>очаквате<\/em>, че команда може да се провали, запазете нейния <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">После погледнете <code>.exitcode<\/code> или го проверете като булева стойност.<\/span> <span class=\"sg\" data-s=\"2\">Правете това винаги, когато искате да разберете какво се е случило.<\/span><\/p>"]]},"eo":{"t":"La objekto Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko de <code>run<\/code> aŭ <code>shell<\/code> redonas objekton <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas malgranda registro, kiu priskribas, kiu programo ruliĝis kaj kiel ĝi finiĝis.<\/span> <span class=\"sg\" data-s=\"2\">La antaŭaj temoj uzis ĝian tenilon <code>.out<\/code> por legi eligon.<\/span> <span class=\"sg\" data-s=\"3\">Sed <code>Proc<\/code> tenas pli ol tion.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La plej utila parto estas la <strong>elirkodo<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Per malgranda entjero, programo diras al tiu, kiu lanĉis ĝin, ĉu ĝi sukcesis.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> signifas sukceson.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu alia nombro estas malsukcesa kodo, kiun la programo mem elektas.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> donas al vi tiun nombron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kutime vi volas scii nur jes aŭ ne: ĉu ĝi funkciis?<\/span> <span class=\"sg\" data-s=\"1\">Por tio, <code>Proc<\/code> estas simple vera, kiam la elirkodo estas <code>0<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Alie, ĝi estas malvera.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas testi ĝin rekte:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> ankaŭ memoras, kiun komandon ĝi lanĉis, en <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas unu afero, al kiu vi devas atenti.<\/span> <span class=\"sg\" data-s=\"1\">Se komando malsukcesas kaj vi simple <strong>ignoras<\/strong> la redonitan <code>Proc<\/code>, Raku levas escepton.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne lasas la malsukceson pasi nerimarkita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# mortas: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Elirkodo alia ol nulo kutime signifas, ke io misiris.<\/span> <span class=\"sg\" data-s=\"1\">Do se vi forĵetas malsukcesan <code>Proc<\/code>, ĝi ĵetas escepton.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam ĝi eliras el sia amplekso.<\/span> <span class=\"sg\" data-s=\"3\">La kaŭzo estas <em>forĵeti<\/em> la rezulton, ne ignori la elirkodon.<\/span> <span class=\"sg\" data-s=\"4\">Simple konservi la <code>Proc<\/code> en variablo sufiĉas por eviti la escepton.<\/span> <span class=\"sg\" data-s=\"5\">Vi eĉ ne devas rigardi ĝin denove.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # neniu eraro, kvankam ĝi malsukcesis\n# …kaj $proc neniam estas uzata denove<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Do se vi <em>atendas<\/em>, ke komando eble malsukcesos, tenu ĝian <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Poste rigardu <code>.exitcode<\/code>, aŭ testu ĝin kiel Boolean valoron.<\/span> <span class=\"sg\" data-s=\"2\">Faru tion, kiam ajn vi volas scii, kio okazis.<\/span><\/p>"]]},"la":{"t":"Obiectum Proc","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Omnis vocatio <code>run<\/code> vel <code>shell<\/code> obiectum <code>Proc<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Est parva tabula quae describit quod programma cucurrerit et quomodo finierit.<\/span> <span class=\"sg\" data-s=\"2\">Argumenta superiora tractabulum eius <code>.out<\/code> adhibuerunt ut exitum legerent.<\/span> <span class=\"sg\" data-s=\"3\">Sed <code>Proc<\/code> plus continet.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Pars utilissima est <strong>codex exeundi<\/strong>.<\/span> <span class=\"sg\" data-s=\"1\">Parvo numero integro programma ei qui id incepit dicit utrum successerit.<\/span> <span class=\"sg\" data-s=\"2\"><code>0<\/code> successum significat.<\/span> <span class=\"sg\" data-s=\"3\">Quilibet alius numerus est codex defectus quem ipsum programma eligit.<\/span> <span class=\"sg\" data-s=\"4\"><code>.exitcode<\/code> tibi illum numerum dat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 3';\nsay $proc.exitcode; # 3<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Plerumque tantum quaestionem ita-an-non ponis: operatumne est?<\/span> <span class=\"sg\" data-s=\"1\">Ad hoc <code>Proc<\/code> simpliciter verum est cum codex exeundi <code>0<\/code> est.<\/span> <span class=\"sg\" data-s=\"2\">Aliter falsum est.<\/span> <span class=\"sg\" data-s=\"3\">Itaque id directe probare potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'ls', '/', :out;\n$proc.out.slurp(:close);\nsay $proc ?? 'ok' !! 'failed'; # ok<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>Proc<\/code> etiam meminit quod imperatum incepit, in <code>.command<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'echo', 'hi', :out;\n$proc.out.slurp(:close);\nsay $proc.command; # (echo hi)<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Una res est quam cavere debes.<\/span> <span class=\"sg\" data-s=\"1\">Si imperatum deficit et <code>Proc<\/code> redditum simpliciter <strong>neglegis<\/strong>, Raku exceptionem excitat.<\/span> <span class=\"sg\" data-s=\"2\">Defectum inobservatum transire non sinit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';\n# moritur: The spawned command 'sh' exited unsuccessfully (exit code: 1, signal: 0)<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Codex exeundi alius quam <code>0<\/code> plerumque significat aliquid male cessisse.<\/span> <span class=\"sg\" data-s=\"1\">Itaque si <code>Proc<\/code> deficiens abicis, exceptionem iacit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit cum extra circumscriptionem exit.<\/span> <span class=\"sg\" data-s=\"3\">Causa est effectum <em>abicere<\/em>, non codicem exeundi neglegere.<\/span> <span class=\"sg\" data-s=\"4\">Satis est <code>Proc<\/code> in variabili servare ut exceptionem vites.<\/span> <span class=\"sg\" data-s=\"5\">Id ne iterum quidem inspicere debes.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $proc = run 'sh', '-c', 'exit 1'; # nullus error, quamquam defecit\n# …et $proc numquam iterum adhibetur<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Itaque si <em>exspectas<\/em> imperatum deficere posse, <code>Proc<\/code> eius serva.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>.exitcode<\/code> inspice, aut id ut valorem Booleanum proba.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fac quotiens scire vis quid acciderit.<\/span><\/p>"]]}}}</script>
