<script type="application/json" id="page-data">{"u":"oop/external-programs","n":907,"k":"section","pv":"oop/file-handles/quiz","nx":"oop/external-programs/run-and-shell","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Running external programs","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programs do not work alone.<\/span> <span class=\"sg\" data-s=\"1\">They often need to run other programs and read their output.<\/span> <span class=\"sg\" data-s=\"2\">They also need to check the environment in which they started.<\/span> <span class=\"sg\" data-s=\"3\">Raku gives you direct and easy access to all of this.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This section covers <code>run<\/code> and <code>shell<\/code>, which start external commands.<\/span> <span class=\"sg\" data-s=\"1\">It also shows how to capture what those commands print.<\/span> <span class=\"sg\" data-s=\"2\">Finally, it covers the <code>%*ENV<\/code> hash, which holds the environment variables.<\/span><\/p>"]]},"de":{"t":"Externe Programme ausführen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programme arbeiten nicht allein.<\/span> <span class=\"sg\" data-s=\"1\">Oft müssen sie andere Programme ausführen und deren Ausgabe lesen.<\/span> <span class=\"sg\" data-s=\"2\">Sie müssen auch die Umgebung prüfen, in der sie gestartet wurden.<\/span> <span class=\"sg\" data-s=\"3\">Raku gibt Ihnen direkten und einfachen Zugang zu all dem.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Dieser Abschnitt behandelt <code>run<\/code> und <code>shell<\/code>, die externe Befehle starten.<\/span> <span class=\"sg\" data-s=\"1\">Er zeigt auch, wie Sie auffangen, was diese Befehle ausgeben.<\/span> <span class=\"sg\" data-s=\"2\">Zum Schluss geht es um den Hash <code>%*ENV<\/code>, der die Umgebungsvariablen enthält.<\/span><\/p>"]]},"nl":{"t":"Externe programma's draaien","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma's werken niet alleen.<\/span> <span class=\"sg\" data-s=\"1\">Ze moeten vaak andere programma's draaien en hun uitvoer lezen.<\/span> <span class=\"sg\" data-s=\"2\">Ze moeten ook de omgeving bekijken waarin ze gestart zijn.<\/span> <span class=\"sg\" data-s=\"3\">Raku geeft je direct en makkelijk toegang tot dit alles.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze sectie behandelt <code>run<\/code> en <code>shell<\/code>, die externe commando's starten.<\/span> <span class=\"sg\" data-s=\"1\">Ze laat ook zien hoe je opvangt wat die commando's afdrukken.<\/span> <span class=\"sg\" data-s=\"2\">Ten slotte behandelt ze de hash <code>%*ENV<\/code>, die de omgevingsvariabelen bevat.<\/span><\/p>"]]},"es":{"t":"Ejecutar programas externos 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Los programas no trabajan solos.<\/span> <span class=\"sg\" data-s=\"1\">A menudo necesitan ejecutar otros programas y leer su salida.<\/span> <span class=\"sg\" data-s=\"2\">También necesitan revisar el entorno en el que empezaron.<\/span> <span class=\"sg\" data-s=\"3\">Raku te da acceso directo y fácil a todo esto.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta sección trata de <code>run<\/code> y <code>shell<\/code>, que inician órdenes externas.<\/span> <span class=\"sg\" data-s=\"1\">También muestra cómo capturar lo que imprimen esas órdenes.<\/span> <span class=\"sg\" data-s=\"2\">Por último, trata del hash <code>%*ENV<\/code>, que contiene las variables de entorno.<\/span><\/p>"]]},"it":{"t":"Eseguire programmi esterni 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">I programmi non lavorano da soli.<\/span> <span class=\"sg\" data-s=\"1\">Spesso devono eseguire altri programmi e leggere il loro output.<\/span> <span class=\"sg\" data-s=\"2\">Devono anche controllare l'ambiente in cui sono partiti.<\/span> <span class=\"sg\" data-s=\"3\">Raku ti dà un accesso diretto e comodo a tutto questo.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa sezione tratta <code>run<\/code> e <code>shell<\/code>, che avviano comandi esterni.<\/span> <span class=\"sg\" data-s=\"1\">Mostra anche come catturare quello che questi comandi stampano.<\/span> <span class=\"sg\" data-s=\"2\">Infine tratta l'hash <code>%*ENV<\/code>, che contiene le variabili d'ambiente.<\/span><\/p>"]]},"lv":{"t":"Ārējo programmu palaišana 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programmas nestrādā vienas.<\/span> <span class=\"sg\" data-s=\"1\">Tām bieži jāpalaiž citas programmas un jānolasa to izvade.<\/span> <span class=\"sg\" data-s=\"2\">Tām arī jāpārbauda vide, kurā tās tika palaistas.<\/span> <span class=\"sg\" data-s=\"3\">Raku dod jums tiešu un ērtu piekļuvi tam visam.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī sadaļa aplūko <code>run<\/code> un <code>shell<\/code>, kas palaiž ārējas komandas.<\/span> <span class=\"sg\" data-s=\"1\">Tā arī rāda, kā noķert to, ko šīs komandas izdrukā.<\/span> <span class=\"sg\" data-s=\"2\">Visbeidzot tā aplūko jaukteni <code>%*ENV<\/code>, kas satur vides mainīgos.<\/span><\/p>"]]},"ru":{"t":"Запуск внешних программ","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Программы не работают в одиночку.<\/span> <span class=\"sg\" data-s=\"1\">Им часто нужно запускать другие программы и читать их вывод.<\/span> <span class=\"sg\" data-s=\"2\">Ещё им нужно проверять окружение, в котором их запустили.<\/span> <span class=\"sg\" data-s=\"3\">Raku даёт вам прямой и удобный доступ ко всему этому.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот раздел рассказывает о <code>run<\/code> и <code>shell<\/code>, которые запускают внешние команды.<\/span> <span class=\"sg\" data-s=\"1\">Ещё он показывает, как перехватить то, что печатают эти команды.<\/span> <span class=\"sg\" data-s=\"2\">Наконец, он рассказывает о хеше <code>%*ENV<\/code>, где хранятся переменные окружения.<\/span><\/p>"]]},"uk":{"t":"Запуск зовнішніх програм","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Програми не працюють самі по собі.<\/span> <span class=\"sg\" data-s=\"1\">Їм часто треба запускати інші програми й читати їхній вивід.<\/span> <span class=\"sg\" data-s=\"2\">Ще їм треба перевіряти середовище, у якому їх запустили.<\/span> <span class=\"sg\" data-s=\"3\">Raku дає вам прямий і зручний доступ до всього цього.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей розділ розповідає про <code>run<\/code> і <code>shell<\/code>, які запускають зовнішні команди.<\/span> <span class=\"sg\" data-s=\"1\">Він також показує, як перехопити те, що ці команди виводять.<\/span> <span class=\"sg\" data-s=\"2\">Наостанок він розглядає хеш <code>%*ENV<\/code>, який містить змінні середовища.<\/span><\/p>"]]},"bg":{"t":"Изпълнение на външни програми","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Програмите не работят сами.<\/span> <span class=\"sg\" data-s=\"1\">Често им се налага да изпълняват други програми и да четат изхода им.<\/span> <span class=\"sg\" data-s=\"2\">Трябва също да проверяват средата, в която са стартирани.<\/span> <span class=\"sg\" data-s=\"3\">Raku ви дава пряк и лесен достъп до всичко това.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този раздел разглежда <code>run<\/code> и <code>shell<\/code>, които стартират външни команди.<\/span> <span class=\"sg\" data-s=\"1\">Той показва и как да уловите онова, което тези команди отпечатват.<\/span> <span class=\"sg\" data-s=\"2\">Накрая разглежда хеша <code>%*ENV<\/code>, който съдържа променливите на средата.<\/span><\/p>"]]},"eo":{"t":"Ruli eksterajn programojn 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programoj ne laboras solaj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ofte bezonas ruli aliajn programojn kaj legi ilian eligon.<\/span> <span class=\"sg\" data-s=\"2\">Ili ankaŭ bezonas kontroli la medion, en kiu ili startis.<\/span> <span class=\"sg\" data-s=\"3\">Raku donas al vi rektan kaj facilan aliron al ĉio ĉi.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu sekcio traktas <code>run<\/code> kaj <code>shell<\/code>, kiuj lanĉas eksterajn komandojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ montras, kiel kapti tion, kion tiuj komandoj presas.<\/span> <span class=\"sg\" data-s=\"2\">Fine, ĝi traktas la hakon <code>%*ENV<\/code>, kiu tenas la mediajn variablojn.<\/span><\/p>"]]},"la":{"t":"Programmata externa exsequi 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Programmata sola non operantur.<\/span> <span class=\"sg\" data-s=\"1\">Saepe alia programmata currere et exitum eorum legere debent.<\/span> <span class=\"sg\" data-s=\"2\">Etiam ambitum inspicere debent in quo inceperunt.<\/span> <span class=\"sg\" data-s=\"3\">Raku tibi ad haec omnia accessum directum et facilem dat.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec sectio <code>run<\/code> et <code>shell<\/code> tractat, quae imperata externa incipiunt.<\/span> <span class=\"sg\" data-s=\"1\">Etiam ostendit quomodo capias quod illa imperata imprimunt.<\/span> <span class=\"sg\" data-s=\"2\">Denique mappam <code>%*ENV<\/code> tractat, quae variabiles ambitus continet.<\/span><\/p>"]]}}}</script>
