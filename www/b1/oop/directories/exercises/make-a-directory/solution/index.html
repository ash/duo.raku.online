лог. На щастя, <code>mkdir<\/code> також створює всі відсутні каталоги посередині шляху. Тож із вкладеним шляхом, як у <code>mkdir 'reports/2026'<\/code>, один виклик будує весь ланцюжок.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Създайте директория","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/data.txt', 'x';\n\nsay 'reports'.IO.d;\nsay 'reports/data.txt'.IO.e;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/directories/make-a-directory.raku\" target=\"_blank\" rel=\"noopener\">make-a-directory.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> създава директорията, а <code>.IO.d<\/code> показва, че <code>reports<\/code> наистина е директория.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Директорията вече съществува, така че можем да запишем файл в нея. За това даваме път, който включва името на директорията: <code>reports/data.txt<\/code>. След това <code>.e<\/code> върху този път показва, че файлът вече е в новата директория.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Редът има значение: <code>spurt<\/code> <strong>не<\/strong> създава липсващи директории вместо вас. Опитайте да запишете в <code>reports/data.txt<\/code>, преди директорията <code>reports<\/code> да съществува. Това завършва с грешка от рода на <code>Failed to open file … : No such file or directory<\/code>. Записът успява само защото <code>mkdir<\/code> първо създава директорията. За щастие <code>mkdir<\/code> създава и всички липсващи директории в средата на пътя. Така при вложен път, като <code>mkdir 'reports/2026'<\/code>, едно извикване изгражда цялата верига.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Kreu dosierujon","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/data.txt', 'x';\n\nsay 'reports'.IO.d;\nsay 'reports/data.txt'.IO.e;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/directories/make-a-directory.raku\" target=\"_blank\" rel=\"noopener\">make-a-directory.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> kreas la dosierujon, kaj <code>.IO.d<\/code> montras, ke <code>reports<\/code> vere estas dosierujo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La dosierujo nun ekzistas, do ni povas skribi dosieron en ĝin. Por tio, ni donas vojon, kiu enhavas la nomon de la dosierujo: <code>reports/data.txt<\/code>. Poste <code>.e<\/code> sur ĉi tiu vojo montras, ke la dosiero nun estas en la nova dosierujo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La ordo gravas: <code>spurt<\/code> <strong>ne<\/strong> kreas mankantajn dosierujojn por vi. Provu skribi al <code>reports/data.txt<\/code> antaŭ ol la dosierujo <code>reports<\/code> ekzistas. Tio malsukcesas kun eraro kiel <code>Failed to open file … : No such file or directory<\/code>. La skribado funkcias nur ĉar <code>mkdir<\/code> unue kreas la dosierujon. Feliĉe, <code>mkdir<\/code> ankaŭ kreas ĉiujn mankantajn dosierujojn en la mezo de vojo. Do kun nestita vojo, kiel en <code>mkdir 'reports/2026'<\/code>, unu voko konstruas la tutan ĉenon.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Directorium crea","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/data.txt', 'x';\n\nsay 'reports'.IO.d;\nsay 'reports/data.txt'.IO.e;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/directories/make-a-directory.raku\" target=\"_blank\" rel=\"noopener\">make-a-directory.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>True\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>mkdir<\/code> directoriam creat, et <code>.IO.d<\/code> ostendit <code>reports<\/code> vere directoriam esse.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Directoria nunc exsistit, itaque archivum in eam scribere possumus. Ad hoc semitam damus quae nomen directoriae includit: <code>reports/data.txt<\/code>. Deinde <code>.e<\/code> in hac semita ostendit archivum nunc in nova directoria esse.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ordo refert: <code>spurt<\/code> directorias absentes pro te <strong>non<\/strong> creat. Conare in <code>reports/data.txt<\/code> scribere antequam directoria <code>reports<\/code> exsistit. Hoc deficit cum errore sicut <code>Failed to open file … : No such file or directory<\/code>. Scriptio solum succedit quia <code>mkdir<\/code> directoriam primum creat. Feliciter <code>mkdir<\/code> etiam quaslibet directorias absentes in media semita creat. Itaque cum semita nidificata, ut in <code>mkdir 'reports/2026'<\/code>, una vocatio totam catenam aedificat.<\/span><\/li><\/ol>"]]}}}</script>
