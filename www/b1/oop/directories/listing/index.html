<script type="application/json" id="page-data">{"u":"oop/directories/listing","n":880,"k":"topic","pv":"oop/directories","nx":"oop/directories/listing/quiz","tr":["oop","oop/directories"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Listing a directory","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>dir<\/code> routine returns the entries of a directory, each one as a path object.<\/span> <span class=\"sg\" data-s=\"1\">Their order is not fixed.<\/span> <span class=\"sg\" data-s=\"2\">So people often sort the result, and then the output always has the same order.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints the sorted names of the files in the <code>box<\/code> directory:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Each entry is a full path object.<\/span> <span class=\"sg\" data-s=\"1\">The <code>basename<\/code> method gives only the final name, without the directory part.<\/span> <span class=\"sg\" data-s=\"2\">You can ask a path object all the same questions as before: <code>.f<\/code>, <code>.d<\/code> and <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So you can, for example, go through a directory and choose only the files.<\/span><\/p>"]]},"de":{"t":"Ein Verzeichnis auflisten","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>dir<\/code> gibt die Einträge eines Verzeichnisses zurück, jeden als Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"1\">Ihre Reihenfolge ist nicht fest.<\/span> <span class=\"sg\" data-s=\"2\">Darum sortiert man das Ergebnis oft, und dann hat die Ausgabe immer dieselbe Reihenfolge.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt die sortierten Namen der Dateien im Verzeichnis <code>box<\/code> aus:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jeder Eintrag ist ein vollständiges Pfadobjekt.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>basename<\/code> gibt nur den letzten Namen zurück, ohne den Verzeichnisteil.<\/span> <span class=\"sg\" data-s=\"2\">Sie können einem Pfadobjekt dieselben Fragen stellen wie vorher: <code>.f<\/code>, <code>.d<\/code> und <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">So können Sie zum Beispiel ein Verzeichnis durchgehen und nur die Dateien auswählen.<\/span><\/p>"]]},"nl":{"t":"Een map opsommen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">De routine <code>dir<\/code> geeft de items van een map terug, elk als een padobject.<\/span> <span class=\"sg\" data-s=\"1\">Hun volgorde ligt niet vast.<\/span> <span class=\"sg\" data-s=\"2\">Dus sorteren mensen het resultaat vaak, en dan heeft de uitvoer altijd dezelfde volgorde.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt de gesorteerde namen af van de bestanden in de map <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Elk item is een volledig padobject.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>basename<\/code> geeft alleen de laatste naam, zonder het mapgedeelte.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt een padobject dezelfde vragen stellen als eerder: <code>.f<\/code>, <code>.d<\/code> en <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Zo kun je bijvoorbeeld door een map lopen en alleen de bestanden kiezen.<\/span><\/p>"]]},"es":{"t":"Listar un directorio","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>dir<\/code> devuelve las entradas de un directorio, cada una como un objeto de ruta.<\/span> <span class=\"sg\" data-s=\"1\">Su orden no es fijo.<\/span> <span class=\"sg\" data-s=\"2\">Por eso, la gente suele ordenar el resultado, y así la salida siempre tiene el mismo orden.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime los nombres ordenados de los archivos del directorio <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada entrada es un objeto de ruta completo.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>basename<\/code> da solo el nombre final, sin la parte del directorio.<\/span> <span class=\"sg\" data-s=\"2\">A un objeto de ruta le puedes hacer las mismas preguntas de antes: <code>.f<\/code>, <code>.d<\/code> y <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Así que puedes, por ejemplo, recorrer un directorio y quedarte solo con los archivos.<\/span><\/p>"]]},"it":{"t":"Elencare una directory","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La routine <code>dir<\/code> restituisce le voci di una directory, ognuna come oggetto percorso.<\/span> <span class=\"sg\" data-s=\"1\">Il loro ordine non è fisso.<\/span> <span class=\"sg\" data-s=\"2\">Quindi spesso si ordina il risultato, e così l'output ha sempre lo stesso ordine.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa in ordine i nomi dei file nella directory <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni voce è un oggetto percorso completo.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>basename<\/code> dà solo il nome finale, senza la parte della directory.<\/span> <span class=\"sg\" data-s=\"2\">A un oggetto percorso puoi fare tutte le domande di prima: <code>.f<\/code>, <code>.d<\/code> e <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Così puoi, per esempio, percorrere una directory e scegliere solo i file.<\/span><\/p>"]]},"lv":{"t":"Direktorijas satura uzskaitīšana","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>dir<\/code> atgriež direktorijas ierakstus, katru kā ceļa objektu.<\/span> <span class=\"sg\" data-s=\"1\">To secība nav noteikta.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc rezultātu bieži sakārto, un tad izvadei vienmēr ir tā pati secība.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā direktorijā <code>box<\/code> esošo failu sakārtotos nosaukumus:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Katrs ieraksts ir pilns ceļa objekts.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>basename<\/code> dod tikai pēdējo nosaukumu, bez direktorijas daļas.<\/span> <span class=\"sg\" data-s=\"2\">Ceļa objektam var uzdot visus tos pašus jautājumus kā iepriekš: <code>.f<\/code>, <code>.d<\/code> un <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc jūs varat, piemēram, iet cauri direktorijai un izvēlēties tikai failus.<\/span><\/p>"]]},"ru":{"t":"Просмотр содержимого каталога","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>dir<\/code> возвращает записи каталога, каждую в виде объекта пути.<\/span> <span class=\"sg\" data-s=\"1\">Их порядок может меняться.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому результат часто сортируют, и тогда вывод всегда идёт в одном и том же порядке.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает отсортированные имена файлов в каталоге <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждая запись — это полноценный объект пути.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>basename<\/code> даёт только последнее имя, без части с каталогом.<\/span> <span class=\"sg\" data-s=\"2\">Объекту пути можно задать все те же вопросы, что и раньше: <code>.f<\/code>, <code>.d<\/code> и <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому можно, например, пройти по каталогу и выбрать только файлы.<\/span><\/p>"]]},"uk":{"t":"Перелік вмісту каталогу","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>dir<\/code> повертає записи каталогу, кожен як об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"1\">Їхній порядок не фіксований.<\/span> <span class=\"sg\" data-s=\"2\">Тому результат часто сортують, і тоді вивід завжди має той самий порядок.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить відсортовані імена файлів у каталозі <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен запис — це повний об'єкт шляху.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>basename<\/code> дає лише кінцеве ім'я, без частини з каталогом.<\/span> <span class=\"sg\" data-s=\"2\">Об'єкту шляху можна ставити всі ті самі запитання, що й раніше: <code>.f<\/code>, <code>.d<\/code> і <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Тож ви можете, наприклад, пройти каталогом і вибрати лише файли.<\/span><\/p>"]]},"bg":{"t":"Изброяване на директория","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>dir<\/code> връща елементите на директория, всеки като обект-път.<\/span> <span class=\"sg\" data-s=\"1\">Редът им не е фиксиран.<\/span> <span class=\"sg\" data-s=\"2\">Затова хората често сортират резултата и тогава изходът винаги е в същия ред.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва сортираните имена на файловете в директорията <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всеки елемент е пълен обект-път.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>basename<\/code> дава само крайното име, без частта с директорията.<\/span> <span class=\"sg\" data-s=\"2\">Можете да зададете на обекта-път всички същите въпроси както преди: <code>.f<\/code>, <code>.d<\/code> и <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Така можете например да обходите директория и да изберете само файловете.<\/span><\/p>"]]},"eo":{"t":"Listigi dosierujon","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>dir<\/code> redonas la erojn de dosierujo, ĉiun kiel vojobjekton.<\/span> <span class=\"sg\" data-s=\"1\">Ilia ordo ne estas fiksita.<\/span> <span class=\"sg\" data-s=\"2\">Do oni ofte ordigas la rezulton, kaj tiam la eligo ĉiam havas la saman ordon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas la ordigitajn nomojn de la dosieroj en la dosierujo <code>box<\/code>:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu ero estas plena vojobjekto.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>basename<\/code> donas nur la finan nomon, sen la parto de la dosierujo.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas fari al vojobjekto ĉiujn samajn demandojn kiel antaŭe: <code>.f<\/code>, <code>.d<\/code> kaj <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Do vi povas, ekzemple, trairi dosierujon kaj elekti nur la dosierojn.<\/span><\/p>"]]},"la":{"t":"Directorium enumerare","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>dir<\/code> ingressus directoriae reddit, unumquemque ut obiectum semitae.<\/span> <span class=\"sg\" data-s=\"1\">Ordo eorum fixus non est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque homines saepe effectum ordinant, et tum exitus semper eundem ordinem habet.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'box';\nspurt 'box/a.txt', '';\nspurt 'box/b.txt', '';\n\nfor dir('box').sort -&gt; $entry {\n    say $entry.basename;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma nomina ordinata archivorum in directoria <code>box<\/code> imprimit:<\/span><\/p>"],["code",0,"<pre><code>a.txt\nb.txt<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quisque ingressus plenum obiectum semitae est.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>basename<\/code> solum nomen ultimum dat, sine parte directoriae.<\/span> <span class=\"sg\" data-s=\"2\">Ab obiecto semitae easdem quaestiones ac prius petere potes: <code>.f<\/code>, <code>.d<\/code> et <code>.e<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Itaque potes, exempli gratia, per directoriam ire et sola archiva eligere.<\/span><\/p>"]]}}}</script>
