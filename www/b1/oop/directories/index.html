<script type="application/json" id="page-data">{"u":"oop/directories","n":879,"k":"section","pv":"oop/files/exercises/count-characters/solution","nx":"oop/directories/listing","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Working with directories","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sometimes you need to work with the file system itself.<\/span> <span class=\"sg\" data-s=\"1\">For example, you may want to check what exists or create directories.<\/span> <span class=\"sg\" data-s=\"2\">For this, Raku uses <em>path objects<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">You can turn any string into a path object with the <code>.IO<\/code> method.<\/span> <span class=\"sg\" data-s=\"4\">The path object then answers questions about that path.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Most often, you ask if a path exists and what kind of thing it is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> checks whether the path exists.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> checks for a regular file, and <code>.d<\/code> checks for a directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To create a new directory, use <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In the next topic, you will see how to list the contents of a directory.<\/span><\/p>"]]},"de":{"t":"Mit Verzeichnissen arbeiten","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Manchmal müssen Sie mit dem Dateisystem selbst arbeiten.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel möchten Sie prüfen, was da ist, oder Verzeichnisse anlegen.<\/span> <span class=\"sg\" data-s=\"2\">Dafür verwendet Raku <em>Pfadobjekte<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Mit der Methode <code>.IO<\/code> können Sie jede Zeichenkette in ein Pfadobjekt verwandeln.<\/span> <span class=\"sg\" data-s=\"4\">Das Pfadobjekt beantwortet dann Fragen zu diesem Pfad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Am häufigsten fragen Sie, ob ein Pfad existiert und was für ein Ding er ist:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> prüft, ob der Pfad existiert.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> prüft auf eine gewöhnliche Datei und <code>.d<\/code> auf ein Verzeichnis.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um ein neues Verzeichnis anzulegen, verwenden Sie <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Im nächsten Thema sehen Sie, wie man den Inhalt eines Verzeichnisses auflistet.<\/span><\/p>"]]},"nl":{"t":"Met mappen werken","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Soms moet je met het bestandssysteem zelf werken.<\/span> <span class=\"sg\" data-s=\"1\">Je wilt bijvoorbeeld controleren wat er bestaat, of mappen aanmaken.<\/span> <span class=\"sg\" data-s=\"2\">Daarvoor gebruikt Raku <em>padobjecten<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt elke string met de methode <code>.IO<\/code> in een padobject omzetten.<\/span> <span class=\"sg\" data-s=\"4\">Het padobject beantwoordt dan vragen over dat pad.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Meestal vraag je of een pad bestaat en wat voor ding het is:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> controleert of het pad bestaat.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> controleert of het een gewoon bestand is, en <code>.d<\/code> of het een map is.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een nieuwe map aan te maken gebruik je <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In het volgende onderwerp zie je hoe je de inhoud van een map opsomt.<\/span><\/p>"]]},"es":{"t":"Trabajar con directorios","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A veces necesitas trabajar con el propio sistema de archivos.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, quizá quieras comprobar qué existe o crear directorios.<\/span> <span class=\"sg\" data-s=\"2\">Para eso, Raku usa <em>objetos de ruta<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Puedes convertir cualquier cadena en un objeto de ruta con el método <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Después, el objeto de ruta responde a preguntas sobre esa ruta.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lo más común es preguntar si una ruta existe y qué clase de cosa es:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> comprueba si la ruta existe.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> comprueba si es un archivo regular, y <code>.d<\/code> si es un directorio.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para crear un directorio nuevo, usa <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En el tema siguiente, verás cómo listar el contenido de un directorio.<\/span><\/p>"]]},"it":{"t":"Lavorare con le directory","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">A volte devi lavorare con il file system stesso.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, puoi voler controllare che cosa esiste o creare delle directory.<\/span> <span class=\"sg\" data-s=\"2\">Per questo, Raku usa gli <em>oggetti percorso<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi trasformare qualsiasi stringa in un oggetto percorso con il metodo <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">L'oggetto percorso poi risponde alle domande su quel percorso.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Molto spesso chiedi se un percorso esiste e che tipo di cosa è:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> controlla se il percorso esiste.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> controlla se è un file regolare, e <code>.d<\/code> se è una directory.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per creare una nuova directory, usa <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nel prossimo argomento vedrai come elencare il contenuto di una directory.<\/span><\/p>"]]},"lv":{"t":"Darbs ar direktorijām","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Dažreiz jums jāstrādā ar pašu failu sistēmu.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, jūs varbūt gribat pārbaudīt, kas eksistē, vai izveidot direktorijas.<\/span> <span class=\"sg\" data-s=\"2\">Tam Raku izmanto <em>ceļa objektus<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Jebkuru virkni var pārvērst par ceļa objektu ar metodi <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Ceļa objekts tad atbild uz jautājumiem par šo ceļu.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Visbiežāk jūs jautājat, vai ceļš eksistē un kāda veida lieta tā ir:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — does it exist?\nsay 'greeting.txt'.IO.f; # True  — is it a file?\nsay 'greeting.txt'.IO.d; # False — is it a directory?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> pārbauda, vai ceļš eksistē.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> pārbauda, vai tas ir parasts fails, un <code>.d<\/code> pārbauda, vai tā ir direktorija.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izveidotu jaunu direktoriju, izmantojiet <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nākamajā tematā jūs redzēsiet, kā uzskaitīt direktorijas saturu.<\/span><\/p>"]]},"ru":{"t":"Работа с каталогами","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Иногда нужно работать с самой файловой системой.<\/span> <span class=\"sg\" data-s=\"1\">Например, вы хотите проверить, что существует, или создать каталоги.<\/span> <span class=\"sg\" data-s=\"2\">Для этого Raku использует <em>объекты пути<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Любую строку можно превратить в объект пути методом <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Затем объект пути отвечает на вопросы об этом пути.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чаще всего вы спрашиваете, существует ли путь и что это такое:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — существует ли?\nsay 'greeting.txt'.IO.f; # True  — это файл?\nsay 'greeting.txt'.IO.d; # False — это каталог?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверяет, существует ли путь.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> проверяет, обычный ли это файл, а <code>.d<\/code> — каталог ли это.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы создать новый каталог, используйте <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следующей теме вы увидите, как получить список содержимого каталога.<\/span><\/p>"]]},"uk":{"t":"Робота з каталогами","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Іноді потрібно працювати із самою файловою системою.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ви можете захотіти перевірити, що існує, або створити каталоги.<\/span> <span class=\"sg\" data-s=\"2\">Для цього Raku використовує <em>об'єкти шляху<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Будь-який рядок можна перетворити на об'єкт шляху методом <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Потім об'єкт шляху відповідає на запитання про цей шлях.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Найчастіше ви питаєте, чи існує шлях і що це за річ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — чи існує?\nsay 'greeting.txt'.IO.f; # True  — чи це файл?\nsay 'greeting.txt'.IO.d; # False — чи це каталог?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> перевіряє, чи існує шлях.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> перевіряє, чи це звичайний файл, а <code>.d<\/code> — чи це каталог.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб створити новий каталог, скористайтеся <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">У наступній темі ви побачите, як перелічити вміст каталогу.<\/span><\/p>"]]},"bg":{"t":"Работа с директории","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Понякога трябва да работите със самата файлова система.<\/span> <span class=\"sg\" data-s=\"1\">Например може да искате да проверите какво съществува или да създадете директории.<\/span> <span class=\"sg\" data-s=\"2\">За това Raku използва <em>обекти-пътища<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Можете да превърнете всеки низ в обект-път с метода <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">След това обектът-път отговаря на въпроси за този път.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Най-често питате дали пътят съществува и какъв вид нещо е той:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — съществува ли?\nsay 'greeting.txt'.IO.f; # True  — файл ли е?\nsay 'greeting.txt'.IO.d; # False — директория ли е?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> проверява дали пътят съществува.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> проверява за обикновен файл, а <code>.d<\/code> — за директория.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да създадете нова директория, използвайте <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">В следващата тема ще видите как да изброите съдържанието на директория.<\/span><\/p>"]]},"eo":{"t":"Labori kun dosierujoj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Foje vi devas labori kun la dosiersistemo mem.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, vi eble volas kontroli, kio ekzistas, aŭ krei dosierujojn.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, Raku uzas <em>vojobjektojn<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas fari vojobjekton el ĉiu ĉeno per la metodo <code>.IO<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La vojobjekto tiam respondas demandojn pri tiu vojo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Plej ofte, vi demandas, ĉu vojo ekzistas kaj kia afero ĝi estas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — ĉu ĝi ekzistas?\nsay 'greeting.txt'.IO.f; # True  — ĉu ĝi estas dosiero?\nsay 'greeting.txt'.IO.d; # False — ĉu ĝi estas dosierujo?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> kontrolas, ĉu la vojo ekzistas.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> kontrolas, ĉu ĝi estas ordinara dosiero, kaj <code>.d<\/code> kontrolas, ĉu ĝi estas dosierujo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por krei novan dosierujon, uzu <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">En la sekva temo, vi vidos, kiel listigi la enhavon de dosierujo.<\/span><\/p>"]]},"la":{"t":"Cum directoriis laborare","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Interdum cum ipso systemate archivorum laborare debes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia fortasse probare vis quid exsistat, aut directorias creare.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc Raku <em>obiectis semitae<\/em> utitur.<\/span> <span class=\"sg\" data-s=\"3\">Quamlibet chordam in obiectum semitae per methodum <code>.IO<\/code> vertere potes.<\/span> <span class=\"sg\" data-s=\"4\">Obiectum semitae deinde ad quaestiones de illa semita respondet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Saepissime rogas utrum semita exsistat et cuius generis res sit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', 'hi';\n\nsay 'greeting.txt'.IO.e; # True  — exsistitne?\nsay 'greeting.txt'.IO.f; # True  — estne archivum?\nsay 'greeting.txt'.IO.d; # False — estne directoria?<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>.e<\/code> probat utrum semita exsistat.<\/span> <span class=\"sg\" data-s=\"1\"><code>.f<\/code> archivum ordinarium probat, et <code>.d<\/code> directoriam probat.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut novam directoriam creetur, utere <code>mkdir<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nsay 'reports'.IO.d; # True<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">In argumento sequenti videbis quomodo contenta directoriae enumeres.<\/span><\/p>"]]}}}</script>
