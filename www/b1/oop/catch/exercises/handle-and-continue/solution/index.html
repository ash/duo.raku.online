<script type="application/json" id="page-data">{"u":"oop/catch/exercises/handle-and-continue/solution","n":937,"k":"solution","pv":"oop/catch/exercises/handle-and-continue","nx":"oop/catch/exercises/survive-a-loop","tr":["oop","oop/catch"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Handle and continue‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser is inside the block that runs for each item. So it handles a <code>die<\/code> for that one item only. The exception is handled there, so it never escapes to stop the whole loop.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is a typical case where <code>CATCH<\/code> is better than <code>try<\/code>. A failure in one round of the loop is handled right where it happens. Then the loop moves on to the next item. The middle item fails, but the two <code>ok<\/code> items are still processed.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Behandeln und weitermachen","b" $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser zit binnen het blok dat voor elk item draait. Dus handelt hij een <code>die<\/code> alleen voor dat ene item af. De exceptie wordt daar afgehandeld, dus ontsnapt ze nooit om de hele lus te stoppen.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Dit is een typisch geval waarin <code>CATCH<\/code> beter is dan <code>try<\/code>. Een mislukking in één ronde van de lus wordt afgehandeld op de plek waar ze gebeurt. Daarna gaat de lus door naar het volgende item. Het middelste item mislukt, maar de twee <code>ok<\/code>-items worden toch verwerkt.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Maneje y continúe","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://gi list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Šis ir tipisks gadījums, kad <code>CATCH<\/code> ir labāks par <code>try<\/code>. Kļūda vienā cikla piegājienā tiek apstrādāta turpat, kur tā notiek. Tad cikls pāriet uz nākamo elementu. Vidējais elements neizdodas, bet abi <code>ok<\/code> elementi tomēr tiek apstrādāti.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Обработайте и продолжите","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> находится внутри блока, который выполняется для каждого элемента. Поэтому он обрабатывает <code>die<\/code> только для этого одного элемента. Исключение обрабатывается там, поэтому оно не вырывается наружу и не останавливает весь цикл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Это типичный случай, когда <code>CATCH<\/code> лучше, чем <code>try<\/code>. Сбой на одном проходе цикла обрабатывается прямо там, где он случился. Затем цикл переходит к следующему элементу. Средний элемент даёт сбой, но два элемента <code>ok<\/code> всё равно обрабатываются.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Обробити й продовжити","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазер <code>CATCH<\/code> стоїть усередині блоку, який виконується для кожного елемента. Тож він обробляє <code>die<\/code> лише для цього одного елемента. Виняток обробляється там, тому він ніколи не вибирається назовні й не зупиняє весь цикл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Це типовий випадок, коли <code>CATCH<\/code> кращий за <code>try<\/code>. Збій в одному проході циклу обробляється там, де він стався. Потім цикл переходить до наступного елемента. Середній елемент дає збій, але два елементи <code>ok<\/code> усе одно обробляються.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Обработете и продължете","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Фазерът <code>CATCH<\/code> е вътре в блока, който се изпълнява за всеки елемент. Затова той обработва <code>die<\/code> само за този един елемент. Изключението се обработва там, така че то никога не излиза навън, за да спре целия цикъл.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Това е типичен случай, в който <code>CATCH<\/code> е по-добър от <code>try<\/code>. Провал в една обиколка на цикъла се обработва точно там, където се случва. После цикълът продължава към следващия елемент. Средният елемент се проваля, но двата елемента <code>ok<\/code> пак се обработват.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Traktu kaj daŭrigu","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La fazero <code>CATCH<\/code> estas ene de la bloko, kiu ruliĝas por ĉiu ero. Do ĝi traktas <code>die<\/code> nur por tiu unu ero. La escepto estas traktata tie, do ĝi neniam eskapas por haltigi la tutan buklon.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉi tio estas tipa kazo, kie <code>CATCH<\/code> estas pli bona ol <code>try<\/code>. Misfunkcio en unu rondo de la buklo estas traktata ĝuste tie, kie ĝi okazas. Poste la buklo iras al la sekva ero. La meza ero malsukcesas, sed la du eroj <code>ok<\/code> ankoraŭ estas prilaborataj.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Tracta et perge","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>for &lt;ok bad ok&gt; -&gt; $item {\n    {\n        die 'boom' if $item eq 'bad';\n        say \"processed $item\";\n\n        CATCH {\n            default {\n                say \"skipped ($item): {.message}\";\n            }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/catch/handle-and-continue.raku\" target=\"_blank\" rel=\"noopener\">handle-and-continue.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>processed ok\nskipped (bad): boom\nprocessed ok<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fasis <code>CATCH<\/code> intra clausulam est quae pro quoque elemento currit. Itaque <code>die<\/code> solum pro illo uno elemento tractat. Exceptio ibi tractatur, itaque numquam effugit ut totum anulum sistat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Hic est casus usitatus ubi <code>CATCH<\/code> melior est quam <code>try<\/code>. Defectus in uno gyro anuli eo ipso loco tractatur ubi accidit. Deinde anulus ad elementum sequens transit. Elementum medium deficit, sed duo elementa <code>ok<\/code> tamen tractantur.<\/span><\/li><\/ol>"]]}}}</script>
