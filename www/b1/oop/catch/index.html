<script type="application/json" id="page-data">{"u":"oop/catch","n":934,"k":"section","pv":"oop/try/quiz","nx":"oop/catch/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The <code>CATCH<\/code> phaser","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">The <code>try<\/code> block is handy, but it treats the whole block as one unit.<\/span> <span class=\"sg\" data-s=\"1\">The block either works, or it does not.<\/span> <span class=\"sg\" data-s=\"2\">The <code>CATCH<\/code> phaser gives you more control.<\/span> <span class=\"sg\" data-s=\"3\">It lets you handle an exception <em>inside<\/em> the block where it happened.<\/span> <span class=\"sg\" data-s=\"4\">Then you decide what to do.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> is a phaser, like the ones you saw in the <a href=\"/advanced/phasers/\">section about control flow<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">You can put it anywhere inside a block.<\/span> <span class=\"sg\" data-s=\"2\">It runs only if an exception is thrown in that block.<\/span> <span class=\"sg\" data-s=\"3\">You get the exception as the topic variable <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The <code>default<\/code> block inside <code>CATCH<\/code> handles any exception.<\/span> <span class=\"sg\" data-s=\"1\">After it has run, the exception counts as handled.<\/span> <span class=\"sg\" data-s=\"2\">So the program does not stop.<\/span> <span class=\"sg\" data-s=\"3\">It continues after the block around the <code>CATCH<\/code>, which is why <code>after<\/code> is printed.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without the <code>CATCH<\/code>, the <code>die<\/code> would end the program before it got to <code>after<\/code>.<\/span><\/p>"]]},"de":{"t":"Der <code>CATCH<\/code>-Phaser","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Der <code>try<\/code>-Block ist praktisch, aber er behandelt den ganzen Block als eine Einheit.<\/span> <span class=\"sg\" data-s=\"1\">Der Block funktioniert entweder, oder er funktioniert nicht.<\/span> <span class=\"sg\" data-s=\"2\">Der <code>CATCH<\/code>-Phaser gibt Ihnen mehr Kontrolle.<\/span> <span class=\"sg\" data-s=\"3\">Mit ihm können Sie eine Ausnahme <em>innerhalb<\/em> des Blocks behandeln, in dem sie passiert ist.<\/span> <span class=\"sg\" data-s=\"4\">Dann entscheiden Sie, was zu tun ist.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> ist ein Phaser, wie die Phaser, die Sie im <a href=\"https://course.raku.org/de/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über den Programmfluss<\/a> gesehen haben.<\/span> <span class=\"sg\" data-s=\"1\">Sie können ihn an jede Stelle in einem Block schreiben.<\/span> <span class=\"sg\" data-s=\"2\">Er läuft nur, wenn in diesem Block eine Ausnahme geworfen wird.<\/span> <span class=\"sg\" data-s=\"3\">Die Ausnahme bekommen Sie als Themenvariable <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der <code>default<\/code>-Block innerhalb von <code>CATCH<\/code> behandelt jede Ausnahme.<\/span> <span class=\"sg\" data-s=\"1\">Nachdem er gelaufen ist, gilt die Ausnahme als behandelt.<\/span> <span class=\"sg\" data-s=\"2\">Also hält das Programm nicht an.<\/span> <span class=\"sg\" data-s=\"3\">Es läuft hinter dem Block um das <code>CATCH<\/code> weiter, und darum wird <code>after<\/code> ausgegeben.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne das <code>CATCH<\/code> würde das <code>die<\/code> das Programm beenden, bevor es zu <code>after<\/code> kommt.<\/span><\/p>"]]},"nl":{"t":"De <code>CATCH<\/code>-faser","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Het <code>try<\/code>-blok is handig, maar het behandelt het hele blok als één geheel.<\/span> <span class=\"sg\" data-s=\"1\">Het blok werkt, of het werkt niet.<\/span> <span class=\"sg\" data-s=\"2\">De <code>CATCH<\/code>-faser geeft je meer controle.<\/span> <span class=\"sg\" data-s=\"3\">Hiermee kun je een exceptie afhandelen <em>binnen<\/em> het blok waar ze gebeurde.<\/span> <span class=\"sg\" data-s=\"4\">Daarna beslis je wat er moet gebeuren.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> is een faser, net als de fasers uit de <a href=\"https://course.raku.org/nl/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sectie over besturingsstructuren<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt hem overal binnen een blok zetten.<\/span> <span class=\"sg\" data-s=\"2\">Hij draait alleen als er in dat blok een exceptie geworpen wordt.<\/span> <span class=\"sg\" data-s=\"3\">Je krijgt de exceptie als de topic variabele <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Het <code>default<\/code>-blok binnen <code>CATCH<\/code> handelt elke exceptie af.<\/span> <span class=\"sg\" data-s=\"1\">Nadat het gedraaid heeft, telt de exceptie als afgehandeld.<\/span> <span class=\"sg\" data-s=\"2\">Dus stopt het programma niet.<\/span> <span class=\"sg\" data-s=\"3\">Het gaat verder na het blok rond de <code>CATCH<\/code>, en daarom wordt <code>after<\/code> afgedrukt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder de <code>CATCH<\/code> zou de <code>die<\/code> het programma beëindigen voordat het bij <code>after<\/code> kwam.<\/span><\/p>"]]},"es":{"t":"El phaser <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>try<\/code> es cómodo, pero trata todo el bloque como una sola unidad.<\/span> <span class=\"sg\" data-s=\"1\">El bloque o funciona o no funciona.<\/span> <span class=\"sg\" data-s=\"2\">El phaser <code>CATCH<\/code> te da más control.<\/span> <span class=\"sg\" data-s=\"3\">Te permite manejar una excepción <em>dentro<\/em> del bloque donde ocurrió.<\/span> <span class=\"sg\" data-s=\"4\">Después decides qué hacer.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> es un phaser, como los que viste en la <a href=\"https://course.raku.org/es/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sección sobre el flujo de control<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Puedes ponerlo en cualquier lugar dentro de un bloque.<\/span> <span class=\"sg\" data-s=\"2\">Solo se ejecuta si se lanza una excepción en ese bloque.<\/span> <span class=\"sg\" data-s=\"3\">Recibes la excepción como la variable de tema <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El bloque <code>default<\/code> dentro de <code>CATCH<\/code> maneja cualquier excepción.<\/span> <span class=\"sg\" data-s=\"1\">Después de que se ha ejecutado, la excepción cuenta como manejada.<\/span> <span class=\"sg\" data-s=\"2\">Así que el programa no se detiene.<\/span> <span class=\"sg\" data-s=\"3\">Continúa después del bloque que rodea al <code>CATCH<\/code>, y por eso se imprime <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin el <code>CATCH<\/code>, el <code>die<\/code> terminaría el programa antes de llegar a <code>after<\/code>.<\/span><\/p>"]]},"it":{"t":"Il phaser <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>try<\/code> è comodo, ma tratta tutto il blocco come un'unica unità.<\/span> <span class=\"sg\" data-s=\"1\">Il blocco o funziona, o non funziona.<\/span> <span class=\"sg\" data-s=\"2\">Il phaser <code>CATCH<\/code> ti dà più controllo.<\/span> <span class=\"sg\" data-s=\"3\">Ti permette di gestire un'eccezione <em>dentro<\/em> il blocco in cui è avvenuta.<\/span> <span class=\"sg\" data-s=\"4\">Poi decidi tu che cosa fare.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> è un phaser, come quelli che hai visto nella <a href=\"https://course.raku.org/it/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sezione sul flusso di controllo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Puoi metterlo ovunque dentro un blocco.<\/span> <span class=\"sg\" data-s=\"2\">Gira solo se in quel blocco viene sollevata un'eccezione.<\/span> <span class=\"sg\" data-s=\"3\">Ricevi l'eccezione come variabile topic <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il blocco <code>default<\/code> dentro <code>CATCH<\/code> gestisce qualunque eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Dopo che è girato, l'eccezione conta come gestita.<\/span> <span class=\"sg\" data-s=\"2\">Quindi il programma non si ferma.<\/span> <span class=\"sg\" data-s=\"3\">Continua dopo il blocco che contiene il <code>CATCH<\/code>, ed è per questo che viene stampato <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza il <code>CATCH<\/code>, il <code>die<\/code> chiuderebbe il programma prima di arrivare ad <code>after<\/code>.<\/span><\/p>"]]},"lv":{"t":"Fāzeris <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>try<\/code> ir ērts, bet tas visu bloku uztver kā vienu veselumu.<\/span> <span class=\"sg\" data-s=\"1\">Bloks vai nu nostrādā, vai ne.<\/span> <span class=\"sg\" data-s=\"2\">Fāzeris <code>CATCH<\/code> dod jums vairāk vadības.<\/span> <span class=\"sg\" data-s=\"3\">Tas ļauj apstrādāt izņēmumu <em>iekšpus<\/em> tā bloka, kurā tas notika.<\/span> <span class=\"sg\" data-s=\"4\">Pēc tam jūs izlemjat, ko darīt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> ir fāzeris, tāpat kā tie, ko redzējāt <a href=\"https://course.raku.org/lv/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sadaļā par vadības plūsmu<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">To var likt jebkur bloka iekšā.<\/span> <span class=\"sg\" data-s=\"2\">Tas izpildās tikai tad, ja šajā blokā tiek izmests izņēmums.<\/span> <span class=\"sg\" data-s=\"3\">Izņēmumu jūs saņemat kā tēmas mainīgo <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bloks <code>default<\/code> fāzerī <code>CATCH<\/code> apstrādā jebkuru izņēmumu.<\/span> <span class=\"sg\" data-s=\"1\">Kad tas ir izpildījies, izņēmums skaitās apstrādāts.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc programma neapstājas.<\/span> <span class=\"sg\" data-s=\"3\">Tā turpinās aiz bloka, kurā ir <code>CATCH<\/code>, un tāpēc tiek izdrukāts <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja nebūtu <code>CATCH<\/code>, <code>die<\/code> būtu beidzis programmu, pirms tā nonāktu līdz <code>after<\/code>.<\/span><\/p>"]]},"ru":{"t":"Фазер <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> удобен, но для него весь блок — одно целое.<\/span> <span class=\"sg\" data-s=\"1\">Блок либо работает, либо нет.<\/span> <span class=\"sg\" data-s=\"2\">Фазер <code>CATCH<\/code> даёт вам больше контроля.<\/span> <span class=\"sg\" data-s=\"3\">Он позволяет обработать исключение <em>внутри<\/em> того блока, где оно произошло.<\/span> <span class=\"sg\" data-s=\"4\">Затем вы решаете, что делать.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> — это фазер, как те, что вы видели в <a href=\"https://course.raku.org/ru/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">разделе о порядке выполнения<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Его можно поставить где угодно внутри блока.<\/span> <span class=\"sg\" data-s=\"2\">Он срабатывает, только если в этом блоке бросается исключение.<\/span> <span class=\"sg\" data-s=\"3\">Исключение доступно как переменная темы <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> внутри <code>CATCH<\/code> обрабатывает любое исключение.<\/span> <span class=\"sg\" data-s=\"1\">Когда он отработал, исключение считается обработанным.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому программа не останавливается.<\/span> <span class=\"sg\" data-s=\"3\">Она продолжает работу после блока, где стоит <code>CATCH<\/code>, — вот почему печатается <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> вызов <code>die<\/code> завершил бы программу до того, как она дошла до <code>after<\/code>.<\/span><\/p>"]]},"uk":{"t":"Фазер <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> зручний, але він розглядає весь блок як одне ціле.<\/span> <span class=\"sg\" data-s=\"1\">Блок або спрацьовує, або ні.<\/span> <span class=\"sg\" data-s=\"2\">Фазер <code>CATCH<\/code> дає вам більше контролю.<\/span> <span class=\"sg\" data-s=\"3\">Він дозволяє обробити виняток <em>усередині<\/em> того блоку, де той стався.<\/span> <span class=\"sg\" data-s=\"4\">Потім ви вирішуєте, що робити.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> — це фазер, як ті, що ви бачили в <a href=\"https://course.raku.org/uk/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">розділі про порядок виконання<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Його можна поставити будь-де всередині блоку.<\/span> <span class=\"sg\" data-s=\"2\">Він виконується, лише якщо в цьому блоці кинуто виняток.<\/span> <span class=\"sg\" data-s=\"3\">Виняток ви отримуєте як змінну-топік <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блок <code>default<\/code> усередині <code>CATCH<\/code> обробляє будь-який виняток.<\/span> <span class=\"sg\" data-s=\"1\">Після того як він виконався, виняток вважається обробленим.<\/span> <span class=\"sg\" data-s=\"2\">Тож програма не зупиняється.<\/span> <span class=\"sg\" data-s=\"3\">Вона продовжує роботу після блоку, у якому стоїть <code>CATCH<\/code>, і тому виводиться <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> виклик <code>die<\/code> завершив би програму раніше, ніж вона дійшла б до <code>after<\/code>.<\/span><\/p>"]]},"bg":{"t":"Фазерът <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>try<\/code> е удобен, но третира целия блок като едно цяло.<\/span> <span class=\"sg\" data-s=\"1\">Блокът или работи, или не.<\/span> <span class=\"sg\" data-s=\"2\">Фазерът <code>CATCH<\/code> ви дава повече контрол.<\/span> <span class=\"sg\" data-s=\"3\">Той ви позволява да обработите изключение <em>вътре<\/em> в блока, където то се е случило.<\/span> <span class=\"sg\" data-s=\"4\">После решавате какво да правите.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> е фазер, като онези, които видяхте в <a href=\"https://course.raku.org/bg/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">раздела за управлението на потока<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да го сложите където и да е вътре в блок.<\/span> <span class=\"sg\" data-s=\"2\">Той се изпълнява само ако в този блок бъде хвърлено изключение.<\/span> <span class=\"sg\" data-s=\"3\">Получавате изключението като тематичната променлива <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Блокът <code>default<\/code> вътре в <code>CATCH<\/code> обработва всяко изключение.<\/span> <span class=\"sg\" data-s=\"1\">След като той се изпълни, изключението се смята за обработено.<\/span> <span class=\"sg\" data-s=\"2\">Затова програмата не спира.<\/span> <span class=\"sg\" data-s=\"3\">Тя продължава след блока, който съдържа <code>CATCH<\/code>, и затова се отпечатва <code>after<\/code>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без <code>CATCH<\/code> <code>die<\/code> би спрял програмата, преди тя да стигне до <code>after<\/code>.<\/span><\/p>"]]},"eo":{"t":"La fazero <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">La bloko <code>try<\/code> estas oportuna, sed ĝi traktas la tutan blokon kiel unu unuon.<\/span> <span class=\"sg\" data-s=\"1\">La bloko aŭ funkcias, aŭ ne funkcias.<\/span> <span class=\"sg\" data-s=\"2\">La fazero <code>CATCH<\/code> donas al vi pli da regado.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi permesas al vi trakti escepton <em>ene<\/em> de la bloko, kie ĝi okazis.<\/span> <span class=\"sg\" data-s=\"4\">Poste vi decidas, kion fari.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> estas fazero, kiel tiuj, kiujn vi vidis en la <a href=\"https://course.raku.org/eo/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sekcio pri regofluo<\/a>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas meti ĝin ie ajn ene de bloko.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ruliĝas nur, se escepto estas ĵetata en tiu bloko.<\/span> <span class=\"sg\" data-s=\"3\">Vi ricevas la escepton kiel la temvariablon <code>$_<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La bloko <code>default<\/code> ene de <code>CATCH<\/code> traktas ĉiun escepton.<\/span> <span class=\"sg\" data-s=\"1\">Post kiam ĝi ruliĝis, la escepto kalkuliĝas kiel traktita.<\/span> <span class=\"sg\" data-s=\"2\">Do la programo ne haltas.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi daŭras post la bloko ĉirkaŭ la <code>CATCH<\/code>, kaj tial <code>after<\/code> estas presata.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sen la <code>CATCH<\/code>, la <code>die<\/code> finus la programon, antaŭ ol ĝi atingus <code>after<\/code>.<\/span><\/p>"]]},"la":{"t":"Phasor <code>CATCH<\/code>","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Clausula <code>try<\/code> commoda est, sed totam clausulam ut unum tractat.<\/span> <span class=\"sg\" data-s=\"1\">Clausula aut operatur aut non.<\/span> <span class=\"sg\" data-s=\"2\">Fasis <code>CATCH<\/code> tibi plus potestatis dat.<\/span> <span class=\"sg\" data-s=\"3\">Tibi permittit exceptionem <em>intra<\/em> clausulam tractare ubi accidit.<\/span> <span class=\"sg\" data-s=\"4\">Deinde decernis quid agas.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> fasis est, sicut eae quas in <a href=\"https://course.raku.org/la/advanced/phasers/\" target=\"_blank\" rel=\"noopener\">sectione de ordine exsecutionis<\/a> vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Eam ubicumque intra clausulam ponere potes.<\/span> <span class=\"sg\" data-s=\"2\">Currit solum si exceptio in illa clausula iacitur.<\/span> <span class=\"sg\" data-s=\"3\">Exceptionem ut variabilem thematis <code>$_<\/code> accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'Boom!';\n\n    CATCH {\n        default {\n            say 'Caught: ' ~ .message;\n        }\n    }\n}\n\nsay 'after';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Caught: Boom!\nafter<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Clausula <code>default<\/code> intra <code>CATCH<\/code> quamlibet exceptionem tractat.<\/span> <span class=\"sg\" data-s=\"1\">Postquam cucurrit, exceptio pro tractata habetur.<\/span> <span class=\"sg\" data-s=\"2\">Itaque programma non sistit.<\/span> <span class=\"sg\" data-s=\"3\">Post clausulam circa <code>CATCH<\/code> pergit, et ideo <code>after<\/code> imprimitur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine <code>CATCH<\/code>, <code>die<\/code> programma finiret antequam ad <code>after<\/code> perveniret.<\/span><\/p>"]]}}}</script>
