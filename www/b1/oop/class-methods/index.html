<script type="application/json" id="page-data">{"u":"oop/class-methods","n":804,"k":"section","pv":"oop/methods/exercises/temperature/solution","nx":"oop/class-methods/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Class methods","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Most methods are called on an object, which is an instance of a class.<\/span> <span class=\"sg\" data-s=\"1\">But you can also call a method on the class itself.<\/span> <span class=\"sg\" data-s=\"2\">In other words, you call it on the type object.<\/span> <span class=\"sg\" data-s=\"3\">People often call such a method a <em>class method<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">It is useful for values and operations that belong to the whole class.<\/span> <span class=\"sg\" data-s=\"5\">They do not belong to one particular object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You define a class method in exactly the same way as any other method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">But you call it on the class name instead of an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In fact, you have already used a class method without calling it one.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> is a method that you call on the class to create a new object.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">A class method cannot use instance attributes, because there is no particular object behind it.<\/span> <span class=\"sg\" data-s=\"1\">So it only works with information that every object of the class shares.<\/span> <span class=\"sg\" data-s=\"2\">If the work depends on the data of one object, use an ordinary method.<\/span> <span class=\"sg\" data-s=\"3\">Call it on an instance.<\/span> <span class=\"sg\" data-s=\"4\">If it does not, a class method is the natural choice.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Class methods do not need an instance.<\/span> <span class=\"sg\" data-s=\"1\">Still, when you do have an object, you can use its data in them:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This program prints the result you would expect:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Without an object of the class, a call such as <code>say Road.info<\/code> would cause an error.<\/span><\/p>"]]},"de":{"t":"Klassenmethoden","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Die meisten Methoden werden auf einem Objekt aufgerufen, das eine Instanz einer Klasse ist.<\/span> <span class=\"sg\" data-s=\"1\">Aber Sie können eine Methode auch auf der Klasse selbst aufrufen.<\/span> <span class=\"sg\" data-s=\"2\">Anders gesagt, Sie rufen sie auf dem Typobjekt auf.<\/span> <span class=\"sg\" data-s=\"3\">So eine Methode nennt man oft eine <em>Klassenmethode<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Sie ist nützlich für Werte und Operationen, die zur ganzen Klasse gehören.<\/span> <span class=\"sg\" data-s=\"5\">Sie gehören nicht zu einem bestimmten Objekt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie definieren eine Klassenmethode genau so wie jede andere Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aber Sie rufen sie auf dem Klassennamen auf, nicht auf einer Instanz:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich haben Sie schon eine Klassenmethode benutzt, ohne sie so zu nennen.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> ist eine Methode, die Sie auf der Klasse aufrufen, um ein neues Objekt zu erzeugen.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Klassenmethode kann keine Instanzattribute benutzen, weil kein bestimmtes Objekt hinter ihr steht.<\/span> <span class=\"sg\" data-s=\"1\">Sie arbeitet also nur mit Informationen, die alle Objekte der Klasse teilen.<\/span> <span class=\"sg\" data-s=\"2\">Wenn die Arbeit von den Daten eines Objekts abhängt, nehmen Sie eine gewöhnliche Methode.<\/span> <span class=\"sg\" data-s=\"3\">Rufen Sie sie auf einer Instanz auf.<\/span> <span class=\"sg\" data-s=\"4\">Wenn nicht, ist eine Klassenmethode die natürliche Wahl.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klassenmethoden brauchen keine Instanz.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie aber doch ein Objekt haben, können Sie seine Daten darin trotzdem benutzen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses Programm gibt das erwartete Ergebnis aus:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ohne ein Objekt der Klasse würde ein Aufruf wie <code>say Road.info<\/code> einen Fehler erzeugen.<\/span><\/p>"]]},"nl":{"t":"Klassemethoden","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">De meeste methoden worden aangeroepen op een object, dat een instantie van een klasse is.<\/span> <span class=\"sg\" data-s=\"1\">Maar je kunt een methode ook op de klasse zelf aanroepen.<\/span> <span class=\"sg\" data-s=\"2\">Met andere woorden: je roept haar aan op het typeobject.<\/span> <span class=\"sg\" data-s=\"3\">Zo'n methode heet vaak een <em>klassemethode<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ze is nuttig voor waarden en bewerkingen die bij de hele klasse horen.<\/span> <span class=\"sg\" data-s=\"5\">Ze horen niet bij één bepaald object.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je definieert een klassemethode op precies dezelfde manier als elke andere methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Maar je roept haar aan op de naam van de klasse in plaats van op een instantie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt eigenlijk al een klassemethode gebruikt, zonder haar zo te noemen.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> is een methode die je op de klasse aanroept om een nieuw object te maken.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Een klassemethode kan geen attributen van een instantie gebruiken, omdat er geen bepaald object achter zit.<\/span> <span class=\"sg\" data-s=\"1\">Dus werkt ze alleen met informatie die elk object van de klasse deelt.<\/span> <span class=\"sg\" data-s=\"2\">Als het werk afhangt van de gegevens van één object, gebruik dan een gewone methode.<\/span> <span class=\"sg\" data-s=\"3\">Roep die aan op een instantie.<\/span> <span class=\"sg\" data-s=\"4\">Als dat niet zo is, is een klassemethode de logische keuze.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klassemethoden hebben geen instantie nodig.<\/span> <span class=\"sg\" data-s=\"1\">Maar als je wel een object hebt, kun je zijn gegevens er toch in gebruiken:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit programma drukt het resultaat af dat je zou verwachten:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Zonder een object van de klasse zou een aanroep als <code>say Road.info<\/code> een fout geven.<\/span><\/p>"]]},"es":{"t":"Métodos de clase","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La mayoría de los métodos se llaman sobre un objeto, que es una instancia de una clase.<\/span> <span class=\"sg\" data-s=\"1\">Pero también puedes llamar a un método sobre la clase misma.<\/span> <span class=\"sg\" data-s=\"2\">Es decir, lo llamas sobre el objeto de tipo.<\/span> <span class=\"sg\" data-s=\"3\">A un método así se le suele llamar <em>método de clase<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Es útil para valores y operaciones que pertenecen a toda la clase.<\/span> <span class=\"sg\" data-s=\"5\">No pertenecen a un objeto concreto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Defines un método de clase exactamente igual que cualquier otro método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Pero lo llamas sobre el nombre de la clase, no sobre una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De hecho, ya has usado un método de clase sin darle ese nombre.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> es un método que llamas sobre la clase para crear un objeto nuevo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un método de clase no puede usar los atributos de instancia, porque no hay ningún objeto concreto detrás.<\/span> <span class=\"sg\" data-s=\"1\">Así que solo trabaja con información que comparten todos los objetos de la clase.<\/span> <span class=\"sg\" data-s=\"2\">Si el trabajo depende de los datos de un objeto, usa un método ordinario.<\/span> <span class=\"sg\" data-s=\"3\">Llámalo sobre una instancia.<\/span> <span class=\"sg\" data-s=\"4\">Si no depende de ellos, un método de clase es la elección natural.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los métodos de clase no necesitan una instancia.<\/span> <span class=\"sg\" data-s=\"1\">Aun así, cuando sí tienes un objeto, puedes usar sus datos en ellos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este programa imprime el resultado que esperarías:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sin un objeto de la clase, una llamada como <code>say Road.info<\/code> daría un error.<\/span><\/p>"]]},"it":{"t":"Metodi di classe","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La maggior parte dei metodi si chiama su un oggetto, che è un'istanza di una classe.<\/span> <span class=\"sg\" data-s=\"1\">Ma puoi anche chiamare un metodo sulla classe stessa.<\/span> <span class=\"sg\" data-s=\"2\">In altre parole, lo chiami sull'oggetto di tipo.<\/span> <span class=\"sg\" data-s=\"3\">Spesso un metodo così viene chiamato <em>metodo di classe<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">È utile per valori e operazioni che appartengono a tutta la classe.<\/span> <span class=\"sg\" data-s=\"5\">Non appartengono a un oggetto particolare.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Definisci un metodo di classe esattamente come qualsiasi altro metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ma lo chiami sul nome della classe invece che su un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In effetti, hai già usato un metodo di classe senza chiamarlo così.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> è un metodo che chiami sulla classe per creare un nuovo oggetto.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Un metodo di classe non può usare gli attributi di istanza, perché dietro di esso non c'è un oggetto particolare.<\/span> <span class=\"sg\" data-s=\"1\">Quindi lavora solo con informazioni che tutti gli oggetti della classe condividono.<\/span> <span class=\"sg\" data-s=\"2\">Se il lavoro dipende dai dati di un oggetto, usa un metodo ordinario.<\/span> <span class=\"sg\" data-s=\"3\">Chiamalo su un'istanza.<\/span> <span class=\"sg\" data-s=\"4\">Se non dipende, un metodo di classe è la scelta naturale.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I metodi di classe non hanno bisogno di un'istanza.<\/span> <span class=\"sg\" data-s=\"1\">Però, quando un oggetto ce l'hai, puoi usare i suoi dati in questi metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo programma stampa il risultato che ti aspetteresti:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Senza un oggetto della classe, una chiamata come <code>say Road.info<\/code> darebbe un errore.<\/span><\/p>"]]},"lv":{"t":"Klases metodes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Lielāko daļu metožu izsauc uz objekta, kas ir klases instance.<\/span> <span class=\"sg\" data-s=\"1\">Bet metodi jūs varat izsaukt arī uz pašas klases.<\/span> <span class=\"sg\" data-s=\"2\">Citiem vārdiem, jūs to izsaucat uz tipa objekta.<\/span> <span class=\"sg\" data-s=\"3\">Tādu metodi bieži sauc par <em>klases metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Tā noder vērtībām un darbībām, kas pieder visai klasei.<\/span> <span class=\"sg\" data-s=\"5\">Tās nepieder vienam konkrētam objektam.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Klases metodi jūs definējat tieši tāpat kā jebkuru citu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bet jūs to izsaucat uz klases nosaukuma, nevis uz instances:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Patiesībā jūs jau esat lietojuši klases metodi, to tā nenosaucot.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> ir metode, ko jūs izsaucat uz klases, lai radītu jaunu objektu.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Klases metode nevar izmantot instances atribūtus, jo aiz tās nav neviena konkrēta objekta.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc tā strādā tikai ar informāciju, kas ir kopīga visiem klases objektiem.<\/span> <span class=\"sg\" data-s=\"2\">Ja darbs ir atkarīgs no viena objekta datiem, izmantojiet parastu metodi.<\/span> <span class=\"sg\" data-s=\"3\">Izsauciet to uz instances.<\/span> <span class=\"sg\" data-s=\"4\">Ja nav, klases metode ir dabiska izvēle.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klases metodēm instance nav vajadzīga.<\/span> <span class=\"sg\" data-s=\"1\">Tomēr, ja jums ir objekts, jūs varat tajās izmantot tā datus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Šī programma izdrukā rezultātu, ko jūs gaidītu:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Bez klases objekta tāds izsaukums kā <code>say Road.info<\/code> izraisītu kļūdu.<\/span><\/p>"]]},"ru":{"t":"Методы класса","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Большинство методов вызывают у объекта, который является экземпляром класса.<\/span> <span class=\"sg\" data-s=\"1\">Но метод можно вызвать и у самого класса.<\/span> <span class=\"sg\" data-s=\"2\">Другими словами, его вызывают у объекта типа.<\/span> <span class=\"sg\" data-s=\"3\">Такой метод часто называют <em>методом класса<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Он полезен для значений и операций, которые принадлежат всему классу.<\/span> <span class=\"sg\" data-s=\"5\">Они не принадлежат какому-то одному объекту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод класса определяют точно так же, как любой другой метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но вызывают его у имени класса, а не у экземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На самом деле вы уже пользовались методом класса, хотя и не называли его так.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> — это метод, который вы вызываете у класса, чтобы создать новый объект.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Метод класса не может использовать атрибуты экземпляра, потому что за ним не стоит конкретный объект.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому он работает только с информацией, которая общая для всех объектов класса.<\/span> <span class=\"sg\" data-s=\"2\">Если работа зависит от данных одного объекта, используйте обычный метод.<\/span> <span class=\"sg\" data-s=\"3\">Вызывайте его у экземпляра.<\/span> <span class=\"sg\" data-s=\"4\">Если не зависит, метод класса — самый естественный выбор.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методам класса экземпляр не нужен.<\/span> <span class=\"sg\" data-s=\"1\">Но если объект у вас всё же есть, вы можете использовать в них его данные:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Эта программа печатает результат, которого вы и ожидаете:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без объекта класса вызов вроде <code>say Road.info<\/code> привёл бы к ошибке.<\/span><\/p>"]]},"uk":{"t":"Методи класу","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Більшість методів викликають для об'єкта, який є екземпляром класу.<\/span> <span class=\"sg\" data-s=\"1\">Але метод можна викликати й для самого класу.<\/span> <span class=\"sg\" data-s=\"2\">Іншими словами, ви викликаєте його для об'єкта типу.<\/span> <span class=\"sg\" data-s=\"3\">Такий метод часто називають <em>методом класу<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Він корисний для значень та операцій, які належать усьому класу.<\/span> <span class=\"sg\" data-s=\"5\">Вони не належать одному конкретному об'єкту.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метод класу визначають точно так само, як будь-який інший метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Але ви викликаєте його для імені класу, а не для екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Насправді ви вже користувалися методом класу, хоч і не називали його так.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> — це метод, який ви викликаєте для класу, щоб створити новий об'єкт.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Метод класу не може використовувати атрибути екземпляра, бо за ним немає конкретного об'єкта.<\/span> <span class=\"sg\" data-s=\"1\">Тож він працює лише з інформацією, спільною для всіх об'єктів класу.<\/span> <span class=\"sg\" data-s=\"2\">Якщо робота залежить від даних одного об'єкта, беріть звичайний метод.<\/span> <span class=\"sg\" data-s=\"3\">Викликайте його для екземпляра.<\/span> <span class=\"sg\" data-s=\"4\">Якщо ні, метод класу — природний вибір.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методам класу не потрібен екземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Проте коли об'єкт у вас таки є, ви можете використати його дані в них:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця програма виводить саме той результат, якого можна чекати:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без об'єкта класу виклик на зразок <code>say Road.info<\/code> дав би помилку.<\/span><\/p>"]]},"bg":{"t":"Методи на класа","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Повечето методи се извикват върху обект, който е екземпляр на клас.<\/span> <span class=\"sg\" data-s=\"1\">Но можете да извикате метод и върху самия клас.<\/span> <span class=\"sg\" data-s=\"2\">С други думи, извиквате го върху обекта на типа.<\/span> <span class=\"sg\" data-s=\"3\">Често наричат такъв метод <em>метод на класа<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Той е полезен за стойности и операции, които принадлежат на целия клас.<\/span> <span class=\"sg\" data-s=\"5\">Те не принадлежат на един конкретен обект.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Дефинирате метод на класа точно по същия начин като всеки друг метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Но го извиквате върху името на класа, а не върху екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всъщност вече сте използвали метод на класа, без да го наричате така.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> е метод, който извиквате върху класа, за да създадете нов обект.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Методът на класа не може да използва атрибутите на екземпляра, защото зад него няма конкретен обект.<\/span> <span class=\"sg\" data-s=\"1\">Затова той работи само с информация, която е обща за всички обекти от класа.<\/span> <span class=\"sg\" data-s=\"2\">Ако работата зависи от данните на един обект, използвайте обикновен метод.<\/span> <span class=\"sg\" data-s=\"3\">Извикайте го върху екземпляр.<\/span> <span class=\"sg\" data-s=\"4\">Ако не зависи, методът на класа е естественият избор.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методите на класа нямат нужда от екземпляр.<\/span> <span class=\"sg\" data-s=\"1\">Все пак, когато имате обект, можете да използвате данните му в тях:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Тази програма отпечатва резултата, който бихте очаквали:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Без обект от класа извикване като <code>say Road.info<\/code> би довело до грешка.<\/span><\/p>"]]},"eo":{"t":"Klasmetodoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">La plej multaj metodoj estas vokataj sur objekto, kiu estas ekzemplero de klaso.<\/span> <span class=\"sg\" data-s=\"1\">Sed vi ankaŭ povas voki metodon sur la klaso mem.<\/span> <span class=\"sg\" data-s=\"2\">Per aliaj vortoj, vi vokas ĝin sur la tipobjekto.<\/span> <span class=\"sg\" data-s=\"3\">Oni ofte nomas tian metodon <em>klasmetodo<\/em>.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi estas utila por valoroj kaj operacioj, kiuj apartenas al la tuta klaso.<\/span> <span class=\"sg\" data-s=\"5\">Ili ne apartenas al unu aparta objekto.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi difinas klasmetodon ekzakte same kiel ĉiun alian metodon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed vi vokas ĝin sur la nomo de la klaso anstataŭ sur ekzemplero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fakte, vi jam uzis klasmetodon, sen nomi ĝin tiel.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> estas metodo, kiun vi vokas sur la klaso por krei novan objekton.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Klasmetodo ne povas uzi la atributojn de ekzemplero, ĉar ne estas aparta objekto malantaŭ ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Do ĝi laboras nur kun informoj, kiujn ĉiuj objektoj de la klaso kunhavas.<\/span> <span class=\"sg\" data-s=\"2\">Se la laboro dependas de la datumoj de unu objekto, uzu ordinaran metodon.<\/span> <span class=\"sg\" data-s=\"3\">Voku ĝin sur ekzemplero.<\/span> <span class=\"sg\" data-s=\"4\">Se ne, klasmetodo estas la natura elekto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klasmetodoj ne bezonas ekzempleron.<\/span> <span class=\"sg\" data-s=\"1\">Tamen, kiam vi ja havas objekton, vi povas uzi ĝiajn datumojn en ili:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu programo presas la rezulton, kiun vi atendus:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sen objekto de la klaso, voko kiel <code>say Road.info<\/code> kaŭzus eraron.<\/span><\/p>"]]},"la":{"t":"Methodi classis","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Pleraeque methodi in obiecto vocantur, quod exemplar classis est.<\/span> <span class=\"sg\" data-s=\"1\">Sed methodum etiam in ipsa classe vocare potes.<\/span> <span class=\"sg\" data-s=\"2\">Aliis verbis, eam in obiecto generis vocas.<\/span> <span class=\"sg\" data-s=\"3\">Homines talem methodum saepe <em>methodum classis<\/em> appellant.<\/span> <span class=\"sg\" data-s=\"4\">Utilis est pro valoribus et operationibus quae ad totam classem pertinent.<\/span> <span class=\"sg\" data-s=\"5\">Ad nullum certum obiectum pertinent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Methodum classis eodem prorsus modo definis ac quamlibet aliam methodum:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    method speed-limit { 120 }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed eam in nomine classis loco exemplaris vocas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Road.speed-limit; # 120<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Re vera iam methodo classis usus es, quamquam eam sic non appellavisti.<\/span> <span class=\"sg\" data-s=\"1\"><code>new<\/code> est methodus quam in classe vocas ut novum obiectum crees.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Methodus classis attributis exemplaris uti non potest, quia nullum certum obiectum post eam est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque solum cum informatione operatur quam omnia obiecta classis communicant.<\/span> <span class=\"sg\" data-s=\"2\">Si opus a datis unius obiecti pendet, methodo ordinaria utere.<\/span> <span class=\"sg\" data-s=\"3\">Eam in exemplari voca.<\/span> <span class=\"sg\" data-s=\"4\">Si non pendet, methodus classis naturalis electio est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodi classis exemplar non requirunt.<\/span> <span class=\"sg\" data-s=\"1\">Tamen, cum obiectum habes, datis eius in eis uti potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Road {\n    has $.name;\n    method speed-limit { 120 }\n\n    method info {\n        \"The maximum speed on $.name is \" ~ self.speed-limit\n    }\n}\n\nmy $R404 = Road.new(name =&gt; 'Road 404');\nsay $R404.info;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hoc programma effectum imprimit quem exspectares:<\/span><\/p>"],["code",0,"<pre><code>The maximum speed on Road 404 is 120<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sine obiecto classis, vocatio qualis <code>say Road.info<\/code> errorem faceret.<\/span><\/p>"]]}}}</script>
