<script type="application/json" id="page-data">{"u":"oop/classes/type-object","n":770,"k":"topic","pv":"oop/classes","nx":"oop/classes/type-object/quiz","tr":["oop","oop/classes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Type objects and instances","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A class name, such as <code>Dog<\/code>, means the <em>type object<\/em> of the class.<\/span> <span class=\"sg\" data-s=\"1\">The type object stands for the type itself.<\/span> <span class=\"sg\" data-s=\"2\">It is not any particular object of that type.<\/span> <span class=\"sg\" data-s=\"3\">An <em>instance<\/em>, which you create with <code>new<\/code>, is a real object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku can see the difference between the two.<\/span> <span class=\"sg\" data-s=\"1\">The <code>defined<\/code> method returns <code>False<\/code> for a type object and <code>True<\/code> for an instance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A type object counts as <em>undefined<\/em>, because it holds no real data.<\/span> <span class=\"sg\" data-s=\"1\">It only describes a type.<\/span> <span class=\"sg\" data-s=\"2\">An instance is <em>defined<\/em>, because it is a real object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">With <code>WHAT<\/code>, both show the same type.<\/span> <span class=\"sg\" data-s=\"1\">You already met <code>WHAT<\/code> in the <a href=\"/advanced/containers/\">section about containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku shows a type in parentheses, as in <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So <code>Dog<\/code> and <code>Dog.new<\/code> have the same type, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But there is a difference.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> is the type itself, and <code>Dog.new<\/code> is an object of that type.<\/span><\/p>"]]},"de":{"t":"Typobjekte und Instanzen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ein Klassenname wie <code>Dog<\/code> bezeichnet das <em>Typobjekt<\/em> der Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Das Typobjekt steht für den Typ selbst.<\/span> <span class=\"sg\" data-s=\"2\">Es ist kein bestimmtes Objekt dieses Typs.<\/span> <span class=\"sg\" data-s=\"3\">Eine <em>Instanz<\/em>, die Sie mit <code>new<\/code> erzeugen, ist ein echtes Objekt.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku kann die beiden unterscheiden.<\/span> <span class=\"sg\" data-s=\"1\">Die Methode <code>defined<\/code> gibt für ein Typobjekt <code>False<\/code> und für eine Instanz <code>True<\/code> zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein Typobjekt gilt als <em>undefiniert<\/em>, weil es keine echten Daten enthält.<\/span> <span class=\"sg\" data-s=\"1\">Es beschreibt nur einen Typ.<\/span> <span class=\"sg\" data-s=\"2\">Eine Instanz ist <em>definiert<\/em>, weil sie ein echtes Objekt ist.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Mit <code>WHAT<\/code> zeigen beide den gleichen Typ.<\/span> <span class=\"sg\" data-s=\"1\">Sie kennen <code>WHAT<\/code> schon aus dem <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku zeigt einen Typ in Klammern, wie bei <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Also haben <code>Dog<\/code> und <code>Dog.new<\/code> den gleichen Typ, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aber es gibt einen Unterschied.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> ist der Typ selbst, und <code>Dog.new<\/code> ist ein Objekt dieses Typs.<\/span><\/p>"]]},"nl":{"t":"Typeobjecten en instanties","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Met een klassenaam, zoals <code>Dog<\/code>, bedoel je het <em>typeobject<\/em> van de klasse.<\/span> <span class=\"sg\" data-s=\"1\">Het typeobject staat voor het type zelf.<\/span> <span class=\"sg\" data-s=\"2\">Het is geen bepaald object van dat type.<\/span> <span class=\"sg\" data-s=\"3\">Een <em>instantie<\/em>, die je met <code>new<\/code> maakt, is een echt object.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku kan het verschil tussen de twee zien.<\/span> <span class=\"sg\" data-s=\"1\">De methode <code>defined<\/code> geeft <code>False<\/code> terug voor een typeobject en <code>True<\/code> voor een instantie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een typeobject geldt als <em>ongedefinieerd<\/em>, omdat het geen echte gegevens bevat.<\/span> <span class=\"sg\" data-s=\"1\">Het beschrijft alleen een type.<\/span> <span class=\"sg\" data-s=\"2\">Een instantie is <em>gedefinieerd<\/em>, omdat ze een echt object is.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Met <code>WHAT<\/code> tonen beide hetzelfde type.<\/span> <span class=\"sg\" data-s=\"1\">Je kwam <code>WHAT<\/code> al tegen in de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku toont een type tussen haakjes, zoals in <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus hebben <code>Dog<\/code> en <code>Dog.new<\/code> hetzelfde type, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar er is een verschil.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> is het type zelf, en <code>Dog.new<\/code> is een object van dat type.<\/span><\/p>"]]},"es":{"t":"Objetos de tipo e instancias","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">El nombre de una clase, como <code>Dog<\/code>, significa el <em>objeto de tipo<\/em> de la clase.<\/span> <span class=\"sg\" data-s=\"1\">El objeto de tipo representa al tipo mismo.<\/span> <span class=\"sg\" data-s=\"2\">No es ningún objeto concreto de ese tipo.<\/span> <span class=\"sg\" data-s=\"3\">Una <em>instancia<\/em>, que creas con <code>new<\/code>, es un objeto real.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku puede ver la diferencia entre los dos.<\/span> <span class=\"sg\" data-s=\"1\">El método <code>defined<\/code> devuelve <code>False<\/code> para un objeto de tipo y <code>True<\/code> para una instancia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un objeto de tipo cuenta como <em>no definido<\/em>, porque no tiene datos reales.<\/span> <span class=\"sg\" data-s=\"1\">Solo describe un tipo.<\/span> <span class=\"sg\" data-s=\"2\">Una instancia está <em>definida<\/em>, porque es un objeto real.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>WHAT<\/code>, los dos muestran el mismo tipo.<\/span> <span class=\"sg\" data-s=\"1\">Ya conociste <code>WHAT<\/code> en la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku muestra un tipo entre paréntesis, como en <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>Dog<\/code> y <code>Dog.new<\/code> tienen el mismo tipo, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero hay una diferencia.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> es el tipo mismo, y <code>Dog.new<\/code> es un objeto de ese tipo.<\/span><\/p>"]]},"it":{"t":"Oggetti di tipo e istanze","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Il nome di una classe, come <code>Dog<\/code>, indica l'<em>oggetto di tipo<\/em> della classe.<\/span> <span class=\"sg\" data-s=\"1\">L'oggetto di tipo rappresenta il tipo stesso.<\/span> <span class=\"sg\" data-s=\"2\">Non è un oggetto particolare di quel tipo.<\/span> <span class=\"sg\" data-s=\"3\">Un'<em>istanza<\/em>, che crei con <code>new<\/code>, è un oggetto vero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku sa vedere la differenza fra i due.<\/span> <span class=\"sg\" data-s=\"1\">Il metodo <code>defined<\/code> restituisce <code>False<\/code> per un oggetto di tipo e <code>True<\/code> per un'istanza:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un oggetto di tipo è considerato <em>non definito<\/em>, perché non contiene dati veri.<\/span> <span class=\"sg\" data-s=\"1\">Descrive solo un tipo.<\/span> <span class=\"sg\" data-s=\"2\">Un'istanza è <em>definita<\/em>, perché è un oggetto vero.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Con <code>WHAT<\/code>, entrambi mostrano lo stesso tipo.<\/span> <span class=\"sg\" data-s=\"1\">Hai già incontrato <code>WHAT<\/code> nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku mostra un tipo tra parentesi, come in <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>Dog<\/code> e <code>Dog.new<\/code> hanno lo stesso tipo, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma c'è una differenza.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> è il tipo stesso, e <code>Dog.new<\/code> è un oggetto di quel tipo.<\/span><\/p>"]]},"lv":{"t":"Tipa objekti un instances","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Klases nosaukums, piemēram, <code>Dog<\/code>, nozīmē klases <em>tipa objektu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tipa objekts apzīmē pašu tipu.<\/span> <span class=\"sg\" data-s=\"2\">Tas nav neviens konkrēts šī tipa objekts.<\/span> <span class=\"sg\" data-s=\"3\">Bet <em>instance<\/em>, ko jūs radāt ar <code>new<\/code>, ir īsts objekts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku spēj redzēt atšķirību starp abiem.<\/span> <span class=\"sg\" data-s=\"1\">Metode <code>defined<\/code> tipa objektam atgriež <code>False<\/code>, bet instancei <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tipa objekts skaitās <em>nedefinēts<\/em>, jo tas nesatur īstus datus.<\/span> <span class=\"sg\" data-s=\"1\">Tas tikai apraksta tipu.<\/span> <span class=\"sg\" data-s=\"2\">Instance ir <em>definēta<\/em>, jo tā ir īsts objekts.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ar <code>WHAT<\/code> abi rāda vienu un to pašu tipu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs jau iepazināties ar <code>WHAT<\/code> <a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sadaļā par konteineriem<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku rāda tipu iekavās, kā <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tātad <code>Dog<\/code> un <code>Dog.new<\/code> tips ir viens un tas pats, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet starp tiem ir atšķirība.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> ir pats tips, bet <code>Dog.new<\/code> ir šī tipa objekts.<\/span><\/p>"]]},"ru":{"t":"Объекты типа и экземпляры","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Имя класса, например <code>Dog<\/code>, означает <em>объект типа<\/em> этого класса.<\/span> <span class=\"sg\" data-s=\"1\">Объект типа обозначает сам тип.<\/span> <span class=\"sg\" data-s=\"2\">Это не какой-то конкретный объект этого типа.<\/span> <span class=\"sg\" data-s=\"3\">А <em>экземпляр<\/em>, который вы создаёте с помощью <code>new<\/code>, — это настоящий объект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku может отличить одно от другого.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> возвращает <code>False<\/code> для объекта типа и <code>True<\/code> для экземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Объект типа считается <em>неопределённым<\/em>, потому что в нём нет настоящих данных.<\/span> <span class=\"sg\" data-s=\"1\">Он только описывает тип.<\/span> <span class=\"sg\" data-s=\"2\">Экземпляр <em>определён<\/em>, потому что это настоящий объект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>WHAT<\/code> оба показывают один и тот же тип.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже встречали <code>WHAT<\/code> в <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku показывает тип в круглых скобках, как в <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значит, у <code>Dog<\/code> и <code>Dog.new<\/code> один и тот же тип — <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но между ними есть разница.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> — это сам тип, а <code>Dog.new<\/code> — объект этого типа.<\/span><\/p>"]]},"uk":{"t":"Об'єкти типу та екземпляри","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ім'я класу, наприклад <code>Dog<\/code>, означає <em>об'єкт типу<\/em> цього класу.<\/span> <span class=\"sg\" data-s=\"1\">Об'єкт типу представляє сам тип.<\/span> <span class=\"sg\" data-s=\"2\">Це не якийсь конкретний об'єкт цього типу.<\/span> <span class=\"sg\" data-s=\"3\">А <em>екземпляр<\/em>, який ви створюєте через <code>new<\/code>, — це справжній об'єкт.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku вміє бачити різницю між ними.<\/span> <span class=\"sg\" data-s=\"1\">Метод <code>defined<\/code> повертає <code>False<\/code> для об'єкта типу й <code>True<\/code> для екземпляра:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Об'єкт типу вважається <em>невизначеним<\/em>, бо не містить справжніх даних.<\/span> <span class=\"sg\" data-s=\"1\">Він лише описує тип.<\/span> <span class=\"sg\" data-s=\"2\">Екземпляр <em>визначений<\/em>, бо це справжній об'єкт.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">З <code>WHAT<\/code> обидва показують той самий тип.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже знайомилися з <code>WHAT<\/code> у <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku показує тип у дужках, як у <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож <code>Dog<\/code> і <code>Dog.new<\/code> мають той самий тип, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але між ними є різниця.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> — це сам тип, а <code>Dog.new<\/code> — об'єкт цього типу.<\/span><\/p>"]]},"bg":{"t":"Обекти на типа и екземпляри","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Име на клас, например <code>Dog<\/code>, означава <em>обекта на типа<\/em> на класа.<\/span> <span class=\"sg\" data-s=\"1\">Обектът на типа представя самия тип.<\/span> <span class=\"sg\" data-s=\"2\">Той не е някакъв конкретен обект от този тип.<\/span> <span class=\"sg\" data-s=\"3\">А <em>екземплярът<\/em>, който създавате с <code>new<\/code>, е истински обект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku може да види разликата между двете.<\/span> <span class=\"sg\" data-s=\"1\">Методът <code>defined<\/code> връща <code>False<\/code> за обект на типа и <code>True<\/code> за екземпляр:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Обектът на типа се смята за <em>недефиниран<\/em>, защото не съдържа истински данни.<\/span> <span class=\"sg\" data-s=\"1\">Той само описва тип.<\/span> <span class=\"sg\" data-s=\"2\">Екземплярът е <em>дефиниран<\/em>, защото е истински обект.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">С <code>WHAT<\/code> и двете показват един и същ тип.<\/span> <span class=\"sg\" data-s=\"1\">Вече се запознахте с <code>WHAT<\/code> в <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku показва типа в скоби, както в <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Значи <code>Dog<\/code> и <code>Dog.new<\/code> имат един и същ тип, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но има разлика.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> е самият тип, а <code>Dog.new<\/code> е обект от този тип.<\/span><\/p>"]]},"eo":{"t":"Tipobjektoj kaj ekzempleroj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomo de klaso, ekzemple <code>Dog<\/code>, signifas la <em>tipobjekton<\/em> de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">La tipobjekto reprezentas la tipon mem.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne estas iu aparta objekto de tiu tipo.<\/span> <span class=\"sg\" data-s=\"3\">La <em>ekzemplero<\/em>, kiun vi kreas per <code>new<\/code>, estas vera objekto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku povas vidi la diferencon inter la du.<\/span> <span class=\"sg\" data-s=\"1\">La metodo <code>defined<\/code> redonas <code>False<\/code> por tipobjekto kaj <code>True<\/code> por ekzemplero:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tipobjekto validas kiel <em>nedifinita<\/em>, ĉar ĝi tenas neniujn verajn datumojn.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi nur priskribas tipon.<\/span> <span class=\"sg\" data-s=\"2\">Ekzemplero estas <em>difinita<\/em>, ĉar ĝi estas vera objekto.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <code>WHAT<\/code>, ambaŭ montras la saman tipon.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam renkontis <code>WHAT<\/code> en la <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sekcio pri ujoj<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku montras tipon en krampoj, kiel en <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>Dog<\/code> kaj <code>Dog.new<\/code> havas la saman tipon, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed estas diferenco.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> estas la tipo mem, kaj <code>Dog.new<\/code> estas objekto de tiu tipo.<\/span><\/p>"]]},"la":{"t":"Obiecta generis et exempla","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nomen classis, sicut <code>Dog<\/code>, <em>obiectum generis<\/em> classis significat.<\/span> <span class=\"sg\" data-s=\"1\">Obiectum generis ipsum genus repraesentat.<\/span> <span class=\"sg\" data-s=\"2\">Non est ullum certum obiectum illius generis.<\/span> <span class=\"sg\" data-s=\"3\">Sed <em>exemplar<\/em>, quod per <code>new<\/code> creas, verum obiectum est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Raku differentiam inter haec duo videre potest.<\/span> <span class=\"sg\" data-s=\"1\">Methodus <code>defined<\/code> pro obiecto generis <code>False<\/code> reddit et pro exemplari <code>True<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.defined;     # False\nsay Dog.new.defined; # True<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Obiectum generis <em>indefinitum<\/em> habetur, quia nulla vera data continet.<\/span> <span class=\"sg\" data-s=\"1\">Solum genus describit.<\/span> <span class=\"sg\" data-s=\"2\">Exemplar <em>definitum<\/em> est, quia verum obiectum est.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Per <code>WHAT<\/code> utrumque idem genus ostendit.<\/span> <span class=\"sg\" data-s=\"1\"><code>WHAT<\/code> iam in <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de receptaculis<\/a> invenisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nsay Dog.WHAT;     # (Dog)\nsay Dog.new.WHAT; # (Dog)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Raku genus in parenthesibus ostendit, ut in <code>(Dog)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>Dog<\/code> et <code>Dog.new<\/code> idem genus habent, <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed differentia est.<\/span> <span class=\"sg\" data-s=\"3\"><code>Dog<\/code> est ipsum genus, et <code>Dog.new<\/code> est obiectum illius generis.<\/span><\/p>"]]}}}</script>
