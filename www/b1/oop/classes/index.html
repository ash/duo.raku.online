<script type="application/json" id="page-data">{"u":"oop/classes","n":769,"k":"section","pv":"oop","nx":"oop/classes/type-object","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Classes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">So far, all the data types you have used were built into Raku.<\/span> <span class=\"sg\" data-s=\"1\">These were numbers, strings, arrays and so on.<\/span> <span class=\"sg\" data-s=\"2\">With <em>object-oriented programming<\/em>, you can define your own types, which are called <em>classes<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">You can also create values of these types, which are called <em>objects<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To define a class, write the <code>class<\/code> keyword, then a name and a block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">This <code>Dog<\/code> class is still empty, but it is already a new type.<\/span> <span class=\"sg\" data-s=\"1\">An object of a class is also called an <em>instance<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">To create one, call the <code>new<\/code> method on the class name:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Now <code>$rex<\/code> contains a <code>Dog<\/code> object.<\/span> <span class=\"sg\" data-s=\"1\">Each time you call <code>new<\/code>, you get a new, separate object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> and <code>$fido<\/code> are two different dogs, even though the class is still empty.<\/span> <span class=\"sg\" data-s=\"1\">In the next sections, you will give a class its own data, called <em>attributes<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You will also give it its own behaviour, called <em>methods<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">The first topic looks more closely at how a class differs from its instances.<\/span><\/p>"]]},"de":{"t":"Klassen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Bisher waren alle Datentypen, die Sie benutzt haben, in Raku eingebaut.<\/span> <span class=\"sg\" data-s=\"1\">Das waren Zahlen, Zeichenketten, Arrays und so weiter.<\/span> <span class=\"sg\" data-s=\"2\">Mit <em>objektorientierter Programmierung<\/em> können Sie eigene Typen definieren, die <em>Klassen<\/em> heißen.<\/span> <span class=\"sg\" data-s=\"3\">Sie können auch Werte dieser Typen erzeugen, die <em>Objekte<\/em> heißen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine Klasse zu definieren, schreiben Sie das Schlüsselwort <code>class<\/code>, dann einen Namen und einen Block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Klasse <code>Dog<\/code> ist noch leer, aber sie ist schon ein neuer Typ.<\/span> <span class=\"sg\" data-s=\"1\">Ein Objekt einer Klasse nennt man auch eine <em>Instanz<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Um eine zu erzeugen, rufen Sie die Methode <code>new<\/code> auf dem Klassennamen auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt enthält <code>$rex<\/code> ein <code>Dog<\/code>-Objekt.<\/span> <span class=\"sg\" data-s=\"1\">Jedes Mal, wenn Sie <code>new<\/code> aufrufen, bekommen Sie ein neues, eigenes Objekt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> und <code>$fido<\/code> sind zwei verschiedene Hunde, obwohl die Klasse noch leer ist.<\/span> <span class=\"sg\" data-s=\"1\">In den nächsten Abschnitten geben Sie einer Klasse eigene Daten, die man <em>Attribute<\/em> nennt.<\/span> <span class=\"sg\" data-s=\"2\">Sie geben ihr auch ein eigenes Verhalten, das man <em>Methoden<\/em> nennt.<\/span> <span class=\"sg\" data-s=\"3\">Das erste Thema zeigt genauer, wie sich eine Klasse von ihren Instanzen unterscheidet.<\/span><\/p>"]]},"nl":{"t":"Klassen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Tot nu toe waren alle gegevenstypen die je gebruikt hebt in Raku ingebouwd.<\/span> <span class=\"sg\" data-s=\"1\">Dat waren getallen, strings, arrays enzovoort.<\/span> <span class=\"sg\" data-s=\"2\">Met <em>objectgeoriënteerd programmeren<\/em> kun je je eigen typen definiëren, die <em>klassen<\/em> heten.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt ook waarden van deze typen maken, die <em>objecten<\/em> heten.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een klasse te definiëren, schrijf je het sleutelwoord <code>class<\/code>, dan een naam en een blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Deze klasse <code>Dog<\/code> is nog leeg, maar het is al een nieuw type.<\/span> <span class=\"sg\" data-s=\"1\">Een object van een klasse heet ook een <em>instantie<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Om er een te maken, roep je de methode <code>new<\/code> aan op de naam van de klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nu bevat <code>$rex<\/code> een <code>Dog<\/code>-object.<\/span> <span class=\"sg\" data-s=\"1\">Elke keer dat je <code>new<\/code> aanroept, krijg je een nieuw, apart object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> en <code>$fido<\/code> zijn twee verschillende honden, ook al is de klasse nog leeg.<\/span> <span class=\"sg\" data-s=\"1\">In de volgende secties geef je een klasse haar eigen gegevens, de zogenaamde <em>attributen<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Je geeft haar ook haar eigen gedrag, de zogenaamde <em>methoden<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Het eerste onderwerp kijkt beter naar hoe een klasse verschilt van haar instanties.<\/span><\/p>"]]},"es":{"t":"Clases","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Hasta ahora, todos los tipos de datos que has usado venían incluidos en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Eran números, cadenas, arrays y otros.<\/span> <span class=\"sg\" data-s=\"2\">Con la <em>programación orientada a objetos<\/em>, puedes definir tus propios tipos, que se llaman <em>clases<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">También puedes crear valores de esos tipos, que se llaman <em>objetos<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para definir una clase, escribe la palabra clave <code>class<\/code> y después un nombre y un bloque:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Esta clase <code>Dog<\/code> todavía está vacía, pero ya es un tipo nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Un objeto de una clase también se llama <em>instancia<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Para crear una, llama al método <code>new<\/code> sobre el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora <code>$rex<\/code> contiene un objeto <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Cada vez que llamas a <code>new<\/code>, obtienes un objeto nuevo y separado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> y <code>$fido<\/code> son dos perros distintos, aunque la clase todavía está vacía.<\/span> <span class=\"sg\" data-s=\"1\">En las secciones siguientes, darás a una clase sus propios datos, los <em>atributos<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">También le darás su propio comportamiento, los <em>métodos<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">El primer tema mira más de cerca en qué se diferencia una clase de sus instancias.<\/span><\/p>"]]},"it":{"t":"Classi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Finora tutti i tipi di dati che hai usato erano già presenti in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Erano numeri, stringhe, array e così via.<\/span> <span class=\"sg\" data-s=\"2\">Con la <em>programmazione a oggetti<\/em> puoi definire tipi tuoi, che si chiamano <em>classi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Puoi anche creare valori di questi tipi, che si chiamano <em>oggetti<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per definire una classe, scrivi la parola chiave <code>class<\/code>, poi un nome e un blocco:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Questa classe <code>Dog<\/code> è ancora vuota, ma è già un tipo nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Un oggetto di una classe si chiama anche <em>istanza<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Per crearne una, chiama il metodo <code>new<\/code> sul nome della classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora <code>$rex<\/code> contiene un oggetto <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ogni volta che chiami <code>new<\/code>, ottieni un oggetto nuovo e separato:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> e <code>$fido<\/code> sono due cani diversi, anche se la classe è ancora vuota.<\/span> <span class=\"sg\" data-s=\"1\">Nelle prossime sezioni darai a una classe dati propri, chiamati <em>attributi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Le darai anche un comportamento proprio, fatto di <em>metodi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Il primo argomento guarda più da vicino come una classe è diversa dalle sue istanze.<\/span><\/p>"]]},"lv":{"t":"Klases","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Līdz šim visi datu tipi, ko jūs lietojāt, bija Raku iebūvēti.<\/span> <span class=\"sg\" data-s=\"1\">Tie bija skaitļi, virknes, masīvi un tā tālāk.<\/span> <span class=\"sg\" data-s=\"2\">Ar <em>objektorientēto programmēšanu<\/em> jūs varat definēt savus tipus, ko sauc par <em>klasēm<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Jūs varat arī radīt šo tipu vērtības, ko sauc par <em>objektiem<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai definētu klasi, rakstiet atslēgvārdu <code>class<\/code>, pēc tam nosaukumu un bloku:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Šī klase <code>Dog<\/code> vēl ir tukša, bet tā jau ir jauns tips.<\/span> <span class=\"sg\" data-s=\"1\">Klases objektu sauc arī par <em>instanci<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Lai to radītu, izsauciet uz klases nosaukuma metodi <code>new<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad <code>$rex<\/code> satur <code>Dog<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"1\">Katru reizi, kad jūs izsaucat <code>new<\/code>, jūs iegūstat jaunu, atsevišķu objektu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> un <code>$fido<\/code> ir divi dažādi suņi, lai gan klase vēl ir tukša.<\/span> <span class=\"sg\" data-s=\"1\">Nākamajās sadaļās jūs dosiet klasei savus datus, ko sauc par <em>atribūtiem<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Jūs dosiet tai arī savu uzvedību, ko sauc par <em>metodēm<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Pirmais temats tuvāk aplūko, kā klase atšķiras no savām instancēm.<\/span><\/p>"]]},"ru":{"t":"Классы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">До сих пор все типы данных, которыми вы пользовались, были встроены в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Это были числа, строки, массивы и так далее.<\/span> <span class=\"sg\" data-s=\"2\">В <em>объектно-ориентированном программировании<\/em> вы можете определять свои типы, которые называются <em>классами<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Вы также можете создавать значения этих типов, которые называются <em>объектами<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы определить класс, напишите ключевое слово <code>class<\/code>, а за ним имя и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Этот класс <code>Dog<\/code> пока пустой, но это уже новый тип.<\/span> <span class=\"sg\" data-s=\"1\">Объект класса также называют <em>экземпляром<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы создать экземпляр, вызовите метод <code>new<\/code> у имени класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь <code>$rex<\/code> содержит объект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Каждый раз, когда вы вызываете <code>new<\/code>, вы получаете новый, отдельный объект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> — две разные собаки, хотя класс ещё пустой.<\/span> <span class=\"sg\" data-s=\"1\">В следующих разделах вы дадите классу его собственные данные, которые называются <em>атрибутами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Вы также дадите ему собственное поведение — <em>методы<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Первая тема подробнее рассматривает, чем класс отличается от своих экземпляров.<\/span><\/p>"]]},"uk":{"t":"Класи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досі всі типи даних, якими ви користувалися, були вбудовані в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Це були числа, рядки, масиви тощо.<\/span> <span class=\"sg\" data-s=\"2\">З <em>об'єктно-орієнтованим програмуванням<\/em> ви можете визначати власні типи, які називають <em>класами<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ви також можете створювати значення цих типів, які називають <em>об'єктами<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб визначити клас, напишіть ключове слово <code>class<\/code>, а потім ім'я та блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Цей клас <code>Dog<\/code> ще порожній, але це вже новий тип.<\/span> <span class=\"sg\" data-s=\"1\">Об'єкт класу також називають <em>екземпляром<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Щоб створити екземпляр, викличте метод <code>new<\/code> для імені класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер <code>$rex<\/code> містить об'єкт <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Щоразу, коли ви викликаєте <code>new<\/code>, ви отримуєте новий, окремий об'єкт:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> і <code>$fido<\/code> — два різні пси, хоча клас ще порожній.<\/span> <span class=\"sg\" data-s=\"1\">У наступних розділах ви дасте класу власні дані, які називають <em>атрибутами<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви також дасте йому власну поведінку, яку називають <em>методами<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Перша тема уважніше розглядає, чим клас відрізняється від своїх екземплярів.<\/span><\/p>"]]},"bg":{"t":"Класове","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Досега всички типове данни, които използвахте, бяха вградени в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Това бяха числа, низове, масиви и така нататък.<\/span> <span class=\"sg\" data-s=\"2\">С <em>обектно-ориентираното програмиране<\/em> можете да дефинирате свои собствени типове, които се наричат <em>класове<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Можете и да създавате стойности от тези типове, които се наричат <em>обекти<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да дефинирате клас, напишете ключовата дума <code>class<\/code>, после име и блок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Този клас <code>Dog<\/code> все още е празен, но вече е нов тип.<\/span> <span class=\"sg\" data-s=\"1\">Обект от клас се нарича още <em>екземпляр<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">За да създадете екземпляр, извикайте метода <code>new<\/code> върху името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега <code>$rex<\/code> съдържа обект <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Всеки път, когато извикате <code>new<\/code>, получавате нов, отделен обект:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> и <code>$fido<\/code> са две различни кучета, макар че класът все още е празен.<\/span> <span class=\"sg\" data-s=\"1\">В следващите раздели ще дадете на класа собствени данни, наречени <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ще му дадете и собствено поведение, наречено <em>методи<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Първата тема разглежда по-отблизо как класът се различава от своите екземпляри.<\/span><\/p>"]]},"eo":{"t":"Klasoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĝis nun ĉiuj datumtipoj, kiujn vi uzis, estis enkonstruitaj en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Ili estis nombroj, ĉenoj, tabeloj kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"2\">Per <em>objekt-orientita programado<\/em> vi povas difini viajn proprajn tipojn, kiuj nomiĝas <em>klasoj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ povas krei valorojn de tiuj tipoj, kiuj nomiĝas <em>objektoj<\/em>.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por difini klason, skribu la ŝlosilvorton <code>class<\/code>, poste nomon kaj blokon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu klaso <code>Dog<\/code> estas ankoraŭ malplena, sed ĝi jam estas nova tipo.<\/span> <span class=\"sg\" data-s=\"1\">Objekto de klaso ankaŭ nomiĝas <em>ekzemplero<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Por krei ekzempleron, voku la metodon <code>new<\/code> sur la nomo de la klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun <code>$rex<\/code> enhavas objekton <code>Dog<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĉiufoje, kiam vi vokas <code>new<\/code>, vi ricevas novan, apartan objekton:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> kaj <code>$fido<\/code> estas du malsamaj hundoj, kvankam la klaso estas ankoraŭ malplena.<\/span> <span class=\"sg\" data-s=\"1\">En la sekvaj sekcioj, vi donos al klaso ĝiajn proprajn datumojn, kiuj nomiĝas <em>atributoj<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi ankaŭ donos al ĝi ĝian propran konduton, kiu nomiĝas <em>metodoj<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">La unua temo rigardas pli detale, kiel klaso diferencas de siaj ekzempleroj.<\/span><\/p>"]]},"la":{"t":"Classes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Adhuc omnia genera datorum quibus usus es in Raku inbuilta erant.<\/span> <span class=\"sg\" data-s=\"1\">Haec erant numeri, chordae, ordines et cetera.<\/span> <span class=\"sg\" data-s=\"2\">Per <em>programmationem ad obiecta directam<\/em> tua genera definire potes, quae <em>classes<\/em> appellantur.<\/span> <span class=\"sg\" data-s=\"3\">Etiam valores horum generum creare potes, quae <em>obiecta<\/em> appellantur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut classem definias, scribe verbum <code>class<\/code>, deinde nomen et clausulam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec classis <code>Dog<\/code> adhuc vacua est, sed iam novum genus est.<\/span> <span class=\"sg\" data-s=\"1\">Obiectum classis etiam <em>exemplar<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"2\">Ut exemplar crees, methodum <code>new<\/code> in nomine classis voca:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n}\n\nmy $rex = Dog.new;\nsay $rex; # Dog.new<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc <code>$rex<\/code> obiectum <code>Dog<\/code> continet.<\/span> <span class=\"sg\" data-s=\"1\">Quotiens <code>new<\/code> vocas, novum et separatum obiectum accipis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new;\nmy $fido = Dog.new;<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>$rex<\/code> et <code>$fido<\/code> sunt duo diversi canes, quamquam classis adhuc vacua est.<\/span> <span class=\"sg\" data-s=\"1\">In sectionibus sequentibus classi propria data dabis, quae <em>attributa<\/em> appellantur.<\/span> <span class=\"sg\" data-s=\"2\">Etiam ei propriam agendi rationem dabis, quam <em>methodos<\/em> appellamus.<\/span> <span class=\"sg\" data-s=\"3\">Primum argumentum propius inspicit quomodo classis ab exemplaribus suis differat.<\/span><\/p>"]]}}}</script>
