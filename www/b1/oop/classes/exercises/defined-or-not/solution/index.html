<script type="application/json" id="page-data">{"u":"oop/classes/exercises/defined-or-not/solution","n":774,"k":"solution","pv":"oop/classes/exercises/defined-or-not","nx":"oop/classes/exercises/name-the-type","tr":["oop","oop/classes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Defined or not‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop goes through a mix of values. Two are type objects, <code>Cat<\/code> and <code>Dog<\/code>, and two are instances, <code>Cat.new<\/code> and <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Both type objects are undefined, so <code>defined<\/code> returns <code>False<\/code> for them. Both instances are defined, so it returns <code>True<\/code>. So it matters whether a value is a type object or a real instance. The class of the value does not matter.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Definiert oder nicht","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Schleife läuft über eine Mischung von Werten. Zwei sind Typobjekte, <code>Cat<\/code> und <code>Dog<\/code>, und zwei sind Instanzen, <code>Cat.new<\/code> und <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide Typobjekte sind undefiniert, also gibt <code>defined<\/code> für sie <code>False<\/code> zurück. Beide Instanzen sind definiert, also gibt die Methode <code>True<\/code> zurück. Es kommt also darauf an, ob ein Wert ein Typobjekt oder eine echte Instanz ist. Die Klasse des Wertes spielt keine Rolle.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Gedefinieerd of niet","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lus gaat door een mix van waarden. Twee zijn typeobjecten, <code>Cat<\/code> en <code>Dog<\/code>, en twee zijn instanties, <code>Cat.new<\/code> en <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Beide typeobjecten zijn ongedefinieerd, dus geeft <code>defined<\/code> er <code>False<\/code> voor terug. Beide instanties zijn gedefinieerd, dus geeft die <code>True<\/code> terug. Het gaat er dus om of een waarde een typeobject is of een echte instantie. De klasse van de waarde maakt niet uit.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Definido o no","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bucle recorre una mezcla de valores. Dos son objetos de tipo, <code>Cat<\/code> y <code>Dog<\/code>, y dos son instancias, <code>Cat.new<\/code> y <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Los dos objetos de tipo no están definidos, así que <code>defined<\/code> devuelve <code>False<\/code> para ellos. Las dos instancias están definidas, así que devuelve <code>True<\/code>. Por tant span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Оба объекта типа не определены, поэтому <code>defined<\/code> возвращает для них <code>False<\/code>. Оба экземпляра определены, поэтому он возвращает <code>True<\/code>. Значит, важно, является ли значение объектом типа или настоящим экземпляром. Класс значения не важен.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Визначений чи ні","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл проходить по суміші значень. Два з них — об'єкти типу, <code>Cat<\/code> та <code>Dog<\/code>, а два — екземпляри, <code>Cat.new<\/code> та <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Обидва об'єкти типу невизначені, тож <code>defined<\/code> повертає для них <code>False<\/code>. Обидва екземпляри визначені, тож він повертає <code>True<\/code>. Отже, важливо, чи значення — об'єкт типу, чи справжній екземпляр. Клас значення не важливий.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Дефиниран или не","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикълът минава през смесица от стойности. Две са обекти на типа, <code>Cat<\/code> и <code>Dog<\/code>, а две са екземпляри, <code>Cat.new<\/code> и <code>Dog.new<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И двата обекта на типа са недефинирани, така че <code>defined<\/code> връща <code>False<\/code> за тях. И двата екземпляра са дефинирани, така че връща <code>True<\/code>. Значи е важно дали стойността е обект на типа, или истински екземпляр. Класът на стойността няма значение.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Difinita aŭ ne","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Cat {\n}\n\nclass Dog {\n}\n\nfor Cat, Dog, Cat.new, Dog.new -&gt; $thing {\n    say $thing.defined;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/classes/defined-or-not.raku\" target=\"_blank\" rel=\"noopener\">defined-or-not.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>False\nFalse\nTrue\nTrue<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list"
