к помилок, лишається тільки остаточне <code>15<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Изход и грешка","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7;\n\nmy $sum = 0;\nfor @data -&gt; $n {\n    $sum += $n;\n    $*ERR.say(\"running total: $sum\");\n}\n\n$*OUT.say($sum);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/standard-streams/output-and-error.raku\" target=\"_blank\" rel=\"noopener\">output-and-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">И двата потока се появяват на екрана.<\/span> <span class=\"sg\" data-s=\"1\">Първо идват междинните суми, а после крайният резултат:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако изхвърлите стандартната грешка, остава само истинският изход:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$*OUT<\/code> и <code>$*ERR<\/code> са манипулаторите за стандартния изход и стандартната грешка. Всеки от тях има свой собствен метод <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Всяка обиколка добавя следващото число и записва междинната сума в <code>$*ERR<\/code>. Само крайната сума отива в <code>$*OUT<\/code>. На екрана напредъкът и резултатът изглеждат еднакво. Но те минават през различни потоци. Затова, когато <code>2&gt;/dev/null<\/code> изпрати стандартната грешка настрани, остава само крайното <code>15<\/code>.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Eligo kaj eraroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7;\n\nmy $sum = 0;\nfor @data -&gt; $n {\n    $sum += $n;\n    $*ERR.say(\"running total: $sum\");\n}\n\n$*OUT.say($sum);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/standard-streams/output-and-error.raku\" target=\"_blank\" rel=\"noopener\">output-and-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ fluoj aperas sur la ekrano.<\/span> <span class=\"sg\" data-s=\"1\">Unue venas la kurantaj sumoj, kaj poste la fina rezulto:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se vi forĵetas norman erarfluon, restas nur la vera eligo:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$*OUT<\/code> kaj <code>$*ERR<\/code> estas la teniloj por norma eligo kaj norma erarfluo. Ĉiu el ili havas sian propran metodon <code>say<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ĉiu rondo aldonas la sekvan nombron kaj skribas la kurantan sumon al <code>$*ERR<\/code>. Nur la fina sumo iras al <code>$*OUT<\/code>. Sur la ekrano, la progreso kaj la rezulto aspektas similaj. Sed ili iras tra malsamaj fluoj. Do kiam <code>2&gt;/dev/null<\/code> forsendas norman erarfluon, restas nur la fina <code>15<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Exitus et errores","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>my @data = 3, 5, 7;\n\nmy $sum = 0;\nfor @data -&gt; $n {\n    $sum += $n;\n    $*ERR.say(\"running total: $sum\");\n}\n\n$*OUT.say($sum);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/standard-streams/output-and-error.raku\" target=\"_blank\" rel=\"noopener\">output-and-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Utrumque fluentum in screen apparet.<\/span> <span class=\"sg\" data-s=\"1\">Primum veniunt summae currentes, et deinde effectus finalis:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si errorem vulgarem abicis, solus verus exitus manet:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>$*OUT<\/code> et <code>$*ERR<\/code> sunt tractabula exitus vulgaris et erroris vulgaris. Utrumque propriam methodum <code>say<\/code> habet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Quisque gyrus numerum sequentem addit et summam currentem ad <code>$*ERR<\/code> scribit. Sola summa finalis ad <code>$*OUT<\/code> it. In screen progressus et effectus similes videntur. Sed per diversa fluenta eunt. Itaque cum <code>2&gt;/dev/null<\/code> errorem vulgarem alio mittit, solum finale <code>15<\/code> manet.<\/span><\/li><\/ol>"]]}}}</script>
