n.<\/span> <span class=\"sg\" data-s=\"2\">Post la buklo, sendu la finan rezulton al norma eligo.<\/span> <span class=\"sg\" data-s=\"3\">Uzu la flutenilojn rekte.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu apartigo estas grava.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas konservi la rezulton aŭ plusendi ĝin al alia programo.<\/span> <span class=\"sg\" data-s=\"2\">Dume la progresmesaĝoj ne ĝenas, ĉar ili restas sur norma erarfluo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi rulas la programon, ambaŭ fluoj aperas sur la ekrano.<\/span> <span class=\"sg\" data-s=\"1\">Unue venas la kurantaj sumoj, kaj poste la fina rezulto:<\/span><\/p>"],["code",0,"<pre><code>running total: 3\nrunning total: 8\nrunning total: 15\n15<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sed se vi forĵetas norman erarfluon, restas nur la vera rezulto:<\/span><\/p>"],["code",0,"<pre><code>$ raku output-and-error.raku 2&gt;/dev/null\n15<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/standard-streams/exercises/output-and-error/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Exitus et errores","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Programma seriem numerorum <code>3, 5, 7<\/code> in anulo addit.<\/span> <span class=\"sg\" data-s=\"1\">In quoque gyro summam currentem ad errorem vulgarem mitte, ut nuntium progressus.<\/span> <span class=\"sg\" data-s=\"2\">Post anulum effectum finalem ad exitum vulgarem mitte.<\/span> <span class=\"sg\" data-s=\"3\">Tractabulis fluentorum directe utere.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Haec separatio magni momenti est.<\/span> <span class=\"sg\" data-s=\"1\">Effectum servare aut ad aliud programma tradere potes.<\/span> <span cl
