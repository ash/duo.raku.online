<script type="application/json" id="page-data">{"u":"oop/standard-streams","n":860,"k":"section","pv":"oop/mop/exercises/add-a-method/solution","nx":"oop/standard-streams/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Standard streams","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Every program has three <em>standard streams<\/em> that connect it to its environment.<\/span> <span class=\"sg\" data-s=\"1\">They are standard output, standard error and standard input.<\/span> <span class=\"sg\" data-s=\"2\">Raku makes them available through three special variables: <code>$*OUT<\/code>, <code>$*ERR<\/code> and <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In fact, you have been writing to standard output from the very beginning.<\/span> <span class=\"sg\" data-s=\"1\">Both <code>say<\/code> and <code>print<\/code> send their text to <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Error messages and other messages about problems go to a separate stream, standard error.<\/span> <span class=\"sg\" data-s=\"1\">This way, they do not get mixed with the real output of the program.<\/span> <span class=\"sg\" data-s=\"2\">The <code>note<\/code> routine writes there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Keeping them apart is useful because you can redirect each stream separately.<\/span> <span class=\"sg\" data-s=\"1\">For example, you can save the output of a program to a file.<\/span> <span class=\"sg\" data-s=\"2\">Its error messages still appear on the screen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You can also write to the streams directly.<\/span> <span class=\"sg\" data-s=\"1\">Both <code>$*OUT<\/code> and <code>$*ERR<\/code> are <em>handles<\/em> with their own <code>say<\/code> and <code>print<\/code> methods:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The third stream, <code>$*IN<\/code>, is standard input.<\/span> <span class=\"sg\" data-s=\"1\">You have already used it, but not directly: <code>prompt<\/code> reads a line from it.<\/span> <span class=\"sg\" data-s=\"2\">We will return to reading input in the topic about <a href=\"/oop/file-handles/\">file handles<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">This is because <code>$*IN<\/code> is a handle, just like an open file.<\/span><\/p>"]]},"de":{"t":"Standardströme","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes Programm hat drei <em>Standardströme<\/em>, die es mit seiner Umgebung verbinden.<\/span> <span class=\"sg\" data-s=\"1\">Das sind die Standardausgabe, die Standardfehlerausgabe und die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"2\">Raku stellt sie über drei besondere Variablen bereit: <code>$*OUT<\/code>, <code>$*ERR<\/code> und <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tatsächlich schreiben Sie schon von Anfang an auf die Standardausgabe.<\/span> <span class=\"sg\" data-s=\"1\">Sowohl <code>say<\/code> als auch <code>print<\/code> schicken ihren Text an <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fehlermeldungen und andere Meldungen über Probleme gehen an einen eigenen Strom, die Standardfehlerausgabe.<\/span> <span class=\"sg\" data-s=\"1\">So mischen sie sich nicht mit der eigentlichen Ausgabe des Programms.<\/span> <span class=\"sg\" data-s=\"2\">Die Routine <code>note<\/code> schreibt dorthin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Diese Trennung ist nützlich, weil Sie jeden Strom getrennt umleiten können.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel können Sie die Ausgabe eines Programms in einer Datei speichern.<\/span> <span class=\"sg\" data-s=\"2\">Seine Fehlermeldungen erscheinen trotzdem auf dem Bildschirm.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie können auch direkt in die Ströme schreiben.<\/span> <span class=\"sg\" data-s=\"1\">Sowohl <code>$*OUT<\/code> als auch <code>$*ERR<\/code> sind <em>Handles<\/em> mit eigenen Methoden <code>say<\/code> und <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Der dritte Strom, <code>$*IN<\/code>, ist die Standardeingabe.<\/span> <span class=\"sg\" data-s=\"1\">Sie haben ihn schon benutzt, aber nicht direkt: <code>prompt<\/code> liest eine Zeile daraus.<\/span> <span class=\"sg\" data-s=\"2\">Auf das Lesen von Eingaben kommen wir im Thema über <a href=\"https://course.raku.org/de/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">Dateihandles<\/a> zurück.<\/span> <span class=\"sg\" data-s=\"3\">Das liegt daran, dass <code>$*IN<\/code> ein Handle ist, genau wie eine geöffnete Datei.<\/span><\/p>"]]},"nl":{"t":"Standaardstromen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk programma heeft drie <em>standaardstromen<\/em> die het met zijn omgeving verbinden.<\/span> <span class=\"sg\" data-s=\"1\">Het zijn standaarduitvoer, standaardfout en standaardinvoer.<\/span> <span class=\"sg\" data-s=\"2\">Raku maakt ze beschikbaar via drie bijzondere variabelen: <code>$*OUT<\/code>, <code>$*ERR<\/code> en <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eigenlijk schrijf je al vanaf het allereerste begin naar de standaarduitvoer.<\/span> <span class=\"sg\" data-s=\"1\">Zowel <code>say<\/code> als <code>print<\/code> sturen hun tekst naar <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Foutmeldingen en andere meldingen over problemen gaan naar een aparte stroom, de standaardfout.<\/span> <span class=\"sg\" data-s=\"1\">Zo raken ze niet vermengd met de echte uitvoer van het programma.<\/span> <span class=\"sg\" data-s=\"2\">De routine <code>note<\/code> schrijft daarheen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ze apart houden is handig, omdat je elke stroom los kunt omleiden.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt bijvoorbeeld de uitvoer van een programma in een bestand opslaan.<\/span> <span class=\"sg\" data-s=\"2\">De foutmeldingen verschijnen dan nog steeds op het scherm.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je kunt ook rechtstreeks naar de stromen schrijven.<\/span> <span class=\"sg\" data-s=\"1\"><code>$*OUT<\/code> en <code>$*ERR<\/code> zijn allebei <em>handles<\/em> met hun eigen methoden <code>say<\/code> en <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De derde stroom, <code>$*IN<\/code>, is de standaardinvoer.<\/span> <span class=\"sg\" data-s=\"1\">Je hebt hem al gebruikt, maar niet direct: <code>prompt<\/code> leest er een regel uit.<\/span> <span class=\"sg\" data-s=\"2\">In het onderwerp over <a href=\"https://course.raku.org/nl/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">bestandshandles<\/a> komen we terug op het lezen van invoer.<\/span> <span class=\"sg\" data-s=\"3\">Dat komt doordat <code>$*IN<\/code> een handle is, net als een open bestand.<\/span><\/p>"]]},"es":{"t":"Flujos estándar","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Todo programa tiene tres <em>flujos estándar<\/em> que lo conectan con su entorno.<\/span> <span class=\"sg\" data-s=\"1\">Son la salida estándar, el error estándar y la entrada estándar.<\/span> <span class=\"sg\" data-s=\"2\">Raku te los da con tres variables especiales: <code>$*OUT<\/code>, <code>$*ERR<\/code> y <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De hecho, llevas escribiendo en la salida estándar desde el principio.<\/span> <span class=\"sg\" data-s=\"1\">Tanto <code>say<\/code> como <code>print<\/code> mandan su texto a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Los mensajes de error y otros mensajes sobre problemas van a un flujo aparte, el error estándar.<\/span> <span class=\"sg\" data-s=\"1\">Así no se mezclan con la salida real del programa.<\/span> <span class=\"sg\" data-s=\"2\">La rutina <code>note<\/code> escribe ahí:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Mantenerlos aparte es útil porque puedes redirigir cada flujo por separado.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, puedes guardar la salida de un programa en un archivo.<\/span> <span class=\"sg\" data-s=\"2\">Sus mensajes de error siguen apareciendo en la pantalla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">También puedes escribir directamente en los flujos.<\/span> <span class=\"sg\" data-s=\"1\">Tanto <code>$*OUT<\/code> como <code>$*ERR<\/code> son <em>manejadores<\/em> con sus propios métodos <code>say<\/code> y <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">El tercer flujo, <code>$*IN<\/code>, es la entrada estándar.<\/span> <span class=\"sg\" data-s=\"1\">Ya la has usado, pero no directamente: <code>prompt<\/code> lee una línea de ella.<\/span> <span class=\"sg\" data-s=\"2\">Volveremos a la lectura de la entrada en el tema sobre los <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejadores de archivo<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Esto pasa porque <code>$*IN<\/code> es un manejador, igual que un archivo abierto.<\/span><\/p>"]]},"it":{"t":"Flussi standard","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni programma ha tre <em>flussi standard<\/em> che lo collegano al suo ambiente.<\/span> <span class=\"sg\" data-s=\"1\">Sono l'output standard, l'errore standard e l'input standard.<\/span> <span class=\"sg\" data-s=\"2\">Raku li rende disponibili con tre variabili speciali: <code>$*OUT<\/code>, <code>$*ERR<\/code> e <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In realtà hai scritto sull'output standard fin dall'inizio.<\/span> <span class=\"sg\" data-s=\"1\">Sia <code>say<\/code> sia <code>print<\/code> mandano il loro testo a <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">I messaggi di errore e gli altri messaggi sui problemi vanno in un flusso separato, l'errore standard.<\/span> <span class=\"sg\" data-s=\"1\">In questo modo non si mescolano con il vero output del programma.<\/span> <span class=\"sg\" data-s=\"2\">La routine <code>note<\/code> scrive lì:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tenerli separati è utile perché puoi redirigere ogni flusso per conto suo.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, puoi salvare l'output di un programma in un file.<\/span> <span class=\"sg\" data-s=\"2\">I suoi messaggi di errore compaiono comunque sullo schermo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Puoi anche scrivere direttamente sui flussi.<\/span> <span class=\"sg\" data-s=\"1\">Sia <code>$*OUT<\/code> sia <code>$*ERR<\/code> sono <em>handle<\/em> con i loro metodi <code>say<\/code> e <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Il terzo flusso, <code>$*IN<\/code>, è l'input standard.<\/span> <span class=\"sg\" data-s=\"1\">L'hai già usato, ma non direttamente: <code>prompt<\/code> ne legge una riga.<\/span> <span class=\"sg\" data-s=\"2\">Torneremo alla lettura dell'input nell'argomento sugli <a href=\"https://course.raku.org/it/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">handle di file<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Questo perché <code>$*IN<\/code> è un handle, proprio come un file aperto.<\/span><\/p>"]]},"lv":{"t":"Standarta plūsmas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Katrai programmai ir trīs <em>standarta plūsmas<\/em>, kas to savieno ar vidi.<\/span> <span class=\"sg\" data-s=\"1\">Tās ir standarta izvade, standarta kļūdas un standarta ievade.<\/span> <span class=\"sg\" data-s=\"2\">Raku tās dara pieejamas caur trim speciāliem mainīgajiem: <code>$*OUT<\/code>, <code>$*ERR<\/code> un <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Patiesībā jūs rakstāt standarta izvadē jau no paša sākuma.<\/span> <span class=\"sg\" data-s=\"1\">Gan <code>say<\/code>, gan <code>print<\/code> sūta savu tekstu uz <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # goes to standard output<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kļūdu paziņojumi un citi paziņojumi par problēmām iet uz atsevišķu plūsmu — standarta kļūdu plūsmu.<\/span> <span class=\"sg\" data-s=\"1\">Tādā veidā tie nesajaucas ar programmas īsto izvadi.<\/span> <span class=\"sg\" data-s=\"2\">Rutīna <code>note<\/code> raksta tur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # goes to standard error<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Plūsmas ir šķirtas, un tas ir noderīgi, jo katru plūsmu var novirzīt atsevišķi.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, programmas izvadi var saglabāt failā.<\/span> <span class=\"sg\" data-s=\"2\">Tās kļūdu paziņojumi joprojām parādās ekrānā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Plūsmās var arī rakstīt tieši.<\/span> <span class=\"sg\" data-s=\"1\">Gan <code>$*OUT<\/code>, gan <code>$*ERR<\/code> ir <em>turi<\/em> ar savām metodēm <code>say<\/code> un <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Trešā plūsma, <code>$*IN<\/code>, ir standarta ievade.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to jau esat lietojuši, bet ne tieši: <code>prompt<\/code> nolasa no tās rindu.<\/span> <span class=\"sg\" data-s=\"2\">Mēs atgriezīsimies pie ievades lasīšanas tematā par <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">failu turiem<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir tāpēc, ka <code>$*IN<\/code> ir turis, gluži tāpat kā atvērts fails.<\/span><\/p>"]]},"ru":{"t":"Стандартные потоки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У каждой программы есть три <em>стандартных потока<\/em>, которые связывают её с окружением.<\/span> <span class=\"sg\" data-s=\"1\">Это стандартный вывод, стандартный поток ошибок и стандартный ввод.<\/span> <span class=\"sg\" data-s=\"2\">Raku даёт доступ к ним через три специальные переменные: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">На самом деле вы пишете в стандартный вывод с самого начала.<\/span> <span class=\"sg\" data-s=\"1\">И <code>say<\/code>, и <code>print<\/code> отправляют свой текст в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # уходит в стандартный вывод<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Сообщения об ошибках и другие сообщения о проблемах идут в отдельный поток — стандартный поток ошибок.<\/span> <span class=\"sg\" data-s=\"1\">Так они не смешиваются с настоящим выводом программы.<\/span> <span class=\"sg\" data-s=\"2\">Процедура <code>note<\/code> пишет именно туда:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # уходит в стандартный поток ошибок<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Держать их отдельно полезно, потому что каждый поток можно перенаправить по отдельности.<\/span> <span class=\"sg\" data-s=\"1\">Например, можно сохранить вывод программы в файл.<\/span> <span class=\"sg\" data-s=\"2\">Её сообщения об ошибках всё равно появятся на экране.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">В потоки можно писать и напрямую.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$*OUT<\/code>, и <code>$*ERR<\/code> — это <em>дескрипторы<\/em> со своими методами <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Третий поток, <code>$*IN<\/code>, — это стандартный ввод.<\/span> <span class=\"sg\" data-s=\"1\">Вы уже пользовались им, но не напрямую: <code>prompt<\/code> читает из него строку.<\/span> <span class=\"sg\" data-s=\"2\">Мы вернёмся к чтению ввода в теме о <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловых дескрипторах<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Это потому, что <code>$*IN<\/code> — такой же дескриптор, как и открытый файл.<\/span><\/p>"]]},"uk":{"t":"Стандартні потоки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожна програма має три <em>стандартні потоки<\/em>, які з'єднують її з оточенням.<\/span> <span class=\"sg\" data-s=\"1\">Це стандартний вивід, стандартний потік помилок і стандартне введення.<\/span> <span class=\"sg\" data-s=\"2\">Raku дає доступ до них через три спеціальні змінні: <code>$*OUT<\/code>, <code>$*ERR<\/code> і <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Насправді ви пишете у стандартний вивід від самого початку.<\/span> <span class=\"sg\" data-s=\"1\">І <code>say<\/code>, і <code>print<\/code> надсилають свій текст до <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # іде в стандартний вивід<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Повідомлення про помилки та інші проблеми йдуть в окремий потік — стандартний потік помилок.<\/span> <span class=\"sg\" data-s=\"1\">Так вони не змішуються зі справжнім виводом програми.<\/span> <span class=\"sg\" data-s=\"2\">Туди пише підпрограма <code>note<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # іде в стандартний потік помилок<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Тримати їх окремо корисно, бо кожен потік можна перенаправити окремо.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, ви можете зберегти вивід програми у файл.<\/span> <span class=\"sg\" data-s=\"2\">Її повідомлення про помилки все одно з'являються на екрані.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">У потоки можна також писати напряму.<\/span> <span class=\"sg\" data-s=\"1\">І <code>$*OUT<\/code>, і <code>$*ERR<\/code> — це <em>дескриптори<\/em> з власними методами <code>say<\/code> і <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Третій потік, <code>$*IN<\/code>, — це стандартне введення.<\/span> <span class=\"sg\" data-s=\"1\">Ви вже користувалися ним, але не напряму: <code>prompt<\/code> читає з нього рядок.<\/span> <span class=\"sg\" data-s=\"2\">Ми повернемося до читання введення в темі про <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптори файлів<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Це тому, що <code>$*IN<\/code> — дескриптор, так само як відкритий файл.<\/span><\/p>"]]},"bg":{"t":"Стандартни потоци","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Всяка програма има три <em>стандартни потока<\/em>, които я свързват със средата, в която работи.<\/span> <span class=\"sg\" data-s=\"1\">Те са стандартен изход, стандартна грешка и стандартен вход.<\/span> <span class=\"sg\" data-s=\"2\">Raku ви дава достъп до тях чрез три специални променливи: <code>$*OUT<\/code>, <code>$*ERR<\/code> и <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всъщност вие пишете в стандартния изход от самото начало.<\/span> <span class=\"sg\" data-s=\"1\">И <code>say<\/code>, и <code>print<\/code> изпращат текста си в <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # отива в стандартния изход<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Съобщенията за грешки и другите съобщения за проблеми отиват в отделен поток, стандартната грешка.<\/span> <span class=\"sg\" data-s=\"1\">Така те не се смесват с истинския изход на програмата.<\/span> <span class=\"sg\" data-s=\"2\">Процедурата <code>note<\/code> пише там:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # отива в стандартната грешка<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Разделянето им е полезно, защото можете да пренасочите всеки поток отделно.<\/span> <span class=\"sg\" data-s=\"1\">Например можете да запишете изхода на програмата във файл.<\/span> <span class=\"sg\" data-s=\"2\">Съобщенията ѝ за грешки пак се появяват на екрана.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Можете и да пишете направо в потоците.<\/span> <span class=\"sg\" data-s=\"1\">И <code>$*OUT<\/code>, и <code>$*ERR<\/code> са <em>манипулатори<\/em> със свои методи <code>say<\/code> и <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Третият поток, <code>$*IN<\/code>, е стандартният вход.<\/span> <span class=\"sg\" data-s=\"1\">Вече сте го използвали, но не направо: <code>prompt<\/code> чете ред от него.<\/span> <span class=\"sg\" data-s=\"2\">Ще се върнем към четенето на вход в темата за <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулаторите на файлове<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Това е така, защото <code>$*IN<\/code> е манипулатор, точно като отворен файл.<\/span><\/p>"]]},"eo":{"t":"Normaj fluoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu programo havas tri <em>normajn fluojn<\/em>, kiuj konektas ĝin al ĝia medio.<\/span> <span class=\"sg\" data-s=\"1\">Ili estas norma eligo, norma erarfluo kaj norma enigo.<\/span> <span class=\"sg\" data-s=\"2\">Raku donas aliron al ili per tri specialaj variabloj: <code>$*OUT<\/code>, <code>$*ERR<\/code> kaj <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Fakte, vi skribas al norma eligo jam de la komenco.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>say<\/code> kaj <code>print<\/code> sendas sian tekston al <code>$*OUT<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # iras al norma eligo<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Erarmesaĝoj kaj aliaj mesaĝoj pri problemoj iras al aparta fluo, norma erarfluo.<\/span> <span class=\"sg\" data-s=\"1\">Tiel ili ne miksiĝas kun la vera eligo de la programo.<\/span> <span class=\"sg\" data-s=\"2\">La rutino <code>note<\/code> skribas tien:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # iras al norma erarfluo<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Estas utile teni ilin apartaj, ĉar vi povas redirekti ĉiun fluon aparte.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, vi povas konservi la eligon de programo en dosiero.<\/span> <span class=\"sg\" data-s=\"2\">Ĝiaj erarmesaĝoj tamen ankoraŭ aperas sur la ekrano.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi ankaŭ povas skribi al la fluoj rekte.<\/span> <span class=\"sg\" data-s=\"1\">Kaj <code>$*OUT<\/code> kaj <code>$*ERR<\/code> estas <em>teniloj<\/em> kun siaj propraj metodoj <code>say<\/code> kaj <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La tria fluo, <code>$*IN<\/code>, estas norma enigo.<\/span> <span class=\"sg\" data-s=\"1\">Vi jam uzis ĝin, sed ne rekte: <code>prompt<\/code> legas linion el ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Ni revenos al legado de enigo en la temo pri <a href=\"https://course.raku.org/eo/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">dosierteniloj<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas, ĉar <code>$*IN<\/code> estas tenilo, same kiel malfermita dosiero.<\/span><\/p>"]]},"la":{"t":"Fluxus normales","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Omne programma tria <em>fluenta vulgaria<\/em> habet quae id cum ambitu suo coniungunt.<\/span> <span class=\"sg\" data-s=\"1\">Sunt exitus vulgaris, error vulgaris et introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"2\">Raku ea per tres variabiles speciales praebet: <code>$*OUT<\/code>, <code>$*ERR<\/code> et <code>$*IN<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Re vera iam ab ipso initio in exitum vulgarem scripsisti.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>say<\/code> et <code>print<\/code> textum suum ad <code>$*OUT<\/code> mittunt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 'Hello'; # ad exitum vulgarem it<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Nuntii errorum et alii nuntii de difficultatibus ad fluentum separatum eunt, errorem vulgarem.<\/span> <span class=\"sg\" data-s=\"1\">Sic cum vero exitu programmatis non miscentur.<\/span> <span class=\"sg\" data-s=\"2\">Procedura <code>note<\/code> illuc scribit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>note 'Something looks wrong'; # ad errorem vulgarem it<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ea separata servare utile est, quia utrumque fluentum separatim redirigere potes.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, exitum programmatis in archivo servare potes.<\/span> <span class=\"sg\" data-s=\"2\">Nuntii errorum eius tamen adhuc in screen apparent.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">In fluenta etiam directe scribere potes.<\/span> <span class=\"sg\" data-s=\"1\">Et <code>$*OUT<\/code> et <code>$*ERR<\/code> sunt <em>tractabula<\/em> cum propriis methodis <code>say<\/code> et <code>print<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>$*OUT.say('a normal line');\n$*ERR.say('a diagnostic line');<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tertium fluentum, <code>$*IN<\/code>, est introitus vulgaris.<\/span> <span class=\"sg\" data-s=\"1\">Iam id adhibuisti, sed non directe: <code>prompt<\/code> lineam ex eo legit.<\/span> <span class=\"sg\" data-s=\"2\">Ad introitum legendum redibimus in argumento de <a href=\"https://course.raku.org/la/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">tractabulis archivorum<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Nam <code>$*IN<\/code> tractabulum est, sicut archivum apertum.<\/span><\/p>"]]}}}</script>
