<script type="application/json" id="page-data">{"u":"oop/object-introspection/inheritance-chain","n":840,"k":"topic","pv":"oop/object-introspection","nx":"oop/object-introspection/inheritance-chain/quiz","tr":["oop","oop/object-introspection"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The inheritance chain","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">If a class inherits from another, you can ask for its whole chain of types.<\/span> <span class=\"sg\" data-s=\"1\">The <code>.^mro<\/code> meta-method returns this chain.<\/span> <span class=\"sg\" data-s=\"2\">The name stands for <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">This is the order in which Raku looks for a method.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Read the list from the left.<\/span> <span class=\"sg\" data-s=\"1\">A <code>Dog<\/code> is first itself, then an <code>Animal<\/code> (its parent), and then <code>Any<\/code> and <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">These two types are at the very top, and every Raku object inherits from them.<\/span> <span class=\"sg\" data-s=\"3\">For a method call on a <code>Dog<\/code>, Raku searches this list from left to right.<\/span> <span class=\"sg\" data-s=\"4\">It uses the first matching method that it finds.<\/span> <span class=\"sg\" data-s=\"5\">That is exactly why a child’s method overrides the parent’s method.<\/span> <span class=\"sg\" data-s=\"6\">The child comes earlier in the chain.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">If a class has no parent that you name yourself, the chain is shorter.<\/span> <span class=\"sg\" data-s=\"1\">It has just the class itself, followed by <code>Any<\/code> and <code>Mu<\/code>.<\/span><\/p>"]]},"de":{"t":"Die Vererbungskette","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Klasse von einer anderen erbt, können Sie nach ihrer ganzen Kette von Typen fragen.<\/span> <span class=\"sg\" data-s=\"1\">Die Metamethode <code>.^mro<\/code> gibt diese Kette zurück.<\/span> <span class=\"sg\" data-s=\"2\">Der Name steht für <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Das ist die Reihenfolge, in der Raku nach einer Methode sucht.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lesen Sie die Liste von links.<\/span> <span class=\"sg\" data-s=\"1\">Ein <code>Dog<\/code> ist zuerst er selbst, dann ein <code>Animal<\/code> (seine Elternklasse) und dann <code>Any<\/code> und <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Diese zwei Typen stehen ganz oben, und jedes Raku-Objekt erbt von ihnen.<\/span> <span class=\"sg\" data-s=\"3\">Bei einem Methodenaufruf auf einem <code>Dog<\/code> durchsucht Raku diese Liste von links nach rechts.<\/span> <span class=\"sg\" data-s=\"4\">Raku nimmt die erste passende Methode, die es findet.<\/span> <span class=\"sg\" data-s=\"5\">Genau deshalb überschreibt die Methode eines Kindes die Methode der Elternklasse.<\/span> <span class=\"sg\" data-s=\"6\">Das Kind steht früher in der Kette.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Klasse keine Elternklasse hat, die Sie selbst angeben, ist die Kette kürzer.<\/span> <span class=\"sg\" data-s=\"1\">Sie enthält nur die Klasse selbst, gefolgt von <code>Any<\/code> und <code>Mu<\/code>.<\/span><\/p>"]]},"nl":{"t":"De overervingsketen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Als een klasse van een andere erft, kun je haar hele keten van typen opvragen.<\/span> <span class=\"sg\" data-s=\"1\">De metamethode <code>.^mro<\/code> geeft deze keten terug.<\/span> <span class=\"sg\" data-s=\"2\">De naam staat voor <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dat is de volgorde waarin Raku naar een methode zoekt.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lees de lijst vanaf links.<\/span> <span class=\"sg\" data-s=\"1\">Een <code>Dog<\/code> is eerst zichzelf, dan een <code>Animal<\/code> (zijn ouder), en dan <code>Any<\/code> en <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Deze twee typen staan helemaal bovenaan, en elk Raku-object erft ervan.<\/span> <span class=\"sg\" data-s=\"3\">Bij een methodeaanroep op een <code>Dog<\/code> doorzoekt Raku deze lijst van links naar rechts.<\/span> <span class=\"sg\" data-s=\"4\">Het gebruikt de eerste passende methode die het vindt.<\/span> <span class=\"sg\" data-s=\"5\">Precies daarom overschrijft de methode van een kind de methode van de ouder.<\/span> <span class=\"sg\" data-s=\"6\">Het kind komt eerder in de keten.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als een klasse geen ouder heeft die je zelf noemt, is de keten korter.<\/span> <span class=\"sg\" data-s=\"1\">Daarin staat alleen de klasse zelf, gevolgd door <code>Any<\/code> en <code>Mu<\/code>.<\/span><\/p>"]]},"es":{"t":"La cadena de herencia","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Si una clase hereda de otra, puedes pedir su cadena completa de tipos.<\/span> <span class=\"sg\" data-s=\"1\">El metamétodo <code>.^mro<\/code> devuelve esta cadena.<\/span> <span class=\"sg\" data-s=\"2\">El nombre viene de <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Es el orden en que Raku busca un método.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lee la lista desde la izquierda.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>Dog<\/code> es primero él mismo, después un <code>Animal<\/code> (su padre), y después <code>Any<\/code> y <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Estos dos tipos están arriba del todo, y todo objeto de Raku hereda de ellos.<\/span> <span class=\"sg\" data-s=\"3\">Para una llamada a un método sobre un <code>Dog<\/code>, Raku recorre esta lista de izquierda a derecha.<\/span> <span class=\"sg\" data-s=\"4\">Usa el primer método adecuado que encuentra.<\/span> <span class=\"sg\" data-s=\"5\">Esa es exactamente la razón por la que el método de una hija sobrescribe el método del padre.<\/span> <span class=\"sg\" data-s=\"6\">La hija aparece antes en la cadena.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si una clase no tiene ningún padre que nombres tú mismo, la cadena es más corta.<\/span> <span class=\"sg\" data-s=\"1\">Solo tiene la clase misma, seguida de <code>Any<\/code> y <code>Mu<\/code>.<\/span><\/p>"]]},"it":{"t":"La catena di ereditarietà","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Se una classe eredita da un'altra, puoi chiedere tutta la sua catena di tipi.<\/span> <span class=\"sg\" data-s=\"1\">Il metametodo <code>.^mro<\/code> restituisce questa catena.<\/span> <span class=\"sg\" data-s=\"2\">Il nome sta per <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">È l'ordine in cui Raku cerca un metodo.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Leggi l'elenco da sinistra.<\/span> <span class=\"sg\" data-s=\"1\">Un <code>Dog<\/code> è prima se stesso, poi un <code>Animal<\/code> (il suo genitore), e poi <code>Any<\/code> e <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Questi due tipi sono proprio in cima, e ogni oggetto Raku eredita da loro.<\/span> <span class=\"sg\" data-s=\"3\">Per una chiamata di metodo su un <code>Dog<\/code>, Raku percorre questo elenco da sinistra a destra.<\/span> <span class=\"sg\" data-s=\"4\">Usa il primo metodo adatto che trova.<\/span> <span class=\"sg\" data-s=\"5\">È proprio per questo che il metodo di una figlia sovrascrive il metodo della genitrice.<\/span> <span class=\"sg\" data-s=\"6\">La figlia viene prima nella catena.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se una classe non ha un genitore che indichi tu, la catena è più corta.<\/span> <span class=\"sg\" data-s=\"1\">Contiene solo la classe stessa, seguita da <code>Any<\/code> e <code>Mu<\/code>.<\/span><\/p>"]]},"lv":{"t":"Mantošanas ķēde","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ja klase manto no citas, jūs varat pajautāt visu tās tipu ķēdi.<\/span> <span class=\"sg\" data-s=\"1\">Metametode <code>.^mro<\/code> atgriež šo ķēdi.<\/span> <span class=\"sg\" data-s=\"2\">Nosaukums ir saīsinājums no <em>method resolution order<\/em> jeb metožu atrisināšanas secības.<\/span> <span class=\"sg\" data-s=\"3\">Tā ir secība, kādā Raku meklē metodi.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lasiet sarakstu no kreisās puses.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> vispirms ir pats <code>Dog<\/code>, tad <code>Animal<\/code> (tā vecākklase) un tad <code>Any<\/code> un <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Šie divi tipi ir pašā augšā, un katrs Raku objekts manto no tiem.<\/span> <span class=\"sg\" data-s=\"3\">Metodes izsaukumam uz <code>Dog<\/code> Raku pārmeklē šo sarakstu no kreisās uz labo.<\/span> <span class=\"sg\" data-s=\"4\">Tas izmanto pirmo atbilstošo metodi, ko atrod.<\/span> <span class=\"sg\" data-s=\"5\">Tieši tāpēc bērnklases metode pārraksta vecākklases metodi.<\/span> <span class=\"sg\" data-s=\"6\">Bērnklase ķēdē nāk agrāk.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ja klasei nav vecākklases, ko jūs norādāt paši, ķēde ir īsāka.<\/span> <span class=\"sg\" data-s=\"1\">Tajā ir tikai pati klase, kurai seko <code>Any<\/code> un <code>Mu<\/code>.<\/span><\/p>"]]},"ru":{"t":"Цепочка наследования","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Если класс наследует от другого, можно запросить всю его цепочку типов.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^mro<\/code> возвращает эту цепочку.<\/span> <span class=\"sg\" data-s=\"2\">Название расшифровывается как <em>method resolution order<\/em>, порядок разрешения методов.<\/span> <span class=\"sg\" data-s=\"3\">Это порядок, в котором Raku ищет метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Читайте список слева.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> — это сначала он сам, затем <code>Animal<\/code> (его родитель), а затем <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эти два типа стоят на самом верху, и от них наследует каждый объект Raku.<\/span> <span class=\"sg\" data-s=\"3\">При вызове метода у <code>Dog<\/code> Raku просматривает этот список слева направо.<\/span> <span class=\"sg\" data-s=\"4\">Он берёт первый подходящий метод, который находит.<\/span> <span class=\"sg\" data-s=\"5\">Именно поэтому метод потомка переопределяет метод родителя.<\/span> <span class=\"sg\" data-s=\"6\">Потомок стоит в цепочке раньше.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Если у класса нет родителя, которого вы указали сами, цепочка короче.<\/span> <span class=\"sg\" data-s=\"1\">В ней только сам класс, а за ним <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]},"uk":{"t":"Ланцюжок успадкування","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Якщо клас успадковує від іншого, можна запитати весь його ланцюжок типів.<\/span> <span class=\"sg\" data-s=\"1\">Метаметод <code>.^mro<\/code> повертає цей ланцюжок.<\/span> <span class=\"sg\" data-s=\"2\">Назва походить від <em>method resolution order<\/em> — «порядок розв'язання методів».<\/span> <span class=\"sg\" data-s=\"3\">Це порядок, у якому Raku шукає метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Читайте список зліва.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> спершу є сам собою, потім <code>Animal<\/code> (його батьком), а потім <code>Any<\/code> та <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ці два типи стоять на самій вершині, і кожен об'єкт Raku успадковує від них.<\/span> <span class=\"sg\" data-s=\"3\">Коли ви викликаєте метод для <code>Dog<\/code>, Raku шукає в цьому списку зліва направо.<\/span> <span class=\"sg\" data-s=\"4\">Він бере перший відповідний метод, який знаходить.<\/span> <span class=\"sg\" data-s=\"5\">Саме тому метод дитини перевизначає метод батька.<\/span> <span class=\"sg\" data-s=\"6\">Дитина стоїть у ланцюжку раніше.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Якщо клас не має батька, якого ви назвали самі, ланцюжок коротший.<\/span> <span class=\"sg\" data-s=\"1\">У ньому лише сам клас, а за ним <code>Any<\/code> та <code>Mu<\/code>.<\/span><\/p>"]]},"bg":{"t":"Веригата на наследяване","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ако един клас наследява друг, можете да поискате цялата му верига от типове.<\/span> <span class=\"sg\" data-s=\"1\">Метаметодът <code>.^mro<\/code> връща тази верига.<\/span> <span class=\"sg\" data-s=\"2\">Името идва от <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Това е редът, в който Raku търси метод.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Четете списъка отляво.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> е първо сам себе си, после <code>Animal<\/code> (неговият родител), а после <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тези два типа са най-отгоре и всеки обект в Raku ги наследява.<\/span> <span class=\"sg\" data-s=\"3\">При извикване на метод върху <code>Dog<\/code> Raku претърсва този списък отляво надясно.<\/span> <span class=\"sg\" data-s=\"4\">Той използва първия подходящ метод, който намери.<\/span> <span class=\"sg\" data-s=\"5\">Точно затова методът на дъщерния клас предефинира метода на родителя.<\/span> <span class=\"sg\" data-s=\"6\">Дъщерният клас идва по-рано във веригата.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ако класът няма родител, който сте посочили сами, веригата е по-къса.<\/span> <span class=\"sg\" data-s=\"1\">В нея е само самият клас, следван от <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/p>"]]},"eo":{"t":"La hereda ĉeno","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Se klaso heredas de alia, vi povas peti ĝian tutan ĉenon de tipoj.<\/span> <span class=\"sg\" data-s=\"1\">La metametodo <code>.^mro<\/code> redonas ĉi tiun ĉenon.<\/span> <span class=\"sg\" data-s=\"2\">La nomo signifas <em>ordo de metodserĉado<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas la ordo, en kiu Raku serĉas metodon.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Legu la liston de maldekstre.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> estas unue si mem, poste <code>Animal<\/code> (ĝia patro), kaj poste <code>Any<\/code> kaj <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj du tipoj estas tute supre, kaj ĉiu Raku-objekto heredas de ili.<\/span> <span class=\"sg\" data-s=\"3\">Por metodvoko sur <code>Dog<\/code>, Raku traserĉas ĉi tiun liston de maldekstre dekstren.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi uzas la unuan kongruan metodon, kiun ĝi trovas.<\/span> <span class=\"sg\" data-s=\"5\">Ĝuste tial la metodo de ido superregas la metodon de la patro.<\/span> <span class=\"sg\" data-s=\"6\">La ido venas pli frue en la ĉeno.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Se klaso ne havas patron, kiun vi mem nomas, la ĉeno estas pli mallonga.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi havas nur la klason mem, sekvatan de <code>Any<\/code> kaj <code>Mu<\/code>.<\/span><\/p>"]]},"la":{"t":"Catena hereditatis","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Si classis ab altera heredat, totam catenam generum eius petere potes.<\/span> <span class=\"sg\" data-s=\"1\">Metamethodus <code>.^mro<\/code> hanc catenam reddit.<\/span> <span class=\"sg\" data-s=\"2\">Nomen pro <em>method resolution order<\/em> stat.<\/span> <span class=\"sg\" data-s=\"3\">Hic est ordo quo Raku methodum quaerit.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n}\n\nclass Dog is Animal {\n}\n\nsay Dog.^mro; # ((Dog) (Animal) (Any) (Mu))<\/code><\/pre>"],["p",7,"<p><span class=\"sg\" data-s=\"0\">Lege indicem a sinistra.<\/span> <span class=\"sg\" data-s=\"1\"><code>Dog<\/code> primum ipse est, deinde <code>Animal<\/code> (parens eius), et deinde <code>Any<\/code> et <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Haec duo genera in summo sunt, et omne obiectum Raku ab eis heredat.<\/span> <span class=\"sg\" data-s=\"3\">Pro vocatione methodi in <code>Dog<\/code>, Raku hunc indicem a sinistra ad dextram perquirit.<\/span> <span class=\"sg\" data-s=\"4\">Primam methodum convenientem quam invenit adhibet.<\/span> <span class=\"sg\" data-s=\"5\">Haec est exacte causa cur methodus filiae methodum parentis superscribat.<\/span> <span class=\"sg\" data-s=\"6\">Filia prius in catena venit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Si classis nullum parentem habet quem ipse nominas, catena brevior est.<\/span> <span class=\"sg\" data-s=\"1\">Solum ipsam classem habet, quam <code>Any<\/code> et <code>Mu<\/code> sequuntur.<\/span><\/p>"]]}}}</script>
