<script type="application/json" id="page-data">{"u":"oop/object-introspection","n":839,"k":"section","pv":"oop/roles/exercises/dancing-robot/solution","nx":"oop/object-introspection/inheritance-chain","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Introspecting objects","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/advanced/containers/\">section about containers<\/a>, you used <code>.^name<\/code> to ask a value for its type.<\/span> <span class=\"sg\" data-s=\"1\">With the same <code>.^<\/code> meta-calls, you can look inside a class and its objects.<\/span> <span class=\"sg\" data-s=\"2\">You can see their names, their attributes and their place in a class hierarchy.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>.^name<\/code> meta-method returns the name of the class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>.^attributes<\/code> meta-method lists the attributes of the class.<\/span> <span class=\"sg\" data-s=\"1\">You see each one with its type and its internal private name.<\/span> <span class=\"sg\" data-s=\"2\">This is the <code>$!<\/code> form that you met with <a href=\"/oop/methods/private-attributes/\">private attributes<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspection is useful for tools that work with any kind of object.<\/span> <span class=\"sg\" data-s=\"1\">For example, such a tool can print every attribute of an object.<\/span> <span class=\"sg\" data-s=\"2\">It does not need to know the class first.<\/span> <span class=\"sg\" data-s=\"3\">The next topic shows how to see the inheritance chain of a class.<\/span><\/p>"]]},"de":{"t":"Objekte inspizieren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Container<\/a> haben Sie <code>.^name<\/code> benutzt, um einen Wert nach seinem Typ zu fragen.<\/span> <span class=\"sg\" data-s=\"1\">Mit denselben Meta-Aufrufen mit <code>.^<\/code> können Sie in eine Klasse und ihre Objekte hineinsehen.<\/span> <span class=\"sg\" data-s=\"2\">Sie sehen ihre Namen, ihre Attribute und ihren Platz in einer Hierarchie von Klassen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Metamethode <code>.^name<\/code> liefert den Namen der Klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Die Metamethode <code>.^attributes<\/code> listet die Attribute der Klasse auf.<\/span> <span class=\"sg\" data-s=\"1\">Sie sehen jedes Attribut mit seinem Typ und seinem internen privaten Namen.<\/span> <span class=\"sg\" data-s=\"2\">Das ist die <code>$!<\/code>-Form, die Sie bei den <a href=\"https://course.raku.org/de/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privaten Attributen<\/a> kennengelernt haben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspektion ist nützlich für Werkzeuge, die mit jeder Art von Objekt arbeiten.<\/span> <span class=\"sg\" data-s=\"1\">Zum Beispiel kann so ein Werkzeug jedes Attribut eines Objekts ausgeben.<\/span> <span class=\"sg\" data-s=\"2\">Es muss die Klasse dafür vorher nicht kennen.<\/span> <span class=\"sg\" data-s=\"3\">Das nächste Thema zeigt, wie Sie die Vererbungskette einer Klasse sehen.<\/span><\/p>"]]},"nl":{"t":"Objecten introspecteren","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectie over containers<\/a> gebruikte je <code>.^name<\/code> om een waarde naar haar type te vragen.<\/span> <span class=\"sg\" data-s=\"1\">Met dezelfde meta-aanroepen met <code>.^<\/code> kun je in een klasse en haar objecten kijken.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt hun namen, hun attributen en hun plaats in een klassenhiërarchie zien.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De metamethode <code>.^name<\/code> geeft de naam van de klasse terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De metamethode <code>.^attributes<\/code> somt de attributen van de klasse op.<\/span> <span class=\"sg\" data-s=\"1\">Je ziet elk attribuut met zijn type en zijn interne private naam.<\/span> <span class=\"sg\" data-s=\"2\">Dat is de <code>$!<\/code>-vorm die je bij <a href=\"https://course.raku.org/nl/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">private attributen<\/a> tegenkwam:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspectie is nuttig voor tools die met elke soort object werken.<\/span> <span class=\"sg\" data-s=\"1\">Zo'n tool kan bijvoorbeeld elk attribuut van een object afdrukken.<\/span> <span class=\"sg\" data-s=\"2\">Hij hoeft de klasse niet eerst te kennen.<\/span> <span class=\"sg\" data-s=\"3\">Het volgende onderwerp laat zien hoe je de overervingsketen van een klasse kunt zien.<\/span><\/p>"]]},"es":{"t":"Introspección de objetos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sección sobre contenedores<\/a>, usaste <code>.^name<\/code> para preguntarle a un valor por su tipo.<\/span> <span class=\"sg\" data-s=\"1\">Con las mismas metallamadas <code>.^<\/code>, puedes mirar dentro de una clase y de sus objetos.<\/span> <span class=\"sg\" data-s=\"2\">Puedes ver sus nombres, sus atributos y su lugar en una jerarquía de clases.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El metamétodo <code>.^name<\/code> devuelve el nombre de la clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El metamétodo <code>.^attributes<\/code> enumera los atributos de la clase.<\/span> <span class=\"sg\" data-s=\"1\">Ves cada uno con su tipo y su nombre privado interno.<\/span> <span class=\"sg\" data-s=\"2\">Es la forma <code>$!<\/code> que conociste con los <a href=\"https://course.raku.org/es/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">atributos privados<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La introspección es útil para herramientas que trabajan con cualquier clase de objeto.<\/span> <span class=\"sg\" data-s=\"1\">Por ejemplo, una herramienta así puede imprimir todos los atributos de un objeto.<\/span> <span class=\"sg\" data-s=\"2\">No necesita conocer antes la clase.<\/span> <span class=\"sg\" data-s=\"3\">El tema siguiente muestra cómo ver la cadena de herencia de una clase.<\/span><\/p>"]]},"it":{"t":"Introspezione degli oggetti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sezione sui contenitori<\/a> hai usato <code>.^name<\/code> per chiedere a un valore il suo tipo.<\/span> <span class=\"sg\" data-s=\"1\">Con le stesse metachiamate <code>.^<\/code> puoi guardare dentro una classe e i suoi oggetti.<\/span> <span class=\"sg\" data-s=\"2\">Puoi vedere i loro nomi, i loro attributi e il loro posto in una gerarchia di classi.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il metametodo <code>.^name<\/code> restituisce il nome della classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il metametodo <code>.^attributes<\/code> elenca gli attributi della classe.<\/span> <span class=\"sg\" data-s=\"1\">Vedi ciascuno con il suo tipo e il suo nome privato interno.<\/span> <span class=\"sg\" data-s=\"2\">È la forma <code>$!<\/code> che hai incontrato con gli <a href=\"https://course.raku.org/it/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">attributi privati<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">L'introspezione è utile per gli strumenti che lavorano con qualsiasi tipo di oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Per esempio, uno strumento così può stampare ogni attributo di un oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Non ha bisogno di conoscere prima la classe.<\/span> <span class=\"sg\" data-s=\"3\">Il prossimo argomento mostra come vedere la catena di ereditarietà di una classe.<\/span><\/p>"]]},"lv":{"t":"Objektu introspekcija","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/advanced/containers/\" target=\"_blank\" rel=\"noopener\">Sadaļā par konteineriem<\/a> jūs izmantojāt <code>.^name<\/code>, lai pajautātu vērtībai tās tipu.<\/span> <span class=\"sg\" data-s=\"1\">Ar tiem pašiem <code>.^<\/code> metaizsaukumiem jūs varat ieskatīties klasē un tās objektos.<\/span> <span class=\"sg\" data-s=\"2\">Jūs varat redzēt to nosaukumus, atribūtus un vietu klašu hierarhijā.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metametode <code>.^name<\/code> atgriež klases nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metametode <code>.^attributes<\/code> uzskaita klases atribūtus.<\/span> <span class=\"sg\" data-s=\"1\">Jūs redzat katru no tiem ar tā tipu un iekšējo privāto nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir <code>$!<\/code> forma, ar ko jūs iepazināties pie <a href=\"https://course.raku.org/lv/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privātiem atribūtiem<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspekcija noder rīkiem, kas strādā ar jebkura veida objektiem.<\/span> <span class=\"sg\" data-s=\"1\">Piemēram, šāds rīks var izdrukāt katru objekta atribūtu.<\/span> <span class=\"sg\" data-s=\"2\">Tam nav iepriekš jāzina klase.<\/span> <span class=\"sg\" data-s=\"3\">Nākamais temats parāda, kā apskatīt klases mantošanas ķēdi.<\/span><\/p>"]]},"ru":{"t":"Интроспекция объектов","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/advanced/containers/\" target=\"_blank\" rel=\"noopener\">разделе о контейнерах<\/a> вы использовали <code>.^name<\/code>, чтобы спросить у значения его тип.<\/span> <span class=\"sg\" data-s=\"1\">С теми же метавызовами <code>.^<\/code> можно заглянуть внутрь класса и его объектов.<\/span> <span class=\"sg\" data-s=\"2\">Можно увидеть их имена, их атрибуты и их место в иерархии классов.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^name<\/code> возвращает имя класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перечисляет атрибуты класса.<\/span> <span class=\"sg\" data-s=\"1\">Вы видите каждый из них с его типом и внутренним приватным именем.<\/span> <span class=\"sg\" data-s=\"2\">Это та форма <code>$!<\/code>, которую вы встречали в <a href=\"https://course.raku.org/ru/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватных атрибутах<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Интроспекция полезна для инструментов, которые работают с любыми объектами.<\/span> <span class=\"sg\" data-s=\"1\">Например, такой инструмент может напечатать каждый атрибут объекта.<\/span> <span class=\"sg\" data-s=\"2\">Ему не нужно заранее знать класс.<\/span> <span class=\"sg\" data-s=\"3\">Следующая тема показывает, как увидеть цепочку наследования класса.<\/span><\/p>"]]},"uk":{"t":"Інтроспекція об'єктів","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/advanced/containers/\" target=\"_blank\" rel=\"noopener\">розділі про контейнери<\/a> ви користувалися <code>.^name<\/code>, щоб запитати значення про його тип.<\/span> <span class=\"sg\" data-s=\"1\">Тими самими метавикликами <code>.^<\/code> можна зазирнути всередину класу та його об'єктів.<\/span> <span class=\"sg\" data-s=\"2\">Можна побачити їхні імена, атрибути та місце в ієрархії класів.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^name<\/code> повертає ім'я класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаметод <code>.^attributes<\/code> перелічує атрибути класу.<\/span> <span class=\"sg\" data-s=\"1\">Ви бачите кожен із його типом і внутрішнім приватним іменем.<\/span> <span class=\"sg\" data-s=\"2\">Це форма <code>$!<\/code>, з якою ви познайомилися в темі про <a href=\"https://course.raku.org/uk/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">приватні атрибути<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Інтроспекція корисна для інструментів, які працюють з будь-якими об'єктами.<\/span> <span class=\"sg\" data-s=\"1\">Наприклад, такий інструмент може вивести кожен атрибут об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Йому не треба заздалегідь знати клас.<\/span> <span class=\"sg\" data-s=\"3\">Наступна тема показує, як побачити ланцюжок успадкування класу.<\/span><\/p>"]]},"bg":{"t":"Интроспекция на обекти","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/advanced/containers/\" target=\"_blank\" rel=\"noopener\">раздела за контейнерите<\/a> използвахте <code>.^name<\/code>, за да попитате стойността за нейния тип.<\/span> <span class=\"sg\" data-s=\"1\">Със същите метаизвиквания с <code>.^<\/code> можете да погледнете вътре в клас и неговите обекти.<\/span> <span class=\"sg\" data-s=\"2\">Можете да видите имената им, атрибутите им и мястото им в йерархията на класовете.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Методът <code>.^name<\/code> връща името на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Метаметодът <code>.^attributes<\/code> изброява атрибутите на класа.<\/span> <span class=\"sg\" data-s=\"1\">Виждате всеки от тях с типа му и с вътрешното му частно име.<\/span> <span class=\"sg\" data-s=\"2\">Това е формата <code>$!<\/code>, с която се запознахте при <a href=\"https://course.raku.org/bg/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">частните атрибути<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Интроспекцията е полезна за инструменти, които работят с всякакви обекти.<\/span> <span class=\"sg\" data-s=\"1\">Например такъв инструмент може да отпечата всеки атрибут на обекта.<\/span> <span class=\"sg\" data-s=\"2\">Не е нужно той първо да знае класа.<\/span> <span class=\"sg\" data-s=\"3\">Следващата тема показва как да видите веригата на наследяване на класа.<\/span><\/p>"]]},"eo":{"t":"Introspekti objektojn","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sekcio pri ujoj<\/a>, vi uzis <code>.^name<\/code> por demandi al valoro ĝian tipon.<\/span> <span class=\"sg\" data-s=\"1\">Per la samaj metavokoj <code>.^<\/code>, vi povas rigardi en klason kaj ĝiajn objektojn.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas vidi iliajn nomojn, iliajn atributojn kaj ilian lokon en hierarkio de klasoj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La metametodo <code>.^name<\/code> redonas la nomon de la klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La metametodo <code>.^attributes<\/code> listigas la atributojn de la klaso.<\/span> <span class=\"sg\" data-s=\"1\">Vi vidas ĉiun kun ĝia tipo kaj ĝia interna privata nomo.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas la formo <code>$!<\/code>, kiun vi renkontis ĉe <a href=\"https://course.raku.org/eo/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">privataj atributoj<\/a>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspekto estas utila por iloj, kiuj laboras kun ĉiu speco de objekto.<\/span> <span class=\"sg\" data-s=\"1\">Ekzemple, tia ilo povas presi ĉiun atributon de objekto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ne bezonas scii la klason antaŭe.<\/span> <span class=\"sg\" data-s=\"3\">La sekva temo montras, kiel vidi la heredan ĉenon de klaso.<\/span><\/p>"]]},"la":{"t":"Obiecta introspicere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/advanced/containers/\" target=\"_blank\" rel=\"noopener\">sectione de receptaculis<\/a> <code>.^name<\/code> adhibuisti ut valorem de genere suo interrogares.<\/span> <span class=\"sg\" data-s=\"1\">Eisdem metavocationibus <code>.^<\/code> classem eiusque obiecta intus inspicere potes.<\/span> <span class=\"sg\" data-s=\"2\">Nomina eorum, attributa eorum et locum eorum in hierarchia classium videre potes.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Metamethodus <code>.^name<\/code> nomen classis reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    method bark { 'Woof' }\n}\n\nsay Dog.^name; # Dog<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metamethodus <code>.^attributes<\/code> attributa classis enumerat.<\/span> <span class=\"sg\" data-s=\"1\">Unumquodque cum genere suo et nomine privato interno vides.<\/span> <span class=\"sg\" data-s=\"2\">Haec est forma <code>$!<\/code> quam apud <a href=\"https://course.raku.org/la/oop/methods/private-attributes/\" target=\"_blank\" rel=\"noopener\">attributa privata<\/a> invenisti:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Dog.^attributes; # (Str $!name)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Introspectio utilis est instrumentis quae cum quolibet genere obiecti operantur.<\/span> <span class=\"sg\" data-s=\"1\">Exempli gratia, tale instrumentum omne attributum obiecti imprimere potest.<\/span> <span class=\"sg\" data-s=\"2\">Classem prius scire non debet.<\/span> <span class=\"sg\" data-s=\"3\">Argumentum sequens ostendit quomodo catenam hereditatis classis videas.<\/span><\/p>"]]}}}</script>
