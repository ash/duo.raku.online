<script type="application/json" id="page-data">{"u":"oop/try","n":924,"k":"section","pv":"oop/external-programs/exercises/read-env/solution","nx":"oop/try/deferred-errors","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Catching exceptions with <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">When something goes wrong in a Raku program, an <em>exception<\/em> is thrown.<\/span> <span class=\"sg\" data-s=\"1\">This happens, for example, when a file is missing or when you call <code>die<\/code> yourself.<\/span> <span class=\"sg\" data-s=\"2\">By default, an exception that nobody handles stops the program.<\/span> <span class=\"sg\" data-s=\"3\">The <code>try<\/code> block lets you run code that might fail, without a crash.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">You put the risky code inside a <code>try<\/code> block.<\/span> <span class=\"sg\" data-s=\"1\">If an exception is thrown inside it, the block stops at that point.<\/span> <span class=\"sg\" data-s=\"2\">But the program continues:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>try<\/code> catches the <code>die<\/code>, so the program does not crash.<\/span> <span class=\"sg\" data-s=\"1\">It goes straight on to the next statement and prints:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When the block fails like this, it gives an undefined value.<\/span> <span class=\"sg\" data-s=\"1\">So <code>$result<\/code> is undefined:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The caught exception is stored in the special variable <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">You can read its message from there:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">So <code>try<\/code> turns a fatal error into something your program can check and react to.<\/span> <span class=\"sg\" data-s=\"1\">If the block runs without any exception, <code>$result<\/code> holds its value and <code>$!<\/code> is undefined.<\/span><\/p>"]]},"de":{"t":"Ausnahmen mit <code>try<\/code> fangen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn in einem Raku-Programm etwas schiefgeht, wird eine <em>Ausnahme<\/em> geworfen.<\/span> <span class=\"sg\" data-s=\"1\">Das passiert zum Beispiel, wenn eine Datei fehlt oder wenn Sie selbst <code>die<\/code> aufrufen.<\/span> <span class=\"sg\" data-s=\"2\">Standardmäßig hält eine Ausnahme, die niemand behandelt, das Programm an.<\/span> <span class=\"sg\" data-s=\"3\">Mit dem <code>try<\/code>-Block können Sie Code ausführen, der fehlschlagen könnte, ohne dass das Programm abstürzt.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie schreiben den riskanten Code in einen <code>try<\/code>-Block.<\/span> <span class=\"sg\" data-s=\"1\">Wenn darin eine Ausnahme geworfen wird, endet der Block an dieser Stelle.<\/span> <span class=\"sg\" data-s=\"2\">Aber das Programm läuft weiter:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das <code>try<\/code> fängt das <code>die<\/code>, also stürzt das Programm nicht ab.<\/span> <span class=\"sg\" data-s=\"1\">Es geht direkt zur nächsten Anweisung weiter und gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn der Block so fehlschlägt, ergibt er einen undefinierten Wert.<\/span> <span class=\"sg\" data-s=\"1\">Also ist <code>$result<\/code> undefiniert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die gefangene Ausnahme wird in der besonderen Variablen <code>$!<\/code> gespeichert.<\/span> <span class=\"sg\" data-s=\"1\">Dort können Sie ihre Meldung lesen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> macht aus einem fatalen Fehler also etwas, das Ihr Programm prüfen und worauf es reagieren kann.<\/span> <span class=\"sg\" data-s=\"1\">Wenn der Block ohne Ausnahme läuft, enthält <code>$result<\/code> seinen Wert, und <code>$!<\/code> ist undefiniert.<\/span><\/p>"]]},"nl":{"t":"Excepties vangen met <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Als er in een Raku-programma iets misgaat, wordt er een <em>exceptie<\/em> geworpen.<\/span> <span class=\"sg\" data-s=\"1\">Dat gebeurt bijvoorbeeld als een bestand ontbreekt of als je zelf <code>die<\/code> aanroept.<\/span> <span class=\"sg\" data-s=\"2\">Een exceptie die niemand afhandelt, stopt standaard het programma.<\/span> <span class=\"sg\" data-s=\"3\">Met het <code>try<\/code>-blok kun je code draaien die kan mislukken, zonder een crash.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Je zet de riskante code in een <code>try<\/code>-blok.<\/span> <span class=\"sg\" data-s=\"1\">Als er in dat blok een exceptie geworpen wordt, stopt het blok op dat punt.<\/span> <span class=\"sg\" data-s=\"2\">Maar het programma gaat door:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De <code>try<\/code> vangt de <code>die<\/code>, dus het programma crasht niet.<\/span> <span class=\"sg\" data-s=\"1\">Het gaat meteen door naar de volgende opdracht en drukt af:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als het blok zo mislukt, geeft het een ongedefinieerde waarde.<\/span> <span class=\"sg\" data-s=\"1\">Dus is <code>$result<\/code> ongedefinieerd:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De gevangen exceptie wordt in de bijzondere variabele <code>$!<\/code> bewaard.<\/span> <span class=\"sg\" data-s=\"1\">Daar kun je haar melding uit lezen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> maakt van een fatale fout dus iets wat je programma kan controleren en waarop het kan reageren.<\/span> <span class=\"sg\" data-s=\"1\">Als het blok zonder exceptie draait, bevat <code>$result<\/code> zijn waarde en is <code>$!<\/code> ongedefinieerd.<\/span><\/p>"]]},"es":{"t":"Capturar excepciones con <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cuando algo sale mal en un programa de Raku, se lanza una <em>excepción<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Esto pasa, por ejemplo, cuando falta un archivo o cuando tú mismo llamas a <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Por defecto, una excepción que nadie maneja detiene el programa.<\/span> <span class=\"sg\" data-s=\"3\">El bloque <code>try<\/code> te permite ejecutar código que podría fallar, sin que el programa se caiga.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Pones el código arriesgado dentro de un bloque <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Si se lanza una excepción dentro de él, el bloque se detiene en ese punto.<\/span> <span class=\"sg\" data-s=\"2\">Pero el programa continúa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El <code>try<\/code> captura el <code>die<\/code>, así que el programa no se cae.<\/span> <span class=\"sg\" data-s=\"1\">Pasa directamente a la instrucción siguiente e imprime:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando el bloque falla así, da un valor no definido.<\/span> <span class=\"sg\" data-s=\"1\">Así que <code>$result<\/code> no está definido:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La excepción capturada se guarda en la variable especial <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Desde ahí puedes leer su mensaje:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Así que <code>try<\/code> convierte un error fatal en algo que tu programa puede comprobar y a lo que puede reaccionar.<\/span> <span class=\"sg\" data-s=\"1\">Si el bloque se ejecuta sin ninguna excepción, <code>$result<\/code> contiene su valor y <code>$!<\/code> no está definida.<\/span><\/p>"]]},"it":{"t":"Intercettare le eccezioni con <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Quando qualcosa va storto in un programma Raku, viene sollevata un'<em>eccezione<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Succede, per esempio, quando manca un file o quando chiami tu stesso <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Di norma, un'eccezione che nessuno gestisce ferma il programma.<\/span> <span class=\"sg\" data-s=\"3\">Il blocco <code>try<\/code> ti permette di eseguire codice che potrebbe fallire, senza che il programma crolli.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Metti il codice rischioso dentro un blocco <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se al suo interno viene sollevata un'eccezione, il blocco si ferma in quel punto.<\/span> <span class=\"sg\" data-s=\"2\">Ma il programma continua:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il <code>try<\/code> intercetta il <code>die<\/code>, quindi il programma non crolla.<\/span> <span class=\"sg\" data-s=\"1\">Prosegue dritto all'istruzione successiva e stampa:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando il blocco fallisce così, dà un valore non definito.<\/span> <span class=\"sg\" data-s=\"1\">Quindi <code>$result<\/code> non è definito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">L'eccezione intercettata è conservata nella variabile speciale <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Da lì puoi leggere il suo messaggio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Così <code>try<\/code> trasforma un errore fatale in qualcosa che il tuo programma può controllare e a cui può reagire.<\/span> <span class=\"sg\" data-s=\"1\">Se il blocco gira senza nessuna eccezione, <code>$result<\/code> contiene il suo valore e <code>$!<\/code> non è definito.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu pārtveršana ar <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Kad Raku programmā kaut kas noiet greizi, tiek izmests <em>izņēmums<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tā notiek, piemēram, kad trūkst faila vai kad jūs paši izsaucat <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pēc noklusējuma izņēmums, ko neviens neapstrādā, aptur programmu.<\/span> <span class=\"sg\" data-s=\"3\">Bloks <code>try<\/code> ļauj izpildīt kodu, kas varētu neizdoties, bez programmas avārijas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Riskanto kodu jūs ieliekat blokā <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ja tā iekšā tiek izmests izņēmums, bloks apstājas tajā vietā.<\/span> <span class=\"sg\" data-s=\"2\">Bet programma turpina darbu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> noķer <code>die<\/code>, tāpēc programma neavarē.<\/span> <span class=\"sg\" data-s=\"1\">Tā uzreiz turpina ar nākamo teikumu un izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad bloks šādi neizdodas, tas dod nedefinētu vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc <code>$result<\/code> ir nedefinēts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Noķertais izņēmums glabājas speciālajā mainīgajā <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā paziņojumu var nolasīt no turienes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tātad <code>try<\/code> pārvērš liktenīgu kļūdu par kaut ko, ko jūsu programma var pārbaudīt un uz ko reaģēt.<\/span> <span class=\"sg\" data-s=\"1\">Ja bloks izpildās bez neviena izņēmuma, <code>$result<\/code> satur tā vērtību un <code>$!<\/code> ir nedefinēts.<\/span><\/p>"]]},"ru":{"t":"Перехват исключений с помощью <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Когда в программе на Raku что-то идёт не так, бросается <em>исключение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Так бывает, например, когда нет файла или когда вы сами вызываете <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По умолчанию исключение, которое никто не обработал, останавливает программу.<\/span> <span class=\"sg\" data-s=\"3\">Блок <code>try<\/code> позволяет выполнить код, который может дать сбой, без падения программы.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Вы помещаете рискованный код в блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Если внутри него бросается исключение, блок на этом месте останавливается.<\/span> <span class=\"sg\" data-s=\"2\">Но программа продолжает работу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> перехватывает <code>die<\/code>, поэтому программа не падает.<\/span> <span class=\"sg\" data-s=\"1\">Она сразу переходит к следующей инструкции и печатает:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда блок вот так даёт сбой, он возвращает неопределённое значение.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому <code>$result<\/code> не определён:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехваченное исключение хранится в специальной переменной <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Оттуда можно прочитать его сообщение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Итак, <code>try<\/code> превращает фатальную ошибку в то, что ваша программа может проверить и на что может отреагировать.<\/span> <span class=\"sg\" data-s=\"1\">Если блок выполнился без исключений, в <code>$result<\/code> хранится его значение, а <code>$!<\/code> не определён.<\/span><\/p>"]]},"uk":{"t":"Перехоплення винятків за допомогою <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Коли в програмі на Raku щось іде не так, кидається <em>виняток<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це стається, наприклад, коли бракує файлу або коли ви самі викликаєте <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">За замовчуванням виняток, який ніхто не обробляє, зупиняє програму.<\/span> <span class=\"sg\" data-s=\"3\">Блок <code>try<\/code> дозволяє виконати код, який може не спрацювати, без падіння програми.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви кладете ризикований код у блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Якщо всередині нього кинуто виняток, блок зупиняється в цьому місці.<\/span> <span class=\"sg\" data-s=\"2\">Але програма працює далі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Блок <code>try<\/code> перехоплює <code>die<\/code>, тож програма не падає.<\/span> <span class=\"sg\" data-s=\"1\">Вона одразу переходить до наступного оператора й виводить:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли блок отак не спрацьовує, він дає невизначене значення.<\/span> <span class=\"sg\" data-s=\"1\">Тож змінна <code>$result<\/code> невизначена:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Перехоплений виняток зберігається в спеціальній змінній <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звідти можна прочитати його повідомлення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Отже, <code>try<\/code> робить із фатальної помилки те, що ваша програма може перевірити й на що може відреагувати.<\/span> <span class=\"sg\" data-s=\"1\">Якщо блок виконується без жодного винятку, <code>$result<\/code> містить його значення, а <code>$!<\/code> невизначена.<\/span><\/p>"]]},"bg":{"t":"Прихващане на изключения с <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Когато нещо се обърка в програма на Raku, се хвърля <em>изключение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това става например, когато липсва файл или когато сами извикате <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">По подразбиране изключение, което никой не обработва, спира програмата.<\/span> <span class=\"sg\" data-s=\"3\">Блокът <code>try<\/code> ви позволява да изпълните код, който може да се провали, без срив.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Слагате рискования код в блок <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ако вътре в него бъде хвърлено изключение, блокът спира на това място.<\/span> <span class=\"sg\" data-s=\"2\">Но програмата продължава:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> прихваща <code>die<\/code>, така че програмата не се срива.<\/span> <span class=\"sg\" data-s=\"1\">Тя продължава направо със следващия оператор и отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато блокът се провали така, той дава недефинирана стойност.<\/span> <span class=\"sg\" data-s=\"1\">Затова <code>$result<\/code> е недефинирана:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Прихванатото изключение се пази в специалната променлива <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Можете да прочетете съобщението му оттам:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Така <code>try<\/code> превръща фаталната грешка в нещо, което програмата ви може да провери и на което може да реагира.<\/span> <span class=\"sg\" data-s=\"1\">Ако блокът се изпълни без изключение, <code>$result<\/code> съдържа стойността му, а <code>$!<\/code> е недефинирана.<\/span><\/p>"]]},"eo":{"t":"Kapti esceptojn per <code>try<\/code>","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiam io misiras en Raku-programo, <em>escepto<\/em> estas ĵetata.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas ekzemple, kiam dosiero mankas aŭ kiam vi mem vokas <code>die<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Defaŭlte, escepto, kiun neniu traktas, haltigas la programon.<\/span> <span class=\"sg\" data-s=\"3\">La bloko <code>try<\/code> permesas al vi ruli kodon, kiu povus malsukcesi, sen kolapso.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi metas la riskan kodon en blokon <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Se escepto estas ĵetata ene de ĝi, la bloko haltas en tiu punkto.<\/span> <span class=\"sg\" data-s=\"2\">Sed la programo daŭras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La <code>try<\/code> kaptas la <code>die<\/code>, do la programo ne kolapsas.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi pluiras rekte al la sekva instrukcio kaj presas:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam la bloko malsukcesas tiel, ĝi donas nedifinitan valoron.<\/span> <span class=\"sg\" data-s=\"1\">Do <code>$result<\/code> estas nedifinita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La kaptita escepto estas konservita en la speciala variablo <code>$!<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Vi povas legi ĝian mesaĝon el tie:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do <code>try<\/code> faras el fatala eraro ion, kion via programo povas kontroli kaj al kio ĝi povas reagi.<\/span> <span class=\"sg\" data-s=\"1\">Se la bloko ruliĝas sen ia escepto, <code>$result<\/code> tenas ĝian valoron kaj <code>$!<\/code> estas nedifinita.<\/span><\/p>"]]},"la":{"t":"Exceptiones per <code>try<\/code> capere","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum aliquid in programmate Raku male cedit, <em>exceptio<\/em> iacitur.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit, exempli gratia, cum archivum deest aut cum ipse <code>die<\/code> vocas.<\/span> <span class=\"sg\" data-s=\"2\">Ex more exceptio quam nemo tractat programma sistit.<\/span> <span class=\"sg\" data-s=\"3\">Clausula <code>try<\/code> tibi permittit codicem currere qui deficere potest, sine ruina.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Codicem periculosum intra clausulam <code>try<\/code> ponis.<\/span> <span class=\"sg\" data-s=\"1\">Si exceptio intus iacitur, clausula eo loco desinit.<\/span> <span class=\"sg\" data-s=\"2\">Sed programma pergit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $result = try {\n    die 'Boom!';\n};\n\nsay \"Still works\";<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>try<\/code> capit <code>die<\/code>, itaque programma non ruit.<\/span> <span class=\"sg\" data-s=\"1\">Recta ad enuntiatum sequens pergit et imprimit:<\/span><\/p>"],["code",0,"<pre><code>Still works<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum clausula ita deficit, valorem indefinitum dat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque <code>$result<\/code> indefinitus est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $result.defined; # False<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Exceptio capta in variabili speciali <code>$!<\/code> servatur.<\/span> <span class=\"sg\" data-s=\"1\">Nuntium eius inde legere potes:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $!.message; # Boom!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Itaque <code>try<\/code> errorem fatalem in aliquid vertit quod programma tuum probare et ad quod reagere potest.<\/span> <span class=\"sg\" data-s=\"1\">Si clausula sine ulla exceptione currit, <code>$result<\/code> valorem eius continet et <code>$!<\/code> indefinitus est.<\/span><\/p>"]]}}}</script>
