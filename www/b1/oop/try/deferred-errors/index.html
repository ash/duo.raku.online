<script type="application/json" id="page-data">{"u":"oop/try/deferred-errors","n":925,"k":"topic","pv":"oop/try","nx":"oop/try/exercises","tr":["oop","oop/try"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Not every error is immediate","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">By default, a thrown exception stops the program at once.<\/span> <span class=\"sg\" data-s=\"1\">You catch it with <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">But not every error that looks fatal really stops your program right away.<\/span> <span class=\"sg\" data-s=\"3\">Raku has failures that stay quiet.<\/span> <span class=\"sg\" data-s=\"4\">Some of them react only when you use the result.<\/span> <span class=\"sg\" data-s=\"5\">Others let you check them and carry on.<\/span> <span class=\"sg\" data-s=\"6\">You have already seen two of them in this part.<\/span> <span class=\"sg\" data-s=\"7\">It is worth collecting them in one place.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>A division by zero.<\/strong> Dividing by zero does not fail where it is written.<\/span> <span class=\"sg\" data-s=\"1\">The bad value is made and kept quietly.<\/span> <span class=\"sg\" data-s=\"2\">It throws only when you <em>use<\/em> it.<\/span> <span class=\"sg\" data-s=\"3\">For example, this happens when you print it or convert it to another type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">This delayed behaviour and the <code>Failure<\/code> objects behind it are the topic of <a href=\"/oop/failures/\">Soft failures<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>A failing external program.<\/strong> Suppose <code>run<\/code> or <code>shell<\/code> returns a <code>Proc<\/code> for a failed program.<\/span> <span class=\"sg\" data-s=\"1\">This <code>Proc<\/code> does not throw when it is created.<\/span> <span class=\"sg\" data-s=\"2\">It throws only if you <em>throw it away<\/em> without handling it.<\/span> <span class=\"sg\" data-s=\"3\">Store it and read <code>.exitcode<\/code>, or test it as a Boolean.<\/span> <span class=\"sg\" data-s=\"4\">Then the failure stays a simple value that you can react to.<\/span> <span class=\"sg\" data-s=\"5\">You saw this in <a href=\"/oop/external-programs/the-proc-object/\">The Proc object<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Both cases have one thing in common.<\/span> <span class=\"sg\" data-s=\"1\">A failure can be <em>deferred<\/em>, that is, put off until later.<\/span> <span class=\"sg\" data-s=\"2\">It becomes a value that you check when you are ready.<\/span> <span class=\"sg\" data-s=\"3\">It does not crash the program right away.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> and the <code>CATCH<\/code> phaser deal with errors that are thrown right away.<\/span> <span class=\"sg\" data-s=\"5\">The ways on this page deal with errors that are not thrown at once.<\/span><\/p>"]]},"de":{"t":"Nicht jeder Fehler tritt sofort auf","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig hält eine geworfene Ausnahme das Programm sofort an.<\/span> <span class=\"sg\" data-s=\"1\">Mit <code>try<\/code> fangen Sie sie.<\/span> <span class=\"sg\" data-s=\"2\">Aber nicht jeder Fehler, der fatal aussieht, hält Ihr Programm wirklich sofort an.<\/span> <span class=\"sg\" data-s=\"3\">Raku kennt Fehlschläge, die still bleiben.<\/span> <span class=\"sg\" data-s=\"4\">Manche davon reagieren erst, wenn Sie das Ergebnis verwenden.<\/span> <span class=\"sg\" data-s=\"5\">Andere lassen sich prüfen, und dann machen Sie einfach weiter.<\/span> <span class=\"sg\" data-s=\"6\">Zwei davon haben Sie in diesem Teil schon gesehen.<\/span> <span class=\"sg\" data-s=\"7\">Es lohnt sich, sie an einer Stelle zu sammeln.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Eine Division durch null.<\/strong> Durch null zu teilen schlägt nicht dort fehl, wo es geschrieben steht.<\/span> <span class=\"sg\" data-s=\"1\">Der schlechte Wert wird erzeugt und ohne Meldung aufbewahrt.<\/span> <span class=\"sg\" data-s=\"2\">Er wirft erst, wenn Sie ihn <em>verwenden<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Das passiert zum Beispiel, wenn Sie ihn ausgeben oder in einen anderen Typ umwandeln:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dieses verzögerte Verhalten und die <code>Failure<\/code>-Objekte dahinter sind das Thema von <a href=\"https://course.raku.org/de/oop/failures/\" target=\"_blank\" rel=\"noopener\">Weiche Fehlschläge<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Ein fehlschlagendes externes Programm.<\/strong> Angenommen, <code>run<\/code> oder <code>shell<\/code> gibt ein <code>Proc<\/code> für ein fehlgeschlagenes Programm zurück.<\/span> <span class=\"sg\" data-s=\"1\">Dieses <code>Proc<\/code> wirft nicht, wenn es entsteht.<\/span> <span class=\"sg\" data-s=\"2\">Es wirft nur, wenn Sie es ohne Behandlung <em>wegwerfen<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Speichern Sie es und lesen Sie <code>.exitcode<\/code>, oder prüfen Sie es als Wahrheitswert.<\/span> <span class=\"sg\" data-s=\"4\">Dann bleibt der Fehlschlag ein einfacher Wert, auf den Sie reagieren können.<\/span> <span class=\"sg\" data-s=\"5\">Das haben Sie in <a href=\"https://course.raku.org/de/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Das Proc-Objekt<\/a> gesehen.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Beide Fälle haben etwas gemeinsam.<\/span> <span class=\"sg\" data-s=\"1\">Ein Fehlschlag kann <em>aufgeschoben<\/em> werden, das heißt auf später verschoben.<\/span> <span class=\"sg\" data-s=\"2\">Er wird zu einem Wert, den Sie prüfen, wenn Sie bereit sind.<\/span> <span class=\"sg\" data-s=\"3\">Er lässt das Programm nicht sofort abstürzen.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> und der <code>CATCH<\/code>-Phaser kümmern sich um Fehler, die sofort geworfen werden.<\/span> <span class=\"sg\" data-s=\"5\">Die Wege auf dieser Seite kümmern sich um Fehler, die nicht sofort geworfen werden.<\/span><\/p>"]]},"nl":{"t":"Niet elke fout is onmiddellijk","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Standaard stopt een geworpen exceptie het programma meteen.<\/span> <span class=\"sg\" data-s=\"1\">Je vangt hem met <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Maar niet elke fout die fataal lijkt, stopt je programma echt meteen.<\/span> <span class=\"sg\" data-s=\"3\">Raku heeft mislukkingen die stil blijven.<\/span> <span class=\"sg\" data-s=\"4\">Sommige reageren pas als je het resultaat gebruikt.<\/span> <span class=\"sg\" data-s=\"5\">Bij andere kun je ze bekijken en gewoon doorgaan.<\/span> <span class=\"sg\" data-s=\"6\">Je hebt er in dit deel al twee gezien.<\/span> <span class=\"sg\" data-s=\"7\">Het loont om ze op één plek bij elkaar te zetten.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Een deling door nul.<\/strong> Delen door nul gaat niet mis op de plek waar het staat.<\/span> <span class=\"sg\" data-s=\"1\">De slechte waarde wordt gemaakt en stil bewaard.<\/span> <span class=\"sg\" data-s=\"2\">Ze werpt pas een exceptie wanneer je haar <em>gebruikt<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Dat gebeurt bijvoorbeeld als je haar afdrukt of omzet naar een ander type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dit uitgestelde gedrag en de <code>Failure<\/code>-objecten erachter zijn het onderwerp van <a href=\"https://course.raku.org/nl/oop/failures/\" target=\"_blank\" rel=\"noopener\">Zachte mislukkingen<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Een mislukkend extern programma.<\/strong> Stel dat <code>run<\/code> of <code>shell<\/code> een <code>Proc<\/code> teruggeeft voor een mislukt programma.<\/span> <span class=\"sg\" data-s=\"1\">Deze <code>Proc<\/code> werpt geen exceptie op het moment dat hij gemaakt wordt.<\/span> <span class=\"sg\" data-s=\"2\">Dat doet hij alleen als je hem <em>weggooit<\/em> zonder hem af te handelen.<\/span> <span class=\"sg\" data-s=\"3\">Bewaar hem en lees <code>.exitcode<\/code>, of test hem als boolean.<\/span> <span class=\"sg\" data-s=\"4\">Dan blijft de mislukking een gewone waarde waarop je kunt reageren.<\/span> <span class=\"sg\" data-s=\"5\">Je zag dit in <a href=\"https://course.raku.org/nl/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Het Proc-object<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Beide gevallen hebben één ding gemeen.<\/span> <span class=\"sg\" data-s=\"1\">Een mislukking kan <em>uitgesteld<\/em> worden, dat wil zeggen naar later geschoven.<\/span> <span class=\"sg\" data-s=\"2\">Ze wordt een waarde die je bekijkt wanneer je er klaar voor bent.<\/span> <span class=\"sg\" data-s=\"3\">Ze laat het programma niet meteen crashen.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> en de <code>CATCH<\/code>-faser gaan over fouten die meteen geworpen worden.<\/span> <span class=\"sg\" data-s=\"5\">De manieren op deze pagina gaan over fouten die niet meteen geworpen worden.<\/span><\/p>"]]},"es":{"t":"No todo error es inmediato","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Por defecto, una excepción lanzada detiene el programa enseguida.<\/span> <span class=\"sg\" data-s=\"1\">La capturas con <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pero no todo error que parece fatal detiene de verdad tu programa en ese mismo momento.<\/span> <span class=\"sg\" data-s=\"3\">Raku tiene fallos que se quedan callados.<\/span> <span class=\"sg\" data-s=\"4\">Algunos reaccionan solo cuando usas el resultado.<\/span> <span class=\"sg\" data-s=\"5\">Otros te dejan comprobarlos y seguir adelante.<\/span> <span class=\"sg\" data-s=\"6\">Ya has visto dos de ellos en esta parte.<\/span> <span class=\"sg\" data-s=\"7\">Vale la pena reunirlos en un solo lugar.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Una división por cero.<\/strong> Dividir por cero no falla donde está escrito.<\/span> <span class=\"sg\" data-s=\"1\">El valor malo se crea y se guarda en silencio.<\/span> <span class=\"sg\" data-s=\"2\">Solo lanza la excepción cuando lo <em>usas<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Por ejemplo, esto pasa cuando lo imprimes o lo conviertes en otro tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Este comportamiento retrasado y los objetos <code>Failure<\/code> que hay detrás son el tema de <a href=\"https://course.raku.org/es/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallos blandos<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programa externo que falla.<\/strong> Supón que <code>run<\/code> o <code>shell<\/code> devuelve un <code>Proc<\/code> de un programa que falló.<\/span> <span class=\"sg\" data-s=\"1\">Este <code>Proc<\/code> no lanza una excepción cuando se crea.<\/span> <span class=\"sg\" data-s=\"2\">Solo la lanza si lo <em>tiras<\/em> sin manejarlo.<\/span> <span class=\"sg\" data-s=\"3\">Guárdalo y lee <code>.exitcode<\/code>, o compruébalo como booleano.<\/span> <span class=\"sg\" data-s=\"4\">Entonces el fallo sigue siendo un valor simple al que puedes reaccionar.<\/span> <span class=\"sg\" data-s=\"5\">Lo viste en <a href=\"https://course.raku.org/es/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">El objeto Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Los dos casos tienen una cosa en común.<\/span> <span class=\"sg\" data-s=\"1\">Un fallo puede <em>aplazarse<\/em>, es decir, dejarse para más tarde.<\/span> <span class=\"sg\" data-s=\"2\">Se convierte en un valor que compruebas cuando estás listo.<\/span> <span class=\"sg\" data-s=\"3\">No hace que el programa se caiga enseguida.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> y el phaser <code>CATCH<\/code> se ocupan de los errores que se lanzan enseguida.<\/span> <span class=\"sg\" data-s=\"5\">Las formas de esta página se ocupan de los errores que no se lanzan enseguida.<\/span><\/p>"]]},"it":{"t":"Non ogni errore è immediato","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Di norma, un'eccezione sollevata ferma subito il programma.<\/span> <span class=\"sg\" data-s=\"1\">La intercetti con <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ma non tutti gli errori che sembrano fatali fermano davvero subito il tuo programma.<\/span> <span class=\"sg\" data-s=\"3\">Raku ha fallimenti che restano silenziosi.<\/span> <span class=\"sg\" data-s=\"4\">Alcuni reagiscono solo quando usi il risultato.<\/span> <span class=\"sg\" data-s=\"5\">Altri ti lasciano controllarli e andare avanti.<\/span> <span class=\"sg\" data-s=\"6\">Ne hai già visti due in questa parte.<\/span> <span class=\"sg\" data-s=\"7\">Vale la pena raccoglierli in un unico posto.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Una divisione per zero.<\/strong> Dividere per zero non fallisce dove è scritto.<\/span> <span class=\"sg\" data-s=\"1\">Il valore sbagliato viene creato e tenuto in silenzio.<\/span> <span class=\"sg\" data-s=\"2\">Solleva un'eccezione solo quando lo <em>usi<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Per esempio, succede quando lo stampi o lo converti in un altro tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Questo comportamento ritardato e gli oggetti <code>Failure<\/code> che ci stanno dietro sono l'argomento di <a href=\"https://course.raku.org/it/oop/failures/\" target=\"_blank\" rel=\"noopener\">Fallimenti morbidi<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Un programma esterno che fallisce.<\/strong> Supponiamo che <code>run<\/code> o <code>shell<\/code> restituisca un <code>Proc<\/code> per un programma fallito.<\/span> <span class=\"sg\" data-s=\"1\">Questo <code>Proc<\/code> non solleva un'eccezione quando viene creato.<\/span> <span class=\"sg\" data-s=\"2\">La solleva solo se lo <em>butti via<\/em> senza gestirlo.<\/span> <span class=\"sg\" data-s=\"3\">Conservalo e leggi <code>.exitcode<\/code>, o controllalo come Booleano.<\/span> <span class=\"sg\" data-s=\"4\">Allora il fallimento resta un valore semplice a cui puoi reagire.<\/span> <span class=\"sg\" data-s=\"5\">Lo hai visto in <a href=\"https://course.raku.org/it/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">L'oggetto Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">I due casi hanno una cosa in comune.<\/span> <span class=\"sg\" data-s=\"1\">Un fallimento può essere <em>differito<\/em>, cioè rimandato a più tardi.<\/span> <span class=\"sg\" data-s=\"2\">Diventa un valore che controlli quando sei pronto.<\/span> <span class=\"sg\" data-s=\"3\">Non fa crollare subito il programma.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> e il phaser <code>CATCH<\/code> si occupano degli errori sollevati subito.<\/span> <span class=\"sg\" data-s=\"5\">I modi di questa pagina si occupano degli errori che non vengono sollevati subito.<\/span><\/p>"]]},"lv":{"t":"Ne katra kļūda parādās uzreiz","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma izmests izņēmums uzreiz aptur programmu.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to noķerat ar <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Bet ne katra kļūda, kas izskatās liktenīga, tiešām uzreiz aptur jūsu programmu.<\/span> <span class=\"sg\" data-s=\"3\">Raku ir neveiksmes, kas paliek klusas.<\/span> <span class=\"sg\" data-s=\"4\">Dažas no tām reaģē tikai tad, kad jūs lietojat rezultātu.<\/span> <span class=\"sg\" data-s=\"5\">Citas ļauj jums tās pārbaudīt un turpināt darbu.<\/span> <span class=\"sg\" data-s=\"6\">Divas no tām jūs šajā daļā jau esat redzējuši.<\/span> <span class=\"sg\" data-s=\"7\">Ir vērts tās savākt vienuviet.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli.<\/strong> Dalīšana ar nulli nerada kļūdu tur, kur tā uzrakstīta.<\/span> <span class=\"sg\" data-s=\"1\">Sliktā vērtība tiek radīta un klusi paturēta.<\/span> <span class=\"sg\" data-s=\"2\">Tā izmet izņēmumu tikai tad, kad jūs to <em>izmantojat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Piemēram, tā notiek, kad jūs to izdrukājat vai pārvēršat citā tipā:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # no error here\nsay 'still running';\nsay $x;           # only now does it throw<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Par šo aizkavēto uzvedību un <code>Failure<\/code> objektiem aiz tās stāsta temats <a href=\"https://course.raku.org/lv/oop/failures/\" target=\"_blank\" rel=\"noopener\">Mīkstās neveiksmes<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma.<\/strong> Pieņemsim, ka <code>run<\/code> vai <code>shell<\/code> atgriež <code>Proc<\/code> programmai, kas neizdevās.<\/span> <span class=\"sg\" data-s=\"1\">Šis <code>Proc<\/code> neizmet izņēmumu, kad tas tiek radīts.<\/span> <span class=\"sg\" data-s=\"2\">Tas izmet izņēmumu tikai tad, ja jūs to <em>izmetat<\/em> bez apstrādes.<\/span> <span class=\"sg\" data-s=\"3\">Saglabājiet to un nolasiet <code>.exitcode<\/code> vai pārbaudiet to kā Būla vērtību.<\/span> <span class=\"sg\" data-s=\"4\">Tad neveiksme paliek vienkārša vērtība, uz kuru jūs varat reaģēt.<\/span> <span class=\"sg\" data-s=\"5\">To jūs redzējāt tematā <a href=\"https://course.raku.org/lv/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Proc objekts<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Abiem gadījumiem ir kas kopīgs.<\/span> <span class=\"sg\" data-s=\"1\">Neveiksmi var <em>atlikt<\/em>, tas ir, atstāt uz vēlāku laiku.<\/span> <span class=\"sg\" data-s=\"2\">Tā kļūst par vērtību, ko jūs pārbaudāt, kad esat gatavi.<\/span> <span class=\"sg\" data-s=\"3\">Tā neizraisa programmas avāriju uzreiz.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> un fāzeris <code>CATCH<\/code> tiek galā ar kļūdām, kas tiek izmestas uzreiz.<\/span> <span class=\"sg\" data-s=\"5\">Šīs lapas veidi tiek galā ar kļūdām, kas netiek izmestas uzreiz.<\/span><\/p>"]]},"ru":{"t":"Не всякая ошибка возникает сразу","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">По умолчанию брошенное исключение сразу останавливает программу.<\/span> <span class=\"sg\" data-s=\"1\">Вы перехватываете его с помощью <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но не каждая ошибка, которая выглядит фатальной, на самом деле сразу останавливает программу.<\/span> <span class=\"sg\" data-s=\"3\">В Raku есть сбои, которые ведут себя тихо.<\/span> <span class=\"sg\" data-s=\"4\">Одни из них реагируют, только когда вы используете результат.<\/span> <span class=\"sg\" data-s=\"5\">Другие позволяют проверить их и продолжить работу.<\/span> <span class=\"sg\" data-s=\"6\">Два из них вы уже видели в этой части.<\/span> <span class=\"sg\" data-s=\"7\">Стоит собрать их в одном месте.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль.<\/strong> Деление на ноль не даёт сбоя там, где оно записано.<\/span> <span class=\"sg\" data-s=\"1\">Плохое значение создаётся и тихо хранится.<\/span> <span class=\"sg\" data-s=\"2\">Оно бросает исключение, только когда вы его <em>используете<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Например, так бывает, когда вы его печатаете или превращаете в другой тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # здесь ошибки нет\nsay 'still running';\nsay $x;           # только теперь бросается исключение<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Об этом отложенном поведении и об объектах <code>Failure<\/code>, которые стоят за ним, рассказывает тема <a href=\"https://course.raku.org/ru/oop/failures/\" target=\"_blank\" rel=\"noopener\">Мягкие сбои<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Внешняя программа, которая дала сбой.<\/strong> Допустим, <code>run<\/code> или <code>shell<\/code> возвращает <code>Proc<\/code> для программы, которая не сработала.<\/span> <span class=\"sg\" data-s=\"1\">Этот <code>Proc<\/code> не бросает исключение, когда его создают.<\/span> <span class=\"sg\" data-s=\"2\">Он бросает его, только если вы его <em>выбросите<\/em> и не обработаете.<\/span> <span class=\"sg\" data-s=\"3\">Сохраните его и прочитайте <code>.exitcode<\/code> или проверьте его как булево значение.<\/span> <span class=\"sg\" data-s=\"4\">Тогда сбой останется простым значением, на которое можно отреагировать.<\/span> <span class=\"sg\" data-s=\"5\">Вы видели это в теме <a href=\"https://course.raku.org/ru/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Объект Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">У обоих случаев есть одна общая черта.<\/span> <span class=\"sg\" data-s=\"1\">Сбой может быть <em>отложен<\/em>, то есть оставлен на потом.<\/span> <span class=\"sg\" data-s=\"2\">Он становится значением, которое вы проверяете, когда готовы.<\/span> <span class=\"sg\" data-s=\"3\">Программа из-за него не падает сразу.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> и фазер <code>CATCH<\/code> работают с ошибками, которые бросаются сразу.<\/span> <span class=\"sg\" data-s=\"5\">Способы с этой страницы работают с ошибками, которые не бросаются сразу.<\/span><\/p>"]]},"uk":{"t":"Не кожна помилка негайна","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням кинутий виняток одразу зупиняє програму.<\/span> <span class=\"sg\" data-s=\"1\">Ви перехоплюєте його через <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Але не кожна помилка, яка здається фатальною, справді одразу зупиняє вашу програму.<\/span> <span class=\"sg\" data-s=\"3\">У Raku є збої, які поводяться тихо.<\/span> <span class=\"sg\" data-s=\"4\">Деякі з них реагують лише тоді, коли ви використовуєте результат.<\/span> <span class=\"sg\" data-s=\"5\">Інші дозволяють вам перевірити їх і працювати далі.<\/span> <span class=\"sg\" data-s=\"6\">Два з них ви вже бачили в цій частині.<\/span> <span class=\"sg\" data-s=\"7\">Варто зібрати їх в одному місці.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль.<\/strong> Ділення на нуль не падає там, де його записано.<\/span> <span class=\"sg\" data-s=\"1\">Погане значення створюється й тихо зберігається.<\/span> <span class=\"sg\" data-s=\"2\">Воно кидає виняток, лише коли ви його <em>використовуєте<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Наприклад, це стається, коли ви його виводите або перетворюєте на інший тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тут помилки немає\nsay 'still running';\nsay $x;           # ось тепер вона кидається<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ця відкладена поведінка та об'єкти <code>Failure<\/code>, що за нею стоять, — тема розділу <a href=\"https://course.raku.org/uk/oop/failures/\" target=\"_blank\" rel=\"noopener\">М'які збої<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, яка не спрацювала.<\/strong> Припустімо, <code>run<\/code> чи <code>shell<\/code> повертає <code>Proc<\/code> для невдалої програми.<\/span> <span class=\"sg\" data-s=\"1\">Цей <code>Proc<\/code> не кидає винятку, коли його створено.<\/span> <span class=\"sg\" data-s=\"2\">Він кидає виняток, лише якщо ви його <em>викидаєте<\/em> без обробки.<\/span> <span class=\"sg\" data-s=\"3\">Збережіть його й прочитайте <code>.exitcode<\/code> або перевірте його як булеве значення.<\/span> <span class=\"sg\" data-s=\"4\">Тоді збій лишається простим значенням, на яке можна відреагувати.<\/span> <span class=\"sg\" data-s=\"5\">Ви бачили це в темі <a href=\"https://course.raku.org/uk/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Об'єкт Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обидва випадки мають одну спільну рису.<\/span> <span class=\"sg\" data-s=\"1\">Збій можна <em>відкласти<\/em>, тобто перенести на пізніше.<\/span> <span class=\"sg\" data-s=\"2\">Він стає значенням, яке ви перевіряєте, коли готові.<\/span> <span class=\"sg\" data-s=\"3\">Програма через нього одразу не падає.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> і фазер <code>CATCH<\/code> мають справу з помилками, які кидаються одразу.<\/span> <span class=\"sg\" data-s=\"5\">Способи з цієї сторінки мають справу з помилками, які не кидаються одразу.<\/span><\/p>"]]},"bg":{"t":"Не всяка грешка е незабавна","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">По подразбиране хвърленото изключение спира програмата веднага.<\/span> <span class=\"sg\" data-s=\"1\">Прихващате го с <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Но не всяка грешка, която изглежда фатална, наистина спира програмата ви веднага.<\/span> <span class=\"sg\" data-s=\"3\">Raku има провали, които остават тихи.<\/span> <span class=\"sg\" data-s=\"4\">Някои от тях реагират едва когато използвате резултата.<\/span> <span class=\"sg\" data-s=\"5\">Други ви позволяват да ги проверите и да продължите.<\/span> <span class=\"sg\" data-s=\"6\">Вече видяхте два от тях в тази част.<\/span> <span class=\"sg\" data-s=\"7\">Струва си да ги съберем на едно място.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на нула.<\/strong> Делението на нула не дава грешка там, където е написано.<\/span> <span class=\"sg\" data-s=\"1\">Лошата стойност се създава и се пази тихо.<\/span> <span class=\"sg\" data-s=\"2\">Тя хвърля изключение едва когато я <em>използвате<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Например това става, когато я отпечатате или я превърнете в друг тип:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # тук няма грешка\nsay 'still running';\nsay $x;           # чак сега хвърля<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Това отложено поведение и обектите <code>Failure<\/code> зад него са тема на <a href=\"https://course.raku.org/bg/oop/failures/\" target=\"_blank\" rel=\"noopener\">Меки провали<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма.<\/strong> Да кажем, че <code>run<\/code> или <code>shell<\/code> връща <code>Proc<\/code> за провалила се програма.<\/span> <span class=\"sg\" data-s=\"1\">Този <code>Proc<\/code> не хвърля изключение, когато бъде създаден.<\/span> <span class=\"sg\" data-s=\"2\">Той хвърля изключение само ако го <em>изхвърлите<\/em>, без да го обработите.<\/span> <span class=\"sg\" data-s=\"3\">Запазете го и прочетете <code>.exitcode<\/code> или го проверете като булева стойност.<\/span> <span class=\"sg\" data-s=\"4\">Тогава провалът остава проста стойност, на която можете да реагирате.<\/span> <span class=\"sg\" data-s=\"5\">Видяхте това в <a href=\"https://course.raku.org/bg/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Обектът Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Двата случая имат нещо общо.<\/span> <span class=\"sg\" data-s=\"1\">Провалът може да бъде <em>отложен<\/em>, тоест оставен за по-късно.<\/span> <span class=\"sg\" data-s=\"2\">Той става стойност, която проверявате, когато сте готови.<\/span> <span class=\"sg\" data-s=\"3\">Той не срива програмата веднага.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> и фазерът <code>CATCH<\/code> се занимават с грешките, които се хвърлят веднага.<\/span> <span class=\"sg\" data-s=\"5\">Начините на тази страница се занимават с грешките, които не се хвърлят веднага.<\/span><\/p>"]]},"eo":{"t":"Ne ĉiu eraro estas tuja","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, ĵetita escepto tuj haltigas la programon.<\/span> <span class=\"sg\" data-s=\"1\">Vi kaptas ĝin per <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sed ne ĉiu eraro, kiu aspektas fatala, vere haltigas vian programon tuj.<\/span> <span class=\"sg\" data-s=\"3\">Raku havas misfunkciojn, kiuj restas kvietaj.<\/span> <span class=\"sg\" data-s=\"4\">Kelkaj el ili reagas nur, kiam vi uzas la rezulton.<\/span> <span class=\"sg\" data-s=\"5\">Aliaj lasas vin kontroli ilin kaj daŭrigi.<\/span> <span class=\"sg\" data-s=\"6\">Vi jam vidis du el ili en ĉi tiu parto.<\/span> <span class=\"sg\" data-s=\"7\">Indas kolekti ilin en unu loko.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Divido per nulo.<\/strong> Dividi per nulo ne malsukcesas tie, kie ĝi estas skribita.<\/span> <span class=\"sg\" data-s=\"1\">La malbona valoro estas farata kaj kviete tenata.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ĵetas nur, kiam vi <em>uzas<\/em> ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Ekzemple, tio okazas, kiam vi presas ĝin aŭ konvertas ĝin al alia tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # neniu eraro ĉi tie\nsay 'still running';\nsay $x;           # nur nun ĝi ĵetas<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu prokrastita konduto kaj la objektoj <code>Failure<\/code> malantaŭ ĝi estas la temo de <a href=\"https://course.raku.org/eo/oop/failures/\" target=\"_blank\" rel=\"noopener\">Molaj misfunkcioj<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Malsukcesanta ekstera programo.<\/strong> Supozu, ke <code>run<\/code> aŭ <code>shell<\/code> redonas <code>Proc<\/code> por malsukcesinta programo.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu <code>Proc<\/code> ne ĵetas, kiam ĝi estas kreata.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ĵetas nur, se vi <em>forĵetas ĝin<\/em> sen trakti ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Konservu ĝin kaj legu <code>.exitcode<\/code>, aŭ testu ĝin kiel Boolean valoron.<\/span> <span class=\"sg\" data-s=\"4\">Tiam la misfunkcio restas simpla valoro, al kiu vi povas reagi.<\/span> <span class=\"sg\" data-s=\"5\">Vi vidis tion en <a href=\"https://course.raku.org/eo/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">La objekto Proc<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ kazoj havas unu komunan aferon.<\/span> <span class=\"sg\" data-s=\"1\">Misfunkcio povas esti <em>prokrastita<\/em>, tio estas, lasita por poste.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi fariĝas valoro, kiun vi kontrolas, kiam vi estas preta.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne tuj kolapsigas la programon.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> kaj la fazero <code>CATCH<\/code> traktas erarojn, kiuj estas ĵetataj tuj.<\/span> <span class=\"sg\" data-s=\"5\">La manieroj sur ĉi tiu paĝo traktas erarojn, kiuj ne estas ĵetataj tuj.<\/span><\/p>"]]},"la":{"t":"Non omnis error statim apparet","b":[["p",8,"<p><span class=\"sg\" data-s=\"0\">Ex more exceptio iacta programma statim sistit.<\/span> <span class=\"sg\" data-s=\"1\">Eam per <code>try<\/code> capis.<\/span> <span class=\"sg\" data-s=\"2\">Sed non omnis error qui fatalis videtur programma tuum vere statim sistit.<\/span> <span class=\"sg\" data-s=\"3\">Raku defectus habet qui taciti manent.<\/span> <span class=\"sg\" data-s=\"4\">Quidam eorum solum reagunt cum effectum adhibes.<\/span> <span class=\"sg\" data-s=\"5\">Alii te sinunt eos probare et pergere.<\/span> <span class=\"sg\" data-s=\"6\">Duos eorum iam in hac parte vidisti.<\/span> <span class=\"sg\" data-s=\"7\">Utile est eos uno loco colligere.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><strong>Divisio per nihil.<\/strong> Divisio per nihil non deficit ubi scripta est.<\/span> <span class=\"sg\" data-s=\"1\">Valor malus fit et tacite servatur.<\/span> <span class=\"sg\" data-s=\"2\">Solum iacit cum eum <em>adhibes<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Exempli gratia, hoc fit cum eum imprimis aut in alium typum convertis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;    # nullus error hic\nsay 'still running';\nsay $x;           # solum nunc iacit<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Haec reactio dilata et obiecta <code>Failure<\/code> post eam sunt argumentum paginae <a href=\"https://course.raku.org/la/oop/failures/\" target=\"_blank\" rel=\"noopener\">Defectus molles<\/a>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\"><strong>Programma externum deficiens.<\/strong> Finge <code>run<\/code> vel <code>shell<\/code> obiectum <code>Proc<\/code> pro programmate quod defecit reddere.<\/span> <span class=\"sg\" data-s=\"1\">Hoc <code>Proc<\/code> non iacit cum creatur.<\/span> <span class=\"sg\" data-s=\"2\">Solum iacit si id sine tractatione <em>abicis<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Serva id et <code>.exitcode<\/code> lege, aut id ut valorem Booleanum proba.<\/span> <span class=\"sg\" data-s=\"4\">Tum defectus manet valor simplex ad quem reagere potes.<\/span> <span class=\"sg\" data-s=\"5\">Hoc in <a href=\"https://course.raku.org/la/oop/external-programs/the-proc-object/\" target=\"_blank\" rel=\"noopener\">Obiecto Proc<\/a> vidisti.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ambo casus unam rem communem habent.<\/span> <span class=\"sg\" data-s=\"1\">Defectus <em>differri<\/em> potest, id est in tempus posterius moveri.<\/span> <span class=\"sg\" data-s=\"2\">Fit valor quem, cum paratus es, probas.<\/span> <span class=\"sg\" data-s=\"3\">Programma non statim frangit.<\/span> <span class=\"sg\" data-s=\"4\"><code>try<\/code> et fasis <code>CATCH<\/code> cum erroribus agunt qui statim iaciuntur.<\/span> <span class=\"sg\" data-s=\"5\">Modi in hac pagina cum erroribus agunt qui non statim iaciuntur.<\/span><\/p>"]]}}}</script>
