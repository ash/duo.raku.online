-s=\"5\">Tātad vienīgā izdrukātā rinda ir <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ja jūs ieskatītos, jūs redzētu, ka <code>$r<\/code> ir nedefinēts.<\/span> <span class=\"sg\" data-s=\"7\">Paziņojums <code>Boom!<\/code> gaidītu mainīgajā <code>$!<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"ru":{"t":"Тест — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Что выведет следующая программа?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">сначала inside, потом outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">ошибка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Здесь происходят две вещи.<\/span> <span class=\"sg\" data-s=\"1\">Во-первых, <code>die<\/code> сразу прерывает остаток блока <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому строка <code>say 'inside'<\/code> так и не выполняется, и изнутри блока ничего не печатается.<\/span> <span class=\"sg\" data-s=\"3\">Во-вторых, <code>try<\/code> перехватывает исключение, поэтому сама программа не останавливается.<\/span> <span class=\"sg\" data-s=\"4\">Она продолжает работу после блока, и <code>say 'outside'<\/code> выполняется как обычно.<\/span> <span class=\"sg\" data-s=\"5\">Значит, напечатана будет только одна строка — <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Если бы вы посмотрели, вы бы увидели, что <code>$r<\/code> не определён.<\/span> <span class=\"sg\" data-s=\"7\">А сообщение <code>Boom!<\/code> ждало бы в <code>$!<\/code>.<\/sp uiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, после outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">грешка<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Тук се случват две неща.<\/span> <span class=\"sg\" data-s=\"1\">Първо, <code>die<\/code> спира веднага остатъка от блока <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова редът <code>say 'inside'<\/code> никога не се изпълнява и отвътре в блока не се отпечатва нищо.<\/span> <span class=\"sg\" data-s=\"3\">Второ, <code>try<\/code> прихваща изключението, така че самата програма не спира.<\/span> <span class=\"sg\" data-s=\"4\">Тя продължава след блока и <code>say 'outside'<\/code> се изпълнява както обикновено.<\/span> <span class=\"sg\" data-s=\"5\">Затова единственият отпечатан ред е <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Ако погледнете, ще видите, че <code>$r<\/code> е недефинирана.<\/span> <span class=\"sg\" data-s=\"7\">Съобщението <code>Boom!<\/code> би чакало в <code>$!<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"eo":{"t":"Kvizo — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Kion presas la jena programo?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside poste outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">eraron<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Du aferoj okazas ĉi tie.<\/span> <span class=\"sg\" data-s=\"1\">Unue, <code>die<\/code> tuj haltigas la reston de la bloko <code>try<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do la linio <code>say 'inside'<\/code> neniam ruliĝas, kaj nenio el la bloko estas presata.<\/span> <span class=\"sg\" data-s=\"3\">Due, <code>try<\/code> kaptas la escepton, do la programo mem ne haltas.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi daŭras post la bloko, kaj <code>say 'outside'<\/code> ruliĝas kiel kutime.<\/span> <span class=\"sg\" data-s=\"5\">Do la sola presita linio estas <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Se vi rigardus, vi vidus, ke <code>$r<\/code> estas nedifinita.<\/span> <span class=\"sg\" data-s=\"7\">La mesaĝo <code>Boom!<\/code> atendus en <code>$!<\/code>.<\/span><\/p>"],["raw",0,"<\/div>"]]},"la":{"t":"Quiz — <code>try<\/code>","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Quid haec programma imprimit?<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $r = try {\n    die 'Boom!';\n    say 'inside';\n};\n\nsay 'outside';<\/code><\/pre>"],["quiz",5,"<ul class=\"quiz\"><li class=\"quiz-opt is-right\"><span class=\"sg\" data-s=\"0\">outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"1\">inside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"2\">inside, deinde outside<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"3\">Boom!<\/span><\/li><li class=\"quiz-opt\"><span class=\"sg\" data-s=\"4\">errorem<\/span><\/li><\/ul>"],["raw",0,"<div class=\"extended-explanation\">"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Duae res hic fiunt.<\/span> <span class=\"sg\" data-s=\"1\">Primum <code>die<\/code> reliquam partem clausulae <code>try<\/code> statim sistit.<\/span> <span class=\"sg\" data-s=\"2\">Itaque linea <code>say 'inside'<\/code> numquam currit, et nihil ex clausula imprimitur.<\/span> <span class=\"sg\" data-s=\"3\">Secundo <code>try<\/code> exceptionem capit, itaque ipsum programma non sistit.<\/span> <span class=\"sg\" data-s=\"4\">Post clausulam pergit, et <code>say 'outside'<\/code> ut solet currit.<\/span> <span class=\"sg\" data-s=\"5\">Itaque sola linea impressa est <code>outside<\/code>.<\/span> <span class=\"sg\" data-s=\"6\">Si inspiceres, videres <code>$r<\/code> indefinitum esse.<\/span> <span class=\"sg\" data-s=\"7\">Nuntius <code>Boom!<\/code> in <code>$!<\/code> exspectaret.<\/span><\/p>"],["raw",0,"<\/div>"]]}}}</script>
