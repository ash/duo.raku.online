\">Das Löschen passiert sofort und ist endgültig.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt keinen Papierkorb, aus dem Sie die Datei zurückholen können.<\/span> <span class=\"sg\" data-s=\"2\">Beachten Sie noch etwas zu einer gelöschten Datei.<\/span> <span class=\"sg\" data-s=\"3\">Sie müssen sie mit <code>.e<\/code> (Existenz) prüfen, nicht mit <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Die Typprüfungen <code>.f<\/code> und <code>.d<\/code> werfen einen Fehler, wenn der Pfad nicht da ist.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>rmdir<\/code> entfernt ein Verzeichnis, aber nur ein <strong>leeres<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn noch etwas im Verzeichnis ist, entfernt <code>rmdir<\/code> nichts.<\/span> <span class=\"sg\" data-s=\"1\">Das Verzeichnis bleibt, wo es ist.<\/span> <span class=\"sg\" data-s=\"2\">Um ein Verzeichnis mit Dateien zu löschen, leeren Sie es also zuerst und entfernen es dann:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> listet die Einträge des Verzeichnisses auf, wie Sie im vorigen Thema gesehen haben.<\/span> <span class=\"sg\" data-s=\"1\">Ein Aufruf von <code>.unlink<\/code> für jeden Eintrag entfernt ihn.<\/span> <span class=\"sg\" data-s=\"2\">Wenn das Verzeichnis leer ist, kann <code>rmdir<\/code> das Verzeichnis entfernen.<\/span> <span class=\"sg\" data-s=\"3\">Beachten Sie, dass diese einfache Schleife nur Dateien im Verzeichnis erwartet.<\/span> <span class=\"sg\" data- "p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> e <code>mkdir<\/code> creano cose su disco, e altre due routine le rimuovono.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>unlink<\/code> cancella un file:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> cancella il file con il nome dato.<\/span> <span class=\"sg\" data-s=\"1\">Come le altre routine del file system, ha anche una forma a metodo.<\/span> <span class=\"sg\" data-s=\"2\">Lo chiami su un oggetto percorso: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La cancellazione avviene subito ed è definitiva.<\/span> <span class=\"sg\" data-s=\"1\">Non c'è un cestino da cui riprendere il file.<\/span> <span class=\"sg\" data-s=\"2\">Nota ancora una cosa su un file cancellato.<\/span> <span class=\"sg\" data-s=\"3\">Devi controllarlo con <code>.e<\/code> (esistenza), non con <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">I test di tipo <code>.f<\/code> e <code>.d<\/code> danno un errore se il percorso non c'è.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>rmdir<\/code> rimuove una directory, ma solo se <strong>vuota<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se nella directory c'è ancora qualcosa, <code>rmdir<\/code> non rimuove niente.<\/span> <span class=\"sg\" data-s=\"1\">La directory resta dov'è.<\/span> <span class=\"sg\" data-s=\"2\">Quindi, per cancellare una directory con dei file, prima svuotala e poi rimuovila:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> elenca le voci della directory, come hai visto nell'argomento precedente.<\/span> <span class=\"sg\" data-s=\"1\">Chiamare <code>.unlink<\/code> su ogni voce la rimuove.<\/span> <span class=\"sg\" data-s=\"2\">Quando la directory è vuota, <code>rmdir<\/code> può rimuoverla.<\/span> <span class=\"sg\" data-s=\"3\">Nota che questo ciclo semplice si aspetta che la directory contenga solo file.<\/span> <span class=\"sg\" data-s=\"4\">Un albero di sottodirectory annidate avrebbe bisogno della ricorsione per svuotarle prima.<\/span><\/p>"]]},"lv":{"t":"Failu un direktoriju dzēšana","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> un <code>mkdir<\/code> rada lietas uz diska, un divas citas rutīnas tās noņem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>unlink<\/code> dzēš failu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> izdzēš failu ar doto nosaukumu.<\/span> <span class=\"sg\" data-s=\"1\">Tāpat kā pārējām failu sistēmas rutīnām, arī tai ir metodes forma.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to izsaucat uz ceļa objekta: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Dzēšana notiek uzreiz un ir neatgriezeniska.<\/span> <span class=\"sg\" data-s=\"1\">Nav miskastes, no kuras failu varētu dabūt atpakaļ.<\/span> <span class=\"sg\" data-s=\"2\">Ievērojiet vēl vienu lietu par izdzēstu failu.<\/span> <span class=\"sg\" data-s=\"3\">Jums tas jāpārbauda ar <code>.e<\/code> (esamība), nevis ar <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tipa pārbaudes <code>.f<\/code> un <code>.d<\/code> izmet kļūdu, ja ceļa nav.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>rmdir<\/code> noņem direktoriju, taču tikai <strong>tukšu<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ja direktorijā vēl kaut kas ir, <code>rmdir<\/code> neko nenoņem.<\/span> <span class=\"sg\" data-s=\"1\">Direktorija paliek, kur bija.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc, lai izdzēstu direktoriju ar failiem, vispirms to iztukšojiet un tad noņemiet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # delete every entry\nrmdir 'reports';                # now the directory is empty\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> uzskaita direktorijas ierakstus, kā jūs redzējāt iepriekšējā tematā.<\/span> <span class=\"sg\" data-s=\"1\"><code>.unlink<\/code> izsaukums uz katra ieraksta to noņem.<\/span> <span class=\"sg\" data-s=\"2\">Kad direktorija ir tukša, <code>rmdir<\/code> var to noņemt.<\/span> <span class=\"sg\" data-s=\"3\">Ievērojiet, ka šis vienkāršais cikls sagaida, ka direktorijā ir tikai faili.<\/span> <span class=\"sg\" data-s=\"4\">Kokam ar ligzdotām apakšdirektorijām vajadzētu rekursiju, lai tās vispirms iztukšotu.<\/span><\/p>"]]},"ru":{"t":"Удаление файлов и каталогов","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> и <code>mkdir<\/code> создают что-то на диске, а две другие процедуры это удаляют.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>unlink<\/code> удаляет файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> удаляет файл с указанным именем.<\/span> <span class=\"sg\" data-s=\"1\">Как и у других процедур для файловой системы, у неё есть и форма метода.<\/span> <span class=\"sg\" data-s=\"2\">Её вызывают у объекта пути: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Удаление происходит сразу и навсегда.<\/span> <span class=\"sg\" data-s=\"1\">Нет корзины, из которой можно вернуть файл.<\/span> <span class=\"sg\" data-s=\"2\">Заметьте ещё одну вещь об удалённом файле.<\/span> <span class=\"sg\" data-s=\"3\">Проверять его нужно через <code>.e<\/code> (существование), а не через <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Проверки типа <code>.f<\/code> и <code>.d<\/code> выдают ошибку, если пути нет.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>rmdir<\/code> удаляет каталог, но только <strong>пустой<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если в каталоге ещё что-то есть, <code>rmdir<\/code> ничего не удаляет.<\/span> <span class=\"sg\" data-s=\"1\">Каталог остаётся на месте.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому, чтобы удалить каталог с файлами, сначала очистите его, а потом удалите:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # удаляем все записи\nrmdir 'reports';                # теперь каталог пуст\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> выдаёт список записей каталога, как вы видели в предыдущей теме.<\/span> <span class=\"sg\" data-s=\"1\">Вызов <code>.unlink<\/code> у каждой записи удаляет её.<\/span> <span class=\"sg\" data-s=\"2\">Когда каталог пуст, <code>rmdir<\/code> может его удалить.<\/span> <span class=\"sg\" data-s=\"3\">Заметьте, что этот простой цикл ожидает в каталоге только файлы.<\/span> <span class=\"sg\" data-s=\"4\">Для дерева вложенных подкаталогов понадобилась бы рекурсия, чтобы сначала очистить их.<\/span><\/p>"]]},"uk":{"t":"Видалення файлів і каталогів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> і <code>mkdir<\/code> створюють щось на диску, а дві інші підпрограми це видаляють.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>unlink<\/code> видаляє файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> видаляє файл із вказаним ім'ям.<\/span> <span class=\"sg\" data-s=\"1\">Як і інші підпрограми файлової системи, він має також форму методу.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте його для об'єкта шляху: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Видалення відбувається відразу й назавжди.<\/span> <span class=\"sg\" data-s=\"1\">Немає кошика, з якого можна повернути файл.<\/span> <span class=\"sg\" data-s=\"2\">Зверніть увагу ще на одне щодо видаленого файлу.<\/span> <span class=\"sg\" data-s=\"3\">Перевіряти його треба через <code>.e<\/code> (існування), а не через <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Перевірки типу <code>.f<\/code> і <code>.d<\/code> дають помилку, якщо шляху немає.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>rmdir<\/code> вилучає каталог, але лише <strong>порожній<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Якщо в каталозі ще щось є, <code>rmdir<\/code> нічого не видаляє.<\/span> <span class=\"sg\" data-s=\"1\">Каталог лишається на своєму місці.<\/span> <span class=\"sg\" data-s=\"2\">Тож щоб видалити каталог із файлами, спершу спорожніть його, а потім видаліть:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # видалити кожен запис\nrmdir 'reports';                # тепер каталог порожній\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> перелічує записи каталогу, як ви бачили в попередній темі.<\/span> <span class=\"sg\" data-s=\"1\">Виклик <code>.unlink<\/code> для кожного запису видаляє його.<\/span> <span class=\"sg\" data-s=\"2\">Коли каталог порожній, <code>rmdir<\/code> може його видалити.<\/span> <span class=\"sg\" data-s=\"3\">Зверніть увагу, що цей простий цикл очікує в каталозі лише файли.<\/span> <span class=\"sg\" data-s=\"4\">Для дерева з вкладеними підкаталогами потрібна рекурсія, щоб спершу їх спорожнити.<\/span><\/p>"]]},"bg":{"t":"Изтриване на файлове и директории","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> и <code>mkdir<\/code> създават неща на диска, а две други процедури ги премахват.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>unlink<\/code> изтрива файл:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> изтрива файла с даденото име.<\/span> <span class=\"sg\" data-s=\"1\">Както другите процедури за файловата система, той има и форма на метод.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате метода върху обект-път: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Изтриването става веднага и е окончателно.<\/span> <span class=\"sg\" data-s=\"1\">Няма кошче, от което да върнете файла.<\/span> <span class=\"sg\" data-s=\"2\">Забележете още нещо за изтрития файл.<\/span> <span class=\"sg\" data-s=\"3\">Трябва да проверявате за него с <code>.e<\/code> (съществуване), а не с <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Проверките за тип <code>.f<\/code> и <code>.d<\/code> хвърлят грешка, ако пътят не съществува.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>rmdir<\/code> премахва директория, но само <strong>празна<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ако в директорията още има нещо, <code>rmdir<\/code> не премахва нищо.<\/span> <span class=\"sg\" data-s=\"1\">Директорията остава на мястото си.<\/span> <span class=\"sg\" data-s=\"2\">Затова, за да изтриете директория с файлове, първо я изпразнете и после я премахнете:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # изтриваме всеки елемент\nrmdir 'reports';                # сега директорията е празна\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> изброява елементите на директорията, както видяхте в предишната тема.<\/span> <span class=\"sg\" data-s=\"1\">Извикването на <code>.unlink<\/code> върху всеки елемент го премахва.<\/span> <span class=\"sg\" data-s=\"2\">Когато директорията е празна, <code>rmdir<\/code> може да я премахне.<\/span> <span class=\"sg\" data-s=\"3\">Забележете, че този прост цикъл очаква в директорията да има само файлове.<\/span> <span class=\"sg\" data-s=\"4\">За дърво от вложени поддиректории ще трябва рекурсия, за да ги изпразните първо.<\/span><\/p>"]]},"eo":{"t":"Forigi dosierojn kaj dosierujojn","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> kaj <code>mkdir<\/code> kreas aferojn sur disko, kaj du aliaj rutinoj forigas ilin.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>unlink<\/code> forigas dosieron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> forigas la dosieron kun la donita nomo.<\/span> <span class=\"sg\" data-s=\"1\">Kiel la aliaj dosiersistemaj rutinoj, ĝi ankaŭ havas metodan formon.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas ĝin sur vojobjekto: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Forigo okazas tuj kaj estas definitiva.<\/span> <span class=\"sg\" data-s=\"1\">Ne estas rubujo, el kiu vi povus rehavi la dosieron.<\/span> <span class=\"sg\" data-s=\"2\">Notu ankoraŭ unu aferon pri forigita dosiero.<\/span> <span class=\"sg\" data-s=\"3\">Vi devas kontroli ĝin per <code>.e<\/code> (ekzisto), ne per <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">La tipaj testoj <code>.f<\/code> kaj <code>.d<\/code> ĵetas eraron, se la vojo ne estas tie.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>rmdir<\/code> forigas dosierujon, sed nur <strong>malplenan<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Se la dosierujo ankoraŭ havas ion en si, <code>rmdir<\/code> forigas nenion.<\/span> <span class=\"sg\" data-s=\"1\">La dosierujo restas, kie ĝi estas.<\/span> <span class=\"sg\" data-s=\"2\">Do por forigi dosierujon kun dosieroj, unue malplenigu ĝin, kaj poste forigu ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # forigu ĉiun eron\nrmdir 'reports';                # nun la dosierujo estas malplena\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> listigas la erojn de la dosierujo, kiel vi vidis en la antaŭa temo.<\/span> <span class=\"sg\" data-s=\"1\">Voki <code>.unlink<\/code> sur ĉiu ero forigas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Kiam la dosierujo estas malplena, <code>rmdir<\/code> povas forigi ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Notu, ke ĉi tiu simpla buklo atendas, ke la dosierujo enhavas nur dosierojn.<\/span> <span class=\"sg\" data-s=\"4\">Arbo de nestitaj subdosierujoj bezonus rekursion por unue malplenigi ilin.<\/span><\/p>"]]},"la":{"t":"Plicas et directoria delere","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\"><code>spurt<\/code> et <code>mkdir<\/code> res in disco creant, et duae aliae procedurae eas removent.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>unlink<\/code> archivum delet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'temp.txt', 'scratch data';\nsay 'temp.txt'.IO.e; # True\n\nunlink 'temp.txt';\nsay 'temp.txt'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>unlink<\/code> archivum cum nomine dato delet.<\/span> <span class=\"sg\" data-s=\"1\">Sicut ceterae procedurae systematis archivorum, etiam formam methodi habet.<\/span> <span class=\"sg\" data-s=\"2\">Eam in obiecto semitae vocas: <code>'temp.txt'.IO.unlink<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Deletio statim fit et perpetua est.<\/span> <span class=\"sg\" data-s=\"1\">Nullum quisquiliarium est unde archivum recuperes.<\/span> <span class=\"sg\" data-s=\"2\">Nota etiam unam rem de archivo deleto.<\/span> <span class=\"sg\" data-s=\"3\">Id per <code>.e<\/code> (exsistentiam) probare debes, non per <code>.f<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Probationes generis <code>.f<\/code> et <code>.d<\/code> errorem dant si semita non adest.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>rmdir<\/code> directoriam removet, sed solum <strong>vacuam<\/strong>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nrmdir 'reports';\nsay 'reports'.IO.e; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Si in directoria adhuc aliquid est, <code>rmdir<\/code> nihil removet.<\/span> <span class=\"sg\" data-s=\"1\">Directoria manet ubi est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque ut directoriam cum archivis deleas, primum eam vacuam fac, deinde eam remove:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>mkdir 'reports';\nspurt 'reports/jan.txt', 'January';\nspurt 'reports/feb.txt', 'February';\n\n.unlink for 'reports'.IO.dir;   # omnem ingressum dele\nrmdir 'reports';                # nunc directoria vacua est\nsay 'reports'.IO.e;             # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\"><code>'reports'.IO.dir<\/code> ingressus directoriae enumerat, ut in argumento superiore vidisti.<\/span> <span class=\"sg\" data-s=\"1\">Si <code>.unlink<\/code> in unoquoque ingressu vocas, eum removet.<\/span> <span class=\"sg\" data-s=\"2\">Cum directoria vacua est, <code>rmdir<\/code> eam removere potest.<\/span> <span class=\"sg\" data-s=\"3\">Nota hunc anulum simplicem sola archiva in directoria exspectare.<\/span> <span class=\"sg\" data-s=\"4\">Arbor cum directoriis nidificatis recursionem requireret, quae eas primum vacuas faceret.<\/span><\/p>"]]}}}</script>
