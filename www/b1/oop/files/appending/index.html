<script type="application/json" id="page-data">{"u":"oop/files/appending","n":870,"k":"topic","pv":"oop/files","nx":"oop/files/appending/quiz","tr":["oop","oop/files"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Appending to a file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">By default, <code>spurt<\/code> replaces everything that was in the file.<\/span> <span class=\"sg\" data-s=\"1\">To add to the end of an existing file instead, pass the named argument <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The second <code>spurt<\/code> keeps the old content and adds the new line after it.<\/span> <span class=\"sg\" data-s=\"1\">So in the end, the file contains both lines:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Without <code>:append<\/code>, the second call would write over the file.<\/span> <span class=\"sg\" data-s=\"1\">Only <code>line2<\/code> would be left.<\/span> <span class=\"sg\" data-s=\"2\">Appending is useful for things like log files.<\/span> <span class=\"sg\" data-s=\"3\">Each run of a program adds to a growing record, instead of starting again.<\/span><\/p>"]]},"de":{"t":"An eine Datei anhängen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalerweise ersetzt <code>spurt<\/code> alles, was in der Datei stand.<\/span> <span class=\"sg\" data-s=\"1\">Um stattdessen etwas am Ende einer bestehenden Datei hinzuzufügen, übergeben Sie das benannte Argument <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Das zweite <code>spurt<\/code> behält den alten Inhalt und setzt die neue Zeile dahinter.<\/span> <span class=\"sg\" data-s=\"1\">Am Ende enthält die Datei also beide Zeilen:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ohne <code>:append<\/code> würde der zweite Aufruf die Datei überschreiben.<\/span> <span class=\"sg\" data-s=\"1\">Nur <code>line2<\/code> wäre übrig.<\/span> <span class=\"sg\" data-s=\"2\">Anhängen ist nützlich für Dinge wie Protokolldateien.<\/span> <span class=\"sg\" data-s=\"3\">Jeder Lauf eines Programms ergänzt ein wachsendes Protokoll, statt wieder von vorn zu beginnen.<\/span><\/p>"]]},"nl":{"t":"Aan een bestand toevoegen","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Standaard vervangt <code>spurt<\/code> alles wat er in het bestand stond.<\/span> <span class=\"sg\" data-s=\"1\">Om in plaats daarvan iets aan het eind van een bestaand bestand toe te voegen, geef je het benoemde argument <code>:append<\/code> mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De tweede <code>spurt<\/code> behoudt de oude inhoud en zet de nieuwe regel erachter.<\/span> <span class=\"sg\" data-s=\"1\">Dus bevat het bestand op het eind beide regels:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Zonder <code>:append<\/code> zou de tweede aanroep over het bestand heen schrijven.<\/span> <span class=\"sg\" data-s=\"1\">Dan zou alleen <code>line2<\/code> overblijven.<\/span> <span class=\"sg\" data-s=\"2\">Toevoegen is nuttig voor dingen als logbestanden.<\/span> <span class=\"sg\" data-s=\"3\">Elke keer dat een programma draait, voegt het iets toe aan een groeiend verslag, in plaats van opnieuw te beginnen.<\/span><\/p>"]]},"es":{"t":"Añadir a un archivo","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Por defecto, <code>spurt<\/code> sustituye todo lo que había en el archivo.<\/span> <span class=\"sg\" data-s=\"1\">Si en cambio quieres añadir al final de un archivo existente, pasa el argumento con nombre <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El segundo <code>spurt<\/code> conserva el contenido anterior y añade la línea nueva después.<\/span> <span class=\"sg\" data-s=\"1\">Así que, al final, el archivo contiene las dos líneas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sin <code>:append<\/code>, la segunda llamada escribiría encima del archivo.<\/span> <span class=\"sg\" data-s=\"1\">Solo quedaría <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Añadir al final es útil para cosas como los archivos de registro.<\/span> <span class=\"sg\" data-s=\"3\">Cada ejecución de un programa añade algo a un historial que crece, en lugar de empezar de nuevo.<\/span><\/p>"]]},"it":{"t":"Aggiungere a un file","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Normalmente <code>spurt<\/code> sostituisce tutto quello che c'era nel file.<\/span> <span class=\"sg\" data-s=\"1\">Per aggiungere invece alla fine di un file esistente, passa l'argomento nominato <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il secondo <code>spurt<\/code> conserva il contenuto che c'era e aggiunge la nuova riga dopo.<\/span> <span class=\"sg\" data-s=\"1\">Così alla fine il file contiene tutte e due le righe:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Senza <code>:append<\/code>, la seconda chiamata scriverebbe sopra il file.<\/span> <span class=\"sg\" data-s=\"1\">Resterebbe solo <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aggiungere in coda è utile per cose come i file di log.<\/span> <span class=\"sg\" data-s=\"3\">Ogni esecuzione di un programma aggiunge qualcosa a un registro che cresce, invece di ricominciare da capo.<\/span><\/p>"]]},"lv":{"t":"Pievienošana failam","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma <code>spurt<\/code> aizstāj visu, kas bija failā.<\/span> <span class=\"sg\" data-s=\"1\">Lai tā vietā pievienotu esoša faila beigās, padodiet nosaukto argumentu <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otrais <code>spurt<\/code> patur veco saturu un pievieno jauno rindu aiz tā.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc beigās failā ir abas rindas:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Bez <code>:append<\/code> otrais izsaukums pārrakstītu failu.<\/span> <span class=\"sg\" data-s=\"1\">Paliktu tikai <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Pievienošana noder tādām lietām kā žurnālfaili.<\/span> <span class=\"sg\" data-s=\"3\">Katra programmas palaišana papildina augošu pierakstu, nevis sāk no jauna.<\/span><\/p>"]]},"ru":{"t":"Добавление в файл","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По умолчанию <code>spurt<\/code> заменяет всё, что было в файле.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы вместо этого дописать в конец существующего файла, передайте именованный аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второй <code>spurt<\/code> сохраняет старое содержимое и добавляет новую строку после него.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому в итоге в файле оказываются обе строки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второй вызов перезаписал бы файл.<\/span> <span class=\"sg\" data-s=\"1\">Осталась бы только <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Дописывание полезно, например, для файлов журнала.<\/span> <span class=\"sg\" data-s=\"3\">Каждый запуск программы добавляет что-то к растущей истории, а не начинает её заново.<\/span><\/p>"]]},"uk":{"t":"Додавання до файлу","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням <code>spurt<\/code> замінює все, що було у файлі.<\/span> <span class=\"sg\" data-s=\"1\">Щоб натомість додати щось у кінець наявного файлу, передайте іменований аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Другий <code>spurt<\/code> зберігає старий вміст і додає новий рядок після нього.<\/span> <span class=\"sg\" data-s=\"1\">Тож зрештою файл містить обидва рядки:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> другий виклик перезаписав би файл.<\/span> <span class=\"sg\" data-s=\"1\">Лишився б тільки <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Дописування в кінець корисне для таких речей, як файли журналу.<\/span> <span class=\"sg\" data-s=\"3\">Кожен запуск програми доповнює запис, який росте, замість того щоб починати знову.<\/span><\/p>"]]},"bg":{"t":"Добавяне към файл","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">По подразбиране <code>spurt<\/code> заменя всичко, което е имало във файла.<\/span> <span class=\"sg\" data-s=\"1\">За да добавите вместо това в края на съществуващ файл, подайте именувания аргумент <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Второто <code>spurt<\/code> запазва старото съдържание и добавя новия ред след него.<\/span> <span class=\"sg\" data-s=\"1\">Така накрая файлът съдържа и двата реда:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Без <code>:append<\/code> второто извикване би презаписало файла.<\/span> <span class=\"sg\" data-s=\"1\">Тогава би останал само <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Добавянето е полезно за неща като журналните файлове.<\/span> <span class=\"sg\" data-s=\"3\">Всяко изпълнение на програмата добавя към растящ запис, вместо да започва отначало.<\/span><\/p>"]]},"eo":{"t":"Aldoni al dosiero","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, <code>spurt<\/code> anstataŭigas ĉion, kio estis en la dosiero.<\/span> <span class=\"sg\" data-s=\"1\">Por anstataŭe aldoni al la fino de ekzistanta dosiero, transdonu la nomitan argumenton <code>:append<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La dua <code>spurt<\/code> konservas la malnovan enhavon kaj aldonas la novan linion post ĝi.<\/span> <span class=\"sg\" data-s=\"1\">Do fine la dosiero enhavas ambaŭ liniojn:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sen <code>:append<\/code>, la dua voko superskribus la dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Restus nur <code>line2<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Aldonado estas utila por aferoj kiel protokoldosieroj.<\/span> <span class=\"sg\" data-s=\"3\">Ĉiu rulo de programo aldonas al kreskanta registro, anstataŭ komenci denove.<\/span><\/p>"]]},"la":{"t":"Ad plicam addere","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ex more <code>spurt<\/code> substituit omnia quae in archivo erant.<\/span> <span class=\"sg\" data-s=\"1\">Ut potius ad finem archivi exsistentis addas, argumentum nominatum <code>:append<\/code> trade:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'log.txt', \"line1\\n\";\nspurt 'log.txt', \"line2\\n\", :append;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Secundum <code>spurt<\/code> contentum vetus servat et novam lineam post id addit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque denique archivum utramque lineam continet:<\/span><\/p>"],["code",0,"<pre><code>line1\nline2<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Sine <code>:append<\/code> secunda vocatio archivum superscriberet.<\/span> <span class=\"sg\" data-s=\"1\">Sola <code>line2<\/code> maneret.<\/span> <span class=\"sg\" data-s=\"2\">Apponere utile est ad res sicut archiva annalium.<\/span> <span class=\"sg\" data-s=\"3\">Quisque cursus programmatis ad commentarium crescentem addit, neque iterum a principio incipit.<\/span><\/p>"]]}}}</script>
