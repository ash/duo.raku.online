<script type="application/json" id="page-data">{"u":"oop/files","n":869,"k":"section","pv":"oop/standard-streams/quiz","nx":"oop/files/appending","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Working with files","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In the simplest case, you read or write a whole file at once.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>spurt<\/code> routine writes a string to a file.<\/span> <span class=\"sg\" data-s=\"1\">It creates the file, or replaces its contents if the file already exists:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The <code>slurp<\/code> routine reads the whole file back into a string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Together, <code>spurt<\/code> and <code>slurp<\/code> save data and load it again in just two short calls.<\/span> <span class=\"sg\" data-s=\"1\">We use <code>print<\/code> here instead of <code>say<\/code>, because the text already ends with a newline.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">These routines work with the whole file at once.<\/span> <span class=\"sg\" data-s=\"1\">They are best for files that are small enough to fit easily into memory.<\/span> <span class=\"sg\" data-s=\"2\">For larger files, you use a <a href=\"/oop/file-handles/\">file handle<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">You also need one to work with a file line by line.<\/span> <span class=\"sg\" data-s=\"4\">We cover file handles at the end of this section.<\/span> <span class=\"sg\" data-s=\"5\">The next topic shows how to add to a file instead of replacing it.<\/span><\/p>"]]},"de":{"t":"Mit Dateien arbeiten","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Im einfachsten Fall lesen oder schreiben Sie eine ganze Datei auf einmal.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>spurt<\/code> schreibt eine Zeichenkette in eine Datei.<\/span> <span class=\"sg\" data-s=\"1\">Sie legt die Datei an oder ersetzt ihren Inhalt, falls die Datei schon existiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Die Routine <code>slurp<\/code> liest die ganze Datei zurück in eine Zeichenkette:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zusammen speichern <code>spurt<\/code> und <code>slurp<\/code> Daten und laden sie wieder, mit nur zwei kurzen Aufrufen.<\/span> <span class=\"sg\" data-s=\"1\">Wir verwenden hier <code>print<\/code> statt <code>say<\/code>, weil der Text schon mit einem Zeilenumbruch endet.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Diese Routinen arbeiten mit der ganzen Datei auf einmal.<\/span> <span class=\"sg\" data-s=\"1\">Sie sind am besten für Dateien, die so klein sind, dass sie leicht in den Speicher passen.<\/span> <span class=\"sg\" data-s=\"2\">Für größere Dateien verwenden Sie einen <a href=\"https://course.raku.org/de/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">Dateihandle<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Sie brauchen ihn auch, um eine Datei Zeile für Zeile zu bearbeiten.<\/span> <span class=\"sg\" data-s=\"4\">Dateihandles behandeln wir am Ende dieses Abschnitts.<\/span> <span class=\"sg\" data-s=\"5\">Das nächste Thema zeigt, wie Sie etwas an eine Datei anhängen, statt sie zu ersetzen.<\/span><\/p>"]]},"nl":{"t":"Met bestanden werken","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In het eenvoudigste geval lees of schrijf je een heel bestand in één keer.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De routine <code>spurt<\/code> schrijft een string naar een bestand.<\/span> <span class=\"sg\" data-s=\"1\">Hij maakt het bestand aan, of vervangt de inhoud als het bestand al bestaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">De routine <code>slurp<\/code> leest het hele bestand terug in een string:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Samen slaan <code>spurt<\/code> en <code>slurp<\/code> gegevens op en laden ze weer in, met maar twee korte aanroepen.<\/span> <span class=\"sg\" data-s=\"1\">We gebruiken hier <code>print<\/code> in plaats van <code>say<\/code>, omdat de tekst al op een newline eindigt.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Deze routines werken met het hele bestand in één keer.<\/span> <span class=\"sg\" data-s=\"1\">Ze zijn het best voor bestanden die klein genoeg zijn om makkelijk in het geheugen te passen.<\/span> <span class=\"sg\" data-s=\"2\">Voor grotere bestanden gebruik je een <a href=\"https://course.raku.org/nl/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">bestandshandle<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Je hebt er ook een nodig om regel voor regel met een bestand te werken.<\/span> <span class=\"sg\" data-s=\"4\">We behandelen bestandshandles aan het eind van deze sectie.<\/span> <span class=\"sg\" data-s=\"5\">Het volgende onderwerp laat zien hoe je aan een bestand toevoegt in plaats van het te vervangen.<\/span><\/p>"]]},"es":{"t":"Trabajar con archivos","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En el caso más sencillo, lees o escribes un archivo entero de una vez.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>spurt<\/code> escribe una cadena en un archivo.<\/span> <span class=\"sg\" data-s=\"1\">Crea el archivo, o sustituye su contenido si el archivo ya existe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutina <code>slurp<\/code> vuelve a leer todo el archivo en una cadena:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Juntas, <code>spurt<\/code> y <code>slurp<\/code> guardan datos y los vuelven a cargar con solo dos llamadas cortas.<\/span> <span class=\"sg\" data-s=\"1\">Aquí usamos <code>print<\/code> en lugar de <code>say<\/code>, porque el texto ya termina con un salto de línea.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Estas rutinas trabajan con todo el archivo de una vez.<\/span> <span class=\"sg\" data-s=\"1\">Son la mejor opción para archivos pequeños, que caben fácilmente en la memoria.<\/span> <span class=\"sg\" data-s=\"2\">Para archivos más grandes, usas un <a href=\"https://course.raku.org/es/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">manejador de archivo<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">También lo necesitas para trabajar con un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"4\">Vemos los manejadores de archivo al final de esta sección.<\/span> <span class=\"sg\" data-s=\"5\">El tema siguiente muestra cómo añadir a un archivo en lugar de sustituirlo.<\/span><\/p>"]]},"it":{"t":"Lavorare con i file","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Nel caso più semplice, leggi o scrivi un file intero in una volta.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La routine <code>spurt<\/code> scrive una stringa in un file.<\/span> <span class=\"sg\" data-s=\"1\">Crea il file, o ne sostituisce il contenuto se il file esiste già:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La routine <code>slurp<\/code> rilegge tutto il file in una stringa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Insieme, <code>spurt<\/code> e <code>slurp<\/code> salvano dei dati e li ricaricano con solo due chiamate brevi.<\/span> <span class=\"sg\" data-s=\"1\">Qui usiamo <code>print<\/code> invece di <code>say<\/code>, perché il testo finisce già con un ritorno a capo.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Queste routine lavorano con tutto il file in una volta.<\/span> <span class=\"sg\" data-s=\"1\">Sono la scelta migliore per i file abbastanza piccoli da stare facilmente in memoria.<\/span> <span class=\"sg\" data-s=\"2\">Per i file più grandi usi un <a href=\"https://course.raku.org/it/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">handle di file<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Ne hai bisogno anche per lavorare con un file riga per riga.<\/span> <span class=\"sg\" data-s=\"4\">Parliamo degli handle di file alla fine di questa sezione.<\/span> <span class=\"sg\" data-s=\"5\">Il prossimo argomento mostra come aggiungere a un file invece di sostituirlo.<\/span><\/p>"]]},"lv":{"t":"Darbs ar failiem","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Vienkāršākajā gadījumā jūs nolasāt vai ierakstāt visu failu uzreiz.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>spurt<\/code> ieraksta virkni failā.<\/span> <span class=\"sg\" data-s=\"1\">Tā izveido failu vai aizstāj tā saturu, ja fails jau eksistē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Rutīna <code>slurp<\/code> nolasa visu failu atpakaļ virknē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kopā <code>spurt<\/code> un <code>slurp<\/code> saglabā datus un atkal tos ielādē tikai ar diviem īsiem izsaukumiem.<\/span> <span class=\"sg\" data-s=\"1\">Šeit mēs lietojam <code>print<\/code>, nevis <code>say<\/code>, jo teksts jau beidzas ar jaunas rindas rakstzīmi.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šīs rutīnas strādā ar visu failu uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tās vislabāk der failiem, kas ir pietiekami mazi, lai viegli ietilptu atmiņā.<\/span> <span class=\"sg\" data-s=\"2\">Lielākiem failiem jūs lietojat <a href=\"https://course.raku.org/lv/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">faila turi<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Tas jums vajadzīgs arī, lai strādātu ar failu pa rindai.<\/span> <span class=\"sg\" data-s=\"4\">Failu turus mēs aplūkojam šīs sadaļas beigās.<\/span> <span class=\"sg\" data-s=\"5\">Nākamais temats parāda, kā failam pievienot, nevis to aizstāt.<\/span><\/p>"]]},"ru":{"t":"Работа с файлами","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В самом простом случае вы читаете или записываете весь файл сразу.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>spurt<\/code> записывает строку в файл.<\/span> <span class=\"sg\" data-s=\"1\">Она создаёт файл или заменяет его содержимое, если файл уже существует:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедура <code>slurp<\/code> читает весь файл обратно в строку:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вместе <code>spurt<\/code> и <code>slurp<\/code> сохраняют данные и снова загружают их всего двумя короткими вызовами.<\/span> <span class=\"sg\" data-s=\"1\">Здесь мы используем <code>print<\/code> вместо <code>say<\/code>, потому что текст уже заканчивается переводом строки.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Эти процедуры работают со всем файлом сразу.<\/span> <span class=\"sg\" data-s=\"1\">Лучше всего они подходят для файлов, которые достаточно малы, чтобы легко поместиться в памяти.<\/span> <span class=\"sg\" data-s=\"2\">Для больших файлов вы используете <a href=\"https://course.raku.org/ru/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">файловый дескриптор<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Он нужен и для того, чтобы работать с файлом построчно.<\/span> <span class=\"sg\" data-s=\"4\">О файловых дескрипторах мы расскажем в конце этого раздела.<\/span> <span class=\"sg\" data-s=\"5\">Следующая тема показывает, как дописывать в файл, а не заменять его.<\/span><\/p>"]]},"uk":{"t":"Робота з файлами","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">У найпростішому випадку ви читаєте або записуєте весь файл за раз.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>spurt<\/code> записує рядок у файл.<\/span> <span class=\"sg\" data-s=\"1\">Вона створює файл або замінює його вміст, якщо файл уже існує:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Підпрограма <code>slurp<\/code> читає весь файл назад у рядок:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Разом <code>spurt<\/code> і <code>slurp<\/code> зберігають дані й знову завантажують їх лише двома короткими викликами.<\/span> <span class=\"sg\" data-s=\"1\">Тут ми використовуємо <code>print<\/code> замість <code>say<\/code>, бо текст уже закінчується символом нового рядка.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ці підпрограми працюють з усім файлом за раз.<\/span> <span class=\"sg\" data-s=\"1\">Вони найкраще підходять для файлів, які досить малі, щоб легко вміститися в пам'ять.<\/span> <span class=\"sg\" data-s=\"2\">Для більших файлів використовують <a href=\"https://course.raku.org/uk/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">дескриптор файлу<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Він також потрібен, щоб працювати з файлом рядок за рядком.<\/span> <span class=\"sg\" data-s=\"4\">Ми розглянемо дескриптори файлів наприкінці цього розділу.<\/span> <span class=\"sg\" data-s=\"5\">Наступна тема показує, як додавати до файлу, а не замінювати його.<\/span><\/p>"]]},"bg":{"t":"Работа с файлове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">В най-простия случай прочитате или записвате цял файл наведнъж.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>spurt<\/code> записва низ във файл.<\/span> <span class=\"sg\" data-s=\"1\">Тя създава файла или заменя съдържанието му, ако файлът вече съществува:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Процедурата <code>slurp<\/code> прочита целия файл обратно в низ:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Заедно <code>spurt<\/code> и <code>slurp<\/code> запазват данни и ги зареждат отново само с две кратки извиквания.<\/span> <span class=\"sg\" data-s=\"1\">Тук използваме <code>print<\/code> вместо <code>say<\/code>, защото текстът вече завършва с нов ред.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Тези процедури работят с целия файл наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Те са най-добри за файлове, които са достатъчно малки, за да се поберат лесно в паметта.<\/span> <span class=\"sg\" data-s=\"2\">За по-големи файлове използвате <a href=\"https://course.raku.org/bg/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">манипулатор на файл<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Той ви трябва и за да работите с файл ред по ред.<\/span> <span class=\"sg\" data-s=\"4\">Ще разгледаме манипулаторите на файлове в края на този раздел.<\/span> <span class=\"sg\" data-s=\"5\">Следващата тема показва как да добавяте към файл, вместо да го заменяте.<\/span><\/p>"]]},"eo":{"t":"Labori kun dosieroj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">En la plej simpla kazo, vi legas aŭ skribas tutan dosieron samtempe.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>spurt<\/code> skribas ĉenon en dosieron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi kreas la dosieron, aŭ anstataŭigas ĝian enhavon, se la dosiero jam ekzistas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La rutino <code>slurp<\/code> relegas la tutan dosieron en ĉenon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kune, <code>spurt<\/code> kaj <code>slurp<\/code> konservas datumojn kaj ŝargas ilin denove per nur du mallongaj vokoj.<\/span> <span class=\"sg\" data-s=\"1\">Ni uzas <code>print<\/code> ĉi tie anstataŭ <code>say<\/code>, ĉar la teksto jam finiĝas per linifino.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiuj rutinoj laboras kun la tuta dosiero samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Ili plej taŭgas por dosieroj, kiuj estas sufiĉe malgrandaj por facile eniri en la memoron.<\/span> <span class=\"sg\" data-s=\"2\">Por pli grandaj dosieroj, vi uzas <a href=\"https://course.raku.org/eo/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">dosiertenilon<\/a>.<\/span> <span class=\"sg\" data-s=\"3\">Vi ankaŭ bezonas ĝin por labori kun dosiero linio post linio.<\/span> <span class=\"sg\" data-s=\"4\">Ni traktas dosiertenilojn ĉe la fino de ĉi tiu sekcio.<\/span> <span class=\"sg\" data-s=\"5\">La sekva temo montras, kiel aldoni al dosiero anstataŭ anstataŭigi ĝin.<\/span><\/p>"]]},"la":{"t":"Cum plicis laborare","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">In casu simplicissimo totum archivum simul legis aut scribis.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>spurt<\/code> chordam in archivum scribit.<\/span> <span class=\"sg\" data-s=\"1\">Archivum creat, aut contenta eius substituit si archivum iam exsistit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'greeting.txt', \"Hello, file!\\n\";<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Procedura <code>slurp<\/code> totum archivum retro in chordam legit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $text = slurp 'greeting.txt';\nprint $text; # Hello, file!<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Simul <code>spurt<\/code> et <code>slurp<\/code> data servant et iterum onerant, duabus tantum brevibus vocationibus.<\/span> <span class=\"sg\" data-s=\"1\">Hic <code>print<\/code> loco <code>say<\/code> adhibemus, quia textus iam nova linea desinit.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Hae procedurae cum toto archivo simul laborant.<\/span> <span class=\"sg\" data-s=\"1\">Optimae sunt pro archivis quae satis parva sunt ut facile in memoriam intrent.<\/span> <span class=\"sg\" data-s=\"2\">Pro maioribus archivis <a href=\"https://course.raku.org/la/oop/file-handles/\" target=\"_blank\" rel=\"noopener\">tractabulo archivi<\/a> uteris.<\/span> <span class=\"sg\" data-s=\"3\">Eo etiam eges ut cum archivo linea post lineam labores.<\/span> <span class=\"sg\" data-s=\"4\">De tractabulis archivorum in fine huius sectionis agimus.<\/span> <span class=\"sg\" data-s=\"5\">Argumentum sequens ostendit quomodo archivo aliquid addas, neque id substituas.<\/span><\/p>"]]}}}</script>
