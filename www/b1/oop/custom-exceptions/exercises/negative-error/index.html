ative<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Напишете подпрограма <code>check($n)<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Когато аргументът ѝ е под нулата, тя хвърля <code>Negative<\/code>, който носи това <code>n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Иначе тя връща аргумента.<\/span> <span class=\"sg\" data-s=\"3\">После в блок извикайте <code>check(-5)<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Използвайте фазер <code>CATCH<\/code> с <code>when Negative<\/code>, за да отпечатате съобщението на изключението.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Накрая, след блока, хвърлете още един <code>Negative<\/code> с <code>n<\/code>, равно на <code>-10<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Никакъв <code>CATCH<\/code> не пази това място.<\/span> <span class=\"sg\" data-s=\"2\">Това показва, че такова изключение спира програмата.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/negative-error/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Eraro pri negativa nombro","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Difinu propran esceptoklason kun la nomo <code>Negative<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi heredas de <code>Exception<\/code> kaj havas atributon <code>n<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia metodo <code>message<\/code> redonas <code>&lt;n&gt; is negative<\/code>.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Skribu subrutinon <code>check($n)<\/code>.<\/span> <span class=
