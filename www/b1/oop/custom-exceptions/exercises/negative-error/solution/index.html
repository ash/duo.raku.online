ría la excepción, pero después el programa simplemente terminaría. No habría ningún lugar natural donde seguir.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El <code>Negative.new(n =&gt; -10).throw<\/code> final muestra la otra cara de esto. Está <strong>fuera<\/strong> del bloque, así que nada lo captura. La excepción sube hasta arriba del todo, y el programa muere. Imprime el mensaje y una traza en el error estándar. Después termina con un estado distinto de cero. Esto es lo que le pasa a cualquier excepción que no capturas. Y por eso exactamente el primer lanzamiento necesitaba un <code>CATCH<\/code> para sobrevivir.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Un errore per i numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> rende possibile sollevare la classe. Il suo metodo <code>message<\/code> costruisce il test  class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> dod iespēju izmest šo klasi. Tās metode <code>message<\/code> uzbūvē tekstu no atribūta <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> pārbauda savu ievadi un negatīvam skaitlim izmet paša definēto izņēmumu. Izņēmums ceļo ārā no <code>check<\/code> līdz <code>CATCH<\/code> blokā, kas to izsauca. Tur <code>when Negative<\/code> tam atbilst pēc tipa un izdrukā paziņojumu. Tas ir ļoti izplatīts, īsts paša definētu izņēmumu lietojums. Kods pārbauda savu ievadi un ziņo par sliktām vērtībām ar sava tipa izņēmumu.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kāpēc ap izsaukumu ir <code>{ … }<\/code>? Fāzeris <code>CATCH<\/code> apstrādā tikai tos izņēmumus, kas izmesti <strong>blokā, kurā tas atrodas<\/strong>. Bloks saliek kopā riskanto <code>check(-5)<\/code> un <code>CATCH<\/code>, kas to sargā. Tāpēc izņēmums tiek noķerts tieši šeit, un programma turpinās tūlīt aiz bloka. Bez bloka <code>CATCH<\/code> \/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверяет свои входные данные и для отрицательного числа бросает собственное исключение. Исключение выходит из <code>check<\/code> и идёт к <code>CATCH<\/code> в вызывающем блоке. Там <code>when Negative<\/code> сопоставляет его по типу и печатает сообщение. Это очень частое, реальное применение собственных исключений. Код проверяет свои входные данные и сообщает о плохих значениях исключением своего типа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Зачем вокруг вызова стоит <code>{ … }<\/code>? Фазер <code>CATCH<\/code> обрабатывает только исключения, брошенные в <strong>том блоке, где он стоит<\/strong>. Блок объединяет рискованный <code>check(-5)<\/code> и <code>CATCH<\/code>, который его охраняет. Поэтому исключение перехватывается прямо здесь, и программа продолжает работу сразу после блока. Без блока <code>CATCH<\/code> охранял бы вместо этого всю программу. Он перехватил бы исключение, но потом программа просто закончилась бы. Не было бы естественного места, чтобы продолжить работу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последний <code>Negative.new(n =&gt; -10).throw<\/code> показывает обратную сторону. Он стоит <strong>вне<\/strong> блока, поэтому его никто не перехватывает. Исключение поднимается до самого верха, и программа умирает. Она печатает сообщение и трассировку в стандартный поток ошибок. Затем она завершается с ненулевым кодом возврата. Так происходит с любым исключением, которое вы не перехватили. И именно поэтому первому броску был нужен <code>CATCH<\/code>, чтобы программа выжила.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Помилка від'ємного числа","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> робить так, що клас можна кидати. Його метод <code>message<\/code> будує текст з атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> перевіряє вхідні дані й кидає власний виняток для від'ємного числа. Виняток виходить із <code>check<\/code> і йде до <code>CATCH<\/code> у блоці, який її викликав. Там <code>when Negative<\/code> зіставляється з ним за типом і виводить повідомлення. Це дуже поширене, справжнє застосування власних винятків. Код перевіряє вхідні дані й повідомляє про погані значення винятком власного типу.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Навіщо навколо виклику стоїть <code>{ … }<\/code>? Фазер <code>CATCH<\/code> обробляє лише винятки, кинуті в <strong>блоці, який його містить<\/strong>. Блок об'єднує ризикований <code>check(-5)<\/code> з <code>CATCH<\/code>, який його охороняє. Тож виняток перехоплюється прямо тут, і програма продовжує роботу одразу після блоку. Без блоку <code>CATCH<\/code> охороняв би натомість усю програму. Він перехопив би виняток, але потім програма б просто завершилася. Не було б природного місця, щоб продовжити.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Останній <code>Negative.new(n =&gt; -10).throw<\/code> показує інший бік цього. Він стоїть <strong>поза<\/strong> блоком, тож його ніхто не перехоплює. Виняток іде аж до самого верху, і програма гине. Вона виводить повідомлення й трасування стека в стандартний потік помилок. Потім вона завершується з ненульовим статусом. Так стається з будь-яким винятком, який ви не перехоплюєте. І саме тому першому киданню був потрібен <code>CATCH<\/code>, щоб вижити.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Грешка при отрицателно число","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> дава възможност да хвърляте класа. Методът му <code>message<\/code> съставя текста от атрибута <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> проверява входа си и хвърля собственото изключение за отрицателно число. Изключението излиза от <code>check<\/code> и стига до <code>CATCH<\/code> в извикващия блок. Там <code>when Negative<\/code> го съпоставя по типа му и отпечатва съобщението. Това е много честа, реална употреба на собствените изключения. Кодът проверява входа си и съобщава за лоши стойности с изключение от свой собствен тип.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Защо около извикването има <code>{ … }<\/code>? Фазерът <code>CATCH<\/code> обработва само изключенията, хвърлени в <strong>блока, който го съдържа<\/strong>. Блокът събира рискованото <code>check(-5)<\/code> заедно с <code>CATCH<\/code>, който го пази. Затова изключението се прихваща точно тук, а програмата продължава веднага след блока. Без блока <code>CATCH<\/code> би пазил вместо това цялата програма. Той би прихванал изключението, но после програмата просто би свършила. Нямаше да има естествено място, откъдето да продължи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Последното <code>Negative.new(n =&gt; -10).throw<\/code> показва другата страна на това. То е <strong>извън<\/strong> блока, така че нищо не го прихваща. Изключението стига чак до върха и програмата умира. Тя отпечатва съобщението и обратната следа в стандартната грешка. После тя завършва с ненулев код на изход. Това става с всяко изключение, което не прихванете. И точно затова първото хвърляне имаше нужда от <code>CATCH<\/code>, за да оцелее.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Eraro pri negativa nombro","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> ebligas ĵeti la klason. Ĝia metodo <code>message<\/code> konstruas la tekston el la atributo <code>n<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> testas sian enigon kaj ĵetas la propran escepton por negativa nombro. La escepto vojaĝas el <code>check<\/code> al la <code>CATCH<\/code> en la vokanta bloko. Tie, <code>when Negative<\/code> kongruas kun ĝi laŭ ĝia tipo kaj presas la mesaĝon. Tio estas tre ofta, vera uzo de propraj esceptoj. Kodo kontrolas sian enigon kaj raportas malbonajn valorojn per escepto de sia propra tipo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kial estas <code>{ … }<\/code> ĉirkaŭ la voko? Fazero <code>CATCH<\/code> traktas nur la esceptojn ĵetitajn en <strong>la bloko, kiu enhavas ĝin<\/strong>. La bloko metas la riskan <code>check(-5)<\/code> kune kun la <code>CATCH<\/code>, kiu gardas ĝin. Do la escepto estas kaptata ĝuste ĉi tie, kaj la programo daŭras tuj post la bloko. Sen la bloko, la <code>CATCH<\/code> gardus anstataŭe la tutan programon. Ĝi kaptus la escepton, sed tiam la programo simple finiĝus. Ne estus natura loko por daŭrigi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La fina <code>Negative.new(n =&gt; -10).throw<\/code> montras la alian flankon de tio. Ĝi estas <strong>ekster<\/strong> la bloko, do nenio kaptas ĝin. La escepto iras ĝis la plej supro, kaj la programo mortas. Ĝi presas la mesaĝon kaj retrospuron al la norma erara fluo. Poste ĝi finiĝas kun elirkodo, kiu ne estas nulo. Tio okazas al ĉiu escepto, kiun vi ne kaptas. Kaj ĝuste tial la unua ĵeto bezonis <code>CATCH<\/code> por postvivi.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Error numeri negativi","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class Negative is Exception {\n    has $.n;\n\n    method message {\n        \"$.n is negative\";\n    }\n}\n\nsub check($n) {\n    Negative.new(n =&gt; $n).throw if $n &lt; 0;\n    return $n;\n}\n\n{\n    say check(-5);\n\n    CATCH {\n        when Negative {\n            say .message;\n        }\n    }\n}\n\nNegative.new(n =&gt; -10).throw;<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/negative-error.raku\" target=\"_blank\" rel=\"noopener\">negative-error.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>-5 is negative\n-10 is negative\n  in block &lt;unit&gt; at negative-error.raku line 24<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>Negative is Exception<\/code> efficit ut classis iaci possit. Methodus eius <code>message<\/code> textum ex attributo <code>n<\/code> aedificat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>check<\/code> introitum suum probat et pro numero negativo exceptionem propriam iacit. Exceptio ex <code>check<\/code> ad <code>CATCH<\/code> in clausula vocante migrat. Ibi <code>when Negative<\/code> ei genere suo convenit et nuntium imprimit. Hic est usus verus et valde frequens exceptionum propriarum. Codex introitum suum probat et valores malos exceptione sui generis nuntiat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Cur <code>{ … }<\/code> circa vocationem est? Fasis <code>CATCH<\/code> solum exceptiones tractat iactas in <strong>clausula quae eam continet<\/strong>. Clausula periculosum <code>check(-5)<\/code> una cum <code>CATCH<\/code> coniungit quae illud custodit. Itaque exceptio hic ipso loco capitur, et programma statim post clausulam pergit. Sine clausula, <code>CATCH<\/code> loco eius totum programma custodiret. Exceptionem caperet, sed tum programma simpliciter finiret. Nullus locus naturalis esset ubi pergeret.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ultimum <code>Negative.new(n =&gt; -10).throw<\/code> alteram huius rei partem ostendit. <strong>Extra<\/strong> clausulam est, itaque nihil illud capit. Exceptio usque ad summum ascendit, et programma moritur. Nuntium et vestigium ad errorem vulgarem imprimit. Deinde exit cum statu alio quam nihil. Hoc accidit cuilibet exceptioni quam non capis. Et ideo exacte primus iactus <code>CATCH<\/code> egebat ut superesset.<\/span><\/li><\/ol>"]]}}}</script>
