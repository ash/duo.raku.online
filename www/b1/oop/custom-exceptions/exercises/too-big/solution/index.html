<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/too-big/solution","n":964,"k":"solution","pv":"oop/custom-exceptions/exercises/too-big","nx":"oop/custom-exceptions/exercises/negative-error","tr":["oop","oop/custom-exceptions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Too big‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> makes the class an exception that you can throw. It carries two pieces of data, <code>value<\/code> and <code>limit<\/code>. Its <code>message<\/code> method puts both of them into the text that it reports.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> raises the exception, and <code>when TooBig<\/code> matches it by its type. The handler does more than print the message. It reads the <code>limit<\/code> attribute directly from the caught object to give a helpful hint. This is why a custom exception is better than a plain string. The handler gets data with a clear structure that it can act on.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The exception is thrown <strong>only<\/strong> when <code>$value &gt; $limit<\/code>. For <code>30<\/code>, there is no exception, and the loop body runs to its <code>say<\/code>. It prints that the value is within the limit. For <code>99<\/code> and <code>60<\/code>, the <code>throw<\/code> happens, so that <code>say<\/code> is skipped. The <code>CATCH<\/code> handles the exception instead. The <code>for<\/code> body is itself the block that the <code>CATCH<\/code> guards. So a caught exception ends only the current round. Then the loop simply moves on to the next value.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Zu groß","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> macht aus der Klasse eine Ausnahme, die Sie werfen können. Sie trägt zwei Werte mit sich, <code>value<\/code> und <code>limit<\/code>. Ihre Methode <code>message<\/code> setzt beide in den Text ein, den sie meldet.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> löst die Ausnahme aus, und <code>when TooBig<\/code> erkennt sie an ihrem Typ. Die Behandlung tut mehr, als die Meldung auszugeben. Sie liest das Attribut <code>limit<\/code> direkt aus dem gefangenen Objekt, um einen hilfreichen Hinweis zu geben. Darum ist eine eigene Ausnahme besser als eine einfache Zeichenkette. Die Behandlung bekommt Daten mit einer klaren Struktur, mit denen sie arbeiten kann.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Die Ausnahme wird <strong>nur<\/strong> geworfen, wenn <code>$value &gt; $limit<\/code> gilt. Für <code>30<\/code> gibt es keine Ausnahme, und der Schleifenrumpf läuft bis zu seinem <code>say<\/code>. Das <code>say<\/code> gibt aus, dass der Wert innerhalb der Grenze liegt. Für <code>99<\/code> und <code>60<\/code> passiert das <code>throw<\/code>, also wird dieses <code>say<\/code> übersprungen. Stattdessen behandelt das <code>CATCH<\/code> die Ausnahme. Der Rumpf der <code>for<\/code>-Schleife ist selbst der Block, den das <code>CATCH<\/code> schützt. Also beendet eine gefangene Ausnahme nur die aktuelle Runde. Dann geht die Schleife einfach zum nächsten Wert weiter.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Te groot","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> maakt van de klasse een exceptie die je kunt werpen. Ze draagt twee stukken gegevens mee, <code>value<\/code> en <code>limit<\/code>. Haar methode <code>message<\/code> zet ze allebei in de tekst die ze meldt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> werpt de exceptie op, en <code>when TooBig<\/code> matcht haar op type. De afhandelaar doet meer dan de melding afdrukken. Hij leest het attribuut <code>limit<\/code> direct van het gevangen object, om een behulpzame tip te geven. Daarom is een eigen exceptie beter dan een kale string. De afhandelaar krijgt gegevens met een duidelijke structuur, waarop hij kan reageren.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De exceptie wordt <strong>alleen<\/strong> geworpen als <code>$value &gt; $limit<\/code>. Voor <code>30<\/code> is er geen exceptie, en de body van de lus draait door tot zijn <code>say<\/code>. Die drukt af dat de waarde binnen de limiet ligt. Voor <code>99<\/code> en <code>60<\/code> gebeurt de <code>throw<\/code>, dus wordt die <code>say<\/code> overgeslagen. De <code>CATCH<\/code> handelt de exceptie in plaats daarvan af. De body van de <code>for<\/code> is zelf het blok dat de <code>CATCH<\/code> bewaakt. Dus beëindigt een gevangen exceptie alleen de huidige ronde. Daarna gaat de lus gewoon door naar de volgende waarde.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Demasiado grande","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\" CH<\/code> gestisce l'eccezione. Il corpo del <code>for<\/code> è proprio il blocco che il <code>CATCH<\/code> protegge. Quindi un'eccezione intercettata chiude solo il giro attuale. Poi il ciclo passa semplicemente al valore successivo.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Pārāk liels","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> padara klasi par izņēmumu, ko var izmest. Tā nes divus datu gabalus, <code>value<\/code> un <code>limit<\/code>. Tās metode <code>message<\/code> ieliek tos abus tekstā, ko tā ziņo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> izmet izņēmumu, un <code>when TooBig<\/code> tam atbilst pēc tipa. Apstrādātājs ne tikai izdrukā paziņojumu. Tas tieši no noķertā objekta nolasa atribūtu <code>limit<\/code>, lai dotu noderīgu padomu. Tāpēc paša definēts izņēmums ir labāks par vienkāršu virkni. Apstrādātājs saņem datus ar skaidru struktūru, uz kuriem tas var reaģēt.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Izņēmums tiek izmests <strong>tikai<\/strong> tad, kad <code>$value &gt; $limit<\/code>. Vērtībai <code>30<\/code> izņēmuma nav, un cikla ķermenis izpildās līdz savam <code>say<\/code>. Tas izdrukā, ka vērtība ir robežās. Vērtībām <code>99<\/code> un <code>60<\/code> notiek <code>throw<\/code>, tāpēc šis <code>say<\/code> tiek izlaists. Tā vietā izņēmumu apstrādā <code>CATCH<\/code>. Cikla <code>for<\/code> ķermenis pats ir bloks, ko <code>CATCH<\/code> sargā. Tāpēc noķerts izņēmums beidz tikai pašreizējo piegājienu. Tad cikls vienkārši pāriet uz nākamo vērtību.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Слишком большое","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> делает класс исключением, которое можно бросить. Он несёт два значения: <code>value<\/code> и <code>limit<\/code>. Его метод <code>message<\/code> вставляет оба в текст, который он выдаёт.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> бросает исключение, а <code>when TooBig<\/code> сопоставляет его по типу. Обработчик делает больше, чем просто печатает сообщение. Он напрямую читает атрибут <code>limit<\/code> у перехваченного объекта, чтобы дать полезную подсказку. Вот почему собственное исключение лучше простой строки. Обработчик получает данные с понятной структурой, с которыми он может работать.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Исключение бросается <strong>только<\/strong> тогда, когда <code>$value &gt; $limit<\/code>. Для <code>30<\/code> исключения нет, и тело цикла доходит до своего <code>say<\/code>. Он печатает, что значение в пределах нормы. Для <code>99<\/code> и <code>60<\/code> срабатывает <code>throw<\/code>, поэтому этот <code>say<\/code> пропускается. Вместо него исключение обрабатывает <code>CATCH<\/code>. Тело <code>for<\/code> само и есть тот блок, который охраняет <code>CATCH<\/code>. Поэтому перехваченное исключение завершает только текущий проход. Потом цикл просто переходит к следующему значению.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Завелике","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> робить клас винятком, який можна кинути. Він несе два значення, <code>value<\/code> та <code>limit<\/code>. Його метод <code>message<\/code> вставляє обидва в текст, який він повідомляє.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> кидає виняток, а <code>when TooBig<\/code> зіставляється з ним за типом. Обробник робить більше, ніж просто виводить повідомлення. Він напряму читає атрибут <code>limit<\/code> із перехопленого об'єкта, щоб дати корисну підказку. Ось чому власний виняток кращий за простий рядок. Обробник отримує дані з чіткою структурою, з якими може щось робити.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Виняток кидається <strong>лише<\/strong> тоді, коли <code>$value &gt; $limit<\/code>. Для <code>30<\/code> винятку немає, і тіло циклу доходить до свого <code>say<\/code>. Він виводить, що значення не виходить за межу. Для <code>99<\/code> та <code>60<\/code> спрацьовує <code>throw<\/code>, тож цей <code>say<\/code> пропускається. Натомість виняток обробляє <code>CATCH<\/code>. Тіло <code>for<\/code> саме є тим блоком, який охороняє <code>CATCH<\/code>. Тож перехоплений виняток завершує лише поточний прохід. Потім цикл просто переходить до наступного значення.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Твърде голямо","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> прави класа изключение, което можете да хвърлите. Той носи две парчета данни, <code>value<\/code> и <code>limit<\/code>. Методът му <code>message<\/code> слага и двете в текста, който съобщава.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> хвърля изключението, а <code>when TooBig<\/code> го съпоставя по типа му. Обработчикът не само отпечатва съобщението. Той чете атрибута <code>limit<\/code> направо от прихванатия обект, за да даде полезна подсказка. Ето защо собственото изключение е по-добро от обикновен низ. Обработчикът получава данни с ясна структура, според които може да действа.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Изключението се хвърля <strong>само<\/strong> когато <code>$value &gt; $limit<\/code>. За <code>30<\/code> няма изключение и тялото на цикъла стига до своето <code>say<\/code>. То отпечатва, че стойността е в рамките на границата. За <code>99<\/code> и <code>60<\/code> се случва <code>throw<\/code>, така че това <code>say<\/code> се пропуска. Вместо това <code>CATCH<\/code> обработва изключението. Самото тяло на <code>for<\/code> е блокът, който <code>CATCH<\/code> пази. Затова прихванатото изключение спира само текущата обиколка. После цикълът просто продължава към следващата стойност.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Tro granda","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> faras el la klaso escepton, kiun vi povas ĵeti. Ĝi portas du pecojn da datumoj, <code>value<\/code> kaj <code>limit<\/code>. Ĝia metodo <code>message<\/code> metas ambaŭ en la tekston, kiun ĝi raportas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> levas la escepton, kaj <code>when TooBig<\/code> kongruas kun ĝi laŭ ĝia tipo. La traktilo faras pli ol presi la mesaĝon. Ĝi legas la atributon <code>limit<\/code> rekte el la kaptita objekto por doni utilan konsilon. Tial propra escepto estas pli bona ol simpla ĉeno. La traktilo ricevas datumojn kun klara strukturo, laŭ kiuj ĝi povas agi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La escepto estas ĵetata <strong>nur<\/strong>, kiam <code>$value &gt; $limit<\/code>. Por <code>30<\/code>, ne estas escepto, kaj la buklokorpo ruliĝas ĝis sia <code>say<\/code>. Ĝi presas, ke la valoro estas ene de la limo. Por <code>99<\/code> kaj <code>60<\/code>, la <code>throw<\/code> okazas, do tiu <code>say<\/code> estas preterlasata. La <code>CATCH<\/code> anstataŭe traktas la escepton. La korpo de <code>for<\/code> estas mem la bloko, kiun la <code>CATCH<\/code> gardas. Do kaptita escepto finas nur la nunan rondon. Poste la buklo simple iras al la sekva valoro.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Nimis magnum","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n    has $.limit;\n\n    method message {\n        \"Value $.value exceeds the limit of $.limit\";\n    }\n}\n\nmy $limit = 50;\n\nfor 30, 99, 60 -&gt; $value {\n    TooBig.new(value =&gt; $value, limit =&gt; $limit).throw if $value &gt; $limit;\n    say \"Value $value is within the limit\";\n\n    CATCH {\n        when TooBig {\n            say .message;\n            say \"Try a value up to {.limit}.\";\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/too-big.raku\" target=\"_blank\" rel=\"noopener\">too-big.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>TooBig is Exception<\/code> classem exceptionem facit quam iacere potes. Duo data fert, <code>value<\/code> et <code>limit<\/code>. Methodus eius <code>message<\/code> utrumque in textum ponit quem nuntiat.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.throw<\/code> exceptionem excitat, et <code>when TooBig<\/code> ei genere suo convenit. Tractator plus agit quam nuntium imprimere. Attributum <code>limit<\/code> directe ex obiecto capto legit ut consilium utile det. Ideo exceptio propria melior est quam chorda simplex. Tractator data cum structura clara accipit, secundum quae agere potest.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Exceptio <strong>solum<\/strong> iacitur cum <code>$value &gt; $limit<\/code>. Pro <code>30<\/code> nulla exceptio est, et corpus anuli usque ad suum <code>say<\/code> currit. Imprimit valorem intra limitem esse. Pro <code>99<\/code> et <code>60<\/code> fit <code>throw<\/code>, itaque illud <code>say<\/code> praeteritur. <code>CATCH<\/code> loco eius exceptionem tractat. Corpus <code>for<\/code> ipsum est clausula quam <code>CATCH<\/code> custodit. Itaque exceptio capta solum gyrum currentem finit. Deinde anulus simpliciter ad valorem sequentem transit.<\/span><\/li><\/ol>"]]}}}</script>
