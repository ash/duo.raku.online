e up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Un valore entro il limite deve semplicemente dire che va bene.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo mostra che solo i numeri che falliscono causano un'eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Gli altri numeri passano dritti, e il ciclo va avanti in tutti e due i casi.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Esempio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Soluzione<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vedi la soluzione<\/a><\/span><\/p>"]]},"lv":{"t":"Pārāk liels","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uzdevums<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Definējiet savu izņēmuma klasi <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā manto no <code>Exception<\/code>, un tai ir divi atribūti, <code>value<\/code> un <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tās metodei <code>message<\/code> jāatgriež <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Pēc tam palaidiet ciklu pāri vērtībām <code>30<\/code>, <code>99<\/code> un <code>60<\/code> ar robežu <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Katrai vērtībai izmetiet <code>TooBig<\/code> tikai tad, ja vērtība ir virs robežas.<\/span> <span class=\"sg\" data-s=\"2\">Izmantojiet fāzeri <code>CATCH<\/code> ar <code>when TooBig<\/code>, kas izdrukā paziņojumu <strong>un<\/strong> otru rindu.<\/span> <span class=\"sg\" data-s=\"3\">Šajā rindā tas tieši nolasa izņēmuma atribūtu <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"4\">Tas izdrukā <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Vērtībai robežās vienkārši jāziņo, ka viss ir kārtībā.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tas parāda, ka izņēmumu izraisa tikai neveiksmīgie skaitļi.<\/span> <span class=\"sg\" data-s=\"1\">Pārējie skaitļi iziet tieši cauri, un cikls abos gadījumos turpinās.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Piemērs<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Risinājums<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Skatīt risinājumu<\/a><\/span><\/p>"]]},"ru":{"t":"Слишком большое","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Определите собственный класс исключения <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он наследует от <code>Exception<\/code> и имеет два атрибута: <code>value<\/code> и <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Его метод <code>message<\/code> должен возвращать <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Затем пройдите циклом по значениям <code>30<\/code>, <code>99<\/code> и <code>60<\/code> при пределе <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для каждого значения бросайте <code>TooBig<\/code>, только если значение больше предела.<\/span> <span class=\"sg\" data-s=\"2\">Возьмите фазер <code>CATCH<\/code> с ветвью <code>when TooBig<\/code>, который печатает сообщение <strong>и<\/strong> вторую строку.<\/span> <span class=\"sg\" data-s=\"3\">Для этой строки он напрямую читает атрибут <code>limit<\/code> исключения.<\/span> <span class=\"sg\" data-s=\"4\">Он печатает <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Для значения в пределах нормы программа должна просто сообщить, что всё в порядке.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Это показывает, что исключение вызывают только числа, которые не проходят проверку.<\/span> <span class=\"sg\" data-s=\"1\">Остальные числа проходят насквозь, а цикл в обоих случаях продолжается.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Посмотреть решение<\/a><\/span><\/p>"]]},"uk":{"t":"Вправа «Завелике»","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Завдання<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Визначте власний клас винятку <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він успадковує від <code>Exception<\/code> і має два атрибути, <code>value<\/code> та <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Його метод <code>message<\/code> має повертати <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Потім пройдіть циклом значення <code>30<\/code>, <code>99<\/code> та <code>60<\/code> з межею <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Для кожного значення кидайте <code>TooBig<\/code>, лише якщо воно більше за межу.<\/span> <span class=\"sg\" data-s=\"2\">Скористайтеся фазером <code>CATCH<\/code> із <code>when TooBig<\/code>, який виводить повідомлення <strong>і<\/strong> другий рядок.<\/span> <span class=\"sg\" data-s=\"3\">У цьому рядку він напряму читає атрибут <code>limit<\/code> винятку.<\/span> <span class=\"sg\" data-s=\"4\">Він виводить <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Для значення, що не виходить за межу, програма має просто повідомити, що все гаразд.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Це показує, що виняток спричиняють лише погані числа.<\/span> <span class=\"sg\" data-s=\"1\">Інші числа проходять без зупинки, і цикл триває в обох випадках.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Приклад<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Рішення<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Дивіться рішення<\/a><\/span><\/p>"]]},"bg":{"t":"Упражнение „Твърде голямо“","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Задача<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Дефинирайте собствен клас изключение <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той наследява <code>Exception<\/code> и има два атрибута, <code>value<\/code> и <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Методът му <code>message<\/code> трябва да връща <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">После обходете в цикъл стойностите <code>30<\/code>, <code>99<\/code> и <code>60<\/code> при граница <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">За всяка стойност хвърляйте <code>TooBig<\/code> само ако стойността е над границата.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте фазер <code>CATCH<\/code> с <code>when TooBig<\/code>, който отпечатва съобщението <strong>и<\/strong> втори ред.<\/span> <span class=\"sg\" data-s=\"3\">На този ред той чете направо атрибута <code>limit<\/code> на изключението.<\/span> <span class=\"sg\" data-s=\"4\">Той отпечатва <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Стойност в рамките на границата трябва просто да съобщи, че е наред.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Това показва, че само провалените числа водят до изключение.<\/span> <span class=\"sg\" data-s=\"1\">Другите числа минават направо, а цикълът продължава и в двата случая.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Пример<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Решение<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Вижте решението<\/a><\/span><\/p>"]]},"eo":{"t":"Tro granda","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problemo<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Difinu propran esceptoklason <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi heredas de <code>Exception<\/code> kaj havas du atributojn, <code>value<\/code> kaj <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝia metodo <code>message<\/code> redonu <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Poste iru tra la valoroj <code>30<\/code>, <code>99<\/code> kaj <code>60<\/code>, kun limo de <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Por ĉiu valoro, ĵetu <code>TooBig<\/code> nur, se la valoro estas super la limo.<\/span> <span class=\"sg\" data-s=\"2\">Uzu fazeron <code>CATCH<\/code> kun <code>when TooBig<\/code>, kiu presas la mesaĝon <strong>kaj<\/strong> duan linion.<\/span> <span class=\"sg\" data-s=\"3\">En tiu linio, ĝi legas la atributon <code>limit<\/code> de la escepto rekte.<\/span> <span class=\"sg\" data-s=\"4\">Ĝi presas <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Valoro ene de la limo simple raportu, ke ĝi estas en ordo.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tio montras, ke nur la malsukcesantaj nombroj kaŭzas escepton.<\/span> <span class=\"sg\" data-s=\"1\">La aliaj nombroj pasas rekte, kaj la buklo daŭras en ambaŭ kazoj.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ekzemplo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solvo<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vidu la solvon<\/a><\/span><\/p>"]]},"la":{"t":"Nimis magnum","b":[["h",1,"<h3><span class=\"sg\" data-s=\"0\">Problema<\/span><\/h3>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Define classem exceptionis propriae <code>TooBig<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ab <code>Exception<\/code> heredat et duo attributa habet, <code>value<\/code> et <code>limit<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Methodus eius <code>message<\/code> reddere debet <code>Value &lt;value&gt; exceeds the limit of &lt;limit&gt;<\/code>.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Deinde percurre valores <code>30<\/code>, <code>99<\/code> et <code>60<\/code>, cum limite <code>50<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pro quoque valore iace <code>TooBig<\/code> solum si valor supra limitem est.<\/span> <span class=\"sg\" data-s=\"2\">Utere fasi <code>CATCH<\/code> cum <code>when TooBig<\/code> quae nuntium <strong>et<\/strong> alteram lineam imprimit.<\/span> <span class=\"sg\" data-s=\"3\">In illa linea attributum <code>limit<\/code> exceptionis directe legit.<\/span> <span class=\"sg\" data-s=\"4\">Imprimit <code>Try a value up to &lt;limit&gt;.<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Valor intra limitem simpliciter nuntiare debet se bonum esse.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc ostendit solum numeros deficientes exceptionem facere.<\/span> <span class=\"sg\" data-s=\"1\">Ceteri numeri recta transeunt, et anulus utroque casu pergit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exemplum<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Value 30 is within the limit\nValue 99 exceeds the limit of 50\nTry a value up to 50.\nValue 60 exceeds the limit of 50\nTry a value up to 50.<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Solutio<\/span><\/h3>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">✅ <a href=\"/oop/custom-exceptions/exercises/too-big/solution/\">Vide solutionem<\/a><\/span><\/p>"]]}}}</script>
