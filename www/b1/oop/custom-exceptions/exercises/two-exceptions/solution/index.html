<script type="application/json" id="page-data">{"u":"oop/custom-exceptions/exercises/two-exceptions/solution","n":968,"k":"solution","pv":"oop/custom-exceptions/exercises/two-exceptions","nx":"oop/custom-exceptions/quiz","tr":["oop","oop/custom-exceptions"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Two exception types‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The loop throws a <code>TooSmall<\/code> in the first round and a <code>TooBig<\/code> in the second. Each one is thrown inside its own block, which has its own <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The <code>CATCH<\/code> phaser has a <code>when<\/code> branch for each exception type. In each round, only the branch that matches the thrown type runs. So the first round prints <code>small<\/code>, and the second prints <code>big<\/code>. This is how one set of handlers reacts differently to each kind of Small is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De lus werpt een <code>TooSmall<\/code> in de eerste ronde en een <code>TooBig<\/code> in de tweede. Elke exceptie wordt binnen een eigen blok geworpen, dat een eigen <code>CATCH<\/code> heeft.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De <code>CATCH<\/code>-faser heeft een <code>when<\/code>-tak voor elk exceptietype. In elke ronde draait alleen de tak die op het geworpen type matcht. Dus drukt de eerste ronde <code>small<\/code> af, en de tweede <code>big<\/code>. Zo reageert één groep afhandelaars op elke soort fout anders.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Dos tipos de excepción","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El bucle lanza una <code>TooSmall<\/code> en la primera vuelta y una <code>TooBig<\/code> en la segunda. Cada una se lanza dentro de su propio bloque, que tiene su propio <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El phaser <code>CATCH<\/code> tiene una rama <code>when<\/code> para cada tipo de excepción. En cada vuelta, solo se ejecuta la rama que coincide con el tipo lanzado. Así que la primera vuelta imprime <code>small<\/code>, y la segunda imprime <code>big<\/code>. De esta forma, un mismo grupo de manejadores reacciona de forma distinta a cada tipo de error.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Due tipi di eccezione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_b ikls pirmajā piegājienā izmet <code>TooSmall<\/code>, bet otrajā — <code>TooBig<\/code>. Katrs no tiem tiek izmests savā blokā, kuram ir savs <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Fāzerim <code>CATCH<\/code> ir <code>when<\/code> zars katram izņēmuma tipam. Katrā piegājienā izpildās tikai tas zars, kas atbilst izmestajam tipam. Tāpēc pirmais piegājiens izdrukā <code>small<\/code>, bet otrais — <code>big<\/code>. Tā viens apstrādātāju kopums atšķirīgi reaģē uz katru kļūdas veidu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Два типа исключений","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class TooSmall is Exception {\n    method message { 'too small' }\n}\n\nclass TooBig is Exception {\n    method message { 'too big' }\n}\n\nfor TooSmall, TooBig -&gt; $type {\n    {\n        $type.new.throw;\n\n        CATCH {\n            when TooSmall { say 'small' }\n            when TooBig   { say 'big' }\n        }\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/custom-exceptions/two-exceptions.raku\" target=\"_blank\" rel=\"noopener\">two-exceptions.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>small\nbig<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Цикл бросает <code>TooSmall<\/code> на первом проходе и <code>TooBig<\/code> на втором. Каждое исключение бросается внутри своего блока, у которого есть свой <code>CATCH<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">У фазера <code>CATCH<\/code> есть ветвь <code>when<\/code> для каждого типа исключения. На ка
