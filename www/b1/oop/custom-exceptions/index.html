<script type="application/json" id="page-data">{"u":"oop/custom-exceptions","n":961,"k":"section","pv":"oop/failures/quiz","nx":"oop/custom-exceptions/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Custom exceptions","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku has built-in <code>X::<\/code> exceptions, but you can also create your own.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception is a class that inherits from the built-in <code>Exception<\/code> class.<\/span> <span class=\"sg\" data-s=\"2\">It also has a <code>message<\/code> method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is a normal class, so it can have attributes such as <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But because it <code>is Exception<\/code>, you can throw it.<\/span> <span class=\"sg\" data-s=\"2\">To throw it, you create an object and call <code>.throw<\/code> on it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inside the <code>CATCH<\/code>, <code>when TooBig<\/code> matches because the thrown object has that type.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception carries any data that you give it, here the <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">So the handler can build an exact message or react in a special way.<\/span> <span class=\"sg\" data-s=\"3\">That is much more useful than a plain string given to <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This page brings together everything from this part.<\/span> <span class=\"sg\" data-s=\"1\">A custom exception is a <em>class<\/em> with attributes and a method.<\/span> <span class=\"sg\" data-s=\"2\">It also takes part in the exception system of Raku.<\/span> <span class=\"sg\" data-s=\"3\">So it is ready to report exactly what went wrong.<\/span><\/p>"]]},"de":{"t":"Eigene Ausnahmen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku hat eingebaute <code>X::<\/code>-Ausnahmen, aber Sie können auch eigene erstellen.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme ist eine Klasse, die von der eingebauten Klasse <code>Exception<\/code> erbt.<\/span> <span class=\"sg\" data-s=\"2\">Sie hat außerdem eine Methode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ist eine normale Klasse, also kann sie Attribute wie <code>value<\/code> haben.<\/span> <span class=\"sg\" data-s=\"1\">Aber weil sie <code>is Exception<\/code> ist, können Sie sie werfen.<\/span> <span class=\"sg\" data-s=\"2\">Dazu erzeugen Sie ein Objekt und rufen darauf <code>.throw<\/code> auf:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Innerhalb des <code>CATCH<\/code> trifft <code>when TooBig<\/code> zu, weil das geworfene Objekt diesen Typ hat.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme trägt alle Daten mit sich, die Sie ihr geben, hier den <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Also kann die Behandlung eine genaue Meldung bauen oder auf besondere Weise reagieren.<\/span> <span class=\"sg\" data-s=\"3\">Das ist viel nützlicher als eine einfache Zeichenkette, die man an <code>die<\/code> übergibt.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Diese Seite bringt alles aus diesem Teil zusammen.<\/span> <span class=\"sg\" data-s=\"1\">Eine eigene Ausnahme ist eine <em>Klasse<\/em> mit Attributen und einer Methode.<\/span> <span class=\"sg\" data-s=\"2\">Sie nimmt auch am Ausnahmesystem von Raku teil.<\/span> <span class=\"sg\" data-s=\"3\">So ist sie bereit, genau zu melden, was schiefgegangen ist.<\/span><\/p>"]]},"nl":{"t":"Eigen excepties","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku heeft ingebouwde <code>X::<\/code>-excepties, maar je kunt ook je eigen excepties maken.<\/span> <span class=\"sg\" data-s=\"1\">Een eigen exceptie is een klasse die van de ingebouwde klasse <code>Exception<\/code> erft.<\/span> <span class=\"sg\" data-s=\"2\">Ze heeft ook een methode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> is een gewone klasse, dus kan hij attributen hebben, zoals <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Maar omdat hij <code>is Exception<\/code>, kun je hem werpen.<\/span> <span class=\"sg\" data-s=\"2\">Om hem te werpen, maak je een object en roep je er <code>.throw<\/code> op aan:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pr 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro del <code>CATCH<\/code>, <code>when TooBig<\/code> coincide porque el objeto lanzado tiene ese tipo.<\/span> <span class=\"sg\" data-s=\"1\">Una excepción personalizada lleva los datos que le des, aquí el <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que el manejador puede crear un mensaje exacto o reaccionar de una forma especial.<\/span> <span class=\"sg\" data-s=\"3\">Eso es mucho más útil que una simple cadena pasada a <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta página reúne todo lo de esta parte.<\/span> <span class=\"sg\" data-s=\"1\">Una excepción personalizada es una <em>clase<\/em> con atributos y un método.<\/span> <span class=\"sg\" data-s=\"2\">También participa en el sistema de excepciones de Raku.<\/span> <span class=\"sg\" data-s=\"3\">Así que está lista para informar exactamente de qué salió mal.<\/span><\/p>"]]},"it":{"t":"Eccezioni personalizzate","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku ha le eccezioni incorporate <code>X::<\/code>, ma puoi anche creare le tue.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata è una classe che eredita dalla classe incorporata <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ha anche un metodo <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> è una classe normale, quindi può avere attributi come <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma poiché è <code>is Exception<\/code>, puoi sollevarla.<\/span> <span class=\"sg\" data-s=\"2\">Per sollevarla, crei un oggetto e chiami <code>.throw<\/code> su di esso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro il <code>CATCH<\/code>, <code>when TooBig<\/code> corrisponde perché l'oggetto sollevato ha quel tipo.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata porta con sé tutti i dati che le dai, qui il <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Così il gestore può costruire un messaggio preciso o reagire in un modo speciale.<\/span> <span class=\"sg\" data-s=\"3\">È molto più utile di una semplice stringa data a <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questa pagina mette insieme tutto quello che c'è in questa parte.<\/span> <span class=\"sg\" data-s=\"1\">Un'eccezione personalizzata è una <em>classe<\/em> con attributi e un metodo.<\/span> <span class=\"sg\" data-s=\"2\">Prende anche parte al sistema delle eccezioni di Raku.<\/span> <span class=\"sg\" data-s=\"3\">Così è pronta a segnalare esattamente che cosa è andato storto.<\/span><\/p>"]]},"lv":{"t":"Paša veidoti izņēmumi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku valodā ir iebūvēti <code>X::<\/code> izņēmumi, bet jūs varat izveidot arī savus.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums ir klase, kas manto no iebūvētās klases <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tai ir arī metode <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> ir parasta klase, tāpēc tai var būt atribūti, piemēram, <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet, tā kā tā <code>is Exception<\/code>, to var izmest.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izmestu, jūs izveidojat objektu un izsaucat uz tā <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Fāzerī <code>CATCH<\/code> zars <code>when TooBig<\/code> atbilst, jo izmestajam objektam ir šis tips.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums nes līdzi jebkurus datus, ko jūs tam dodat, šeit tas ir <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc apstrādātājs var uzbūvēt precīzu paziņojumu vai reaģēt īpašā veidā.<\/span> <span class=\"sg\" data-s=\"3\">Tas ir daudz noderīgāk nekā vienkārša virkne, kas padota <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šī lapa savieno kopā visu no šīs daļas.<\/span> <span class=\"sg\" data-s=\"1\">Paša definēts izņēmums ir <em>klase<\/em> ar atribūtiem un metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tā piedalās arī Raku izņēmumu sistēmā.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc tā ir gatava precīzi paziņot, kas nogāja greizi.<\/span><\/p>"]]},"ru":{"t":"Собственные исключения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">В Raku есть встроенные исключения <code>X::<\/code>, но вы можете создавать и свои.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение — это класс, который наследует от встроенного класса <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ещё у него есть метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> — обычный класс, поэтому у него могут быть атрибуты, например <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но так как он <code>is Exception<\/code>, его можно бросить.<\/span> <span class=\"sg\" data-s=\"2\">Чтобы бросить его, вы создаёте объект и вызываете у него <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>CATCH<\/code> срабатывает <code>when TooBig<\/code>, потому что брошенный объект имеет этот тип.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение несёт любые данные, которые вы ему даёте, здесь это <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому обработчик может составить точное сообщение или отреагировать особым образом.<\/span> <span class=\"sg\" data-s=\"3\">Это гораздо полезнее, чем простая строка, переданная в <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Эта страница собирает вместе всё из этой части.<\/span> <span class=\"sg\" data-s=\"1\">Собственное исключение — это <em>класс<\/em> с атрибутами и методом.<\/span> <span class=\"sg\" data-s=\"2\">Ещё оно участвует в системе исключений Raku.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому оно готово точно сообщить, что пошло не так.<\/span><\/p>"]]},"uk":{"t":"Власні винятки","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku має вбудовані винятки <code>X::<\/code>, але ви можете створювати й власні.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток — це клас, який успадковує від вбудованого класу <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Також він має метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> — звичайний клас, тож він може мати атрибути, як-от <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але оскільки він <code>is Exception<\/code>, його можна кинути.<\/span> <span class=\"sg\" data-s=\"2\">Щоб кинути його, ви створюєте об'єкт і викликаєте для нього <code>.throw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>CATCH<\/code> гілка <code>when TooBig<\/code> збігається, бо кинутий об'єкт має цей тип.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток несе будь-які дані, які ви йому даєте, тут це <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож обробник може побудувати точне повідомлення або відреагувати особливим способом.<\/span> <span class=\"sg\" data-s=\"3\">Це набагато корисніше, ніж простий рядок, переданий до <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ця сторінка зводить разом усе з цієї частини.<\/span> <span class=\"sg\" data-s=\"1\">Власний виняток — це <em>клас<\/em> з атрибутами й методом.<\/span> <span class=\"sg\" data-s=\"2\">Також він бере участь у системі винятків Raku.<\/span> <span class=\"sg\" data-s=\"3\">Тож він готовий точно повідомити, що пішло не так.<\/span><\/p>"]]},"bg":{"t":"Собствени изключения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku има вградени изключения <code>X::<\/code>, но можете да създавате и свои собствени.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение е клас, който наследява вградения клас <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той има и метод <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> е нормален клас, така че може да има атрибути като <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но понеже е <code>is Exception<\/code>, можете да го хвърлите.<\/span> <span class=\"sg\" data-s=\"2\">За да го хвърлите, създавате обект и извиквате <code>.throw<\/code> върху него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>CATCH<\/code> клонът <code>when TooBig<\/code> съвпада, защото хвърленият обект е от този тип.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение носи всякакви данни, които му дадете, тук <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Така обработчикът може да състави точно съобщение или да реагира по особен начин.<\/span> <span class=\"sg\" data-s=\"3\">Това е много по-полезно от обикновен низ, подаден на <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Тази страница събира всичко от тази част.<\/span> <span class=\"sg\" data-s=\"1\">Собственото изключение е <em>клас<\/em> с атрибути и метод.<\/span> <span class=\"sg\" data-s=\"2\">То участва и в системата за изключения на Raku.<\/span> <span class=\"sg\" data-s=\"3\">Така то е готово да съобщи точно какво се е объркало.<\/span><\/p>"]]},"eo":{"t":"Propraj esceptoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku havas enkonstruitajn esceptojn <code>X::<\/code>, sed vi ankaŭ povas krei viajn proprajn.<\/span> <span class=\"sg\" data-s=\"1\">Propra escepto estas klaso, kiu heredas de la enkonstruita klaso <code>Exception<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ havas metodon <code>message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> estas normala klaso, do ĝi povas havi atributojn kiel <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed ĉar ĝi <code>is Exception<\/code>, vi povas ĵeti ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Por ĵeti ĝin, vi kreas objekton kaj vokas <code>.throw<\/code> sur ĝi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ene de la <code>CATCH<\/code>, <code>when TooBig<\/code> kongruas, ĉar la ĵetita objekto havas tiun tipon.<\/span> <span class=\"sg\" data-s=\"1\">Propra escepto portas ĉiujn datumojn, kiujn vi donas al ĝi, ĉi tie la <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do la traktilo povas konstrui precizan mesaĝon aŭ reagi en speciala maniero.<\/span> <span class=\"sg\" data-s=\"3\">Tio estas multe pli utila ol simpla ĉeno donita al <code>die<\/code>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu paĝo kunigas ĉion el ĉi tiu parto.<\/span> <span class=\"sg\" data-s=\"1\">Propra escepto estas <em>klaso<\/em> kun atributoj kaj metodo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ partoprenas en la escepta sistemo de Raku.<\/span> <span class=\"sg\" data-s=\"3\">Do ĝi estas preta raporti ĝuste, kio misiris.<\/span><\/p>"]]},"la":{"t":"Exceptiones propriae","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Raku exceptiones inbuiltas <code>X::<\/code> habet, sed etiam tuas ipsius creare potes.<\/span> <span class=\"sg\" data-s=\"1\">Exceptio propria est classis quae ab inbuilta classe <code>Exception<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"2\">Etiam methodum <code>message<\/code> habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class TooBig is Exception {\n    has $.value;\n\n    method message {\n        \"Value $.value is too big\";\n    }\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>TooBig<\/code> classis ordinaria est, itaque attributa habere potest, sicut <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed quia <code>is Exception<\/code>, eam iacere potes.<\/span> <span class=\"sg\" data-s=\"2\">Ut eam iacias, obiectum creas et <code>.throw<\/code> in eo vocas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $value = 20 * 30;\n\nTooBig.new(value =&gt; $value).throw if $value &gt; 50;\n\nCATCH {\n    when TooBig {\n        say .message;\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>Value 600 is too big<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Intra <code>CATCH<\/code>, <code>when TooBig<\/code> convenit quia obiectum iactum illud genus habet.<\/span> <span class=\"sg\" data-s=\"1\">Exceptio propria quaelibet data fert quae ei das, hic <code>value<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Itaque tractator nuntium exactum aedificare vel modo speciali reagere potest.<\/span> <span class=\"sg\" data-s=\"3\">Hoc multo utilius est quam chorda simplex ad <code>die<\/code> tradita.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Haec pagina omnia ex hac parte coniungit.<\/span> <span class=\"sg\" data-s=\"1\">Exceptio propria est <em>classis<\/em> cum attributis et methodo.<\/span> <span class=\"sg\" data-s=\"2\">Etiam in systemate exceptionum Raku partem habet.<\/span> <span class=\"sg\" data-s=\"3\">Itaque parata est nuntiare quid exacte male cesserit.<\/span><\/p>"]]}}}</script>
