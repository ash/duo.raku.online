<script type="application/json" id="page-data">{"u":"oop/file-handles","n":896,"k":"section","pv":"oop/deleting/quiz","nx":"oop/file-handles/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"File handles","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Reading or writing a whole file at once is easy.<\/span> <span class=\"sg\" data-s=\"1\">But sometimes you want to go through a file one line at a time.<\/span> <span class=\"sg\" data-s=\"2\">Or you may want to keep a file open and write to it many times.<\/span> <span class=\"sg\" data-s=\"3\">For that, you use a <em>file handle<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is the simplest way to read a file line by line.<\/span> <span class=\"sg\" data-s=\"1\">You do not even need to create a handle for it.<\/span> <span class=\"sg\" data-s=\"2\">The <code>lines<\/code> method of a path object gives you the lines one at a time.<\/span> <span class=\"sg\" data-s=\"3\">They are ready for a <code>for<\/code> loop:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Each <code>$line<\/code> is one line without the newline at its end.<\/span> <span class=\"sg\" data-s=\"1\">The program prints:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">To write through a handle, open the file with <code>open<\/code> and the <code>:w<\/code> (write) flag.<\/span> <span class=\"sg\" data-s=\"1\">Then use the <code>say<\/code> or <code>print<\/code> methods of the handle.<\/span> <span class=\"sg\" data-s=\"2\">When you are done, <code>close<\/code> it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Closing the handle makes sure that everything you wrote really gets saved to disk.<\/span> <span class=\"sg\" data-s=\"1\">Some files are too large to load into memory all at once.<\/span> <span class=\"sg\" data-s=\"2\">For them, you usually read line by line, as above.<\/span><\/p>"]]},"de":{"t":"Dateihandles","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine ganze Datei auf einmal zu lesen oder zu schreiben ist einfach.<\/span> <span class=\"sg\" data-s=\"1\">Aber manchmal möchten Sie eine Datei Zeile für Zeile durchgehen.<\/span> <span class=\"sg\" data-s=\"2\">Oder Sie möchten eine Datei offen halten und viele Male hineinschreiben.<\/span> <span class=\"sg\" data-s=\"3\">Dafür verwenden Sie einen <em>Dateihandle<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist der einfachste Weg, eine Datei Zeile für Zeile zu lesen.<\/span> <span class=\"sg\" data-s=\"1\">Sie müssen dafür nicht einmal einen Handle erstellen.<\/span> <span class=\"sg\" data-s=\"2\">Die Methode <code>lines<\/code> eines Pfadobjekts gibt Ihnen die Zeilen einzeln.<\/span> <span class=\"sg\" data-s=\"3\">Diese sind bereit für eine <code>for<\/code>-Schleife:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jede <code>$line<\/code> ist eine Zeile ohne den Zeilenumbruch an ihrem Ende.<\/span> <span class=\"sg\" data-s=\"1\">Das Programm gibt aus:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Um über einen Handle zu schreiben, öffnen Sie die Datei mit <code>open<\/code> und dem Schalter <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">Verwenden Sie dann die Methoden <code>say<\/code> oder <code>print<\/code> des Handles.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie fertig sind, schließen Sie ihn mit <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das Schließen des Handles sorgt dafür, dass alles Geschriebene wirklich auf der Festplatte landet.<\/span> <span class=\"sg\" data-s=\"1\">Manche Dateien sind zu groß, um sie auf einmal in den Speicher zu laden.<\/span> <span class=\"sg\" data-s=\"2\">Solche Dateien lesen Sie meistens Zeile für Zeile, wie oben.<\/span><\/p>"]]},"nl":{"t":"Bestandshandles","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een heel bestand in één keer lezen of schrijven is makkelijk.<\/span> <span class=\"sg\" data-s=\"1\">Maar soms wil je een bestand regel voor regel doorlopen.<\/span> <span class=\"sg\" data-s=\"2\">Of je wilt een bestand open houden en er vaak naar schrijven.<\/span> <span class=\"sg\" data-s=\"3\">Daarvoor gebruik je een <em>bestandshandle<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit is de eenvoudigste manier om een bestand regel voor regel te lezen.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft er niet eens een handle voor te maken.<\/span> <span class=\"sg\" data-s=\"2\">De methode <code>lines<\/code> van een padobject geeft je de regels een voor een.<\/span> <span class=\"sg\" data-s=\"3\">Ze zijn klaar voor een <code>for<\/code>-lus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Elke <code>$line<\/code> is één regel, zonder de newline aan het eind.<\/span> <span class=\"sg\" data-s=\"1\">Het programma drukt af:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Om via een handle te schrijven, open je het bestand met <code>open<\/code> en de vlag <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">Gebruik daarna de methoden <code>say<\/code> of <code>print<\/code> van de handle.<\/span> <span class=\"sg\" data-s=\"2\">Als je klaar bent, <code>close<\/code> je hem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De handle sluiten zorgt ervoor dat alles wat je geschreven hebt echt op schijf wordt opgeslagen.<\/span> <span class=\"sg\" data-s=\"1\">Sommige bestanden zijn te groot om in één keer in het geheugen te laden.<\/span> <span class=\"sg\" data-s=\"2\">Die lees je meestal regel voor regel, zoals hierboven.<\/span><\/p>"]]},"es":{"t":"Manejadores de archivo","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Leer o escribir un archivo entero de una vez es fácil.<\/span> <span class=\"sg\" data-s=\"1\">Pero a veces quieres recorrer un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"2\">O quizá quieras mantener un archivo abierto y escribir en él muchas veces.<\/span> <span class=\"sg\" data-s=\"3\">Para eso, usas un <em>manejador de archivo<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esta es la forma más sencilla de leer un archivo línea a línea.<\/span> <span class=\"sg\" data-s=\"1\">Ni siquiera necesitas crear un manejador para ello.<\/span> <span class=\"sg\" data-s=\"2\">El método <code>lines<\/code> de un objeto de ruta te da las líneas de una en una.<\/span> <span class=\"sg\" data-s=\"3\">Están listas para un bucle <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cada <code>$line<\/code> es una línea sin el salto de línea del final.<\/span> <span class=\"sg\" data-s=\"1\">El programa imprime:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Para escribir con un manejador, abre el archivo con <code>open<\/code> y la bandera <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">Después usa los métodos <code>say<\/code> o <code>print<\/code> del manejador.<\/span> <span class=\"sg\" data-s=\"2\">Cuando termines, ciérralo con <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cerrar el manejador asegura que todo lo que escribiste se guarda de verdad en el disco.<\/span> <span class=\"sg\" data-s=\"1\">Algunos archivos son demasiado grandes para cargarlos en memoria de una vez.<\/span> <span class=\"sg\" data-s=\"2\">Con ellos, normalmente lees línea a línea, como arriba.<\/span><\/p>"]]},"it":{"t":"Handle di file","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Leggere o scrivere un file intero in una volta è facile.<\/span> <span class=\"sg\" data-s=\"1\">Ma a volte vuoi scorrere un file una riga alla volta.<\/span> <span class=\"sg\" data-s=\"2\">Oppure vuoi tenere un file aperto e scriverci molte volte.<\/span> <span class=\"sg\" data-s=\"3\">Per questo si usa un <em>handle di file<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco il modo più semplice per leggere un file riga per riga.<\/span> <span class=\"sg\" data-s=\"1\">Non devi nemmeno creare un handle per farlo.<\/span> <span class=\"sg\" data-s=\"2\">Il metodo <code>lines<\/code> di un oggetto percorso ti dà le righe una alla volta.<\/span> <span class=\"sg\" data-s=\"3\">Sono pronte per un ciclo <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ogni <code>$line<\/code> è una riga senza il ritorno a capo finale.<\/span> <span class=\"sg\" data-s=\"1\">Il programma stampa:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Per scrivere attraverso un handle, apri il file con <code>open<\/code> e il flag <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">Poi usa i metodi <code>say<\/code> o <code>print<\/code> dell'handle.<\/span> <span class=\"sg\" data-s=\"2\">Quando hai finito, chiudilo con <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando chiudi l'handle, tutto quello che hai scritto viene davvero salvato su disco.<\/span> <span class=\"sg\" data-s=\"1\">Alcuni file sono troppo grandi per caricarli in memoria tutti in una volta.<\/span> <span class=\"sg\" data-s=\"2\">Per questi file di solito leggi riga per riga, come sopra.<\/span><\/p>"]]},"lv":{"t":"Failu deskriptori","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Nolasīt vai ierakstīt visu failu uzreiz ir viegli.<\/span> <span class=\"sg\" data-s=\"1\">Bet dažreiz jūs gribat iet cauri failam pa vienai rindai.<\/span> <span class=\"sg\" data-s=\"2\">Vai arī jūs varbūt gribat turēt failu atvērtu un rakstīt tajā daudz reižu.<\/span> <span class=\"sg\" data-s=\"3\">Tam jūs izmantojat <em>faila turi<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vienkāršākais veids, kā lasīt failu pa rindai.<\/span> <span class=\"sg\" data-s=\"1\">Tam jums pat nav jāizveido turis.<\/span> <span class=\"sg\" data-s=\"2\">Ceļa objekta metode <code>lines<\/code> dod jums rindas pa vienai.<\/span> <span class=\"sg\" data-s=\"3\">Tās ir gatavas ciklam <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Katrs <code>$line<\/code> ir viena rinda bez jaunas rindas rakstzīmes beigās.<\/span> <span class=\"sg\" data-s=\"1\">Programma izdrukā:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Lai rakstītu caur turi, atveriet failu ar <code>open<\/code> un karodziņu <code>:w<\/code> (rakstīšanai).<\/span> <span class=\"sg\" data-s=\"1\">Tad izmantojiet tura metodes <code>say<\/code> vai <code>print<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kad esat pabeiguši, aizveriet to ar <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad jūs aizverat turi, viss, ko jūs ierakstījāt, tiešām tiek saglabāts diskā.<\/span> <span class=\"sg\" data-s=\"1\">Daži faili ir par lielu, lai tos ielādētu atmiņā visus uzreiz.<\/span> <span class=\"sg\" data-s=\"2\">Tādus failus jūs parasti lasāt pa rindai, kā augstāk.<\/span><\/p>"]]},"ru":{"t":"Файловые дескрипторы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Читать или записывать весь файл сразу легко.<\/span> <span class=\"sg\" data-s=\"1\">Но иногда нужно пройти по файлу строка за строкой.<\/span> <span class=\"sg\" data-s=\"2\">Или вы хотите держать файл открытым и много раз писать в него.<\/span> <span class=\"sg\" data-s=\"3\">Для этого используют <em>файловый дескриптор<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот самый простой способ читать файл построчно.<\/span> <span class=\"sg\" data-s=\"1\">Для этого даже не нужно создавать дескриптор.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>lines<\/code> у объекта пути выдаёт строки по одной.<\/span> <span class=\"sg\" data-s=\"3\">Они сразу готовы для цикла <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Каждая <code>$line<\/code> — это одна строка без перевода строки в конце.<\/span> <span class=\"sg\" data-s=\"1\">Программа печатает:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Чтобы писать через дескриптор, откройте файл с помощью <code>open<\/code> и флага <code>:w<\/code> (запись).<\/span> <span class=\"sg\" data-s=\"1\">Потом используйте методы <code>say<\/code> или <code>print<\/code> у дескриптора.<\/span> <span class=\"sg\" data-s=\"2\">Когда закончите, закройте его через <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Если закрыть дескриптор, всё, что вы записали, точно сохранится на диске.<\/span> <span class=\"sg\" data-s=\"1\">Некоторые файлы слишком большие, чтобы загрузить их в память целиком.<\/span> <span class=\"sg\" data-s=\"2\">Их обычно читают построчно, как выше.<\/span><\/p>"]]},"uk":{"t":"Дескриптори файлів","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Читати чи записувати весь файл за раз легко.<\/span> <span class=\"sg\" data-s=\"1\">Але іноді потрібно пройти файл рядок за рядком.<\/span> <span class=\"sg\" data-s=\"2\">Або ви хочете тримати файл відкритим і писати в нього багато разів.<\/span> <span class=\"sg\" data-s=\"3\">Для цього використовують <em>дескриптор файлу<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось найпростіший спосіб читати файл рядок за рядком.<\/span> <span class=\"sg\" data-s=\"1\">Вам навіть не треба створювати для цього дескриптор.<\/span> <span class=\"sg\" data-s=\"2\">Метод <code>lines<\/code> об'єкта шляху дає вам рядки по одному.<\/span> <span class=\"sg\" data-s=\"3\">Вони готові для циклу <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Кожен <code>$line<\/code> — це один рядок без символу нового рядка в кінці.<\/span> <span class=\"sg\" data-s=\"1\">Програма виводить:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Щоб писати через дескриптор, відкрийте файл за допомогою <code>open<\/code> із прапорцем <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">Потім використовуйте методи <code>say<\/code> або <code>print<\/code> дескриптора.<\/span> <span class=\"sg\" data-s=\"2\">Коли закінчите, закрийте його через <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли ви закриваєте дескриптор, усе написане справді зберігається на диску.<\/span> <span class=\"sg\" data-s=\"1\">Деякі файли завеликі, щоб завантажити їх у пам'ять цілком.<\/span> <span class=\"sg\" data-s=\"2\">Такі файли зазвичай читають рядок за рядком, як вище.<\/span><\/p>"]]},"bg":{"t":"Манипулатори на файлове","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Четенето или записването на цял файл наведнъж е лесно.<\/span> <span class=\"sg\" data-s=\"1\">Но понякога искате да минете през файла ред по ред.<\/span> <span class=\"sg\" data-s=\"2\">Или може да искате да държите файла отворен и да пишете в него много пъти.<\/span> <span class=\"sg\" data-s=\"3\">За това използвате <em>манипулатор на файл<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето най-простия начин да четете файл ред по ред.<\/span> <span class=\"sg\" data-s=\"1\">За него дори не е нужно да създавате манипулатор.<\/span> <span class=\"sg\" data-s=\"2\">Методът <code>lines<\/code> на обекта-път ви дава редовете един по един.<\/span> <span class=\"sg\" data-s=\"3\">Те са готови за цикъл <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Всеки <code>$line<\/code> е един ред без новия ред в края.<\/span> <span class=\"sg\" data-s=\"1\">Програмата отпечатва:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">За да пишете чрез манипулатор, отворете файла с <code>open<\/code> и флага <code>:w<\/code> (write).<\/span> <span class=\"sg\" data-s=\"1\">След това използвайте методите <code>say<\/code> или <code>print<\/code> на манипулатора.<\/span> <span class=\"sg\" data-s=\"2\">Когато приключите, го затворете с <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато затворите манипулатора, всичко, което сте записали, наистина се запазва на диска.<\/span> <span class=\"sg\" data-s=\"1\">Някои файлове са твърде големи, за да се заредят в паметта наведнъж.<\/span> <span class=\"sg\" data-s=\"2\">Тях обикновено ги четете ред по ред, както по-горе.<\/span><\/p>"]]},"eo":{"t":"Dosierteniloj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Legi aŭ skribi tutan dosieron samtempe estas facile.<\/span> <span class=\"sg\" data-s=\"1\">Sed foje vi volas trairi dosieron linio post linio.<\/span> <span class=\"sg\" data-s=\"2\">Aŭ vi eble volas teni dosieron malfermita kaj skribi al ĝi multajn fojojn.<\/span> <span class=\"sg\" data-s=\"3\">Por tio, vi uzas <em>dosiertenilon<\/em>.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen la plej simpla maniero legi dosieron linio post linio.<\/span> <span class=\"sg\" data-s=\"1\">Vi eĉ ne bezonas krei tenilon por tio.<\/span> <span class=\"sg\" data-s=\"2\">La metodo <code>lines<\/code> de vojobjekto donas al vi la liniojn unu post la alia.<\/span> <span class=\"sg\" data-s=\"3\">Ili estas pretaj por buklo <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉiu <code>$line<\/code> estas unu linio sen la linifino ĉe sia fino.<\/span> <span class=\"sg\" data-s=\"1\">La programo presas:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Por skribi per tenilo, malfermu la dosieron per <code>open<\/code> kaj la flago <code>:w<\/code> (skribi).<\/span> <span class=\"sg\" data-s=\"1\">Poste uzu la metodojn <code>say<\/code> aŭ <code>print<\/code> de la tenilo.<\/span> <span class=\"sg\" data-s=\"2\">Kiam vi finis, fermu ĝin per <code>close<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Fermi la tenilon certigas, ke ĉio, kion vi skribis, vere estas konservita sur disko.<\/span> <span class=\"sg\" data-s=\"1\">Kelkaj dosieroj estas tro grandaj por ŝargi en memoron samtempe.<\/span> <span class=\"sg\" data-s=\"2\">Por ili, vi kutime legas linio post linio, kiel supre.<\/span><\/p>"]]},"la":{"t":"Ansae plicarum","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Totum archivum simul legere aut scribere facile est.<\/span> <span class=\"sg\" data-s=\"1\">Sed interdum per archivum una linea post aliam ire vis.<\/span> <span class=\"sg\" data-s=\"2\">Aut fortasse archivum apertum servare et saepe in id scribere vis.<\/span> <span class=\"sg\" data-s=\"3\">Ad hoc <em>tractabulo archivi<\/em> uteris.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecce modus simplicissimus ut archivum linea post lineam legas.<\/span> <span class=\"sg\" data-s=\"1\">Ne tractabulum quidem ad hoc creare debes.<\/span> <span class=\"sg\" data-s=\"2\">Methodus <code>lines<\/code> obiecti semitae lineas tibi unam post alteram dat.<\/span> <span class=\"sg\" data-s=\"3\">Paratae sunt ad anulum <code>for<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>spurt 'words.txt', \"one\\ntwo\\nthree\\n\";\n\nfor 'words.txt'.IO.lines -&gt; $line {\n    say $line.uc;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quaeque <code>$line<\/code> una linea est, sine nova linea in fine.<\/span> <span class=\"sg\" data-s=\"1\">Programma imprimit:<\/span><\/p>"],["code",0,"<pre><code>ONE\nTWO\nTHREE<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ut per tractabulum scribas, archivum per <code>open<\/code> cum vexillo <code>:w<\/code> (scribendi) aperi.<\/span> <span class=\"sg\" data-s=\"1\">Deinde methodis <code>say<\/code> aut <code>print<\/code> tractabuli utere.<\/span> <span class=\"sg\" data-s=\"2\">Cum finivisti, id per <code>close<\/code> claude:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $fh = open 'out.txt', :w;\n$fh.say('first line');\n$fh.say('second line');\n$fh.close;<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Tractabulum claudere curat ut omnia quae scripsisti vere in disco serventur.<\/span> <span class=\"sg\" data-s=\"1\">Quaedam archiva nimis magna sunt ut tota simul in memoriam veniant.<\/span> <span class=\"sg\" data-s=\"2\">Ea plerumque linea post lineam legis, ut supra.<\/span><\/p>"]]}}}</script>
