<script type="application/json" id="page-data">{"u":"oop/file-handles/exercises/pass-a-handle/solution","n":905,"k":"solution","pv":"oop/file-handles/exercises/pass-a-handle","nx":"oop/file-handles/quiz","tr":["oop","oop/file-handles"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The solution of ’Pass a handle to a function‘","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Here is one possible solution.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 You can find the source code in the file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comments<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The handle that <code>open<\/code> returns is just a value kept in <code>$fh<\/code>. So it can be an argument of <code>log-line<\/code>, like any string or number. Inside the subroutine, <code>$fh.say<\/code> writes through that same open handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">The handle stays open during all three calls. So each <code>log-line<\/code> adds another line to the end of the same file. Then <code>close<\/code> saves everything to disk, and <code>slurp<\/code> reads the three lines back.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">This is what makes handles easy to combine. A function can take a handle and write to it, or read from it. It does not care which file the handle points to. The code that calls the function decides that when it opens the file.<\/span><\/li><\/ol>"]]},"de":{"t":"Lösung: Übergeben Sie einen Handle an eine Funktion","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine mögliche Lösung.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Du findest den Quellcode in der Datei <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ausgabe<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kommentare<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Handle, den <code>open<\/code> zurückgibt, ist nur ein Wert in <code>$fh<\/code>. Also kann er ein Argument von <code>log-line<\/code> sein, wie jede Zeichenkette oder Zahl. In der Subroutine schreibt <code>$fh.say<\/code> durch denselben offenen Handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Der Handle bleibt während aller drei Aufrufe offen. Also hängt jedes <code>log-line<\/code> eine weitere Zeile an das Ende derselben Datei an. Dann speichert <code>close<\/code> alles auf der Festplatte, und <code>slurp<\/code> liest die drei Zeilen zurück.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Das macht Handles leicht kombinierbar. Eine Funktion kann einen Handle nehmen und in ihn schreiben oder aus ihm lesen. Es ist ihr egal, auf welche Datei der Handle zeigt. Das entscheidet der Code, der die Funktion aufruft, wenn er die Datei öffnet.<\/span><\/li><\/ol>"]]},"nl":{"t":"Oplossing: Geef een handle aan een functie","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hier is een mogelijke oplossing.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Code<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Je kunt de broncode vinden in het bestand <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Uitvoer<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Opmerkingen<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De handle die <code>open<\/code> teruggeeft, is gewoon een waarde in <code>$fh<\/code>. Dus kan hij een argument van <code>log-line<\/code> zijn, net als elke string of elk getal. In de subroutine schrijft <code>$fh.say<\/code> via diezelfde open handle.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">De handle blijft open tijdens alle drie de aanroepen. Dus voegt elke <code>log-line<\/code> nog een regel toe aan het eind van hetzelfde bestand. Daarna slaat <code>close<\/code> alles op schijf op, en <code>slurp<\/code> leest de drie regels terug.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Daardoor zijn handles makkelijk te combineren. Een functie kan een handle aannemen en ernaar schrijven, of eruit lezen. Het maakt de functie niet uit naar welk bestand de handle wijst. De code die de functie aanroept, beslist dat wanneer ze het bestand opent.<\/span><\/li><\/ol>"]]},"es":{"t":"Solución: Pase un manejador a una función","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una posible solución.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Código<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Puedes encontrar el código fuente en el archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Salida<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Comentarios<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El manejador que devuelve <code>open<\/code> es solo un valor guardado en <code>$fh<\/code>. Así que puede ser un argumento de <code>log-line<\/code>, como cualquier cadena o número. Dentro de la subrutina, <code>$fh.say<\/code> escribe a través de ese mismo manejador abierto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">El manejador sigue abierto durante las tres llamadas. Así que cada <code>log-line<\/code> añade otra línea al final del mismo archivo. Después <code>close<\/code> guarda todo en el disco, y <code>slurp<\/code> vuelve a leer las tres líneas.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Esto es lo que hace que los manejadores sean fáciles de combinar. Una función puede recibir un manejador y escribir en él, o leer de él. No le importa a qué archivo apunta el manejador. El código que llama a la función lo decide cuando abre el archivo.<\/span><\/li><\/ol>"]]},"it":{"t":"Soluzione: Passate un handle a una funzione","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ecco una possibile soluzione.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codice<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Trova il programma nel file <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Output<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commenti<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'handle che <code>open<\/code> restituisce è solo un valore che sta in <code>$fh<\/code>. Quindi può essere un argomento di <code>log-line<\/code>, come una stringa o un numero qualsiasi. Dentro la subroutine, <code>$fh.say<\/code> scrive attraverso quello stesso handle aperto.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">L'handle resta aperto durante tutte e tre le chiamate. Quindi ogni <code>log-line<\/code> aggiunge un'altra riga alla fine dello stesso file. Poi <code>close<\/code> salva tutto su disco, e <code>slurp<\/code> rilegge le tre righe.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">È questo che rende gli handle facili da combinare. Una funzione può prendere un handle e scriverci, o leggerci. Non le importa a quale file punta l'handle. Il codice che chiama la funzione lo decide quando apre il file.<\/span><\/li><\/ol>"]]},"lv":{"t":"Risinājums: Nododiet deskriptoru funkcijai","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Šeit ir viens iespējams risinājums.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kods<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Atrodiet programmu failā <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Izvade<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentāri<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Turis, ko atgriež <code>open<\/code>, ir vienkārši vērtība, kas glabājas <code>$fh<\/code>. Tāpēc tas var būt <code>log-line<\/code> arguments, tāpat kā jebkura virkne vai skaitlis. Apakšprogrammas iekšienē <code>$fh.say<\/code> raksta caur to pašu atvērto turi.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Turis paliek atvērts visu trīs izsaukumu laikā. Tāpēc katrs <code>log-line<\/code> pievieno vēl vienu rindu tā paša faila beigās. Pēc tam <code>close<\/code> visu saglabā diskā, un <code>slurp<\/code> nolasa trīs rindas atpakaļ.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tieši tāpēc turus ir viegli apvienot. Funkcija var paņemt turi un tajā rakstīt vai no tā lasīt. Tai nav svarīgi, uz kuru failu turis norāda. To izlemj kods, kas izsauc funkciju, kad tas atver failu.<\/span><\/li><\/ol>"]]},"ru":{"t":"Решение: Передайте дескриптор в функцию","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Вот одно возможное решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Исходный код можно найти в файле <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вывод<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Комментарии<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор, который возвращает <code>open<\/code>, — это просто значение, которое хранится в <code>$fh<\/code>. Поэтому он может быть аргументом <code>log-line<\/code>, как любая строка или число. Внутри подпрограммы <code>$fh.say<\/code> пишет через тот же самый открытый дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор остаётся открытым во время всех трёх вызовов. Поэтому каждый <code>log-line<\/code> добавляет ещё одну строку в конец того же файла. Затем <code>close<\/code> сохраняет всё на диске, а <code>slurp<\/code> читает три строки обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Именно поэтому дескрипторы легко сочетать. Функция может принять дескриптор и писать в него или читать из него. Ей неважно, на какой файл указывает дескриптор. Это решает код, который вызывает функцию, когда открывает файл.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Передайте дескриптор функції","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор, який повертає <code>open<\/code>, — це просто значення, що зберігається в <code>$fh<\/code>. Тож він може бути аргументом <code>log-line<\/code>, як будь-який рядок чи число. Усередині підпрограми <code>$fh.say<\/code> пише через той самий відкритий дескриптор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Дескриптор лишається відкритим під час усіх трьох викликів. Тож кожен <code>log-line<\/code> додає ще один рядок у кінець того самого файлу. Потім <code>close<\/code> зберігає все на диску, а <code>slurp<\/code> читає три рядки назад.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Саме тому дескриптори легко поєднувати. Функція може приймати дескриптор і писати в нього або читати з нього. Їй байдуже, на який файл вказує дескриптор. Це вирішує код, який викликає функцію, коли відкриває файл.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Подайте манипулатор на функция","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Манипулаторът, който <code>open<\/code> връща, е просто стойност, пазена в <code>$fh<\/code>. Затова той може да бъде аргумент на <code>log-line<\/code>, като всеки низ или число. Вътре в подпрограмата <code>$fh.say<\/code> пише чрез същия отворен манипулатор.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Манипулаторът остава отворен през трите извиквания. Затова всяко <code>log-line<\/code> добавя още един ред в края на същия файл. След това <code>close<\/code> запазва всичко на диска, а <code>slurp<\/code> прочита трите реда обратно.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Точно това прави манипулаторите лесни за съчетаване. Функцията може да приеме манипулатор и да пише в него или да чете от него. Не я интересува към кой файл сочи манипулаторът. Кодът, който извиква функцията, решава това, когато отваря файла.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Transdonu tenilon al funkcio","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tenilo, kiun <code>open<\/code> redonas, estas nur valoro tenata en <code>$fh<\/code>. Do ĝi povas esti argumento de <code>log-line<\/code>, kiel ĉiu ĉeno aŭ nombro. Ene de la subrutino, <code>$fh.say<\/code> skribas per tiu sama malfermita tenilo.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">La tenilo restas malfermita dum ĉiuj tri vokoj. Do ĉiu <code>log-line<\/code> aldonas plian linion al la fino de la sama dosiero. Poste <code>close<\/code> konservas ĉion sur disko, kaj <code>slurp<\/code> relegas la tri liniojn.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tio faras tenilojn facile kombineblaj. Funkcio povas preni tenilon kaj skribi al ĝi, aŭ legi el ĝi. Ĝi ne zorgas, al kiu dosiero la tenilo montras. La kodo, kiu vokas la funkcion, decidas tion, kiam ĝi malfermas la dosieron.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Ansam functioni trade","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>sub log-line($fh, $message) {\n    $fh.say($message);\n}\n\nmy $fh = open 'log.txt', :w;\nlog-line($fh, 'started');\nlog-line($fh, 'working');\nlog-line($fh, 'done');\n$fh.close;\n\nprint slurp 'log.txt';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/file-handles/pass-a-handle.raku\" target=\"_blank\" rel=\"noopener\">pass-a-handle.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>started\nworking\ndone<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tractabulum quod <code>open<\/code> reddit solum valor est in <code>$fh<\/code> servatus. Itaque argumentum <code>log-line<\/code> esse potest, sicut quaelibet chorda aut numerus. Intra subprogramma <code>$fh.say<\/code> per illud idem tractabulum apertum scribit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Tractabulum per omnes tres vocationes apertum manet. Itaque quodque <code>log-line<\/code> aliam lineam ad finem eiusdem archivi addit. Deinde <code>close<\/code> omnia in disco servat, et <code>slurp<\/code> tres lineas retro legit.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Ideo tractabula tam facile coniungi possunt. Functio tractabulum accipere et in id scribere, aut ex eo legere, potest. Non curat ad quod archivum tractabulum spectet. Codex qui functionem vocat id decernit cum archivum aperit.<\/span><\/li><\/ol>"]]}}}</script>
