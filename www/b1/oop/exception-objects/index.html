<script type="application/json" id="page-data">{"u":"oop/exception-objects","n":943,"k":"section","pv":"oop/catch/quiz","nx":"oop/exception-objects/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Exception objects","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An exception is an object, just like any other object in Raku.<\/span> <span class=\"sg\" data-s=\"1\">When you write <code>die 'something failed'<\/code>, Raku puts your message inside an exception object.<\/span> <span class=\"sg\" data-s=\"2\">This object has the type <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Inside a <code>CATCH<\/code>, you can examine this object.<\/span> <span class=\"sg\" data-s=\"1\">You get its type with <code>.^name<\/code> and its text with <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">When you know the type, you can treat different errors in different ways.<\/span> <span class=\"sg\" data-s=\"1\">Built-in exceptions in Raku have their own types, and their names start with <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">You can match on these types with <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">This works just like matching values in a <code>given<\/code>/<code>when<\/code> block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">This prints <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">That is because the exception matched the type <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Matching on the type is the basic way to handle specific errors.<\/span> <span class=\"sg\" data-s=\"3\">The section on <a href=\"/oop/custom-exceptions/\">custom exceptions<\/a> builds on this idea.<\/span><\/p>"]]},"de":{"t":"Ausnahmeobjekte","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme ist ein Objekt, genau wie jedes andere Objekt in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie <code>die 'something failed'<\/code> schreiben, packt Raku Ihre Meldung in ein Ausnahmeobjekt.<\/span> <span class=\"sg\" data-s=\"2\">Dieses Objekt hat den Typ <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Innerhalb eines <code>CATCH<\/code> können Sie dieses Objekt untersuchen.<\/span> <span class=\"sg\" data-s=\"1\">Seinen Typ bekommen Sie mit <code>.^name<\/code> und seinen Text mit <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie den Typ kennen, können Sie verschiedene Fehler verschieden behandeln.<\/span> <span class=\"sg\" data-s=\"1\">Eingebaute Ausnahmen in Raku haben eigene Typen, und ihre Namen beginnen mit <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mit <code>when<\/code> können Sie auf diese Typen prüfen.<\/span> <span class=\"sg\" data-s=\"3\">Das funktioniert genau wie das Prüfen von Werten in einem <code>given<\/code>/<code>when<\/code>-Block:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Das gibt <code>an ad-hoc error: something failed<\/code> aus.<\/span> <span class=\"sg\" data-s=\"1\">Das liegt daran, dass die Ausnahme auf den Typ <code>X::AdHoc<\/code> gepasst hat.<\/span> <span class=\"sg\" data-s=\"2\">Die Prüfung auf den Typ ist der grundlegende Weg, bestimmte Fehler zu behandeln.<\/span> <span class=\"sg\" data-s=\"3\">Der Abschnitt über <a href=\"https://course.raku.org/de/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigene Ausnahmen<\/a> baut auf dieser Idee auf.<\/span><\/p>"]]},"nl":{"t":"Exceptieobjecten","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een exceptie is een object, net als elk ander object in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Als je <code>die 'something failed'<\/code> schrijft, zet Raku je melding in een exceptieobject.<\/span> <span class=\"sg\" data-s=\"2\">Dit object heeft het type <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Binnen een <code>CATCH<\/code> kun je dit object bekijken.<\/span> <span class=\"sg\" data-s=\"1\">Je krijgt zijn type met <code>.^name<\/code> en zijn tekst met <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Als je het type kent, kun je verschillende fouten op verschillende manieren behandelen.<\/span> <span class=\"sg\" data-s=\"1\">Ingebouwde excepties in Raku hebben hun eigen typen, en hun namen beginnen met <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt met <code>when<\/code> op deze typen matchen.<\/span> <span class=\"sg\" data-s=\"3\">Dat werkt net zoals waarden matchen in een <code>given<\/code>/<code>when<\/code>-blok:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dit drukt <code>an ad-hoc error: something failed<\/code> af.<\/span> <span class=\"sg\" data-s=\"1\">Dat komt doordat de exceptie op het type <code>X::AdHoc<\/code> matchte.<\/span> <span class=\"sg\" data-s=\"2\">Op het type matchen is de basis om specifieke fouten af te handelen.<\/span> <span class=\"sg\" data-s=\"3\">De sectie over <a href=\"https://course.raku.org/nl/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eigen excepties<\/a> bouwt op dit idee voort.<\/span><\/p>"]]},"es":{"t":"Objetos de excepción","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una excepción es un objeto, igual que cualquier otro objeto en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Cuando escribes <code>die 'something failed'<\/code>, Raku pone tu mensaje dentro de un objeto de excepción.<\/span> <span class=\"sg\" data-s=\"2\">Este objeto tiene el tipo <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro de un <code>CATCH<\/code>, puedes examinar este objeto.<\/span> <span class=\"sg\" data-s=\"1\">Obtienes su tipo con <code>.^name<\/code> y su texto con <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cuando conoces el tipo, puedes tratar errores distintos de formas distintas.<\/span> <span class=\"sg\" data-s=\"1\">Las excepciones incorporadas de Raku tienen sus propios tipos, y sus nombres empiezan por <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Con <code>when<\/code>, puedes comparar con estos tipos.<\/span> <span class=\"sg\" data-s=\"3\">Funciona igual que comparar valores en un bloque <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Esto imprime <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eso pasa porque la excepción coincidió con el tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Comparar con el tipo es la forma básica de manejar errores concretos.<\/span> <span class=\"sg\" data-s=\"3\">La sección sobre <a href=\"https://course.raku.org/es/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">excepciones personalizadas<\/a> se basa en esta idea.<\/span><\/p>"]]},"it":{"t":"Oggetti eccezione","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un'eccezione è un oggetto, proprio come ogni altro oggetto in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Quando scrivi <code>die 'something failed'<\/code>, Raku mette il tuo messaggio dentro un oggetto eccezione.<\/span> <span class=\"sg\" data-s=\"2\">Questo oggetto ha il tipo <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Dentro un <code>CATCH<\/code> puoi esaminare questo oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Ottieni il suo tipo con <code>.^name<\/code> e il suo testo con <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quando conosci il tipo, puoi trattare errori diversi in modi diversi.<\/span> <span class=\"sg\" data-s=\"1\">Le eccezioni incorporate di Raku hanno tipi propri, e i loro nomi cominciano con <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Puoi confrontare questi tipi con <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Funziona proprio come confrontare valori in un blocco <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Questo stampa <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo perché l'eccezione corrisponde al tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Confrontare il tipo è il modo di base per gestire errori specifici.<\/span> <span class=\"sg\" data-s=\"3\">La sezione sulle <a href=\"https://course.raku.org/it/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">eccezioni personalizzate<\/a> si basa su questa idea.<\/span><\/p>"]]},"lv":{"t":"Izņēmumu objekti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Izņēmums ir objekts, gluži kā jebkurš cits objekts Raku valodā.<\/span> <span class=\"sg\" data-s=\"1\">Kad jūs rakstāt <code>die 'something failed'<\/code>, Raku ieliek jūsu paziņojumu izņēmuma objektā.<\/span> <span class=\"sg\" data-s=\"2\">Šim objektam ir tips <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>CATCH<\/code> iekšā jūs varat izpētīt šo objektu.<\/span> <span class=\"sg\" data-s=\"1\">Tā tipu jūs iegūstat ar <code>.^name<\/code>, bet tekstu ar <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kad jūs zināt tipu, dažādas kļūdas varat apstrādāt dažādi.<\/span> <span class=\"sg\" data-s=\"1\">Raku iebūvētajiem izņēmumiem ir savi tipi, un to nosaukumi sākas ar <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ar <code>when<\/code> jūs varat salīdzināt ar šiem tipiem.<\/span> <span class=\"sg\" data-s=\"3\">Tas darbojas tāpat kā vērtību salīdzināšana blokā <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Tas izdrukā <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tāpēc, ka izņēmums atbilda tipam <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Salīdzināšana pēc tipa ir pamata veids, kā apstrādāt konkrētas kļūdas.<\/span> <span class=\"sg\" data-s=\"3\">Sadaļa par <a href=\"https://course.raku.org/lv/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">pašu definētiem izņēmumiem<\/a> būvē uz šīs idejas.<\/span><\/p>"]]},"ru":{"t":"Объекты исключений","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Исключение — это объект, точно так же, как любой другой объект в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Когда вы пишете <code>die 'something failed'<\/code>, Raku кладёт ваше сообщение внутрь объекта исключения.<\/span> <span class=\"sg\" data-s=\"2\">Этот объект имеет тип <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Внутри <code>CATCH<\/code> этот объект можно изучить.<\/span> <span class=\"sg\" data-s=\"1\">Его тип вы получаете через <code>.^name<\/code>, а текст — через <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Когда вы знаете тип, вы можете обрабатывать разные ошибки по-разному.<\/span> <span class=\"sg\" data-s=\"1\">У встроенных исключений в Raku есть свои типы, и их имена начинаются с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Эти типы можно сопоставлять через <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это работает так же, как сопоставление значений в блоке <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Программа печатает <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Это потому, что исключение совпало с типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Сопоставление по типу — основной способ обрабатывать конкретные ошибки.<\/span> <span class=\"sg\" data-s=\"3\">Раздел о <a href=\"https://course.raku.org/ru/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собственных исключениях<\/a> строится на этой идее.<\/span><\/p>"]]},"uk":{"t":"Об'єкти винятків","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Виняток — це об'єкт, як і будь-який інший об'єкт у Raku.<\/span> <span class=\"sg\" data-s=\"1\">Коли ви пишете <code>die 'something failed'<\/code>, Raku кладе ваше повідомлення в об'єкт винятку.<\/span> <span class=\"sg\" data-s=\"2\">Цей об'єкт має тип <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Усередині <code>CATCH<\/code> цей об'єкт можна дослідити.<\/span> <span class=\"sg\" data-s=\"1\">Його тип ви отримуєте через <code>.^name<\/code>, а текст — через <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Коли ви знаєте тип, ви можете по-різному поводитися з різними помилками.<\/span> <span class=\"sg\" data-s=\"1\">Вбудовані винятки в Raku мають власні типи, і їхні імена починаються з <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">З цими типами можна зіставлятися через <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це працює так само, як зіставлення значень у блоці <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Це виводить <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це тому, що виняток збігся з типом <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Зіставлення за типом — основний спосіб обробляти конкретні помилки.<\/span> <span class=\"sg\" data-s=\"3\">Розділ про <a href=\"https://course.raku.org/uk/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">власні винятки<\/a> будується на цій ідеї.<\/span><\/p>"]]},"bg":{"t":"Обекти на изключенията","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Изключението е обект, точно като всеки друг обект в Raku.<\/span> <span class=\"sg\" data-s=\"1\">Когато напишете <code>die 'something failed'<\/code>, Raku слага вашето съобщение в обект на изключение.<\/span> <span class=\"sg\" data-s=\"2\">Този обект е от типа <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вътре в <code>CATCH<\/code> можете да разгледате този обект.<\/span> <span class=\"sg\" data-s=\"1\">Типа му получавате с <code>.^name<\/code>, а текста му — с <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Когато знаете типа, можете да третирате различните грешки по различен начин.<\/span> <span class=\"sg\" data-s=\"1\">Вградените изключения в Raku имат свои типове и имената им започват с <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Можете да съпоставяте тези типове с <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Това работи точно като съпоставянето на стойности в блок <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Това отпечатва <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това е така, защото изключението съвпадна с типа <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Съпоставянето по тип е основният начин да обработвате конкретни грешки.<\/span> <span class=\"sg\" data-s=\"3\">Разделът за <a href=\"https://course.raku.org/bg/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">собствените изключения<\/a> се основава на тази идея.<\/span><\/p>"]]},"eo":{"t":"Esceptobjektoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Escepto estas objekto, same kiel ĉiu alia objekto en Raku.<\/span> <span class=\"sg\" data-s=\"1\">Kiam vi skribas <code>die 'something failed'<\/code>, Raku metas vian mesaĝon en esceptobjekton.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu objekto havas la tipon <code>X::AdHoc<\/code>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ene de <code>CATCH<\/code>, vi povas ekzameni ĉi tiun objekton.<\/span> <span class=\"sg\" data-s=\"1\">Vi ricevas ĝian tipon per <code>.^name<\/code> kaj ĝian tekston per <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Kiam vi konas la tipon, vi povas trakti malsamajn erarojn en malsamaj manieroj.<\/span> <span class=\"sg\" data-s=\"1\">La enkonstruitaj esceptoj en Raku havas siajn proprajn tipojn, kaj iliaj nomoj komenciĝas per <code>X::<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vi povas kongrui kun ĉi tiuj tipoj per <code>when<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tio funkcias same kiel la kongruo de valoroj en bloko <code>given<\/code>/<code>when<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio presas <code>an ad-hoc error: something failed<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio okazas, ĉar la escepto kongruis kun la tipo <code>X::AdHoc<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Kongrui laŭ la tipo estas la baza maniero trakti specifajn erarojn.<\/span> <span class=\"sg\" data-s=\"3\">La sekcio pri <a href=\"https://course.raku.org/eo/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">propraj esceptoj<\/a> konstruas sur ĉi tiu ideo.<\/span><\/p>"]]},"la":{"t":"Obiecta exceptionum","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Exceptio obiectum est, sicut quodlibet aliud obiectum in Raku.<\/span> <span class=\"sg\" data-s=\"1\">Cum <code>die 'something failed'<\/code> scribis, Raku nuntium tuum in obiectum exceptionis ponit.<\/span> <span class=\"sg\" data-s=\"2\">Hoc obiectum genus <code>X::AdHoc<\/code> habet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Intra <code>CATCH<\/code> hoc obiectum inspicere potes.<\/span> <span class=\"sg\" data-s=\"1\">Genus eius per <code>.^name<\/code> accipis, et textum eius per <code>.message<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        default {\n            say .^name;   # X::AdHoc\n            say .message; # something failed\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cum genus nosti, diversos errores diversis modis tractare potes.<\/span> <span class=\"sg\" data-s=\"1\">Exceptiones inbuiltae in Raku sua genera habent, et nomina eorum ab <code>X::<\/code> incipiunt.<\/span> <span class=\"sg\" data-s=\"2\">In his generibus per <code>when<\/code> comparare potes.<\/span> <span class=\"sg\" data-s=\"3\">Hoc eodem modo operatur quo valores in clausula <code>given<\/code>/<code>when<\/code> comparas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>{\n    die 'something failed';\n\n    CATCH {\n        when X::AdHoc {\n            say 'an ad-hoc error: ' ~ .message;\n        }\n        default {\n            say 'some other error';\n        }\n    }\n}<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hoc <code>an ad-hoc error: something failed<\/code> imprimit.<\/span> <span class=\"sg\" data-s=\"1\">Hoc fit quia exceptio generi <code>X::AdHoc<\/code> convenit.<\/span> <span class=\"sg\" data-s=\"2\">Genus comparare est modus principalis certos errores tractandi.<\/span> <span class=\"sg\" data-s=\"3\">Sectio de <a href=\"https://course.raku.org/la/oop/custom-exceptions/\" target=\"_blank\" rel=\"noopener\">exceptionibus propriis<\/a> super hanc ideam aedificat.<\/span><\/p>"]]}}}</script>
