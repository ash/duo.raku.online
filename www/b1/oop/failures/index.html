<script type="application/json" id="page-data">{"u":"oop/failures","n":952,"k":"section","pv":"oop/exception-objects/quiz","nx":"oop/failures/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Soft failures","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Throwing an exception with <code>die<\/code> stops everything at once.<\/span> <span class=\"sg\" data-s=\"1\">Sometimes that is too strong.<\/span> <span class=\"sg\" data-s=\"2\">You may want a subroutine to report that it could not give a result.<\/span> <span class=\"sg\" data-s=\"3\">But the caller should decide whether this is fatal.<\/span> <span class=\"sg\" data-s=\"4\">For this, Raku has <em>soft failures<\/em>, which you create with <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">When a subroutine calls <code>fail<\/code>, it does not throw an exception right away.<\/span> <span class=\"sg\" data-s=\"1\">Instead, it returns a special <code>Failure<\/code> object to the caller.<\/span> <span class=\"sg\" data-s=\"2\">A <code>Failure<\/code> is undefined, so the caller can quietly check for it:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The successful call returns <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The failing call returns a <code>Failure<\/code>, and <code>defined<\/code> gives <code>False<\/code> for it.<\/span> <span class=\"sg\" data-s=\"2\">So the caller can test the result before using it.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Why is a <code>Failure<\/code> called <em>soft<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">It becomes a real, thrown exception only in one case.<\/span> <span class=\"sg\" data-s=\"2\">That happens when you use it as a value without checking it first.<\/span> <span class=\"sg\" data-s=\"3\">As long as you handle it, for example by testing <code>defined<\/code>, it stays quiet.<\/span> <span class=\"sg\" data-s=\"4\">So a subroutine can report a problem without stopping the whole program.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">You have seen this before<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">This delayed kind of failure does not only come from <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Earlier in this part, you met the same idea twice.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A <strong>division by zero<\/strong> quietly produces a value.<\/span> <span class=\"sg\" data-s=\"1\">It throws only when you actually use that value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">A <strong>failing external program<\/strong> returns a <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It throws only if you throw it away without handling it.<\/span> <span class=\"sg\" data-s=\"2\">If you save it and look at it, it stays a quiet value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In each case, a problem does not stop the program at the moment it happens.<\/span> <span class=\"sg\" data-s=\"1\">Instead, it becomes a value that you can check.<\/span> <span class=\"sg\" data-s=\"2\">It becomes a thrown exception only when you use it unchecked or ignore it.<\/span> <span class=\"sg\" data-s=\"3\">The topic <a href=\"/oop/try/deferred-errors/\">Not every error is immediate<\/a> shows these two examples side by side.<\/span><\/p>"]]},"de":{"t":"Weiche Fehlschläge","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Eine Ausnahme mit <code>die<\/code> zu werfen hält sofort alles an.<\/span> <span class=\"sg\" data-s=\"1\">Manchmal ist das zu stark.<\/span> <span class=\"sg\" data-s=\"2\">Vielleicht möchten Sie, dass eine Subroutine meldet, dass sie kein Ergebnis liefern konnte.<\/span> <span class=\"sg\" data-s=\"3\">Aber der Aufrufer soll entscheiden, ob das fatal ist.<\/span> <span class=\"sg\" data-s=\"4\">Dafür hat Raku <em>weiche Fehlschläge<\/em>, die Sie mit <code>fail<\/code> erzeugen.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Subroutine <code>fail<\/code> aufruft, wirft sie nicht sofort eine Ausnahme.<\/span> <span class=\"sg\" data-s=\"1\">Stattdessen gibt sie dem Aufrufer ein besonderes <code>Failure<\/code>-Objekt zurück.<\/span> <span class=\"sg\" data-s=\"2\">Ein <code>Failure<\/code> ist undefiniert, also kann der Aufrufer in Ruhe darauf prüfen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Der erfolgreiche Aufruf gibt <code>5<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Der fehlschlagende Aufruf gibt ein <code>Failure<\/code> zurück, und <code>defined<\/code> ergibt dafür <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Also kann der Aufrufer das Ergebnis prüfen, bevor er es verwendet.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Warum heißt ein <code>Failure<\/code> <em>weich<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Es wird nur in einem Fall zu einer echten, geworfenen Ausnahme.<\/span> <span class=\"sg\" data-s=\"2\">Das passiert, wenn Sie es als Wert verwenden, ohne es vorher zu prüfen.<\/span> <span class=\"sg\" data-s=\"3\">Solange Sie es behandeln, zum Beispiel mit einem Test auf <code>defined<\/code>, bleibt es still.<\/span> <span class=\"sg\" data-s=\"4\">So kann eine Subroutine ein Problem melden, ohne das ganze Programm anzuhalten.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Das haben Sie schon einmal gesehen<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Diese verzögerte Art von Fehlschlag kommt nicht nur von <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Früher in diesem Teil ist Ihnen dieselbe Idee zweimal begegnet.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine <strong>Division durch null<\/strong> erzeugt still einen Wert.<\/span> <span class=\"sg\" data-s=\"1\">Die Division wirft erst, wenn Sie diesen Wert tatsächlich verwenden:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ein <strong>fehlschlagendes externes Programm<\/strong> gibt ein <code>Proc<\/code> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Es wirft nur, wenn Sie es ohne Behandlung wegwerfen.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie es speichern und ansehen, bleibt es ein stiller Wert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In jedem dieser Fälle hält ein Problem das Programm nicht in dem Moment an, in dem es passiert.<\/span> <span class=\"sg\" data-s=\"1\">Stattdessen wird es zu einem Wert, den Sie prüfen können.<\/span> <span class=\"sg\" data-s=\"2\">Er wird erst dann zu einer geworfenen Ausnahme, wenn Sie ihn ungeprüft verwenden oder ignorieren.<\/span> <span class=\"sg\" data-s=\"3\">Das Thema <a href=\"https://course.raku.org/de/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Nicht jeder Fehler tritt sofort auf<\/a> zeigt diese beiden Beispiele nebeneinander.<\/span><\/p>"]]},"nl":{"t":"Zachte mislukkingen","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Een exceptie werpen met <code>die<\/code> stopt alles meteen.<\/span> <span class=\"sg\" data-s=\"1\">Soms is dat te streng.<\/span> <span class=\"sg\" data-s=\"2\">Misschien wil je dat een subroutine meldt dat ze geen resultaat kon geven.<\/span> <span class=\"sg\" data-s=\"3\">Maar de aanroeper moet beslissen of dat fataal is.<\/span> <span class=\"sg\" data-s=\"4\">Daarvoor heeft Raku <em>zachte mislukkingen<\/em>, die je maakt met <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Als een subroutine <code>fail<\/code> aanroept, werpt ze niet meteen een exceptie.<\/span> <span class=\"sg\" data-s=\"1\">In plaats daarvan geeft ze een bijzonder <code>Failure<\/code>-object terug aan de aanroeper.<\/span> <span class=\"sg\" data-s=\"2\">Een <code>Failure<\/code> is ongedefinieerd, dus kan de aanroeper er rustig op controleren:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De geslaagde aanroep geeft <code>5<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">De mislukte aanroep geeft een <code>Failure<\/code> terug, en <code>defined<\/code> geeft daarvoor <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dus kan de aanroeper het resultaat testen voordat hij het gebruikt.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Waarom heet een <code>Failure<\/code> <em>zacht<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Hij wordt maar in één geval een echte, geworpen exceptie.<\/span> <span class=\"sg\" data-s=\"2\">Dat gebeurt als je hem als waarde gebruikt zonder hem eerst te controleren.<\/span> <span class=\"sg\" data-s=\"3\">Zolang je hem afhandelt, bijvoorbeeld door <code>defined<\/code> te testen, blijft hij stil.<\/span> <span class=\"sg\" data-s=\"4\">Zo kan een subroutine een probleem melden zonder het hele programma te stoppen.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Dit heb je eerder gezien<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Zo'n uitgestelde mislukking komt niet alleen van <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Eerder in dit deel kwam je hetzelfde idee al twee keer tegen.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een <strong>deling door nul<\/strong> levert stilletjes een waarde op.<\/span> <span class=\"sg\" data-s=\"1\">Ze werpt pas als je die waarde echt gebruikt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <strong>mislukkend extern programma<\/strong> geeft een <code>Proc<\/code> terug.<\/span> <span class=\"sg\" data-s=\"1\">Die werpt alleen als je hem weggooit zonder hem af te handelen.<\/span> <span class=\"sg\" data-s=\"2\">Als je hem bewaart en bekijkt, blijft hij een stille waarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In elk geval stopt een probleem het programma niet op het moment dat het gebeurt.<\/span> <span class=\"sg\" data-s=\"1\">In plaats daarvan wordt het een waarde die je kunt controleren.<\/span> <span class=\"sg\" data-s=\"2\">Het wordt pas een geworpen exceptie als je het ongecontroleerd gebruikt of negeert.<\/span> <span class=\"sg\" data-s=\"3\">Het onderwerp <a href=\"https://course.raku.org/nl/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Niet elke fout is onmiddellijk<\/a> zet deze twee voorbeelden naast elkaar.<\/span><\/p>"]]},"es":{"t":"Fallos suaves","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Lanzar una excepción con <code>die<\/code> lo detiene todo enseguida.<\/span> <span class=\"sg\" data-s=\"1\">A veces eso es demasiado fuerte.<\/span> <span class=\"sg\" data-s=\"2\">Quizás quieres que una subrutina informe de que no pudo dar un resultado.<\/span> <span class=\"sg\" data-s=\"3\">Pero quien llama debe decidir si eso es fatal.<\/span> <span class=\"sg\" data-s=\"4\">Para esto, Raku tiene los <em>fallos blandos<\/em>, que creas con <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cuando una subrutina llama a <code>fail<\/code>, no lanza una excepción enseguida.<\/span> <span class=\"sg\" data-s=\"1\">En su lugar, devuelve un objeto especial <code>Failure<\/code> a quien la llamó.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>Failure<\/code> no está definido, así que quien llama puede comprobarlo en silencio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La llamada que funciona devuelve <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La que falla devuelve un <code>Failure<\/code>, y <code>defined<\/code> da <code>False<\/code> para él.<\/span> <span class=\"sg\" data-s=\"2\">Así que quien llama puede comprobar el resultado antes de usarlo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">¿Por qué se llama <em>blando<\/em> un <code>Failure<\/code>?<\/span> <span class=\"sg\" data-s=\"1\">Se convierte en una excepción real y lanzada solo en un caso.<\/span> <span class=\"sg\" data-s=\"2\">Eso pasa cuando lo usas como valor sin comprobarlo antes.<\/span> <span class=\"sg\" data-s=\"3\">Mientras lo manejes, por ejemplo comprobando <code>defined<\/code>, se queda callado.<\/span> <span class=\"sg\" data-s=\"4\">Así que una subrutina puede informar de un problema sin detener todo el programa.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ya has visto esto<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Este tipo de fallo aplazado no viene solo de <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Antes en esta parte, ya te encontraste dos veces con la misma idea.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <strong>división por cero<\/strong> produce un valor en silencio.<\/span> <span class=\"sg\" data-s=\"1\">Solo lanza la excepción cuando realmente usas ese valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programa externo que falla<\/strong> devuelve un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Solo lanza una excepción si lo tiras sin manejarlo.<\/span> <span class=\"sg\" data-s=\"2\">Si lo guardas y lo miras, sigue siendo un valor callado:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En cada caso, un problema no detiene el programa en el momento en que ocurre.<\/span> <span class=\"sg\" data-s=\"1\">En su lugar, se convierte en un valor que puedes comprobar.<\/span> <span class=\"sg\" data-s=\"2\">Solo se convierte en una excepción lanzada cuando lo usas sin comprobarlo o lo ignoras.<\/span> <span class=\"sg\" data-s=\"3\">El tema <a href=\"https://course.raku.org/es/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">No todo error es inmediato<\/a> muestra estos dos ejemplos uno al lado del otro.<\/span><\/p>"]]},"it":{"t":"Guasti morbidi","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Sollevare un'eccezione con <code>die<\/code> ferma tutto subito.<\/span> <span class=\"sg\" data-s=\"1\">A volte è troppo forte.<\/span> <span class=\"sg\" data-s=\"2\">Forse vuoi che una subroutine segnali che non ha potuto dare un risultato.<\/span> <span class=\"sg\" data-s=\"3\">Ma il chiamante deve decidere se questo è fatale.<\/span> <span class=\"sg\" data-s=\"4\">Per questo Raku ha i <em>fallimenti morbidi<\/em>, che crei con <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quando una subroutine chiama <code>fail<\/code>, non solleva subito un'eccezione.<\/span> <span class=\"sg\" data-s=\"1\">Invece restituisce al chiamante un oggetto speciale <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Un <code>Failure<\/code> non è definito, quindi il chiamante può controllarlo in silenzio:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La chiamata riuscita restituisce <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La chiamata che fallisce restituisce un <code>Failure<\/code>, e <code>defined<\/code> dà <code>False<\/code> per questo oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Quindi il chiamante può controllare il risultato prima di usarlo.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Perché un <code>Failure<\/code> si chiama <em>morbido<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Diventa una vera eccezione sollevata solo in un caso.<\/span> <span class=\"sg\" data-s=\"2\">Succede quando lo usi come valore senza controllarlo prima.<\/span> <span class=\"sg\" data-s=\"3\">Finché lo gestisci, per esempio controllando <code>defined<\/code>, resta silenzioso.<\/span> <span class=\"sg\" data-s=\"4\">Così una subroutine può segnalare un problema senza fermare tutto il programma.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Lo hai già visto<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Questo tipo di fallimento ritardato non viene solo da <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Prima, in questa parte, hai incontrato la stessa idea due volte.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una <strong>divisione per zero<\/strong> produce un valore in silenzio.<\/span> <span class=\"sg\" data-s=\"1\">Solleva un'eccezione solo quando usi davvero quel valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <strong>programma esterno che fallisce<\/strong> restituisce un <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Solleva un'eccezione solo se lo butti via senza gestirlo.<\/span> <span class=\"sg\" data-s=\"2\">Se lo conservi e lo guardi, resta un valore silenzioso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In ogni caso un problema non ferma il programma nel momento in cui succede.<\/span> <span class=\"sg\" data-s=\"1\">Invece diventa un valore che puoi controllare.<\/span> <span class=\"sg\" data-s=\"2\">Diventa un'eccezione sollevata solo quando lo usi senza controllo o lo ignori.<\/span> <span class=\"sg\" data-s=\"3\">L'argomento <a href=\"https://course.raku.org/it/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Non ogni errore è immediato<\/a> mostra questi due esempi fianco a fianco.<\/span><\/p>"]]},"lv":{"t":"Mīkstās kļūmes","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Izņēmuma izmešana ar <code>die<\/code> uzreiz aptur visu.<\/span> <span class=\"sg\" data-s=\"1\">Dažreiz tas ir pārāk skarbi.<\/span> <span class=\"sg\" data-s=\"2\">Varbūt jūs gribat, lai apakšprogramma paziņo, ka nevarēja dot rezultātu.<\/span> <span class=\"sg\" data-s=\"3\">Bet izsaucējam jāizlemj, vai tas ir liktenīgi.<\/span> <span class=\"sg\" data-s=\"4\">Tam Raku valodā ir <em>mīkstās neveiksmes<\/em>, kuras jūs veidojat ar <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kad apakšprogramma izsauc <code>fail<\/code>, tā neizmet izņēmumu uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā tā atgriež izsaucējam īpašu <code>Failure<\/code> objektu.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> ir nedefinēts, tāpēc izsaucējs var to klusi pārbaudīt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Veiksmīgais izsaukums atgriež <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Neveiksmīgais izsaukums atgriež <code>Failure<\/code>, un <code>defined<\/code> tam dod <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc izsaucējs var pārbaudīt rezultātu, pirms to izmanto.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kāpēc <code>Failure<\/code> sauc par <em>mīkstu<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Tas kļūst par īstu, izmestu izņēmumu tikai vienā gadījumā.<\/span> <span class=\"sg\" data-s=\"2\">Tas notiek, kad jūs to izmantojat kā vērtību, iepriekš to nepārbaudot.<\/span> <span class=\"sg\" data-s=\"3\">Kamēr jūs to apstrādājat, piemēram, pārbaudot <code>defined<\/code>, tas paliek kluss.<\/span> <span class=\"sg\" data-s=\"4\">Tā apakšprogramma var ziņot par problēmu, neapturot visu programmu.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">To jau esat redzējuši<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Šāda atlikta neveiksme nenāk tikai no <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Agrāk šajā daļā jūs ar to pašu ideju jau sastapāties divreiz.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Dalīšana ar nulli<\/strong> klusi rada vērtību.<\/span> <span class=\"sg\" data-s=\"1\">Tā izmet izņēmumu tikai tad, kad jūs šo vērtību patiešām izmantojat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # no error yet\nsay $x;           # throws only here, when the value is used<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Neveiksmīga ārēja programma<\/strong> atgriež <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas izmet izņēmumu tikai tad, ja jūs to izmetat bez apstrādes.<\/span> <span class=\"sg\" data-s=\"2\">Ja jūs to saglabājat un apskatāt, tas paliek klusa vērtība:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # the failing Proc is discarded, so this throws<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Katrā gadījumā problēma neaptur programmu tajā brīdī, kad tā notiek.<\/span> <span class=\"sg\" data-s=\"1\">Tā vietā tā kļūst par vērtību, ko jūs varat pārbaudīt.<\/span> <span class=\"sg\" data-s=\"2\">Tā kļūst par izmestu izņēmumu tikai tad, kad jūs to izmantojat bez pārbaudes vai ignorējat.<\/span> <span class=\"sg\" data-s=\"3\">Temats <a href=\"https://course.raku.org/lv/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Ne katra kļūda parādās uzreiz<\/a> parāda šos divus piemērus līdzās.<\/span><\/p>"]]},"ru":{"t":"Мягкие сбои","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Если бросить исключение через <code>die<\/code>, всё сразу останавливается.<\/span> <span class=\"sg\" data-s=\"1\">Иногда это слишком резко.<\/span> <span class=\"sg\" data-s=\"2\">Может быть, вы хотите, чтобы подпрограмма сообщила, что не смогла дать результат.<\/span> <span class=\"sg\" data-s=\"3\">Но решать, фатально ли это, должна вызывающая сторона.<\/span> <span class=\"sg\" data-s=\"4\">Для этого в Raku есть <em>мягкие сбои<\/em>, которые создаются с помощью <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когда подпрограмма вызывает <code>fail<\/code>, она не бросает исключение сразу.<\/span> <span class=\"sg\" data-s=\"1\">Вместо этого она возвращает вызывающей стороне особый объект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> не определён, поэтому вызывающий код может тихо его проверить:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успешный вызов возвращает <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Неудачный вызов возвращает <code>Failure<\/code>, и <code>defined<\/code> даёт для него <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому вызывающая сторона может проверить результат, прежде чем его использовать.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Почему <code>Failure<\/code> называют <em>мягким<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Он становится настоящим брошенным исключением только в одном случае.<\/span> <span class=\"sg\" data-s=\"2\">Это происходит, когда вы используете его как значение, не проверив его сначала.<\/span> <span class=\"sg\" data-s=\"3\">Пока вы его обрабатываете, например проверяете <code>defined<\/code>, он остаётся тихим.<\/span> <span class=\"sg\" data-s=\"4\">Поэтому подпрограмма может сообщить о проблеме и не останавливать всю программу.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вы это уже видели<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такой отложенный сбой бывает не только у <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Раньше в этой части вы уже дважды встречали ту же идею.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Деление на ноль<\/strong> тихо даёт значение.<\/span> <span class=\"sg\" data-s=\"1\">Оно бросает исключение, только когда вы действительно используете это значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # ошибки пока нет\nsay $x;           # бросает только здесь, когда значение используется<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Внешняя программа, которая дала сбой<\/strong>, возвращает <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он бросает исключение, только если вы выбросите его, не обработав.<\/span> <span class=\"sg\" data-s=\"2\">Если вы сохраните его и посмотрите на него, он останется тихим значением:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # неудачный Proc отброшен, поэтому здесь бросается исключение<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">В каждом случае проблема не останавливает программу в тот момент, когда она возникает.<\/span> <span class=\"sg\" data-s=\"1\">Вместо этого она становится значением, которое можно проверить.<\/span> <span class=\"sg\" data-s=\"2\">Оно становится брошенным исключением, только если вы используете его без проверки или не обращаете на него внимания.<\/span> <span class=\"sg\" data-s=\"3\">Тема <a href=\"https://course.raku.org/ru/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всякая ошибка возникает сразу<\/a> показывает эти два примера рядом.<\/span><\/p>"]]},"uk":{"t":"М'які збої","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Кидання винятку через <code>die<\/code> одразу зупиняє все.<\/span> <span class=\"sg\" data-s=\"1\">Іноді це надто різко.<\/span> <span class=\"sg\" data-s=\"2\">Ви можете хотіти, щоб підпрограма повідомила, що не змогла дати результат.<\/span> <span class=\"sg\" data-s=\"3\">Але викликач має сам вирішити, чи це фатально.<\/span> <span class=\"sg\" data-s=\"4\">Для цього в Raku є <em>м'які збої<\/em>, які створюють через <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Коли підпрограма викликає <code>fail<\/code>, вона не кидає виняток одразу.<\/span> <span class=\"sg\" data-s=\"1\">Натомість вона повертає викликачеві особливий об'єкт <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> невизначений, тож викликач може тихо його перевірити:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успішний виклик повертає <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Невдалий виклик повертає <code>Failure<\/code>, і <code>defined<\/code> дає для нього <code>False<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Тож викликач може перевірити результат, перш ніж ним скористатися.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Чому <code>Failure<\/code> називають <em>м'яким<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Він стає справжнім кинутим винятком лише в одному випадку.<\/span> <span class=\"sg\" data-s=\"2\">Це стається, коли ви використовуєте його як значення, спершу не перевіривши.<\/span> <span class=\"sg\" data-s=\"3\">Доки ви його обробляєте, наприклад перевіряючи <code>defined<\/code>, він лишається тихим.<\/span> <span class=\"sg\" data-s=\"4\">Тож підпрограма може повідомити про проблему, не зупиняючи всю програму.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Ви це вже бачили<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Такий відкладений збій буває не лише від <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Раніше в цій частині ви двічі зустрічали ту саму ідею.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Ділення на нуль<\/strong> тихо створює значення.<\/span> <span class=\"sg\" data-s=\"1\">Воно кидає виняток, лише коли ви справді використовуєте це значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # помилки ще немає\nsay $x;           # кидає лише тут, коли значення використано<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Зовнішня програма, яка не спрацювала,<\/strong> повертає <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він кидає виняток, лише якщо ви викидаєте його, не обробивши.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ви збережете його й подивитеся на нього, він лишиться тихим значенням:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # невдалий Proc відкинуто, тож це кидає виняток<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У кожному випадку проблема не зупиняє програму тієї миті, коли стається.<\/span> <span class=\"sg\" data-s=\"1\">Натомість вона стає значенням, яке можна перевірити.<\/span> <span class=\"sg\" data-s=\"2\">Вона стає кинутим винятком, лише коли ви використовуєте її без перевірки або ігноруєте.<\/span> <span class=\"sg\" data-s=\"3\">Тема <a href=\"https://course.raku.org/uk/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не кожна помилка негайна<\/a> показує ці два приклади поруч.<\/span><\/p>"]]},"bg":{"t":"Меки провали","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Хвърлянето на изключение с <code>die<\/code> спира всичко веднага.<\/span> <span class=\"sg\" data-s=\"1\">Понякога това е твърде рязко.<\/span> <span class=\"sg\" data-s=\"2\">Може да искате подпрограмата да съобщи, че не е могла да даде резултат.<\/span> <span class=\"sg\" data-s=\"3\">Но извикващият трябва да реши дали това е фатално.<\/span> <span class=\"sg\" data-s=\"4\">За целта Raku има <em>меки провали<\/em>, които създавате с <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Когато подпрограма извика <code>fail<\/code>, тя не хвърля изключение веднага.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това тя връща на извикващия специален обект <code>Failure<\/code>.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> е недефиниран, така че извикващият може тихо да провери за него:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Успешното извикване връща <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Провалилото се извикване връща <code>Failure<\/code>, а <code>defined<\/code> дава <code>False<\/code> за него.<\/span> <span class=\"sg\" data-s=\"2\">Затова извикващият може да провери резултата, преди да го използва.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Защо <code>Failure<\/code> се нарича <em>мек<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Той става истинско, хвърлено изключение само в един случай.<\/span> <span class=\"sg\" data-s=\"2\">Това става, когато го използвате като стойност, без първо да го проверите.<\/span> <span class=\"sg\" data-s=\"3\">Докато го обработвате, например като проверявате <code>defined<\/code>, той остава тих.<\/span> <span class=\"sg\" data-s=\"4\">Така подпрограмата може да съобщи за проблем, без да спира цялата програма.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Виждали сте това и преди<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Този отложен вид провал не идва само от <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">По-рано в тази част срещнахте същата идея два пъти.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Делението на нула<\/strong> тихо създава стойност.<\/span> <span class=\"sg\" data-s=\"1\">То хвърля изключение само когато наистина използвате тази стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # още няма грешка\nsay $x;           # хвърля едва тук, когато стойността се използва<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Провалила се външна програма<\/strong> връща <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той хвърля изключение само ако го изхвърлите, без да го обработите.<\/span> <span class=\"sg\" data-s=\"2\">Ако го запазите и го разгледате, той остава тиха стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # провалилият се Proc е изхвърлен, затова това хвърля<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И в двата случая проблемът не спира програмата в момента, в който се случи.<\/span> <span class=\"sg\" data-s=\"1\">Вместо това той става стойност, която можете да проверите.<\/span> <span class=\"sg\" data-s=\"2\">Тя става хвърлено изключение само когато я използвате без проверка или не ѝ обърнете внимание.<\/span> <span class=\"sg\" data-s=\"3\">Темата <a href=\"https://course.raku.org/bg/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Не всяка грешка е незабавна<\/a> показва тези два примера един до друг.<\/span><\/p>"]]},"eo":{"t":"Molaj misfunkcioj","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Ĵeti escepton per <code>die<\/code> haltigas ĉion tuj.<\/span> <span class=\"sg\" data-s=\"1\">Foje tio estas tro forta.<\/span> <span class=\"sg\" data-s=\"2\">Eble vi volas, ke subrutino raportu, ke ĝi ne povis doni rezulton.<\/span> <span class=\"sg\" data-s=\"3\">Sed la vokanto decidu, ĉu tio estas fatala.<\/span> <span class=\"sg\" data-s=\"4\">Por tio, Raku havas <em>molajn misfunkciojn<\/em>, kiujn vi kreas per <code>fail<\/code>.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Kiam subrutino vokas <code>fail<\/code>, ĝi ne ĵetas escepton tuj.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭe, ĝi redonas specialan objekton <code>Failure<\/code> al la vokanto.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> estas nedifinita, do la vokanto povas kviete kontroli ĝin:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La sukcesa voko redonas <code>5<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La malsukcesanta voko redonas <code>Failure<\/code>, kaj <code>defined<\/code> donas <code>False<\/code> por ĝi.<\/span> <span class=\"sg\" data-s=\"2\">Do la vokanto povas testi la rezulton antaŭ ol uzi ĝin.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Kial <code>Failure<\/code> nomiĝas <em>mola<\/em>?<\/span> <span class=\"sg\" data-s=\"1\">Ĝi fariĝas vera, ĵetita escepto nur en unu kazo.<\/span> <span class=\"sg\" data-s=\"2\">Tio okazas, kiam vi uzas ĝin kiel valoron sen unue kontroli ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Dum vi traktas ĝin, ekzemple per testo de <code>defined<\/code>, ĝi restas kvieta.<\/span> <span class=\"sg\" data-s=\"4\">Do subrutino povas raporti problemon sen haltigi la tutan programon.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Vi vidis tion antaŭe<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉi tiu prokrastita speco de misfunkcio ne venas nur de <code>fail<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pli frue en ĉi tiu parto, vi renkontis la saman ideon dufoje.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Divido per nulo<\/strong> kviete produktas valoron.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĵetas nur, kiam vi efektive uzas tiun valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # ankoraŭ neniu eraro\nsay $x;           # ĵetas nur ĉi tie, kiam la valoro estas uzata<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Malsukcesanta ekstera programo<\/strong> redonas <code>Proc<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ĵetas nur, se vi forĵetas ĝin sen trakti ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Se vi konservas ĝin kaj rigardas ĝin, ĝi restas kvieta valoro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # la malsukcesanta Proc estas forĵetita, do ĉi tio ĵetas<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">En ĉiu kazo, problemo ne haltigas la programon en la momento, kiam ĝi okazas.<\/span> <span class=\"sg\" data-s=\"1\">Anstataŭe, ĝi fariĝas valoro, kiun vi povas kontroli.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi fariĝas ĵetita escepto nur, kiam vi uzas ĝin sen kontrolo aŭ ignoras ĝin.<\/span> <span class=\"sg\" data-s=\"3\">La temo <a href=\"https://course.raku.org/eo/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Ne ĉiu eraro estas tuja<\/a> montras ĉi tiujn du ekzemplojn unu apud la alia.<\/span><\/p>"]]},"la":{"t":"Defectus molles","b":[["p",5,"<p><span class=\"sg\" data-s=\"0\">Exceptionem per <code>die<\/code> iacere omnia statim sistit.<\/span> <span class=\"sg\" data-s=\"1\">Interdum id nimis durum est.<\/span> <span class=\"sg\" data-s=\"2\">Fortasse vis ut subprogramma nuntiet se effectum dare non potuisse.<\/span> <span class=\"sg\" data-s=\"3\">Sed vocans decernere debet utrum hoc fatale sit.<\/span> <span class=\"sg\" data-s=\"4\">Ad hoc Raku <em>defectus molles<\/em> habet, quos per <code>fail<\/code> creas.<\/span><\/p>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cum subprogramma <code>fail<\/code> vocat, exceptionem non statim iacit.<\/span> <span class=\"sg\" data-s=\"1\">Loco eius obiectum speciale <code>Failure<\/code> vocanti reddit.<\/span> <span class=\"sg\" data-s=\"2\"><code>Failure<\/code> indefinitum est, itaque vocans id tacite inspicere potest:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub divide($a, $b) {\n    fail 'cannot divide by zero' if $b == 0;\n    return $a / $b;\n}\n\nsay divide(10, 2);         # 5\nsay divide(10, 0).defined; # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Vocatio felix <code>5<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Vocatio deficiens <code>Failure<\/code> reddit, et <code>defined<\/code> pro eo <code>False<\/code> dat.<\/span> <span class=\"sg\" data-s=\"2\">Itaque vocans effectum probare potest antequam eo utatur.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Cur <code>Failure<\/code> <em>mollis<\/em> vocatur?<\/span> <span class=\"sg\" data-s=\"1\">Vera exceptio iacta fit solum uno casu.<\/span> <span class=\"sg\" data-s=\"2\">Hoc fit cum eo ut valore uteris neque id prius probas.<\/span> <span class=\"sg\" data-s=\"3\">Dum id tractas, exempli gratia <code>defined<\/code> probando, tacitum manet.<\/span> <span class=\"sg\" data-s=\"4\">Itaque subprogramma problema nuntiare potest neque totum programma sistit.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Hoc iam vidisti<\/span><\/h3>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Hoc genus defectus dilati non solum ex <code>fail<\/code> venit.<\/span> <span class=\"sg\" data-s=\"1\">Prius in hac parte eandem ideam bis invenisti.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><strong>Divisio per nihil<\/strong> valorem tacite producit.<\/span> <span class=\"sg\" data-s=\"1\">Solum iacit cum illo valore revera uteris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $x = 1 / 0;   # nullus adhuc error\nsay $x;           # solum hic iacit, cum valor adhibetur<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><strong>Programma externum deficiens<\/strong> <code>Proc<\/code> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Solum iacit si id sine tractatione abicis.<\/span> <span class=\"sg\" data-s=\"2\">Si id servas et inspicis, valor tacitus manet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>run 'sh', '-c', 'exit 1';   # Proc deficiens abicitur, itaque hoc iacit<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Utroque casu problema programma non sistit eo momento quo accidit.<\/span> <span class=\"sg\" data-s=\"1\">Loco eius fit valor quem inspicere potes.<\/span> <span class=\"sg\" data-s=\"2\">Exceptio iacta fit solum cum eo sine probatione uteris vel eum neglegis.<\/span> <span class=\"sg\" data-s=\"3\">Argumentum <a href=\"https://course.raku.org/la/oop/try/deferred-errors/\" target=\"_blank\" rel=\"noopener\">Non omnis error statim apparet<\/a> haec duo exempla iuxta se ostendit.<\/span><\/p>"]]}}}</script>
