<script type="application/json" id="page-data">{"u":"oop/mop","n":847,"k":"section","pv":"oop/object-introspection/exercises/count-attributes/solution","nx":"oop/mop/meta-methods","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"The metaobject protocol","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Every class, role and type in Raku is described by another object, called its <em>metaobject<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The metaobject knows the name of the type and its place in the inheritance tree.<\/span> <span class=\"sg\" data-s=\"2\">It also knows the attributes and methods of the type.<\/span> <span class=\"sg\" data-s=\"3\">The way to work with these metaobjects is the <em>metaobject protocol<\/em>, or MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">You have already used a small part of it: <code>.^name<\/code> is a MOP call.<\/span> <span class=\"sg\" data-s=\"1\">This section explains the <code>.^<\/code> syntax properly.<\/span> <span class=\"sg\" data-s=\"2\">It shows the most useful meta-methods for looking inside a type.<\/span> <span class=\"sg\" data-s=\"3\">And it shows that the MOP even lets you add methods to a class.<\/span> <span class=\"sg\" data-s=\"4\">You can do this while the program runs.<\/span><\/p>"]]},"de":{"t":"Das Metaobjektprotokoll","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Jede Klasse, jede Rolle und jeder Typ in Raku wird durch ein anderes Objekt beschrieben, das <em>Metaobjekt<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Das Metaobjekt kennt den Namen des Typs und seinen Platz im Vererbungsbaum.<\/span> <span class=\"sg\" data-s=\"2\">Es kennt auch die Attribute und Methoden des Typs.<\/span> <span class=\"sg\" data-s=\"3\">Mit diesen Metaobjekten arbeiten Sie über das <em>Metaobjektprotokoll<\/em>, kurz MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Einen kleinen Teil davon haben Sie schon benutzt: <code>.^name<\/code> ist ein MOP-Aufruf.<\/span> <span class=\"sg\" data-s=\"1\">Dieser Abschnitt erklärt die Syntax <code>.^<\/code> gründlich.<\/span> <span class=\"sg\" data-s=\"2\">Er zeigt die nützlichsten Metamethoden, mit denen Sie in einen Typ hineinsehen.<\/span> <span class=\"sg\" data-s=\"3\">Und er zeigt, dass Sie mit dem MOP einer Klasse sogar Methoden hinzufügen können.<\/span> <span class=\"sg\" data-s=\"4\">Das geht, während das Programm läuft.<\/span><\/p>"]]},"nl":{"t":"Het metaobjectprotocol","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Elke klasse, rol en elk type in Raku wordt beschreven door een ander object, dat zijn <em>metaobject<\/em> heet.<\/span> <span class=\"sg\" data-s=\"1\">Het metaobject kent de naam van het type en zijn plaats in de overervingsboom.<\/span> <span class=\"sg\" data-s=\"2\">Het kent ook de attributen en methoden van het type.<\/span> <span class=\"sg\" data-s=\"3\">De manier om met deze metaobjecten te werken is het <em>metaobjectprotocol<\/em>, of MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Je hebt er al een klein deel van gebruikt: <code>.^name<\/code> is een MOP-aanroep.<\/span> <span class=\"sg\" data-s=\"1\">Deze sectie legt de <code>.^<\/code>-syntaxis goed uit.<\/span> <span class=\"sg\" data-s=\"2\">Ze toont de nuttigste metamethoden om in een type te kijken.<\/span> <span class=\"sg\" data-s=\"3\">En ze laat zien dat je met het MOP zelfs methoden aan een klasse kunt toevoegen.<\/span> <span class=\"sg\" data-s=\"4\">Dat kan terwijl het programma draait.<\/span><\/p>"]]},"es":{"t":"El protocolo de metaobjetos 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada clase, rol y tipo de Raku está descrito por otro objeto, llamado su <em>metaobjeto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El metaobjeto conoce el nombre del tipo y su lugar en el árbol de herencia.<\/span> <span class=\"sg\" data-s=\"2\">También conoce los atributos y los métodos del tipo.<\/span> <span class=\"sg\" data-s=\"3\">La forma de trabajar con estos metaobjetos es el <em>protocolo de metaobjetos<\/em>, o MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ya has usado una pequeña parte de él: <code>.^name<\/code> es una llamada al MOP.<\/span> <span class=\"sg\" data-s=\"1\">Esta sección explica bien la sintaxis <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Muestra los metamétodos más útiles para mirar dentro de un tipo.<\/span> <span class=\"sg\" data-s=\"3\">Y muestra que el MOP te permite incluso añadir métodos a una clase.<\/span> <span class=\"sg\" data-s=\"4\">Puedes hacerlo mientras el programa se ejecuta.<\/span><\/p>"]]},"it":{"t":"Il protocollo dei metaoggetti 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni classe, ruolo e tipo in Raku è descritto da un altro oggetto, chiamato il suo <em>metaoggetto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il metaoggetto conosce il nome del tipo e il suo posto nell'albero dell'ereditarietà.<\/span> <span class=\"sg\" data-s=\"2\">Conosce anche gli attributi e i metodi del tipo.<\/span> <span class=\"sg\" data-s=\"3\">Il modo per lavorare con questi metaoggetti è il <em>protocollo dei metaoggetti<\/em>, o MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ne hai già usato una piccola parte: <code>.^name<\/code> è una chiamata MOP.<\/span> <span class=\"sg\" data-s=\"1\">Questa sezione spiega per bene la sintassi <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mostra i metametodi più utili per guardare dentro un tipo.<\/span> <span class=\"sg\" data-s=\"3\">E mostra che il MOP ti permette perfino di aggiungere metodi a una classe.<\/span> <span class=\"sg\" data-s=\"4\">Puoi farlo mentre il programma gira.<\/span><\/p>"]]},"lv":{"t":"Metaobjektu protokols 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Katru Raku klasi, lomu un tipu apraksta cits objekts, ko sauc par tā <em>metaobjektu<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Metaobjekts zina tipa nosaukumu un tā vietu mantošanas kokā.<\/span> <span class=\"sg\" data-s=\"2\">Tas zina arī tipa atribūtus un metodes.<\/span> <span class=\"sg\" data-s=\"3\">Veids, kā strādāt ar šiem metaobjektiem, ir <em>metaobjektu protokols<\/em> jeb MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat izmantojuši mazu tā daļu: <code>.^name<\/code> ir MOP izsaukums.<\/span> <span class=\"sg\" data-s=\"1\">Šī sadaļa kārtīgi izskaidro <code>.^<\/code> sintaksi.<\/span> <span class=\"sg\" data-s=\"2\">Tā parāda noderīgākās metametodes, ar kurām var ieskatīties tipa iekšā.<\/span> <span class=\"sg\" data-s=\"3\">Un tā parāda, ka MOP ļauj pat pievienot klasei metodes.<\/span> <span class=\"sg\" data-s=\"4\">To var darīt, kamēr programma darbojas.<\/span><\/p>"]]},"ru":{"t":"Протокол метаобъектов 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждый класс, роль и тип в Raku описан другим объектом, который называется его <em>метаобъектом<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаобъект знает имя типа и его место в дереве наследования.<\/span> <span class=\"sg\" data-s=\"2\">Ещё он знает атрибуты и методы типа.<\/span> <span class=\"sg\" data-s=\"3\">Способ работы с этими метаобъектами — это <em>протокол метаобъектов<\/em>, или MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Небольшой частью MOP вы уже пользовались: <code>.^name<\/code> — это вызов MOP.<\/span> <span class=\"sg\" data-s=\"1\">В этом разделе как следует объясняется синтаксис <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он показывает самые полезные метаметоды, чтобы заглянуть внутрь типа.<\/span> <span class=\"sg\" data-s=\"3\">А ещё он показывает, что MOP позволяет даже добавлять методы в класс.<\/span> <span class=\"sg\" data-s=\"4\">Это можно делать во время работы программы.<\/span><\/p>"]]},"uk":{"t":"Метаоб'єктний протокол","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен клас, роль і тип у Raku описує інший об'єкт, який називають його <em>метаоб'єктом<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаоб'єкт знає ім'я типу та його місце в дереві успадкування.<\/span> <span class=\"sg\" data-s=\"2\">Він також знає атрибути й методи типу.<\/span> <span class=\"sg\" data-s=\"3\">Спосіб працювати з цими метаоб'єктами — це <em>метаоб'єктний протокол<\/em>, або MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Ви вже користувалися малою частиною MOP: <code>.^name<\/code> — це виклик MOP.<\/span> <span class=\"sg\" data-s=\"1\">Цей розділ як слід пояснює синтаксис <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він показує найкорисніші метаметоди, щоб зазирнути всередину типу.<\/span> <span class=\"sg\" data-s=\"3\">А ще він показує, що MOP дозволяє навіть додавати методи до класу.<\/span> <span class=\"sg\" data-s=\"4\">Це можна робити, поки програма працює.<\/span><\/p>"]]},"bg":{"t":"Протоколът на метаобектите","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Всеки клас, роля и тип в Raku се описва от друг обект, който се нарича негов <em>метаобект<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Метаобектът знае името на типа и мястото му в дървото на наследяване.<\/span> <span class=\"sg\" data-s=\"2\">Той знае и атрибутите и методите на типа.<\/span> <span class=\"sg\" data-s=\"3\">Начинът да работите с тези метаобекти е <em>протоколът на метаобектите<\/em>, или MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Вече сте използвали малка част от него: <code>.^name<\/code> е извикване към MOP.<\/span> <span class=\"sg\" data-s=\"1\">Този раздел обяснява както трябва синтаксиса <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той показва най-полезните метаметоди, с които можете да погледнете вътре в типа.<\/span> <span class=\"sg\" data-s=\"3\">Освен това показва, че MOP дори ви позволява да добавяте методи към клас.<\/span> <span class=\"sg\" data-s=\"4\">Можете да го правите, докато програмата работи.<\/span><\/p>"]]},"eo":{"t":"La metaobjekta protokolo 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu klaso, rolo kaj tipo en Raku estas priskribata de alia objekto, kiu nomiĝas ĝia <em>metaobjekto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La metaobjekto konas la nomon de la tipo kaj ĝian lokon en la hereda arbo.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi ankaŭ konas la atributojn kaj metodojn de la tipo.<\/span> <span class=\"sg\" data-s=\"3\">La maniero labori kun ĉi tiuj metaobjektoj estas la <em>metaobjekta protokolo<\/em>, aŭ MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Vi jam uzis malgrandan parton de ĝi: <code>.^name<\/code> estas MOP-voko.<\/span> <span class=\"sg\" data-s=\"1\">Ĉi tiu sekcio bone klarigas la sintakson <code>.^<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi montras la plej utilajn metametodojn por rigardi en tipon.<\/span> <span class=\"sg\" data-s=\"3\">Kaj ĝi montras, ke la MOP eĉ permesas al vi aldoni metodojn al klaso.<\/span> <span class=\"sg\" data-s=\"4\">Vi povas fari tion dum la programo ruliĝas.<\/span><\/p>"]]},"la":{"t":"Protocollum metaobjectorum 🆕","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Omnis classis, pars et genus in Raku ab alio obiecto describitur, quod eius <em>metaobiectum<\/em> appellatur.<\/span> <span class=\"sg\" data-s=\"1\">Metaobiectum nomen generis et locum eius in arbore hereditatis novit.<\/span> <span class=\"sg\" data-s=\"2\">Etiam attributa et methodos generis novit.<\/span> <span class=\"sg\" data-s=\"3\">Modus cum his metaobiectis operandi est <em>protocollum metaobiectorum<\/em>, sive MOP.<\/span><\/p>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Parvam eius portionem iam adhibuisti: <code>.^name<\/code> est vocatio MOP.<\/span> <span class=\"sg\" data-s=\"1\">Haec sectio syntaxin <code>.^<\/code> recte explicat.<\/span> <span class=\"sg\" data-s=\"2\">Metamethodos utilissimas ostendit ad genus intus inspiciendum.<\/span> <span class=\"sg\" data-s=\"3\">Et ostendit MOP tibi etiam permittere methodos classi addere.<\/span> <span class=\"sg\" data-s=\"4\">Hoc facere potes dum programma currit.<\/span><\/p>"]]}}}</script>
