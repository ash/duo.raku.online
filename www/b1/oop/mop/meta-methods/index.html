<script type="application/json" id="page-data">{"u":"oop/mop/meta-methods","n":848,"k":"topic","pv":"oop/mop","nx":"oop/mop/meta-methods/quiz","tr":["oop","oop/mop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Meta-methods","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A <em>meta-method<\/em> is called with <code>.^<\/code> instead of <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">The ordinary <code>.method<\/code> runs a method of the object.<\/span> <span class=\"sg\" data-s=\"2\">But <code>.^method<\/code> calls a method on the object’s <strong>metaobject<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">So it asks about the type instead of acting as the type.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You have already seen <code>.^name<\/code>, which returns the name of the type:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Other meta-methods look at the structure of a type.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> lists its attributes, and <code>.^find_method<\/code> tells you if a method exists:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> returns the <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">This is the chain of types that Raku searches, in order, to find a method.<\/span> <span class=\"sg\" data-s=\"2\">It is the inheritance line of a class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> inherits from <code>A<\/code>, and in the end every type inherits from <code>Any<\/code> and <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">So Raku looks for a method of a <code>B<\/code> along exactly that path.<\/span> <span class=\"sg\" data-s=\"2\">These meta-methods turn the structure of your types into data.<\/span> <span class=\"sg\" data-s=\"3\">You can ask about this data at run time.<\/span><\/p>"]]},"de":{"t":"Metamethoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Metamethode<\/em> wird mit <code>.^<\/code> statt mit <code>.<\/code> aufgerufen.<\/span> <span class=\"sg\" data-s=\"1\">Das gewöhnliche <code>.method<\/code> führt eine Methode des Objekts aus.<\/span> <span class=\"sg\" data-s=\"2\">Aber <code>.^method<\/code> ruft eine Methode auf dem <strong>Metaobjekt<\/strong> des Objekts auf.<\/span> <span class=\"sg\" data-s=\"3\">Es fragt also nach dem Typ, statt als der Typ zu handeln.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie haben <code>.^name<\/code> schon gesehen, das den Namen des Typs zurückgibt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere Metamethoden sehen sich den Aufbau eines Typs an.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> listet seine Attribute auf, und <code>.^find_method<\/code> sagt Ihnen, ob eine Methode existiert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> gibt die <em>method resolution order<\/em> zurück.<\/span> <span class=\"sg\" data-s=\"1\">Das ist die Kette der Typen, die Raku der Reihe nach durchsucht, um eine Methode zu finden.<\/span> <span class=\"sg\" data-s=\"2\">Sie ist die Vererbungslinie einer Klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erbt von <code>A<\/code>, und am Ende erbt jeder Typ von <code>Any<\/code> und <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb sucht Raku eine Methode eines <code>B<\/code> genau entlang dieses Wegs.<\/span> <span class=\"sg\" data-s=\"2\">Diese Metamethoden machen aus dem Aufbau Ihrer Typen Daten.<\/span> <span class=\"sg\" data-s=\"3\">Diese Daten können Sie zur Laufzeit abfragen.<\/span><\/p>"]]},"nl":{"t":"Metamethoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een <em>metamethode<\/em> roep je aan met <code>.^<\/code> in plaats van <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">De gewone <code>.method<\/code> draait een methode van het object.<\/span> <span class=\"sg\" data-s=\"2\">Maar <code>.^method<\/code> roept een methode aan op het <strong>metaobject<\/strong> van het object.<\/span> <span class=\"sg\" data-s=\"3\">Dus vraagt hij iets over het type, in plaats van als het type op te treden.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je hebt <code>.^name<\/code> al gezien, die de naam van het type teruggeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Andere metamethoden kijken naar de structuur van een type.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> somt zijn attributen op, en <code>.^find_method<\/code> vertelt je of een methode bestaat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> geeft de <em>method resolution order<\/em> terug.<\/span> <span class=\"sg\" data-s=\"1\">Dit is de keten van typen die Raku op volgorde doorzoekt om een methode te vinden.<\/span> <span class=\"sg\" data-s=\"2\">Het is de overervingslijn van een klasse:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> erft van <code>A<\/code>, en uiteindelijk erft elk type van <code>Any<\/code> en <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Dus zoekt Raku een methode van een <code>B<\/code> precies langs dat pad.<\/span> <span class=\"sg\" data-s=\"2\">Deze metamethoden maken van de structuur van je typen gegevens.<\/span> <span class=\"sg\" data-s=\"3\">Je kunt tijdens het draaien naar deze gegevens vragen.<\/span><\/p>"]]},"es":{"t":"Metamétodos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>metamétodo<\/em> se llama con <code>.^<\/code> en lugar de con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">El <code>.method<\/code> ordinario ejecuta un método del objeto.<\/span> <span class=\"sg\" data-s=\"2\">Pero <code>.^method<\/code> llama a un método sobre el <strong>metaobjeto<\/strong> del objeto.<\/span> <span class=\"sg\" data-s=\"3\">Así que pregunta por el tipo en lugar de actuar como el tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ya has visto <code>.^name<\/code>, que devuelve el nombre del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Otros metamétodos miran la estructura de un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> enumera sus atributos, y <code>.^find_method<\/code> te dice si un método existe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> devuelve el <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Es la cadena de tipos que Raku recorre, en orden, para encontrar un método.<\/span> <span class=\"sg\" data-s=\"2\">Es la línea de herencia de una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> hereda de <code>A<\/code>, y al final todo tipo hereda de <code>Any<\/code> y <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Así que Raku busca un método de un <code>B<\/code> exactamente por ese camino.<\/span> <span class=\"sg\" data-s=\"2\">Estos metamétodos convierten la estructura de tus tipos en datos.<\/span> <span class=\"sg\" data-s=\"3\">Puedes consultar estos datos en tiempo de ejecución.<\/span><\/p>"]]},"it":{"t":"Metametodi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un <em>metametodo<\/em> si chiama con <code>.^<\/code> invece che con <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Il normale <code>.method<\/code> esegue un metodo dell'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Ma <code>.^method<\/code> chiama un metodo sul <strong>metaoggetto<\/strong> dell'oggetto.<\/span> <span class=\"sg\" data-s=\"3\">Quindi chiede qualcosa sul tipo invece di agire come il tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Hai già visto <code>.^name<\/code>, che restituisce il nome del tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Altri metametodi guardano la struttura di un tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> elenca i suoi attributi e <code>.^find_method<\/code> ti dice se un metodo esiste:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> restituisce il <em>method resolution order<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">È la catena di tipi che Raku percorre, in ordine, per trovare un metodo.<\/span> <span class=\"sg\" data-s=\"2\">È la linea di ereditarietà di una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> eredita da <code>A<\/code>, e alla fine ogni tipo eredita da <code>Any<\/code> e <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Quindi Raku cerca un metodo di un <code>B<\/code> proprio lungo quel percorso.<\/span> <span class=\"sg\" data-s=\"2\">Questi metametodi trasformano la struttura dei tuoi tipi in dati.<\/span> <span class=\"sg\" data-s=\"3\">Puoi interrogare questi dati a runtime.<\/span><\/p>"]]},"lv":{"t":"Metametodes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Metametodi<\/em> izsauc ar <code>.^<\/code>, nevis ar <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Parastā <code>.method<\/code> izpilda objekta metodi.<\/span> <span class=\"sg\" data-s=\"2\">Bet <code>.^method<\/code> izsauc metodi uz objekta <strong>metaobjekta<\/strong>.<\/span> <span class=\"sg\" data-s=\"3\">Tātad tā jautā par tipu, nevis darbojas kā tips.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs jau esat redzējuši <code>.^name<\/code>, kas atgriež tipa nosaukumu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Citas metametodes aplūko tipa struktūru.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> uzskaita tā atribūtus, un <code>.^find_method<\/code> pasaka, vai metode eksistē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> atgriež <em>metožu atrisināšanas secību<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tā ir tipu ķēde, ko Raku pēc kārtas pārmeklē, lai atrastu metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tā ir klases mantošanas līnija:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> manto no <code>A<\/code>, un galu galā katrs tips manto no <code>Any<\/code> un <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc Raku meklē <code>B<\/code> metodi tieši pa šo ceļu.<\/span> <span class=\"sg\" data-s=\"2\">Šīs metametodes pārvērš jūsu tipu struktūru par datiem.<\/span> <span class=\"sg\" data-s=\"3\">Par šiem datiem jūs varat jautāt izpildes laikā.<\/span><\/p>"]]},"ru":{"t":"Метаметоды","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметод<\/em> вызывается через <code>.^<\/code>, а не через <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обычный <code>.method<\/code> выполняет метод объекта.<\/span> <span class=\"sg\" data-s=\"2\">А <code>.^method<\/code> вызывает метод у <strong>метаобъекта<\/strong> этого объекта.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому он спрашивает о типе, а не действует как тип.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вы уже видели <code>.^name<\/code>, который возвращает имя типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Другие метаметоды изучают устройство типа.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перечисляет его атрибуты, а <code>.^find_method<\/code> сообщает, есть ли такой метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> возвращает <em>порядок разрешения методов<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Это цепочка типов, которые Raku по очереди просматривает, чтобы найти метод.<\/span> <span class=\"sg\" data-s=\"2\">Это линия наследования класса:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследует от <code>A<\/code>, а в конце концов каждый тип наследует от <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому Raku ищет метод объекта <code>B<\/code> ровно по этому пути.<\/span> <span class=\"sg\" data-s=\"2\">Эти метаметоды превращают устройство ваших типов в данные.<\/span> <span class=\"sg\" data-s=\"3\">Об этих данных можно спрашивать во время работы программы.<\/span><\/p>"]]},"uk":{"t":"Метаметоди","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметод<\/em> викликають через <code>.^<\/code> замість <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Звичайний <code>.method<\/code> виконує метод об'єкта.<\/span> <span class=\"sg\" data-s=\"2\">Але <code>.^method<\/code> викликає метод <strong>метаоб'єкта<\/strong> цього об'єкта.<\/span> <span class=\"sg\" data-s=\"3\">Тож він питає про тип, а не діє як тип.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви вже бачили <code>.^name<\/code>, який повертає ім'я типу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Інші метаметоди досліджують будову типу.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> перелічує його атрибути, а <code>.^find_method<\/code> каже, чи існує метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> повертає <em>порядок розв'язання методів<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Це ланцюжок типів, у якому Raku по черзі шукає метод.<\/span> <span class=\"sg\" data-s=\"2\">Це лінія успадкування класу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> успадковує від <code>A<\/code>, а зрештою кожен тип успадковує від <code>Any<\/code> та <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Тож метод для <code>B<\/code> Raku шукає саме цим шляхом.<\/span> <span class=\"sg\" data-s=\"2\">Ці метаметоди перетворюють будову ваших типів на дані.<\/span> <span class=\"sg\" data-s=\"3\">Про ці дані можна питати під час виконання.<\/span><\/p>"]]},"bg":{"t":"Метаметоди","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Метаметодът<\/em> се извиква с <code>.^<\/code> вместо с <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Обикновеното <code>.method<\/code> изпълнява метод на обекта.<\/span> <span class=\"sg\" data-s=\"2\">Но <code>.^method<\/code> извиква метод върху <strong>метаобекта<\/strong> на обекта.<\/span> <span class=\"sg\" data-s=\"3\">Така то пита за типа, вместо да действа като типа.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вече сте виждали <code>.^name<\/code>, който връща името на типа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Други метаметоди разглеждат устройството на типа.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> изброява атрибутите му, а <code>.^find_method<\/code> ви казва дали даден метод съществува:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> връща <em>реда на разрешаване на методите<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Това е веригата от типове, която Raku претърсва по ред, за да намери метод.<\/span> <span class=\"sg\" data-s=\"2\">Това е линията на наследяване на класа:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> наследява <code>A<\/code>, а в крайна сметка всеки тип наследява <code>Any<\/code> и <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Затова Raku търси метод на <code>B<\/code> точно по този път.<\/span> <span class=\"sg\" data-s=\"2\">Тези метаметоди превръщат устройството на вашите типове в данни.<\/span> <span class=\"sg\" data-s=\"3\">Можете да питате за тези данни по време на изпълнение.<\/span><\/p>"]]},"eo":{"t":"Metametodoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Metametodo<\/em> estas vokata per <code>.^<\/code> anstataŭ <code>.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">La ordinara <code>.method<\/code> rulas metodon de la objekto.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>.^method<\/code> vokas metodon sur la <strong>metaobjekto<\/strong> de la objekto.<\/span> <span class=\"sg\" data-s=\"3\">Do ĝi demandas pri la tipo anstataŭ agi kiel la tipo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi jam vidis <code>.^name<\/code>, kiu redonas la nomon de la tipo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliaj metametodoj rigardas la strukturon de tipo.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> listigas ĝiajn atributojn, kaj <code>.^find_method<\/code> diras al vi, ĉu metodo ekzistas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> redonas la <em>ordon de metodserĉado<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas la ĉeno de tipoj, kiun Raku traserĉas laŭvice por trovi metodon.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi estas la hereda linio de klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> heredas de <code>A<\/code>, kaj finfine ĉiu tipo heredas de <code>Any<\/code> kaj <code>Mu<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Do Raku serĉas metodon de <code>B<\/code> laŭ ĝuste tiu vojo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiuj metametodoj transformas la strukturon de viaj tipoj en datumojn.<\/span> <span class=\"sg\" data-s=\"3\">Vi povas demandi pri ĉi tiuj datumoj je rultempo.<\/span><\/p>"]]},"la":{"t":"Metamethodi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\"><em>Metamethodus<\/em> per <code>.^<\/code> loco <code>.<\/code> vocatur.<\/span> <span class=\"sg\" data-s=\"1\">Ordinarium <code>.method<\/code> methodum obiecti exsequitur.<\/span> <span class=\"sg\" data-s=\"2\">Sed <code>.^method<\/code> methodum in <strong>metaobiecto<\/strong> obiecti vocat.<\/span> <span class=\"sg\" data-s=\"3\">Itaque de genere interrogat, non ut genus agit.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Iam <code>.^name<\/code> vidisti, quae nomen generis reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say 42.^name; # Int<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Aliae metamethodi structuram generis inspiciunt.<\/span> <span class=\"sg\" data-s=\"1\"><code>.^attributes<\/code> attributa eius enumerat, et <code>.^find_method<\/code> tibi dicit an methodus exsistat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Animal {\n    has $.name;\n    method speak { 'generic' }\n}\n\nsay Animal.^attributes.elems;          # 1\nsay so Animal.^find_method('speak');   # True\nsay so Animal.^find_method('fly');     # False<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> <em>ordinem resolutionis methodorum<\/em> reddit.<\/span> <span class=\"sg\" data-s=\"1\">Haec est catena generum quam Raku ordine perquirit ut methodum inveniat.<\/span> <span class=\"sg\" data-s=\"2\">Est linea hereditatis classis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class A {}\nclass B is A {}\n\nsay B.^mro.map(*.^name); # (B A Any Mu)<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\"><code>B<\/code> ab <code>A<\/code> heredat, et tandem omne genus ab <code>Any<\/code> et <code>Mu<\/code> heredat.<\/span> <span class=\"sg\" data-s=\"1\">Itaque Raku methodum obiecti <code>B<\/code> per illam ipsam semitam quaerit.<\/span> <span class=\"sg\" data-s=\"2\">Hae metamethodi structuram generum tuorum in data vertunt.<\/span> <span class=\"sg\" data-s=\"3\">De his datis tempore exsecutionis interrogare potes.<\/span><\/p>"]]}}
