<script type="application/json" id="page-data">{"u":"oop/mop/adding-methods","n":850,"k":"topic","pv":"oop/mop/meta-methods/quiz","nx":"oop/mop/exercises","tr":["oop","oop/mop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Adding methods at runtime","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can use the MOP not only to inspect a type.<\/span> <span class=\"sg\" data-s=\"1\">It can also <strong>change<\/strong> a type while the program runs.<\/span> <span class=\"sg\" data-s=\"2\">The meta-method <code>.^add_method<\/code> adds a new method to a class:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The class <code>Empty<\/code> has no methods at all.<\/span> <span class=\"sg\" data-s=\"1\">Then <code>Empty.^add_method('greet', …)<\/code> adds a method called <code>greet<\/code>, which is given as an anonymous <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">From then on, every <code>Empty<\/code> object responds to <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">It works just as if you had written it in the class.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">This is real meta-programming.<\/span> <span class=\"sg\" data-s=\"1\">We tell the metaobject for <code>Empty<\/code> to grow a new method.<\/span> <span class=\"sg\" data-s=\"2\">The same protocol is behind features that you have already used.<\/span> <span class=\"sg\" data-s=\"3\">In principle, it works like this.<\/span> <span class=\"sg\" data-s=\"4\">When you write <code>class<\/code>, <code>role<\/code>, <code>has<\/code>, or <code>method<\/code>, the compiler builds your type for you.<\/span> <span class=\"sg\" data-s=\"5\">It does this with MOP methods like <code>.^add_method<\/code> and <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">We say “in principle” because this is a model of the language.<\/span> <span class=\"sg\" data-s=\"1\">It is not a promise about any one compiler.<\/span> <span class=\"sg\" data-s=\"2\">The object system is <em>defined<\/em> in terms of the MOP.<\/span> <span class=\"sg\" data-s=\"3\">But does a given implementation really send every declaration through those meta-methods?<\/span> <span class=\"sg\" data-s=\"4\">And can you see it doing this?<\/span> <span class=\"sg\" data-s=\"5\">That is up to each implementation.<\/span> <span class=\"sg\" data-s=\"6\">For the same reason, <em>calling<\/em> these meta-methods yourself depends on the implementation.<\/span> <span class=\"sg\" data-s=\"7\">Compilers may offer different meta-methods, and their exact behaviour can differ.<\/span> <span class=\"sg\" data-s=\"8\">So code with <code>.^add_method<\/code> and similar methods may work differently on each Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Adding methods at run time is a powerful tool, but you will rarely need it.<\/span> <span class=\"sg\" data-s=\"1\">Most programs never use it.<\/span> <span class=\"sg\" data-s=\"2\">But it is what makes the object system of Raku open.<\/span> <span class=\"sg\" data-s=\"3\">The rules of classes are themselves written with the MOP, so you can extend them.<\/span> <span class=\"sg\" data-s=\"4\">In everyday code, the part of the MOP that you will actually use is inspection.<\/span> <span class=\"sg\" data-s=\"5\">You saw these meta-methods in the previous topic.<\/span><\/p>"]]},"de":{"t":"Methoden zur Laufzeit hinzufügen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können das MOP nicht nur benutzen, um einen Typ zu untersuchen.<\/span> <span class=\"sg\" data-s=\"1\">Es kann einen Typ auch <strong>ändern<\/strong>, während das Programm läuft.<\/span> <span class=\"sg\" data-s=\"2\">Die Metamethode <code>.^add_method<\/code> fügt einer Klasse eine neue Methode hinzu:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>Empty<\/code> hat gar keine Methoden.<\/span> <span class=\"sg\" data-s=\"1\">Dann fügt <code>Empty.^add_method('greet', …)<\/code> eine Methode namens <code>greet<\/code> hinzu, die als anonyme <code>method { … }<\/code> angegeben ist.<\/span> <span class=\"sg\" data-s=\"2\">Von da an reagiert jedes <code>Empty<\/code>-Objekt auf <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Es funktioniert genauso, als hätten Sie die Methode in die Klasse geschrieben.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Das ist echte Metaprogrammierung.<\/span> <span class=\"sg\" data-s=\"1\">Wir sagen dem Metaobjekt für <code>Empty<\/code>, dass es eine neue Methode wachsen lassen soll.<\/span> <span class=\"sg\" data-s=\"2\">Dasselbe Protokoll steckt hinter Möglichkeiten, die Sie schon benutzt haben.<\/span> <span class=\"sg\" data-s=\"3\">Im Prinzip funktioniert das so.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Sie <code>class<\/code>, <code>role<\/code>, <code>has<\/code> oder <code>method<\/code> schreiben, baut der Compiler Ihren Typ für Sie.<\/span> <span class=\"sg\" data-s=\"5\">Er macht das mit MOP-Methoden wie <code>.^add_method<\/code> und <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Wir sagen „im Prinzip“, weil das ein Modell der Sprache ist.<\/span> <span class=\"sg\" data-s=\"1\">Es ist kein Versprechen für einen bestimmten Compiler.<\/span> <span class=\"sg\" data-s=\"2\">Das Objektsystem ist über das MOP <em>definiert<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Aber schickt eine bestimmte Implementierung wirklich jede Deklaration durch diese Metamethoden?<\/span> <span class=\"sg\" data-s=\"4\">Und können Sie sehen, wie sie das tut?<\/span> <span class=\"sg\" data-s=\"5\">Das ist jeder Implementierung selbst überlassen.<\/span> <span class=\"sg\" data-s=\"6\">Aus demselben Grund hängt auch das eigene <em>Aufrufen<\/em> dieser Metamethoden von der Implementierung ab.<\/span> <span class=\"sg\" data-s=\"7\">Compiler können verschiedene Metamethoden anbieten, und ihr genaues Verhalten kann sich unterscheiden.<\/span> <span class=\"sg\" data-s=\"8\">Code mit <code>.^add_method<\/code> und ähnlichen Methoden funktioniert also vielleicht nicht auf jedem Raku gleich.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Methoden zur Laufzeit hinzuzufügen ist ein starkes Werkzeug, aber Sie werden es selten brauchen.<\/span> <span class=\"sg\" data-s=\"1\">Die meisten Programme benutzen es nie.<\/span> <span class=\"sg\" data-s=\"2\">Aber genau das macht das Objektsystem von Raku offen.<\/span> <span class=\"sg\" data-s=\"3\">Die Regeln für Klassen sind selbst mit dem MOP geschrieben, also können Sie sie erweitern.<\/span> <span class=\"sg\" data-s=\"4\">Im alltäglichen Code ist das Untersuchen der Teil des MOP, den Sie wirklich benutzen werden.<\/span> <span class=\"sg\" data-s=\"5\">Diese Metamethoden haben Sie im vorigen Thema gesehen.<\/span><\/p>"]]},"nl":{"t":"Methoden toevoegen tijdens het draaien","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt het MOP niet alleen gebruiken om een type te bekijken.<\/span> <span class=\"sg\" data-s=\"1\">Het kan een type ook <strong>veranderen<\/strong> terwijl het programma draait.<\/span> <span class=\"sg\" data-s=\"2\">De metamethode <code>.^add_method<\/code> voegt een nieuwe methode aan een klasse toe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Empty<\/code> heeft helemaal geen methoden.<\/span> <span class=\"sg\" data-s=\"1\">Dan voegt <code>Empty.^add_method('greet', …)<\/code> een methode toe die <code>greet<\/code> heet, gegeven als een anonieme <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Vanaf dan reageert elk <code>Empty<\/code>-object op <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Het werkt precies alsof je de methode in de klasse had geschreven.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Dit is echte metaprogrammering.<\/span> <span class=\"sg\" data-s=\"1\">We vragen het metaobject voor <code>Empty<\/code> om een nieuwe methode te laten groeien.<\/span> <span class=\"sg\" data-s=\"2\">Hetzelfde protocol zit achter mogelijkheden die je al hebt gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">In principe werkt het zo.<\/span> <span class=\"sg\" data-s=\"4\">Als je <code>class<\/code>, <code>role<\/code>, <code>has<\/code> of <code>method<\/code> schrijft, bouwt de compiler je type voor je.<\/span> <span class=\"sg\" data-s=\"5\">Dat doet hij met MOP-methoden als <code>.^add_method<\/code> en <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">We zeggen “in principe” omdat dit een model van de taal is.<\/span> <span class=\"sg\" data-s=\"1\">Het is geen belofte over één bepaalde compiler.<\/span> <span class=\"sg\" data-s=\"2\">Het objectsysteem is <em>gedefinieerd<\/em> in termen van het MOP.<\/span> <span class=\"sg\" data-s=\"3\">Maar stuurt een bepaalde implementatie echt elke declaratie via die metamethoden?<\/span> <span class=\"sg\" data-s=\"4\">En kun je zien dat ze dat doet?<\/span> <span class=\"sg\" data-s=\"5\">Dat beslist elke implementatie zelf.<\/span> <span class=\"sg\" data-s=\"6\">Om dezelfde reden hangt het zelf <em>aanroepen<\/em> van deze metamethoden af van de implementatie.<\/span> <span class=\"sg\" data-s=\"7\">Compilers kunnen verschillende metamethoden aanbieden, en hoe die precies werken, kan verschillen.<\/span> <span class=\"sg\" data-s=\"8\">Dus werkt code met <code>.^add_method<\/code> en vergelijkbare methoden misschien op elke Raku anders.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Methoden toevoegen tijdens het draaien is een krachtig gereedschap, maar je zult het zelden nodig hebben.<\/span> <span class=\"sg\" data-s=\"1\">De meeste programma's gebruiken het nooit.<\/span> <span class=\"sg\" data-s=\"2\">Maar het is wat het objectsysteem van Raku open maakt.<\/span> <span class=\"sg\" data-s=\"3\">De regels van klassen zijn zelf met het MOP geschreven, dus kun je ze uitbreiden.<\/span> <span class=\"sg\" data-s=\"4\">In gewone code is het bekijken van typen het deel van het MOP dat je echt zult gebruiken.<\/span> <span class=\"sg\" data-s=\"5\">Deze metamethoden zag je in het vorige onderwerp.<\/span><\/p>"]]},"es":{"t":"Añadir métodos en tiempo de ejecución","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes usar el MOP no solo para inspeccionar un tipo.<\/span> <span class=\"sg\" data-s=\"1\">También puede <strong>cambiar<\/strong> un tipo mientras el programa se ejecuta.<\/span> <span class=\"sg\" data-s=\"2\">El metamétodo <code>.^add_method<\/code> añade un método nuevo a una clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Empty<\/code> no tiene ningún método.<\/span> <span class=\"sg\" data-s=\"1\">Después <code>Empty.^add_method('greet', …)<\/code> añade un método llamado <code>greet<\/code>, que se da como un <code>method { … }<\/code> anónimo.<\/span> <span class=\"sg\" data-s=\"2\">Desde ese momento, todo objeto <code>Empty<\/code> responde a <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Funciona igual que si estuviera escrito en la clase.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Esto es metaprogramación de verdad.<\/span> <span class=\"sg\" data-s=\"1\">Le decimos al metaobjeto de <code>Empty<\/code> que cree un método nuevo.<\/span> <span class=\"sg\" data-s=\"2\">El mismo protocolo está detrás de funciones que ya has usado.<\/span> <span class=\"sg\" data-s=\"3\">En principio, funciona así.<\/span> <span class=\"sg\" data-s=\"4\">Cuando escribes <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>, el compilador construye tu tipo por ti.<\/span> <span class=\"sg\" data-s=\"5\">Lo hace con métodos del MOP como <code>.^add_method<\/code> y <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Decimos «en principio» porque esto es un modelo del lenguaje.<\/span> <span class=\"sg\" data-s=\"1\">No es una promesa sobre ningún compilador concreto.<\/span> <span class=\"sg\" data-s=\"2\">El sistema de objetos está <em>definido<\/em> en términos del MOP.<\/span> <span class=\"sg\" data-s=\"3\">Pero ¿una implementación concreta envía de verdad cada declaración a través de esos metamétodos?<\/span> <span class=\"sg\" data-s=\"4\">¿Y puedes ver cómo lo hace?<\/span> <span class=\"sg\" data-s=\"5\">Eso depende de cada implementación.<\/span> <span class=\"sg\" data-s=\"6\">Por la misma razón, <em>llamar<\/em> tú mismo a estos metamétodos depende de la implementación.<\/span> <span class=\"sg\" data-s=\"7\">Los compiladores pueden ofrecer metamétodos distintos, y su comportamiento exacto puede variar.<\/span> <span class=\"sg\" data-s=\"8\">Así que el código con <code>.^add_method<\/code> y métodos parecidos puede funcionar de otra forma en cada Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Añadir métodos en tiempo de ejecución es una herramienta potente, pero rara vez la necesitarás.<\/span> <span class=\"sg\" data-s=\"1\">La mayoría de los programas nunca la usan.<\/span> <span class=\"sg\" data-s=\"2\">Pero es lo que hace que el sistema de objetos de Raku sea abierto.<\/span> <span class=\"sg\" data-s=\"3\">Las propias reglas de las clases están escritas con el MOP, así que puedes ampliarlas.<\/span> <span class=\"sg\" data-s=\"4\">En el código de todos los días, la parte del MOP que de verdad usarás es la inspección.<\/span> <span class=\"sg\" data-s=\"5\">Has visto estos metamétodos en el tema anterior.<\/span><\/p>"]]},"it":{"t":"Aggiungere metodi a runtime","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi usare il MOP non solo per esaminare un tipo.<\/span> <span class=\"sg\" data-s=\"1\">Può anche <strong>cambiare<\/strong> un tipo mentre il programma gira.<\/span> <span class=\"sg\" data-s=\"2\">Il metametodo <code>.^add_method<\/code> aggiunge un nuovo metodo a una classe:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La classe <code>Empty<\/code> non ha nessun metodo.<\/span> <span class=\"sg\" data-s=\"1\">Poi <code>Empty.^add_method('greet', …)<\/code> aggiunge un metodo di nome <code>greet<\/code>, che è dato come <code>method { … }<\/code> anonimo.<\/span> <span class=\"sg\" data-s=\"2\">Da quel momento, ogni oggetto <code>Empty<\/code> risponde a <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Funziona proprio come se lo avessi scritto nella classe.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Questa è vera metaprogrammazione.<\/span> <span class=\"sg\" data-s=\"1\">Diciamo al metaoggetto di <code>Empty<\/code> di far crescere un nuovo metodo.<\/span> <span class=\"sg\" data-s=\"2\">Lo stesso protocollo sta dietro a funzionalità che hai già usato.<\/span> <span class=\"sg\" data-s=\"3\">In teoria, funziona così.<\/span> <span class=\"sg\" data-s=\"4\">Quando scrivi <code>class<\/code>, <code>role<\/code>, <code>has<\/code> o <code>method<\/code>, il compilatore costruisce il tuo tipo per te.<\/span> <span class=\"sg\" data-s=\"5\">Lo fa con metodi MOP come <code>.^add_method<\/code> e <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Diciamo «in teoria» perché questo è un modello del linguaggio.<\/span> <span class=\"sg\" data-s=\"1\">Non è una promessa su un compilatore particolare.<\/span> <span class=\"sg\" data-s=\"2\">Il sistema a oggetti è <em>definito<\/em> in termini del MOP.<\/span> <span class=\"sg\" data-s=\"3\">Ma una certa implementazione manda davvero ogni dichiarazione attraverso quei metametodi?<\/span> <span class=\"sg\" data-s=\"4\">E puoi vederla mentre lo fa?<\/span> <span class=\"sg\" data-s=\"5\">Lo decide ogni implementazione.<\/span> <span class=\"sg\" data-s=\"6\">Per lo stesso motivo, <em>chiamare<\/em> tu stesso questi metametodi dipende dall'implementazione.<\/span> <span class=\"sg\" data-s=\"7\">I compilatori possono offrire metametodi diversi, e il loro comportamento esatto può cambiare.<\/span> <span class=\"sg\" data-s=\"8\">Quindi il codice con <code>.^add_method<\/code> e metodi simili può funzionare in modo diverso su ogni Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aggiungere metodi a runtime è uno strumento potente, ma ti servirà di rado.<\/span> <span class=\"sg\" data-s=\"1\">La maggior parte dei programmi non lo usa mai.<\/span> <span class=\"sg\" data-s=\"2\">Ma è ciò che rende aperto il sistema a oggetti di Raku.<\/span> <span class=\"sg\" data-s=\"3\">Anche le regole delle classi sono scritte con il MOP, quindi puoi estenderle.<\/span> <span class=\"sg\" data-s=\"4\">Nel codice di tutti i giorni, la parte del MOP che userai davvero è l'ispezione dei tipi.<\/span> <span class=\"sg\" data-s=\"5\">Hai visto questi metametodi nell'argomento precedente.<\/span><\/p>"]]},"lv":{"t":"Metožu pievienošana izpildes laikā","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP jūs varat izmantot ne tikai tipa izpētei.<\/span> <span class=\"sg\" data-s=\"1\">Tas var arī <strong>mainīt<\/strong> tipu, kamēr programma darbojas.<\/span> <span class=\"sg\" data-s=\"2\">Metametode <code>.^add_method<\/code> pievieno klasei jaunu metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Klasei <code>Empty<\/code> nav nevienas metodes.<\/span> <span class=\"sg\" data-s=\"1\">Tad <code>Empty.^add_method('greet', …)<\/code> pievieno metodi ar nosaukumu <code>greet<\/code>, kas dota kā anonīma <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No šī brīža katrs <code>Empty<\/code> objekts reaģē uz <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Tas strādā gluži tā, it kā jūs būtu to uzrakstījuši klasē.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Šī ir īsta metaprogrammēšana.<\/span> <span class=\"sg\" data-s=\"1\">Mēs liekam <code>Empty<\/code> metaobjektam izaudzēt jaunu metodi.<\/span> <span class=\"sg\" data-s=\"2\">Tas pats protokols ir aiz iespējām, ko jūs jau esat izmantojuši.<\/span> <span class=\"sg\" data-s=\"3\">Principā tas darbojas šādi.<\/span> <span class=\"sg\" data-s=\"4\">Kad jūs rakstāt <code>class<\/code>, <code>role<\/code>, <code>has<\/code> vai <code>method<\/code>, kompilators jūsu vietā uzbūvē jūsu tipu.<\/span> <span class=\"sg\" data-s=\"5\">Tas to dara ar MOP metodēm, piemēram, <code>.^add_method<\/code> un <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Mēs sakām «principā», jo tas ir valodas modelis.<\/span> <span class=\"sg\" data-s=\"1\">Tas nav solījums par kādu vienu kompilatoru.<\/span> <span class=\"sg\" data-s=\"2\">Objektu sistēma ir <em>definēta<\/em> ar MOP palīdzību.<\/span> <span class=\"sg\" data-s=\"3\">Bet vai konkrēta implementācija tiešām sūta katru deklarāciju caur šīm metametodēm?<\/span> <span class=\"sg\" data-s=\"4\">Un vai jūs varat redzēt, ka tā to dara?<\/span> <span class=\"sg\" data-s=\"5\">Tas ir katras implementācijas ziņā.<\/span> <span class=\"sg\" data-s=\"6\">Tā paša iemesla dēļ šo metametožu <em>izsaukšana<\/em> jūsu kodā ir atkarīga no implementācijas.<\/span> <span class=\"sg\" data-s=\"7\">Kompilatori var piedāvāt dažādas metametodes, un to precīzā uzvedība var atšķirties.<\/span> <span class=\"sg\" data-s=\"8\">Tāpēc kods ar <code>.^add_method<\/code> un līdzīgām metodēm var strādāt atšķirīgi katrā Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Metožu pievienošana izpildes laikā ir spēcīgs rīks, bet jums tas būs vajadzīgs reti.<\/span> <span class=\"sg\" data-s=\"1\">Vairums programmu to nekad nelieto.<\/span> <span class=\"sg\" data-s=\"2\">Bet tieši tas padara Raku objektu sistēmu atvērtu.<\/span> <span class=\"sg\" data-s=\"3\">Klašu likumi paši ir uzrakstīti ar MOP, tāpēc jūs varat tos paplašināt.<\/span> <span class=\"sg\" data-s=\"4\">Ikdienas kodā tā MOP daļa, ko jūs tiešām lietosiet, ir izpēte.<\/span> <span class=\"sg\" data-s=\"5\">Šīs metametodes jūs redzējāt iepriekšējā tematā.<\/span><\/p>"]]},"ru":{"t":"Добавление методов во время выполнения","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP можно использовать не только для того, чтобы изучать тип.<\/span> <span class=\"sg\" data-s=\"1\">Он может и <strong>изменять<\/strong> тип во время работы программы.<\/span> <span class=\"sg\" data-s=\"2\">Метаметод <code>.^add_method<\/code> добавляет классу новый метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">У класса <code>Empty<\/code> вообще нет методов.<\/span> <span class=\"sg\" data-s=\"1\">Затем <code>Empty.^add_method('greet', …)<\/code> добавляет метод с именем <code>greet<\/code>, который задан как анонимный <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">С этого момента каждый объект <code>Empty<\/code> отвечает на <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Это работает так же, как если бы вы написали его в классе.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Это настоящее метапрограммирование.<\/span> <span class=\"sg\" data-s=\"1\">Мы просим метаобъект <code>Empty<\/code> отрастить новый метод.<\/span> <span class=\"sg\" data-s=\"2\">Тот же протокол стоит за возможностями, которыми вы уже пользовались.<\/span> <span class=\"sg\" data-s=\"3\">В принципе, это работает так.<\/span> <span class=\"sg\" data-s=\"4\">Когда вы пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>, компилятор строит ваш тип за вас.<\/span> <span class=\"sg\" data-s=\"5\">Он делает это с помощью MOP-методов, таких как <code>.^add_method<\/code> и <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Мы говорим «в принципе», потому что это модель языка.<\/span> <span class=\"sg\" data-s=\"1\">Это не обещание про какой-то один компилятор.<\/span> <span class=\"sg\" data-s=\"2\">Объектная система <em>определена<\/em> через MOP.<\/span> <span class=\"sg\" data-s=\"3\">Но правда ли конкретная реализация пропускает каждое объявление через эти метаметоды?<\/span> <span class=\"sg\" data-s=\"4\">И можно ли увидеть, как она это делает?<\/span> <span class=\"sg\" data-s=\"5\">Это решает каждая реализация.<\/span> <span class=\"sg\" data-s=\"6\">По той же причине, если вы сами <em>вызываете<\/em> эти метаметоды, результат зависит от реализации.<\/span> <span class=\"sg\" data-s=\"7\">Компиляторы могут предлагать разные метаметоды, а их точное поведение может отличаться.<\/span> <span class=\"sg\" data-s=\"8\">Поэтому код с <code>.^add_method<\/code> и похожими методами может работать по-разному в разных Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Добавление методов во время работы программы — мощный инструмент, но он вам понадобится редко.<\/span> <span class=\"sg\" data-s=\"1\">Большинство программ никогда им не пользуются.<\/span> <span class=\"sg\" data-s=\"2\">Но именно он делает объектную систему Raku открытой.<\/span> <span class=\"sg\" data-s=\"3\">Сами правила классов написаны с помощью MOP, поэтому их можно расширять.<\/span> <span class=\"sg\" data-s=\"4\">В обычном коде вы на самом деле будете использовать ту часть MOP, которая заглядывает внутрь типов.<\/span> <span class=\"sg\" data-s=\"5\">Вы видели эти метаметоды в прошлой теме.<\/span><\/p>"]]},"uk":{"t":"Додавання методів під час виконання","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP можна використовувати не лише для дослідження типу.<\/span> <span class=\"sg\" data-s=\"1\">Він може й <strong>змінювати<\/strong> тип, поки програма працює.<\/span> <span class=\"sg\" data-s=\"2\">Метаметод <code>.^add_method<\/code> додає до класу новий метод:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Empty<\/code> зовсім не має методів.<\/span> <span class=\"sg\" data-s=\"1\">Потім <code>Empty.^add_method('greet', …)<\/code> додає метод на ім'я <code>greet<\/code>, заданий як анонімний <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Відтоді кожен об'єкт <code>Empty<\/code> відгукується на <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Це працює так само, наче ви написали його в класі.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Це справжнє метапрограмування.<\/span> <span class=\"sg\" data-s=\"1\">Ми кажемо метаоб'єкту <code>Empty<\/code> виростити новий метод.<\/span> <span class=\"sg\" data-s=\"2\">Той самий протокол стоїть за можливостями, якими ви вже користувалися.<\/span> <span class=\"sg\" data-s=\"3\">У принципі, це працює так.<\/span> <span class=\"sg\" data-s=\"4\">Коли ви пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> чи <code>method<\/code>, компілятор будує ваш тип за вас.<\/span> <span class=\"sg\" data-s=\"5\">Він робить це методами MOP на зразок <code>.^add_method<\/code> та <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ми кажемо «у принципі», бо це модель мови.<\/span> <span class=\"sg\" data-s=\"1\">Це не обіцянка про якийсь один компілятор.<\/span> <span class=\"sg\" data-s=\"2\">Об'єктну систему <em>визначено<\/em> в термінах MOP.<\/span> <span class=\"sg\" data-s=\"3\">Але чи справді конкретна реалізація пропускає кожне оголошення через ці метаметоди?<\/span> <span class=\"sg\" data-s=\"4\">І чи можна побачити, як вона це робить?<\/span> <span class=\"sg\" data-s=\"5\">Це вирішує кожна реалізація.<\/span> <span class=\"sg\" data-s=\"6\">З тієї самої причини, коли ви самі <em>викликаєте<\/em> ці метаметоди, результат залежить від реалізації.<\/span> <span class=\"sg\" data-s=\"7\">Компілятори можуть пропонувати різні метаметоди, і їхня точна поведінка може відрізнятися.<\/span> <span class=\"sg\" data-s=\"8\">Тож код із <code>.^add_method<\/code> і схожими методами може працювати по-різному в кожному Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Додавання методів під час виконання — потужний інструмент, але він знадобиться вам рідко.<\/span> <span class=\"sg\" data-s=\"1\">Більшість програм ніколи ним не користуються.<\/span> <span class=\"sg\" data-s=\"2\">Але саме він робить об'єктну систему Raku відкритою.<\/span> <span class=\"sg\" data-s=\"3\">Самі правила класів написані через MOP, тож ви можете їх розширювати.<\/span> <span class=\"sg\" data-s=\"4\">У щоденному коді частина MOP, якою ви справді користуватиметеся, — це дослідження типів.<\/span> <span class=\"sg\" data-s=\"5\">Ви бачили ці метаметоди в попередній темі.<\/span><\/p>"]]},"bg":{"t":"Добавяне на методи по време на изпълнение","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да използвате MOP не само за да разглеждате тип.<\/span> <span class=\"sg\" data-s=\"1\">Той може и да <strong>променя<\/strong> тип, докато програмата работи.<\/span> <span class=\"sg\" data-s=\"2\">Метаметодът <code>.^add_method<\/code> добавя нов метод към клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Empty<\/code> изобщо няма методи.<\/span> <span class=\"sg\" data-s=\"1\">После <code>Empty.^add_method('greet', …)<\/code> добавя метод на име <code>greet<\/code>, който е зададен като анонимен <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">От този момент нататък всеки обект <code>Empty<\/code> отговаря на <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Работи точно така, все едно сте го написали в класа.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Това е истинско метапрограмиране.<\/span> <span class=\"sg\" data-s=\"1\">Казваме на метаобекта на <code>Empty<\/code> да си създаде нов метод.<\/span> <span class=\"sg\" data-s=\"2\">Същият протокол стои зад възможности, които вече сте използвали.<\/span> <span class=\"sg\" data-s=\"3\">По принцип това работи така.<\/span> <span class=\"sg\" data-s=\"4\">Когато пишете <code>class<\/code>, <code>role<\/code>, <code>has<\/code> или <code>method<\/code>, компилаторът изгражда вашия тип вместо вас.<\/span> <span class=\"sg\" data-s=\"5\">Той прави това с методи на MOP като <code>.^add_method<\/code> и <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Казваме „по принцип“, защото това е модел на езика.<\/span> <span class=\"sg\" data-s=\"1\">Това не е обещание за някой определен компилатор.<\/span> <span class=\"sg\" data-s=\"2\">Обектната система е <em>дефинирана<\/em> чрез MOP.<\/span> <span class=\"sg\" data-s=\"3\">Но дали дадена реализация наистина праща всяка декларация през тези метаметоди?<\/span> <span class=\"sg\" data-s=\"4\">И можете ли да видите как го прави?<\/span> <span class=\"sg\" data-s=\"5\">Това зависи от всяка реализация.<\/span> <span class=\"sg\" data-s=\"6\">По същата причина, когато сами <em>извиквате<\/em> тези метаметоди, резултатът зависи от реализацията.<\/span> <span class=\"sg\" data-s=\"7\">Компилаторите може да предлагат различни метаметоди и тяхното точно поведение може да се различава.<\/span> <span class=\"sg\" data-s=\"8\">Затова код с <code>.^add_method<\/code> и подобни методи може да работи различно във всеки Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Добавянето на методи по време на изпълнение е мощен инструмент, но рядко ще ви трябва.<\/span> <span class=\"sg\" data-s=\"1\">Повечето програми никога не го използват.<\/span> <span class=\"sg\" data-s=\"2\">Но именно то прави обектната система на Raku отворена.<\/span> <span class=\"sg\" data-s=\"3\">Самите правила на класовете са написани с MOP, затова можете да ги разширявате.<\/span> <span class=\"sg\" data-s=\"4\">В ежедневния код частта от MOP, която наистина ще използвате, е разглеждането на типове.<\/span> <span class=\"sg\" data-s=\"5\">Видяхте тези метаметоди в предишната тема.<\/span><\/p>"]]},"eo":{"t":"Aldoni metodojn dum la rulado","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas uzi la MOP ne nur por inspekti tipon.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ankaŭ povas <strong>ŝanĝi<\/strong> tipon dum la programo ruliĝas.<\/span> <span class=\"sg\" data-s=\"2\">La metametodo <code>.^add_method<\/code> aldonas novan metodon al klaso:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La klaso <code>Empty<\/code> havas tute neniujn metodojn.<\/span> <span class=\"sg\" data-s=\"1\">Poste <code>Empty.^add_method('greet', …)<\/code> aldonas metodon nomatan <code>greet<\/code>, kiu estas donita kiel anonima <code>method { … }<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">De tiam, ĉiu objekto <code>Empty<\/code> respondas al <code>.greet<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi funkcias ĝuste kvazaŭ vi skribus ĝin en la klaso.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ĉi tio estas vera meta-programado.<\/span> <span class=\"sg\" data-s=\"1\">Ni petas la metaobjekton de <code>Empty<\/code> kreskigi novan metodon.<\/span> <span class=\"sg\" data-s=\"2\">La sama protokolo estas malantaŭ ecoj, kiujn vi jam uzis.<\/span> <span class=\"sg\" data-s=\"3\">Principe, ĝi funkcias jene.<\/span> <span class=\"sg\" data-s=\"4\">Kiam vi skribas <code>class<\/code>, <code>role<\/code>, <code>has<\/code> aŭ <code>method<\/code>, la kompililo konstruas vian tipon por vi.<\/span> <span class=\"sg\" data-s=\"5\">Ĝi faras tion per MOP-metodoj kiel <code>.^add_method<\/code> kaj <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Ni diras «principe», ĉar ĉi tio estas modelo de la lingvo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi ne estas promeso pri iu certa kompililo.<\/span> <span class=\"sg\" data-s=\"2\">La objekta sistemo estas <em>difinita<\/em> per la MOP.<\/span> <span class=\"sg\" data-s=\"3\">Sed ĉu donita realigo vere sendas ĉiun deklaron tra tiuj metametodoj?<\/span> <span class=\"sg\" data-s=\"4\">Kaj ĉu vi povas vidi, ke ĝi faras tion?<\/span> <span class=\"sg\" data-s=\"5\">Tio dependas de ĉiu realigo.<\/span> <span class=\"sg\" data-s=\"6\">Pro la sama kialo, mem <em>voki<\/em> ĉi tiujn metametodojn dependas de la realigo.<\/span> <span class=\"sg\" data-s=\"7\">Kompililoj povas proponi malsamajn metametodojn, kaj ilia ekzakta konduto povas malsami.<\/span> <span class=\"sg\" data-s=\"8\">Do kodo kun <code>.^add_method<\/code> kaj similaj metodoj eble funkcias malsame sur ĉiu Raku.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Aldoni metodojn je rultempo estas potenca ilo, sed vi malofte bezonos ĝin.<\/span> <span class=\"sg\" data-s=\"1\">La plej multaj programoj neniam uzas ĝin.<\/span> <span class=\"sg\" data-s=\"2\">Sed ĝuste ĝi faras la objektan sistemon de Raku malfermita.<\/span> <span class=\"sg\" data-s=\"3\">La reguloj de klasoj mem estas skribitaj per la MOP, do vi povas etendi ilin.<\/span> <span class=\"sg\" data-s=\"4\">En ĉiutaga kodo, la parto de la MOP, kiun vi efektive uzos, estas inspektado.<\/span> <span class=\"sg\" data-s=\"5\">Vi vidis ĉi tiujn metametodojn en la antaŭa temo.<\/span><\/p>"]]},"la":{"t":"Methodos dum exsecutione addere","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">MOP non solum ad genus inspiciendum adhibere potes.<\/span> <span class=\"sg\" data-s=\"1\">Etiam genus <strong>mutare<\/strong> potest dum programma currit.<\/span> <span class=\"sg\" data-s=\"2\">Metamethodus <code>.^add_method<\/code> novam methodum classi addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Empty {\n}\n\nEmpty.^add_method('greet', method { 'hi' });\n\nsay Empty.new.greet; # hi<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Classis <code>Empty<\/code> nullas omnino methodos habet.<\/span> <span class=\"sg\" data-s=\"1\">Deinde <code>Empty.^add_method('greet', …)<\/code> methodum nomine <code>greet<\/code> addit, quae ut anonyma <code>method { … }<\/code> datur.<\/span> <span class=\"sg\" data-s=\"2\">Ex eo tempore omne obiectum <code>Empty<\/code> ad <code>.greet<\/code> respondet.<\/span> <span class=\"sg\" data-s=\"3\">Ita operatur ac si eam in classe scripsisses.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Haec est vera metaprogrammatio.<\/span> <span class=\"sg\" data-s=\"1\">Metaobiectum classis <code>Empty<\/code> novam methodum producere iubemus.<\/span> <span class=\"sg\" data-s=\"2\">Idem protocollum post facultates stat quas iam adhibuisti.<\/span> <span class=\"sg\" data-s=\"3\">In theoria, sic operatur.<\/span> <span class=\"sg\" data-s=\"4\">Cum <code>class<\/code>, <code>role<\/code>, <code>has<\/code> vel <code>method<\/code> scribis, compilator genus tuum pro te aedificat.<\/span> <span class=\"sg\" data-s=\"5\">Hoc facit per methodos MOP sicut <code>.^add_method<\/code> et <code>.^add_attribute<\/code>.<\/span><\/p>"],["p",9,"<p><span class=\"sg\" data-s=\"0\">Dicimus «in theoria» quia hoc exemplar linguae est.<\/span> <span class=\"sg\" data-s=\"1\">Non est promissum de ullo uno compilatore.<\/span> <span class=\"sg\" data-s=\"2\">Systema obiectorum terminis MOP <em>definitur<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Sed mittitne data implementatio revera omnem declarationem per illas metamethodos?<\/span> <span class=\"sg\" data-s=\"4\">Et potesne videre eam hoc facere?<\/span> <span class=\"sg\" data-s=\"5\">Id a quaque implementatione pendet.<\/span> <span class=\"sg\" data-s=\"6\">Eadem de causa, has metamethodos ipse <em>vocare<\/em> ab implementatione pendet.<\/span> <span class=\"sg\" data-s=\"7\">Compilatores diversas metamethodos praebere possunt, et earum agendi ratio exacta differre potest.<\/span> <span class=\"sg\" data-s=\"8\">Itaque codex cum <code>.^add_method<\/code> et similibus methodis in quoque Raku aliter operari potest.<\/span><\/p>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Methodos tempore exsecutionis addere instrumentum potens est, sed raro eo egebis.<\/span> <span class=\"sg\" data-s=\"1\">Pleraque programmata eo numquam utuntur.<\/span> <span class=\"sg\" data-s=\"2\">Sed id est quod systema obiectorum Raku apertum facit.<\/span> <span class=\"sg\" data-s=\"3\">Ipsae regulae classium cum MOP scriptae sunt, itaque eas extendere potes.<\/span> <span class=\"sg\" data-s=\"4\">In codice cotidiano, portio MOP qua revera uteris est inspectio.<\/span> <span class=\"sg\" data-s=\"5\">Has metamethodos in argumento superiore vidisti.<\/span><\/p>"]]}}}</script>
