>D<\/code> вверх к общему предку <code>A<\/code> ведут два пути.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> превращает ромб в один прямой порядок поиска. Сначала идёт <code>D<\/code>, затем его родители <code>B<\/code> и <code>C<\/code> в том порядке, в котором вы их написали. Потом идёт общий <code>A<\/code> и, наконец, <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>B<\/code>, и <code>C<\/code> ведут к <code>A<\/code>. И всё же тип <code>A<\/code> появляется только <strong>один раз<\/strong> и только после них обоих. В этом и смысл порядка разрешения методов. Каждый тип посещается ровно один раз. И родитель никогда не идёт раньше потомка, который от него наследует. Поэтому Raku всегда находит метод в <code>B<\/code> раньше того, который он переопределяет в <code>A<\/code>.<\/span><\/li><\/ol>"]]},"uk":{"t":"Розв'язання: Ромб із класів","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ось один із можливих розв'язків.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Вихідний код можна знайти у файлі <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Вивід<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментарі<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> успадковує одразу від двох батьків: <code>class D is B is C<\/code> перелічує кожного з власним <code>is<\/code>. Це множинне успадкування. Разом <code>A<\/code>, <code>B<\/code>, <code>C<\/code> і <code>D<\/code> утворюють <em>ромб<\/em>. Від <code>D<\/code> угору до спільного предка <code>A<\/code> ведуть два шляхи.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> перетворює ромб на один прямий порядок пошуку. Першим іде <code>D<\/code>, потім його батьки <code>B<\/code> та <code>C<\/code> у тому порядку, в якому ви їх написали. Потім іде спільний <code>A<\/code>, і нарешті <code>Any<\/code> та <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">І <code>B<\/code>, і <code>C<\/code> ведуть до <code>A<\/code>. Проте тип <code>A<\/code> з'являється лише <strong>один раз<\/strong>, і лише після них обох. У цьому й полягає суть порядку розв'язання методів. Кожен тип відвідують рівно один раз. І батько ніколи не стоїть перед дитиною, яка від нього успадковує. Тож Raku завжди знаходить метод у <code>B<\/code> раніше за той, який він перевизначає в <code>A<\/code>.<\/span><\/li><\/ol>"]]},"bg":{"t":"Решение: Ромб от класове","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Ето едно възможно решение.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Код<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Намерете програмата във файла <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Изход<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Коментари<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> наследява от двама родители наведнъж: <code>class D is B is C<\/code> изброява всеки от тях със свое <code>is<\/code>. Това е множествено наследяване. Заедно <code>A<\/code>, <code>B<\/code>, <code>C<\/code> и <code>D<\/code> образуват <em>ромб<\/em>. Има два пътя от <code>D<\/code> нагоре до общия прародител <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> превръща ромба в един прав ред на търсене. <code>D<\/code> е първи, после родителите му <code>B<\/code> и <code>C<\/code> в реда, в който сте ги написали. После идва общият <code>A<\/code> и накрая <code>Any<\/code> и <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">И <code>B<\/code>, и <code>C<\/code> водят до <code>A<\/code>. Все пак типът <code>A<\/code> се появява само <strong>веднъж<\/strong> и едва след двата. Точно в това е смисълът на реда на разрешаване на методите. Всеки тип се посещава точно веднъж. И родителят никога не идва преди дъщерен клас, който го наследява. Затова Raku винаги намира метод в <code>B<\/code> преди онзи в <code>A<\/code>, който той предефинира.<\/span><\/li><\/ol>"]]},"eo":{"t":"Solvo: Rombo el klasoj","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Jen unu ebla solvo.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Kodo<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Vi povas trovi la fontkodon en la dosiero <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Eligo<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Komentoj<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> heredas de du patroj samtempe: <code>class D is B is C<\/code> listigas ĉiun el ili kun ĝia propra <code>is<\/code>. Tio estas multobla heredo. Kune, <code>A<\/code>, <code>B<\/code>, <code>C<\/code> kaj <code>D<\/code> formas <em>rombon<\/em>. Estas du vojoj de <code>D<\/code> supren al la komuna prapatro <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> platigas la rombon en unu rektan serĉordon. <code>D<\/code> venas unue, poste ĝiaj patroj <code>B<\/code> kaj <code>C<\/code> en la ordo, en kiu vi skribis ilin. Poste venas la komuna <code>A<\/code>, kaj fine <code>Any<\/code> kaj <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Kaj <code>B<\/code> kaj <code>C<\/code> kondukas al <code>A<\/code>. Tamen la tipo <code>A<\/code> aperas nur <strong>unufoje<\/strong>, kaj nur post ambaŭ. Jen la celo de ordo de metodserĉado. Ĉiu tipo estas vizitata ekzakte unufoje. Kaj patro neniam venas antaŭ ido, kiu heredas de ĝi. Do Raku ĉiam trovas metodon en <code>B<\/code> antaŭ tiu, kiun ĝi superregas en <code>A<\/code>.<\/span><\/li><\/ol>"]]},"la":{"t":"Solutio: Rhombus classium","b":[["p",1,"<p><span class=\"sg\" data-s=\"0\">Hic est una solutio possibilis.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Codex<\/span><\/h3>"],["code",0,"<pre class=\"lang-raku\"><code>class A {\n}\n\nclass B is A {\n}\n\nclass C is A {\n}\n\nclass D is B is C {\n}\n\nsay D.^mro.map(*.^name);<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">🦋 Inveni codicem fontem in archivo <a href=\"https://github.com/ash/raku-course/blob/master/exercises/oop/mop/diamond-mro.raku\" target=\"_blank\" rel=\"noopener\">diamond-mro.raku<\/a>.<\/span><\/p>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Exitus<\/span><\/h3>"],["code",0,"<pre><code>(D B C A Any Mu)<\/code><\/pre>"],["h",1,"<h3><span class=\"sg\" data-s=\"0\">Commentarii<\/span><\/h3>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>D<\/code> a duobus parentibus simul heredat: <code>class D is B is C<\/code> unumquemque cum proprio <code>is<\/code> enumerat. Haec est hereditas multiplex. Simul <code>A<\/code>, <code>B<\/code>, <code>C<\/code> et <code>D<\/code> <em>adamantem<\/em> formant. Duae semitae sunt a <code>D<\/code> sursum ad communem maiorem <code>A<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\"><code>.^mro<\/code> adamantem in unum ordinem quaerendi rectum vertit. <code>D<\/code> primum venit, deinde parentes eius <code>B<\/code> et <code>C<\/code> eo ordine quo eos scripsisti. Deinde venit communis <code>A<\/code>, et denique <code>Any<\/code> et <code>Mu<\/code>.<\/span><\/li><\/ol>"],["list",1,"<ol><li><span class=\"sg\" data-s=\"0\">Et <code>B<\/code> et <code>C<\/code> ad <code>A<\/code> ducunt. Tamen genus <code>A<\/code> solum <strong>semel<\/strong> apparet, et solum post utrumque. Haec est ratio ordinis resolutionis methodorum. Omne genus exacte semel visitatur. Et parens numquam ante filiam venit quae ab eo heredat. Itaque Raku methodum in <code>B<\/code> semper invenit ante eam quam in <code>A<\/code> superscribit.<\/span><\/li><\/ol>"]]}}}</script>
