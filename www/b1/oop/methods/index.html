<script type="application/json" id="page-data">{"u":"oop/methods","n":790,"k":"section","pv":"oop/attributes/exercises/changeable-label/solution","nx":"oop/methods/private-attributes","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Methods","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Attributes give an object its data, and <em>methods<\/em> give it behaviour.<\/span> <span class=\"sg\" data-s=\"1\">A method is a subroutine that belongs to a class.<\/span> <span class=\"sg\" data-s=\"2\">You call it on an object.<\/span> <span class=\"sg\" data-s=\"3\">You declare a method with the <code>method<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">To call a method on an object, use a dot, as with an accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Inside a method, <code>self<\/code> is the object that the method was called on.<\/span> <span class=\"sg\" data-s=\"1\">You reach the attributes through their accessors.<\/span> <span class=\"sg\" data-s=\"2\">You write them as <code>$.name<\/code>, <code>$.age<\/code> and so on.<\/span> <span class=\"sg\" data-s=\"3\">They also work inside double-quoted strings, where Raku inserts their values:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The next topics cover private attributes, because now we have methods to use them.<\/span> <span class=\"sg\" data-s=\"1\">Then they cover methods that take parameters, and methods that call other methods.<\/span><\/p>"]]},"de":{"t":"Methoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Attribute geben einem Objekt seine Daten, und <em>Methoden<\/em> geben ihm Verhalten.<\/span> <span class=\"sg\" data-s=\"1\">Eine Methode ist eine Subroutine, die zu einer Klasse gehört.<\/span> <span class=\"sg\" data-s=\"2\">Sie rufen sie auf einem Objekt auf.<\/span> <span class=\"sg\" data-s=\"3\">Sie deklarieren eine Methode mit dem Schlüsselwort <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Um eine Methode auf einem Objekt aufzurufen, benutzen Sie einen Punkt, wie bei einem Accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">In einer Methode ist <code>self<\/code> das Objekt, auf dem die Methode aufgerufen wurde.<\/span> <span class=\"sg\" data-s=\"1\">Die Attribute erreichen Sie über ihre Accessoren.<\/span> <span class=\"sg\" data-s=\"2\">Sie schreiben sie als <code>$.name<\/code>, <code>$.age<\/code> und so weiter.<\/span> <span class=\"sg\" data-s=\"3\">Sie funktionieren auch in Zeichenketten mit doppelten Anführungszeichen, wo Raku ihre Werte einsetzt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen behandeln private Attribute, weil wir jetzt Methoden haben, um sie zu benutzen.<\/span> <span class=\"sg\" data-s=\"1\">Danach behandeln sie Methoden mit Parametern und Methoden, die andere Methoden aufrufen.<\/span><\/p>"]]},"nl":{"t":"Methoden","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Attributen geven een object zijn gegevens, en <em>methoden<\/em> geven het gedrag.<\/span> <span class=\"sg\" data-s=\"1\">Een methode is een subroutine die bij een klasse hoort.<\/span> <span class=\"sg\" data-s=\"2\">Je roept haar aan op een object.<\/span> <span class=\"sg\" data-s=\"3\">Je declareert een methode met het sleutelwoord <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Om een methode op een object aan te roepen, gebruik je een punt, net als bij een accessor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Binnen een methode is <code>self<\/code> het object waarop de methode is aangeroepen.<\/span> <span class=\"sg\" data-s=\"1\">Je bereikt de attributen via hun accessors.<\/span> <span class=\"sg\" data-s=\"2\">Je schrijft ze als <code>$.name<\/code>, <code>$.age<\/code> enzovoort.<\/span> <span class=\"sg\" data-s=\"3\">Ze werken ook in strings met dubbele aanhalingstekens, waar Raku hun waarden invoegt:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen behandelen private attributen, omdat we nu methoden hebben om ze te gebruiken.<\/span> <span class=\"sg\" data-s=\"1\">Daarna behandelen ze methoden die parameters aannemen, en methoden die andere methoden aanroepen.<\/span><\/p>"]]},"es":{"t":"Métodos","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Los atributos dan a un objeto sus datos, y los <em>métodos<\/em> le dan comportamiento.<\/span> <span class=\"sg\" data-s=\"1\">Un método es una subrutina que pertenece a una clase.<\/span> <span class=\"sg\" data-s=\"2\">Lo llamas sobre un objeto.<\/span> <span class=\"sg\" data-s=\"3\">Declaras un método con la palabra clave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Para llamar a un método sobre un objeto, usa un punto, igual que con un accesor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro de un método, <code>self<\/code> es el objeto sobre el que se llamó al método.<\/span> <span class=\"sg\" data-s=\"1\">Llegas a los atributos a través de sus accesores.<\/span> <span class=\"sg\" data-s=\"2\">Los escribes como <code>$.name<\/code>, <code>$.age<\/code> y demás.<\/span> <span class=\"sg\" data-s=\"3\">También funcionan dentro de cadenas entre comillas dobles, donde Raku inserta sus valores:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes tratan los atributos privados, porque ahora tenemos métodos para usarlos.<\/span> <span class=\"sg\" data-s=\"1\">Después tratan los métodos que reciben parámetros y los métodos que llaman a otros métodos.<\/span><\/p>"]]},"it":{"t":"Metodi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Gli attributi danno a un oggetto i suoi dati, e i <em>metodi<\/em> gli danno un comportamento.<\/span> <span class=\"sg\" data-s=\"1\">Un metodo è una subroutine che appartiene a una classe.<\/span> <span class=\"sg\" data-s=\"2\">Lo chiami su un oggetto.<\/span> <span class=\"sg\" data-s=\"3\">Dichiari un metodo con la parola chiave <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Per chiamare un metodo su un oggetto, usa il punto, come con un accessore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Dentro un metodo, <code>self<\/code> è l'oggetto su cui il metodo è stato chiamato.<\/span> <span class=\"sg\" data-s=\"1\">Raggiungi gli attributi attraverso i loro accessori.<\/span> <span class=\"sg\" data-s=\"2\">Li scrivi come <code>$.name<\/code>, <code>$.age<\/code> e così via.<\/span> <span class=\"sg\" data-s=\"3\">Funzionano anche dentro le stringhe tra virgolette doppie, dove Raku inserisce i loro valori:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti parlano degli attributi privati, perché ora abbiamo i metodi per usarli.<\/span> <span class=\"sg\" data-s=\"1\">Poi parlano dei metodi che prendono parametri e dei metodi che chiamano altri metodi.<\/span><\/p>"]]},"lv":{"t":"Metodes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Atribūti dod objektam tā datus, bet <em>metodes<\/em> dod tam uzvedību.<\/span> <span class=\"sg\" data-s=\"1\">Metode ir apakšprogramma, kas pieder klasei.<\/span> <span class=\"sg\" data-s=\"2\">Jūs to izsaucat uz objekta.<\/span> <span class=\"sg\" data-s=\"3\">Metodi jūs deklarējat ar atslēgvārdu <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Lai izsauktu metodi uz objekta, lietojiet punktu, tāpat kā ar piekļuves metodi:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Metodes iekšā <code>self<\/code> ir objekts, uz kura metode tika izsaukta.<\/span> <span class=\"sg\" data-s=\"1\">Atribūtus jūs sasniedzat caur to piekļuves metodēm.<\/span> <span class=\"sg\" data-s=\"2\">Jūs tās rakstāt kā <code>$.name<\/code>, <code>$.age<\/code> un tā tālāk.<\/span> <span class=\"sg\" data-s=\"3\">Tās darbojas arī virknēs ar dubultpēdiņām, kur Raku ievieto to vērtības:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati aplūko privātus atribūtus, jo tagad mums ir metodes, ar ko tos izmantot.<\/span> <span class=\"sg\" data-s=\"1\">Pēc tam tie aplūko metodes, kas ņem parametrus, un metodes, kas izsauc citas metodes.<\/span><\/p>"]]},"ru":{"t":"Методы","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Атрибуты дают объекту данные, а <em>методы<\/em> дают ему поведение.<\/span> <span class=\"sg\" data-s=\"1\">Метод — это подпрограмма, которая принадлежит классу.<\/span> <span class=\"sg\" data-s=\"2\">Вы вызываете его у объекта.<\/span> <span class=\"sg\" data-s=\"3\">Объявляют метод ключевым словом <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Чтобы вызвать метод у объекта, используйте точку, как и с аксессором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Внутри метода <code>self<\/code> — это объект, у которого вызвали метод.<\/span> <span class=\"sg\" data-s=\"1\">К атрибутам обращаются через их аксессоры.<\/span> <span class=\"sg\" data-s=\"2\">Их записывают как <code>$.name<\/code>, <code>$.age<\/code> и так далее.<\/span> <span class=\"sg\" data-s=\"3\">Они работают и внутри строк в двойных кавычках, куда Raku вставляет их значения:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следующие темы рассказывают о приватных атрибутах, потому что теперь у нас есть методы для работы с ними.<\/span> <span class=\"sg\" data-s=\"1\">Потом они рассказывают о методах с параметрами и о методах, которые вызывают другие методы.<\/span><\/p>"]]},"uk":{"t":"Методи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Атрибути дають об'єкту дані, а <em>методи<\/em> дають йому поведінку.<\/span> <span class=\"sg\" data-s=\"1\">Метод — це підпрограма, яка належить класу.<\/span> <span class=\"sg\" data-s=\"2\">Ви викликаєте її для об'єкта.<\/span> <span class=\"sg\" data-s=\"3\">Ви оголошуєте метод ключовим словом <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Щоб викликати метод для об'єкта, використайте крапку, як з аксесором:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Усередині методу <code>self<\/code> — це об'єкт, для якого викликали метод.<\/span> <span class=\"sg\" data-s=\"1\">До атрибутів ви дістаєтеся через їхні аксесори.<\/span> <span class=\"sg\" data-s=\"2\">Ви пишете їх як <code>$.name<\/code>, <code>$.age<\/code> тощо.<\/span> <span class=\"sg\" data-s=\"3\">Вони працюють і всередині рядків у подвійних лапках, де Raku вставляє їхні значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Наступні теми розповідають про приватні атрибути, бо тепер ми маємо методи, щоб ними користуватися.<\/span> <span class=\"sg\" data-s=\"1\">Потім вони розповідають про методи з параметрами та про методи, які викликають інші методи.<\/span><\/p>"]]},"bg":{"t":"Методи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Атрибутите дават на обекта неговите данни, а <em>методите<\/em> му дават поведение.<\/span> <span class=\"sg\" data-s=\"1\">Методът е подпрограма, която принадлежи на клас.<\/span> <span class=\"sg\" data-s=\"2\">Извиквате го върху обект.<\/span> <span class=\"sg\" data-s=\"3\">Декларирате метод с ключовата дума <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За да извикате метод върху обект, използвайте точка, както при аксесор:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вътре в метода <code>self<\/code> е обектът, върху който е извикан методът.<\/span> <span class=\"sg\" data-s=\"1\">Стигате до атрибутите през техните аксесори.<\/span> <span class=\"sg\" data-s=\"2\">Пишете ги като <code>$.name<\/code>, <code>$.age<\/code> и така нататък.<\/span> <span class=\"sg\" data-s=\"3\">Те работят и в низове с двойни кавички, където Raku вмъква стойностите им:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Следващите теми разглеждат частните атрибути, защото вече имаме методи, с които да ги използваме.<\/span> <span class=\"sg\" data-s=\"1\">След това те разглеждат методите, които приемат параметри, и методите, които извикват други методи.<\/span><\/p>"]]},"eo":{"t":"Metodoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Atributoj donas al objekto ĝiajn datumojn, kaj <em>metodoj<\/em> donas al ĝi konduton.<\/span> <span class=\"sg\" data-s=\"1\">Metodo estas subrutino, kiu apartenas al klaso.<\/span> <span class=\"sg\" data-s=\"2\">Vi vokas ĝin sur objekto.<\/span> <span class=\"sg\" data-s=\"3\">Vi deklaras metodon per la ŝlosilvorto <code>method<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Por voki metodon sur objekto, uzu punkton, kiel kun atingilo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ene de metodo, <code>self<\/code> estas la objekto, sur kiu la metodo estis vokata.<\/span> <span class=\"sg\" data-s=\"1\">Vi atingas la atributojn tra iliaj atingiloj.<\/span> <span class=\"sg\" data-s=\"2\">Vi skribas ilin kiel <code>$.name<\/code>, <code>$.age<\/code> kaj tiel plu.<\/span> <span class=\"sg\" data-s=\"3\">Ili funkcias ankaŭ en ĉenoj kun duoblaj citiloj, kie Raku enmetas iliajn valorojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj traktas privatajn atributojn, ĉar nun ni havas metodojn por uzi ilin.<\/span> <span class=\"sg\" data-s=\"1\">Poste ili traktas metodojn, kiuj prenas parametrojn, kaj metodojn, kiuj vokas aliajn metodojn.<\/span><\/p>"]]},"la":{"t":"Methodi","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Attributa obiecto data dant, et <em>methodi<\/em> ei agendi rationem dant.<\/span> <span class=\"sg\" data-s=\"1\">Methodus est subprogramma quod ad classem pertinet.<\/span> <span class=\"sg\" data-s=\"2\">Eam in obiecto vocas.<\/span> <span class=\"sg\" data-s=\"3\">Methodum per verbum <code>method<\/code> declaras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method bark {\n        return $.name ~ ' says Woof!';\n    }\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ut methodum in obiecto voces, punctum adhibe, sicut cum accessore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.bark; # Rex says Woof!<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Intra methodum, <code>self<\/code> est obiectum in quo methodus vocata est.<\/span> <span class=\"sg\" data-s=\"1\">Attributa per accessores eorum attingis.<\/span> <span class=\"sg\" data-s=\"2\">Eos ut <code>$.name<\/code>, <code>$.age<\/code> et cetera scribis.<\/span> <span class=\"sg\" data-s=\"3\">Etiam intra chordas duplicibus virgulis clausas operantur, ubi Raku valores eorum inserit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n\n    method greet {\n        \"Hello, my name is $.name\";\n    }\n}\n\nsay Dog.new(name =&gt; 'Rex').greet; # Hello, my name is Rex<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia attributa privata tractant, quia nunc methodos habemus quae eis uti possunt.<\/span> <span class=\"sg\" data-s=\"1\">Deinde methodos tractant quae parametros accipiunt, et methodos quae alias methodos vocant.<\/span><\/p>"]]}}}</script>
