<script type="application/json" id="page-data">{"u":"oop/methods/parameters","n":792,"k":"topic","pv":"oop/methods/private-attributes","nx":"oop/methods/calling-methods","tr":["oop","oop/methods"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Methods with parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Like a subroutine, a method can take parameters.<\/span> <span class=\"sg\" data-s=\"1\">You put them in parentheses after the name of the method:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>deposit<\/code> method takes one parameter, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">It adds this amount to the object’s balance:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Each call works on the object it was called on.<\/span> <span class=\"sg\" data-s=\"1\">So the same method can update different objects separately.<\/span> <span class=\"sg\" data-s=\"2\">Methods can have positional and named parameters and default values.<\/span> <span class=\"sg\" data-s=\"3\">In fact, they can use everything that you have already seen in subroutine signatures.<\/span><\/p>"]]},"de":{"t":"Methoden mit Parametern","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Wie eine Subroutine kann eine Methode Parameter nehmen.<\/span> <span class=\"sg\" data-s=\"1\">Sie schreiben sie in Klammern hinter den Namen der Methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Methode <code>deposit<\/code> nimmt einen Parameter, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sie addiert diesen Betrag zum Kontostand des Objekts:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jeder Aufruf wirkt auf das Objekt, auf dem er aufgerufen wurde.<\/span> <span class=\"sg\" data-s=\"1\">Deshalb kann dieselbe Methode verschiedene Objekte getrennt voneinander ändern.<\/span> <span class=\"sg\" data-s=\"2\">Methoden können positionale und benannte Parameter und Standardwerte haben.<\/span> <span class=\"sg\" data-s=\"3\">Tatsächlich können sie alles benutzen, was Sie schon aus Subroutinen-Signaturen kennen.<\/span><\/p>"]]},"nl":{"t":"Methoden met parameters","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Net als een subroutine kan een methode parameters aannemen.<\/span> <span class=\"sg\" data-s=\"1\">Je zet ze tussen haakjes achter de naam van de methode:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De methode <code>deposit<\/code> neemt één parameter aan, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ze telt dit bedrag op bij het saldo van het object:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Elke aanroep werkt op het object waarop hij is aangeroepen.<\/span> <span class=\"sg\" data-s=\"1\">Dus kan dezelfde methode verschillende objecten apart bijwerken.<\/span> <span class=\"sg\" data-s=\"2\">Methoden kunnen positionele en benoemde parameters en standaardwaarden hebben.<\/span> <span class=\"sg\" data-s=\"3\">Ze kunnen zelfs alles gebruiken wat je al in de signaturen van subroutines gezien hebt.<\/span><\/p>"]]},"es":{"t":"Métodos con parámetros","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Como una subrutina, un método puede recibir parámetros.<\/span> <span class=\"sg\" data-s=\"1\">Los pones entre paréntesis después del nombre del método:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">El método <code>deposit<\/code> recibe un parámetro, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Suma esta cantidad al saldo del objeto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Cada llamada trabaja con el objeto sobre el que se hizo.<\/span> <span class=\"sg\" data-s=\"1\">Así el mismo método puede actualizar objetos distintos por separado.<\/span> <span class=\"sg\" data-s=\"2\">Los métodos pueden tener parámetros posicionales y con nombre, y valores por defecto.<\/span> <span class=\"sg\" data-s=\"3\">De hecho, pueden usar todo lo que ya has visto en las firmas de las subrutinas.<\/span><\/p>"]]},"it":{"t":"Metodi con parametri","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Come una subroutine, un metodo può prendere parametri.<\/span> <span class=\"sg\" data-s=\"1\">Li metti tra parentesi dopo il nome del metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Il metodo <code>deposit<\/code> prende un parametro, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Aggiunge questa somma al saldo dell'oggetto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ogni chiamata lavora sull'oggetto su cui è stata fatta.<\/span> <span class=\"sg\" data-s=\"1\">Così lo stesso metodo può aggiornare oggetti diversi in modo separato.<\/span> <span class=\"sg\" data-s=\"2\">I metodi possono avere parametri posizionali e nominati e valori predefiniti.<\/span> <span class=\"sg\" data-s=\"3\">In effetti, possono usare tutto quello che hai già visto nelle firme delle subroutine.<\/span><\/p>"]]},"lv":{"t":"Metodes ar parametriem","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tāpat kā apakšprogramma, metode var ņemt parametrus.<\/span> <span class=\"sg\" data-s=\"1\">Jūs tos liekat iekavās aiz metodes nosaukuma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Metode <code>deposit<\/code> ņem vienu parametru, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tā pieskaita šo summu objekta bilancei:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Katrs izsaukums strādā ar objektu, uz kura tas tika izsaukts.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc viena un tā pati metode var atjaunināt dažādus objektus atsevišķi.<\/span> <span class=\"sg\" data-s=\"2\">Metodēm var būt pozicionāli un nosaukti parametri un noklusētās vērtības.<\/span> <span class=\"sg\" data-s=\"3\">Patiesībā tās var izmantot visu, ko jūs jau esat redzējuši apakšprogrammu parakstos.<\/span><\/p>"]]},"ru":{"t":"Методы с параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Как и подпрограмма, метод может принимать параметры.<\/span> <span class=\"sg\" data-s=\"1\">Их пишут в круглых скобках после имени метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>deposit<\/code> принимает один параметр, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Он прибавляет эту сумму к балансу объекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Каждый вызов работает с тем объектом, у которого его сделали.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому один и тот же метод может менять разные объекты по отдельности.<\/span> <span class=\"sg\" data-s=\"2\">У методов могут быть позиционные и именованные параметры и значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"3\">На самом деле они могут использовать всё, что вы уже видели в сигнатурах подпрограмм.<\/span><\/p>"]]},"uk":{"t":"Методи з параметрами","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Як і підпрограма, метод може приймати параметри.<\/span> <span class=\"sg\" data-s=\"1\">Ви пишете їх у дужках після імені методу:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Метод <code>deposit<\/code> приймає один параметр, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Він додає цю суму до балансу об'єкта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Кожен виклик працює з тим об'єктом, для якого його зробили.<\/span> <span class=\"sg\" data-s=\"1\">Тож той самий метод може окремо оновлювати різні об'єкти.<\/span> <span class=\"sg\" data-s=\"2\">Методи можуть мати позиційні та іменовані параметри й типові значення.<\/span> <span class=\"sg\" data-s=\"3\">Насправді вони можуть використовувати все, що ви вже бачили в сигнатурах підпрограм.<\/span><\/p>"]]},"bg":{"t":"Методи с параметри","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Също като подпрограмата, методът може да приема параметри.<\/span> <span class=\"sg\" data-s=\"1\">Слагате ги в скоби след името на метода:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Методът <code>deposit<\/code> приема един параметър, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Той добавя тази сума към баланса на обекта:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Всяко извикване работи върху обекта, върху който е извикано.<\/span> <span class=\"sg\" data-s=\"1\">Затова един и същ метод може да обновява различни обекти поотделно.<\/span> <span class=\"sg\" data-s=\"2\">Методите могат да имат позиционни и именувани параметри и стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"3\">Всъщност те могат да използват всичко, което вече видяхте в сигнатурите на подпрограмите.<\/span><\/p>"]]},"eo":{"t":"Metodoj kun parametroj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiel subrutino, metodo povas preni parametrojn.<\/span> <span class=\"sg\" data-s=\"1\">Vi metas ilin en krampojn post la nomo de la metodo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La metodo <code>deposit<\/code> prenas unu parametron, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi aldonas ĉi tiun sumon al la saldo de la objekto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ĉiu voko laboras sur la objekto, sur kiu ĝi estis vokata.<\/span> <span class=\"sg\" data-s=\"1\">Do la sama metodo povas ĝisdatigi malsamajn objektojn aparte.<\/span> <span class=\"sg\" data-s=\"2\">Metodoj povas havi poziciajn kaj nomitajn parametrojn kaj defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"3\">Fakte, ili povas uzi ĉion, kion vi jam vidis en la subskriboj de subrutinoj.<\/span><\/p>"]]},"la":{"t":"Methodi cum parametris","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sicut subprogramma, methodus parametros accipere potest.<\/span> <span class=\"sg\" data-s=\"1\">Eos in parenthesibus post nomen methodi ponis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Account {\n    has $.balance is rw = 0;\n\n    method deposit($amount) {\n        $.balance += $amount;\n    }\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Methodus <code>deposit<\/code> unum parametrum accipit, <code>$amount<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Hanc summam ad rationem obiecti addit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $a = Account.new;\n$a.deposit(100);\n$a.deposit(50);\nsay $a.balance; # 150<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Quaeque vocatio in eo obiecto operatur in quo vocata est.<\/span> <span class=\"sg\" data-s=\"1\">Itaque eadem methodus diversa obiecta separatim renovare potest.<\/span> <span class=\"sg\" data-s=\"2\">Methodi parametros positionales et nominatos et valores praedefinitos habere possunt.<\/span> <span class=\"sg\" data-s=\"3\">Re vera omnibus uti possunt quae iam in signaturis subprogrammatum vidisti.<\/span><\/p>"]]}}}</script>
