<script type="application/json" id="page-data">{"u":"oop/methods/private-attributes","n":791,"k":"topic","pv":"oop/methods","nx":"oop/methods/parameters","tr":["oop","oop/methods"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Private attributes","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In the <a href=\"/oop/attributes/\">section about attributes<\/a>, we declared each attribute with <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">This creates a public accessor.<\/span> <span class=\"sg\" data-s=\"2\">If you declare an attribute with <code>$!<\/code> instead, it is <em>private<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">It has no accessor, and you cannot see it from outside the object.<\/span> <span class=\"sg\" data-s=\"4\">Only the class’s own methods can reach it.<\/span> <span class=\"sg\" data-s=\"5\">There, you write it as <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">The secret <code>$!code<\/code> is kept inside the object, but it is never shown outside.<\/span> <span class=\"sg\" data-s=\"1\">There is no <code>.code<\/code> accessor.<\/span> <span class=\"sg\" data-s=\"2\">So you can only work with it through the <code>unlocks<\/code> method.<\/span> <span class=\"sg\" data-s=\"3\">The class chooses to provide this method.<\/span> <span class=\"sg\" data-s=\"4\">If you try to read <code>$safe.code<\/code> or <code>$safe!code<\/code>, it simply fails.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private attributes are useful for internal details.<\/span> <span class=\"sg\" data-s=\"1\">The rest of the program should not work with these details directly.<\/span><\/p>"]]},"de":{"t":"Private Attribute","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Im <a href=\"https://course.raku.org/de/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Abschnitt über Attribute<\/a> haben wir jedes Attribut mit <code>$.<\/code> deklariert.<\/span> <span class=\"sg\" data-s=\"1\">Das erzeugt einen öffentlichen Accessor.<\/span> <span class=\"sg\" data-s=\"2\">Wenn Sie ein Attribut stattdessen mit <code>$!<\/code> deklarieren, ist es <em>privat<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Es hat keinen Accessor, und Sie können es von außerhalb des Objekts nicht sehen.<\/span> <span class=\"sg\" data-s=\"4\">Nur die eigenen Methoden der Klasse können es erreichen.<\/span> <span class=\"sg\" data-s=\"5\">Dort schreiben Sie es als <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Der geheime <code>$!code<\/code> wird im Objekt gespeichert, aber nie nach außen gezeigt.<\/span> <span class=\"sg\" data-s=\"1\">Es gibt keinen Accessor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Sie können also nur über die Methode <code>unlocks<\/code> damit arbeiten.<\/span> <span class=\"sg\" data-s=\"3\">Die Klasse bietet diese Methode bewusst an.<\/span> <span class=\"sg\" data-s=\"4\">Wenn Sie versuchen, <code>$safe.code<\/code> oder <code>$safe!code<\/code> zu lesen, schlägt das einfach fehl.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private Attribute sind nützlich für interne Details.<\/span> <span class=\"sg\" data-s=\"1\">Der Rest des Programms soll nicht direkt mit diesen Details arbeiten.<\/span><\/p>"]]},"nl":{"t":"Private attributen","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In de <a href=\"https://course.raku.org/nl/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectie over attributen<\/a> hebben we elk attribuut met <code>$.<\/code> gedeclareerd.<\/span> <span class=\"sg\" data-s=\"1\">Dat maakt een publieke accessor.<\/span> <span class=\"sg\" data-s=\"2\">Als je een attribuut in plaats daarvan met <code>$!<\/code> declareert, is het <em>private<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Het heeft geen accessor, en je kunt het van buiten het object niet zien.<\/span> <span class=\"sg\" data-s=\"4\">Alleen de eigen methoden van de klasse kunnen erbij.<\/span> <span class=\"sg\" data-s=\"5\">Daar schrijf je het als <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">De geheime <code>$!code<\/code> wordt in het object bewaard, maar nooit naar buiten getoond.<\/span> <span class=\"sg\" data-s=\"1\">Er is geen accessor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Je kunt er dus alleen mee werken via de methode <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">De klasse kiest ervoor om deze methode aan te bieden.<\/span> <span class=\"sg\" data-s=\"4\">Als je <code>$safe.code<\/code> of <code>$safe!code<\/code> probeert te lezen, mislukt dat gewoon.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Private attributen zijn nuttig voor interne details.<\/span> <span class=\"sg\" data-s=\"1\">De rest van het programma hoort niet direct met die details te werken.<\/span><\/p>"]]},"es":{"t":"Atributos privados","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/es/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sección sobre atributos<\/a>, declaramos cada atributo con <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Esto crea un accesor público.<\/span> <span class=\"sg\" data-s=\"2\">Si en cambio declaras un atributo con <code>$!<\/code>, es <em>privado<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">No tiene accesor, y no puedes verlo desde fuera del objeto.<\/span> <span class=\"sg\" data-s=\"4\">Solo los propios métodos de la clase pueden llegar a él.<\/span> <span class=\"sg\" data-s=\"5\">Allí, lo escribes como <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">El secreto <code>$!code<\/code> se guarda dentro del objeto, pero nunca se muestra fuera.<\/span> <span class=\"sg\" data-s=\"1\">No hay accesor <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Así que solo puedes trabajar con él a través del método <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La clase decide ofrecer este método.<\/span> <span class=\"sg\" data-s=\"4\">Si intentas leer <code>$safe.code<\/code> o <code>$safe!code<\/code>, simplemente falla.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Los atributos privados son útiles para detalles internos.<\/span> <span class=\"sg\" data-s=\"1\">El resto del programa no debería trabajar con estos detalles directamente.<\/span><\/p>"]]},"it":{"t":"Attributi privati","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">Nella <a href=\"https://course.raku.org/it/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sezione sugli attributi<\/a> abbiamo dichiarato ogni attributo con <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Questo crea un accessore pubblico.<\/span> <span class=\"sg\" data-s=\"2\">Se invece dichiari un attributo con <code>$!<\/code>, è <em>privato<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Non ha accessore, e non lo puoi vedere dall'esterno dell'oggetto.<\/span> <span class=\"sg\" data-s=\"4\">Solo i metodi della classe stessa lo possono raggiungere.<\/span> <span class=\"sg\" data-s=\"5\">Lì lo scrivi come <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Il segreto <code>$!code<\/code> è conservato dentro l'oggetto, ma non si mostra mai all'esterno.<\/span> <span class=\"sg\" data-s=\"1\">Non c'è nessun accessore <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Quindi puoi lavorarci solo attraverso il metodo <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La classe sceglie di offrire questo metodo.<\/span> <span class=\"sg\" data-s=\"4\">Se provi a leggere <code>$safe.code<\/code> o <code>$safe!code<\/code>, semplicemente fallisce.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Gli attributi privati sono utili per i dettagli interni.<\/span> <span class=\"sg\" data-s=\"1\">Il resto del programma non dovrebbe lavorare direttamente con questi dettagli.<\/span><\/p>"]]},"lv":{"t":"Privāti atribūti","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\"><a href=\"https://course.raku.org/lv/oop/attributes/\" target=\"_blank\" rel=\"noopener\">Sadaļā par atribūtiem<\/a> mēs deklarējām katru atribūtu ar <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tas izveido publisku piekļuves metodi.<\/span> <span class=\"sg\" data-s=\"2\">Ja jūs tā vietā deklarējat atribūtu ar <code>$!<\/code>, tas ir <em>privāts<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Tam nav piekļuves metodes, un no objekta ārpuses jūs to nevarat redzēt.<\/span> <span class=\"sg\" data-s=\"4\">Tikai klases pašas metodes var to sasniegt.<\/span> <span class=\"sg\" data-s=\"5\">Tur jūs to rakstāt kā <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Slepenais <code>$!code<\/code> glabājas objekta iekšā, bet tas nekad netiek parādīts ārpusē.<\/span> <span class=\"sg\" data-s=\"1\">Piekļuves metodes <code>.code<\/code> nav.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc jūs varat ar to strādāt tikai caur metodi <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Klase pati izvēlas piedāvāt šo metodi.<\/span> <span class=\"sg\" data-s=\"4\">Ja jūs mēģināt nolasīt <code>$safe.code<\/code> vai <code>$safe!code<\/code>, tas vienkārši neizdodas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Privāti atribūti noder iekšējām detaļām.<\/span> <span class=\"sg\" data-s=\"1\">Pārējai programmai nevajadzētu strādāt ar šīm detaļām tieši.<\/span><\/p>"]]},"ru":{"t":"Приватные атрибуты","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/ru/oop/attributes/\" target=\"_blank\" rel=\"noopener\">разделе об атрибутах<\/a> мы объявляли каждый атрибут через <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Так создаётся публичный аксессор.<\/span> <span class=\"sg\" data-s=\"2\">Если же объявить атрибут через <code>$!<\/code>, он будет <em>приватным<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">У него нет аксессора, и снаружи объекта его не видно.<\/span> <span class=\"sg\" data-s=\"4\">Обратиться к нему могут только методы самого класса.<\/span> <span class=\"sg\" data-s=\"5\">Там его пишут как <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Секретный <code>$!code<\/code> хранится внутри объекта, но никогда не показывается снаружи.<\/span> <span class=\"sg\" data-s=\"1\">Аксессора <code>.code<\/code> нет.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому работать с ним можно только через метод <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Класс сам решил дать этот метод.<\/span> <span class=\"sg\" data-s=\"4\">Если попробовать прочитать <code>$safe.code<\/code> или <code>$safe!code<\/code>, ничего не выйдет.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приватные атрибуты полезны для внутренних деталей.<\/span> <span class=\"sg\" data-s=\"1\">Остальной программе не следует работать с этими деталями напрямую.<\/span><\/p>"]]},"uk":{"t":"Приватні атрибути","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">У <a href=\"https://course.raku.org/uk/oop/attributes/\" target=\"_blank\" rel=\"noopener\">розділі про атрибути<\/a> ми оголошували кожен атрибут через <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Це створює публічний аксесор.<\/span> <span class=\"sg\" data-s=\"2\">Якщо ж оголосити атрибут через <code>$!<\/code>, він <em>приватний<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Він не має аксесора, і ззовні об'єкта його не видно.<\/span> <span class=\"sg\" data-s=\"4\">Дістатися до нього можуть лише власні методи класу.<\/span> <span class=\"sg\" data-s=\"5\">Там ви пишете його як <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Таємний <code>$!code<\/code> зберігається всередині об'єкта, але ніколи не показується назовні.<\/span> <span class=\"sg\" data-s=\"1\">Аксесора <code>.code<\/code> немає.<\/span> <span class=\"sg\" data-s=\"2\">Тож працювати з ним можна лише через метод <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Клас сам вирішує надати цей метод.<\/span> <span class=\"sg\" data-s=\"4\">Якщо ви спробуєте прочитати <code>$safe.code<\/code> чи <code>$safe!code<\/code>, це просто не вдасться.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Приватні атрибути корисні для внутрішніх деталей.<\/span> <span class=\"sg\" data-s=\"1\">Решта програми не повинна працювати з цими деталями напряму.<\/span><\/p>"]]},"bg":{"t":"Частни атрибути","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">В <a href=\"https://course.raku.org/bg/oop/attributes/\" target=\"_blank\" rel=\"noopener\">раздела за атрибутите<\/a> декларирахме всеки атрибут с <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Това създава публичен аксесор.<\/span> <span class=\"sg\" data-s=\"2\">Ако вместо това декларирате атрибут с <code>$!<\/code>, той е <em>частен<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Той няма аксесор и не можете да го видите извън обекта.<\/span> <span class=\"sg\" data-s=\"4\">Само собствените методи на класа могат да стигнат до него.<\/span> <span class=\"sg\" data-s=\"5\">Там го пишете като <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Тайният <code>$!code<\/code> се пази вътре в обекта, но никога не се показва навън.<\/span> <span class=\"sg\" data-s=\"1\">Няма аксесор <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Затова можете да работите с него само през метода <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">Класът сам избира да даде този метод.<\/span> <span class=\"sg\" data-s=\"4\">Ако се опитате да прочетете <code>$safe.code<\/code> или <code>$safe!code<\/code>, това просто не успява.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Частните атрибути са полезни за вътрешни подробности.<\/span> <span class=\"sg\" data-s=\"1\">Останалата част от програмата не бива да работи направо с тях.<\/span><\/p>"]]},"eo":{"t":"Privataj atributoj","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">En la <a href=\"https://course.raku.org/eo/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sekcio pri atributoj<\/a>, ni deklaris ĉiun atributon per <code>$.<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Tio kreas publikan atingilon.<\/span> <span class=\"sg\" data-s=\"2\">Se vi deklaras atributon per <code>$!<\/code> anstataŭe, ĝi estas <em>privata<\/em>.<\/span> <span class=\"sg\" data-s=\"3\">Ĝi ne havas atingilon, kaj vi ne povas vidi ĝin de ekster la objekto.<\/span> <span class=\"sg\" data-s=\"4\">Nur la propraj metodoj de la klaso povas atingi ĝin.<\/span> <span class=\"sg\" data-s=\"5\">Tie vi skribas ĝin kiel <code>$!name<\/code>.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">La sekreta <code>$!code<\/code> estas konservata en la objekto, sed ĝi neniam estas montrata ekstere.<\/span> <span class=\"sg\" data-s=\"1\">Ne estas atingilo <code>.code<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Do vi povas labori kun ĝi nur tra la metodo <code>unlocks<\/code>.<\/span> <span class=\"sg\" data-s=\"3\">La klaso elektas provizi ĉi tiun metodon.<\/span> <span class=\"sg\" data-s=\"4\">Se vi provas legi <code>$safe.code<\/code> aŭ <code>$safe!code<\/code>, tio simple malsukcesas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Privataj atributoj estas utilaj por internaj detaloj.<\/span> <span class=\"sg\" data-s=\"1\">La resto de la programo ne devus labori kun tiuj detaloj rekte.<\/span><\/p>"]]},"la":{"t":"Attributa privata","b":[["p",6,"<p><span class=\"sg\" data-s=\"0\">In <a href=\"https://course.raku.org/la/oop/attributes/\" target=\"_blank\" rel=\"noopener\">sectione de attributis<\/a> quodque attributum per <code>$.<\/code> declaravimus.<\/span> <span class=\"sg\" data-s=\"1\">Hoc accessorem publicum creat.<\/span> <span class=\"sg\" data-s=\"2\">Si contra attributum per <code>$!<\/code> declaras, <em>privatum<\/em> est.<\/span> <span class=\"sg\" data-s=\"3\">Accessorem non habet, et id extra obiectum videre non potes.<\/span> <span class=\"sg\" data-s=\"4\">Solum propriae classis methodi id attingere possunt.<\/span> <span class=\"sg\" data-s=\"5\">Ibi id ut <code>$!name<\/code> scribis.<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Safe {\n    has $!code = 4321;\n\n    method unlocks($attempt) {\n        return $attempt == $!code;\n    }\n}\n\nmy $safe = Safe.new;\nsay $safe.unlocks(4321); # True\nsay $safe.unlocks(1111); # False<\/code><\/pre>"],["p",5,"<p><span class=\"sg\" data-s=\"0\">Secretum <code>$!code<\/code> intra obiectum servatur, sed numquam foris ostenditur.<\/span> <span class=\"sg\" data-s=\"1\">Nullus accessor <code>.code<\/code> est.<\/span> <span class=\"sg\" data-s=\"2\">Itaque solum per methodum <code>unlocks<\/code> cum eo agere potes.<\/span> <span class=\"sg\" data-s=\"3\">Classis hanc methodum praebere eligit.<\/span> <span class=\"sg\" data-s=\"4\">Si <code>$safe.code<\/code> vel <code>$safe!code<\/code> legere temptas, simpliciter deficit.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Attributa privata utilia sunt pro particulis internis.<\/span> <span class=\"sg\" data-s=\"1\">Cetera pars programmatis cum his particulis directe agere non debet.<\/span><\/p>"]]}}}</script>
