<script type="application/json" id="page-data">{"u":"oop/attributes/read-write","n":778,"k":"topic","pv":"oop/attributes","nx":"oop/attributes/defaults","tr":["oop","oop/attributes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Read-write attributes","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">By default, the accessor that <code>has $.name<\/code> creates is <em>read-only<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">The constructor, <code>new<\/code>, sets the value when it creates the object.<\/span> <span class=\"sg\" data-s=\"2\">After that, code outside the object can read the value but cannot change it.<\/span> <span class=\"sg\" data-s=\"3\">Assigning to it is an error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">The program stops with this message:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Do you want to change the value through the accessor?<\/span> <span class=\"sg\" data-s=\"1\">Then mark the attribute with the <code>is rw<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Now the accessor returns a writable container.<\/span> <span class=\"sg\" data-s=\"1\">So the assignment works, and the object’s <code>name<\/code> changes to <code>Max<\/code>.<\/span><\/p>"]]},"de":{"t":"Les- und schreibbare Attribute","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Standardmäßig ist der Accessor, den <code>has $.name<\/code> erzeugt, <em>nur lesbar<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Der Konstruktor, <code>new<\/code>, setzt den Wert, wenn er das Objekt erzeugt.<\/span> <span class=\"sg\" data-s=\"2\">Danach kann Code außerhalb des Objekts den Wert lesen, aber nicht ändern.<\/span> <span class=\"sg\" data-s=\"3\">Eine Zuweisung an ihn ist ein Fehler:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Das Programm bricht mit dieser Meldung ab:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Möchten Sie den Wert über den Accessor ändern?<\/span> <span class=\"sg\" data-s=\"1\">Dann markieren Sie das Attribut mit dem Trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Jetzt gibt der Accessor einen schreibbaren Container zurück.<\/span> <span class=\"sg\" data-s=\"1\">Die Zuweisung funktioniert also, und der <code>name<\/code> des Objekts wird zu <code>Max<\/code>.<\/span><\/p>"]]},"nl":{"t":"Lees-schrijfattributen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Standaard is de accessor die <code>has $.name<\/code> maakt <em>alleen-lezen<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">De constructor, <code>new<\/code>, stelt de waarde in wanneer hij het object maakt.<\/span> <span class=\"sg\" data-s=\"2\">Daarna kan code buiten het object de waarde lezen, maar niet veranderen.<\/span> <span class=\"sg\" data-s=\"3\">Eraan toekennen is een fout:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Het programma stopt met deze melding:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wil je de waarde via de accessor kunnen wijzigen?<\/span> <span class=\"sg\" data-s=\"1\">Markeer het attribuut dan met de trait <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nu geeft de accessor een schrijfbare container terug.<\/span> <span class=\"sg\" data-s=\"1\">Dus werkt de toekenning, en de <code>name<\/code> van het object verandert in <code>Max<\/code>.<\/span><\/p>"]]},"es":{"t":"Atributos de lectura y escritura","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Por defecto, el accesor que crea <code>has $.name<\/code> es de <em>solo lectura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">El constructor, <code>new<\/code>, fija el valor cuando crea el objeto.<\/span> <span class=\"sg\" data-s=\"2\">Después, el código de fuera del objeto puede leer el valor, pero no puede cambiarlo.<\/span> <span class=\"sg\" data-s=\"3\">Asignarle un valor es un error:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">El programa se detiene con este mensaje:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">¿Quieres cambiar el valor a través del accesor?<\/span> <span class=\"sg\" data-s=\"1\">Entonces marca el atributo con el rasgo <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ahora el accesor devuelve un contenedor escribible.<\/span> <span class=\"sg\" data-s=\"1\">Así que la asignación funciona, y el <code>name<\/code> del objeto cambia a <code>Max<\/code>.<\/span><\/p>"]]},"it":{"t":"Attributi in lettura e scrittura","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Normalmente l'accessore che <code>has $.name<\/code> crea è di <em>sola lettura<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Il costruttore, <code>new<\/code>, imposta il valore quando crea l'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Dopo, il codice fuori dall'oggetto può leggere il valore ma non può cambiarlo.<\/span> <span class=\"sg\" data-s=\"3\">Assegnargli un valore è un errore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Il programma si ferma con questo messaggio:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vuoi cambiare il valore attraverso l'accessore?<\/span> <span class=\"sg\" data-s=\"1\">Allora contrassegna l'attributo con il tratto <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora l'accessore restituisce un contenitore scrivibile.<\/span> <span class=\"sg\" data-s=\"1\">Così l'assegnamento funziona, e il <code>name<\/code> dell'oggetto diventa <code>Max<\/code>.<\/span><\/p>"]]},"lv":{"t":"Lasāmi un rakstāmi atribūti","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Pēc noklusējuma piekļuves metode, ko izveido <code>has $.name<\/code>, ir <em>tikai lasāma<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Konstruktors <code>new<\/code> uzstāda vērtību, kad tas rada objektu.<\/span> <span class=\"sg\" data-s=\"2\">Pēc tam kods ārpus objekta var vērtību nolasīt, bet nevar to mainīt.<\/span> <span class=\"sg\" data-s=\"3\">Piešķiršana tai ir kļūda:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma apstājas ar šo ziņojumu:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vai vēlaties mainīt vērtību caur piekļuves metodi?<\/span> <span class=\"sg\" data-s=\"1\">Tad atzīmējiet atribūtu ar iezīmi <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad piekļuves metode atgriež rakstāmu konteineru.<\/span> <span class=\"sg\" data-s=\"1\">Tāpēc piešķiršana darbojas, un objekta <code>name<\/code> kļūst par <code>Max<\/code>.<\/span><\/p>"]]},"ru":{"t":"Атрибуты для чтения и записи","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">По умолчанию аксессор, который создаёт <code>has $.name<\/code>, работает <em>только на чтение<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструктор <code>new<\/code> задаёт значение, когда создаёт объект.<\/span> <span class=\"sg\" data-s=\"2\">После этого код снаружи объекта может читать значение, но не может его изменить.<\/span> <span class=\"sg\" data-s=\"3\">Присваивание ему приводит к ошибке:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Программа останавливается с таким сообщением:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Хотите изменять значение через аксессор?<\/span> <span class=\"sg\" data-s=\"1\">Тогда пометьте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь аксессор возвращает изменяемый контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Поэтому присваивание работает, и <code>name<\/code> объекта меняется на <code>Max<\/code>.<\/span><\/p>"]]},"uk":{"t":"Атрибути для читання й запису","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">За замовчуванням аксесор, який створює <code>has $.name<\/code>, доступний <em>лише для читання<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструктор, <code>new<\/code>, задає значення, коли створює об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Після цього код поза об'єктом може читати значення, але не може його змінити.<\/span> <span class=\"sg\" data-s=\"3\">Присвоєння йому — помилка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програма зупиняється з таким повідомленням:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ви хочете змінювати значення через аксесор?<\/span> <span class=\"sg\" data-s=\"1\">Тоді позначте атрибут трейтом <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер аксесор повертає контейнер, у який можна записувати.<\/span> <span class=\"sg\" data-s=\"1\">Тож присвоєння працює, і <code>name<\/code> об'єкта змінюється на <code>Max<\/code>.<\/span><\/p>"]]},"bg":{"t":"Атрибути за четене и писане","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">По подразбиране аксесорът, който <code>has $.name<\/code> създава, е <em>само за четене<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Конструкторът, <code>new<\/code>, задава стойността, когато създава обекта.<\/span> <span class=\"sg\" data-s=\"2\">След това кодът извън обекта може да чете стойността, но не може да я променя.<\/span> <span class=\"sg\" data-s=\"3\">Присвояването на нова стойност е грешка:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Програмата спира с това съобщение:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Искате ли да променяте стойността през аксесора?<\/span> <span class=\"sg\" data-s=\"1\">Тогава отбележете атрибута с трейта <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Сега аксесорът връща записваем контейнер.<\/span> <span class=\"sg\" data-s=\"1\">Затова присвояването работи и <code>name<\/code> на обекта става <code>Max<\/code>.<\/span><\/p>"]]},"eo":{"t":"Leg- kaj skribeblaj atributoj","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Defaŭlte, la atingilo, kiun <code>has $.name<\/code> kreas, estas <em>nur-legebla<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">La konstruilo, <code>new<\/code>, donas la valoron, kiam ĝi kreas la objekton.<\/span> <span class=\"sg\" data-s=\"2\">Post tio, kodo ekster la objekto povas legi la valoron, sed ne povas ŝanĝi ĝin.<\/span> <span class=\"sg\" data-s=\"3\">Atribui al ĝi estas eraro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">La programo haltas kun ĉi tiu mesaĝo:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ĉu vi volas ŝanĝi la valoron tra la atingilo?<\/span> <span class=\"sg\" data-s=\"1\">Tiam marku la atributon per la trajto <code>is rw<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nun la atingilo redonas skribeblan ujon.<\/span> <span class=\"sg\" data-s=\"1\">Do la atribuo funkcias, kaj la <code>name<\/code> de la objekto ŝanĝiĝas al <code>Max<\/code>.<\/span><\/p>"]]},"la":{"t":"Attributa legenda et scribenda","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ex more, accessor quem <code>has $.name<\/code> creat <em>solum legendus<\/em> est.<\/span> <span class=\"sg\" data-s=\"1\">Constructor, <code>new<\/code>, valorem ponit cum obiectum creat.<\/span> <span class=\"sg\" data-s=\"2\">Postea codex extra obiectum valorem legere potest, sed mutare non potest.<\/span> <span class=\"sg\" data-s=\"3\">Ei assignare error est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Programma cum hoc nuntio desinit:<\/span><\/p>"],["code",0,"<pre><code>Cannot modify an immutable Str (Rex)<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Visne valorem per accessorem mutare?<\/span> <span class=\"sg\" data-s=\"1\">Tum attributum proprietate <code>is rw<\/code> nota:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name is rw;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex');\n$rex.name = 'Max';\nsay $rex.name; # Max<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc accessor receptaculum scribendum reddit.<\/span> <span class=\"sg\" data-s=\"1\">Itaque assignatio operatur, et <code>name<\/code> obiecti fit <code>Max<\/code>.<\/span><\/p>"]]}}}</script>
