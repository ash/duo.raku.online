<script type="application/json" id="page-data">{"u":"oop/attributes/defaults","n":779,"k":"topic","pv":"oop/attributes/read-write","nx":"oop/attributes/defaults/quiz","tr":["oop","oop/attributes"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Default values","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">You can give an attribute a <em>default value<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">It is used when you create an object without a value for that attribute.<\/span> <span class=\"sg\" data-s=\"2\">Write the default after the attribute, with <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Note that you can give attributes a type, just as you do with variables.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">When you do not pass <code>weight<\/code> to <code>new<\/code>, the attribute gets its default value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">You can still replace the default if you pass a value:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">An attribute with no default and no value from <code>new<\/code> is simply undefined.<\/span> <span class=\"sg\" data-s=\"1\">It is exactly like a new scalar variable.<\/span><\/p>"]]},"de":{"t":"Standardwerte","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Sie können einem Attribut einen <em>Standardwert<\/em> geben.<\/span> <span class=\"sg\" data-s=\"1\">Er wird verwendet, wenn Sie ein Objekt ohne Wert für dieses Attribut erzeugen.<\/span> <span class=\"sg\" data-s=\"2\">Schreiben Sie den Standardwert mit <code>=<\/code> hinter das Attribut:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass Sie Attributen einen Typ geben können, genau wie bei Variablen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie <code>weight<\/code> nicht an <code>new<\/code> übergeben, bekommt das Attribut seinen Standardwert:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Sie können den Standardwert trotzdem ersetzen, wenn Sie einen Wert übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ein Attribut ohne Standardwert und ohne Wert von <code>new<\/code> ist einfach undefiniert.<\/span> <span class=\"sg\" data-s=\"1\">Es ist genau wie eine neue skalare Variable.<\/span><\/p>"]]},"nl":{"t":"Standaardwaarden","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Je kunt een attribuut een <em>standaardwaarde<\/em> geven.<\/span> <span class=\"sg\" data-s=\"1\">Die wordt gebruikt als je een object maakt zonder waarde voor dat attribuut.<\/span> <span class=\"sg\" data-s=\"2\">Schrijf de standaardwaarde achter het attribuut, met <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Merk op dat je attributen een type kunt geven, net zoals bij variabelen.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als je <code>weight<\/code> niet aan <code>new<\/code> meegeeft, krijgt het attribuut zijn standaardwaarde:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Je kunt de standaardwaarde nog steeds vervangen als je een waarde meegeeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een attribuut zonder standaardwaarde en zonder waarde van <code>new<\/code> is gewoon ongedefinieerd.<\/span> <span class=\"sg\" data-s=\"1\">Het is precies als een nieuwe scalaire variabele.<\/span><\/p>"]]},"es":{"t":"Valores por defecto","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puedes dar a un atributo un <em>valor por defecto<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Se usa cuando creas un objeto sin un valor para ese atributo.<\/span> <span class=\"sg\" data-s=\"2\">Escribe el valor por defecto después del atributo, con <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que puedes dar un tipo a los atributos, igual que haces con las variables.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cuando no pasas <code>weight<\/code> a <code>new<\/code>, el atributo toma su valor por defecto:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Aun así, puedes reemplazar el valor por defecto si pasas un valor:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un atributo sin valor por defecto y sin valor de <code>new<\/code> simplemente queda sin definir.<\/span> <span class=\"sg\" data-s=\"1\">Es exactamente como una variable escalar nueva.<\/span><\/p>"]]},"it":{"t":"Valori predefiniti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Puoi dare a un attributo un <em>valore predefinito<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Viene usato quando crei un oggetto senza un valore per quell'attributo.<\/span> <span class=\"sg\" data-s=\"2\">Scrivi il valore predefinito dopo l'attributo, con <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota che puoi dare un tipo agli attributi, proprio come fai con le variabili.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Quando non passi <code>weight<\/code> a <code>new<\/code>, l'attributo prende il suo valore predefinito:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Puoi comunque sostituire il valore predefinito se passi un valore:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Un attributo senza valore predefinito e senza un valore da <code>new<\/code> è semplicemente non definito.<\/span> <span class=\"sg\" data-s=\"1\">È proprio come una nuova variabile scalare.<\/span><\/p>"]]},"lv":{"t":"Noklusētās vērtības","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Atribūtam jūs varat dot <em>noklusēto vērtību<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">To izmanto, kad jūs radāt objektu bez vērtības šim atribūtam.<\/span> <span class=\"sg\" data-s=\"2\">Rakstiet noklusējumu aiz atribūta ar <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka atribūtiem var dot tipu, tāpat kā mainīgajiem.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kad jūs nepadodat <code>weight<\/code> metodei <code>new<\/code>, atribūts saņem savu noklusēto vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Jūs joprojām varat aizstāt noklusējumu, ja padodat vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atribūts bez noklusējuma un bez vērtības no <code>new<\/code> ir vienkārši nedefinēts.<\/span> <span class=\"sg\" data-s=\"1\">Tas ir tieši tāds pats kā jauns skalārs mainīgais.<\/span><\/p>"]]},"ru":{"t":"Значения по умолчанию","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Атрибуту можно задать <em>значение по умолчанию<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Оно используется, когда вы создаёте объект без значения для этого атрибута.<\/span> <span class=\"sg\" data-s=\"2\">Напишите значение по умолчанию после атрибута, через <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что атрибутам можно задать тип, так же как переменным.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если вы не передаёте <code>weight<\/code> в <code>new<\/code>, атрибут получает своё значение по умолчанию:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Значение по умолчанию всё равно можно заменить, если передать своё значение:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Атрибут без значения по умолчанию и без значения из <code>new<\/code> просто не определён.<\/span> <span class=\"sg\" data-s=\"1\">Он ведёт себя точно как новая скалярная переменная.<\/span><\/p>"]]},"uk":{"t":"Типові значення","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Ви можете дати атрибуту <em>типове значення<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Його використовують, коли ви створюєте об'єкт без значення для цього атрибута.<\/span> <span class=\"sg\" data-s=\"2\">Запишіть типове значення після атрибута через <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що атрибутам можна задати тип, так само як змінним.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Коли ви не передаєте <code>weight<\/code> до <code>new<\/code>, атрибут отримує своє типове значення:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ви все одно можете замінити типове значення, якщо передасте своє:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Атрибут без типового значення і без значення з <code>new<\/code> просто невизначений.<\/span> <span class=\"sg\" data-s=\"1\">Він точно такий, як нова скалярна змінна.<\/span><\/p>"]]},"bg":{"t":"Стойности по подразбиране","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Можете да дадете на атрибута <em>стойност по подразбиране<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Тя се използва, когато създавате обект без стойност за този атрибут.<\/span> <span class=\"sg\" data-s=\"2\">Запишете стойността по подразбиране след атрибута, с <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Забележете, че можете да дадете тип на атрибутите, точно както при променливите.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Когато не подадете <code>weight<\/code> на <code>new<\/code>, атрибутът получава стойността си по подразбиране:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Пак можете да замените стойността по подразбиране, ако подадете стойност:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Атрибут без стойност по подразбиране и без стойност от <code>new<\/code> просто е недефиниран.<\/span> <span class=\"sg\" data-s=\"1\">Той е точно като нова скаларна променлива.<\/span><\/p>"]]},"eo":{"t":"Defaŭltaj valoroj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Vi povas doni al atributo <em>defaŭltan valoron<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas uzata, kiam vi kreas objekton sen valoro por tiu atributo.<\/span> <span class=\"sg\" data-s=\"2\">Skribu la defaŭlton post la atributo, per <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Notu, ke vi povas doni al atributoj tipon, same kiel al variabloj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Kiam vi ne transdonas <code>weight<\/code> al <code>new<\/code>, la atributo ricevas sian defaŭltan valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Vi ankoraŭ povas anstataŭigi la defaŭlton, se vi transdonas valoron:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Atributo sen defaŭlto kaj sen valoro de <code>new<\/code> estas simple nedifinita.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi estas ekzakte kiel nova skalara variablo.<\/span><\/p>"]]},"la":{"t":"Valores praedefiniti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Attributo <em>valorem praedefinitum<\/em> dare potes.<\/span> <span class=\"sg\" data-s=\"1\">Is adhibetur cum obiectum sine valore pro illo attributo creas.<\/span> <span class=\"sg\" data-s=\"2\">Scribe valorem praedefinitum post attributum, cum <code>=<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has Str $.name;\n    has Rat $.weight = 4.0;\n}<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Nota: attributis genus dare potes, sicut variabilibus.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Cum <code>weight<\/code> ad <code>new<\/code> non tradis, attributum valorem suum praedefinitum accipit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex = Dog.new(name =&gt; 'Rex');\nsay $rex.weight; # 4<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Valorem praedefinitum tamen superare potes, si valorem tradis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $lighty = Dog.new(name =&gt; 'Lighty', weight =&gt; 3.2);\nsay $lighty.weight; # 3.2<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Attributum sine valore praedefinito et sine valore ex <code>new<\/code> simpliciter indefinitum est.<\/span> <span class=\"sg\" data-s=\"1\">Est exacte sicut nova variabilis scalaris.<\/span><\/p>"]]}}}</script>
