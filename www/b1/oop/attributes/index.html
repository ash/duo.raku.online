<script type="application/json" id="page-data">{"u":"oop/attributes","n":777,"k":"section","pv":"oop/classes/exercises/name-the-type/solution","nx":"oop/attributes/read-write","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Attributes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">An empty class is not very useful.<\/span> <span class=\"sg\" data-s=\"1\">To let an object keep its own data, give the class <em>attributes<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">You declare an attribute inside the class with the <code>has<\/code> keyword:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Every object of the class has its own copy of these attributes.<\/span> <span class=\"sg\" data-s=\"1\">You set their values when you create the object.<\/span> <span class=\"sg\" data-s=\"2\">To do this, pass them to <code>new<\/code> as named arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">The <code>$.<\/code> in <code>has $.name<\/code> does two things at once.<\/span> <span class=\"sg\" data-s=\"1\">It declares an attribute, and it creates a method with the same name.<\/span> <span class=\"sg\" data-s=\"2\">This method is called an <em>accessor<\/em>, and it returns the value of the attribute:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Different objects keep their own values, which do not depend on each other:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">The next topics show how to make attributes changeable.<\/span> <span class=\"sg\" data-s=\"1\">They also show how to give attributes default values.<\/span> <span class=\"sg\" data-s=\"2\">There is also a way to declare <em>private<\/em> attributes, which are hidden from the outside.<\/span> <span class=\"sg\" data-s=\"3\">We will come back to them after we introduce methods.<\/span><\/p>"]]},"de":{"t":"Attribute","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine leere Klasse ist nicht sehr nützlich.<\/span> <span class=\"sg\" data-s=\"1\">Damit ein Objekt eigene Daten speichern kann, geben Sie der Klasse <em>Attribute<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Sie deklarieren ein Attribut in der Klasse mit dem Schlüsselwort <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Jedes Objekt der Klasse hat eine eigene Kopie dieser Attribute.<\/span> <span class=\"sg\" data-s=\"1\">Die Werte setzen Sie, wenn Sie das Objekt erzeugen.<\/span> <span class=\"sg\" data-s=\"2\">Dazu übergeben Sie sie als benannte Argumente an <code>new<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Das <code>$.<\/code> in <code>has $.name<\/code> tut zwei Dinge auf einmal.<\/span> <span class=\"sg\" data-s=\"1\">Es deklariert ein Attribut, und es erzeugt eine Methode mit dem gleichen Namen.<\/span> <span class=\"sg\" data-s=\"2\">Diese Methode heißt <em>Accessor<\/em>, und sie gibt den Wert des Attributs zurück:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verschiedene Objekte haben ihre eigenen Werte, die nicht voneinander abhängen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Die nächsten Themen zeigen, wie Sie Attribute veränderbar machen.<\/span> <span class=\"sg\" data-s=\"1\">Sie zeigen auch, wie Sie Attributen Standardwerte geben.<\/span> <span class=\"sg\" data-s=\"2\">Es gibt außerdem einen Weg, <em>private<\/em> Attribute zu deklarieren, die man von außen nicht sehen kann.<\/span> <span class=\"sg\" data-s=\"3\">Wir kommen auf sie zurück, wenn wir Methoden eingeführt haben.<\/span><\/p>"]]},"nl":{"t":"Attributen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een lege klasse is niet erg nuttig.<\/span> <span class=\"sg\" data-s=\"1\">Geef de klasse <em>attributen<\/em>, zodat een object zijn eigen gegevens kan bewaren.<\/span> <span class=\"sg\" data-s=\"2\">Je declareert een attribuut in de klasse met het sleutelwoord <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Elk object van de klasse heeft een eigen kopie van deze attributen.<\/span> <span class=\"sg\" data-s=\"1\">Je stelt hun waarden in wanneer je het object maakt.<\/span> <span class=\"sg\" data-s=\"2\">Geef ze daarvoor als benoemde argumenten mee aan <code>new<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">De <code>$.<\/code> in <code>has $.name<\/code> doet twee dingen tegelijk.<\/span> <span class=\"sg\" data-s=\"1\">Hij declareert een attribuut, en hij maakt een methode met dezelfde naam.<\/span> <span class=\"sg\" data-s=\"2\">Deze methode heet een <em>accessor<\/em>, en ze geeft de waarde van het attribuut terug:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Verschillende objecten bewaren hun eigen waarden, die niet van elkaar afhangen:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">De volgende onderwerpen laten zien hoe je attributen wijzigbaar maakt.<\/span> <span class=\"sg\" data-s=\"1\">Ze laten ook zien hoe je attributen standaardwaarden geeft.<\/span> <span class=\"sg\" data-s=\"2\">Er is ook een manier om <em>private<\/em> attributen te declareren, die van buitenaf verborgen zijn.<\/span> <span class=\"sg\" data-s=\"3\">We komen erop terug nadat we methoden hebben behandeld.<\/span><\/p>"]]},"es":{"t":"Atributos","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una clase vacía no es muy útil.<\/span> <span class=\"sg\" data-s=\"1\">Para que un objeto guarde sus propios datos, da a la clase unos <em>atributos<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Declaras un atributo dentro de la clase con la palabra clave <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Cada objeto de la clase tiene su propia copia de estos atributos.<\/span> <span class=\"sg\" data-s=\"1\">Les das sus valores cuando creas el objeto.<\/span> <span class=\"sg\" data-s=\"2\">Para ello, pásalos a <code>new<\/code> como argumentos con nombre:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">El <code>$.<\/code> de <code>has $.name<\/code> hace dos cosas a la vez.<\/span> <span class=\"sg\" data-s=\"1\">Declara un atributo y crea un método con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"2\">Este método se llama <em>accesor<\/em> y devuelve el valor del atributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objetos distintos guardan sus propios valores, que no dependen unos de otros:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los temas siguientes muestran cómo hacer que los atributos se puedan cambiar.<\/span> <span class=\"sg\" data-s=\"1\">También muestran cómo dar valores por defecto a los atributos.<\/span> <span class=\"sg\" data-s=\"2\">Además, hay una manera de declarar atributos <em>privados<\/em>, que quedan ocultos desde fuera.<\/span> <span class=\"sg\" data-s=\"3\">Volveremos a ellos después de presentar los métodos.<\/span><\/p>"]]},"it":{"t":"Attributi","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Una classe vuota non è molto utile.<\/span> <span class=\"sg\" data-s=\"1\">Perché un oggetto possa avere dati propri, dai alla classe degli <em>attributi<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Dichiari un attributo dentro la classe con la parola chiave <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ogni oggetto della classe ha la propria copia di questi attributi.<\/span> <span class=\"sg\" data-s=\"1\">Imposti i loro valori quando crei l'oggetto.<\/span> <span class=\"sg\" data-s=\"2\">Per farlo, passali a <code>new<\/code> come argomenti nominati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Il <code>$.<\/code> in <code>has $.name<\/code> fa due cose insieme.<\/span> <span class=\"sg\" data-s=\"1\">Dichiara un attributo e crea un metodo con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"2\">Questo metodo si chiama <em>accessore<\/em> e restituisce il valore dell'attributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Oggetti diversi conservano valori propri, che non dipendono l'uno dall'altro:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">I prossimi argomenti mostrano come rendere modificabili gli attributi.<\/span> <span class=\"sg\" data-s=\"1\">Mostrano anche come dare agli attributi dei valori predefiniti.<\/span> <span class=\"sg\" data-s=\"2\">C'è anche un modo per dichiarare attributi <em>privati<\/em>, che sono nascosti all'esterno.<\/span> <span class=\"sg\" data-s=\"3\">Ci torneremo quando avremo visto i metodi.<\/span><\/p>"]]},"lv":{"t":"Atribūti","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Tukša klase nav īpaši noderīga.<\/span> <span class=\"sg\" data-s=\"1\">Lai objekts varētu glabāt savus datus, dodiet klasei <em>atribūtus<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Atribūtu jūs deklarējat klases iekšā ar atslēgvārdu <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Katram klases objektam ir sava šo atribūtu kopija.<\/span> <span class=\"sg\" data-s=\"1\">To vērtības jūs uzstādāt, kad radāt objektu.<\/span> <span class=\"sg\" data-s=\"2\">Lai to izdarītu, padodiet tās <code>new<\/code> kā nosauktus argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> kodā <code>has $.name<\/code> dara divas lietas uzreiz.<\/span> <span class=\"sg\" data-s=\"1\">Tas deklarē atribūtu un izveido metodi ar tādu pašu nosaukumu.<\/span> <span class=\"sg\" data-s=\"2\">Šo metodi sauc par <em>piekļuves metodi<\/em>, un tā atgriež atribūta vērtību:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Dažādi objekti glabā savas vērtības, kas nav atkarīgas cita no citas:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Nākamie temati parāda, kā padarīt atribūtus maināmus.<\/span> <span class=\"sg\" data-s=\"1\">Tie arī parāda, kā dot atribūtiem noklusētās vērtības.<\/span> <span class=\"sg\" data-s=\"2\">Ir arī veids, kā deklarēt <em>privātus<\/em> atribūtus, kas ir paslēpti no ārpuses.<\/span> <span class=\"sg\" data-s=\"3\">Pie tiem mēs atgriezīsimies, kad būsim iepazinuši metodes.<\/span><\/p>"]]},"ru":{"t":"Атрибуты","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Пустой класс не очень полезен.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы объект мог хранить свои данные, дайте классу <em>атрибуты<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Атрибут объявляют внутри класса ключевым словом <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">У каждого объекта класса есть своя копия этих атрибутов.<\/span> <span class=\"sg\" data-s=\"1\">Вы задаёте их значения, когда создаёте объект.<\/span> <span class=\"sg\" data-s=\"2\">Для этого передайте их в <code>new<\/code> как именованные аргументы:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Запись <code>$.<\/code> в <code>has $.name<\/code> делает сразу две вещи.<\/span> <span class=\"sg\" data-s=\"1\">Она объявляет атрибут и создаёт метод с тем же именем.<\/span> <span class=\"sg\" data-s=\"2\">Этот метод называется <em>аксессором<\/em>, и он возвращает значение атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Разные объекты хранят свои значения, и эти значения не зависят друг от друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Следующие темы показывают, как сделать атрибуты изменяемыми.<\/span> <span class=\"sg\" data-s=\"1\">Ещё они показывают, как задать атрибутам значения по умолчанию.<\/span> <span class=\"sg\" data-s=\"2\">Есть также способ объявить <em>приватные<\/em> атрибуты, которые не видны снаружи.<\/span> <span class=\"sg\" data-s=\"3\">Мы вернёмся к ним, когда познакомимся с методами.<\/span><\/p>"]]},"uk":{"t":"Атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Порожній клас не дуже корисний.<\/span> <span class=\"sg\" data-s=\"1\">Щоб об'єкт міг зберігати власні дані, дайте класу <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Ви оголошуєте атрибут усередині класу ключовим словом <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Кожен об'єкт класу має власну копію цих атрибутів.<\/span> <span class=\"sg\" data-s=\"1\">Їхні значення ви задаєте, коли створюєте об'єкт.<\/span> <span class=\"sg\" data-s=\"2\">Для цього передайте їх до <code>new<\/code> як іменовані аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> у <code>has $.name<\/code> робить дві речі водночас.<\/span> <span class=\"sg\" data-s=\"1\">Він оголошує атрибут і створює метод із тим самим ім'ям.<\/span> <span class=\"sg\" data-s=\"2\">Цей метод називають <em>аксесором<\/em>, і він повертає значення атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Різні об'єкти зберігають власні значення, які не залежать одне від одного:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Наступні теми показують, як дозволити змінювати атрибути.<\/span> <span class=\"sg\" data-s=\"1\">Вони також показують, як дати атрибутам типові значення.<\/span> <span class=\"sg\" data-s=\"2\">Є також спосіб оголосити <em>приватні<\/em> атрибути, яких не видно ззовні.<\/span> <span class=\"sg\" data-s=\"3\">Ми повернемося до них, коли познайомимося з методами.<\/span><\/p>"]]},"bg":{"t":"Атрибути","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Празният клас не е много полезен.<\/span> <span class=\"sg\" data-s=\"1\">За да може обектът да пази свои данни, дайте на класа <em>атрибути<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Декларирате атрибут вътре в класа с ключовата дума <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Всеки обект от класа има свое собствено копие на тези атрибути.<\/span> <span class=\"sg\" data-s=\"1\">Задавате стойностите им, когато създавате обекта.<\/span> <span class=\"sg\" data-s=\"2\">За целта ги подайте на <code>new<\/code> като именувани аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> в <code>has $.name<\/code> върши две неща наведнъж.<\/span> <span class=\"sg\" data-s=\"1\">Декларира атрибут и създава метод със същото име.<\/span> <span class=\"sg\" data-s=\"2\">Този метод се нарича <em>аксесор<\/em> и връща стойността на атрибута:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Различните обекти пазят свои собствени стойности, които не зависят една от друга:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Следващите теми показват как да направите атрибутите променяеми.<\/span> <span class=\"sg\" data-s=\"1\">Те показват и как да дадете на атрибутите стойности по подразбиране.<\/span> <span class=\"sg\" data-s=\"2\">Има и начин да декларирате <em>частни<\/em> атрибути, които са скрити отвън.<\/span> <span class=\"sg\" data-s=\"3\">Ще се върнем към тях, след като въведем методите.<\/span><\/p>"]]},"eo":{"t":"Atributoj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Malplena klaso ne estas tre utila.<\/span> <span class=\"sg\" data-s=\"1\">Por ke objekto tenu siajn proprajn datumojn, donu al la klaso <em>atributojn<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Vi deklaras atributon ene de la klaso per la ŝlosilvorto <code>has<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Ĉiu objekto de la klaso havas sian propran kopion de ĉi tiuj atributoj.<\/span> <span class=\"sg\" data-s=\"1\">Vi donas al ili valorojn, kiam vi kreas la objekton.<\/span> <span class=\"sg\" data-s=\"2\">Por tio, transdonu ilin al <code>new<\/code> kiel nomitajn argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">La <code>$.<\/code> en <code>has $.name<\/code> faras du aferojn samtempe.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi deklaras atributon, kaj ĝi kreas metodon kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"2\">Ĉi tiu metodo nomiĝas <em>atingilo<\/em>, kaj ĝi redonas la valoron de la atributo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Malsamaj objektoj tenas siajn proprajn valorojn, kiuj ne dependas unu de la alia:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">La sekvaj temoj montras, kiel fari atributojn ŝanĝeblaj.<\/span> <span class=\"sg\" data-s=\"1\">Ili ankaŭ montras, kiel doni al atributoj defaŭltajn valorojn.<\/span> <span class=\"sg\" data-s=\"2\">Estas ankaŭ maniero deklari <em>privatajn<\/em> atributojn, kiuj estas kaŝitaj de ekstere.<\/span> <span class=\"sg\" data-s=\"3\">Ni revenos al ili, kiam ni prezentos la metodojn.<\/span><\/p>"]]},"la":{"t":"Attributa","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Classis vacua non valde utilis est.<\/span> <span class=\"sg\" data-s=\"1\">Ut obiectum propria data servet, classi <em>attributa<\/em> da.<\/span> <span class=\"sg\" data-s=\"2\">Attributum intra classem per verbum <code>has<\/code> declaras:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\">Quodque obiectum classis propriam copiam horum attributorum habet.<\/span> <span class=\"sg\" data-s=\"1\">Valores eorum ponis cum obiectum creas.<\/span> <span class=\"sg\" data-s=\"2\">Ad hoc, trade eos ad <code>new<\/code> ut argumenta nominata:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Dog {\n    has $.name;\n    has $.age;\n}\n\nmy $rex = Dog.new(name =&gt; 'Rex', age =&gt; 3);<\/code><\/pre>"],["p",3,"<p><span class=\"sg\" data-s=\"0\"><code>$.<\/code> in <code>has $.name<\/code> duas res simul agit.<\/span> <span class=\"sg\" data-s=\"1\">Attributum declarat, et methodum eiusdem nominis creat.<\/span> <span class=\"sg\" data-s=\"2\">Haec methodus <em>accessor<\/em> appellatur, et valorem attributi reddit:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $rex.name; # Rex\nsay $rex.age;  # 3<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Diversa obiecta proprios valores servant, qui alii ab aliis non pendent:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $rex  = Dog.new(name =&gt; 'Rex',  age =&gt; 3);\nmy $fido = Dog.new(name =&gt; 'Fido', age =&gt; 5);\n\nsay $rex.name;  # Rex\nsay $fido.name; # Fido<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Argumenta sequentia ostendunt quomodo attributa mutabilia facias.<\/span> <span class=\"sg\" data-s=\"1\">Ostendunt etiam quomodo attributis valores praedefinitos des.<\/span> <span class=\"sg\" data-s=\"2\">Est etiam modus attributa <em>privata<\/em> declarandi, quae extra obiectum abscondita sunt.<\/span> <span class=\"sg\" data-s=\"3\">Ad ea redibimus postquam methodos introduxerimus.<\/span><\/p>"]]}}}</script>
