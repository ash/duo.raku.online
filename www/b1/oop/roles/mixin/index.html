<script type="application/json" id="page-data">{"u":"oop/roles/mixin","n":830,"k":"topic","pv":"oop/roles/multiple-roles","nx":"oop/roles/mixin/quiz","tr":["oop","oop/roles"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Adding a role to an object","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">A role does not have to be built into a class.<\/span> <span class=\"sg\" data-s=\"1\">You can also give one to an object that already exists, with the <code>but<\/code> operator.<\/span> <span class=\"sg\" data-s=\"2\">It mixes the role into a single object at run time.<\/span> <span class=\"sg\" data-s=\"3\">Then it returns a new object that has the role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Only <code>$loud<\/code> got the role.<\/span> <span class=\"sg\" data-s=\"1\">The <code>Greeter<\/code> class and all other <code>Greeter<\/code> objects stay the same.<\/span> <span class=\"sg\" data-s=\"2\">So <code>$quiet<\/code> still greets in the normal way.<\/span> <span class=\"sg\" data-s=\"3\">Sometimes the role and the class both define a method with the same name.<\/span> <span class=\"sg\" data-s=\"4\">In this case, the role’s version wins.<\/span> <span class=\"sg\" data-s=\"5\">And <code>callsame<\/code> calls the method that it overrode.<\/span> <span class=\"sg\" data-s=\"6\">Here, this is the original <code>greet<\/code> from <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Its result is then changed to upper case.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">An object with a role mixed in counts as doing that role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> leaves the original object as it was and gives you a new one.<\/span> <span class=\"sg\" data-s=\"1\">If you want to change an existing object itself, use the <code>does<\/code> operator instead:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">When you mix roles into single objects, you decide which extra behaviour each object gets.<\/span> <span class=\"sg\" data-s=\"1\">You do not have to define a separate class for every combination.<\/span><\/p>"]]},"de":{"t":"Einem Objekt eine Rolle hinzufügen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Rolle muss nicht in eine Klasse eingebaut sein.<\/span> <span class=\"sg\" data-s=\"1\">Sie können eine Rolle auch einem Objekt geben, das schon existiert, und zwar mit dem Operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Er mischt die Rolle zur Laufzeit in ein einzelnes Objekt.<\/span> <span class=\"sg\" data-s=\"3\">Dann gibt er ein neues Objekt zurück, das die Rolle hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Nur <code>$loud<\/code> hat die Rolle bekommen.<\/span> <span class=\"sg\" data-s=\"1\">Die Klasse <code>Greeter<\/code> und alle anderen <code>Greeter<\/code>-Objekte bleiben gleich.<\/span> <span class=\"sg\" data-s=\"2\">Also grüßt <code>$quiet<\/code> weiter auf die normale Weise.<\/span> <span class=\"sg\" data-s=\"3\">Manchmal definieren die Rolle und die Klasse beide eine Methode mit demselben Namen.<\/span> <span class=\"sg\" data-s=\"4\">In diesem Fall gewinnt die Version der Rolle.<\/span> <span class=\"sg\" data-s=\"5\">Und <code>callsame<\/code> ruft die Methode auf, die sie überschrieben hat.<\/span> <span class=\"sg\" data-s=\"6\">Das ist hier das ursprüngliche <code>greet<\/code> aus <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Sein Ergebnis wird dann in Großbuchstaben umgewandelt.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ein Objekt mit einer eingemischten Rolle gilt als Träger dieser Rolle:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> lässt das ursprüngliche Objekt, wie es war, und gibt Ihnen ein neues.<\/span> <span class=\"sg\" data-s=\"1\">Wenn Sie ein vorhandenes Objekt selbst ändern wollen, nehmen Sie stattdessen den Operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Wenn Sie Rollen in einzelne Objekte einmischen, entscheiden Sie, welches zusätzliche Verhalten jedes Objekt bekommt.<\/span> <span class=\"sg\" data-s=\"1\">Sie müssen nicht für jede Kombination eine eigene Klasse definieren.<\/span><\/p>"]]},"nl":{"t":"Een rol aan een object toevoegen","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Een rol hoeft niet in een klasse ingebouwd te zijn.<\/span> <span class=\"sg\" data-s=\"1\">Je kunt er ook een geven aan een object dat al bestaat, met de operator <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Die mengt de rol tijdens het draaien in één enkel object.<\/span> <span class=\"sg\" data-s=\"3\">Dan geeft hij een nieuw object terug dat de rol heeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Alleen <code>$loud<\/code> kreeg de rol.<\/span> <span class=\"sg\" data-s=\"1\">De klasse <code>Greeter<\/code> en alle andere <code>Greeter<\/code>-objecten blijven hetzelfde.<\/span> <span class=\"sg\" data-s=\"2\">Dus groet <code>$quiet<\/code> nog steeds op de gewone manier.<\/span> <span class=\"sg\" data-s=\"3\">Soms definiëren de rol en de klasse allebei een methode met dezelfde naam.<\/span> <span class=\"sg\" data-s=\"4\">In dat geval wint de versie van de rol.<\/span> <span class=\"sg\" data-s=\"5\">En <code>callsame<\/code> roept de methode aan die ze overschreef.<\/span> <span class=\"sg\" data-s=\"6\">Hier is dat de oorspronkelijke <code>greet<\/code> uit <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Haar resultaat wordt dan in hoofdletters gezet.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Een object waarin een rol gemengd is, telt als een object dat die rol doet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> laat het oorspronkelijke object zoals het was en geeft je een nieuw object.<\/span> <span class=\"sg\" data-s=\"1\">Als je een bestaand object zelf wilt veranderen, gebruik dan de operator <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Als je rollen in losse objecten mengt, beslis je welk extra gedrag elk object krijgt.<\/span> <span class=\"sg\" data-s=\"1\">Je hoeft niet voor elke combinatie een aparte klasse te definiëren.<\/span><\/p>"]]},"es":{"t":"Añadir un rol a un objeto","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un rol no tiene por qué estar incorporado en una clase.<\/span> <span class=\"sg\" data-s=\"1\">También puedes dárselo a un objeto que ya existe, con el operador <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mezcla el rol en un único objeto en tiempo de ejecución.<\/span> <span class=\"sg\" data-s=\"3\">Después devuelve un objeto nuevo que tiene el rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> ha recibido el rol.<\/span> <span class=\"sg\" data-s=\"1\">La clase <code>Greeter<\/code> y todos los demás objetos <code>Greeter<\/code> siguen igual.<\/span> <span class=\"sg\" data-s=\"2\">Así que <code>$quiet<\/code> sigue saludando de la forma normal.<\/span> <span class=\"sg\" data-s=\"3\">A veces el rol y la clase definen los dos un método con el mismo nombre.<\/span> <span class=\"sg\" data-s=\"4\">En ese caso, gana la versión del rol.<\/span> <span class=\"sg\" data-s=\"5\">Y <code>callsame<\/code> llama al método que ha sobrescrito.<\/span> <span class=\"sg\" data-s=\"6\">Aquí, es el <code>greet<\/code> original de <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Después su resultado se pasa a mayúsculas.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un objeto con un rol mezclado cuenta como un objeto que asume ese rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> deja el objeto original como estaba y te da uno nuevo.<\/span> <span class=\"sg\" data-s=\"1\">Si quieres cambiar el propio objeto que ya existe, usa en su lugar el operador <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cuando mezclas roles en objetos concretos, decides qué comportamiento extra recibe cada objeto.<\/span> <span class=\"sg\" data-s=\"1\">No tienes que definir una clase aparte para cada combinación.<\/span><\/p>"]]},"it":{"t":"Aggiungere un ruolo a un oggetto","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Un ruolo non deve per forza essere incorporato in una classe.<\/span> <span class=\"sg\" data-s=\"1\">Puoi darlo anche a un oggetto che esiste già, con l'operatore <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Mescola il ruolo in un singolo oggetto a runtime.<\/span> <span class=\"sg\" data-s=\"3\">Poi restituisce un nuovo oggetto che ha il ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solo <code>$loud<\/code> ha ricevuto il ruolo.<\/span> <span class=\"sg\" data-s=\"1\">La classe <code>Greeter<\/code> e tutti gli altri oggetti <code>Greeter<\/code> restano come prima.<\/span> <span class=\"sg\" data-s=\"2\">Quindi <code>$quiet<\/code> saluta ancora nel modo normale.<\/span> <span class=\"sg\" data-s=\"3\">A volte il ruolo e la classe definiscono entrambi un metodo con lo stesso nome.<\/span> <span class=\"sg\" data-s=\"4\">In questo caso vince la versione del ruolo.<\/span> <span class=\"sg\" data-s=\"5\">E <code>callsame<\/code> chiama il metodo che il ruolo ha sovrascritto.<\/span> <span class=\"sg\" data-s=\"6\">Qui è il <code>greet<\/code> originale di <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Il suo risultato viene poi reso maiuscolo.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Un oggetto in cui è mescolato un ruolo conta come un oggetto con quel ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> lascia l'oggetto originale com'era e te ne dà uno nuovo.<\/span> <span class=\"sg\" data-s=\"1\">Se vuoi cambiare proprio un oggetto esistente, usa invece l'operatore <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Quando mescoli ruoli in singoli oggetti, decidi quale comportamento in più riceve ogni oggetto.<\/span> <span class=\"sg\" data-s=\"1\">Non devi definire una classe separata per ogni combinazione.<\/span><\/p>"]]},"lv":{"t":"Lomas pievienošana objektam","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Lomai nav obligāti jābūt iebūvētai klasē.<\/span> <span class=\"sg\" data-s=\"1\">Jūs varat to dot arī objektam, kas jau eksistē, ar operatoru <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas izpildes laikā iemaisa lomu vienā objektā.<\/span> <span class=\"sg\" data-s=\"3\">Tad tas atgriež jaunu objektu, kam ir šī loma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Lomu saņēma tikai <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Klase <code>Greeter<\/code> un visi pārējie <code>Greeter<\/code> objekti paliek tādi paši.<\/span> <span class=\"sg\" data-s=\"2\">Tāpēc <code>$quiet<\/code> joprojām sveicina parastajā veidā.<\/span> <span class=\"sg\" data-s=\"3\">Dažreiz gan loma, gan klase definē metodi ar vienādu nosaukumu.<\/span> <span class=\"sg\" data-s=\"4\">Tādā gadījumā uzvar lomas versija.<\/span> <span class=\"sg\" data-s=\"5\">Un <code>callsame<\/code> izsauc metodi, ko tā pārrakstīja.<\/span> <span class=\"sg\" data-s=\"6\">Šeit tā ir sākotnējā <code>greet<\/code> no <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Tās rezultāts tad tiek pārvērsts lielajos burtos.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objekts ar iemaisītu lomu skaitās tāds, kas šo lomu dara:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> atstāj sākotnējo objektu tādu, kāds tas bija, un dod jums jaunu.<\/span> <span class=\"sg\" data-s=\"1\">Ja jūs gribat mainīt pašu esošo objektu, tā vietā lietojiet operatoru <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kad jūs iemaisāt lomas atsevišķos objektos, jūs izlemjat, kādu papildu uzvedību saņem katrs objekts.<\/span> <span class=\"sg\" data-s=\"1\">Jums nav jādefinē atsevišķa klase katrai kombinācijai.<\/span><\/p>"]]},"ru":{"t":"Добавление роли объекту","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Роль не обязательно должна быть встроена в класс.<\/span> <span class=\"sg\" data-s=\"1\">Её можно дать и уже существующему объекту с помощью оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Он подмешивает роль в один-единственный объект во время работы программы.<\/span> <span class=\"sg\" data-s=\"3\">Потом он возвращает новый объект, у которого есть эта роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Роль получил только <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Класс <code>Greeter<\/code> и все остальные объекты <code>Greeter<\/code> остаются прежними.<\/span> <span class=\"sg\" data-s=\"2\">Поэтому <code>$quiet<\/code> по-прежнему здоровается обычным образом.<\/span> <span class=\"sg\" data-s=\"3\">Иногда и роль, и класс определяют метод с одним и тем же именем.<\/span> <span class=\"sg\" data-s=\"4\">В этом случае побеждает версия из роли.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> вызывает тот метод, который она переопределила.<\/span> <span class=\"sg\" data-s=\"6\">Здесь это исходный <code>greet<\/code> из <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Затем его результат переводится в верхний регистр.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если в объект подмешана роль, считается, что он её выполняет:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> оставляет исходный объект как был и даёт вам новый.<\/span> <span class=\"sg\" data-s=\"1\">Если вы хотите изменить сам существующий объект, используйте вместо этого оператор <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когда вы подмешиваете роли в отдельные объекты, вы решаете, какое дополнительное поведение получит каждый объект.<\/span> <span class=\"sg\" data-s=\"1\">Вам не нужно определять отдельный класс для каждого сочетания.<\/span><\/p>"]]},"uk":{"t":"Додавання ролі до об'єкта","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Роль не обов'язково вбудовувати в клас.<\/span> <span class=\"sg\" data-s=\"1\">Її можна надати й об'єкту, який уже існує, за допомогою оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Він підмішує роль в один об'єкт під час виконання.<\/span> <span class=\"sg\" data-s=\"3\">Потім він повертає новий об'єкт, який має цю роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Роль отримав лише <code>$loud<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Клас <code>Greeter<\/code> і всі інші об'єкти <code>Greeter<\/code> лишаються такими самими.<\/span> <span class=\"sg\" data-s=\"2\">Тож <code>$quiet<\/code> і далі вітається у звичайний спосіб.<\/span> <span class=\"sg\" data-s=\"3\">Іноді і роль, і клас визначають метод з однаковим іменем.<\/span> <span class=\"sg\" data-s=\"4\">У такому разі перемагає версія ролі.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> викликає метод, який вона перевизначила.<\/span> <span class=\"sg\" data-s=\"6\">Тут це початковий <code>greet<\/code> із <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Його результат потім переводять у верхній регістр.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Вважається, що об'єкт із підмішаною роллю виконує цю роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> лишає початковий об'єкт таким, яким він був, і дає вам новий.<\/span> <span class=\"sg\" data-s=\"1\">Якщо ви хочете змінити сам наявний об'єкт, використайте натомість оператор <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Коли ви підмішуєте ролі в окремі об'єкти, ви вирішуєте, яку додаткову поведінку отримує кожен об'єкт.<\/span> <span class=\"sg\" data-s=\"1\">Вам не треба визначати окремий клас для кожного поєднання.<\/span><\/p>"]]},"bg":{"t":"Добавяне на роля към обект","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Ролята не е задължително да е вградена в клас.<\/span> <span class=\"sg\" data-s=\"1\">Можете да я дадете и на обект, който вече съществува, с оператора <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Той вмесва ролята в един-единствен обект по време на изпълнение.<\/span> <span class=\"sg\" data-s=\"3\">После връща нов обект, който има ролята:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Само <code>$loud<\/code> получи ролята.<\/span> <span class=\"sg\" data-s=\"1\">Класът <code>Greeter<\/code> и всички други обекти <code>Greeter<\/code> остават същите.<\/span> <span class=\"sg\" data-s=\"2\">Затова <code>$quiet<\/code> все още поздравява по обичайния начин.<\/span> <span class=\"sg\" data-s=\"3\">Понякога и ролята, и класът дефинират метод с едно и също име.<\/span> <span class=\"sg\" data-s=\"4\">В такъв случай версията на ролята надделява.<\/span> <span class=\"sg\" data-s=\"5\">А <code>callsame<\/code> извиква метода, който тя е предефинирала.<\/span> <span class=\"sg\" data-s=\"6\">Тук това е първоначалният <code>greet<\/code> от <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">След това резултатът му се превръща в главни букви.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">За обект с вмесена роля се смята, че изпълнява тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> оставя първоначалния обект какъвто си е бил и ви дава нов.<\/span> <span class=\"sg\" data-s=\"1\">Ако искате да промените самия съществуващ обект, използвайте вместо това оператора <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Когато вмесвате роли в отделни обекти, вие решавате какво допълнително поведение получава всеки обект.<\/span> <span class=\"sg\" data-s=\"1\">Не е нужно да дефинирате отделен клас за всяка комбинация.<\/span><\/p>"]]},"eo":{"t":"Aldoni rolon al objekto","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Rolo ne devas esti enkonstruita en klason.<\/span> <span class=\"sg\" data-s=\"1\">Vi ankaŭ povas doni ĝin al objekto, kiu jam ekzistas, per la operatoro <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi enmiksas la rolon en unu solan objekton je rultempo.<\/span> <span class=\"sg\" data-s=\"3\">Poste ĝi redonas novan objekton, kiu havas la rolon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Nur <code>$loud<\/code> ricevis la rolon.<\/span> <span class=\"sg\" data-s=\"1\">La klaso <code>Greeter<\/code> kaj ĉiuj aliaj objektoj <code>Greeter<\/code> restas la samaj.<\/span> <span class=\"sg\" data-s=\"2\">Do <code>$quiet<\/code> ankoraŭ salutas laŭ la normala maniero.<\/span> <span class=\"sg\" data-s=\"3\">Foje la rolo kaj la klaso ambaŭ difinas metodon kun la sama nomo.<\/span> <span class=\"sg\" data-s=\"4\">En tiu kazo, la versio de la rolo venkas.<\/span> <span class=\"sg\" data-s=\"5\">Kaj <code>callsame<\/code> vokas la metodon, kiun ĝi superregis.<\/span> <span class=\"sg\" data-s=\"6\">Ĉi tie, tio estas la originala <code>greet<\/code> el <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Ĝia rezulto poste estas ŝanĝita al majuskloj.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Objekto kun enmiksita rolo validas kiel faranta tiun rolon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> lasas la originalan objekton tia, kia ĝi estis, kaj donas al vi novan.<\/span> <span class=\"sg\" data-s=\"1\">Se vi volas ŝanĝi ekzistantan objekton mem, uzu anstataŭe la operatoron <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Kiam vi enmiksas rolojn en unuopajn objektojn, vi decidas, kian kroman konduton ricevas ĉiu objekto.<\/span> <span class=\"sg\" data-s=\"1\">Vi ne devas difini apartan klason por ĉiu kombinaĵo.<\/span><\/p>"]]},"la":{"t":"Partem obiecto addere","b":[["p",4,"<p><span class=\"sg\" data-s=\"0\">Non necesse est partem in classem aedificari.<\/span> <span class=\"sg\" data-s=\"1\">Unam etiam obiecto dare potes quod iam exsistit, operatore <code>but<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Partem in unum obiectum tempore exsecutionis miscet.<\/span> <span class=\"sg\" data-s=\"3\">Deinde novum obiectum reddit quod partem habet:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Loud {\n    method greet {\n        callsame().uc;\n    }\n}\n\nclass Greeter {\n    method greet {\n        'Hello';\n    }\n}\n\nmy $quiet = Greeter.new;\nmy $loud  = Greeter.new but Loud;\n\nsay $quiet.greet; # Hello\nsay $loud.greet;  # HELLO<\/code><\/pre>"],["p",8,"<p><span class=\"sg\" data-s=\"0\">Solum <code>$loud<\/code> partem accepit.<\/span> <span class=\"sg\" data-s=\"1\">Classis <code>Greeter<\/code> et omnia alia obiecta <code>Greeter<\/code> eadem manent.<\/span> <span class=\"sg\" data-s=\"2\">Itaque <code>$quiet<\/code> adhuc modo solito salutat.<\/span> <span class=\"sg\" data-s=\"3\">Interdum pars et classis ambae methodum eiusdem nominis definiunt.<\/span> <span class=\"sg\" data-s=\"4\">Tum versio partis vincit.<\/span> <span class=\"sg\" data-s=\"5\">Et <code>callsame<\/code> methodum vocat quam superscripsit.<\/span> <span class=\"sg\" data-s=\"6\">Hic haec est originalis <code>greet<\/code> ex <code>Greeter<\/code>.<\/span> <span class=\"sg\" data-s=\"7\">Effectus eius deinde in litteras maiusculas mutatur.<\/span><\/p>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Obiectum cum parte immixta illam partem facere censetur:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say $quiet ~~ Loud; # False\nsay $loud  ~~ Loud; # True<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\"><code>but<\/code> obiectum originale relinquit ut erat et novum tibi dat.<\/span> <span class=\"sg\" data-s=\"1\">Si ipsum obiectum exsistens mutare vis, operatore <code>does<\/code> loco eius utere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>my $speaker = Greeter.new;\n$speaker does Loud;\nsay $speaker.greet; # HELLO<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Cum partes in singula obiecta misces, decernis quam agendi rationem additam quodque obiectum accipiat.<\/span> <span class=\"sg\" data-s=\"1\">Non necesse est classem separatam pro omni coniunctione definire.<\/span><\/p>"]]}}}</script>
