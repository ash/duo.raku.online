<script type="application/json" id="page-data">{"u":"oop/roles","n":828,"k":"section","pv":"oop/inheritance/exercises/inherited-attribute/solution","nx":"oop/roles/multiple-roles","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Roles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">A <em>role<\/em> is a piece of behaviour, and sometimes data, that several classes can share.<\/span> <span class=\"sg\" data-s=\"1\">Inheritance says that a class <em>is a<\/em> kind of another class.<\/span> <span class=\"sg\" data-s=\"2\">A role, on the other hand, describes something that a class <em>can do<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">You define a role with the <code>role<\/code> keyword, in the same way as a class.<\/span> <span class=\"sg\" data-s=\"1\">To give it to a class, you use the <code>does<\/code> trait:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">The <code>Person<\/code> class now has the <code>hello<\/code> method from the role.<\/span> <span class=\"sg\" data-s=\"1\">It works as if you wrote it in the class itself:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">If a class does a role, Raku can see that it has this role:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Note that the role’s <code>hello<\/code> method uses <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">But the role itself has no <code>name<\/code> attribute.<\/span> <span class=\"sg\" data-s=\"2\">That is fine.<\/span> <span class=\"sg\" data-s=\"3\">The method runs as part of whatever class composes the role.<\/span> <span class=\"sg\" data-s=\"4\">And that class provides <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">The next topic shows that a class can have several roles at a time.<\/span><\/p>"]]},"de":{"t":"Rollen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Eine <em>Rolle<\/em> ist ein Stück Verhalten, manchmal auch mit Daten, das mehrere Klassen teilen können.<\/span> <span class=\"sg\" data-s=\"1\">Vererbung sagt, dass eine Klasse eine Art einer anderen Klasse <em>ist<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Eine Rolle dagegen beschreibt etwas, das eine Klasse <em>kann<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie definieren eine Rolle mit dem Schlüsselwort <code>role<\/code>, genauso wie eine Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Um sie einer Klasse zu geben, benutzen Sie den Trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Die Klasse <code>Person<\/code> hat jetzt die Methode <code>hello<\/code> aus der Rolle.<\/span> <span class=\"sg\" data-s=\"1\">Sie funktioniert so, als hätten Sie sie in die Klasse selbst geschrieben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Wenn eine Klasse eine Rolle erfüllt, kann Raku sehen, dass sie diese Rolle hat:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Beachten Sie, dass die Methode <code>hello<\/code> der Rolle <code>self.name<\/code> benutzt.<\/span> <span class=\"sg\" data-s=\"1\">Aber die Rolle selbst hat kein Attribut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Das ist in Ordnung.<\/span> <span class=\"sg\" data-s=\"3\">Die Methode läuft immer als Teil der Klasse, die die Rolle einbindet.<\/span> <span class=\"sg\" data-s=\"4\">Und diese Klasse liefert <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Das nächste Thema zeigt, dass eine Klasse mehrere Rollen zugleich haben kann.<\/span><\/p>"]]},"nl":{"t":"Rollen","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Een <em>rol<\/em> is een stuk gedrag, en soms gegevens, dat meerdere klassen kunnen delen.<\/span> <span class=\"sg\" data-s=\"1\">Overerving zegt dat een klasse een soort van een andere klasse <em>is<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Een rol beschrijft daarentegen iets wat een klasse <em>kan doen<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Je definieert een rol met het sleutelwoord <code>role<\/code>, op dezelfde manier als een klasse.<\/span> <span class=\"sg\" data-s=\"1\">Om hem aan een klasse te geven, gebruik je de trait <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">De klasse <code>Person<\/code> heeft nu de methode <code>hello<\/code> uit de rol.<\/span> <span class=\"sg\" data-s=\"1\">Ze werkt alsof je haar in de klasse zelf schreef:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Als een klasse een rol doet, kan Raku zien dat ze deze rol heeft:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Merk op dat de methode <code>hello<\/code> van de rol <code>self.name<\/code> gebruikt.<\/span> <span class=\"sg\" data-s=\"1\">Maar de rol zelf heeft geen attribuut <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Dat is prima.<\/span> <span class=\"sg\" data-s=\"3\">De methode draait als deel van de klasse die de rol samenstelt, welke dat ook is.<\/span> <span class=\"sg\" data-s=\"4\">En die klasse levert <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Het volgende onderwerp laat zien dat een klasse meerdere rollen tegelijk kan hebben.<\/span><\/p>"]]},"es":{"t":"Roles","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>rol<\/em> es una pieza de comportamiento, y a veces de datos, que varias clases pueden compartir.<\/span> <span class=\"sg\" data-s=\"1\">La herencia dice que una clase <em>es<\/em> una clase de otra clase.<\/span> <span class=\"sg\" data-s=\"2\">En cambio, un rol describe algo que una clase <em>sabe hacer<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Defines un rol con la palabra clave <code>role<\/code>, de la misma forma que una clase.<\/span> <span class=\"sg\" data-s=\"1\">Para dárselo a una clase, usas el rasgo <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La clase <code>Person<\/code> tiene ahora el método <code>hello<\/code> del rol.<\/span> <span class=\"sg\" data-s=\"1\">Funciona como si estuviera escrito en la propia clase:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si una clase asume un rol, Raku puede ver que tiene ese rol:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Fíjate en que el método <code>hello<\/code> del rol usa <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Pero el rol mismo no tiene ningún atributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">No pasa nada.<\/span> <span class=\"sg\" data-s=\"3\">El método se ejecuta como parte de la clase que compone el rol, sea cual sea.<\/span> <span class=\"sg\" data-s=\"4\">Y esa clase aporta <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">El tema siguiente muestra que una clase puede tener varios roles a la vez.<\/span><\/p>"]]},"it":{"t":"Ruoli","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\">Un <em>ruolo<\/em> è un pezzo di comportamento, e a volte di dati, che più classi possono condividere.<\/span> <span class=\"sg\" data-s=\"1\">L'ereditarietà dice che una classe <em>è<\/em> un tipo di un'altra classe.<\/span> <span class=\"sg\" data-s=\"2\">Un ruolo, invece, descrive qualcosa che una classe <em>sa fare<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Definisci un ruolo con la parola chiave <code>role<\/code>, nello stesso modo di una classe.<\/span> <span class=\"sg\" data-s=\"1\">Per darlo a una classe, usi il tratto <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora la classe <code>Person<\/code> ha il metodo <code>hello<\/code> del ruolo.<\/span> <span class=\"sg\" data-s=\"1\">Funziona come se lo avessi scritto nella classe stessa:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se una classe assume un ruolo, Raku vede che ha questo ruolo:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Nota che il metodo <code>hello<\/code> del ruolo usa <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Ma il ruolo stesso non ha un attributo <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Va bene così.<\/span> <span class=\"sg\" data-s=\"3\">Il metodo gira come parte della classe che compone il ruolo, qualunque sia.<\/span> <span class=\"sg\" data-s=\"4\">E quella classe fornisce <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Il prossimo argomento mostra che una classe può avere più ruoli alla volta.<\/span><\/p>"]]},"lv":{"t":"Lomas","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Loma<\/em> ir uzvedības gabals (dažreiz arī ar datiem), ko var kopīgi lietot vairākas klases.<\/span> <span class=\"sg\" data-s=\"1\">Mantošana saka, ka klase <em>ir<\/em> citas klases paveids.<\/span> <span class=\"sg\" data-s=\"2\">Turpretī loma apraksta kaut ko, ko klase <em>prot darīt<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Lomu jūs definējat ar atslēgvārdu <code>role<\/code>, tāpat kā klasi.<\/span> <span class=\"sg\" data-s=\"1\">Lai to dotu klasei, jūs lietojat iezīmi <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Klasei <code>Person<\/code> tagad ir metode <code>hello<\/code> no lomas.<\/span> <span class=\"sg\" data-s=\"1\">Tā strādā tā, it kā jūs būtu to uzrakstījuši pašā klasē:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ja klase dara lomu, Raku var redzēt, ka tai ir šī loma:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Ievērojiet, ka lomas metode <code>hello<\/code> lieto <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Bet pašai lomai nav atribūta <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tas ir labi.<\/span> <span class=\"sg\" data-s=\"3\">Metode izpildās kā daļa no tās klases, kas komponē lomu.<\/span> <span class=\"sg\" data-s=\"4\">Un šī klase nodrošina <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Nākamais temats parāda, ka klasei var būt vairākas lomas reizē.<\/span><\/p>"]]},"ru":{"t":"Роли","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — это часть поведения, а иногда и данных, которую могут разделять несколько классов.<\/span> <span class=\"sg\" data-s=\"1\">Наследование говорит, что класс <em>является<\/em> разновидностью другого класса.<\/span> <span class=\"sg\" data-s=\"2\">А роль описывает то, что класс <em>умеет делать<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Вы определяете роль ключевым словом <code>role<\/code>, так же как класс.<\/span> <span class=\"sg\" data-s=\"1\">Чтобы передать её классу, используйте трейт <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь у класса <code>Person<\/code> есть метод <code>hello<\/code> из роли.<\/span> <span class=\"sg\" data-s=\"1\">Он работает так, как если бы вы написали его в самом классе:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Если класс выполняет роль, Raku видит, что у него есть эта роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Обратите внимание, что метод роли <code>hello<\/code> использует <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но у самой роли нет атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Это нормально.<\/span> <span class=\"sg\" data-s=\"3\">Метод выполняется как часть того класса, который включает эту роль.<\/span> <span class=\"sg\" data-s=\"4\">А <code>name<\/code> даёт уже этот класс.<\/span> <span class=\"sg\" data-s=\"5\">Следующая тема показывает, что у класса может быть сразу несколько ролей.<\/span><\/p>"]]},"uk":{"t":"Ролі","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Роль<\/em> — це частина поведінки, а іноді й даних, яку можуть спільно використовувати кілька класів.<\/span> <span class=\"sg\" data-s=\"1\">Успадкування каже, що клас <em>є<\/em> різновидом іншого класу.<\/span> <span class=\"sg\" data-s=\"2\">А роль, навпаки, описує те, що клас <em>уміє робити<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Роль визначають ключовим словом <code>role<\/code>, так само як клас.<\/span> <span class=\"sg\" data-s=\"1\">Щоб надати її класу, використовують трейт <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Клас <code>Person<\/code> тепер має метод <code>hello<\/code> з ролі.<\/span> <span class=\"sg\" data-s=\"1\">Він працює так, наче ви написали його в самому класі:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Якщо клас виконує роль, Raku бачить, що він має цю роль:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Зверніть увагу, що метод <code>hello<\/code> ролі використовує <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Але сама роль не має атрибута <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Це нормально.<\/span> <span class=\"sg\" data-s=\"3\">Метод виконується як частина того класу, який компонує роль.<\/span> <span class=\"sg\" data-s=\"4\">А цей клас надає <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Наступна тема показує, що клас може мати кілька ролей одночасно.<\/span><\/p>"]]},"bg":{"t":"Роли","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Ролята<\/em> е парче поведение, а понякога и данни, което няколко класа могат да споделят.<\/span> <span class=\"sg\" data-s=\"1\">Наследяването казва, че един клас <em>е<\/em> вид друг клас.<\/span> <span class=\"sg\" data-s=\"2\">Ролята, от друга страна, описва нещо, което класът <em>може да прави<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Дефинирате роля с ключовата дума <code>role<\/code>, по същия начин като клас.<\/span> <span class=\"sg\" data-s=\"1\">За да я дадете на клас, използвате трейта <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Класът <code>Person<\/code> вече има метода <code>hello<\/code> от ролята.<\/span> <span class=\"sg\" data-s=\"1\">Той работи така, все едно сте го написали в самия клас:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Ако класът изпълнява роля, Raku вижда, че той има тази роля:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Забележете, че методът <code>hello<\/code> на ролята използва <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Но самата роля няма атрибут <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Това е наред.<\/span> <span class=\"sg\" data-s=\"3\">Методът се изпълнява като част от онзи клас, който компонира ролята.<\/span> <span class=\"sg\" data-s=\"4\">А този клас предоставя <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">Следващата тема показва, че класът може да има няколко роли наведнъж.<\/span><\/p>"]]},"eo":{"t":"Roloj","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Rolo<\/em> estas peco de konduto, kaj foje de datumoj, kiun pluraj klasoj povas kunhavi.<\/span> <span class=\"sg\" data-s=\"1\">Heredo diras, ke klaso <em>estas<\/em> speco de alia klaso.<\/span> <span class=\"sg\" data-s=\"2\">Rolo, aliflanke, priskribas ion, kion klaso <em>povas fari<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi difinas rolon per la ŝlosilvorto <code>role<\/code>, same kiel klason.<\/span> <span class=\"sg\" data-s=\"1\">Por doni ĝin al klaso, vi uzas la trajton <code>does<\/code>:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">La klaso <code>Person<\/code> nun havas la metodon <code>hello<\/code> el la rolo.<\/span> <span class=\"sg\" data-s=\"1\">Ĝi funkcias, kvazaŭ vi skribus ĝin en la klaso mem:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Se klaso faras rolon, Raku povas vidi, ke ĝi havas ĉi tiun rolon:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Rimarku, ke la metodo <code>hello<\/code> de la rolo uzas <code>self.name<\/code>.<\/span> <span class=\"sg\" data-s=\"1\">Sed la rolo mem ne havas atributon <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"2\">Tio estas en ordo.<\/span> <span class=\"sg\" data-s=\"3\">La metodo ruliĝas kiel parto de iu ajn klaso, kiu kunmetas la rolon.<\/span> <span class=\"sg\" data-s=\"4\">Kaj tiu klaso provizas <code>name<\/code>.<\/span> <span class=\"sg\" data-s=\"5\">La sekva temo montras, ke klaso povas havi plurajn rolojn samtempe.<\/span><\/p>"]]},"la":{"t":"Partes","b":[["p",3,"<p><span class=\"sg\" data-s=\"0\"><em>Pars<\/em> (<em>role<\/em>) est portio agendi rationis, et interdum datorum, quam plures classes communicare possunt.<\/span> <span class=\"sg\" data-s=\"1\">Hereditas dicit classem genus quoddam alterius classis <em>esse<\/em>.<\/span> <span class=\"sg\" data-s=\"2\">Pars autem describit aliquid quod classis <em>facere potest<\/em>.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Partem verbo <code>role<\/code> definis, eodem modo ac classem.<\/span> <span class=\"sg\" data-s=\"1\">Ut eam classi des, proprietate <code>does<\/code> uteris:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>role Greet {\n    method hello {\n        'Hello from ' ~ self.name;\n    }\n}\n\nclass Person does Greet {\n    has $.name;\n}<\/code><\/pre>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Classis <code>Person<\/code> nunc methodum <code>hello<\/code> ex parte habet.<\/span> <span class=\"sg\" data-s=\"1\">Operatur ac si eam in ipsa classe scripsisses:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna').hello; # Hello from Anna<\/code><\/pre>"],["p",1,"<p><span class=\"sg\" data-s=\"0\">Si classis partem facit, Raku videre potest eam hanc partem habere:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>say Person.new(name =&gt; 'Anna') ~~ Greet; # True<\/code><\/pre>"],["p",6,"<p><span class=\"sg\" data-s=\"0\">Nota methodum <code>hello<\/code> partis <code>self.name<\/code> adhibere.<\/span> <span class=\"sg\" data-s=\"1\">Sed ipsa pars nullum attributum <code>name<\/code> habet.<\/span> <span class=\"sg\" data-s=\"2\">Hoc bene est.<\/span> <span class=\"sg\" data-s=\"3\">Methodus ut portio cuiuscumque classis currit quae partem componit.<\/span> <span class=\"sg\" data-s=\"4\">Et illa classis <code>name<\/code> praebet.<\/span> <span class=\"sg\" data-s=\"5\">Argumentum sequens ostendit classem plures partes simul habere posse.<\/span><\/p>"]]}}}</script>
