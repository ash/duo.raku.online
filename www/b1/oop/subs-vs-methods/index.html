<script type="application/json" id="page-data">{"u":"oop/subs-vs-methods","n":811,"k":"section","pv":"oop/class-methods/quiz","nx":"oop/subs-vs-methods/exercises","tr":["oop"],"lv":"b1","lvs":["a2","b1"],"pvl":["a2","b1"],"nxl":["a2","b1"],"L":{"en":{"t":"Subroutines vs methods","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">You now have two ways to organise some behaviour: a <em>subroutine<\/em> and a <em>method<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">They look similar, but you use them in different ways.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">A subroutine stands on its own.<\/span> <span class=\"sg\" data-s=\"1\">You call it by its name, and you pass it everything it needs as arguments:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">A method belongs to a class.<\/span> <span class=\"sg\" data-s=\"1\">You call it on an object with a dot.<\/span> <span class=\"sg\" data-s=\"2\">It can use the object’s own data through <code>self<\/code> and the attribute accessors.<\/span> <span class=\"sg\" data-s=\"3\">So you do not need to pass that data in:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Both calculate the same number.<\/span> <span class=\"sg\" data-s=\"1\">The difference is where the data comes from.<\/span> <span class=\"sg\" data-s=\"2\">The subroutine gets the radius as an argument.<\/span> <span class=\"sg\" data-s=\"3\">The method reads it from the object that it was called on.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Here is a simple rule.<\/span> <span class=\"sg\" data-s=\"1\">Use a subroutine for a separate operation that just turns its arguments into a result.<\/span> <span class=\"sg\" data-s=\"2\">Use a method when the behaviour belongs to an object and uses its data.<\/span> <span class=\"sg\" data-s=\"3\">For general routines that belong to the class as a whole, use class methods.<\/span><\/p>"]]},"de":{"t":"Subroutinen versus Methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Sie haben jetzt zwei Möglichkeiten, Verhalten zu verpacken: eine <em>Subroutine<\/em> und eine <em>Methode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Sie sehen ähnlich aus, aber Sie benutzen sie auf verschiedene Weise.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Eine Subroutine steht für sich.<\/span> <span class=\"sg\" data-s=\"1\">Sie rufen sie über ihren Namen auf und übergeben ihr alles, was sie braucht, als Argumente:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Eine Methode gehört zu einer Klasse.<\/span> <span class=\"sg\" data-s=\"1\">Sie rufen sie mit einem Punkt auf einem Objekt auf.<\/span> <span class=\"sg\" data-s=\"2\">Sie kann über <code>self<\/code> und die Attribut-Accessoren die eigenen Daten des Objekts benutzen.<\/span> <span class=\"sg\" data-s=\"3\">Diese Daten müssen Sie also nicht übergeben:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beide berechnen dieselbe Zahl.<\/span> <span class=\"sg\" data-s=\"1\">Der Unterschied ist, woher die Daten kommen.<\/span> <span class=\"sg\" data-s=\"2\">Die Subroutine bekommt den Radius als Argument.<\/span> <span class=\"sg\" data-s=\"3\">Die Methode liest ihn aus dem Objekt, auf dem sie aufgerufen wurde.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier ist eine einfache Regel.<\/span> <span class=\"sg\" data-s=\"1\">Nehmen Sie eine Subroutine für eine eigene Operation, die nur aus ihren Argumenten ein Ergebnis macht.<\/span> <span class=\"sg\" data-s=\"2\">Nehmen Sie eine Methode, wenn das Verhalten zu einem Objekt gehört und seine Daten benutzt.<\/span> <span class=\"sg\" data-s=\"3\">Für allgemeine Routinen, die zur ganzen Klasse gehören, nehmen Sie Klassenmethoden.<\/span><\/p>"]]},"nl":{"t":"Subroutines versus methoden","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Je hebt nu twee manieren om gedrag te ordenen: een <em>subroutine<\/em> en een <em>methode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ze lijken op elkaar, maar je gebruikt ze op verschillende manieren.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Een subroutine staat op zichzelf.<\/span> <span class=\"sg\" data-s=\"1\">Je roept hem aan bij zijn naam, en je geeft hem alles wat hij nodig heeft als argumenten mee:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Een methode hoort bij een klasse.<\/span> <span class=\"sg\" data-s=\"1\">Je roept haar aan op een object, met een punt.<\/span> <span class=\"sg\" data-s=\"2\">Ze kan de eigen gegevens van het object gebruiken via <code>self<\/code> en de accessors van de attributen.<\/span> <span class=\"sg\" data-s=\"3\">Dus hoef je die gegevens niet mee te geven:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Beide berekenen hetzelfde getal.<\/span> <span class=\"sg\" data-s=\"1\">Het verschil is waar de gegevens vandaan komen.<\/span> <span class=\"sg\" data-s=\"2\">De subroutine krijgt de straal als argument.<\/span> <span class=\"sg\" data-s=\"3\">De methode leest hem uit het object waarop ze is aangeroepen.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Hier is een simpele regel.<\/span> <span class=\"sg\" data-s=\"1\">Gebruik een subroutine voor een losse bewerking die alleen haar argumenten in een resultaat omzet.<\/span> <span class=\"sg\" data-s=\"2\">Gebruik een methode als het gedrag bij een object hoort en zijn gegevens gebruikt.<\/span> <span class=\"sg\" data-s=\"3\">Voor algemene routines die bij de klasse als geheel horen, gebruik je klassemethoden.<\/span><\/p>"]]},"es":{"t":"Subrutinas y métodos","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ya tienes dos formas de organizar un comportamiento: una <em>subrutina<\/em> y un <em>método<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Se parecen, pero los usas de formas distintas.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subrutina es independiente.<\/span> <span class=\"sg\" data-s=\"1\">La llamas por su nombre, y le pasas como argumentos todo lo que necesita:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un método pertenece a una clase.<\/span> <span class=\"sg\" data-s=\"1\">Lo llamas sobre un objeto con un punto.<\/span> <span class=\"sg\" data-s=\"2\">Puede usar los datos del propio objeto a través de <code>self<\/code> y de los accesores de los atributos.<\/span> <span class=\"sg\" data-s=\"3\">Así que no necesitas pasarle esos datos:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Los dos calculan el mismo número.<\/span> <span class=\"sg\" data-s=\"1\">La diferencia está en de dónde vienen los datos.<\/span> <span class=\"sg\" data-s=\"2\">La subrutina recibe el radio como argumento.<\/span> <span class=\"sg\" data-s=\"3\">El método lo lee del objeto sobre el que se ha llamado.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Aquí tienes una regla simple.<\/span> <span class=\"sg\" data-s=\"1\">Usa una subrutina para una operación aparte que solo convierte sus argumentos en un resultado.<\/span> <span class=\"sg\" data-s=\"2\">Usa un método cuando el comportamiento pertenece a un objeto y usa sus datos.<\/span> <span class=\"sg\" data-s=\"3\">Para rutinas generales que pertenecen a la clase entera, usa métodos de clase.<\/span><\/p>"]]},"it":{"t":"Subroutine e metodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Ora hai due modi per organizzare un comportamento: una <em>subroutine<\/em> e un <em>metodo<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Si somigliano, ma li usi in modi diversi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Una subroutine sta da sola.<\/span> <span class=\"sg\" data-s=\"1\">La chiami per nome, e le passi come argomenti tutto ciò che le serve:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Un metodo appartiene a una classe.<\/span> <span class=\"sg\" data-s=\"1\">Lo chiami su un oggetto con il punto.<\/span> <span class=\"sg\" data-s=\"2\">Può usare i dati dell'oggetto stesso attraverso <code>self<\/code> e gli accessori degli attributi.<\/span> <span class=\"sg\" data-s=\"3\">Quindi non devi passargli quei dati:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Entrambi calcolano lo stesso numero.<\/span> <span class=\"sg\" data-s=\"1\">La differenza è da dove arrivano i dati.<\/span> <span class=\"sg\" data-s=\"2\">La subroutine riceve il raggio come argomento.<\/span> <span class=\"sg\" data-s=\"3\">Il metodo lo legge dall'oggetto su cui è stato chiamato.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecco una regola semplice.<\/span> <span class=\"sg\" data-s=\"1\">Usa una subroutine per un'operazione separata che trasforma solo i suoi argomenti in un risultato.<\/span> <span class=\"sg\" data-s=\"2\">Usa un metodo quando il comportamento appartiene a un oggetto e usa i suoi dati.<\/span> <span class=\"sg\" data-s=\"3\">Per le routine generali che appartengono a tutta la classe, usa i metodi di classe.<\/span><\/p>"]]},"lv":{"t":"Apakšprogrammas un metodes","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Tagad jums ir divi veidi, kā sakārtot kādu uzvedību: <em>apakšprogramma<\/em> un <em>metode<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Tās izskatās līdzīgi, bet jūs tās lietojat dažādi.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Apakšprogramma stāv pati par sevi.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izsaucat pēc nosaukuma un padodat tai visu, kas tai vajadzīgs, kā argumentus:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Metode pieder klasei.<\/span> <span class=\"sg\" data-s=\"1\">Jūs to izsaucat uz objekta ar punktu.<\/span> <span class=\"sg\" data-s=\"2\">Tā var izmantot paša objekta datus caur <code>self<\/code> un atribūtu piekļuves metodēm.<\/span> <span class=\"sg\" data-s=\"3\">Tāpēc šie dati jums nav jāpadod:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Abas aprēķina to pašu skaitli.<\/span> <span class=\"sg\" data-s=\"1\">Atšķirība ir tajā, no kurienes nāk dati.<\/span> <span class=\"sg\" data-s=\"2\">Apakšprogramma saņem rādiusu kā argumentu.<\/span> <span class=\"sg\" data-s=\"3\">Metode to nolasa no objekta, uz kura to izsauca.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Šeit ir vienkāršs likums.<\/span> <span class=\"sg\" data-s=\"1\">Lietojiet apakšprogrammu atsevišķai darbībai, kas tikai pārvērš savus argumentus par rezultātu.<\/span> <span class=\"sg\" data-s=\"2\">Lietojiet metodi, kad uzvedība pieder objektam un izmanto tā datus.<\/span> <span class=\"sg\" data-s=\"3\">Vispārīgām rutīnām, kas pieder visai klasei kopumā, lietojiet klases metodes.<\/span><\/p>"]]},"ru":{"t":"Подпрограммы и методы","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Теперь у вас есть два способа оформить какое-то поведение: <em>подпрограмма<\/em> и <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Выглядят они похоже, но используете вы их по-разному.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмма существует сама по себе.<\/span> <span class=\"sg\" data-s=\"1\">Вы вызываете её по имени и передаёте ей всё нужное в виде аргументов:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Метод принадлежит классу.<\/span> <span class=\"sg\" data-s=\"1\">Вы вызываете его у объекта через точку.<\/span> <span class=\"sg\" data-s=\"2\">Он может пользоваться данными самого объекта через <code>self<\/code> и аксессоры атрибутов.<\/span> <span class=\"sg\" data-s=\"3\">Поэтому передавать ему эти данные не нужно:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Оба варианта вычисляют одно и то же число.<\/span> <span class=\"sg\" data-s=\"1\">Разница в том, откуда берутся данные.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмма получает радиус как аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Метод читает его из объекта, у которого его вызвали.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Вот простое правило.<\/span> <span class=\"sg\" data-s=\"1\">Используйте подпрограмму для отдельной операции, которая просто превращает свои аргументы в результат.<\/span> <span class=\"sg\" data-s=\"2\">Используйте метод, когда поведение принадлежит объекту и использует его данные.<\/span> <span class=\"sg\" data-s=\"3\">Для общих действий, которые относятся ко всему классу, используйте методы класса.<\/span><\/p>"]]},"uk":{"t":"Підпрограми проти методів","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Тепер у вас є два способи організувати поведінку: <em>підпрограма<\/em> й <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Вони схожі на вигляд, але ви використовуєте їх по-різному.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Підпрограма стоїть сама по собі.<\/span> <span class=\"sg\" data-s=\"1\">Ви викликаєте її за іменем і передаєте їй усе потрібне як аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Метод належить класу.<\/span> <span class=\"sg\" data-s=\"1\">Ви викликаєте його для об'єкта через крапку.<\/span> <span class=\"sg\" data-s=\"2\">Він може використовувати власні дані об'єкта через <code>self<\/code> та аксесори атрибутів.<\/span> <span class=\"sg\" data-s=\"3\">Тож ці дані не треба передавати:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Обидва обчислюють те саме число.<\/span> <span class=\"sg\" data-s=\"1\">Різниця в тому, звідки беруться дані.<\/span> <span class=\"sg\" data-s=\"2\">Підпрограма отримує радіус як аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Метод читає його з об'єкта, для якого його викликали.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ось просте правило.<\/span> <span class=\"sg\" data-s=\"1\">Використовуйте підпрограму для окремої операції, яка просто перетворює свої аргументи на результат.<\/span> <span class=\"sg\" data-s=\"2\">Використовуйте метод, коли поведінка належить об'єкту й використовує його дані.<\/span> <span class=\"sg\" data-s=\"3\">Для загальних підпрограм, які належать класу загалом, використовуйте методи класу.<\/span><\/p>"]]},"bg":{"t":"Подпрограми срещу методи","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Вече имате два начина да организирате някакво поведение: <em>подпрограма<\/em> и <em>метод<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Изглеждат подобни, но ги използвате по различен начин.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Подпрограмата стои сама за себе си.<\/span> <span class=\"sg\" data-s=\"1\">Извиквате я по име и ѝ подавате всичко необходимо като аргументи:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Методът принадлежи на клас.<\/span> <span class=\"sg\" data-s=\"1\">Извиквате го върху обект с точка.<\/span> <span class=\"sg\" data-s=\"2\">Той може да използва собствените данни на обекта чрез <code>self<\/code> и аксесорите на атрибутите.<\/span> <span class=\"sg\" data-s=\"3\">Затова не е нужно да му подавате тези данни:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">И двете изчисляват едно и също число.<\/span> <span class=\"sg\" data-s=\"1\">Разликата е откъде идват данните.<\/span> <span class=\"sg\" data-s=\"2\">Подпрограмата получава радиуса като аргумент.<\/span> <span class=\"sg\" data-s=\"3\">Методът го чете от обекта, върху който е извикан.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ето едно просто правило.<\/span> <span class=\"sg\" data-s=\"1\">Използвайте подпрограма за отделна операция, която просто превръща аргументите си в резултат.<\/span> <span class=\"sg\" data-s=\"2\">Използвайте метод, когато поведението принадлежи на обект и използва неговите данни.<\/span> <span class=\"sg\" data-s=\"3\">За общи процедури, които принадлежат на класа като цяло, използвайте методи на класа.<\/span><\/p>"]]},"eo":{"t":"Subprogramoj kaj metodoj","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Vi nun havas du manierojn organizi iun konduton: <em>subrutinon<\/em> kaj <em>metodon<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Ili aspektas similaj, sed vi uzas ilin malsame.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subrutino staras memstare.<\/span> <span class=\"sg\" data-s=\"1\">Vi vokas ĝin per ĝia nomo, kaj vi transdonas al ĝi ĉion, kion ĝi bezonas, kiel argumentojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Metodo apartenas al klaso.<\/span> <span class=\"sg\" data-s=\"1\">Vi vokas ĝin sur objekto per punkto.<\/span> <span class=\"sg\" data-s=\"2\">Ĝi povas uzi la proprajn datumojn de la objekto tra <code>self<\/code> kaj la atributaj atingiloj.<\/span> <span class=\"sg\" data-s=\"3\">Do vi ne bezonas transdoni tiujn datumojn:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ambaŭ kalkulas la saman nombron.<\/span> <span class=\"sg\" data-s=\"1\">La diferenco estas, de kie venas la datumoj.<\/span> <span class=\"sg\" data-s=\"2\">La subrutino ricevas la radiuson kiel argumenton.<\/span> <span class=\"sg\" data-s=\"3\">La metodo legas ĝin el la objekto, sur kiu ĝi estis vokita.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Jen simpla regulo.<\/span> <span class=\"sg\" data-s=\"1\">Uzu subrutinon por aparta operacio, kiu nur faras rezulton el siaj argumentoj.<\/span> <span class=\"sg\" data-s=\"2\">Uzu metodon, kiam la konduto apartenas al objekto kaj uzas ĝiajn datumojn.<\/span> <span class=\"sg\" data-s=\"3\">Por ĝeneralaj rutinoj, kiuj apartenas al la klaso kiel tuto, uzu klasmetodojn.<\/span><\/p>"]]},"la":{"t":"Subprogrammata et methodi","b":[["p",2,"<p><span class=\"sg\" data-s=\"0\">Nunc duos modos habes agendi rationem ordinandi: <em>subprogramma<\/em> et <em>methodum<\/em>.<\/span> <span class=\"sg\" data-s=\"1\">Similia videntur, sed eis diversis modis uteris.<\/span><\/p>"],["p",2,"<p><span class=\"sg\" data-s=\"0\">Subprogramma per se stat.<\/span> <span class=\"sg\" data-s=\"1\">Id nomine suo vocas, et omnia quibus eget ei ut argumenta tradis:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>sub area-of($radius) {\n    π * $radius * $radius;\n}\n\nsay area-of(2); # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Methodus ad classem pertinet.<\/span> <span class=\"sg\" data-s=\"1\">Eam in obiecto cum puncto vocas.<\/span> <span class=\"sg\" data-s=\"2\">Propriis obiecti datis per <code>self<\/code> et accessores attributorum uti potest.<\/span> <span class=\"sg\" data-s=\"3\">Itaque illa data tradere non necesse est:<\/span><\/p>"],["code",0,"<pre class=\"lang-raku\"><code>class Circle {\n    has $.radius;\n\n    method area {\n        π * $.radius * $.radius;\n    }\n}\n\nsay Circle.new(radius =&gt; 2).area; # 12.566370614359172<\/code><\/pre>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Utrumque eundem numerum computat.<\/span> <span class=\"sg\" data-s=\"1\">Differentia est unde data veniant.<\/span> <span class=\"sg\" data-s=\"2\">Subprogramma radium ut argumentum accipit.<\/span> <span class=\"sg\" data-s=\"3\">Methodus eum ex obiecto legit in quo vocata est.<\/span><\/p>"],["p",4,"<p><span class=\"sg\" data-s=\"0\">Ecce regula simplex.<\/span> <span class=\"sg\" data-s=\"1\">Utere subprogrammate pro operatione separata quae solum argumenta sua in effectum vertit.<\/span> <span class=\"sg\" data-s=\"2\">Utere methodo cum agendi ratio ad obiectum pertinet et datis eius utitur.<\/span> <span class=\"sg\" data-s=\"3\">Pro proceduris generalibus quae ad totam classem pertinent, utere methodis classis.<\/span><\/p>"]]}}}</script>
